:"ABCD","score":2,"ana":"赵树理受五四新文学影响，关注农村生活和农村工作，并不回避农民的局限，也吸收传统说唱叙事资源；北京口语不是其语言特点，他以山西农村语言为基础。","anaAI":true},{"t":"m","n":25,"stem":"下列关于王蒙《组织部新来的青年人》的表述，正确的有","opts":["王蒙的长篇小说杰作","文学“干预生活”的代表作","揭露了官僚主义问题","表现出理想主义色彩","组织部副部长刘世吾是一个先进形象"],"ans":"BCD","score":2,"ana":"《组织部新来的青年人》是“干预生活”创作的代表，揭示官僚主义并呈现理想主义青年视角；它不是长篇小说，刘世吾也并非先进形象。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"《新青年》","ans":"（1）陈独秀主编，1915年9月创刊，创刊时名为《青年杂志》，后改名《新青年》。陈独秀在创刊号上提出“民主”与“科学”口号，标志着以该刊为主要阵地的新文化运动兴起。（2）编辑及撰稿人除陈独秀外，主要有胡适、李大钊、钱玄同、刘半农、鲁迅、周作人等。","score":4,"ana":"名词解释应说明《新青年》创刊时名《青年杂志》、陈独秀主编及其作为新文化运动阵地的历史作用；可提民主、科学和新文学倡导，勿与后来各社团刊物混淆。","anaAI":true},{"t":"term","n":27,"stem":"“新感觉派”","ans":"（1）以《文学工场》《无轨电车》《现代》等杂志为主要阵地从事小说创作而形成的文学流派，代表作家有施蛰存、穆时英、刘呐鸥。（2）作品主要受西方新心理主义和日本新感觉派影响，擅长用新异的现代形式表现东方大都会生活，注重人物感觉心理，以象征和暗示等手法精细描写，又称“心理分析派”。","score":4,"ana":"新感觉派以施蛰存、穆时英、刘呐鸥等为代表，借现代都市生活和人物感官经验探索新形式；应概括其心理描写、象征暗示与现代都市题材。","anaAI":true},{"t":"term","n":28,"stem":"《升官图》","ans":"（1）陈白尘40年代的戏剧代表作，主要通过表现两个强盗的升官梦，批判官僚政权的黑暗及其对人民的压迫。（2）剧作采用夸张、变形、漫画化手法，以荒诞奇特形式强烈反映社会本质的“真”。","score":4,"ana":"《升官图》是陈白尘的讽刺剧，以强盗做官梦揭露官僚政权的腐败压迫；夸张、漫画化和荒诞手法服务于现实批判。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简述30年代台湾新文学发展的特点。","ans":"（1）受世界性的左翼文学思潮，特别是日本左翼文学和中国大陆左翼文学影响，30年代台湾新文学出现追求文艺大众化的倾向，无产阶级文艺开始兴起。（2）乡土文学观念在台湾流行，成为台湾新文学的重要内容。（3）出现专业文学杂志和文学社团，涌现了一批有影响的作家作品。","score":8,"ana":"30年代台湾新文学受左翼思潮影响，出现大众化、乡土文学倾向，并形成文学社团、刊物和作家群；答题可联系殖民地社会背景，避免把台湾文学简单等同大陆发展。","anaAI":true},{"t":"w","n":30,"stem":"简析沈从文小说的题材特点。","ans":"（1）题材主要有湘西人生和现代都市人生两大类，其中描写军队生活、湘西少数民族生活的作品以其青少年生活经验为基础。（2）作者以乡村叙事者的立场审视、批判都市文明；对于故乡湘西，能以现代知识分子的眼光加以观照，并着力写出它的美。（3）着力书写乡村理想的人性，表现人生形式之“常”。","score":8,"ana":"沈从文小说兼有湘西人生与都市人生两类题材，以乡村视角批判都市文明，同时理想化书写湘西人性；应指出其并非无批判地美化乡村，而有现代意识观照。","anaAI":true},{"t":"w","n":31,"stem":"简析路翎《财主底儿女们》的艺术特色。","ans":"（1）作品主要描写蒋捷三的三个儿子蒋蔚祖、蒋少祖、蒋纯祖的不同人生道路，以史诗笔触展现人的灵魂搏斗，揭示人性的丰富性和复杂性。（2）大胆突破中国传统小说的表现手法，把政治、哲理、抒情等要素融会贯通，加以史诗式表现，为现代小说叙事艺术多样化作出贡献。","score":8,"ana":"《财主底儿女们》以蒋家三兄弟不同道路展示时代冲突中的灵魂搏斗，结构兼具史诗性与心理深度；艺术上融合政治、哲理和抒情因素，拓展现代小说表现方式。","anaAI":true},{"t":"w","n":32,"stem":"简述秦牧散文的思想主题和艺术成就。","ans":"（1）取材广泛，立意高远，注重知识性、趣味性与思想性的结合，善于叙述和描写古今中外风土人情、轶闻趣谈，寄寓独特见解与思想。（2）旁征博引，给读者以思想启迪和审美熏陶。（3）用思想或抒情线索将想象组织起来，纵横联想，散而归一，以漫谈式笔法与读者交流，声情并茂，文笔生动。","score":8,"ana":"秦牧散文题材广博，善于把知识、趣味和思想融为一体，并通过联想组织材料、以漫谈笔法交流；论述应兼顾思想启迪、知识性与生动语言。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合作品，论述《呐喊》《彷徨》的艺术探索。","ans":"（1）开辟中国现代小说的多种创作方法，以清醒的现实主义为主，兼有现实主义与象征主义的成功结合，还有对人物潜意识的描摹，局部带有心理剖析色彩。（2）选材严，开掘深，严格依据表达主题和塑造人物性格需要设置、提炼情节，注重情节的深刻内涵。（3）人物塑造多以一人为模特，也有“杂取种种人，合成一个”，使形象具有典型性。常用“画眼睛”技法勾勒灵魂，以个性化人物语言揭示人物内心世界。（4）“几乎一篇有一篇新形式”，白描、抒情、讽刺、象征等多种手法兼用，显示多样化风格。","score":13,"ana":"《呐喊》《彷徨》以现实主义为主，又结合象征、心理描写等方法；论述应从选材开掘、典型人物塑造、白描及多样形式等方面举篇目说明其小说探索。","anaAI":true},{"t":"w","n":34,"stem":"结合作品，分析舒婷诗歌的思想主题和艺术风格。","ans":"（1）书写了经历“文革”的一代青年从狂热、迷茫到觉醒、奋起与追求的心灵历程，也表现青年人的爱情、友情的美丽与忧伤，对国家命运的关切与忧虑，闪耀着理想主义光彩。（2）抒写个人丰富复杂的内心世界，又不失对社会现实的关怀，具有较深厚的人性和社会内涵。（3）善于从具体事物出发，运用想象、联想和意象的拼接组合，表达多层次的丰富意蕴。","score":13,"ana":"舒婷诗歌书写一代青年的觉醒、爱情友情和对国家命运的关切，具有理想主义与人性关怀；艺术上善用具体意象、联想和象征表达复杂内心，需结合代表诗作展开。","anaAI":true}]}],"qaNotes":[]},{"paper":"xws-2504","subject":"xws","session":"2504","label":"2025年4月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"中国现代文学发端于","score":1,"opts":["\"小说界革命\"","\"五四\"文学革命","白话文运动","\"诗界革命\""],"ans":"B","ana":"中国现代文学以“五四”文学革命为开端。“五四”文学革命的直接背景和动力是“五四”新文化运动。“五四”时期以陈独秀主编的《新青年》为主要阵地,反对旧道德、提倡新道德,兴起了“ 民主”与“科学”的新文化思想启蒙运动。《新育年》大力介绍自由平等学说、个性解放思想、社会进化论,给人们提供思想武器。"},{"t":"s","n":2,"stem":"“五四”初期,周作人提倡新文学用人道主义研究人生诸问题的文章是","score":1,"opts":["《文学革命论》","《文学改良刍议》","《建设的文学革命论》","《人的文学》"],"ans":"D","ana":"周作人在《人的文学》中,提倡新文学用人道主义研究人生诸问题,强调文学要以人道主义为本,关注人的生活和命运。《文学革命论》是陈独秀的作品,主张文学革命;《文学改良刍议》是胡适的文章,倡导文学改良;《建设的文学革命论》同样是胡适的作品,主要论述建设新文学的主张。"},{"t":"s","n":3,"stem":"中国现代文学史上,台湾的第一部新诗集是","score":1,"opts":["赖和的《觉悟下的牺牲》","追风的《诗的模仿》","杨云萍的《橘子开花》","张我军的《乱都之恋》"],"ans":"D","ana":"1925 年12 月,台湾现代文学史上的第一部新诗集张我军的《乱都之恋》在台北出版。"},{"t":"s","n":4,"stem":"作为中国新文学进入第二个十年标志的革命文学倡导,发生在","score":1,"opts":["1927 年","1928 年","1930 年","1932 年"],"ans":"B","ana":"1928 年,创造社、太阳社等倡导革命文学,这成为中国新文学进入第二个十年的标志。1927 年大革命失败,社会环境的变化促使文学界发生转变,1928 年革命文学的倡导掀起了新的文学思潮;1930 年“左联”成立,是革命文学发展的进一步成果。"},{"t":"s","n":5,"stem":"20 世纪30 年代初, 自称“ 自由人”、在左翼文学与国民党民族主义文学之间左右开弓的作家是","score":1,"opts":["梁实秋","苏汶","胡秋原","郁达夫"],"ans":"C","ana":"1931 年底,胡秋原自称“ 自由人”,谈“文学与艺术,至死也是自由的,民主的”,在左翼文学与国民党民族主义文学之间左右开弓。梁实秋主要是与左翼文学进行论争;苏汶是“第三种人”的代表。"},{"t":"s","n":6,"stem":"巴金的《雾》《雨》《电》,史称","score":1,"opts":["《爱情三部曲》","《漂流三部曲》","《激流三部曲》","“农村三部曲”"],"ans":"A","ana":"巴金的《雾》《雨》《电》被称为《爱情三部曲》,主要围绕几个年轻人的爱情和革命生活展开。《漂流三部曲》是郭沫若的作品;《激流三部曲》是巴金的《家》《春》《秋》;“农村三部曲”一般指茅盾的《春蚕》《秋收》《残冬》。"},{"t":"s","n":7,"stem":"沈从文专注于解剖知识分子病态人格的小说是","score":1,"opts":["《边城》","《萧萧》","《八骏图》","《柏子》"],"ans":"C","ana":"《八骏图》中沈从文通过描写八位教授的生活和思想,专注于解剖知识分子的病态人格。《边城》描绘了湘西的风土人情和翠翠的爱情故事;《萧萧》讲述了童养媳萧萧的命运;《柏子》刻画了水手柏子的生活和情感。"},{"t":"s","n":8,"stem":"在曹禺的《雷雨》中,性格畸形、对父亲周朴园的形象形成补充的人物是","score":1,"opts":["周萍","周冲","鲁大海","四风"],"ans":"A","ana":"周萍在《雷雨》中性格畸形,他与继母蘩漪有不伦之恋,又试图摆脱这种关系,其行为和性格反映出封建家庭对人性的扭曲,对父亲周朴园的形象起到了补充作用。周冲是一个单纯、善良的青年;鲁大海是工人代表,具有反抗精神;四风是一个天真、善良的女仆。"},{"t":"s","n":9,"stem":"戴望舒在1928 年8 月发表于《小说月报》的成名作是","score":1,"opts":["《寻梦者》","《对于天的怀乡病》","《我底记忆》","《雨巷》"],"ans":"D","ana":"1928 年8 月,戴望舒在《小说月报》第19 卷第8 期发表《雨巷》,这首诗典型地反映了30 年代知识青年的苦闷、幻灭、彷徨而又对理想充满期盼的复杂心态。《寻梦者》《对于天的怀乡病》《我底记忆》也是戴望舒的作品。"},{"t":"s","n":10,"stem":"以描写农村生活、表现农民苦难命运见长,史称“农民诗人”的是","score":1,"opts":["臧克家","蒲风","田间","艾青"],"ans":"A","ana":"臧克家30 年代诗歌的主要内容是描写农村的生活面貌及农民的苦难命运,他也因此被称为“农民诗人”和“乡土诗人”。蒲风是中国诗歌会”最有代表性的诗人,诗歌能够及时反映重大题材,表现工农大众的生活与斗争,突出对实际革命运动的鼓动作用。田间的诗歌具有强烈的战斗性;艾青的诗作题材广泛,主要以对土地的热爱和对光明的追求为主题。"},{"t":"s","n":11,"stem":"抗战时期提倡“与抗战无关”论,反对文艺公式化的作家是","score":1,"opts":["孔罗荪","张天翼","茅盾","梁实秋"],"ans":"D","ana":"抗战时期,梁实秋提出“与抗战无关”论,认为文学不必局限于抗战题材,反对文艺公式化。"},{"t":"s","n":12,"stem":"下列作品中,不属于抗战时期讽刺小说的是","score":1,"opts":["沙汀的《淘金记》","张天翼的《华威先生》","萧红的《马伯乐》","丘东平的《第七连》"],"ans":"D","ana":"《第七连》是丘东平描写战争的小说,着重展现战争中的士兵生活等,不属于讽刺小说。沙汀的《淘金记》讽刺了抗战时期大后方的黑暗现实;张天翼的《华威先生》讽刺了抗战时期一些只图虚名、不做实事的官僚;萧红的《马伯乐》也具有讽刺意味,刻画了一个在抗战时期只顾自己逃命的人物形象。"},{"t":"s","n":13,"stem":"小说《饥饿的郭素娥》表现了主人公物质和精神双重困境,作者是","score":1,"opts":["路翎","胡风","萧红","钱钟书"],"ans":"A","ana":"《饥饿的郭素娥》的作者是路翎,以矿山生活为背景,通过郭素娥这一形象表现了劳动人民求幸福求解放的生命意志。美丽而强悍的郭素娥,面临着物质上与精神上的双重“饥饿”,渴望美满的家庭生活,敢于傲视社会的冷眼,向宗法家族势力与流氓势力挑战,当她被当做物品转卖时,宁死也不从,喊出了“你们不晓得一个女人底日子,她挨不下去,她痛苦”,最终被用火铲活活烙死。"},{"t":"s","n":14,"stem":"张恨水第一部具有现代意义的通俗小说巨制是","score":1,"opts":["《五子登科》","《金粉世家》","《八十一梦》","《丹凤街》"],"ans":"B","ana":"张恨水的《金粉世家》是其第一部具有现代意义的通俗小说巨制,小说写京城三世同堂的国务总理金家,以其七少爷金燕西和出身寒门的女子冷清秋的婚姻悲剧为主线,穿插与金家有关的百十个人物,写出巨宦豪门的一朝崩溃,整个家族树倒猢狲散的结局。小说打破了中国古典小说封闭式的结尾模式,呈开放式结构。《五子登科》《八十一梦》《丹凤街》也是张恨水的作品。"},{"t":"s","n":15,"stem":"梁生宝这一社会主义新人形象出自","score":1,"opts":["《创业史》","《铁木前传》","《三里湾》","《山乡巨变》"],"ans":"A","ana":"梁生宝是柳青《创业史》中的社会主义新人形象,他带领农民走互助合作化道路。《创业史》描写了农业合作化前后农村错综复杂的社会关系与尖锐激烈的矛盾斗争,反映了农村社会主义改造的过程。四条线索:①梁三老汉、王二直杠等贫苦农民,迷恋旧时代的创业道路,企图依靠传统的生产方式发家致富,而与互助合作运动格格不入。②高裕中农郭世富,凭借优厚的经济实力,与互助组公开较量,顽固维护私有制,幻想再度雇工剥削。③富农姚士杰,刻骨仇恨新社会,暗中施展阴谋,妄图扼杀互助组,实行阶级报复。④党员、村代表主任郭振山,背离党的宗旨,热衷个人发家,幕后支持互助组的反对势力,曲折干扰、抵制互助合作运动。"},{"t":"s","n":16,"stem":"新中国成立后第一个出国演出的话剧是","score":1,"opts":["《西望长安》","《茶馆》","《龙须沟》","《关汉卿》"],"ans":"B","ana":"新中国成立后,《茶馆》是第一个出国演出的话剧,它展现了老北京的社会风貌,欧洲戏剧界称赞《茶馆》是“东方戏剧的奇迹”,在日本被誉为是“继梅兰芳访问演出后的第二次轰动”。"},{"t":"s","n":17,"stem":"1979 年10 月在北京召开的文艺工作者“五世同堂”的盛会是","score":1,"opts":["第一次全国文代会","第二次全国文代会","第三次全国文代会","第四次全国文代会"],"ans":"D","ana":"1979 年10 月召开的第四次全国文代会,是文艺工作者“五世同堂”的盛会,为新时期文艺的发展指明了方向。第一次全国文代会于1949 年召开;第二次全国文代会于1953年召开;第三次全国文代会于1960 年召开。"},{"t":"s","n":18,"stem":"1989 年推出“新写实小说大联展”的期刊是","score":1,"opts":["《人民文学》","《作家》","《钟山》","《收获》"],"ans":"C","ana":"“新写实小说”的创作发生于1988 年前后,但其作为一种小说潮流被正式命名并产生广泛的社会影响,却源自于《钟山》1989 年第3 期推出的“新写实小说大联展”。"},{"t":"s","n":19,"stem":"收入《道士塔》和《莫高窟》等名篇,富有文化忧患意识的散文集是","score":1,"opts":["余秋雨的《文化苦旅》","巴金的《随想录》","张中行的《负暄话》","杨绛的《千校六记》"],"ans":"A","ana":"余秋雨《文化苦旅》开篇的《道士塔》《莫高窟》表明作者一方面为灿烂的中国文化骄傲不已,同时又以极其沉痛的笔调记叙莫高窟屡遭洗劫的不幸,这种矛盾心境的背后,则是作者对中国文化自身先进与落后因素并存的无奈与体认。巴金的《随想录》主要是对自我和社会的反思;张中行的《负暄话》多回忆旧人旧事;杨绛的《千校六记》记录了特殊时期的生活。"},{"t":"s","n":20,"stem":"高行健的戏剧中,运用荒诞派表现形式,结构方式类似于贝克特《等待戈多》的作品是","score":1,"opts":["《绝对信号》","《彼岸》","《车站》","《野人》"],"ans":"C","ana":"高行健的《车站》运用荒诞派表现形式,其结构方式类似于贝克特的《等待戈多》,只是等待的对象变成了一辆迟迟没有停站的公共汽车。《绝对信号》在主题和某些手段上还存留着传统话剧的成分;《野人》应该说是最为成熟的一部,它是多声部哲理剧的一个典范。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"茅盾小说处女作《蚀》由几个独立的中篇构成,它们有","score":2,"opts":["《幻灭》","《动摇》","《追求》","《腐蚀》","《春蚕》"],"ans":"ABC","ana":"茅盾的《蚀》由《幻灭》《动摇》《追求》三个独立的中篇构成,三部小说基本以时间为序,完整而清晰地再现了大革命失败前后青年知识分子的心态和命运,也真实地反映了作者内心的困惑与矛盾。《腐蚀》是茅盾另一部作品;《春蚕》是茅盾“农村三部曲”之一。"},{"t":"m","n":22,"stem":"以下对毛泽东《在延安文艺座谈会上的讲话》主要内容的概述,正确的有","score":2,"opts":["文艺为工农兵服务","文艺工作者需要深入实际斗争","阐明了文艺普及和提高的辩证关系","文艺源于生活、高于生活","文艺要表现普遍的永恒的人性"],"ans":"ABCD","ana":"1942 年5 月延安文艺座谈会的召开和毛泽东《在延安文艺座谈会上的讲话》在次年公开发表,是抗战文艺运动中最重要的历史事件,也是解放区文学运动的发展标志。毛泽东《在延安文艺座谈会上的讲话》:(1)要求文艺工作者“站在无产阶级立场上”,使文艺为人民大众,首先“为工农兵”服务。(2)从解放区的实际出发,要求文艺工作者在学习马克思主义的同时,必须“深入工农兵群众,深人实际斗争”,从而为作家世界观的转变和创作源泉的获得指明了根本途径;指明“在普及基础上的提高”和“在提高基础上的普及”的辩证关系;指出文艺源于生活,“却可以而且应该比实际生活更高,更强烈,更有集中性,更典型,更理想,由此就更带普遍性”;指出要借鉴吸收中外文化遗产中的精华,同时也说明这是“流”而不是“源”。(3)在文艺与政治的关系的论述中,明确以政治标准为第一,艺术标准第二,对文艺自身的特点与规律没有给予充分的重视。"},{"t":"m","n":23,"stem":"以胡风为核心的“七月诗派”,代表作有","score":2,"opts":["绿原的《童话》","牛汉的《鄂尔多斯草原》","穆旦的《诗八首》","高兰的《哭亡女苏菲》","阿垅的《纤夫》"],"ans":"ABE","ana":"七月诗派在艺术上的追求和创造把自由体新诗推向了一个新的高峰。绿原充满浪漫憧憬的诗集《童话》,振聋发聩的《给天真的乐观主义者们》等政治抒情诗,以及《终点,又是起点》、《伽利略在真理面前》、《你是谁?》等都是优秀之作。鲁藜的诗集《醒来的时候》、《锻炼》中大量朴实而清新的短诗,抒写了诗人在抗日民主根据地的新鲜感受,《泥土》是表现新的人生哲学的名篇。其他如阿垅的《纤夫》、牛汉的《鄂尔多斯草原》等都是充满力度和激情,足以显示七月诗派风格的代表作。穆旦是“九叶诗派”的代表诗人;高兰以朗诵诗闻名。"},{"t":"m","n":24,"stem":"“十七年”历史剧的代表作有","score":2,"opts":["郭沫若的《蔡文姬》","田汉的《关汉卿》","老舍的《龙须沟》","海默的《洞箫横吹》","曹禺的《北京人》"],"ans":"AB","ana":"“十七年”指1949 -1966 年,主要作品有郭沫若的《蔡文姬》、《武则天》,田汉的《关汉卿》、《文成公主》,曹禺(执笔)、梅阡、于是之的《胆剑篇》,老舍的《义和拳》,丁西林的《孟丽君》等。郭沫若的《蔡文姬》通过讲述蔡文姬的故事,展现历史人物的情感与时代背景;田汉的《关汉卿》以关汉卿的经历为题材,歌颂其抗争精神,二者均为“十七年”历史剧的代表作。老舍的《龙须沟》是反映北京人民生活变迁的现实题材话剧;海默的《洞箫横吹》是农村题材作品;曹禺的《北京人》创作于1940 年。"},{"t":"m","n":25,"stem":"下列文章中,提倡文化寻根的有","score":2,"opts":["艾青的《诗人必须说真话》","韩少功的《文学的“根”》","郑万隆的《我的根》","李杭育的《理一理我们的根》","公刘的《诗与诚实》"],"ans":"BCD","ana":"20 世纪80 年代出现文化寻根思潮,韩少功的《文学的“根”》、郑万隆的《我的根》、李杭育的《理一理我们的根》、阿城的《文化制约着人类》都提倡文化寻根,主张从传统文化和地域文化中寻找文学创作的源泉与根基。艾青的《诗人必须说真话》主要强调诗人创作要秉持真诚的态度;公刘的《诗与诚实》重点围绕诗歌创作中的诚实品质展开。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"“ 自叙传”小说","score":4,"ans":"(1)或曰“身边小说”,有郁达夫的《沉沦》、郭沫若的《漂流三部曲》等。(2)主要写亲身经历或个人感受,感情色彩强烈。","ana":"“自叙传”小说又称身边小说，以个人经历、感受和强烈主观抒情为主要特征，郁达夫《沉沦》、郭沫若相关作品是常见例子；答题应抓住自我经验与感情色彩。","anaAI":true},{"t":"term","n":27,"stem":"“南明史剧”","score":4,"ans":"(1)上海“孤岛”时期以讲述明末历史为主要内容的戏剧作品。代表作有阿英的《碧血花》《葛嫩娘》《海国英雄》,于伶的《大明英烈传》等。(2)主要描写郑成功等明末反清斗争中的英雄人物,以激励现实大众的爱国热情。","ana":"“南明史剧”指上海孤岛时期借明末史事和人物激发爱国情感的历史剧，代表作包括阿英、于伶的相关剧作；答题需交代时代背景、历史题材与现实寄托。","anaAI":true},{"t":"term","n":28,"stem":"“朦胧诗”","score":4,"ans":"(1)70 年代后期出现的带有现代主义色彩的诗潮,代表诗人有北岛、舒婷等。(2)注重象征、暗示、联想等手法的运用,作品具有朦胧、多义的特点。","ana":"朦胧诗兴起于70年代后期，北岛、舒婷等为代表，常用象征、暗示和联想形成多义表达；其“朦胧”并非内容含混，而是强调审美意蕴的开放性。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简述30 年代文学创作的特点。","score":8,"ans":"(1)运用科学的社会理论剖析中国社会,如左翼作家;由文化层面批判社会、探究人生,如老舍和“京派”;题材内容空前广泛,涉及中国社会各阶层生活。(2)长篇小说形式日趋成熟,抒情写意小说长足发展;戏剧、诗歌、散文都有重要收获。(3)现实主义成为主流,浪漫主义在变异中发展,现代主义取得丰硕成果。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"30年代文学题材广泛，既有左翼社会分析和京派文化批判，也有都市、乡土等多样书写；形式上长篇小说成熟、抒情小说发展，并呈现实主义主流与多种创作方法并存。","anaAI":true},{"t":"short","n":30,"stem":"简析李季《王贵与李香香》的艺术特色。","score":8,"ans":"(1)借鉴“信天游”形式,擅用比兴手法,叙事和抒情相结合。(2)改进“信天游”形式,表现新的主题和人物,为新诗民族化做出了贡献。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"《王贵与李香香》借鉴信天游的比兴、复沓和民歌节奏，将爱情叙事与革命主题结合；艺术分析要说明对民歌形式的改造及其新诗民族化意义。","anaAI":true},{"t":"short","n":31,"stem":"简析杨朔的散文艺术及其局限。","score":8,"ans":"(1)擅长缘物生情,托物言志,从细微处落墨,创造诗的意境。(2)讲究剪裁布局,于峰回路转中生发出哲理,卒章显志。(3)主题较为单一,谋篇布局时有雷同。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"杨朔散文常由细小事物生发主题，讲究剪裁布局、托物言志和结尾点题，形成诗化意境；同时应指出主题与结构模式有时趋于单一、重复。","anaAI":true},{"t":"short","n":32,"stem":"简析余华小说的先锋性。","score":8,"ans":"(1)冷漠叙述:迷恋于暴力、灾难尤其是死亡的书写,叙述者的主体意向降至感情的冰点。(2)文类颠覆:对旧有的文类进行戏仿,追求文类和价值观的双重颠覆。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"余华先锋小说常以冷静克制的叙述处理暴力、灾难和死亡，并戏仿、拆解既有文类规范；作答应说明形式实验如何挑战传统叙事和价值判断。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"结合作品分析《狂人日记》的思想意义。","score":13,"ans":"(1)揭露了从家庭到社会的“吃人”现象,抨击了封建家族制度和礼教的“吃人”本质,体现了“五四”新文学彻底反封建的总体倾向。(2)对封建礼教的揭露和批判,由当下生存空间到历史文化批判再到自我审视,逐层深入。(3)狂人发出了“从来如此,便对么”“救救孩子”的呼喊,表现了强烈的怀疑、反抗和变革的精神。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"《狂人日记》从“吃人”意象揭露封建家族制度与礼教，批判深入到历史文化和自我审视，并以“救救孩子”寄托变革希望；论述需结合文本细节说明启蒙与反封建意义。","anaAI":true},{"t":"essay","n":34,"stem":"结合作品分析《骆驼祥子》的艺术成就。","score":13,"ans":"(1)成功塑造了祥子与虎妞的典型形象。(2)人物塑造上体现了老舍写出“灵的文学”的主张。(3)浓郁的地域文化色彩与纯熟的北京口语。(4)围绕“车”组织情节的结构方式。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"《骆驼祥子》通过祥子、虎妞等典型形象及“车”的反复得失组织情节，展现个人奋斗的破灭；艺术成就还包括北京口语、地域文化色彩和对人物内心的刻画。","anaAI":true}]}],"code":"00537","qaNotes":[]},{"paper":"xws-2510","subject":"xws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"下列人物中,属于学衡派的是","score":1,"opts":["林纾","陈独秀","梅光迪","蔡元培"],"ans":"C","ana":"学衡派是20 世纪20 年代出现的文化保守主义流派,核心成员包括梅光迪、吴宓等。林纾是近代古文家、翻译家,并非学衡派;陈独秀是新文化运动倡导者,属于激进派;蔡元培是教育家,主张兼容并包,不属学衡派。"},{"t":"s","n":2,"stem":"中国现代文学的开创者是","score":1,"opts":["鲁迅","茅盾","郁达夫","叶绍钧"],"ans":"A","ana":"鲁迅的《狂人日记》是中国现代文学史上第一篇白话小说,打破了传统文学的表达模式,其杂文、小说等作品深刻批判封建礼教,奠定了中国现代文学的思想基础和文学范式,被公认为中国现代文学的开创者。"},{"t":"s","n":3,"stem":"标志20 世纪20 年代中期象征诗派出现的诗集是","score":1,"opts":["《月夜》","《微雨》","《尝试集》","《女神》"],"ans":"B","ana":"李金发的诗集《微雨》于1925 年出版,以独特的象征手法、晦涩的语言表达情感,标志着20 世纪20 年代中期象征诗派的正式出现。《月夜》是沈尹默的白话诗作品,《尝试集》是胡适的白话诗集,《女神》是郭沫若的浪漫主义诗集。"},{"t":"s","n":4,"stem":"1935 年\"一二·九\"运动爆发,在全民族救亡运动中左作家周扬等提出的文学口号是","score":1,"opts":["\"民族革命战争的大众文学\"","\"国防文学\"","\"平民的文学\"","\"为人生的文学\""],"ans":"B","ana":"1935 年\"一二·九\"运动后,民族危机加深,周扬等左联作家提出\"国防文学\"口号,主张文学为抗日救亡服务,号召各阶层作家联合创作国防题材作品。\"民族革命战争的大众文学\"是鲁迅等人后来提出的补充口号;\"平民的文学\"是周作人在五四时期提出的;\"为人生的文学\"是文学研究会的主张。"},{"t":"s","n":5,"stem":"1921 年接手改组《小说月报》、撰写《〈小说月报〉改革宣言》的作家是","score":1,"opts":["胡适","周作人","叶圣陶","沈雁冰"],"ans":"D","ana":"1921 年,沈雁冰(茅盾)接手改组《小说月报》,摆脱了该刊原有的旧文学倾向,将其改造为文学研究会的核心刊物,并撰写《〈小说月报〉改革宣言》,倡导现实主义文学。胡适、周作人、叶圣陶均未参与此次改组核心工作。"},{"t":"s","n":6,"stem":"巴金原名李尧棠,他最早使用笔名\"巴金\"发表的小说是","score":1,"opts":["《家》","《憩园》","《灭亡》","《寒夜》"],"ans":"C","ana":"巴金于1929 年发表第一部小说《灭亡》,这是他首次使用\"巴金\"这一笔名。《家》是其\"激流三部曲\"的第一部,发表于1931 年;《憩园》发表于1944 年;《寒夜》发表于1946 年。"},{"t":"s","n":7,"stem":"老舍以散文诗笔法创作的短篇小说佳作是","score":1,"opts":["《月牙儿》","《上任》","《断魂枪》","《黑白李》"],"ans":"A","ana":"《月牙儿》以第一人称叙述,语言优美流畅,兼具小说的叙事性与散文诗的抒情性,通过母女两代人的悲惨命运反映社会黑暗。《上任》《断魂枪》《黑白李》均为老舍的短篇小说,但未采用散文诗笔法。"},{"t":"s","n":8,"stem":"萧红的早期代表作,被鲁迅称为表现了\"北方人民的对于生的坚强,对于死的挣扎\"的小说是","score":1,"opts":["《小城三月》","《牛车上》","《生死场》","《马伯乐》"],"ans":"C","ana":"萧红的《生死场》创作于1934 年,描写了东北农村民众在苦难中的生存状态与抗争,鲁迅为该书作序,评价其表现了\"北方人民的对于生的坚强,对于死的挣扎\"。《小城三月》《牛车上》是萧红后期作品,《马伯乐》侧重讽刺批判。"},{"t":"s","n":9,"stem":"艾青原名蒋海澄,1933 年他第一次以笔名\"艾青\"发表的成名作是","score":1,"opts":["《雪落在中国的土地上》","《我爱这土地》","《大堰河--我的保姆》","《向太阳》"],"ans":"C","ana":"1933 年,艾青在狱中创作《大堰河--我的保姆》,首次使用\"艾青\"笔名发表,该诗以真挚的情感歌颂保姆大堰河,成为其成名作。《雪落在中国的土地上》发表于1937 年,《我爱这土地》发表于1938 年,《向太阳》发表于1938 年。"},{"t":"s","n":10,"stem":"七月诗派的理论家胡风主张作家要\"突进\"到现实生活中,创作上提倡的是","score":1,"opts":["浪漫主义精神","乌托邦精神","超脱的精神","\"主观战斗精神\""],"ans":"D","ana":"胡风作为七月诗派的核心理论家,主张作家应深入现实生活,在创作中融入\"主观战斗精神\",强调作家主体与现实的互动与搏斗。七月诗派以现实主义为基础,反对浪漫主义的空想、超脱的态度及乌托邦精神。"},{"t":"s","n":11,"stem":"张恨水的小说《金粉世家》里,金家主人的身份是","score":1,"opts":["华侨富商","国务总理","银行经理","大学教授"],"ans":"B","ana":"《金粉世家》以民国时期国务总理金铨的家庭生活为核心,描写了金家的兴衰历程,金铨作为金家主人,其国务总理的身份是小说情节展开的重要背景。"},{"t":"s","n":12,"stem":"1944 年在延安演出,被毛泽东称为\"旧剧革命的划时期的开端\"的新编京剧是","score":1,"opts":["《兄妹开荒》","《红旗歌》","《逼上梁山》","《血泪仇》"],"ans":"C","ana":"1944 年,新编京剧《逼上梁山》在延安演出,该剧改编自《水浒传》,赋予林冲反抗封建压迫的新内涵,毛泽东观看后称赞其为\"旧剧革命的划时期的开端\"。《兄妹开荒》是秧歌剧,《红旗歌》是话剧,《血泪仇》是秦腔。"},{"t":"s","n":13,"stem":"下列小说中,不属于40 年代解放区文学的是","score":1,"opts":["《暴风骤雨》","《围城》","《吕梁英雄传》","《新儿女英雄传》"],"ans":"B","ana":"《围城》是钱钟书于会现实,不属于解放区文学。《暴风骤雨》是周立波的解放区土改题材小说,《吕梁英雄传》《新儿女英雄传》均为解放区抗日题材小说。"},{"t":"s","n":14,"stem":"70 年代台湾文学界发生的重要文艺论争是","score":1,"opts":["新旧文学论争","通俗文学论争","乡土文学论争","现代主义文学论争"],"ans":"C","ana":"20 世纪70 年代,台湾文学界爆发乡土文学论争,围绕文学应立足本土、反映现实还是追求西方现代主义展开讨论,对台湾文学发展影响深远。新旧文学论争发生在五四时期,现代主义文学论争在60 年代,通俗文学论争并非70 年代核心论争。"},{"t":"s","n":15,"stem":"把张灵甫形象刻画得个性鲜明的作品是","score":1,"opts":["罗广斌、杨益言的《红岩》","吴强的《红日》","梁斌的《红旗谱》","知侠的《铁道游击队》"],"ans":"B","ana":"吴强的《红日》以莱芜战役、孟良崮战役为背景,生动刻画了国民党将领张灵甫的狂妄、固执与军事才能,形象鲜明。《红岩》描写重庆地下革命斗争,《红旗谱》反映冀中农民革命,《铁道游击队》讲述抗日游击战争,均未重点刻画张灵甫。"},{"t":"s","n":16,"stem":"下列小说中,属于\"文革\"时期\"地下文学\"的作品是","score":1,"opts":["姚雪垠的《李自成》","张扬的《第二次握手》","黎汝清的《万山红遍》","李心田的《闪闪的红星》"],"ans":"B","ana":"\"文革\"时期的\"地下文学\"是指未获官方认可、在民间秘密流传的作品。《第二次握手》由张扬创作于\"文革\"期间,因涉及知识分子爱情与科研主题被禁止,以手抄本形式流传,属于地下文学。《李自成》《万山红遍》《闪闪的红星》均为\"文革\"时期官方认可的公开出版物。"},{"t":"s","n":17,"stem":"下列小说中,被视为\"改革文学\"发物之作的是","score":1,"opts":["蒋子龙的《乔厂长上任记》","张洁的《沉重的翅膀》","茹志鹃的《剪辑错了的故事》","路遥的《平凡的世界》"],"ans":"A","ana":"蒋子龙的《乔厂长上任记》发表于1979 年,率先反映工业改革中的问题与矛盾,塑造了敢闯敢干的乔光朴形象,被公认为\"改革文学\"的发轫之作。《沉重的翅膀》《平凡的世界》是后续改革文学的重要作品,《剪辑错了的故事》侧重反思历史。"},{"t":"s","n":18,"stem":"\"告诉你吧,世界/我--不--相--信!\"这一诗句的出处是","score":1,"opts":["舒婷的《致橡树》","北岛的《回答》","杨炼的《大雁塔》","江河的《纪念碑》"],"ans":"B","ana":"该诗句出自北岛的《回答》,诗作创作于改革开放初期,以强烈的反叛精神和质疑态度表达对现实的思考,是朦胧诗派的代表作之一。舒婷的《致橡树》歌颂爱情平等,杨炼的《大雁塔》侧重历史反思,江河的《纪念碑》表达对英雄的敬仰。"},{"t":"s","n":19,"stem":"最早唤醒新时期散文的悲剧意识、强调\"说真话\"原则的作家是","score":1,"opts":["巴金","张中行","贾平凹","杨绛"],"ans":"A","ana":"新时期以来,巴金创作《随想录》,以真诚的笔触反思\"文革\"历史,强调\"说真话\"的文学原则,唤醒了散文的悲剧意识与批判精神,对新时期散文发展影响深远。张中行、贾平凹、杨绛的散文虽各有特色,但未起到这一开创性作用。"},{"t":"s","n":20,"stem":"高行健创作的多声部哲理剧,也是他最为成熟的剧作是","score":1,"opts":["《绝对信号》","《车站》","《野人》","《彼岸》"],"ans":"C","ana":"高行健的《野人》以多声部叙事、多重主题交织的方式,探讨人与自然、历史与现实的关系,是其最为成熟的哲理剧。《绝对信号》是其早期实验剧,《车站》侧重荒诞表达,《彼岸》以探索人生意义为主题,均未达到《野人》的成熟度。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"无产阶级革命文学倡导和兴起的历史背景和现实原因有","score":2,"opts":["现实斗争和革命形势要求无产阶级在文学上提出自己的口号,建设无产阶级文学","国际无产阶级文学运动包括苏联文学对中国文学界产生很大影响","参加实际革命的知识分子在大革命失败后汇聚上海从事创作,成为革命文学的主力","大批小资产阶级知识分子急剧左转,暂时成了无产阶级文学的代表","推进反封建思想斗争、改造国民性成了时代的主旋律"],"ans":"ABCD","ana":"无产阶级革命文学兴起于20 世纪20 年代末,背景包括:革命形势需要无产阶级文学发声;国际无产阶级文学运动(如苏联文学)的影响;大革命失败后革命知识分子汇聚上海;小资产阶级知识分子左转加入创作队伍。E 选项是五四新文化运动的核心主题,并非无产阶级革命文学兴起的背景。"},{"t":"m","n":22,"stem":"下列沈从文小说中,以民间传说和佛经故事铺衍成篇的作品有","score":2,"opts":["《丈夫》","《龙朱》","《月下小景》","《神巫之爱》","《八骏图》"],"ans":"BCD","ana":"沈从文的《龙朱》《月下小景》《神巫之爱》均借鉴民间传说或佛经故事,构建了充满诗意的湘西世界。《丈夫》聚焦湘西水手与妻子的生活,《八骏图》批判都市知识分子的虚伪,均未以民间传说或佛经故事为创作基础。"},{"t":"m","n":23,"stem":"下列小说中,由张爱玲创作的有","score":2,"opts":["《倾城之恋》","《金锁记》","《沉香屑·第一炉香》","《八十一梦》","《结婚十年》"],"ans":"ABC","ana":"《倾城之恋》《金锁记》《沉香屑·第一炉香》均为张爱玲的经典小说,以细腻的笔触描写都市男女的情感与命运。《八十一梦》是张恨水的作品,《结婚十年》是苏青的自传体小说。"},{"t":"m","n":24,"stem":"关于夏衍的戏剧《上海屋檐下》,下列说法正确的有","score":2,"opts":["现实主义戏剧","手法洗练含蓄","江南梅雨季节的背景","弄堂生活场景","现代主义风格"],"ans":"ABCD","ana":"《上海屋檐下》是夏衍的现实主义戏剧代表作,以江南梅雨季节为背景,描写上海弄堂里几户人家的生活,手法洗练含蓄,真实反映社会底层民众的苦难。该剧采用现实主义创作方法,并非现代主义风格,故E 选项错误。"},{"t":"m","n":25,"stem":"\"十七年\"文学中反映工业建设的长篇小说有","score":2,"opts":["周立波的《铁水奔流》","艾芜的《百炼成钢》","柳青的《创业史》","曲波的《林海雪原》","杜鹏程的《保卫延安》"],"ans":"AB","ana":"\"十七年\"文学指1949-1966 年的文学创作,《铁水奔流》描写钢铁工业建设,《百炼成钢》聚焦工厂生产与工人成长,均属工业建设题材。《创业史》反映农业合作化运动,《林海雪原》《保卫延安》均为革命历史题材小说,故C、D、E选项错误。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"《潘先生在难中》","score":4,"ans":"(1)叶绍钧代表作。以军阀混战为背景写潘先生的逃难经历,揭示了社会现实的混乱与黑暗。潘先生形象典型地表现了小市民知识分子的自私、圆滑与世故。(2)笔调严谨扎实,深沉的情感蕴含于客观叙述中,冷峻含蓄,体现了叶绍钧小说的现实主义风格。","ana":"《潘先生在难中》以军阀混战中的逃难经历刻画潘先生的自私、圆滑与世故，并以冷静客观的写实笔调寄寓批判；名词解释应联系作品背景、人物类型和叶绍钧的现实主义风格。","anaAI":true},{"t":"term","n":27,"stem":"中国左翼作家联盟","score":4,"ans":"(1)1930 年3 月2 日在上海成立,鲁迅、冯雪峰、冯乃超、李初梨、蒋光慈等40余人出席了成立大会。(2)会上通过了\"左联\"理论纲领,以\"援助而且从事无产阶级艺术的产生\"为奋斗目标。鲁迅作了《对于左翼作家联盟的意见》的重要讲话,号召\"左联\"在共同目标下扩大联合战线。","ana":"“左联”于1930年在上海成立，鲁迅等人参与，推动马克思主义文艺理论传播、文艺大众化和左翼创作；作答可概括其组织活动与文学史影响。","anaAI":true},{"t":"term","n":28,"stem":"\"赵树理方向\"","score":4,"ans":"(1)1943年起赵树理发表《小二黑结婚》等一系列作品,推进了中国现代小说的民族化、大众化,为解决新文学与农民沟通问题提供了成功的经验。(2)赵树理的创作受到彭德怀、郭沫若等的充分肯定。陈荒煤提出了\"赵树理方向\",号召作家向赵树理学习。","ana":"“赵树理方向”强调赵树理创作在小说大众化、民族化及沟通新文学与农民方面的经验；回答应交代其作品实践和提出这一方向的文学史语境。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简析叶紫小说《丰收》的思想意义","score":8,"ans":"(1)表现\"丰收成灾\"的主题。深刻反映了农民苦难的社会根源,暗示了斗争是农民解放的根本途径。(2)云普叔代表老一代农民形象,相信勤劳可以致富。立秋是新一代农民代表,反对父亲的人生哲学,对统治阶级不抱幻想,开始在党的领导下进行自觉斗争。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《丰收》写“丰收成灾”，揭示农民苦难的社会根源，并通过云普叔与立秋的代际观念差异呈现农民意识变化；答题应联系“勤劳致富”信念与觉醒、斗争意识。","anaAI":true},{"t":"short","n":30,"stem":"简析戴望舒诗歌《雨巷》的艺术特色","score":8,"ans":"(1)浓重的象征意味。\"寂寥\"的\"雨巷\"象征当时的社会现实,\"丁香一样地/结着愁怨的姑娘\",象征诗人美好的希望。(2)优美的旋律、流动的节奏,\"替新诗的音节开了一个新的纪元\"。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《雨巷》以雨巷、丁香姑娘等意象形成象征层次，并凭复沓、音韵和流动节奏营造朦胧忧郁的音乐美；答题宜结合具体诗句说明意象如何承载情绪。","anaAI":true},{"t":"short","n":31,"stem":"简析艾芜小说集《南行记》的思想内容","score":8,"ans":"(1)以漂泊知识者的眼光叙述边陲下层民众生活,刻画出各式各样的流民形象。(2)表现了人物强烈的生存意识与朦胧的反抗精神。(3)批判了黑暗的虎狼世界,寄托了作者对底层民众的同情、理解与赞颂。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《南行记》以漂泊知识者视角书写边地流民的生存状态，既表现强烈生存意识和朦胧反抗，也寄托作者对底层民众的同情与理解；可联系其现实主义观察。","anaAI":true},{"t":"short","n":32,"stem":"简析老舍话剧《茶馆》中王利发的人物形象","score":8,"ans":"(1)勤勤恳恳的小生意人,精明、圆滑、世故,也有一些正义感。(2)奉行妥协逢迎的处世哲学,却不保守固执,不断改良茶馆的经营,最后还是难逃茶馆被霸占、自己上吊自杀的悲剧。(3)他的不幸命运是对旧社会的控诉,也是对\"好人\"哲学的否定。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"王利发精明勤勉、善于经营又讲究妥协逢迎，虽不断改良茶馆仍无法逃脱时代压迫；其悲剧揭示旧社会中小生意人的生存困境及“好人”式处世哲学的无力。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"论述鲁迅小说《祝福》中祥林嫂悲剧的主客观原因","score":13,"ans":"(1)主观原因:满足于坐稳了奴隶的地位。她的\"逃撞捐问\"都见出\"从一而终\"的封建\"女德\"或封建神权的影响。她以封建礼教的是非为是非,这注定了她的悲剧命运。(2)客观原因:封建的夫权、族权、神权、政权四大绳索编成了严密的网。\"围观\"的看客们维护着\"三纲五常\",自觉不自觉地用统治阶级的观念审视、责备、折磨,使她孤立无援,陷入恐惧、绝望的境地。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"祥林嫂的悲剧既受再嫁、捐门槛等经历中的礼教观念影响，也由夫权、族权、神权和社会冷漠共同造成；论述应结合鲁镇人物与看客态度，避免把责任归咎于受害者。","anaAI":true},{"t":"essay","n":34,"stem":"论析顾城诗歌的思想内容与艺术特点","score":13,"ans":"(1)早期部分诗作直接观照现实,如《一代人》对\"一代人\"与黑暗时代之间的关系进行了精辟概括。但他很快放弃了这种写作方式,专注于营造纯净优美的童话世界,因此被称为\"童话诗人\"。(2)大多数作品是短小的抒情诗,擅长以象征方式表达对纯美世界的向往,探索心灵世界的隐秘,表现出诗人敏锐捕捉感觉的才能。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"顾城早期诗歌有对现实的直接感受，后期常以短小抒情诗营造纯净、童话般的意象世界；可结合《一代人》等说明其象征手法、对光明与纯美的追寻及风格变化。","anaAI":true}]}],"code":"00537","qaNotes":[]},{"paper":"xws-2604","subject":"xws","session":"2604","label":"2026年4月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的。","items":[{"t":"s","n":1,"stem":"被茅盾称为“客观地，写实地，描写着灰色的卑琐的人生”的文学研究会作家是","score":1,"opts":["叶绍钧","许地山","王统照","冰心"],"ans":"A","ana":"茅盾这句评语指叶绍钧（叶圣陶）的写实小说，对平凡而卑琐的人生作客观描绘。","anaAI":true},{"t":"s","n":2,"stem":"被鲁迅誉为“中国最杰出的抒情诗人”的是","score":1,"opts":["李金发","冯至","宗白华","朱自清"],"ans":"B","ana":"鲁迅对冯至的抒情诗给予这一评价；本地2404卷有同一评价、选项位置不同，所指仍为冯至。","anaAI":true},{"t":"s","n":3,"stem":"“五四”时期最早出现的散文类型是","score":1,"opts":["杂感短论","叙事散文","抒情散文","游记散文"],"ans":"A","ana":"“五四”新文学中的杂感短论先行兴起，以议论、批评社会与文化为主要特色。","anaAI":true},{"t":"s","n":4,"stem":"丁西林的第一部独幕喜剧是","score":1,"opts":["《压迫》","《兵变》","《一只马蜂》","《终身大事》"],"ans":"C","ana":"《一只马蜂》是丁西林早期独幕喜剧，《压迫》《兵变》等不对应本题所问的第一部。","anaAI":true},{"t":"s","n":5,"stem":"在全民族救亡运动的推动下，发生了“两个口号”论争，胡风、冯雪峰为补救周扬等人口号的不足而提出的新口号是","score":1,"opts":["“为人生的文学”","“平民的文学”","“国防文学”","“民族革命战争的大众文学”"],"ans":"D","ana":"周扬等人主张“国防文学”，胡风、冯雪峰等提出“民族革命战争的大众文学”，两者构成当时的“两个口号”论争。","anaAI":true},{"t":"s","n":6,"stem":"下列作家中，最早从事共产主义运动、成为中国共产党首批党员的是","score":1,"opts":["鲁迅","茅盾","郭沫若","郁达夫"],"ans":"B","ana":"本地现代文学史笔记明确记载沈雁冰（茅盾）1921年成为中国共产党首批党员；题干选项B为茅盾，故据本地教材核订为B。卷后附录C及“郭沫若首批党员”解析与本地教材证据不符。","anaAI":true,"qaNotes":"本地《中国现代文学史》蒋丽媛2604全书笔记原文记“1921年成为中国共产党的首批党员”，置于茅盾条下；对应选项B。题面选项完整，答案可按本地教材更正；附录答案C及解析属误。"},{"t":"s","n":7,"stem":"巴金的《激流三部曲》塑造的一个封建家庭专制重压下灵魂病态的人物是","score":1,"opts":["觉慧","觉民","觉新","鸣凤"],"ans":"C","ana":"觉新在封建家族秩序下既有自我意识又一再妥协，形成受压抑的矛盾性格。","anaAI":true},{"t":"s","n":8,"stem":"《为奴隶的母亲》通过一个“典妻”故事写出了旧中国农妇的悲剧命运，作者是","score":1,"opts":["沙汀","艾芜","叶紫","柔石"],"ans":"D","ana":"《为奴隶的母亲》是柔石的小说，通过典妻经历揭示贫困与制度性压迫。","anaAI":true},{"t":"s","n":9,"stem":"最能体现“新感觉派”小说特点的施蛰存小说集是","score":1,"opts":["《都市风景线》","《梅雨之夕》","《南行记》","《传奇》"],"ans":"B","ana":"《梅雨之夕》是施蛰存小说集，注重人物感觉和心理描写；其余三项分别对应不同作家或作品。","anaAI":true},{"t":"s","n":10,"stem":"丁玲的早期代表作 。","score":8,"ans":"（1）人物在家庭制度、社会秩序与个人欲望的冲突中走向悲剧。（2）戏剧常通过纠葛、秘密、偶然与情节推进，营造难以挣脱的命运感。（3）《雷雨》中周、鲁两家错综的关系和《原野》中复仇与罪感，可分别说明命运压迫的不同形态。（4）命运悲剧并非纯粹宿命论，也关乎社会和人性的矛盾。","ana":"结合《雷雨》《原野》的情节与人物分析，不应简单断言一切悲剧都由封建礼教造成。","anaAI":true},{"t":"w","n":31,"stem":"简析杨沫小说《青春之歌》的主题内涵。","score":8,"ans":"（1）以林道静由个人反抗走向革命道路的成长经历为主线，表现青年知识分子在民族危机与革命实践中的思想转变。（2）突出个人命运与民族、社会命运的联系，强调革命集体与理想对个人成长的作用。（3）借不同人物道路的对照，表现爱国、反压迫和投身革命的主题。","ana":"分析应围绕林道静的成长和道路选择，避免仅罗列爱国主义等抽象口号。","anaAI":true},{"t":"w","n":32,"stem":"简析莫言小说《红高粱》的艺术探索。","score":8,"ans":"（1）以“我”的后代视角追溯祖辈故事，时序交错，打破线性叙事。（2）红高粱意象与浓烈色彩、感官描写相结合，形成粗犷、奇诡的叙述风格。（3）传奇化的抗战与乡土人物书写凸显生命活力，融合现实、想象与民间叙事资源。","ana":"举“我爷爷”“我奶奶”及高粱地意象说明叙述视角、结构与语言特点；不宜只以“魔幻”一词概括全篇。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"联系作品分析茅盾小说《子夜》中吴荪甫的形象。","score":13,"ans":"（1）吴荪甫是有魄力和工业抱负的民族资本家，试图扩张实业并与买办金融势力竞争。（2）他精明、强干，同时专横、压榨工人，对革命运动怀有敌意，体现民族资产阶级的矛盾性。（3）在帝国主义资本、金融投机和社会危机的重压下事业失败，悲剧折射20世纪30年代民族工业与民族资产阶级的困境。","ana":"本地2110卷有近乎同题论述；答题可联系裕华丝厂、与赵伯韬的竞争及工人运动，论析事业进取与阶级局限的并存。","anaAI":true},{"t":"w","n":34,"stem":"结合具体作品分析艾青诗歌的艺术特色。","score":13,"ans":"（1）以“土地”“太阳”等意象凝聚民族苦难和对光明的追求，如《我爱这土地》《向太阳》。（2）将鲜明的感觉、色彩和画面与主观情感交融，如《雪落在中国的土地上》反复吟咏中国的痛苦。（3）多用自由体、散文化语句，并以排比、反复形成节奏和抒情力量，如《大堰河——我的保姆》。","ana":"本地2110卷有同一论述知识点；论述应落实到诗句、意象、视觉效果与自由体节奏，不应以“有格律”误释其音乐性。","anaAI":true}]}],"code":"00537","qaNotes":["第6题：卷后“答案：C”及“郭沫若是中国共产党首批党员”的叙述有明显史实错误；据沈雁冰（茅盾）早期党员身份暂校为B，请人工再核权威答案。","第27题：附录把“现代罗曼司”归于张恨水、刘呐鸥的说法存疑；没有可靠的同题本地资料，ans留待核标记，禁止自动计分。候选方向：徐訏、无名氏的现代传奇/浪漫小说写作；须核指定教材定义与代表作品。","第25题：附录误称《一个王朝的背影》也在《文化苦旅》；其收于《山居笔记》，仅取作者归属ABD。","第24题：附录关于C、D所属另一剧作的归属未获本地核验，解析仅说明不属于《茶馆》。","相近/同知识点本地交叉核：第2题xws-2404#1、第12题xws-2210#12、第16题xws-2310#16、第17题xws-2110#28、第25题xws-2504#19、第33题xws-2110#33、第34题xws-2110#34；其中第2、16题选项位置不同，须以本卷排序判字母。","第6题已对照完整题干选项及本地《中国现代文学史》蒋丽媛2604笔记的茅盾条目；将ans由暂定B明确核定为B，解析改为教材可验证的依据；不改其它题。"]}];

⟫。召公告曰：‘民不堪命矣！’王怒，得卫巫，使监谤者。以告，则杀之。⟪国人莫敢言，道路以目⟫。王喜，告召公曰：‘吾能弭谤矣，乃不敢言。’召公曰：‘是障之也。⟪防民之口，甚于防川⟫。川壅而溃，伤人必多，民亦如之。⟪是故为川者决之使导⟫，为民者宣之使言。……民之有口，犹土之有山川也，财用于是乎出；犹其有原、隰、衍、沃也，衣食于是乎生。口之宣言也，善败于是乎兴。⟪行善而备败，其所以阜财用衣食者也⟫。夫民虑之于心而宣之于口，成而行之，胡可壅也？⟪若壅其口，其与能几何⟫？’","⟪厲王虐，國人謗王⟫":"⟪厉王虐，国人谤王⟫","⟪國人莫敢言，道路以目⟫":"⟪国人莫敢言，道路以目⟫","⟪防民之口，甚於防川⟫":"⟪防民之口，甚于防川⟫","⟪是故為川者決之使導⟫":"⟪是故为川者决之使导⟫","⟪行善而備敗，其所以阜財用衣食者也⟫":"⟪行善而备败，其所以阜财用衣食者也⟫","⟪若壅其口，其與能幾何⟫":"⟪若壅其口，其与能几何⟫","齊桓公將立管仲令群臣曰寡人將立管仲爲仲父善者入門而左不善者入門而右東郭牙中門而立公曰寡人立管仲爲仲父令曰善者左不善者右今子何爲中門而立牙曰以管仲之智爲能謀天下乎公曰能以斷爲敢行大事乎公曰敢牙曰君知能謀天下斷敢行大事君因專屬之國柄焉以管仲之能乘公之勢以治齊國得無危乎公曰善乃令隰朋治内管仲治外以相參":"齐桓公将立管仲令群臣曰寡人将立管仲为仲父善者入门而左不善者入门而右东郭牙中门而立公曰寡人立管仲为仲父令曰善者左不善者右今子何为中门而立牙曰以管仲之智为能谋天下乎公曰能以断为敢行大事乎公曰敢牙曰君知能谋天下断敢行大事君因专属之国柄焉以管仲之能乘公之势以治齐国得无危乎公曰善乃令隰朋治内管仲治外以相参","景公有所愛槐，令吏謹守之，植木縣之，下令曰：‘犯槐者刑，傷之者死。’有不聞令，醉而犯之者，公聞之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辭晏子之家，令內之。女子入門，晏子望見之，曰：‘怪哉！有深憂。’進而問焉，曰：‘所憂何也？’對曰：‘妾聞之，明君蒞國立政，不損祿，不⟪益⟫刑，又不以私⟪恚⟫害公法，不為禽獸傷人民，不為草木傷禽獸，不為野草傷禾苗。吾君欲以樹木之故殺妾父，孤妾身，此令行於民而法於國矣。雖然，妾聞之，勇士不以眾強⟪凌⟫孤獨，明惠之君不拂是以行其所欲。今之令不然，以樹木之故，罪法妾父，恐其傷察吏之法，而害明君之義也。鄰國聞之，皆謂吾君愛樹而賤人，其可乎？’晏子曰：‘甚矣！吾將為子言之於君。’使人送之⟪歸⟫。明日，早朝，而復於公曰：‘嬰聞之，窮民財力以供嗜欲謂之暴；崇玩好，威嚴擬乎君謂之逆；刑殺不辜謂之賊。此三者，守國之大殃。’公曰：‘微大夫教寡人，幾有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罷守槐之役，拔置縣之木，廢傷槐之法，出犯槐之囚。":"景公有所爱槐，令吏谨守之，植木县之，下令曰：‘犯槐者刑，伤之者死。’有不闻令，醉而犯之者，公闻之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辞晏子之家，令内之。女子入门，晏子望见之，曰：‘怪哉！有深忧。’进而问焉，曰：‘所忧何也？’对曰：‘妾闻之，明君莅国立政，不损禄，不⟪益⟫刑，又不以私⟪恚⟫害公法，不为禽兽伤人民，不为草木伤禽兽，不为野草伤禾苗。吾君欲以树木之故杀妾父，孤妾身，此令行于民而法于国矣。虽然，妾闻之，勇士不以众强⟪凌⟫孤独，明惠之君不拂是以行其所欲。今之令不然，以树木之故，罪法妾父，恐其伤察吏之法，而害明君之义也。邻国闻之，皆谓吾君爱树而贱人，其可乎？’晏子曰：‘甚矣！吾将为子言之于君。’使人送之⟪归⟫。明日，早朝，而复于公曰：‘婴闻之，穷民财力以供嗜欲谓之暴；崇玩好，威严拟乎君谓之逆；刑杀不辜谓之贼。此三者，守国之大殃。’公曰：‘微大夫教寡人，几有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罢守槐之役，拔置县之木，废伤槐之法，出犯槐之囚。","縣：":"县：","（一）解释文中加着重号词语的意义。（6分）":"（一）解释文中加着重号词语的意义。（6分）","犯：":"犯：","益：":"益：","恚：":"恚：","凌：":"凌：","歸：":"归：","吾君欲以樹木之故殺妾父，⟪孤⟫妾身。":"吾君欲以树木之故杀妾父，⟪孤⟫妾身。","（二）说明下列句中下划线词的用法及意义。（4分）":"（二）说明下列句中下划线词的用法及意义。（4分）","鄰國聞之，皆謂吾君⟪愛⟫樹而⟪賤⟫人。":"邻国闻之，皆谓吾君⟪爱⟫树而⟪贱⟫人。","明惠之君不拂是以行其所欲。":"明惠之君不拂是以行其所欲。","（三）将下列句子译成现代汉语。（6分）":"（三）将下列句子译成现代汉语。（6分）","窮民財力以供嗜欲謂之暴。":"穷民财力以供嗜欲谓之暴。","微大夫教寡人，幾有大罪以累社稷。":"微大夫教 2）夫民心之慍也，若⟪防⟫大川焉，潰而所犯必大矣。\n（3）入而徐趨，至而自⟪謝⟫。\n（4）郢人堊⟪慢⟫其鼻端，若蠅翼，使匠石斵之。":"指出下列句中加着重号的词哪些用的是本字，哪些用的是通假字，并说明如何区分本字和通假字。\n（1）孔子⟪时⟫其亡也，而往拜之，遇诸涂。\n（2）夫民心之愠也，若⟪防⟫大川焉，溃而所犯必大矣。\n（3）入而徐趋，至而自⟪谢⟫。\n（4）郢人垩⟪慢⟫其鼻端，若蝇翼，使匠石斵之。","解释下列句中加着重号词的意义，并据以分析异词同字现象产生的原因。\n（1）\nA.昔者仲尼與於蜡賓，事畢，出遊於⟪觀⟫之上。\nB.吾⟪觀⟫晉公子之從者，皆足以相國。\n（2）\nA.令甲卒皆伏，使老弱⟪女子⟫乘城。\nB.曾子怒曰：‘商！⟪女⟫何無罪也？’":"解释下列句中加着重号词的意义，并据以分析异词同字现象产生的原因。\n（1）\nA.昔者仲尼与于蜡宾，事毕，出游于⟪观⟫之上。\nB.吾⟪观⟫晋公子之从者，皆足以相国。\n（2）\nA.令甲卒皆伏，使老弱⟪女子⟫乘城。\nB.曾子怒曰：‘商！⟪女⟫何无罪也？’","指出下列句子中的前置宾语，并归纳古汉语宾语前置的主要格式。\n（1）帝王不相復，何禮之循？\n（2）視人國若其國，誰攻？\n（3）翟黃對曰：‘奚為不可？’\n（4）昭王南征而不復，寡人是問。\n（5）我未之見也。":"指出下列句子中的前置宾语，并归纳古汉语宾语前置的主要格式。\n（1）帝王不相复，何礼之循？\n（2）视人国若其国，谁攻？\n（3）翟黄对曰：‘奚为不可？’\n（4）昭王南征而不复，寡人是问。\n（5）我未之见也。","晉侯賞從亡者。介之推不言祿，祿亦弗及。推曰：‘獻公之子九人，唯君在矣。惠、懷無親，外內棄之。天未絕晉，必將有主。主晉祀者，非君而誰？天實置之，而二三子以為己力，⟪不亦誣乎⟫！竊人之財猶謂之盜，況貪天之功以為己力乎？⟪下義其罪，上賞其姦⟫，上下相蒙，難與處矣。’其母曰：‘盍亦求之？以死，誰懟？’對曰：‘⟪尤而效之，罪又甚焉⟫。且出怨言，不食其食。’其母曰：‘亦使知之，若何？’對曰：‘言，身之文也。⟪身將隱，焉用文之⟫？是求顯也。’其母曰：‘能如是乎！與女偕隱。’遂隱而死。晉侯求之，不獲。⟪以綿上為之田⟫，曰：‘⟪以志吾過⟫，且旌善人。’":"晋侯赏从亡者。介之推不言禄，禄亦弗及。推曰：‘献公之子九人，唯君在矣。惠、怀无亲，外内弃之。天未绝晋，必将有主。主晋祀者，非君而谁？天实置之，而二三子以为己力，⟪不亦诬乎⟫！窃人之财犹谓之盗，况贪天之功以为己力乎？⟪下义其罪，上赏其奸⟫，上下相蒙，难与处矣。’其母曰：‘盍亦求之？以死，谁怼？’对曰：‘⟪尤而效之，罪又甚焉⟫。且出怨言，不食其食。’其母曰：‘亦使知之，若何？’对曰：‘言，身之文也。⟪身将隐，焉用文之⟫？是求显也。’其母曰：‘能如是乎！与女偕隐。’遂隐而死。晋侯求之，不获。⟪以绵上为之田⟫，曰：‘⟪以志吾过⟫，且旌善人。’","⟪不亦誣乎⟫":"⟪不亦诬乎⟫","⟪下義其罪，上賞其姦⟫":"⟪下义其罪，上赏其奸⟫","⟪尤而效之，罪又甚焉⟫":"⟪尤而效之，罪又甚焉⟫","⟪身將隱，焉用文之⟫":"⟪身将隐，焉用文之⟫","⟪以綿上為之田⟫":"⟪以绵上为之田⟫","⟪以志吾過⟫":"⟪以志吾过⟫","唐且謂信陵君曰臣聞之曰事有不可知者有不可不知者有不可忘者有不可不忘者信陵君曰何謂也對曰人之憎我也不可不知也吾憎人也不可得而知也人之有德於我也不可忘也吾有德於人也不可不忘也今君殺晉鄙救邯鄲破秦人存趙國此大德也今趙王自郊迎卒然見趙王臣願君之忘之也信陵君曰無忌謹受教":"唐且谓信陵君曰臣闻之曰事有不可知者有不可不知者有不可忘者有不可不忘者信陵君曰何谓也对曰人之憎我也不可不知也吾憎人也不可得而知也人之有德于我也不可忘也吾有德于人也不可不忘也今君杀晋鄙救邯郸破秦人存赵国此大德也今赵王自郊迎卒然见赵王臣愿君之忘之也信陵君曰无忌谨受教","昔者齊景公問於晏子曰：‘吾欲觀於轉附、朝儛，⟪遵⟫海而南，放於琅邪。吾何修而可以比於先王觀也？’晏子對曰：‘善哉，問也！天子⟪適⟫諸侯曰巡狩，巡狩者，巡所守也；諸侯朝於天子曰述職，述職者，述所職也。無非事者。春省耕而補不足，秋省斂而助不給。夏諺曰：“吾王不遊，吾何以休？吾王不豫，吾何以助？一遊一豫，為諸侯度。”今也不然：師行而⟪糧食⟫，飢者弗食，勞者弗⟪息⟫。睊睊胥讒，民乃作慝。方命虐民，飲食若流。流連荒亡，為諸侯憂。從流下而忘反謂之流，從流上而忘反謂之連，從獸無⟪厭⟫謂之荒，樂酒無厭謂之亡。先王無流連之樂、荒亡之行。惟君所行也。’景公⟪說⟫，大戒於國，出⟪舍⟫於郊。於是始興發，補不足。召大師曰：‘為我作君臣相說之樂！’":"昔者齐景公问于晏子曰：‘吾欲观于转附、朝儛，⟪遵⟫海而南，放于琅邪。吾何修而可以 我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，⟪鮑叔不以我爲不肖⟫，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，⟪召忽死之⟫，吾幽囚受辱，鮑叔不以我爲無恥，⟪知我不羞小節⟫而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。⟪子孫世祿於齊⟫，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而⟪多鮑叔能知人也⟫。":"管仲曰：‘吾始困时，⟪尝与鲍叔贾⟫，分财利多自与，鲍叔不以我为贪，知我贫也；吾尝为鲍叔谋事而更穷困，鲍叔不以我为愚，知时有利不利也；吾尝三仕三见逐于君，⟪鲍叔不以我为不肖⟫，知我不遭时也；吾尝三战三走，鲍叔不以我为怯，知我有老母也；公子纠败，⟪召忽死之⟫，吾幽囚受辱，鲍叔不以我为无耻，⟪知我不羞小节⟫而耻功名不显于天下也。生我者父母，知我者鲍子也。’鲍叔既进管仲，以身下之。⟪子孙世禄于齐⟫，有封邑者十余世，常为名大夫。天下不多管仲之贤而⟪多鲍叔能知人也⟫。","⟪嘗與鮑叔賈⟫":"⟪尝与鲍叔贾⟫","⟪鮑叔不以我爲不肖⟫":"⟪鲍叔不以我为不肖⟫","⟪召忽死之⟫":"⟪召忽死之⟫","⟪知我不羞小節⟫":"⟪知我不羞小节⟫","⟪子孫世祿於齊⟫":"⟪子孙世禄于齐⟫","⟪多鮑叔能知人也⟫":"⟪多鲍叔能知人也⟫","蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣":"苏代为燕说齐未见齐王先说淳于髡曰人有卖骏马者比三旦立市人莫之知往见伯乐曰臣有骏马欲卖之比三旦立于市人莫与言愿子还而视之去而顾之臣请献一朝之贾伯乐乃还而视之去而顾之一旦而马价十倍今臣欲以骏马见于王莫为臣先后者足下有意为臣伯乐乎臣请献白璧一双黄金万镒以为马食淳于髡曰谨闻命矣","梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭⟪對⟫曰：‘吾小人也，貪。⟪饋⟫之始至，懼其不足，故歎。中食而自⟪咎⟫也。曰：“豈主之食而有不足？”是以⟪再⟫歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。":"梗阳人有⟪狱⟫，将不胜，⟪请纳赂于魏献子⟫，献子将许之。⟪阎没⟫谓叔宽曰：‘与子谏乎！吾主以不⟪贿⟫闻于诸侯，今以梗阳之贿殃之，不可。’二人朝而不退。献子将食，问谁于庭，曰：‘阎明、叔褒在。’召之，使佐食。比己食，三叹。⟪既饱⟫，献子问焉，曰：‘人有言曰：“唯食可以忘忧。”吾子一食之间而三叹，何也？’同辞⟪对⟫曰：‘吾小人也，贪。⟪馈⟫之始至，惧其不足，故叹。中食而自⟪咎⟫也。曰：“岂主之食而有不足？”是以⟪再⟫叹。主之既食，愿以小人之腹，为君子之心，适⟪厌⟫而已，是以三叹。’献子曰：‘善。’乃辞梗阳人。","獄：":"狱：","對：":"对：","饋：":"馈：","咎：":"咎：","再：":"再：","厭：":"厌：","吾主以不⟪賄⟫聞於諸侯。賄：":"吾主以不⟪贿⟫闻于诸侯。贿：","（二）解释下列句子中加着重号的词的词性和词义。（4分）":"（二）解释下列句子中加着重号的词的词性和词义。（4分）","⟪既⟫飽，獻子問焉。既：":"⟪既⟫饱，献子问焉。既：","⟪請納賂於魏獻子⟫。":"⟪请纳赂于魏献子⟫。","（三）将下列文中画线的句子译成现代汉语。（4分）":"（三）将下列文中画线的句子译成现代汉语。（4分）","⟪人有言曰：‘唯食可以忘憂。’吾子一食之間而三歎，何也？⟫":"⟪人有言曰：‘唯食可以忘忧。’吾子一食之间而三叹，何也？⟫","用现代汉语说明阎没与叔宽是如何劝谏魏献子的？":"用现代汉语说明阎没与叔宽是如何劝谏魏献子的？","（四）回答下列问题。（6分）":"（四）回答下列问题。（6分）","说明文中“以小人之腹，爲君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。":"说明文中“以小人之腹，为君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。","下列各组字，全部是会意字的一组是":"下列各组字，全部是会意字的一组是","弃武河":"弃武河","解險柴":"解险柴","息  明":"息  明","绵暖迹":"绵暖迹","哀，内形外聲。":"哀，内形外声。","幕，上形下聲。":"幕，上形下声。","鴨，左形右聲。":"鸭，左 const PAPERS=(()=>{const ready=new Map(RAW_PAPERS.map(p=>[p.paper,{...p,available:p.available!==false}]));for(const subject of Object.keys(SUBJECTS))for(const session of SESSIONS){const id=`${subject}-${session}`;if(!ready.has(id))ready.set(id,{paper:id,subject,session,label:`20${session.slice(0,2)}年${session.slice(2)==='04'?'4月':'10月'}`,code:SUBJECTS[subject].code,sections:[],qaNotes:['原卷及答案待整理。'],available:false})}return [...ready.values()].sort((a,b)=>a.subject.localeCompare(b.subject)||a.session.localeCompare(b.session))})();
const LETTERS='ABCDE'.split('');
let appState={view:'home',subject:null,paper:null,cursor:0,mode:'exam',answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},navOpen:true,navCompact:true,gdhySimple:false};
appState.gdhySimple=localStorage.getItem('zk:gdhy-simple')==='1';
try{const settings=JSON.parse(localStorage.getItem('zk:v1:settings')||'{}');if(localStorage.getItem('zk:dark')===null&&settings.dark!==undefined)localStorage.setItem('zk:dark',settings.dark?'1':'0')}catch{}
const key=(p,n)=>'zk:v1:'+p.subject+':'+p.session;
let punct={};
function load(p){const raw=localStorage.getItem(key(p));if(!raw)return {answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'};try{return Object.assign({answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'},JSON.parse(raw))}catch{return {answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'}}}
function save(){if(!appState.paper)return;localStorage.setItem(key(appState.paper),JSON.stringify({answers:appState.answers,strokes:appState.strokes,text:appState.text,scores:appState.scores,essayChoice:appState.essayChoice,punct:appState.punct,status:appState.status||'progress'}));}
function allItems(p){const out=[];for(const s of p.sections||[])for(const q of s.items||[]){if(q.t==='r'){for(const sub of q.subs||[])out.push(Object.assign({},sub,{parent:q.n,passage:q.passage}));}else out.push(q);}return out}
function activeItems(p){return allItems(p).filter(q=>!(p.subject==='marx'&&q.n>=31&&q.n<=33&&!appState.essayChoice[qKey(q)]))}
function flatItems(p){const out=[];for(const s of p.sections||[])for(const q of s.items||[])out.push(q);return out}
function qKey(q){return q.parent!==undefined?`${q.parent}-${q.n}`:String(q.n)}
function hasAnswer(q){if(q.t==='s'||q.t==='m')return !!appState.answers[qKey(q)];if(q.t==='p')return Object.keys(appState.punct[qKey(q)]||{}).length>0;if(q.t==='r')return (q.subs||[]).every(x=>hasAnswer(Object.assign({},x,{parent:q.n})));return !!(appState.text[qKey(q)]||((appState.strokes[qKey(q)]||[]).length));}
function isObjective(q){return q.t==='s'||q.t==='m'}
function objective(q){return isObjective(q)}
function isSubjective(q){return !objective(q)}
function answerUnavailable(q){const a=String(q?.ans??'').trim();return !a||/^\[(?:答案未见|辨认不清|答案待核|答案禁用|答案来源错配)/.test(a)||/待核|待对照.*复核|禁用|错配/.test(a)}
function scorable(q){return !answerUnavailable(q)}
function answeredCount(p){return activeItems(p).filter(hasAnswer).length}
function statusFor(p){if(p.available===false)return 'unavailable';const s=load(p);if(s.status==='done')return 'done';if(s.status==='submitted')return 'submitted';const n=Object.keys(s.answers||{}).length+Object.keys(s.text||{}).length+Object.keys(s.strokes||{}).length+Object.keys(s.punct||{}).length;return n?'progressing':'new'}
function statusText(s){return s==='done'?'已完成':s==='submitted'?'已交卷':s==='progressing'?'进行中':s==='unavailable'?'转录中':'未做'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rich(v,simplify=false){if(simplify&&appState.paper?.subject==='gdhy'&&appState.gdhySimple)v=SIMPLE_MAP[String(v)]||v;return esc(v).replace(/⟪([^⟫]+)⟫/g,'<em class=\"emph\">$1</em>')}

function anaBlock(q){if(!q.ana)return '';const tag=q.anaAI?'<span class="ana-tag">AI 解析 · 仅供参考</span>':q.anaSource?`<span class="ana-tag source">来源：${esc(q.anaSource)}</span>`:'';return `<div class="ana">${tag}<strong>解析：</strong>${rich(q.ana)}</div>`}
function scorePaper(p){let got=0,total=0,unscored=0,objectiveGot=0,objectiveTotal=0,subjectiveGot=0,subjectiveTotal=0;for(const q of activeItems(p)){if(!scorable(q)){unscored++;continue}if(objective(q)){objectiveTotal+=q.score||0;total+=q.score||0;if(appState.answers[qKey(q)]&&appState.answers[qKey(q)]===q.ans){got+=q.score||0;objectiveGot+=q.score||0}}else{subjectiveTotal+=q.score||0;total+=q.score||0;const value=Number(appState.scores[qKey(q)]||0);got+=value;subjectiveGot+=value}}return {got,total,unscored,objectiveGot,objectiveTotal,subjectiveGot,subjectiveTotal}}
function objectiveAvailable(p){return activeItems(p).filter(q=>objective(q)&&!q.ans).length===0}
function scoreSection(sec){let got=0,total=0,unscored=0;const visit=(q,parent)=>{if(q.t==='r'){(q.subs||[]).forEach(sub=>visit(sub,q.n));return}if(parent!==undefined)q=Object.assign({},q,{parent});if(appState.paper.subject==='marx'&&q.n>=31&&q.n<=33&&!appState.essayChoice[qKey(q)])return;if(!scorable(q)){unscored++;return}if(objective(q)){total+=q.score||0;if(appState.answers[qKey(q)]===q.ans)got+=q.score||0}else{total+=q.score||0;got+=Number(appState.scores[qKey(q)]||0)}};(sec.items||[]).forEach(q=>visit(q));return {got,total,unscored}}
function renderScoreBreakdown(p){return `<div class="card"><strong>各大题得分</strong>${p.sections.map(s=>{const x=scoreSection(s);return `<div class="section-score"><span>${esc(s.title)}</span><span>${x.got}/${x.total}分${x.unscored?` · ${x.unscored}题答案待核`:''}</span></div>`}).join('')}</div>`}
function availableSubjects(){return PAPERS.filter(p=>p.available!==false)}
function reviewStatus(){const list=availableSubjects();return list.filter(p=>statusFor(p)==='done').length}
function render(){document.documentElement.classList.toggle('dark',localStorage.getItem('zk:dark')==='1');document.documentElement.style.fontSize='16px';const root=document.getElementById('app');if(appState.view==='home')root.innerHTML=home();else if(appState.view==='subject')root.innerHTML=subject();else root.innerHTML=exam();bind();}
function topNav(title,back){return `<div class="topbar">${back?`<button class="back" data-action="back">‹ 返回</button>`:''}<h1>${esc(title)}</h1><div class="topbar-tools">${appState.view==='exam'&&appState.paper?.subject==='gdhy'?`<button class="btn" data-action="simple">${appState.gdhySimple?'简':'繁'}</button>`:''}<button class="btn" id="darkBtn">◐</button></div></div>`}
function home(){return topNav('做点题',false)+`<main class="wrap"><div class="grid">${Object.entries(SUBJECTS).map(([id,s])=>`<button class="card subject-card" data-subject="${id}"><div><div class="eyebrow">${s.code}</div><h3>${s.name}</h3></div></button>`).join('')}</div></main>`}
function subject(){const s=SUBJECTS[appState.subject],ps=PAPERS.filter(p=>p.subject===appState.subject).sort((a,b)=>a.session.localeCompare(b.session));return topNav(s.name,true)+`<main class="wrap"><div class="section-title"><div><h2>${s.name}</h2><small>${s.code} · ${ps.length}套</small></div></div><div class="paper-list">${ps.map(p=>{const st=statusFor(p),sc=load(p);let score='';if(st==='done'){const old=[appState.paper,appState.answers,appState.scores];appState.paper=p;appState.answers=sc.answers||{};appState.scores=sc.scores||{};score=' · '+scorePaper(p).got+'分';[appState.paper,appState.answers,appState.scores]=old}return `<button class="paper-row" data-paper="${p.paper}" ${p.available===false?'aria-disabled="true"':''}><span class="label">${sessionLabel(p.session)}</span><span class="meta">${p.available===false?'原卷待补':(p.sections||[]).reduce((n,x)=>n+(x.items||[]).length,0)+'题'+score}</span><span class="status ${st}">${statusText(st)}</span></button>`}).join('')}</div></main>`}
function nav(p){return `<div class="nav-grid">${allItems(p).map((q,i)=>`<button data-cursor="${i}" data-target="q-${qKey(q)}" class="${hasAnswer(q)?'answered ':''}${i===appState.cursor?'current':''}">${q.n}</button>`).join('')}</div>`}
function renderObjective(q,review=false){const chosen=appState.answers[qKey(q)]||'',key=String(q.ans||''),verified=scorable(q);return `<div class="opts">${(q.opts||[]).map((o,i)=>{const letter=LETTERS[i],sel=q.t==='m'?chosen.includes(letter):chosen===letter,correct=review&&verified&&key.includes(letter),wrong=review&&verified&&sel&&!correct;return `<button class="opt ${sel?'sel':''} ${correct?'correct-opt':''} ${wrong?'wrong-opt':''}" data-q="${qKey(q)}" data-letter="${letter}" data-multi="${q.t==='m'}" ${review?'disabled':''}><span class="letter">${letter}.</span><span>${rich(o,appState.paper?.subject==='gdhy')}</span></button>`}).join('')}</div>`}
function canvas(q){return `<textarea class="answer-box" data-text="${qKey(q)}" placeholder="在此作答（Apple Pencil 直接书写会自动转为文字）">${esc(appState.text[qKey(q)]||'')}</textarea>`}
function reviewWriting(q){const text=appState.text[qKey(q)]||'';return `<div class="review-writing">${text?`<div class="answer-note">${esc(text)}</div>`:`<div class="answer-note">未填写文字作答</div>`}</div>`}
function punctEditor(q){const chars=Array.from(q.passage||''),marks=appState.punct?.[qKey(q)]||{};return `<div class="punct-passage">${chars.map((ch,i)=>`${rich(ch,appState.paper?.subject==='gdhy')}<button class="punct-gap" data-punct-gap="${i}" data-q="${qKey(q)}">${esc(marks[i]||'　')}</button>`).join('')}</div><div class="punct-toolbar">${['，','。','！','？','：','；','、','“','”','‘','’','《','》','〈','〉','（','）','：“','“”','‘’','《》','（）'].map(m=>`<button data-punct-mark="${esc(m)}" data-q="${qKey(q)}">${esc(m)}</button>`).join('')}<button data-punct-delete="1" data-q="${qKey(q)}">⌫</button></div>`}
function shownPunctuation(q){const chars=Array.from(q.passage||''),marks=appState.punct?.[qKey(q)]||{};return chars.map((ch,i)=>ch+(marks[i]||'')).join('')}
function punctuationReview(q){return `<div class="answer-note"><strong>我的标点：</strong>${rich(shownPunctuation(q))}</div><div class="answer-note"><strong>参考标点：</strong>${rich(q.ans||'')}</div>`}
function renderReading(q,review){return `<div class="question reading" id="q-${q.n}"><div class="q-head"><span class="q-number">${q.n}</span><span class="stem">阅读原文</span></div><div class="passage">${rich(q.passage||'',appState.paper?.subject==='gdhy')}</div>${(q.subs||[]).map(sub=>question(Object.assign({},sub,{parent:q.n}),review)).join('')}</div>`}
function question(q,review=false){if(q.t==='r')return renderReading(q,review);const instr=q.grp?`<div class="q-instr">${esc(q.grp)}</div>`:'';const stemNoInstr=String(q.stem||'').replace(/^（[一二三四五六七八九十]+）[^。]*。/,'');if(q.t==='p')return `<div class="question" id="q-${qKey(q)}">${instr}<div class="q-head"><span class="q-number">${q.n}</span><span class="stem">${rich(q.stem,appState.paper?.subject==='gdhy')}</span></div><div class="passage">${rich(q.passage||'',appState.paper?.subject==='gdhy')}</div>${review?`${punctuationReview(q)}${reviewWriting(q)}${anaBlock(q)}${scorePicker(q,scorable(q))}`:punctEditor(q)}</div>`;const ans=appState.answers[qKey(q)]||'',cls=review&&objective(q)&&scorable(q)?(ans===q.ans?'correct':'wrong'):'';const essay=(appState.paper.subject==='marx'&&q.n>=31&&q.n<=33);let body;if(objective(q)){body=renderObjective(q,review);if(review)body+=`<div class="answer-note"><strong>正确答案：</strong>${scorable(q)?rich(q.ans):'答案未核实，不计自动分'} · ${scorable(q)?(ans===q.ans?(q.score||0):0)+'/'+(q.score||0)+'分':'不计分'}</div>${anaBlock(q)}`}else if(review){body=`<div class="answer-compare"><div><strong>我的作答</strong>${reviewWriting(q)}</div><div><strong>参考答案</strong><div class="answer-note">${scorable(q)?rich(q.ans):'本题答案尚未核实，不计入总分。'}</div>${anaBlock(q)}</div></div>${scorable(q)?scorePicker(q,appState.status!=='done'):''}`}else{body=canvas(q)}return `<div class="question ${cls}" id="q-${qKey(q)}">${instr}<div class="q-head"><span class="q-number">${q.n}</span><span class="stem">${rich(stemNoInstr||q.stem,appState.paper?.subject==='gdhy')}</span></div>${essay&&!review?`<label class="essay-choice ${appState.essayChoice[qKey(q)]?'chosen':''}"><input type="checkbox" data-essay="${qKey(q)}" ${appState.essayChoice[qKey(q)]?'checked':''}> 选答此题（论述题需选答2题）</label>`:''}${body}</div>`}
function scorePicker(q,enabled=true){const max=q.score||0;return `<div class="score-row"><span>自评：</span>${Array.from({length:max+1},(_,i)=>`<button ${enabled?'':'disabled'} class="${Number(appState.scores[qKey(q)])===i?'active':''}" data-score="${qKey(q)}" data-value="${i}">${i}</button>`).join('')}<span>/${max}</span></div>`}
function sectionContent(sec,review){const sectionPassage=sec.passage?`<div class="passage">${rich(sec.passage,appState.paper?.subject==='gdhy')}</div>`:'';return `<section class="question-section"><h3>${esc(sec.title)}</h3><div class="meta">${esc(sec.meta||'')}</div>${sectionPassage}${(sec.items||[]).map(q=>question(q,review)).join('')}</section>`}
function safeNotes(p){return []}
function exam(){const p=appState.paper,review=appState.mode==='review',chosen=Object.values(appState.essayChoice||{}).filter(Boolean).length;const s=review?scorePaper(p):null;const done=appState.status==='done';const bar=`<div class="float-bar ${appState.navCompact?'compact':''}"><button class="float-toggle" data-action="toggle-nav" aria-label="${appState.navCompact?'展开答题卡':'收起答题卡'}" aria-expanded="${!appState.navCompact}">${appState.navCompact?'答题卡':'收起'}</button>${nav(p)}${review?(done?'':`<button class="btn primary" data-action="complete">完成</button>`):`<button class="btn primary" data-action="submit">交卷</button>`}</div>`;const rollback=done?`<button class="btn" data-action="rollback-exam">退回作答</button><button class="btn" data-action="rollback-review">重新自评</button>`:'';return topNav(sessionLabel(p.session),true)+bar+`<main class="wrap ${review?'review':''}"><div class="exam-head"><div><h2>${esc(sessionLabel(p.session))}</h2><p>${SUBJECTS[p.subject]?.name||p.subject} · ${p.code||''}</p></div><div class="toolbar">${rollback}${review?`<button class="btn" data-action="redo">重做</button>`:''}</div></div>${review?`<div class="result"><div><div class="eyebrow">${done?'已完成':'客观题'}</div><strong>${done?s.got:s.objectiveGot}<small>/${done?s.total:s.objectiveTotal}</small></strong></div><div class="answer-note">${done?`客观 ${s.objectiveGot} · 主观自评 ${s.subjectiveGot}`:'主观题请在下方逐题自评，完成后点"完成"查看总分'}</div></div>${done?renderScoreBreakdown(p):''}`:`<div class="result"><div><div class="eyebrow">进度</div><strong>${answeredCount(p)}</strong>/${activeItems(p).length}</div><div class="answer-note">${p.subject==='marx'?`论述题已选 ${chosen}/2 · `:''}答案交卷后显示</div></div>`}${(p.sections||[]).map(sec=>sectionContent(sec,review)).join('')}</main>`}
function bind(){document.querySelectorAll('[data-subject]').forEach(x=>x.onclick=()=>{appState.view='subject';appState.subject=x.dataset.subject;window.scrollTo(0,0);render()});document.querySelectorAll('[data-paper]').forEach(x=>x.onclick=()=>{const p=PAPERS.find(z=>z.paper===x.dataset.paper);if(!p||p.available===false){alert('此卷题面资料不完整，暂不可作答。');return}appState.paper=p;const data=load(p);Object.assign(appState,{view:'exam',mode:data.status==='submitted'||data.status==='done'?'review':'exam',cursor:0,answers:data.answers||{},strokes:data.strokes||{},text:data.text||{},scores:data.scores||{},essayChoice:data.essayChoice||{},punct:data.punct||{},status:data.status||'new'});window.scrollTo(0,0);render()});document.querySelectorAll('[data-action=back]').forEach(x=>x.onclick=()=>{if(appState.view==='exam'){save();appState.view='subject';appState.mode='exam'}else appState.view='home';window.scrollTo(0,0);render()});document.querySelectorAll('[data-letter]').forEach(x=>x.onclick=()=>{if(appState.mode==='review')return;const n=x.dataset.q;if(x.dataset.multi){let v=appState.answers[n]||'';v=v.includes(x.dataset.letter)?v.replace(x.dataset.letter,''):(v+x.dataset.letter).split('').sort().join('');appState.answers[n]=v}else appState.answers[n]=x.dataset.letter;appState.status='progress';save();render()});document.querySelectorAll('[data-cursor]').forEach(x=>x.onclick=()=>{appState.cursor=Number(x.dataset.cursor);document.getElementById(x.dataset.target)?.scrollIntoView({behavior:'smooth',block:'center'});render()});document.querySelectorAll('[data-action=toggle-nav]').forEach(x=>x.onclick=()=>{appState.navCompact=!appState.navCompact;render()});document.querySelectorAll('[data-score]').forEach(x=>x.onclick=()=>{if(appState.status==='done')return;appState.scores[x.dataset.score]=Number(x.dataset.value);save();render()});document.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{appState.text[x.dataset.text]=x.value;save()});document.querySelectorAll('[data-punct-gap]').forEach(x=>x.onclick=()=>{appState.punctActive={q:x.dataset.q,i:Number(x.dataset.punctGap)};document.querySelectorAll('.punct-gap').forEach(y=>y.classList.toggle('active',y===x))});document.querySelectorAll('[data-punct-mark]').forEach(x=>x.onclick=()=>{const a=appState.punctActive;if(!a||a.q!==x.dataset.q)return;const map=appState.punct[a.q]||(appState.punct[a.q]={});map[a.i]=(map[a.i]||'')+x.dataset.punctMark;save();render()});document.querySelectorAll('[data-punct-delete]').forEach(x=>x.onclick=()=>{const a=appState.punctActive;if(!a||a.q!==x.dataset.q)return;const map=appState.punct[a.q]||(appState.punct[a.q]={}),marks=Array.from(map[a.i]||'');marks.pop();if(marks.length)map[a.i]=marks.join('');else delete map[a.i];save();render()});document.querySelectorAll('[data-essay]').forEach(x=>x.onchange=()=>{appState.essayChoice[x.dataset.essay]=x.checked;save();render()});document.querySelectorAll('[data-action=submit]').forEach(x=>x.onclick=submit);document.querySelectorAll('[data-action=complete]').forEach(x=>x.onclick=complete);document.querySelectorAll('[data-action=rollback-exam]').forEach(x=>x.onclick=()=>{if(appState.status!=='done')return;appState.text={};appState.strokes={};appState.punct={};appState.scores={};appState.status='progress';appState.mode='exam';appState.cursor=0;appState.navCompact=true;save();window.scrollTo(0,0);render()});document.querySelectorAll('[data-action=rollback-review]').forEach(x=>x.onclick=()=>{if(appState.status!=='done')return;appState.scores={};appState.status='submitted';appState.mode='review';appState.cursor=0;appState.navCompact=true;save();window.scrollTo(0,0);render()});document.querySelectorAll('[data-action=redo]').forEach(x=>x.onclick=redo);document.querySelectorAll('[data-action=simple]').forEach(x=>x.onclick=()=>{appState.gdhySimple=!appState.gdhySimple;localStorage.setItem('zk:gdhy-simple',appState.gdhySimple?'1':'0');render()});document.getElementById('darkBtn')?.addEventListener('click',()=>{localStorage.setItem('zk:dark',localStorage.getItem('zk:dark')==='1'?'0':'1');render()})}
function setupCanvas(c){const id=c.dataset.canvas,ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineWidth=3;let drawing=false,current=[];const scale=()=>({x:c.width/c.getBoundingClientRect().width,y:c.height/c.getBoundingClientRect().height});const point=e=>{const r=c.getBoundingClientRect(),s=scale();return {x:(e.clientX-r.left)*s.x,y:(e.clientY-r.top)*s.y,p:e.pressure||.5}};const redraw=()=>{ctx.clearRect(0,0,c.width,c.height);for(const st of appState.strokes[id]||[]){ctx.beginPath();st.forEach((p,i)=>{if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)});ctx.stroke()}};redraw();if(c.dataset.readonly)return;c.onpointerdown=e=>{if(e.pointerType!=='pen'&&e.pointerType!=='mouse')return;drawing=true;current=[point(e)];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const p=point(e);current.push(p);ctx.beginPath();const a=current[current.length-2];ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=2+4*p.p;ctx.stroke()};c.onpointerup=()=>{if(!drawing)return;drawing=false;(appState.strokes[id]||(appState.strokes[id]=[])).push(current);save()}}
function submit(){const p=appState.paper;if(p.subject==='marx'&&Object.values(appState.essayChoice||{}).filter(Boolean).length!==2){alert('马克思论述题请恰好选择2题作答。');return}const missing=activeItems(p).filter(q=>!hasAnswer(q));if(missing.length&&!confirm(`还有 ${missing.length} 道题未作答，仍然交卷吗？`))return;appState.status='submitted';save();appState.mode='review';appState.cursor=0;appState.navOpen=false;window.scrollTo(0,0);render()}
function complete(){if(appState.status==='done'){appState.view='subject';appState.mode='exam';window.scrollTo(0,0);render();return}const p=appState.paper,subjective=activeItems(p).filter(q=>isSubjective(q)&&scorable(q)),missing=subjective.filter(q=>appState.scores[qKey(q)]===undefined);if(missing.length&&!confirm(`还有 ${missing.length} 道主观题未自评，仍然二次提交吗？`))return;if(!confirm('二次提交并标记本卷完成？完成后作答不可修改。'))return;appState.status='done';save();window.scrollTo(0,0);render()}
function redo(){if(!confirm('清空这套卷的作答、笔迹和自评分数？'))return;localStorage.removeItem(key(appState.paper));const p=appState.paper,data=load(p);Object.assign(appState,data,{view:'exam',mode:'exam',cursor:0,navOpen:true});render()}
