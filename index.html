utton.study{border-color:color-mix(in srgb,var(--gold) 48%,var(--line));color:var(--gold)}.stepper{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}.stepper button{width:34px;height:34px;padding:0;border-radius:50%;font-size:19px;line-height:1}.stepper output{min-width:43px;text-align:center;color:var(--ink);font-weight:650}.quiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:13px 0 19px}.quiz-title{margin:0;font:600 26px var(--serif)}.quiz-meta{margin-top:4px;color:var(--muted);font-size:12px}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}.question-area{min-width:0}.question-card{padding:23px 25px;margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);scroll-margin-top:24px}.question-card.current{border-color:var(--line2)}.question-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.question-number{color:var(--accent);font-size:12px;font-weight:700}.question-kind{padding:3px 8px;border-radius:999px;background:var(--paper2);color:var(--muted);font-size:11px}.question-prompt{margin:0 0 17px;font-size:17px;font-weight:600;line-height:1.65}.options{display:grid;gap:8px}.option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}.option:hover{border-color:var(--accent)}.option input{accent-color:var(--accent);margin:4px 0 0;flex:0 0 auto}.option.selected{border-color:var(--accent);background:var(--wash)}.option.correct{border-color:var(--good);background:var(--goodWash)}.option.wrong{border-color:var(--bad);background:var(--badWash)}.option-key{font-weight:700;color:var(--muted);min-width:20px}.answer-input,.written-answer{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--page);color:var(--ink);padding:12px 14px}.written-answer .subject-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
.subject-card{display:block;min-height:0;padding:0;overflow:hidden;text-align:left}
.subject-card:hover{transform:none}
.subject-main{width:100%;display:block;padding:21px 22px 16px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.subject-main:hover .subject-name{color:var(--accent)}
.subject-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.subject-name{font:600 23px var(--serif)}
.subject-count{color:var(--muted);font-size:12px;white-space:nowrap}
.subject-source{margin-top:5px;color:var(--muted);font-size:12px}
.subject-meta{display:flex;align-items:center;justify-content:space-between;margin-top:15px;color:var(--muted);font-size:12px}
.subject-action{color:var(--accentDeep);font-weight:600}
.subject-actions{border-top:1px solid var(--line);display:flex}
.list-toggle{width:100%;height:42px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.list-toggle:hover{background:var(--paper2)}
.chevron{width:9px;height:9px;border-right:1.5px solid var(--soft);border-bottom:1.5px solid var(--soft);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.subject-card.expanded .chevron{transform:rotate(225deg) translate(-2px,-2px)}
.type-list{display:none;border-top:1px solid var(--line);padding:7px 12px}
.subject-card.expanded .type-list{display:grid}
.type-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.type-option:last-child{border-bottom:0}
.type-option:hover,.type-option.selected{background:var(--wash);color:var(--accentDeep)}
.type-option span:last-child{color:var(--muted);font-size:12px}
.setup-strip{position:relative;margin:18px 0 0;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}
.setup-inner{width:min(1180px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.setup-course{display:grid;gap:2px;min-width:160px;color:var(--muted);font-size:11px}
.setup-course strong{color:var(--ink);font-size:15px}
.setup-mode{display:flex;align-items:center;gap:6px}
.setup-label{color:var(--muted);font-size:12px;margin-right:4px}
.mode-choice{border:1px solid var(--line2);border-radius:999px;padding:8px 13px;background:var(--paper);cursor:pointer;font-size:13px}
.mode-choice.active{border-color:var(--accent);background:var(--wash);color:var(--accentDeep);font-weight:650}
.setup-quantity{display:grid;gap:8px;min-width:270px;flex:1}.setup-quantity-caption{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.setup-quantity-caption strong{font-size:13px;color:var(--ink)}.setup-hint{font-size:11px;color:var(--muted)}.quantity-options{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:thin}.quantity-choice{min-width:35px;padding:6px 9px;border:1px solid var(--line2);border-radius:999px;background:var(--paper);color:var(--soft);cursor:pointer;font-size:12px}.quantity-choice:hover{border-color:var(--accent)}.quantity-choice.active{border-color:var(--accent);background:var(--wash);color:var(--accentDeep);font-weight:700}.setup-start{white-space:nowrap}.type-option.selected{box-shadow:inset 3px 0 var(--accent);font-weight:650}.type-option:active,.list-toggle:active{background:var(--wash)}.setup-inner{align-items:flex-start}.setup-mode{padding-top:3px}

<div class="shell">

</main>
</div>

Max":74},{"id":"当代文思-4","title":"章节练习(1章)","questions":[{"n":1,"type":"single","prompt":"较早运用“文学思潮”进行文学史或文学理论研究的学者不包括以下哪位","options":[{"key":"A","text":"丹麦学者勃兰兑斯"},{"key":"B","text":"法国学者梵·第根"},{"key":"C","text":"意大利学者马里赛·普拉兹"},{"key":"D","text":"中国学者茅盾"}],"key":"D","answer":"中国学者茅盾","max":1,"id":"当代文思-4-single-1"},{"n":2,"type":"single","prompt":"20世纪初,将“文学思潮”概念引入中国文学研究的重要媒介是","options":[{"key":"A","text":"西方传教士的译著"},{"key":"B","text":"日本学者的相关著作"},{"key":"C","text":"中国学者的自主探索"},{"key":"D","text":"苏联的文艺理论教材"}],"key":"B","answer":"日本学者的相关著作","max":1,"id":"当代文思-4-single-2"},{"n":3,"type":"single","prompt":"刘增杰在相关著作中分析,导致人们对“文学思潮”概念不同解释的出发点至少有几种","options":[{"key":"A","text":"三种"},{"key":"B","text":"四种"},{"key":"C","text":"五种"},{"key":"D","text":"六种"}],"key":"C","answer":"五种","max":1,"id":"当代文思-4-single-3"},{"n":4,"type":"single","prompt":"20世纪80年代以前,中国当代文学研究中界定“文学思潮”主要侧重的角度是","options":[{"key":"A","text":"文学创作实践角度"},{"key":"B","text":"文学思潮与社会思潮的关系角度"},{"key":"C","text":"文学内部的创作纲领角度"},{"key":"D","text":"文学的审美观念角度"}],"key":"B","answer":"文学思潮与社会思潮的关系角度","max":1,"id":"当代文思-4-single-4"},{"n":5,"type":"single","prompt":"《中国大百科全书·中国文学》卷中对“文学思潮”的定义,未强调的要素是","options":[{"key":"A","text":"特定历史时期"},{"key":"B","text":"特定地域"},{"key":"C","text":"与经济变革的适应"},{"key":"D","text":"作家的个人风格"}],"key":"D","answer":"作家的个人风格","max":1,"id":"当代文思-4-single-5"},{"n":6,"type":"single","prompt":"席扬认为迄今为止有关文学思潮的概念界说大致可归纳为几种类型","options":[{"key":"A","text":"两种"},{"key":"B","text":"三种"},{"key":"C","text":"四种"},{"key":"D","text":"五种"}],"key":"B","answer":"三种","max":1,"id":"当代文思-4-single-6"},{"n":7,"type":"single","prompt":"卢铁澎教授强调,人们对文学思潮的理解至少有几种意义选择","options":[{"key":"A","text":"两种"},{"key":"B","text":"三种"},{"key":"C","text":"四种"},{"key":"D","text":"五种"}],"key":"B","answer":"三种","max":1,"id":"当代文思-4-single-7"},{"n":8,"type":"single","prompt":"严家炎认为,研究清楚文学思潮的意义在于","options":[{"key":"A","text":"能直接提升作家的创作水平"},{"key":"B","text":"能使文学史上很多问题迎刃而解"},{"key":"C","text":"能快速推动文学理论的创新"},{"key":"D","text":"能立即改变文学的发展方向"}],"key":"B","answer":"能使文学史上很多问题迎刃而解","max":1,"id":"当代文思-4-single-8"},{"n":9,"type":"single","prompt":"以下对“文学思潮”的界定,概括性较强且从抽象化角度出发的是","options":[{"key":"A","text":"文艺思潮是社会思潮中的重要组成部分"},{"key":"B","text":"文学思潮是某个历史阶段社会思潮的特殊形态"},{"key":"C","text":"文学思潮是特定历史时期文学活动系统中受某种文学规范体系所支配的群体性思想趋向"},{"key":"D","text":"文学思潮是与社会经济变革和精神需求相适应的文学思想潮流"}],"key":"C","answer":"文学思潮是特定历史时期文学活动系统中受某种文学规范体系所支配的群体性思想趋向","max":1,"id":"当代文思-4-single-9"},{"n":10,"type":"single","prompt":"文学思潮的“群体性”特质不包括以下哪个层面的聚合","options":[{"key":"A","text":"文学创作层面"},{"key":"B","text":"文学理论层面"},{"key":"C","text":"文学批评层面"},{"key":"D","text":"文学市场销售层面"}],"key":"D","answer":"文学市场销售层面","max":1,"id":"当代文思-4-single-10"},{"n":11,"type":"single","prompt":"文学思潮的“动态性”主要不体现在以下哪个方面","options":[{"key":"A","text":"有发生、发展、结束的完整过程"},{"key":"B","text":"创作、理论等层面作用不一致"},{"key":"C","text":"文学思潮的名称始终固定不变"},{"key":"D","text":"人们对其理解存在动态变化"}],"key":"C","answer":"文学思潮的名称始终固定不变","max":1,"id":"当代文思-4-single-11"},{"n":12,"type":"single","prompt":"文学思潮的“历史性”特征不包括","options":[{"key":"A","text":"受制于特定历史文化环境"},{"key":"B","text":"具有历史性的地域特征"},{"key":"C","text":"对文学史发展无重要影响"},{"key":"D","text":"与特定历史时期的社会思想等相关"}],"key":"C","answer":"对文学史发展无重要影响","max":1,"id":"当代文思-4-single-12"},{"n":13,"type":"single","prompt":"韦勒克认为文学思潮可以理解为一种","options":[{"key":"A","text":"单纯的思想潮流"},{"key":"B","text":"包含某种规则的观念"},{"key":"C","text":"纯粹的创作潮流"},{"key":"D","text":"仅与社会思潮相关的现象"}],"key":"B","answer":"包含某种规则的观念","max":1,"id":"当代文思-4-single-13"},{"n":14,"type":"single","prompt":"卢铁澎认为文学思潮的复杂性不体现在以下哪个方面","options":[{"key":"A","text":"矛盾性"},{"key":"B","text":"继承性"},{"key":"C","text":"单一性"},{"key":"D","text":"模糊性"}],"key":"C","answer":"单一性","max":1,"id":"当代文思-4-single-14"},{"n":15,"type":"single","prompt":"文学思潮与创作风格的区别,不包括","options":[{"key":"A","text":"指涉范畴不一样"},{"key":"B","text":"形成方式不一样"},{"key":"C","text":"关注目标不一样"},{"key":"D","text":"都具有高度抽象性"}],"key":"D","answer":"都具有高度抽象性","max":1,"id":"当代文思-4-single-15"},{"n":16,"type":"fill","prompt":"在文学研究领域,“文学思潮”是一个出现较晚却使用频率极高的概念,其定义众说纷纭,内涵与外延也较为宽泛,很难形成一种严谨而科学的 ______ 。","options":[],"key":"精确界定","answer":"精确界定","max":2,"id":"当代文思-4-fill-16"},{"n":17,"type":"fill","prompt":"20世纪二三十年代,中国学者开始自编中国文学思潮史和介绍西方文学思潮,仅这一时期就出现了黄忏华的《近代文艺思潮》、茅盾的《西洋文学通论》等多部 ______ 。","options":[],"key":"专著","answer":"专著","max":2,"id":"当代文思-4-fill-17"},{"n":18,"type":"fill","prompt":"刘增杰在《云起云飞--20世纪中国文学思潮研究透视》一书中分析到,至少有五种不同的出发点导致了人们对“文学思潮”这一概念的 ______ 。","options":[],"key":"不同解释","answer":"不同解释","max":2,"id":"当代文思-4-fill-18"},{"n":19,"type":"fill","prompt":"在20世纪80年代以前的中国当代文学研究中,人们基本上都是从文学思潮与社会思潮的关系角度来界定“文学思潮”,强调文学思潮是(社会思想 ______ )的产物。","options":[],"key":"即意识形态化的观念","answer":"即意识形态化的观念","max":2,"id":"当代文思-4-fill-19"},{"n":20,"type":"fill","prompt":"席扬指出,三类“文学思潮”概念界说在范畴和逻辑架构上的不同,其实质是与研究主体 “ ______ ”模式的差异密切相关。","options":[],"key":"认知","answer":"认知","max":2,"id":"当代文思-4-fill-20"},{"n":21,"type":"fill","prompt":"卢铁澎教授强调,除了三种意义在日常运用中常被混淆之外,还有将文学思潮与一般文学思想、文学观点等社会思潮 ______ 的现象。","options":[],"key":"混同","answer":"混同","max":2,"id":"当代文思-4-fill-21"},{"n":22,"type":"fill","prompt":"文学思潮首先是一种“思潮”,既然是“思潮”,就具有群体性、动态性特质,并与特定历史时期的 ______ 密切关联。","options":[],"key":"社会文化思潮","answer":"社会文化思潮","max":2,"id":"当代文思-4-fill-22"},{"n":23,"type":"fill","prompt":"文学思潮的“群体性”,是由文学思潮内在的核心观念或思想系统 ______ 而成的一种聚合体。","options":[],"key":"统摄","answer":"统摄","max":2,"id":"当代文思-4-fill-23"},{"n":24,"type":"fill","prompt":"文学思潮的“动态性”,是指文学思潮不是天然形成的、固态化的存在,而是拥有极为丰富的内在的 ______ 。","options":[],"key":"动态性特征","answer":"动态性特征","max":2,"id":"当代文思-4-fill-24"},{"n":25,"type":"fill","prompt":"任何一种文学思潮都是在特定历史境域中产生的,也是特定的地域性 ______ 发展的产物。","options":[],"key":"历史文化","answer":"历史文化","max":2,"id":"当代文思-4-fill-25"},{"n":26,"type":"fill","prompt":"梁启超在《清代学术概论》里曾说道:“凡‘思’非皆能成‘潮’,能成‘潮’者,则其‘思’必有相当之价值,而又适合于其 ______ 者也。”","options":[],"key":"时代之要求","answer":"时代之要求","max":2,"id":"当代文思-4-fill-26"},{"n":27,"type":"fill","prompt":"卢铁澎认为,文学思潮的复杂性,主要体现在它的矛盾性、继承性和 ______ 三个方面。","options":[],"key":"模糊性","answer":"模糊性","max":2,"id":"当代文思-4-fill-27"},{"n":28,"type":"term","prompt":"文学思潮","options":[],"key":"","answer":"文学思潮指特定历史时期受社会文化影响、适应社会变革与艺术创新需求而形成的文学思想潮流,具有群体性、动态性、历史性、观念性、复杂性特点,涵盖创作、理论、批评与接受等层面,是文学观念与审美追求的集中体现。","max":4,"id":"当代文思-4-term-28"},{"n":29,"type":"term","prompt":"创作本位论","options":[],"key":"","answer":"创作本位论是席扬归纳的文学思潮概念界说类型之一,侧重从文学创作实践角度界定文学思潮,将创作倾向、作品内涵与风格等创作层面的表现作为核心依据,强调以创作实践为基点把握文学思潮的内涵。","max":4,"id":"当代文思-4-term-29"},{"n":30,"type":"term","prompt":"多元存在论","options":[],"key":"","answer":"多元存在论是席扬归纳的文学思潮概念界说类型之一,认为文学思潮并非单一形态,而是在多个维度、多个层面上呈多元存在状态,既包括创作层面的表现,也涵盖理论、批评、接受等内容,强调从整体上把握其多元构成。","max":4,"id":"当代文思-4-term-30"},{"n":31,"type":"term","prompt":"抽象外在论","options":[],"key":"","answer":"抽象外在论是席扬归纳的文学思潮概念界说类型之一,将文学思潮视为一种抽象、外在的存在,不注重从文学内部的创作、理论等实践层面去界定,而从外部的抽象观念、思想体系角度阐释,突出外在观念对文学思潮的决定作用。","max":4,"id":"当代文思-4-term-31"},{"n":32,"type":"term","prompt":"文学思潮的群体性","options":[],"key":"","answer":"文学思潮的群体性指其由内在核心观念或思想系统统摄,形成涵盖创作、理论、批评、接受等层面的聚合态势,需一定数量个体在文学实践中自觉参与,以大致相同的审美主张推动发展,最终形成文学潮流。","max":4,"id":"当代文思-4-term-32"},{"n":33,"type":"term","prompt":"文学思潮的动态性","options":[],"key":"","answer":"文学思潮的动态性是文学思潮的重要特点之一,指它并非天然形成、固态化的存在,主要体现为有发生、发展、结束的完整时间过程,各层面作用不一致且充满“变量”,人们对其理解也存在动态变化,需动态跟踪其发展。","max":4,"id":"当代文思-4-term-33"},{"n":34,"type":"short","prompt":"简要概括20世纪80年代以前中国当代文学研究中对“文学思潮”界定的特点。","options":[],"key":"","answer":"20世纪80年代以前,相关界定主要从文学思潮与社会思潮的关系出发,强调它是意识形态化观念的产物,甚至将其视为社会思潮的组成部分或特殊形态;认为它是社会思潮的“反映” 或“表现”,突出其与社会意识形态的紧密关联,忽略文学自身的独立性与内在规律。","max":6,"id":"当代文思-4-short-34"},{"n":35,"type":"short","prompt":"简述文学思潮与创作风格的主要区别。","options":[],"key":"","answer":"一是指涉范畴不同:文学思潮是综合性、系统性的文学实践,涵盖创作、理论、批评、接受等;创作风格主要指具体创作领域。二是形成方式不同:文学思潮受社会文化思潮影响,动态复杂;创作风格大多自然形成,稳定延续。三是关注目标不同:文学思潮关注宏观文学史意义的变化,创作风格关注作品本身。","max":6,"id":"当代文思-4-short-35"},{"n":36,"type":"short","prompt":"简要说明文学思潮的复杂性主要体现的方面。","options":[],"key":"","answer":"文学思潮的复杂性体现在形成发展过程与理论认知两方面。形成方面,需创作、批评、理论和阅读等各层面有效整合,整合无固定范式,有时呈创作自发性、理论先导性或阅读消费性需求;理论认知方面,它与流派、风格等联系紧密,导致判断、归纳和命名存在差异,理解与阐释也不同。","max":6,"id":"当代文思-4-short-36"},{"n":37,"type":"essay","prompt":"论述文学思潮的特点。","options":[],"key":"","answer":"一、群体性:由核心观念统摄,形成涵盖创作、理论、批评、接受的聚合体,需一定数量个体参与。 二、动态性:有发生、发展、结束的完整过程,各层面作用不一,充满“变量”。 三、历史性:产生发展受制于特定历史文化环境,是文学史发展的路标。 四、观念性:本质是抽象、被命名的存在,需理论化命名。 五、复杂性:形成发展繁复,整合无固定范式,与其他概念联系紧密而有差异。","max":10,"id":"当代文思-4-essay-37"},{"n":38,"type":"essay","prompt":"论述文学思潮与文学流派的区别与联系。","options":[],"key":"","answer":"一、区别。(1)指涉范畴不同:思潮囊括创作、理论、批评、接受;流派仅指创作领域的题材风格。(2)群体规约不同:思潮只求观念一致;流派在学养、区域、风格上均有要求。(3)外在因素不同:思潮受社会文化思潮影响,具时代规约性;流派受影响小。 二、联系。二者均具群体性、动态性与历史性;流派是思潮的重要组成部分,推动思潮发展;思潮为流派提供思想与审美导向。","max":10,"id":"当代文思-4-essay-38"},{"n":39,"type":"essay","prompt":"论述文学思潮与文学运动的区别与联系。","options":[],"key":"","answer":"一、区别。(1)表现形态不同:思潮以系统化思想观念为动力,形态潜在、抽象;运动由创新者发起,形态外在、具体。(2)成因目的不同:思潮自觉或不自觉形成;运动以活动呼应社会文化思潮,旨在改变文学现状。(3)涵盖范围不同:思潮涉及创作、理论、批评、接受等;运动侧重具体活动,影响集中而有阶段性。 二、联系。运动能传播文学思想;思潮为运动提供思想与理论指导。","max":10,"id":"当代文思-4-essay-39"}],"rawMax":111},{"id":"当代文思-5","title":"章节练习(2章)","questions":[{"n":1,"type":"single","prompt":"第一次文代会召开的时间是","options":[{"key":"A","text":"1948年7月"},{"key":"B","text":"1949年7月"},{"key":"C","text":"1950年7月"},{"key":"D","text":"1951年7月"}],"key":"B","answer":"1949年7月","max":1,"id":"当代文思-5-single-1"},{"n":2,"type":"single","prompt":"第一次文代会中,做《在中华全国文学艺术工作者代表大会上的政治报告》的是","options":[{"key":"A","text":"毛泽东"},{"key":"B","text":"朱德"},{"key":"C","text":"周恩来"},{"key":"D","text":"郭沫若"}],"key":"C","answer":"周恩来","max":1,"id":"当代文思-5-single-2"},{"n":3,"type":"single","prompt":"第一次文代会明确将哪部著作作为全国文艺工作的总方向","options":[{"key":"A","text":"《新民主主义论》"},{"key":"B","text":"《在延安文艺座谈会上的讲话》"},{"key":"C","text":"《论人民民主专政》"},{"key":"D","text":"《实践论》"}],"key":"B","answer":"《在延安文艺座谈会上的讲话》","max":1,"id":"当代文思-5-single-3"},{"n":4,"type":"single","prompt":"电影《武训传》批判运动中,毛泽东亲自撰写社论发表在","options":[{"key":"A","text":"《光明日报》"},{"key":"B","text":"《人民日报》"},{"key":"C","text":"《文艺报》"},{"key":"D","text":"《人民文学》"}],"key":"B","answer":"《人民日报》","max":1,"id":"当代文思-5-single-4"},{"n":5,"type":"single","prompt":"“胡风反革命集团案”中,胡风提交给中央的报告被称为","options":[{"key":"A","text":"《关于文艺问题的意见》"},{"key":"B","text":"《三十万言书》"},{"key":"C","text":"《我的自我批判》"},{"key":"D","text":"《论现实主义的路》"}],"key":"B","answer":"《三十万言书》","max":1,"id":"当代文思-5-single-5"},{"n":6,"type":"single","prompt":"第一次文代会成立的全国性文艺组织是","options":[{"key":"A","text":"中国作家协会"},{"key":"B","text":"中华全国文学艺术界联合会"},{"key":"C","text":"中国戏剧家协会"},{"key":"D","text":"中国美术家协会"}],"key":"B","answer":"中华全国文学艺术界联合会","max":1,"id":"当代文思-5-single-6"},{"n":7,"type":"single","prompt":"下列不属于建国初期文艺大批判事件的是","options":[{"key":"A","text":"电影《武训传》批判"},{"key":"B","text":"俞平伯《〈红楼梦〉研究》批判"},{"key":"C","text":"“朦胧诗”争论"},{"key":"D","text":"“胡风反革命集团案”批判"}],"key":"C","answer":"“朦胧诗”争论","max":1,"id":"当代文思-5-single-7"},{"n":8,"type":"single","prompt":"周扬在《人民日报》发表《社会主义现实主义——中国文学前进的道路》的时间是","options":[{"key":"A","text":"1951年1月"},{"key":"B","text":"1952年1月"},{"key":"C","text":"1953年1月"},{"key":"D","text":"1954年1月"}],"key":"C","answer":"1953年1月","max":1,"id":"当代文思-5-single-8"},{"n":9,"type":"single","prompt":"第二次全国文代会上,提出把表现新的英雄人物作为“当前文艺创作的最主要的、最中心的任务”的是","options":[{"key":"A","text":"茅盾"},{"key":"B","text":"周扬"},{"key":"C","text":"冯雪峰"},{"key":"D","text":"郭沫若"}],"key":"B","answer":"周扬","max":1,"id":"当代文思-5-single-9"},{"n":10,"type":"single","prompt":"电影《武训传》中,武训的主要行为是","options":[{"key":"A","text":"武装反抗封建统治者"},{"key":"B","text":"行乞兴学"},{"key":"C","text":"宣传革命思想"},{"key":"D","text":"组织农民起义"}],"key":"B","answer":"行乞兴学","max":1,"id":"当代文思-5-single-10"},{"n":11,"type":"single","prompt":"俞平伯《〈红楼梦〉研究》中,认为《红楼梦》的基本主题是","options":[{"key":"A","text":"反封建"},{"key":"B","text":"歌颂爱情"},{"key":"C","text":"“色”与“空”"},{"key":"D","text":"批判社会黑暗"}],"key":"C","answer":"“色”与“空”","max":1,"id":"当代文思-5-single-11"},{"n":12,"type":"single","prompt":"“胡风反革命集团案”中,胡风被加判为无期徒刑之前,最初被判有期徒刑","options":[{"key":"A","text":"10年"},{"key":"B","text":"12年"},{"key":"C","text":"14年"},{"key":"D","text":"15年"}],"key":"C","answer":"14年","max":1,"id":"当代文思-5-single-12"},{"n":13,"type":"single","prompt":"第一次文代会中,总结国统区文艺创作和文艺运动情况的是","options":[{"key":"A","text":"茅盾"},{"key":"B","text":"周扬"},{"key":"C","text":"郭沫若"},{"key":"D","text":"老舍"}],"key":"A","answer":"茅盾","max":1,"id":"当代文思-5-single-13"},{"n":14,"type":"single","prompt":"下列关于革命现实主义文学思潮特点的说法,错误的是","options":[{"key":"A","text":"自上而下建构"},{"key":"B","text":"具有排他性政治色彩"},{"key":"C","text":"完全自发形成"},{"key":"D","text":"通过“破立相间”实现一元独尊"}],"key":"C","answer":"完全自发形成","max":1,"id":"当代文思-5-single-14"},{"n":15,"type":"single","prompt":"第一次文代会后,创办的重要报刊不包括","options":[{"key":"A","text":"《文艺报》"},{"key":"B","text":"《人民文学》"},{"key":"C","text":"《小说月报》"},{"key":"D","text":"以上均不包括"}],"key":"C","answer":"《小说月报》","max":1,"id":"当代文思-5-single-15"},{"n":16,"type":"fill","prompt":"第一次文代会出席的代表和特邀代表共有 ______ 人,组成十个代表团。","options":[],"key":"824","answer":"824","max":2,"id":"当代文思-5-fill-16"},{"n":17,"type":"fill","prompt":"1951年对电影《武训传》的批判,被公开点名批评的文章有 ______ 篇,作者有48位。","options":[],"key":"43","answer":"43","max":2,"id":"当代文思-5-fill-17"},{"n":18,"type":"fill","prompt":"俞平伯将1922年所写的《红楼梦辨》修订后,增加5篇新文,易名为 ______ 重新出版。","options":[],"key":"《〈红楼梦〉研究》","answer":"《〈红楼梦〉研究》","max":2,"id":"当代文思-5-fill-18"},{"n":19,"type":"fill","prompt":"胡风在《论民族形式问题》中,明确反对把“民族形式”狭义地理解为 ______ 。","options":[],"key":"民间形式","answer":"民间形式","max":2,"id":"当代文思-5-fill-19"},{"n":20,"type":"fill","prompt":"第一次文代会中,中华全国文学艺术界联合会由 ______ 任主席,茅盾和周扬为副主席。","options":[],"key":"郭沫若","answer":"郭沫若","max":2,"id":"当代文思-5-fill-20"},{"n":21,"type":"fill","prompt":"1953年,周扬在文章中指出, ______ 已成为全世界一切进步作家的旗帜,中国人民的文学在其指引下前进。","options":[],"key":"社会主义现实主义","answer":"社会主义现实主义","max":2,"id":"当代文思-5-fill-21"},{"n":22,"type":"fill","prompt":"“胡风反革命集团案”共涉及2100余人,其中拘捕92人,隔离审查62人, ______ 73人。","options":[],"key":"停职反省","answer":"停职反省","max":2,"id":"当代文思-5-fill-22"},{"n":23,"type":"fill","prompt":"第一次文代会的“大会宣言”指出,今后要继续贯彻文艺方针,更进一步地与广大人民、 与 ______ 相结合。","options":[],"key":"工农兵","answer":"工农兵","max":2,"id":"当代文思-5-fill-23"},{"n":24,"type":"fill","prompt":"1955年,《人民日报》发表《关于胡风反党集团的第二批材料》,毛泽东为此亲自撰写 ______ 。","options":[],"key":"按语","answer":"按语","max":2,"id":"当代文思-5-fill-24"},{"n":25,"type":"fill","prompt":"革命现实主义思潮的核心目标是用积极昂扬的 ______ 改造、教育和鼓舞劳动人民。","options":[],"key":"社会主义精神","answer":"社会主义精神","max":2,"id":"当代文思-5-fill-25"},{"n":26,"type":"fill","prompt":"第一次文代会被视为“中国当代文学”的 ______ 。","options":[],"key":"起点","answer":"起点","max":2,"id":"当代文思-5-fill-26"},{"n":27,"type":"fill","prompt":"1951年,开明书店陆续出版24位中国现代作家的选集,茅盾、巴金、曹禺等作家在各自选集的 ______ 中,对既往文学实践进行自我否定与检讨。","options":[],"key":"自序","answer":"自序","max":2,"id":"当代文思-5-fill-27"},{"n":28,"type":"term","prompt":"第一次文代会","options":[],"key":"","answer":"第一次文代会:1949年7月在北平召开的中华全国文学艺术工作者代表大会,确立《在延安文艺座谈会上的讲话》为全国文艺工作总方向,成立中华全国文学艺术界联合会,被视为中国当代文学的起点。","max":4,"id":"当代文思-5-term-28"},{"n":29,"type":"term","prompt":"电影《武训传》批判","options":[],"key":"","answer":"电影《武训传》批判:1951年针对该片开展的文艺批判运动。影片讲述武训“行乞兴学”的故事;1951年5月《人民日报》发表毛泽东撰写的社论,批判其宣扬投降主义与改良主义, 全国掀起批判热潮,电影创作迅速衰微。","max":4,"id":"当代文思-5-term-29"},{"n":30,"type":"term","prompt":"“胡风反革命集团案”","options":[],"key":"","answer":"“胡风反革命集团案”:1955年发生的针对胡风及其相关人员的案件。胡风文艺思想与《在延安文艺座谈会上的讲话》存在分歧,1954年提交《三十万言书》,案件性质从文艺思想分歧升级为“反革命”问题,1979年后终获彻底平反。","max":4,"id":"当代文思-5-term-30"},{"n":31,"type":"term","prompt":"革命现实主义","options":[],"key":"","answer":"革命现实主义:新中国成立初期形成的文学思潮,源于苏联“社会主义现实主义”,经毛泽东、周扬等在延安时期诠释,成为新中国文艺的创作方法与思想立场,要求作家从现实革命发展中真实书写现实,具有排他性政治色彩。","max":4,"id":"当代文思-5-term-31"},{"n":32,"type":"term","prompt":"中华全国文学艺术界联合会","options":[],"key":"","answer":"中华全国文学艺术界联合会:第一次文代会成立的全国性文艺组织,是新中国全国作家、艺术家的组织领导机构,由郭沫若任主席,茅盾和周扬任副主席,后续成立各专业协会,创办 《文艺报》《人民文学》,推动了革命现实主义文学思潮的发展。","max":4,"id":"当代文思-5-term-32"},{"n":33,"type":"term","prompt":"俞平伯《〈红楼梦〉研究》批判","options":[],"key":"","answer":"俞平伯《〈红楼梦〉研究》批判:1954年针对该书展开的批判运动。俞平伯延续“新红学”“自传说”,李希凡、蓝翎撰文批评,毛泽东写信强调批判胡适派资产阶级唯心论的重要性,全国掀起批判热潮,批判从学术领域扩大到文化意识领域。","max":4,"id":"当代文思-5-term-33"},{"n":34,"type":"short","prompt":"简要概括第一次文代会的背景和目的。","options":[],"key":"","answer":"背景:1949年前后作家队伍出现“南下”与“北上”景观;1949年3月中华全国文艺界协会与华北文协理事联席会议商定召开文代会。目的:一是团结解放区、国统区及其他地区作家;二是从国家制度上建构当代文学秩序,确立党对文学的领导,明确文艺方针政策,成立文化艺术组织机构。","max":6,"id":"当代文思-5-short-34"},{"n":35,"type":"short","prompt":"简述一元化革命现实主义文学思潮的特点。","options":[],"key":"","answer":"一是自上而下建构,由党中央通过制度化措施推动,带有组织保障;二是具有鲜明的排他性政治色彩,彰显文学为政治服务的功能,维护一元化;三是通过“破立相间”实现一元独尊, “立”的核心是文代会确立的文艺政策与文学体制,“破”则通过批判运动解决思想分歧。","max":6,"id":"当代文思-5-short-35"},{"n":36,"type":"short","prompt":"简要说明建国初期三次文艺批判运动的共同之处。","options":[],"key":"","answer":"一是均由意识形态领域主导,以政治化方式开展,以政治批判代替学术文艺讨论,将思想分歧上升到政治高度;二是都带有自上而下的组织性,由中央推动并在全国展开;三是均对文艺界产生较大冲击,导致创作和研究萎缩,设置文艺发展禁区;四是核心目的都是通过批判实现思想统一。","max":6,"id":"当代文思-5-short-36"},{"n":37,"type":"essay","prompt":"论述第一次文代会对中国当代文学发展的意义。","options":[],"key":"","answer":"第一次文代会意义重大。首先,确立了党对新中国文学的领导,明确《在延安文艺座谈会上的讲话》的核心地位与文艺为工农兵服务的根本方向。其次,完成了当代文学制度的建构, 成立中华全国文学艺术界联合会及后续专业协会。最后,推动了一元化革命现实主义文学思潮的兴起,通过统一思想、确立方针、建立组织使其成为文学发展的主流。","max":10,"id":"当代文思-5-essay-37"},{"n":38,"type":"essay","prompt":"论述一元化革命现实主义文学思潮的意义与局限。","options":[],"key":"","answer":"意义:该思潮以政治化手段整合文艺力量,使文艺与国家巩固政权、稳定社会的需求一致, 成为宣传社会主义、鼓舞人民建设热情的工具,推动了反映社会主义建设和革命历史的作品出现。局限:一是将文艺思想矛盾政治化,以大批判和上纲上线解决分歧,伤害文艺工作者;二是违背文艺发展规律,压抑作家个性,限制题材、风格与形式的多元探索。","max":10,"id":"当代文思-5-essay-38"},{"n":39,"type":"essay","prompt":"以《武训传》批判为例,论述建国初期文艺批判运动中“破”与“立”的体现。","options":[],"key":"","answer":"一、“破”的体现:《武训传》宣扬武训“行乞兴学”,体现投降主义与改良主义,与强调阶级斗争、革命进步的思想相悖;经毛泽东撰写社论与全国报刊批判,破掉了不符合主流意识形态的文艺思想。 二、“立”的体现:批判借此强化《在延安文艺座谈会上的讲话》的指导地位,确立文艺为政治服务、为工农兵服务的方向,强调歌颂革命精神,为革命现实主义思潮的发展扫清障碍。","max":10,"id":"当代文思-5-essay-39"}],"rawMax":111},{"id":"当代文思-6","title":"章节练习(3章)","questions":[{"n":1,"type":"single","prompt":"“双百”方针提出的时间是","options":[{"key":"A","text":"1955年"},{"key":"B","text":"1956年"},{"key":"C","text":"1957年"},{"key":"D","text":"1958年"}],"key":"B","answer":"1956年","max":1,"id":"当代文思-6-single-1"},{"n":2,"type":"single","prompt":"“双百”方针中,“百花齐放”主要针对","options":[{"key":"A","text":"学术领域"},{"key":"B","text":"文艺领域"},{"key":"C","text":"教育领域"},{"key":"D","text":"科技领域"}],"key":"B","answer":"文艺领域","max":1,"id":"当代文思-6-single-2"},{"n":3,"type":"single","prompt":"文艺界“反右”运动开始的标志是","options":[{"key":"A","text":"《这是为什么?》社论发表"},{"key":"B","text":"《关于正确处理人民内部矛盾的问题》发表"},{"key":"C","text":"第一次文代会召开"},{"key":"D","text":"电影《武训传》批判"}],"key":"A","answer":"《这是为什么?》社论发表","max":1,"id":"当代文思-6-single-3"},{"n":4,"type":"single","prompt":"新民歌运动中,提出“每个县都要出一个郭沫若”又号的是","options":[{"key":"A","text":"毛泽东"},{"key":"B","text":"周恩来"},{"key":"C","text":"刘少奇"},{"key":"D","text":"陆定一"}],"key":"A","answer":"毛泽东","max":1,"id":"当代文思-6-single-4"},{"n":5,"type":"single","prompt":"以下不属于文艺界“反右”运动中被批判对象的是","options":[{"key":"A","text":"丁玲"},{"key":"B","text":"冯雪峰"},{"key":"C","text":"艾青"},{"key":"D","text":"茅盾"}],"key":"D","answer":"茅盾","max":1,"id":"当代文思-6-single-5"},{"n":6,"type":"single","prompt":"“双百”方针提出的背景是","options":[{"key":"A","text":"社会主义改造基本完成"},{"key":"B","text":"抗日战争胜利"},{"key":"C","text":"解放战争胜利"},{"key":"D","text":"文化大革命开始"}],"key":"A","answer":"社会主义改造基本完成","max":1,"id":"当代文思-6-single-6"},{"n":7,"type":"single","prompt":"新民歌运动的典型特征是","options":[{"key":"A","text":"创作个性化"},{"key":"B","text":"风格多元化"},{"key":"C","text":"内容“左”倾化"},{"key":"D","text":"形式自由化"}],"key":"C","answer":"内容“左”倾化","max":1,"id":"当代文思-6-single-7"},{"n":8,"type":"single","prompt":"文艺界“反右”运动的主要特征是","options":[{"key":"A","text":"学术讨论自由"},{"key":"B","text":"思想批判扩大化"},{"key":"C","text":"创作风格多样化"},{"key":"D","text":"文艺政策宽松"}],"key":"B","answer":"思想批判扩大化","max":1,"id":"当代文思-6-single-8"},{"n":9,"type":"single","prompt":"“双百”方针的意义在于","options":[{"key":"A","text":"推动文艺和学术的繁荣发展"},{"key":"B","text":"限制文艺创作自由"},{"key":"C","text":"强化思想统一"},{"key":"D","text":"促进政治运动开展"}],"key":"A","answer":"推动文艺和学术的繁荣发展","max":1,"id":"当代文思-6-single-9"},{"n":10,"type":"single","prompt":"新民歌运动中,强调诗歌创作要","options":[{"key":"A","text":"反映个人情感"},{"key":"B","text":"体现现实主义"},{"key":"C","text":"追求形式创新"},{"key":"D","text":"“大跃进”式浮夸"}],"key":"D","answer":"“大跃进”式浮夸","max":1,"id":"当代文思-6-single-10"},{"n":11,"type":"single","prompt":"文艺界“反右”运动对文艺发展的主要影响是","options":[{"key":"A","text":"促进文艺多元化"},{"key":"B","text":"导致文艺创作萎缩"},{"key":"C","text":"推动文艺理论创新"},{"key":"D","text":"丰富文艺表现形式"}],"key":"B","answer":"导致文艺创作萎缩","max":1,"id":"当代文思-6-single-11"},{"n":12,"type":"single","prompt":"“双百”方针中,“百家争鸣”主要针对","options":[{"key":"A","text":"文艺领域"},{"key":"B","text":"学术领域"},{"key":"C","text":"经济领域"},{"key":"D","text":"政治领域"}],"key":"B","answer":"学术领域","max":1,"id":"当代文思-6-single-12"},{"n":13,"type":"single","prompt":"新民歌运动的意义在于","options":[{"key":"A","text":"推动诗歌创作的健康发展"},{"key":"B","text":"反映真实的社会生活"},{"key":"C","text":"为“左”倾文学思潮提供助力"},{"key":"D","text":"促进诗歌形式的多样化"}],"key":"C","answer":"为“左”倾文学思潮提供助力","max":1,"id":"当代文思-6-single-13"},{"n":14,"type":"single","prompt":"以下属于“双百”方针提出后文艺领域成果的是","options":[{"key":"A","text":"《组织部新来的青年人》"},{"key":"B","text":"《武训传》"},{"key":"C","text":"《红岩》"},{"key":"D","text":"《林海雪原》"}],"key":"A","answer":"《组织部新来的青年人》","max":1,"id":"当代文思-6-single-14"},{"n":15,"type":"single","prompt":"文艺界“反右”运动的局限在于","options":[{"key":"A","text":"促进思想解放"},{"key":"B","text":"导致阶级斗争扩大化"},{"key":"C","text":"推动文艺创新"},{"key":"D","text":"加强文艺交流"}],"key":"B","answer":"导致阶级斗争扩大化","max":1,"id":"当代文思-6-single-15"},{"n":16,"type":"fill","prompt":"“双百”方针指的是 ______ 、百家争鸣。","options":[],"key":"百花齐放","answer":"百花齐放","max":2,"id":"当代文思-6-fill-16"},{"n":17,"type":"fill","prompt":"1957年6月8日,《人民日报》发表社论 ______ ,标志着全国“反右”运动开始。","options":[],"key":"《这是为什么?》","answer":"《这是为什么?》","max":2,"id":"当代文思-6-fill-17"},{"n":18,"type":"fill","prompt":"新民歌运动是在 ______ 运动的背景下开展的。","options":[],"key":"“大跃进”","answer":"“大跃进”","max":2,"id":"当代文思-6-fill-18"},{"n":19,"type":"fill","prompt":"“双百”方针提出的背景是社会主义改造 ______ 完成。","options":[],"key":"基本","answer":"基本","max":2,"id":"当代文思-6-fill-19"},{"n":20,"type":"fill","prompt":"文艺界“反右”运动中,众多文艺工作者被错误地划为 ______ 。","options":[],"key":"右派分子","answer":"右派分子","max":2,"id":"当代文思-6-fill-20"},{"n":21,"type":"fill","prompt":"新民歌运动的创作强调对 ______ 建设的歌颂。","options":[],"key":"社会主义","answer":"社会主义","max":2,"id":"当代文思-6-fill-21"},{"n":22,"type":"fill","prompt":"“双百”方针的提出,旨在调动 ______ 的积极性,促进文艺和学术发展。","options":[],"key":"知识分子","answer":"知识分子","max":2,"id":"当代文思-6-fill-22"},{"n":23,"type":"fill","prompt":"文艺界“反右”运动的主要影响是导致文艺创作 ______ 。","options":[],"key":"萎缩","answer":"萎缩","max":2,"id":"当代文思-6-fill-23"},{"n":24,"type":"fill","prompt":"新民歌运动中,诗歌创作呈现出 ______ 的典型特征。","options":[],"key":"“左”倾化","answer":"“左”倾化","max":2,"id":"当代文思-6-fill-24"},{"n":25,"type":"fill","prompt":"“双百”方针的局限在于,在后续执行中因各种原因未能 ______ 贯彻。","options":[],"key":"持续","answer":"持续","max":2,"id":"当代文思-6-fill-25"},{"n":26,"type":"fill","prompt":"文艺界“反右”运动的主要特征是思想批判 ______ 。","options":[],"key":"扩大化","answer":"扩大化","max":2,"id":"当代文思-6-fill-26"},{"n":27,"type":"fill","prompt":"新民歌运动的意义在于为 ______ 文学思潮提供了创作实践支撑。","options":[],"key":"“左”倾化","answer":"“左”倾化","max":2,"id":"当代文思-6-fill-27"},{"n":28,"type":"term","prompt":"“双百”方针","options":[],"key":"","answer":"双百方针:1956年毛泽东提出的“百花齐放、百家争鸣”方针。“百花齐放”针对文艺领域, 鼓励不同风格、形式的创作自由;“百家争鸣”针对学术领域,倡导不同学派、观点的讨论自由,初衷是推动文艺与科学发展,影响深远。","max":4,"id":"当代文思-6-term-28"},{"n":29,"type":"term","prompt":"文艺界“反右”运动","options":[],"key":"","answer":"文艺界“反右”运动:1957年6月在全国“反右”背景下文艺界开展的思想批判运动。它将文艺领域的思想分歧无限上纲上线,批判严重扩大化,许多人被错误划为“右派分子”,使文艺创作严重萎缩,是“左”倾思想在文艺领域的体现。","max":4,"id":"当代文思-6-term-29"},{"n":30,"type":"term","prompt":"新民歌运动","options":[],"key":"","answer":"新民歌运动:在“大跃进”背景下开展的诗歌创作运动,倡导群众广泛参与,提出“每个县都要出一个郭沫若”等又号。内容强调对社会主义建设的极度歌颂,存在浮夸、脱离实际等问题,是“左”倾化文学思潮在诗歌领域的具体表现。","max":4,"id":"当代文思-6-term-30"},{"n":31,"type":"term","prompt":"“左”倾化文学思潮","options":[],"key":"","answer":"“左”倾化文学思潮:在“左”倾思想影响下形成的文学思潮,以文艺界“反右”运动、新民歌运动等为表现,强调文艺为政治服务,思想批判扩大化,创作内容浮夸、脱离实际,限制创作自由,导致文艺发展僵化萎缩,具有消极影响。","max":4,"id":"当代文思-6-term-31"},{"n":32,"type":"term","prompt":"右派分子","options":[],"key":"","answer":"右派分子:在“反右”运动中被错误判定为持有“资产阶级右派”思想的人员。文艺界众多工作者在文艺界“反右”运动中被错误划为右派分子,遭受不公正待遇,其判定标准带有明显的政治化倾向,是特定历史条件下的产物。","max":4,"id":"当代文思-6-term-32"},{"n":33,"type":"term","prompt":"社会主义改造基本完成","options":[],"key":"","answer":"社会主义改造基本完成:1956年中国基本完成对农业、手工业和资本主义工商业的社会主义改造,生产资料私有制转变为公有制,标志着社会主义制度基本建立,是理解“双百”方针提出背景的重要前提。","max":4,"id":"当代文思-6-term-33"},{"n":34,"type":"short","prompt":"简述“双百”方针提出的背景及意义。","options":[],"key":"","answer":"背景:1956年社会主义改造基本完成,国内主要矛盾变为人民对经济文化迅速发展的需要同经济文化不能满足需要的状况之间的矛盾,为调动知识分子积极性,毛泽东提出“双百”方针。意义:短期内推动了文艺和学术的活跃发展,打破思想僵化,调动知识分子的创作和研究积极性。","max":6,"id":"当代文思-6-short-34"},{"n":35,"type":"short","prompt":"简要说明文艺界“反右”运动的主要特征及主要影响。","options":[],"key":"","answer":"主要特征:思想批判扩大化,将文艺领域的思想分歧无限上纲上线,上升为阶级斗争问题, 许多人被错误划为“右派分子”。主要影响:导致文艺创作严重萎缩,题材、风格受限;设置文艺研究禁区,阻碍文艺理论和创作创新;伤害大批文艺工作者,使文艺发展陷入长期困境。","max":6,"id":"当代文思-6-short-35"},{"n":36,"type":"short","prompt":"简述新民歌运动与文艺创作“左”倾化的典型特征。","options":[],"key":"","answer":"新民歌运动受“大跃进”和“左”倾思想影响,典型特征为:创作内容上,极度歌颂社会主义建设,存在浮夸、脱离实际的情况;创作主体上,倡导群众广泛参与,提出“每个县都要出一个郭沫若”的又号,强调集体创作;创作风格上,形式单一,强调政治性和宣传性,忽视诗歌的艺术规律与审美特性。","max":6,"id":"当代文思-6-short-36"},{"n":37,"type":"essay","prompt":"论述“双百”方针的意义与局限。","options":[],"key":"","answer":"意义:“双百”方针提出于社会主义改造基本完成后,旨在调动知识分子积极性、促进文艺和学术繁荣,短期内推动了文艺和学术的活跃,打破了思想僵化,有利于思想解放。局限:该方针在后续执行中因“反右”等政治运动影响未能持续贯彻,文艺界思想批判扩大化,许多参与讨论的知识分子被错误批判,也使当时对文艺和学术发展规律的认识不足。","max":10,"id":"当代文思-6-essay-37"},{"n":38,"type":"essay","prompt":"论述文艺界“反右”运动与“左”倾化文学思潮的基本特征及主要影响。","options":[],"key":"","answer":"基本特征:文艺界“反右”运动是“左”倾化文学思潮的重要表现,其特征为思想批判扩大化, 将思想分歧无限上升为阶级斗争,许多人被错误划为“右派分子”;文艺创作强调为政治服务,创作自由受严重限制;新民歌运动则内容浮夸、脱离实际,忽视艺术规律。主要影响: 文艺创作严重萎缩,题材风格单一化,许多人遭受不公正待遇,文艺队伍建设遭到破坏。","max":10,"id":"当代文思-6-essay-38"},{"n":39,"type":"essay","prompt":"论述新民歌运动的意义与局限性。","options":[],"key":"","answer":"意义:新民歌运动体现了群众参与文艺创作的热情,推动诗歌创作从专业作家向群众扩展, 形式上强调民歌体,为“左”倾化文学思潮提供了创作实践支撑。局限:受“大跃进”和“左”倾思想影响,内容浮夸、脱离实际;忽视艺术规律,形式单一,强调政治性和宣传性;倡导 “每个县都要出一个郭沫若”等又号,违背文学创作的个性化规律。","max":10,"id":"当代文思-6-essay-39"}],"rawMax":111},{"id":"当代文思-7","title":"章节练习(4章)","questions":[{"n":1,"type":"single","prompt":"“朦胧诗”兴起的背景是","options":[{"key":"A","text":"新中国成立初期"},{"key":"B","text":"“文革”时期"},{"key":"C","text":"改革开放后"},{"key":"D","text":"20世纪90年代"}],"key":"B","answer":"“文革”时期","max":1,"id":"当代文思-7-single-1"},{"n":2,"type":"single","prompt":"以下不属于“朦胧诗”代表诗人的是","options":[{"key":"A","text":"北岛"},{"key":"B","text":"顾城"},{"key":"C","text":"海子"},{"key":"D","text":"舒婷"}],"key":"C","answer":"海子","max":1,"id":"当代文思-7-single-2"},{"n":3,"type":"single","prompt":"“朦胧诗”争论中,首先对其进行批判的文章发表在","opti 新意识","max":2,"id":"当代文思-7-fill-22"},{"n":23,"type":"fill","prompt":"启蒙主义文学思潮的第二个阶段主要表现为 ______ 的深化。","options":[],"key":"人性解放","answer":"人性解放","max":2,"id":"当代文思-7-fill-23"},{"n":24,"type":"fill","prompt":"“朦胧诗”的形成背景包括“文革”的思想禁锢、青年诗人的地下创作和 ______ 的影响。","options":[],"key":"西方现代主义诗歌","answer":"西方现代主义诗歌","max":2,"id":"当代文思-7-fill-24"},{"n":25,"type":"fill","prompt":"启蒙主义文学思潮的第三个阶段主要表现为启蒙思想的 ______ 与反思。","options":[],"key":"总结","answer":"总结","max":2,"id":"当代文思-7-fill-25"},{"n":26,"type":"fill","prompt":"“朦胧诗”的主要群体有今天派和 ______ 等。","options":[],"key":"白洋淀诗群","answer":"白洋淀诗群","max":2,"id":"当代文思-7-fill-26"},{"n":27,"type":"fill","prompt":"以“朦胧诗”为载体的启蒙主义思潮开启了文学 ______ 的发展。","options":[],"key":"多元化","answer":"多元化","max":2,"id":"当代文思-7-fill-27"},{"n":28,"type":"term","prompt":"“朦胧诗”","options":[],"key":"","answer":"“朦胧诗”:兴起于“文革”时期的诗歌流派,源于地下诗歌创作,代表诗人有北岛、顾城、舒婷等。作品以独特的艺术手法探索人性、反思现实,具有强烈的批判精神与人文关怀,因风格晦涩朦胧而得名,引发了广泛的诗歌争论。","max":4,"id":"当代文思-7-term-28"},{"n":29,"type":"term","prompt":"启蒙主义文学思潮(“朦胧诗”群)","options":[],"key":"","answer":"启蒙主义文学思潮(“朦胧诗”群):以“朦胧诗”为载体的文学思潮,核心是人性解放,具有批判精神、人文关怀和创新意识,主张打破思想禁锢,恢复人的尊严和价值,反思历史与现实对人性的压抑,推动了思想解放和文学多元化发展。","max":4,"id":"当代文思-7-term-29"},{"n":30,"type":"term","prompt":"今天派","options":[],"key":"","answer":"今天派:“朦胧诗”的主要群体之一,以创办《今天》杂志为标志,代表诗人有北岛等。作品具有强烈的批判精神,关注社会现实和人性命运,在诗歌形式与思想内涵上创新,是“朦胧诗”运动的重要推动力量,影响深远。","max":4,"id":"当代文思-7-term-30"},{"n":31,"type":"term","prompt":"白洋淀诗群","options":[],"key":"","answer":"白洋淀诗群:“朦胧诗”的主要群体之一,是形成于白洋淀地区的知青诗人群体。他们在艰苦环境中坚持创作,作品充满对自由和人性的向往,具有质朴而深刻的思想内涵,体现了知青一代的精神追求。","max":4,"id":"当代文思-7-term-31"},{"n":32,"type":"term","prompt":"“朦胧诗”争论","options":[],"key":"","answer":"“朦胧诗”争论:围绕“朦胧诗”的艺术风格、思想内涵等展开的诗歌论争。始于1980年《文艺报》的批判文章,随后诗歌界就其价值、意义展开广泛讨论,实质是诗歌创作观念和审美趣味的分歧,为诗歌的艺术探索提供了空间。","max":4,"id":"当代文思-7-term-32"},{"n":33,"type":"term","prompt":"人性解放","options":[],"key":"","answer":"人性解放:“朦胧诗”群启蒙主义思潮的核心,主张打破思想禁锢,恢复人的尊严、自由和价值,关注人的生存状态和精神世界,反思历史与现实对人性的压抑,是新时期思想解放运动在诗歌领域的反映。","max":4,"id":"当代文思-7-term-33"},{"n":34,"type":"short","prompt":"简述“朦胧诗”的形成背景及其主要群体。","options":[],"key":"","answer":"形成背景:源于“文革”时期的地下诗歌创作,当时思想严重禁锢,青年诗人通过地下创作表达对现实与人性的探索;同时受西方现代主义诗歌影响,在形式和思想内涵上创新。主要群体:今天派,以创办《今天》杂志为标志,代表诗人北岛;白洋淀诗群,是白洋淀地区的知青诗人群体。","max":6,"id":"当代文思-7-short-34"},{"n":35,"type":"short","prompt":"简述启蒙主义文学思潮的三个阶段及其基本表现。","options":[],"key":"","answer":"第一阶段:对人性解放的初步呼吁,打破思想禁锢,关注人的价值和尊严。第二阶段:人性解放的深化,进一步探讨人的本质、自由等问题,丰富人性解放的内涵。第三阶段:启蒙思想的总结与反思,梳理前期启蒙思想,思考其成就与局限,使启蒙思想更加系统完善。","max":6,"id":"当代文思-7-short-35"},{"n":36,"type":"short","prompt":"简述“朦胧诗”的主要思想内核。","options":[],"key":"","answer":"“朦胧诗”的主要思想内核是对人性的探索与反思,它突破传统诗歌的束缚,深入挖掘人性的复杂层面,反思历史和现实对人性的扭曲与压抑,关注人的生存状态和精神世界,展现出人文关怀和批判精神,呼吁恢复人的尊严和价值,推动了新时期诗歌的思想转向。","max":6,"id":"当代文思-7-short-36"},{"n":37,"type":"essay","prompt":"论述“朦胧诗”群的启蒙主义思潮特质。","options":[],"key":"","answer":"“朦胧诗”群的启蒙主义思潮具有以下特质:一是批判精神,对“文革”造成的思想禁锢和人性压抑进行深刻批判;二是人文关怀,关注人的生存状态与精神世界,强调人的尊严、自由和价值;三是创新意识,在诗歌形式与表现手法上借鉴西方现代主义技巧,增强了艺术表现力与思想深度。这些特质使其具有强烈的思想冲击力,推动了诗歌创新和思想解放。","max":10,"id":"当代文思-7-essay-37"},{"n":38,"type":"essay","prompt":"论述以“朦胧诗”为载体的启蒙主义思潮的历史意义。","options":[],"key":"","answer":"以“朦胧诗”为载体的启蒙主义思潮具有重要的历史意义。首先,推动思想解放,打破“文革” 后的思想禁锢,使人们重新关注人性与尊严,促进社会思想多元化。其次,促进诗歌创新, 在形式、手法和思想内涵上打破传统诗歌的单一模式,推动中国当代诗歌的现代化进程。最后,开启文学多元化发展,打破文学创作的一元化格局,激发不同流派和风格的产生。","max":10,"id":"当代文思-7-essay-38"},{"n":39,"type":"essay","prompt":"论述以“朦胧诗”为载体的启蒙主义思潮的局限性。","options":[],"key":"","answer":"以“朦胧诗”为载体的启蒙主义思潮存在以下局限:一是部分作品晦涩,过于追求形式创新和思想深刻,影响读者接受;二是对现实的批判不够彻底,力度和深度有待提升;三是部分作品探讨人性和启蒙思想时存在表层化问题;四是借鉴西方现代主义诗歌时存在模仿痕迹,缺乏与本土文化的深度融合,民族性不足。","max":10,"id":"当代文思-7-essay-39"}],"rawMax":111},{"id":"当代文思-8","title":"章节练习(5章)","questions":[{"n":1,"type":"single","prompt":"“文学主体性”思潮深化的背景是","options":[{"key":"A","text":"“人”的觉醒与聚焦"},{"key":"B","text":"传统文学的复兴"},{"key":"C","text":"商业文学的兴起"},{"key":"D","text":"政治文学的强化"}],"key":"A","answer":"“人”的觉醒与聚焦","max":1,"id":"当代文思-8-single-1"},{"n":2,"type":"single","prompt":"提出“文学主体性”理论的核心学者是","options":[{"key":"A","text":"刘再复"},{"key":"B","text":"北岛"},{"key":"C","text":"茅盾"},{"key":"D","text":"周扬"}],"key":"A","answer":"刘再复","max":1,"id":"当代文思-8-single-2"},{"n":3,"type":"single","prompt":"“文学主体性”争论的主要焦点是","options":[{"key":"A","text":"文学的市场价值"},{"key":"B","text":"人的主体性在文学中的地位"},{"key":"C","text":"文学的政治功能"},{"key":"D","text":"文学的传统形式"}],"key":"B","answer":"人的主体性在文学中的地位","max":1,"id":"当代文思-8-single-3"},{"n":4,"type":"single","prompt":"刘再复认为“文学主体性”不包括以下哪个方面","options":[{"key":"A","text":"创作主体的自主性"},{"key":"B","text":"接受主体的能动性"},{"key":"C","text":"作品主体的独立性"},{"key":"D","text":"市场主体的导向性"}],"key":"D","answer":"市场主体的导向性","max":1,"id":"当代文思-8-single-4"},{"n":5,"type":"single","prompt":"“文学主体性”的启蒙主义特质不包括","options":[{"key":"A","text":"对人的价值的尊崇"},{"key":"B","text":"对思想禁锢的突破"},{"key":"C","text":"对商业利益的追求"},{"key":"D","text":"对精神自由的倡导"}],"key":"C","answer":"对商业利益的追求","max":1,"id":"当代文思-8-single-5"},{"n":6,"type":"single","prompt":"“文学主体性”思潮的意义在于","options":[{"key":"A","text":"强化文学的政治工具性"},{"key":"B","text":"推动文学对人的关注"},{"key":"C","text":"回归传统文学的范式"},{"key":"D","text":"促进文学的商业化"}],"key":"B","answer":"推动文学对人的关注","max":1,"id":"当代文思-8-single-6"},{"n":7,"type":"single","prompt":"以下不属于“文学主体性”争论参与方的是","options":[{"key":"A","text":"刘再复"},{"key":"B","text":"批评界学者"},{"key":"C","text":"普通读者"},{"key":"D","text":"文艺理论界"}],"key":"C","answer":"普通读者","max":1,"id":"当代文思-8-single-7"},{"n":8,"type":"single","prompt":"“文学主体性”的提出是在","options":[{"key":"A","text":"20世纪50年代"},{"key":"B","text":"20世纪60年代"},{"key":"C","text":"20世纪80年代"},{"key":"D","text":"20世纪90年代"}],"key":"C","answer":"20世纪80年代","max":1,"id":"当代文思-8-single-8"},{"n":9,"type":"single","prompt":"“文学主体性”中创作主体的自主性强调","options":[{"key":"A","text":"作家创作受政治干预"},{"key":"B","text":"作家创作的精神自由"},{"key":"C","text":"作家创作迎合市场"},{"key":"D","text":"作家创作模仿传统"}],"key":"B","answer":"作家创作的精神自由","max":1,"id":"当代文思-8-single-9"},{"n":10,"type":"single","prompt":"“文学主体性”中接受主体的能动性指","options":[{"key":"A","text":"读者被动接受作品"},{"key":"B","text":"读者主动解读作品"},{"key":"C","text":"读者盲目崇拜作者"},{"key":"D","text":"读者仅关注作品政治意义"}],"key":"B","answer":"读者主动解读作品","max":1,"id":"当代文思-8-single-10"},{"n":11,"type":"single","prompt":"“文学主体性”思潮的局限在于","options":[{"key":"A","text":"过度强调人的价值"},{"key":"B","text":"忽视文学的社会功能"},{"key":"C","text":"完全脱离现实生活"},{"key":"D","text":"倡导精神自由"}],"key":"A","answer":"过度强调人的价值","max":1,"id":"当代文思-8-single-11"},{"n":12,"type":"single","prompt":"“文学主体性”与启蒙主义思潮的关联在于","options":[{"key":"A","text":"都强调政治权威"},{"key":"B","text":"都关注人的觉醒与解放"},{"key":"C","text":"都推崇传统文学"},{"key":"D","text":"都追求商业价值"}],"key":"B","answer":"都关注人的觉醒与解放","max":1,"id":"当代文思-8-single-12"},{"n":13,"type":"single","prompt":"“文学主体性”中作品主体的独立性指","options":[{"key":"A","text":"作品完全模仿他人"},{"key":"B","text":"作品具有自身的审美与思想价值"},{"key":"C","text":"作品仅服务政治"},{"key":"D","text":"作品迎合市场需求"}],"key":"B","answer":"作品具有自身的审美与思想价值","max":1,"id":"当代文思-8-single-13"},{"n":14,"type":"single","prompt":"对“文学主体性”的批判观点主要认为其","options":[{"key":"A","text":"过于强调个体,忽视社会"},{"key":"B","text":"重视文学的社会功能"},{"key":"C","text":"推动了思想解放"},{"key":"D","text":"关注人的精神自由"}],"key":"A","answer":"过于强调个体,忽视社会","max":1,"id":"当代文思-8-single-14"},{"n":15,"type":"single","prompt":"“文学主体性”思潮深化了启蒙主义思潮在的体现","options":[{"key":"A","text":"政治领域"},{"key":"B","text":"经济领域"},{"key":"C","text":"文学领域"},{"key":"D","text":"军事领域"}],"key":"C","answer":"文学领域","max":1,"id":"当代文思-8-single-15"},{"n":16,"type":"fill","prompt":"“文学主体性”思潮深化的背景是 ______ 的觉醒与聚焦。","options":[],"key":"“人”","answer":"“人”","max":2,"id":"当代文思-8-fill-16"},{"n":17,"type":"fill","prompt":"提出“文学主体性”理论的核心学者是 ______ 。","options":[],"key":"刘再复","answer":"刘再复","max":2,"id":"当代文思-8-fill-17"},{"n":18,"type":"fill","prompt":"“文学主体性”争论主要围绕人的 ______ 在文学中的地位展开。","options":[],"key":"主体性","answer":"主体性","max":2,"id":"当代文思-8-fill-18"},{"n":19,"type":"fill","prompt":"刘再复认为“文学主体性”包括创作主体的自主性、接受主体的能动性和 ______ 的独立性三个方面。","options":[],"key":"作品主体","answer":"作品主体","max":2,"id":"当代文思-8-fill-19"},{"n":20,"type":"fill","prompt":"“文学主体性”的启蒙主义特质体现为对人的价值的尊崇、对思想禁锢的突破和对 ______ 的倡导。","options":[],"key":"精神自由","answer":"精神自由","max":2,"id":"当代文思-8-fill-20"},{"n":21,"type":"fill","prompt":"“文学主体性”思潮提出于 ______ 世纪80年代。","options":[],"key":"20","answer":"20","max":2,"id":"当代文思-8-fill-21"},{"n":22,"type":"fill","prompt":"“文学主体性”中创作主体的自主性强调作家创作的 ______ 自由。","options":[],"key":"精神","answer":"精神","max":2,"id":"当代文思-8-fill-22"},{"n":23,"type":"fill","prompt":"“文学主体性”中接受主体的能动性指读者 ______ 解读作品的能力。","options":[],"key":"主动","answer":"主动","max":2,"id":"当代文思-8-fill-23"},{"n":24,"type":"fill","prompt":"“文学主体性”思潮的意义在于推动文学对 ______ 的关注。","options":[],"key":"人","answer":"人","max":2,"id":"当代文思-8-fill-24"},{"n":25,"type":"fill","prompt":"“文学主体性”思潮的局限在于过度强调人的 ______ ,对人的社会属性关注不足。","options":[],"key":"个体性","answer":"个体性","max":2,"id":"当代文思-8-fill-25"},{"n":26,"type":"fill","prompt":"“文学主体性”与启蒙主义思潮的共同之处在于都关注人的 ______ 与解放。","options":[],"key":"觉醒","answer":"觉醒","max":2,"id":"当代文思-8-fill-26"},{"n":27,"type":"fill","prompt":"“文学主体性”中作品主体的独立性指作品具有自身的 ______ 与思想价值。","options":[],"key":"审美","answer":"审美","max":2,"id":"当代文思-8-fill-27"},{"n":28,"type":"term","prompt":"文学主体性","options":[],"key":"","answer":"文学主体性:刘再复提出的文学理论概念,含三个维度:一是作家主体性,强调创作的精神自由;二是对象主体性,将作品人物视为具有独立意志的“人”;三是接受主体性,关注读者与批评家的审美创造,是启蒙主义思潮在文学理论领域的深化。","max":4,"id":"当代文思-8-term-28"},{"n":29,"type":"term","prompt":"创作主体的自主性","options":[],"key":"","answer":"创作主体的自主性:“文学主体性”的组成部分之一,强调作家在创作中拥有精神自由,不受政治、市场、传统等外部因素的过度干预,能以独立的思考、情感和审美进行创作,彰显作家的个体精神与创作个性。","max":4,"id":"当代文思-8-term-29"},{"n":30,"type":"term","prompt":"接受主体的能动性","options":[],"key":"","answer":"接受主体的能动性:“文学主体性”的组成部分之一,指读者在接受过程中不是被动的,而是主动凭借自身经验、知识、情感和思考,对作品进行解读、阐释和再创造,是文学主体性在接受环节的体现,使阅读成为再创造的过程。","max":4,"id":"当代文思-8-term-30"},{"n":31,"type":"term","prompt":"作品主体的独立性","options":[],"key":"","answer":"作品主体的独立性:“文学主体性”的组成部分之一,指文学作品不是政治、市场等外部因素的附庸,具有自身的审美特质、思想内涵和艺术价值,能被读者从文学自身的角度解读和评价,确立了作品的本体地位。","max":4,"id":"当代文思-8-term-31"},{"n":32,"type":"term","prompt":"文学主体性的启蒙主义特质","options":[],"key":"","answer":"文学主体性的启蒙主义特质:指“文学主体性”的启蒙思想特征,体现为尊崇人的价值、突破思想禁锢、倡导精神自由,以人的觉醒和解放为核心,是启蒙精神在文学理论领域的重要延伸,推动了文学研究的转向。","max":4,"id":"当代文思-8-term-32"},{"n":33,"type":"term","prompt":"文学主体性争论","options":[],"key":"","answer":"文学主体性争论:围绕刘再复提出的“文学主体性”理论展开的学术争论,参与方为批评界与文艺理论界学者,争论涉及该理论的内涵、价值、局限及其与启蒙主义思潮的关系,推动了对文学本质的深入思考。","max":4,"id":"当代文思-8-term-33"},{"n":34,"type":"short","prompt":"简述刘再复认为的“文学主体性”包括哪几个方面。","options":[],"key":"","answer":"刘再复认为“文学主体性”包括三个方面:一是创作主体的自主性,强调作家创作的精神自由,不受外部因素过度干预;二是接受主体的能动性,指读者主动解读和阐释作品;三是作品主体的独立性,即作品具有自身的审美与思想价值,三者共同构成以人为中心的文学活动格局。","max":6,"id":"当代文思-8-short-34"},{"n":35,"type":"short","prompt":"简述“文学主体性”的启蒙主义特质有哪些。","options":[],"key":"","answer":"“文学主体性”的启蒙主义特质主要有三方面:一是对人的价值的尊崇,强调人的尊严、精神与自由;二是对思想禁锢的突破,推动文学的思想解放与多元发展;三是对精神自由的倡导,主张作家创作和读者接受的精神独立,体现了启蒙主义对人的觉醒与解放的追求。","max":6,"id":"当代文思-8-short-35"},{"n":36,"type":"short","prompt":"简述“文学主体性”争论的主要观点。","options":[],"key":"","answer":"“文学主体性”争论的主要观点分为支持和批判两类。支持者认为它推动了文学对人的关注, 彰显人的价值与精神自由,是思想解放在文学领域的体现;批判者认为它过度强调人的个体性,对人的社会属性和文学的社会功能关注不足,存在理论片面性,争论深化了对文学本质与功能的认识。","max":6,"id":"当代文思-8-short-36"},{"n":37,"type":"essay","prompt":"论述“文学主体性”的启蒙主义特质。","options":[],"key":"","answer":"“文学主体性”的启蒙主义特质主要体现在三个方面:一是对人的价值的尊崇,将人的尊严、 精神与自由置于文学核心;二是对思想禁锢的突破,打破文学领域的思想束缚,推动文学思想多元化发展;三是对精神自由的倡导,强调作家创作自主性和读者接受能动性,彰显人的精神独立。这些特质使其成为启蒙主义在文学领域的深化,推动文学的人文转向。","max":10,"id":"当代文思-8-essay-37"},{"n":38,"type":"essay","prompt":"论述“文学主体性”的意义与局限性。","options":[],"key":"","answer":"“文学主体性”的意义主要体现在:一是推动了文学对人的关注,使文学从政治工具转向对人的精神世界、价值与尊严的探索;二是促进了思想解放,打破思想禁锢,推动文学理论和创作的多元化发展;三是确立了人在文学活动中的主体地位。其局限在于:过度强调人的个体性,对人的社会属性和文学的社会功能关注不足。","max":10,"id":"当代文思-8-essay-38"},{"n":39,"type":"essay","prompt":"论述“文学主体性”与启蒙主义思潮的深化关系。","options":[],"key":"","answer":"“文学主体性”是启蒙主义思潮在文学领域的深化。首先,精神延续,启蒙主义强调人的觉醒与解放,“文学主体性”将人的价值、尊严、精神自由作为文学的核心。其次,领域拓展,启蒙主义涉及社会、政治、文化等领域,“文学主体性”把它深化到文学,探讨主体性在创作、 接受、作品中的体现。最后,时代呼应,它产生于20世纪80年代思想解放时期,推动文学的人文发展。","max":10,"id":"当代文思-8-essay-39"}],"rawMax":111},{"id":"当代文思-9","title":"章节练习(6章)","questions":[{"n":1,"type":"single","prompt":"文化寻根思潮产生的背景之一是","options":[{"key":"A","text":"西方现代思潮的涌入"},{"key":"B","text":"传统文学的全面复兴"},{"key":"C","text":"商业文学的主导"},{"key":"D","text":"政治文学的强化"}],"key":"A","answer":"西方现代思潮的涌入","max":1," 文学在小说领域的“现代之旅”表现为","options":[{"key":"A","text":"传统章回体小说的延续"},{"key":"B","text":"融合民间文化与现代叙事"},{"key":"C","text":"单纯模仿西方小说"},{"key":"D","text":"政治主题的单一叙事"}],"key":"B","answer":"融合民间文化与现代叙事","max":1,"id":"当代文思-9-single-10"},{"n":11,"type":"single","prompt":"寻根文学在诗歌领域的“现代之旅”体现为","options":[{"key":"A","text":"传统格律诗词的复兴"},{"key":"B","text":"融合民族文化意象与现代诗歌形式"},{"key":"C","text":"政治抒情诗的主导"},{"key":"D","text":"模仿西方浪漫主义诗歌"}],"key":"B","answer":"融合民族文化意象与现代诗歌形式","max":1,"id":"当代文思-9-single-11"},{"n":12,"type":"single","prompt":"文化寻根思潮与现代主义的关联在于","options":[{"key":"A","text":"都排斥本土文化"},{"key":"B","text":"都强调传统复古"},{"key":"C","text":"都追求文学形式与思想的创新"},{"key":"D","text":"都专注于商业价值"}],"key":"C","answer":"都追求文学形式与思想的创新","max":1,"id":"当代文思-9-single-12"},{"n":13,"type":"single","prompt":"寻根文学对本土文化的挖掘主要集中在","options":[{"key":"A","text":"主流精英文化"},{"key":"B","text":"民间文化与地域文化"},{"key":"C","text":"宫廷文化"},{"key":"D","text":"商业文化"}],"key":"B","answer":"民间文化与地域文化","max":1,"id":"当代文思-9-single-13"},{"n":14,"type":"single","prompt":"对寻根文学的批判观点主要认为其","options":[{"key":"A","text":"过度文化阐释,脱离现实"},{"key":"B","text":"对本土文化挖掘不足"},{"key":"C","text":"完全模仿西方"},{"key":"D","text":"缺乏文学形式创新"}],"key":"A","answer":"过度文化阐释,脱离现实","max":1,"id":"当代文思-9-single-14"},{"n":15,"type":"single","prompt":"文化寻根思潮深化了现代主义思潮在的体现","options":[{"key":"A","text":"政治领域"},{"key":"B","text":"文化领域"},{"key":"C","text":"经济领域"},{"key":"D","text":"军事领域"}],"key":"B","answer":"文化领域","max":1,"id":"当代文思-9-single-15"},{"n":16,"type":"fill","prompt":"文化寻根思潮产生的背景之一是 ______ 的涌入。","options":[],"key":"西方现代思潮","answer":"西方现代思潮","max":2,"id":"当代文思-9-fill-16"},{"n":17,"type":"fill","prompt":"寻根文学的代表作家有韩少功、阿城和 ______ 等。","options":[],"key":"莫言","answer":"莫言","max":2,"id":"当代文思-9-fill-17"},{"n":18,"type":"fill","prompt":"寻根文学的现代主义思潮特质包括对本土文化的挖掘、对西方现代派的 ______ 和对文学形式的创新。","options":[],"key":"借鉴","answer":"借鉴","max":2,"id":"当代文思-9-fill-18"},{"n":19,"type":"fill","prompt":"寻根文学的“现代之旅”主要体现在融合本土文化与 ______ 现代手法。","options":[],"key":"西方","answer":"西方","max":2,"id":"当代文思-9-fill-19"},{"n":20,"type":"fill","prompt":"文化寻根思潮的意义在于推动文学对 ______ 文化的关注。","options":[],"key":"本土","answer":"本土","max":2,"id":"当代文思-9-fill-20"},{"n":21,"type":"fill","prompt":"寻根文学产生的主要文学背景是西方现代思潮的涌入与 ______ 反思。","options":[],"key":"本土文化","answer":"本土文化","max":2,"id":"当代文思-9-fill-21"},{"n":22,"type":"fill","prompt":"寻根文学对西方现代派的借鉴主要体现在文学形式与 ______ 技巧方面。","options":[],"key":"叙事","answer":"叙事","max":2,"id":"当代文思-9-fill-22"},{"n":23,"type":"fill","prompt":"文化寻根思潮的局限性在于部分作品过度关注本土文化,对 ______ 社会的关照不足。","options":[],"key":"现实","answer":"现实","max":2,"id":"当代文思-9-fill-23"},{"n":24,"type":"fill","prompt":"寻根文学在小说领域的“现代之旅”表现为融合 ______ 文化与现代叙事。","options":[],"key":"民间","answer":"民间","max":2,"id":"当代文思-9-fill-24"},{"n":25,"type":"fill","prompt":"寻根文学在诗歌领域的“现代之旅”体现为融合民族文化 ______ 与现代诗歌形式。","options":[],"key":"意象","answer":"意象","max":2,"id":"当代文思-9-fill-25"},{"n":26,"type":"fill","prompt":"文化寻根思潮与现代主义的共同之处在于都追求文学形式与 ______ 的创新。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-9-fill-26"},{"n":27,"type":"fill","prompt":"寻根文学对本土文化的挖掘主要集中在民间文化与 ______ 文化。","options":[],"key":"地域","answer":"地域","max":2,"id":"当代文思-9-fill-27"},{"n":28,"type":"term","prompt":"文化寻根思潮","options":[],"key":"","answer":"文化寻根思潮:20世纪80年代出现的文学思潮,背景是西方现代思潮涌入,作家反思本土文化,试图挖掘本土文化资源,融合西方现代文学手法,代表作家有韩少功、阿城、莫言等,致力于探索本土文化与现代文学的结合。","max":4,"id":"当代文思-9-term-28"},{"n":29,"type":"term","prompt":"寻根文学","options":[],"key":"","answer":"寻根文学:属文化寻根思潮的文学创作,代表作家有韩少功、阿城、莫言等。挖掘本土民间、地域文化,借鉴西方现代派手法,在形式和思想上创新,是对本土与西方现代文学融合的探索,在当代文学转型中具有重要意义。","max":4,"id":"当代文思-9-term-29"},{"n":30,"type":"term","prompt":"寻根文学的现代主义思潮特质","options":[],"key":"","answer":"寻根文学的现代主义思潮特质:指寻根文学所具有的现代主义特征,包括挖掘本土文化、借鉴西方现代派文学形式与叙事技巧、创新文学表达形式,在融合本土与西方中体现现代主义的文学追求,推动了文学的现代转型。","max":4,"id":"当代文思-9-term-30"},{"n":31,"type":"term","prompt":"寻根文学的“现代之旅”","options":[],"key":"","answer":"寻根文学的“现代之旅”:指寻根文学融合本土文化资源与西方现代文学手法的探索过程。它既深入挖掘本土民间、地域文化的内涵,又借鉴西方现代派的叙事、结构技巧,在文学形式和思想上实现现代转型。","max":4,"id":"当代文思-9-term-31"},{"n":32,"type":"term","prompt":"文化寻根思潮的意义","options":[],"key":"","answer":"文化寻根思潮的意义:推动文学关注本土文化,挖掘本土文化资源,使文学更具文化底蕴和民族特色;促进了中西方文化的对话与融合,推动文学的现代转型;为文学创作提供新思路,增强了当代文学的文化自觉与民族认同。","max":4,"id":"当代文思-9-term-32"},{"n":33,"type":"term","prompt":"文化寻根思潮的局限性","options":[],"key":"","answer":"文化寻根思潮的局限性:部分作品过度关注本土文化挖掘,陷入文化玄想,对现实社会关照不足;文化阐释存在片面性,未能充分把握本土文化的复杂性与多样性;部分作品融合中西方文化时生硬,缺乏有机统一。","max":4,"id":"当代文思-9-term-33"},{"n":34,"type":"short","prompt":"试阐述寻根文学的现代主义思潮特质。","options":[],"key":"","answer":"寻根文学的现代主义特质主要有三方面:一是对本土文化的深度挖掘,聚焦民间、地域文化的精神内涵与文化价值;二是对西方现代派的积极借鉴,吸收其文学形式与叙事技巧;三是对文学形式的大胆创新,在叙事结构、语言表达等方面突破传统,推动了文学的现代转型。","max":6,"id":"当代文思-9-short-34"},{"n":35,"type":"short","prompt":"简述“寻根文学”思潮的重要意义和局限性。","options":[],"key":"","answer":"意义:推动文学关注本土文化,挖掘本土文化资源,增强文学的文化底蕴和民族特色;促进中西方文化对话与融合,推动文学现代转型;为文学创作提供新思路。局限:部分作品过度关注本土文化,对现实社会关照不足;文化阐释存在片面性;部分作品融合中西方文化时生硬,缺乏有机统一。","max":6,"id":"当代文思-9-short-35"},{"n":36,"type":"short","prompt":"试从文学背景,分析“寻根文学”思潮产生的主要原因。","options":[],"key":"","answer":"“寻根文学”思潮产生的主要文学背景有两点:一是西方现代思潮的大量涌入,为作家提供了新的文学观念和创作方法,促使他们思考文学的现代发展路径;二是对本土文化的反思,作家意识到挖掘本土文化资源的重要性,试图在中西文化碰撞中寻找文学的民族性与现代性的统一。","max":6,"id":"当代文思-9-short-36"},{"n":37,"type":"essay","prompt":"论述寻根文学的现代主义思潮特质。","options":[],"key":"","answer":"寻根文学的现代主义思潮特质体现在三个维度:一是本土文化挖掘的现代性,深入挖掘民间、地域文化中具有现代价值的精神内涵;二是西方现代派借鉴的创造性,将西方现代派的形式技巧与本土文化内容有机融合;三是文学形式创新的突破性,突破传统叙事模式和语言风格,采用多元叙事视角与新颖结构,使形式服务于思想表达。","max":10,"id":"当代文思-9-essay-37"},{"n":38,"type":"essay","prompt":"论述“寻根文学”思潮的意义与局限性。","options":[],"key":"","answer":"“寻根文学”思潮的意义:文化层面推动了对本土文化的重新认识与挖掘;文学层面促进了中西方文学的对话与融合,借鉴西方现代派手法创新文学形式,推动了中国当代文学的现代转型;创作层面提供新的创作思路。其局限:部分作品过度沉迷于文化阐释,脱离现实生活; 对本土文化的挖掘存在片面性;融合中西方文化时显得生硬,缺乏有机统一。","max":10,"id":"当代文思-9-essay-38"},{"n":39,"type":"essay","prompt":"试从诗歌和小说两个领域,谈谈“寻根文学”的现代之旅。","options":[],"key":"","answer":"在小说领域,其现代之旅表现为融合民间文化与现代叙事:阿城《棋王》挖掘民间生存智慧,与冷静克制的现代叙事相结合;韩少功《爸爸爸》以荒诞叙事展现地域文化的愚昧与封闭,对本土文化作批判性反思。在诗歌领域,体现为融合民族文化意象与现代诗歌形式:选取土地、河流等民族意象,运用象征、隐喻、通感等现代手法,实现民族性与现代性的统一。","max":10,"id":"当代文思-9-essay-39"}],"rawMax":111},{"id":"当代文思-10","title":"章节练习(7章)","questions":
