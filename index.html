ey":"A","text":"孟郊"},{"key":"B","text":"白居易"},{"key":"C","text":"王维"},{"key":"D","text":"孟浩然"}],"key":"A","answer":"孟郊","max":1,"id":"唐诗宋词-2-single-15"},{"n":16,"type":"multi","prompt":"下列诗人中,属于盛唐山水田园诗派的有","options":[{"key":"A","text":"王维"},{"key":"B","text":"孟浩然"},{"key":"C","text":"储光羲"},{"key":"D","text":"常建"},{"key":"E","text":"高适"}],"key":"ABCD","answer":"王维；孟浩然；储光羲；常建","max":2,"id":"唐诗宋词-2-multi-16"},{"n":17,"type":"multi","prompt":"下列作品中,属于杜甫“三吏”的有","options":[{"key":"A","text":"《新安吏》"},{"key":"B","text":"《石壕吏》"},{"key":"C","text":"《潼关吏》"},{"key":"D","text":"《长安吏》"},{"key":"E","text":"《洛阳吏》"}],"key":"ABC","answer":"《新安吏》；《石壕吏》；《潼关吏》","max":2,"id":"唐诗宋词-2-multi-17"},{"n":18,"type":"multi","prompt":"下列词人中,属于北宋婉约词派的有","options":[{"key":"A","text":"柳永"},{"key":"B","text":"晏殊"},{"key":"C","text":"晏几道"},{"key":"D","text":"秦观"},{"key":"E","text":"苏轼"}],"key":"ABCD","answer":"柳永；晏殊；晏几道；秦观","max":2,"id":"唐诗宋词-2-multi-18"},{"n":19,"type":"multi","prompt":"下列作品中,属于李商隐无题诗的有","options":[{"key":"A","text":"《无题·相见时难别亦难》"},{"key":"B","text":"《无题·昨夜星辰昨夜风》"},{"key":"C","text":"《锦瑟》"},{"key":"D","text":"《贾生》"},{"key":"E","text":"《隋宫》"}],"key":"ABC","answer":"《无题·相见时难别亦难》；《无题·昨夜星辰昨夜风》；《锦瑟》","max":2,"id":"唐诗宋词-2-multi-19"},{"n":20,"type":"multi","prompt":"下列诗人中,属于中唐韩孟诗派的有","options":[{"key":"A","text":"韩愈"},{"key":"B","text":"孟郊"},{"key":"C","text":"贾岛"},{"key":"D","text":"李贺"},{"key":"E","text":"柳宗元"}],"key":"ABCD","answer":"韩愈；孟郊；贾岛；李贺","max":2,"id":"唐诗宋词-2-multi-20"},{"n":21,"type":"term","prompt":"盛唐气象","options":[],"key":"","answer":"盛唐气象:指盛唐诗歌呈现的蓬勃朝气、昂扬自信、雄浑壮阔的时代风貌,兼具声律与风骨,多抒写积极进取的理想和对自然、人生的热爱,意境开阔明朗,是盛唐时代精神在诗歌中的体现,为建安风骨的丰富展开,代表诗人有李白、王维等。","max":3,"id":"唐诗宋词-2-term-21"},{"n":22,"type":"term","prompt":"新乐府","options":[],"key":"","answer":"新乐府:中唐元稹、白居易等倡导的诗歌体裁,突破汉乐府旧题束缚,“即事名篇”,直接反映社会现实与民生疾苦,强调诗歌“补察时政”“泄导人情”的功能,语言质朴通俗,结构上多 “首句标其目,卒章显其志”,代表作有白居易《卖炭翁》、元稹《田家词》等。","max":3,"id":"唐诗宋词-2-term-22"},{"n":23,"type":"term","prompt":"辛派词人","options":[],"key":"","answer":"辛派词人:指南宋受辛弃疾影响的词人群体,以陆游、刘过、刘克庄、陈亮为代表。多抒发爱国情怀与壮志未酬的悲愤,题材拓展至军事、政治、历史等,风格豪放激昂,善用典故与散文句法,发展辛弃疾“以文为词”的特色,是南宋豪放词派的核心力量。","max":3,"id":"唐诗宋词-2-term-23"},{"n":24,"type":"short","prompt":"简述王维山水田园诗中“诗中有画”的艺术特色。","options":[],"key":"","answer":"1王维精通绘画,其山水田园诗善于捕捉自然景物的色彩、构图与光影,如《山居秋暝》, 兼具层次感与立体感;2注重动静结合,如《鸟鸣涧》以“桂花落”“鸟惊鸣”的动态反衬春夜山林的静谧;3融入禅意,景物描写蕴含空灵淡泊的心境,如《鹿柴》以空寂意境传递禅理,实现“诗”与“画”“禅”的融合。","max":5,"id":"唐诗宋词-2-short-24"},{"n":25,"type":"short","prompt":"简述白居易新乐府的创作主张。","options":[],"key":"","answer":"1强调诗歌“感人心”的力量,提出“根情,苗言,华声,实义”,以情感为核心,内容为根本;2明确创作目的,为君、臣、民、物、事而作,非为文而作;3主张恢复采诗制,使诗歌发挥讽谕时政、干预现实的作用;4艺术上要求“首句标其目,卒章显其志”,语言质朴通俗、直切畅达,便于传播与教化。","max":5,"id":"唐诗宋词-2-short-25"},{"n":26,"type":"short","prompt":"简述柳永对宋词发展的贡献。","options":[],"key":"","answer":"1拓展词的题材,突破“词为艳科”局限,将市井生活、羁旅愁思、都市繁华等纳入词中,如 《雨霖铃·寒蝉凄切》写离愁,《望海潮·东南形胜》绘杭州盛景;2首创慢词,延长篇幅, 丰富词的结构与表现力,善用铺叙,如《八声甘州·对潇潇暮雨洒江天》;3语言通俗化, 吸收民间又语,贴近市民审美,为宋词发展开辟新路径。","max":5,"id":"唐诗宋词-2-short-26"},{"n":27,"type":"short","prompt":"简述李清照前后期词风的差异。","options":[],"key":"","answer":"1前期词多写少女情怀与闺阁闲愁,风格清新明快、活泼娇憨,如《如梦令·常记溪亭日暮》,展现天真烂漫的少女形象;2后期因国破家亡、丈夫病逝,词风转为凄苦悲凉、沉郁顿挫,多抒故国之思、亡夫之痛与孤寂心境,如《声声慢·寻寻觅觅》以叠字开篇,层层铺写漂泊无依的凄苦。","max":5,"id":"唐诗宋词-2-short-27"},{"n":28,"type":"essay","prompt":"结合具体作品,论述杜甫诗歌的“诗史”特征。","options":[],"key":"","answer":"杜甫诗歌被称为“诗史”,因其历史真实性与深刻现实性,反映唐王朝由盛转衰的变迁。 一、记录重大历史事件:《悲陈陶》写唐军战败,《春望》写长安沦陷后的残破。 二、刻画民生疾苦:“三吏”“三别”写百姓在战乱与苛政下的苦难,《石壕吏》揭露官吏横暴。 三、融合个人遭遇与时代命运:《北征》写战乱后农村荒凉并反思时政,《登高》将个人漂泊老病与家国衰亡交织。","max":10,"id":"唐诗宋词-2-essay-28"},{"n":29,"type":"essay","prompt":"结合具体作品,论述苏轼对宋词的革新及其影响。","options":[],"key":"","answer":"苏轼以“以诗为词”为核心对宋词进行革新。 一、突破题材局限:打破“词为艳科”传统,将咏史、言志、边塞、山水、哲理纳入词中,如 《江城子·密州出猎》。 二、革新艺术手法:引入议论,如《水调歌头》以哲理升华人生思考;运用典故;突破音律束缚。 三、丰富风格并影响后世:既有豪放,也有婉约、旷达之作;为辛派词人奠定基础,使词成为独立的文学体裁。","max":10,"id":"唐诗宋词-2-essay-29"}],"rawMax":74},{"id":"唐诗宋词-3","title":"2026年模拟试卷(三)","questions":[{"n":1,"type":"single","prompt":"下列诗人中,不属于“初唐四杰”的是","options":[{"key":"A","text":"王勃"},{"key":"B","text":"杨炯"},{"key":"C","text":"骆宾王"},{"key":"D","text":"陈子昂"}],"key":"D","answer":"陈子昂","max":1,"id":"唐诗宋词-3-single-1"},{"n":2,"type":"single","prompt":"下列作品中,属于孟浩然山水田园诗代表作的是","options":[{"key":"A","text":"《山居秋暝》"},{"key":"B","text":"《过故人庄》"},{"key":"C","text":"《终南山》"},{"key":"D","text":"《鹿柴》"}],"key":"B","answer":"《过故人庄》","max":1,"id":"唐诗宋词-3-single-2"},{"n":3,"type":"single","prompt":"李白诗句“天生我材必有用,千金散尽还复来”出自","options":[{"key":"A","text":"《将进酒》"},{"key":"B","text":"《行路难》(其一)"},{"key":"C","text":"《月下独酌》(其一)"},{"key":"D","text":"《宣州谢朓楼饯别校书叔云》"}],"key":"A","answer":"《将进酒》","max":1,"id":"唐诗宋词-3-single-3"},{"n":4,"type":"single","prompt":"下列杜甫诗作中,属于新题乐府的是","options":[{"key":"A","text":"《登高》"},{"key":"B","text":"《春望》"},{"key":"C","text":"《兵车行》"},{"key":"D","text":"《登岳阳楼》"}],"key":"C","answer":"《兵车行》","max":1,"id":"唐诗宋词-3-single-4"},{"n":5,"type":"single","prompt":"中唐“韦柳”指的是韦应物和下列哪位诗人","options":[{"key":"A","text":"柳宗元"},{"key":"B","text":"刘禹锡"},{"key":"C","text":"李贺"},{"key":"D","text":"孟郊"}],"key":"A","answer":"柳宗元","max":1,"id":"唐诗宋词-3-single-5"},{"n":6,"type":"single","prompt":"下列词人中,被称为“花间鼻祖”的是","options":[{"key":"A","text":"韦庄"},{"key":"B","text":"温庭筠"},{"key":"C","text":"李煜"},{"key":"D","text":"冯延巳"}],"key":"B","answer":"温庭筠","max":1,"id":"唐诗宋词-3-single-6"},{"n":7,"type":"single","prompt":"下列作品中,属于柳永俚俗词代表作的是","options":[{"key":"A","text":"《八声甘州·对潇潇暮雨洒江天》"},{"key":"B","text":"《定风波·自春来》"},{"key":"C","text":"《雨霖铃·寒蝉凄切》"},{"key":"D","text":"《蝶恋花·伫倚危楼风细细》"}],"key":"B","answer":"《定风波·自春来》","max":1,"id":"唐诗宋词-3-single-7"},{"n":8,"type":"single","prompt":"下列诗人中,不属于“韩孟诗派”的是","options":[{"key":"A","text":"韩愈"},{"key":"B","text":"孟郊"},{"key":"C","text":"贾岛"},{"key":"D","text":"白居易"}],"key":"D","answer":"白居易","max":1,"id":"唐诗宋词-3-single-8"},{"n":9,"type":"single","prompt":"李商隐诗句“春蚕到死丝方尽,蜡炬成灰泪始干”出自","options":[{"key":"A","text":"《锦瑟》"},{"key":"B","text":"《无题·相见时难别亦难》"},{"key":"C","text":"《无题·昨夜星辰昨夜风》"},{"key":"D","text":"《贾生》"}],"key":"B","answer":"《无题·相见时难别亦难》","max":1,"id":"唐诗宋词-3-single-9"},{"n":10,"type":"single","prompt":"下列词作中,属于晏殊代表作的是","options":[{"key":"A","text":"《浣溪沙·一曲新词酒一杯》"},{"key":"B","text":"《蝶恋花·庭院深深深几许》"},{"key":"C","text":"《临江仙·梦后楼台高锁》"},{"key":"D","text":"《清平乐·红笺小字》"}],"key":"A","answer":"《浣溪沙·一曲新词酒一杯》","max":1,"id":"唐诗宋词-3-single-10"},{"n":11,"type":"single","prompt":"下列诗人中,以“长吉体”著称的是","options":[{"key":"A","text":"李白"},{"key":"B","text":"李贺"},{"key":"C","text":"杜牧"},{"key":"D","text":"刘禹锡"}],"key":"B","answer":"李贺","max":1,"id":"唐诗宋词-3-single-11"},{"n":12,"type":"single","prompt":"下列作品中,属于周邦彦“清真词”代表作的是","options":[{"key":"A","text":"《苏幕遮·燎沉香》"},{"key":"B","text":"《青玉案·元夕》"},{"key":"C","text":"《摸鱼儿·更能消几番风雨》"},{"key":"D","text":"《永遇乐·京又北固亭怀古》"}],"key":"A","answer":"《苏幕遮·燎沉香》","max":1,"id":"唐诗宋词-3-single-12"},{"n":13,"type":"single","prompt":"下列词人中,不属于“南渡词人”的是","options":[{"key":"A","text":"李清照"},{"key":"B","text":"朱敦儒"},{"key":"C","text":"辛弃疾"},{"key":"D","text":"张元干"}],"key":"C","answer":"辛弃疾","max":1,"id":"唐诗宋词-3-single-13"},{"n":14,"type":"single","prompt":"下列诗作中,属于陆游爱国诗代表作的是","options":[{"key":"A","text":"《游山西村》"},{"key":"B","text":"《临安春雨初霁》"},{"key":"C","text":"《示儿》"},{"key":"D","text":"《书愤》"}],"key":"D","answer":"《书愤》","max":1,"id":"唐诗宋词-3-single-14"},{"n":15,"type":"single","prompt":"下列词人中,著有《词源》的是","options":[{"key":"A","text":"姜夔"},{"key":"B","text":"张炎"},{"key":"C","text":"吴文英"},{"key":"D","text":"史达祖"}],"key":"B","answer":"张炎","max":1,"id":"唐诗宋词-3-single-15"},{"n":16,"type":"multi","prompt":"下列诗人中,属于盛唐边塞诗派的有","options":[{"key":"A","text":"高适"},{"key":"B","text":"岑参"},{"key":"C","text":"王昌龄"},{"key":"D","text":"王之涣"},{"key":"E","text":"王维"}],"key":"ABCD","answer":"高适；岑参；王昌龄；王之涣","max":2,"id":"唐诗宋词-3-multi-16"},{"n":17,"type":"multi","prompt":"下列作品中,属于白居易新乐府的有","options":[{"key":"A","text":"《卖炭翁》"},{"key":"B","text":"《长恨歌》"},{"key":"C","text":"《琵琶行》"},{"key":"D","text":"《观刈麦》"},{"key":"E","text":"《杜陵叟》"}],"key":"ADE","answer":"《卖炭翁》；《观刈麦》；《杜陵叟》","max":2,"id":"唐诗宋词-3-multi-17"},{"n":18,"type":"multi","prompt":"下列词人中,属于北宋豪放词派的有","options":[{"key":"A","text":"苏轼"},{"key":"B","text":"辛弃疾"},{"key":"C","text":"范仲淹"},{"key":"D","text":"柳永"},{"key":"E","text":"王安石"}],"key":"ACE","answer":"苏轼；范仲淹；王安石","max":2,"id":"唐诗宋词-3-multi-18"},{"n":19,"type":"multi","prompt":"下列诗作中,属于晚唐咏史诗的有","options":[{"key":"A","text":"杜牧《赤壁》"},{"key":"B","text":"李商隐《贾生》"},{"key":"C","text":"温庭筠《苏武庙》"},{"key":"D","text":"刘禹锡《西塞山怀古》"},{"key":"E","text":"杜甫《蜀相》"}],"key":"ABCD","answer":"杜牧《赤壁》；李商隐《贾生》；温庭筠《苏武庙》；刘禹锡《西塞山怀古》","max":2,"id":"唐诗宋词-3-multi-19"},{"n":20,"type":"multi","prompt":"下列词人中,属于南宋姜派词人的有","options":[{"key":"A","text":"姜夔"},{"key":"B","text":"史达祖"},{"key":"C","text":"吴文英"},{"key":"D","text":"张炎"},{"key":"E","text":"刘克庄"}],"key":"ABCD","answer":"姜夔；史达祖；吴文英；张炎","max":2,"id":"唐诗宋词-3-multi-20"},{"n":21,"type":"term","prompt":"初唐四杰","options":[],"key":"","answer":"初唐四杰:指唐高宗至武后初年的王勃、杨炯、卢照邻、骆宾王四位诗人。他们仕途失意, 诗歌突破宫廷局限,视野由台阁移向江山、塞漠与市井,题材扩大,风格雄浑,批判“上官体”,为初唐诗歌注入“气骨”,推动唐诗向盛唐高峰过渡。","max":3,"id":"唐诗宋词-3-term-21"},{"n":22,"type":"term","prompt":"诗史","options":[],"key":"","answer":"诗史:指杜甫的诗歌。其诗深刻反映唐王朝由盛转衰的历史,聚焦安史之乱前后的社会现实,如《自京赴奉先县咏怀五百字》写战乱前的社会矛盾,“三吏”“三别”写战乱中的民生疾苦,兼具历史真实性与文学艺术性,被后世称为“诗史”。","max":3,"id":"唐诗宋词-3-term-22"},{"n":23,"type":"term","prompt":"姜派词人","options":[],"key":"","answer":"姜派词人:指南宋受姜夔影响的词人群体,以史达祖、吴文英、张炎等为代表。词作追求 “骚雅”格调,注重音律谐和与意境空灵,善用咏物寄托家国情怀,语言精致凝练,讲究炼字与章法,将南宋词的“雅化”推向极致,代表作有姜夔《暗香》《疏影》等。","max":3,"id":"唐诗宋词-3-term-23"},{"n":24,"type":"short","prompt":"简述陈子昂诗歌革新的主要主张。","options":[],"key":"","answer":"1标举“风雅兴寄”,主张继承《诗经》风雅传统,蕴含深沉寄托,批判齐梁诗“彩丽竞繁, 而兴寄都绝”的弊病;2倡导“汉魏风骨”,推崇汉魏诗歌刚健雄浑的风格,反对初唐“上官体”绮靡轻艳的文风;3创作上以《感遇》三十八首仿阮籍《咏怀》,借比兴抒发人生理想与对现实的批判,为盛唐确立“声律风骨兼备”的方向。","max":5,"id":"唐诗宋词-3-short-24"},{"n":25,"type":"short","prompt":"简述高适边塞诗的艺术特点。","options":[],"key":"","answer":"1内容上聚焦边塞现实,既歌颂将士英勇抗敌的精神,如《燕歌行》写将士舍身报国,又揭露军中苦乐不均的矛盾;2风格沉雄悲壮,语言质朴苍劲,善用叙事与议论结合的手法,如 《蓟门五首》抒发忧国忧民之情;3擅长以七言歌行体展现边塞壮阔景象与复杂情感,节奏跌宕,气势充沛。","max":5,"id":"唐诗宋词-3-short-25"},{"n":26,"type":"short","prompt":"简述李煜词的艺术特色。","options":[],"key":"","answer":"1前期词多写宫廷享乐与男女情爱,风格绮靡柔丽,如《玉楼春·晚妆初了明肌雪》;2后期因亡国被俘,转向抒发故国之思、亡国之痛,风格沉郁悲凉,如《相见欢·无言独上西楼》;3善用白描与比喻,语言自然流畅,如《虞美人·春花秋月何时了》以江水喻愁,突破花间词绮靡局限。","max":5,"id":"唐诗宋词-3-short-26"},{"n":27,"type":"short","prompt":"简述姜夔咏物词的创作特点。","options":[],"key":"","answer":"1注重“寄托”,借咏物暗含家国情怀与个人身世感慨,如《暗香》《疏影》借咏梅寄托故都之思与漂泊之愁;2善用“清空”手法,不刻意雕琢物象,侧重营造空灵意境,如《齐天乐· 蟋蟀》引发思乡怀旧之情;3讲究音律与炼字,语言精致雅洁,避免俚俗,如“千树压、西湖寒碧”(《暗香》),兼具画面感与韵味。","max":5,"id":"唐诗宋词-3-short-27"},{"n":28,"type":"essay","prompt":"结合具体作品,论述王维山水田园诗中的禅意。","options":[],"key":"","answer":"王维山水田园诗中的禅意源于其对佛教禅宗的信仰。 一、空灵幽静的景物营造:善选清幽静谧的意象,以极简笔墨勾勒空灵意境,如《鹿柴》 《鸟鸣涧》以人语、鸟鸣反衬山林静谧。 二、心境淡泊超脱:景物是淡泊心境的投射,如《终南别业》写随遇而安,《竹里馆》写超脱世俗。 三、“物我两忘”的观照方式:以物我合一的视角写自然,如《山居秋暝》,传递顺应自然的禅悟。","max":10,"id":"唐诗宋词-3-essay-28"},{"n":29,"type":"essay","prompt":"结合具体作品,论述辛弃疾“英雄之词”的内涵与艺术表现。","options":[],"key":"","answer":"辛弃疾“英雄之词”是其爱国情怀、壮志未酬的悲愤与英雄人格的集中体现。 一、核心内涵:爱国壮志与悲愤情怀。他志在收复中原却屡遭排挤,《破阵子》《永遇乐· 京又北固亭怀古》抒报国理想与自身失意。 二、艺术表现:(一)善用历史典故,如《水龙吟·登建康赏心亭》表达渴望报国;(二) 豪放与沉郁结合,如《菩萨蛮·书江西造又壁》情感层次丰富。","max":10,"id":"唐诗宋词-3-essay-29"}],"rawMax":74},{"id":"唐诗宋词-4","title":"章节练习(1章)","questions":[{"n":1,"type":"single","prompt":"初唐诗歌革新的主要针对对象是","options":[{"key":"A","text":"汉魏古朴文风"},{"key":"B","text":"南朝齐梁绮靡文风"},{"key":"C","text":"西晋玄言诗风"},{"key":"D","text":"北朝豪放诗风"}],"key":"B","answer":"南朝齐梁绮靡文风","max":1,"id":"唐诗宋词-4-single-1"},{"n":2,"type":"single","prompt":"下列哪位诗人是隋末唐初能独立于宫廷诗坛之外的隐士诗人","options":[{"key":"A","text":"王勃"},{"key":"B","text":"王绩"},{"key":"C","text":"杨炯"},{"key":"D","text":"卢照邻"}],"key":"B","answer":"王绩","max":1,"id":"唐诗宋词-4-single-2"},{"n":3,"type":"single","prompt":"“初唐四杰”中擅长七言歌行的是","options":[{"key":"A","text":"王勃、杨炯"},{"key":"B","text":"卢照邻、骆宾王"},{"key":"C","text":"王勃、卢照邻"},{"key":"D","text":"杨炯、骆宾王"}],"key":"B","answer":"卢照邻、骆宾王","max":1,"id":"唐诗宋词-4-single-3"},{"n":4,"type":"single","prompt":"下列哪首诗是王绩的代表作,且已是大体合格的五言律诗","options":[{"key":"A","text":"《秋夜喜遇王处士》"},{"key":"B","text":"《在京思故园见乡人问》"},{"key":"C","text":"《野望》"},{"key":"D","text":"《赠程处士》"}],"key":"C","answer":"《野望》","max":1,"id":"唐诗宋词-4-single-4"},{"n":5,"type":"single","prompt":"“文章四友”不包括以下哪位诗人","options":[{"key":"A","text":"李峤"},{"key":"B","text":"苏味道"},{"key":"C","text":"崔融"},{"key":"D","text":"陈子昂"}],"key":"D","answer":"陈子昂","max":1,"id":"唐诗宋词-4-single-5"},{"n":6,"type":"single","prompt":"下列诗人中,对律诗定型作出重要贡献,被并称为“沈宋”的是","options":[{"key":"A","text":"沈佺期、宋之问"},{"key":"B","text":"沈约、宋之问"},{"key":"C","text":"沈佺期、宋玉"},{"key":"D","text":"沈约、宋玉"}],"key":"A","answer":"沈佺期、宋之问","max":1,"id":"唐诗宋词-4-single-6"},{"n":7,"type":"single","prompt":"“吴中四士”不包括","options":[{"key":"A","text":"贺知章"},{"key":"B","text":"张旭"},{"key":"C","text":"张若虚"},{"key":"D","text":"杜审言"}],"key":"D","answer":"杜审言","max":1,"id":"唐诗宋词-4-single-7"},{"n":8,"type":"single","prompt":"陈子昂在《修竹篇序》中明确标举的诗歌标准是","options":[{"key":"A","text":"绮丽词采"},{"key":"B","text":"风雅兴寄、建安气骨"},{"key":"C","text":"玄言哲理"},{"key":"D","text":"宫廷雅乐"}],"key":"B","answer":"风雅兴寄、建安气骨","max":1,"id":"唐诗宋词-4-single-8"},{"n":9,"type":"single","prompt":"张说的哪首诗体现了“重气轻生知许国”的精神,对盛唐诗人精神风貌影响深远","options":[{"key":"A","text":"《巡边在河北作》"},{"key":"B","text":"《邺都引》"},{"key":"C","text":"《送梁六自洞庭山作》"},{"key":"D","text":"《幽州夜饮》"}],"key":"A","answer":"《巡边在河北作》","max":1,"id":"唐诗宋词-4-single-9"},{"n":10,"type":"single","prompt":"初唐诗歌形式发展中,长篇歌行的扩展主要体现在","options":[{"key":"A","text":"篇幅缩短,内容单一"},{"key":"B","text":"篇幅加大,内容从边塞闺怨扩展到帝京繁华、怀古浩叹等"},{"key":"C","text":"仅局限于闺怨题材"},{"key":"D","text":"完全摒弃齐梁词采"}],"key":"B","answer":"篇幅加大,内容从边塞闺怨扩展到帝京繁华、怀古浩叹等","max":1,"id":"唐诗宋词-4-single-10"},{"n":11,"type":"single","prompt":"下列哪首诗是张若虚的代表作,代表初唐歌行向盛唐发展的最高成就","options":[{"key":"A","text":"《代悲白头翁》"},{"key":"B","text":"《春江花月夜》"},{"key":"C","text":"《长安古意》"},{"key":"D","text":"《帝京篇》"}],"key":"B","answer":"《春江花月夜》","max":1,"id":"唐诗宋词-4-single-11"},{"n":12,"type":"single","prompt":"“初唐四杰”的诗歌视野从台阁移到","options":[{"key":"A","text":"宫廷"},{"key":"B","text":"江山、塞漠和市井"},{"key":"C","text":"山林"},{"key":"D","text":"田园"}],"key":"B","answer":"江山、塞漠和市井","max":1,"id":"唐诗宋词-4-single-12"},{"n":13,"type":"single","prompt":"杜审言的哪首诗被认为有盛唐之音,笔力横壮","options":[{"key":"A","text":"《和晋陵陆丞早春游望》"},{"key":"B","text":"《春日京中有怀》"},{"key":"C","text":"《登襄阳城》"},{"key":"D","text":"《渡湘江》"}],"key":"C","answer":"《登襄阳城》","max":1,"id":"唐诗宋词-4-single-13"},{"n":14,"type":"single","prompt":"初唐律诗和绝句规范化过程中,提出“六对”“八对”对偶方法的是","options":[{"key":"A","text":"上官仪"},{"key":"B","text":"沈佺期"},{"key":"C","text":"宋之问"},{"key":"D","text":"元兢"}],"key":"A","answer":"上官仪","max":1,"id":"唐诗宋词-4-single-14"},{"n":15,"type":"single","prompt":"下列诗人中,其山水诗为盛唐山水田园诗先导,将山水诗与田园诗在别业诗中初步合流的是","options":[{"key":"A","text":"王勃"},{"key":"B","text":"杨炯"},{"key":"C","text":"王绩"},{"key":"D","text":"卢照邻"}],"key":"C","answer":"王绩","max":1,"id":"唐诗宋词-4-single-15"},{"n":16,"type":"multi","prompt":"初唐诗歌革新的三个阶段包括","options":[{"key":"A","text":"唐太宗贞观年间,革新主张主要来自宫廷,魏徵提出融合江左清绮与河朔贞刚"},{"key":"B","text":"唐高宗时期,革新呼声主要来自民间,“初唐四杰”批判“上官体”"},{"key":"C","text":"武则天到中宗时期,陈子昂标举风雅兴寄和建安气骨"},{"key":"D","text":"玄宗开元年间,李白倡导复古革新"},{"key":"E","text":"肃宗至德年间,杜甫推动新题乐府创作"}],"key":"ABC","answer":"唐太宗贞观年间,革新主张主要来自宫廷,魏徵提出融合江左清绮与河朔贞刚；唐高宗时期,革新呼声主要来自民间,“初唐四杰”批判“上官体”；武则天到中宗时期,陈子昂标举风雅兴寄和建安气骨","max":2,"id":"唐诗宋词-4-multi-16"},{"n":17,"type":"multi","prompt":"初唐诗歌形式的发展主要体现在","options":[{"key":"A","text":"长篇歌行的扩展,篇幅加大,内容拓展"},{"key":"B","text":"律诗和绝句的规范化,沈佺期、宋之问完善格律"},{"key":"C","text":"古体诗歌的渐变,陈子昂等恢复汉魏古诗风貌"},{"key":"D","text":"完全摒弃古体诗,仅发展近体诗"},{"key":"E","text":"取消诗歌押韵规则"}],"key":"ABC","answer":"长篇歌行的扩展,篇幅加大,内容拓展；律诗和绝句的规范化,沈佺期、宋之问完善格律；古体诗歌的渐变,陈子昂等恢复汉魏古诗风貌","max":2,"id":"唐诗宋词-4-multi-17"},{"n":18,"type":"multi","prompt":"“初唐四杰”诗歌在思想艺术方面的共同之处有","options":[{"key":"A","text":"歌颂大唐帝国繁荣气象,流露对盛世的自豪感"},{"key":"B","text":"抒发怀才不遇的不平之气"},{"key":"C","text":"诗歌视野从台阁移到江山、塞漠和市井"},{"key":"D","text":"卢照邻、骆宾王擅长七言歌行,王勃、杨炯擅长五律"},{"key":"E","text":"完全继承齐梁绮靡文风"}],"key":"ABCD","answer":"歌颂大唐帝国繁荣气象,流露对盛世的自豪感；抒发怀才不遇的不平之气；诗歌视野从台阁移到江山、塞漠和市井；卢照邻、骆宾王擅长七言歌行,王勃、杨炯擅长五律","max":2,"id":"唐诗宋词-4-multi-18"},{"n":19,"type":"multi","prompt":"“吴中四士”诗歌的特点有","options":[{"key":"A","text":"描绘吴越清丽山水"},{"key":"B","text":"抒写亲切动人的人生感触"},{"key":"C","text":"意境纯净优美,旋律悠扬宛转"},{"key":"D","text":"风格绮靡浮艳,侧重宫廷生活描写"},{"key":"E","text":"张若虚 《春江花月夜》是其代表"}],"key":"ABCE","answer":"描绘吴越清丽山水；抒写亲切动人的人生感触；意境纯净优美,旋律悠扬宛转；张若虚 《春江花月夜》是其代表","max":2,"id":"唐诗宋词-4-multi-19"},{"n":20,"type":"multi","prompt":"陈子昂诗歌革新主张的内容包括","options":[{"key":"A","text":"批判齐梁诗“彩丽竞繁,而兴寄都绝”"},{"key":"B","text":"标举风雅兴寄和建安气骨"},{"key":"C","text":"主张恢复汉魏古诗浑穆气象"},{"key":"D","text":"推崇齐梁绮丽词采"},{"key":"E","text":"强调诗歌应反映宫廷生活"}],"key":"ABC","answer":"批判齐梁诗“彩丽竞繁,而兴寄都绝”；标举风雅兴寄和建安气骨；主张恢复汉魏古诗浑穆气象","max":2,"id":"唐诗宋词-4-multi-20"},{"n":21,"type":"term","prompt":"初唐四杰","options":[],"key":"","answer":"初唐四杰:指唐高宗至武后初年的王勃、杨炯、卢照邻、骆宾王四位诗人。他们仕途失意, 诗歌突破宫廷局限,视野由台阁移向江山、塞漠与市井,题材扩大,风格雄浑,批判“上官体”,为初唐诗歌注入“气骨”,推动唐诗向盛唐高峰过渡。","max":3,"id":"唐诗宋词-4-term-21"},{"n":22,"type":"term","prompt":"文章四友","options":[],"key":"","answer":"文章四友:指武则天后期至中宗时期的李峤、苏味道、崔融、杜审言四位诗人,是初唐重要的宫廷诗人。他们参与编《三教珠英》,在律诗定型中发挥作用,李峤“百咏”推动五律普及,杜审言五律造诣高,对后世律诗发展有重要影响。","max":3,"id":"唐诗宋词-4-term-22"},{"n":23,"type":"term","prompt":"吴中四士","options":[],"key":"","answer":"吴中四士:指中宗神龙年至玄宗开元初名扬上京的贺知章、张旭、张若虚、包融四位诗人。 他们诗歌多描绘吴越清丽山水,抒写人生感触,意境纯净优美、旋律悠扬宛转,张若虚《春江花月夜》为代表作,为盛唐山水田园诗先导。","max":3,"id":"唐诗宋词-4-term-23"},{"n":24,"type":"term","prompt":"沈宋","options":[],"key":"","answer":"沈宋:指武则天、中宗时期的诗人沈佺期与宋之问,二人以诗名并称。他们在律诗创作上造诣高、数量多,进一步规范平仄粘对、句数用韵等规则,使律诗在形式上定型,古体与律诗的界限趋于清晰,对唐诗近体诗的发展意义重大。","max":3,"id":"唐诗宋词-4-term-24"},{"n":25,"type":"term","prompt":"初唐诗歌革新","options":[],"key":"","answer":"初唐诗歌革新:指初唐针对齐梁绮靡文风的改革运动,分三个阶段:贞观年间宫廷主导,魏徵主张融合江左清绮与河朔贞刚;高宗时期“初唐四杰”批判“上官体”;武后到中宗时期陈子昂标举风雅兴寄和建安气骨,为盛唐“声律风骨兼备”奠基。","max":3,"id":"唐诗宋词-4-term-25"},{"n":26,"type":"short","prompt":"简述初唐诗歌革新的三个阶段及其重要影响因素。","options":[],"key":"","answer":"初唐诗歌革新分三个阶段:一是贞观年间,主张来自宫廷,唐太宗提倡朴实文风,魏徵主张融合江左清绮与河朔贞刚,动因是改革政治文风;二是高宗时期,呼声来自民间,“初唐四杰”批判“上官体”,追求刚健诗风;三是武后到中宗时期,陈子昂标举风雅兴寄和建安气骨,重视诗歌精神内涵。","max":5,"id":"唐诗宋词-4-short-26"},{"n":27,"type":"short","prompt":"初唐诗歌形式的发展主要体现在哪三个方面?","options":[],"key":"","answer":"初唐诗歌形式发展主要有三方面:一是长篇歌行的扩展,内容从边塞闺怨拓展到帝京繁华、 怀古浩叹、人生哲理,“初唐四杰”歌行气象恢宏;二是律诗和绝句的规范化,沈佺期、宋之问完善平仄粘对、句数用韵规则,李峤“百咏”示范五律;三是古体诗的渐变,陈子昂《感遇》效法汉魏古诗,区分古体与律体。","max":5,"id":"唐诗宋词-4-short-27"},{"n":28,"type":"short","prompt":"从王绩的《野望》谈其诗歌特点。","options":[],"key":"","answer":"王绩《野望》是大体合格的五言律诗:一是题材上描写田园生活闲逸情趣与隐士林泉高致, 将田园诗与山水诗在别业诗中初步合流,如“树树皆秋色,山山唯落晖”;二是风格平淡自然,摆脱宫廷诗典雅富丽,如“相顾无相识,长歌怀采薇”,语言质朴,不事雕琢,为盛唐山水田园诗先导。","max":5,"id":"唐诗宋词-4-short-28"},{"n":29,"type":"short","prompt":"从陈子昂的《登幽州台歌》谈其诗歌的革新主张。","options":[],"key":"","answer":"陈子昂《登幽州台歌》以苍茫意境体现其诗歌革新主张:一是批判齐梁诗“彩丽竞繁,而兴寄都绝”,此诗无华丽辞藻,以真情抒发;二是标举风雅兴寄和建安气骨,诗中的孤独与壮志继承建安文人抒写人生理想的慷慨意气;三是主张恢复汉魏古诗浑穆气象,诗风古朴雄浑,为唐诗注入刚健精神。","max":5,"id":"唐诗宋词-4-short-29"},{"n":30,"type":"essay","prompt":"论述“初唐四杰”的诗歌在思想艺术方面的共同之处和各自特点。","options":[],"key":"","answer":"“初唐四杰”诗歌思想艺术的共同之处:思想上歌颂大唐繁荣气象,怀有“取公卿于朝夕”的理想,又有对世事沧桑的隐忧;艺术上拓展诗歌视野至江山、塞漠和市井,以比兴寄托融入齐梁体。各自特点:卢照邻善用骚体抒悲激不平;骆宾王边塞与山水诗结合,《在狱咏蝉》咏物言志;王勃山水行役诗意境开阔,《送杜少府之任蜀川》豁达;杨炯乐府诗刚健,如《从军行》。","max":10,"id":"唐诗宋词-4-essay-30"},{"n":31,"type":"essay","prompt":"从张说的《邺都引》谈其诗歌表现的精神风貌,并分析这种精神风貌对盛唐诗歌的影","options":[],"key":"","answer":"响。 张说《邺都引》感慨曹操草创天下的英雄业绩与文采风流已成过往,唯西园明月、秋风留存。 一、精神风貌:(一)对英雄业绩的景慕,赞美曹操,流露自身建功立业的抱负;(二)刚健昂扬的志气,虽有沧桑之感却无消沉,体现“重气轻生知许国”的精神。 二、对盛唐诗歌的影响:为盛唐诗人树立榜样,激发其对功名理想的追求,推动盛唐诗歌 “风骨”的形成。","max":10,"id":"唐诗宋词-4-essay-31"},{"n":32,"type":"essay","prompt":"论述初唐诗歌形式发展的三个方面对盛唐诗歌的影响。","options":[],"key":"","answer":"初唐诗歌形式发展的三方面对盛唐影响重大:一是长篇歌行的扩展,为盛唐歌行奠定基础, 李白《蜀道难》、杜甫《兵车行》均得益于其艺术积累;二是律诗和绝句的规范化,沈佺期、宋之问完善格律,使盛唐律绝成熟,王维、孟浩然五律与王昌龄、李白七绝均依赖此基础;三是古体诗的渐变,陈子昂等区分古体与律体、恢复汉魏风貌,为盛唐古体诗提供借鉴。","max":10,"id":"唐诗宋词-4-essay-32"},{"n":33,"type":"essay","prompt":"论述陈子昂的诗歌革新主张及其在诗歌创作中的实践,以及对盛唐诗歌的影响。","options":[],"key":"","answer":"一、革新主张:批判齐梁诗“彩丽竞繁,而兴寄都绝”,标举风雅兴寄和建安气骨,主张恢复汉魏古诗浑穆气象,强调诗歌应抒写人生理想与刚健精神。 二、创作实践:《感遇》三十八首仿阮籍《咏怀》,《登幽州台歌》以苍茫意境写孤独与壮志。 三、对盛唐的影响:为盛唐确立“风骨”标准,比兴寄托被王维、杜甫等借鉴,为盛唐诗歌高潮奠定基础。","max":10,"id":"唐诗宋词-4-essay-33"}],"rawMax":100},{"id":"唐诗宋词-5","title":"章节练习(2章)","questions":[{"n":1,"type":"single","prompt":"提出“盛唐气象”这一概念的文学批评家是","options":[{"key":"A","text":"严羽"},{"key":"B","text":"林庚"},{"key":"C","text":"殷璠"},{"key":"D","text":"胡应麟"}],"key":"A","answer":"严羽","max":1,"id":"唐诗宋词-5-single-1"},{"n":2,"type":"single","prompt":"盛唐诗歌“声律风骨兼备”风貌形成的时间是","options":[{"key":"A","text":"贞观末年"},{"key":"B","text":"景云年间"},{"key":"C","text":"开元十五年后"},{"key":"D","text":"天宝年间"}],"key":"C","answer":"开元十五年后","max":1,"id":"唐诗宋词-5-single-2"},{"n":3,"type":"single","prompt":"下列诗人中,不属于盛唐山水田园诗代表人物的是","options":[{"key":"A","text":"王维"},{"key":"B","text":"孟浩然"},{"key":"C","text":"储光羲"},{"key":"D","text":"高适"}],"key":"D","answer":"高适","max":1,"id":"唐诗宋词-5-single-3"},{"n":4,"type":"single","prompt":"王维山水田园诗中,体现“诗中有画”特点的代表作是","options":[{"key":"A","text":"《山居秋暝》"},{"key":"B","text":"《春晓》"},{"key":"C","text":"《使至塞上》"},{"key":"D","text":"《过故人庄》"}],"key":"C","answer":"《使至塞上》","max":1,"id":"唐诗宋词-5-single-4"},{"n":5,"type":"single","prompt":"下列诗句中,出自高适《燕歌行》的是","options":[{"key":"A","text":"大漠孤烟直,长河落日圆"},{"key":"B","text":"战士军前半死生,美人帐下犹歌舞"},{"key":"C","text":"忽如一夜春风来,千树万树梨花开"},{"key":"D","text":"莫愁前路无知己,天下谁人不识君"}],"key":"B","answer":"战士军前半死生,美人帐下犹歌舞","max":1,"id":"唐诗宋词-5-single-5"},{"n":6,"type":"single","prompt":"盛唐边塞诗中,善于以奇丽色彩表现西域风土的诗人是","options":[{"key":"A","text":"高适"},{"key":"B","text":"岑参"},{"key":"C","text":"王昌龄"},{"key":"D","text":"王之涣"}],"key":"B","answer":"岑参","max":1,"id":"唐诗宋词-5-single-6"},{"n":7,"type":"single","prompt":"孟浩然田园诗的风格特点主要是","options":[{"key":"A","text":"雄浑壮阔"},{"key":"B","text":"清新自然"},{"key":"C","text":"绮丽华美"},{"key":"D","text":"沉郁顿挫"}],"key":"B","answer":"清新自然","max":1,"id":"唐诗宋词-5-single-7"},{"n":8,"type":"single","prompt":"下列作品中,属于盛唐送别诗代表作的是","options":[{"key":"A","text":"王维《送元二使安西》"},{"key":"B","text":"李白《蜀道难》"},{"key":"C","text":"杜甫《春望》"},{"key":"D","text":"岑参《走马川行奉送出师西征》"}],"key":"A","answer":"王维《送元二使安西》","max":1,"id":"唐诗宋词-5-single-8"},{"n":9,"type":"single","prompt":"盛唐诗歌风骨的内涵不包括","options":[{"key":"A","text":"对时代与人生的积极思考"},{"key":"B","text":"追求建功立业的自信与傲骨"},{"key":"C","text":"对独立人格与高洁品质的赞美"},{"key":"D","text":"对现实的消极避世与隐逸情怀"}],"key":"D","answer":"对现实的消极避世与隐逸情怀","max":1,"id":"唐诗宋词-5-single-9"},{"n":10,"type":"single","prompt":"下列诗人中,被称为“七绝圣手”的是","options":[{"key":"A","text":"李白"},{"key":"B","text":"王昌龄"},{"key":"C","text":"王维"},{"key":"D","text":"岑参"}],"key":"B","answer":"王昌龄","max":1,"id":"唐诗宋词-5-single-10"},{"n":11,"type":"single","prompt":"王维《终南山》一诗,主要采用的表现手法是","options":[{"key":"A","text":"以小见大"},{"key":"B","text":"移步换景"},{"key":"C","text":"借景抒情"},{"key":"D","text":"托物言志"}],"key":"B","answer":"移步换景","max":1,"id":"唐诗宋词-5-single-11"},{"n":12,"type":"single","prompt":"盛唐山水田园诗繁荣的社会原因不包括","options":[{"key":"A","text":"盛唐取士路径多,征召辟举为辅助方式"},{"key":"B","text":"经济繁荣为地主提供寄傲林泉的物质条件"},{"key":"C","text":"交通便利,文人游学观览风气盛行"},{"key":"D","text":"社会动荡,文人避乱归隐"}],"key":"D","answer":"社会动荡,文人避乱归隐","max":1,"id":"唐诗宋词-5-single-12"},{"n":13,"type":"single","prompt":"下列诗句中,体现盛唐边塞诗豪迈风格的是","options":[{"key":"A","text":"春风又绿江南岸,明月何时照我还"},{"key":"B","text":"葡萄美酒夜光杯,欲饮琵琶马上催"},{"key":"C","text":"无可奈何花落去,似曾相识燕归来"},{"key":"D","text":"问君能有几多愁?恰似一江春水向东流"}],"key":"B","answer":"葡萄美酒夜光杯,欲饮琵琶马上催","max":1,"id":"唐诗宋词-5-single-13"},{"n":14,"type":"single","prompt":"孟浩然《秋登万山寄张五》一诗,主要抒发的情感是","options":[{"key":"A","text":"思乡之情"},{"key":"B","text":"怀友之情"},{"key":"C","text":"忧国忧民之情"},{"key":"D","text":"怀才不遇之情"}],"key":"B","answer":"怀友之情","max":1,"id":"唐诗宋词-5-single-14"},{"n":15,"type":"single","prompt":"盛唐诗歌声律完备的体现不包括","options":[{"key":"A","text":"律诗体裁的成熟与普及"},{"key":"B","text":"古体诗与律诗的明确分界"},{"key":"C","text":"歌行与绝句的兴盛"},{"key":"D","text":"完全摒弃齐梁词采"}],"key":"D","answer":"完全摒弃齐梁词采","max":1,"id":"唐诗宋词-5-single-15"},{"n":16,"type":"multi","prompt":"盛唐诗歌革新的基本精神包括","options":[{"key":"A","text":"将大雅颂声与建安风骨相结合"},{"key":"B","text":"融合齐梁声律词采与汉魏风骨"},{"key":"C","text":"主张诗歌应反映现实,批判时政"},{"key":"D","text":"强调诗歌的抒情性与意境美"},{"key":"E","text":"提倡以复古为革新"}],"key":"ABE","answer":"将大雅颂声与建安风骨相结合；融合齐梁声律词采与汉魏风骨；提倡以复古为革新","max":2,"id":"唐诗宋词-5-multi-16"},{"n":17,"type":"multi","prompt":"王维山水田园诗的艺术特点有","options":[{"key":"A","text":"诗中有画,融合绘画技巧"},{"key":"B","text":"意境空灵,蕴含禅意"},{"key":"C","text":"风格多样,兼取大谢、小谢体"},{"key":"D","text":"善用白描,语言质朴"},{"key":"E","text":"以乐入诗,声韵和谐"}],"key":"ABCE","answer":"诗中有画,融合绘画技巧；意境空灵,蕴含禅意；风格多样,兼取大谢、小谢体；以乐入诗,声韵和谐","max":2,"id":"唐诗宋词-5-multi-17"},{"n":18,"type":"multi","prompt":"岑参边塞诗的主要成就体现在","options":[{"key":"A","text":"以英雄主义精神描绘边塞行军、征战情景"},{"key":"B","text":"用瑰丽色彩表现西域风土民俗"},{"key":"C","text":"直抒边愁,流露建功与思乡的矛盾"},{"key":"D","text":"善用夸张、比喻等手法创造奇险意境"},{"key":"E","text":"以写实手法反映边塞疾苦"}],"key":"ABCD","answer":"以英雄主义精神描绘边塞行军、征战情景；用瑰丽色彩表现西域风土民俗；直抒边愁,流露建功与思乡的矛盾；善用夸张、比喻等手法创造奇险意境","max":2,"id":"唐诗宋词-5-multi-18"},{"n":19,"type":"multi","prompt":"盛唐山水田园诗繁荣的原因包括","options":[{"key":"A","text":"盛唐取士路径多,征召辟举为隐者提供入仕机会"},{"key":"B","text":"经济繁荣为官僚地主提供别业山庄"},{"key":"C","text":"文人游学观览风气盛行,促进山水诗创作"},{"key":"D","text":"佛道思想影响,文人追求自然闲适"},{"key":"E","text":"社会动荡,文人避乱归隐"}],"key":"ABCD","answer":"盛唐取士路径多,征召辟举为隐者提供入仕机会；经济繁荣为官僚地主提供别业山庄；文人游学观览风气盛行,促进山水诗创作；佛道思想影响,文人追求自然闲适","max":2,"id":"唐诗宋词-5-multi-19"},{"n":20,"type":"multi","prompt":"盛唐诗歌“声律风骨兼备”的特征体现在","options":[{"key":"A","text":"律诗平仄粘对规则明确,对仗自由灵活"},{"key":"B","text":"古体诗与律诗界限清晰,风格各异"},{"key":"C","text":"诗歌内容上兼具积极进取精神与刚健骨气"},{"key":"D","text":"语言上融合齐梁清词与汉魏古朴"},{"key":"E","text":"完全摒弃初唐诗歌的创作传统"}],"key":"ABCD","answer":"律诗平仄粘对规则明确,对仗自由灵活；古体诗与律诗界限清晰,风格各异；诗歌内容上兼具积极进取精神与刚健骨气；语言上融合齐梁清词与汉魏古朴","max":2,"id":"唐诗宋词-5-multi-20"},{"n":21,"type":"term","prompt":"盛唐气象","options":[],"key":"","answer":"盛唐气象:指盛唐诗歌呈现的蓬勃朝气、昂扬自信、雄浑壮阔的时代风貌,兼具声律与风骨,多抒写积极进取的理想和对自然、人生的热爱,意境开阔明朗,是盛唐时代精神在诗歌中的体现,为建安风骨的丰富展开,代表诗人有李白、王维等。","max":3,"id":"唐诗宋词-5-term-21"},{"n":22,"type":"term","prompt":"声律风骨兼备","options":[],"key":"","answer":"声律风骨兼备:是盛唐诗歌的核心风貌,“声律”指律诗体裁成熟,平仄粘对规则明确;“风骨”指诗歌蕴含积极进取的理想与对时代人生的思考,具刚健精神与豪迈气概。二者融合, 使盛唐诗歌既具形式之美,又有精神力量,代表唐诗的最高成就。","max":3,"id":"唐诗宋词-5-term-22"},{"n":23,"type":"term","prompt":"山水田园诗(盛唐)","options":[],"key":"","answer":"山水田园诗(盛唐):盛唐诗歌的重要题材,代表诗人有王维、孟浩然等。继承陶渊明、谢灵运的传统,多描写自然山水与田园生活,风格清新自然、意境空灵,或融诗画、含禅意, 既展现山河之美,又寄托闲适情怀,是中国山水田园诗发展的巅峰。","max":3,"id":"唐诗宋词-5-term-23"},{"n":24,"type":"term","prompt":"边塞诗(盛唐)","options":[],"key":"","answer":"边塞诗(盛唐):盛唐诗歌的重要题材,代表诗人有高适、岑参、王昌龄等。因边疆稳定、 文人入幕风气盛而兴盛,多描写边塞征战、风土人情、将士豪情与疾苦,风格雄浑豪迈、意境壮阔,融合建安风骨与边塞体验,展现盛唐的英雄气概与时代精神。","max":3,"id":"唐诗宋词-5-term-24"},{"n":25,"type":"term","prompt":"七绝圣手","options":[],"key":"","answer":"七绝圣手:指盛唐诗人王昌龄,因擅长七言绝句而获此称。其七绝多写边塞、送别、闺情, 意境雄浑、含蓄深沉,如《出塞》《芙蓉楼送辛渐》,语言凝练、情韵悠长,将七绝的艺术表现力发挥到极致,被唐人推为七绝压卷之作,对后世影响深远。","max":3,"id":"唐诗宋词-5-term-25"},{"n":26,"type":"short","prompt":"简述盛唐诗歌革新的基本精神。","options":[],"key":"","answer":"盛唐诗歌革新的基本精神有三方面:一是将大雅颂声与建安风骨相结合,以“济苍生、安社稷”为理想,把歌颂盛明转化为对建功立业的歌颂;二是融合齐梁声律词采与汉魏风骨,形成“声律风骨兼备”的风貌;三是提倡以复古为革新,学习汉魏古诗与《诗经》风雅传统以矫正绮靡文风。","max":5,"id":"唐诗宋词-5-short-26"},{"n":27,"type":"short","prompt":"举例说明王维山水田园诗的色彩与禅意。","options":[],"key":"","answer":"王维山水田园诗善于设色,色彩运用精准,明暗冷暖对比讲究,《使至塞上》以黄沙、红日、直烟、长河构成壮阔画面,对比强烈;《山居秋暝》以明月、青松、清泉写清新淡雅之色,体现“诗中有画”。禅意方面,《鹿柴》写空山寂静,意境空灵,体现“空”“寂”的禅理; 《竹里馆》写独坐竹林、与明月相伴,暗含“物我两忘”的境界。","max":5,"id":"唐诗宋词-5-short-27"},{"n":28,"type":"short","prompt":"举例说明高适边塞诗的主要特点。","options":[],"key":"","answer":"高适边塞诗有三方面特点:一是以写实手法反映边塞现实与民生疾苦,《燕歌行》通过战士与将领的苦乐对比揭露军中矛盾,批判将领腐败;二是充满积极进取的壮志与豪迈气概, 《别董大》以豪迈语调鼓励友人;三是多用长篇咏怀式五言古诗或七言歌行,夹叙夹议,直抒胸臆,气势沉雄。","max":5,"id":"唐诗宋词-5-short-28"},{"n":29,"type":"short","prompt":"简述盛唐山水田园诗繁荣的主要原因。","options":[],"key":"","answer":"盛唐山水田园诗繁荣的主要原因有四:一是取士路径多样,君主招隐士、征逸人,文人将隐居视为“终南捷径”;二是经济繁荣为文人提供物质条件,可在隐居别业中享受林泉之乐;三是交通便利,文人游学观览盛行,触发山水诗创作;四是受佛道思想影响,将静照忘求的审美方式融入诗作。","max":5,"id":"唐诗宋词-5-short-29"},{"n":30,"type":"essay","prompt":"为什么说盛唐诗是我国诗歌发展的全盛时期?","options":[],"key":"","answer":"盛唐诗是我国诗歌发展的全盛时期。 一、题材空前丰富:山水田园诗在王维、孟浩然笔下臻于新高度,边塞诗由高适、岑参、王昌龄写征战风光。 二、艺术上“声律风骨兼备”:律诗成熟普及,古体与律诗界限清晰,歌行、绝句兴盛;诗歌蕴含积极进取的时代精神。 三、精神上体现蓬勃气象:文人充满进取精神与自信,诗歌反映盛唐的繁荣开放。","max":10,"id":"唐诗宋词-5-essay-30"}],"rawMax":70},{"id":"唐诗宋词-6","title":"章节练习(3章)","questions":[{"n":1,"type":"single","prompt":"下列关于李白生平的表述,错误的是","options":[{"key":"A","text":"祖籍陇西成纪,诞生于碎叶城"},{"key":"B","text":"5岁随父迁至绵州彰明县"},{"key":"C","text":"天宝初应诏赴长安,任翰林学士,后遭谗被“赐金放还”"},{"key":"D","text":"安史之乱中,因参与永王李璘幕府获罪,流放夜郎,途中遇赦"}],"key":"C","answer":"天宝初应诏赴长安,任翰林学士,后遭谗被“赐金放还”","max":1,"id":"唐诗宋词-6-single-1"},{"n":2,"type":"single","prompt":"李白诗歌浪漫精神的核心内涵不包括","options":[{"key":"A","text":"渴望为国立功的赤忱"},{"key":"B","text":"热爱人民、同情人民的深情"},{"key":"C","text":"对现实的消极避世与颓废情绪"},{"key":"D","text":"对权贵和封建社会不合理现象的反抗"}],"key":"C","answer":"对现实的消极避世与颓废情绪","max":1,"id":"唐诗宋词-6-single-2"},{"n":3,"type":"single","prompt":"李白早年政治理想的特点是","options":[{"key":"A","text":"对现实有深刻认识,目标具体明确"},{"key":"B","text":"以鲁仲连、谢安等历史人物自比,追求“功成身退”"},{"key":"C","text":"完全摒弃追求功名富贵的想法"},{"key":"D","text":"主张通过科举考试步入仕途"}],"key":"B","answer":"以鲁仲连、谢安等历史人物自比,追求“功成身退”","max":1,"id":"唐诗宋词-6-single-3"},{"n":4,"type":"single","prompt":"下列作品中,集中体现李白对天宝政治黑暗批判的是","options":[{"key":"A","text":"《蜀道难》"},{"key":"B","text":"《答王十二寒夜独酌有怀》"},{"key":"C","text":"《梦游天姥吟留别》"},{"key":"D","text":"《望庐山瀑布》"}],"key":"B","answer":"《答王十二寒夜独酌有怀》","max":1,"id":"唐诗宋词-6-single-4"},{"n":5,"type":"single","prompt":"李白《蜀道难》中,没有运用的艺术手法是","options":[{"key":"A","text":"夸张"},{"key":"B","text":"神话传说"},{"key":"C","text":"现实主义描写"},{"key":"D","text":"反复咏叹"}],"key":"C","answer":"现实主义描写","max":1,"id":"唐诗宋词-6-single-5"},{"n":6,"type":"single","prompt":"下列诗句中,体现李白“天与俱高”艺术境界的是","options":[{"key":"A","text":"大漠孤烟直,长河落日圆"},{"key":"B","text":"飞流直下三千尺,疑是银河落九天"},{"key":"C","text":"露从今夜白,月是故乡明"},{"key":"D","text":"感时花溅泪,恨别鸟惊心"}],"key":"B","answer":"飞流直下三千尺,疑是银河落九天","max":1,"id":"唐诗宋词-6-single-6"},{"n":7,"type":"single","prompt":"李白诗歌中,常用来象征自己非凡抱负与精神世界的意象是","options":[{"key":"A","text":"菊花、青松"},{"key":"B","text":"大鹏、天马"},{"key":"C","text":"孤舟、落叶"},{"key":"D","text":"明月、清风"}],"key":"B","answer":"大鹏、天马","max":1,"id":"唐诗宋词-6-single-7"},{"n":8,"type":"single","prompt":"下列关于李白乐府诗的表述,正确的是","options":[{"key":"A","text":"仅沿用汉魏古题,无自创题目"},{"key":"B","text":"语言雕琢华丽,远离民歌风格"},{"key":"C","text":"融合汉魏古朴与南朝乐府情深韵长的特色"},{"key":"D","text":"完全摒弃比兴手法"}],"key":"C","answer":"融合汉魏古朴与南朝乐府情深韵长的特色","max":1,"id":"唐诗宋词-6-single-8"},{"n":9,"type":"single","prompt":"李白《梦游天姥吟留别》的主旨是","options":[{"key":"A","text":"描绘天姥山的奇丽景色"},{"key":"B","text":"抒发对神仙世界的向往"},{"key":"C","text":"表达对权贵的蔑视与对自由的追求"},{"key":"D","text":"感叹人生的短暂与无常"}],"key":"C","answer":"表达对权贵的蔑视与对自由的追求","max":1,"id":"唐诗宋词-6-single-9"},{"n":10,"type":"single","prompt":"下列作品中,属于李白七言绝句且风格清新自然、近于民歌的是","options":[{"key":"A","text":"《蜀道难》"},{"key":"B","text":"《送孟浩然之广陵》"},{"key":"C","text":"《将进酒》"},{"key":"D","text":"《古风》其一"}],"key":"B","answer":"《送孟浩然之广陵》","max":1,"id":"唐诗宋词-6-single-10"},{"n":11,"type":"single","prompt":"李白后期思想变化的关键原因是","options":[{"key":"A","text":"早年隐居生活的影响"},{"key":"B","text":"供奉翰林期间的荣华富贵"},{"key":"C","text":"遭“赐金放还”后对天宝政治黑暗的清醒认识"},{"key":"D","text":"晚年身体健康状况恶化"}],"key":"C","answer":"遭“赐金放还”后对天宝政治黑暗的清醒认识","max":1,"id":"唐诗宋词-6-single-11"},{"n":12,"type":"single","prompt":"下列诗句中,体现李白“天真狂放”艺术个性的是","options":[{"key":"A","text":"会当凌绝顶,一览众山小"},{"key":"B","text":"举杯邀明月,对影成三人"},{"key":"C","text":"烽火连三月,家书抵万金"},{"key":"D","text":"露从今夜白,月是故乡明"}],"key":"B","answer":"举杯邀明月,对影成三人","max":1,"id":"唐诗宋词-6-single-12"},{"n":13,"type":"single","prompt":"李白对乐府诗的发展贡献不包括","options":[{"key":"A","text":"拓展乐府题材,将边塞、闺情等内容融入"},{"key":"B","text":"打破古乐府抒情化趋势,恢复叙事传统"},{"key":"C","text":"语言上融合民歌的天然与文人诗的雅致"},{"key":"D","text":"创作出《长干行》《子夜吴歌》等名篇"}],"key":"B","answer":"打破古乐府抒情化趋势,恢复叙事传统","max":1,"id":"唐诗宋词-6-single-13"},{"n":14,"type":"single","prompt":"下列关于李白五律的表述,正确的是","options":[{"key":"A","text":"数量极少,且均不符合格律规范"},{"key":"B","text":"《送友人》以古诗句法入律,兼具古意与律味"},{"key":"C","text":"完全摒弃传统比兴手法"},{"key":"D","text":"风格仅追求雄浑壮阔,无清新自然之作"}],"key":"B","answer":"《送友人》以古诗句法入律,兼具古意与律味","max":1,"id":"唐诗宋词-6-single-14"},{"n":15,"type":"single","prompt":"李白诗歌中,蕴含禅理或玄思的作品是","options":[{"key":"A","text":"《月下独酌》"},{"key":"B","text":"《早发白帝城》"},{"key":"C","text":"《独坐敬亭山》"},{"key":"D","text":"《望天门山》"}],"key":"C","answer":"《独坐敬亭山》","max":1,"id":"唐诗宋词-6-single-15"},{"n":16,"type":"multi","prompt":"李白前后期思想变化的表现有","options":[{"key":"A","text":"前期对政治充满幻想,后期对现实批判深刻"},{"key":"B","text":"前期追求“功成身退”,后期仍坚守报国理想"},{"key":"C","text":"前期对个人前途自信,后期因挫折陷入彻底颓废"},{"key":"D","text":"前期对统治者抱有期待,后期直指最高统治者昏庸"},{"key":"E","text":"前期诗歌风格豪放,后期完全转向沉郁顿挫"}],"key":"ABD","answer":"前期对政治充满幻想,后期对现实批判深刻；前期追求“功成身退”,后期仍坚守报国理想；前期对统治者抱有期待,后期直指最高统治者昏庸","max":2,"id":"唐诗宋词-6-multi-16"},{"n":17,"type":"multi","prompt":"李白《蜀道难》的艺术特色包括","options":[{"key":"A","text":"融合神话传说与现实描写"},{"key":"B","text":"以“蜀道之难,难于上青天”反复咏叹强化主题"},{"key":"C","text":"运用夸张、比喻等手法营造奇险意境"},{"key":"D","text":"句式参差错落,兼具散文与诗歌的节奏美"},{"key":"E","text":"完全采用现实主义手法刻画蜀道险峻"}],"key":"ABCD","answer":"融合神话传说与现实描写；以“蜀道之难,难于上青天”反复咏叹强化主题；运用夸张、比喻等手法营造奇险意境；句式参差错落,兼具散文与诗歌的节奏美","max":2,"id":"唐诗宋词-6-multi-17"},{"n":18,"type":"multi","prompt":"体现李白“天真狂放”艺术个性的作品有","options":[{"key":"A","text":"《月下独酌》"},{"key":"B","text":"《将进酒》"},{"key":"C","text":"《赠汪伦》"},{"key":"D","text":"《秋浦歌》(白发三千丈)"},{"key":"E","text":"《春望》"}],"key":"ABCD","answer":"《月下独酌》；《将进酒》；《赠汪伦》；《秋浦歌》(白发三千丈)","max":2,"id":"唐诗宋词-6-multi-18"},{"n":19,"type":"multi","prompt":"李白乐府诗的特点有","options":[{"key":"A","text":"兼用古题与新题"},{"key":"B","text":"语言天然清新,近于民歌"},{"key":"C","text":"融合汉魏与南朝乐府特色"},{"key":"D","text":"善用比兴寄托,寓意深远"},{"key":"E","text":"仅以叙事为主,无抒情成分"}],"key":"ABCD","answer":"兼用古题与新题；语言天然清新,近于民歌；融合汉魏与南朝乐府特色；善用比兴寄托,寓意深远","max":2,"id":"唐诗宋词-6-multi-19"},{"n":20,"type":"multi","prompt":"李白诗歌“天与俱高”的艺术境界体现在","options":[{"key":"A","text":"意象宏大,如大鹏、黄河、高山等"},{"key":"B","text":"想象奇特,突破时空限制"},{"key":"C","text":"情感奔放,喜怒哀乐皆极致抒发"},{"key":"D","text":"语言雕琢,追求辞藻的华丽繁复"},{"key":"E","text":"境界开阔,能俯瞰天地、纵观古今"}],"key":"ABCE","answer":"意象宏大,如大鹏、黄河、高山等；想象奇特,突破时空限制；情感奔放,喜怒哀乐皆极致抒发；境界开阔,能俯瞰天地、纵观古今","max":2,"id":"唐诗宋词-6-multi-20"},{"n":21,"type":"term","prompt":"李白的“功成身退”理想","options":[],"key":"","answer":"李白的“功成身退”理想,是指他以鲁仲连、谢安等为榜样,渴望建立不朽功勋,待理想实现后便潇洒退隐,不贪恋功名富贵。这一理想融合儒家济世情怀与道家隐逸思想,是盛唐文人积极进取与超脱心态的体现。","max":3,"id":"唐诗宋词-6-term-21"},{"n":22,"type":"term","prompt":"“天与俱高”的艺术境界","options":[],"key":"","answer":"“天与俱高”是李白诗歌独特的艺术境界,指其诗歌通过宏大的意象、奇特的想象、开阔的视野,营造出与天地同高、超越时空限制的壮阔意境,体现诗人昂扬的精神风貌与豪放的个性,使读者感受到超越现实的精神震撼。","max":3,"id":"唐诗宋词-6-term-22"},{"n":23,"type":"term","prompt":"李白的乐府诗革新","options":[],"key":"","answer":"李白的乐府诗革新,指他在继承汉魏乐府古朴健康与南朝乐府情深韵长传统的基础上,突破古题束缚,兼用古题与新题,如自创《横江词》,语言天然清新,融入个人情感与时代精神,拓展了乐府诗的题材与表现空间。","max":3,"id":"唐诗宋词-6-term-23"},{"n":24,"type":"term","prompt":"李白的“天真狂放”艺术个性","options":[],"key":"","answer":"李白的“天真狂放”艺术个性,指他在诗歌中展现的不加掩饰的真性情与豪放洒脱的气质,如 “举杯邀明月”的天真想象、“天生我材必有用”的自信、“安能摧眉折腰事权贵”的狂傲,将喜怒哀乐极致抒发,语言直白自然,情感奔放不羁。","max":3,"id":"唐诗宋词-6-term-24"},{"n":25,"type":"term","prompt":"李白后期的批判精神","options":[],"key":"","answer":"李白后期的批判精神,指他遭“赐金放还”后,看清天宝政治黑暗,在诗歌中对统治集团腐朽、最高统治者昏庸(如《古风》)、社会不公(如《战城南》)进行深刻揭露,以尖锐笔触反映现实,体现出对国家命运与人民疾苦的关怀。","max":3,"id":"唐诗宋词-6-term-25"},{"n":26,"type":"short","prompt":"简述李白前后期的思想变化及其原因。","options":[],"key":"","answer":"李白前期充满政治幻想,以鲁仲连、谢安自比,追求“功成身退”,对个人前途自信;后期对天宝政治黑暗有深刻认识,批判权贵与社会不公,仍坚守报国理想。变化原因:一是“赐金放还”让他看清统治集团腐朽;二是安史之乱使其对现实认识深化;三是仕途挫折促其反思人生理想。","max":5,"id":"唐诗宋词-6-short-26"},{"n":27,"type":"short","prompt":"以《蜀道难》为例,谈谈李白诗歌的独特风格。","options":[],"key":"","answer":"李白《蜀道难》体现出浪漫主义的独特风格:一是想象奇幻,融合五丁开山等神话与夸张手法,营造奇险意境;二是情感奔放,以“蜀道之难,难于上青天”反复咏叹,强化对蜀道险峻的惊叹;三是句式灵活,杂言与七言结合,兼具散文的流畅与诗歌的韵律美;四是意境壮阔,时空跨度大,境界雄浑。","max":5,"id":"唐诗宋词-6-short-27"},{"n":28,"type":"short","prompt":"举例说明李白诗歌“天真狂放”的艺术个性。","options":[],"key":"","answer":"李白诗歌“天真狂放”体现在多方面:《月下独酌》以天真想象将明月、影子视为酒友,显孤独中的狂放;《将进酒》以自信豪迈的又吻肯定个人价值,狂放中见天真;《秋浦歌》用极度夸张写愁绪,不加掩饰的情感体现天真;《赠汪伦》以直白比喻写友情,自然真挚显天真,夸张手法彰显狂放。","max":5,"id":"唐诗宋词-6-short-28"},{"n":29,"type":"short","prompt":"简述李白对乐府诗的发展贡献。","options":[],"key":"","answer":"李白对乐府诗的发展有三大贡献:一是题材拓展,突破汉魏乐府传统题材,将边塞征战、闺中相思、山水行旅等融入,如《子夜吴歌·秋歌》;二是体式创新,兼用古题与新题,如 《长干行》《横江词》,打破古乐府格式束缚;三是风格融合,融合汉魏乐府古朴健康与南朝乐府情深韵长,语言天然清新近于民歌。","max":5,"id":"唐诗宋词-6-short-29"},{"n":30,"type":"essay","prompt":"论述李白诗歌的艺术境界及其形成原因。","options":[],"key":"","answer":"李白诗歌的艺术境界集中体现为“天与俱高”。 一、境界表现:(一)意象宏大开阔,多取大鹏、黄河、高山、明月等,如《将进酒》尽显天地气势;(二)想象突破时空,如《梦游天姥吟留别》跨越现实与仙境;(三)情感与宇宙相融,如《独坐敬亭山》成物我两忘之境。 二、形成原因:盛唐繁荣开明、文人自信进取的时代背景;融合儒道思想的个人经历;继承屈原、庄子的浪漫想象。","max":10,"id":"唐诗宋词-6-essay-30"}],"rawMax":70},{"id":"唐诗宋词-7","title":"章节练习(4章)","questions":[{"n":1,"type":"single","prompt":"下列关于杜甫生平的表述,错误的是","options":[{"key":"A","text":"祖籍京兆杜陵,自称“杜陵布衣”“少陵野老”"},{"key":"B","text":"青年时期曾漫游吴越、齐鲁,24岁应举不第"},{"key":"C","text":"天宝六年到长安应制举,因李林甫“野无遗贤”之说未得官职"},{"key":"D","text":"安史之乱中被俘至长安,后逃至凤翔,任左拾遗,最终官至刑部尚书"}],"key":"D","answer":"安史之乱中被俘至长安,后逃至凤翔,任左拾遗,最终官至刑部尚书","max":1,"id":"唐诗宋词-7-single-1"},{"n":2,"type":"single","prompt":"杜甫被称为“诗圣”的核心原因是","options":[{"key":"A","text":"诗歌数量众多,题材广泛"},{"key":"B","text":"忧国忧民的情怀与“古昔命世圣贤”相近,且艺术上集大成"},{"key":"C","text":"擅长各种诗体,风格变化多端"},{"key":"D","text":"作品反映了安史之乱的全过程"}],"key":"B","answer":"忧国忧民的情怀与“古昔命世圣贤”相近,且艺术上集大成","max":1,"id":"唐诗宋词-7-single-2"},{"n":3,"type":"single","prompt":"下列作品中,不属于杜甫“三吏”“三别”系列的是","options":[{"key":"A","text":"《新安吏》"},{"key":"B","text":"《石壕吏》"},{"key":"C","text":"《新婚别》"},{"key":"D","text":"《登高》"}],"key":"D","answer":"《登高》","max":1,"id":"唐诗宋词-7-single-3"},{"n":4,"type":"single","prompt":"杜甫《自京赴奉先县咏怀五百字》中,最能体现阶级对立的名句是","options":[{"key":"A","text":"“朱门酒肉臭,路有冻死骨”"},{"key":"B","text":"“穷年忧黎元,叹息肠内热”"},{"key":"C","text":"“生常免租税,名不隶征伐”"},{"key":"D","text":"“况闻内金盘,尽在卫霍室”"}],"key":"A","answer":"“朱门酒肉臭,路有冻死骨”","max":1,"id":"唐诗宋词-7-single-4"},{"n":5,"type":"single","prompt":"下列关于杜甫“诗史”特点的表述,错误的是","options":[{"key":"A","text":"以诗歌记录安史之乱前后的历史过程"},{"key":"B","text":"仅采用五古、五排等长篇诗体反映历史"},{"key":"C","text":"将个人经历与国家命运相结合"},{"key":"D","text":"通过具体事件与细节展现社会现实"}],"key":"B","answer":"仅采用五古、五排等长篇诗体反映历史","max":1,"id":"唐诗宋词-7-single-5"},{"n":6,"type":"single","prompt":"杜甫《春望》中,“感时花溅泪,恨别鸟惊心”所运用的艺术手法是","options":[{"key":"A","text":"夸张"},{"key":"B","text":"拟人"},{"key":"C","text":"对比"},{"key":"D","text":"用典"}],"key":"B","answer":"拟人","max":1,"id":"唐诗宋词-7-single-6"},{"n":7,"type":"single","prompt":"下列作品中,体现杜甫“以文为诗”特点的是","options":[{"key":"A","text":"《春望》"},{"key":"B","text":"《登高》"},{"key":"C","text":"《山石》"},{"key":"D","text":"《月夜》"}],"key":"C","answer":"《山石》","max":1,"id":"唐诗宋词-7-single-7"},{"n":8,"type":"single","prompt":"杜甫《登高》被誉为“古今七言律第一”,其对仗特点是","options":[{"key":"A","text":"四联全对,严丝合缝"},{"key":"B","text":"仅中间两联对仗,句式灵活"},{"key":"C","text":"首联对仗,其余不对"},{"key":"D","text":"尾联对仗,升华主旨"}],"key":"B","answer":"仅中间两联对仗,句式灵活","max":1,"id":"唐诗宋词-7-single-8"},{"n":9,"type":"single","prompt":"下列关于杜甫新题乐府与汉乐府区别的表述,正确的是","options":[{"key":"A","text":"汉乐府多叙事,杜甫新题乐府仅抒情"},{"key":"B","text":"杜甫新题乐府多从诗人自身经历出发,带强烈主观抒情色彩"},{"key":"C","text":"汉乐府注重反映现实,杜甫新题乐府侧重个人感慨"},{"key":"D","text":"汉乐府篇幅较长,杜甫新题乐府均为短篇"}],"key":"B","answer":"杜甫新题乐府多从诗人自身经历出发,带强烈主观抒情色彩","max":1,"id":"唐诗宋词-7-single-9"},{"n":10,"type":"single","prompt":"杜甫《茅屋为秋风所破歌》中,体现“宁苦身以利人”精神的名句是","options":[{"key":"A","text":"“安得广厦千万间,大庇天下寒士俱欢颜”"},{"key":"B","text":"“八月秋高风怒号,卷我屋上三重茅”"},{"key":"C","text":"“布衾多年冷似铁,娇儿恶卧踏里裂”"},{"key":"D","text":"“床头屋漏无干处,雨脚如麻未断绝”"}],"key":"A","answer":"“安得广厦千万间,大庇天下寒士俱欢颜”","max":1,"id":"唐诗宋词-7-single-10"},{"n":11,"type":"single","prompt":"下列作品中,属于杜甫反映安史之乱前社会危机的是","options":[{"key":"A","text":"《悲陈陶》"},{"key":"B","text":"《兵车行》"},{"key":"C","text":"《春望》"},{"key":"D","text":"《北征》"}],"key":"B","answer":"《兵车行》","max":1,"id":"唐诗宋词-7-single-11"},{"n":12,"type":"single","prompt":"杜甫诗歌“沉郁顿挫”风格中,“沉郁”的核心内涵是","options":[{"key":"A","text":"语言雕琢,辞藻华丽"},{"key":"B","text":"文思深沉蕴藉,情感忧思郁结"},{"key":"C","text":"节奏明快,气势奔放"},{"key":"D","text":"意境空灵,风格清新"}],"key":"B","answer":"文思深沉蕴藉,情感忧思郁结","max":1,"id":"唐诗宋词-7-single-12"},{"n":13,"type":"single","prompt":"下列关于杜甫对七律发展贡献的表述,错误的是","options":[{"key":"A","text":"拓展七律的表现功能,可抒情、议论、叙事"},{"key":"B","text":"使七律工整精练,格律严谨,同时句式自由"},{"key":"C","text":"首创七律组诗形式,如《秋兴》八首"},{"key":"D","text":"仅以华丽辞藻取胜,缺乏情感深度"}],"key":"D","answer":"仅以华丽辞藻取胜,缺乏情感深度","max":1,"id":"唐诗宋词-7-single-13"},{"n":14,"type":"single","prompt":"杜甫《登岳阳楼》中,描绘洞庭湖壮阔景象的名句是","options":[{"key":"A","text":"“昔闻洞庭水,今上岳阳楼”"},{"key":"B","text":"“吴楚东南坼,乾坤日夜浮”"},{"key":"C","text":"“亲朋无一字,老病有孤舟”"},{"key":"D","text":"“戎马关山北,凭轩涕泗流”"}],"key":"B","answer":"“吴楚东南坼,乾坤日夜浮”","max":1,"id":"唐诗宋词-7-single-14"},{"n":15,"type":"single","prompt":"下列作品中,体现杜甫“忧国忧民”精神且创作于漂泊西南时期的是","options":[{"key":"A","text":"《自京赴奉先县咏怀五百字》"},{"key":"B","text":"《茅屋为秋风所破歌》"},{"key":"C","text":"《兵车行》"},{"key":"D","text":"《春望》"}],"key":"B","answer":"《茅屋为秋风所破歌》","max":1,"id":"唐诗宋词-7-single-15"},{"n":16,"type":"multi","prompt":"杜甫“忧国忧民”精神的具体表现有","options":[{"key":"A","text":"揭露统治阶级腐朽,如《丽人行》讽杨国忠兄妹"},{"key":"B","text":"反映民生疾苦,如“三吏”“三别” 写战乱中百姓苦难"},{"key":"C","text":"关注国家命运,如《春望》抒发家国之恨"},{"key":"D","text":"提出改革弊政的具体方案,如《策林》 主张立采诗官"},{"key":"E","text":"晚年虽漂泊,仍心念战事,如《登岳阳楼》“戎马关山北”"}],"key":"ABCE","answer":"揭露统治阶级腐朽,如《丽人行》讽杨国忠兄妹；反映民生疾苦,如“三吏”“三别” 写战乱中百姓苦难；关注国家命运,如《春望》抒发家国之恨；晚年虽漂泊,仍心念战事,如《登岳阳楼》“戎马关山北”","max":2,"id":"唐诗宋词-7-multi-16"},{"n":17,"type":"multi","prompt":"杜甫诗歌“诗史”的特点包括","options":[{"key":"A","text":"以个人经历为线索,串联历史事件"},{"key":"B","text":"采用多种诗体,如五古、新题乐府等"},{"key":"C","text":"通过具体细节展现历史场景,如《石壕吏》写吏夜捉人"},{"key":"D","text":"仅记录安史之乱,未涉及其他历史阶段"},{"key":"E","text":"将叙事、抒情、议论结合,如《自京赴奉先县咏怀五百字》"}],"key":"ABCE","answer":"以个人经历为线索,串联历史事件；采用多种诗体,如五古、新题乐府等；通过具体细节展现历史场景,如《石壕吏》写吏夜捉人；将叙事、抒情、议论结合,如《自京赴奉先县咏怀五百字》","max":2,"id":"唐诗宋词-7-multi-17"},{"n":18,"type":"multi","prompt":"下列属于杜甫对诗歌艺术创新的有","options":[{"key":"A","text":"以新题乐府反映时事,开启中唐新乐府运动"},{"key":"B","text":"拓展七律表现功能,可抒情、议论、 叙事"},{"key":"C","text":"运用“以文为诗”手法,如《山石》似游记"},{"key":"D","text":"仅继承汉魏乐府传统,未吸收齐梁诗风"},{"key":"E","text":"注重刻画心理与细节,如《新婚别》写新娘心理"}],"key":"ABCE","answer":"以新题乐府反映时事,开启中唐新乐府运动；拓展七律表现功能,可抒情、议论、 叙事；运用“以文为诗”手法,如《山石》似游记；注重刻画心理与细节,如《新婚别》写新娘心理","max":2,"id":"唐诗宋词-7-multi-18"},{"n":19,"type":"multi","prompt":"下列作品中,体现杜甫“沉郁顿挫”风格的有","options":[{"key":"A","text":"《登高》"},{"key":"B","text":"《茅屋为秋风所破歌》"},{"key":"C","text":"《春望》"},{"key":"D","text":"《闻官军收河南河北》"},{"key":"E","text":"《登岳阳楼》"}],"key":"ABCE","answer":"《登高》；《茅屋为秋风所破歌》；《春望》；《登岳阳楼》","max":2,"id":"唐诗宋词-7-multi-19"},{"n":20,"type":"multi","prompt":"杜甫新题乐府与汉乐府的区别在于","options":[{"key":"A","text":"汉乐府多客观叙事,杜甫新题乐府带强烈主观抒情"},{"key":"B","text":"汉乐府多截取事件片段,杜甫新题乐府展现广阔社会背景"},{"key":"C","text":"汉乐府多为短篇,杜甫新题乐府均为长篇"},{"key":"D","text":"杜甫新题乐府融入个人经历,汉乐府较少体现"},{"key":"E","text":"汉乐府侧重反映民间生活,杜甫新题乐府侧重批判政治"}],"key":"ABDE","answer":"汉乐府多客观叙事,杜甫新题乐府带强烈主观抒情；汉乐府多截取事件片段,杜甫新题乐府展现广阔社会背景；杜甫新题乐府融入个人经历,汉乐府较少体现；汉乐府侧重反映民间生活,杜甫新题乐府侧重批判政治","max":2,"id":"唐诗宋词-7-multi-20"},{"n":21,"type":"term","prompt":"“诗史”","options":[],"key":"","answer":"诗史:指杜甫的诗歌。其诗深刻反映唐王朝由盛转衰的历史,聚焦安史之乱前后的社会现实,如《自京赴奉先县咏怀五百字》写战乱前的社会矛盾,“三吏”“三别”写战乱中的民生疾苦,兼具历史真实性与文学艺术性,被后世称为“诗史”。","max":3,"id":"唐诗宋词-7-term-21"},{"n":22,"type":"term","prompt":"“诗圣”","options":[],"key":"","answer":"“诗圣”是后世对杜甫的尊称,核心在于其忧国忧民情怀与“古昔命世圣贤”相近,诗歌艺术集大成。他以天下为己任,关切国家命运、同情百姓疾苦;艺术上融合汉魏乐府、六朝诗风与初盛唐技法,风格沉郁顿挫,兼擅各体,为后世树立了最高标准。","max":3,"id":"唐诗宋词-7-term-22"},{"n":23,"type":"term","prompt":"杜甫的“沉郁顿挫”风格","options":[],"key":"","answer":"“沉郁顿挫”是杜甫诗歌的核心风格:“沉郁”指文思深沉蕴藉,情感蕴含忧国忧民的郁结之情,如《登高》;“顿挫”指声调抑扬有致、结构开合跌宕,如《自京赴奉先县咏怀五百字》。二者结合,使诗歌既饱含厚重情感,又富有韵律变化与结构张力。","max":3,"id":"唐诗宋词-7-term-23"},{"n":24,"type":"term","prompt":"杜甫的新题乐府","options":[],"key":"","answer":"杜甫的新题乐府指不沿用古乐府旧题,而是“即事名篇”、针对现实事件创作的乐府诗,如 《兵车行》。其作品多从自身经历出发,带强烈主观抒情色彩,融合叙事、抒情与议论,继承汉乐府“感于哀乐,缘事而发”的传统,为中唐新乐府运动奠定基础。","max":3,"id":"唐诗宋词-7-term-24"},{"n":25,"type":"term","prompt":"杜甫的“以文为诗”","options":[],"key":"","answer":"杜甫的“以文为诗”指将散文的笔法与结构融入诗歌创作。如《山石》以游记式平铺直叙记录游历过程,句式灵活,不刻意追求对仗与声律;《谒衡岳庙遂宿岳寺题门楼》夹叙夹议,展现游历过程与心理变化,打破传统诗歌的形式束缚。","max":3,"id":"唐诗宋词-7-term-25"},{"n":26,"type":"short","prompt":"简述杜甫忧国忧民精神的具体体现,并举例说明。","options":[],"key":"","answer":"杜甫忧国忧民精神主要有三方面体现:一是揭露统治阶级腐朽,《丽人行》写杨国忠兄妹游宴奢华,讽刺其骄纵荒淫;二是反映民生疾苦,“三吏”“三别”写官吏深夜捉人,揭露横征暴敛,展现百姓的悲惨境遇;三是关注国家命运,《春望》抒国破家亡之恨,《登岳阳楼》虽漂泊仍心念战事。","max":5,"id":"唐诗宋词-7-short-26"},{"n":27,"type":"short","prompt":"简要分析杜甫“诗史”的艺术特征。","options":[],"key":"","answer":"杜甫“诗史”的艺术特征有三:一是以个人经历为线索串联历史,如《自京赴奉先县咏怀五百字》展现安史之乱前夕的社会危机;二是采用多样诗体,既有《北征》等长篇咏怀诗,也有 《兵车行》等新题乐府;三是融叙事、抒情、议论于一体,如《登高》抒发身世感慨与对国事的忧虑。","max":5,"id":"唐诗宋词-7-short-27"},{"n":28,"type":"short","prompt":"简述杜甫对七律发展的贡献。","options":[],"key":"","answer":"杜甫对七律的贡献有三:一是拓展七律表现功能,突破应酬、写景的局限,赋予其抒情、议论、叙事的多重能力,如《登高》;二是完善格律与艺术表现力,保持对仗严谨,通过虚实结合、情景交融营造雄浑意境;三是首创七律组诗形式,如《秋兴》八首,每首独立成篇又相互关联,为后世提供范式。","max":5,"id":"唐诗宋词-7-short-28"},{"n":29,"type":"short","prompt":"简要说明杜甫新题乐府与汉乐府的区别。","options":[],"key":"","answer":"杜甫新题乐府与汉乐府的区别有三:一是抒情性不同,汉乐府多客观截取事件片段叙事,杜甫多从自身经历出发,带主观抒情;二是背景广度不同,汉乐府多聚焦单一事件或场景,杜甫则展现广阔社会背景,如《丽人行》;三是表现手法不同,汉乐府以叙事为主,杜甫新题乐府融合叙事、抒情、议论。","max":5,"id":"唐诗宋词-7-short-29"},{"n":30,"type":"essay","prompt":"论述杜甫的诗歌艺术成就及其对后世的影响。","options":[],"key":"","answer":"一、艺术成就:(1)诗体驾驭:兼善五古、七律与新题乐府,如七律《登高》格律严谨; (2)表现手法:以文为诗,细节与心理刻画精妙,情景交融、对比精当;(3)风格特征:沉郁顿挫,情感深沉而结构起伏。 二、对后世的影响:(1)深化现实主义传统,启发元白新乐府与陆游等爱国诗人;(2) 诗体与手法示范,七律成为后世重要载体;(3)人格感召,其仁者之心成为后世标杆。","max":10,"id":"唐诗宋词-7-essay-30"}],"rawMax":70},{"id":"唐诗宋词-8","title":"章节练习(5章)","questions":[{"n":1,"type":"single","prompt":"下列诗句中,体现盛唐向中唐过渡时期诗人对社会矛盾初步反思的是","options":[{"key":"A","text":"“海内存知己,天涯若比邻”"},{"key":"B","text":"“朱门酒肉臭,路有冻死骨”"},{"key":"C","text":"“春风得意马蹄疾,一日看尽长安花”"},{"key":"D","text":"“两个黄鹂鸣翠柳,一行白鹭上青天”"}],"key":"B","answer":"“朱门酒肉臭,路有冻死骨”","max":1,"id":"唐诗宋词-8-single-1"},{"n":2,"type":"single","prompt":"中唐新乐府运动的核心主张是","options":[{"key":"A","text":"追求辞藻华丽,注重声律和谐"},{"key":"B","text":"“文章合为时而著,歌诗合为事而作”"},{"key":"C","text":"以山水田园为题材,风格清新自然"},{"key":"D","text":"继承六朝绮靡诗风,抒发儿女情长"}],"key":"B","answer":"“文章合为时而著,歌诗合为事而作”","max":1,"id":"唐诗宋词-8-single-2"},{"n":3,"type":"single","prompt":"下列诗人中,不属于中唐“韩孟诗派”的是","options":[{"key":"A","text":"韩愈"},{"key":"B","text":"孟郊"},{"key":"C","text":"李贺"},{"key":"D","text":"白居易"}],"key":"D","answer":"白居易","max":1,"id":"唐诗宋词-8-single-3"},{"n":4,"type":"single","prompt":"杜甫《登高》中“万里悲秋常作客,百年多病独登台”一句,体现的“诗变”特征是","options":[{"key":"A","text":"从盛唐的昂扬豪迈转向沉郁顿挫"},{"key":"B","text":"从山水田园题材转向边塞征战"},{"key":"C","text":"从五言古诗为主转向七言绝句"},{"key":"D","text":"从现实主义转向浪漫主义"}],"key":"A","answer":"从盛唐的昂扬豪迈转向沉郁顿挫","max":1,"id":"唐诗宋词-8-single-4"},{"n":5,"type":"single","prompt":"中唐诗人李贺的诗歌风格特点是","options":[{"key":"A","text":"通俗浅易,反映民生疾苦"},{"key":"B","text":"奇诡浓丽,善用神话意象"},{"key":"C","text":"沉郁顿挫,抒发家国情怀"},{"key":"D","text":"清新自然,描绘山水田园"}],"key":"B","answer":"奇诡浓丽,善用神话意象","max":1,"id":"唐诗宋词-8-single-5"},{"n":6,"type":"single","prompt":"下列作品中,属于中唐新乐府诗的是","options":[{"key":"A","text":"李白《蜀道难》"},{"key":"B","text":"杜甫《春望》"},{"key":"C","text":"白居易《卖炭翁》"},{"key":"D","text":"王维《山居秋暝》"}],"key":"C","answer":"白居易《卖炭翁》","max":1,"id":"唐诗宋词-8-single-6"},{"n":7,"type":"single","prompt":"中唐“元白诗派”的主要创作特点是","options":[{"key":"A","text":"追求形式技巧,讲究声律对仗"},{"key":"B","text":"语言通俗 益《夜上受降城闻笛》(回乐烽前沙似雪)"},{"key":"D","text":"岑参《白雪歌送武判官归京》(北风卷地白草折)"}],"key":"C","answer":"李益《夜上受降城闻笛》(回乐烽前沙似雪)","max":1,"id":"唐诗宋词-8-single-14"},{"n":15,"type":"single","prompt":"“诗变于盛衰之际”中,“诗变”的根本原因是","options":[{"key":"A","text":"诗人个人创作风格的偶然转变"},{"key":"B","text":"社会政治局势的剧烈变动(如安史之乱)"},{"key":"C","text":"诗歌体裁从古诗向律诗的演变"},{"key":"D","text":"统治者对诗歌创作的政策干预"}],"key":"B","answer":"社会政治局势的剧烈变动(如安史之乱)","max":1,"id":"唐诗宋词-8-single-15"},{"n":16,"type":"multi","prompt":"下列诗人中,属于中唐“韩孟诗派”的有","options":[{"key":"A","text":"韩愈"},{"key":"B","text":"孟郊"},{"key":"C","text":"李贺"},{"key":"D","text":"贾岛"},{"key":"E","text":"白居易"}],"key":"ABCD","answer":"韩愈；孟郊；李贺；贾岛","max":2,"id":"唐诗宋词-8-multi-16"},{"n":17,"type":"multi","prompt":"下列作品中,属于中唐新乐府诗的有","options":[{"key":"A","text":"白居易《卖炭翁》"},{"key":"B","text":"元稹《田家词》"},{"key":"C","text":"杜甫《春望》"},{"key":"D","text":"张籍《野老歌》"},{"key":"E","text":"李白 《蜀道难》"}],"key":"ABD","answer":"白居易《卖炭翁》；元稹《田家词》；张籍《野老歌》","max":2,"id":"唐诗宋词-8-multi-17"},{"n":18,"type":"multi","prompt":"下列关于杜甫诗歌“沉郁顿挫”风格的表述,正确的有","options":[{"key":"A","text":"体现于盛唐向中唐过渡时期,反映社会动荡"},{"key":"B","text":"情感深沉抑郁,节奏跌宕起伏"},{"key":"C","text":"代表作有《登高》《春望》《自京赴奉先县咏怀五百字》"},{"key":"D","text":"仅抒发个人身世之悲, 与家国无关"},{"key":"E","text":"是“诗变于盛衰之际”的典型风格"}],"key":"ABCE","answer":"体现于盛唐向中唐过渡时期,反映社会动荡；情感深沉抑郁,节奏跌宕起伏；代表作有《登高》《春望》《自京赴奉先县咏怀五百字》；是“诗变于盛衰之际”的典型风格","max":2,"id":"唐诗宋词-8-multi-18"},{"n":19,"type":"multi","prompt":"中唐诗歌“诗变”的主要表现有","options":[{"key":"A","text":"内容上:从侧重个人情志转向关注社会现实"},{"key":"B","text":"风格上:从昂扬豪迈转向沉郁、奇险、通俗等多元风格"},{"key":"C","text":"题材上:从山水田园、边塞征战扩展到民生疾苦、政治讽喻"},{"key":"D","text":"形式上:仅注重七言律诗,摒弃其他体裁"},{"key":"E","text":"手法上:从浪漫主义为主转向现实主义为主"}],"key":"ABCE","answer":"内容上:从侧重个人情志转向关注社会现实；风格上:从昂扬豪迈转向沉郁、奇险、通俗等多元风格；题材上:从山水田园、边塞征战扩展到民生疾苦、政治讽喻；手法上:从浪漫主义为主转向现实主义为主","max":2,"id":"唐诗宋词-8-multi-19"},{"n":20,"type":"multi","prompt":"下列诗句中,体现中唐诗人李贺“奇诡浓丽”风格的有","options":[{"key":"A","text":"“黑云压城城欲摧,甲光向日金鳞开”"},{"key":"B","text":"“昆山玉碎凤凰叫,芙蓉泣露香兰笑”"},{"key":"C","text":"“慈母手中线,游子身上衣”"},{"key":"D","text":"“大漠沙如雪,燕山月似钩”"},{"key":"E","text":"“两个黄鹂鸣翠柳,一行白鹭上青天”"}],"key":"ABD","answer":"“黑云压城城欲摧,甲光向日金鳞开”；“昆山玉碎凤凰叫,芙蓉泣露香兰笑”；“大漠沙如雪,燕山月似钩”","max":2,"id":"唐诗宋词-8-multi-20"},{"n":21,"type":"term","prompt":"新乐府运动","options":[],"key":"","answer":"新乐府运动是中唐以白居易、元稹为代表的诗歌革新运动,主张反映现实、干预政治,揭露民生疾苦与时政弊端。反对六朝绮靡诗风,语言通俗浅易,“老妪能解”,作品“即事名篇, 无复依傍”,如白居易《新乐府》、元稹《田家词》,推动中唐诗歌向写实发展。","max":3,"id":"唐诗宋词-8-term-21"},{"n":22,"type":"term","prompt":"韩孟诗派","options":[],"key":"","answer":"韩孟诗派是中唐以韩愈、孟郊为核心的诗歌流派,成员有李贺、贾岛等,因二人风格相近而得名。核心特点是追求“奇险怪诞”:韩愈气势雄浑、善用铺陈,孟郊清奇僻苦、注重苦吟, 李贺奇诡浓丽。他们重视字句锤炼,反对平庸,开辟诗歌风格新路径。","max":3,"id":"唐诗宋词-8-term-22"},{"n":23,"type":"term","prompt":"沉郁顿挫","options":[],"key":"","answer":"“沉郁顿挫”是杜甫诗歌的核心风格,形成于安史之乱时期。“沉郁”指情感深沉抑郁,蕴含对社会动荡、民生疾苦与个人身世的悲慨,如《登高》;“顿挫”指节奏跌宕、章法曲折、语言凝练。此风格体现家国情怀与乱世影响,是中唐诗歌“变”的重要标志。","max":3,"id":"唐诗宋词-8-term-23"},{"n":24,"type":"term","prompt":"中唐“苦吟”诗人","options":[],"key":"","answer":"中唐“苦吟”诗人指以贾岛、姚合为代表,注重字句锤炼的诗人群体。他们多仕途失意,侧重闲居生活与自然风物,核心特点是“苦吟”——对字句反复斟酌,追求语言精准传神,如贾岛 “推敲”炼字。其诗风清奇僻苦,影响晚唐及后世的炼字传统。","max":3,"id":"唐诗宋词-8-term-24"},{"n":25,"type":"term","prompt":"诗变于盛衰之际","options":[],"key":"","answer":"“诗变于盛衰之际”是对中唐诗歌发展趋势的概括,指盛唐向中唐转型期的诗变:内容上从情志山水边塞转向社会现实与民生疾苦;风格上从昂扬豪迈转向沉郁、奇险、通俗;手法上从浪漫主义转向现实主义。根本原因是社会政治剧变。","max":3,"id":"唐诗宋词-8-term-25"},{"n":26,"type":"short","prompt":"简述中唐新乐府运动的主要主张与创作特点。","options":[],"key":"","answer":"中唐新乐府运动以白居易、元稹为代表:1主张诗歌反映现实、干预政治,白居易提出“补察时政,泄导人情”,针对宫市、赋税等弊端创作,如《卖炭翁》;2创作上“即事名篇,无复依傍”,直接以现实事件为题,如元稹《田家词》;3语言追求通俗浅易,“非求宫律高, 不务文字奇”,力求“老妪能解”。","max":5,"id":"唐诗宋词-8-short-26"},{"n":27,"type":"short","prompt":"以韩愈、李贺为例,简述韩孟诗派“奇险怪诞”风格的具体表现。","options":[],"key":"","answer":"韩孟诗派“奇险怪诞”风格在韩愈、李贺诗中各有侧重:其一,韩愈以“奇崛雄浑”为特点,善用铺陈夸张与硬语险韵,如《山石》写山石崎岖,《调张籍》以夸张推崇李杜;其二,李贺以“奇诡浓丽”为特点,善用神话意象与幽冥场景,如《雁门太守行》以强烈色彩对比营造战争氛围。","max":5,"id":"唐诗宋词-8-short-27"},{"n":28,"type":"short","prompt":"简述杜甫诗歌“沉郁顿挫”风格的形成原因与具体体现。","options":[],"key":"","answer":"杜甫“沉郁顿挫”风格的形成与时代及个人经历相关:安史之乱中他亲历战乱,个人苦难使其情感深沉抑郁;他精研诗艺、注重锤炼,形成“顿挫”节奏。体现有二:一是“沉郁”的情感内涵,《自京赴奉先县咏怀五百字》以贫富对比揭露现实;二是“顿挫”的艺术表现,如《登高》节奏跌宕,含蓄而有张力。","max":5,"id":"唐诗宋词-8-short-28"},{"n":29,"type":"short","prompt":"简述“诗变于盛衰之际”的主要表现,并举例说明。","options":[],"key":"","answer":"“诗变于盛衰之际”主要表现为三方面:一是内容从个人情志转向社会现实,聚焦民生疾苦与时政弊端,如白居易《卖炭翁》;二是风格从昂扬豪迈转向多元分化,出现沉郁、奇险、通俗等风格;三是手法从浪漫主义转向现实主义,如元稹《田家词》、张籍《野老歌》。其根本原因是安史之乱后的社会动荡。","max":5,"id":"唐诗宋词-8-short-29"},{"n":30,"type":"essay","prompt":"论述“诗变于盛衰之际”的时代背景、主要内涵,并结合杜甫、白居易的创作分析其诗史","options":[],"key":"","answer":"意义。 一、时代背景:安史之乱使盛唐转中唐,矛盾爆发、境遇剧变,诗歌由歌盛世转向叹衰乱。 二、主要内涵:内容由个人情志转向社会现实,以诗为史;风格转向多元,有沉郁、奇险、 通俗;手法由浪漫主义转向现实主义。 三、诗史意义:杜甫以《三吏》《三别》写战乱,开沉郁顿挫之风;白居易倡写实诗论,推动通俗化与题材拓展。 四、总结:“诗变”非衰落而是深化,为宋诗奠基。","max":10,"id":"唐诗宋词-8-essay-30"}],"rawMax":70},{"id":"唐诗宋词-9","title":"章节练习(6章)","questions":[{"n":1,"type":"single","prompt":"白居易提出“文章合为时而著,歌诗合为事而作”的文学主张,其主要目的是","options":[{"key":"A","text":"追求诗歌的艺术审美价值,注重辞藻华丽"},{"key":"B","text":"强调诗歌应反映时事、服务政治,发挥讽谕作用"},{"key":"C","text":"倡导诗歌脱离现实,专注于个人情感抒发"},{"key":"D","text":"主张恢复汉魏古乐府的格律形式,反对创新"}],"key":"B","answer":"强调诗歌应反映时事、服务政治,发挥讽谕作用","max":1,"id":"唐诗宋词-9-single-1"},{"n":2,"type":"single","prompt":"下列作品中,属于元稹新乐府代表作,且反映农民在战乱中被迫输送军粮苦难的是","options":[{"key":"A","text":"《田家词》"},{"key":"B","text":"《卖炭翁》"},{"key":"C","text":"《织妇词》"},{"key":"D","text":"《上阳白发人》"}],"key":"A","answer":"《田家词》","max":1,"id":"唐诗宋词-9-single-2"},{"n":3,"type":"single","prompt":"韩孟诗派的核心艺术特征是","options":[{"key":"A","text":"通俗浅近,注重反映民生疾苦"},{"key":"B","text":"奇险峭怪,追求艺术表现的新奇独特"},{"key":"C","text":"典雅华丽,继承齐梁绮靡文风"},{"key":"D","text":"雄浑豪放,延续盛唐边塞诗风"}],"key":"B","answer":"奇险峭怪,追求艺术表现的新奇独特","max":1,"id":"唐诗宋词-9-single-3"},{"n":4,"type":"single","prompt":"白居易《新乐府序》中提出的“首句标其目,卒章显其志”,主要是指新乐府在结构上的特点是","options":[{"key":"A","text":"开篇点明主题,结尾揭示主旨,主题鲜明"},{"key":"B","text":"开篇设置悬念,结尾留白,引发读者思考"},{"key":"C","text":"全篇采用比兴手法,隐晦表达情感"},{"key":"D","text":"句式整齐,严格遵循汉魏乐府的格律要求"}],"key":"A","answer":"开篇点明主题,结尾揭示主旨,主题鲜明","max":1,"id":"唐诗宋词-9-single-4"},{"n":5,"type":"single","prompt":"李贺诗歌被称为“长吉体”,其最显著的艺术特色是","options":[{"key":"A","text":"语言通俗,贴近民间又语"},{"key":"B","text":"构思奇特,想象丰富,文辞瑰丽"},{"key":"C","text":"风格沉郁,多反映民生疾苦"},{"key":"D","text":"格律严谨,严格遵循近体诗规则"}],"key":"B","answer":"构思奇特,想象丰富,文辞瑰丽","max":1,"id":"唐诗宋词-9-single-5"},{"n":6,"type":"single","prompt":"下列作品中,属于张籍乐府诗,且通过对比揭露农商贫富差距的是","options":[{"key":"A","text":"《野老歌》"},{"key":"B","text":"《促促词》"},{"key":"C","text":"《废居行》"},{"key":"D","text":"《山头鹿》"}],"key":"A","answer":"《野老歌》","max":1,"id":"唐诗宋词-9-single-6"},{"n":7,"type":"single","prompt":"元稹《遣悲怀》三首的核心情感是","options":[{"key":"A","text":"对官场黑暗的批判与愤懑"},{"key":"B","text":"对亡妻韦从的深切悼念与贫贱夫妻的悲哀"},{"key":"C","text":"对边塞将士苦难生活的同情"},{"key":"D","text":"对社会贫富差距的揭露"}],"key":"B","answer":"对亡妻韦从的深切悼念与贫贱夫妻的悲哀","max":1,"id":"唐诗宋词-9-single-7"},{"n":8,"type":"single","prompt":"韩愈《山石》一诗的艺术特色是","options":[{"key":"A","text":"以文为诗,采用游记式的平铺直叙,意境幽美"},{"key":"B","text":"语言奇险,大量使用怪诞意象"},{"key":"C","text":"通俗浅近,贴近民间生活又语"},{"key":"D","text":"格律严谨,严格遵循七律规则"}],"key":"A","answer":"以文为诗,采用游记式的平铺直叙,意境幽美","max":1,"id":"唐诗宋词-9-single-8"},{"n":9,"type":"single","prompt":"白居易《长恨歌》的主要艺术手法是","options":[{"key":"A","text":"以现实主义手法,真实记录唐玄宗与杨贵妃的历史事件"},{"key":"B","text":"融合叙事、抒情与想象, 虚构仙境情节,渲染爱情悲剧"},{"key":"C","text":"采用辛辣讽刺的笔调,批判唐玄宗的荒淫误国"},{"key":"D","text":"以通俗又语为主,贴近民间说唱艺术"}],"key":"B","answer":"融合叙事、抒情与想象, 虚构仙境情节,渲染爱情悲剧","max":1,"id":"唐诗宋词-9-single-9"},{"n":10,"type":"single","prompt":"下列诗人中,不属于韩孟诗派的是","options":[{"key":"A","text":"孟郊"},{"key":"B","text":"贾岛"},{"key":"C","text":"李贺"},{"key":"D","text":"白居易"}],"key":"D","answer":"白居易","max":1,"id":"唐诗宋词-9-single-10"},{"n":11,"type":"single","prompt":"王建《水夫谣》的核心内容是","options":[{"key":"A","text":"描写纤夫在官府逼迫下逆风拉纤的苦难生活"},{"key":"B","text":"反映农民在苛税压迫下的悲惨境遇"},{"key":"C","text":"揭露宫廷贵族的奢侈生活"},{"key":"D","text":"歌颂边塞将士的英勇作战"}],"key":"A","answer":"描写纤夫在官府逼迫下逆风拉纤的苦难生活","max":1,"id":"唐诗宋词-9-single-11"},{"n":12,"type":"single","prompt":"白居易新乐府理论中,“其辞质而径”的含义是","options":[{"key":"A","text":"诗歌语言应质朴直白,便于读者理解"},{"key":"B","text":"诗歌语言应华丽典雅,追求艺术美感"},{"key":"C","text":"诗歌语言应隐晦曲折,引发读者思考"},{"key":"D","text":"诗歌语言应严格遵循古乐府的辞藻规范"}],"key":"A","answer":"诗歌语言应质朴直白,便于读者理解","max":1,"id":"唐诗宋词-9-single-12"},{"n":13,"type":"single","prompt":"李贺《雁门太守行》中,“黑云压城城欲摧,甲光向日金鳞开”两句的作用是","options":[{"key":"A","text":"单纯描绘边塞的自然景色,突出环境的恶劣"},{"key":"B","text":"以黑云与甲光的对比,渲染战争的紧张气氛与军威"},{"key":"C","text":"讽刺敌军的嚣张气焰与官军的软弱"},{"key":"D","text":"表达诗人对和平的渴望"}],"key":"B","answer":"以黑云与甲光的对比,渲染战争的紧张气氛与军威","max":1,"id":"唐诗宋词-9-single-13"},{"n":14,"type":"single","prompt":"元稹《连昌宫词》的主要创作意图是","options":[{"key":"A","text":"通过回忆连昌宫的盛衰,追溯安史之乱原因,表达对政治清明的期盼"},{"key":"B","text":"批判宫廷贵族的奢侈生活"},{"key":"C","text":"反映底层人民在战乱中的苦难"},{"key":"D","text":"歌颂唐玄宗与杨贵妃的爱情"}],"key":"A","answer":"通过回忆连昌宫的盛衰,追溯安史之乱原因,表达对政治清明的期盼","max":1,"id":"唐诗宋词-9-single-14"},{"n":15,"type":"multi","prompt":"下列属于白居易新乐府理论主张的有","options":[{"key":"A","text":"强调诗歌“根情,苗言,华声,实义”,注重情感与内容的统一"},{"key":"B","text":"主张“文章合为时而著,歌诗合为事而作”,反映现实"},{"key":"C","text":"提出“首句标其目,卒章显其志”,结构清晰,主题鲜明"},{"key":"D","text":"要求诗歌语言“质而径”“直而切”,通俗易懂"},{"key":"E","text":"倡导恢复汉魏古乐府的格律,反对创新"}],"key":"ABCD","answer":"强调诗歌“根情,苗言,华声,实义”,注重情感与内容的统一；主张“文章合为时而著,歌诗合为事而作”,反映现实；提出“首句标其目,卒章显其志”,结构清晰,主题鲜明；要求诗歌语言“质而径”“直而切”,通俗易懂","max":2,"id":"唐诗宋词-9-multi-15"},{"n":16,"type":"multi","prompt":"下列作品中,属于“张王乐府”代表作的有","options":[{"key":"A","text":"张籍《野老歌》"},{"key":"B","text":"王建《水夫谣》"},{"key":"C","text":"张籍《牧童词》"},{"key":"D","text":"王建《新嫁娘词》"},{"key":"E","text":"元稹《田家词》"}],"key":"ABCD","answer":"张籍《野老歌》；王建《水夫谣》；张籍《牧童词》；王建《新嫁娘词》","max":2,"id":"唐诗宋词-9-multi-16"},{"n":17,"type":"multi","prompt":"韩孟诗派“奇险”风格的主要表现有","options":[{"key":"A","text":"构思刻意求奇,常用夸张、怪诞意象"},{"key":"B","text":"语言生涩奥衍,善用僻字险韵"},{"key":"C","text":"以文为诗,借鉴散文的铺叙与议论手法"},{"key":"D","text":"题材多反映社会现实,风格通俗浅近"},{"key":"E","text":"注重意境的幽美空灵,继承盛唐山水诗风"}],"key":"ABC","answer":"构思刻意求奇,常用夸张、怪诞意象；语言生涩奥衍,善用僻字险韵；以文为诗,借鉴散文的铺叙与议论手法","max":2,"id":"唐诗宋词-9-multi-17"},{"n":18,"type":"multi","prompt":"下列关于李贺“长吉体”的表述,正确的有","options":[{"key":"A","text":"构思奇特,善于“探寻前事”,将传说与现实结合"},{"key":"B","text":"想象丰富,常构建虚幻荒诞的意境,如《梦天》"},{"key":"C","text":"文辞瑰丽,注重色彩与感官描写,如《雁门太守行》"},{"key":"D","text":"题材多为个人怀才不遇的愤懑与对生命短暂的感慨"},{"key":"E","text":"风格通俗浅近,贴近民间又语"}],"key":"ABCD","answer":"构思奇特,善于“探寻前事”,将传说与现实结合；想象丰富,常构建虚幻荒诞的意境,如《梦天》；文辞瑰丽,注重色彩与感官描写,如《雁门太守行》；题材多为个人怀才不遇的愤懑与对生命短暂的感慨","max":2,"id":"唐诗宋词-9-multi-18"},{"n":19,"type":"multi","prompt":"下列属于元白诗派通俗化倾向表现的有","options":[{"key":"A","text":"语言浅近直白,贴近民间又语,如白居易《问刘十九》"},{"key":"B","text":"题材拓展到日常生活琐事,如白居易《暮江吟》"},{"key":"C","text":"借鉴市人小说、传奇手法,铺排故事,如白居易《长恨歌》"},{"key":"D","text":"采用民歌的句式与韵律,如元稹《遣悲怀》"},{"key":"E","text":"注重艺术构思的新奇,常用怪诞意象"}],"key":"ABC","answer":"语言浅近直白,贴近民间又语,如白居易《问刘十九》；题材拓展到日常生活琐事,如白居易《暮江吟》；借鉴市人小说、传奇手法,铺排故事,如白居易《长恨歌》","max":2,"id":"唐诗宋词-9-multi-19"},{"n":20,"type":"term","prompt":"张王乐府","options":[],"key":"","answer":"“张王乐府”是中唐诗人张籍、王建乐府诗的合称。二人继承汉乐府“感于哀乐,缘事而发”的传统,以乐府反映社会现实,题材多写底层劳动者的苦难,如张籍《野老歌》、王建《水夫谣》。语言浅近通俗,善以细节展现社会矛盾,为元白新乐府运动提供借鉴。","max":3,"id":"唐诗宋词-9-term-20"},{"n":21,"type":"term","prompt":"新乐府","options":[],"key":"","answer":"新乐府:中唐元稹、白居易等倡导的诗歌体裁,突破汉乐府旧题束缚,“即事名篇”,直接反映社会现实与民生疾苦,强调诗歌“补察时政”“泄导人情”的功能,语言质朴通俗,结构上多 “首句标其目,卒章显其志”,代表作有白居易《卖炭翁》、元稹《田家词》等。","max":3,"id":"唐诗宋词-9-term-21"},{"n":22,"type":"term","prompt":"韩孟诗派","options":[],"key":"","answer":"韩孟诗派是中唐以韩愈、孟郊为核心的诗歌流派,成员有李贺、贾岛等,因二人风格相近而得名。核心特点是追求“奇险怪诞”:韩愈气势雄浑、善用铺陈,孟郊清奇僻苦、注重苦吟, 李贺奇诡浓丽。他们重视字句锤炼,反对平庸,开辟诗歌风格新路径。","max":3,"id":"唐诗宋词-9-term-22"},{"n":23,"type":"term","prompt":"长吉体","options":[],"key":"","answer":"“长吉体”指中唐诗人李贺(字长吉)的独特诗风。一是构思奇特,善“探寻前事”,取材历史传说与神话,如《金铜仙人辞汉歌》;二是想象丰富,多虚幻荒诞意境,如《梦天》;三是文辞瑰丽,注重色彩渲染。多抒怀才不遇、生命短暂之忧,风格幽峭浓丽。","max":3,"id":"唐诗宋词-9-term-23"},{"n":24,"type":"term","prompt":"元白诗派的通俗化倾向","options":[],"key":"","answer":"元白诗派的通俗化倾向是中唐元稹、白居易诗歌的显著特征。一是语言浅近直白,多用民间又语;二是题材转向日常生活与平凡情感;三是借鉴小说传奇的叙事手法,注重情节铺陈, 如白居易《长恨歌》。它扩大了诗歌受众,影响后世通俗文学。","max":3,"id":"唐诗宋词-9-term-24"},{"n":25,"type":"short","prompt":"简要概括白居易新乐府的理论主张。","options":[],"key":"","answer":"白居易新乐府的理论主张见于《与元九书》《新乐府序》:一是诗歌功能上主张“根情,苗言,华声,实义”,突出“感人心”的教化作用;二是创作目的上要求诗歌服务政治、反映民生,反对无病呻吟;三是形式结构上要求“首句标其目,卒章显其志”,语言“质而径”“直而切”;四是倡导恢复采诗制度,“选观风之使,建采诗之官”。","max":5,"id":"唐诗宋词-9-short-25"},{"n":26,"type":"short","prompt":"举例说明“张王乐府”的艺术特点。","options":[],"key":"","answer":"“张王乐府”的艺术特点有三:一是题材聚焦底层,反映社会现实,如张籍《野老歌》写农夫受苛税之苦,王建《水夫谣》写纤夫受逼迫的艰辛;二是语言浅近通俗,贴近民间又语,如王建《新嫁娘词》写日常细节;三是善用细节刻画与对比手法,如张籍《野老歌》以贫富对比揭露差距,王建《羽林行》讽刺羽林军作恶获赦。","max":5,"id":"唐诗宋词-9-short-26"},{"n":27,"type":"short","prompt":"韩孟诗派的“奇”主要有哪些表现?","options":[],"key":"","answer":"韩孟诗派的“奇”表现在三方面:一是构思奇崛,多用夸张怪诞想象,如韩愈《南山诗》、李贺《李凭箜篌引》;二是语言奇涩,善用僻字险韵与生硬句式,如孟郊《楚怨》、贾岛《题李凝幽居》以“敲”字炼字见苦吟之趣;三是手法新奇,倡导“以文为诗”,如韩愈《山石》以游记式叙事突破格律,孟郊《游子吟》以新奇构思升华母爱。","max":5,"id":"唐诗宋词-9-short-27"},{"n":28,"type":"short","prompt":"简要分析李贺诗歌艺术构思的主要特点。","options":[],"key":"","answer":"李贺诗歌的艺术构思主要有两大特点:一是“探寻前事”,从历史传说、神话中汲取灵感,将虚幻典故与现实情感结合,杜牧《李贺歌诗集序》称其“探寻前事,求取情状”,如《金铜仙人辞汉歌》抒王朝兴亡之感;二是善于捕捉抽象的心理感受,把无形情感化为可感意象,如 《李凭箜篌引》写乐声,《雁门太守行》写战争氛围。","max":5,"id":"唐诗宋词-9-short-28"},{"n":29,"type":"essay","prompt":"论述中唐元白诗派与韩孟诗派的异同,并分析两派形成的时代背景。","options":[],"key":"","answer":"一、异同:(一)相同点:两派同处中唐,均关注现实与寒士命运,均突破盛唐与大历诗风。(二)不同点:元白尚通俗浅近,重讽谕叙事,题材广;韩孟尚奇险峭怪,重个人抒情,倡“以文为诗”,受众狭。 二、时代背景:(一)政治危机:藩镇割据、宦官专权、土地兼并,文人仕途坎坷。(二) 思想文化:儒学复兴、通俗文学兴起,孕育两派理论。(三)文学需求:盛唐诗饱和、大历诗平庸,创新势在必然。","max":10,"id":"唐诗宋词-9-essay-29"}],"rawMax":69},{"id":"唐诗宋词-10","title":"章节练习(7章)","questions":[{"n":1,"type":"single","prompt":"下列作品中,属于刘禹锡怀古诗代表作,借西晋灭吴史事抒发兴亡之感的是","options":[{"key":"A","text":"《乌衣巷》"},{"key":"B","text":"《西塞山怀古》"},{"key":"C","text":"《石头城》"},{"key":"D","text":"《竹枝词》"}],"key":"B","answer":"《西塞山怀古》","max":1,"id":"唐诗宋词-10-single-1"},{"n":2,"type":"single","prompt":"刘禹锡《竹枝词》“东边日出西边雨,道是无晴却有晴”中,“晴”的双关含义是","options":[{"key":"A","text":"天气晴朗/心情愉悦"},{"key":"B","text":"天气晴朗/情意深厚"},{"key":"C","text":"时间清明/情感真挚"},{"key":"D","text":"地点晴明/爱意浓烈"}],"key":"B","answer":"天气晴朗/情意深厚","max":1,"id":"唐诗宋词-10-single-2"},{"n":3,"type":"single","prompt":"柳宗元山水诗《江雪》中,“千山鸟飞绝,万径人踪灭”营造的意境特点是","options":[{"key":"A","text":"热闹喧嚣,充满生机"},{"key":"B","text":"清冷孤寂,空灵纯净"},{"key":"C","text":"雄浑壮阔,气势磅礴"},{"key":"D","text":"清新秀丽, 明快活泼"}],"key":"B","answer":"清冷孤寂,空灵纯净","max":1,"id":"唐诗宋词-10-single-3"},{"n":4,"type":"single","prompt":"下列属于柳宗元借渔翁形象寄托超脱情怀的山水诗是","options":[{"key":"A","text":"《南涧中题》"},{"key":"B","text":"《渔翁》"},{"key":"C","text":"《田家》"},{"key":"D","text":"《登柳州城楼寄漳汀封连四州》"}],"key":"B","answer":"《渔翁》","max":1,"id":"唐诗宋词-10-single-4"},{"n":5,"type":"single","prompt":"姚贾诗派的核心创作特点是","options":[{"key":"A","text":"通俗浅近,反映民生疾苦"},{"key":"B","text":"奇险峭怪,追求艺术新奇"},{"key":"C","text":"苦吟炼字,侧重隐逸闲居题材"},{"key":"D","text":"雄浑豪放,抒发爱国情怀"}],"key":"C","answer":"苦吟炼字,侧重隐逸闲居题材","max":1,"id":"唐诗宋词-10-single-5"},{"n":6,"type":"single","prompt":"贾岛《剑客》“十年磨一剑,霜刃未曾试”中,“剑”的象征意义是","options":[{"key":"A","text":"诗人的才华与抱负"},{"key":"B","text":"侠客的武器与身份"},{"key":"C","text":"江湖的恩怨与情仇"},{"key":"D","text":"社会的矛盾与冲突"}],"key":"A","answer":"诗人的才华与抱负","max":1,"id":"唐诗宋词-10-single-6"},{"n":7,"type":"single","prompt":"刘禹锡《插田歌》的创作意图与以下哪一文学主张一致","options":[{"key":"A","text":"“文章合为时而著,歌诗合为事而作”"},{"key":"B","text":"“务去陈言,辞必己出”"},{"key":"C","text":"“羚羊挂角,无迹可求”"},{"key":"D","text":"“以文为诗,以议论入诗”"}],"key":"A","answer":"“文章合为时而著,歌诗合为事而作”","max":1,"id":"唐诗宋词-10-single-7"},{"n":8,"type":"single","prompt":"柳宗元《田家》其二中,“蚕丝尽输税,机杼空倚壁”反映的社会问题是","options":[{"key":"A","text":"战乱导致农田荒芜"},{"key":"B","text":"苛税压迫下农民的贫困"},{"key":"C","text":"手工业者的失业危机"},{"key":"D","text":"贵族对农民的土地兼并"}],"key":"B","answer":"苛税压迫下农民的贫困","max":1,"id":"唐诗宋词-10-single-8"},{"n":9,"type":"single","prompt":"下列诗句中,体现贾岛“苦吟”特点,因炼字而闻名的是","options":[{"key":"A","text":"“松下问童子,言师采药去”"},{"key":"B","text":"“鸟宿池边树,僧敲月下门”"},{"key":"C","text":"“怪禽啼旷野,落日恐行人”"},{"key":"D","text":"“秋风吹渭水,落叶满长安”"}],"key":"B","answer":"“鸟宿池边树,僧敲月下门”","max":1,"id":"唐诗宋词-10-single-9"},{"n":10,"type":"single","prompt":"刘禹锡《再游玄都观》“种桃道士归何处,前度刘郎今又来”中,“刘郎”指的是","options":[{"key":"A","text":"刘备"},{"key":"B","text":"刘禹锡自喻"},{"key":"C","text":"刘向"},{"key":"D","text":"刘长卿"}],"key":"B","answer":"刘禹锡自喻","max":1,"id":"唐诗宋词-10-single-10"},{"n":11,"type":"single","prompt":"柳宗元《南涧中题》“羁禽响幽谷,寒藻舞沦漪”的艺术手法是","options":[{"key":"A","text":"以动衬静,情景交融"},{"key":"B","text":"夸张渲染,虚实结合"},{"key":"C","text":"对比鲜明,借景抒情"},{"key":"D","text":"托物言志, 象征寄托"}],"key":"A","answer":"以动衬静,情景交融","max":1,"id":"唐诗宋词-10-single-11"},{"n":12,"type":"single","prompt":"姚合《武功县中作》三十首的主要内容是","options":[{"key":"A","text":"边塞征战的艰辛"},{"key":"B","text":"官场应酬的繁琐"},{"key":"C","text":"穷邑为官的闲愁与日常起居"},{"key":"D","text":"宫廷贵族的奢侈生活"}],"key":"C","answer":"穷邑为官的闲愁与日常起居","max":1,"id":"唐诗宋词-10-single-12"},{"n":13,"type":"single","prompt":"刘禹锡《金陵五题》中,通过“淮水东边旧时月,夜深还过女墙来”表达兴亡之感的作品是","options":[{"key":"A","text":"《西塞山怀古》"},{"key":"B","text":"《乌衣巷》"},{"key":"C","text":"《石头城》"},{"key":"D","text":"《生公讲堂》"}],"key":"C","answer":"《石头城》","max":1,"id":"唐诗宋词-10-single-13"},{"n":14,"type":"single","prompt":"贾岛《寻隐者不遇》“只在此山中,云深不知处”的艺术特色是","options":[{"key":"A","text":"直抒胸臆,情感强烈"},{"key":"B","text":"含蓄隽永,余味无穷"},{"key":"C","text":"铺陈叙事,细节丰富"},{"key":"D","text":"华丽辞藻, 对仗工整"}],"key":"B","answer":"含蓄隽永,余味无穷","max":1,"id":"唐诗宋词-10-single-14"},{"n":15,"type":"single","prompt":"柳宗元《登柳州城楼寄漳汀封连四州》中,“惊风乱飐芙蓉水,密雨斜侵薜荔墙”的作用是","options":[{"key":"A","text":"单纯描绘柳州的自然景色"},{"key":"B","text":"以景物象征诗人的政治处境"},{"key":"C","text":"对比芙蓉与薜荔的生长状态"},{"key":"D","text":"赞美柳州山水的秀丽多姿"}],"key":"B","answer":"以景物象征诗人的政治处境","max":1,"id":"唐诗宋词-10-single-15"},{"n":16,"type":"multi","prompt":"下列属于刘禹锡怀古诗特点的有","options":[{"key":"A","text":"借历史遗迹想象优美怅惘的意境"},{"key":"B","text":"语言浅显却含蕴深厚"},{"key":"C","text":"常以自然永恒反衬人事变迁"},{"key":"D","text":"多采用夸张、怪诞的意象"},{"key":"E","text":"侧重抒发个人怀才不遇的愤懑"}],"key":"ABC","answer":"借历史遗迹想象优美怅惘的意境；语言浅显却含蕴深厚；常以自然永恒反衬人事变迁","max":2,"id":"唐诗宋词-10-multi-16"},{"n":17,"type":"multi","prompt":"柳宗元山水诗的艺术特色包括","options":[{"key":"A","text":"继承谢灵运山水诗的精细描摹"},{"key":"B","text":"融入楚辞的幽愤情调"},{"key":"C","text":"善用白描手法,意境清峻孤高"},{"key":"D","text":"多以山水寄托贬谪之思"},{"key":"E","text":"风格雄浑豪放,充满盛唐气象"}],"key":"ABCD","answer":"继承谢灵运山水诗的精细描摹；融入楚辞的幽愤情调；善用白描手法,意境清峻孤高；多以山水寄托贬谪之思","max":2,"id":"唐诗宋词-10-multi-17"},{"n":18,"type":"multi","prompt":"下列作品中,属于姚贾诗派代表作的有","options":[{"key":"A","text":"贾岛《剑客》"},{"key":"B","text":"姚合《武功县中作》"},{"key":"C","text":"贾岛《寻隐者不遇》"},{"key":"D","text":"姚合《原上新居》"},{"key":"E","text":"孟郊《秋怀》"}],"key":"ABCD","answer":"贾岛《剑客》；姚合《武功县中作》；贾岛《寻隐者不遇》；姚合《原上新居》","max":2,"id":"唐诗宋词-10-multi-18"},{"n":19,"type":"multi","prompt":"刘禹锡《竹枝词》的艺术特点有","options":[{"key":"A","text":"借鉴巴东民歌的曲调与风格"},{"key":"B","text":"善用双关、比喻等修辞手法"},{"key":"C","text":"语言通俗浅近,贴近民间又语"},{"key":"D","text":"题材多反映夔州风土习俗"},{"key":"E","text":"风格雄浑豪放,充满边塞气息"}],"key":"ABCD","answer":"借鉴巴东民歌的曲调与风格；善用双关、比喻等修辞手法；语言通俗浅近,贴近民间又语；题材多反映夔州风土习俗","max":2,"id":"唐诗宋词-10-multi-19"},{"n":20,"type":"multi","prompt":"下列关于姚贾诗派“苦吟”的表述,正确的有","options":[{"key":"A","text":"贾岛“两句三年得,一吟双泪流”是苦吟的典型体现"},{"key":"B","text":"姚合苦吟侧重描摹日常生活与自然风物"},{"key":"C","text":"苦吟的目的是追求诗句的精准与意境的新奇"},{"key":"D","text":"苦吟导致其作品语言晦涩、难以理解"},{"key":"E","text":"苦吟风格对后世江西诗派的“夺胎换骨”有影响"}],"key":"ABCE","answer":"贾岛“两句三年得,一吟双泪流”是苦吟的典型体现；姚合苦吟侧重描摹日常生活与自然风物；苦吟的目的是追求诗句的精准与意境的新奇；苦吟风格对后世江西诗派的“夺胎换骨”有影响","max":2,"id":"唐诗宋词-10-multi-20"},{"n":21,"type":"term","prompt":"“诗豪”刘禹锡","options":[],"key":"","answer":"“诗豪”是后人对刘禹锡的称谓,因其诗兼有豪迈爽朗与含蓄深厚之风。他仕途坎坷却精神顽强,怀古诗借史抒兴亡之感;讽刺诗借物喻人;《竹枝词》借鉴民歌,通俗鲜活。其诗继承盛唐气象又融入个人政治体验,形成“豪”而不粗、深而不晦的风格。","max":3,"id":"唐诗宋词-10-term-21"},{"n":22,"type":"term","prompt":"柳宗元山水诗","options":[],"key":"","answer":"柳宗元山水诗是其贬谪期间创作的重要类型,代表作《江雪》《渔翁》。它继承谢灵运精细描摹的传统,又融入楚辞的幽愤,善用白描,意境清冷孤寂;借山水寄托贬谪之思,形成清峻孤高的风格。是王孟之后山水诗的重要延续,与韦应物并称“韦柳”。","max":3,"id":"唐诗宋词-10-term-22"},{"n":23,"type":"term","prompt":"姚贾诗派","options":[],"key":"","answer":"姚贾诗派是中唐以贾岛、姚合为核心的诗歌流派,二人皆以苦吟著称。诗人多仕途失意,题材侧重隐逸闲居与自然风物。艺术上注重字句锤炼,追求语言精准与意境清峭。其对后世炼字传统影响深远,是中唐诗歌多元发展的重要分支。","max":3,"id":"唐诗宋词-10-term-23"},{"n":24,"type":"term","prompt":"刘禹锡《竹枝词》","options":[],"key":"","answer":"刘禹锡《竹枝词》是中唐借鉴巴东民歌创作的七言绝句组诗,今存十一首,多作于夔州任上。内容或描绘夔州风土习俗,或抒写真挚爱情,或暗含刺时寄慨。语言通俗浅近,节奏明快,保留民歌神韵又融入文人含蓄意境,推动了乐府诗的通俗化。","max":3,"id":"唐诗宋词-10-term-24"},{"n":25,"type":"term","prompt":"贾岛“苦吟”","options":[],"key":"","answer":"贾岛“苦吟”是中唐诗人贾岛的创作特征,指作诗反复锤炼字句、斟酌意境。他常为一字耗费心血,“两句三年得”传为佳话。其苦吟追求诗句精准传神与意境新奇清峭,推动了诗歌语言的精细化,对后世炼字传统影响深远,是姚贾诗派的重要标志。","max":3,"id":"唐诗宋词-10-term-25"},{"n":26,"type":"short","prompt":"简要概括刘禹锡怀古诗的艺术特色。","options":[],"key":"","answer":"刘禹锡怀古诗的艺术特色有三:一是意境优美怅惘,借历史遗迹展开想象,如《石头城》 《乌衣巷》营造荒凉衰败景象;二是语言浅显而含蕴深厚,少用艰深典故,如《西塞山怀古》直白叙事却暗含哲理;三是善用对比反衬,以自然永恒反衬人事变迁,如明月亘古不变凸显王朝更迭的短暂。","max":5,"id":"唐诗宋词-10-short-26"},{"n":27,"type":"short","prompt":"举例说明柳宗元山水诗如何寄托贬谪之思。","options":[],"key":"","answer":"柳宗元山水诗常以山水景象为载体,含蓄寄托贬谪的孤独与超脱,主要体现在两方面:一是以清冷孤寂的山水反衬内心的孤独,如《江雪》以无人踪迹的寂静暗喻被贬后与世隔绝的处境;二是以山水的幽深象征心境的幽愤,如《渔翁》写渔翁与自然相融的生活,寄托摆脱政治束缚、回归自然的渴望。","max":5,"id":"唐诗宋词-10-short-27"},{"n":28,"type":"short","prompt":"姚贾诗派的“苦吟”有哪些具体表现?","options":[],"key":"","answer":"姚贾诗派“苦吟”的表现有三:一是字句锤炼的极致追求,贾岛为“推”“敲”二字反复斟酌,姚合亦深思字句选择;二是题材聚焦细微日常,多写隐逸生活与自然风物,如贾岛《寻隐者不遇》、姚合《武功县中作》;三是意境的清峭营造,突出景物清冷孤寂,如贾岛《暮过山村》、姚合《过不疑上人院》。","max":5,"id":"唐诗宋词-10-short-28"},{"n":29,"type":"short","prompt":"简要分析刘禹锡《竹枝词》对民歌的借鉴与创新。","options":[],"key":"","answer":"刘禹锡《竹枝词》对民歌的借鉴与创新有三:一是借鉴民歌的曲调与风格,保留其明快节奏与又语化特点;二是吸收民歌的表现手法,善用双关、比兴,如“道是无晴却有晴”以“晴”双关“情”,托物抒情;三是融入文人的情感与思考,部分作品暗含刺时寄慨,借峡水险滩比喻人间险恶,实现“俗中见雅”。","max":5,"id":"唐诗宋词-10-short-29"},{"n":30,"type":"essay","prompt":"论述中唐刘禹锡、柳宗元及姚贾诗派的诗歌创作如何体现中唐诗歌“沿革”的特点,并分","options":[],"key":"","answer":"析其共同的时代背景影响。 一、体现:(一)刘禹锡承盛唐而创新:怀古借史抒兴亡,学民歌开通俗化之路。(二)柳宗元续山水诗传统:借《江雪》《渔翁》寄托贬谪之思。(三)姚贾开苦吟一路:炼字求工,题材转向隐逸日常。 二、时代背景:(一)政治衰败:藩镇割据、宦官专权,刘柳被贬、姚贾失意。(二)儒学复兴与世俗化:文以载道促干预现实,民歌传奇促题材日常化。(三)盛唐诗饱和:三家以豪、清峻、苦吟补盛唐之不足。","max":10,"id":"唐诗宋词-10-essay-30"}],"rawMax":70},{"id":"唐诗宋词-11","title":"章节练习(8章)","questions":[{"n":1,"type":"single","prompt":"杜牧《江南春》“南朝四百八十寺,多少楼台烟雨中”所蕴含的情感基调是","options":[{"key":"A","text":"对江南春雨的喜爱"},{"key":"B","text":"对南朝佛教兴盛的赞美"},{"key":"C","text":"对历史兴亡的感慨"},{"key":"D","text":"对楼台建筑的惊叹"}],"key":"C","answer":"对历史兴亡的感慨","max":1,"id":"唐诗宋词-11-single-1"},{"n":2,"type":"single","prompt":"李商隐《贾生》“可怜夜半虚前席,不问苍生问鬼神”中,“贾生”指的是","options":[{"key":"A","text":"贾谊"},{"key":"B","text":"贾岛"},{"key":"C","text":"贾至"},{"key":"D","text":"贾曾"}],"key":"A","answer":"贾谊","max":1,"id":"唐诗宋词-11-single-2"},{"n":3,"type":"single","prompt":"温庭筠《苏武庙》“云边雁断胡天月,陇上羊归塞草烟”所描绘的苏武形象特点是","options":[{"key":"A","text":"英勇善战"},{"key":"B","text":"孤独坚守"},{"key":"C","text":"奢侈享乐"},{"key":"D","text":"淡泊名利"}],"key":"B","answer":"孤独坚守","max":1,"id":"唐诗宋词-11-single-3"},{"n":4,"type":"single","prompt":"杜牧《山行》“停车坐爱枫林晚,霜叶红于二月花”中,“坐”的含义是","options":[{"key":"A","text":"座位"},{"key":"B","text":"坐下"},{"key":"C","text":"因为"},{"key":"D","text":"停留"}],"key":"C","answer":"因为","max":1,"id":"唐诗宋词-11-single-4"},{"n":5,"type":"single","prompt":"李商隐《贾生》的构思特点是","options":[{"key":"A","text":"直抒胸臆,情感强烈"},{"key":"B","text":"以小见大,对比鲜明"},{"key":"C","text":"借景抒情,情景交融"},{"key":"D","text":"托物言志, 象征寄托"}],"key":"B","answer":"以小见大,对比鲜明","max":1,"id":"唐诗宋词-11-single-5"},{"n":6,"type":"single","prompt":"温庭筠《苏武庙》中,“回日楼台非甲帐,去时冠剑是丁年”一联的艺术手法是","options":[{"key":"A","text":"夸张"},{"key":"B","text":"对比"},{"key":"C","text":"比喻"},{"key":"D","text":"拟人"}],"key":"B","answer":"对比","max":1,"id":"唐诗宋词-11-single-6"},{"n":7,"type":"single","prompt":"杜牧《泊秦淮》“商女不知亡国恨,隔江犹唱后庭花”中,“后庭花”指代的是","options":[{"key":"A","text":"南朝陈后主的亡国之曲"},{"key":"B","text":"江南地区的民间歌谣"},{"key":"C","text":"宫廷宴会的娱乐曲目"},{"key":"D","text":"描写庭院景色的乐曲"}],"key":"A","answer":"南朝陈后主的亡国之曲","max":1,"id":"唐诗宋词-11-single-7"},{"n":8,"type":"single","prompt":"李商隐无题诗“春蚕到死丝方尽,蜡炬成灰泪始干”中,“丝”的双关含义是","options":[{"key":"A","text":"丝绸/思念"},{"key":"B","text":"丝线/思绪"},{"key":"C","text":"蚕丝/相思"},{"key":"D","text":"丝织品/忧愁"}],"key":"C","answer":"蚕丝/相思","max":1,"id":"唐诗宋词-11-single-8"},{"n":9,"type":"single","prompt":"温庭筠《商山早行》“鸡声茅店月,人迹板桥霜”的艺术特色是","options":[{"key":"A","text":"浓墨重彩,华丽辞藻"},{"key":"B","text":"纯用名词,勾勒意境"},{"key":"C","text":"直抒胸臆,情感强烈"},{"key":"D","text":"对比鲜明, 讽刺尖锐"}],"key":"B","answer":"纯用名词,勾勒意境","max":1,"id":"唐诗宋词-11-single-9"},{"n":10,"type":"single","prompt":"唐末诗人聂夷中《咏田家》“医得眼前疮,挖却心头肉”所反映的社会问题是","options":[{"key":"A","text":"战乱导致农田荒芜"},{"key":"B","text":"苛税对农民的残酷压榨"},{"key":"C","text":"自然灾害引发的饥荒"},{"key":"D","text":"贵族对土地的兼并"}],"key":"B","answer":"苛税对农民的残酷压榨","max":1,"id":"唐诗宋词-11-single-10"},{"n":11,"type":"single","prompt":"杜牧《过华清宫绝句》“一骑红尘妃子笑,无人知是荔枝来”的讽刺对象是","options":[{"key":"A","text":"杨贵妃的奢侈"},{"key":"B","text":"唐玄宗的昏庸"},{"key":"C","text":"宦官的专权"},{"key":"D","text":"藩镇的割据"}],"key":"B","answer":"唐玄宗的昏庸","max":1,"id":"唐诗宋词-11-single-11"},{"n":12,"type":"single","prompt":"李商隐《隋宫》“于今腐草无萤火,终古垂杨有暮鸦”所营造的意境是","options":[{"key":"A","text":"生机盎然"},{"key":"B","text":"热闹繁华"},{"key":"C","text":"荒凉衰败"},{"key":"D","text":"宁静祥和"}],"key":"C","answer":"荒凉衰败","max":1,"id":"唐诗宋词-11-single-12"},{"n":13,"type":"single","prompt":"温庭筠《利州南渡》“数丛沙草群鸥散,万顷江田一鹭飞”的写景特点是","options":[{"key":"A","text":"动静结合"},{"key":"B","text":"以小见大"},{"key":"C","text":"虚实相生"},{"key":"D","text":"借景抒情"}],"key":"A","answer":"动静结合","max":1,"id":"唐诗宋词-11-single-13"},{"n":14,"type":"single","prompt":"唐末诗人杜荀鹤《山中寡妇》“桑柘废来犹纳税,田园荒后尚征苗”反映的社会矛盾是","options":[{"key":"A","text":"地主与农民的阶级矛盾"},{"key":"B","text":"官府与农民的赋税矛盾"},{"key":"C","text":"农民与手工业者的竞争"},{"key":"D","text":"少数民族与汉族的冲突"}],"key":"B","answer":"官府与农民的赋税矛盾","max":1,"id":"唐诗宋词-11-single-14"},{"n":15,"type":"single","prompt":"李商隐《锦瑟》“庄生晓梦迷蝴蝶,望帝春心托杜鹃”中,“望帝”的典故象征","options":[{"key":"A","text":"对自由的向往"},{"key":"B","text":"对爱情的执着"},{"key":"C","text":"对理想的追求"},{"key":"D","text":"对身世的感伤"}],"key":"D","answer":"对身世的感伤","max":1,"id":"唐诗宋词-11-single-15"},{"n":16,"type":"multi","prompt":"下列属于杜牧七绝特点的有","options":[{"key":"A","text":"善于概括,画面鲜明"},{"key":"B","text":"含蓄蕴藉,趣味悠长"},{"key":"C","text":"好发议论,见解新警"},{"key":"D","text":"语言华丽,辞藻堆砌"},{"key":"E","text":"意境空灵,风格豪放"}],"key":"ABC","answer":"善于概括,画面鲜明；含蓄蕴藉,趣味悠长；好发议论,见解新警","max":2,"id":"唐诗宋词-11-multi-16"},{"n":17,"type":"multi","prompt":"李商隐咏史诗的艺术特色包括","options":[{"key":"A","text":"以小见大,出奇制胜"},{"key":"B","text":"构思细密,旨趣深僻"},{"key":"C","text":"善用典故,含蓄委婉"},{"key":"D","text":"语言通俗,直白浅近"},{"key":"E","text":"对比鲜明,讽刺尖锐"}],"key":"ABCE","answer":"以小见大,出奇制胜；构思细密,旨趣深僻；善用典故,含蓄委婉；对比鲜明,讽刺尖锐","max":2,"id":"唐诗宋词-11-multi-17"},{"n":18,"type":"multi","prompt":"温庭筠诗歌的构思特色有","options":[{"key":"A","text":"善于捕捉独特审美角度"},{"key":"B","text":"意境朦胧,寄意深隐"},{"key":"C","text":"章法灵活,画面剪接"},{"key":"D","text":"语言浅近,贴近又语"},{"key":"E","text":"咏史感时,以古讽今"}],"key":"ABCE","answer":"善于捕捉独特审美角度；意境朦胧,寄意深隐；章法灵活,画面剪接；咏史感时,以古讽今","max":2,"id":"唐诗宋词-11-multi-18"},{"n":19,"type":"multi","prompt":"唐末诗人反映现实的作品所揭示的社会矛盾有","options":[{"key":"A","text":"苛捐杂税对农民的压榨"},{"key":"B","text":"藩镇割据导致的战乱"},{"key":"C","text":"官僚贵族的奢侈享乐"},{"key":"D","text":"贫富差距的极端悬殊"},{"key":"E","text":"科举制度的腐朽黑暗"}],"key":"ABCD","answer":"苛捐杂税对农民的压榨；藩镇割据导致的战乱；官僚贵族的奢侈享乐；贫富差距的极端悬殊","max":2,"id":"唐诗宋词-11-multi-19"},{"n":20,"type":"multi","prompt":"下列属于晚唐诗坛特点的有","options":[{"key":"A","text":"精神趋于萎靡,境界狭窄"},{"key":"B","text":"表现追求尖新纤巧"},{"key":"C","text":"七绝成就最高,开宋诗门径"},{"key":"D","text":"继承盛唐雄浑,风格豪放"},{"key":"E","text":"多反映社会现实,批判尖锐"}],"key":"ABC","answer":"精神趋于萎靡,境界狭窄；表现追求尖新纤巧；七绝成就最高,开宋诗门径","max":2,"id":"唐诗宋词-11-multi-20"},{"n":21,"type":"term","prompt":"杜牧七绝","options":[],"key":"","answer":"杜牧七绝是晚唐诗人杜牧的代表性诗体,以清丽俊逸、含蓄蕴藉著称。内容多写自然景色、 咏史抒怀与讽刺现实;以简洁语言概括典型场景;构思精巧,常于写景中暗含议论,如《江南春》。其风格兼承盛唐兴会与中晚唐深思,是晚唐七绝成就的代表。","max":3,"id":"唐诗宋词-11-term-21"},{"n":22,"type":"term","prompt":"李商隐无题诗","options":[],"key":"","answer":"李商隐无题诗是晚唐诗人李商隐创作的一类特殊诗歌,多以“无题”或首句二字为题,多写爱情、身世或暗寓政治感慨,如《锦瑟》。艺术上善用比兴、典故,意境朦胧,辞采秾艳,情感深挚;因寓意隐晦而解读纷纭,成为唐诗中极具个性的品类。","max":3,"id":"唐诗宋词-11-term-22"},{"n":23,"type":"term","prompt":"温庭筠咏史诗","options":[],"key":"","answer":"温庭筠咏史诗是晚唐诗人温庭筠以历史题材为核心的诗歌,代表作《苏武庙》《过陈琳墓》。其构思精巧,善选取典型场景刻画人物心境;意境雄浑苍凉,常借历史遗迹抒兴亡之感;语言典丽精工,用典贴切,是“以古讽今”咏史诗的重要代表。","max":3,"id":"唐诗宋词-11-term-23"},{"n":24,"type":"term","prompt":"唐末现实诗","options":[],"key":"","answer":"唐末现实诗是晚唐末年诗人反映社会现实的诗歌,代表诗人有聂夷中、杜荀鹤、皮日休等。 内容聚焦民生疾苦,批判社会黑暗。风格平易朴素,善用白描与对比,继承新乐府“为时为事而作”的精神,是唐诗现实传统的最后延续。","max":3,"id":"唐诗宋词-11-term-24"},{"n":25,"type":"term","prompt":"晚唐诗坛余晖","options":[],"key":"","answer":"“晚唐诗坛余晖”指文宗大和元年至唐末的诗坛状况,是唐诗发展的最后阶段。杜牧七绝清丽俊逸、李商隐含蓄深婉、温庭筠典丽精工,唐末诗人则以现实诗反映社会危机。整体境界狭窄而构思尖新,为唐诗收尾并开宋诗门径,故喻为“余晖”。","max":3,"id":"唐诗宋词-11-term-25"},{"n":26,"type":"short","prompt":"简要概括杜牧《江南春》的诗作特色。","options":[],"key":"","answer":"杜牧《江南春》的诗作特色有三:一是概括力强,以“千里莺啼绿映红”突破空间局限,浓缩江南春日典型景物,画面鲜明壮阔;二是情景交融,将烟雨春景与六朝兴亡之感结合,含蓄蕴藉;三是风格清丽俊逸,语言浅近而意蕴深远,既保持盛唐七绝的兴会,又融入晚唐的历史沉思。","max":5,"id":"唐诗宋词-11-short-26"},{"n":27,"type":"short","prompt":"以《贾生》为例,谈谈李商隐七绝咏史诗的构思和取材特点。","options":[],"key":"","answer":"李商隐《贾生》的构思与取材特点有二:一是取材典型,选取汉文帝召见贾谊却“不问苍生问鬼神”的片段,以小见大,凸显统治者求贤的虚伪;二是构思巧妙,先扬后抑,渲染汉文帝求贤的诚恳,结尾以“问”与“不问”的对比突转,揭露其不重民生的本质,讽刺尖锐而含蓄,体现其“旨趣深僻”的风格。","max":5,"id":"唐诗宋词-11-short-27"},{"n":28,"type":"short","prompt":"举例说明李商隐爱情诗的精妙之处。","options":[],"key":"","answer":"李商隐爱情诗的精妙有三:一是善用比兴,以春蚕吐丝、蜡炬成灰喻相思至死不渝,“丝”谐音“思”,双关自然,将抽象情感具象化;二是意境朦胧,仅勾勒场景而不明写爱情细节,借 “心有灵犀一点通”营造朦胧浪漫氛围;三是情感深挚,如《锦瑟》将爱情遗憾与身世感伤融合,引发广泛共鸣。","max":5,"id":"唐诗宋词-11-short-28"},{"n":29,"type":"short","prompt":"以《苏武庙》为例,谈谈温庭筠诗歌的构思特色。","options":[],"key":"","answer":"温庭筠《苏武庙》的构思特色有三:一是视角独特,聚焦苏武归汉后的境遇而非牧羊过程, 以“去时”与“回日”的对比凸显岁月沧桑;二是意境雄浑苍凉,勾勒胡天荒凉与苏武孤独,将人物融入壮阔背景;三是章法灵活,前四句写归汉感慨,后四句抒敬仰,结尾以景结情,暗寓对统治者薄待忠臣的批判,寄意深隐。","max":5,"id":"唐诗宋词-11-short-29"},{"n":30,"type":"essay","prompt":"论述晚唐诗坛杜牧、李商隐、温庭筠及唐末诗人的创作如何体现“余晖”的特点,并分析","options":[],"key":"","answer":"其共同的时代背景影响。 一、体现:(一)杜牧承盛唐兴会而融入反思,以议论入七绝。(二)李商隐以无题诗、咏史诗构建含蓄美学,善用比兴,意境朦胧。(三)温庭筠诗风典丽精工。(四)唐末诗人继承新乐府精神,以浅近语言写民生苦难。 二、时代背景:(一)政治衰败:藩镇割据、宦官专权,诗人转向反思、深隐与写实。 (二)文化转型:重思理与雅俗融合,体现求新。(三)心态转变:理想幻灭,境界狭窄深沉,仅为“余晖”。","max":10,"id":"唐诗宋词-11-essay-30"}],"rawMax":70},{"id":"唐诗宋词-12","title":"章节练习(9章)","questions":[{"n":1,"type":"single","prompt":"下列不属于唐宋词调基本特征的是","options":[{"key":"A","text":"每个词调均有调名,且有令、引、近、慢等体裁分类"},{"key":"B","text":"根据乐曲遍数分片,以双调 (上下阕)为基本形式"},{"key":"C","text":"押韵方式固定,仅允许平声押韵,且不可中途转韵"},{"key":"D","text":"句式长短不齐,用字讲究平仄,部分还注重四声、清浊"}],"key":"C","answer":"押韵方式固定,仅允许平声押韵,且不可中途转韵","max":1,"id":"唐诗宋词-12-single-1"},{"n":2,"type":"single","prompt":"敦煌曲子词的主要作者群体是","options":[{"key":"A","text":"宫廷文人"},{"key":"B","text":"下层民众"},{"key":"C","text":"著名诗人"},{"key":"D","text":"宗教人士"}],"key":"B","answer":"下层民众","max":1,"id":"唐诗宋词-12-single-2"},{"n":3,"type":"single","prompt":"下列属于唐代文人词早期创作者的是","options":[{"key":"A","text":"温庭筠"},{"key":"B","text":"韦应物"},{"key":"C","text":"李煜"},{"key":"D","text":"冯延巳"}],"key":"B","answer":"韦应物","max":1,"id":"唐诗宋词-12-single-3"},{"n":4,"type":"single","prompt":"花间词派的核心特点是","options":[{"key":"A","text":"以边塞题材为主,风格豪放雄浑"},{"key":"B","text":"聚焦女性美貌与离愁别恨,辞藻华丽"},{"key":"C","text":"以山水田园为主题,语言清新自然"},{"key":"D","text":"多抒发家国之思,情感沉痛悲切"}],"key":"B","answer":"聚焦女性美貌与离愁别恨,辞藻华丽","max":1,"id":"唐诗宋词-12-single-4"},{"n":5,"type":"single","prompt":"白居易《长相思》中“汴水流,泗水流,流到瓜洲古渡头”的抒情特点是","options":[{"key":"A","text":"直抒胸臆,情感强烈"},{"key":"B","text":"借景抒情,以水流喻情思"},{"key":"C","text":"托物言志,借流水表志向"},{"key":"D","text":"用典抒情,暗引历史典故"}],"key":"B","answer":"借景抒情,以水流喻情思","max":1,"id":"唐诗宋词-12-single-5"},{"n":6,"type":"single","prompt":"下列作品属于敦煌曲子词的是","options":[{"key":"A","text":"温庭筠《菩萨蛮》"},{"key":"B","text":"韦庄《女冠子》"},{"key":"C","text":"《浣溪沙·五里竿头风欲平》"},{"key":"D","text":"李煜《虞美人》"}],"key":"C","answer":"《浣溪沙·五里竿头风欲平》","max":1,"id":"唐诗宋词-12-single-6"},{"n":7,"type":"single","prompt":"唐代文人词与敦煌曲子词的主要区别在于","options":[{"key":"A","text":"是否合乐可唱"},{"key":"B","text":"是否讲究平仄声律"},{"key":"C","text":"作者身份与语言风格"},{"key":"D","text":"是否分阕分片"}],"key":"C","answer":"作者身份与语言风格","max":1,"id":"唐诗宋词-12-single-7"},{"n":8,"type":"single","prompt":"花间集收录的词人主要来自","options":[{"key":"A","text":"西蜀"},{"key":"B","text":"南唐"},{"key":"C","text":"江南"},{"key":"D","text":"中原"}],"key":"A","answer":"西蜀","max":1,"id":"唐诗宋词-12-single-8"},{"n":9,"type":"single","prompt":"李煜前期词的主要内容是","options":[{"key":"A","text":"亡国之痛与故国之思"},{"key":"B","text":"宫廷生活与男女情爱"},{"key":"C","text":"民间疾苦与社会批判"},{"key":"D","text":"山水田园与隐逸情怀"}],"key":"B","answer":"宫廷生活与男女情爱","max":1,"id":"唐诗宋词-12-single-9"},{"n":10,"type":"single","prompt":"下列关于“词牌”的说法正确的是","options":[{"key":"A","text":"词牌即词的题目,与内容直接相关"},{"key":"B","text":"同一词牌仅有一种固定句式与押韵方式"},{"key":"C","text":"词牌是曲调名称,决定词的体裁、分片与声律"},{"key":"D","text":"词牌起源于宋代,唐代尚无明确词牌"}],"key":"C","answer":"词牌是曲调名称,决定词的体裁、分片与声律","max":1,"id":"唐诗宋词-12-single-10"},{"n":11,"type":"single","prompt":"敦煌曲子词的艺术特点是","options":[{"key":"A","text":"辞藻华丽,多用典故"},{"key":"B","text":"结构严谨,章法缜密"},{"key":"C","text":"清新质朴,生活气息浓厚"},{"key":"D","text":"风格豪放,气势雄浑"}],"key":"C","answer":"清新质朴,生活气息浓厚","max":1,"id":"唐诗宋词-12-single-11"},{"n":12,"type":"single","prompt":"韦庄词与温庭筠词的主要区别在于","options":[{"key":"A","text":"韦词语言通俗自然,温词辞藻华丽含蓄"},{"key":"B","text":"韦词多写边塞,温词多写宫廷"},{"key":"C","text":"韦词讲究声律,温词不重音律"},{"key":"D","text":"韦词为长调,温词为小令"}],"key":"A","answer":"韦词语言通俗自然,温词辞藻华丽含蓄","max":1,"id":"唐诗宋词-12-single-12"},{"n":13,"type":"single","prompt":"南唐词与西蜀词的核心差异在于","options":[{"key":"A","text":"南唐词多为小令,西蜀词多为长调"},{"key":"B","text":"南唐词人文修养高,多士大夫情怀,西蜀词多为清客所作"},{"key":"C","text":"南唐词仅写爱情,西蜀词兼写社会现实"},{"key":"D","text":"南唐词不协音律,西蜀词严守声律"}],"key":"B","answer":"南唐词人文修养高,多士大夫情怀,西蜀词多为清客所作","max":1,"id":"唐诗宋词-12-single-13"},{"n":14,"type":"single","prompt":"下列属于李煜后期词代表作的是","options":[{"key":"A","text":"《长相思·汴水流》"},{"key":"B","text":"《虞美人·春花秋月何时了》"},{"key":"C","text":"《浣溪沙·红日已高三丈透》"},{"key":"D","text":"《玉楼春·晚妆初了明肌雪》"}],"key":"B","answer":"《虞美人·春花秋月何时了》","max":1,"id":"唐诗宋词-12-single-14"},{"n":15,"type":"single","prompt":"唐代文人词初步成熟的标志是","options":[{"key":"A","text":"能够根据曲谱节拍填词"},{"key":"B","text":"仅创作齐言句式的歌词"},{"key":"C","text":"完全脱离乐曲,成为独立文体"},{"key":"D","text":"仅以边塞、山水为题材"}],"key":"A","answer":"能够根据曲谱节拍填词","max":1,"id":"唐诗宋词-12-single-15"},{"n":16,"type":"multi","prompt":"下列属于唐宋词调体裁分类的有","options":[{"key":"A","text":"令"},{"key":"B","text":"引"},{"key":"C","text":"近"},{"key":"D","text":"慢"},{"key":"E","text":"赋"}],"key":"ABCD","answer":"令；引；近；慢","max":2,"id":"唐诗宋词-12-multi-16"},{"n":17,"type":"multi","prompt":"敦煌曲子词的题材特点有","options":[{"key":"A","text":"反映民间疾苦,如徭役征戍之苦"},{"key":"B","text":"描写爱情生活,含民间情歌本色"},{"key":"C","text":"涉及边塞生活,抒发思乡之情"},{"key":"D","text":"记录宗教活动,宣传佛教教义"},{"key":"E","text":"展现贵族生活,描写奢华场景"}],"key":"ABCD","answer":"反映民间疾苦,如徭役征戍之苦；描写爱情生活,含民间情歌本色；涉及边塞生活,抒发思乡之情；记录宗教活动,宣传佛教教义","max":2,"id":"唐诗宋词-12-multi-17"},{"n":18,"type":"multi","prompt":"花间词派的艺术特色包括","options":[{"key":"A","text":"辞藻华丽,注重描写女性服饰与容貌"},{"key":"B","text":"善用比兴,意境含蓄委婉"},{"key":"C","text":"多采用乐府旧题,保留民歌风味"},{"key":"D","text":"情感细腻,聚焦离愁别恨"},{"key":"E","text":"风格豪放,多写边塞征战"}],"key":"ABD","answer":"辞藻华丽,注重描写女性服饰与容貌；善用比兴,意境含蓄委婉；情感细腻,聚焦离愁别恨","max":2,"id":"唐诗宋词-12-multi-18"},{"n":19,"type":"multi","prompt":"李煜词
