"李白","白居易","元稹","杜甫"],"ans":"D","ana":"“致君尧舜上，再使风俗淳”是杜甫《奉赠韦左丞丈二十二韵》自陈的政治理想。","anaAI":true},{"t":"s","n":29,"stem":"白居易最看重的是自己的","score":1,"opts":["讽喻诗","闲适诗","感伤诗","杂律诗"],"ans":"A","ana":"白居易《与元九书》提出“文章合为时而著，歌诗合为事而作”，尤其看重讽喻诗的现实劝戒作用。","anaAI":true},{"t":"s","n":30,"stem":"元稹“合并融化唐代小说之史才诗笔议论为一体而成”的作品是","score":1,"opts":["《长恨歌传》","《上阳白发人》","《莺莺传》","《连昌宫词》"],"ans":"D","ana":"《连昌宫词》以宫人叙述唐玄宗朝盛衰，融合叙事、诗笔与史论；《莺莺传》虽亦出元稹，却是文言传奇而非此评所指长篇叙事诗。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"以下关于《诗经》的说法，正确的有","score":2,"opts":["共305篇","《小雅》中另有6篇“笙诗”","齐、鲁、韩、毛四家《诗》流传至今","收录西周初年到春秋中叶500多年的诗歌","《诗经》的收集，有“采诗”“献诗”的说法"],"ans":"ABDE","ana":"《诗经》305篇之外，《小雅》另有六篇有目无辞的笙诗，故“另有6篇”也正确；齐、鲁、韩、毛四家中前三家失传、毛诗传世；作品年代及采诗、献诗说亦正确。按选项应为ABDE，附录ADE漏选B。","anaAI":true,"qaNotes":"本地古代文学史笔记明确“305篇之外，《小雅》另有六篇笙诗有目无辞，不计入305篇”；题干措辞“另有”直接支持B。附录排除B是把不计入305篇误当不存在。已据完整题干、选项与本地笔记将ans更正为ABDE。"},{"t":"m","n":32,"stem":"以下不是建安文学代表作家的有","score":2,"opts":["蔡邕","曹操","刘桢","蔡琰","阮籍"],"ans":"AE","ana":"曹操、刘桢是建安诗坛重要作家；阮籍属正始文学，蔡邕主要活动于建安以前。蔡琰的《悲愤诗》通常列为建安时期代表作品，故D不应因女性身份或晚汉经历被排除。","anaAI":true},{"t":"m","n":33,"stem":"以下属于志人小说的有","score":2,"opts":["《语林》","《郭子》","《西京杂记》","《俗说》","《世说新语》"],"ans":"ABDE","ana":"本地古代文学史教材笔记明确列《语林》《郭子》《俗说》《世说新语》为志人小说，并明确《西京杂记》内容驳杂、归杂史类，故本课程口径排除C，答案ABDE。","anaAI":true,"qaNotes":"已查本地《古代文学史一_00538_60分笔记.md》“志人小说作品辨认”：四部A、B、D、E属志人小说；《西京杂记》教材归杂史类。按本地指定课程笔记口径，ans定为ABDE，不沿用先前对资料分类分歧的泛化疑虑。"},{"t":"m","n":34,"stem":"以下诗作属于白居易的有","score":2,"opts":["《秦中吟》","《新乐府》","《长恨歌》","《琵琶行》","《田家行》"],"ans":"ABCD","ana":"《秦中吟》《新乐府》是白居易讽喻诗组，《长恨歌》《琵琶行》也是其长篇叙事诗；《田家行》作者王建。","anaAI":true},{"t":"m","n":35,"stem":"杜牧咏史诗的特点有","score":2,"opts":["不关心政治","立意高绝","议论不落窠臼","反映了寒士的不平之鸣","即景抒情中注入了深沉的历史感慨"],"ans":"BCE","ana":"杜牧咏史诗常从既定结论外翻出新意，在《赤壁》《泊秦淮》等景物中寄寓历史政治感慨；关心时局，所以A不对；寒士不遇不是此类咏史诗的核心特色，D不取。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《诗经》“六义”","score":3,"ans":"风、雅、颂、赋、比、兴。前三者是《诗经》诗篇按音乐与用途区分的类别：风为地方土乐，雅为朝廷正乐，颂为宗庙祭祀乐歌；赋、比、兴为铺陈直叙、譬喻比拟、先言他物起兴的表现方式。","ana":"“六义”见传统《诗》学概括，须分清风雅颂的体类和赋比兴的表现法；兴往往由眼前他物引出所咏，如《关雎》由雎鸠起兴，不应把“六义”全写成六种诗歌题材。","anaAI":true},{"t":"term","n":37,"stem":"《吴越春秋》","score":3,"ans":"东汉赵晔撰《吴越春秋》，以吴越争霸及相关史事为主线，采入神话传说与民间故事；叙事连贯，人物描写带小说化色彩。","ana":"《吴越春秋》不同于按国记录言论的《国语》：赵晔按吴越兴亡串联史事，吸纳越王勾践、伍子胥等人物故事；历史叙述与传说结合，具有小说化倾向，但仍属历史散文。","anaAI":true},{"t":"term","n":38,"stem":"南朝乐府民歌","score":3,"ans":"南朝乐府民歌主要产生于长江中下游，以《乐府诗集·清商曲辞》中的吴歌、西曲为主体；多写男女恋情，篇幅短小、言语清丽婉转，善用双关谐音；《西洲曲》为长篇代表。","ana":"《西洲曲》体现南朝民歌的婉转相思与连环意象；南朝吴歌、西曲和北朝《木兰诗》风格、地域不可混称。题中的“以《清商曲辞》为主”是传世辑录位置，非说民歌皆由宫廷创作。","anaAI":true},{"t":"term","n":39,"stem":"“诗鬼”","score":3,"ans":"“诗鬼”是李贺的别称。其诗常以神仙鬼魅、死亡和瑰异景物入诗，想象诡谲、色彩浓烈，语言雕琢奇峭，如《李凭箜篌引》《梦天》；并非全部作品都写鬼。","ana":"李贺被称“诗鬼”，在于其诗常把幽冷意象与奇幻想象并置，像《李凭箜篌引》的音乐想象、《梦天》的太空视角；称号概括诗风，不是以鬼怪数量定义其全部诗歌。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"short","n":40,"stem":"简述我国神话的类别。","score":5,"ans":"可从题材分为：①创世神话，如盘古开天、女娲造人；②自然神话，解释或挑战自然，如夸父逐日、精卫填海；③英雄神话，写造福人类的文化英雄，如后羿射日、大禹治水；④战争或社会神话，如黄帝与蚩尤之战。分类可交叉，例如女娲补天既有自然灾变又含英雄救难，不宜机械限定。","ana":"类别并无唯一排他的分法：盘古开天地关乎起源，夸父追日关乎人和自然，后羿除害、大禹治水关乎英雄救世，黄帝与蚩尤则关乎部族战争；女娲补天亦可被归作英雄神话，宜说明分类角度。","anaAI":true},{"t":"short","n":41,"stem":"简述《楚辞》的渊源。","score":5,"ans":"《楚辞》由楚地文化孕育：楚国民歌、巫祝祭歌与音乐舞蹈提供句式、声调及“兮”的运用；《诗经》的比兴传统经香草美人等意象拓展；楚地神话、民俗与历史传说提供奇幻素材；楚地方言、地域风物赋予鲜明地方色彩。屈原在这些基础上创造成熟的新诗体，不能将《楚辞》仅视为巫歌汇编。","ana":"《楚辞》同时承继《诗经》的比兴并吸收楚地巫风、方言、歌舞与神话。屈原《九歌》与祭神歌舞关系密切，《离骚》把香草美人发展为连贯象征体系；渊源与屈原创新须分别交代。","anaAI":true},{"t":"short","n":42,"stem":"简述左思《咏史诗》的内容与艺术特色。","score":5,"ans":"左思《咏史》八首借古人古事抒写自身怀抱，揭露门阀制度造成的寒士不遇，亦有建功立业的志向；如“郁郁涧底松，离离山上苗”以地势反衬出身决定仕途。艺术上咏史与咏怀相融，借古讽今，比兴鲜明，笔力刚健、辞气慷慨，钟嵘以“左思风力”称其特色。","ana":"“郁郁涧底松，离离山上苗”以松苗与地势暗写“世胄蹑高位，英俊沉下僚”；《咏史》并非纯客观史事复述，而把社会批判、个人理想与雄健风骨熔为一体。","anaAI":true},{"t":"short","n":43,"stem":"为什么说唐传奇标志着小说的成熟?","score":5,"ans":"唐传奇标志文言小说逐渐成熟：作者从六朝志怪的搜录传闻发展为有意经营虚构；情节因果较完整，有波折和伏笔；人物通过言行、冲突显示个性，如《李娃传》《霍小玉传》；叙事、诗歌、议论相结合，语言凝练有文采；爱情、侠义、历史及奇异等题材广阔。成熟是相对先前小说形态而言，并非此后再无发展。","ana":"与六朝志怪偏重记录奇闻相比，唐传奇《李娃传》以郑生遭际组织曲折情节，《霍小玉传》塑造相爱、负心和悲剧冲突；人物、结构、语言及有意识虚构共同构成成熟标志。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"essay","n":44,"stem":"论述《史记》刻画人物的经典手法。","score":14,"ans":"《史记》写人物不只平铺生平：①选取决定性事件与尖锐冲突，如《项羽本纪》巨鹿之战、鸿门宴与垓下之围，呈现勇武、刚愎和末路悲情；②通过人物的个性化言语、动作与场面细节塑造性格，如项羽“彼可取而代也”、刘邦“大丈夫当如此也”的对照；③正面描写与旁人反应、人物间对比互相映照；④互见法将同一人物材料分置相关本纪列传，合读见其复杂面貌；⑤叙事中寓褒贬，亦常借“太史公曰”点明判断。应结合具体篇章，不把附录“心理描写”泛泛列为每篇都有的固定模式。","ana":"“互见法”可将人物的不同侧面分散写于相关传记，并非重复抄写；《项羽本纪》中巨鹿、鸿门与垓下三场面连贯展示人物命运，作者以具体事件和言行使历史判断可感。附录只列名目，作答宜每项配史传例证。","anaAI":true},{"t":"essay","n":45,"stem":"论述李白诗歌的艺术成就。","score":14,"ans":"李白诗歌以强烈主体抒情和瑰丽想象著称：《将进酒》以黄河奔流放大生命感喟，《蜀道难》用神话、夸张与跳跃的空间写蜀道险绝。意象既有大鹏、黄河、瀑布的雄奇壮阔，也有月色、清溪的清丽明朗；诗人善以比喻、夸张、神仙典故突破现实尺度。语言清新明快、率真自然，乐府与七言歌行尤其擅长长短句交错、节奏变化，绝句亦能以简净语写开阔意境，如《早发白帝城》。诗中理想与失意交织，不宜仅以“浪漫”二字概括；题材广及山水、游仙、饮酒、送别等。","ana":"分析李白不应将“题材丰富”“影响深远”直接充作艺术手法。举《蜀道难》说明句法变换、夸张与想象，举《将进酒》说明主观情感的起伏，举《望庐山瀑布》或《早发白帝城》说明明快语言与壮丽、清丽意象并存。","anaAI":true}]}],"code":"00538","qaNotes":["原卷45题、100分；题干与选项逐一据原卷而非附录转录，附录35道选择题、10道主观题均逐题对齐。附录答案为非官方资料；所有解析均经改写/补充，anaAI=true，不表示官方解释。","第31题附录给ADE，漏选B。原卷B明确说《小雅》中“另有6篇笙诗”，与通行《诗经》305篇有辞、另六篇有目无辞的知识一致；附录解析自己也承认六篇确在《小雅》却以“不算入305篇”否定B，混淆“另有”和“计入”。建议ABDE，暂标待人工复核附录错键。","第33题附录给ABDE，并径称《西京杂记》属杂史类；但《西京杂记》记人物轶事兼杂录异闻，志人小说/笔记分类在资料中存在口径差异。候选ABDE或ABCDE；该题ans置为[答案待核…]，不宜自动评分，须对照指定教材分类。","第32题附录AE，蔡琰《悲愤诗》一般列建安时期作家作品，暂从AE；若指定教材将蔡琰另列，需复核。第40题附录将“女娲补天”仅列自然类，实际也可按英雄救难归类；主观参考答案改为非排他表述。第44题附录泛列心理描写而缺例证，已改用典型事件、个性语言、互见和对比举例。","本地跨卷复核：gws-2504第4题“儒墨显学”与本卷6题同题不同字母；gws-2504第11题《论贵粟疏》与本卷11题同题不同字母；gws-2210第1题的305篇另六笙诗支持本卷31题B；gws-2504与gws-2304第36题《天问》支持本卷9题；gws-2404第43题唐传奇和gws-2210第39题对应本卷43题；gws-2310第35题与gws-2210第45题李白艺术对应本卷45题。计2道同题干选项重排直接核对，另5个题号/主题共7题有局部或内容佐证；其余题由作品、作者和文史知识逐项核，不能以旧卷字母代替内容。","指定题31、33已按本地《古代文学史一_00538_60分笔记.md》核定：31=ABDE（六篇笙诗有目无辞但“另有”成立）；33=ABDE（本课程笔记明确《西京杂记》归杂史类）。二题均有完整题干、选项和本地教材直接支持；未改其它题。"]},{"paper":"marx-2104","subject":"marx","session":"2104","label":"2021年4月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。","items":[{"n":1,"t":"s","score":2,"stem":"马克思主义是指（ ）。","opts":["仅指马克思的理论","仅指马克思和恩格斯的理论","包括所有称为“马克思主义”的理论","包括马克思和恩格斯及其后继者的理论"],"ans":"D","ana":"马克思丰义是由马克思、思格斯创立前，为他们前后维者所发展们，以反对资本主 义、建设补会主义和共产主义为目标的科学前理论体系，或者简要地说，它是关下尢产阶级 和人类解放前科学。"},{"n":2,"t":"s","score":2,"stem":"马克思主义的革命性表现在（ ）。","opts":["崇高的社会理想和坚实的实践基础","彻底的批判主义和鲜明的政治立场","丰富的理论来源和科学的理论内涵","完备的理论体系和严密的逻辑结构"],"ans":"B","ana":"马克思主义们革命性，表现为它前彻底们批州精神和鲜明们政治立场。"},{"n":3,"t":"s","score":2,"stem":"承认世界具有统一性的理论是（ ）。","opts":["唯物论","辩证法","一元论","可知论"],"ans":"C","ana":"承认世界前统-惟，认为世界上前万事万物有•个共同前本质或木原，这种哲学就"},{"n":4,"t":"s","score":2,"stem":"光阴好比河中水，只能流去不流回，反映的时间具有（ ）。","opts":["客观性","一维性","有限性","永恒性"],"ans":"B","ana":"时间前特点是-维性，即时间总是朝着•个方向问前发展。既不是循环，更不是倒 退，也就是具们不可逆性。人们通常说前“光阴好比河中水，只能流去不能同”“尖浴黄金 有分量，错过光阴无处”“寻盛年不承来，一目难再晨”等谚语鄙说门是时间前一维性特点。"},{"n":5,"t":"s","score":2,"stem":"分析矛盾的特殊性是指（ ）。","opts":["坚持“两点论”","坚持理论联系实际","坚持“重点论”","坚持具体问题具体分析"],"ans":"D","ana":"分析矛盾钓特殊性就是坚持具体问题具体分析。一方面，分析矛盾角特殊性是正确 认识事物钓基础。另一方面，分析矛盾钓特殊性是正俑解决不盾前关键。"},{"n":6,"t":"s","score":2,"stem":"假象同真象一样是客观存在的，是（ ）。","opts":["唯物论","辩证法","折衷主义","诡辩论"],"ans":"A","ana":"石些现象本质是一致们，叫做真象：有些现象号本质似乎不一致，叫做假象。假 象、真象都是客观存在们，这是唯物论前观点。 參见教材"},{"n":7,"t":"s","score":2,"stem":"对一个具体事物展开认识的完整过程是（ ）。","opts":["感性认识—理性认识—实践","实践—理性认识—感性认识","感性认识—实践—理性认识","实践—感性认识—理性认识"],"ans":"A","ana":"认识在实战中产生，最示感性认识，然后上升为理性认识，再由理性认识回到实践， 这是一个由实践到认识、再由认识到实践们完整的认识过程。"},{"n":8,"t":"s","score":2,"stem":"在真理观上坚持辩证法，就必须承认（ ）。","opts":["真理是主体对客体的正确认识","真理既是绝对的又是相对的","真理的检验标准只能是实践","真理既是完整的又是具体的"],"ans":"B","ana":"真理是客观，又是绝对前和相对前。承认真理客观怍，这是在真理问题上坚持 了唯物论：永认真理既是绝对的又是和对们，这是在真理问题上坚持了辩证法。任何真理鄙 是客观悱、绝对性和相对性前统 ‘，这就是真理观上唯物论与辩证法前统‘。"},{"n":9,"t":"s","score":2,"stem":"检验认识具有真理性，就是检验（ ）。","opts":["与领袖理论相符合","与书本知识相符合","与客观实际相符合","与逻辑规则相符合"],"ans":"C","ana":"检验真理的标准只能是实践，实践是·种感性前物质活动，实践的主体、各体、于 段、结果都是客观实在，都不以人前主观意志为转移。把实践作为檢验认识是否真理的标准， 是真理们客观性们必然要求。"},{"n":10,"t":"s","score":2,"stem":"社会存在是指（ ）。","opts":["生产力各个要素的总和","生产力与生产关系的总和","生产关系各个方面的总和","社会物质生活的总和"],"ans":"D","ana":"社公存在是指社会物质生活条件前总和，包括地理环境、人口因素和物质生活资料"},{"n":11,"t":"s","score":2,"stem":"生产关系的范畴反映的是人与人之间的（ ）。","opts":["政治关系","经济关系","交往关系","协作关系"],"ans":"B","ana":"生产关系是指人们在物质生产过程中结成的经济关系。"},{"n":12,"t":"s","score":2,"stem":"经济基础决定上层建筑是指（ ）。","opts":["任何社会的上层建筑都根源于它的经济基础","任何社会的上层建筑都产生于它的经济基础之后","上层建筑的任何部分的变化都与它的经济基础的变化同步","上层建筑的任何部分的变化都与它的经济基础直接相关"],"ans":"A","ana":"经济基础是上层建筑门物质根源，上层建筑是适应经济基础钓需要产生前。"},{"n":13,"t":"s","score":2,"stem":"人的本质是一切社会关系的总和，这句话是在强调（ ）。","opts":["人与人的区别","人与动物的区别","一切人共有的本质","人的肉体存在及其特性"],"ans":"A","ana":"马克思在《关下费尔巴哈提纲》中说：“人前本质不是单个人所固有前抽象物， 在其现实性上，它是一切社会关系钓总和。”“人前本顾是一切社会关系前总和”这一对人 前本质前界定，讲的不是人与动物前区别，而是人与人之间前这别，既包括不同时代前人之 间前区别，又包含同-时代处于不同社会地位的人之间前区别。所以它讲的不是 切人所有 的共同本质，而是不同们人所具有前不同前本质，即人韵具体本质。"},{"n":14,"t":"s","score":2,"stem":"单位商品的价值量与生产该商品的劳动率的关系是（ ）。","opts":["成正比","成反比","同比例变化","没有关系"],"ans":"B","ana":"商品价值与劳动生产率成反比。"},{"n":15,"t":"s","score":2,"stem":"劳动力成为商品的基本条件是（ ）。","opts":["劳动者丧失一切生活资料和生产资料","劳动者拥有人身自由且丧失一切生活资料和生产资料","劳动者拥有人身自由且丧失一切生活资料","劳动者有人身自由且丧失一切生产资料"],"ans":"B","ana":"劳动力成为商品必须县备两个基本条件。意识劳动者有人身白由，劳动者必须有权 支配自己前劳动力，才可能把它作为商品出卖，二是劳动者丧失了一切生产资料和生活资料， 除了自己前劳动力以外-无所有，必须靠出卖劳动力为生。"},{"n":16,"t":"s","score":2,"stem":"下列选项中不属于资本积累后果的是（ ）。","opts":["工作日的延长","相对过剩人口的形成","资本有机构成提高","贫富两极化扩大"],"ans":"A","ana":"资本积累前后果主要有三个：一是资本有机构成们提高，二是相对过剩人口即尖业 人口前形成，三是严重前贫言两极分化。"},{"n":17,"t":"s","score":2,"stem":"资本主义政治制度的核心是（ ）。","opts":["国家制度","政党制度","民主制度","选举制度"],"ans":"A","ana":"资本主义政治制度就是资产阶级为实现其阶级专政而采取前统治方式和方法及各种 相关制度前总和。它主要包括资本主义前国家制度、政党制度、选举制度、三杈分立制度、 民主制度等。其中国家制度是资本主义政治制度前核心。"},{"n":18,"t":"s","score":2,"stem":"各主要资本主义国家在进入国家垄断资本主义阶段之前所处的阶段是（ ）。","opts":["自由竞争","私人垄断","垄断竞争","寡头垄断"],"ans":"B","ana":"一白多年来，垄脚资本主义在丰要资本主义国家有很火发展，特别是第二次世界 大战以后，垄断资本丰义又有了一些新的发展变化。这以前们垄断丰要是私人垄断，或称一 般华断，第二次世界大战后出现了国家华断资本主义，国家或者说政权的力量H益深人地介 人到社会经济生活的各个领域，国家垄断取代私人垄断成为西方发达国家当代资本主义发展 雨新形式、新特征。"},{"n":19,"t":"s","score":2,"stem":"当发生金融危机时，资本主义国家为某些私人企业注入一部分资金，这是（ ）。","opts":["资本主义国家建立国有经济和国有企业的一种方式","资本主义国家为管理国民经济计划的一种方式","国家和私人企业的外部结合","国家与私人企业的内部结合"],"ans":"D","ana":"国家和私人资本在企业内部结合，也即资本主义国家中的国有资本与私人资本结 合在一个企业中经济形式。这种结合，既可以是国家和私人资不共同投资于一个新企业， 也可以是国家通过出售一部分国有企业的股份，从而形成国家和私人资本共有的企业，也可 以通过国家收购一部分原私有企业的股份而形成国家与私人资本相结合们企业。"},{"n":20,"t":"s","score":2,"stem":"当代国际垄断组织最主要的形式是（ ）。","opts":["国际卡特尔、辛迪加和托拉斯","国际辛迪加、托拉斯和跨国公司","国际托拉斯和国家垄断资本主义的国际垄断同盟","跨国公司和国家垄断资本主义的国际垄断同盟"],"ans":"D","ana":"当代国际垄断组织形式则以跨国公司和国家垄断资本主义国际垄断同盟为主。"},{"n":21,"t":"s","score":2,"stem":"为全社会占有生产资料和共同组织社会化大生产准备了最充分的物质条件和经济条件的是（ ）。","opts":["自由竞争资本主义的产生和发展","国家垄断资本主义的产生和发展","国家经济的产生和发展","世界市场的产生和发展"],"ans":"B","ana":"国家垄断资本主义产生和发展，为全社会占有生产资料和共同组织社会化生产准 备了最充分物质条件和经济条件。"},{"n":22,"t":"s","score":2,"stem":"《乌托邦》为早期空想社会主义的著作，其作者为（ ）。","opts":["傅立叶","圣西门","康帕内拉","莫尔"],"ans":"D","ana":"早期空想社会丰义前代表作是英国莫尔写们《乌托邦》和意人利人康帕内拉写前《太 阳城》。他们在自己的著作中无情地批判了资本主义前种种军恶，但提出和描绘前理想社会 却充满着空想性质。"},{"n":23,"t":"s","score":2,"stem":"第一个无产阶级政党为（ ）。","opts":["共产主义者同盟","中国共产党","俄国布尔什维克党","德国社会民主工党"],"ans":"A","ana":"1847年年底马克思和恩格斯愛世界上第一个无产阶级政党“共产主义者同盟”哟 委托起草并丁1848年2月发表《共产党宣言》，是社会主义思想史上第一个纲领性文 件，它标志着科学社会上义理论公开面世。"},{"n":24,"t":"s","score":2,"stem":"作为人类社会发展的最高社会形态，共产主义的物质基础是（ ）。","opts":["与繁荣的封建社会相当的社会生产力","远远高于以往一切社会的高度发达的社会生产力","与资本主义国家相当的社会生产力","建立在信息化、智能化基础上的社会生产力"],"ans":"B","ana":"共产主义社会是人类社会发展们最高社会形态，它的物质基础，是远远高于以往一 切社会的高度发达社会生产力。"},{"n":25,"t":"s","score":2,"stem":"在社会主义初级阶段，我国的历史使命和共同愿景为（ ）。","opts":["实现国家文明和谐","实现公民自由平等","实现社会公平正义","建立中国特色社会主义"],"ans":"D","ana":"我国当前正处于社会主义初级阶段，建设中国特色社会十义是我雨人民们历火便命 和共阿理想。"}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"n":26,"t":"w","score":6,"stem":"学习运用马克思主义的正确观点是不把它当做教条而是当做行动指南，简述理由。","opts":[],"ans":"（1）马克思主义不是教条，它并不提供对一切问题的现成答案。那种试图从马克思主义经典著作中寻章摘句、寻找解决现实问题直接答案的做法，不仅达不到目的，而且是十分有害的。（2）把马克思主义作为行动的指南，就必须从客观存在的实际出发，而不能从马克思主义的一般原理出发。只有把马克思主义的一般原理与本国的具体实际相结合，才能真正发挥马克思主义的指导作用。","ana":"马克思主义不是现成答案库，而是分析现实的立场、观点和方法；得分要点是从实际出发，把基本原理同具体国情、实践结合。","anaAI":true},{"n":27,"t":"w","score":6,"stem":"辩证唯物主义反映论与旧唯物主义反映论对于认识本质的回答有什么不同？","opts":[],"ans":"（1）旧唯物论的机械的反映论认为认识主体是单纯的有生命的存在物；辩证唯物论的能动的反映论则是结合主体的社会性、实践性和能动性考察主客体之间的关系。（2）旧唯物论的机械的反映论对待客体是消极的认识；辩证唯物论的能动的反映论认为认识是反映与创造的统一。","ana":"旧唯物主义把认识看成消极映照，辩证唯物主义则强调认识主体的社会性、实践性和能动性；关键比较是“机械反映”与“反映和创造相统一”。","anaAI":true},{"n":28,"t":"w","score":6,"stem":"简述剩余价值生产的基本方法。","opts":[],"ans":"剩余价值的生产方法包括绝对剩余价值生产和相对剩余价值生产。（1）在必要劳动时间不变的条件下，通过延长工作日长度而生产出绝对剩余价值。（2）在工作日长度不变的条件下，通过缩短必要劳动时间而相应延长剩余劳动时间而生产出相对剩余价值。","ana":"区分标准是工作日和必要劳动时间如何变化：延长工作日产生绝对剩余价值，提高社会劳动生产率、压缩必要劳动时间产生相对剩余价值。","anaAI":true},{"n":29,"t":"w","score":6,"stem":"国家垄断资本主义的资本输出对输出国的作用。","opts":[],"ans":"（1）为过剩资本找到了出路，并由此获得大量来自海外的高额利润和利息。（2）资本输出是输出国控制输入国的重要手段。（3）资本输出是输出国扩大商品出口的重要手段。（4）资本输出使金融资本的银行网遍布全世界，从而强化了金融资本在世界经济、政治舞台上的统治地位。","ana":"资本输出把国内过剩资本转为海外收益，也扩展控制、商品出口及金融网络；作答应把利润收益与资本扩张影响分开说明。","anaAI":true},{"n":30,"t":"w","score":6,"stem":"为什么说无产阶级革命是最广泛、最彻底、最深刻的革命？","opts":[],"ans":"（1）无产阶级革命是彻底消灭一切私有制、代之以生产资料公有制的革命。（2）无产阶级革命是要彻底消灭一切阶级剥削和阶级统治的革命。（3）无产阶级革命是为绝大多数人谋利益的运动。无产阶级只有解放全人类才能解放自己，它的阶级利益同广大劳动者的利益是根本一致的。（4）无产阶级革命是不断前进的历史过程。无产阶级必须永葆革命性和先进性，直至实现共产主义。","ana":"其彻底性在于变革私有制和阶级统治，广泛性在于代表广大劳动者利益，历史性则体现为通向共产主义的持续进程。","anaAI":true}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。","items":[{"n":31,"t":"w","score":10,"stem":"试述尊重客观规律与发挥主观能动性的辩证统一原理及其现实意义。","opts":[],"ans":"（1）尊重客观规律是正确发挥主观能动性的前提。只有正确认识了客观规律，并按规律办事，才能正确发挥人的主观能动性，有效地改造世界。无视或违背规律，盲目蛮干，必然受到规律的惩罚。（2）认识和利用客观规律又必须充分发挥人的主观能动性。只有充分发挥人的主观能动性，反复实践，深入研究，才能揭示隐藏在事物内部的规律，才能顺利实现理论对实践的指导。（3）在改革开放和现代化建设中，既要充分发挥人民群众的积极性和创造性，又要踏踏实实地按客观规律办事；既要实事求是，从实际出发，又要解放思想，开拓创新。","ana":"原理强调规律是主观能动性的前提，认识规律、按规律办事又需要实践和能动探索；现实应用须同时写出实事求是与开拓创新。","anaAI":true},{"n":32,"t":"w","score":10,"stem":"试述两大社会基本矛盾之间的关系以及两大社会基本矛盾关系在社会发展中的作用。","opts":[],"ans":"（1）生产力决定生产关系，生产关系作为社会的经济基础又决定社会的上层建筑，所以生产力与生产关系之间的矛盾起着主导作用。（2）生产关系对生产力有反作用，上层建筑对经济基础有反作用，经济基础又是联系上层建筑和生产力的中间环节，所以生产力和生产关系之间的矛盾解决，又有赖于经济基础和上层建筑之间的矛盾的解决。（3）社会的基本矛盾是社会发展的基本动力，制约和决定着其他各种社会矛盾，决定着整个社会的面貌，决定着社会发展的必然阶段和客观趋势，决定着社会形态由低级到高级的演进。","ana":"生产力—生产关系矛盾居主导，经济基础—上层建筑矛盾通过反作用影响其解决；二者共同构成社会发展的根本动力。","anaAI":true},{"n":33,"t":"w","score":10,"stem":"试述货币的起源、本质及职能。","opts":[],"ans":"（1）货币的产生和起源是商品交换长期发展的产物，并不是聪明人的发明，也不是人们协商的结果。通过货币产生的过程可以看出，货币的本质是固定充当一般等价物的商品，它体现着商品经济条件下商品生产者之间的社会经济关系。（2）货币的本质是通过它的职能得到体现的，货币的职能是指货币在社会经济生活中的作用。在发达的商品经济中，货币有价值尺度、流通手段、贮藏手段、支付手段、世界货币五种职能，其中价值尺度和流通手段是货币最基本的职能。（3）货币的价值尺度职能是指货币是衡量和计算一切商品价值量大小的社会尺度。货币的流通手段职能是指货币起着商品交换媒介的作用。货币的贮藏手段职能是指货币退出流通领域，作为社会财富的一般代表而被保存起来。货币的支付手段职能是指在商品赊购赊销过程中，当到期偿还货款时货币所执行的还款职能，以及用于清偿债务，支付税赋、租金、工资等所执行的职能。货币的世界货币职能，是指货币超出一国的范围，在世界市场上发挥一般等价物的作用。","ana":"应从商品交换发展说明货币的历史起源，以固定充当一般等价物把握本质，再区分五种职能并指出价值尺度、流通手段是基本职能。","anaAI":true}]}],"qaNotes":[]},{"paper":"marx-2110","subject":"marx","session":"2110","label":"2021年10月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义产生于19世纪（）。","score":2,"ans":"A","opts":["40年代","50年代","60年代","70年代"],"ana":"马克思主义产生于19世纪40年代。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了客观条件；工人阶级作为一支独立的政治力量登上历史舞台，进行反对资本主义制度和资产阶级统治的斗争，为马克思主义的产生准备了阶级基础。"},{"t":"s","n":2,"stem":"下列各项集中表现马克思主义的革命性的是（）。","score":2,"ans":"D","opts":["科学的理论内涵","完备的理论体系","严密的逻辑结构","彻底的批判精神"],"ana":"马克思主义的根本理论特征：（1）科学性：①马克思主义的科学性，首先在于它不带任何偏见；②还在于它的深刻性，任何领域都不浅尝辄止；③深刻揭示客观规律，经受了实践的检验，并且在实践中不断发展。（2）革命性：①马克思主义的革命性，集中表现为它的彻底的批判精神；②还表现在它具有鲜明的政治立场，始终代表工人阶级和广大人民群众的利益。（3）以实践为基础：①马克思主义的科学性和革命性都是以实践为基础的；②实践的观点是马克思主义的基本观点，是马克思主义的出发点和归宿。"},{"t":"s","n":3,"stem":"在世界如何存在的问题上，两种根本对立的观点是（）。","score":2,"ans":"B","opts":["唯物与唯心","辩证法和形而上学","一元和二元","可知与不可知"],"ana":"在世界如何存在的问题上，两种根本对立的观点是辩证法和形而上学。在世界本原是否具有统一性问题上，两种根本对立的观点是一元论和二元论。在物质和意识的第一性问题上，两种根本对立的观点是唯物主义和唯心主义。在思维与存在是否具有统一性的问题上，两种根本对立的观点是可知论与不可知论。"},{"t":"s","n":4,"stem":"下列唯物辩证法反映事物根本性质和表面特征关系的是（）。","score":2,"ans":"C","opts":["内容和形式","必然和偶然","本质和现象","可能性与现实性"],"ana":"唯物辩证法的理论体系还包括一系列其他范畴，主要有原因和结果、必然性和偶然性、可能性和现实性、内容和形式、本质和现象等。它们反映了事物联系和发展的基本环节。内容，构成事物一切要素的总和；形式，把内容各要素统一在一起的结构或表现形式。必然性，事物联系和发展过程中确定不移的、不可避免的趋势；偶然性，不确定的趋势。可能性，客观事物和现象的种种联系（已发生）；现实性，包含在现实事物之中的、预示着事物发展前途的趋势（未发生）。本质，事物的根本性质以及组成事物基本要素的内在联系。现象，事物的表面特征以及这些特征的外部联系。"},{"t":"s","n":5,"stem":"社会规律是通过人们的自觉活动实现的，这说明社会规律（）。","score":2,"ans":"B","opts":["不具有客观性","不是盲目自发起作用","不具有普遍性","不是事物发展的必然性"],"ana":"规律：物质运动发展过程中本质的、必然的、稳定的联系，具有客观性和普遍性的特征。分为自然规律和社会规律。自然过程是无意识的、盲目的、不自觉的，自然规律是自发起作用的，不需要人的参与。社会发展是由人的有意识、有目的的实践活动构成，但不能过分夸大社会生活中人的意识的作用。"},{"t":"s","n":6,"stem":"意识对于人的生理活动具有一定的影响作用，这表明（）。","score":2,"ans":"D","opts":["意识是人脑的分泌物","意识对物质具有决定性","意识是客观事物本身","意识对物质具有能动性"],"ana":"意识的能动作用：（1）意识具有主动性和创造性；（2）意识具有目的性和计划性；（3）意识对于人的生理活动有影响作用；（4）意识能通过指导实践改造客观物质世界，这是意识能动性最突出的表现。"},{"t":"s","n":7,"stem":"实践对认识具有决定性作用，下列不属于这一原理的是（）。","score":2,"ans":"D","opts":["实践是认识的来源和目的","认识发展的动力","检验认识真理性的标准","实践是检验认识能动性的标准"],"ana":"实践对认识具有决定作用。表现在：①实践是认识的来源。②实践是认识发展的动力。③实践是检验真理性的唯一标准。④实践是认识的目的。"},{"t":"s","n":8,"stem":"辩证唯物主义反映论区别于机械唯物主义反映论的根本标志在于，是否承认认识的过程是（）。","score":2,"ans":"A","opts":["反映和创造的统一","反映和摹写的统一","探索和创造的统一","探索与发现的统一"],"ana":"（1）唯物论的反映论与唯心论的先验论的对立：①何者为第一性：唯物论的反映论是存在；唯心论的先验论是思维。②认识路线：唯物论的反映论是从物到感觉和思想；唯心论的先验论是从感觉和思想到物。③如何看待实践：唯物论的反映论肯定实践对认识的决定作用；唯心论的先验论不懂得实践对于认识的决定性意义。（2）辩证唯物论的能动的反映论与旧唯物论的机械反映论的对立：①旧唯物论的机械的反映论认为认识主体是单纯的有生命的存在物；辩证唯物论的能动的反映论则是结合主体的社会性、实践性和能动性考察主客体之间的关系。②旧唯物论的机械的反映论对待客体是消极的认识；辩证唯物论的能动的反映论认为认识是反映与创造的统一。"},{"t":"s","n":9,"stem":"理性认识的三种形式是（）。","score":2,"ans":"B","opts":["感觉知觉表象","概念判断推理","联想想象猜测","直觉顿悟灵感"],"ana":"感性认识：是认识的初级阶段，是对事物的片面、现象和外部联系的反映，是具体的，丰富的、生动的，但却是表面的、个别的、不深刻的。包括：感觉、知觉、表象。理性认识：是认识的高级阶段，是对事物全体、本质和内部联系的反映，是抽象的、间接的、深刻的。包括：概念、判断、推理。"},{"t":"s","n":10,"stem":"下列各项正确说明生产力与生产关系的辩证关系的是（）。","score":2,"ans":"A","opts":["生产力的性质决定生产关系的性质","生产关系总是适合生产力发展的要求","生产力随着生产关系变化而变化","生产关系总能推动生产力的发展"],"ana":"生产力和生产关系之间的矛盾：①生产力决定生产关系。生产力决定生产关系的性质，一定的生产力要求一定的生产关系与它相适应，生产力性质不同，建立起来的生产关系也就不同；生产力的发展决定了生产关系的改变。②生产关系反作用于生产力。先进的生产关系促进生产力的发展，落后的生产关系阻碍生产力的发展。③生产力和生产关系之间的矛盾运动。生产力发展到一定程度，原来的生产关系逐渐变得陈旧，与生产力性质和发展要求变得基本不适合，从而阻碍生产力的发展。这时就要求变革旧的生产关系，建立新生产关系。循环往复，提高人类社会。"},{"t":"s","n":11,"stem":"下列各项属于上层建筑的是（）。","score":2,"ans":"C","opts":["生产关系","经济体制","国家政权","自然科学"],"ana":"上层建筑：社会的政治、法律、艺术、道德、宗教、哲学等意识形态以及与这些意识形态相适应的政治法律制度和设施的总和。包括：政治上层建筑（主导地位），亦称实体性上层建筑，指政治法律制度以及军队、警察、法院、监狱、政府机关等设施，以及与之相适应的一套组织；观念上层建筑，又称思想上层建筑，包括政治、法律、艺术、道德、宗教、哲学等各种服务于统治阶级的意识形态。"},{"t":"s","n":12,"stem":"社会形态的发展是一种自然历史过程，这种观点属于（）。","score":2,"ans":"C","opts":["机械决定论","历史宿命论","历史唯物论","历史唯心论"],"ana":"社会形态的发展是一种自然历史过程，这种观点属于历史唯物主义的观点。马克思在《资本论》第1卷第一版序言中说：“我的观点是：社会经济形态的发展是一种自然历史过程”。意思是说，人类社会的发展或者说社会形态的演变也像自然界一样，是客观的、物质的、辩证的过程，具有不依人的意志为转移的客观规律性。同时又应看到，人类的活动是有意识、有目的的。正是人类有意识、有目的的实践活动，构成了人类社会的历史，形成了人类社会历史的发展规律。"},{"t":"s","n":13,"stem":"正确认识和评价杰出人物的历史作用，一要坚持历史主义的原则，二要坚持（）。","score":2,"ans":"A","opts":["阶级分析","实证分析","矛盾分析","规范分析"],"ana":"杰出历史人物的作用如何评价：①杰出人物是一定历史条件下的产物，要正确认识杰出人物的历史作用，必须深入了解它们所处的历史条件，坚持历史主义原则。任何一个杰出人物的出现，都是时代的需要。②在阶级社会里的杰出人物，总是一定阶级的代表，因此，要正确认识杰出人物的历史作用，必须要对他们做阶级分析。③杰出人物的出现及其历史作用都是必然性与偶然性的辩证统一，因此必须用必然性与偶然性辩证统一的观点来分析杰出人物及其历史作用。④任何杰出人物都有巨大的历史功绩，也必然会有这样那样的缺点或错误。对他们的历史作用要做全面的分析与评价，既不能肯定一切，也不能否定一切。"},{"t":"s","n":14,"stem":"决定社会必要劳动时间的条件，包括（）。","score":2,"ans":"D","opts":["生产的主观条件","生产的客观条件","生产的个别条件","生产的主客观条件"],"ana":"社会必要时间是现有的社会正常的生产条件下，在社会平均的劳动熟练程度和劳动强度下制造某种使用价值所需要的劳动时间。社会必要劳动时间由两个条件所决定：第一，生产的客观标准条件，即现有的社会正常的生产条件；第二，生产的主观标准条件，即社会平均的劳动熟练程度和平均的劳动强度。"},{"t":"s","n":15,"stem":"简单商品经济的基本矛盾是（）。","score":2,"ans":"B","opts":["简单劳动与复杂劳动","私人劳动和社会劳动","使用价值和价值","具体与抽象。"],"ana":"以私有制为基础的商品经济的基本矛盾：私人劳动与社会劳动之间的矛盾。"},{"t":"s","n":16,"stem":"相对剩余价值生产的条件是（）。","score":2,"ans":"A","opts":["社会劳动生产率提高","个别企业劳动生产率提高","社会劳动生产率不变","部分生产部门的劳动生产率提高"],"ana":"绝对剩余价值生产的条件：延长工作日、提高劳动强度。相对剩余价值生产的条件：社会劳动生产率提高。"},{"t":"s","n":17,"stem":"以下不属于资本积累后果的是（）。","score":2,"ans":"B","opts":["资本有机构成提高","工作日的延长","相对过剩人口的形成","贫富两极分化扩大"],"ana":"资本积累的后果：（1）资本有机构成的提高。由资本技术构成决定，并反映资本技术构成变化的资本家价值构成，叫做资本有机构成，也可用以下公式表示：资本有机构成=不变资本c / 可变资本v。相对过剩人口的形成。严重的贫富两极分化。"},{"t":"s","n":18,"stem":"作为剩余价值的转化形式，利润率是（）。","score":2,"ans":"C","opts":["剩余价值与不变资本的比率","剩余价值与可变资本的比率","剩余价值和预付总资本的比率","剩余价值与利润的比率"],"ana":"利润是剩余价值的转化形式，它表现为全部预付资本的产物，因此剩余价值与预付总资本的比率就是利润率。利润率比剩余价值率的数值小。"},{"t":"s","n":19,"stem":"在资本主义发展过程中垄断的工业资本和银行资本融合构成新的资本形成列宁把它称之为（）。","score":2,"ans":"A","opts":["金融资本","借贷资本","生息资本","工商资本"],"ana":"金融资本：垄断的工业资本和银行资本的融合。金融寡头：掌握了金融资本，操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团。"},{"t":"s","n":20,"stem":"资本主义国家大规模横向外输出资本，开始于（）。","score":2,"ans":"D","opts":["资本原始积累阶段","自由竞争资本主义阶段","私人垄断","国家垄断"],"ana":"在自由竞争资本主义阶段，资本主义国家虽然也有一些资本输出到国外，但数量较少，作用也不十分重要，当时主要是以商品输出为主。垄断资本主义阶段，资本输出在各主要资本主义国家普遍而大规模地发展了起来。成为垄断资本主义时期资本主义经济关系的一个重要特征。这是从私人垄断资本主义阶段开始的。二战后，资本输出量剧增，并出现了一些新特点：资本流向的变化，不再只向经济落后国家输出，而是多方向输出，特别是发达国家间相互投资大幅度增加；在私人资本输出增长的同时，国家资本的输出也在增长，并日益成为占重要地位的资本输出形式。所以大规模纵向输出是从私人垄断开始的，而大规模横向输出是从国家垄断开始的。"},{"t":"s","n":21,"stem":"列宁所说是社会主义最充分的物质准备是社会主义的前阶的资本主义发展阶段是指（）。","score":2,"ans":"D","opts":["资本原始积累阶段","自由竞争，资本主义社会","私人垄断资本主义社会","国家垄断私人资本主义社会"],"ana":"二战后，国家垄断资本主义迅速发展。国家垄断资本主义是资本社会化的更高形式，生产社会化、资本社会化和管理社会化达到了更高程度。为社会主义转向社会主义提供了更充分的条件。列宁指出：“国家垄断资本主义是社会主义的最充分的物质准备，是社会主义的前阶”。"},{"t":"s","n":22,"stem":"社会主义革命可以在一国或数国首先胜利的理论依据是（）。","score":2,"ans":"A","opts":["资本主义经济政治发展不平衡规律","马克思恩格斯的科学预言","剩余价值学说","阶级斗争学说"],"ana":"19世纪末20世纪初，资本主义自由竞争阶段发展到垄断阶段，出现了一些新变化、新特征。最重要的一点就是垄断资本主义即帝国主义国家之间经济政治发展不平衡。列宁指出：“经济和政治发展的不平衡是资本主义的绝对规律。由此就应该得出结论：社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利”。"},{"t":"s","n":23,"stem":"中共19大提出的新时代中国特色社会主义思想的领导人是（）。","score":2,"ans":"D","opts":["双小平","江泽民","胡锦涛","习近平"],"ana":"中共19大提出的新时代中国特色社会主义思想的领导人是习近平总书记。"},{"t":"s","n":24,"stem":"广义的共产主义社会所包含的两个阶段是（）。","score":2,"ans":"B","opts":["信息社会的初级阶段和高级阶段","社会主义和共产主义","社会主义的初级阶段和高级阶段的共产主义","初级阶段和成熟阶段"],"ana":"广义上的共产主义社会，既包括其低级阶段（社会主义社会），也包括高级阶段（共产主义社会）。狭义的社会主义只包括高级阶段（共产主义社会）。"},{"t":"s","n":25,"stem":"社会主义社会和共产主义社会都存在的经济关系是（）。","score":2,"ans":"C","opts":["生产资料的个人所有制","按劳分配","生产资料的社会公有制","按需分配"],"ana":"社会主义社会和共产主义社会同属于共产主义社会形态，共同点：①都是以生产资料公有制作为社会经济制度的基础，在公有制范围内的生产资料和劳动产品，都属劳动者共同所有，并为社会公共的利益服务和使用。②生产目的都是满足劳动人民日益增长的物质文化生活需要，实现劳动人民的共同富裕。③在公有制范围内的产品分配，都按照有利于社会发展和实现劳动人民利益的原则进行。④都要消灭剥削制度，劳动人民成为社会的主人，他们之间的本质关系是平等和谐、互助合作。⑤都以马克思主义为指导思想，以集体主义为意识形态的核心。"}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"short","n":26,"stem":"简述对立统一规律是唯物辩证法的实质与核心。","score":6,"ans":"对立统一规律是唯物辩证法的实质与核心，是宇宙的根本规律：（1）对立统一规律揭示了事物普遍联系的根本内容和发展变化的内在动力；（2）对立统一规律是贯穿于唯物辩证法其他规律和范畴的中心线索，是理解它们的钥匙；（3）矛盾分析法是认识的根本方法；（4）是否承认对立统一规律以及矛盾是事物发展的动力，是唯物辩证法和形而上学的根本分歧。","ana":"核心理由不只是它揭示矛盾运动，还在于它贯穿其他辩证规律、提供矛盾分析方法，并构成辩证法与形而上学的分歧。","anaAI":true},{"t":"short","n":27,"stem":"什么是社会基本矛盾？简述社会基本矛盾是社会发展的基本动力。","score":6,"ans":"（1）社会基本矛盾指生产力与生产关系之间的矛盾、经济基础和上层建筑之间的矛盾。（2）原因：①生产力和生产关系之间的矛盾、经济基础和上层建筑之间的矛盾，存在于一切社会意识形态之中，贯穿于每一个社会形态的始终。②这两对矛盾制约和决定着其他各种社会矛盾，决定着整个社会的面貌决定着社会发展的必然阶段和客观趋势，决定社会形态由低级到高级的演进。③所以社会基本矛盾是社会发展的基本动力。","ana":"先准确列出生产力与生产关系、经济基础与上层建筑两对矛盾，再说明它们贯穿社会形态并制约其他矛盾，故成为基本动力。","anaAI":true},{"t":"short","n":28,"stem":"产业资本循环要经历哪几个阶段？各阶段所采取的职能形式是什么？","score":6,"ans":"（1）产业资本循环要经历以下阶段：①第一阶段：购买阶段。为剩余价值的生产准备条件。是从货币资本转化为生产资本的阶段。②第二阶段：生产阶段。在资本循环中是决定性的阶段，是由生产资本转化为商品资本的阶段。资本不仅发生了形态变化，资本的数量上也发生了变化，实现了价值增殖。③第三阶段：销售阶段。是由商品资本转化为增殖了的货币资本的阶段。（2）与这三个阶段相适应，产业资本依次采取货币资本、生产资本、商品资本三种职能形式。","ana":"三阶段购买—生产—销售依次对应货币资本—生产资本—商品资本；生产阶段实现价值增殖，是循环中的决定性阶段。","anaAI":true},{"t":"short","n":29,"stem":"当代资本主义在生产关系方面有哪些新变化？","score":6,"ans":"（1）在所有制关系上，出现了所谓的资本主义社会化的去式，建立和发展了一定比重的国有经济。同时私人企业股权分散化，法人资本所有制崛起。（2）在劳资关系上，建立了劳资共决、职工参与决策、终身雇佣、职工持股等制度。（3）在分配关系上，许多发达国家对收入分配政策进行了调整。如实行社会福利政策，通过再分配手段在一定程度上缓和了社会矛盾。","ana":"从所有制、劳资关系、分配关系三层分析；这些调整缓和矛盾并适应生产力发展，但没有改变资本主义私有制本质。","anaAI":true},{"t":"short","n":30,"stem":"如何正确对待科学社会主义的一般原则？","score":6,"ans":"（1）必须始终坚持科学社会主义一般原则，反对任何背离这些原则的错误倾向；（2）要善于把科学社会主义一般原则与本国实际相结合，创造性地回答和解决革命、建设、改革中的重大问题；（3）要紧跟时代和实践的发展。在不断总结新鲜经验中进一步丰富和发展科学社会主义一般原则。","ana":"答题逻辑是坚持一般原则、结合本国实际创造性运用、随实践发展而丰富原则；不能把原则教条化或因变化而放弃原则。","anaAI":true}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"essay","n":31,"stem":"为什么说只有实践才是检验真理的标准？坚持实践是检验真理的唯一标准有何现实意义？","score":10,"ans":"（1）是不是真理就是要判明认识与认识对象是否相一致、相符合。实践是人的主观见之于客观的活动，它能把主观认识与客观实际联系起来加以对照，来确定认识与认识对象是否相一致、相符合，从而使认识得到检验。（2）实践具有直接现实性的特点。通过实践把思想、理论在现实中实现出来，人们通过把变成现实的东西同原来的观念、思想加以对照，从而判明这个思想、观念是否正确，使认识得到检验。（3）现实意义：有利于通过实践检验和发展认识，最终接近或得到真理；有利于通过正确的认识，指导实践，改造世界。","ana":"实践把主观认识与客观对象直接联系起来，凭直接现实性检验二者是否符合；现实意义落在检验、发展认识并指导改造世界。","anaAI":true},{"t":"essay","n":32,"stem":"剩余价值规律的内容是什么？为什么说剩余价值规律是资本主义的基本经济规律？","score":10,"ans":"（1）剩余价值规律的内容，就是资本通过组织雇佣劳动进行生产，占有工人的剩余劳动，并不断提高对雇佣工人的剥削程度来达到获取剩余价值的目的。（2）原因：①剩余价值规律体现着资本主义的生产目的。②剩余价值规律决定着资本主义生产的一切主要方面和主要过程。③剩余价值规律决定着资本主义生产方式产生发展和衰亡的全部过程。","ana":"内容要落到资本通过雇佣劳动占有剩余劳动；其基本规律地位来自它体现生产目的、支配主要过程并影响资本主义兴衰。","anaAI":true},{"t":"essay","n":33,"stem":"试述当代资本主义国家宏观经济管理与调节的任务目标、方式和手段。","score":10,"ans":"（1）总任务：促进市场总供给和总需求的平衡。（2）调控方式：①国家对经济的直接调节、控制和介入。②国家对国民经济的间接调节与控制，主要是运用经济手段，间接引导私人资本按照国家垄断资本主义所希望的方向发展。（3）调节手段：主要是经济手段和法律手段，在个别时候、特定情况下，还可能使用某种行政手段对国民经济进行直接的干预。","ana":"区分总任务、直接/间接调控方式和经济/法律等手段；国家调控的中心是协调总供给与总需求，不要混淆目标与工具。","anaAI":true}]}],"qaNotes":[]},{"paper":"marx-2204","subject":"marx","session":"2204","label":"2022年4月","code":"15044","qaNotes":[],"sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。","items":[{"t":"s","n":1,"stem":"马克思主义哲学的直接理论来源是（ ）","opts":["古希腊罗马哲学","德国古典哲学","近代英国哲学","近代法国哲学"],"ans":"B","score":2,"ana":"选B（德国古典哲学）。德国古典哲学提供了直接理论来源，马克思主义批判吸收了黑格尔辩证法和费尔巴哈唯物主义；英法思想是重要背景但非直接来源。","anaAI":true},{"t":"s","n":2,"stem":"学习马克思主义的根本方法是（ ）","opts":["理论联系实际","更新思想观念","熟读经典著作","了解党的文献"],"ans":"A","score":2,"ana":"选A（理论联系实际）。根本方法是把理论用于分析现实并接受实践检验；熟读经典是学习环节，不能取代这一方法。","anaAI":true},{"t":"s","n":3,"stem":"下列各项属于一元论哲学思想的是（ ）","opts":["世界万物是普遍联系的","世界万物有一个共同的本质","世界万物是可以认识的","世界万物有多种多样的形态"],"ans":"B","score":2,"ana":"选B（世界万物有一个共同的本质）。一元论主张世界具有统一的本原或本质；普遍联系、可知性和形态多样都不是一元论的定义。","anaAI":true},{"t":"s","n":4,"stem":"实践的基本形式主要有三种。下列各项属于处理社会关系的实践形式的是（ ）","opts":["种地做工","教学科研","社会改革","治病救人"],"ans":"C","score":2,"ana":"选C（社会改革）。社会改革直接调整社会关系；种地做工属于生产实践，教学科研属于科学文化实践。","anaAI":true},{"t":"s","n":5,"stem":"唯物辩证法是关于自然、社会和思维联系与发展一般规律的科学。其中，否定之否定规律揭示的是事物发展的（ ）","opts":["前提和条件","状态和形式","动力和源泉","趋势和道路"],"ans":"D","score":2,"ana":"选D（趋势和道路）。否定之否定揭示发展的前进性与曲折性，即螺旋式上升；发展动力和源泉由对立统一规律揭示。","anaAI":true},{"t":"s","n":6,"stem":"抹杀意识的客观性，把意识说成是纯粹主观自生的，这是一种（ ）","opts":["唯心主义的观点","庸俗唯物主义的观点","形而上学的观点","不可知论的观点"],"ans":"A","score":2,"ana":"选A（唯心主义的观点）。把意识说成脱离物质而自生，颠倒了物质与意识关系，属于唯心主义。易混项“庸俗唯物主义的观点”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":7,"stem":"人们追求符合客观实际的科学认识，归根结底是为了（ ）","opts":["透过现象揭示本质","满足所有人的精神追求","通过偶然发现必然","实现对客观世界的改造"],"ans":"D","score":2,"ana":"选D（实现对客观世界的改造）。认识的实践目的在于指导实践、改造世界；揭示本质是认识过程的环节而非最终目的。易混项“透过现象揭示本质”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":8,"stem":"理性认识的三种形式是（ ）","opts":["感觉、概念、判断","概念、判断、推理","感觉、知觉、表象","感觉、知觉、推理"],"ans":"B","score":2,"ana":"选B（概念、判断、推理）。概念、判断、推理是理性认识形式；感觉、知觉、表象属于感性认识。","anaAI":true},{"t":"s","n":9,"stem":"下列各项正确说明真理问题的是（ ）","opts":["真理是“绝对理念”的自我显现","真理是观念与主体的感觉相符合","真理是对客观事物及其规律的能动反映","真理是对客观事物及其规律的正确反映"],"ans":"D","score":2,"ana":"选D（真理是对客观事物及其规律的正确反映）。真理的标准是认识与客观实际相符合；“能动反映”本身不保证认识正确。","anaAI":true},{"t":"s","n":10,"stem":"对社会存在和社会意识关系问题的不同回答是（ ）","opts":["划分唯物主义和唯心主义的标准","划分可知论和不可知论的标准","划分唯物史观和唯心史观的标准","划分辩证法和形而上学的标准"],"ans":"C","score":2,"ana":"选C（划分唯物史观和唯心史观的标准）。社会存在与社会意识关系问题划分唯物史观和唯心史观；物质与意识关系才是哲学基本问题。易混项“划分唯物主义和唯心主义的标准”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":11,"stem":"衡量生产力水平的客观尺度是（ ）","opts":["生产工具的状况","劳动对象的广度","劳动产品的数量","劳动产品的质量"],"ans":"A","score":2,"ana":"选A（生产工具的状况）。生产工具集中体现生产力水平，是衡量生产力的客观尺度；产品数量、质量还受其他因素影响。","anaAI":true},{"t":"s","n":12,"stem":"下列各项关于社会改革的说法中，正确的是（ ）","opts":["社会改革仅仅是经济领域的变革","社会改革仅仅是社会心态的改良","社会改革是制度体制的根本改变","社会改革是社会体制的改善和革新"],"ans":"D","score":2,"ana":"社会改革是在不改变社会根本制度前提下，对社会体制及其具体环节作调整、革新，以适应社会发展；它并非只局限于经济领域。","anaAI":true},{"t":"s","n":13,"stem":"区分普通人物和历史人物，主要是看他们（ ）","opts":["社会财富的多寡","历史作用的大小","文化水平的高低","社会贡献的有无"],"ans":"B","score":2,"ana":"选B（历史作用的大小）。区分主要看对历史进程的作用大小，而非财富或文化水平；普通人物也能作出贡献。易混项“社会财富的多寡”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":14,"stem":"商品生产者同一劳动过程不可分割的两个方面是（ ）","opts":["简单劳动和复杂劳动","私人劳动和社会劳动","必要劳动和剩余劳动","具体劳动和抽象劳动"],"ans":"D","score":2,"ana":"选D（具体劳动和抽象劳动）。同一商品生产劳动同时具有具体劳动和抽象劳动两重属性；私人劳动与社会劳动是另一组矛盾。易混项“私人劳动和社会劳动”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":15,"stem":"以下关于商品使用价值的表述中不正确的是（ ）","opts":["使用价值是价值的物质承担者","使用价值是商品的自然属性","同一物品只能有一种使用价值","没有使用价值的物品不可能有价值"],"ans":"C","score":2,"ana":"选C（同一物品只能有一种使用价值）。该说法不正确：同一物品可能满足多种需要；使用价值仍是价值的物质承担者。易混项“使用价值是商品的自然属性”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":16,"stem":"货币转化为资本的前提是（ ）","opts":["资本完成原始积累","商品生产者出现两极分化","劳动力成为商品","劳动者有人身自由"],"ans":"C","score":2,"ana":"选C（劳动力成为商品）。劳动力成为商品，使资本家能在生产中占有其创造的超过自身价值的价值；仅有货币不够。易混项“资本完成原始积累”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":17,"stem":"必要劳动时间不变，通过工作日的延长而生产的剩余价值是（ ）","opts":["绝对剩余价值","相对剩余价值","超额剩余价值","平均剩余价值"],"ans":"A","score":2,"ana":"选A（绝对剩余价值）。工作日延长且必要劳动时间不变，增加剩余劳动时间，形成绝对剩余价值；缩短必要劳动时间则形成相对剩余价值。","anaAI":true},{"t":"s","n":18,"stem":"马克思研究资本主义经济、写作《资本论》的时代，主要资本主义国家处于（ ）","opts":["自由竞争资本主义阶段","一般垄断资本主义阶段","私人垄断资本主义阶段","国家垄断资本主义阶段"],"ans":"A","score":2,"ana":"选A（自由竞争资本主义阶段）。马克思写作《资本论》时资本主义尚处自由竞争阶段；垄断阶段是其后发展。易混项“一般垄断资本主义阶段”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":19,"stem":"各种垄断组织形式中，垄断了某种商品生产和经营全过程的独立的大型垄断企业是（ ）","opts":["卡特尔","辛迪加","托拉斯","康采恩"],"ans":"C","score":2,"ana":"选C（托拉斯）。托拉斯把生产经营纳入统一组织；卡特尔主要约定价格、产量，辛迪加统一销售。","anaAI":true},{"t":"s","n":20,"stem":"国家垄断资本主义是指（ ）","opts":["资本主义国家与垄断资本相结合的资本主义","垄断的工业资本与垄断的银行资本相结合的资本主义","资本主义国家的中央银行与商业银行相结合的资本主义","资本主义国家的国有经济与非国有经济相结合的资本主义"],"ans":"A","score":2,"ana":"选A（资本主义国家与垄断资本相结合的资本主义）。国家垄断资本主义的核心是国家力量与垄断资本结合；工业资本与银行资本结合是金融资本。易混项“垄断的工业资本与垄断的银行资本相结合的资本主义”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":21,"stem":"马克思对资本主义的历史过渡性作了精辟而辩证的论述，他所说的“资本主义的历史任务和存在理由”是指（ ）","opts":["资本主义发展了商品经济，繁荣了世界市场","资本主义提倡自由平等博爱，促进了社会进步","资本主义推翻了封建统治，建立了资本主义制度","资本主义发展了社会生产力，为新生产方式创造了物质条件"],"ans":"D","score":2,"ana":"选D（资本主义发展了社会生产力，为新生产方式创造了物质条件）。资本主义的历史任务在于发展生产力并创造新生产方式的物质条件，不只是制度更替或市场扩张。易混项“资本主义发展了商品经济，繁荣了世界市场”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":22,"stem":"标志着科学社会主义理论公开面世的第一个纲领性文件是（ ）","opts":["《共产党宣言》","《法兰西内战》","《社会主义从空想到科学的发展》","《哥达纲领批判》"],"ans":"A","score":2,"ana":"选A（《共产党宣言》）。《共产党宣言》是科学社会主义公开问世的纲领性文献；其他选项是马克思主义发展中的重要著作。易混项“《社会主义从空想到科学的发展》”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":23,"stem":"最早在一个国家里建立的马克思主义政党是（ ）","opts":["正义者同盟","德国社会民主工党","俄国布尔什维克","中国共产党"],"ans":"B","score":2,"ana":"选B（德国社会民主工党）。德国社会民主工党是较早在一国建立的马克思主义政党；正义者同盟是其前身组织。","anaAI":true},{"t":"s","n":24,"stem":"下列选项中属于共产主义社会显著特征的是（ ）","opts":["按生产要素分配","各尽所能，按劳分配","按能力大小分配","各尽所能，按需分配"],"ans":"D","score":2,"ana":"选D（各尽所能，按需分配）。按需分配是共产主义高级阶段的重要特征；按劳分配对应社会主义阶段。","anaAI":true},{"t":"s","n":25,"stem":"马克思主义认为，共产主义社会将经历两个不同的发展阶段，第一个阶段是（ ）","opts":["产品经济社会","商品经济社会","社会主义社会","自然经济社会"],"ans":"C","score":2,"ana":"选C（社会主义社会）。共产主义社会的第一阶段是社会主义社会（共产主义低级阶段）；其余选项不是这一阶段名称。易混项“产品经济社会”涉及相关但不同的概念。","anaAI":true}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"w","n":26,"stem":"什么是马克思主义？简述马克思主义的根本理论特征。","score":6,"ans":"（1）马克思主义是由马克思恩格斯创立并为后继者所发展，以反对资本主义、建设社会主义和共产主义为目标的科学理论体系，或者简要地说，它是关于无产阶级和人类解放的科学。（2）马克思主义的根本理论特征是以实践为基础的科学性和革命性的统一。","ana":"定义指出其关于无产阶级和人类解放的科学体系；理论特征要说明科学性与革命性统一，并以实践为基础。","anaAI":true},{"t":"w","n":27,"stem":"简述认识客体的含义、构成和性质。","score":6,"ans":"（1）认识客体是指人的实践活动和认识活动所指向的对象。（2）认识客体由自然客体、社会客体和精神客体构成。（3）首先，认识客体具有客观性；其次，认识客体具有对象性。","ana":"认识客体是实践和认识指向的对象，构成包括自然、社会、精神客体；其客观性与对象性说明它既独立于主体又进入实践关系。","anaAI":true},{"t":"w","n":28,"stem":"什么是资本主义意识形态？它的本质是什么？","score":6,"ans":"（1）资本主义意识形态是资产阶级对世界和社会的系统看法和见解，是资本主义社会中占统治地位的思想体系，它具有鲜明的阶级性。（2）资本主义意识形态是建立在资本主义经济基础之上的，是为资本主义私有制和雇佣劳动制度服务的，因此本质上是维护资本主义剥削制度的思想体系。","ana":"须把它放在资产阶级统治思想体系中界定，并联系经济基础说明其维护私有制和雇佣劳动制度的阶级本质。","anaAI":true},{"t":"w","n":29,"stem":"简述第二次世界大战后资本主义国家中垄断统治加强的原因和主要表现。","score":6,"ans":"（1）第二次世界大战后，由于新科技革命的发展，竞争的加剧，生产和资本的进一步集中，使垄断统治进一步加强。（2）垄断统治加强的主要表现：企业兼并速度加快，混合兼并占主导地位。企业规模扩大，垄断程度提高。企业组织的生产经营多样化，混合联合企业大量涌现。垄断组织向国际化方向发展，跨国公司迅速增加。","ana":"因果链是科技革命与竞争推动集中，进而强化垄断；表现从兼并、企业规模与混合经营、跨国化几个层面展开。","anaAI":true},{"t":"w","n":30,"stem":"简述社会主义从一国到多国发展的历史贡献。","score":6,"ans":"（1）社会主义作为一种现实存在的社会制度出现在世界上，推动了人类历史的发展和社会制度的演进。（2）社会主义国家的存在改变了世界的格局，在一定程度上遏制了资本主义和霸权主义在世界上的扩张。（3）社会主义力量坚定地支持被压迫民族和被压迫人民，推动着和平与发展的世界时代潮流。（4）社会主义引导着世界人民的前进方向。","ana":"作答应分别联系社会制度演进、世界力量格局、民族解放与和平发展，说明现实社会主义如何改变历史进程。","anaAI":true}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"w","n":31,"stem":"试述矛盾的普遍性与特殊性辩证关系的原理及其对社会主义建设的重要意义。","score":10,"ans":"（1）矛盾的普遍性和特殊性的关系，也就是共性和个性或一般和个别的关系。第一，矛盾的普遍性和特殊性是相互联结的，普遍性存在于特殊性之中，特殊性中包含着普遍性。第二，矛盾的普遍性和特殊性是相互区别的，共性只是包含了同类个别事物共同的、本质的东西，而没有包括个别事物的全部内容和特点。第三，矛盾的普遍性和特殊性在一定条件下可以相互转化。（2）矛盾的普遍性和特殊性辩证关系的原理，是建设中国特色社会主义的理论基础。在中国建设社会主义，必须从中国的国情出发，把科学社会主义的一般原理同中国具体实际结合起来，在实践中开辟建设中国特色社会主义的道路。","ana":"普遍性与特殊性即共性与个性，二者相联、相区别并可转化；建设意义是把一般原理同中国具体实际结合，避免照搬。","anaAI":true},{"t":"w","n":32,"stem":"如何理解“社会经济形态的发展是一种自然历史过程”？","score":10,"ans":"（1）所谓社会经济形态的发展是一种自然历史过程，是说人类社会的发展也像自然界一样，是客观的、物质的、辩证的过程，具有不依人的意志为转移的客观规律性。同时又应看到，正是人类有意识、有目的的实践活动构成了人类社会的历史，形成了人类社会历史的发展规律。（2）第一，因为每一代人在社会上开始生活时，所遇到的都是现成的生产力和生产关系；任何人都不能自由地选择生产力和生产关系。第二，人们不能自由地选择生产力和生产关系，这并不是说他们不可以按照自己的目的和需要去改变原有的生产力和生产关系。第三，把社会关系归结于生产关系，把生产关系归结于生产力的水平，就是认为生产力决定生产关系，生产关系作为社会经济基础又决定上层建筑，这是历史发展中的唯物主义因果决定论，或称历史决定论。","ana":"“自然历史”强调社会发展有客观物质规律，不等于人没有能动作用；人的实践在既定生产力、生产关系条件下推动历史变化。","anaAI":true},{"t":"w","n":33,"stem":"试述借贷资本和利息的来源与本质。","score":10,"ans":"（1）借贷资本是从职能资本即产业资本和商业资本运动中分离出来的特殊资本形式；它主要来源于资本主义再生产过程中职能资本家手中暂时闲置的货币资本。（2）借贷资本的本质是为了取得利息而暂时贷给职能资本家使用的货币资本。（3）职能资本家为暂时获得所借贷的货币资本使用权，必须向借贷资本家支付利息。（4）利息是职能资本家使用借贷资本而让给借贷资本家的一部分剩余价值，是剩余价值的特殊转化形式。","ana":"借贷资本来自职能资本循环中的暂时闲置货币，利息则是职能资本家让渡给贷款者的一部分剩余价值；需区分来源与本质。","anaAI":true}]}]},{"paper":"marx-2210","subject":"marx","session":"2210","label":"2022年10月","code":"03709","note":"扫描卷为 photocopy，客观题题序与网络版（诚为径）相反，以扫描卷印刷题号为准；Q12 选项B/C/D因原件重影缺陷缺失，依据自考365/诚为径同题补齐","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列不属于马克思主义对共产主义社会展望的是（  ）","opts":["社会生产力高度发展和物质财富极大丰富","实行社会公有制和按需分配","阶级的消灭和国家自行消亡","人们自由自在，不受任何约束"],"ans":"D","score":2,"ana":"选D（人们自由自在，不受任何约束）。共产主义的自由并非任性或不受社会公共规范约束；其余选项属于经典展望的特征。易混项“社会生产力高度发展和物质财富极大丰富”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":2,"stem":"马克思主义政党的组织原则是（  ）","opts":["民主集中制","集体领导制","个人领导制","群众监督制"],"ans":"A","score":2,"ana":"选A（民主集中制）。民主集中制把民主基础上的集中和集中指导下的民主结合起来，是马克思主义政党的组织原则。","anaAI":true},{"t":"s","n":3,"stem":"建立无产阶级专政政权的第一次尝试是（  ）","opts":["法国大革命","巴黎公社革命","俄国二月革命","俄国十月革命"],"ans":"B","score":2,"ana":"选B（巴黎公社革命）。巴黎公社是无产阶级建立专政政权的第一次伟大尝试；十月革命则建立了第一个社会主义国家。","anaAI":true},{"t":"s","n":4,"stem":"新殖民主义在对外经济侵略形式上不同于老殖民主义的做法是（  ）","opts":["对外输出商品","对外输出资本","进行“对外援助”","进行“颜色革命”"],"ans":"C","score":2,"ana":"选C（进行“对外援助”）。新殖民主义常借“援助”等形式维持控制，较老殖民主义的直接统治更隐蔽。易混项“对外输出商品”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":5,"stem":"垄断资本主义阶段对外输出资本的必要性在于（  ）","opts":["国内劳动力供给过剩","国内商品需求过剩","存在大量过剩资本","存在激烈金融竞争"],"ans":"C","score":2,"ana":"选C（存在大量过剩资本）。垄断阶段国内积累了难以获利的过剩资本，输出资本可寻找更有利的投资场所。易混项“国内商品需求过剩”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":6,"stem":"垄断利润不可能来源于（  ）","opts":["垄断企业工人创造的剩余价值","非垄断企业工人创造的剩余价值","其他国家劳动者创造的剩余价值","垄断本身创造的商品价值增殖"],"ans":"D","score":2,"ana":"选D（垄断本身创造的商品价值增殖）。垄断可重新分配既有剩余价值，却不能凭垄断创造新价值；价值源于劳动。易混项“其他国家劳动者创造的剩余价值”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":7,"stem":"生产和资本集中发展到一定程度时，自然而然会走向垄断，而引起生产和资本集中到最主要、最直接的因素则是（  ）","opts":["商品经济的发展","自由竞争的驱动","市场体系的完善","法律制度的规范"],"ans":"B","score":2,"ana":"选B（自由竞争的驱动）。自由竞争推动优胜劣汰和生产、资本集中，集中发展到一定程度便转化为垄断。易混项“商品经济的发展”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":8,"stem":"资本主义政治制度的核心是（  ）","opts":["国家制度","政党制度","选举制度","民主制度"],"ans":"A","score":2,"ana":"选A（国家制度）。国家制度是资本主义政治制度的核心；政党、选举和民主制度都在其框架内运行。","anaAI":true},{"t":"s","n":9,"stem":"工作日长度保持不变的前提下，缩短必要劳动时间从而相应地延长剩余劳动时间所生产的剩余价值是（  ）","opts":["绝对剩余价值","超额剩余价值","相对剩余价值","平均剩余价值"],"ans":"C","score":2,"ana":"选C（相对剩余价值）。工作日不变而压缩必要劳动时间，剩余劳动时间相应增加，生产相对剩余价值。易混项“绝对剩余价值”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":10,"stem":"资本主义生产过程是（  ）","opts":["劳动过程和价值增殖过程的统一","劳动过程和价值形成的统一","劳动过程和价值增殖过程的对立","劳动过程和价值形成的对立"],"ans":"A","score":2,"ana":"选A（劳动过程和价值增殖过程的统一）。资本主义生产既生产使用价值又实现价值增殖，故是劳动过程与价值增殖过程的统一。","anaAI":true},{"t":"s","n":11,"stem":"货币最基本的职能是（  ）","opts":["价值尺度和支付手段","存储手段和支付手段","价值尺度和流通手段","流通手段和世界货币"],"ans":"C","score":2,"ana":"选C（价值尺度和流通手段）。价值尺度和流通手段是货币最基本职能；其他职能是商品经济发展的结果。易混项“流通手段和世界货币”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":12,"stem":"商品生产和商品交换的总称是（  ）","opts":["货币经济","商品经济","产品经济","自然经济"],"ans":"B","score":2,"ana":"选B（商品经济）。商品经济是商品生产和商品交换的总称，自然经济以自给自足为主。易混项“货币经济”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":13,"stem":"既承认社会形态发展的统一性，又承认社会形态发展的多样性，这是一种（  ）","opts":["机械决定论观点","历史唯物主义观点","历史循环论观点","历史虚无主义观点"],"ans":"B","score":2,"ana":"选B（历史唯物主义观点）。承认社会发展的共同规律又承认具体道路多样，符合历史唯物主义，反对单线机械化理解。","anaAI":true},{"t":"s","n":14,"stem":"社会改革不仅存在于社会主义社会中，而且存在于有史以来的各种社会制度中，这说明社会改革具有（  ）","opts":["统一性","多样性","普遍性","特殊性"],"ans":"C","score":2,"ana":"选C（普遍性）。改革存在于多种社会形态，说明它具有普遍性；具体改革方式又各有特殊性。","anaAI":true},{"t":"s","n":15,"stem":"判断一种生产关系是先进还是落后，主要是看（  ）","opts":["它是计划经济还是市场经济","它是按劳分配还是按资分配","它是生产资料公有制还是私有制","它是促进生产力发展还是阻碍生产力发展"],"ans":"D","score":2,"ana":"选D（它是促进生产力发展还是阻碍生产力发展）。判断生产关系先进与否，根本尺度是它是否适合并促进生产力发展，不能仅凭制度标签判断。","anaAI":true},{"t":"s","n":16,"stem":"先进的社会意识之所以对社会存在的发展起促进作用，是由于（  ）","opts":["它是对社会存在的能动反映","它是对社会规律的正确反映","它应社会生活的需求而产生","它随着社会生活发展而变化"],"ans":"B","score":2,"ana":"选B（它是对社会规律的正确反映）。先进社会意识因正确反映社会规律而能指导实践、促进社会存在；并非任何能动反映都如此。易混项“它是对社会存在的能动反映”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":17,"stem":"马克思主义认识论认为，认识是否具有真理性（  ）","opts":["可以从认识本身得到证实","可以从认识对象中得到回答","可以从认识主体自由判断","只有在实践中才能得到验证"],"ans":"D","score":2,"ana":"选D（只有在实践中才能得到验证）。认识是否符合客观对象最终须由实践检验；单凭认识自身或主体判断不能裁定。","anaAI":true},{"t":"s","n":18,"stem":"一个完整的认识过程，需要经过两次飞跃，下面属于第二次飞跃的是（  ）","opts":["深入调查研究","理论付诸实践","分析具体情况","掌握基本原理"],"ans":"B","score":2,"ana":"选B（理论付诸实践）。第二次飞跃是从理性认识回到实践，以理论指导改造世界；调查和掌握原理属于认识形成过程。","anaAI":true},{"t":"s","n":19,"stem":"不可知论的错误在于（  ）","opts":["否认思维能够正确认识世界","把活生生的认识过程凝固化了","否认认识是从外部世界得来的","把多方面认识过程片面化了"],"ans":"A","score":2,"ana":"选A（否认思维能够正确认识世界）。不可知论否认或怀疑认识世界及其本质的可能性，割裂了认识与客观世界的关系。","anaAI":true},{"t":"s","n":20,"stem":"规律的客观性是指（  ）","opts":["规律是无法认识的","规律是不以任何人的意志为转移的","规律是无法利用的","规律是不在人类思维领域起作用的"],"ans":"B","score":2,"ana":"选B（规律是不以任何人的意志为转移的）。规律客观存在，不依人的意志转移；但可以被认识和利用，不能因此说它不可知。","anaAI":true},{"t":"s","n":21,"stem":"现象可以分为真象和假象，假象是指（  ）","opts":["歪曲地表现本质的现象","与本质一致的现象","直接表现本质的现象","不表现本质的现象"],"ans":"A","score":2,"ana":"选A（歪曲地表现本质的现象）。假象从反面歪曲表现本质，并非完全不表现本质；要透过现象把握本质。易混项“与本质一致的现象”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":22,"stem":"唯物辩证法与形而上学的焦点和根本分歧在于是否承认（  ）","opts":["思维和存在具有统一性","世界万物具有共同的本原","矛盾是事物发展的动力","新事物必然战胜旧事物"],"ans":"C","score":2,"ana":"选C（矛盾是事物发展的动力）。唯物辩证法与形而上学的根本分歧在于是否承认矛盾是事物发展的动力。","anaAI":true},{"t":"s","n":23,"stem":"判断一个事物是新事物还是旧事物，主要看它（  ）","opts":["是否形式新奇","是否满足大多数人的主观愿望","是否新近出现","是否符合事物发展的必然趋势"],"ans":"D","score":2,"ana":"选D（是否符合事物发展的必然趋势）。新事物符合事物发展的必然趋势并有生命力；出现时间早晚和形式新奇都不是判据。","anaAI":true},{"t":"s","n":24,"stem":"在马克思主义科学体系中，作为世界观和方法论的是（  ）","opts":["科学社会主义","历史学","政治经济学","哲学"],"ans":"D","score":2,"ana":"选D（哲学）。马克思主义哲学提供世界观和方法论基础；政治经济学和科学社会主义研究其他理论领域。","anaAI":true},{"t":"s","n":25,"stem":"马克思主义是时代的产物，马克思恩格斯所处的历史时代以及提出的各项任务，为马克思主义产生提供（  ）","opts":["主观条件","客观条件","阶级基础","理论基础"],"ans":"B","score":2,"ana":"选B（客观条件）。时代发展及其现实任务提供客观条件；工人运动提供阶级基础，经典哲学等构成理论来源。","anaAI":true}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"w","n":26,"stem":"为什么说经济全球化是国际分工不断深化、生产和资本国际化不断发展的必然产物？","score":6,"ans":"(1)经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出一国和地区的范围而相互联系、相互依赖的过程。(2)经济全球化本质上是资源配置的国际化，其内容包括很多方面，大体可从生产全球化、贸易全球化和资本全球化三方面来考察。①生产的全球化。这是随着科学技术的发展，一系列高精尖产品和工艺技术的出现，生产领域的国际分工和协作的加强，各国在生产上密切配合的趋势。②贸易的全球化。国际贸易活动虽然已有很长的历史，但它的全球化则是近几十年来在工业和科技革命推动下出现的，尤其是近二三十年发展得更快，绝大多数年份国际贸易的增长率都大大高于各国的经济增长率。③资本全球化。在垄断资本主义阶段，资本输出意味着资本国际化开始出现。近二三十年来，在新科技革命的推动下，资本在国际的流动以前所未有的速度增加，形成了资本全球化趋势。","ana":"推理链是科技与分工深化推动生产社会化、国际化，继而使生产、贸易和资本跨境联系增强；全球化是这一过程的结果。","anaAI":true},{"t":"w","n":27,"stem":"资本主义再生产周期包括哪几个阶段？资本主义的经济危机的根本特点、实质和根源是什么？","score":6,"ans":"(1)资本主义再生产周期一般来说包括危机、萧条、复苏、高涨四个阶段。(2)经济危机期间最根本的特点：商品生产过剩。(3)资本主义经济危机的实质是生产相对过剩的危机。(4)经济危机产生的根源在于资本主义生产方式的基本矛盾，即生产的社会化与生产资料私人资本主义占有形式之间的矛盾。","ana":"周期依次为危机、萧条、复苏、高涨；根源是生产社会化与生产资料资本主义私人占有的矛盾，商品相对过剩体现其危机实质。","anaAI":true},{"t":"w","n":28,"stem":"如何正确认识真理与价值的关系？","score":6,"ans":"(1)真理与价值相互对立、相互区别：真理体现的是认识与认识对象的关系，是认识与对象相一致、相符合；而价值是指客体对大需要的满足，表示客体具有对人有用或对主体有意义的属性。(2)真理与价值又是不可分的，又有统一的一面，表现在：第一，真理能够指导社会实践，成功改造世界，以实践的成果满足人们的需要，这就是真理所表现出来的价值属性。第二，真理与正确的价值观相一致，正确的价值观是在真理指导下形成的。","ana":"真理回答认识是否符合对象，价值回答对象能否满足主体需要；统一在真理指导实践并实现价值、正确价值选择以真理为依据。","anaAI":true},{"t":"w","n":29,"stem":"简述空想社会主义相对于科学社会主义的局限性。","score":6,"ans":"空想社会主义是早期无产阶级意识和利益的先声，反映了早期无产阶级迫切要求改造现存社会、建立理想的新社会的愿望。空想社会主义者论证了资本主义灭亡的必然性，但因为他们的唯心史观，没有正确认识社会历史发展的必然规律，不能揭示出资本主义必然灭亡的经济根源和客观必然性。他们要求埋葬资本主义，却找不到埋葬资本主义的力量。他们憧憬社会主义的理想社会，却找不到通往理想社会的现实道路，这是空想社会主义的历史局限性。","ana":"其历史进步在于批判资本主义并提出理想，但受唯心史观限制，未揭示经济根源、革命力量及现实道路。","anaAI":true},{"t":"w","n":30,"stem":"资本主义国家如何在私人企业外部进行管理和调控经济活动？","score":6,"ans":"(1)通过法律手段来规范私人企业的市场行为，使其运行符合国家垄断资本的要求。(2)可以用经济手段来间接地调节私人企业的经济活动，诱导私人企业向国家希望的方向发展。如通过财政政策，以增税、减税或是补贴的方式，可以引导私人企业增加生产或是减少生产。(3)也可以通过货币金融政策，如放松还是收紧银根，实行差别利率等方式，引导企业的行为和发展方向。(4)还可以通过国家向私人企业加工订货来维持企业的生产和发展。(5)通过实行国民经济计划化，引导私人企业的发展等等。","ana":"国家通过法律规范、财政金融政策、订货及计划等外部手段影响私人企业；应说明这些工具如何引导企业活动而非直接替代企业。","anaAI":true}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"w","n":31,"stem":"资本主义生产关系的形成在经济上需要具备的基本条件是什么？","score":10,"ans":"资本主义生产关系的形成在经济上需要具备的基本条件是：一是大量有人身自由但失去生产资料的劳动者；二是少数人手中积累起为组织资本主义生产所需要的大量货币财富。","ana":"资本主义生产关系形成需两端条件并存：大量失去生产资料但人身自由的劳动者，以及少数人积累的货币财富；二者共同构成雇佣劳动和资本。","anaAI":true},{"t":"w","n":32,"stem":"说明人与社会是具体的、历史的统一。","score":10,"ans":"人与社会是具体的、历史的统一，主要表现在以下几个方面。第一，人的出现与社会的产生是一致的。第二，人的活动与社会结构及其发展变化是一致的。第三，社会的本质和人的本质是一致的，这种一致的基础是实践。第四，个人的解放与社会的解放是一致的。","ana":"人的产生、活动、社会关系和个人解放都处于具体历史社会中；实践是个人与社会相联结、共同发展的基础。","anaAI":true},{"t":"w","n":33,"stem":"简述运动的含义及物质与运动的关系。","score":10,"ans":"(1)运动的含义：运动是物质的根本属性和存在方式，运动囊括宇宙中发生的一切变化和过程。(2)物质和运动的关系：运动是物质的固有属性，物质和运动不可分。物质世界的运动是无条件的、永恒的、绝对的。否认物质的运动和运动的绝对性，必然导致形而上学。另一方面，世界上也不存在没有物质的运动。物质是运动的承担者，是运动的主体，一切运动都是物质的运动。否认物质是运动的承担者或主体，必然导致唯心主义。","ana":"运动是物质的根本属性和存在方式，物质是运动主体，二者不可分；否认物质运动会陷入形而上学，否认物质主体会走向唯心主义。","anaAI":true}]}],"qaNotes":[]},{"paper":"marx-2304","subject":"marx","session":"2304","label":"2023年4月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思是时代的产物。细胞学说、能量守恒与转化、进化论三个成果的发现。为马克思主义的产生提供了（）。","score":2,"ans":"C","opts":["直接来源","阶级利益","自然科学基础","主观条件"],"ana":"细胞学说、能量守恒与转化定律、达尔文进化论揭示自然界物质结构、运动和发展的规律，为马克思主义提供自然科学基础；它们不是马克思主义的哲学或理论来源。","anaAI":true},{"t":"s","n":2,"stem":"在一元论上，唯物主义与唯心主义的共同点是是承认世界的（）。","score":2,"ans":"C","opts":["同一性","可知性","统一性","物质性"],"ana":"选C（统一性）。唯物主义和唯心主义的一元论都承认世界有统一本原，分歧在于统一于物质还是精神。","anaAI":true},{"t":"s","n":3,"stem":"哲学是世界观的理论体系，世界观是人们（）。","score":2,"ans":"D","opts":["对自然界的根本看法和根本观点","对人类社会的根本看法和根本观点","对精神世界的根本看法和根本观点","对整个世界的根本看法和观点"],"ana":"选D（对整个世界的根本看法和观点）。世界观是对整个世界的根本看法，不限于自然、社会或精神某一领域。易混项“对人类社会的根本看法和根本观点”涉及相关但不同的概念。","anaAI":true},{"t":"s","n":4,"stem":"把世界的本质或本原归结为某一种或某几种具体的物质形态，这种观点
