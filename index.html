的艺术感染力体现在","options":[{"key":"A","text":"前期词以白描手法写宫廷生活,生动鲜活"},{"key":"B","text":"后期词直抒亡国之痛,情感真挚沉痛"},{"key":"C","text":"善用比喻,将抽象愁绪具象化"},{"key":"D","text":"语言清新自然,摆脱花间词秾艳之风"},{"key":"E","text":"严格遵循格律,注重辞藻堆砌"}],"key":"ABCD","answer":"前期词以白描手法写宫廷生活,生动鲜活；后期词直抒亡国之痛,情感真挚沉痛；善用比喻,将抽象愁绪具象化；语言清新自然,摆脱花间词秾艳之风","max":2,"id":"唐诗宋词-12-multi-19"},{"n":20,"type":"multi","prompt":"唐代文人词与敦煌曲子词的差异有","options":[{"key":"A","text":"作者身份:文人 vs 下层民众"},{"key":"B","text":"语言风格:雅化锤炼 vs 通俗俚俗"},{"key":"C","text":"内容侧重:士大夫情感 vs 民间生活"},{"key":"D","text":"艺术技巧:成熟精致 vs 粗糙质朴"},{"key":"E","text":"音乐性:不可唱 vs 可唱"}],"key":"ABCD","answer":"作者身份:文人 vs 下层民众；语言风格:雅化锤炼 vs 通俗俚俗；内容侧重:士大夫情感 vs 民间生活；艺术技巧:成熟精致 vs 粗糙质朴","max":2,"id":"唐诗宋词-12-multi-20"},{"n":21,"type":"term","prompt":"敦煌曲子词","options":[],"key":"","answer":"敦煌曲子词是敦煌藏经洞发现的唐五代词曲,多为民间词。内容广泛,涵盖边客游子呻吟、 民间疾苦、爱情生活与宗教赞颂。艺术上清新质朴,生活气息浓厚;句式不定,平仄不拘, 为后世文人词提供借鉴,是词体草创阶段的重要遗存。","max":3,"id":"唐诗宋词-12-term-21"},{"n":22,"type":"term","prompt":"唐代文人词","options":[],"key":"","answer":"唐代文人词指中晚唐至唐末文人依曲调节拍创作的歌词,早期作者有韦应物、刘禹锡、白居易等,晚唐温庭筠大力创作词牌。内容初期多写山水、爱情,后期渐涉男女离愁。讲究声律辞藻,为花间词、南唐词奠定基础,是词文人化发展的关键阶段。","max":3,"id":"唐诗宋词-12-term-22"},{"n":23,"type":"term","prompt":"花间词","options":[],"key":"","answer":"花间词:晚唐五代以“花间派”为代表的词作,因后蜀赵崇祚编《花间集》得名,以温庭筠为鼻祖,代表作家有韦庄。内容多写闺阁艳情、宴饮游乐,风格绮靡香软,辞藻华美,音律和谐,完善了词的抒情技巧,对后世婉约词影响深远。","max":3,"id":"唐诗宋词-12-term-23"},{"n":24,"type":"term","prompt":"南唐词","options":[],"key":"","answer":"南唐词是五代南唐的词派,与西蜀花间词并峙,代表作家为冯延巳、李璟、李煜。内容初期写男女情爱,后期融入家国之思与人生感慨;风格由婉约含蓄转向沉郁沉痛,语言清新自然,将词从“伶工之词”向“士大夫之词”转变,对北宋词影响深远。","max":3,"id":"唐诗宋词-12-term-24"},{"n":25,"type":"term","prompt":"词牌","options":[],"key":"","answer":"词牌是词的曲调名称,如《蝶恋花》《菩萨蛮》,决定词的体裁、句式、押韵与分片。词人依谱填词,后世曲调失传,词牌成为声律定格。部分词牌与内容相关,如《渔歌子》,多数仅为格式标识,同一词牌可填不同内容,是词体区别于诗体的重要特征。","max":3,"id":"唐诗宋词-12-term-25"},{"n":26,"type":"short","prompt":"简要概括唐宋词调的基本特征。","options":[],"key":"","answer":"唐宋词调有四大基本特征:一是有调名与体裁分类,调名如《浣溪沙》,体裁分令、引、 近、慢;二是按乐曲遍数分片,以双调(上下阕)为基本形式,另有单调、三叠、四叠;三是押韵灵活,因调而异,可平仄互押、中途转韵;四是句式长短不齐,用字讲究平仄,使字声与乐声协调,体现“倚声填词”的特点。","max":5,"id":"唐诗宋词-12-short-26"},{"n":27,"type":"short","prompt":"简述敦煌曲子词的主要特点。","options":[],"key":"","answer":"敦煌曲子词的特点主要有三:一是作者与内容,多出自下层民众,内容涵盖社会生活各方面,如边客游子呻吟、民间疾苦、爱情与宗教赞颂;二是艺术风格,清新质朴,生活气息浓厚,善用直白语言与民间比兴,也有俚俗粗拙之处;三是体制形态,有衬字、字数不定、平仄不拘,保留词体草创阶段的原始风貌。","max":5,"id":"唐诗宋词-12-short-27"},{"n":28,"type":"short","prompt":"以李煜《长相思》为例,分析其词作的艺术感染力。","options":[],"key":"","answer":"李煜《长相思》的艺术感染力有三:一是借景抒情,以汴水、泗水的连绵流淌喻相思之情, 将抽象情感具象化;二是语言自然通俗,无华丽辞藻,直白传达思念之深,贴近生活,易引发共鸣;三是情感真挚,直接抒发长久思念的愁绪,展现超越花间词秾艳的自然之美,为其后期沉痛词风奠定基础。","max":5,"id":"唐诗宋词-12-short-28"},{"n":29,"type":"short","prompt":"简要说明南唐词与西蜀词的主要区别。","options":[],"key":"","answer":"南唐词与西蜀词的区别有三:一是创作群体,南唐词人多为帝王将相,修养高,西蜀词人多为宫廷清客,修养较低;二是内容与风格,西蜀词聚焦女性美貌与离愁,辞藻秾艳;南唐词后期融入家国之思,风格由婉约转向沉郁;三是词的功能,西蜀词多为“伶工之词”,南唐词转向“士大夫之词”,提升了词的品格。","max":5,"id":"唐诗宋词-12-short-29"},{"n":30,"type":"essay","prompt":"论述唐五代词的发展历程及各阶段的主要特征,并分析其对北宋词的影响。","options":[],"key":"","answer":"一、历程:(一)敦煌曲子词:民间草创,题材广。(二)唐代文人词:韦应物、白居易等试作,温庭筠创制词牌。(三)花间词:因《花间集》得名,写女性离愁,风格秾艳。 (四)南唐词:李煜等融入家国之思,词变为士大夫之词。 二、影响:(一)体制:确立调名、声律、分片规范。(二)风格:花间婉约与南唐沉郁奠定北宋主流。(三)内容:情爱、家国、市井题材为北宋继承拓展。(四)艺术:比兴、白描手法被北宋吸收。","max":10,"id":"唐诗宋词-12-essay-30"}],"rawMax":70},{"id":"唐诗宋词-13","title":"章节练习(10章)","questions":[{"n":1,"type":"single","prompt":"下列属于晏殊词集的是","options":[{"key":"A","text":"《小山词》"},{"key":"B","text":"《珠玉集》"},{"key":"C","text":"《乐章集》"},{"key":"D","text":"《淮海词》"}],"key":"B","answer":"《珠玉集》","max":1,"id":"唐诗宋词-13-single-1"},{"n":2,"type":"single","prompt":"范仲淹《渔家傲》一词的核心风格是","options":[{"key":"A","text":"清新婉约,柔情似水"},{"key":"B","text":"豪放雄浑,苍凉悲壮"},{"key":"C","text":"通俗浅近,市井气息"},{"key":"D","text":"绮丽秾艳, 辞藻华丽"}],"key":"B","answer":"豪放雄浑,苍凉悲壮","max":1,"id":"唐诗宋词-13-single-2"},{"n":3,"type":"single","prompt":"晏几道的词集名称是","options":[{"key":"A","text":"《珠玉集》"},{"key":"B","text":"《小山词》"},{"key":"C","text":"《六一词》"},{"key":"D","text":"《安陆词》"}],"key":"B","answer":"《小山词》","max":1,"id":"唐诗宋词-13-single-3"},{"n":4,"type":"single","prompt":"欧阳修《蝶恋花》(庭院深深深几许)中,体现女主人公孤独苦闷的典型意象是","options":[{"key":"A","text":"杨柳堆烟"},{"key":"B","text":"雨横风狂"},{"key":"C","text":"泪眼问花"},{"key":"D","text":"乱红飞过秋千去"}],"key":"D","answer":"乱红飞过秋千去","max":1,"id":"唐诗宋词-13-single-4"},{"n":5,"type":"single","prompt":"张先因哪句词获得“张三影”的雅号","options":[{"key":"A","text":"那堪更被明月,隔墙送过秋千影"},{"key":"B","text":"柳径无人,堕飞絮无影"},{"key":"C","text":"云破月来花弄影"},{"key":"D","text":"中庭月色正清明,无数杨花过无影"}],"key":"C","answer":"云破月来花弄影","max":1,"id":"唐诗宋词-13-single-5"},{"n":6,"type":"single","prompt":"下列不属于宋初词风主导倾向的是","options":[{"key":"A","text":"内容多为相思离别、流连光景"},{"key":"B","text":"风格以婉约含蓄为主"},{"key":"C","text":"题材拓展至边塞、家国情怀"},{"key":"D","text":"语言趋于雅化,注重锤炼"}],"key":"C","answer":"题材拓展至边塞、家国情怀","max":1,"id":"唐诗宋词-13-single-6"},{"n":7,"type":"single","prompt":"柳永词与宋初其他词人词的主要区别在于","options":[{"key":"A","text":"仅创作小令,不写长调"},{"key":"B","text":"语言通俗浅近,多市井气息"},{"key":"C","text":"内容仅写宫廷生活"},{"key":"D","text":"风格豪放雄浑,远离婉约"}],"key":"B","answer":"语言通俗浅近,多市井气息","max":1,"id":"唐诗宋词-13-single-7"},{"n":8,"type":"single","prompt":"晏殊《浣溪沙》(一曲新词酒一杯)中,蕴含时光易逝感慨的名句是","options":[{"key":"A","text":"一曲新词酒一杯,去年天气旧亭台"},{"key":"B","text":"夕阳西下几时回"},{"key":"C","text":"无可奈何花落去,似曾相识燕归来"},{"key":"D","text":"小园香径独徘徊"}],"key":"C","answer":"无可奈何花落去,似曾相识燕归来","max":1,"id":"唐诗宋词-13-single-8"},{"n":9,"type":"single","prompt":"范仲淹《渔家傲》中,体现边塞艰苦环境的诗句是","options":[{"key":"A","text":"塞下秋来风景异,衡阳雁去无留意"},{"key":"B","text":"四面边声连角起"},{"key":"C","text":"千嶂里,长烟落日孤城闭"},{"key":"D","text":"浊酒一杯家万里"}],"key":"A","answer":"塞下秋来风景异,衡阳雁去无留意","max":1,"id":"唐诗宋词-13-single-9"},{"n":10,"type":"single","prompt":"晏几道词的主要内容是","options":[{"key":"A","text":"边塞征战,家国情怀"},{"key":"B","text":"市井生活,通俗情爱"},{"key":"C","text":"回忆早年风流,抒发悲凉哀愁"},{"key":"D","text":"山水田园,隐逸情怀"}],"key":"C","answer":"回忆早年风流,抒发悲凉哀愁","max":1,"id":"唐诗宋词-13-single-10"},{"n":11,"type":"single","prompt":"欧阳修《蝶恋花》(庭院深深深几许)的词牌是","options":[{"key":"A","text":"《浣溪沙》"},{"key":"B","text":"《蝶恋花》"},{"key":"C","text":"《渔家傲》"},{"key":"D","text":"《念奴娇》"}],"key":"B","answer":"《蝶恋花》","max":1,"id":"唐诗宋词-13-single-11"},{"n":12,"type":"single","prompt":"张先《天仙子》的创作特点是","options":[{"key":"A","text":"善用“影”字,捕捉细微美感"},{"key":"B","text":"语言通俗,多市井俚语"},{"key":"C","text":"风格豪放,多边塞题材"},{"key":"D","text":"内容绮丽,多宫廷生活"}],"key":"A","answer":"善用“影”字,捕捉细微美感","max":1,"id":"唐诗宋词-13-single-12"},{"n":13,"type":"single","prompt":"下列词人中,被称为“北宋倚声家初祖”的是","options":[{"key":"A","text":"柳永"},{"key":"B","text":"晏殊"},{"key":"C","text":"欧阳修"},{"key":"D","text":"张先"}],"key":"B","answer":"晏殊","max":1,"id":"唐诗宋词-13-single-13"},{"n":14,"type":"single","prompt":"欧阳修词与晏殊词的共同特点是","options":[{"key":"A","text":"均以豪放风格为主"},{"key":"B","text":"多写男女情爱,风格婉约"},{"key":"C","text":"语言通俗,多市井气息"},{"key":"D","text":"内容多边塞征战"}],"key":"B","answer":"多写男女情爱,风格婉约","max":1,"id":"唐诗宋词-13-single-14"},{"n":15,"type":"single","prompt":"柳永词代表宋词发展新阶段的关键原因是","options":[{"key":"A","text":"仅创作小令,形式单一"},{"key":"B","text":"大量创制长调,拓展词体"},{"key":"C","text":"内容仅写宫廷生活"},{"key":"D","text":"风格完全承袭花间词"}],"key":"B","answer":"大量创制长调,拓展词体","max":1,"id":"唐诗宋词-13-single-15"},{"n":16,"type":"multi","prompt":"下列属于宋初词风代表人物的有","options":[{"key":"A","text":"晏殊"},{"key":"B","text":"晏几道"},{"key":"C","text":"范仲淹"},{"key":"D","text":"欧阳修"},{"key":"E","text":"柳永"}],"key":"ABCDE","answer":"晏殊；晏几道；范仲淹；欧阳修；柳永","max":2,"id":"唐诗宋词-13-multi-16"},{"n":17,"type":"multi","prompt":"晏殊词的艺术特点包括","options":[{"key":"A","text":"风格雍容华贵,清新委婉"},{"key":"B","text":"善用细腻感受概括人生感触"},{"key":"C","text":"多写流连光景的轻怨淡愁"},{"key":"D","text":"语言通俗浅近,多市井俚语"},{"key":"E","text":"注重炼字炼句,含蓄凝重"}],"key":"ABCE","answer":"风格雍容华贵,清新委婉；善用细腻感受概括人生感触；多写流连光景的轻怨淡愁；注重炼字炼句,含蓄凝重","max":2,"id":"唐诗宋词-13-multi-17"},{"n":18,"type":"multi","prompt":"范仲淹《渔家傲》的艺术价值体现在","options":[{"key":"A","text":"开创宋词边塞题材先河"},{"key":"B","text":"以豪放风格突破婉约词坛"},{"key":"C","text":"善用边塞意象烘托悲壮情怀"},{"key":"D","text":"语言绮丽秾艳,辞藻华丽"},{"key":"E","text":"将家国之思与个人愁绪结合"}],"key":"ABCE","answer":"开创宋词边塞题材先河；以豪放风格突破婉约词坛；善用边塞意象烘托悲壮情怀；将家国之思与个人愁绪结合","max":2,"id":"唐诗宋词-13-multi-18"},{"n":19,"type":"multi","prompt":"柳永词对宋词发展的贡献有","options":[{"key":"A","text":"大量创制长调,拓展词体"},{"key":"B","text":"引入市井生活题材"},{"key":"C","text":"采用通俗又语,贴近民众"},{"key":"D","text":"严格遵循花间词风,不做革新"},{"key":"E","text":"善用铺叙手法,层次分明"}],"key":"ABCE","answer":"大量创制长调,拓展词体；引入市井生活题材；采用通俗又语,贴近民众；善用铺叙手法,层次分明","max":2,"id":"唐诗宋词-13-multi-19"},{"n":20,"type":"multi","prompt":"晏几道《小山词》的内容特色包括","options":[{"key":"A","text":"回忆早年与歌儿舞女的风流生活"},{"key":"B","text":"抒发对往事的低徊与悲凉哀愁"},{"key":"C","text":"多写边塞征战与家国情怀"},{"key":"D","text":"刻画细腻的男女情感"},{"key":"E","text":"内容狭隘,情调伤感"}],"key":"ABDE","answer":"回忆早年与歌儿舞女的风流生活；抒发对往事的低徊与悲凉哀愁；刻画细腻的男女情感；内容狭隘,情调伤感","max":2,"id":"唐诗宋词-13-multi-20"},{"n":21,"type":"term","prompt":"《珠玉集》","options":[],"key":"","answer":"《珠玉集》是北宋词人晏殊的词集。内容多写流连光景的轻怨淡愁与男女相思离别,如《浣溪沙》;风格雍容华贵、清新委婉,善以细腻感受概括人生感触,语言凝练含蓄。作为宋人流传后世的第一部词集,奠定了北宋婉约词的基础。","max":3,"id":"唐诗宋词-13-term-21"},{"n":22,"type":"term","prompt":"《小山词》","options":[],"key":"","answer":"《小山词》是北宋词人晏几道的词集,因号小山得名。内容多回忆早年歌酒生活,抒发往事已逝的悲凉落寞。艺术上工于言情,善以细腻笔触刻画人物心理,语言清新俊逸,情感真挚深沉;抒情深度与技巧超越其父晏殊,是宋初言情词的代表作。","max":3,"id":"唐诗宋词-13-term-22"},{"n":23,"type":"term","prompt":"《渔家傲》(范仲淹)","options":[],"key":"","answer":"《渔家傲》是范仲淹的代表作,也是宋初边塞词的开创之作。词以“塞下秋来风景异”开篇, 描绘边塞荒凉壮阔之景,抒发将士久戍思乡、难归的悲壮情怀,将家国与个人愁绪融合。风格豪放雄浑、苍凉悲壮,突破宋初婉约词风,为豪放词奠定基础。","max":3,"id":"唐诗宋词-13-term-23"},{"n":24,"type":"term","prompt":"《蝶恋花》(欧阳修)","options":[],"key":"","answer":"《蝶恋花》(庭院深深深几许)是欧阳修婉约词代表作。以“庭院深深”“杨柳堆烟”营造深闺封闭孤独之境,刻画主人公被弃的孤独苦闷与青春流逝之愁。艺术上情景交融,善用心理描写与意象象征,语言凝练含蓄,意境婉约深沉,承南唐词风。","max":3,"id":"唐诗宋词-13-term-24"},{"n":25,"type":"term","prompt":"柳永词的“俗”","options":[],"key":"","answer":"柳永词的“俗”是其显著艺术特征:一是题材俗,多写都市繁华、市井生活与妓女情态;二是语言俗,大量采用市井又语、俚语;三是情感俗,直白抒发普通人的哀乐,如《雨霖铃》。 它突破宋初词坛的雅化倾向,使词贴近民众,扩大了词的受众与题材范围。","max":3,"id":"唐诗宋词-13-term-25"},{"n":26,"type":"short","prompt":"简要概括宋初词风的主要特点。","options":[],"key":"","answer":"宋初词风主要有四大特点:一是题材集中,多写相思离别、流连光景,较少涉及重大社会题材;二是风格以婉约含蓄为主,语言趋于雅化,注重炼字炼句;三是体式以小令为主,后期柳永始大量创制长调;四是逐步突破花间南唐余绪,范仲淹引入边塞题材,柳永拓展市井内容,为宋词发展奠定基础。","max":5,"id":"唐诗宋词-13-short-26"},{"n":27,"type":"short","prompt":"以《渔家傲》为例,谈谈范仲淹的词风。","options":[],"key":"","answer":"范仲淹《渔家傲》的词风豪放雄浑、苍凉悲壮,突破了宋初婉约主导的风气。从内容看,描绘边塞荒凉壮阔之景,首次将边塞题材引入宋词;从情感看,融合将士思乡与家国责任感, 抒发久戍难归的悲壮情怀;从意象与语言看,边声、羌管等意象渲染苍凉氛围,语言雄浑有力,为豪放词派开辟道路。","max":5,"id":"唐诗宋词-13-short-27"},{"n":28,"type":"short","prompt":"以《天仙子》为例,谈谈张先的词风。","options":[],"key":"","answer":"张先《天仙子》的词风清新含蓄,尤以“影”字运用精妙著称。从意象营造看,“云破月来花弄影”以“破”写云散、“弄”赋花影动态,捕捉光影变化的瞬间美景;从情感表达看,抒发春光流逝的轻愁,含蓄不直白,以景物烘托心绪;从语言风格看,语言清丽自然,意境清新淡雅,为宋初词风增添细腻灵动的特质。","max":5,"id":"唐诗宋词-13-short-28"},{"n":29,"type":"short","prompt":"为什么说柳永词代表宋词发展的一个新阶段?","options":[],"key":"","answer":"柳永词代表宋词发展的新阶段,主要有三方面突破:一是体式革新,大量创制长调,如《雨霖铃》,打破宋初以小令为主的格局;二是题材拓展,从相思离别转向都市繁华、市井生活与羁旅之苦,扩大了词的题材范围;三是语言与手法创新,采用通俗又语,以铺叙手法展现情感,为宋词繁荣奠定基础。","max":5,"id":"唐诗宋词-13-short-29"},{"n":30,"type":"essay","prompt":"论述宋初词风的发展历程及各阶段代表人物的创作特色,并分析宋初词风对宋词发展的","options":[],"key":"","answer":"影响。 一、发展历程:(一)晏殊《珠玉集》雍容清新,奠定婉约雅化基础;晏几道《小山词》工于言情,比其父深沉。(二)范仲淹《渔家傲》首开边塞词,豪放苍凉;欧阳修婉约与疏俊兼具。(三)张先以“影”字精妙著称;柳永创制长调、题材世俗化,标志词体革新。 二、影响:(一)题材由闺阁走向边塞、市井。(二)长调兴起便于铺叙抒情。(三)婉约为主而多元并存,为两派埋下伏笔。(四)柳永使词走向民众。","max":10,"id":"唐诗宋词-13-essay-30"}],"rawMax":70},{"id":"唐诗宋词-14","title":"章节练习(11章)","questions":[{"n":1,"type":"single","prompt":"下列属于苏轼词集的是","options":[{"key":"A","text":"《淮海词》"},{"key":"B","text":"《东坡乐府》"},{"key":"C","text":"《小山词》"},{"key":"D","text":"《乐章集》"}],"key":"B","answer":"《东坡乐府》","max":1,"id":"唐诗宋词-14-single-1"},{"n":2,"type":"single","prompt":"苏轼“以诗入词”的核心内涵是","options":[{"key":"A","text":"仅在词中引用诗句,不改变词的传统题材"},{"key":"B","text":"将诗的言志功能引入词中,突破“词为艳科”局限"},{"key":"C","text":"完全模仿唐诗的格律与句式创作词"},{"key":"D","text":"仅用诗的意象创作,不注重词的音乐性"}],"key":"B","answer":"将诗的言志功能引入词中,突破“词为艳科”局限","max":1,"id":"唐诗宋词-14-single-2"},{"n":3,"type":"single","prompt":"秦观词的主要艺术风格是","options":[{"key":"A","text":"豪放雄浑,气势磅礴"},{"key":"B","text":"清丽婉约,情韵兼胜"},{"key":"C","text":"通俗浅近,市井气息"},{"key":"D","text":"绮丽秾艳, 辞藻华丽"}],"key":"B","answer":"清丽婉约,情韵兼胜","max":1,"id":"唐诗宋词-14-single-3"},{"n":4,"type":"single","prompt":"贺铸《青玉案》中,以生动景物比喻闲愁的名句是","options":[{"key":"A","text":"凌波不过横塘路,但目送,芳尘去"},{"key":"B","text":"锦瑟华年谁与度?月台花榭,琐窗朱户"},{"key":"C","text":"试问闲愁都几许?一川烟草,满城风絮,梅子黄时雨"},{"key":"D","text":"碧云冉冉蘅皋暮,彩笔新题断肠句"}],"key":"C","answer":"试问闲愁都几许?一川烟草,满城风絮,梅子黄时雨","max":1,"id":"唐诗宋词-14-single-4"},{"n":5,"type":"single","prompt":"黄庭坚《清平乐》(春归何处)的核心情感是","options":[{"key":"A","text":"对春天消逝的惋惜与怅惘"},{"key":"B","text":"对边塞征战的悲壮感慨"},{"key":"C","text":"对市井生活的热爱与赞美"},{"key":"D","text":"对宫廷奢华的批判与讽刺"}],"key":"A","answer":"对春天消逝的惋惜与怅惘","max":1,"id":"唐诗宋词-14-single-5"},{"n":6,"type":"single","prompt":"苏轼《江城子·密州出猎》中,体现报国壮志的典故是","options":[{"key":"A","text":"亲射虎,看孙郎"},{"key":"B","text":"持节云中,何日遣冯唐"},{"key":"C","text":"会挽雕弓如满月,西北望,射天狼"},{"key":"D","text":"老夫聊发少年狂,左牵黄,右擎苍"}],"key":"B","answer":"持节云中,何日遣冯唐","max":1,"id":"唐诗宋词-14-single-6"},{"n":7,"type":"single","prompt":"秦观《踏莎行·郴州旅舍》中,暗示仕途受阻、归乡无望的意象是","options":[{"key":"A","text":"雾失楼台,月迷津渡"},{"key":"B","text":"可堪孤馆闭春寒,杜鹃声里斜阳暮"},{"key":"C","text":"驿寄梅花,鱼传尺素"},{"key":"D","text":"郴江幸自绕郴山,为谁流下潇湘去"}],"key":"A","answer":"雾失楼台,月迷津渡","max":1,"id":"唐诗宋词-14-single-7"},{"n":8,"type":"single","prompt":"贺铸《鹧鸪天》(重过阊门万事非)的主要内容是","options":[{"key":"A","text":"描写都市繁华与市井生活"},{"key":"B","text":"追悼亡妻,抒发生死离别的悲痛"},{"key":"C","text":"抒发边塞征战的壮志豪情"},{"key":"D","text":"感慨仕途失意与怀才不遇"}],"key":"B","answer":"追悼亡妻,抒发生死离别的悲痛","max":1,"id":"唐诗宋词-14-single-8"},{"n":9,"type":"single","prompt":"黄庭坚《念奴娇》(断虹霁雨)中,体现词人豪迈心境的句子是","options":[{"key":"A","text":"断虹霁雨,净秋空,山染修眉新绿"},{"key":"B","text":"桂影扶疏,谁便道,今夕清辉不足"},{"key":"C","text":"老子平生,江南江北,最爱临风笛"},{"key":"D","text":"孙郎微笑,坐来声喷霜竹"}],"key":"C","answer":"老子平生,江南江北,最爱临风笛","max":1,"id":"唐诗宋词-14-single-9"},{"n":10,"type":"single","prompt":"苏轼《水调歌头·明月几时有》的创作背景是","options":[{"key":"A","text":"被贬黄州,抒发怀才不遇之情"},{"key":"B","text":"中秋夜怀念弟弟苏辙,抒发离愁与人生思考"},{"key":"C","text":"游览赤壁,感慨历史兴亡"},{"key":"D","text":"送别友人,表达依依不舍之情"}],"key":"B","answer":"中秋夜怀念弟弟苏辙,抒发离愁与人生思考","max":1,"id":"唐诗宋词-14-single-10"},{"n":11,"type":"single","prompt":"秦观《鹊桥仙》中,突破传统七夕词悲叹离别局限的名句是","options":[{"key":"A","text":"纤云弄巧,飞星传恨,银汉迢迢暗度"},{"key":"B","text":"金风玉露一相逢,便胜却人间无数"},{"key":"C","text":"柔情似水,佳期如梦,忍顾鹊桥归路"},{"key":"D","text":"两情若是久长时,又岂在朝朝暮暮"}],"key":"D","answer":"两情若是久长时,又岂在朝朝暮暮","max":1,"id":"唐诗宋词-14-single-11"},{"n":12,"type":"single","prompt":"贺铸被称为“贺梅子”的原因是","options":[{"key":"A","text":"善写梅花,如《踏莎行·芳心苦》咏红莲以梅为衬"},{"key":"B","text":"《青玉案》中“梅子黄时雨”一句以梅子喻愁,精妙传神"},{"key":"C","text":"词作多以梅子为核心意象,风格清新"},{"key":"D","text":"晚年隐居种梅,以梅花自喻高洁品格"}],"key":"B","answer":"《青玉案》中“梅子黄时雨”一句以梅子喻愁,精妙传神","max":1,"id":"唐诗宋词-14-single-12"},{"n":13,"type":"single","prompt":"黄庭坚词风受苏轼影响,其词的主要特色是","options":[{"key":"A","text":"清丽婉约,情致缠绵"},{"key":"B","text":"豪放雄浑,气势壮阔"},{"key":"C","text":"清奇瘦劲,善用典故"},{"key":"D","text":"通俗浅近, 多市井语"}],"key":"C","answer":"清奇瘦劲,善用典故","max":1,"id":"唐诗宋词-14-single-13"},{"n":14,"type":"single","prompt":"苏轼《定风波·莫听穿林打叶声》中,体现旷达人生态度的句子是","options":[{"key":"A","text":"莫听穿林打叶声,何妨吟啸且徐行"},{"key":"B","text":"竹杖芒鞋轻胜马,谁怕?一蓑烟雨任平生"},{"key":"C","text":"料峭春风吹酒醒,微冷,山头斜照却相迎"},{"key":"D","text":"回首向来萧瑟处,归去,也无风雨也无晴"}],"key":"B","answer":"竹杖芒鞋轻胜马,谁怕?一蓑烟雨任平生","max":1,"id":"唐诗宋词-14-single-14"},{"n":15,"type":"single","prompt":"秦观《满庭芳》(山抹微云)中,被苏轼批评为“学柳七语”的句子是","options":[{"key":"A","text":"山抹微云,天黏衰草,画角声断谯门"},{"key":"B","text":"暂停征棹,聊共引离尊"},{"key":"C","text":"销魂,当此际,香囊暗解,罗带轻分"},{"key":"D","text":"伤情处,高城望断,灯火已黄昏"}],"key":"C","answer":"销魂,当此际,香囊暗解,罗带轻分","max":1,"id":"唐诗宋词-14-single-15"},{"n":16,"type":"multi","prompt":"下列属于苏轼对宋词革新的表现有","options":[{"key":"A","text":"将诗的言志功能引入词中,突破“词为艳科”局限"},{"key":"B","text":"拓展词的题材,涵盖怀古、咏史、田园、悼亡等"},{"key":"C","text":"风格多样化,兼具豪放、婉约、清丽等"},{"key":"D","text":"严格遵循花间词风,不做任何创新"},{"key":"E","text":"善用典故与诗文句法,推动词的散文化"}],"key":"ABCE","answer":"将诗的言志功能引入词中,突破“词为艳科”局限；拓展词的题材,涵盖怀古、咏史、田园、悼亡等；风格多样化,兼具豪放、婉约、清丽等；善用典故与诗文句法,推动词的散文化","max":2,"id":"唐诗宋词-14-multi-16"},{"n":17,"type":"multi","prompt":"秦观词的艺术特色包括","options":[{"key":"A","text":"善营造凄婉动人的意境,情景交融"},{"key":"B","text":"语言清丽婉约,情韵兼胜"},{"key":"C","text":"构思新巧,如《鹊桥仙》突破传统七夕词局限"},{"key":"D","text":"题材仅局限于男女情爱,内容狭窄"},{"key":"E","text":"善用比喻与象征,表达细腻情感"}],"key":"ABCE","answer":"善营造凄婉动人的意境,情景交融；语言清丽婉约,情韵兼胜；构思新巧,如《鹊桥仙》突破传统七夕词局限；善用比喻与象征,表达细腻情感","max":2,"id":"唐诗宋词-14-multi-17"},{"n":18,"type":"multi","prompt":"贺铸词的创作特点有","options":[{"key":"A","text":"风格多样,兼具婉约深微与豪放之气"},{"key":"B","text":"善用典故与前人诗句,如《青玉案》化用李商隐诗意"},{"key":"C","text":"《鹧鸪天》(重过阊门万事非)悼亡情感真挚,白描见长"},{"key":"D","text":"仅创作小令,不涉及长调"},{"key":"E","text":"部分词作表现壮志难酬的愤懑,如《六州歌头》"}],"key":"ABCE","answer":"风格多样,兼具婉约深微与豪放之气；善用典故与前人诗句,如《青玉案》化用李商隐诗意；《鹧鸪天》(重过阊门万事非)悼亡情感真挚,白描见长；部分词作表现壮志难酬的愤懑,如《六州歌头》","max":2,"id":"唐诗宋词-14-multi-18"},{"n":19,"type":"multi","prompt":"黄庭坚词的艺术特征包括","options":[{"key":"A","text":"受苏轼影响,有豪放之作,如《念奴娇》(断虹霁雨)"},{"key":"B","text":"语言清奇瘦劲,善用典故与书面语"},{"key":"C","text":"部分词作风格婉约,如《清平乐》(春归何处)"},{"key":"D","text":"完全模仿唐诗,缺乏自身特色"},{"key":"E","text":"善从日常生活中提炼哲理,如《虞美人》(天涯也有江南信)"}],"key":"ABCE","answer":"受苏轼影响,有豪放之作,如《念奴娇》(断虹霁雨)；语言清奇瘦劲,善用典故与书面语；部分词作风格婉约,如《清平乐》(春归何处)；善从日常生活中提炼哲理,如《虞美人》(天涯也有江南信)","max":2,"id":"唐诗宋词-14-multi-19"},{"n":20,"type":"multi","prompt":"苏轼《念奴娇·赤壁怀古》的艺术特色有","options":[{"key":"A","text":"意境雄浑壮阔,如“大江东去,浪淘尽”"},{"key":"B","text":"以怀古抒情,融合历史感慨与个人情怀"},{"key":"C","text":"善用夸张与比喻,如“乱石穿空,惊涛拍岸”"},{"key":"D","text":"语言通俗浅近,多市井俚语"},{"key":"E","text":"结尾以“人间如梦,一尊还酹江月”抒发超脱旷达之情"}],"key":"ABCE","answer":"意境雄浑壮阔,如“大江东去,浪淘尽”；以怀古抒情,融合历史感慨与个人情怀；善用夸张与比喻,如“乱石穿空,惊涛拍岸”；结尾以“人间如梦,一尊还酹江月”抒发超脱旷达之情","max":2,"id":"唐诗宋词-14-multi-20"},{"n":21,"type":"term","prompt":"《东坡乐府》","options":[],"key":"","answer":"《东坡乐府》是北宋词人苏轼的词集,收录现存词二百余首。内容涵盖怀古咏史、抒情言志、田园、悼亡等,突破“词为艳科”的局限。风格多样,既有豪放雄浑,也有婉约深沉;善用典故与诗文句法,推动词的诗化与散文化,是宋词革新的重要文献。","max":3,"id":"唐诗宋词-14-term-21"},{"n":22,"type":"term","prompt":"“以诗入词”","options":[],"key":"","answer":"“以诗入词”是苏轼对宋词的核心革新主张,指将诗歌的言志功能、题材及表现手法引入词中。苏轼以词抒写家国情怀、人生哲理与历史感慨,突破“词为艳科”的局限;同时借鉴诗的用典、议论等手法,提升词的文学地位,为宋词发展开辟新路径。","max":3,"id":"唐诗宋词-14-term-22"},{"n":23,"type":"term","prompt":"《淮海词》","options":[],"key":"","answer":"《淮海词》是北宋词人秦观的词集,因秦观号淮海居士而得名。内容多抒男女相思、贬谪之苦与身世之感,如《踏莎行·郴州旅舍》。艺术上清丽婉约、情韵兼胜,善营造凄婉意境, 语言精炼含蓄,善用比喻象征,情感细腻真挚,是婉约派正宗之作。","max":3,"id":"唐诗宋词-14-term-23"},{"n":24,"type":"term","prompt":"贺铸《青玉案》","options":[],"key":"","answer":"贺铸《青玉案》是北宋婉约词名篇,写“凌波不过横塘路”之怅惘。上片写目送佳人,以“凌波”写其身影;下片抒闲愁,以“烟草”“风絮”“梅雨”等具象景物,化抽象闲愁为可感意象。 语言凝练,意境含蓄,既见婉约细腻,又暗含壮志难酬的愤懑,是以景喻情的典范。","max":3,"id":"唐诗宋词-14-term-24"},{"n":25,"type":"term","prompt":"黄庭坚《清平乐》(春归何处)","options":[],"key":"","answer":"黄庭坚《清平乐》(春归何处)是北宋婉约词佳作,以“春归何处”开篇,通过追问春踪、探寻黄鹂,抒发春逝的惋惜怅惘。上片以拟人写盼春留春,下片以黄鹂无知、蔷薇盛开暗示春去。语言清新,构思巧妙,把伤春之情融入景物,体现清奇瘦劲的词风。","max":3,"id":"唐诗宋词-14-term-25"},{"n":26,"type":"short","prompt":"简要概括苏轼对宋词的主要革新体现在哪些方面?","options":[],"key":"","answer":"苏轼对宋词的革新有三方面:一是题材拓展,突破“词为艳科”局限,把词从男女情爱、光景扩展到怀古咏史、家国情怀、人生哲理与田园生活;二是风格多样,打破婉约词主导格局, 开创豪放词风,兼有婉约之作;三是手法革新,以诗入词,把诗的言志、用典与议论引入词中,推动词的散文化,提升词的文学地位。","max":5,"id":"唐诗宋词-14-short-26"},{"n":27,"type":"short","prompt":"举例说明秦观词的艺术特色。","options":[],"key":"","answer":"秦观词的艺术特色有三方面:一是清丽婉约,善营造凄婉意境,如《踏莎行·郴州旅舍》以 “雾失楼台,月迷津渡”勾勒迷茫孤寂的贬谪环境,烘托失意心境;二是情景交融,如《满庭芳》把夕阳、寒鸦等秋景与离愁别绪融合,景中含情;三是构思新巧,如《鹊桥仙》跳出七夕词悲叹离别的框架,提出爱情新境界,含蓄深沉。","max":5,"id":"唐诗宋词-14-short-27"},{"n":28,"type":"short","prompt":"以贺铸《浣溪沙》为例,谈谈贺铸的词风。","options":[],"key":"","answer":"贺铸《浣溪沙》体现其词风兼具婉约细腻与含蓄深沉。词以“四弦声怨却沉吟”等细节刻画女主人公怀人的孤寂怅惘,语言含蓄,情感细腻;“燕飞人静画堂深”以燕飞反衬画堂寂静,情景交融,烘托内心落寞;词中“一从灯夜到如今”暗含时光流逝之感,透出贺铸的身世之叹, 可见其婉约中藏深沉。","max":5,"id":"唐诗宋词-14-short-28"},{"n":29,"type":"short","prompt":"以黄庭坚《清平乐》为例,谈谈黄庭坚的词风。","options":[],"key":"","answer":"黄庭坚《清平乐》(春归何处)体现其清奇瘦劲、含蓄深沉的词风。一是语言清奇,避免浓艳辞藻,以“春归何处”等直白质朴的语言追问春踪;二是构思瘦劲,围绕寻春展开,上片盼春留春,下片以黄鹂无知、蔷薇盛开暗示春去,结构紧凑;三是情感含蓄,不直抒伤春之痛,而把惋惜怅惘融入景物,余味悠长。","max":5,"id":"唐诗宋词-14-short-29"},{"n":30,"type":"essay","prompt":"论述苏轼“以诗入词”的内涵、实践及其对宋词发展的影响,并结合具体词作分析。","options":[],"key":"","answer":"一、内涵:打破“词为艳科”桎梏,融诗精神于词,变娱宾遣兴为言志,题材引入怀古、咏史、田园、悼亡等,手法融用典议论并推动散文化。 二、实践:怀古咏史如《念奴娇·赤壁怀古》,家国情怀如《江城子·密州出猎》,人生哲理、悼亡如《水调歌头》《江城子》。 三、影响:题材走向人生;风格上开创豪放词派,婉约豪放并存;体式上推动散文化;使词变为士大夫之词。","max":10,"id":"唐诗宋词-14-essay-30"}],"rawMax":70},{"id":"唐诗宋词-15","title":"章节练习(12章)","questions":[{"n":1,"type":"single","prompt":"下列属于周邦彦词集的是","options":[{"key":"A","text":"《淮海词》"},{"key":"B","text":"《清真词》"},{"key":"C","text":"《小山词》"},{"key":"D","text":"《乐章集》"}],"key":"B","answer":"《清真词》","max":1,"id":"唐诗宋词-15-single-1"},{"n":2,"type":"single","prompt":"周邦彦词在音律上的突出特点是","options":[{"key":"A","text":"完全遵循晚唐旧调,不做任何创新"},{"key":"B","text":"仅注重平仄,不关注四声分辨"},{"key":"C","text":"严分平上去入,善用四声变化,且能依音乐需求灵活调整"},{"key":"D","text":"忽视音律,多为“句读不葺之诗”"}],"key":"C","answer":"严分平上去入,善用四声变化,且能依音乐需求灵活调整","max":1,"id":"唐诗宋词-15-single-2"},{"n":3,"type":"single","prompt":"李之仪《卜算子》中,体现“富有六朝唐代乐府天籁”的名句是","options":[{"key":"A","text":"我住长江头,君住长江尾"},{"key":"B","text":"日日思君不见君,共饮长江水"},{"key":"C","text":"此水几时休,此恨何时已"},{"key":"D","text":"只愿君心似我心,定不负相思意"}],"key":"A","answer":"我住长江头,君住长江尾","max":1,"id":"唐诗宋词-15-single-3"},{"n":4,"type":"single","prompt":"周邦彦《苏幕遮》中,被王国维赞为“真能得荷之神理”的句子是","options":[{"key":"A","text":"燎沉香,消溽暑"},{"key":"B","text":"鸟雀呼晴,侵晓窥檐语"},{"key":"C","text":"叶上初阳干宿雨,水面清圆,一一风荷举"},{"key":"D","text":"故乡遥,何日去"}],"key":"C","answer":"叶上初阳干宿雨,水面清圆,一一风荷举","max":1,"id":"唐诗宋词-15-single-4"},{"n":5,"type":"single","prompt":"周邦彦《兰陵王·柳》中,通过柳与送别关联,暗写羁旅之愁的句子是","options":[{"key":"A","text":"柳阴直,烟里丝丝弄碧"},{"key":"B","text":"隋堤上,曾见几番,拂水飘绵送行色"},{"key":"C","text":"登临望故国,谁识京华倦客"},{"key":"D","text":"长亭路,年去岁来,应折柔条过千尺"}],"key":"D","answer":"长亭路,年去岁来,应折柔条过千尺","max":1,"id":"唐诗宋词-15-single-5"},{"n":6,"type":"single","prompt":"下列词人中,其词“善融化唐人诗句,借字用意有来历且无痕迹”的是","options":[{"key":"A","text":"柳永"},{"key":"B","text":"周邦彦"},{"key":"C","text":"苏轼"},{"key":"D","text":"李清照"}],"key":"B","answer":"周邦彦","max":1,"id":"唐诗宋词-15-single-6"},{"n":7,"type":"single","prompt":"李之仪《卜算子》被称为“富有六朝唐代乐府天籁”,主要因","options":[{"key":"A","text":"大量使用典故,辞藻华丽"},{"key":"B","text":"语言直白质朴,情感真挚,符合乐府民歌特质"},{"key":"C","text":"严格遵循词牌格律,音律严谨"},{"key":"D","text":"多描写宫廷生活,风格绮靡"}],"key":"B","answer":"语言直白质朴,情感真挚,符合乐府民歌特质","max":1,"id":"唐诗宋词-15-single-7"},{"n":8,"type":"single","prompt":"周邦彦《瑞龙吟·大石春景》的结构特点是","options":[{"key":"A","text":"松散随意,无明确层次"},{"key":"B","text":"前两片为“双拽头”,第三片为过片,层层脱换,首尾照应"},{"key":"C","text":"仅为单调,无分片"},{"key":"D","text":"多为议论,缺乏情景融合"}],"key":"B","answer":"前两片为“双拽头”,第三片为过片,层层脱换,首尾照应","max":1,"id":"唐诗宋词-15-single-8"},{"n":9,"type":"single","prompt":"下列作品中,属于周邦彦自度曲的是","options":[{"key":"A","text":"《卜算子》(我住长江头)"},{"key":"B","text":"《苏幕遮》(燎沉香)"},{"key":"C","text":"《兰陵王·柳》"},{"key":"D","text":"《菩萨蛮》(平林漠漠烟如织)"}],"key":"C","answer":"《兰陵王·柳》","max":1,"id":"唐诗宋词-15-single-9"},{"n":10,"type":"single","prompt":"周邦彦《齐天乐》中,通过描写蟋蟀声烘托离人悲秋的句子是","options":[{"key":"A","text":"庾郎先自吟愁赋,凄凄更闻私语"},{"key":"B","text":"露湿铜铺,苔侵石井,都是曾听伊处"},{"key":"C","text":"哀音似诉,正思妇无眠,起寻机杼"},{"key":"D","text":"西窗又吹暗雨,为谁频断续,相和砧杵"}],"key":"D","answer":"西窗又吹暗雨,为谁频断续,相和砧杵","max":1,"id":"唐诗宋词-15-single-10"},{"n":11,"type":"single","prompt":"下列对周邦彦词“律度”的理解,正确的是","options":[{"key":"A","text":"仅关注词的字数,不重视韵位"},{"key":"B","text":"每个词调的韵位、分片、句式均严格固定,不可变动"},{"key":"C","text":"根据曲谱定乐段乐句,依律填词,韵位与乐曲均拍位置多一致"},{"key":"D","text":"忽视词与音乐的配合,仅为书面文学"}],"key":"C","answer":"根据曲谱定乐段乐句,依律填词,韵位与乐曲均拍位置多一致","max":1,"id":"唐诗宋词-15-single-11"},{"n":12,"type":"single","prompt":"李之仪《卜算子》中,将“水”与“恨”关联,深化相思之情的句子是","options":[{"key":"A","text":"日日思君不见君,共饮长江水"},{"key":"B","text":"此水几时休,此恨何时已"},{"key":"C","text":"只愿君心似我心,定不负相思意"},{"key":"D","text":"我住长江头,君住长江尾"}],"key":"B","answer":"此水几时休,此恨何时已","max":1,"id":"唐诗宋词-15-single-12"},{"n":13,"type":"single","prompt":"周邦彦《满庭芳》中,体现“炼字精妙,善写物态”的句子是","options":[{"key":"A","text":"风老莺雏,雨肥梅子,午阴嘉树清圆"},{"key":"B","text":"地卑山近,衣润费炉烟"},{"key":"C","text":"人静乌鸢自乐,小桥外、新绿溅溅"},{"key":"D","text":"凭栏久,黄芦苦竹,拟泛九江船"}],"key":"A","answer":"风老莺雏,雨肥梅子,午阴嘉树清圆","max":1,"id":"唐诗宋词-15-single-13"},{"n":14,"type":"single","prompt":"下列词人中,其词“被视为北宋末最本色当行,集苏秦各家之长”的是","options":[{"key":"A","text":"秦观"},{"key":"B","text":"周邦彦"},{"key":"C","text":"柳永"},{"key":"D","text":"晏几道"}],"key":"B","answer":"周邦彦","max":1,"id":"唐诗宋词-15-single-14"},{"n":15,"type":"single","prompt":"周邦彦《夜游宫》中,通过梦境写怀人之情的句子是","options":[{"key":"A","text":"叶下斜阳照水,卷轻浪、沉沉千里"},{"key":"B","text":"桥上酸风射眸子,立多时,看黄昏、灯火市"},{"key":"C","text":"古屋寒窗底,听几片、井桐飞坠"},{"key":"D","text":"此时情绪此时天,无事小神仙"}],"key":"B","answer":"桥上酸风射眸子,立多时,看黄昏、灯火市","max":1,"id":"唐诗宋词-15-single-15"},{"n":16,"type":"multi","prompt":"下列属于周邦彦《清真词》特点的有","options":[{"key":"A","text":"律度严整,严分平上去入,四声运用灵活"},{"key":"B","text":"善融化唐人诗句,借字用意有来历且无痕迹"},{"key":"C","text":"艺术构思精巧,长调结构严密,首尾照应"},{"key":"D","text":"仅写男女情爱,题材狭窄"},{"key":"E","text":"语言典雅,风格浑厚和雅,避免俚俗"}],"key":"ABCE","answer":"律度严整,严分平上去入,四声运用灵活；善融化唐人诗句,借字用意有来历且无痕迹；艺术构思精巧,长调结构严密,首尾照应；语言典雅,风格浑厚和雅,避免俚俗","max":2,"id":"唐诗宋词-15-multi-16"},{"n":17,"type":"multi","prompt":"李之仪《卜算子》被称为“宋代文人词中最富有六朝唐代乐府天籁”的原因有","options":[{"key":"A","text":"语言直白质朴,无过多修饰,如民歌般自然"},{"key":"B","text":"情感真挚纯粹,不矫揉造作,符合乐府抒情特质"},{"key":"C","text":"以长江为纽带连接相思双方,构思简洁,类似乐府民歌的直白抒情"},{"key":"D","text":"严格遵循词牌格律,音律严谨"},{"key":"E","text":"大量使用典故,辞藻华丽"}],"key":"ABC","answer":"语言直白质朴,无过多修饰,如民歌般自然；情感真挚纯粹,不矫揉造作,符合乐府抒情特质；以长江为纽带连接相思双方,构思简洁,类似乐府民歌的直白抒情","max":2,"id":"唐诗宋词-15-multi-17"},{"n":18,"type":"multi","prompt":"周邦彦在词的律化方面的贡献包括","options":[{"key":"A","text":"创制新调与自度曲,音韵清雅,为文人雅士所乐用"},{"key":"B","text":"增演慢曲、引、近等长调,发展犯调、偷声、添字等变格"},{"key":"C","text":"严分平上去入,完善词的字声运用,影响后世词律家"},{"key":"D","text":"推动词与音乐的紧密配合, 依曲谱填词,注重韵位与均拍的协调"},{"key":"E","text":"完全摒弃传统词调,仅使用自创词牌"}],"key":"ABCD","answer":"创制新调与自度曲,音韵清雅,为文人雅士所乐用；增演慢曲、引、近等长调,发展犯调、偷声、添字等变格；严分平上去入,完善词的字声运用,影响后世词律家；推动词与音乐的紧密配合, 依曲谱填词,注重韵位与均拍的协调","max":2,"id":"唐诗宋词-15-multi-18"},{"n":19,"type":"multi","prompt":"下列作品中,属于周邦彦咏物词的有","options":[{"key":"A","text":"《苏幕遮》(燎沉香)"},{"key":"B","text":"《兰陵王·柳》"},{"key":"C","text":"《齐天乐》(庾郎先自吟愁赋)"},{"key":"D","text":"《瑞龙吟·大石春景》"},{"key":"E","text":"《满庭芳》(风老莺雏)"}],"key":"ABC","answer":"《苏幕遮》(燎沉香)；《兰陵王·柳》；《齐天乐》(庾郎先自吟愁赋)","max":2,"id":"唐诗宋词-15-multi-19"},{"n":20,"type":"multi","prompt":"北宋中后期其他词人的作品中,体现“构思新巧”的有","options":[{"key":"A","text":"李之仪《卜算子》以长江为纽带写相思"},{"key":"B","text":"王观《卜算子》(水是眼波横)以眉眼喻山水"},{"key":"C","text":"李重元《忆王孙·春词》以“雨打梨花深闭门”写闺愁"},{"key":"D","text":"曹组《卜算子·咏兰》以“着意闻时不肯香,香在无心处”写兰"},{"key":"E","text":"无名氏《御街行》(霜风渐紧寒侵被)托大雁传情却劝雁轻飞"}],"key":"ABCDE","answer":"李之仪《卜算子》以长江为纽带写相思；王观《卜算子》(水是眼波横)以眉眼喻山水；李重元《忆王孙·春词》以“雨打梨花深闭门”写闺愁；曹组《卜算子·咏兰》以“着意闻时不肯香,香在无心处”写兰；无名氏《御街行》(霜风渐紧寒侵被)托大雁传情却劝雁轻飞","max":2,"id":"唐诗宋词-15-multi-20"},{"n":21,"type":"term","prompt":"《清真词》","options":[],"key":"","answer":"《清真词》是北宋词人周邦彦的词集,律度严整,严分平上去入,又依乐调整;善融化唐人诗句,借字用意有来历无痕迹;长调结构严密、首尾照应;题材涵盖羁旅、咏物、怀古,语言典雅。它集北宋词家之长,对南宋姜夔、吴文英等格律派影响深远。","max":3,"id":"唐诗宋词-15-term-21"},{"n":22,"type":"term","prompt":"词的律化","options":[],"key":"","answer":"词的律化指词发展中逐渐形成严格的音律规范,包括字声、韵位、句式等。周邦彦是关键人物,严分四声,完善字声运用;依曲谱填词,注重韵位与均拍协调;创制新调,发展犯调、 偷声等变格。它提升艺术规范性,推动词的士大夫化,奠定格律派基础。","max":3,"id":"唐诗宋词-15-term-22"},{"n":23,"type":"term","prompt":"李之仪《卜算子》","options":[],"key":"","answer":"李之仪《卜算子》是北宋中后期富有乐府天籁的词作。语言直白质朴,“长江头”“长江尾”等句借鉴六朝唐代乐府民歌风格;情感真挚纯粹,以长江为纽带连接相思双方;构思简洁,无过多修饰,是宋代文人词中融合民间乐府风格的典范。","max":3,"id":"唐诗宋词-15-term-23"},{"n":24,"type":"term","prompt":"犯调","options":[],"key":"","answer":"犯调是宋代词调的一种变格,指一首词中融入两个以上不同宫调的旋律段落,通过转调形成新的曲调和词调。周邦彦精通音律,善用犯调,丰富词的音乐表现力。它是词律化的重要体现,拓展了词调的音乐容量,对后世格律派词人有重要影响。","max":3,"id":"唐诗宋词-15-term-24"},{"n":25,"type":"term","prompt":"“炼字”(周邦彦词中)","options":[],"key":"","answer":"周邦彦词中的“炼字”指其对字词的精准选择与运用,注重通过字词刻画事物形态、传递情感。如《苏幕遮》的“清圆”“举”精准描绘荷叶的形态与迎风之姿,使描写更传神,增强表现力,是周邦彦词字工句丽的重要体现。","max":3,"id":"唐诗宋词-15-term-25"},{"n":26,"type":"short","prompt":"简要说明周邦彦《清真词》在音律方面的特点。","options":[],"key":"","answer":"周邦彦《清真词》在音律方面有三特点:一是严分字声,继承温、晏、柳的分辨,更严分平上去入,四声运用富于变化,读来声韵和谐;二是灵活依乐,注重音律规范而不死守四声, 依乐曲需求适当放宽,避免因律害意;三是完善词调,创制新调与自度曲五十多首,发展犯调、偷声等变格,推动词律体系成熟。","max":5,"id":"唐诗宋词-15-short-26"},{"n":27,"type":"short","prompt":"为什么说李之仪《卜算子》是宋代文人词中最富有六朝唐代乐府天籁的作品?","options":[],"key":"","answer":"李之仪《卜算子》富乐府天籁,原因有三:一是语言直白质朴,无华丽辞藻,类似六朝唐代乐府民歌的直白表述;二是情感真挚纯粹,直接抒发相思,不矫揉造作,与乐府民歌感于哀乐、缘事而发一致;三是构思简洁自然,以长江为纽带连接相思双方,借自然物象传情,无复杂情节而含深厚情感。","max":5,"id":"唐诗宋词-15-short-27"},{"n":28,"type":"short","prompt":"简要概括周邦彦在词的律化方面的贡献。","options":[],"key":"","answer":"周邦彦在词的律化方面有四方面贡献:一是完善字声体系,严分平上去入,使音律更精准; 二是丰富词调形式,创制新调与自度曲,增演长调,发展犯调、偷声等变格;三是推动词乐配合,依曲谱填词,注重韵位与均拍的协调;四是树立律词典范,《清真词》集北宋词律化之大成,影响姜夔、吴文英等格律派词人。","max":5,"id":"唐诗宋词-15-short-28"},{"n":29,"type":"short","prompt":"举例说明周邦彦词“善融化唐人诗句”的特点。","options":[],"key":"","answer":"周邦彦词善融化唐人诗句,借字用意有来历而无痕迹。如《西河·金陵怀古》化用刘禹锡 《石头城》《乌衣巷》的诗境,以“山围故国”等句把历史沧桑融入词的怀古主题;《苏幕遮》借鉴杜甫写荷叶的形态,化用王维雨后意境而浑然天成,无刻意痕迹,使词兼具唐诗的意境与词的韵味。","max":5,"id":"唐诗宋词-15-short-29"},{"n":30,"type":"essay","prompt":"论述周邦彦《清真词》的艺术特色及其对宋词律化的影响,并结合具体词作分析。","options":[],"key":"","answer":"一、艺术特色:律度严整,严分平上去入又依乐调,如《兰陵王·柳》;融诗入词,用典无痕,如《西河·金陵怀古》;结构缜密,长调首尾呼应,如《瑞龙吟》;语言典雅,炼字精工,如《苏幕遮》。 二、对词律化的影响:完善词律体系,确立字声、韵位规范,创制新调自度曲与犯调等变格;推动词的雅化,题材拓展到怀古、咏物、羁旅,使词与诗并列;成为格律派源头,姜夔、吴文英、张炎以《清真词》为宗。","max":10,"id":"唐诗宋词-15-essay-30"}],"rawMax":70},{"id":"唐诗宋词-16","title":"章节练习(13章)","questions":[{"n":1,"type":"single","prompt":"下列属于李清照词集的是","options":[{"key":"A","text":"《乐章集》"},{"key":"B","text":"《漱玉词》"},{"key":"C","text":"《淮海词》"},{"key":"D","text":"《清真词》"}],"key":"B","answer":"《漱玉词》","max":1,"id":"唐诗宋词-16-single-1"},{"n":2,"type":"single","prompt":"李清照在《词论》中提出的核心观点是","options":[{"key":"A","text":"词“别是一家”,需与诗区分,讲究音律与典雅"},{"key":"B","text":"词应“以诗为词”,打破诗词界限"},{"key":"C","text":"词需“豪放雄浑”,摒弃婉约风格"},{"key":"D","text":"词可随意创作,无需遵循音律"}],"key":"A","answer":"词“别是一家”,需与诗区分,讲究音律与典雅","max":1,"id":"唐诗宋词-16-single-2"},{"n":3,"type":"single","prompt":"下列词句出自李清照《醉花阴》的是","options":[{"key":"A","text":"“此情无计可消除,才下眉头,却上心头”"},{"key":"B","text":"“莫道不消魂,帘卷西风,人比黄花瘦”"},{"key":"C","text":"“知否,知否?应是绿肥红瘦”"},{"key":"D","text":"“寻寻觅觅,冷冷清清,凄凄惨惨戚戚”"}],"key":"B","answer":"“莫道不消魂,帘卷西风,人比黄花瘦”","max":1,"id":"唐诗宋词-16-single-3"},{"n":4,"type":"single","prompt":"朱敦儒《好事近·渔父词》中,体现“旷逸散淡”风格的句子是","options":[{"key":"A","text":"“摇首出红尘,醒醉更无时节”"},{"key":"B","text":"“千里水天一色,看孤鸿明灭”"},{"key":"C","text":"“活计绿蓑青笠,惯披霜冲雪”"},{"key":"D","text":"“晚来风定钓丝闲,上下是新月”"}],"key":"A","answer":"“摇首出红尘,醒醉更无时节”","max":1,"id":"唐诗宋词-16-single-4"},{"n":5,"type":"single","prompt":"岳飞《满江红》中,表达收复中原壮志的句子是","options":[{"key":"A","text":"“三十功名尘与土,八千里路云和月”"},{"key":"B","text":"“靖康耻,犹未雪;臣子恨,何时灭”"},{"key":"C","text":"“驾长车,踏破贺兰山缺”"},{"key":"D","text":"“待从头,收拾旧山河,朝天阙”"}],"key":"D","answer":"“待从头,收拾旧山河,朝天阙”","max":1,"id":"唐诗宋词-16-single-5"},{"n":6,"type":"single","prompt":"李清照前期词的主要题材是","options":[{"key":"A","text":"家国兴亡之痛"},{"key":"B","text":"闺情与伤春伤别"},{"key":"C","text":"羁旅漂泊之苦"},{"key":"D","text":"边塞征战之情"}],"key":"B","answer":"闺情与伤春伤别","max":1,"id":"唐诗宋词-16-single-6"},{"n":7,"type":"single","prompt":"下列对朱敦儒《好事近·渔父词》的理解,正确的是","options":[{"key":"A","text":"词中渔父形象体现积极入世的人生态度"},{"key":"B","text":"全词以浓艳辞藻描绘渔父生活"},{"key":"C","text":"词风旷逸散淡,表达对尘世的超脱"},{"key":"D","text":"主要抒发对官场生活的向往"}],"key":"C","answer":"词风旷逸散淡,表达对尘世的超脱","max":1,"id":"唐诗宋词-16-single-7"},{"n":8,"type":"single","prompt":"李清照《声声慢》中,开篇连用七组叠字的作用是","options":[{"key":"A","text":"单纯追求语言技巧,无实际情感"},{"key":"B","text":"渲染凄凉氛围,强化孤独愁苦之情"},{"key":"C","text":"模仿民歌风格,增加又语化色彩"},{"key":"D","text":"使句式整齐,符合律诗格律"}],"key":"B","answer":"渲染凄凉氛围,强化孤独愁苦之情","max":1,"id":"唐诗宋词-16-single-8"},{"n":9,"type":"single","prompt":"岳飞《满江红》中,“靖康耻”所指的历史事件是","options":[{"key":"A","text":"安史之乱"},{"key":"B","text":"北宋灭亡,徽钦二帝被俘"},{"key":"C","text":"永嘉之乱"},{"key":"D","text":"陈桥兵变"}],"key":"B","answer":"北宋灭亡,徽钦二帝被俘","max":1,"id":"唐诗宋词-16-single-9"},{"n":10,"type":"single","prompt":"李清照《词论》中,批评苏轼词的主要原因是","options":[{"key":"A","text":"苏轼词语言俚俗,不够典雅"},{"key":"B","text":"苏轼词“句读不葺之诗”,不协音律"},{"key":"C","text":"苏轼词题材狭窄,仅写男女情爱"},{"key":"D","text":"苏轼词风格豪放,不符合婉约传统"}],"key":"B","answer":"苏轼词“句读不葺之诗”,不协音律","max":1,"id":"唐诗宋词-16-single-10"},{"n":11,"type":"single","prompt":"下列词句中,出自朱敦儒《好事近·渔父词》的是","options":[{"key":"A","text":"“西塞山前白鹭飞,桃花流水鳜鱼肥”"},{"key":"B","text":"“活计绿蓑青笠,惯披霜冲雪”"},{"key":"C","text":"“孤舟蓑笠翁,独钓寒江雪”"},{"key":"D","text":"“君看一叶舟,出没风波里”"}],"key":"B","answer":"“活计绿蓑青笠,惯披霜冲雪”","max":1,"id":"唐诗宋词-16-single-11"},{"n":12,"type":"single","prompt":"李清照后期词风发生变化的主要原因是","options":[{"key":"A","text":"个人创作风格的自然转变"},{"key":"B","text":"南渡后国破家亡的经历"},{"key":"C","text":"受苏轼豪放词风的影响"},{"key":"D","text":"对晚唐花间词风的回归"}],"key":"B","answer":"南渡后国破家亡的经历","max":1,"id":"唐诗宋词-16-single-12"},{"n":13,"type":"single","prompt":"岳飞《满江红》中,“三十功名尘与土,八千里路云和月”体现的情感是","options":[{"key":"A","text":"对功名的极度追求"},{"key":"B","text":"对征战历程的感慨与对功名的淡泊"},{"key":"C","text":"对官场黑暗的不满"},{"key":"D","text":"对家乡的深切思念"}],"key":"B","answer":"对征战历程的感慨与对功名的淡泊","max":1,"id":"唐诗宋词-16-single-13"},{"n":14,"type":"single","prompt":"下列词人中,属于南渡之际,词风从早期闲逸转为后期悲慨的是","options":[{"key":"A","text":"柳永"},{"key":"B","text":"朱敦儒"},{"key":"C","text":"周邦彦"},{"key":"D","text":"秦观"}],"key":"B","answer":"朱敦儒","max":1,"id":"唐诗宋词-16-single-14"},{"n":15,"type":"single","prompt":"李清照《武陵春》中,“只恐双溪舴艋舟,载不动许多愁”的妙处在于","options":[{"key":"A","text":"运用夸张手法,写出舟的渺小"},{"key":"B","text":"将抽象的“愁”具象化,赋予重量"},{"key":"C","text":"直接抒情,表达对双溪风景的喜爱"},{"key":"D","text":"描写泛舟场景,体现闲适心境"}],"key":"B","answer":"将抽象的“愁”具象化,赋予重量","max":1,"id":"唐诗宋词-16-single-15"},{"n":16,"type":"multi","prompt":"下列属于李清照《词论》核心观点的有","options":[{"key":"A","text":"词“别是一家”,需与诗区分"},{"key":"B","text":"词应讲究五音、六律、清浊轻重"},{"key":"C","text":"反对词语言尘下,主张典雅"},{"key":"D","text":"推崇苏轼“以诗为词”的创作方法"},{"key":"E","text":"强调词需有铺叙、有典重、有情致"}],"key":"ABCE","answer":"词“别是一家”,需与诗区分；词应讲究五音、六律、清浊轻重；反对词语言尘下,主张典雅；强调词需有铺叙、有典重、有情致","max":2,"id":"唐诗宋词-16-multi-16"},{"n":17,"type":"multi","prompt":"朱敦儒《好事近·渔父词》体现的南渡之际词作倾向有","options":[{"key":"A","text":"部分词人追求超脱尘世的闲逸生活"},{"key":"B","text":"通过渔父形象寄托对现实的逃避"},{"key":"C","text":"语言质朴自然,接近民歌风格"},{"key":"D","text":"词风旷逸淡远,远离社会现实"},{"key":"E","text":"抒发对家国兴亡的沉痛感慨"}],"key":"ABCD","answer":"部分词人追求超脱尘世的闲逸生活；通过渔父形象寄托对现实的逃避；语言质朴自然,接近民歌风格；词风旷逸淡远,远离社会现实","max":2,"id":"唐诗宋词-16-multi-17"},{"n":18,"type":"multi","prompt":"李清照前期词的艺术特色有","options":[{"key":"A","text":"语言清新自然,善用又语"},{"key":"B","text":"善于捕捉闺中生活细节,情感细腻"},{"key":"C","text":"意境优美,多写春日美景与闺情"},{"key":"D","text":"融入家国兴亡之痛,风格沉郁"},{"key":"E","text":"善用比喻、 叠字等手法,表现力强"}],"key":"ABCE","answer":"语言清新自然,善用又语；善于捕捉闺中生活细节,情感细腻；意境优美,多写春日美景与闺情；善用比喻、 叠字等手法,表现力强","max":2,"id":"唐诗宋词-16-multi-18"},{"n":19,"type":"multi","prompt":"岳飞《满江红》作为南宋爱国词先驱作品,其特点有","options":[{"key":"A","text":"情感激昂,抒发收复中原的壮志"},{"key":"B","text":"善用典故,如“贺兰山”“朝天阙”"},{"key":"C","text":"风格豪放雄浑,突破婉约词风束缚"},{"key":"D","text":"语言通俗直白,无雕琢痕迹"},{"key":"E","text":"体现强烈的民族气节与家国情怀"}],"key":"ABCE","answer":"情感激昂,抒发收复中原的壮志；善用典故,如“贺兰山”“朝天阙”；风格豪放雄浑,突破婉约词风束缚；体现强烈的民族气节与家国情怀","max":2,"id":"唐诗宋词-16-multi-19"},{"n":20,"type":"multi","prompt":"南渡之际词人的创作倾向主要有","options":[{"key":"A","text":"部分词人借山水、渔父形象寄托超脱情怀"},{"key":"B","text":"爱国词人开始抒发家国兴亡之痛"},{"key":"C","text":"词风从北宋的婉约闲逸转向悲慨豪放"},{"key":"D","text":"完全摒弃北宋词的婉约传统"},{"key":"E","text":"注重词的音律与典雅,追求形式美"}],"key":"ABC","answer":"部分词人借山水、渔父形象寄托超脱情怀；爱国词人开始抒发家国兴亡之痛；词风从北宋的婉约闲逸转向悲慨豪放","max":2,"id":"唐诗宋词-16-multi-20"},{"n":21,"type":"term","prompt":"《漱玉词》","options":[],"key":"","answer":"《漱玉词》是南宋词人李清照的词集,号易安居士。词以靖康之变分前后两期:前期多写闺中生活、伤春伤别,如《醉花阴》,语言清新;后期因国破家亡,词风转为沉郁悲凉,融入家国之痛,如《声声慢》,善用叠字、比喻,把抽象愁苦具象化。是婉约词的代表。","max":3,"id":"唐诗宋词-16-term-21"},{"n":22,"type":"term","prompt":"李清照《词论》","options":[],"key":"","answer":"李清照《词论》是词史上第一篇词论,提出“词别是一家”。历评五代至北宋诸家,认为词与诗有别,讲究五音、六律、清浊轻重,反对“句读不葺之诗”;批评柳永“词语尘下”与苏轼不协音律,主张铺叙、典重、有情致。它明确词的文体特质,推动词学发展。","max":3,"id":"唐诗宋词-16-term-22"},{"n":23,"type":"term","prompt":"朱敦儒《好事近·渔父词》","options":[],"key":"","answer":"《好事近·渔父词》是南宋词人朱敦儒的代表作之一,塑造“摇首出红尘”的渔父形象。词中渔父以“绿蓑青笠”为活计,惯于“披霜冲雪”,在“千里水天一色”中垂钓,风格旷逸散淡。体现南渡之际词人逃避尘世、追求闲适超脱的倾向,是宋代渔父词的代表。","max":3,"id":"唐诗宋词-16-term-23"},{"n":24,"type":"term","prompt":"岳飞《满江红》","options":[],"key":"","answer":"《满江红》是南宋抗金名将岳飞的爱国词代表作,题作“写怀”。“靖康耻,犹未雪”抒发国仇家恨,“踏破贺兰山缺”等句表达收复中原的壮志,风格豪放雄浑。作为南宋爱国词先驱,它突破婉约词风束缚,体现民族气节与家国情怀,成为千古传诵的名篇。","max":3,"id":"唐诗宋词-16-term-24"},{"n":25,"type":"term","prompt":"南渡词风","options":[],"key":"","answer":"南渡词风指北宋灭亡后词人因战乱流亡的风格转变。此前多写闲逸闺情、都市繁华;南渡后直面国破家亡,部分作品转向悲慨沉郁,抒家国之痛,如岳飞《满江红》;部分词人借山水寄托超脱,如朱敦儒《好事近》。它承前启后,为南宋爱国词派奠定基础。","max":3,"id":"唐诗宋词-16-term-25"},{"n":26,"type":"short","prompt":"简要说明李清照前后期词风的特点,并各举一例。","options":[],"key":"","answer":"李清照词以靖康之变为界分前后两期:前期多写闺中生活与伤春伤别,风格清新婉约,情感细腻明快,如《如梦令》以“绿肥红瘦”写伤春;后期因国破家亡、丈夫病逝,词风转为沉郁悲凉,融入家国之痛与孤独愁苦,如《声声慢》以七组叠字渲染凄凉,把抽象愁苦具象化, 情感深沉哀婉。","max":5,"id":"唐诗宋词-16-short-26"},{"n":27,"type":"short","prompt":"李清照《词论》中“词别是一家”的观点包含哪些内容?","options":[],"key":"","answer":"李清照“词别是一家”的观点含三方面内容:一是强调词与诗的区别,词需分五音、六律、清浊轻重,反对把词写成“句读不葺之诗”,批评苏轼词不协音律;二是主张词的语言需典雅, 反对柳永“词语尘下”的俚俗风格;三是提出词的艺术标准,需有铺叙、有典重、有情致。它明确了词的文体特质,推动词向典雅化发展。","max":5,"id":"唐诗宋词-16-short-27"},{"n":28,"type":"short","prompt":"以朱敦儒《好事近·渔父词》为例,谈谈南渡之际部分词作的倾向。","options":[],"key":"","answer":"朱敦儒《好事近·渔父词》体现南渡之际部分词作超脱尘世、追求闲逸的倾向。“摇首出红尘”表达脱离官场纷扰的态度,渔父“绿蓑青笠”“披霜冲雪”的生活展现对质朴闲适的向往; “千里水天一色”的意境强化旷逸淡远的风格。南渡初期战乱频繁,词人不愿直面现实苦难, 便借渔父、山水形象寄托对尘世的逃避。","max":5,"id":"唐诗宋词-16-short-28"},{"n":29,"type":"short","prompt":"岳飞《满江红》作为南宋爱国词先驱,其爱国情怀体现在哪些方面?","options":[],"key":"","answer":"岳飞《满江红》的爱国情怀体现在三方面:一是抒发国仇家恨,“靖康耻,犹未雪”点出北宋灭亡的耻辱,表达对金兵入侵的愤懑;二是展现收复中原的壮志,“踏破贺兰山缺”以豪迈笔触写战斗决心;三是表达对朝廷的忠诚,“收拾旧山河”表收复后向朝廷复命的忠心,彰显精忠报国的气节。","max":5,"id":"唐诗宋词-16-short-29"},{"n":30,"type":"essay","prompt":"论述李清照词的艺术成就及其《词论》的词学价值,并结合具体作品分析。","options":[],"key":"","answer":"一、艺术成就:语言清新自然又锤炼精妙,《如梦令》以“绿肥红瘦”写伤春,《声声慢》七组叠字层层递进;情感由闺中相思转为家国之痛;意境由清新明丽转为凄清悲凉。 二、词学价值:《词论》提出“词别是一家”,强调分五音六律、清浊轻重,划清诗词界限, 确立词体独立地位;主张语言雅正,反对柳永俚俗,批评晏几道少铺叙、贺铸少典重;开创专门词评,历评五代至北宋诸家。","max":10,"id":"唐诗宋词-16-essay-30"}],"rawMax":70},{"id":"唐诗宋词-17","title":"章节练习(14章)","questions":[{"n":1,"type":"single","prompt":"下列关于辛弃疾生平的表述,正确的是","options":[{"key":"A","text":"辛弃疾出生于南宋都城临安,早年顺遂"},{"key":"B","text":"辛弃疾曾组织抗金义军,后率部投奔南宋"},{"key":"C","text":"辛弃疾一生仕途顺遂,长期担任中枢要职"},{"key":"D","text":"辛弃疾晚年退居临安,专注于诗词创作"}],"key":"B","answer":"辛弃疾曾组织抗金义军,后率部投奔南宋","max":1,"id":"唐诗宋词-17-single-1"},{"n":2,"type":"single","prompt":"辛弃疾词被称为“英雄之词”,其核心原因是","options":[{"key":"A","text":"多描写英雄人物的历史故事"},{"key":"B","text":"融入自身抗金经历与报国壮志"},{"key":"C","text":"语言风格豪迈,充满英雄气概"},{"key":"D","text":"多采用英雄典故,增强气势"}],"key":"B","answer":"融入自身抗金经历与报国壮志","max":1,"id":"唐诗宋词-17-single-2"},{"n":3,"type":"single","prompt":"下列词作中,属于辛弃疾自抒抗金壮志的是","options":[{"key":"A","text":"《清平乐·村居》"},{"key":"B","text":"《破阵子·为陈同甫赋壮词以寄之》"},{"key":"C","text":"《鹧鸪天·陌上柔桑破嫩芽》"},{"key":"D","text":"《西江月·夜行黄沙道中》"}],"key":"B","answer":"《破阵子·为陈同甫赋壮词以寄之》","max":1,"id":"唐诗宋词-17-single-3"},{"n":4,"type":"single","prompt":"辛弃疾《太常引·建康中秋夜为吕叔潜赋》中,“斫去桂婆娑,人道是、清光更多”的“桂婆娑”象征","options":[{"key":"A","text":"自然界的桂树"},{"key":"B","text":"南宋朝廷中的投降派"},{"key":"C","text":"中秋夜的月色障碍"},{"key":"D","text":"词人内心的愁绪"}],"key":"B","answer":"南宋朝廷中的投降派","max":1,"id":"唐诗宋词-17-single-4"},{"n":5,"type":"single","prompt":"下列不属于辛弃疾“别立一宗”艺术成就的是","options":[{"key":"A","text":"拓展词的题材,涵盖怀古、咏物、田园等"},{"key":"B","text":"大量运用典故与诗文句法,丰富表达"},{"key":"C","text":"严格遵循晚唐花间词的婉约风格"},{"key":"D","text":"将豪放与婉约风格融合,风格多样"}],"key":"C","answer":"严格遵循晚唐花间词的婉约风格","max":1,"id":"唐诗宋词-17-single-5"},{"n":6,"type":"single","prompt":"辛派词人中,与辛弃疾交往密切,且词风慷慨激昂、直抒胸臆的是","options":[{"key":"A","text":"陆游"},{"key":"B","text":"陈亮"},{"key":"C","text":"刘克庄"},{"key":"D","text":"刘辰翁"}],"key":"B","answer":"陈亮","max":1,"id":"唐诗宋词-17-single-6"},{"n":7,"type":"single","prompt":"辛弃疾《水龙吟·登建康赏心亭》中,“把吴钩看了,栏杆拍遍”的动作描写,主要表达的情感是","options":[{"key":"A","text":"对吴钩兵器的喜爱"},{"key":"B","text":"登亭赏景的愉悦"},{"key":"C","text":"报国无门的苦闷"},{"key":"D","text":"对历史英雄的仰慕"}],"key":"C","answer":"报国无门的苦闷","max":1,"id":"唐诗宋词-17-single-7"},{"n":8,"type":"single","prompt":"下列关于辛弃疾词中比兴手法的表述,错误的是","options":[{"key":"A","text":"《摸鱼儿》以“春又归去”喻国势衰微"},{"key":"B","text":"《太常引》以“桂婆娑”喻投降派"},{"key":"C","text":"《青玉案·元夕》以“灯火阑珊处”的美人喻理想"},{"key":"D","text":"《鹧鸪天·壮岁旌旗拥万夫》以“种树书”喻抗金方略"}],"key":"D","answer":"《鹧鸪天·壮岁旌旗拥万夫》以“种树书”喻抗金方略","max":1,"id":"唐诗宋词-17-single-8"},{"n":9,"type":"single","prompt":"刘克庄作为辛派词人,其词的散文化倾向主要体现在","options":[{"key":"A","text":"多用又语,句式灵活"},{"key":"B","text":"严格遵循词牌格律"},{"key":"C","text":"仅描写闺情与自然"},{"key":"D","text":"大量运用华丽辞藻"}],"key":"A","answer":"多用又语,句式灵活","max":1,"id":"唐诗宋词-17-single-9"},{"n":10,"type":"single","prompt":"辛弃疾词中,体现“以文为词”特点的是","options":[{"key":"A","text":"《清平乐·村居》“茅檐低小,溪上青青草”"},{"key":"B","text":"《贺新郎·甚矣吾衰矣》“杯,汝来前”"},{"key":"C","text":"《西江月·夜行黄沙道中》“稻花香里说丰年”"},{"key":"D","text":"《鹧鸪天·陌上柔桑破嫩芽》“平冈细草鸣黄犊”"}],"key":"B","answer":"《贺新郎·甚矣吾衰矣》“杯,汝来前”","max":1,"id":"唐诗宋词-17-single-10"},{"n":11,"type":"single","prompt":"下列辛派词人中,以“拳拳君国”似陆游、“志在有为”似辛弃疾著称的是","options":[{"key":"A","text":"陈亮"},{"key":"B","text":"刘过"},{"key":"C","text":"刘克庄"},{"key":"D","text":"周密"}],"key":"C","answer":"刘克庄","max":1,"id":"唐诗宋词-17-single-11"},{"n":12,"type":"single","prompt":"辛弃疾《永遇乐·京又北固亭怀古》中,引用“廉颇老矣,尚能饭否”典故的目的是","options":[{"key":"A","text":"感叹廉颇年老无用"},{"key":"B","text":"自比廉颇,表老当益壮之志"},{"key":"C","text":"批评朝廷不重用老将"},{"key":"D","text":"怀念战国时期的英雄"}],"key":"B","answer":"自比廉颇,表老当益壮之志","max":1,"id":"唐诗宋词-17-single-12"},{"n":13,"type":"single","prompt":"下列对辛弃疾“别立一宗”艺术成就的表述,正确的是","options":[{"key":"A","text":"仅以豪放风格为主,无其他风格"},{"key":"B","text":"题材局限于抗金报国,内容单一"},{"key":"C","text":"将诗、文、辞赋的表现手法融入词中"},{"key":"D","text":"完全摒弃典故,以又语为主"}],"key":"C","answer":"将诗、文、辞赋的表现手法融入词中","max":1,"id":"唐诗宋词-17-single-13"},{"n":14,"type":"single","prompt":"陈亮《水调歌头·送章德茂大卿使虏》中,“尧之都,舜之壤,禹之封”表达的情感是","options":[{"key":"A","text":"对古代帝王的仰慕"},{"key":"B","text":"对中原故土的热爱与收复之志"},{"key":"C","text":"对尧舜禹时代的向往"},{"key":"D","text":"对南宋疆域的赞美"}],"key":"B","answer":"对中原故土的热爱与收复之志","max":1,"id":"唐诗宋词-17-single-14"},{"n":15,"type":"single","prompt":"刘克庄《沁园春·梦孚若》中,“天下英雄,使君与操,余子谁堪共酒杯”的构思特点是","options":[{"key":"A","text":"化用历史典故,增强豪迈气"},{"key":"B","text":"纯用又语,贴近民间风格"},{"key":"C","text":"严格遵循词牌平仄,无突破"},{"key":"D","text":"仅描写梦境,无现实寄托"}],"key":"A","answer":"化用历史典故,增强豪迈气","max":1,"id":"唐诗宋词-17-single-15"},{"n":16,"type":"multi","prompt":"下列属于辛弃疾“英雄之词”核心内涵的有","options":[{"key":"A","text":"抒发收复中原的壮志豪情"},{"key":"B","text":"表达英雄失路、有志难成的忧愤"},{"key":"C","text":"描写田园生活的闲适恬淡"},{"key":"D","text":"讽刺南宋朝廷的投降妥协"},{"key":"E","text":"展现自身抗金经历与军事才能"}],"key":"ABDE","answer":"抒发收复中原的壮志豪情；表达英雄失路、有志难成的忧愤；讽刺南宋朝廷的投降妥协；展现自身抗金经历与军事才能","max":2,"id":"唐诗宋词-17-multi-16"},{"n":17,"type":"multi","prompt":"辛弃疾《太常引·建康中秋夜为吕叔潜赋》中,运用比兴手法的诗句有","options":[{"key":"A","text":"一轮秋影转金波,飞镜又重磨"},{"key":"B","text":"把酒问姮娥:被白发、欺人奈何"},{"key":"C","text":"乘风好去,长空万里,直下看山河"},{"key":"D","text":"斫去桂婆娑,人道是、清光更多"},{"key":"E","text":"举杯邀明月,对影成三人"}],"key":"AD","answer":"一轮秋影转金波,飞镜又重磨；斫去桂婆娑,人道是、清光更多","max":2,"id":"唐诗宋词-17-multi-17"},{"n":18,"type":"multi","prompt":"下列关于辛派词人艺术特点的表述,正确的有","options":[{"key":"A","text":"以家国之念、经济之怀入词"},{"key":"B","text":"好用长调,增强叙事与议论空间"},{"key":"C","text":"风格粗豪恣肆,较少雕琢"},{"key":"D","text":"严格遵循花间词的婉约传统"},{"key":"E","text":"注重词的散文化、议论化"}],"key":"ABCE","answer":"以家国之念、经济之怀入词；好用长调,增强叙事与议论空间；风格粗豪恣肆,较少雕琢；注重词的散文化、议论化","max":2,"id":"唐诗宋词-17-multi-18"},{"n":19,"type":"multi","prompt":"辛弃疾“别立一宗”的艺术成就体现在多个方面,下列表述正确的有","options":[{"key":"A","text":"拓展词的题材,涵盖怀古、咏物、田园等"},{"key":"B","text":"融合豪放与婉约风格,风格多样"},{"key":"C","text":"大量运用典故与诗文句法,丰富表达"},{"key":"D","text":"以“清空”为词的最高境界"},{"key":"E","text":"将比兴寄托与现实关怀结合"}],"key":"ABCE","answer":"拓展词的题材,涵盖怀古、咏物、田园等；融合豪放与婉约风格,风格多样；大量运用典故与诗文句法,丰富表达；将比兴寄托与现实关怀结合","max":2,"id":"唐诗宋词-17-multi-19"},{"n":20,"type":"multi","prompt":"刘克庄《沁园春·梦孚若》体现的辛派词散文化倾向,具体表现为","options":[{"key":"A","text":"采用对话句式,如“唤厨人斫就”"},{"key":"B","text":"以议论入词,如“叹年光过尽,功名未立”"},{"key":"C","text":"句式灵活,突破词牌固定格律"},{"key":"D","text":"纯用又语,无任何典故"},{"key":"E","text":"以叙事贯穿,如描写梦中与友人相会场景"}],"key":"ABCE","answer":"采用对话句式,如“唤厨人斫就”；以议论入词,如“叹年光过尽,功名未立”；句式灵活,突破词牌固定格律；以叙事贯穿,如描写梦中与友人相会场景","max":2,"id":"唐诗宋词-17-multi-20"},{"n":21,"type":"term","prompt":"辛弃疾的“英雄之词”","options":[],"key":"","answer":"辛弃疾的“英雄之词”指其融入抗金经历与报国壮志的词作,核心是收复中原的豪情、英雄失路的忧愤与对投降派的讽刺。多以战场经历、历史英雄为素材,如《破阵子》《永遇乐·京又北固亭怀古》借廉颇自比,语言豪迈,把个人命运与国家兴亡结合。","max":3,"id":"唐诗宋词-17-term-21"},{"n":22,"type":"term","prompt":"《太常引·建康中秋夜为吕叔潜赋》","options":[],"key":"","answer":"《太常引》是辛弃疾的中秋咏月词。词以“飞镜”喻明月,“把酒问姮娥”直抒时光流逝之愁; “斫去桂婆娑”以“桂婆娑”比兴南宋投降派,暗含铲除投降势力、恢复中原的愿望。全词写景、抒情与政治寄托结合,比兴精妙,体现辛词以文为词与现实关怀的特点。","max":3,"id":"唐诗宋词-17-term-22"},{"n":23,"type":"term","prompt":"辛派词人","options":[],"key":"","answer":"辛派词人:指南宋受辛弃疾影响的词人群体,以陆游、刘过、刘克庄、陈亮为代表。多抒发爱国情怀与壮志未酬的悲愤,题材拓展至军事、政治、历史等,风格豪放激昂,善用典故与散文句法,发展辛弃疾“以文为词”的特色,是南宋豪放词派的核心力量。","max":3,"id":"唐诗宋词-17-term-23"},{"n":24,"type":"term","prompt":"辛弃疾“别立一宗”","options":[],"key":"","answer":"辛弃疾“别立一宗”指其开创独特风格与境界。他拓展词的题材,涵盖怀古、咏物、田园;融合豪放与婉约,如《摸鱼儿》;大量运用典故与诗文句法,“以文为词”;把比兴寄托与现实关怀结合,如《太常引》以“桂婆娑”喻投降派。其词既承苏轼豪放又自成一家。","max":3,"id":"唐诗宋词-17-term-24"},{"n":25,"type":"term","prompt":"刘克庄《沁园春·梦孚若》","options":[],"key":"","answer":"《沁园春·梦孚若》是刘克庄缅怀亡友方孚若之作。以梦境开篇,写与友人在北方古迹相会,以“天下英雄,使君与操”化用典故赞友人之才;下片直抒壮志未酬的悲慨,借李广典故伤其怀才不遇。以散文化句式叙事议论,体现辛派词的家国情怀。","max":3,"id":"唐诗宋词-17-term-25"},{"n":26,"type":"short","prompt":"为什么说辛弃疾的词是“英雄之词”?","options":[],"key":"","answer":"辛弃疾的词被称为“英雄之词”,原因有三:一是融入自身抗金经历,早年组织义军归宋,词中多写战场生涯,如《破阵子》,赋予英雄底色;二是抒发报国壮志与忧愤,以收复中原为志,如《永遇乐·京又北固亭怀古》借廉颇自比,暗含英雄失路的苦闷;三是讽刺投降派, 如《摸鱼儿》以典故讽喻投降势力,体现批判精神。","max":5,"id":"唐诗宋词-17-short-26"},{"n":27,"type":"short","prompt":"辛弃疾“别立一宗”的艺术成就在哪些方面?","options":[],"key":"","answer":"辛弃疾“别立一宗”的艺术成就有四方面:一是题材拓展,突破“词为艳科”传统,把怀古、咏物、田园、时政纳入词中,如《清平乐·村居》;二是风格融合,以豪放为主兼纳婉约,如 《摸鱼儿》;三是手法创新,“以文为词”,把散文句法与对话融入词中,并大量用典;四是比兴寄托深化,如《太常引》以“桂婆娑”喻投降派。","max":5,"id":"唐诗宋词-17-short-27"},{"n":28,"type":"short","prompt":"以《太常引·建康中秋夜为吕叔潜赋》为例,谈谈辛弃疾词的比兴手法。","options":[],"key":"","answer":"辛弃疾《太常引》的比兴手法体现在两处核心意象:一是以“飞镜”喻明月,把明月比作重磨的飞镜,既写出月色澄澈,又暗含对现实的观照;二是以“桂婆娑”喻投降派,以月中桂树象征阻碍北伐的投降势力,寄托恢复中原的愿望。两处比兴把物象与政治情怀结合,体现辛词寄意遥深的特点。","max":5,"id":"唐诗宋词-17-short-28"},{"n":29,"type":"short","prompt":"以刘克庄《沁园春·梦孚若》为例,谈谈南宋后期辛派词的散文化倾向。","options":[],"key":"","answer":"刘克庄《沁园春·梦孚若》的散文化倾向有三:一是句式灵活,突破词牌固定格律,以四字句串联,类似散文叙事;二是议论入词,直抒壮志未酬的感慨,议论直白;三是叙事贯穿, 全词以梦为线索,从梦中相会到梦醒抒怀,结构如散文的入梦、梦中、梦醒,体现辛派词以词叙事的笔法。","max":5,"id":"唐诗宋词-17-short-29"},{"n":30,"type":"essay","prompt":"论述辛弃疾的人格特质对其词风的影响,并结合具体词作分析。","options":[],"key":"","answer":"一、英雄人格:早年组织义军抗金、擒叛徒归宋,勇与忠成其底色;虽屡遭贬谪,仍坚守收复中原之志,影响其豪迈词风。 二、对词风的影响:题材聚焦英雄经历,如《破阵子》写沙场点兵、《永遇乐·京又北固亭怀古》抒报国志;风格豪放中含悲慨与柔情;手法“以文为词”并深化比兴,以“桂婆娑”喻投降派。 三、人格与词风统一:词成为英雄情志的写照,别立一宗,影响辛派词人。","max":10,"id":"唐诗宋词-17-essay-30"}],"rawMax":70},{"id":"唐诗宋词-18","title":"章节练习(15章)","questions":[{"n":1,"type":"single","prompt":"下列对“雅词”内涵的表述,正确的是","options":[{"key":"A","text":"仅以闺情为题材,语言艳丽"},{"key":"B","text":"注重音律协和,用字雅正,立意含蓄"},{"key":"C","text":"完全摒弃典故,以又语为主"},{"key":"D","text":"风格豪放,多抒发报国壮志"}],"key":"B","answer":"注重音律协和,用字雅正,立意含蓄","max":1,"id":"唐诗宋词-18-single-1"},{"n":2,"type":"single","prompt":"姜夔《暗香》一词的核心题材是","options":[{"key":"A","text":"咏梅"},{"key":"B","text":"咏柳"},{"key":"C","text":"咏雁"},{"key":"D","text":"咏荷"}],"key":"A","answer":"咏梅","max":1,"id":"唐诗宋词-18-single-2"},{"n":3,"type":"single","prompt":"史达祖《双双燕·咏燕》中,“软语商量不定”一句的妙处在于","options":[{"key":"A","text":"仅描写燕子的叫声"},{"key":"B","text":"将燕子拟人化,摹写其择巢的迟疑情态"},{"key":"C","text":"直白抒发对燕子的喜爱"},{"key":"D","text":"用夸张手法突出燕子的活泼"}],"key":"B","answer":"将燕子拟人化,摹写其择巢的迟疑情态","max":1,"id":"唐诗宋词-18-single-3"},{"n":4,"type":"single","prompt":"吴文英《望江南》(三月暮)中,“垂柳不萦裙带住,谩长是,系行舟”一句的构思特点是","options":[{"key":"A","text":"直抒胸臆,表达离别之苦"},{"key":"B","text":"借垂柳埋怨,曲折表达留人不得的遗憾"},{"key":"C","text":"纯用白描,描写江边景色"},{"key":"D","text":"用典抒情,暗指历史典故"}],"key":"B","answer":"借垂柳埋怨,曲折表达留人不得的遗憾","max":1,"id":"唐诗宋词-18-single-4"},{"n":5,"type":"single","prompt":"下列关于文天祥生平的表述,错误的是","options":[{"key":"A","text":"南宋抗元民族英雄,被俘后坚贞不屈"},{"key":"B","text":"曾毁家起兵勤王,力图挽救南宋危局"},{"key":"C","text":"宋亡后隐居不仕,以词抒发遗民之悲"},{"key":"D","text":"最终英勇就义,其词作多作于宋亡之后"}],"key":"C","answer":"宋亡后隐居不仕,以词抒发遗民之悲","max":1,"id":"唐诗宋词-18-single-5"},{"n":6,"type":"single","prompt":"张炎《南浦·春水》中,“荒桥断浦,柳阴撑出扁舟小”一句的写景特色是","options":[{"key":"A","text":"宏大壮阔,突出春水的磅礴"},{"key":"B","text":"细腻精巧,以小景衬春水的宁静"},{"key":"C","text":"直白通俗,描写日常场景"},{"key":"D","text":"用典密集,暗喻历史兴衰"}],"key":"B","answer":"细腻精巧,以小景衬春水的宁静","max":1,"id":"唐诗宋词-18-single-6"},{"n":7,"type":"single","prompt":"姜夔咏物词的显著特色是","options":[{"key":"A","text":"注重写实,细致描摹物象形态"},{"key":"B","text":"不即不离,借物象神韵寄托情感"},{"key":"C","text":"语言俚俗,贴近民间生活"},{"key":"D","text":"风格豪放,多抒发壮志豪情"}],"key":"B","answer":"不即不离,借物象神韵寄托情感","max":1,"id":"唐诗宋词-18-single-7"},{"n":8,"type":"single","prompt":"下列属于姜派词人共同艺术特点的是","options":[{"key":"A","text":"以豪放为主,抒发爱国情怀"},{"key":"B","text":"注重音律,追求语言雅正含蓄"},{"key":"C","text":"多用又语,风格浅俗直白"},{"key":"D","text":"仅以咏史为题材,感慨历史兴衰"}],"key":"B","answer":"注重音律,追求语言雅正含蓄","max":1,"id":"唐诗宋词-18-single-8"},{"n":9,"type":"single","prompt":"吴文英《望江南》(三月暮)中,“落絮无声春堕泪,行云有影月含羞”一句的艺术手法是","options":[{"key":"A","text":"夸张"},{"key":"B","text":"排比"},{"key":"C","text":"象征"},{"key":"D","text":"对比"}],"key":"C","answer":"象征","max":1,"id":"唐诗宋词-18-single-9"},{"n":10,"type":"single","prompt":"文天祥《念奴娇·驿中言别友人》中,“睨柱吞赢,回旗走懿,千古冲冠发”一句,借历史典故表达的情感是","options":[{"key":"A","text":"对历史英雄的仰慕"},{"key":"B","text":"抗击元军、宁死不屈的决心"},{"key":"C","text":"对友人离别的伤感"},{"key":"D","text":"对南宋灭亡的惋惜"}],"key":"B","answer":"抗击元军、宁死不屈的决心","max":1,"id":"唐诗宋词-18-single-10"},{"n":11,"type":"single","prompt":"张炎《词源》中提出的词的最高境界是","options":[{"key":"A","text":"豪放"},{"key":"B","text":"清空"},{"key":"C","text":"艳丽"},{"key":"D","text":"直白"}],"key":"B","answer":"清空","max":1,"id":"唐诗宋词-18-single-11"},{"n":12,"type":"single","prompt":"姜夔《扬州慢》中,“自胡马窥江去后,废池乔木,犹厌言兵”一句的妙处在于","options":[{"key":"A","text":"直白控诉金兵的残暴"},{"key":"B","text":"将废池乔木拟人化,暗含对兵祸的厌恶"},{"key":"C","text":"纯用白描,描写战后荒凉"},{"key":"D","text":"用典抒情,暗指历史事件"}],"key":"B","answer":"将废池乔木拟人化,暗含对兵祸的厌恶","max":1,"id":"唐诗宋词-18-single-12"},{"n":13,"type":"single","prompt":"史达祖《绮罗香·咏春雨》中,“临断岸新绿生时,是落红带愁流处”一句的特点是","options":[{"key":"A","text":"仅描写春雨后的景色"},{"key":"B","text":"通过新绿与落红的对比,暗含新陈代谢的深意"},{"key":"C","text":"直白抒发对春雨的喜爱"},{"key":"D","text":"用夸张手法突出春雨的猛烈"}],"key":"B","answer":"通过新绿与落红的对比,暗含新陈代谢的深意","max":1,"id":"唐诗宋词-18-single-13"},{"n":14,"type":"single","prompt":"下列对吴文英“梦窗词”特点的表述,正确的是","options":[{"key":"A","text":"语言浅俗,风格直白"},{"key":"B","text":"结构曲折,境界奇丽凄迷"},{"key":"C","text":"以豪放为主,多抒报国壮志"},{"key":"D","text":"完全摒弃典故,注重写实"}],"key":"B","answer":"结构曲折,境界奇丽凄迷","max":1,"id":"唐诗宋词-18-single-14"},{"n":15,"type":"single","prompt":"张炎《南浦·春水》中,“和云流出空山,甚年年净洗,花香不了”一句的写景技巧是","options":[{"key":"A","text":"以动衬静,突出空山的幽静"},{"key":"B","text":"借春水与花香的关联,赋予春水灵动的意趣"},{"key":"C","text":"直白描写春水的流动"},{"key":"D","text":"用典密集,暗喻历史兴衰"}],"key":"B","answer":"借春水与花香的关联,赋予春水灵动的意趣","max":1,"id":"唐诗宋词-18-single-15"},{"n":16,"type":"multi","prompt":"下列属于姜夔《暗香》一词艺术特色的有","options":[{"key":"A","text":"借梅的神韵寄托怀旧之情"},{"key":"B","text":"注重描摹梅花的外在形态"},{"key":"C","text":"化用林逋咏梅诗句,意境清雅"},{"key":"D","text":"语言俚俗,贴近民间风格"},{"key":"E","text":"以“旧时”与“而今” 对比,暗含迟暮之感"}],"key":"ACE","answer":"借梅的神韵寄托怀旧之情；化用林逋咏梅诗句,意境清雅；以“旧时”与“而今” 对比,暗含迟暮之感","max":2,"id":"唐诗宋词-18-multi-16"},{"n":17,"type":"multi","prompt":"史达祖《双双燕·咏燕》体现的姜派词特点有","options":[{"key":"A","text":"注重音律协和,语言雅正"},{"key":"B","text":"细腻描摹燕子情态,形神毕肖"},{"key":"C","text":"借燕子寄托家国之思"},{"key":"D","text":"风格豪放,多抒发壮志"},{"key":"E","text":"立意含蓄,避免直白抒情"}],"key":"ABE","answer":"注重音律协和,语言雅正；细腻描摹燕子情态,形神毕肖；立意含蓄,避免直白抒情","max":2,"id":"唐诗宋词-18-multi-17"},{"n":18,"type":"multi","prompt":"吴文英《望江南》(三月暮)中,体现“梦窗词”特点的有","options":[{"key":"A","text":"结构曲折,时空交错"},{"key":"B","text":"用象征手法,意境凄迷"},{"key":"C","text":"语言秾艳凝涩"},{"key":"D","text":"直白抒发离别之苦"},{"key":"E","text":"借自然物象寄托情感"}],"key":"ABE","answer":"结构曲折,时空交错；用象征手法,意境凄迷；借自然物象寄托情感","max":2,"id":"唐诗宋词-18-multi-18"},{"n":19,"type":"multi","prompt":"文天祥词作中体现爱国精神与民族正气的有","options":[{"key":"A","text":"《念奴娇·驿中言别友人》"},{"key":"B","text":"《贺新郎·送胡邦衡待制》"},{"key":"C","text":"《西江月·新秋写兴》"},{"key":"D","text":"《正气歌》(词体)"},{"key":"E","text":"《念奴娇·过淮河》"}],"key":"AE","answer":"《念奴娇·驿中言别友人》；《念奴娇·过淮河》","max":2,"id":"唐诗宋词-18-multi-19"},{"n":20,"type":"multi","prompt":"张炎《南浦·春水》写景咏物的技巧有","options":[{"key":"A","text":"以小景衬大景,营造空灵意境"},{"key":"B","text":"化用前人诗句,融入自身意趣"},{"key":"C","text":"注重描摹春水的外在形态"},{"key":"D","text":"借春水流动寄托情感"},{"key":"E","text":"语言直白,贴近民间风格"}],"key":"ABD","answer":"以小景衬大景,营造空灵意境；化用前人诗句,融入自身意趣；借春水流动寄托情感","max":2,"id":"唐诗宋词-18-multi-20"},{"n":21,"type":"term","prompt":"雅词","options":[],"key":"","answer":"雅词是南宋以姜夔为代表的词派风格,注重音律协和、用字雅正,避免俚俗;立意含蓄,不直露抒情;题材多为别情、咏物、写景,善借典故与意境传情,摒弃花间词的秾艳与辛派的粗率,追求“清空”“骚雅”的境界,对后世张炎、王沂孙等影响深远。","max":3,"id":"唐诗宋词-18-term-21"},{"n":22,"type":"term","prompt":"《暗香》","options":[],"key":"","answer":"《暗香》是姜夔的自度曲、咏梅名篇,调名源自林逋《山园小梅》。上片回忆梅边吹笛的旧事;下片借寄梅路遥抒离别之思,叹梅花凋零、暗喻时光流逝。不直描梅的形态,借月色、 笛声、冷香抓取神韵,体现咏物词不即不离的特点,是南宋雅词典范。","max":3,"id":"唐诗宋词-18-term-22"},{"n":23,"type":"term","prompt":"《双双燕·咏燕》","options":[],"key":"","answer":"《双双燕·咏燕》是史达祖的咏物名篇,属姜派词代表作。上片写燕子春社后归巢,拟人化摹写其择巢的迟疑;下片写其贴地争飞的活泼,从闺人视角衬其可爱。全词注重音律,语言雅正,细腻摹写形神,体现姜派词融情景于一家的追求。","max":3,"id":"唐诗宋词-18-term-23"},{"n":24,"type":"term","prompt":"梦窗词","options":[],"key":"","answer":"梦窗词是吴文英词作统称,因号得名。特点是结构曲折绵密,时空交错;用字秾艳凝涩,善用象征典故;境界奇丽凄迷,多融入身世之感。它继承周邦彦的典丽,又受李贺、李商隐影响,虽因质实易显晦涩,但炼字造境独具匠心,是姜派之外的重要流派。","max":3,"id":"唐诗宋词-18-term-24"},{"n":25,"type":"term","prompt":"张炎《词源》","options":[],"key":"","answer":"张炎《词源》是南宋重要词学著作,分上下两卷。上卷论音律,阐述唐宋词音乐结构;下卷论创作,提出“清空”为词的最高境界,主张协音合律、用字雅正、立意含蓄,反对俚俗与质实。它系统总结南宋雅词创作经验,是理解雅化进程的关键文献。","max":3,"id":"唐诗宋词-18-term-25"},{"n":26,"type":"short","prompt":"以《暗香》为例,谈谈姜夔咏物词的特色。","options":[],"key":"","answer":"姜夔《暗香》体现不即不离、借韵寄托的特色:一是重神韵轻形态,不描摹形色,借月色、 笛声等意象抓取清冷幽远的神韵,以嗅觉写梅香,切合“暗香”题旨;二是融情感于物象,借咏梅、寄梅典故写迟暮离别之感,使梅成为情感载体;三是意境空灵含蓄,以月色、夜雪等场景烘托怀人惜春之意,合雅词清空的追求。","max":5,"id":"唐诗宋词-18-short-26"},{"n":27,"type":"short","prompt":"以史达祖《双双燕·咏燕》为例,谈谈姜派词的特点。","options":[],"key":"","answer":"史达祖《双双燕·咏燕》体现姜派词音律协和、描摹细腻、立意含蓄的特点:其一,音律协和,语言雅正,字句锤炼精巧,协音合律,无俚俗之语;其二,描摹细腻,形神兼备,把燕子拟人化,写其择巢的迟疑与飞行的灵动;其三,立意含蓄,只写燕子的归巢、飞行、嬉闹而不直抒情感,暗含春日将暮的怅惘。","max":5,"id":"唐诗宋词-18-short-27"},{"n":28,"type":"short","prompt":"以吴文英《望江南》为例,谈谈梦窗词的特点。","options":[],"key":"","answer":"吴文英《望江南》体现梦窗词结构曲折、象征含蓄、情景交融的特点:一是结构曲折,时空交错,从梦境切入,回忆与情人相处,再转入现实,梦与现实切换而意脉连贯;二是善用象征,以落絮、行云象征春泪与月羞,含蓄表达怀人的伤感;三是情景交融,借垂柳系行舟写留人不得的遗憾,以夜风寒意衬内心凄凉。","max":5,"id":"唐诗宋词-18-short-28"},{"n":29,"type":"short","prompt":"以张炎《南浦·春水》为例,说说张炎写景咏物的技巧。","options":[],"key":"","answer":"张炎《南浦·春水》的写景咏物技巧有三:一是以小景衬大景,选取荒桥断浦、扁舟等意象,以静谧衬辽阔,符合清空的追求;二是化用前人诗句,于徐俯诗句中增“荒”“小”二字, 强化春水上涨的清幽;三是借物象传情,借春水净洗花香、溪上碧桃的变迁,暗喻时光流逝与对往昔的怀念。","max":5,"id":"唐诗宋词-18-short-29"},{"n":30,"type":"essay","prompt":"论述南宋词的雅化与“家国”抒写的关系,并结合具体词人词作分析。","options":[],"key":"","answer":"一、内涵:突破花间词秾艳,姜夔、张炎确立协音合律、用字雅正、立意含蓄的标准,追求 “清空”“骚雅”,使词转为士大夫之词。 二、关联:靖康之变后家国成为重大主题,雅词以象征、典故暗喻:姜夔《扬州慢》借扬州荒芜寄国悲,张炎《解连环》以咏物折射兴亡,王沂孙《眉妩》寄故国之思。 三、意义与局限:雅化避免辛派粗率直白,使家国之思更具余韵;但过度深隐会削弱冲击力。","max":10,"id":"唐诗宋词-18-essay-30"}],"rawMax":70}]},{"subject":"西方文论","groups":[{"id":"西方文论-1","title":"2026年1月笔试真题","questions":[{"n":1,"type":"single","prompt":"根据艾布拉姆斯的描述,从古至今的西方文论始终围绕着文学与四要素的关系展开,四要素即作家、作品、读者和","options":[{"key":"A","text":"人物"},{"key":"B","text":"世界"},{"key":"C","text":"环境"},{"key":"D","text":"自然"}],"key":"B","answer":"世界","max":1,"id":"西方文论-1-single-1"},{"n":2,"type":"single","prompt":"被认为是古罗马时期古典主义文论重要著作的是","options":[{"key":"A","text":"《论崇高》"},{"key":"B","text":"《诗话》"},{"key":"C","text":"《诗艺》"},{"key":"D","text":"《诗学》"}],"key":"A","answer":"《论崇高》","max":1,"id":"西方文论-1-single-2"},{"n":3,"type":"single","prompt":"提出释经四义理论的中世纪文论家是","options":[{"key":"A","text":"奥利金"},{"key":"B","text":"亚历山大"},{"key":"C","text":"阿奎那"},{"key":"D","text":"雨果"}],"key":"C","answer":"阿奎那","max":1,"id":"西方文论-1-single-3"},{"n":4,"type":"single","prompt":"布瓦洛在《诗的艺术》中认为是文学的基础和出发点,也是文学的目的和归宿的是","options":[{"key":"A","text":"理性"},{"key":"B","text":"自然"},{"key":"C","text":"人性"},{"key":"D","text":"感性"}],"key":"A","answer":"理性","max":1,"id":"西方文论-1-single-4"},{"n":5,"type":"single","prompt":"莱辛的剧作《萨拉·萨姆逊小姐》是德语戏剧的第一部","options":[{"key":"A","text":"家庭悲剧"},{"key":"B","text":"严肃喜剧"},{"key":"C","text":"市民喜剧"},{"key":"D","text":"市民悲剧"}],"key":"D","answer":"市民悲剧","max":1,"id":"西方文论-1-single-5"},{"n":6,"type":"single","prompt":"被恩格斯誉为“德国第一部有政治倾向的戏剧”的是席勒的悲剧","options":[{"key":"A","text":"《强盗》"},{"key":"B","text":"《阴谋与爱情》"},{"key":"C","text":"《欢乐颂》"},{"key":"D","text":"《浮士德》"}],"key":"B","answer":"《阴谋与爱情》","max":1,"id":"西方文论-1-single-6"},{"n":7,"type":"single","prompt":"下列属于歌德首次提出的概念是","options":[{"key":"A","text":"民族文学"},{"key":"B","text":"民间文学"},{"key":"C","text":"世界文学"},{"key":"D","text":"地方文学"}],"key":"C","answer":"世界文学","max":1,"id":"西方文论-1-single-7"},{"n":8,"type":"single","prompt":"在黑格尔看来,美是两种要素的矛盾统一体,即理念和","options":[{"key":"A","text":"感性"},{"key":"B","text":"直觉"},{"key":"C","text":"悟性"},{"key":"D","text":"想象"}],"key":"A","answer":"感性","max":1,"id":"西方文论-1-single-8"},{"n":9,"type":"single","prompt":"海涅认为艺术应该反映生活,在文艺与现实的关系上,他坚持","options":[{"key":"A","text":"模仿说"},{"key":"B","text":"表现说"},{"key":"C","text":"反映说"},{"key":"D","text":"镜子说"}],"key":"D","answer":"镜子说","max":1,"id":"西方文论-1-single-9"},{"n":10,"type":"single","prompt":"华兹华斯主张诗歌写作应该运用","options":[{"key":"A","text":"贵族雅言"},{"key":"B","text":"日常乡间语言"},{"key":"C","text":"古典拉丁"},{"key":"D","text":"宗教修辞"}],"key":"B","answer":"日常乡间语言","max":1,"id":"西方文论-1-single-10"},{"n":11,"type":"single","prompt":"狄更斯现实主义作品中的一个必要因素是","options":[{"key":"A","text":"讽刺性"},{"key":"B","text":"批判性"},{"key":"C","text":"典型性"},{"key":"D","text":"真实性"}],"key":"A","answer":"讽刺性","max":1,"id":"西方文论-1-single-11"},{"n":12,"type":"single","prompt":"从社会条件上说,与文学史批评的创立息息相关的是","options":[{"key":"A","text":"现代期刊制度"},{"key":"B","text":"现代传媒制度"},{"key":"C","text":"现代教育制度"},{"key":"D","text":"现代大学制度"}],"key":"D","answer":"现代大学制度","max":1,"id":"西方文论-1-single-12"},{"n":13,"type":"single","prompt":"提出“纯诗”理论的文论家是","options":[{"key":"A","text":"波德莱尔"},{"key":"B","text":"朗松"},{"key":"C","text":"马拉美"},{"key":"D","text":"瓦雷里"}],"key":"C","answer":"马拉美","max":1,"id":"西方文论-1-single-13"},{"n":14,"type":"single","prompt":"雅各布森的语言诗学的根本观念是","options":[{"key":"A","text":"文学性"},{"key":"B","text":"陌生化"},{"key":"C","text":"恋母情结"},{"key":"D","text":"共振"}],"key":"A","answer":"文学性","max":1,"id":"西方文论-1-single-14"},{"n":15,"type":"single","prompt":"下列不属于英美新批评理论的直接创始人和开拓者的是","options":[{"key":"A","text":"艾略特"},{"key":"B","text":"詹姆逊"},{"key":"C","text":"瑞恰慈"},{"key":"D","text":"燕卜荪"}],"key":"B","answer":"詹姆逊","max":1,"id":"西方文论-1-single-15"},{"n":16,"type":"single","prompt":"在索绪尔看来,由词汇和语法组成的规则系统,作为一种共时性的“社会制度”的是","options":[{"key":"A","text":"言语"},{"key":"B","text":"话语"},{"key":"C","text":"语文"},{"key":"D","text":"语言"}],"key":"D","answer":"语言","max":1,"id":"西方文论-1-single-16"},{"n":17,"type":"single","prompt":"英加登认为,有赖于读者的阅读活动去充实的,是文本中存在的大量“空白”和","options":[{"key":"A","text":"张力"},{"key":"B","text":"悖论"},{"key":"C","text":"距离"},{"key":"D","text":"未定点"}],"key":"D","answer":"未定点","max":1,"id":"西方文论-1-single-17"},{"n":18,"type":"single","prompt":"费什认为,形成解释团体的最重要方式是","options":[{"key":"A","text":"文学阅读"},{"key":"B","text":"文学阐释"},{"key":"C","text":"文学教育"},{"key":"D","text":"文学传播"}],"key":"C","answer":"文学教育","max":1,"id":"西方文论-1-single-18"},{"n":19,"type":"single","prompt":"下列不属于后现代主义文学理论流派的是","options":[{"key":"A","text":"解构主义"},{"key":"B","text":"女性主义"},{"key":"C","text":"后殖民主义"},{"key":"D","text":"文化研究"}],"key":"A","answer":"解构主义","max":1,"id":"西方文论-1-single-19"},{"n":20,"type":"single","prompt":"奠定了新历史主义的基础的是怀特的","options":[{"key":"A","text":"文化诗学"},{"key":"B","text":"历史诗学"},{"key":"C","text":"政治诗学"},{"key":"D","text":"空间诗学"}],"key":"B","answer":"历史诗学","max":1,"id":"西方文论-1-single-20"},{"n":21,"type":"fill","prompt":"亚里士多德认为,文艺起源于人的 ______ 天性和天赋的美感能力。","options":[],"key":"模仿","answer":"模仿","max":2,"id":"西方文论-1-fill-21"},{"n":22,"type":"fill","prompt":"以奥古斯丁等为代表的中世纪欧洲文论的主流是 ______ 文艺观。","options":[],"key":"神学","answer":"神学","max":2,"id":"西方文论-1-fill-22"},{"n":23,"type":"fill","prompt":"新古典主义文艺思想的建立与 ______ 这一特殊的文化机构有重要关系。","options":[],"key":"法兰西学院","answer":"法兰西学院","max":2,"id":"西方文论-1-fill-23"},{"n":24,"type":"fill","prompt":"狄德罗认为,“真实”就是艺术在模仿 ______ 的基础上,揭示事物之间的“关系”,达到 “逼真”的效果。","options":[],"key":"自然","answer":"自然","max":2,"id":"西方文论-1-fill-24"},{"n":25,"type":"fill","prompt":"车尔尼雪夫斯基在其硕士论文《艺术对现实的审美关系》中,提出了著名的 ______ 的观点。","options":[],"key":"美是生活","answer":"美是生活","max":2,"id":"西方文论-1-fill-25"},{"n":26,"type":"fill","prompt":"1908年,弗洛伊德发表了 ______ ,开创了运用心理分析理论分析作家、艺术家创作的奥秘的先河。","options":[],"key":"作家与白日梦","answer":"作家与白日梦","max":2,"id":"西方文论-1-fill-26"},{"n":27,"type":"fill","prompt":"詹姆逊认为,资本主义阶段的文学经历了三个不同时期:现实主义、现代主义和 ______ 。","options":[],"key":"后现代主义","answer":"后现代主义","max":2,"id":"西方文论-1-fill-27"},{"n":28,"type":"term","prompt":"理念论","options":[],"key":"","answer":"柏拉图哲学的出发点和基本原则。理念本义是“看见的东西”,转义为灵魂所见的东西。在柏拉图看来,理念是现实感性世界的根据,作为事物的共相,不生不灭、不变不动。他以理念论为基础提出艺术模仿论,认为文艺是对理念的间接模仿。","max":3,"id":"西方文论-1-term-28"},{"n":29,"type":"term","prompt":"俗语","options":[],"key":"","answer":"但丁在《论俗语》中提出的概念,与拉丁语相对。俗语是孩提解语之时从周围人们听惯熟习的语言,不凭任何规律、从摹仿乳母而学来。它是自然生成的语言,人类最初使用的语言, 不需要专门花费时间学习。","max":3,"id":"西方文论-1-term-29"},{"n":30,"type":"term","prompt":"酒神精神","options":[],"key":"","answer":"尼采提出的概念,与日神精神相对,指在狂欢、醉态中超越个体痛苦、忘却自我、与自然和生命本源合一的精神状态。它代表原始的生命冲动和意志,通过音乐、舞蹈释放被压抑的激情,使人感受与宇宙融合的欢愉,获得战胜苦难的崇高感。","max":3,"id":"西方文论-1-term-30"},{"n":31,"type":"term","prompt":"叙事话语","options":[],"key":"","answer":"托多罗夫研究叙事语法时使用的概念。他认为叙事不同于故事:故事是或真或假的事件,叙事则是讲述故事的陈述语句,即叙事话语。他把叙事话语分为叙事时间、叙事体态和叙事语式三方面,分别考察叙述的时间安排。","max":3,"id":"西方文论-1-term-31"},{"n":32,"type":"short","prompt":"简述文艺复兴的产生主要受到哪些文化的影响。","options":[],"key":"","answer":"文艺复兴的产生主要受三方面影响:(1)古希腊罗马文化:文艺复兴以复兴古希腊罗马文化为旗帜,汲取其人文精神与文艺资源。(2)东方文化:阿拉伯、印度和中国等东方文化传入欧洲,带来科学知识与思想材料。(3)中世纪基督教文化:基督教神学与教会文化提供思想背景,其经典与象征传统也被继承改造。","max":5,"id":"西方文论-1-short-32"},{"n":33,"type":"short","prompt":"简述德国古典文论产生的社会历史原因和思想文化背景。","options":[],"key":"","answer":"德国古典文论的产生主要有两方面条件:(1)社会历史原因:18世纪德国皇权衰微,诸侯割据,经济落后,社会矛盾尖锐,各邦分裂。(2)思想文化背景:德国古典哲学产生,建立以理性和主体性为前提、以“自由”为核心的意识形态体系,为文论提供思想基础,代表人物有康德、歌德、席勒、黑格尔等。","max":5,"id":"西方文论-1-short-33"},{"n":34,"type":"short","prompt":"简述左拉的自然主义的内涵及其不足。","options":[],"key":"","answer":"左拉的自然主义包括两方面内涵:(1)文学的真实性:主张以科学态度对待文学,追求绝对真实,如实记录现实生活。(2)创作依据:以生理学、遗传学等科学理论为创作依据, 推崇科学方法。其不足在于混淆科学与文学的区别,使文学沦为科学附庸,忽视艺术特性, 损害文学自身的价值。","max":5,"id":"西方文论-1-short-34"},{"n":35,"type":"short","prompt":"简述本雅明艺术生产理论的基本内涵。","options":[],"key":"","answer":"本雅明把马克思主义生产理论引入文学研究,基本内涵包括:(1)作家即文学的生产者: 艺术创作是社会生产,作家如同生产者,作品是产品,文学接受是消费。(2)艺术生产方式:艺术创作有自身的生产技术,艺术技巧构成艺术生产力,决定艺术的性质和发展,推动艺术进步。","max":5,"id":"西方文论-1-short-35"},{"n":36,"type":"short","prompt":"简述德里达的文学模仿论与柏拉图的文学模仿论的区别。","options":[],"key":"","answer":"二者区别在于:(1)柏拉图认为文学是对现实的模仿,是“三度模仿”的低劣产品,与真理隔着三层,具有误导性。(2)德里达强调“拟仿”的复杂性,认为它不是简单模仿,而是对自身差异的不断复制,是文本中循环和自我复制的机制,否定固定的“真理”和“原初”,解构传统真理观。","max":5,"id":"西方文论-1-short-36"},{"n":37,"type":"essay","prompt":"如何理解康德的审美理念理论?","options":[],"key":"","answer":"(1)审美是连接理性与感性、自然与自由的桥梁,通过“无目的的合目的性”将想象力与知性统一,无功利地产生普遍性愉悦。(2)美的理念是艺术家创造的表达,是“自由的协调” 在作品中的显现,艺术家据此组织杂多,使之成为有秩序和清晰度的作品。(3)该理论说明审美主体凭心理能力自由协调想象力与知性,无功利地产生普遍性愉悦,并创造出表达美的理念的作品。","max":15,"id":"西方文论-1-essay-37"},{"n":38,"type":"essay","prompt":"试用马克思的生产—消费理论分析文学阅读中的读者导向。","options":[],"key":"","answer":"(1)把文学视为“商品”,作者是生产者,读者是消费者,体现生产与消费的辩证关系。 (2)作者创作受读者需求制约,读者对作品作再生产与价值判断。(3)作者具有读者导向,考虑潜在读者,迎合或引导其趣味;读者解读决定作品的传播效果。(4)不同阶层读者价值判断不同,生产与消费相互依存。(5)文学创作与消费承载意识形态功能,该理论强调文学的社会属性。","max":15,"id":"西方文论-1-essay-38"}],"rawMax":101},{"id":"西方文论-2","title":"2026年模拟试卷(一)","questions":[{"n":1,"type":"single","prompt":"柏拉图在《理想国》中提出“理念论”,认为艺术是对现实世界的模仿,而现实世界又是对理念世界的模仿,由此形成的世界层级关系是","options":[{"key":"A","text":"理念世界→现实世界→艺术世界"},{"key":"B","text":"现实世界→理念世界→艺术世界"},{"key":"C","text":"艺术世界→现实世界→理念世界"},{"key":"D","text":"理念世界→艺术世界→现实世界"}],"key":"A","answer":"理念世界→现实世界→艺术世界","max":1,"id":"西方文论-2-single-1"},{"n":2,"type":"single","prompt":"亚里士多德在《诗学》中对悲剧的定义强调“借引起怜悯与恐惧来使这种情感得到陶冶”,其中“陶冶”对应的希腊语词汇是","options":[{"key":"A","text":"mimesis"},{"key":"B","text":"katharsis"},{"key":"C","text":"logos"},{"key":"D","text":"pathos"}],"key":"B","answer":"katharsis","max":1,"id":"西方文论-2-single-2"},{"n":3,"type":"single","prompt":"中世纪文论中,奥古斯丁的美学思想核心是区分“世界美”与“神性美”,他认为二者的关系是","options":[{"key":"A","text":"世界美高于神性美"},{"key":"B","text":"神性美高于世界美"},{"key":"C","text":"世界美与神性美同等重要"},{"key":"D","text":"世界美与神性美相互对立"}],"key":"B","answer":"神性美高于世界美","max":1,"id":"西方文论-2-single-3"},{"n":4,"type":"single","prompt":"文艺复兴时期,但丁在《论俗语》中主张规范意大利俗语,其核心目的是","options":[{"key":"A","text":"取代古希腊语的文学地位"},{"key":"B","text":"建立意大利民族语言与民族文学"},{"key":"C","text":"迎合教会对语言的统一要求"},{"key":"D","text":"简化文学创作的语言难度"}],"key":"B","answer":"建立意大利民族语言与民族文学","max":1,"id":"西方文论-2-single-4"},{"n":5,"type":"single","prompt":"新古典主义文论的核心原则是“理性”与“自然”,布瓦洛在《诗的艺术》中强调“自然”的内涵是","options":[{"key":"A","text":"未经人类改造的原始自然"},{"key":"B","text":"合乎理性与常情的普遍人性"},{"key":"C","text":"各民族独特的地域风貌"},{"key":"D","text":"艺术家主观想象的自然"}],"key":"B","answer":"合乎理性与常情的普遍人性","max":1,"id":"西方文论-2-single-5"},{"n":6,"type":"single","prompt":"启蒙主义文论中,狄德罗提出“严肃剧”理论,其核心是","options":[{"key":"A","text":"打破悲剧与喜剧的界限,聚焦市民生活"},{"key":"B","text":"延续新古典主义“三一律”,强化戏剧规范性"},{"key":"C","text":"以神话为题材,突出神性与崇高"},{"key":"D","text":"以宫廷生活为对象,彰显贵族道德"}],"key":"A","answer":"打破悲剧与喜剧的界限,聚焦市民生活","max":1,"id":"西方文论-2-single-6"},{"n":7,"type":"single","prompt":"康德在《判断力批判》中提出“审美理念”,认为其本质是","options":[{"key":"A","text":"理性概念的直接呈现"},{"key":"B","text":"想象力与知性的自由和谐"},{"key":"C","text":"对自然现象的客观复制"},{"key":"D","text":"艺术家个人情感的随意抒发"}],"key":"B","answer":"想象力与知性的自由和谐","max":1,"id":"西方文论-2-single-7"},{"n":8,"type":"single","prompt":"歌德提出“艺术与自然”的辩证关系,认为艺术家“既是自然的主宰,又是自然的奴隶”, 其中“主宰”指的是","options":[{"key":"A","text":"艺术家可随意改造自然规律"},{"key":"B","text":"艺术家对自然素材的创造性加工"},{"key":"C","text":"艺术家超越自然的绝对自由"},{"key":"D","text":"艺术家忽视自然的主观虚构"}],"key":"B","answer":"艺术家对自然素材的创造性加工","max":1,"id":"西方文论-2-single-8"},{"n":9,"type":"single","prompt":"黑格尔在《美学》中提出“美是理念的感性显现”,并将艺术发展分为三种历史类型,其中不包括","options":[{"key":"A","text":"象征型艺术"},{"key":"B","text":"古典型艺术"},{"key":"C","text":"浪漫型艺术"},{"key":"D","text":"现实型艺术"}],"key":"D","answer":"现实型艺术","max":1,"id":"西方文论-2-single-9"},{"n":10,"type":"single","prompt":"浪漫主义文论中,华兹华斯在《〈抒情歌谣集〉序言》中主张诗歌的题材应取自","options":[{"key":"A","text":"宫廷贵族的奢华生活"},{"key":"B","text":"古代神话的奇幻场景"},{"key":"C","text":"卑微的乡村日常生活"},{"key":"D","text":"战争英雄的传奇经历"}],"key":"C","answer":"卑微的乡村日常生活","max":1,"id":"西方文论-2-single-10"},{"n":11,"type":"single","prompt":"现实主义文论中,巴尔扎克将自己的《人间喜剧》定位为“法国社会的风俗史”,其核心意图是","options":[{"key":"A","text":"单纯记录法国社会的生活细节"},{"key":"B","text":"揭示社会发展的普遍规律与人性本质"},{"key":"C","text":"迎合资产阶级的审美趣味"},{"key":"D","text":"批判浪漫主义的虚幻叙事"}],"key":"B","answer":"揭示社会发展的普遍规律与人性本质","max":1,"id":"西方文论-2-single-11"},{"n":12,"type":"single","prompt":"19世纪末20世纪初,丹纳提出文学发展“三要素”,其中不包括","options":[{"key":"A","text":"种族"},{"key":"B","text":"环境"},{"key":"C","text":"时代"},{"key":"D","text":"宗教"}],"key":"D","answer":"宗教","max":1,"id":"西方文论-2-single-12"},{"n":13,"type":"single","prompt":"王尔德作为唯美主义代表,提出“为艺术而艺术”,其核心主张是","options":[{"key":"A","text":"艺术应服务于道德教化"},{"key":"B","text":"艺术的价值仅存在于自身的审美属性"},{"key":"C","text":"艺术需模仿自然的真实性"},{"key":"D","text":"艺术应反映社会现实矛盾"}],"key":"B","answer":"艺术的价值仅存在于自身的审美属性","max":1,"id":"西方文论-2-single-13"},{"n":14,"type":"single","prompt":"波德莱尔的“感应论”强调自然万物之间存在隐秘的关联,这种关联的本质是","options":[{"key":"A","text":"理性逻辑的必然联系"},{"key":"B","text":"艺术家主观臆想的产物"},{"key":"C","text":"源于神性创造的统一秩序"},{"key":"D","text":"自然科学可验证的因果关系"}],"key":"C","answer":"源于神性创造的统一秩序","max":1,"id":"西方文论-2-single-14"},{"n":15,"type":"single","prompt":"尼采在《悲剧的诞生》中提出“酒神精神”与“日神精神”,其中“日神精神”的核心是","options":[{"key":"A","text":"非理性的生命狂欢"},{"key":"B","text":"理性的形式与和谐"},{"key":"C","text":"对现实的批判与否定"},{"key":"D","text":"对未来的乌托邦想象"}],"key":"B","answer":"理性的形式与和谐","max":1,"id":"西方文论-2-single-15"},{"n":16,"type":"single","prompt":"弗洛伊德的心理分析文论中,“俄狄浦斯情结”属于人格结构中的体现","options":[{"key":"A","text":"本我"},{"key":"B","text":"自我"},{"key":"C","text":"超我"},{"key":"D","text":"镜我"}],"key":"A","answer":"本我","max":1,"id":"西方文论-2-single-16"},{"n":17,"type":"single","prompt":"俄国形式主义文论中,什克洛夫斯基提出“陌生化”理论,其目的是","options":[{"key":"A","text":"让读者熟悉文学作品的常规形式"},{"key":"B","text":"延长读者的审美感知时间,增强艺术效果"},{"key":"C","text":"简化文学语言,降低阅读难度"},{"key":"D","text":"强调文学与现实的直接对应"}],"key":"B","answer":"延长读者的审美感知时间,增强艺术效果","max":1,"id":"西方文论-2-single-17"},{"n":18,"type":"single","prompt":"英美新批评中,兰色姆提出“本体论批评”,其核心是关注","options":[{"key":"A","text":"文学作品的社会历史背景"},{"key":"B","text":"作家的创作心理与生平"},{"key":"C","text":"文学作品自身的文本结构与意义"},{"key":"D","text":"读者的接受与解读过程"}],"key":"C","answer":"文学作品自身的文本结构与意义","max":1,"id":"西方文论-2-single-18"},{"n":19,"type":"single","prompt":"结构主义文论中,索绪尔提出“能指”与“所指”的区分,其中“能指”指的是","options":[{"key":"A","text":"语言符号的物质形式(如声音、文字)"},{"key":"B","text":"语言符号所指代的概念或意义"},{"key":"C","text":"语言符号的使用语境"},{"key":"D","text":"语言符号的历史演变"}],"key":"A","answer":"语言符号的物质形式(如声音、文字)","max":1,"id":"西方文论-2-single-19"},{"n":20,"type":"single","prompt":"读者接受文论中,姚斯提出“文学接受史”,其核心是","options":[{"key":"A","text":"研究文学作品的创作历史"},{"key":"B","text":"考察不同时代读者对作品的解读与接受过程"},{"key":"C","text":"梳理文学作品的出版与传播路径"},{"key":"D","text":"分析文学作品的文本结构演变"}],"key":"B","answer":"考察不同时代读者对作品的解读与接受过程","max":1,"id":"西方文论-2-single-20"},{"n":21,"type":"fill","prompt":"亚里士多德在《诗学》中指出,诗与历史的区别在于:历史叙述“已经发生的事”,而诗描述“按照 ______ 可能发生的事”。","options":[],"key":"可然律或必然律","answer":"可然律或必然律","max":2,"id":"西方文论-2-fill-21"},{"n":22,"type":"fill","prompt":"中世纪托马斯·阿奎那提出“释经四义”,包括字面义、寓言义、道德义和 ______ 。","options":[],"key":"神秘义","answer":"神秘义","max":2,"id":"西方文论-2-fill-22"},{"n":23,"type":"fill","prompt":"新古典主义时期,屈雷顿在《论诗剧》中通过“古今之争”“法英之争”,最终倾向于肯定 (英国)戏剧的成就 ______ 。","options":[],"key":"填国家","answer":"填国家","max":2,"id":"西方文论-2-fill-23"},{"n":24,"type":"fill","prompt":"席勒在《论素朴的诗与感伤的诗》中指出,“素朴的诗”模仿自然,“感伤的诗”则追求 ______ 。","options":[],"key":"理想","answer":"理想","max":2,"id":"西方文论-2-fill-24"},{"n":25,"type":"fill","prompt":"现实主义文论中,车尔尼雪夫斯基提出“美是生活”,认为艺术的功能不仅是再现生活, 更重要的是 ______ 生活。","options":[],"key":"解释","answer":"解释","max":2,"id":"西方文论-2-fill-25"},{"n":26,"type":"fill","prompt":"马拉美作为象征主义代表,提出“纯诗论”,主张诗歌应摆脱(实用目的 ______ )的束缚,追求语言自身的韵律与意境。","options":[],"key":"或“现实功利”","answer":"或“现实功利”","max":2,"id":"西方文论-2-fill-26"},{"n":27,"type":"fill","prompt":"荣格的心理分析文论中,“集体无意识”的载体是“(原始意象 ______ )”,即人类远古经验的文化积淀。","options":[],"key":"或“原型”","answer":"或“原型”","max":2,"id":"西方文论-2-fill-27"},{"n":28,"type":"fill","prompt":"巴赫金的“对话理论”强调文本的意义产生于不同声音的 ______ ,而非单一权威的独白。","options":[],"key":"对话与互动","answer":"对话与互动","max":2,"id":"西方文论-2-fill-28"},{"n":29,"type":"fill","prompt":"西方马克思主义文论中,本雅明提出“作为生产者的作家”,强调作家应关注文学的 ______ 方式与社会功能。","options":[],"key":"生产","answer":"生产","max":2,"id":"西方文论-2-fill-29"},{"n":30,"type":"fill","prompt":"德里达的解构主义文论中,“延异”指语言意义的 ______ 与不确定性,打破了传统的逻各斯中心主义。","options":[],"key":"延迟与差异","answer":"延迟与差异","max":2,"id":"西方文论-2-fill-30"},{"n":31,"type":"term","prompt":"摹仿论(亚里士多德)","options":[],"key":"","answer":"亚里士多德在《诗学》中提出的概念,肯定现实世界的真实,认为文艺摹仿“在行动中的人”。其内涵包括:一是摹仿对象是现实人生;二是摹仿要揭示现实的普遍本质与必然规律;三是允许通过虚构提炼现实,达到更高的艺术真实。","max":3,"id":"西方文论-2-term-31"},{"n":32,"type":"term","prompt":"崇高论(朗吉弩斯)","options":[],"key":"","answer":"古罗马朗吉弩斯在《论崇高》中提出的文论思想,探讨崇高风格及其来源。他认为崇高是伟大心灵的回声,体现为作品的雄伟、庄严与震撼力。崇高风格来源于庄严伟大的思想、慷慨激昂的热情、辞格藻饰、高雅措辞与结构,其中思想与情感是核心。","max":3,"id":"西方文论-2-term-32"},{"n":33,"type":"term","prompt":"接受美学(姚斯、伊瑟尔)","options":[],"key":"","answer":"20世纪60年代兴起的文论思潮,代表人物为姚斯与伊瑟尔,主张文学研究由文本转向读者接受。姚斯提出“文学接受史”,主张结合不同时代读者的解读考察作品意义;伊瑟尔提出 “未定点”与“召唤结构”,认为文本存在意义空白,需读者填补。","max":3,"id":"西方文论-2-term-33"},{"n":34,"type":"short","prompt":"简述柏拉图对文艺的“指控”及其理论依据。","options":[],"key":"","answer":"柏拉图基于理念论对文艺提出三点指控:(1)文艺不真实:艺术摹仿现实,现实摹仿理念,艺术是“摹本的摹本,影子的影子”,与真理隔着三层。(2)文艺败坏道德:摹仿的文艺滋养“感伤癖”“哀怜癖”等低劣情感,摧残理性,导致品德堕落。(3)文艺亵渎神灵与英雄:史诗歪曲神与英雄的崇高本质,使青年丧失对美德的崇敬。","max":5,"id":"西方文论-2-short-34"},{"n":35,"type":"short","prompt":"简析黑格尔“艺术的历史类型”理论的主要内容。","options":[],"key":"","answer":"黑格尔在《美学》中基于“美是理念的感性显现”,将艺术发展分为三种类型:(1)象征型艺术:理念抽象模糊,形式大于内容,风格神秘、崇高。(2)古典型艺术:理念具体化为人的心灵,感性形式与理念完美契合,内容与形式和谐统一。(3)浪漫型艺术:理念突破感性形式,转向心灵内在世界,内容大于形式,强调主体性。","max":5,"id":"西方文论-2-short-35"},{"n":36,"type":"essay","prompt":"结合具体理论家与作品,论述西方文论中“文学与现实关系”的演变逻辑。","options":[],"key":"","answer":"一、古代“摹仿论”主导:柏拉图提出“三重世界”说,亚里士多德在《诗学》中肯定文艺摹仿现实,贺拉斯主张“寓教于乐”。 二、近代“表现论”兴起:华兹华斯主张诗是“强烈感情的自然流露”,现实主义文论强调“典型化”。 三、现代形式论与心理论:弗洛伊德将“现实”拓展至无意识,什克洛夫斯基主张“陌生化”。 四、当代“互动论”主导:姚斯、伊瑟尔主张意义需读者解读完成。","max":15,"id":"西方文论-2-essay-36"}],"rawMax":74},{"id":"西方文论-3","title":"2026年模拟试卷(二)","questions":[{"n":1,"type":"single","prompt":"柏拉图在《伊安篇》中提出“诗的迷狂说”,认为真正的诗人创作依赖","options":[{"key":"A","text":"理性思考与技艺训练"},{"key":"B","text":"神灵凭附与灵感激发"},{"key":"C","text":"对现实生活的细致观察"},{"key":"D","text":"对哲学概念的准确转化"}],"key":"B","answer":"神灵凭附与灵感激发","max":1,"id":"西方文论-3-single-1"},{"n":2,"type":"single","prompt":"亚里士多德在《诗学》中认为,悲剧的核心要素是","options":[{"key":"A","text":"性格"},{"key":"B","text":"情节"},{"key":"C","text":"言词"},{"key":"D","text":"思想"}],"key":"B","answer":"情节","max":1,"id":"西方文论-3-single-2"},{"n":3,"type":"single","prompt":"中世纪托马斯·阿奎那提出“释经四义”,其中“字面义”指的是","options":[{"key":"A","text":"文本的隐喻象征意义"},{"key":"B","text":"文本的历史事实意义"},{"key":"C","text":"文本的道德教化意义"},{"key":"D","text":"文本的宗教神秘意义"}],"key":"B","answer":"文本的历史事实意义","max":1,"id":"西方文论-3-single-3"},{"n":4,"type":"single","prompt":"文艺复兴时期,卡斯特尔维屈罗在《亚里士多德〈诗学〉的诠释》中,对戏剧“三一律” 的推导依据是","options":[{"key":"A","text":"古希腊戏剧的创作传统"},{"key":"B","text":"戏剧舞台表演的现实限制"},{"key":"C","text":"教会对戏剧内容的规范"},{"key":"D","text":"贵族阶层的审美偏好"}],"key":"B","answer":"戏剧舞台表演的现实限制","max":1,"id":"西方文论-3-single-4"},{"n":5,"type":"single","prompt":"新古典主义时期,蒲柏在《论批评》中主张“古典即自然”,其内涵是","options":[{"key":"A","text":"古典作品完美再现了原始自然"},{"key":"B","text":"古典作品符合理性与普遍人性"},{"key":"C","text":"古典作品记录了各民族的独特风俗"},{"key":"D","text":"古典作品是艺术家主观想象的产物"}],"key":"B","answer":"古典作品符合理性与普遍人性","max":1,"id":"西方文论-3-single-5"},{"n":6,"type":"single","prompt":"启蒙主义文论中,莱辛在《拉奥孔》中区分“诗与画”,认为诗的优势在于","options":[{"key":"A","text":"表现空间中并列的物体"},{"key":"B","text":"表现时间中连续的动作"},{"key":"C","text":"通过视觉直接传递美感"},{"key":"D","text":"依赖色彩与形状塑造形象"}],"key":"B","answer":"表现时间中连续的动作","max":1,"id":"西方文论-3-single-6"},{"n":7,"type":"single","prompt":"席勒在《审美教育书简》中提出“审美游戏说”,认为艺术的本质是","options":[{"key":"A","text":"感性与理性的自由和谐"},{"key":"B","text":"对自然的精确摹仿"},{"key":"C","text":"对社会现实的批判"},{"key":"D","text":"艺术家个人情感的宣泄"}],"key":"A","answer":"感性与理性的自由和谐","max":1,"id":"西方文论-3-single-7"},{"n":8,"type":"single","prompt":"歌德在《歌德谈话录》中提出“世界文学”概念,其核心是","options":[{"key":"A","text":"各民族文学相互借鉴,形成文化共同体"},{"key":"B","text":"欧洲文学取代其他地区文学的主导地位"},{"key":"C","text":"以古希腊文学为范本,统一全球文学风格"},{"key":"D","text":"消除民族差异,实现文学语言的统一"}],"key":"A","answer":"各民族文学相互借鉴,形成文化共同体","max":1,"id":"西方文论-3-single-8"},{"n":9,"type":"single","prompt":"浪漫主义文论中,施莱格尔兄弟主张浪漫主义诗歌的本质是","options":[{"key":"A","text":"对中世纪宗教文学的复古"},{"key":"B","text":"与哲学结合,趋向无限与自由"},{"key":"C","text":"严格遵循新古典主义的形式规范"},{"key":"D","text":"以宫廷生活为题材,彰显贵族道德"}],"key":"B","answer":"与哲学结合,趋向无限与自由","max":1,"id":"西方文论-3-single-9"},{"n":10,"type":"single","prompt":"现实主义文论中,左拉提出“自然主义”,其核心主张是","options":[{"key":"A","text":"以科学方法记录现实,强调生理与遗传因素"},{"key":"B","text":"通过想象重构现实,塑造理想化人物"},{"key":"C","text":"以神话为题材,突出神性与崇高"},{"key":"D","text":"忽视现实逻辑,追求形式创新"}],"key":"A","answer":"以科学方法记录现实,强调生理与遗传因素","max":1,"id":"西方文论-3-single-10"},{"n":11,"type":"single","prompt":"19世纪末20世纪初,圣伯夫的“传记批评”核心是","options":[{"key":"A","text":"通过作家生平解读作品意义"},{"key":"B","text":"聚焦作品的文本结构与语言形式"},{"key":"C","text":"分析作品与社会历史的关联"},{"key":"D","text":"考察读者对作品的接受过程"}],"key":"A","answer":"通过作家生平解读作品意义","max":1,"id":"西方文论-3-single-11"},{"n":12,"type":"single","prompt":"波德莱尔在《恶之花》中体现的“感应论”,强调自然万物的关联具有","options":[{"key":"A","text":"科学可验证的因果性"},{"key":"B","text":"神秘主义的象征性"},{"key":"C","text":"理性逻辑的必然性"},{"key":"D","text":"艺术家主观臆断的随意性"}],"key":"B","answer":"神秘主义的象征性","max":1,"id":"西方文论-3-single-12"},{"n":13,"type":"single","prompt":"尼采在《悲剧的诞生》中认为,悲剧的诞生源于","options":[{"key":"A","text":"日神精神与酒神精神的冲突与融合"},{"key":"B","text":"对现实苦难的直接控诉"},{"key":"C","text":"对英雄人物的无限崇拜"},{"key":"D","text":"对理性精神的绝对推崇"}],"key":"A","answer":"日神精神与酒神精神的冲突与融合","max":1,"id":"西方文论-3-single-13"},{"n":14,"type":"single","prompt":"弗洛伊德的“俄狄浦斯情结”理论,用于文学分析时关注","options":[{"key":"A","text":"作品的社会历史背景"},{"key":"B","text":"作家的童年经历与潜意识"},{"key":"C","text":"文本的语言结构与隐喻"},{"key":"D","text":"读者的接受心理与审美体验"}],"key":"B","answer":"作家的童年经历与潜意识","max":1,"id":"西方文论-3-single-14"},{"n":15,"type":"single","prompt":"俄国形式主义中,雅各布森提出“文学性”,认为其核心是","options":[{"key":"A","text":"文学反映的社会现实"},{"key":"B","text":"文学作品的题材与主题"},{"key":"C","text":"使语言“陌生化”的形式技巧"},{"key":"D","text":"作家的创作意图与情感"}],"key":"C","answer":"使语言“陌生化”的形式技巧","max":1,"id":"西方文论-3-single-15"},{"n":16,"type":"single","prompt":"英美新批评中,瑞恰慈提出“情感语言”理论,主张文学语言的功能是","options":[{"key":"A","text":"传递客观知识"},{"key":"B","text":"表达情感与态度"},{"key":"C","text":"记录历史事实"},{"key":"D","text":"规范社会行为"}],"key":"B","answer":"表达情感与态度","max":1,"id":"西方文论-3-single-16"},{"n":17,"type":"single","prompt":"结构主义文论中,列维-斯特劳斯对神话的分析,核心是挖掘","options":[{"key":"A","text":"神话的历史真实性"},{"key":"B","text":"神话背后的二元对立结构"},{"key":"C","text":"神话创作者的个人经历"},{"key":"D","text":"神话对读者的教化功能"}],"key":"B","answer":"神话背后的二元对立结构","max":1,"id":"西方文论-3-single-17"},{"n":18,"type":"single","prompt":"西方马克思主义文论中,卢卡契强调“现实主义的整体性”,其内涵是","options":[{"key":"A","text":"文学需反映社会的总体矛盾与历史规律"},{"key":"B","text":"文学应聚焦个人的心理与情感世界"},{"key":"C","text":"文学需遵循形式创新的绝对自由"},{"key":"D","text":"文学应回避社会现实的冲突与矛盾"}],"key":"A","answer":"文学需反映社会的总体矛盾与历史规律","max":1,"id":"西方文论-3-single-18"},{"n":19,"type":"single","prompt":"读者接受文论中,伊瑟尔提出“召唤结构”,指的是","options":[{"key":"A","text":"文本中存在意义空白,需读者填补"},{"key":"B","text":"作家对读者阅读行为的预设与引导"},{"key":"C","text":"文本对社会现实的批判与召唤"},{"key":"D","text":"读者对文本意义的绝对主导"}],"key":"A","answer":"文本中存在意义空白,需读者填补","max":1,"id":"西方文论-3-single-19"},{"n":20,"type":"single","prompt":"后结构主义文论中,德谟克利特的“修辞解构”理论,关注","options":[{"key":"A","text":"文本意义的稳定性与确定性"},{"key":"B","text":"语言修辞对文本意义的消解"},{"key":"C","text":"作家创作意图的权威性"},{"key":"D","text":"文本与现实的直接对应"}],"key":"B","answer":"语言修辞对文本意义的消解","max":1,"id":"西方文论-3-single-20"},{"n":21,"type":"fill","prompt":"柏拉图在《理想国》中认为,理想国的文艺审查应遵循 ______ 原则与城邦政治原则。","options":[],"key":"道德","answer":"道德","max":2,"id":"西方文论-3-fill-21"},{"n":22,"type":"fill","prompt":"中世纪奥古斯丁的象征理论认为,世界美是神性美的(映像 ______ ),需通过心灵观照神性美。","options":[],"key":"或“反映”","answer":"或“反映”","max":2,"id":"西方文论-3-fill-22"},{"n":23,"type":"fill","prompt":"文艺复兴时期,锡德尼在《为诗辩护》中指出,诗的优势在于既超越历史的个别性,又比哲学更具(形象性 ______ )。","options":[],"key":"或“直观性”","answer":"或“直观性”","max":2,"id":"西方文论-3-fill-23"},{"n":24,"type":"fill","prompt":"新古典主义时期,约翰生在《莎士比亚戏剧集序言》中,肯定莎士比亚塑造“(类型化的典型 ______ )”的成就,即兼具普遍性与个性的人物。","options":[],"key":"或“普遍人性的代表”","answer":"或“普遍人性的代表”","max":2,"id":"西方文论-3-fill-24"},{"n":25,"type":"fill","prompt":"启蒙主义文论中,赫尔德提出“民族文学论”,主张文学应扎根本民族的(语言 ______ )与历史文化。","options":[],"key":"或“风俗”“生活”","answer":"或“风俗”“生活”","max":2,"id":"西方文论-3-fill-25"},{"n":26,"type":"fill","prompt":"康德在《判断力批判》中提出“天才论”,认为天才是“天生的内心素质,通过它 ______ 给艺术提供规则”。","options":[],"key":"自然","answer":"自然","max":2,"id":"西方文论-3-fill-26"},{"n":27,"type":"fill","prompt":"黑格尔在《美学》中指出,浪漫型艺术的核心是转向(心灵 ______ )的内在世界,内容大于形式。","options":[],"key":"或“主体”“情感”","answer":"或“主体”“情感”","max":2,"id":"西方文论-3-fill-27"},{"n":28,"type":"fill","prompt":"象征主义文论中,马拉美主张“纯诗”应追求语言的(自主性 ______ )与韵律的纯粹性,摆脱现实功利。","options":[],"key":"或“纯粹性”","answer":"或“纯粹性”","max":2,"id":"西方文论-3-fill-28"},{"n":29,"type":"fill","prompt":"荣格的“集体无意识”理论中,(原始意象 ______ )是远古经验在人类心灵中的积淀,如“英雄原型”“母亲原型”。","options":[],"key":"或“原型”","answer":"或“原型”","max":2,"id":"西方文论-3-fill-29"},{"n":30,"type":"fill","prompt":"德里达的解构主义中,“逻各斯中心主义”指传统西方思想对(逻辑 ______ )、稳定意义的追求。","options":[],"key":"或“理性”“真理”","answer":"或“理性”“真理”","max":2,"id":"西方文论-3-fill-30"},{"n":31,"type":"term","prompt":"寓教于乐(贺拉斯)","options":[],"key":"","answer":"贺拉斯在《诗艺》中提出的文艺功能理论,主张文学兼具教育与娱乐功能,并通过娱乐实现教育目的。“教”指文学传播道德教化、引导公民品德;“乐”指文学凭借生动情节、优美语言带给读者审美愉悦。二者结合才能使文学既劝谕读者又使他喜爱。","max":3,"id":"西方文论-3-term-31"},{"n":32,"type":"term","prompt":"素朴的诗与感伤的诗(席勒)","options":[],"key":"","answer":"席勒在《论素朴的诗与感伤的诗》中提出的文论范畴,用以区分古代与近代文学。“素朴的诗”对应古代文学,与自然和谐统一,以现实真实为核心;“感伤的诗”对应近代文学,因人与自然分裂而转向理想。席勒认为理想文学应融合二者。","max":3,"id":"西方文论-3-term-32"},{"n":33,"type":"term","prompt":"陌生化(什克洛夫斯基)","options":[],"key":"","answer":"俄国形式主义代表什克洛夫斯基提出的概念,用于界定“文学性”。陌生化指打破日常语言与思维的惯性,延长审美感知时间,使熟悉事物变得新奇,凸显文学的审美特质。该理论转向形式的审美价值,为文本中心研究奠定基础。","max":3,"id":"西方文论-3-term-33"},{"n":34,"type":"short","prompt":"简述贺拉斯《诗艺》中“合式”原则的具体内涵。","options":[],"key":"","answer":"贺拉斯在《诗艺》中提出的“合式”原则是新古典主义文论的核心创作规范,内涵包括四个方面:(1)作品整体的一致性:结构完整、逻辑连贯。(2)人物性格与身份、年龄的一致性:性格须符合身份与年龄特征。(3)语言与人物、情境的一致性:语言须匹配人物身份与遭遇。(4)体裁与主题的一致性:不同体裁须匹配相应主题。","max":5,"id":"西方文论-3-short-34"},{"n":35,"type":"short","prompt":"简析弗洛伊德心理分析文论中“无意识”与文学创作的关系。","options":[],"key":"","answer":"弗洛伊德认为“无意识”是文学创作的核心动力,其关系表现在:(1)无意识是创作的源泉:被压抑的本能欲望无法在现实中满足,便通过创作“升华”为艺术形象。(2)文学创作是“白日梦”的变形:作家通过虚构情节满足无意识欲望。(3)作品意义需通过“释梦”解读:表层情节是“显梦”,深层欲望是“隐梦”,需分析象征与隐喻。","max":5,"id":"西方文论-3-short-35"},{"n":36,"type":"essay","prompt":"结合具体文论家与理论观点,论述西方浪漫主义文论对新古典主义文论的突破与超越。","options":[],"key":"","answer":"一、创作原则:由理性主导转向情感与想象核心。新古典主义崇尚理性,华兹华斯主张诗是 “强烈感情的自然流露”。 二、题材选择:由贵族与古典转向平民与自然。 三、形式规范:由严格规则转向自由创新。新古典主义守“三一律”与体裁界限,浪漫主义打破束缚。 四、作家地位:由规则追随者转向天才创造者。浪漫主义抬高天才,康德提出“天才论”,强调独创性。","max":15,"id":"西方文论-3-essay-36"}],"rawMax":74},{"id":"西方文论-4","title":"2026年模拟试卷(三)","questions":[{"n":1,"type":"single","prompt":"柏拉图在《斐德若篇》中区分了“迷狂的诗”与“模仿的诗”,认为更具价值的是","options":[{"key":"A","text":"模仿的诗,因其符合现实逻辑"},{"key":"B","text":"迷狂的诗,因其得自神灵凭附"},{"key":"C","text":"两者同等重要,需相互补充"},{"key":"D","text":"两者均无价值,应排除于理想国"}],"key":"B","answer":"迷狂的诗,因其得自神灵凭附","max":1,"id":"西方文论-4-single-1"},{"n":2,"type":"single","prompt":"亚里士多德在《诗学》中指出,悲剧主角的“过失”指的是","options":[{"key":"A","text":"纯粹的恶行与罪孽"},{"key":"B","text":"性格缺陷导致的非故意错误"},{"key":"C","text":"神灵强加的命运惩罚"},{"key":"D","text":"社会环境造成的必然悲剧"}],"key":"B","answer":"性格缺陷导致的非故意错误","max":1,"id":"西方文论-4-single-2"},{"n":3,"type":"s
