步”均见曹植《洛神赋》对洛神容态的描摹，非《白马篇》等诗赋。","anaAI":true},{"t":"s","n":20,"stem":"潘岳《哀永逝文》追悼的是","score":1,"opts":["父亲","妻子","朋友","兄长"],"ans":"B","ana":"潘岳《哀永逝文》悼念妻子杨氏，写夫妻死别之悲；潘岳另有著名的《悼亡诗》。","anaAI":true},{"t":"s","n":21,"stem":"“赋体物而浏亮”的提出者是","score":1,"opts":["曹植","陆机","左思","傅玄"],"ans":"B","ana":"“诗缘情而绮靡，赋体物而浏亮”见陆机《文赋》，强调赋体摹写事物、文辞明朗。","anaAI":true},{"t":"s","n":22,"stem":"“集六朝地志之大成”的著作是","score":1,"opts":["《洛阳伽蓝记》","《水经注》","《荆州记》","《华阳国志》"],"ans":"B","ana":"郦道元《水经注》沿河流详述地理风物和历史传说，兼收历代地志资料，有“集六朝地志之大成”之称。","anaAI":true},{"t":"s","n":23,"stem":"主张恢复古诗比兴言志风雅传统的唐代诗人是","score":1,"opts":["王绩","陈子昂","张若虚","上官仪"],"ans":"B","ana":"陈子昂《与东方左史虬修竹篇序》批评齐梁浮艳，倡“汉魏风骨”“风雅兴寄”，恢复比兴言志传统。","anaAI":true},{"t":"s","n":24,"stem":"《从军行七首》的作者是","score":1,"opts":["王粲","王之涣","王翰","王昌龄"],"ans":"D","ana":"盛唐王昌龄作组诗《从军行七首》，包括“青海长云暗雪山”等边塞名篇；须区别王之涣等人的同题作品。","anaAI":true},{"t":"s","n":25,"stem":"高适《塞下曲》表达的内容是","score":1,"opts":["建功立业","思乡","不遇的悲慨","爱情"],"ans":"A","ana":"高适《塞下曲》以“翩翩出从戎”“万里不惜死，一朝得成功”写从军立功的抱负，并非以乡愁或爱情为主。","anaAI":true},{"t":"s","n":26,"stem":"盛唐边塞诗留存最多的诗人是","score":1,"opts":["高适","岑参","王昌龄","陶翰"],"ans":"B","ana":"岑参久居西北幕府，边塞诗留存七十余首，题材与数量皆丰富，数量通常认为居盛唐边塞诗人之首。","anaAI":true},{"t":"s","n":27,"stem":"“旗亭画壁”故事中的夺冠之作是","score":1,"opts":["王之涣《凉州词》其一","高适《燕歌行》","岑参《走马川行奉送出师西征》","崔颢《黄鹤楼》"],"ans":"A","ana":"“旗亭画壁”故事中歌妓终唱王之涣“黄河远上白云间”，为约定的压轴夺冠；前三位诗人是王昌龄、高适、王之涣，并无岑参或崔颢。","anaAI":true},{"t":"s","n":28,"stem":"“致君尧舜上，再使风俗淳”的政治理想出自","score":1,"opts":["李白","白居易","元稹","杜甫"],"ans":"D","ana":"“致君尧舜上，再使风俗淳”是杜甫《奉赠韦左丞丈二十二韵》自陈的政治理想。","anaAI":true},{"t":"s","n":29,"stem":"白居易最看重的是自己的","score":1,"opts":["讽喻诗","闲适诗","感伤诗","杂律诗"],"ans":"A","ana":"白居易《与元九书》提出“文章合为时而著，歌诗合为事而作”，尤其看重讽喻诗的现实劝戒作用。","anaAI":true},{"t":"s","n":30,"stem":"元稹“合并融化唐代小说之史才诗笔议论为一体而成”的作品是","score":1,"opts":["《长恨歌传》","《上阳白发人》","《莺莺传》","《连昌宫词》"],"ans":"D","ana":"《连昌宫词》以宫人叙述唐玄宗朝盛衰，融合叙事、诗笔与史论；《莺莺传》虽亦出元稹，却是文言传奇而非此评所指长篇叙事诗。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"以下关于《诗经》的说法，正确的有","score":2,"opts":["共305篇","《小雅》中另有6篇“笙诗”","齐、鲁、韩、毛四家《诗》流传至今","收录西周初年到春秋中叶500多年的诗歌","《诗经》的收集，有“采诗”“献诗”的说法"],"ans":"ABDE","ana":"《诗经》305篇之外，《小雅》另有六篇有目无辞的笙诗，故“另有6篇”也正确；齐、鲁、韩、毛四家中前三家失传、毛诗传世；作品年代及采诗、献诗说亦正确。按选项应为ABDE，附录ADE漏选B。","anaAI":true,"qaNotes":"本地古代文学史笔记明确“305篇之外，《小雅》另有六篇笙诗有目无辞，不计入305篇”；题干措辞“另有”直接支持B。附录排除B是把不计入305篇误当不存在。已据完整题干、选项与本地笔记将ans更正为ABDE。"},{"t":"m","n":32,"stem":"以下不是建安文学代表作家的有","score":2,"opts":["蔡邕","曹操","刘桢","蔡琰","阮籍"],"ans":"AE","ana":"曹操、刘桢是建安诗坛重要作家；阮籍属正始文学，蔡邕主要活动于建安以前。蔡琰的《悲愤诗》通常列为建安时期代表作品，故D不应因女性身份或晚汉经历被排除。","anaAI":true},{"t":"m","n":33,"stem":"以下属于志人小说的有","score":2,"opts":["《语林》","《郭子》","《西京杂记》","《俗说》","《世说新语》"],"ans":"ABDE","ana":"本地古代文学史教材笔记明确列《语林》《郭子》《俗说》《世说新语》为志人小说，并明确《西京杂记》内容驳杂、归杂史类，故本课程口径排除C，答案ABDE。","anaAI":true,"qaNotes":"已查本地《古代文学史一_00538_60分笔记.md》“志人小说作品辨认”：四部A、B、D、E属志人小说；《西京杂记》教材归杂史类。按本地指定课程笔记口径，ans定为ABDE，不沿用先前对资料分类分歧的泛化疑虑。"},{"t":"m","n":34,"stem":"以下诗作属于白居易的有","score":2,"opts":["《秦中吟》","《新乐府》","《长恨歌》","《琵琶行》","《田家行》"],"ans":"ABCD","ana":"《秦中吟》《新乐府》是白居易讽喻诗组，《长恨歌》《琵琶行》也是其长篇叙事诗；《田家行》作者王建。","anaAI":true},{"t":"m","n":35,"stem":"杜牧咏史诗的特点有","score":2,"opts":["不关心政治","立意高绝","议论不落窠臼","反映了寒士的不平之鸣","即景抒情中注入了深沉的历史感慨"],"ans":"BCE","ana":"杜牧咏史诗常从既定结论外翻出新意，在《赤壁》《泊秦淮》等景物中寄寓历史政治感慨；关心时局，所以A不对；寒士不遇不是此类咏史诗的核心特色，D不取。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《诗经》“六义”","score":3,"ans":"风、雅、颂、赋、比、兴。前三者是《诗经》诗篇按音乐与用途区分的类别：风为地方土乐，雅为朝廷正乐，颂为宗庙祭祀乐歌；赋、比、兴为铺陈直叙、譬喻比拟、先言他物起兴的表现方式。","ana":"“六义”见传统《诗》学概括，须分清风雅颂的体类和赋比兴的表现法；兴往往由眼前他物引出所咏，如《关雎》由雎鸠起兴，不应把“六义”全写成六种诗歌题材。","anaAI":true},{"t":"term","n":37,"stem":"《吴越春秋》","score":3,"ans":"东汉赵晔撰《吴越春秋》，以吴越争霸及相关史事为主线，采入神话传说与民间故事；叙事连贯，人物描写带小说化色彩。","ana":"《吴越春秋》不同于按国记录言论的《国语》：赵晔按吴越兴亡串联史事，吸纳越王勾践、伍子胥等人物故事；历史叙述与传说结合，具有小说化倾向，但仍属历史散文。","anaAI":true},{"t":"term","n":38,"stem":"南朝乐府民歌","score":3,"ans":"南朝乐府民歌主要产生于长江中下游，以《乐府诗集·清商曲辞》中的吴歌、西曲为主体；多写男女恋情，篇幅短小、言语清丽婉转，善用双关谐音；《西洲曲》为长篇代表。","ana":"《西洲曲》体现南朝民歌的婉转相思与连环意象；南朝吴歌、西曲和北朝《木兰诗》风格、地域不可混称。题中的“以《清商曲辞》为主”是传世辑录位置，非说民歌皆由宫廷创作。","anaAI":true},{"t":"term","n":39,"stem":"“诗鬼”","score":3,"ans":"“诗鬼”是李贺的别称。其诗常以神仙鬼魅、死亡和瑰异景物入诗，想象诡谲、色彩浓烈，语言雕琢奇峭，如《李凭箜篌引》《梦天》；并非全部作品都写鬼。","ana":"李贺被称“诗鬼”，在于其诗常把幽冷意象与奇幻想象并置，像《李凭箜篌引》的音乐想象、《梦天》的太空视角；称号概括诗风，不是以鬼怪数量定义其全部诗歌。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"short","n":40,"stem":"简述我国神话的类别。","score":5,"ans":"可从题材分为：①创世神话，如盘古开天、女娲造人；②自然神话，解释或挑战自然，如夸父逐日、精卫填海；③英雄神话，写造福人类的文化英雄，如后羿射日、大禹治水；④战争或社会神话，如黄帝与蚩尤之战。分类可交叉，例如女娲补天既有自然灾变又含英雄救难，不宜机械限定。","ana":"类别并无唯一排他的分法：盘古开天地关乎起源，夸父追日关乎人和自然，后羿除害、大禹治水关乎英雄救世，黄帝与蚩尤则关乎部族战争；女娲补天亦可被归作英雄神话，宜说明分类角度。","anaAI":true},{"t":"short","n":41,"stem":"简述《楚辞》的渊源。","score":5,"ans":"《楚辞》由楚地文化孕育：楚国民歌、巫祝祭歌与音乐舞蹈提供句式、声调及“兮”的运用；《诗经》的比兴传统经香草美人等意象拓展；楚地神话、民俗与历史传说提供奇幻素材；楚地方言、地域风物赋予鲜明地方色彩。屈原在这些基础上创造成熟的新诗体，不能将《楚辞》仅视为巫歌汇编。","ana":"《楚辞》同时承继《诗经》的比兴并吸收楚地巫风、方言、歌舞与神话。屈原《九歌》与祭神歌舞关系密切，《离骚》把香草美人发展为连贯象征体系；渊源与屈原创新须分别交代。","anaAI":true},{"t":"short","n":42,"stem":"简述左思《咏史诗》的内容与艺术特色。","score":5,"ans":"左思《咏史》八首借古人古事抒写自身怀抱，揭露门阀制度造成的寒士不遇，亦有建功立业的志向；如“郁郁涧底松，离离山上苗”以地势反衬出身决定仕途。艺术上咏史与咏怀相融，借古讽今，比兴鲜明，笔力刚健、辞气慷慨，钟嵘以“左思风力”称其特色。","ana":"“郁郁涧底松，离离山上苗”以松苗与地势暗写“世胄蹑高位，英俊沉下僚”；《咏史》并非纯客观史事复述，而把社会批判、个人理想与雄健风骨熔为一体。","anaAI":true},{"t":"short","n":43,"stem":"为什么说唐传奇标志着小说的成熟?","score":5,"ans":"唐传奇标志文言小说逐渐成熟：作者从六朝志怪的搜录传闻发展为有意经营虚构；情节因果较完整，有波折和伏笔；人物通过言行、冲突显示个性，如《李娃传》《霍小玉传》；叙事、诗歌、议论相结合，语言凝练有文采；爱情、侠义、历史及奇异等题材广阔。成熟是相对先前小说形态而言，并非此后再无发展。","ana":"与六朝志怪偏重记录奇闻相比，唐传奇《李娃传》以郑生遭际组织曲折情节，《霍小玉传》塑造相爱、负心和悲剧冲突；人物、结构、语言及有意识虚构共同构成成熟标志。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"essay","n":44,"stem":"论述《史记》刻画人物的经典手法。","score":14,"ans":"《史记》写人物不只平铺生平：①选取决定性事件与尖锐冲突，如《项羽本纪》巨鹿之战、鸿门宴与垓下之围，呈现勇武、刚愎和末路悲情；②通过人物的个性化言语、动作与场面细节塑造性格，如项羽“彼可取而代也”、刘邦“大丈夫当如此也”的对照；③正面描写与旁人反应、人物间对比互相映照；④互见法将同一人物材料分置相关本纪列传，合读见其复杂面貌；⑤叙事中寓褒贬，亦常借“太史公曰”点明判断。应结合具体篇章，不把附录“心理描写”泛泛列为每篇都有的固定模式。","ana":"“互见法”可将人物的不同侧面分散写于相关传记，并非重复抄写；《项羽本纪》中巨鹿、鸿门与垓下三场面连贯展示人物命运，作者以具体事件和言行使历史判断可感。附录只列名目，作答宜每项配史传例证。","anaAI":true},{"t":"essay","n":45,"stem":"论述李白诗歌的艺术成就。","score":14,"ans":"李白诗歌以强烈主体抒情和瑰丽想象著称：《将进酒》以黄河奔流放大生命感喟，《蜀道难》用神话、夸张与跳跃的空间写蜀道险绝。意象既有大鹏、黄河、瀑布的雄奇壮阔，也有月色、清溪的清丽明朗；诗人善以比喻、夸张、神仙典故突破现实尺度。语言清新明快、率真自然，乐府与七言歌行尤其擅长长短句交错、节奏变化，绝句亦能以简净语写开阔意境，如《早发白帝城》。诗中理想与失意交织，不宜仅以“浪漫”二字概括；题材广及山水、游仙、饮酒、送别等。","ana":"分析李白不应将“题材丰富”“影响深远”直接充作艺术手法。举《蜀道难》说明句法变换、夸张与想象，举《将进酒》说明主观情感的起伏，举《望庐山瀑布》或《早发白帝城》说明明快语言与壮丽、清丽意象并存。","anaAI":true}]}],"code":"00538","qaNotes":["原卷45题、100分；题干与选项逐一据原卷而非附录转录，附录35道选择题、10道主观题均逐题对齐。附录答案为非官方资料；所有解析均经改写/补充，anaAI=true，不表示官方解释。","第31题附录给ADE，漏选B。原卷B明确说《小雅》中“另有6篇笙诗”，与通行《诗经》305篇有辞、另六篇有目无辞的知识一致；附录解析自己也承认六篇确在《小雅》却以“不算入305篇”否定B，混淆“另有”和“计入”。建议ABDE，暂标待人工复核附录错键。","第33题附录给ABDE，并径称《西京杂记》属杂史类；但《西京杂记》记人物轶事兼杂录异闻，志人小说/笔记分类在资料中存在口径差异。候选ABDE或ABCDE；该题ans置为[答案待核…]，不宜自动评分，须对照指定教材分类。","第32题附录AE，蔡琰《悲愤诗》一般列建安时期作家作品，暂从AE；若指定教材将蔡琰另列，需复核。第40题附录将“女娲补天”仅列自然类，实际也可按英雄救难归类；主观参考答案改为非排他表述。第44题附录泛列心理描写而缺例证，已改用典型事件、个性语言、互见和对比举例。","本地跨卷复核：gws-2504第4题“儒墨显学”与本卷6题同题不同字母；gws-2504第11题《论贵粟疏》与本卷11题同题不同字母；gws-2210第1题的305篇另六笙诗支持本卷31题B；gws-2504与gws-2304第36题《天问》支持本卷9题；gws-2404第43题唐传奇和gws-2210第39题对应本卷43题；gws-2310第35题与gws-2210第45题李白艺术对应本卷45题。计2道同题干选项重排直接核对，另5个题号/主题共7题有局部或内容佐证；其余题由作品、作者和文史知识逐项核，不能以旧卷字母代替内容。","指定题31、33已按本地《古代文学史一_00538_60分笔记.md》核定：31=ABDE（六篇笙诗有目无辞但“另有”成立）；33=ABDE（本课程笔记明确《西京杂记》归杂史类）。二题均有完整题干、选项和本地教材直接支持；未改其它题。"]},{"paper":"marx-2504","subject":"marx","session":"2504","label":"2025年4月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义是时代的产物，资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了","score":2,"opts":["阶级基础","客观条件","科学前提","思想渊源"],"ans":"B","ana":"资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了客观条件。"},{"t":"s","n":2,"stem":"马克思主义的基本特征用一句话来概括就是","score":2,"opts":["科学性与革命性的统一","科学性与人民性的统一","科学性与实践性的统一","科学性与发展性的统一"],"ans":"A","ana":"马克思主义的基本特征，如果用一句话来概括就是科学性与革命性的统一。"},{"t":"s","n":3,"stem":"思维和存在的关系问题作为哲学的基本问题也称为","score":2,"opts":["主体和客体的关系问题","理论和实践的关系问题","意识和物质的关系问题","社会和自然的关系问题"],"ans":"C","ana":"存在和思维的关系问题又称为物质和意识的关系问题，构成了全部哲学的基本问题。"},{"t":"s","n":4,"stem":"运动是物质的根本属性，否认物质的运动和运动的绝对性，必然导致()。","score":2,"opts":["相对主义","不可知论","唯心主义","形而上学"],"ans":"D","ana":"运动是物质的固有属性，物质和运动不可分。物质世界的运动是无条件的、永恒的、绝对的。否认物质的运动和运动的绝对性，必然导致形而上学。"},{"t":"s","n":5,"stem":"唯物辩证法认为，事物之间的相互联系是事物本身固有的，是不以人的意志为转移的，这说明联系具有","score":2,"opts":["稳定性","普遍性","客观性","多样性"],"ans":"C","ana":"联系具有客观性。事物的联系是事物本身所固有的、不以人的意志为转移的。联系的客观性要求我们从客观事物本身固有的联系出发去认识事物。"},{"t":"s","n":6,"stem":"在唯物辩证法体系中，作为其实质和核心的是","score":2,"opts":["对立统一规律","量变质变规律","否定之否定规律","因果规律"],"ans":"A","ana":"对立统一规律是唯物辩证法的实质和核心。"},{"t":"s","n":7,"stem":"从物到感觉和思想与从感觉和思想到物的对立，是","score":2,"opts":["唯物辩证法和形而上学的对立","直观反映论和能动反映论的对立","唯物主义一元论和唯心主义一元论的对立","唯物主义反映论和唯心主义先验论的对立"],"ans":"D","ana":"唯物主义和唯心主义对认识本质的不同回答。在认识的本质问题上，存在着两条根本对立的认识路线：一条是坚持从物到感觉和思想的唯物主义认识路线，另一条是坚持从思想和感觉到物的唯心主义认识路线。唯物主义认识路线坚持反映论的立场，认为认识是主体对客体的反映，人的一切知识都是从后天接触实际中得来的。唯心主义认识路线否认认识是人脑对客观世界的反映，本质上是唯心主义先验论，使认识成了无源之水、无本之木。（P81-82）"},{"t":"s","n":8,"stem":"一个完整的认识过程包括两次飞跃，下列选项属于第二次飞跃的是","score":2,"opts":["收集感性材料","分析实际情况","提出科学假说","理论付诸实践"],"ans":"D","ana":"从认识到实践：从实践到认识，认识的过程还没有完成。要实现一个完整的认识过程，还必须由认识再回到实践中去，实现认识的第二次能动飞跃。（P88）"},{"t":"s","n":9,"stem":"哲学家们只是用不同的方式解释世界，问题在于改变世界的提出者是","score":2,"opts":["圣西门","费希特","马克思","恩格斯"],"ans":"C","ana":"“马克思指出：哲学家们只是用不同的方式解释世界，而问题在于改变世”界。（P14）"},{"t":"s","n":10,"stem":"社会存在是指","score":2,"opts":["社会物质生活条件的总和","地理环境和人口因素的总和","生产力和生产关系的总和","经济制度和政治体制的总和"],"ans":"A","ana":"社会存在是指社会物质生活条件，是社会生活的物质方面，主要包括自然地理环境、人口因素和物质生产方式。"},{"t":"s","n":11,"stem":"上层建筑对经济基础的反作用集中表现为","score":2,"opts":["它被经济基础决定","它反映经济基础的要求","它为经济基础服务","它适应经济基础的变化"],"ans":"C","ana":"上层建筑对经济基础具有反作用。集中表现在：上层建筑为自己的经济基础的形成和巩固服务，确立或维护其在社会中的统治地位。"},{"t":"s","n":12,"stem":"划分阶级的唯一标准是","score":2,"opts":["政治标准","经济标准","法律标准","道德标准"],"ans":"B","ana":"阶级首先是一个经济范畴，阶级就是在以生产资料私有制为基础的社会生产体系中处于不同地位的各个社会集团，其中一个集团能够占有另一个集团的劳动。"},{"t":"s","n":13,"stem":"关于人在历史上的作用，唯物史观认为","score":2,"opts":["每个人都在历史发展中起一定的作用","每个人都在历史发展中起同样的作用","历史人物对历史发展的作用都是积极的","普通个人对历史发展的作用是可忽略的"],"ans":"A","ana":"唯物史观从人民群众创造历史这一基本前提出发，既明确了人民群众是历史的创造者，也不否认个人在历史上的作用。个人在历史上的作用存在差别。有的人作用大些，可称为\"”历史人物;“有的人作用小些，可称为\"”普通个人。历史人物对历史发展有深刻影响，甚至有时能够决定个别历史事件的结局，从而导致历史发生这样或那样的重大变化。从其发挥作用的性质来看，有些历史人物起推动历史前进的进步作用，有些起阻碍历史前进的反动作用。"},{"t":"s","n":14,"stem":"下列关于使用价值和价值关系的理解中，正确的是","score":2,"opts":["使用价值与价值二者间是等比例关系","使用价值与价值二者间是正比例关系","使用价值与价值二者间是反比例关系","使用价值为零时，价值也为零"],"ans":"D","ana":"一种物品如果没有使用价值，就是无用之物，即使人们为它付出了大量的劳动，也没有价值。"},{"t":"s","n":15,"stem":"从物质形态看，由一定数量的生产资料和劳动力所构成的资本构成是","score":2,"opts":["资本价值构成","资本技术构成","资本有机构成","资本积累构成"],"ans":"B","ana":"在资本主义企业内部，资本家投入资本主义生产过程的资本，从自然形式上看，总是由一定数量的生产资料和劳动力构成的。在生产资料和劳动力之间，存在着一定比例，这个比例取决于生产技术的发展水平。生产技术水平越高，每个劳动力所推动的生产资料的数量就越多；生产技术水平越低，每个劳动力所推动的生产资料的数量就越少。这种由生产的技术水平所决定的生产资料和劳动力之间的比例，叫作资本的技术构成。"},{"t":"s","n":16,"stem":"利润率是剩余价值率的转化形式,它是（）","score":2,"opts":["剩余价值与不变资本的比率","剩余价值与可变资本的比率","剩余价值与所费总资本的比率","剩余价值与预付总资本的比率"],"ans":"D","ana":"利润是剩余价值的转化形式，它表现为全部预付资本的产物，因此，剩余价值与预付总资本的比率就是利润率。利润率是剩余价值率的转化形式。"},{"t":"s","n":17,"stem":"经济危机的周期性爆发，使资本主义再生产也具有了周期性。资本主义再生产周期中决定性的阶段是","score":2,"opts":["复苏阶段","萧条阶段","危机阶段","高涨阶段"],"ans":"C","ana":"经济危机的周期爆发，使资本主义再生产也具有了周期性，从一次危机的开始到下一次危机的开始，其间所经历的时间便是一个再生产的周期，资本主义再生产周期一般来说包括危机、萧条、复苏、高涨四个阶段。其中，危机阶段是再生产周期的决定性阶段。"},{"t":"s","n":18,"stem":"资本主义国家三权分立制度的三权指的是","score":2,"opts":["立法权、财政权和监督权","立法权、财政权和司法权","财政权、监督权和司法权","立法权、行政权和司法权"],"ans":"D","ana":"所谓三权分立只是资产阶级内部的权力分立，而绝不是与劳动人民或其他阶层分享权力。"},{"t":"s","n":19,"stem":"垄断资本主义的历史作用是","score":2,"opts":["实现经济全球化和福利社会化","实现资源配置市场化和全球化","为更高级的生产方式创造物质条件","为更高级的生产方式创造社会条件"],"ans":"C","ana":"马克思指出：发展社会劳动生产力，是资本主义的历史任务和存在理由。资本正是以此不自觉地为一个更高级的生产形式创造物质条件。"},{"t":"s","n":20,"stem":"通过大企业之间较稳定的协议形成的，在生产或流通的某些环节实行垄断经营的垄断企业组织形式是","score":2,"opts":["卡特尔","辛迪加","托拉斯","康采恩"],"ans":"A","ana":"卡特尔，即通过生产或经营同类产品的一些大型垄断企业之间较稳定的垄断协议形成的、在生产或流通的某个或某些环节实行垄断的组织形式。"},{"t":"s","n":21,"stem":"金融寡头在政治上的统治主要是通过","score":2,"opts":["“”实行个人联合来实现","建立金融研究机构来实现","“”实行参与制来实现","掌控互联网和新闻媒介来实现"],"ans":"A","ana":"金融寡头在掌握了经济上的控制权后，又在政治上进一步控制上层建筑，利用政权“的力量来加强其统治地位。金融寡头对国家机器的控制，主要是通过同政府的个人联”合来实现的。"},{"t":"s","n":22,"stem":"下列选项属于国家与私人资本在企业内部的结合形式的是","score":2,"opts":["财政支持和再分配","政府收购私人企业","国民经济计划化","政府的加工订货"],"ans":"B","ana":"国家和私人资本在企业内部的结合，也即资本主义国家中的国有资本与私人资本结合在一个企业中的经济形式。这种国有经济和私人经济的结合，既可以是国家和私人资本共同投资于一个新的企业，也可以是国家通过出售一部分国有企业的股份，从而形成国家和私人资本共有的企业，还可以通过国家收购一部分原私有企业的股份而形成国家与私人资本相结合的企业。"},{"t":"s","n":23,"stem":"1921 年春，列宁果断地结束战时共产主义，转而实行新经济政策，新经济政策的主要特征是","score":2,"opts":["优先发展重工业","发展商品经济","取消商品货币关系","实行余粮收集制度"],"ans":"B","ana":"1921 年3 月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策。"},{"t":"s","n":24,"stem":"关于经济文化相对落后国家率先进入社会主义这一历史现象，下列表述正确的是","score":2,"opts":["它有其历史必然性","它违背历史发展规律","“”它是反常现象","“”它是早产儿"],"ans":"A","ana":"俄国、中国等经济文化相对落后的国家先于发达资本主义国家进入社会主义,不是偶然的，而有其历史必然性。"},{"t":"s","n":25,"stem":"马克思主义经典作家所讲的共产主义社会第一阶段或低级阶段是指","score":2,"opts":["过渡时期","社会主义社会","社会主义初级阶段","共产主义阶段"],"ans":"B","ana":"社会主义社会是共产主义社会的第一阶段，又称共产主义社会的初级阶段或低级阶段。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"什么是马克思主义？","score":6,"ans":"马克思主义是由马克思、恩格斯创立并为后继者所不断发展的科学理论体系，是关于自然、社会和人类思维发展一般规律的学说，是关于社会主义必然代替资本主义、最终实现共产主义的学说，是关于无产阶级解放、全人类解放和每个人自由而全面发展的学说，是无产阶级政党和社会主义国家的指导思想，是指引人民创造美好生活的行动指南。","ana":"定义要覆盖其科学理论体系、关于社会发展规律和无产阶级解放的目标，并体现它既是指导思想也是实践指南。","anaAI":true},{"t":"short","n":27,"stem":"简述实践是检验真理的唯一标准。","score":6,"ans":"(1)这是由真理的本性和实践的特点决定的：真理是人们对客观事物及其发展规律的正确反映，其本性在于主观和客观相符合。实践具有直接现实性，这是它的客观实在性的具体表现(2)已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果。逻辑证明不能取代实践作为检验真理的标准，实践才是检验真理的唯一标准。","ana":"真理要求主观认识符合客观实际，实践凭直接现实性提供可对照的结果；逻辑证明能辅助却不能替代实践检验。","anaAI":true},{"t":"short","n":28,"stem":"简述货币的本质及职能。","score":6,"ans":"（1）货币：固定充当一般等价物的商品。（2①）货币的职能：价值尺度职②③④⑤能。流通手段职能。贮藏手段职能。支付手段职能。世界货币职能。","ana":"答案中的职能编号和文字有错乱，需核对原卷；概念上货币是固定充当一般等价物的商品，职能应逐项确认后再评分。","anaAI":true},{"t":"short","n":29,"stem":"资本主义国家如何利用利率调节经济？","score":6,"ans":"利率调节主要是通过利率高低和差别利率来实现某些宏观经济目标。例如，对国家支持的产业或企业给予优惠的信贷条件，鼓励其发展；相反，对国家要控制的经济活动则用较严格的信贷条件来制约。在经济过热时，适当提高利率，给经济降温；相反，在需要刺激经济发展、走出萧条与不景气阴影的时候，则适当降低利率来刺激投资与消费。","ana":"提高利率可抑制信贷、投资和需求，降息可刺激融资与消费；差别利率还可扶持或约束特定产业。","anaAI":true},{"t":"short","n":30,"stem":"马克思主义政党在社会主义建设和改革中的领导核心作用主要体现在哪些方面？","score":6,"ans":"（1）在思想方面，马克思主义政党要确保自己在意识形态领域的领导地位，确保马克思主义在社会主义国家的指导地位。（2）在政治方面，马克思主义政党要在社会主义民主政治建设和政治体制改革中起到领导核心作用，保证社会主义建设的正确方向。（3）在组织方面，马克思主义政党要领导全体人民有组织、有系统、有管理、有序地进行社会主义的各项建设事业。","ana":"分别从思想、政治、组织领导说明其作用，得分需体现方向保证、制度改革领导和建设组织动员三个层面。","anaAI":true}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"意识的能动性主要表现在哪些方面？在社会主义现代化建设中如何正确发挥人的主观能动性？","score":10,"ans":"（1）意识对物质具有反作用。这种反作用就是意识的能动作用，表现在：意识具有目的性和计划性、意识具有创造性、意识具有指导实践改造客观世界的作用、意识具有调控人的行为和生理活动的作用。（2）正确发挥人的主观能动性的前提是从实际出发；正确发挥人的主观能动性的根本途径是实践；正确发挥人的主观能动性，还依赖于的物质条件和物质手段。","ana":"意识能计划、创造并指导实践，也能调控行为；发挥作用需从实际出发、依靠实践并具备必要物质条件。","anaAI":true},{"t":"essay","n":32,"stem":"社会改革的实质是什么？社会改革在社会发展中的作用表现在哪些方面？","score":10,"ans":"（1）实质：是社会制度的自我调整和完善。（2①）作用：改革是社会制度的自②我调整和完善，是推动社会发展的重要动力。改革是解决社会基本矛盾、促进生产力发③展、推动社会进步的有效途径和手段。中国的社会主义改革是社会主义制度的自我完善和自我发展，改革是社会主义社会发展的强大动力。","ana":"答案编号与文字有错乱，需核对原卷；概念上改革是社会制度的自我调整和完善，作用应联系解决基本矛盾、促进发展论证。","anaAI":true},{"t":"essay","n":33,"stem":"试述劳动力商品的特点及价值决定。","score":10,"ans":"（1）像任何商品一样，劳动力商品也具有价值和使用价值。但是，劳动力是特殊“的商品，它的价值和使用价值具有不同于普通商品的特点。劳动力的价值，是由生产、”①发展、维持和延续劳动力所必需的生活必需品的价值决定的。它包括三个部分：维持②劳动者本人生存所必需的生活资料的价值；维持劳动者家属的生存所必需的生活资料的③价值；劳动者接受教育和训练所支出的费用。由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动者所必需的生活资料的数量和构成是有区别的，所以劳动力价值的最低界限是由生活上不可缺少的生活资料的价值决定的。一旦劳动力价值降低到这个界限以下，劳动力就只能在萎缩的状态下维持。（2）劳动力商品在使用价值上有一个很突出的特点，就是它的使用价值是价值的源泉，在消费过程中能够创造新的价值，而且这个新的价值比劳动力本身的价值更大。","ana":"答案存在断句/编号异常，价值构成和使用价值表述需核对原卷；把握重点是劳动力价值由再生产所需生活资料决定，其使用价值能创造剩余价值。","anaAI":true}]}],"code":"15044","qaNotes":[]},{"paper":"marx-2510","subject":"marx","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"在马克思主义理论体系中，马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其（）","score":2,"opts":["基本内涵","主要特征","根本性质","主体内容"],"ans":"D","ana":"马克思主义理论体系的主体内容由马克思主义哲学、马克思主义政治经济学和科学社会主义三部分构成。三者相互联系、有机统一，共同支撑起马克思主义的理论框架。"},{"t":"s","n":2,"stem":"下列选项属于为马克思主义的创立提供了直接理论来源的是（）","score":2,"opts":["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],"ans":"C","ana":"马克思主义的直接理论来源包括德国古典哲学、英国古典政治经济学和英法两国的空想社会主义。德国古典哲学（以黑格尔辩证法和费尔巴哈唯物主义为代表）为马克思主义哲学的创立提供了重要理论借鉴。"},{"t":"s","n":3,"stem":"唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于（）","score":2,"opts":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"ans":"C","ana":"唯物主义和唯心主义的根本分歧在于对物质和意识谁是世界本源问题的不同回答。唯物主义认为物质是本原，唯心主义认为意识是本原。"},{"t":"s","n":4,"stem":"客观实在性作为物质的唯一特性，体现的是（）","score":2,"opts":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"ans":"D","ana":"物质的唯一特性是客观实在性，这一特性既适用于自然领域的存在（如山川河流），也适用于社会领域的存在（如生产方式、社会关系），是二者的共同特性。"},{"t":"s","n":5,"stem":"“马克思指出：观念的东西不外是移入人脑并在人的头脑中改造过的物质的东”西而已。这就是说（）","score":2,"opts":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"ans":"B","ana":"马克思的这句话表明，意识的内容来源于客观物质世界，是人脑对客观事物的主观反映。意识并非人脑凭空产生，而是对物质的能动改造后的结果，既不是人脑的分泌物（庸俗唯物主义观点），也不是虚幻影像。"},{"t":"s","n":6,"stem":"在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是（）","score":2,"opts":["内容和形式","本质和现象","原因和结果","现实和可能"],"ans":"D","ana":"现实范畴反映事物当下的实际存在状态，可能范畴反映事物未来发展的潜在趋势，二者揭示了事物过去、现在与将来的联系。内容与形式反映事物的构成与表现方式，本质与现象反映事物的内在联系与外在表现，原因与结果反映事物的前后相继、引起与被引起关系。"},{"t":"s","n":7,"stem":"认识的本质是主体在实践基础上对客体的能动反映，这是一种（）","score":2,"opts":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"ans":"C","ana":"辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，既强调实践的决定性作用，又承认认识的能动性。主观唯心主义认识论否认客观客体的存在，客观唯心主义认识论将认识归结为对绝对精神的把握，旧唯物主义认识论否认认识的能动性。"},{"t":"s","n":8,"stem":"轻视理性认识而片面夸大感性认识的作用，会导致实践中的（）","score":2,"opts":["实用主义","怀疑主义","教条主义","经验主义"],"ans":"D","ana":"经验主义片面夸大感性认识的作用，轻视理性认识的指导意义，认为只有感性经验才是可靠的认识来源。实用主义强调认识的实际效用，怀疑主义否认认识的可能性，教条主义片面夸大理性认识的作用，轻视感性经验。"},{"t":"s","n":9,"stem":"实践是检验真理的唯一标准，这是因为（）","score":2,"opts":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],"ans":"D","ana":"实践之所以是检验真理的唯一标准，核心在于实践具有直接现实性——它能将主观认识转化为客观现实，通过实际结果验证认识是否符合客观规律。其他选项虽表述正确，但并非这一命题的根本原因。"},{"t":"s","n":10,"stem":"中国共产党的思想路线的核心是（）","score":2,"opts":["自信自立","守正创新","实事求是","自我革命"],"ans":"C","ana":"中国共产党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。其中，实事求是是思想路线的核心。"},{"t":"s","n":11,"stem":"社会历史观的基本问题是（）","score":2,"opts":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"ans":"A","ana":"社会存在与社会意识的关系问题，是社会历史观的基本问题。正确认识社会存在与社会意识的关系，是科学把握人类社会发展规律的基础和前提。"},{"t":"s","n":12,"stem":"社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是（）","score":2,"opts":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"ans":"B","ana":"社会存在包括自然地理环境、人口因素和物质生产方式（生产力与生产关系的统一）。政治法律思想属于社会意识的范畴，是上层建筑的重要组成部分。"},{"t":"s","n":13,"stem":"下列各项正确说明经济基础与上层建筑的关系的是（）","score":2,"opts":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"ans":"A","ana":"经济基础与上层建筑的关系中，经济基础处于决定地位：经济基础的性质决定上层建筑的性质，经济基础的变化发展决定上层建筑的变化发展。上层建筑具有相对独立性，并非与经济基础同步变化，也不能决定经济基础。"},{"t":"s","n":14,"stem":"从商品二因素与劳动二重性的关系考察商品经济中能够形成商品价值的劳动是（）","score":2,"opts":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"ans":"C","ana":"商品二因素（使用价值和价值）对应劳动二重性（具体劳动和抽象劳动）。具体劳动创造商品的使用价值，抽象劳动（无差别的人类一般劳动）形成商品的价值。"},{"t":"s","n":15,"stem":"下列关于商品价值量决定关系的表述中，正确的是（）","score":2,"opts":["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],"ans":"A","ana":"商品的价值量由社会必要劳动时间决定，二者成正比——社会必要劳动时间越长，——价值量越大。劳动生产率（单位时间内生产的商品数量）与价值量成反比劳动生产率越高，单位商品耗费的社会必要劳动时间越少，价值量越小。"},{"t":"s","n":16,"stem":"资本主义社会中，劳动力成为商品要具备的基础条件，不包括（）","score":2,"opts":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"ans":"B","ana":"劳动力成为商品的两个基本条件：一是劳动者在法律上是自由人，能自主支配自己的劳动力；二是劳动者没有任何生产资料和生活资料，只能靠出卖劳动力为生。劳动者人身依附于资本家是封建制生产关系的特征，并非劳动力成为商品的条件。"},{"t":"s","n":17,"stem":"资本主义社会经济危机会周期性爆发，但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段，其中有一个阶段是资本主义经济周期的必经阶段和基本阶段，这个阶段是（）","score":2,"opts":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"ans":"A","ana":"资本主义再生产周期包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是必经阶段和基本阶段，是资本主义基本矛盾激化的集中表现，决定了周期的性质和进程。"},{"t":"s","n":18,"stem":"资本主义国家政权采取分权制衡的组织形式，即三权分立制度，下列选项中不属于这三权的是（）","score":2,"opts":["监督权","司法权","行政权","立法权"],"ans":"A","ana":"三权分立制度中的三权指立法权、行政权和司法权，三者相互独立、相互制衡。监督权并非独立的三权之一，而是通过三权之间的制约关系实现的。"},{"t":"s","n":19,"stem":"垄断资本主义形成于19 世纪末20 世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为（）","score":2,"opts":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"ans":"A","ana":"19 世纪末20 世纪初形成的垄断资本主义，以私人垄断资本为基础，称为私人垄断资本主义。国家垄断资本主义是二战后发展起来的，指国家政权与私人垄断资本相结合的垄断资本主义。"},{"t":"s","n":20,"stem":"垄断资本主义国家的垄断组织虽然形式多种多样，但本质都是为了（）","score":2,"opts":["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],"ans":"B","ana":"垄断组织的形式（如卡特尔、辛迪加、托拉斯等）虽各不相同，但本质都是为了获——取垄断利润通过垄断价格（高于或低于生产价格的价格）实现的超额利润，是垄断资本主义的核心目标。"},{"t":"s","n":21,"stem":"第二次世界大战后，资本主义生产资料所有制发生了新的变化，成为居主导地位的所有制形式是（）","score":2,"opts":["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],"ans":"B","ana":"二战后，资本主义生产资料所有制发生新变化，法人资本所有制逐渐取代私人资本所有制，成为居主导地位的所有制形式。法人资本所有制是指法人股东（如企业法人、金融机构法人）控股的所有制形式。"},{"t":"s","n":22,"stem":"与通常意义上对金融资本概念的理解和使用不同，马克思主义政治经济学的金融资本概念有其独特内涵，它指的是垄断资本主义国家（）","score":2,"opts":["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],"ans":"D","ana":"马克思主义政治经济学中的金融资本，特指工业垄断资本和银行垄断资本在竞争中相互融合形成的新型垄断资本，并非泛指所有金融机构的资本或货币资本总和。"},{"t":"s","n":23,"stem":"无产阶级夺取政权的第一次伟大尝试是（）","score":2,"opts":["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],"ans":"B","ana":"1871 年的巴黎公社革命，是无产阶级第一次尝试建立自己的国家政权，为无产阶级革命积累了宝贵经验。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个社会主义国家。"},{"t":"s","n":24,"stem":"社会主义国家的最高政治领导力量是（）","score":2,"opts":["工会","社会党","共产党","共青团"],"ans":"C","ana":"社会主义国家的最高政治领导力量是共产党，这是由社会主义国家的性质和共产党的先进性决定的，是社会主义事业顺利发展的根本保证。"},{"t":"s","n":25,"stem":"共产主义社会的根本特征是（）","score":2,"opts":["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],"ans":"D","ana":"共产主义社会的根本特征是实现人的自由而全面的发展。人与自然和谐共生、精神境界极大提高、社会关系高度和谐都是共产主义社会的重要特征，但并非根本特征。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"简述马克思主义的基本特征。","score":6,"ans":"马克思主义具有鲜明的科学性、人民性、实践性、发展性，这些特征体现了马克思主义的本质和使命，也展现出马克思主义的理论形象。马克思主义的基本特征，用一句话来概括就是科学性与革命性的统一。","ana":"科学性、人民性、实践性、发展性体现其理论本质；概括时要说明科学性与革命性的统一，而非仅列标签。","anaAI":true},{"t":"short","n":27,"stem":"如何理解真理和谬误的关系？","score":6,"ans":"它们之间既对立又统一。(1)二者相互对立。在确定的对象和范围内，真理与谬误的对立是绝对的，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误。(2)①二者的对立又是相对的，它们在一定条件下能够相互转化。真理在一定条件下会转化为谬误。任何真理都是在一定范围内、一定条件下才能够成立，超出这个范围，失去特定条件，就会变成谬误。②谬误在一定条件下能够向真理转化。任何人都有可能犯错误，但勇③于正视、反省、修正错误，终能让错误转化为正确，谬误转化为真理。在批判谬误中发展真理，是谬误向真理转化的另一种形式。谬误可以起到反面教员的作用，警示人们要更加正确地认识世界。","ana":"在特定对象和范围内二者相互排斥，在条件变化时又可能转化；认识进步依靠正视、纠正谬误而不断逼近真理。","anaAI":true},{"t":"short","n":28,"stem":"简述产业资本的运动中，实现资本顺利循环必须具备的两个基本前提条件。","score":6,"ans":"产业资本的运动，必须具备两个基本前提条件：一是产业资本的三种职能形式必须在空间上并存，也就是说，产业资本必须按照一定比例同时存在于货币资本、生产资本和商品资本三种形式中。二是产业资本的三种职能形式必须在时间上继起，也就是说，产业资本循环中三种职能形式的转化必须保持时间上的依次连续性。","ana":"三种职能资本须空间并存，才能各环节同时运转；又须时间继起，保证资本形态转换连续不断。","anaAI":true},{"t":"short","n":29,"stem":"经济全球化的内涵和主要表现是什么？","score":6,"ans":"（1）内涵：经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出一国和地区的范围而相互联系、相互依赖的过程。（2①）主要表现：生产全球化；  ②③贸易全球化；金融全球化。","ana":"内涵是世界经济相互联系、相互依赖增强；主要表现是生产、贸易和金融全球化，注意答案编号有瑕疵但考点清楚。","anaAI":true},{"t":"short","n":30,"stem":"简述马克思主义经典作家预见未来社会的方法论原则。","score":6,"ans":"(1)在揭示人类社会发展一般规律的基础上指明社会发展的方向。(2)在剖析资本主义旧世界的过程中阐发未来新世界的特点。(3)在社会主义社会发展中不断深化对未来共产主义社会的认识。(4)立足于揭示未来社会的一般特征，而不对各种细节作具体描绘。","ana":"经典作家从一般规律和现实矛盾揭示发展方向，在实践中深化认识，只概括一般特征而不虚构细节蓝图。","anaAI":true}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"试述矛盾的普遍性、矛盾的特殊性的含义以及分析矛盾的特殊性的意义。","score":10,"ans":"(1)矛盾的普遍性是指矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动。我们所熟悉的“矛盾无处不在，矛盾无时不有，就是对”矛盾的普遍性的形象表述。矛盾的特殊性是指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上各有其特点。矛盾的特殊性决定了事物的不同性质。只有具体分析矛盾的特殊性，才能认清事物的本质和发展规律，并采取正确的方法和措施去解决矛盾，推动事物的发展。(2)矛盾的特殊性原理具有重要的方法论意义。分析矛盾的特殊性就是坚持具体问题具体分析。一方面，分析矛盾的特殊性是正确认识事物的基础。只有分析矛盾的特殊性，才能把不同的事物区别开来，正确地认识事物。另一方面，分析矛盾的特殊性是正确解决矛盾的关键。不同的矛盾只能用不同的方法解决，只有具体地分析矛盾的特殊性，才能找到正确解决某一特殊矛盾的特殊方法，即一把钥匙开一把锁，从而取得成功。如果千篇一律地用一种方法解决各种不同的矛盾，那就必然失败。因此，具体问题具体分析是马克思主义的活的灵魂。","ana":"普遍性说明矛盾无处不在，特殊性说明具体矛盾及阶段各有特点；分析特殊性是认识本质、选择针对性解决方法的基础。","anaAI":true},{"t":"essay","n":32,"stem":"什么是社会意识？如何理解社会意识相对独立性的含义及表现？","score":10,"ans":"（1）社会意识的含义：社会意识是社会存在的反映，是社会生活的精神方面。（2）社会意识相对独立性的含义：社会意识在从根本上受到社会存在决定的同时，还具有自身特有的发展形式和发展规律。（3）社会意识相对独①立性的表现：社会意识与②社会存在发展具有不完全同步性和不平衡性。社会意识内部各种形式之间存在相互影③响且各自具有历史继承性。社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。","ana":"社会意识根本受社会存在决定，但有自身发展规律；表现为发展不平衡、历史继承、形式间相互影响及对社会存在的反作用。","anaAI":true},{"t":"essay","n":33,"stem":"试述资本主义为社会主义所代替的历史必然性。","score":10,"ans":"资本主义的内在矛盾决定了资本主义必然被社会主义所代替。（1）资本主义基本矛盾包含着现代的一切冲突的萌芽。（2）资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身。（3）国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏。（4）资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争。","ana":"论证链应从基本矛盾、资本积累导致矛盾激化、资本社会化发展及阶级斗争说明历史趋势；这讲的是客观趋势，不是具体日期预言。","anaAI":true}]}],"code":"15044","qaNotes":[]},{"paper":"marx-2604","subject":"marx","session":"2604","label":"2026年4月","notes":"课程代码15044。卷内所附“GPT整理版”明确非官方，且客观题多处错键、主观题为通用模板；不作为答案来源。答案及解析均为依据本地历年卷相近考点和课程知识重新核订的非官方AI参考；论述题3选2，原始列题分值合计110分、实际作答满分100分。","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列选项属于马克思主义基本组成部分的是","score":2,"opts":["马克思主义立场、观点和方法","马克思主义自然观、历史观和价值观","马克思主义物质观、实践观和发展观","马克思主义哲学、政治经济学和科学社会主义"],"ans":"D","ana":"马克思主义理论体系的三个基本组成部分是马克思主义哲学、马克思主义政治经济学和科学社会主义；立场、观点、方法是理论的基本立场方法，并非三大组成部分。","anaAI":true,"qaNotes":"已据本地《马克思主义基本原理》官方笔记核对：三大基本组成部分为哲学、政治经济学、科学社会主义，选D；原附答案B错误。"},{"t":"s","n":2,"stem":"作为马克思主义公开问世标志的是","score":2,"opts":["“正义者同盟”改组","《共产党宣言》发表","欧洲革命爆发","《新莱茵报》创刊"],"ans":"B","ana":"1848年《共产党宣言》发表，标志马克思主义公开问世，也标志科学社会主义理论的公开面世。","anaAI":true,"qaNotes":"本地marx-2204第22题同题《共产党宣言》为标志，位置A；本题选项位置B。原附答案C错误。"},{"t":"s","n":3,"stem":"下列表述属于列宁的物质定义内容的是","score":2,"opts":["物质是标志客观实在的哲学范畴","物质与时间具有统一性","物质是与运动不可分割的","物质与空间具有统一性"],"ans":"A","ana":"列宁把物质界定为标志客观实在的哲学范畴，客观实在性是关键。物质与运动、时间和空间的关系虽是相关哲学命题，却不是这里列宁物质定义的原文内容。","anaAI":true,"qaNotes":"本地官方笔记列出列宁的物质定义“标志客观实在的哲学范畴”；本地marx-2510#4亦以客观实在性为物质唯一特性，选A。"},{"t":"s","n":4,"stem":"下列选项正确揭示意识的本质的是","score":2,"opts":["意识是人脑的产物","意识是在劳动交往中发展的","意识是物质的产物","意识是客观世界的主观映象"],"ans":"D","ana":"意识是人脑对客观世界的能动反映，即客观世界的主观映象。A、B、C分别涉及器官条件、形成发展或来源，不如D直接准确揭示本质。","anaAI":true,"qaNotes":"本地marx-2510第5题同一正确表述在B项；此题为D。"},{"t":"s","n":5,"stem":"世界的统一性问题，是回答世界上的万事万物","score":2,"opts":["有没有共同特征的问题","有没有相同结构的问题","有没有共同本质的问题","有没有相同功能的问题"],"ans":"C","ana":"世界统一性问题所问的是无限多样的事物是否具有共同的本质或本原；唯物主义一元论认为统一于物质。共同特征可以是局部、表层的，不能替代共同本质。","anaAI":true,"qaNotes":"本地marx-2104#3确认“承认世界具有统一性”对应一元论；本地官方笔记称物质概念概括客观存在各种事物共同本质。选项C为唯一相符项。"},{"t":"s","n":6,"stem":"任何事物内部的各要素之间、任何事物和其他事物之间都是有联系的，整个世界是相互联系的统一整体。这表明","score":2,"opts":["联系具有客观性","联系具有普遍性","联系具有多样性","联系具有条件性"],"ans":"B","ana":"普遍性强调每一事物内部、事物之间乃至整个世界都处在联系中；客观性强调联系不以人的意志为转移，多样性和条件性均非题干侧重点。","anaAI":true,"qaNotes":"本地官方笔记直接将题干“任何事物内部……事物之间……整个世界相互联系”列为联系普遍性的三层含义，选B。"},{"t":"s","n":7,"stem":"在认识的本质问题上，旧唯物主义认识论的缺陷有二，一个是离开辩证法考察认识问题，另一个是","score":2,"opts":["离开实践考察认识问题","没有坚持反映论的立场","离开主体考察认识问题","没有坚持先验论的立场"],"ans":"A","ana":"旧唯物主义认识论虽坚持反映论，却把认识看作直观、消极的反映；其两个主要缺陷是脱离实践、脱离辩证法。","anaAI":true,"qaNotes":"本地官方笔记列旧唯物主义认识论两项缺陷：离开实践、离开辩证法，选A。"},{"t":"s","n":8,"stem":"理性认识由低级向高级的发展表现为","score":2,"opts":["从感觉到知觉再到表象","从观察到联想再到猜测","从概念到判断再到推理","从分析到归纳再到假说"],"ans":"C","ana":"理性认识的基本形式依次为概念、判断、推理，逐步深化；感觉、知觉、表象属于感性认识的基本形式。","anaAI":true,"qaNotes":"本地官方笔记列理性认识三形式依次为概念、判断、推理，选C。"},{"t":"s","n":9,"stem":"下列关于真理的说法中，正确的是","score":2,"opts":["真理是独立于主体意识的物质实体","真理是思维与它的先验形式相一致","真理是不以人的意志为转移的客观规律","真理是对客观事物及其规律的正确反映"],"ans":"D","ana":"真理属于认识范畴，是对客观事物及其规律的正确反映；客观规律本身是真理的对象，不等同于作为认识的真理。","anaAI":true,"qaNotes":"本地官方笔记定义真理为对客观事物及其规律的正确反映，选D。"},{"t":"s","n":10,"stem":"对人类社会发展起决定作用的是","score":2,"opts":["富饶的自然资源","良好的生态环境","适度的人口数量","物质资料的生产方式"],"ans":"D","ana":"地理环境和人口是社会存在的必要条件，物质资料的生产方式是人类社会存在和发展的基础，对社会发展起决定作用。","anaAI":true,"qaNotes":"本地marx-2504第10题、marx-2104第10题说明社会存在范围；据教材生产方式决定性判断。"},{"t":"s","n":11,"stem":"在整个上层建筑中，居于主导地位的是","score":2,"opts":["政治法律思想","政治上层建筑","艺术和宗教","道德和哲学"],"ans":"B","ana":"政治上层建筑包括政治法律制度及组织设施，国家政权是其核心，在整个上层建筑中居主导地位；政治法律思想属于观念上层建筑。","anaAI":true,"qaNotes":"教材政治上层建筑与观念上层建筑区分；原附录此题也标B但非权威。"},{"t":"s","n":12,"stem":"承认社会形态更替的必然性的同时又承认主体选择的作用，这种观点属于","score":2,"opts":["历史唯心主义","机械决定论","历史唯物主义","诡辩论"],"ans":"C","ana":"社会形态发展有客观规律和历史必然性，但人的有意识的活动和主体选择在具体道路、时机及形式上发挥作用；这是历史唯物主义的辩证理解。","anaAI":true,"qaNotes":"本地官方笔记将社会形态更替的客观必然性与历史选择性统一、主观能动性与客观规律性相统一，明确支持历史唯物主义C。"},{"t":"s","n":13,"stem":"关于个人在历史进程中的作用，唯物史观认为","score":2,"opts":["每个个体都是历史活动的参与者","历史人物的作用总是促进性的","个人在历史上的作用不存在差别","历史人物的作用不受规律制约"],"ans":"A","ana":"每个人都以一定方式参与历史活动；不同个人作用有差别，历史人物可能起促进或阻碍作用，且受社会历史条件与规律制约。","anaAI":true,"qaNotes":"本地marx-2504第13题同考点，正确选项A“每个人都在历史发展中起一定的作用”。"},{"t":"s","n":14,"stem":"商品经济得以产生的社会历史条件，除了生产资料和劳动产品属于不同所有者之外，还有一个，即","score":2,"opts":["存在自然分工","存在社会分工","存在部落内部分工","存在部落间分工"],"ans":"B","ana":"商品经济产生和存在的条件包括社会分工，以及生产资料和劳动产品分属不同所有者；题干已给出后一条件，缺的是社会分工。","anaAI":true,"qaNotes":"本地官方笔记列商品经济两项条件：社会分工、生产资料和劳动产品分属不同所有者；题干已给后者，选B。"},{"t":"s","n":15,"stem":"商品二因素中反映人与自然之间的物质关系、属于商品自然属性的因素，是商品的","score":2,"opts":["使用价值","交换价值","价值","价格"],"ans":"A","ana":"使用价值是物品满足需要的有用性，体现人与自然的物质关系，是商品的自然属性；价值体现商品生产者之间的社会关系。","anaAI":true,"qaNotes":"本地官方笔记直接定义使用价值反映人与自然的物质关系、属商品自然属性，选A。"},{"t":"s","n":16,"stem":"以私有制为基础的商品经济的基本矛盾是","score":2,"opts":["具体劳动和抽象劳动的矛盾","私人劳动和社会劳动的矛盾","个别劳动和一般劳动的矛盾","生产劳动和非生产劳动的矛盾"],"ans":"B","ana":"私有制下劳动首先表现为生产者私人劳动，社会分工又使其必须成为社会劳动；产品能否通过交换为社会接受，构成私人劳动和社会劳动的基本矛盾。","anaAI":true,"qaNotes":"本地官方笔记直接指出私有制商品经济基本矛盾为私人劳动和社会劳动，选B。"},{"t":"s","n":17,"stem":"资本主义生产方式的绝对规律是","score":2,"opts":["资本主义的竞争规律","资本积累的一般规律","资本主义再生产周期规律","剩余价值规律"],"ans":"D","ana":"资本生产的直接目的与决定动机是榨取剩余价值；剩余价值规律支配资本主义生产、流通与分配，被称为资本主义生产方式的绝对规律。","anaAI":true,"qaNotes":"本地同库marx-2110#32称剩余价值规律决定资本主义生产的一切主要方面和全过程；本题选项D为剩余价值规律，选D。原附B错误。"},{"t":"s","n":18,"stem":"从资本循环角度看，资本家工厂中已经进入仓库的产成品，属于产业资本循环中的","score":2,"opts":["货币资本形态","生产资本形态","商品资本形态","固定资本形态"],"ans":"C","ana":"生产完毕的产成品是待销售的商品资本，处在W′—G′实现价值和剩余价值之前；固定资本是按价值周转方式划分，不是此处循环阶段。","anaAI":true,"qaNotes":"按产业资本三种职能形式判断；原附录标C，可与原题自洽但非官方。"},{"t":"s","n":19,"stem":"19世纪末20世纪初形成的垄断资本主义主要以私人垄断资本为基础。私人垄断资本主义形成的基础是","score":2,"opts":["生产集中和市场集中","生产集中和资本集中","资本集中和市场集中","技术集中和资本集中"],"ans":"B","ana":"自由竞争促使生产和资本日益集中，集中达到一定高度使少数大企业有能力控制部门生产与市场，成为私人垄断形成的基础。","anaAI":true,"qaNotes":"本地官方笔记明确：私人垄断资本主义是在生产集中和资本集中的基础上形成，选B。"},{"t":"s","n":20,"stem":"垄断是通过一定的垄断组织形式实现的。在一个或几个经济部门中占据垄断地位的大企业联合形成的垄断组织，形式多种多样且不断变化，其中最简单、初级的垄断组织形式是","score":2,"opts":["短期价格协定","长期价格协定","短期市场协定","长期市场协定"],"ans":"A","ana":"最初级的垄断组织是企业间临时性的短期价格协定，只需约定价格即可限制价格竞争；长期协定以及市场分割要求更稳定、更深的联合。","anaAI":true,"qaNotes":"教材垄断组织从简单的短期价格协定逐渐发展；原附录标A，但仍属非官方参考。"},{"t":"s","n":21,"stem":"资本主义国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节，这种调节形式属于","score":2,"opts":["法律调节","政治调节","宏观调节","微观调节"],"ans":"C","ana":"财政、货币政策作用于总供给、总需求等总体经济变量，属于国家垄断资本主义的宏观经济调节，而非企业层面的微观调节。","anaAI":true,"qaNotes":"本地marx-2404第33题主观答案提到国家出面宏观经济调控；原附录标C但非官方。"},{"t":"s","n":22,"stem":"垄断资本形成后会向世界范围扩展。从输出资本的主体来看，主要有","score":2,"opts":["借贷资本输出和商品资本输出","生产资本输出和商品资本输出","私人资本输出和国家资本输出","生产资本输出和借贷资本输出"],"ans":"C","ana":"按资本输出的主体区分为私人资本输出和国家资本输出；按输出形式才区分为借贷资本输出和生产资本输出。商品输出不等于资本输出。","anaAI":true,"qaNotes":"本地官方笔记区分输出形式与主体：主体主要是私人资本输出、国家资本输出，选C；同库marx-2410#28亦提两者。"},{"t":"s","n":23,"stem":"恩格斯在《在马克思墓前的讲话》中指出，马克思一生有两大发现。正是这两大发现为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。这两大发现是","score":2,"opts":["辩证唯物主义和历史唯物主义","唯物史观和剩余价值学说","劳动价值论和剩余价值学说","唯物论和辩证法"],"ans":"B","ana":"马克思的两大发现是唯物史观与剩余价值学说：前者揭示人类社会发展的客观规律，后者揭示资本主义剥削及其运动规律。","anaAI":true,"qaNotes":"本地官方笔记明确马克思、恩格斯创立唯物史观和剩余价值学说，为社会主义由空想变科学奠基，选B。"},{"t":"s","n":24,"stem":"在展望未来社会的问题上，马克思主义与空想社会主义的根本区别是","score":2,"opts":["是否坚持科学的立场观点方法","是否对未来社会做详尽描述","是否反映无产阶级的愿望要求","是否批判了资本主义旧世界"],"ans":"A","ana":"马克思主义通过唯物史观和剩余价值学说，以科学的立场、观点和方法揭示资本主义发展规律及未来社会趋势；空想社会主义也批判资本主义、设想未来，却缺少这种科学基础。","anaAI":true,"qaNotes":"本地官方笔记原句：是否坚持科学的立场观点方法是马克思主义与空想社会主义在展望未来社会上的根本区别，选A。"},{"t":"s","n":25,"stem":"共产党人的最高理想是","score":2,"opts":["建设社会主义","实现新民主主义","建设中国特色社会主义","实现共产主义"],"ans":"D","ana":"共产主义是共产党人的最高理想和最终奋斗目标；建设中国特色社会主义等是特定历史阶段的现实任务。","anaAI":true,"qaNotes":"本地官方笔记明确实现共产主义是共产党人的最高理想，选D。"}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"w","n":26,"stem":"什么是价值观?我国社会主义核心价值观的基本内容是什么?","score":6,"ans":"价值观是人们关于价值、价值关系和价值评价的根本看法与态度，是判断事物有无价值及价值大小的基本观念，对行为选择具有导向作用。我国社会主义核心价值观的基本内容分三个层面：国家层面倡导富强、民主、文明、和谐；社会层面倡导自由、平等、公正、法治；公民个人层面倡导爱国、敬业、诚信、友善。","ana":"作答应先界定价值观，再准确写全“三个层面、二十四字”，不要把核心价值观与社会主义核心价值体系的构成内容混淆。","anaAI":true,"qaNotes":"按课程价值观概念及社会主义核心价值观官方二十四字概括；原附录主观答案为通用模板，不采用。"},{"t":"w","n":27,"stem":"简要说明社会存在与社会意识的含义及相互关系。","score":6,"ans":"社会存在是社会生活的物质方面，即社会物质生活条件的总和，包括自然地理环境、人口因素和物质资料的生产方式，其中生产方式起决定作用。社会意识是社会生活的精神方面，是人们对社会存在的反映，包括社会心理和各种社会意识形式。二者关系：社会存在决定社会意识，社会意识的内容及其变化归根到底根源于社会存在；社会意识具有相对独立性，与社会存在的发展并非完全同步，并有历史继承性，不同意识形式相互影响；社会意识对社会存在具有能动反作用，先进的社会意识促进社会发展，落后的社会意识阻碍社会发展。","ana":"含义、决定作用、相对独立性与反作用是题干“含义及相互关系”的关键层次；不可误写为意识决定存在。","anaAI":true,"qaNotes":"本地marx-2504第10题和marx-2410第10题分别核社会存在定义及关系问题地位；其余依教材梳理，非直接同题。"},{"t":"w","n":28,"stem":"简述生产价格的形成过程。","score":6,"ans":"在资本主义生产中，商品价值可表示为不变资本c、可变资本v和剩余价值m之和；其中c+v表现为生产成本k。资本家以全部预付资本为尺度计算利润，剩余价值转化为利润。由于不同部门资本有机构成和周转速度不同，即使剩余价值率相同，利润率也不相同。资本在部门之间自由转移、竞争，促使各部门利润率趋于平均，利润转化为平均利润。于是商品不再按价值直接出售，而以生产成本加平均利润为中心，形成生产价格，即生产价格=k+平均利润。全社会平均利润总额与剩余价值总额相等，生产价格总额与商品价值总额相等，生产价格是价值的转化形式。","ana":"题目要求“形成过程”，须交代价值—成本价格、剩余价值—利润、部门竞争—平均利润、成本价格加平均利润四个逻辑环节。","anaAI":true,"qaNotes":"依据课程剩余价值分配、平均利润和生产价格理论作答；原附录模板未涉及生产价格，不采用。"},{"t":"w","n":29,"stem":"第二次世界大战后资本主义发生了一系列新变化，其主要表现有哪些?这是否意味着资本主义本质的改变?","score":6,"ans":"主要表现：①生产资料所有制形式出现国家资本所有制、法人资本所有制等变化，法人资本所有制作用增强；②劳资关系和分配关系调整，集体谈判、社会保障、福利制度及一定程度的职工参与有所发展；③社会阶层和阶级结构变化，传统产业工人比重变化，服务业从业人员与管理、专业技术人员增加；④经济调节机制和经济危机形态变化，国家运用财政、货币等政策进行宏观调控，市场调节与国家干预相结合；⑤政治制度和治理形式出现一定调整。不能据此认定资本主义本质已改变：生产资料资本主义私人占有及雇佣劳动制度仍占主导，资本追逐剩余价值的目的、资本主义基本矛盾和阶级关系仍然存在。这些变化主要是生产力发展、工人斗争、社会主义影响及资本主义制度内部调整的结果。","ana":"要先列举课程所述变化的主要方面，再正面回答“是否改变本质”并用所有制、雇佣劳动、剩余价值和基本矛盾说明原因。","anaAI":true,"qaNotes":"本地marx-2510第21题核法人资本所有制，marx-2404第33题核国家宏观调控背景；非同题，其他论点依教材。"},{"t":"w","n":30,"stem":"简述社会主义发展道路多样性的原因。","score":6,"ans":"社会主义发展道路具有多样性，是科学社会主义基本原则与各国具体实际相结合的结果。各国生产力发展水平、经济结构及进入社会主义的历史起点不同，决定建设的任务和步骤不能相同；历史文化传统、社会结构、政治制度和民族特点各异，决定制度实现形式与政策选择各有特色；各国所处国际环境、外部压力和发展机遇不同，影响探索路径。因而不能照搬某一种模式，应坚持科学社会主义基本原则，以马克思主义为指导，从本国国情出发，吸收人类文明成果，在实践中探索适合本国的道路。","ana":"原因重在经济历史条件、国情文化及国际环境的差异；坚持基本原则与道路多样性并不矛盾。","anaAI":true,"qaNotes":"本地marx-2310第30题“探索适合本国国情的社会主义发展道路”支持指导思想、国情及文明成果要求；本题原因依教材补全。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"w","n":31,"stem":"把主要矛盾和次要矛盾、矛盾的主要方面和次要方面的辩证关系运用到实际工作中，就是要坚持“两点论”和“重点论”的统一。试述“两点论”和“重点论”统一的原理及其现实意义。","score":10,"ans":"在复杂事物中，主要矛盾处于支配地位，对发展起决定作用，次要矛盾也影响发展；两者相互作用，在一定条件下可相互转化。在同一矛盾内部，主要方面居支配地位并主导事物性质，次要方面也制约主要方面，两者也可能在条件变化时转化。“两点论”要求既看到主要矛盾又看到次要矛盾，既看到矛盾的主要方面又看到次要方面，反对只见一面；“重点论”要求着重把握主要矛盾和矛盾主要方面，反对平均用力。两点是有重点的两点，重点是两点中的重点，二者统一于矛盾不平衡性。实际工作中要统筹兼顾、把握全局，同时抓住中心任务与关键环节、集中力量解决主要矛盾；评价形势或事物时看主流而不忽视支流，并随条件变化及时调整重点，防止“一点论”和均衡论。","ana":"区分“抓主要矛盾”用于处理复杂任务，与“把握主要方面”用于判断事物性质，分别说明两点论、重点论以及结合实际的意义。","anaAI":true,"qaNotes":"本地marx-2310第31题论述主要矛盾与次要矛盾的相互作用；本题补充矛盾主要/次要方面及方法论。"},{"t":"w","n":32,"stem":"试述商品经济中商品价值量的决定及其与劳动生产率的关系。","score":10,"ans":"商品价值是凝结在商品中的无差别的一般人类劳动，价值量由生产该商品的社会必要劳动时间决定，而不是由某个生产者的个别劳动时间决定。社会必要劳动时间，是在现有社会正常生产条件下、社会平均劳动熟练程度和劳动强度下生产某种使用价值所需要的劳动时间；复杂劳动可折合为倍加的简单劳动。单位商品价值量同社会必要劳动时间成正比，同该部门的社会劳动生产率成反比：部门生产率提高，单位商品耗时减少，其价值量下降；生产率降低则相反。个别企业的生产率提高、其个别劳动时间低于社会必要劳动时间时，社会价值量不会立即随之变化，该企业可取得超额收益；只有这种提高普遍化并改变社会必要劳动时间，单位商品价值量才相应下降。在劳动时间和劳动强度既定时，部门劳动生产率提高使同一时间产品数量增多，但形成的新价值总量不因生产率本身提高而增加，价值分摊到更多商品上。","ana":"须区分个别与社会必要劳动时间、单位商品价值量与价值总量，以及个别劳动生产率与社会劳动生产率。","anaAI":true,"qaNotes":"本地marx-2304第15题、marx-2404第14题均核社会必要劳动时间；marx-2510第15题核价值量与生产率反比。"},{"t":"w","n":33,"stem":"如何理解资本主义的历史进步性，其主要表现是什么?","score":10,"ans":"评价资本主义要置于历史发展过程中：相对于封建社会，它以资本主义生产关系代替封建人身依附关系，打破妨碍生产力发展的旧束缚，因而具有历史进步性；这并不否认资本主义剥削和其历史局限。其表现主要有：①资本追逐剩余价值和市场竞争推动技术革新、劳动生产率提高、生产规模扩大，创造了远超以往社会的物质财富；②资本主义普遍发展商品经济、社会分工和协作，推动机器大工业、社会化大生产和世界市场形成，促进经济联系与社会交往；③瓦解封建等级关系和地方割据，推动现代法制、科学教育和人的社会活动范围扩大，尽管资产阶级平等与自由有阶级局限；④高度发展的生产力、社会化生产及无产阶级成长，为更高社会形态准备了物质和社会条件。同时，生产社会化与资本主义私人占有的基本矛盾限制其进步作用，资本主义终将为更高形态所取代。","ana":"围绕“与封建社会相比”的历史尺度，说明生产力、生产关系和社会联系方面的进步，并指出局限，不能将进步性说成永恒优越性。","anaAI":true,"qaNotes":"本地marx-2504第19题有关为更高生产方式创造物质条件；本题其余具体表现据教材历史作用论述。"}]}],"code":"15044"},{"paper":"xws-2504","subject":"xws","session":"2504","label":"2025年4月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"中国现代文学发端于","score":1,"opts":["\"小说界革命\"","\"五四\"文学革命","白话文运动","\"诗界革命\""],"ans":"B","ana":"中国现代文学以“五四”文学革命为开端。“五四”文学革命的直接背景和动力是“五四”新文化运动。“五四”时期以陈独秀主编的《新青年》为主要阵地,反对旧道德、提倡新道德,兴起了“ 民主”与“科学”的新文化思想启蒙运动。《新育年》大力介绍自由平等学说、个性解放思想、社会进化论,给人们提供思想武器。"},{"t":"s","n":2,"stem":"“五四”初期,周作人提倡新文学用人道主义研究人生诸问题的文章是","score":1,"opts":["《文学革命论》","《文学改良刍议》","《建设的文学革命论》","《人的文学》"],"ans":"D","ana":"周作人在《人的文学》中,提倡新文学用人道主义研究人生诸问题,强调文学要以人道主义为本,关注人的生活和命运。《文学革命论》是陈独秀的作品,主张文学革命;《文学改良刍议》是胡适的文章,倡导文学改良;《建设的文学革命论》同样是胡适的作品,主要论述建设新文学的主张。"},{"t":"s","n":3,"stem":"中国现代文学史上,台湾的第一部新诗集是","score":1,"opts":["赖和的《觉悟下的牺牲》","追风的《诗的模仿》","杨云萍的《橘子开花》","张我军的《乱都之恋》"],"ans":"D","ana":"1925 年12 月,台湾现代文学史上的第一部新诗集张我军的《乱都之恋》在台北出版。"},{"t":"s","n":4,"stem":"作为中国新文学进入第二个十年标志的革命文学倡导,发生在","score":1,"opts":["1927 年","1928 年","1930 年","1932 年"],"ans":"B","ana":"1928 年,创造社、太阳社等倡导革命文学,这成为中国新文学进入第二个十年的标志。1927 年大革命失败,社会环境的变化促使文学界发生转变,1928 年革命文学的倡导掀起了新的文学思潮;1930 年“左联”成立,是革命文学发展的进一步成果。"},{"t":"s","n":5,"stem":"20 世纪30 年代初, 自称“ 自由人”、在左翼文学与国民党民族主义文学之间左右开弓的作家是","score":1,"opts":["梁实秋","苏汶","胡秋原","郁达夫"],"ans":"C","ana":"1931 年底,胡秋原自称“ 自由人”,谈“文学与艺术,至死也是自由的,民主的”,在左翼文学与国民党民族主义文学之间左右开弓。梁实秋主要是与左翼文学进行论争;苏汶是“第三种人”的代表。"},{"t":"s","n":6,"stem":"巴金的《雾》《雨》《电》,史称","score":1,"opts":["《爱情三部曲》","《漂流三部曲》","《激流三部曲》","“农村三部曲”"],"ans":"A","ana":"巴金的《雾》《雨》《电》被称为《爱情三部曲》,主要围绕几个年轻人的爱情和革命生活展开。《漂流三部曲》是郭沫若的作品;《激流三部曲》是巴金的《家》《春》《秋》;“农村三部曲”一般指茅盾的《春蚕》《秋收》《残冬》。"},{"t":"s","n":7,"stem":"沈从文专注于解剖知识分子病态人格的小说是","score":1,"opts":["《边城》","《萧萧》","《八骏图》","《柏子》"],"ans":"C","ana":"《八骏图》中沈从文通过描写八位教授的生活和思想,专注于解剖知识分子的病态人格。《边城》描绘了湘西的风土人情和翠翠的爱情故事;《萧萧》讲述了童养媳萧萧的命运;《柏子》刻画了水手柏子的生活和情感。"},{"t":"s","n":8,"stem":"在曹禺的《雷雨》中,性格畸形、对父亲周朴园的形象形成补充的人物是","score":1,"opts":["周萍","周冲","鲁大海","四风"],"ans":"A","ana":"周萍在《雷雨》中性格畸形,他与继母蘩漪有不伦之恋,又试图摆脱这种关系,其行为和性格反映出封建家庭对人性的扭曲,对父亲周朴园的形象起到了补充作用。周冲是一个单纯、善良的青年;鲁大海是工人代表,具有反抗精神;四风是一个天真、善良的女仆。"},{"t":"s","n":9,"stem":"戴望舒在1928 年8 月发表于《小说月报》的成名作是","score":1,"opts":["《寻梦者》","《对于天的怀乡病》","《我底记忆》","《雨巷》"],"ans":"D","ana":"1928 年8 月,戴望舒在《小说月报》第19 卷第8 期发表《雨巷》,这首诗典型地反映了30 年代知识青年的苦闷、幻灭、彷徨而又对理想充满期盼的复杂心态。《寻梦者》《对于天的怀乡病》《我底记忆》也是戴望舒的作品。"},{"t":"s","n":10,"stem":"以描写农村生活、表现农民苦难命运见长,史称“农民诗人”的是","score":1,"opts":["臧克家","蒲风","田间","艾青"],"ans":"A","ana":"臧克家30 年代诗歌的主要内容是描写农村的生活面貌及农民的苦难命运,他也因此被称为“农民诗人”和“乡土诗人”。蒲风是中国诗歌会”最有代表性的诗人,诗歌能够及时反映重大题材,表现工农大众的生活与斗争,突出对实际革命运动的鼓动作用。田间的诗歌具有强烈的战斗性;艾青的诗作题材广泛,主要以对土地的热爱和对光明的追求为主题。"},{"t":"s","n":11,"stem":"抗战时期提倡“与抗战无关”论,反对文艺公式化的作家是","score":1,"opts":["孔罗荪","张天翼","茅盾","梁实秋"],"ans":"D","ana":"抗战时期,梁实秋提出“与抗战无关”论,认为文学不必局限于抗战题材,反对文艺公式化。"},{"t":"s","n":12,"stem":"下列作品中,不属于抗战时期讽刺小说的是","score":1,"opts":["沙汀的《淘金记》","张天翼的《华威先生》","萧红的《马伯乐》","丘东平的《第七连》"],"ans":"D","ana":"《第七连》是丘东平描写战争的小说,着重展现战争中的士兵生活等,不属于讽刺小说。沙汀的《淘金记》讽刺了抗战时期大后方的黑暗现实;张天翼的《华威先生》讽刺了抗战时期一些只图虚名、不做实事的官僚;萧红的《马伯乐》也具有讽刺意味,刻画了一个在抗战时期只顾自己逃命的人物形象。"},{"t":"s","n":13,"stem":"小说《饥饿的郭素娥》表现了主人公物质和精神双重困境,作者是","score":1,"opts":["路翎","胡风","萧红","钱钟书"],"ans":"A","ana":"《饥饿的郭素娥》的作者是路翎,以矿山生活为背景,通过郭素娥这一形象表现了劳动人民求幸福求解放的生命意志。美丽而强悍的郭素娥,面临着物质上与精神上的双重“饥饿”,渴望美满的家庭生活,敢于傲视社会的冷眼,向宗法家族势力与流氓势力挑战,当她被当做物品转卖时,宁死也不从,喊出了“你们不晓得一个女人底日子,她挨不下去,她痛苦”,最终被用火铲活活烙死。"},{"t":"s","n":14,"stem":"张恨水第一部具有现代意义的通俗小说巨制是","score":1,"opts":["《五子登科》","《金粉世家》","《八十一梦》","《丹凤街》"],"ans":"B","ana":"张恨水的《金粉世家》是其第一部具有现代意义的通俗小说巨制,小说写京城三世同堂的国务总理金家,以其七少爷金燕西和出身寒门的女子冷清秋的婚姻悲剧为主线,穿插与金家有关的百十个人物,写出巨宦豪门的一朝崩溃,整个家族树倒猢狲散的结局。小说打破了中国古典小说封闭式的结尾模式,呈开放式结构。《五子登科》《八十一梦》《丹凤街》也是张恨水的作品。"},{"t":"s","n":15,"stem":"梁生宝这一社会主义新人形象出自","score":1,"opts":["《创业史》","《铁木前传》","《三里湾》","《山乡巨变》"],"ans":"A","ana":"梁生宝是柳青《创业史》中的社会主义新人形象,他带领农民走互助合作化道路。《创业史》描写了农业合作化前后农村错综复杂的社会关系与尖锐激烈的矛盾斗争,反映了农村社会主义改造的过程。四条线索:①梁三老汉、王二直杠等贫苦农民,迷恋旧时代的创业道路,企图依靠传统的生产方式发家致富,而与互助合作运动格格不入。②高裕中农郭世富,凭借优厚的经济实力,与互助组公开较量,顽固维护私有制,幻想再度雇工剥削。③富农姚士杰,刻骨仇恨新社会,暗中施展阴谋,妄图扼杀互助组,实行阶级报复。④党员、村代表主任郭振山,背离党的宗旨,热衷个人发家,幕后支持互助组的反对势力,曲折干扰、抵制互助合作运动。"},{"t":"s","n":16,"stem":"新中国成立后第一个出国演出的话剧是","score":1,"opts":["《西望长安》","《茶馆》","《龙须沟》","《关汉卿》"],"ans":"B","ana":"新中国成立后,《茶馆》是第一个出国演出的话剧,它展现了老北京的社会风貌,欧洲戏剧界称赞《茶馆》是“东方戏剧的奇迹”,在日本被誉为是“继梅兰芳访问演出后的第二次轰动”。"},{"t":"s","n":17,"stem":"1979 年10 月在北京召开的文艺工作者“五世同堂”的盛会是","score":1,"opts":["第一次全国文代会","第二次全国文代会","第三次全国文代会","第四次全国文代会"],"ans":"D","ana":"1979 年10 月召开的第四次全国文代会,是文艺工作者“五世同堂”的盛会,为新时期文艺的发展指明了方向。第一次全国文代会于1949 年召开;第二次全国文代会于1953年召开;第三次全国文代会于1960 年召开。"},{"t":"s","n":18,"stem":"1989 年推出“新写实小说大联展”的期刊是","score":1,"opts":["《人民文学》","《作家》","《钟山》","《收获》"],"ans":"C","ana":"“新写实小说”的创作发生于1988 年前后,但其作为一种小说潮流被正式命名并产生广泛的社会影响,却源自于《钟山》1989 年第3 期推出的“新写实小说大联展”。"},{"t":"s","n":19,"stem":"收入《道士塔》和《莫高窟》等名篇,富有文化忧患意识的散文集是","score":1,"opts":["余秋雨的《文化苦旅》","巴金的《随想录》","张中行的《负暄话》","杨绛的《千校六记》"],"ans":"A","ana":"余秋雨《文化苦旅》开篇的《道士塔》《莫高窟》表明作者一方面为灿烂的中国文化骄傲不已,同时又以极其沉痛的笔调记叙莫高窟屡遭洗劫的不幸,这种矛盾心境的背后,则是作者对中国文化自身先进与落后因素并存的无奈与体认。巴金的《随想录》主要是对自我和社会的反思;张中行的《负暄话》多回忆旧人旧事;杨绛的《千校六记》记录了特殊时期的生活。"},{"t":"s","n":20,"stem":"高行健的戏剧中,运用荒诞派表现形式,结构方式类似于贝克特《等待戈多》的作品是","score":1,"opts":["《绝对信号》","《彼岸》","《车站》","《野人》"],"ans":"C","ana":"高行健的《车站》运用荒诞派表现形式,其结构方式类似于贝克特的《等待戈多》,只是等待的对象变成了一辆迟迟没有停站的公共汽车。《绝对信号》在主题和某些手段上还存留着传统话剧的成分;《野人》应该说是最为成熟的一部,它是多声部哲理剧的一个典范。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"茅盾小说处女作《蚀》由几个独立的中篇构成,它们有","score":2,"opts":["《幻灭》","《动摇》","《追求》","《腐蚀》","《春蚕》"],"ans":"ABC","ana":"茅盾的《蚀》由《幻灭》《动摇》《追求》三个独立的中篇构成,三部小说基本以时间为序,完整而清晰地再现了大革命失败前后青年知识分子的心态和命运,也真实地反映了作者内心的困惑与矛盾。《腐蚀》是茅盾另一部作品;《春蚕》是茅盾“农村三部曲”之一。"},{"t":"m","n":22,"stem":"以下对毛泽东《在延安文艺座谈会上的讲话》主要内容的概述,正确的有","score":2,"opts":["文艺为工农兵服务","文艺工作者需要深入实际斗争","阐明了文艺普及和提高的辩证关系","文艺源于生活、高于生活","文艺要表现普遍的永恒的人性"],"ans":"ABCD","ana":"1942 年5 月延安文艺座谈会的召开和毛泽东《在延安文艺座谈会上的讲话》在次年公开发表,是抗战文艺运动中最重要的历史事件,也是解放区文学运动的发展标志。毛泽东《在延安文艺座谈会上的讲话》:(1)要求文艺工作者“站在无产阶级立场上”,使文艺为人民大众,首先“为工农兵”服务。(2)从解放区的实际出发,要求文艺工作者在学习马克思主义的同时,必须“深入工农兵群众,深人实际斗争”,从而为作家世界观的转变和创作源泉的获得指明了根本途径;指明“在普及基础上的提高”和“在提高基础上的普及”的辩证关系;指出文艺源于生活,“却可以而且应该比实际生活更高,更强烈,更有集中性,更典型,更理想,由此就更带普遍性”;指出要借鉴吸收中外文化遗产中的精华,同时也说明这是“流”而不是“源”。(3)在文艺与政治的关系的论述中,明确以政治标准为第一,艺术标准第二,对文艺自身的特点与规律没有给予充分的重视。"},{"t":"m","n":23,"stem":"以胡风为核心的“七月诗派”,代表作有","score":2,"opts":["绿原的《童话》","牛汉的《鄂尔多斯草原》","穆旦的《诗八首》","高兰的《哭亡女苏菲》","阿垅的《纤夫》"],"ans":"ABE","ana":"七月诗派在艺术上的追求和创造把自由体新诗推向了一个新的高峰。绿原充满浪漫憧憬的诗集《童话》,振聋发聩的《给天真的乐观主义者们》等政治抒情诗,以及《终点,又是起点》、《伽利略在真理面前》、《你是谁?》等都是优秀之作。鲁藜的诗集《醒来的时候》、《锻炼》中大量朴实而清新的短诗,抒写了诗人在抗日民主根据地的新鲜感受,《泥土》是表现新的人生哲学的名篇。其他如阿垅的《纤夫》、牛汉的《鄂尔多斯草原》等都是充满力度和激情,足以显示七月诗派风格的代表作。穆旦是“九叶诗派”的代表诗人;高兰以朗诵诗闻名。"},{"t":"m","n":24,"stem":"“十七年”历史剧的代表作有","score":2,"opts":["郭沫若的《蔡文姬》","田汉的《关汉卿》","老舍的《龙须沟》","海默的《洞箫横吹》","曹禺的《北京人》"],"ans":"AB","ana":"“十七年”指1949 -1966 年,主要作品有郭沫若的《蔡文姬》、《武则天》,田汉的《关汉卿》、《文成公主》,曹禺(执笔)、梅阡、于是之的《胆剑篇》,老舍的《义和拳》,丁西林的《孟丽君》等。郭沫若的《蔡文姬》通过讲述蔡文姬的故事,展现历史人物的情感与时代背景;田汉的《关汉卿》以关汉卿的经历为题材,歌颂其抗争精神,二者均为“十七年”历史剧的代表作。老舍的《龙须沟》是反映北京人民生活变迁的现实题材话剧;海默的《洞箫横吹》是农村题材作品;曹禺的《北京人》创作于1940 年。"},{"t":"m","n":25,"stem":"下列文章中,提倡文化寻根的有","score":2,"opts":["艾青的《诗人必须说真话》","韩少功的《文学的“根”》","郑万隆的《我的根》","李杭育的《理一理我们的根》","公刘的《诗与诚实》"],"ans":"BCD","ana":"20 世纪80 年代出现文化寻根思潮,韩少功的《文学的“根”》、郑万隆的《我的根》、李杭育的《理一理我们的根》、阿城的《文化制约着人类》都提倡文化寻根,主张从传统文化和地域文化中寻找文学创作的源泉与根基。艾青的《诗人必须说真话》主要强调诗人创作要秉持真诚的态度;公刘的《诗与诚实》重点围绕诗歌创作中的诚实品质展开。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"“ 自叙传”小说","score":4,"ans":"(1)或曰“身边小说”,有郁达夫的《沉沦》、郭沫若的《漂流三部曲》等。(2)主要写亲身经历或个人感受,感情色彩强烈。","ana":"“自叙传”小说又称身边小说，以个人经历、感受和强烈主观抒情为主要特征，郁达夫《沉沦》、郭沫若相关作品是常见例子；答题应抓住自我经验与感情色彩。","anaAI":true},{"t":"term","n":27,"stem":"“南明史剧”","score":4,"ans":"(1)上海“孤岛”时期以讲述明末历史为主要内容的戏剧作品。代表作有阿英的《碧血花》《葛嫩娘》《海国英雄》,于伶的《大明英烈传》等。(2)主要描写郑成功等明末反清斗争中的英雄人物,以激励现实大众的爱国热情。","ana":"“南明史剧”指上海孤岛时期借明末史事和人物激发爱国情感的历史剧，代表作包括阿英、于伶的相关剧作；答题需交代时代背景、历史题材与现实寄托。","anaAI":true},{"t":"term","n":28,"stem":"“朦胧诗”","score":4,"ans":"(1)70 年代后期出现的带有现代主义色彩的诗潮,代表诗人有北岛、舒婷等。(2)注重象征、暗示、联想等手法的运用,作品具有朦胧、多义的特点。","ana":"朦胧诗兴起于70年代后期，北岛、舒婷等为代表，常用象征、暗示和联想形成多义表达；其“朦胧”并非内容含混，而是强调审美意蕴的开放性。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简述30 年代文学创作的特点。","score":8,"ans":"(1)运用科学的社会理论剖析中国社会,如左翼作家;由文化层面批判社会、探究人生,如老舍和“京派”;题材内容空前广泛,涉及中国社会各阶层生活。(2)长篇小说形式日趋成熟,抒情写意小说长足发展;戏剧、诗歌、散文都有重要收获。(3)现实主义成为主流,浪漫主义在变异中发展,现代主义取得丰硕成果。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"30年代文学题材广泛，既有左翼社会分析和京派文化批判，也有都市、乡土等多样书写；形式上长篇小说成熟、抒情小说发展，并呈现实主义主流与多种创作方法并存。","anaAI":true},{"t":"short","n":30,"stem":"简析李季《王贵与李香香》的艺术特色。","score":8,"ans":"(1)借鉴“信天游”形式,擅用比兴手法,叙事和抒情相结合。(2)改进“信天游”形式,表现新的主题和人物,为新诗民族化做出了贡献。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"《王贵与李香香》借鉴信天游的比兴、复沓和民歌节奏，将爱情叙事与革命主题结合；艺术分析要说明对民歌形式的改造及其新诗民族化意义。","anaAI":true},{"t":"short","n":31,"stem":"简析杨朔的散文艺术及其局限。","score":8,"ans":"(1)擅长缘物生情,托物言志,从细微处落墨,创造诗的意境。(2)讲究剪裁布局,于峰回路转中生发出哲理,卒章显志。(3)主题较为单一,谋篇布局时有雷同。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"杨朔散文常由细小事物生发主题，讲究剪裁布局、托物言志和结尾点题，形成诗化意境；同时应指出主题与结构模式有时趋于单一、重复。","anaAI":true},{"t":"short","n":32,"stem":"简析余华小说的先锋性。","score":8,"ans":"(1)冷漠叙述:迷恋于暴力、灾难尤其是死亡的书写,叙述者的主体意向降至感情的冰点。(2)文类颠覆:对旧有的文类进行戏仿,追求文类和价值观的双重颠覆。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。","ana":"余华先锋小说常以冷静克制的叙述处理暴力、灾难和死亡，并戏仿、拆解既有文类规范；作答应说明形式实验如何挑战传统叙事和价值判断。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"结合作品分析《狂人日记》的思想意义。","score":13,"ans":"(1)揭露了从家庭到社会的“吃人”现象,抨击了封建家族制度和礼教的“吃人”本质,体现了“五四”新文学彻底反封建的总体倾向。(2)对封建礼教的揭露和批判,由当下生存空间到历史文化批判再到自我审视,逐层深入。(3)狂人发出了“从来如此,便对么”“救救孩子”的呼喊,表现了强烈的怀疑、反抗和变革的精神。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"《狂人日记》从“吃人”意象揭露封建家族制度与礼教，批判深入到历史文化和自我审视，并以“救救孩子”寄托变革希望；论述需结合文本细节说明启蒙与反封建意义。","anaAI":true},{"t":"essay","n":34,"stem":"结合作品分析《骆驼祥子》的艺术成就。","score":13,"ans":"(1)成功塑造了祥子与虎妞的典型形象。(2)人物塑造上体现了老舍写出“灵的文学”的主张。(3)浓郁的地域文化色彩与纯熟的北京口语。(4)围绕“车”组织情节的结构方式。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"《骆驼祥子》通过祥子、虎妞等典型形象及“车”的反复得失组织情节，展现个人奋斗的破灭；艺术成就还包括北京口语、地域文化色彩和对人物内心的刻画。","anaAI":true}]}],"code":"00537","qaNotes":[]},{"paper":"xws-2510","subject":"xws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"下列人物中,属于学衡派的是","score":1,"opts":["林纾","陈独秀","梅光迪","蔡元培"],"ans":"C","ana":"学衡派是20 世纪20 年代出现的文化保守主义流派,核心成员包括梅光迪、吴宓等。林纾是近代古文家、翻译家,并非学衡派;陈独秀是新文化运动倡导者,属于激进派;蔡元培是教育家,主张兼容并包,不属学衡派。"},{"t":"s","n":2,"stem":"中国现代文学的开创者是","score":1,"opts":["鲁迅","茅盾","郁达夫","叶绍钧"],"ans":"A","ana":"鲁迅的《狂人日记》是中国现代文学史上第一篇白话小说,打破了传统文学的表达模式,其杂文、小说等作品深刻批判封建礼教,奠定了中国现代文学的思想基础和文学范式,被公认为中国现代文学的开创者。"},{"t":"s","n":3,"stem":"标志20 世纪20 年代中期象征诗派出现的诗集是","score":1,"opts":["《月夜》","《微雨》","《尝试集》","《女神》"],"ans":"B","ana":"李金发的诗集《微雨》于1925 年出版,以独特的象征手法、晦涩的语言表达情感,标志着20 世纪20 年代中期象征诗派的正式出现。《月夜》是沈尹默的白话诗作品,《尝试集》是胡适的白话诗集,《女神》是郭沫若的浪漫主义诗集。"},{"t":"s","n":4,"stem":"1935 年\"一二·九\"运动爆发,在全民族救亡运动中左作家周扬等提出的文学口号是","score":1,"opts":["\"民族革命战争的大众文学\"","\"国防文学\"","\"平民的文学\"","\"为人生的文学\""],"ans":"B","ana":"1935 年\"一二·九\"运动后,民族危机加深,周扬等左联作家提出\"国防文学\"口号,主张文学为抗日救亡服务,号召各阶层作家联合创作国防题材作品。\"民族革命战争的大众文学\"是鲁迅等人后来提出的补充口号;\"平民的文学\"是周作人在五四时期提出的;\"为人生的文学\"是文学研究会的主张。"},{"t":"s","n":5,"stem":"1921 年接手改组《小说月报》、撰写《〈小说月报〉改革宣言》的作家是","score":1,"opts":["胡适","周作人","叶圣陶","沈雁冰"],"ans":"D","ana":"1921 年,沈雁冰(茅盾)接手改组《小说月报》,摆脱了该刊原有的旧文学倾向,将其改造为文学研究会的核心刊物,并撰写《〈小说月报〉改革宣言》,倡导现实主义文学。胡适、周作人、叶圣陶均未参与此次改组核心工作。"},{"t":"s","n":6,"stem":"巴金原名李尧棠,他最早使用笔名\"巴金\"发表的小说是","score":1,"opts":["《家》","《憩园》","《灭亡》","《寒夜》"],"ans":"C","ana":"巴金于1929 年发表第一部小说《灭亡》,这是他首次使用\"巴金\"这一笔名。《家》是其\"激流三部曲\"的第一部,发表于1931 年;《憩园》发表于1944 年;《寒夜》发表于1946 年。"},{"t":"s","n":7,"stem":"老舍以散文诗笔法创作的短篇小说佳作是","score":1,"opts":["《月牙儿》","《上任》","《断魂枪》","《黑白李》"],"ans":"A","ana":"《月牙儿》以第一人称叙述,语言优美流畅,兼具小说的叙事性与散文诗的抒情性,通过母女两代人的悲惨命运反映社会黑暗。《上任》《断魂枪》《黑白李》均为老舍的短篇小说,但未采用散文诗笔法。"},{"t":"s","n":8,"stem":"萧红的早期代表作,被鲁迅称为表现了\"北方人民的对于生的坚强,对于死的挣扎\"的小说是","score":1,"opts":["《小城三月》","《牛车上》","《生死场》","《马伯乐》"],"ans":"C","ana":"萧红的《生死场》创作于1934 年,描写了东北农村民众在苦难中的生存状态与抗争,鲁迅为该书作序,评价其表现了\"北方人民的对于生的坚强,对于死的挣扎\"。《小城三月》《牛车上》是萧红后期作品,《马伯乐》侧重讽刺批判。"},{"t":"s","n":9,"stem":"艾青原名蒋海澄,1933 年他第一次以笔名\"艾青\"发表的成名作是","score":1,"opts":["《雪落在中国的土地上》","《我爱这土地》","《大堰河--我的保姆》","《向太阳》"],"ans":"C","ana":"1933 年,艾青在狱中创作《大堰河--我的保姆》,首次使用\"艾青\"笔名发表,该诗以真挚的情感歌颂保姆大堰河,成为其成名作。《雪落在中国的土地上》发表于1937 年,《我爱这土地》发表于1938 年,《向太阳》发表于1938 年。"},{"t":"s","n":10,"stem":"七月诗派的理论家胡风主张作家要\"突进\"到现实生活中,创作上提倡的是","score":1,"opts":["浪漫主义精神","乌托邦精神","超脱的精神","\"主观战斗精神\""],"ans":"D","ana":"胡风作为七月诗派的核心理论家,主张作家应深入现实生活,在创作中融入\"主观战斗精神\",强调作家主体与现实的互动与搏斗。七月诗派以现实主义为基础,反对浪漫主义的空想、超脱的态度及乌托邦精神。"},{"t":"s","n":11,"stem":"张恨水的小说《金粉世家》里,金家主人的身份是","score":1,"opts":["华侨富商","国务总理","银行经理","大学教授"],"ans":"B","ana":"《金粉世家》以民国时期国务总理金铨的家庭生活为核心,描写了金家的兴衰历程,金铨作为金家主人,其国务总理的身份是小说情节展开的重要背景。"},{"t":"s","n":12,"stem":"1944 年在延安演出,被毛泽东称为\"旧剧革命的划时期的开端\"的新编京剧是","score":1,"opts":["《兄妹开荒》","《红旗歌》","《逼上梁山》","《血泪仇》"],"ans":"C","ana":"1944 年,新编京剧《逼上梁山》在延安演出,该剧改编自《水浒传》,赋予林冲反抗封建压迫的新内涵,毛泽东观看后称赞其为\"旧剧革命的划时期的开端\"。《兄妹开荒》是秧歌剧,《红旗歌》是话剧,《血泪仇》是秦腔。"},{"t":"s","n":13,"stem":"下列小说中,不属于40 年代解放区文学的是","score":1,"opts":["《暴风骤雨》","《围城》","《吕梁英雄传》","《新儿女英雄传》"],"ans":"B","ana":"《围城》是钱钟书于会现实,不属于解放区文学。《暴风骤雨》是周立波的解放区土改题材小说,《吕梁英雄传》《新儿女英雄传》均为解放区抗日题材小说。"},{"t":"s","n":14,"stem":"70 年代台湾文学界发生的重要文艺论争是","score":1,"opts":["新旧文学论争","通俗文学论争","乡土文学论争","现代主义文学论争"],"ans":"C","ana":"20 世纪70 年代,台湾文学界爆发乡土文学论争,围绕文学应立足本土、反映现实还是追求西方现代主义展开讨论,对台湾文学发展影响深远。新旧文学论争发生在五四时期,现代主义文学论争在60 年代,通俗文学论争并非70 年代核心论争。"},{"t":"s","n":15,"stem":"把张灵甫形象刻画得个性鲜明的作品是","score":1,"opts":["罗广斌、杨益言的《红岩》","吴强的《红日》","梁斌的《红旗谱》","知侠的《铁道游击队》"],"ans":"B","ana":"吴强的《红日》以莱芜战役、孟良崮战役为背景,生动刻画了国民党将领张灵甫的狂妄、固执与军事才能,形象鲜明。《红岩》描写重庆地下革命斗争,《红旗谱》反映冀中农民革命,《铁道游击队》讲述抗日游击战争,均未重点刻画张灵甫。"},{"t":"s","n":16,"stem":"下列小说中,属于\"文革\"时期\"地下文学\"的作品是","score":1,"opts":["姚雪垠的《李自成》","张扬的《第二次握手》","黎汝清的《万山红遍》","李心田的《闪闪的红星》"],"ans":"B","ana":"\"文革\"时期的\"地下文学\"是指未获官方认可、在民间秘密流传的作品。《第二次握手》由张扬创作于\"文革\"期间,因涉及知识分子爱情与科研主题被禁止,以手抄本形式流传,属于地下文学。《李自成》《万山红遍》《闪闪的红星》均为\"文革\"时期官方认可的公开出版物。"},{"t":"s","n":17,"stem":"下列小说中,被视为\"改革文学\"发物之作的是","score":1,"opts":["蒋子龙的《乔厂长上任记》","张洁的《沉重的翅膀》","茹志鹃的《剪辑错了的故事》","路遥的《平凡的世界》"],"ans":"A","ana":"蒋子龙的《乔厂长上任记》发表于1979 年,率先反映工业改革中的问题与矛盾,塑造了敢闯敢干的乔光朴形象,被公认为\"改革文学\"的发轫之作。《沉重的翅膀》《平凡的世界》是后续改革文学的重要作品,《剪辑错了的故事》侧重反思历史。"},{"t":"s","n":18,"stem":"\"告诉你吧,世界/我--不--相--信!\"这一诗句的出处是","score":1,"opts":["舒婷的《致橡树》","北岛的《回答》","杨炼的《大雁塔》","江河的《纪念碑》"],"ans":"B","ana":"该诗句出自北岛的《回答》,诗作创作于改革开放初期,以强烈的反叛精神和质疑态度表达对现实的思考,是朦胧诗派的代表作之一。舒婷的《致橡树》歌颂爱情平等,杨炼的《大雁塔》侧重历史反思,江河的《纪念碑》表达对英雄的敬仰。"},{"t":"s","n":19,"stem":"最早唤醒新时期散文的悲剧意识、强调\"说真话\"原则的作家是","score":1,"opts":["巴金","张中行","贾平凹","杨绛"],"ans":"A","ana":"新时期以来,巴金创作《随想录》,以真诚的笔触反思\"文革\"历史,强调\"说真话\"的文学原则,唤醒了散文的悲剧意识与批判精神,对新时期散文发展影响深远。张中行、贾平凹、杨绛的散文虽各有特色,但未起到这一开创性作用。"},{"t":"s","n":20,"stem":"高行健创作的多声部哲理剧,也是他最为成熟的剧作是","score":1,"opts":["《绝对信号》","《车站》","《野人》","《彼岸》"],"ans":"C","ana":"高行健的《野人》以多声部叙事、多重主题交织的方式,探讨人与自然、历史与现实的关系,是其最为成熟的哲理剧。《绝对信号》是其早期实验剧,《车站》侧重荒诞表达,《彼岸》以探索人生意义为主题,均未达到《野人》的成熟度。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"无产阶级革命文学倡导和兴起的历史背景和现实原因有","score":2,"opts":["现实斗争和革命形势要求无产阶级在文学上提出自己的口号,建设无产阶级文学","国际无产阶级文学运动包括苏联文学对中国文学界产生很大影响","参加实际革命的知识分子在大革命失败后汇聚上海从事创作,成为革命文学的主力","大批小资产阶级知识分子急剧左转,暂时成了无产阶级文学的代表","推进反封建思想斗争、改造国民性成了时代的主旋律"],"ans":"ABCD","ana":"无产阶级革命文学兴起于20 世纪20 年代末,背景包括:革命形势需要无产阶级文学发声;国际无产阶级文学运动(如苏联文学)的影响;大革命失败后革命知识分子汇聚上海;小资产阶级知识分子左转加入创作队伍。E 选项是五四新文化运动的核心主题,并非无产阶级革命文学兴起的背景。"},{"t":"m","n":22,"stem":"下列沈从文小说中,以民间传说和佛经故事铺衍成篇的作品有","score":2,"opts":["《丈夫》","《龙朱》","《月下小景》","《神巫之爱》","《八骏图》"],"ans":"BCD","ana":"沈从文的《龙朱》《月下小景》《神巫之爱》均借鉴民间传说或佛经故事,构建了充满诗意的湘西世界。《丈夫》聚焦湘西水手与妻子的生活,《八骏图》批判都市知识分子的虚伪,均未以民间传说或佛经故事为创作基础。"},{"t":"m","n":23,"stem":"下列小说中,由张爱玲创作的有","score":2,"opts":["《倾城之恋》","《金锁记》","《沉香屑·第一炉香》","《八十一梦》","《结婚十年》"],"ans":"ABC","ana":"《倾城之恋》《金锁记》《沉香屑·第一炉香》均为张爱玲的经典小说,以细腻的笔触描写都市男女的情感与命运。《八十一梦》是张恨水的作品,《结婚十年》是苏青的自传体小说。"},{"t":"m","n":24,"stem":"关于夏衍的戏剧《上海屋檐下》,下列说法正确的有","score":2,"opts":["现实主义戏剧","手法洗练含蓄","江南梅雨季节的背景","弄堂生活场景","现代主义风格"],"ans":"ABCD","ana":"《上海屋檐下》是夏衍的现实主义戏剧代表作,以江南梅雨季节为背景,描写上海弄堂里几户人家的生活,手法洗练含蓄,真实反映社会底层民众的苦难。该剧采用现实主义创作方法,并非现代主义风格,故E 选项错误。"},{"t":"m","n":25,"stem":"\"十七年\"文学中反映工业建设的长篇小说有","score":2,"opts":["周立波的《铁水奔流》","艾芜的《百炼成钢》","柳青的《创业史》","曲波的《林海雪原》","杜鹏程的《保卫延安》"],"ans":"AB","ana":"\"十七年\"文学指1949-1966 年的文学创作,《铁水奔流》描写钢铁工业建设,《百炼成钢》聚焦工厂生产与工人成长,均属工业建设题材。《创业史》反映农业合作化运动,《林海雪原》《保卫延安》均为革命历史题材小说,故C、D、E选项错误。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"《潘先生在难中》","score":4,"ans":"(1)叶绍钧代表作。以军阀混战为背景写潘先生的逃难经历,揭示了社会现实的混乱与黑暗。潘先生形象典型地表现了小市民知识分子的自私、圆滑与世故。(2)笔调严谨扎实,深沉的情感蕴含于客观叙述中,冷峻含蓄,体现了叶绍钧小说的现实主义风格。","ana":"《潘先生在难中》以军阀混战中的逃难经历刻画潘先生的自私、圆滑与世故，并以冷静客观的写实笔调寄寓批判；名词解释应联系作品背景、人物类型和叶绍钧的现实主义风格。","anaAI":true},{"t":"term","n":27,"stem":"中国左翼作家联盟","score":4,"ans":"(1)1930 年3 月2 日在上海成立,鲁迅、冯雪峰、冯乃超、李初梨、蒋光慈等40余人出席了成立大会。(2)会上通过了\"左联\"理论纲领,以\"援助而且从事无产阶级艺术的产生\"为奋斗目标。鲁迅作了《对于左翼作家联盟的意见》的重要讲话,号召\"左联\"在共同目标下扩大联合战线。","ana":"“左联”于1930年在上海成立，鲁迅等人参与，推动马克思主义文艺理论传播、文艺大众化和左翼创作；作答可概括其组织活动与文学史影响。","anaAI":true},{"t":"term","n":28,"stem":"\"赵树理方向\"","score":4,"ans":"(1)1943年起赵树理发表《小二黑结婚》等一系列作品,推进了中国现代小说的民族化、大众化,为解决新文学与农民沟通问题提供了成功的经验。(2)赵树理的创作受到彭德怀、郭沫若等的充分肯定。陈荒煤提出了\"赵树理方向\",号召作家向赵树理学习。","ana":"“赵树理方向”强调赵树理创作在小说大众化、民族化及沟通新文学与农民方面的经验；回答应交代其作品实践和提出这一方向的文学史语境。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简析叶紫小说《丰收》的思想意义","score":8,"ans":"(1)表现\"丰收成灾\"的主题。深刻反映了农民苦难的社会根源,暗示了斗争是农民解放的根本途径。(2)云普叔代表老一代农民形象,相信勤劳可以致富。立秋是新一代农民代表,反对父亲的人生哲学,对统治阶级不抱幻想,开始在党的领导下进行自觉斗争。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《丰收》写“丰收成灾”，揭示农民苦难的社会根源，并通过云普叔与立秋的代际观念差异呈现农民意识变化；答题应联系“勤劳致富”信念与觉醒、斗争意识。","anaAI":true},{"t":"short","n":30,"stem":"简析戴望舒诗歌《雨巷》的艺术特色","score":8,"ans":"(1)浓重的象征意味。\"寂寥\"的\"雨巷\"象征当时的社会现实,\"丁香一样地/结着愁怨的姑娘\",象征诗人美好的希望。(2)优美的旋律、流动的节奏,\"替新诗的音节开了一个新的纪元\"。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《雨巷》以雨巷、丁香姑娘等意象形成象征层次，并凭复沓、音韵和流动节奏营造朦胧忧郁的音乐美；答题宜结合具体诗句说明意象如何承载情绪。","anaAI":true},{"t":"short","n":31,"stem":"简析艾芜小说集《南行记》的思想内容","score":8,"ans":"(1)以漂泊知识者的眼光叙述边陲下层民众生活,刻画出各式各样的流民形象。(2)表现了人物强烈的生存意识与朦胧的反抗精神。(3)批判了黑暗的虎狼世界,寄托了作者对底层民众的同情、理解与赞颂。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"《南行记》以漂泊知识者视角书写边地流民的生存状态，既表现强烈生存意识和朦胧反抗，也寄托作者对底层民众的同情与理解；可联系其现实主义观察。","anaAI":true},{"t":"short","n":32,"stem":"简析老舍话剧《茶馆》中王利发的人物形象","score":8,"ans":"(1)勤勤恳恳的小生意人,精明、圆滑、世故,也有一些正义感。(2)奉行妥协逢迎的处世哲学,却不保守固执,不断改良茶馆的经营,最后还是难逃茶馆被霸占、自己上吊自杀的悲剧。(3)他的不幸命运是对旧社会的控诉,也是对\"好人\"哲学的否定。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分","ana":"王利发精明勤勉、善于经营又讲究妥协逢迎，虽不断改良茶馆仍无法逃脱时代压迫；其悲剧揭示旧社会中小生意人的生存困境及“好人”式处世哲学的无力。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"论述鲁迅小说《祝福》中祥林嫂悲剧的主客观原因","score":13,"ans":"(1)主观原因:满足于坐稳了奴隶的地位。她的\"逃撞捐问\"都见出\"从一而终\"的封建\"女德\"或封建神权的影响。她以封建礼教的是非为是非,这注定了她的悲剧命运。(2)客观原因:封建的夫权、族权、神权、政权四大绳索编成了严密的网。\"围观\"的看客们维护着\"三纲五常\",自觉不自觉地用统治阶级的观念审视、责备、折磨,使她孤立无援,陷入恐惧、绝望的境地。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"祥林嫂的悲剧既受再嫁、捐门槛等经历中的礼教观念影响，也由夫权、族权、神权和社会冷漠共同造成；论述应结合鲁镇人物与看客态度，避免把责任归咎于受害者。","anaAI":true},{"t":"essay","n":34,"stem":"论析顾城诗歌的思想内容与艺术特点","score":13,"ans":"(1)早期部分诗作直接观照现实,如《一代人》对\"一代人\"与黑暗时代之间的关系进行了精辟概括。但他很快放弃了这种写作方式,专注于营造纯净优美的童话世界,因此被称为\"童话诗人\"。(2)大多数作品是短小的抒情诗,擅长以象征方式表达对纯美世界的向往,探索心灵世界的隐秘,表现出诗人敏锐捕捉感觉的才能。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。","ana":"顾城早期诗歌有对现实的直接感受，后期常以短小抒情诗营造纯净、童话般的意象世界；可结合《一代人》等说明其象征手法、对光明与纯美的追寻及风格变化。","anaAI":true}]}],"code":"00537","qaNotes":[]},{"paper":"xws-2604","subject":"xws","session":"2604","label":"2026年4月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的。","items":[{"t":"s","n":1,"stem":"被茅盾称为“客观地，写实地，描写着灰色的卑琐的人生”的文学研究会作家是","score":1,"opts":["叶绍钧","许地山","王统照","冰心"],"ans":"A","ana":"茅盾这句评语指叶绍钧（叶圣陶）的写实小说，对平凡而卑琐的人生作客观描绘。","anaAI":true},{"t":"s","n":2,"stem":"被鲁迅誉为“中国最杰出的抒情诗人”的是","score":1,"opts":["李金发","冯至","宗白华","朱自清"],"ans":"B","ana":"鲁迅对冯至的抒情诗给予这一评价；本地2404卷有同一评价、选项位置不同，所指仍为冯至。","anaAI":true},{"t":"s","n":3,"stem":"“五四”时期最早出现的散文类型是","score":1,"opts":["杂感短论","叙事散文","抒情散文","游记散文"],"ans":"A","ana":"“五四”新文学中的杂感短论先行兴起，以议论、批评社会与文化为主要特色。","anaAI":true},{"t":"s","n":4,"stem":"丁西林的第一部独幕喜剧是","score":1,"opts":["《压迫》","《兵变》","《一只马蜂》","《终身大事》"],"ans":"C","ana":"《一只马蜂》是丁西林早期独幕喜剧，《压迫》《兵变》等不对应本题所问的第一部。","anaAI":true},{"t":"s","n":5,"stem":"在全民族救亡运动的推动下，发生了“两个口号”论争，胡风、冯雪峰为补救周扬等人口号的不足而提出的新口号是","score":1,"opts":["“为人生的文学”","“平民的文学”","“国防文学”","“民族革命战争的大众文学”"],"ans":"D","ana":"周扬等人主张“国防文学”，胡风、冯雪峰等提出“民族革命战争的大众文学”，两者构成当时的“两个口号”论争。","anaAI":true},{"t":"s","n":6,"stem":"下列作家中，最早从事共产主义运动、成为中国共产党首批党员的是","score":1,"opts":["鲁迅","茅盾","郭沫若","郁达夫"],"ans":"B","ana":"本地现代文学史笔记明确记载沈雁冰（茅盾）1921年成为中国共产党首批党员；题干选项B为茅盾，故据本地教材核订为B。卷后附录C及“郭沫若首批党员”解析与本地教材证据不符。","anaAI":true,"qaNotes":"本地《中国现代文学史》蒋丽媛2604全书笔记原文记“1921年成为中国共产党的首批党员”，置于茅盾条下；对应选项B。题面选项完整，答案可按本地教材更正；附录答案C及解析属误。"},{"t":"s","n":7,"stem":"巴金的《激流三部曲》塑造的一个封建家庭专制重压下灵魂病态的人物是","score":1,"opts":["觉慧","觉民","觉新","鸣凤"],"ans":"C","ana":"觉新在封建家族秩序下既有自我意识又一再妥协，形成受压抑的矛盾性格。","anaAI":true},{"t":"s","n":8,"stem":"《为奴隶的母亲》通过一个“典妻”故事写出了旧中国农妇的悲剧命运，作者是","score":1,"opts":["沙汀","艾芜","叶紫","柔石"],"ans":"D","ana":"《为奴隶的母亲》是柔石的小说，通过典妻经历揭示贫困与制度性压迫。","anaAI":true},{"t":"s","n":9,"stem":"最能体现“新感觉派”小说特点的施蛰存小说集是","score":1,"opts":["《都市风景线》","《梅雨之夕》","《南行记》","《传奇》"],"ans":"B","ana":"《梅雨之夕》是施蛰存小说集，注重人物感觉和心理描写；其余三项分别对应不同作家或 本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"下列杂文集中，属于鲁迅前期作品的有","score":2,"opts":["《热风》","《坟》","《二心集》","《华盖集》","《南腔北调集》"],"ans":"ABD","ana":"《热风》《坟》《华盖集》属于鲁迅较早期的杂文集；《二心集》《南腔北调集》归入后期。","anaAI":true},{"t":"m","n":22,"stem":"下列作品中，属于郁达夫创作的小说有","score":2,"opts":["《祝福》","《迟桂花》","《沉沦》","《薄奠》","《寒夜》"],"ans":"BCD","ana":"《迟桂花》《沉沦》《薄奠》均由郁达夫创作；《祝福》是鲁迅的小说，《寒夜》为巴金小说。","anaAI":true},{"t":"m","n":23,"stem":"“左联”成立后开展的一系列文学活动有","score":2,"opts":["加强了马克思主义文艺理论的翻译、介绍和研究","加强与世界文学、特别是世界无产阶级文学运动的联系","讨论文艺大众化问题，推进文艺大众化运动","提倡“为人生的文学”，开展启蒙主义的思想教育","注重培养新作家，推动文学创作取得出色成就"],"ans":"ABCE","ana":"“左联”推动马克思主义文艺理论译介、国际联络、文艺大众化讨论和新作家培养；“为人生的文学”主要是文学研究会的主张。","anaAI":true},{"t":"m","n":24,"stem":"下列人物中，属于老舍《茶馆》中的有","score":2,"opts":["王利发","秦仲义","童阿男","刘莲英","常四爷"],"ans":"ABE","ana":"王利发是茶馆掌柜，秦仲义和常四爷也都是《茶馆》中的人物；C、D不属该剧人物。","anaAI":true},{"t":"m","n":25,"stem":"下列散文作品中，由余秋雨创作的有","score":2,"opts":["《道士塔》","《莫高窟》","《商州初录》","《一个王朝的背影》","《怀念萧珊》"],"ans":"ABD","ana":"《道士塔》《莫高窟》《一个王朝的背影》均为余秋雨散文；前两篇见《文化苦旅》，《一个王朝的背影》见《山居笔记》，不可笼统说三篇都收入《文化苦旅》。本地2504卷可佐证前两篇。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"w","n":26,"stem":"“乡土文学”","score":4,"ans":"（1）20世纪20年代新文学中一批作家以故乡农村生活为题材形成的创作倾向。（2）描绘地方风物、风俗和乡村人物，常寄寓离乡者的乡愁，并批判乡土社会的弊病。（3）代表作家有鲁彦、许钦文、台静农等。","ana":"定义应点明时代、乡村与地方风俗题材、乡愁及现实批判，代表作家可举鲁彦、许钦文、台静农。","anaAI":true},{"t":"w","n":27,"stem":"“现代罗曼司”小说","score":4,"ans":"[答案待核：附录将张恨水、刘呐鸥并列为代表的说法不可靠]","ana":"附录对该术语的流派归属与代表作家叙述缺乏可信依据，暂不生成可用于自动评分的定义；需依据指定教材或权威资料核对。","anaAI":true},{"t":"w","n":28,"stem":"“第三代诗人”","score":4,"ans":"（1）20世纪80年代中期活跃于诗坛、继朦胧诗之后探索新表达的诗人群体，又常称后朦胧诗人。（2）流派与风格不一，部分作品以口语化、日常生活书写和消解崇高为特色。（3）可举韩东、于坚等；其他诗人的分期和归属需结合教材。","ana":"不宜把众多诗人的不同主张合并为单一纲领；答题抓住80年代中期、新诗探索与韩东、于坚等例子。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简述台湾新文学奠基者赖和小说的思想内容。","score":8,"ans":"（1）揭露日本殖民统治与社会压迫，表现台湾人民所受的侮辱和苦难。（2）描写乡村与社会底层生活，关注普通人的生存处境。（3）刻画反抗意识与民族意识，在现实主义书写中表现对被压迫者的同情。","ana":"可结合《一杆“称仔”等具体作品分析警察与民众的冲突；附录要点较笼统，不宜把人物一概概括为成熟的“反抗者”。","anaAI":true},{"t":"w","n":30,"stem":"简析曹禺话剧的命运悲剧特点。","score":8,"ans":"（1）人物在家庭制度、社会秩序与个人欲望的冲突中走向悲剧。（2）戏剧常通过纠葛、秘密、偶然与情节推进，营造难以挣脱的命运感。（3）《雷雨》中周、鲁两家错综的关系和《原野》中复仇与罪感，可分别说明命运压迫的不同形态。（4）命运悲剧并非纯粹宿命论，也关乎社会和人性的矛盾。","ana":"结合《雷雨》《原野》的情节与人物分析，不应简单断言一切悲剧都由封建礼教造成。","anaAI":true},{"t":"w","n":31,"stem":"简析杨沫小说《青春之歌》的主题内涵。","score":8,"ans":"（1）以林道静由个人反抗走向革命道路的成长经历为主线，表现青年知识分子在民族危机与革命实践中的思想转变。（2）突出个人命运与民族、社会命运的联系，强调革命集体与理想对个人成长的作用。（3）借不同人物道路的对照，表现爱国、反压迫和投身革命的主题。","ana":"分析应围绕林道静的成长和道路选择，避免仅罗列爱国主义等抽象口号。","anaAI":true},{"t":"w","n":32,"stem":"简析莫言小说《红高粱》的艺术探索。","score":8,"ans":"（1）以“我”的后代视角追溯祖辈故事，时序交错，打破线性叙事。（2）红高粱意象与浓烈色彩、感官描写相结合，形成粗犷、奇诡的叙述风格。（3）传奇化的抗战与乡土人物书写凸显生命活力，融合现实、想象与民间叙事资源。","ana":"举“我爷爷”“我奶奶”及高粱地意象说明叙述视角、结构与语言特点；不宜只以“魔幻”一词概括全篇。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"联系作品分析茅盾小说《子夜》中吴荪甫的形象。","score":13,"ans":"（1）吴荪甫是有魄力和工业抱负的民族资本家，试图扩张实业并与买办金融势力竞争。（2）他精明、强干，同时专横、压榨工人，对革命运动怀有敌意，体现民族资产阶级的矛盾性。（3）在帝国主义资本、金融投机和社会危机的重压下事业失败，悲剧折射20世纪30年代民族工业与民族资产阶级的困境。","ana":"本地2110卷有近乎同题论述；答题可联系裕华丝厂、与赵伯韬的竞争及工人运动，论析事业进取与阶级局限的并存。","anaAI":true},{"t":"w","n":34,"stem":"结合具体作品分析艾青诗歌的艺术特色。","score":13,"ans":"（1）以“土地”“太阳”等意象凝聚民族苦难和对光明的追求，如《我爱这土地》《向太阳》。（2）将鲜明的感觉、色彩和画面与主观情感交融，如《雪落在中国的土地上》反复吟咏中国的痛苦。（3）多用自由体、散文化语句，并以排比、反复形成节奏和抒情力量，如《大堰河——我的保姆》。","ana":"本地2110卷有同一论述知识点；论述应落实到诗句、意象、视觉效果与自由体节奏，不应以“有格律”误释其音乐性。","anaAI":true}]}],"code":"00537","qaNotes":["第6题：卷后“答案：C”及“郭沫若是中国共产党首批党员”的叙述有明显史实错误；据沈雁冰（茅盾）早期党员身份暂校为B，请人工再核权威答案。","第27题：附录把“现代罗曼司”归于张恨水、刘呐鸥的说法存疑；没有可靠的同题本地资料，ans留待核标记，禁止自动计分。候选方向：徐訏、无名氏的现代传奇/浪漫小说写作；须核指定教材定义与代表作品。","第25题：附录误称《一个王朝的背影》也在《文化苦旅》；其收于《山居笔记》，仅取作者归属ABD。","第24题：附录关于C、D所属另一剧作的归属未获本地核验，解析仅说明不属于《茶馆》。","相近/同知识点本地交叉核：第2题xws-2404#1、第12题xws-2210#12、第16题xws-2310#16、第17题xws-2110#28、第25题xws-2504#19、第33题xws-2110#33、第34题xws-2110#34；其中第2、16题选项位置不同，须以本卷排序判字母。","第6题已对照完整题干选项及本地《中国现代文学史》蒋丽媛2604笔记的茅盾条目；将ans由暂定B明确核定为B，解析改为教材可验证的依据；不改其它题。"]}];

⟫。召公告曰：‘民不堪命矣！’王怒，得卫巫，使监谤者。以告，则杀之。⟪国人莫敢言，道路以目⟫。王喜，告召公曰：‘吾能弭谤矣，乃不敢言。’召公曰：‘是障之也。⟪防民之口，甚于防川⟫。川壅而溃，伤人必多，民亦如之。⟪是故为川者决之使导⟫，为民者宣之使言。……民之有口，犹土之有山川也，财用于是乎出；犹其有原、隰、衍、沃也，衣食于是乎生。口之宣言也，善败于是乎兴。⟪行善而备败，其所以阜财用衣食者也⟫。夫民虑之于心而宣之于口，成而行之，胡可壅也？⟪若壅其口，其与能几何⟫？’","⟪厲王虐，國人謗王⟫":"⟪厉王虐，国人谤王⟫","⟪國人莫敢言，道路以目⟫":"⟪国人莫敢言，道路以目⟫","⟪防民之口，甚於防川⟫":"⟪防民之口，甚于防川⟫","⟪是故為川者決之使導⟫":"⟪是故为川者决之使导⟫","⟪行善而備敗，其所以阜財用衣食者也⟫":"⟪行善而备败，其所以阜财用衣食者也⟫","⟪若壅其口，其與能幾何⟫":"⟪若壅其口，其与能几何⟫","齊桓公將立管仲令群臣曰寡人將立管仲爲仲父善者入門而左不善者入門而右東郭牙中門而立公曰寡人立管仲爲仲父令曰善者左不善者右今子何爲中門而立牙曰以管仲之智爲能謀天下乎公曰能以斷爲敢行大事乎公曰敢牙曰君知能謀天下斷敢行大事君因專屬之國柄焉以管仲之能乘公之勢以治齊國得無危乎公曰善乃令隰朋治内管仲治外以相參":"齐桓公将立管仲令群臣曰寡人将立管仲为仲父善者入门而左不善者入门而右东郭牙中门而立公曰寡人立管仲为仲父令曰善者左不善者右今子何为中门而立牙曰以管仲之智为能谋天下乎公曰能以断为敢行大事乎公曰敢牙曰君知能谋天下断敢行大事君因专属之国柄焉以管仲之能乘公之势以治齐国得无危乎公曰善乃令隰朋治内管仲治外以相参","景公有所愛槐，令吏謹守之，植木縣之，下令曰：‘犯槐者刑，傷之者死。’有不聞令，醉而犯之者，公聞之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辭晏子之家，令內之。女子入門，晏子望見之，曰：‘怪哉！有深憂。’進而問焉，曰：‘所憂何也？’對曰：‘妾聞之，明君蒞國立政，不損祿，不⟪益⟫刑，又不以私⟪恚⟫害公法，不為禽獸傷人民，不為草木傷禽獸，不為野草傷禾苗。吾君欲以樹木之故殺妾父，孤妾身，此令行於民而法於國矣。雖然，妾聞之，勇士不以眾強⟪凌⟫孤獨，明惠之君不拂是以行其所欲。今之令不然，以樹木之故，罪法妾父，恐其傷察吏之法，而害明君之義也。鄰國聞之，皆謂吾君愛樹而賤人，其可乎？’晏子曰：‘甚矣！吾將為子言之於君。’使人送之⟪歸⟫。明日，早朝，而復於公曰：‘嬰聞之，窮民財力以供嗜欲謂之暴；崇玩好，威嚴擬乎君謂之逆；刑殺不辜謂之賊。此三者，守國之大殃。’公曰：‘微大夫教寡人，幾有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罷守槐之役，拔置縣之木，廢傷槐之法，出犯槐之囚。":"景公有所爱槐，令吏谨守之，植木县之，下令曰：‘犯槐者刑，伤之者死。’有不闻令，醉而犯之者，公闻之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辞晏子之家，令内之。女子入门，晏子望见之，曰：‘怪哉！有深忧。’进而问焉，曰：‘所忧何也？’对曰：‘妾闻之，明君莅国立政，不损禄，不⟪益⟫刑，又不以私⟪恚⟫害公法，不为禽兽伤人民，不为草木伤禽兽，不为野草伤禾苗。吾君欲以树木之故杀妾父，孤妾身，此令行于民而法于国矣。虽然，妾闻之，勇士不以众强⟪凌⟫孤独，明惠之君不拂是以行其所欲。今之令不然，以树木之故，罪法妾父，恐其伤察吏之法，而害明君之义也。邻国闻之，皆谓吾君爱树而贱人，其可乎？’晏子曰：‘甚矣！吾将为子言之于君。’使人送之⟪归⟫。明日，早朝，而复于公曰：‘婴闻之，穷民财力以供嗜欲谓之暴；崇玩好，威严拟乎君谓之逆；刑杀不辜谓之贼。此三者，守国之大殃。’公曰：‘微大夫教寡人，几有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罢守槐之役，拔置县之木，废伤槐之法，出犯槐之囚。","縣：":"县：","（一）解释文中加着重号词语的意义。（6分）":"（一）解释文中加着重号词语的意义。（6分）","犯：":"犯：","益：":"益：","恚：":"恚：","凌：":"凌：","歸：":"归：","吾君欲以樹木之故殺妾父，⟪孤⟫妾身。":"吾君欲以树木之故杀妾父，⟪孤⟫妾身。","（二）说明下列句中下划线词的用法及意义。（4分）":"（二）说明下列句中下划线词的用法及意义。（4分）","鄰國聞之，皆謂吾君⟪愛⟫樹而⟪賤⟫人。":"邻国闻之，皆谓吾君⟪爱⟫树而⟪贱⟫人。","明惠之君不拂是以行其所欲。":"明惠之君不拂是以行其所欲。","（三）将下列句子译成现代汉语。（6分）":"（三）将下列句子译成现代汉语。（6分）","窮民財力以供嗜欲謂之暴。":"穷民财力以供嗜欲谓之暴。","微大夫教寡人，幾有大罪以累社稷。":"微大夫教 2）夫民心之慍也，若⟪防⟫大川焉，潰而所犯必大矣。\n（3）入而徐趨，至而自⟪謝⟫。\n（4）郢人堊⟪慢⟫其鼻端，若蠅翼，使匠石斵之。":"指出下列句中加着重号的词哪些用的是本字，哪些用的是通假字，并说明如何区分本字和通假字。\n（1）孔子⟪时⟫其亡也，而往拜之，遇诸涂。\n（2）夫民心之愠也，若⟪防⟫大川焉，溃而所犯必大矣。\n（3）入而徐趋，至而自⟪谢⟫。\n（4）郢人垩⟪慢⟫其鼻端，若蝇翼，使匠石斵之。","解释下列句中加着重号词的意义，并据以分析异词同字现象产生的原因。\n（1）\nA.昔者仲尼與於蜡賓，事畢，出遊於⟪觀⟫之上。\nB.吾⟪觀⟫晉公子之從者，皆足以相國。\n（2）\nA.令甲卒皆伏，使老弱⟪女子⟫乘城。\nB.曾子怒曰：‘商！⟪女⟫何無罪也？’":"解释下列句中加着重号词的意义，并据以分析异词同字现象产生的原因。\n（1）\nA.昔者仲尼与于蜡宾，事毕，出游于⟪观⟫之上。\nB.吾⟪观⟫晋公子之从者，皆足以相国。\n（2）\nA.令甲卒皆伏，使老弱⟪女子⟫乘城。\nB.曾子怒曰：‘商！⟪女⟫何无罪也？’","指出下列句子中的前置宾语，并归纳古汉语宾语前置的主要格式。\n（1）帝王不相復，何禮之循？\n（2）視人國若其國，誰攻？\n（3）翟黃對曰：‘奚為不可？’\n（4）昭王南征而不復，寡人是問。\n（5）我未之見也。":"指出下列句子中的前置宾语，并归纳古汉语宾语前置的主要格式。\n（1）帝王不相复，何礼之循？\n（2）视人国若其国，谁攻？\n（3）翟黄对曰：‘奚为不可？’\n（4）昭王南征而不复，寡人是问。\n（5）我未之见也。","晉侯賞從亡者。介之推不言祿，祿亦弗及。推曰：‘獻公之子九人，唯君在矣。惠、懷無親，外內棄之。天未絕晉，必將有主。主晉祀者，非君而誰？天實置之，而二三子以為己力，⟪不亦誣乎⟫！竊人之財猶謂之盜，況貪天之功以為己力乎？⟪下義其罪，上賞其姦⟫，上下相蒙，難與處矣。’其母曰：‘盍亦求之？以死，誰懟？’對曰：‘⟪尤而效之，罪又甚焉⟫。且出怨言，不食其食。’其母曰：‘亦使知之，若何？’對曰：‘言，身之文也。⟪身將隱，焉用文之⟫？是求顯也。’其母曰：‘能如是乎！與女偕隱。’遂隱而死。晉侯求之，不獲。⟪以綿上為之田⟫，曰：‘⟪以志吾過⟫，且旌善人。’":"晋侯赏从亡者。介之推不言禄，禄亦弗及。推曰：‘献公之子九人，唯君在矣。惠、怀无亲，外内弃之。天未绝晋，必将有主。主晋祀者，非君而谁？天实置之，而二三子以为己力，⟪不亦诬乎⟫！窃人之财犹谓之盗，况贪天之功以为己力乎？⟪下义其罪，上赏其奸⟫，上下相蒙，难与处矣。’其母曰：‘盍亦求之？以死，谁怼？’对曰：‘⟪尤而效之，罪又甚焉⟫。且出怨言，不食其食。’其母曰：‘亦使知之，若何？’对曰：‘言，身之文也。⟪身将隐，焉用文之⟫？是求显也。’其母曰：‘能如是乎！与女偕隐。’遂隐而死。晋侯求之，不获。⟪以绵上为之田⟫，曰：‘⟪以志吾过⟫，且旌善人。’","⟪不亦誣乎⟫":"⟪不亦诬乎⟫","⟪下義其罪，上賞其姦⟫":"⟪下义其罪，上赏其奸⟫","⟪尤而效之，罪又甚焉⟫":"⟪尤而效之，罪又甚焉⟫","⟪身將隱，焉用文之⟫":"⟪身将隐，焉用文之⟫","⟪以綿上為之田⟫":"⟪以绵上为之田⟫","⟪以志吾過⟫":"⟪以志吾过⟫","唐且謂信陵君曰臣聞之曰事有不可知者有不可不知者有不可忘者有不可不忘者信陵君曰何謂也對曰人之憎我也不可不知也吾憎人也不可得而知也人之有德於我也不可忘也吾有德於人也不可不忘也今君殺晉鄙救邯鄲破秦人存趙國此大德也今趙王自郊迎卒然見趙王臣願君之忘之也信陵君曰無忌謹受教":"唐且谓信陵君曰臣闻之曰事有不可知者有不可不知者有不可忘者有不可不忘者信陵君曰何谓也对曰人之憎我也不可不知也吾憎人也不可得而知也人之有德于我也不可忘也吾有德于人也不可不忘也今君杀晋鄙救邯郸破秦人存赵国此大德也今赵王自郊迎卒然见赵王臣愿君之忘之也信陵君曰无忌谨受教","昔者齊景公問於晏子曰：‘吾欲觀於轉附、朝儛，⟪遵⟫海而南，放於琅邪。吾何修而可以比於先王觀也？’晏子對曰：‘善哉，問也！天子⟪適⟫諸侯曰巡狩，巡狩者，巡所守也；諸侯朝於天子曰述職，述職者，述所職也。無非事者。春省耕而補不足，秋省斂而助不給。夏諺曰：“吾王不遊，吾何以休？吾王不豫，吾何以助？一遊一豫，為諸侯度。”今也不然：師行而⟪糧食⟫，飢者弗食，勞者弗⟪息⟫。睊睊胥讒，民乃作慝。方命虐民，飲食若流。流連荒亡，為諸侯憂。從流下而忘反謂之流，從流上而忘反謂之連，從獸無⟪厭⟫謂之荒，樂酒無厭謂之亡。先王無流連之樂、荒亡之行。惟君所行也。’景公⟪說⟫，大戒於國，出⟪舍⟫於郊。於是始興發，補不足。召大師曰：‘為我作君臣相說之樂！’":"昔者齐景公问于晏子曰：‘吾欲观于转附、朝儛，⟪遵⟫海而南，放于琅邪。吾何修而可以 我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，⟪鮑叔不以我爲不肖⟫，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，⟪召忽死之⟫，吾幽囚受辱，鮑叔不以我爲無恥，⟪知我不羞小節⟫而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。⟪子孫世祿於齊⟫，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而⟪多鮑叔能知人也⟫。":"管仲曰：‘吾始困时，⟪尝与鲍叔贾⟫，分财利多自与，鲍叔不以我为贪，知我贫也；吾尝为鲍叔谋事而更穷困，鲍叔不以我为愚，知时有利不利也；吾尝三仕三见逐于君，⟪鲍叔不以我为不肖⟫，知我不遭时也；吾尝三战三走，鲍叔不以我为怯，知我有老母也；公子纠败，⟪召忽死之⟫，吾幽囚受辱，鲍叔不以我为无耻，⟪知我不羞小节⟫而耻功名不显于天下也。生我者父母，知我者鲍子也。’鲍叔既进管仲，以身下之。⟪子孙世禄于齐⟫，有封邑者十余世，常为名大夫。天下不多管仲之贤而⟪多鲍叔能知人也⟫。","⟪嘗與鮑叔賈⟫":"⟪尝与鲍叔贾⟫","⟪鮑叔不以我爲不肖⟫":"⟪鲍叔不以我为不肖⟫","⟪召忽死之⟫":"⟪召忽死之⟫","⟪知我不羞小節⟫":"⟪知我不羞小节⟫","⟪子孫世祿於齊⟫":"⟪子孙世禄于齐⟫","⟪多鮑叔能知人也⟫":"⟪多鲍叔能知人也⟫","蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣":"苏代为燕说齐未见齐王先说淳于髡曰人有卖骏马者比三旦立市人莫之知往见伯乐曰臣有骏马欲卖之比三旦立于市人莫与言愿子还而视之去而顾之臣请献一朝之贾伯乐乃还而视之去而顾之一旦而马价十倍今臣欲以骏马见于王莫为臣先后者足下有意为臣伯乐乎臣请献白璧一双黄金万镒以为马食淳于髡曰谨闻命矣","梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭⟪對⟫曰：‘吾小人也，貪。⟪饋⟫之始至，懼其不足，故歎。中食而自⟪咎⟫也。曰：“豈主之食而有不足？”是以⟪再⟫歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。":"梗阳人有⟪狱⟫，将不胜，⟪请纳赂于魏献子⟫，献子将许之。⟪阎没⟫谓叔宽曰：‘与子谏乎！吾主以不⟪贿⟫闻于诸侯，今以梗阳之贿殃之，不可。’二人朝而不退。献子将食，问谁于庭，曰：‘阎明、叔褒在。’召之，使佐食。比己食，三叹。⟪既饱⟫，献子问焉，曰：‘人有言曰：“唯食可以忘忧。”吾子一食之间而三叹，何也？’同辞⟪对⟫曰：‘吾小人也，贪。⟪馈⟫之始至，惧其不足，故叹。中食而自⟪咎⟫也。曰：“岂主之食而有不足？”是以⟪再⟫叹。主之既食，愿以小人之腹，为君子之心，适⟪厌⟫而已，是以三叹。’献子曰：‘善。’乃辞梗阳人。","獄：":"狱：","對：":"对：","饋：":"馈：","咎：":"咎：","再：":"再：","厭：":"厌：","吾主以不⟪賄⟫聞於諸侯。賄：":"吾主以不⟪贿⟫闻于诸侯。贿：","（二）解释下列句子中加着重号的词的词性和词义。（4分）":"（二）解释下列句子中加着重号的词的词性和词义。（4分）","⟪既⟫飽，獻子問焉。既：":"⟪既⟫饱，献子问焉。既：","⟪請納賂於魏獻子⟫。":"⟪请纳赂于魏献子⟫。","（三）将下列文中画线的句子译成现代汉语。（4分）":"（三）将下列文中画线的句子译成现代汉语。（4分）","⟪人有言曰：‘唯食可以忘憂。’吾子一食之間而三歎，何也？⟫":"⟪人有言曰：‘唯食可以忘忧。’吾子一食之间而三叹，何也？⟫","用现代汉语说明阎没与叔宽是如何劝谏魏献子的？":"用现代汉语说明阎没与叔宽是如何劝谏魏献子的？","（四）回答下列问题。（6分）":"（四）回答下列问题。（6分）","说明文中“以小人之腹，爲君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。":"说明文中“以小人之腹，为君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。","下列各组字，全部是会意字的一组是":"下列各组字，全部是会意字的一组是","弃武河":"弃武河","解險柴":"解险柴","息  明":"息  明","绵暖迹":"绵暖迹","哀，内形外聲。":"哀，内形外声。","幕，上形下聲。":"幕，上形下声。","鴨，左形右聲。":"鸭，左
