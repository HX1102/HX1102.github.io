工不断深化、生产社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出一国和地区的范围而相互联系、相互依赖的过程。(2)经济全球化本质上是资源配置的国际化，其内容包括很多方面，大体可从生产全球化、贸易全球化和资本全球化三方面来考察。①生产的全球化。这是随着科学技术的发展，一系列高精尖产品和工艺技术的出现，生产领域的国际分工和协作的加强，各国在生产上密切配合的趋势。②贸易的全球化。国际贸易活动虽然已有很长的历史，但它的全球化则是近几十年来在工业和科技革命推动下出现的，尤其是近二三十年发展得更快，绝大多数年份国际贸易的增长率都大大高于各国的经济增长率。③资本全球化。在垄断资本主义阶段，资本输出意味着资本国际化开始出现。近二三十年来，在新科技革命的推动下，资本在国际的流动以前所未有的速度增加，形成了资本全球化趋势。"},{"t":"w","n":27,"stem":"资本主义再生产周期包括哪几个阶段？资本主义的经济危机的根本特点、实质和根源是什么？","score":6,"ans":"(1)资本主义再生产周期一般来说包括危机、萧条、复苏、高涨四个阶段。(2)经济危机期间最根本的特点：商品生产过剩。(3)资本主义经济危机的实质是生产相对过剩的危机。(4)经济危机产生的根源在于资本主义生产方式的基本矛盾，即生产的社会化与生产资料私人资本主义占有形式之间的矛盾。"},{"t":"w","n":28,"stem":"如何正确认识真理与价值的关系？","score":6,"ans":"(1)真理与价值相互对立、相互区别：真理体现的是认识与认识对象的关系，是认识与对象相一致、相符合；而价值是指客体对大需要的满足，表示客体具有对人有用或对主体有意义的属性。(2)真理与价值又是不可分的，又有统一的一面，表现在：第一，真理能够指导社会实践，成功改造世界，以实践的成果满足人们的需要，这就是真理所表现出来的价值属性。第二，真理与正确的价值观相一致，正确的价值观是在真理指导下形成的。"},{"t":"w","n":29,"stem":"简述空想社会主义相对于科学社会主义的局限性。","score":6,"ans":"空想社会主义是早期无产阶级意识和利益的先声，反映了早期无产阶级迫切要求改造现存社会、建立理想的新社会的愿望。空想社会主义者论证了资本主义灭亡的必然性，但因为他们的唯心史观，没有正确认识社会历史发展的必然规律，不能揭示出资本主义必然灭亡的经济根源和客观必然性。他们要求埋葬资本主义，却找不到埋葬资本主义的力量。他们憧憬社会主义的理想社会，却找不到通往理想社会的现实道路，这是空想社会主义的历史局限性。"},{"t":"w","n":30,"stem":"资本主义国家如何在私人企业外部进行管理和调控经济活动？","score":6,"ans":"(1)通过法律手段来规范私人企业的市场行为，使其运行符合国家垄断资本的要求。(2)可以用经济手段来间接地调节私人企业的经济活动，诱导私人企业向国家希望的方向发展。如通过财政政策，以增税、减税或是补贴的方式，可以引导私人企业增加生产或是减少生产。(3)也可以通过货币金融政策，如放松还是收紧银根，实行差别利率等方式，引导企业的行为和发展方向。(4)还可以通过国家向私人企业加工订货来维持企业的生产和发展。(5)通过实行国民经济计划化，引导私人企业的发展等等。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"w","n":31,"stem":"资本主义生产关系的形成在经济上需要具备的基本条件是什么？","score":10,"ans":"资本主义生产关系的形成在经济上需要具备的基本条件是：一是大量有人身自由但失去生产资料的劳动者；二是少数人手中积累起为组织资本主义生产所需要的大量货币财富。"},{"t":"w","n":32,"stem":"说明人与社会是具体的、历史的统一。","score":10,"ans":"人与社会是具体的、历史的统一，主要表现在以下几个方面。第一，人的出现与社会的产生是一致的。第二，人的活动与社会结构及其发展变化是一致的。第三，社会的本质和人的本质是一致的，这种一致的基础是实践。第四，个人的解放与社会的解放是一致的。"},{"t":"w","n":33,"stem":"简述运动的含义及物质与运动的关系。","score":10,"ans":"(1)运动的含义：运动是物质的根本属性和存在方式，运动囊括宇宙中发生的一切变化和过程。(2)物质和运动的关系：运动是物质的固有属性，物质和运动不可分。物质世界的运动是无条件的、永恒的、绝对的。否认物质的运动和运动的绝对性，必然导致形而上学。另一方面，世界上也不存在没有物质的运动。物质是运动的承担者，是运动的主体，一切运动都是物质的运动。否认物质是运动的承担者或主体，必然导致唯心主义。"}]}],"qaNotes":[]},{"paper":"marx-2304","subject":"marx","session":"2304","label":"2023年4月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思是时代的产物。细胞学说、能量守恒与转化、进化论三个成果的发现。为马克思主义的产生提供了（）。","score":2,"ans":"C","opts":["直接来源","阶级利益","自然科学基础","主观条件"]},{"t":"s","n":2,"stem":"在一元论上，唯物主义与唯心主义的共同点是是承认世界的（）。","score":2,"ans":"C","opts":["同一性","可知性","统一性","物质性"]},{"t":"s","n":3,"stem":"哲学是世界观的理论体系，世界观是人们（）。","score":2,"ans":"D","opts":["对自然界的根本看法和根本观点","对人类社会的根本看法和根本观点","对精神世界的根本看法和根本观点","对整个世界的根本看法和观点"]},{"t":"s","n":4,"stem":"把世界的本质或本原归结为某一种或某几种具体的物质形态，这种观点属于（）。","score":2,"ans":"A","opts":["古代朴素唯物主义","庸俗唯物主义","形而上学唯物主义","辩证唯物主义"]},{"t":"s","n":5,"stem":"“矛盾无处不在，矛盾无时不有。”这句话说的是（）。","score":2,"ans":"B","opts":["矛盾具有特殊性","矛盾具有普遍性","矛盾具有同一性","矛盾具有斗争性"]},{"t":"s","n":6,"stem":"规律具有客观性和普遍性的特点。规律的普遍性是指（）。","score":2,"ans":"B","opts":["规律可以被认识和利用","规律在较大的范围和领域起作用","规律不以人的意志为转移","规律只在自然界各个领域起作用"]},{"t":"s","n":7,"stem":"认识是主体对客体的能动反映，这是一种（）。","score":2,"ans":"B","opts":["机械唯物主义认识论观点","辩证唯物主义认识论观点","主观唯心主义认识论观点","客观唯心主义认识论观点"]},{"t":"s","n":8,"stem":"感性认识与理性认识的区别在于（）。","score":2,"ans":"D","opts":["前者是主观的，后者是客观的","前者源于实践，后者源于内省","前者是抽象的思维，后者是生动的直观","前者反映事物现象，后者揭示事物本质"]},{"t":"s","n":9,"stem":"在检验认识真理性的问题上，下列各项正确说明实践标准与逻辑证明关系的是（）。","score":2,"ans":"C","opts":["实践标准具有绝对性，无需逻辑证明补充","实践标准具有相对性，必须逻辑证明补充","被逻辑证明了的认识，最终还要靠实践来检验","逻辑证明可以取代实践成为检验真理的标准"]},{"t":"s","n":10,"stem":"地理环境在社会发展中的作用表现为（）。","score":2,"ans":"B","opts":["它决定社会制度的性质","它影响和制约社会的发展","它决定社会形态的更替","它决定社会生产力的水平"]},{"t":"s","n":11,"stem":"在经济基础和上层建筑这对矛盾当中（）。","score":2,"ans":"A","opts":["经济基础是矛盾的主要方面","经济基础应上层建筑的需要产生","上层建筑是矛盾的主要方面","上层建筑是经济基础的物质根源"]},{"t":"s","n":12,"stem":"人的本质在于（）。","score":2,"ans":"D","opts":["人的道德素质","人的法治素养","人的自然属性","人的社会属性"]},{"t":"s","n":13,"stem":"“不能把历史顺境中的成功简单归功于个人，也不能把历史逆境中的挫折简单归咎于个人。”这句话强调的是（）。","score":2,"ans":"C","opts":["历史人物的作用是纯粹的历史偶然","历史人物的作用是纯粹的历史必然","评价历史人物应坚持历史主义原则","评价历史人物应坚持精神分析的方法"]},{"t":"s","n":14,"stem":"商品经济产生和存在的决定性条件是（）。","score":2,"ans":"D","opts":["商品生产","商品交换","社会分工","生产资料和劳动产品属于不同的所有者"]},{"t":"s","n":15,"stem":"决定商品价值量的是（）。","score":2,"ans":"D","opts":["物化劳动时间","活劳动时间","个别劳动时间","社会必要劳动时间"]},{"t":"s","n":16,"stem":"个别企业由于其劳动生产率更高从而使商品个别价值低于社会价值所获得的剩余价值是（）。","score":2,"ans":"C","opts":["绝对剩余价值","相对剩余价值","超额剩余价值","平均剩余价值"]},{"t":"s","n":17,"stem":"单个产业资本在其循环过程中依次采取的职能形式是（）。","score":2,"ans":"A","opts":["货币资本、生产资本、商品资本","产业资本、商业资本、生息资本","固定资本、流动资本、流通资本","自由资本、借贷资本、股份资本"]},{"t":"s","n":18,"stem":"生产资料和劳动力构成上的比例是（）。","score":2,"ans":"A","opts":["资本的技术构成","资本的价值构成","资本的有机构成","资本的数量构成"]},{"t":"s","n":19,"stem":"垄断资本主义形成的时候，帝国主义列强已经将世界领土瓜分完毕，这个时期是（）。","score":2,"ans":"C","opts":["18世纪末期","19世纪中期","19世纪20年代初","20世纪末期"]},{"t":"s","n":20,"stem":"资本主义对经济进行调控的手段是（）。","score":2,"ans":"A","opts":["经济手段和法律手段","法律手段和计划手段","计划手段和行政手段","行政手段和经济手段"]},{"t":"s","n":21,"stem":"在资本主义宏观调控的经济手段中，能够直接调控流通中的货币量的手段不包括（）。","score":2,"ans":"B","opts":["最低准备金率","存贷款利率","公开市场业务","再贴现利率"]},{"t":"s","n":22,"stem":"上世纪后半叶到本世纪初，资本国际化的进程加快，其主要表现是（）。","score":2,"ans":"D","opts":["商业资本国际化的产生和发展","货币资本国际化的产生和大发展","借贷资本国际化的产生和发展","产业资本国际化的产生和发展"]},{"t":"s","n":23,"stem":"世界上第一个社会主义国家是（）。","score":2,"ans":"B","opts":["波兰人民共和国","苏维埃俄国","法国巴黎公社","中华人民共和国"]},{"t":"s","n":24,"stem":"马克思主义政党的最高纲领和最终奋斗目标是（）。","score":2,"ans":"D","opts":["推翻资本主义","建设社会主义","实现公平正义","实现共产主义"]},{"t":"s","n":25,"stem":"根据马克思主义的观点，把劳动视为生活的第一需要，并能充分施展和全面发挥人的一切才能的社会是（）。","score":2,"ans":"C","opts":["资本主义社会","社会主义社会","共产主义社会","信息智能社会"]}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"short","n":26,"stem":"马克思主义科学体系的主要组成部分以及马克思主义的理论品质。","score":6,"ans":"（1）马克思主义理论体系的三个主要组成部分：马克思主义哲学，马克思主义政治经济学、科学社会主义。 （2）与时俱进是马克思主义的理论品质。与时俱进就是党的全部理论和工作要体现时代性，把握规律性，富于创造性。"},{"t":"short","n":27,"stem":"什么是思想路线？简述党的思想路线主要内容。","score":6,"ans":"（1）所谓思想路线，是指一个阶级及其政党作为指导思想并用以支配行动的认识路线。 （2）党的思想路线是：一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。“实事求是”这四个大字是党的思想路线的核心，也是马克思主义哲学的精髓和活的灵魂，它充分地体现了马克思主义认识论的根本原则。"},{"t":"short","n":28,"stem":"历史唯心主义的两个主要缺点。","score":6,"ans":"（1）历史唯心主义至多只是考察了人们的历史活动的思想动机，而没有研究产生这些动机的原因，没有把物质生产的发展程度看作这些关系的根源。 （2）历史唯心主义忽视居民群众的活动，否认人民群众是推动历史发展的决定力量。"},{"t":"short","n":29,"stem":"社会总产品的实现。","score":6,"ans":"社会总产品的实现，也就是社会总产品的补偿，它有两个方面。一方面是社会总产品的价值补偿，另一方面是社会总产品的物质补偿。只有使社会总产品既从价值上得到补偿，又从物质上得到补偿，才能保证整个社会总资本再生产得以正常顺利进行。"},{"t":"short","n":30,"stem":"当代资本主义在生产力和生产关系方面新变化的原因。","score":6,"ans":"（1）生产力方面。当代资本主义经济之所以能在一定程度上快速发展，有生产力自身发展规律，特别是科学技术自身发展规律作用的原因。 （2）生产关系方面。在所有制关系上，资本主义国家在其自身范围内进行不断的调整，以适应生产力发展的要求。无论是资本社会化还是股权分散化都是在资本主义私有制基础上的一种局部调整，以适应资本主义自身创造出的巨大的社会化生产力的要求。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"essay","n":31,"stem":"唯物辩证法的否定观包括哪些主要内容？试以对待中国传统文化和外国文化的态度为例说明如何坚持辩证的否定观。","score":10,"ans":"（1）唯物辩证法的否定观的主要内容： ①辩证的否定是事物的自我否定，即通过事物内部矛盾而进行的对自身的否定。 ②辩证的否定具有两个重要特点：其一，否定是事物发展的环节。否定是事物联系的环节。 ③辩证的否定是扬弃。坚持辩证的否定观，就要对一切事物采取分析的态度，否定什么和肯定什么，批判什么和继承什么，都要从实际出发，进行具体分析，反对不加分析地肯定一切或否定一切。对于中国传统文化，要采取批判地继承的态度。 （2）如何坚持辩证的否定观： ①中华民族有悠久的历史，创造了灿烂的文化，我们必须继承这份宝贵的文化遗产，只有在这个基础上，才能创造出中国特色的社会主义新文化。   ②当然这种继承只能是有批判的继承，批判和剔除其糟粕，吸取其精华，做到“推陈出新”古为今用”。既要反对全盘肯定传统文化的复古主义，又要反对全盘否定传统文化的历史虚无主义。 ③对于外国文化要采取有分析，有选择，有批判的借鉴和吸收的态度。与此同时，又要批判和抵制外国资产阶级腐朽的没落的东西。"},{"t":"essay","n":32,"stem":"为什么说经济全球化是一个充满矛盾的过程，是一把“双刃剑”。","score":10,"ans":"发达资本主义国家是经济全球化的实际主导者和主要受益者。经济全球化对广大发展中国家也有一定积极影响：它们可以在经济全球化的进程中引进国外的先进技术、资金和管理经验，调整与优化国民经济结构，增强自身的经济实力，缩短与发达国家的差距，增加国内的就业，促进国内的消费，加强同世界各国的联系与交流。 但经济全球化是一个充满矛盾的进程，是一把“双刃剑”，既有积极的一面，也有消极的影响，这方面的表现是： 其一，发达国家与发展中国家的差距在扩大。虽然发达国家与发展中国家都在经济全球化过程中有所受益，但由于经济全球化的规则是发达国家主导制定、进程是发达国家主导的，发展中国家受益少，甚至有被边缘化的风险。一些发展中国家发展资金匮乏、债务负担沉重、贸易条件恶化、金融风险增加、技术水平落后，处于十分不利的境地。发达国家在经济全球化的进程中，也出现了产业空心化、实体经济萎缩、失业增加、金融风险加大、过分依赖国外资源等诸多问题。 其二，在经济增长中忽视社会进步，环境恶化与经济全球化有可能同时发生。 其三，各国特别是相对落后国家原有的体制、政府领导能力、社会设施、政策体系、价值观念和文化等都面临着全球化的冲击，国家内部和国际社会都出现不同程度的治理危机。 其四，经济全球化使各国之间的经济联系越来越紧密，相互依赖越来越强，而有效的全球性协调机制却没有建立起来，这就使得爆发全球性经济危机的风险不断增大。"},{"t":"essay","n":33,"stem":"怎样理解共产主义是崇高理想与科学理想的统一?为什么说共产主义既是一种理想的社会制度，又是一种社会运动？ 2023年 04月高等教育自学考试全国统一命题考试","score":10,"ans":"（1）马克思和恩格斯在他们所创立的辩证唯物主义和历史唯物主义世界观的基础上，深刻分析了资本主义社会的基本矛盾的运动趋势，总结了国际工人运动的历史经验，批判地吸取了英法两国的空想共产主义和英国古典政治经济学的合理因素，从而深刻地揭示出人类社会发展的规律性，科学地预见了共产主义社会这一理想社会的基本特征，向全世界劳动群众展示了人类社会终将进入共产主义的美好社会前景。同时他们明确指出，无产阶级的历史使命就是彻底解放全人类，为在全世界实现共产主义伟大事业而奋斗。这是根据人类社会发展规律和无产阶级的地位所得出的科学结论。这一科学结论终于使人类对美好社会理想的追求由空想变为科学。总之，共产主义之所以是人类最伟大的事业，就在于它是崇高理想与科学理想的统一，体现了人类对理想社会目标的追求与符合规律的科学社会实践的有机结合。 （2）马克思主义认为，共产主义既是一种理想的社会制度，又是一种社会运动。共产主义作为社会制度，在我国乃至全人类的实现，还要经过长期的奋斗。但是，共产主义作为一种社会运动，自从马克思和恩格斯在一百多年前创立了科学共产主义学说以来，就已经在不断实践之中。共产主义运动的最终目的就是实现共产主义社会制度。世界各国无产阶级争取自身解放的斗争，社会主义国家人民进行的社会主义建设，我国人民所开创的中国特色社会主义事业，都是伟大共产主义事业具体实践的重要组成部分。\n\n\n\t•\t\n\t•"}]}],"qaNotes":[]},{"paper":"marx-2310","subject":"marx","session":"2310","label":"2023年10月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义作为时代的产物、实践经验的总结、科学成果的升华，其理论体系是","score":2,"opts":["开放发展的","抽象思辨的","穷尽真理的","完美无缺的"],"ans":"A","ana":"马克思主义既然是时代的产物、实践经验的总结、科学成果的升华，就必然会随着时代的变化、实践的扩展、科学的进步而不断丰富和发展其自身。马克思主义之所以是发展着的理论，是由它的理论本性决定的。"},{"t":"s","n":2,"stem":"马克思主义的革命性集中表现为它具有彻底的批判精神，还表现为它具有","score":2,"opts":["完整的理论体系","严密的逻辑结构","鲜明的政治立场","崇高的社会理想"],"ans":"C","ana":"马克思主义的革命性，还表现在它具有鲜明的政治立场上。马克思主义是工人阶级的意识形态，它以科学的理论形式反映了工人阶级和广大人民群众的利益、愿望和要求。"},{"t":"s","n":3,"stem":"唯物主义一元论与唯心主义一元论的区别在于是否承认","score":2,"opts":["世界万物的本原只有一个","世界万物的本原是物质","检验真理的标准只有一个","检验真理的标准是实践"],"ans":"B","ana":"一元论有两种：唯心主义一元论和唯物主义一元论。虽然它们都承认世界的统一性，但在世界统一的基础是什么，即世界上的万事万物共同的本质或本原是什么的问题上，又有不同的回答。唯心主义一元论认为世界的本原是精神，唯物主义一元论认为世界的本原是物质，世界统一于物质。"},{"t":"s","n":4,"stem":"时间的一维性指的是时间的","score":2,"opts":["绝对性","无限性","持续性","不可逆性"],"ans":"D","ana":"时间的特点是一维性，即时间总是朝着一个方向向前发展。既不是循环，更不是倒退，也就是具有不可逆性。人们通常说的\"光阴好比河中水，只能流去不流回失落黄金有分量，错过光阴无处寻盛年不重来，一日难再晨\"等谚语，都说的是时间的一维性特点。"},{"t":"s","n":5,"stem":"联系的观点和发展的观点是","score":2,"opts":["马克思主义的理论品质","唯物辩证法的总观点和总特征","马克思主义的活的灵魂","唯物辩证法的实质和核心"],"ans":"B","ana":"唯物辩证法认为，物质世界是普遍联系和永恒发展的。联系的观点和发展的观点是唯物辩证法的总特征。"},{"t":"s","n":6,"stem":"意识的能动性最突出的表现是，意识能通过指导实践","score":2,"opts":["改造自然规律","创造社会规律","改造客观世界","创造主观世界"],"ans":"C","ana":"意识能通过指导实践改造客观物质世界。这是意识的能动性最突出的表现。意识的能动性不仅在于能反映客观世界，根据需要和可能形成目的，更重要的是在一定目的的支配下，通过有计划的实践活动将观念的东西变为现实，使客观世界发生合乎人的目的的变化。这就是意识对物质的反作用。"},{"t":"s","n":7,"stem":"下列各项属于辩证唯物主义观点的是","score":2,"opts":["认识是从天上掉下来的","认识是主体对客体的直观反映","认识是人脑主观自生的","认识是主体对客体的能动反映"],"ans":"D","ana":"人的认识就是在主客体的相互作用中产生和发展的。认识的真正本质是在实践中主体对客体的能动反映，这是马克思主义哲学对认识本质的科学揭示。"},{"t":"s","n":8,"stem":"哲学史上的唯理论和经验论的错误在于","score":2,"opts":["割裂了感性认识和理性认识的联系","颠倒了直接经验和间接经验的关系","混淆了正确认识和错误认识的区别","模糊了绝对真理和相对真理的界限"],"ans":"A","ana":"在认识过程中，感性认识和理性认识是不可分割的，如果将二者割裂开，就会犯经验论或唯理论的错误。"},{"t":"s","n":9,"stem":"被称为马克思主义哲学的精髓、党的思想路线的核心的是","score":2,"opts":["一切从实际出发","理论联系实际","解放思想","实事求是"],"ans":"D","ana":"实事求是是马克思主义哲学的精髓，是马克思主义中国化所形成的重大理论成果。首先，实事求是是对辩证唯物主义和历史唯物主义的高度概括，贯穿于马克思主义哲学的唯物论、辩证法、认识论、价值观、历史观等各个组成部分之中，是马克思主义哲学的灵魂。其次，实事求是是党的思想路线的核心。"},{"t":"s","n":10,"stem":"人口因素在社会发展中的作用表现为","score":2,"opts":["影响社会阶层的划分","影响社会发展的速度","决定社会制度的性质","决定社会形态的更替"],"ans":"B","ana":"人口因素也是社会物质生活的必要条件之一，对社会发展起着制约和影响作用，主要表现在以下两个方面。第一，一定数量的人口是社会物质生产的必要前提。第二，人口状况能加速或延缓社会的发展。"},{"t":"s","n":11,"stem":"在现代生产力系统中，劳动者、劳动资料和劳动对象属于","score":2,"opts":["准备性因素","运筹性因素","实体性因素","渗透性因素"],"ans":"C","ana":"独立的实体性因素。这是以物质实体形式相对独立存在的因素，包括劳动者、劳动资料和劳动对象。"},{"t":"s","n":12,"stem":"社会形态是","score":2,"opts":["自然界与人类社会的统一","地理环境与人口因素的统一","生产力与生产关系的统一","经济基础与上层建筑的统一"],"ans":"D","ana":"社会形态是指生产力在一定发展阶段相适应的经济基础和上层建筑的具体的历史的统一体。"},{"t":"s","n":13,"stem":"社会历史发展的动力是多方面的，其中作为基本动力的是","score":2,"opts":["社会基本矛盾","阶级斗争","科学技术革命","社会改革"],"ans":"A","ana":"生产力和生产关系之间的矛盾、经济基础和上层建筑之间的矛盾，存在于一切社会形态之中，贯穿于每一个社会形态的始终。这两对矛盾制约和决定着其他各种社会矛盾，决定着整个社会的面貌，决定着社会发展的必然阶段和客观趋势，决定社会形态由低级到高级的演进。所以社会基本矛盾是社会发展的基本动力。"},{"t":"s","n":14,"stem":"在商品经济中，生产商品的劳动具有二重性，这里的劳动二重性是指","score":2,"opts":["具体劳动和抽象劳动","活劳动和物化劳动","体力劳动和脑力劳动","私人劳动和社会劳动"],"ans":"A","ana":"商品是通过人的劳动生产出来的，商品的使用价值和价值二因素是由生产商品的劳动的二重性所决定的。这种劳动的二重性就是具体劳动和抽象劳动。"},{"t":"s","n":15,"stem":"某个资本主义企业通过提高生产效率取得了比同类企业更高的收益，从劳动价值论的观点看，这种高额利润本质上属于","score":2,"opts":["绝对剩余价值","相对剩余价值","超额剩余价值","高额垄断利润"],"ans":"C","ana":"个别企业率先采用先进的生产设备和技术，提高了劳动生产率，使生产商品的个别劳动时间低于社会必要劳动时间，商品个别价值低于社会价值，这个企业的资本家就会由于按社会价值出售商品，而能够比其他资本家获得更多的剩余价值，即获得超额剩余价值。超额剩余价值就是商品的个别价值低于社会价值的差额。"},{"t":"s","n":16,"stem":"从资本循环周转的角度考察，资本家用于购买机器设备的资本属于","score":2,"opts":["可变资本","不变资本","流动资本","固定资本"],"ans":"D","ana":"固定资本是指产业资本家用于机器、工具、厂房、设备等劳动资料上的那部分生产资本。这部分资本的价值并非在一次生产过程中全部转移到新产品中去，而是按照它在每次生产过程中的使用磨损程度，其价值一部分一部分逐渐地转移到新产品中去，经过多次生产过程，才把它的价值全部转移完毕;而转移到新产品中去的价值，随着商品的销售，又以货币资本的形态一部分一部分逐渐地周转回到产业资本家手中。依据这部分资本价值周转方式是多次转移、多次收回的特点，把它称为固定资本。"},{"t":"s","n":17,"stem":"资本主义意识形态的核心是","score":2,"opts":["利己主义","民主法治原则","个人主义","自由平等博爱"],"ans":"A","ana":"利己主义是生产资料私有制的必然产物，是一切以私有制为基础的剥削阶级所共有的观念，人不为己，天诛地灭是私有者的至理信条。资本主义经济制度是生产资料私有制的最高和最后形态，因而利己主义也发展到了顶峰，成为资本主义意识形态的核心。"},{"t":"s","n":18,"stem":"垄断利润的主要实现形式是垄断组织制定的","score":2,"opts":["市场规则","市场秩序","垄断规则","垄断价格"],"ans":"D","ana":"垄断利润主要是通过垄断组织制定的垄断价格来实现的。垄断价格是垄断组织在销售或购买商品时，凭借其垄断地位规定的、旨在保证获取最大限度利润的市场价格。"},{"t":"s","n":19,"stem":"金融寡头对国家机器的控制主要是通过","score":2,"opts":["参与制来实现","“”同政府的个人联合来实现","同政府的金融联系来实现","对政府项目的资本参与来实现"],"ans":"B","ana":"金融寡头在政治上的统治主要是通过个人联合的方式实现的。资本主义的政治生活和竞选活动，是以金钱为工具和经济实力为基础的。金融寡头可以直接出马或者把自己的代理人送进政府和议会，通过掌握政权利用政治力量为其垄断统治服务；或者是把政府的高官拉下水，让他们在其政治活动中为金融寡头的利益服务。此外，金融寡头还可以通过建立政策研究咨询机构等方式来对政府的政策施加影响，通过掌握舆论工具、新闻媒介来对社会生活施加影响，从而实现其对社会经济生活的统治。"},{"t":"s","n":20,"stem":"第二次世界大战以来，从事国际经济协调、维护国际经济秩序的国际经济组织主要有","score":2,"opts":["世界银行、世界贸易组织和布雷顿森林体系","国际货币基金组织、世界银行和世界贸易组织","布雷顿森林体系、国际货币基金组织和世界银行","世界贸易组织、布雷顿森林体系和国际货币基金组织"],"ans":"B"},{"t":"s","n":21,"stem":"国家垄断资本主义对国民经济进行宏观调控的主要手段是","score":2,"opts":["经济手段和行政手段","法律手段和行政手段","经济手段和法律手段","法律手段和计划手段"],"ans":"C","ana":"资本主义国家对经济的调控手段，主要是经济手段和法律手段，在个别时候、特定情况下，还可能使用某种行政手段对国民经济进行直接的干预。"},{"t":"s","n":22,"stem":"国际共产主义运动史上的第一个社会主义国家是","score":2,"opts":["中华人民共和国","苏维埃俄国","德意志民主共和国","朝鲜民主主义人民共和国"],"ans":"B","ana":"在列宁这一思想的指引下，在俄国布尔什维克党的领导下，俄国无产阶级于1917年11 月7 日（俄历10 月25 日）在彼得格勒举行了十月革命武装起义，建立起世界上第一个社会主义国家。十月革命的胜利、苏维埃俄国的诞生，是列宁这一理论的成功实践。"},{"t":"s","n":23,"stem":"马克思主义政党产生的充分条件是","score":2,"opts":["科学社会主义理论的产生","工人运动的发展","科学社会主义理论与工人运动相结合","科学社会主义理论的传播"],"ans":"C","ana":"马克思主义政党产生的条件，一是工人运动的发展，二是科学社会主义理论的传播。工人运动的发展是马克思主义政党产生的阶级基础，只有工人运动产生并发展到一定程度，工人阶级具有一定的组织程度和觉悟程度的时候，才需要组成一个无产阶级自己的政党，以便带领群众有组织地进行斗争，以争取无产阶级和劳动人民的解放。仅有工人运动的发展没有科学社会主义理论的指导是不行的。在工人自发地起来进行争取自身权益的斗争中，没有科学社会主义理论指导，会使运动走向歧途并归于失败。"},{"t":"s","n":24,"stem":"共产主义社会制度优越性的根本保证在于","score":2,"opts":["前所未有的高水平的劳动生产率","高度发达的商品经济","优雅宜居的自然环境","丰富多彩的文化生活"],"ans":"A","ana":"共产主义社会的社会生产力的高度发展，是伴随着科学技术的高度发展和人们的科技水平极大提高而实现的，从而创造出前所未有的高水平的劳动生产率，这是共产主义社会制度具有巨大优越性的根本保证。"},{"t":"s","n":25,"stem":"实现了阶级的消灭和国家的消亡的社会是","score":2,"opts":["社会主义社会","共产主义社会","民主法治社会","信息网络社会"],"ans":"B","ana":"在共产主义社会，阶级的消灭和国家的消亡，意味着实现了世界的和谐。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"简述马克思主义的科学内涵以及学习马克思主义的根本方法。","score":6,"ans":"（1）马克思主义是以反对资本主义、建设社会主义和共产主义为目标的科学理论体系，或者简要地说，它是关于无产阶级和人类解放的科学。①马克思主义是马克思、恩格斯共同创立的。②马克思主义不仅包括它的创始人马克思、恩格斯的理论，而且包括它的继承人的理论，特别是列宁、毛泽东、邓小平、江泽民、胡锦涛、习近平等人的理论。③列入马克思主义范畴的理论，必须是在基本观点、基本立场、基本方法、价值取向等方面与马克思、恩格斯创立的理论前后相继、一脉相承，在本质上相一致的。④马克思主义的各个组成部分不是彼此孤立、互不联系的，而是组成一个具有内在逻辑联系的科学体系，其中马克思主义哲学是科学的世界观和方法论，政治经济学揭示了资本主义的发展规律，处于核心地位的则是科学社会主义理论。这三者之间互相渗透、互相补充，构成统一的马克思主义学说。（2）理论联系实际是学习马克思主义的根本方法。"},{"t":"short","n":27,"stem":"如何理解真理与谬误相互依存并在一定条件下相互转化？","score":6,"ans":"正确地反映客体的认识就是真理，歪曲地反映客体的认识就是谬误。真理和谬误是认识运动中既对立又统一的两个方面。它们的对立表现在相互排斥、相互否定上，统一表现为它们之间的相互依存和相互转化。真理与谬误互相依存，是说真理与谬误是相比较而存在、相斗争而发展的。没有真理就无所谓谬误，没有谬误也无所谓真理。真理和谬误是认识运动中不可分割的两个方面，在认识过程中不断地开展真理对谬误的斗争，以达到人们对真理越来越深刻的认识。真理和谬误不仅相互依存，而且在一定条件下可以相互转化。这是因为任何真理都是具体的，都有与之相符的特定的对象、时间和范围，一旦离开这个对象，超出特定的时间和范围，真理就会变成谬误。"},{"t":"short","n":28,"stem":"简述不变资本和可变资本的划分根据及其各自的含义。","score":6,"ans":"资本在生产过程中以两种形式存在：生产资料形式和劳动力形式。根据这两部分资本在剩余价值生产中所起的作用不同，把资本区分为不变资本和可变资本。以生产资料形式存在的资本是不变资本。以劳动力形式存在的这部分资本是可变资本。"},{"t":"short","n":29,"stem":"什么是经济全球化？其消极影响有哪些？","score":6,"ans":"经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出某一国家和地区的范围而相互联系、相互依赖的过程。消极影响的表现是：(1)发达国家与发展中国家的差距在扩大。(2)在经济增长中忽视社会进步，环境恶化与经济全球化有可能同时发生。(3)各国特别是相对落后国家原有的体制、政府领导能力、社会设施、政策体系、价值观念和文化都面临着全球化的冲击，国家内部和国际社会都出现不同程度的治理危机。(4)经济全球化使各国之间的经济联系越来越紧密，相互依赖越来越强，而有效的全球性协调机制却没有建立起来，这就使得爆发全球性经济危机的风险不断增大。"},{"t":"short","n":30,"stem":"如何探索适合本国国情的社会主义发展道路？","score":6,"ans":"（1）必须以马克思主义理论为指导；（2）必须从本国国情出发，把马克思主义基本原理同本国的社会主义建设实践结合起来；（3）必须吸收人类一切文明成果。"}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"试述主要矛盾和次要矛盾关系的原理，并结合中国特色社会主义进入新时代的实际，谈谈正确把握社会主要矛盾及其转化的意义。","score":10,"ans":"(1)主要矛盾和次要矛盾的关系：①二者相互影响，相互作用。一方面，主要矛盾规定和影响着次要矛盾的存在和发展，对事物的发展起决定作用。另一方面，次要矛盾对主要矛盾有制约作用，次要矛盾解决得如何，反过来影响主要矛盾的解决。②二者的地位不是一成不变的，它们在一定条件下可以相互转化。(2)主要矛盾和次要矛盾、矛盾的主要方面和次要方面关系的原理，要求我们在实际工作中坚持两点论与重点论的统一。坚持两点论，就是在认识复杂事物的发展过程时，既要看到主要矛盾，又不忽略次要矛“盾；在认识某一矛盾时，既要看到矛盾的主要方面，又不忽略矛盾的次要方面。坚持重”点论，就是在认识复杂事物的发展过程时，要着重地抓住主要矛盾；在研究某一矛盾时，要着重把握矛盾的主要方面。坚持两点论和重点论的统一，就是看问题、办事情既要全面，又要善于抓重点。我国坚持以经济建设为中心和一系列两手抓的方针，认识我国社会主义现代化建设的形势要分清主流和支流，既要抓住主流、坚定信心，又不忽略支流，都是坚持两点论和重点论统一的具体表现。"},{"t":"essay","n":32,"stem":"正确认识和评价杰出人物的历史作用，必须坚持哪些基本观点和方法？","score":10,"ans":"（1）必须深入了解所处的历史条件，坚持历史主义原则；（2）必须对他们做阶级分析；（3）必须用必然性与偶然性辩证统一的观点来分析；（4）要做全面的分析与评价，既不能肯定一切，也不能否定一切。"},{"t":"essay","n":33,"stem":"什么是价值规律？它在商品经济中的作用及其表现形式是什么？","score":10,"ans":"（1）基本内容：商品的价值由生产商品的社会必要劳动时间所决定，商品交换以价值为基础，实行等价交换。概括地表述，价值规律就是商品按照由会必要劳动时间决定的价值进行交换的规律。（2）作用：①价值规律自发地调节生产资料和劳动力在社会生产各部门之间分配的比例，即调节社会资源的配置。②自发地促进社会生产力的发展。③会引起和促进商品生产者的分化。（3）价格围绕价值上下波动是价值规律作用的表现形式。"}]}],"code":"03709","qaNotes":[]},{"paper":"marx-2404","subject":"marx","session":"2404","label":"2024年4月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义产生于19 世纪，至今已经历（）","score":2,"opts":["150 多年","170 多年","190 多年","200 多年"],"ans":"B","ana":"1847年7 月发表的马克思的《哲学的贫困》和1848 年2 月发表的马克思、恩格斯合写的《共产党宣言》，则标志着马克思主义的公开问世。1847-2024，至今经历170 多年。"},{"t":"s","n":2,"stem":"马克思主义科学体系中，揭示了资本主义发展规律是（）","score":2,"opts":["辩证唯物主义","历史唯物主义","政治经济学","科学社会主义"],"ans":"C","ana":"马克思主义哲学是科学的世界观和方法论，政治经济学揭示了资本主义的发展规律，处于核心地位的则是科学社会主义理论。"},{"t":"s","n":3,"stem":"物质的唯一特性是（）","score":2,"opts":["空间广延性","客观实在性","时间持续性","形态多样性"],"ans":"B","ana":"列宁的物质定义指出物质的唯一特性是客观实在性。"},{"t":"s","n":4,"stem":"相对静止主要有两种情形。下列各项中属于相对静止情形是（）","score":2,"opts":["事物没有发生性质上的根本变化","事物没有发生数量的些微变化","事物没有发生形式上的任何变化","事物没有发生结构上的彻底变化"],"ans":"A","ana":"相对静止主要有以下两种情形：第一，一个事物对另一个事物来说没有发生位置的移动。第二，事物的质没有发生根本变化。"},{"t":"s","n":5,"stem":"规律的两个特点是（）","score":2,"opts":["稳定性和不变性","主观性和能动性","客观性和普遍性","社会性和历史性"],"ans":"C","ana":"规律具有两个特点。第一，客观性。第二，普遍性。"},{"t":"s","n":6,"stem":"下列各项完整表述了物质和意识辩证关系是（）","score":2,"opts":["物质第一性，物质决定意识","物质决定意识，意识根源于物质","意识第二性，意识反映物质","物质决定意识，意识反作用于物质"],"ans":"D","ana":"物质与意识的关系是：物质决定意识，物质第一性，意识第二性；意识对物质又具有能动的反作用。"},{"t":"s","n":7,"stem":"实践是认识的来源，这表明（）","score":2,"opts":["每个人的认识都直接来源于实践","只要去实践就能获得正确的认识","一切认识归根到底都是从实践中获得的","只有书本知识不是以实践中直接获得的"],"ans":"C","ana":"马克思主义哲学认为，认识来源于实践。人的认识能力和作为认识结果的知识，都只能来源于实践。实践是人的才能和知识的唯一源泉。"},{"t":"s","n":8,"stem":"真理的内容是客观的指的是（）","score":2,"opts":["它是不依赖于意识的客观实在","他是不以人的意志为转移的客观规律","它是对各种知识的概括和总结","它是对客观事物及其规律的正确反映"],"ans":"D","ana":"真理的客观性指真理的内容是对客观事物及其规律的正确反映。"},{"t":"s","n":9,"stem":"真理的价值问题，也就是真理是否（）","score":2,"opts":["对主体有意义的问题","具有阶级性的问题","对客体有意义的问题","具有客观性的问题"],"ans":"A","ana":"认识的目的就是要达到真理。人们为什么要孜孜不倦地追求真理，真理对人类有什么意义？这就是真理的价值问题。"},{"t":"s","n":10,"stem":"历史观的基本问题是（）","score":2,"opts":["地理环境与人因素关系问题","生产力与生产关系的关系问题","经济基础与上层建筑的关系问题","社会存在与社会意识的关系问题"],"ans":"D","ana":"社会存在和社会意识的关系问题是历史观的基本问题。"},{"t":"s","n":11,"stem":"划分经济社会形态所依据的标准是（）","score":2,"opts":["生产力的水平","生产关系的性质","意识形态的内容","政治制度的状况"],"ans":"B","ana":"经济社会形态是直接或间接以生产关系的性质为标准划分的社会形态。"},{"t":"s","n":12,"stem":"阶级斗争是阶级社会发展的直接动力。阶级斗争的本源在于（）","score":2,"opts":["物质利益的对立","思想观念的分歧","政治主张的冲突","宗教信仰的差异"],"ans":"A","ana":"物质利益的对立是阶级斗争的根源。"},{"t":"s","n":13,"stem":"人民群众创造历史的活动要受到一定社会历史条件的制约，这就是说人民群众（）","score":2,"opts":["不是社会的主体","推动社会形态的更替","不是社会革命的主力","不能随心所欲地创造历史"],"ans":"D","ana":"历史是人民群众创造的,但人民群众却不能随心所欲地创造历史，人民群众创造历史的活动受既定的历史条件的制约。"},{"t":"s","n":14,"stem":"决定商品价值量的生产商品的（）","score":2,"opts":["必要劳动时间","社会必要劳动时间","剩余劳动时间","社会平均劳动时间"],"ans":"B","ana":"社会必要劳动时间决定商品的价值量。"},{"t":"s","n":15,"stem":"在使用现金交易的市场里，购买者向售卖者交付纸币的行为所执行的是（）","score":2,"opts":["货币的价值尺度职能","货币的流通手段职能","货币的贮藏手段职能","货币的支付手段职能"],"ans":"B","ana":"货币的流通手段职能是指货币起着商品交换媒介的作用。货币作为商品交换的媒介，就使商品交换分解为卖（商品一货币）和买（货币一商品）两个过程。以货币为媒介的商品交换，就是商品流通。纸币是代替金属货币执行流通手段的职能。"},{"t":"s","n":16,"stem":"价值规律作用的表现形式是，市场上商品的价格（）","score":2,"opts":["围绕商品价值上下波动","围绕生产成本上下波动","围绕生产价格上下波动","围绕市场价值上下波动"],"ans":"A","ana":"价格围绕价值上下波动是价值规律作用的表现形式。"},{"t":"s","n":17,"stem":"从剩余价值生产方法的角度考察，某个企业的资本家通过工人加班而获得剩余价值属于（）","score":2,"opts":["绝对剩余价值","垄断性经营所得","相对剩余价值","超经济强制所得"],"ans":"A","ana":"在雇佣工人的必要劳动时间不变的条件下，由于工作日的绝对延长而生产的剩余价值，叫做绝对剩余价值。"},{"t":"s","n":18,"stem":"资本主义经济危机的实质是（）","score":2,"opts":["生产绝对过剩的危机","生产相对过剩的危机","有效需求的危机","资本更新乏力的危机"],"ans":"B","ana":"资本主义经济危机的实质是生产相对过剩的危机。"},{"t":"s","n":19,"stem":"以下选项中不属于垄断资本向世界范围扩展基本形式是（）","score":2,"opts":["借贷资本输出","生产资本输出","商品资本输出","人力资本输出"],"ans":"D","ana":"垄断资本向世界范围扩展的基本形式有三种：1、借贷资本输出；2、生产资本输出；3、商品资本输出。"},{"t":"s","n":20,"stem":"金融寡头实现其在经济上统治的主要形式是（）","score":2,"opts":["个人联合","参与制","生产控制","销售控制"],"ans":"B","ana":"金融寡头在经济上的统治主要是通过实行参与制实现的，在政治上的统治主要是通过个人联合的方式实现的。"},{"t":"s","n":21,"stem":"推动资本主义发生变化的根本力量是（）","score":2,"opts":["科学技术革命和生产的发展","工人阶级争取自身权力和利益的斗争","社会主义制度优越性的初步显现","资本主义政治制度的改良"],"ans":"A","ana":"科学技术革命和生产力的发展，是资本主义发生变化的根本推动力量。"},{"t":"s","n":22,"stem":"作为当代国际垄断组织主要形式的国际垄断同盟，其构成部分重要是（）","score":2,"opts":["国际辛迪加和国际托拉斯","国际托拉斯和跨国公司","跨国公司和国家垄断资本主义","国际托拉斯和国家垄断资本主义"],"ans":"C","ana":"当代国际垄断组织的形式则以跨国公司和国家垄断资本主义的国际垄断同盟为主。"},{"t":"s","n":23,"stem":"科学社会主义的直接理论来源是（）","score":2,"opts":["16 世纪欧洲的空想社会主义思想","17 世纪欧洲的空想社会主义思想","18 世纪欧洲的空想社会主义思想","19 世纪初期欧洲的空想社会主义思想"],"ans":"D","ana":"19 世纪初期欧洲的三大空想社会主义者，有法国的圣西门、傅立叶和英国的欧文，他们在前人思想的基础上提出了自己的社会主义思想和方案，并进行了一些社会改造的尝试。他们的空想社会主义思想，成为马克思主义科学社会主义的直接理论来源。"},{"t":"s","n":24,"stem":"社会主义革命建设和改革事业的领导核心是（）","score":2,"opts":["工人阶级","农民阶级","马克思主义政党","工农联盟"],"ans":"C","ana":"马克思主义政党是社会主义革命、建设和改革的领导核心。"},{"t":"s","n":25,"stem":"走向共产主义的必经阶段和必由之路是（）","score":2,"opts":["奴隶社会封建社会","封建社会","资本主义社会","社会主义社会"],"ans":"D","ana":"社会主义是走向共产主义的必由之路。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"为什么说一个正确的认识需要经过多次反复才能完成？","score":6,"ans":"认识在实践中产生，先是感性认识，然后上升为理性认识，再由理性认识回到实践，这是一个由实践到认识、再由认识到实践的完整的认识过程。认识的反复性是由以下原因决定的。首先，从认识客体方面来考察。其一，客观事物本身往往是多种矛盾的统一体，每一个矛盾的双方以及各个矛盾之间的相互作用，都有很多特点和非常复杂的情况，这就决定了事物本身的复杂性。其二，事物的矛盾有个展开和发展的过程，事物的本质并不是一开始就显露在外面，而是要经历一个过程才逐渐暴露出来。其三，任何事物都是具体的，都是存在于特定的社会历史环境中的，而一定社会所提供的科学技术条件是与那个社会生产发展的水平相联系的。这就使得人的认识必然要受到社会历史条件和科学技术条件的限制。认识客体的这些特点，决定了人们对它的认识必须经历反复的过程。其次，从认识主体来考察。人的认识受到主体的生理因素、知识水平、生活经验、认识能力及其立场、观点、方法的限制。认识主体的这些特点，决定其必须经过由实践到认识、再由认识到实践这样多次的反复，才能获得对客观事物的正确认识。"},{"t":"short","n":27,"stem":"简述生产方式及其在社会发展的作用。","score":6,"ans":"生产方式是人类借以向自然界谋取必需的生活资料的方式，包括生产力和生产关系两个方面，是特定的生产力和生产关系的统一。生产方式在社会发展中起决定作用，主要表现在以下几个方面：（1）生产方式或生产活动，是人类从动物界分离出来的根本动力和人类区别于动物的根本标志。（2）生产方式或生产活动是人类和人类社会得以存在和发展的基础。（3）生产活动是形成人类社会关系的基础。（4）生产方式决定社会制度的性质和社会形态的更替。"},{"t":"short","n":28,"stem":"劳动二重性理论是理解政治经济学的枢纽，请简要说明劳动二重性的含义。","score":6,"ans":"劳动的二重性就是具体劳动和抽象劳动。生产一定使用价值，具有特定性质、目的和形式的劳动，就是具体劳动。撇开一切具体形式的、无差别的一般人类劳动，就是抽象劳动。具体劳动是生产商品劳动的自然属性，抽象劳动是生产商品劳动的社会属性。"},{"t":"short","n":29,"stem":"简述资本主义国家宏观经济管理与调节的主要目标。","score":6,"ans":"资本主义国家宏观经济管理与调节的主要目标，包括保持经济的稳定和一定程度的增长，保持币值和物价的稳定，实现充分就业，保持国际国内收支的大体平衡等。"},{"t":"short","n":30,"stem":"共产主义精神境界的极大提高表现在哪些方面？","score":6,"ans":"共产主义社会中人们精神境界的极大提高，表现在多方面：人们树立了高度自觉的劳动态度，遵守社会纪律，团结互助，诚实友爱，完全从社会公共利益出发进行劳作和参加社会活动，人人都习惯于遵守社会公共生活的基本准则。人们既摆脱了封建的、保守的思想观念的束缚，又摒弃了以利己主义为核心的资产阶级思想意识，树立了以集体主义为核心的共产主义人生观、价值观和道德观。"}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"试述量变和质变的辩证关系原理及其对于社会主义建设的意义。","score":10,"ans":"量变和质变是统一的。（1）第一，量变是质变的必要准备。质变以量变为前提和基础，没有一定的量变就不会发生质变。其次，质变必须由量变规定其性质和方向。（2）质变是量变的必然结果。（3）量变和质变相互渗透。（4）量变和质变是辩证统一的，割裂二者的统一，就会导致激变论或庸俗进化论。（5）质量互变规律要求我们在“社会主义建设和改革过程中，把远大的理想和目标同有步骤、分阶段的踏实肯干、稳步”前进的精神结合起来，反对急躁冒进、急于求成、否则会欲速则不达。"},{"t":"essay","n":32,"stem":"相对剩余价值和超额剩余价值是怎样生产出来的？","score":10,"ans":"（1）在工作日长度不变条件下，由于缩短必要劳动时间、相应延长剩余劳动时间而生产的剩余价值叫作相对剩余价值。生产相对剩余价值，必须缩短必要劳动时间，这就需要降低劳动力价值，进而需要降低生活资料的价值，必须提高生活资料生产部门的劳动生产率。相对剩余价值生产是以社会劳动生产率提高为条件的。（2）超额剩余价值就是商品的个别价值低于社会价值之间的差额。个别企业率先采用先进的生产设备和技术，提高了劳动生产率，使生产商品的个别劳动时间低于社会必要劳动时间，商品个别价值低于社会价值，这个企业的资本家就会由于按社会价值出售商品，而能够比其他资本家获得更多的剩余价值，即获得超额剩余价值。"},{"t":"essay","n":33,"stem":"第二次世界大战后国家垄断资本主义大发展的原因是什么？","score":10,"ans":"（1）仅靠私人垄断资本的力量，无法满足大规模经济建设所需要的巨额资金；（2）在一些大规模公共设施的建设上，私人垄断资本无能为力或不愿进行建设；（3）一些大型、基础性、前导性的科学研究项目，也是私人垄断资本不愿涉足的领域；（4）日益严重的生产过剩问题仅靠私人垄断资本很难解决；（5）社会化大生产的发展要求国家出面进行某些宏观经济调控；（6）在经济利益关系的调整方面，国家的再分配功能也越来越重要。"}]}],"code":"03709","qaNotes":[]},{"paper":"marx-2410","subject":"marx","session":"2410","label":"2024年10月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"与时俱进是（）","score":2,"opts":["马克思主义的理论品质","马克思主义的理论特征","学习马克思主义的目的","学习马克思主义的方法"],"ans":"A","ana":"党的十六大报告明确指出，与时俱进是马克思主义的理论品质。"},{"t":"s","n":2,"stem":"哲学的基本问题是（）","score":2,"opts":["理论和实践的关系问题","思维和存在的关系问题","自然和社会的关系问题","物质和运动的关系问题"],"ans":"B","ana":"哲学基本问题有两个，第一个是物质与意识哪个是本原的问题。第二个是思维与存在的同一性问题。第一个问题区分了唯物主义和唯心主义。第二个问题区分可知论和不可知论。"},{"t":"s","n":3,"stem":"空间是物质运动的（）","score":2,"opts":["持续性和顺序性","绝对性和无限性","广延性和伸张性","客观性和普遍性"],"ans":"C","ana":"物质运动的存在形式是时间和空间。时间是物质运动的持续性、顺序性，时间的特点是一维性；空间是物质运动的广延性和伸张性。"},{"t":"s","n":4,"stem":"实践作为主体有意识、有目的的活动，强调的是实践具有（）","score":2,"opts":["直接现实性","社会历史性","自觉能动性","客观物质性"],"ans":"C","ana":"实践的本质是实践是主体能动地改造和探索客体的客观物质活动。实践具有以下三个基本特点：（1）客观性。实践是客观的感性物质活动。（2）自觉能动性。实践是主体有意识、有目的的活动。（3）社会历史性。实践是社会性的、历史性的活动。"},{"t":"s","n":5,"stem":"下列范畴揭示事物联系和发展中确定的和不确定的两种趋势的是（）","score":2,"opts":["原因和结果","可能性和现实性","内容和形式","必然性和偶然性"],"ans":"D","ana":"必然性和偶然性是事物联系和发展中两种不同的趋势。①必然性：事物联系和发展过程中确定不移的、不可避免的趋势。②偶然性：事物联系和发展过程中不确定的趋势。"},{"t":"s","n":6,"stem":"人类社会与自然界有本质区别，社会规律是（）","score":2,"opts":["可以任意改变的","通过人的自觉活动实现的","不能正确认识的","盲目自发地起作用的"],"ans":"B","ana":"自然过程是无意识的，盲目的，不自觉的。自然规律是通过自然界各种盲目的力量相互作用形成和实现的。它是自发起作用的，不需要人的参与。社会发展是有人的实践活动构成的，是人的实践活动的过程和结果，人的实践活动是有意识、有目的的自觉的活动。所以，社会规律是通过人们的自觉活动实现的。"},{"t":"s","n":7,"stem":"人们追求符合客观实际的科学认识，归根结底是为了（）","score":2,"opts":["延伸认识器官","锻炼思维能力","发展兴趣爱好","改造客观世界"],"ans":"D","ana":"人们追求符合客观实际的科学认识，归根结底是为了实现对客观世界的改造。"},{"t":"s","n":8,"stem":"作为认识的高级阶段，理性认识是（）","score":2,"opts":["对事物的部分现象和必然联系的反映","对事物的部分本质和偶然联系的反映","对事物的全体本质和内部联系的反映","对事物的全体现象和外部联系的反映"],"ans":"C","ana":"感性认识是人们在实践基础上，由感觉器官直接感受到的关于事物的现象、事物的外部联系、事物的各个方面的认识。理性认识是指人们借助抽象思维，在概括整理大量感性材料的基础上，关于事物的本质、全体、内部联系和事物自身规律性的认识。"},{"t":"s","n":9,"stem":"下列各项正确说明真理问题的是（）","score":2,"opts":["真理就是客观事物本身","真理就是客观规律本身","真理是客观的，又是绝对的和相对的","真理是主观的，又是绝对的和相对的"],"ans":"C","ana":"真理是客观的，又是绝对的和相对的。承认真理的客观性，这是在真理问题上坚持了唯物论；承认頁理既是绝对的又是相对的，这是在真理问题上坚持了辩证法。任何真理都是客观性、绝对性和相对性的统一，这就是真理观上唯物论与辩证法的统一。"},{"t":"s","n":10,"stem":"社会存在和社会意识的关系是（）","score":2,"opts":["划分唯物史观和唯心史观的标准","划分可知论和不可知论的标准","划分唯物主义和唯心主义的标准","划分宿命论和唯意志论的标准"],"ans":"A","ana":"社会存在指社会物质生活条件的总和，包括地理环境、人口因素和物质生活资料的生产方式。社会意识是对社会存在的反映。社会存在和社会意识的关系问题是历史观的基本问题。社会存在和社会意识的关系是划分唯物史观和唯心史观的标准。"},{"t":"s","n":11,"stem":"地理环境在社会发展中的作用主要通过（）","score":2,"opts":["对物质生产的影响实现","对物质交往的影响实现","对人口生长的影响实现","对精神交往的影响实现"],"ans":"A","ana":"地理环境通过对生产的影响，加速或延缓社会的发展。地理环境还可以通过军事、政治的影响在一定程度上制约不同国家社会的发展。"},{"t":"s","n":12,"stem":"社会改革的实质是（）","score":2,"opts":["经济基础的根本改变","社会体制的改善与革新","上层建筑的根本改变","社会形态的更替和发展"],"ans":"B","ana":"社会改革是在一定社会制度下，为了解决生产关系不适合生产力、上层建筑不适合经济基础的某些部分或环节，使该社会制度得到持续存在与发展或自我完善，而对社会体制进行的改善与革新。"},{"t":"s","n":13,"stem":"唯心史观在历史创造者问题上的根本错误在于（）","score":2,"opts":["强调物质动因在历史发展中的作用","否认思想动机在历史发展中的作用","否认历史人物是推动历史发展的决定力量","否认人民群众是推动历史发展的决定力量"],"ans":"D","ana":"历史唯物主义认为人民群众是推动历史发展的决定力量。历史唯心主义认为个别英雄是推动历史发展的决定力量。唯心史观在历史创造者问题上的根本错误在于否认人民群众是推动历史发展的决定力量。"},{"t":"s","n":14,"stem":"商品经济的产生和存在需要一定条件，其中决定性的条件是（）","score":2,"opts":["自然分工的产生和存在","生产资料和劳动产品属于不同所有者","社会分工的产生和存在","生产资料和劳动产品属于共同所有者"],"ans":"B","ana":"商品经济的产生与存在需要两个基本经济条件：（1）社会分工的产生和存在（一般条件和基础）；（2）生产资料和劳动产品属于不同的所有者（决定性条件）。"},{"t":"s","n":15,"stem":"使资本主义制度完全确立的是（）","score":2,"opts":["产业革命","资产阶级革命","资本原始积累的完成","资本主义国家宪法诞生"],"ans":"A","ana":"资产阶级革命的胜利初步确立了资本主义制度。产业革命使资本主义制度完全确立。"},{"t":"s","n":16,"stem":"与一般商品的价值决定不同，劳动力商品价值决定的一个重要特点，它包含（）","score":2,"opts":["法律和传统因素","社会和人口因素","历史和道德因素","国家和民族因素"],"ans":"C","ana":"劳动力的价值决定还有一个重要的特点，就是它包括历史和道德的因素。这就是说，雇佣劳动者的必要生活资料的种类和数量，要受一定历史条件下的经济和文化发展水平以及各个国家风俗和习惯的制约。"},{"t":"s","n":17,"stem":"从政治经济学原理来看，私人资本用于机器、厂房、设备的投资属于（）","score":2,"opts":["可变资本和流动资本","可变资本和固定资本","不变资本和固定资本","不变资本和流动资本"],"ans":"C","ana":"固定资本指产业资本家用于机器、工具、厂房、设备等劳动资料上的那部分生产资本。流动资本是指产业资本家用于原料、材料、辅助材料等劳动对象和用于劳动力的那部分生产资本。不变资本（c）：以生产资料形式存在的资本（非人）；可变资本（v）：以劳动力形式存在的资本，实现了价值增殖（人）。"},{"t":"s","n":18,"stem":"资本主义国家中掌握立法权的机关是（）","score":2,"opts":["国会或议院","最高法院","政府或内阁","各级法院"],"ans":"A","ana":"资本主义国家的三权分立制度，又称分权制，它是资本主义国家权力机构体系进行组织和活动的一种制度。议会（国会或议院）掌握立法权、政府掌握行政权和法院掌握司法权。"},{"t":"s","n":19,"stem":"国家垄断资本主义的产生和发展，为全社会占有生产资料和共同组织社会化生产准备了（）","score":2,"opts":["最充分的物质条件和经济条件","基本的物质条件和经济条件","最充分的物质条件和社会条件","基本的物质条件和社会条件"],"ans":"A","ana":"国家垄断资本主义的产生和发展，为全社会占有生产资料和共同组织社会化生产准备了最充分的物质条件和经济条件。"},{"t":"s","n":20,"stem":"经济全球化的主要内容包括（）","score":2,"opts":["生产贸易和信息的全球化","生产贸易和资本的全球化","生产资本和信息的全球化","贸易资本和信息的全球化"],"ans":"B","ana":"经济全球化本质上是资源配置的国际化。主要内容包括：（1）生产的全球化；（2）贸易的全球化；（3）资本的全球化。"},{"t":"s","n":21,"stem":"在垄断资本主义阶段，占统治地位的资本是（）","score":2,"opts":["工业资本","产业资本","商业资本","金融资本"],"ans":"D","ana":"金融资本是由垄断的工业资本和银行资本，通过金融联系、资本参与和人事参与，融合或混合生长构成的一种新的资本形式，是垄断资本主义国家中社会经济生活各个方面实际上的统治者。"},{"t":"s","n":22,"stem":"当代资本主义国家中，政府对国民经济进行宏观管理和调控（）","score":2,"opts":["是为缓和社会矛盾而采取的措施","能够杜绝经济危机的发生","会使其经济发展保持长期繁荣","可以消除资本主义基本矛盾"],"ans":"A","ana":"国家调控的总任务：促进市场总供给和总需求的平衡。它无法消除资本主义基本矛盾，所以无法杜绝经济危机的发生，只能暂时缓解生产社会化和生产资料私人占有的矛盾，延缓经济危机的到来。"},{"t":"s","n":23,"stem":"早期空想社会主义的代表作《乌托邦》的作者是（）","score":2,"opts":["圣西门","莫尔","康帕内拉","欧文"],"ans":"B","ana":"早期空想社会主义的代表作是英国人莫尔的《乌托邦》和意大利人的康帕内拉的《太阳城》。"},{"t":"s","n":24,"stem":"马克思主义政党是按照严格的组织原则建立起来的团结统一的政党，其组织原则是（）","score":2,"opts":["集体领导制","个人负责制","民主集中制","民主协商制"],"ans":"C","ana":"民主集中制是马克思主义政党的组织原则。民主集中制是民主基础上的集中和集中指导下的民主相结合，是民主与集中的统一。"},{"t":"s","n":25,"stem":"下列不属于社会主义和共产主义共同特征的是（）","score":2,"opts":["都实行生产资料公有制","都以马克思主义为指导","都要消灭剥削制度","实行按需分配原则"],"ans":"D","ana":"社会主义和共产主义都实行生产资料公有制、都以马克思主义为指导、都要消灭剥削制度。社会主义社会个人收入按劳分配，还未达到共产主义按需分配；共产主义实行的是按需分配制度。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"简述马克思主义是时代的产物。","score":6,"ans":"马克思主义产生于19 世纪40 年代。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了客观条件；而工人阶级作为一支独立的政治力量登上历史舞台，进行反对资本主义制度和资产阶级统治的斗争，则为马克思主义的产生准备了阶级基础。马克思主义的产生是历史时代提出的一项伟大任务。时代的需要本身既孕育着马克思主义产生的可能性,又包含着使这种可能变为现实的各种物质条件和因素。"},{"t":"short","n":27,"stem":"简述社会主义社会实行按劳分配制度的原因。如何认识其历史作用？","score":6,"ans":"（1）社会主义阶段，生产力水平还不高，并存在旧的社会分工，存在体力劳动和脑力劳动等劳动差别，劳动还仅仅是谋生手段。因此，个人消费品的分配应当实行按劳分配原则。（2）在个人消费品分配上，社会主义社会实行的按劳分配制度，打破了资本主义社会按资分配的原则，这是一个历史的进步。这种分配方式尽管存在历史局限性，但在社会主义阶段是无法避免的。"},{"t":"short","n":28,"stem":"第二次世界大战后，资本主义国家的资本输出除了量的剧增外，还有哪些新特点？","score":6,"ans":"第二次世界大战后，资本输岀量剧增并出现了一些新的特点,主要有：资本流向的变化，从原来的主要是发达国家向经济落后国家输出，发展到当代的多方向输出，特别是发达国家间相互投资的大幅度增加；在私人资本输出增长的同时，国家资本的输出也在增长，并日益成为占重要地位的资本输出形式。与过去时代不同，发达国家向发展中国家的资本输出，多采取所谓援助的方式进行。"},{"t":"short","n":29,"stem":"简述认识主体的含义，性质特点和结构","score":6,"ans":"(1)认识主体是指认识和实践活动的承担者，是处于一定社会关系中从事实践活动和认识活动的现实的、具体的人。(2)性质和特点：①具有自然的物质基础；②具有社会性；③具有历史性；④具有能动性，这是认识主体的突出特点。（3）结构：分为个体、群体和人类整体诸层次。"},{"t":"short","n":30,"stem":"什么是商品二因素？简述商品二因素的关系。","score":6,"ans":"（1）商品具有使用价值和价值两个因素。（2）使用价值是一种物品能够满足人们某种需要的属性，即物品的有用性，是商品的自然属性。价值是凝结在商品中的无差别的一般人类劳动，是商品的社会属性。（3）使用价值是价值的物质承担者，价值寓于使用价值之中。"}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"试述否定之否定规律的基本内容。这一规律所揭示的事物发展是前进性和曲折性统一的原理，对于我们正确认识社会主义现代化建设事业有何重要意义？","score":10,"ans":"(1)否定之否定规律的基本内容：事物的发展经过两次辩证的否定，由肯定阶段到否定阶段，再到否定之否定阶段，从而使事物的发展表现为螺旋式上升和波浪式前进的过程。(2)否定之否定规律揭示了事物发展的总趋势是前进的、上升的，事物发展的具体道路是曲折的，事物的发展是前进性和曲折性的统一。把握否定之否定规律，坚持事物的发展是前进性和曲折性统一的原理，对我们正确认识社会主义现代化建设事业具有重要意义。首先，要坚信社会主义的前途是光明的，对我国社会主义现代化建设事业充满必胜的信心，高举中国特色社会主义的伟大旗帜，坚定不移地走建设中国特色社会主义道路，不要被一时的表面现象所迷惑，不要因暂时的挫折而动摇。其次，要准备走曲折的路，有克服各种困难的精神准备。要充分认识我国社会主义现代化建设事业的艰巨性和复杂性，保持清醒的头脑，准备克服各种困难，在曲折斗争中开辟前进的道路。"},{"t":"essay","n":32,"stem":"试述社会形态发展的统一性和多样性的含义及表现","score":10,"ans":"(1)社会形态发展的统一性是指处于同一社会形态的不同国家和民族的历史发展具有共同性，即具有大致相同的生产力发展水平、生产关系体系和上层建筑。(2)社会形态发展的多样性是指不同国家和民族的历史发展具有不同的特点，在经济、政治、文化发展上都有自己民族的特色。(3)表现：①处于同一社会形态的不同国家和民族的历史具有各自的特点。②各个国家在不同的社会形态中的典型意义不同。③人类社会在由较低向较高的社会形态转变时，不同国家和民族的过渡形式各有特点。④有些国家和民族由于特殊的社会历史条件，在社会形态转变过程中，可能超越某一个或某几个社会形态。"},{"t":"essay","n":33,"stem":"试析影响资本周转速度的因素，以及资本周转对剩余价值生产的影响。","score":10,"ans":"（1）影响资本周转的因素，主要有周转时间和生产资本构成两方面。资本周转时间包括生产时间和流通时间。生产时间越短，流通越快，资本获得的剩余价值就越多。生产资本构成是指依据生产资本价值周转方式的差别，将生产资本划分为固定资本和流动资本两部分。其对资本周转的影响，一是固定资本与流动资本的比例，二是固定资本与流动资本各自的周转速度。（2）产业资本周转速度的快慢，影响到一定数量的预付资本在一定时期内(一般以年为单位)所能带来的剩余价值量的多少。在一年之内，资本周转的速度越快，带来的年剩余价值总量就越多，年剩余价值率也越高；反之，带来的年剩余价值总量就越少，年剩余价值率也越低。年剩余价值率为一年内生产的剩余价值总量与一年内预付的可变资本总量的比率。由于加速资本周转可以增加年剩余价值量和提高年剩余价值率，因此产业资本家从剥削尽可能多的剩余价值的目的出发，总是在生产经营中竭力加速其资本的周转速度。"}]}],"code":"15044","qaNotes":[]},{"paper":"marx-2504","subject":"marx","session":"2504","label":"2025年4月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义是时代的产物，资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了","score":2,"opts":["阶级基础","客观条件","科学前提","思想渊源"],"ans":"B","ana":"资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了客观条件。"},{"t":"s","n":2,"stem":"马克思主义的基本特征用一句话来概括就是","score":2,"opts":["科学性与革命性的统一","科学性与人民性的统一","科学性与实践性的统一","科学性与发展性的统一"],"ans":"A","ana":"马克思主义的基本特征，如果用一句话来概括就是科学性与革命性的统一。"},{"t":"s","n":3,"stem":"思维和存在的关系问题作为哲学的基本问题也称为","score":2,"opts":["主体和客体的关系问题","理论和实践的关系问题","意识和物质的关系问题","社会和自然的关系问题"],"ans":"C","ana":"存在和思维的关系问题又称为物质和意识的关系问题，构成了全部哲学的基本问题。"},{"t":"s","n":4,"stem":"运动是物质的根本属性，否认物质的运动和运动的绝对性，必然导致()。","score":2,"opts":["相对主义","不可知论","唯心主义","形而上学"],"ans":"D","ana":"运动是物质的固有属性，物质和运动不可分。物质世界的运动是无条件的、永恒的、绝对的。否认物质的运动和运动的绝对性，必然导致形而上学。"},{"t":"s","n":5,"stem":"唯物辩证法认为，事物之间的相互联系是事物本身固有的，是不以人的意志为转移的，这说明联系具有","score":2,"opts":["稳定性","普遍性","客观性","多样性"],"ans":"C","ana":"联系具有客观性。事物的联系是事物本身所固有的、不以人的意志为转移的。联系的客观性要求我们从客观事物本身固有的联系出发去认识事物。"},{"t":"s","n":6,"stem":"在唯物辩证法体系中，作为其实质和核心的是","score":2,"opts":["对立统一规律","量变质变规律","否定之否定规律","因果规律"],"ans":"A","ana":"对立统一规律是唯物辩证法的实质和核心。"},{"t":"s","n":7,"stem":"从物到感觉和思想与从感觉和思想到物的对立，是","score":2,"opts":["唯物辩证法和形而上学的对立","直观反映论和能动反映论的对立","唯物主义一元论和唯心主义一元论的对立","唯物主义反映论和唯心主义先验论的对立"],"ans":"D","ana":"唯物主义和唯心主义对认识本质的不同回答。在认识的本质问题上，存在着两条根本对立的认识路线：一条是坚持从物到感觉和思想的唯物主义认识路线，另一条是坚持从思想和感觉到物的唯心主义认识路线。唯物主义认识路线坚持反映论的立场，认为认识是主体对客体的反映，人的一切知识都是从后天接触实际中得来的。唯心主义认识路线否认认识是人脑对客观世界的反映，本质上是唯心主义先验论，使认识成了无源之水、无本之木。（P81-82）"},{"t":"s","n":8,"stem":"一个完整的认识过程包括两次飞跃，下列选项属于第二次飞跃的是","score":2,"opts":["收集感性材料","分析实际情况","提出科学假说","理论付诸实践"],"ans":"D","ana":"从认识到实践：从实践到认识，认识的过程还没有完成。要实现一个完整的认识过程，还必须由认识再回到实践中去，实现认识的第二次能动飞跃。（P88）"},{"t":"s","n":9,"stem":"哲学家们只是用不同的方式解释世界，问题在于改变世界的提出者是","score":2,"opts":["圣西门","费希特","马克思","恩格斯"],"ans":"C","ana":"“马克思指出：哲学家们只是用不同的方式解释世界，而问题在于改变世”界。（P14）"},{"t":"s","n":10,"stem":"社会存在是指","score":2,"opts":["社会物质生活条件的总和","地理环境和人口因素的总和","生产力和生产关系的总和","经济制度和政治体制的总和"],"ans":"A","ana":"社会存在是指社会物质生活条件，是社会生活的物质方面，主要包括自然地理环境、人口因素和物质生产方式。"},{"t":"s","n":11,"stem":"上层建筑对经济基础的反作用集中表现为","score":2,"opts":["它被经济基础决定","它反映经济基础的要求","它为经济基础服务","它适应经济基础的变化"],"ans":"C","ana":"上层建筑对经济基础具有反作用。集中表现在：上层建筑为自己的经济基础的形成和巩固服务，确立或维护其在社会中的统治地位。"},{"t":"s","n":12,"stem":"划分阶级的唯一标准是","score":2,"opts":["政治标准","经济标准","法律标准","道德标准"],"ans":"B","ana":"阶级首先是一个经济范畴，阶级就是在以生产资料私有制为基础的社会生产体系中处于不同地位的各个社会集团，其中一个集团能够占有另一个集团的劳动。"},{"t":"s","n":13,"stem":"关于人在历史上的作用，唯物史观认为","score":2,"opts":["每个人都在历史发展中起一定的作用","每个人都在历史发展中起同样的作用","历史人物对历史发展的作用都是积极的","普通个人对历史发展的作用是可忽略的"],"ans":"A","ana":"唯物史观从人民群众创造历史这一基本前提出发，既明确了人民群众是历史的创造者，也不否认个人在历史上的作用。个人在历史上的作用存在差别。有的人作用大些，可称为\"”历史人物;“有的人作用小些，可称为\"”普通个人。历史人物对历史发展有深刻影响，甚至有时能够决定个别历史事件的结局，从而导致历史发生这样或那样的重大变化。从其发挥作用的性质来看，有些历史人物起推动历史前进的进步作用，有些起阻碍历史前进的反动作用。"},{"t":"s","n":14,"stem":"下列关于使用价值和价值关系的理解中，正确的是","score":2,"opts":["使用价值与价值二者间是等比例关系","使用价值与价值二者间是正比例关系","使用价值与价值二者间是反比例关系","使用价值为零时，价值也为零"],"ans":"D","ana":"一种物品如果没有使用价值，就是无用之物，即使人们为它付出了大量的劳动，也没有价值。"},{"t":"s","n":15,"stem":"从物质形态看，由一定数量的生产资料和劳动力所构成的资本构成是","score":2,"opts":["资本价值构成","资本技术构成","资本有机构成","资本积累构成"],"ans":"B","ana":"在资本主义企业内部，资本家投入资本主义生产过程的资本，从自然形式上看，总是由一定数量的生产资料和劳动力构成的。在生产资料和劳动力之间，存在着一定比例，这个比例取决于生产技术的发展水平。生产技术水平越高，每个劳动力所推动的生产资料的数量就越多；生产技术水平越低，每个劳动力所推动的生产资料的数量就越少。这种由生产的技术水平所决定的生产资料和劳动力之间的比例，叫作资本的技术构成。"},{"t":"s","n":16,"stem":"利润率是剩余价值率的转化形式,它是（）","score":2,"opts":["剩余价值与不变资本的比率","剩余价值与可变资本的比率","剩余价值与所费总资本的比率","剩余价值与预付总资本的比率"],"ans":"D","ana":"利润是剩余价值的转化形式，它表现为全部预付资本的产物，因此，剩余价值与预付总资本的比率就是利润率。利润率是剩余价值率的转化形式。"},{"t":"s","n":17,"stem":"经济危机的周期性爆发，使资本主义再生产也具有了周期性。资本主义再生产周期中决定性的阶段是","score":2,"opts":["复苏阶段","萧条阶段","危机阶段","高涨阶段"],"ans":"C","ana":"经济危机的周期爆发，使资本主义再生产也具有了周期性，从一次危机的开始到下一次危机的开始，其间所经历的时间便是一个再生产的周期，资本主义再生产周期一般来说包括危机、萧条、复苏、高涨四个阶段。其中，危机阶段是再生产周期的决定性阶段。"},{"t":"s","n":18,"stem":"资本主义国家三权分立制度的三权指的是","score":2,"opts":["立法权、财政权和监督权","立法权、财政权和司法权","财政权、监督权和司法权","立法权、行政权和司法权"],"ans":"D","ana":"所谓三权分立只是资产阶级内部的权力分立，而绝不是与劳动人民或其他阶层分享权力。"},{"t":"s","n":19,"stem":"垄断资本主义的历史作用是","score":2,"opts":["实现经济全球化和福利社会化","实现资源配置市场化和全球化","为更高级的生产方式创造物质条件","为更高级的生产方式创造社会条件"],"ans":"C","ana":"马克思指出：发展社会劳动生产力，是资本主义的历史任务和存在理由。资本正是以此不自觉地为一个更高级的生产形式创造物质条件。"},{"t":"s","n":20,"stem":"通过大企业之间较稳定的协议形成的，在生产或流通的某些环节实行垄断经营的垄断企业组织形式是","score":2,"opts":["卡特尔","辛迪加","托拉斯","康采恩"],"ans":"A","ana":"卡特尔，即通过生产或经营同类产品的一些大型垄断企业之间较稳定的垄断协议形成的、在生产或流通的某个或某些环节实行垄断的组织形式。"},{"t":"s","n":21,"stem":"金融寡头在政治上的统治主要是通过","score":2,"opts":["“”实行个人联合来实现","建立金融研究机构来实现","“”实行参与制来实现","掌控互联网和新闻媒介来实现"],"ans":"A","ana":"金融寡头在掌握了经济上的控制权后，又在政治上进一步控制上层建筑，利用政权“的力量来加强其统治地位。金融寡头对国家机器的控制，主要是通过同政府的个人联”合来实现的。"},{"t":"s","n":22,"stem":"下列选项属于国家与私人资本在企业内部的结合形式的是","score":2,"opts":["财政支持和再分配","政府收购私人企业","国民经济计划化","政府的加工订货"],"ans":"B","ana":"国家和私人资本在企业内部的结合，也即资本主义国家中的国有资本与私人资本结合在一个企业中的经济形式。这种国有经济和私人经济的结合，既可以是国家和私人资本共同投资于一个新的企业，也可以是国家通过出售一部分国有企业的股份，从而形成国家和私人资本共有的企业，还可以通过国家收购一部分原私有企业的股份而形成国家与私人资本相结合的企业。"},{"t":"s","n":23,"stem":"1921 年春，列宁果断地结束战时共产主义，转而实行新经济政策，新经济政策的主要特征是","score":2,"opts":["优先发展重工业","发展商品经济","取消商品货币关系","实行余粮收集制度"],"ans":"B","ana":"1921 年3 月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策。"},{"t":"s","n":24,"stem":"关于经济文化相对落后国家率先进入社会主义这一历史现象，下列表述正确的是","score":2,"opts":["它有其历史必然性","它违背历史发展规律","“”它是反常现象","“”它是早产儿"],"ans":"A","ana":"俄国、中国等经济文化相对落后的国家先于发达资本主义国家进入社会主义,不是偶然的，而有其历史必然性。"},{"t":"s","n":25,"stem":"马克思主义经典作家所讲的共产主义社会第一阶段或低级阶段是指","score":2,"opts":["过渡时期","社会主义社会","社会主义初级阶段","共产主义阶段"],"ans":"B","ana":"社会主义社会是共产主义社会的第一阶段，又称共产主义社会的初级阶段或低级阶段。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"什么是马克思主义？","score":6,"ans":"马克思主义是由马克思、恩格斯创立并为后继者所不断发展的科学理论体系，是关于自然、社会和人类思维发展一般规律的学说，是关于社会主义必然代替资本主义、最终实现共产主义的学说，是关于无产阶级解放、全人类解放和每个人自由而全面发展的学说，是无产阶级政党和社会主义国家的指导思想，是指引人民创造美好生活的行动指南。"},{"t":"short","n":27,"stem":"简述实践是检验真理的唯一标准。","score":6,"ans":"(1)这是由真理的本性和实践的特点决定的：真理是人们对客观事物及其发展规律的正确反映，其本性在于主观和客观相符合。实践具有直接现实性，这是它的客观实在性的具体表现(2)已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果。逻辑证明不能取代实践作为检验真理的标准，实践才是检验真理的唯一标准。"},{"t":"short","n":28,"stem":"简述货币的本质及职能。","score":6,"ans":"（1）货币：固定充当一般等价物的商品。（2①）货币的职能：价值尺度职②③④⑤能。流通手段职能。贮藏手段职能。支付手段职能。世界货币职能。"},{"t":"short","n":29,"stem":"资本主义国家如何利用利率调节经济？","score":6,"ans":"利率调节主要是通过利率高低和差别利率来实现某些宏观经济目标。例如，对国家支持的产业或企业给予优惠的信贷条件，鼓励其发展；相反，对国家要控制的经济活动则用较严格的信贷条件来制约。在经济过热时，适当提高利率，给经济降温；相反，在需要刺激经济发展、走出萧条与不景气阴影的时候，则适当降低利率来刺激投资与消费。"},{"t":"short","n":30,"stem":"马克思主义政党在社会主义建设和改革中的领导核心作用主要体现在哪些方面？","score":6,"ans":"（1）在思想方面，马克思主义政党要确保自己在意识形态领域的领导地位，确保马克思主义在社会主义国家的指导地位。（2）在政治方面，马克思主义政党要在社会主义民主政治建设和政治体制改革中起到领导核心作用，保证社会主义建设的正确方向。（3）在组织方面，马克思主义政党要领导全体人民有组织、有系统、有管理、有序地进行社会主义的各项建设事业。"}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"意识的能动性主要表现在哪些方面？在社会主义现代化建设中如何正确发挥人的主观能动性？","score":10,"ans":"（1）意识对物质具有反作用。这种反作用就是意识的能动作用，表现在：意识具有目的性和计划性、意识具有创造性、意识具有指导实践改造客观世界的作用、意识具有调控人的行为和生理活动的作用。（2）正确发挥人的主观能动性的前提是从实际出发；正确发挥人的主观能动性的根本途径是实践；正确发挥人的主观能动性，还依赖于的物质条件和物质手段。"},{"t":"essay","n":32,"stem":"社会改革的实质是什么？社会改革在社会发展中的作用表现在哪些方面？","score":10,"ans":"（1）实质：是社会制度的自我调整和完善。（2①）作用：改革是社会制度的自②我调整和完善，是推动社会发展的重要动力。改革是解决社会基本矛盾、促进生产力发③展、推动社会进步的有效途径和手段。中国的社会主义改革是社会主义制度的自我完善和自我发展，改革是社会主义社会发展的强大动力。"},{"t":"essay","n":33,"stem":"试述劳动力商品的特点及价值决定。","score":10,"ans":"（1）像任何商品一样，劳动力商品也具有价值和使用价值。但是，劳动力是特殊“的商品，它的价值和使用价值具有不同于普通商品的特点。劳动力的价值，是由生产、”①发展、维持和延续劳动力所必需的生活必需品的价值决定的。它包括三个部分：维持②劳动者本人生存所必需的生活资料的价值；维持劳动者家属的生存所必需的生活资料的③价值；劳动者接受教育和训练所支出的费用。由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动者所必需的生活资料的数量和构成是有区别的，所以劳动力价值的最低界限是由生活上不可缺少的生活资料的价值决定的。一旦劳动力价值降低到这个界限以下，劳动力就只能在萎缩的状态下维持。（2）劳动力商品在使用价值上有一个很突出的特点，就是它的使用价值是价值的源泉，在消费过程中能够创造新的价值，而且这个新的价值比劳动力本身的价值更大。"}]}],"code":"15044","qaNotes":[]},{"paper":"marx-2510","subject":"marx","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"在马克思主义理论体系中，马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其（）","score":2,"opts":["基本内涵","主要特征","根本性质","主体内容"],"ans":"D","ana":"马克思主义理论体系的主体内容由马克思主义哲学、马克思主义政治经济学和科学社会主义三部分构成。三者相互联系、有机统一，共同支撑起马克思主义的理论框架。"},{"t":"s","n":2,"stem":"下列选项属于为马克思主义的创立提供了直接理论来源的是（）","score":2,"opts":["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],"ans":"C","ana":"马克思主义的直接理论来源包括德国古典哲学、英国古典政治经济学和英法两国的空想社会主义。德国古典哲学（以黑格尔辩证法和费尔巴哈唯物主义为代表）为马克思主义哲学的创立提供了重要理论借鉴。"},{"t":"s","n":3,"stem":"唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于（）","score":2,"opts":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"ans":"C","ana":"唯物主义和唯心主义的根本分歧在于对物质和意识谁是世界本源问题的不同回答。唯物主义认为物质是本原，唯心主义认为意识是本原。"},{"t":"s","n":4,"stem":"客观实在性作为物质的唯一特性，体现的是（）","score":2,"opts":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"ans":"D","ana":"物质的唯一特性是客观实在性，这一特性既适用于自然领域的存在（如山川河流），也适用于社会领域的存在（如生产方式、社会关系），是二者的共同特性。"},{"t":"s","n":5,"stem":"“马克思指出：观念的东西不外是移入人脑并在人的头脑中改造过的物质的东”西而已。这就是说（）","score":2,"opts":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"ans":"B","ana":"马克思的这句话表明，意识的内容来源于客观物质世界，是人脑对客观事物的主观反映。意识并非人脑凭空产生，而是对物质的能动改造后的结果，既不是人脑的分泌物（庸俗唯物主义观点），也不是虚幻影像。"},{"t":"s","n":6,"stem":"在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是（）","score":2,"opts":["内容和形式","本质和现象","原因和结果","现实和可能"],"ans":"D","ana":"现实范畴反映事物当下的实际存在状态，可能范畴反映事物未来发展的潜在趋势，二者揭示了事物过去、现在与将来的联系。内容与形式反映事物的构成与表现方式，本质与现象反映事物的内在联系与外在表现，原因与结果反映事物的前后相继、引起与被引起关系。"},{"t":"s","n":7,"stem":"认识的本质是主体在实践基础上对客体的能动反映，这是一种（）","score":2,"opts":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"ans":"C","ana":"辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，既强调实践的决定性作用，又承认认识的能动性。主观唯心主义认识论否认客观客体的存在，客观唯心主义认识论将认识归结为对绝对精神的把握，旧唯物主义认识论否认认识的能动性。"},{"t":"s","n":8,"stem":"轻视理性认识而片面夸大感性认识的作用，会导致实践中的（）","score":2,"opts":["实用主义","怀疑主义","教条主义","经验主义"],"ans":"D","ana":"经验主义片面夸大感性认识的作用，轻视理性认识的指导意义，认为只有感性经验才是可靠的认识来源。实用主义强调认识的实际效用，怀疑主义否认认识的可能性，教条主义片面夸大理性认识的作用，轻视感性经验。"},{"t":"s","n":9,"stem":"实践是检验真理的唯一标准，这是因为（）","score":2,"opts":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],"ans":"D","ana":"实践之所以是检验真理的唯一标准，核心在于实践具有直接现实性——它能将主观认识转化为客观现实，通过实际结果验证认识是否符合客观规律。其他选项虽表述正确，但并非这一命题的根本原因。"},{"t":"s","n":10,"stem":"中国共产党的思想路线的核心是（）","score":2,"opts":["自信自立","守正创新","实事求是","自我革命"],"ans":"C","ana":"中国共产党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。其中，实事求是是思想路线的核心。"},{"t":"s","n":11,"stem":"社会历史观的基本问题是（）","score":2,"opts":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"ans":"A","ana":"社会存在与社会意识的关系问题，是社会历史观的基本问题。正确认识社会存在与社会意识的关系，是科学把握人类社会发展规律的基础和前提。"},{"t":"s","n":12,"stem":"社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是（）","score":2,"opts":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"ans":"B","ana":"社会存在包括自然地理环境、人口因素和物质生产方式（生产力与生产关系的统一）。政治法律思想属于社会意识的范畴，是上层建筑的重要组成部分。"},{"t":"s","n":13,"stem":"下列各项正确说明经济基础与上层建筑的关系的是（）","score":2,"opts":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"ans":"A","ana":"经济基础与上层建筑的关系中，经济基础处于决定地位：经济基础的性质决定上层建筑的性质，经济基础的变化发展决定上层建筑的变化发展。上层建筑具有相对独立性，并非与经济基础同步变化，也不能决定经济基础。"},{"t":"s","n":14,"stem":"从商品二因素与劳动二重性的关系考察商品经济中能够形成商品价值的劳动是（）","score":2,"opts":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"ans":"C","ana":"商品二因素（使用价值和价值）对应劳动二重性（具体劳动和抽象劳动）。具体劳动创造商品的使用价值，抽象劳动（无差别的人类一般劳动）形成商品的价值。"},{"t":"s","n":15,"stem":"下列关于商品价值量决定关系的表述中，正确的是（）","score":2,"opts":["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],"ans":"A","ana":"商品的价值量由社会必要劳动时间决定，二者成正比——社会必要劳动时间越长，——价值量越大。劳动生产率（单位时间内生产的商品数量）与价值量成反比劳动生产率越高，单位商品耗费的社会必要劳动时间越少，价值量越小。"},{"t":"s","n":16,"stem":"资本主义社会中，劳动力成为商品要具备的基础条件，不包括（）","score":2,"opts":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"ans":"B","ana":"劳动力成为商品的两个基本条件：一是劳动者在法律上是自由人，能自主支配自己的劳动力；二是劳动者没有任何生产资料和生活资料，只能靠出卖劳动力为生。劳动者人身依附于资本家是封建制生产关系的特征，并非劳动力成为商品的条件。"},{"t":"s","n":17,"stem":"资本主义社会经济危机会周期性爆发，但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段，其中有一个阶段是资本主义经济周期的必经阶段和基本阶段，这个阶段是（）","score":2,"opts":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"ans":"A","ana":"资本主义再生产周期包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是必经阶段和基本阶段，是资本主义基本矛盾激化的集中表现，决定了周期的性质和进程。"},{"t":"s","n":18,"stem":"资本主义国家政权采取分权制衡的组织形式，即三权分立制度，下列选项中不属于这三权的是（）","score":2,"opts":["监督权","司法权","行政权","立法权"],"ans":"A","ana":"三权分立制度中的三权指立法权、行政权和司法权，三者相互独立、相互制衡。监督权并非独立的三权之一，而是通过三权之间的制约关系实现的。"},{"t":"s","n":19,"stem":"垄断资本主义形成于19 世纪末20 世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为（）","score":2,"opts":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"ans":"A","ana":"19 世纪末20 世纪初形成的垄断资本主义，以私人垄断资本为基础，称为私人垄断资本主义。国家垄断资本主义是二战后发展起来的，指国家政权与私人垄断资本相结合的垄断资本主义。"},{"t":"s","n":20,"stem":"垄断资本主义国家的垄断组织虽然形式多种多样，但本质都是为了（）","score":2,"opts":["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],"ans":"B","ana":"垄断组织的形式（如卡特尔、辛迪加、托拉斯等）虽各不相同，但本质都是为了获——取垄断利润通过垄断价格（高于或低于生产价格的价格）实现的超额利润，是垄断资本主义的核心目标。"},{"t":"s","n":21,"stem":"第二次世界大战后，资本主义生产资料所有制发生了新的变化，成为居主导地位的所有制形式是（）","score":2,"opts":["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],"ans":"B","ana":"二战后，资本主义生产资料所有制发生新变化，法人资本所有制逐渐取代私人资本所有制，成为居主导地位的所有制形式。法人资本所有制是指法人股东（如企业法人、金融机构法人）控股的所有制形式。"},{"t":"s","n":22,"stem":"与通常意义上对金融资本概念的理解和使用不同，马克思主义政治经济学的金融资本概念有其独特内涵，它指的是垄断资本主义国家（）","score":2,"opts":["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],"ans":"D","ana":"马克思主义政治经济学中的金融资本，特指工业垄断资本和银行垄断资本在竞争中相互融合形成的新型垄断资本，并非泛指所有金融机构的资本或货币资本总和。"},{"t":"s","n":23,"stem":"无产阶级夺取政权的第一次伟大尝试是（）","score":2,"opts":["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],"ans":"B","ana":"1871 年的巴黎公社革命，是无产阶级第一次尝试建立自己的国家政权，为无产阶级革命积累了宝贵经验。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个社会主义国家。"},{"t":"s","n":24,"stem":"社会主义国家的最高政治领导力量是（）","score":2,"opts":["工会","社会党","共产党","共青团"],"ans":"C","ana":"社会主义国家的最高政治领导力量是共产党，这是由社会主义国家的性质和共产党的先进性决定的，是社会主义事业顺利发展的根本保证。"},{"t":"s","n":25,"stem":"共产主义社会的根本特征是（）","score":2,"opts":["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],"ans":"D","ana":"共产主义社会的根本特征是实现人的自由而全面的发展。人与自然和谐共生、精神境界极大提高、社会关系高度和谐都是共产主义社会的重要特征，但并非根本特征。"}]},{"title":"四、简答题","meta":"","items":[{"t":"short","n":26,"stem":"简述马克思主义的基本特征。","score":6,"ans":"马克思主义具有鲜明的科学性、人民性、实践性、发展性，这些特征体现了马克思主义的本质和使命，也展现出马克思主义的理论形象。马克思主义的基本特征，用一句话来概括就是科学性与革命性的统一。"},{"t":"short","n":27,"stem":"如何理解真理和谬误的关系？","score":6,"ans":"它们之间既对立又统一。(1)二者相互对立。在确定的对象和范围内，真理与谬误的对立是绝对的，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误。(2)①二者的对立又是相对的，它们在一定条件下能够相互转化。真理在一定条件下会转化为谬误。任何真理都是在一定范围内、一定条件下才能够成立，超出这个范围，失去特定条件，就会变成谬误。②谬误在一定条件下能够向真理转化。任何人都有可能犯错误，但勇③于正视、反省、修正错误，终能让错误转化为正确，谬误转化为真理。在批判谬误中发展真理，是谬误向真理转化的另一种形式。谬误可以起到反面教员的作用，警示人们要更加正确地认识世界。"},{"t":"short","n":28,"stem":"简述产业资本的运动中，实现资本顺利循环必须具备的两个基本前提条件。","score":6,"ans":"产业资本的运动，必须具备两个基本前提条件：一是产业资本的三种职能形式必须在空间上并存，也就是说，产业资本必须按照一定比例同时存在于货币资本、生产资本和商品资本三种形式中。二是产业资本的三种职能形式必须在时间上继起，也就是说，产业资本循环中三种职能形式的转化必须保持时间上的依次连续性。"},{"t":"short","n":29,"stem":"经济全球化的内涵和主要表现是什么？","score":6,"ans":"（1）内涵：经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出一国和地区的范围而相互联系、相互依赖的过程。（2①）主要表现：生产全球化；  ②③贸易全球化；金融全球化。"},{"t":"short","n":30,"stem":"简述马克思主义经典作家预见未来社会的方法论原则。","score":6,"ans":"(1)在揭示人类社会发展一般规律的基础上指明社会发展的方向。(2)在剖析资本主义旧世界的过程中阐发未来新世界的特点。(3)在社会主义社会发展中不断深化对未来共产主义社会的认识。(4)立足于揭示未来社会的一般特征，而不对各种细节作具体描绘。"}]},{"title":"五、论述题","meta":"","items":[{"t":"essay","n":31,"stem":"试述矛盾的普遍性、矛盾的特殊性的含义以及分析矛盾的特殊性的意义。","score":10,"ans":"(1)矛盾的普遍性是指矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动。我们所熟悉的“矛盾无处不在，矛盾无时不有，就是对”矛盾的普遍性的形象表述。矛盾的特殊性是指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上各有其特点。矛盾的特殊性决定了事物的不同性质。只有具体分析矛盾的特殊性，才能认清事物的本质和发展规律，并采取正确的方法和措施去解决矛盾，推动事物的发展。(2)矛盾的特殊性原理具有重要的方法论意义。分析矛盾的特殊性就是坚持具体问题具体分析。一方面，分析矛盾的特殊性是正确认识事物的基础。只有分析矛盾的特殊性，才能把不同的事物区别开来，正确地认识事物。另一方面，分析矛盾的特殊性是正确解决矛盾的关键。不同的矛盾只能用不同的方法解决，只有具体地分析矛盾的特殊性，才能找到正确解决某一特殊矛盾的特殊方法，即一把钥匙开一把锁，从而取得成功。如果千篇一律地用一种方法解决各种不同的矛盾，那就必然失败。因此，具体问题具体分析是马克思主义的活的灵魂。"},{"t":"essay","n":32,"stem":"什么是社会意识？如何理解社会意识相对独立性的含义及表现？","score":10,"ans":"（1）社会意识的含义：社会意识是社会存在的反映，是社会生活的精神方面。（2）社会意识相对独立性的含义：社会意识在从根本上受到社会存在决定的同时，还具有自身特有的发展形式和发展规律。（3）社会意识相对独①立性的表现：社会意识与②社会存在发展具有不完全同步性和不平衡性。社会意识内部各种形式之间存在相互影③响且各自具有历史继承性。社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。"},{"t":"essay","n":33,"stem":"试述资本主义为社会主义所代替的历史必然性。","score":10,"ans":"资本主义的内在矛盾决定了资本主义必然被社会主义所代替。（1）资本主义基本矛盾包含着现代的一切冲突的萌芽。（2）资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身。（3）国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏。（4）资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争。"}]}],"code":"15044","qaNotes":[]},{"paper":"xws-2104","subject":"xws","session":"2104","label":"2021年4月","code":"00537","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"首次使用“鲁迅”这一笔名的作品是","opts":["《祝福》","《孔乙己》","《狂人日记》","《阿Q正传》"],"ans":"C","score":1},{"t":"s","n":2,"stem":"20世纪20年代，以“平和冲淡、恬适淡远”的创作风格著称的散文家是","opts":["冰心","朱自清","郁达夫","周作人"],"ans":"D","score":1},{"t":"s","n":3,"stem":"台湾新文学的奠基者，被称为“台湾的鲁迅”的是","opts":["追风","赖和","柳裳君","云萍生"],"ans":"B","score":1},{"t":"s","n":4,"stem":"中国左翼作家联盟1930年3月2日成立，成立的地点是","opts":["北京","上海","广州","武汉"],"ans":"B","score":1},{"t":"s","n":5,"stem":"新月派中，明确提出“文学乃是基于固定普遍的人性”这一观点的是","opts":["徐志摩","朱湘","梁实秋","胡适"],"ans":"C","score":1},{"t":"s","n":6,"stem":"30年代重要的中篇小说《林家铺子》的作者是","opts":["茅盾","叶圣陶","沙汀","张天翼"],"ans":"A","score":1},{"t":"s","n":7,"stem":"巴金是一位富有理想追求进步的作家，对他青年时代影响最大的是","opts":["新民主主义","三民主义","无政府主义","社会主义"],"ans":"C","score":1},{"t":"s","n":8,"stem":"蒋光慈以“大革命”为背景，反映早期农民武装斗争以及知识分子成长历程的作品是","opts":["《野祭》","《冲出云围的月亮》","《丽莎的哀怨》","《咆哮了土地》"],"ans":"D","score":1},{"t":"s","n":9,"stem":"写出了苦难中农民忍辱负重性格名作《老马》的诗人是","opts":["艾青","臧克家","田间","何其芳"],"ans":"B","score":1},{"t":"s","n":10,"stem":"在30年代国防戏剧热潮中，被称为“国防戏剧的力作”的是","opts":["田汉的《回春之曲》","夏衍的《赛金花》","洪深执笔的《咸鱼主义》","于伶执笔的《汉奸的子孙》"],"ans":"B","score":1},{"t":"s","n":11,"stem":"毛泽东《在延安文艺座谈会上的讲话》论述了当时文艺界的许多重要问题，其中要解决的中心问题是","opts":["文艺公式化、概念化的问题","讽刺与暴露的问题","文艺为群众服务以及如何为群众服务的问题","文艺的普及与提高的问题"],"ans":"C","score":1},{"t":"s","n":12,"stem":"40年代台湾文坛的吴浊流，虽用日语创作却有着强烈的民族意识，他的长篇小说代表作是","opts":["《台湾女星》","《风水》","《水月》","《亚细亚的孤儿》"],"ans":"D","score":1},{"t":"s","n":13,"stem":"抗日战争进入相持阶段后，冯至以追求纯粹艺术、表现深层民族精神著称的诗集是","opts":["《十四行集》","《给战斗者》","《抗战诗抄》","《中国牧歌》"],"ans":"A","score":1},{"t":"s","n":14,"stem":"抗战期间艾青写了一组表现民族灾难深重命运的“北方组诗”，其中有一首是","opts":["《火把》","《太阳》","《向太阳》","《雪落在中国的土地上》"],"ans":"D","score":1},{"t":"s","n":15,"stem":"1956年“百花齐放，百家争鸣”期间出现了一批有独立见解的文艺论文，其中《电影锣鼓》一文的作者是","opts":["李希凡","秦兆阳","钱谷融","钟惦斐"],"ans":"D","score":1},{"t":"s","n":16,"stem":"50年代中期，现代主义文学思潮在香港悄然兴起，被视为代表其先声的刊物是","opts":["《诗朵》","《文艺新潮》","《新思潮》","《好望角》"],"ans":"A","score":1},{"t":"s","n":17,"stem":"以《剪辑错了的故事》等为代表，对极左路线进行深刻批判的小说潮流是","opts":["伤痕小说","反思小说","改革小说","寻根小说"],"ans":"B","score":1},{"t":"s","n":18,"stem":"高晓声《“漏斗户”主》刻画的底层农民形象是","opts":["陈奂生","李顺大","张种田","隋抱朴"],"ans":"A","score":1},{"t":"s","n":19,"stem":"贾平凹刻画了新型农民金狗形象的作品是","opts":["《高老庄》","《废都》","《土门》","《浮躁》"],"ans":"D","score":1},{"t":"s","n":20,"stem":"高行健戏剧中，被视为多声部哲理剧典范的作品是","opts":["《绝对信号》","《车站》","《野人》","《假如我是真的》"],"ans":"C","score":1}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"30年代的中国现代文学具有鲜明的时代性，内容上的特征有","opts":["茅盾等左翼作家运用科学的社会理论剖析中国社会","题材非常广泛，反映农民苦难和反抗斗争的作品成就突出","老舍和京派作家等致力于从文化层面批判社会，探究人生","新兴的都市文学引人瞩目","大力表现根据地的新型军民关系"],"ans":"ABCD","score":2},{"t":"m","n":22,"stem":"40年代以社会剖析和世情讽刺为主题的小说名作有","opts":["张恨水的《五子登科》","张天翼的《华威先生》","沙汀的《在其香居茶馆里》","老舍的《骆驼祥子》","茅盾的《腐蚀》"],"ans":"ABCE","score":2},{"t":"m","n":23,"stem":"下列关于解放区歌谣体新诗代表作《王贵与李香香》的表述，准确的有","opts":["作者是李季","将爱情的纯真和革命的曲折性结合在一起","借鉴、创新了“信天游”民歌形式","被茅盾誉为“民族形式的史诗”","体现了《讲话》提倡的文艺大众化、民族化精神"],"ans":"ABCDE","score":2},{"t":"m","n":24,"stem":"老舍在《茶馆》中用“一个茶馆三幕戏”埋葬了三个时代，这三个时代是指","opts":["鸦片战争时期","甲午战争时期","戊戌变法失败后","辛亥革命失败后北洋军阀统治时期","抗战胜利后国民党统治时期"],"ans":"CDE","score":2},{"t":"m","n":25,"stem":"下列关于《绿化树》的表述，准确的有","opts":["作者是张贤亮","“十七年文学”的代表性作品","描写知识分子章永璘的肉体磨难与灵魂洗涤","塑造了马缨花、海喜喜等劳动者形象","赞美了革命战士的英雄壮举和高贵品格"],"ans":"ACD","score":2}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"w","n":26,"stem":"语丝社","ans":"（1）“语丝社”创办于1924年，因办《语丝》周刊而得其名。（2）主要成员有鲁迅、周作人、林语堂、孙伏园等；《语丝》多发表针砭时弊的杂感小品，倡导幽默泼辣的“语丝文体”。","score":4},{"t":"w","n":27,"stem":"《金锁记》","ans":"（1）《金锁记》是张爱玲的小说作品，描述了新旧交替的中国都市男女的经历，集中地暴露了每个人心中的那种邪恶性。（2）主角曹七巧在现实的压迫下性格变态，容不得任何美好的东西，甚至自己儿女的婚姻幸福也成了她的眼中钉、肉中刺，非加以毁坏就不能使她称心，这是对中国读者熟悉的传统慈母形象的彻底解构，也揭示了压抑人性的封建文化对人心灵的巨大戕害。","score":4},{"t":"w","n":28,"stem":"“北京诗群”","ans":"（1）新时期出现于北京的诗人群体，主要成员有海子、西川、骆一禾等人。（2）坚持严肃认真的诗歌精神和人文传统，具有浪漫性和唯美性的艺术特色。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简析沈从文小说《边城》的文化意蕴。","ans":"（1）作品要表现的是一种“优美、健康、自然又不悖乎人性的人生形式”。（2）作品渲染了茶峒民风的轻利重义、守信自约，作者试图将这种理想化的生命形式保留在青年人的血里或梦里，去重造民族的品德。（3）《边城》的世界并不平静，作者写母女两代人婚姻悲剧的“轮回”，流露出深沉的悲情。","score":8},{"t":"w","n":30,"stem":"简析赵树理小说人物形象塑造的特色。","ans":"（1）不刻意拔高农民形象，表现其革命性的同时，也关注他们的落后性和局限性，展现了现实主义的创作精神。（2）创造了一种新的评书体的小说形式，注重在叙述故事中介绍人物，将人物放到具体情境中加以表现，以人物语言、行动揭示其心理和性格。（3）人物设置具有明显对称性，加强了小说的故事性。","score":8},{"t":"w","n":31,"stem":"简析罗广斌、杨益言小说《红岩》的艺术特点。","ans":"（1）作品主要描写共产党人在重庆国民党监狱中的顽强斗争，通过尖锐复杂的矛盾冲突和惊心动魄的斗争场面刻画人物形象，具有扣人心弦的传奇色彩。（2）采用了多线索的网状结构方式，通过一些重点人物的活动，将集中营的斗争、地下党领导的工人运动和根据地的武装斗争三条线索联系起来，既着力描写斗争场面，又能注意它们与线索展开的内在关系。","score":8},{"t":"w","n":32,"stem":"简述巴金《随想录》的思想价值。","ans":"（1）“说真话”是《随想录》最为显著的思想价值。（2）强烈的“说真话”的意识促使巴金对自己的过去进行严格的自审。（3）把自审上升到对整个民族反思的高度，表现了作家的忧患意识。（4）通过对亲朋故人的哀思，控诉了造成许多人间悲剧的“文革”。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合《红烛》《死水》中的具体作品，论述闻一多爱国主义诗篇的思想内容。","ans":"（1）闻一多被朱自清誉为五四时期“唯一的爱国诗人”，贯穿两本诗集的诗魂，是其浓烈真挚的爱国主义情思。（2）歌颂祖国，思恋祖国，如《太阳吟》《秋菊》。（3）反帝、反种族歧视，如《洗衣歌》。（4）抒发对当时国家现状强烈的失望，表达了因爱极而生的憎恨，如《发现》《死水》。（5）表达对祖国新生的信念，如《一句话》。","score":13},{"t":"w","n":34,"stem":"结合作品内容，分析曹禺话剧《雷雨》中的繁漪的形象。","ans":"（1）新思潮的冲击使出身名门的繁漪自我意识觉醒，渴望得到自由和幸福，然而她却生活在一个带有浓厚封建色彩的资产阶级家庭。（2）繁漪痛苦地忍受着周朴园的专制，性格被扭曲，变得乖戾阴郁，最后爆发为反抗与报复。（3）繁漪与周萍的乱伦，相当程度上是被环境逼迫的悲剧，繁漪不顾一切地抓住周萍不放，显示了反封建道德的勇气。（4）繁漪为爱舍弃了名誉、名分，却发现再次受骗，最后她毁了周公馆，也毁灭了自己。“雷雨”般的性格，使繁漪成为五四新文学人物画廊里一个令人瞩目的艺术形象。","score":13}]}],"qaNotes":[]},{"paper":"xws-2110","subject":"xws","session":"2110","label":"2021年10月","code":"00537","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"鲁迅小说集《呐喊》初版时收入15篇，1930年第13次印刷时抽掉的一篇是","opts":["《狂人日记》","《孔乙己》","《不周山》","《药》"],"ans":"C","score":1},{"t":"s","n":2,"stem":"中国现代文学史上的第一部短篇小说集是","opts":["鲁迅的《呐喊》","汪敬熙的《雪夜》","郁达夫的《沉沦》","叶绍钧的《隔膜》"],"ans":"C","score":1},{"t":"s","n":3,"stem":"洪深借鉴奥尼尔《琼斯皇》的戏剧手法，以大段独白表现人物的恐惧心理，令人耳目一新的剧作是","opts":["《卖梨 ","opts":["伊蕾","翟永明","海男","陆忆敏"],"ans":"B","score":1}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"下列人物出自鲁迅小说《阿Q正传》的有","opts":["华老栓","小D","假洋鬼子","祥林嫂","王胡"],"ans":"BCE","score":2},{"t":"m","n":22,"stem":"下列属于郭沫若心理分析小说的有","opts":["《残春》","《喀尔美罗姑娘》","《叶罗提之墓》","《春风沉醉的晚上》","《倪焕之》"],"ans":"ABC","score":2},{"t":"m","n":23,"stem":"下列关于小说《八骏图》的表述，准确的有","opts":["作者沈从文","以翠翠的命运为中心展开叙述","专注于对知识者人格的解剖","主要描写农村自然经济的破产","着重批判病态的现代文明"],"ans":"ACE","score":2},{"t":"m","n":24,"stem":"下列关于三毛散文创作的思想及艺术特点的表述，准确的有","opts":["以经历的独特性和探险性取胜","着重写了作者游历中与荷西的爱情","多愁善感的文字和充满正义感的议论相结合","具有率真、传奇、浪漫的特质","语言气势磅礴、刚劲有力"],"ans":"ABCD","score":2},{"t":"m","n":25,"stem":"下列小说中，属于莫言的作品有","opts":["《许三观卖血记》","《红高粱》","《丰乳肥臀》","《檀香刑》","《古船》"],"ans":"BCD","score":2}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"文学研究会","ans":"（1）文学研究会于1921年1月在北京成立。（2）发起人有周作人、郑振铎、沈雁冰、叶绍钧等人，《小说月报》是文学研究会的会刊。（3）一般称文学研究会的创作为“人生派”或“为人生”的文学。（4）在创作方法上强调写实主义。","score":4},{"t":"term","n":27,"stem":"《上海屋檐下》","ans":"（1）夏衍的剧作，是他30年代转向现实主义创作的真正起点。（2）通过上海一幢普通弄堂里五户人家的日常生活，反映时代潮流在人们心灵上荡漾起的涟漪，提示人们：“不，人不能这样生活！”","score":4},{"t":"term","n":28,"stem":"“现代派小说”","ans":"（1）滥觞于1979年的“意识流小说”，主要有宗璞的《我是谁》、茹志鹃的《剪辑错了的故事》及王蒙的部分作品。（2）刘索拉的中篇小说《你别无选择》、徐星的《无主题变奏》、残雪的《苍老的浮云》等作品具有更自觉的现代意识，产生了重要影响。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简析朱自清散文的创作特色。","ans":"（1）真挚深厚的感情注入，擅长写父子之情、夫妇之情、儿女之情。（2）善用比喻、比拟、通感等手法，融情入景，情景交融。（3）缜密精巧的构思，匠心独运。（4）叙述语言具谈话风，描写语言修辞繁复、华美瑰丽。","score":8},{"t":"w","n":30,"stem":"简析曹禺话剧《日出》的结构艺术。","ans":"（1）采用横断面的描写方法，用诸多生活片段构成一幅完整的画面。（2）用“损不足以奉有余”的社会批判性主题统率全剧，借助贯穿全剧的线索人物强化戏剧结构的整体性。（3）采用暗场处理的方法，如未出场的金八、打夯工人的歌声，强化全剧节奏的协调性。","score":8},{"t":"w","n":31,"stem":"简析吴强小说《红日》的思想内容。","ans":"（1）小说以孟良崮战役为重点，再现华东野战军粉碎敌人重点进攻、变战略防御为战略进攻的历程。（2）正面写了华东野战军的战斗场面和过程，同时叙述了广阔的军旅生活风情，拓展了军旅文学的范围。（3）表现人物的复杂性格，既写出了我军高级将领的共性和个性，也写出了非人民武装力量的代表人物张灵甫的复杂性。","score":8},{"t":"w","n":32,"stem":"简述贾平凹小说《浮躁》的思想价值。","ans":"（1）通过封建家族势力与农民改革者之间的冲突，展示了城乡改革（尤其是农村改革）所面临的政治、经济、文化心理方面的重重障碍。（2）书写了时代的骚动不安、旧价值观的毁灭和新价值观的萌动。（3）提出了新一代农民在改革大潮中的自我觉醒、自我拯救的多重历史使命。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合作品，分析茅盾《子夜》中吴荪甫的形象。","ans":"（1）吴荪甫的所作所为显示了民族资产阶级的两重性：一方面反对帝国主义的经济压迫与侵略，期待着民族自强；另一方面又对工人阶级和农民运动满怀仇恨；一方面不满国民党的无能统治，同时又要依靠其反动力量去镇压工人运动。（2）吴荪甫的两重性决定了他性格的复杂性和矛盾性，决定了他的色厉内荏与外强中干以及他不可避免的失败命运。（3）吴荪甫是特定历史环境下中国民族资产阶级的一个失败的英雄，他的悲剧是整个中国民族资产阶级的悲剧。作品揭示了当时中国社会的半封建半殖民地的性质，说明资本主义道路在中国是行不通的。","score":13},{"t":"w","n":34,"stem":"结合具体诗篇论述艾青诗歌的艺术建树。","ans":"（1）注重诗歌意象的选取和诗歌形象创造，特别注重采用具有丰富底蕴的意象，如“土地”和“太阳”等意象，增强了作品的艺术感染力。（2）注重感觉印象与主观感情有机融合，引起人们丰富的联想，如《旷野》等。（3）追求散文化语言和自由体形式的融合，以散文式的诗句自由地抒写，辅之以有规律的排比和反复，形成了和谐的节奏与回荡的旋律。","score":13}]}],"qaNotes":[]},{"paper":"xws-2204","subject":"xws","session":"2204","label":"2022年4月","code":"00537","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"“文学革命”初期，《新青年》发表了“双簧信”。其中回复王敬轩来信，逐一驳斥各种反对派文学观点的是（）。","opts":["钱玄同","刘半农","罗家伦","傅斯年"],"ans":"B","score":1},{"t":"s","n":2,"stem":"下列鲁迅杂文集中，属于鲁迅后期杂文的是（）。","opts":["《热风》","《坟》","《二心集》","《华盖集》"],"ans":"C","score":1},{"t":"s","n":3,"stem":"下列属于文学研究会成员的一组是（）。","opts":["沈雁冰、郁达夫、成仿吾","胡适、冰心、朱自清","周作人、王统照、张资平","周作人、沈雁冰、叶绍钧"],"ans":"D","score":1},{"t":"s","n":4,"stem":"民主主义作家为30年代的文学发展做出了巨大贡献，下列刊物中由他们创办的是（）。","opts":["《创造月刊》","《文化批判》","《文学季刊》","《太阳月刊》"],"ans":"C","score":1},{"t":"s","n":5,"stem":"改组《小说月报》，撰写《小说月报》革新宣言，提出“文学为人生”主张的是（）。","opts":["许地山","王统照","叶圣陶","沈雁冰"],"ans":"D","score":1},{"t":"s","n":6,"stem":"中篇小说《二月》通过萧涧秋坎坷命运探讨小资产阶级知识分子精神出路，作者是（）。","opts":["柔石","丁玲","张天翼","萧红"],"ans":"A","score":1},{"t":"s","n":7,"stem":"吴组缃表现封建禁欲主义环境中二姑姑情感矛盾的短篇小说是（）。","opts":["《离家的前夜》","《箓竹山房》","《一千八百担》","《樊家铺》"],"ans":"B","score":1},{"t":"s","n":8,"stem":"30年代以何其芳、卞之琳、徐迟为代表，具有唯美色彩、与新月派思想倾向相近的诗歌流派是（）。","opts":["现代派","象征派","浪漫派","新格律派"],"ans":"A","score":1},{"t":"s","n":9,"stem":"下列作品中，文体上近乎散文诗的是（）。","opts":["丰子恺《缘缘堂随笔》","周作人《雨天的书》","夏衍《包身工》","何其芳《画梦录》"],"ans":"D","score":1},{"t":"s","n":10,"stem": ","n":25,"stem":"老舍《茶馆》的艺术成就有","opts":["匠心独运的艺术构思","个性鲜明的艺术典型","北京风味的戏剧语言","贯穿始终的故事情节和戏剧冲突","对现代派戏剧艺术的成功移植"],"ans":"ABC","score":2}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"w","n":26,"stem":"《凤凰涅槃》","ans":"（1）作者郭沫若，五四新诗的代表作。它借凤凰涅槃的故事，表达对中华民族及自我再生的渴望，体\n现了五四时代精神；（2分）\n（2）热情奔放，想象奇特，表现出积极浪漫主义的风格。（2分）","score":4},{"t":"w","n":27,"stem":"“中国左冀作家联盟”","ans":"（1） 1930年3月在上海成立，鲁迅、冯雪峰、冯乃超等四十余人出席了成立大会；（2分）\n（2）“左联”进行的一系列文学活动有：一加强对马克思主义文艺理论的译介与传播；二设立国际文\n化研究会，介绍苏联文学作品和西方进步作家的作品；三推进文艺大众化运动；四积极开展创作，鲁\n\n\n\n\n\n\n迅、茅盾、丁玲、张天冀等都有出色的成就，同时也培养了大批新作家。（2分）","score":4},{"t":"w","n":28,"stem":"“九叶诗派”","ans":"（1） 40年代中后期形成的一个追求现实主义与现代主义相结合的诗歌流派。因1980 年出版诗歌合集\n《九叶集》而得名，代表人物有穆旦等；（2分）\n（2）诗人“扎根现实”。诅咒黑暗、渴望光明，注重内心世界和外在世界统一，深受20 世纪西方文\n化与诗歌的影响，有很强的现代主义色彩。（2分）\n四、简答题：本大题共4小題，每小題8分，共32分。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简析曹禺话剧《日出》中的陈白露形象。","ans":"（1）《日出》的中心人物，美丽、聪慧。她以前的恋人方达生来访，唤醒了她“竹筠”时代的美好回忆。（2）她周旋于上流社会，嘲弄着那些玩弄她的人，却又不愿意离开这个环境，反映了她性格中软弱的一面；同时又能挺身救助贫弱无依的“小东西”等，表现出她身上的正义感。（3）陈白露像金丝笼中的鸟，失掉了自由飞翔的能力和意愿。她的死，是人性被金钱扼杀的悲剧。","score":8},{"t":"w","n":30,"stem":"简析戴望舒诗歌《雨巷》的艺术特色。","ans":"（1）把30年代知识青年的苦闷、幻灭、彷徨而又对理想充满期盼的复杂心态化作“丁香”“油纸伞”等意象。（2）具有浓重的象征意味，寂寥的雨巷、颓圮的篱墙、凄冷的细雨、哀婉的氛围以及幽怨的姑娘等，都是诗人内心世界的象征性反映。（3）将音乐美的追求发挥到了极致，其优美的旋律和流荡的节奏，“替新诗的音节开了一个新的纪元”。","score":8},{"t":"w","n":31,"stem":"简析沙汀小说《在其香居茶馆里》的艺术成就。","ans":"（1）杰出的讽刺艺术。以客观写实的笔墨，描绘可憎又可笑的人与事，作品有辛辣的讽刺力量。（2）独特的场景安排。人物刻画集中在其香居茶馆，茶馆格局的描写和气氛渲染有主有次、立体感强，生活气息浓郁。（3）精湛的结构艺术，采用双线结构，设置一明一暗两条线索，最后将其扭结到一起，造成具有讽刺力量的结局。","score":8},{"t":"w","n":32,"stem":"简析贺敬之诗歌的思想内容。","ans":"（1）贺敬之1949年以后的诗作大致分为两类：一类是有民歌气息或颇得古诗神髓的抒情短诗，另一类是表现我国政治生活重大题材、诗风豪放的长篇政治抒情诗。（2）诗人提出并回答政治生活及人生道路上的重大问题时，常先鸟瞰式展现历史和现实的图像，再以乐观向上的笔墨勾画出光辉前程，想象奇特丰富，充满抒情韵致。（3）某些诗作带有“左”的印痕，尤其政治抒情诗留有浮夸虚假的成分。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合具体作品论述叶绍钧小说创作的艺术风格。","ans":"（1）体现了文学研究会“为人生”小说的现实主义精神，又有自己的个人风格。（2）冷静观察、客观描写的创作态度。写实笔调严谨扎实，主观之“意”寓于人物和言行的刻画中，冷隽含蓄，如《潘先生在难中》写潘先生向红十字会要两面旗子后的使用，手上写着歌颂军阀的横幅，脑海中却放映着灾难中的真实画面。（3）严密细致、精于布局的篇章结构。如《潘先生在难中》《多收了三五斗》的结尾均意味深长。（4）叙述语言整饬、严谨、平实、纯正，对于现代汉语的规范化有积极意义。","score":13},{"t":"w","n":34,"stem":"结合《负暄琐话》《负暄续话》《负暄三话》，论述张中行散文的思想内容。","ans":"（1）记述了“现代硕儒”的嘉言懿行和怪言奇行，在看似不经意的评点中表达了个人的价值理念。（2）讲述了许多不见于“正史”“野史”的轶事，弥散着没有具体所指却又相当沉郁的难言个人隐痛。（3）描写了才女们的爱情生活、情感世界，并常常对那些终成眷属的男女流露出一种羡慕之情，隐于其中的忧伤和怅然在在可见。","score":13}]}],"qaNotes":[]},{"paper":"xws-2210","subject":"xws","session":"2210","label":"2022年10月","code":"00537","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"1917年1月胡适提出“八事”主张文章是（）","opts":["《文学改良刍议》","《建设的文学革命论》","《文学革命论》","《人的文学》"],"ans":"A","score":1},{"t":"s","n":2,"stem":"1919年加入新潮社，发表《这也是一个人》而正式步入新文坛作家是（）","opts":["俞平伯","汪敬熙","杨振声","叶绍钧"],"ans":"D","score":1},{"t":"s","n":3,"stem":"五四时期郭沫若以历史题材来影射现实问题，将主人公写成中国古代“娜拉”一部剧作是（）","opts":["《聂莹》","《卓文君》","《王昭君》","《貂蝉》"],"ans":"B","score":1},{"t":"s","n":4,"stem":"反映一代知识分子从“五四”到“五卅”心路历程的长篇小说《虹》作者是（）","opts":["茅盾","巴金","蒋光慈","郁达夫"],"ans":"A","score":1},{"t":"s","n":5,"stem":"沈从文反映了湘西民众重义轻利、守信自约品质，表现作者理想人生样式作品是（）","opts":["《八骏图》","《边城》","《绅士的太太》","《阿黑小史》"],"ans":"B","score":1},{"t":"s","n":6,"stem":"曹禺采用“回溯式”结构，用“过去的戏”推动“现代的戏”加强戏剧冲突的作品是（）","opts":["《日出》","《北京人》","《雷雨》","《原野》"],"ans":"C","score":1},{"t":"s","n":7,"stem":"以知识分子眼光表现边地下层民众生活、反映他们苦难中坚韧精神的短篇小说集《南行记》的作者是（）","opts":["艾芜","沙汀","吴组缃","张天翼"],"ans":"A","score":1},{"t":"s","n":8,"stem":"丁玲反映华北地区土改运动的著名长篇小说是（）","opts":["《暴风骤雨》","《太阳照在桑干河上》","《三里湾》","《种谷记》"],"ans":"B","score":1},{"t":"s","n":9,"stem":"叶紫反映新旧两代农民在勤劳致富问题上的观念冲突的作品是（）","opts":["《星》","《春蚕》","《秋收》","《丰收》"],"ans":"D","score":1},{"t":"s","n":10,"stem":"鲁迅在《白莽作〈孩儿塔〉序》中对白莽的诗歌给予了高度评价，白莽即诗人（）","opts":["蒋光慈","蒲风","殷夫","田间"],"ans":"C","score":1},{"t":"s","n":11,"stem":"引发抗战时期“讽刺和暴露”讨论的是张天翼的小说（）","opts":["《大林和小林》","《法律外的航线》","《包氏父子》","《华威先生》"],"ans":"D","score":1},{"t":"s","n":12,"stem":"反映淞沪抗战中爱国军民浴血奋战壮举的《第七连》的作者是（）","opts":["胡风","丘东平","穆旦","路翎"],"ans":"B","score":1},{"t":"s","n":13,"stem":"著名讽刺长篇小说《马伯乐》作者是（）","opts":["丁玲","苏青","萧红","萧军"],"ans":"C","score":1},{"t":"s","n":14,"stem":"以下对“九叶诗派”表述错误的是（）","opts":["追求现实主义与现代主义的结合","深受西方文化影响","以《中国新诗》等刊物为主要阵地","聚集了绿原、牛汉等诗人"],"ans":"D","score":1},{"t":"s","n":15,"stem":"贺敬之下列诗歌中采用陕北民歌“信天游”形式的作品是（）","opts":["《十年颂歌》","《回延安》","《雷锋之歌》","《放声歌唱》"],"ans":"B","score":1},{"t":"s","n":16,"stem":"老舍50年代初以其独特的艺术才力表现新社会，获得“人民艺术家”称号的作品是（）","opts":["《红大院》","《龙须沟》","《茶馆》","《春华秋实》"],"ans":"B","score":1},{"t":"s","n":17,"stem":"新时期文学开山之作是（）","opts":["张贤亮《男人的风格》","茹志鹃《剪辑错了的故事》","蒋子龙《乔厂长上任记》","刘心武《班主任》"],"ans":"D","score":1},{"t":"s","n":18,"stem":"性格怪诞、象征着民族病态“集体无意识”的丙崽形象出自韩少功的（）","opts":["《西望茅草地》","《爸爸爸》","《女女女》","《马桥词典》"],"ans":"B","score":1},{"t":"s","n":19,"stem":"“黑夜给了我黑色的眼睛，/我却用它寻找光明”出自（）","opts":["顾城《一代人》","梁小斌《中国，我的钥匙丢了》","杨炼《大雁塔》","北岛《回答》"],"ans":"A","score":1},{"t":"s","n":20,"stem":"下列作品中属于张中行创作的散文集是（）","opts":["《商州初录》","《干校六记》","《负暄琐话》","《云梦断忆》"],"ans":"C","score":1}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分；错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"下列作家中属于“新感觉派”的有（）","opts":["施蛰存","郁达夫","穆时英","冯乃超","刘呐鸥"],"ans":"ACE","score":2},{"t":"m","n":22,"stem":"下列作品中属于艾青创作的有（）","opts":["《漳河水》","《大堰河——我的保姆》","《雪落在中国的土地上》","《向太阳》","《我爱这土地》"],"ans":"BCDE","score":2},{"t":"m","n":23,"stem":"关于歌剧《白毛女》表述正确的有（）","opts":["取材于民间“白毛仙姑”的传说","由鲁艺集体创作，贺敬之、丁毅执笔","表现王贵与李香香真挚的爱情","民族民间音乐与西洋歌剧形式相结合","表达“旧社会把人逼成鬼，新社会把鬼变成人”的主题"],"ans":"ABDE","score":2},{"t":"m","n":24,"stem":"下列属于“新派武侠小说”代表作家有（）","opts":["郑证因","宫白羽","金庸","王度庐","梁羽生"],"ans":"CE","score":2},{"t":"m","n":25,"stem":"下列作品中属于汪曾祺故乡怀旧系列的有（）","opts":["《大淖记事》","《钟鼓楼》","《岁寒三友》","《八千岁》","《异秉》"],"ans":"ACDE","score":2}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"w","n":26,"stem":"“学衡派”","ans":"（1） 1922年，梅光迪、吴宓等创办《学衡》杂志，因其观点态度相近而被称为“学衡派”。（1分）\n（2）“学衡派”以融贯中西古今的姿态，提出“昌明国粹，融化新知”，反对新文化运动和文学革命，\n思想倾向保守。（1分）\n（3）以鲁迅为代表新文学阵营对“学衡派”进行了全面有力的批驳。（2分）","score":4},{"t":"w","n":27,"stem":"朗诵诗运动","ans":"（1） 抗日战争爆发后，在延安、武汉、重庆等地兴起朗诵诗运动的热潮。朗诵诗采用自由活泼的形式，\n突出诗歌的朗诵特点，受到人们的欢迎。（2分）\n（2）倡导者有柯仲平、萧三等。代表作品有高兰的《我的家在黑龙江》《哭亡女苏菲》、光未然的《五\n月的鲜花》《黄河大合唱》等。（2分）","score":4},{"t":"w","n":28,"stem":"探索戏剧","ans":"（1） 80年代初期，一些剧作家用新的艺术手段表达对于生活和人的生存问题的思考，创作的一批具有\n创新精神的探索剧作。代表作有马中骏、贾鸿源等的《屋外有热流》，高行健的《绝对信号》等。2分\n（2） 艺术上采用时空灵活拓展、意识流、荒诞派手法等现代戏剧技巧，打破了传统戏剧的规范。2分\n四、简答题：本大题共4小题，每小題8分，共32分。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简析巴金《家》的思想内容。","ans":"（1） 控诉封建家庭制度。作品以四川成都高氏家族为中心，描写了封建家族制度、封建礼教以及由此\n形成的传统习惯势力的腐朽、愚妄和凶残。（2分）\n（2）喊出了青年一代的呼声。作品以觉慧与他哥哥觉新的性格与命运的对比告诉人们，青年人应该打","score":8},{"t":"w","n":30,"stem":"简述“民族形式”讨论中的主要观点。","ans":"（1）抗战初期，围绕旧形式的利用问题出现“旧瓶装新酒”的讨论。（2）1938年，毛泽东提出“民族形式”问题，引起解放区和国统区两地进一步的讨论。论争的焦点是如何看待“民族形式”的来源。代表性观点有向林冰的《论“民族形式”的中心源泉》强调运用民间形式而否定五四新文学，以及葛一虹的《民族形式的中心源泉在所谓“民间形式”吗？》否定民间形式而要求西化等。（3）郭沫若《“民族形式”商兑》和胡风《论民族形式问题》侧重于中西互补，将讨论引向深入。毛泽东后来《在延安文艺座谈会上的讲话》对这一问题进行了更进一步的论述。","score":8},{"t":"w","n":31,"stem":"简析闻捷爱情诗的主要特色。","ans":"（1）把爱情与新时代的劳动生活、道德情操结合起来表现，从不渲染庸俗的男女情爱。（2）艺术表现上设置简单的人物和情节，在富有幽默情调的叙事中抒情。（3）重视民族风情、地域色彩描摹与点染，生活气息浓郁。","score":8},{"t":"w","n":32,"stem":"简析余秋雨散文的文化忧患意识。","ans":"（1）既为灿烂的中国文化骄傲不已，又以沉痛的笔调记叙中国文化遭遇的不幸。（2）对中国文化自身先进与落后因素并存的无奈与体认，表现出作者矛盾的心境。（3）在古今文明的对比中，思考怎样以传统文化的成就和弱点作现代文化的参照系，将中国悠久传统文化与现代文明结合起来，是现代知识分子与传统文化所作的一次对话。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合作品评析周作人散文的艺术成就。","ans":"（1）擅长旁征博引，于谈天说地中显示出深厚的学识才情。如《故乡的野菜》大量征引民俗、儿歌、古籍记载，显示了丰富的知识积累，使读者获得知性的享受。（2）笔调舒展自如，娓娓而谈。如《乌篷船》以书信形式叙写故乡风情，让读者具体感受到浓郁的江南水乡生活气息。（3）语言简练而又机智幽默，略带涩味，风格平和冲淡。","score":13},{"t":"w","n":34,"stem":"联系作品分析《骆驼祥子》中的祥子形象。","ans":"（1）祥子是一个人力车夫。勤劳朴实、善良正直，富有责任感与同情心，其生活理想就是拉上自己的车。（2）历尽艰辛，三起三落，求独立自主而终不可得，成了病态社会的牺牲品。（3）与虎妞的婚姻也是祥子生活悲剧的一个因素；与生俱来的小农意识、狭隘的眼光、个人奋斗的思想，是他悲剧的主观根源。（4）祥子的悲剧是对个人主义道路的彻底否定。","score":13}]}],"qaNotes":[]},{"paper":"xws-2304","subject":"xws","session":"2304","label":"2023年4月","code":"00537","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"代表郁达夫创作风格晚期转向诗意抒情的作品是（）","opts":["《迟桂花》","《茫茫夜》","《秋柳》","《空虚》"],"ans":"A","score":1},{"t":"s","n":2,"stem":"以散文名世的周作人创作的新诗佳作是（）","opts": 分，共12分。","items":[{"t":"w","n":26,"stem":"“双簧信”","ans":"（1）钱玄同化名王敬轩，仿照旧文人的口吻，汇集反对新文学的言论，写成一封致《新青年》的公开信；刘半农针对王敬轩来信公开回复，逐一辩驳。（2）在新文化运动初期，这场预先策划的“双簧信”事件扩大了新文学的影响。","score":4},{"t":"w","n":27,"stem":"《八十一梦》","ans":"（1）张恨水在抗战时期创作的讽刺小说，用梦的形式揭露了国难时期大后方的种种丑陋现象。（2）作品具有“谴责小说”的意味，主要采用中国古典小说的形式，也融入了现代小说技法。","score":4},{"t":"w","n":28,"stem":"“新写实小说”","ans":"（1）发生于80年代后期的文学潮流。代表作有刘云的《一地鸡毛》、池莉的《烦恼人生》、方方的《风景》等。（2）注重现实生活原生态的还原，大多采用冷静叙事，回避明确的价值判断。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简述夏衍抗战时期剧作的思想内容和艺术风格。","ans":"（1）夏衍抗战时期的剧作有《心防》《愁城记》《法西斯细菌》《芳草天涯》等。（2）作品紧密结合民族矛盾尖锐、人民奋起抗日的时代背景，描写各阶层人民，特别注重表现知识分子怀抱爱国热情、不畏艰险而斗争的心路历程。（3）用平实的笔墨书写人物的灵魂，细致而不露痕迹，在看似平静的画面背后隐藏着深沉的感情，作品显示出清淡、质朴、隽永、飘逸的艺术风格。","score":8},{"t":"w","n":30,"stem":"简析丁玲《太阳照在桑干河上》的创作成就。","ans":"（1）通过对农村阶级关系的准确把握与细致描写，真实地反映了土改斗争中农村生活的复杂性，就其表现农村社会阶级关系的深度、广度和丰富性而言，超过“五四”以来的同类题材作品。（2）塑造的农村新人或者落后、反动地主形象，都具有生动鲜明的个性与丰富的思想内涵。（3）善于深入细致地刻画人物心理，呈现出独特的风格。","score":8},{"t":"w","n":31,"stem":"简析钱锺书《围城》的思想意蕴。","ans":"（1）从社会批判层面，展示了战时上层知识分子的人生众相，描绘当时教育界、知识界的腐败情状。（2）从文化批判层面，表现对西方文化的反思，揭露近代文明本身的诸多弱点，反映现代文明在讲究传统的国度中引起的畸变。（3）从哲学反思层面，关注形而上学问题，思考人生与命运，“围城”意象折射现代文明危机和现代人生困境。","score":8},{"t":"w","n":32,"stem":"简析老舍《茶馆》的结构特色。","ans":"（1）没有贯穿始终的故事情节和戏剧冲突，而是截取三个历史片断，展示三个时代不同人物的命运变迁。（2）选择汇集社会各方人士的裕泰茶馆，以“大茶馆就是小社会”反映社会众生相。（3）主要人物贯穿全剧，次要人物父子相承，加强作品整体感。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合作品分析沈从文题材小说的思想内容与艺术特色。","ans":"（1）表现未被现代文明扭曲的人生，如《龙朱》《媚金·豹子·与那羊》《神巫之爱》《月下小景》等。（2）善用微笑表现人生痛苦，抒写富有牧歌情调的爱情，如《雨后》《三三》《边城》等；在表现优美、健康、自然的人性中寄托个人理想。（3）采用散文化笔法，自然引领读者进入湘西世界，抵制故事结构化、戏剧化。（4）小说体式丰富，用笔舒卷自如，语言自然淡雅。","score":13},{"t":"w","n":34,"stem":"联系作品，分析巴金《家》中高觉新的形象及其意义。","ans":"（1）高觉新是中国新文学史上“多余人”的典型。（2）他深受封建主义思想的束缚，性格软弱，其悲剧集中反映了家族制度对人性的戕害。（3）高觉新的性格及命运折射出了封建专制主义重压下中国国民性的弱点。他的内心经历着新旧两种观念的激烈冲突，作者将这种冲突处理成民族心理在西方民主思想冲击下的痛苦挣扎，具有历史的深度。","score":13}]}],"qaNotes":[]},{"paper":"xws-2410","subject":"xws","session":"2410","label":"2024年10月","code":"00537","sections":[{"title":"一、单项选择
