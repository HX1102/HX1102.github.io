"},{"key":"B","text":"对现实关注过多"},{"key":"C","text":"传统叙事过多"},{"key":"D","text":"思想过于保守"}],"key":"A","answer":"过度形式实验,疏离读者","max":1,"id":"当代文思-10-single-9"},{"n":10,"type":"single","prompt":"先锋文学第一阶段的“文体革命”表现为","options":[{"key":"A","text":"传统线性叙事的延续"},{"key":"B","text":"元叙事与叙事圈套的运用"},{"key":"C","text":"政治抒情的强化"},{"key":"D","text":"商业元素的加入"}],"key":"B","answer":"元叙事与叙事圈套的运用","max":1,"id":"当代文思-10-single-10"},{"n":11,"type":"single","prompt":"先锋文学第三阶段的创作特点是","options":[{"key":"A","text":"完全抛弃形式创新"},{"key":"B","text":"形式创新与现实关怀结合"},{"key":"C","text":"回归传统古典文学"},{"key":"D","text":"专注于商业写作"}],"key":"B","answer":"形式创新与现实关怀结合","max":1,"id":"当代文思-10-single-11"},{"n":12,"type":"single","prompt":"先锋文学与西方现代主义的关联在于","options":[{"key":"A","text":"都排斥本土文化"},{"key":"B","text":"都强调形式与叙事的创新"},{"key":"C","text":"都追求商业价值"},{"key":"D","text":"都固守传统道德"}],"key":"B","answer":"都强调形式与叙事的创新","max":1,"id":"当代文思-10-single-12"},{"n":13,"type":"single","prompt":"先锋文学第二阶段的主要创作倾向是","options":[{"key":"A","text":"对叙事形式的极端实验"},{"key":"B","text":"对现实政治的直接批判"},{"key":"C","text":"对商业市场的迎合"},{"key":"D","text":"对传统文学的复古"}],"key":"A","answer":"对叙事形式的极端实验","max":1,"id":"当代文思-10-single-13"},{"n":14,"type":"single","prompt":"对先锋文学的批判观点主要认为其","options":[{"key":"A","text":"形式大于内容,缺乏思想深度"},{"key":"B","text":"对现实关注不足"},{"key":"C","text":"完全模仿西方"},{"key":"D","text":"以上都是"}],"key":"D","answer":"以上都是","max":1,"id":"当代文思-10-single-14"},{"n":15,"type":"single","prompt":"先锋文学思潮的“文体革命”主要体现在","options":[{"key":"A","text":"政治文体的强化"},{"key":"B","text":"传统文体的固守"},{"key":"C","text":"叙事形式与结构的创新"},{"key":"D","text":"商业文体的模仿"}],"key":"C","answer":"叙事形式与结构的创新","max":1,"id":"当代文思-10-single-15"},{"n":16,"type":"fill","prompt":"先锋文学思潮产生的背景之一是 ______ 的引鉴。","options":[],"key":"西方现代主义","answer":"西方现代主义","max":2,"id":"当代文思-10-fill-16"},{"n":17,"type":"fill","prompt":"先锋文学第一阶段的代表作家有马原、残雪和 ______ 等。","options":[],"key":"莫言","answer":"莫言","max":2,"id":"当代文思-10-fill-17"},{"n":18,"type":"fill","prompt":"先锋文学思潮的审美特质包括形式实验、叙事创新和 ______ 的先锋性。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-10-fill-18"},{"n":19,"type":"fill","prompt":"先锋文学第二阶段的主要创作倾向是对 ______ 形式的极端实验。","options":[],"key":"叙事","answer":"叙事","max":2,"id":"当代文思-10-fill-19"},{"n":20,"type":"fill","prompt":"先锋文学思潮的意义在于推动文学 ______ 与叙事的创新。","options":[],"key":"形式","answer":"形式","max":2,"id":"当代文思-10-fill-20"},{"n":21,"type":"fill","prompt":"先锋文学产生的主要背景是西方现代主义的引鉴与 ______ 探索。","options":[],"key":"文学形式","answer":"文学形式","max":2,"id":"当代文思-10-fill-21"},{"n":22,"type":"fill","prompt":"先锋文学对西方现代主义的借鉴主要体现在叙事结构与 ______ 方面。","options":[],"key":"形式","answer":"形式","max":2,"id":"当代文思-10-fill-22"},{"n":23,"type":"fill","prompt":"先锋文学思潮的局限性在于部分作品过度形式实验, ______ 读者。","options":[],"key":"疏离","answer":"疏离","max":2,"id":"当代文思-10-fill-23"},{"n":24,"type":"fill","prompt":"先锋文学第一阶段的“文体革命”表现为元叙事与 ______ 的运用。","options":[],"key":"叙事圈套","answer":"叙事圈套","max":2,"id":"当代文思-10-fill-24"},{"n":25,"type":"fill","prompt":"先锋文学第三阶段的创作特点是形式创新与 ______ 结合。","options":[],"key":"现实关怀","answer":"现实关怀","max":2,"id":"当代文思-10-fill-25"},{"n":26,"type":"fill","prompt":"先锋文学与西方现代主义的共同之处在于都强调 ______ 与叙事的创新。","options":[],"key":"形式","answer":"形式","max":2,"id":"当代文思-10-fill-26"},{"n":27,"type":"fill","prompt":"先锋文学第二阶段的主要代表作品有格非的《褐色鸟群》和 ______ 的《冈底斯的诱惑》等。","options":[],"key":"马原","answer":"马原","max":2,"id":"当代文思-10-fill-27"},{"n":28,"type":"term","prompt":"先锋文学思潮","options":[],"key":"","answer":"先锋文学思潮:20世纪80年代中期兴起的现代主义思潮,核心是反叛传统文学范式、进行文体革命,分兴起、发展、深化三个阶段,特质是激进的形式主义实验、强烈的反叛精神与非理性的人性挖掘,推动文学从“写什么”向“怎么写”转型。","max":4,"id":"当代文思-10-term-28"},{"n":29,"type":"term","prompt":"先锋文学的审美特质","options":[],"key":"","answer":"先锋文学的审美特质:指先锋文学所具有的艺术特征,包括形式实验,如元叙事、叙事圈套;叙事创新,即突破传统线性叙事;以及思想的先锋性,即挑战传统观念、探索人性与存在的深层问题,体现对文学形式和思想深度的双重探索。","max":4,"id":"当代文思-10-term-29"},{"n":30,"type":"term","prompt":"先锋文学的三个发展阶段","options":[],"key":"","answer":"先锋文学分三个发展阶段:第一阶段以马原、残雪、莫言为代表,开启形式实验与叙事创新;第二阶段以格非、马原后期为代表,深化形式实验,构建“叙事迷宫”;第三阶段以格非、苏童、余华为代表,形式创新与现实关怀结合,实现形式与内容的平衡。","max":4,"id":"当代文思-10-term-30"},{"n":31,"type":"term","prompt":"文体革命","options":[],"key":"","answer":"文体革命:指先锋文学所推动的文学形式和叙事方式的变革,通过元叙事、叙事圈套、意识流等手法打破传统叙事规范,使叙事形式本身成为文学表达的核心,旨在实现文学的现代化转型,是先锋文学思潮的核心实践。","max":4,"id":"当代文思-10-term-31"},{"n":32,"type":"term","prompt":"先锋文学的意义","options":[],"key":"","answer":"先锋文学的意义:推动文学形式与叙事创新,打破传统文学的桎梏,为中国当代文学的现代化转型提供动力;促进中西方文学的对话交流,丰富文学表现手段;为后续创作提供形式资源与创新思路,推动文学多元化发展。","max":4,"id":"当代文思-10-term-32"},{"n":33,"type":"term","prompt":"先锋文学的局限性","options":[],"key":"","answer":"先锋文学的局限性:部分作品过度追求形式实验,导致叙事晦涩、主题模糊,疏离普通读者;部分作品形式大于内容,缺乏对现实和人性的深刻关怀;部分作品过度模仿西方现代主义,缺乏与本土文化的有机融合。","max":4,"id":"当代文思-10-term-33"},{"n":34,"type":"short","prompt":"简述先锋文学思潮发展的三个阶段及主要代表人物和作品。","options":[],"key":"","answer":"第一阶段:以马原、残雪、莫言为代表,作品有《冈底斯的诱惑》《山上的小屋》,开启形式实验与叙事创新;第二阶段:以格非、马原后期为代表,作品有《褐色鸟群》,深化叙事形式实验,构建“叙事迷宫”;第三阶段:以格非、苏童、余华为代表,作品有《活着》《迷舟》,形式创新与现实关怀结合,实现形式与内容的平衡。","max":6,"id":"当代文思-10-short-34"},{"n":35,"type":"short","prompt":"请阐述先锋文学思潮的审美特质。","options":[],"key":"","answer":"先锋文学思潮的审美特质主要有三个方面:一是形式实验,通过元叙事、叙事圈套、意识流等手法打破传统叙事规范;二是叙事创新,突破线性叙事,采用多重视角、嵌套叙事等;三是思想的先锋性,挑战传统观念,探索人性与存在的深层问题,具有强烈的思想冲击力。","max":6,"id":"当代文思-10-short-35"},{"n":36,"type":"short","prompt":"请阐述先锋文学思潮产生的背景。","options":[],"key":"","answer":"先锋文学思潮产生的背景主要有两点:一是西方现代主义的引鉴,20世纪80年代西方现代主义文学大量涌入,为作家提供了形式创新和思想探索的资源;二是文学形式探索的内在需求,在思想解放的背景下,作家试图突破传统文学的桎梏,通过形式革命实现文学的现代化转型。","max":6,"id":"当代文思-10-short-36"},{"n":37,"type":"essay","prompt":"论述先锋文学思潮的审美特质。","options":[],"key":"","answer":"先锋文学思潮的审美特质集中体现为形式实验、叙事创新和思想先锋性的三位一体。形式实验方面,采用元叙事、叙事圈套、意识流等手法,打破传统线性叙事的桎梏。叙事创新上, 突破传统叙事的单一视角,采用多重视角、嵌套叙事等,构建叙事迷宫。思想先锋性层面, 挑战传统伦理观念和价值体系,深入探索人性的复杂与存在的荒诞虚无。","max":10,"id":"当代文思-10-essay-37"},{"n":38,"type":"essay","prompt":"论述先锋文学思潮的意义与局限性。","options":[],"key":"","answer":"先锋文学思潮的意义:在文学形式上推动文体革命,打破传统文学的单一模式;在文学思想上促进中西方文学对话交流,推动文学思想多元化;在文学发展上为后续的新写实、新生代等思潮提供创新起点。局限:部分作品过度追求形式实验,叙事晦涩、主题模糊,疏离普通读者;部分作品形式大于内容,且过度模仿西方现代主义,缺乏与本土文化的有机融合。","max":10,"id":"当代文思-10-essay-38"},{"n":39,"type":"essay","prompt":"试述先锋文学思潮发展的三个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段(80年代中期):以形式实验和叙事创新为核心,马原《冈底斯的诱惑》开创“叙事圈套”,残雪《山上的小屋》探索人性异化。 二、第二阶段(80年代后期):深化叙事形式实验,构建“叙事迷宫”,格非《褐色鸟群》 以循环叙事使时空呈现不确定性。 三、第三阶段(90年代以后):形式创新与现实关怀结合,余华《活着》展现苦难中的生命韧性,苏童《妻妾成群》揭示人性挣扎,呈现融合轨迹。","max":10,"id":"当代文思-10-essay-39"}],"rawMax":111},{"id":"当代文思-11","title":"章节练习(8章)","questions":[{"n":1,"type":"single","prompt":"新历史主义思潮产生的背景之一是","options":[{"key":"A","text":"个体意识的觉醒"},{"key":"B","text":"传统历史观的强化"},{"key":"C","text":"政治史学的绝对主导"},{"key":"D","text":"商业历史剧的兴起"}],"key":"A","answer":"个体意识的觉醒","max":1,"id":"当代文思-11-single-1"},{"n":2,"type":"single","prompt":"以下不属于新历史小说第一阶段代表作家的是","options":[{"key":"A","text":"莫言"},{"key":"B","text":"格非"},{"key":"C","text":"北岛"},{"key":"D","text":"余华"}],"key":"C","answer":"北岛","max":1,"id":"当代文思-11-single-2"},{"n":3,"type":"single","prompt":"新历史主义思潮的特质不包括","options":[{"key":"A","text":"对宏大历史叙事的解构"},{"key":"B","text":"对个体历史体验的关注"},{"key":"C","text":"传统历史观的固守"},{"key":"D","text":"历史叙事的多元化"}],"key":"C","answer":"传统历史观的固守","max":1,"id":"当代文思-11-single-3"},{"n":4,"type":"single","prompt":"新历史小说第二阶段的主要代表作品是","options":[{"key":"A","text":"《红高粱家族》"},{"key":"B","text":"《白鹿原》"},{"key":"C","text":"《平凡的世界》"},{"key":"D","text":"《穆斯林的葬礼》"}],"key":"B","answer":"《白鹿原》","max":1,"id":"当代文思-11-single-4"},{"n":5,"type":"single","prompt":"新历史主义思潮的意义在于","options":[{"key":"A","text":"强化传统历史观的权威"},{"key":"B","text":"推动历史叙事的多元化与个体视角的介入"},{"key":"C","text":"促进历史题材商业剧的发展"},{"key":"D","text":"回归单一历史叙事模式"}],"key":"B","answer":"推动历史叙事的多元化与个体视角的介入","max":1,"id":"当代文思-11-single-5"},{"n":6,"type":"single","prompt":"新历史主义产生的主要背景是","options":[{"key":"A","text":"个体意识觉醒与对传统历史观的反思"},{"key":"B","text":"传统史学的垄断"},{"key":"C","text":"商业历史写作的兴起"},{"key":"D","text":"政治史学的绝对主导"}],"key":"A","answer":"个体意识觉醒与对传统历史观的反思","max":1,"id":"当代文思-11-single-6"},{"n":7,"type":"single","prompt":"以下属于新历史小说第三阶段代表作家的是","options":[{"key":"A","text":"李锐"},{"key":"B","text":"刘醒龙"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"以上都是","max":1,"id":"当代文思-11-single-7"},{"n":8,"type":"single","prompt":"新历史主义对传统历史观的解构主要体现在","options":[{"key":"A","text":"强化历史的客观性与权威性"},{"key":"B","text":"质疑历史的单一叙事,强调历史的建构性"},{"key":"C","text":"固守历史的线性发展观"},{"key":"D","text":"突出历史的政治工具性"}],"key":"B","answer":"质疑历史的单一叙事,强调历史的建构性","max":1,"id":"当代文思-11-single-8"},{"n":9,"type":"single","prompt":"新历史主义思潮的局限性在于","options":[{"key":"A","text":"过度强调个体体验,弱化历史的宏观视野"},{"key":"B","text":"对历史客观性关注过多"},{"key":"C","text":"传统历史叙事过多"},{"key":"D","text":"历史题材过于宏大"}],"key":"A","answer":"过度强调个体体验,弱化历史的宏观视野","max":1,"id":"当代文思-11-single-9"},{"n":10,"type":"single","prompt":"新历史小说第一阶段的“历史解构”表现为","options":[{"key":"A","text":"传统历史叙事的延续"},{"key":"B","text":"对宏大历史的戏仿与个体经验的植入"},{"key":"C","text":"历史政治功能的强化"},{"key":"D","text":"商业历史元素的加入"}],"key":"B","answer":"对宏大历史的戏仿与个体经验的植入","max":1,"id":"当代文思-11-single-10"},{"n":11,"type":"single","prompt":"新历史小说第三阶段的创作特点是","options":[{"key":"A","text":"完全抛弃历史解构"},{"key":"B","text":"历史解构与现实关怀的结合"},{"key":"C","text":"回归传统历史叙事"},{"key":"D","text":"专注于商业历史写作"}],"key":"B","answer":"历史解构与现实关怀的结合","max":1,"id":"当代文思-11-single-11"},{"n":12,"type":"single","prompt":"新历史主义与传统历史观的关联在于","options":[{"key":"A","text":"都强调历史的单一客观性"},{"key":"B","text":"都关注个体在历史中的作用"},{"key":"C","text":"都认为历史是多元建构的"},{"key":"D","text":"以上都不是"}],"key":"D","answer":"以上都不是","max":1,"id":"当代文思-11-single-12"},{"n":13,"type":"single","prompt":"新历史小说第二阶段的主要创作倾向是","options":[{"key":"A","text":"对家族历史与地域文化的深度挖掘"},{"key":"B","text":"对政治历史的直接批判"},{"key":"C","text":"对商业历史题材的迎合"},{"key":"D","text":"对传统历史的完全复古"}],"key":"A","answer":"对家族历史与地域文化的深度挖掘","max":1,"id":"当代文思-11-single-13"},{"n":14,"type":"single","prompt":"对新历史主义的批判观点主要认为其","options":[{"key":"A","text":"过度解构历史,导致历史虚无主义"},{"key":"B","text":"对历史客观性尊重不足"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"以上都是","max":1,"id":"当代文思-11-single-14"},{"n":15,"type":"single","prompt":"新历史主义思潮的“历史解构”主要体现在","options":[{"key":"A","text":"历史政治叙事的强化"},{"key":"B","text":"对传统宏大历史叙事的质疑与个体视角的介入"},{"key":"C","text":"传统历史叙事的固守"},{"key":"D","text":"历史商业价值的挖掘"}],"key":"B","answer":"对传统宏大历史叙事的质疑与个体视角的介入","max":1,"id":"当代文思-11-single-15"},{"n":16,"type":"fill","prompt":"新历史主义思潮产生的背景之一是 ______ 的觉醒。","options":[],"key":"个体意识","answer":"个体意识","max":2,"id":"当代文思-11-fill-16"},{"n":17,"type":"fill","prompt":"新历史小说第一阶段的代表作家有莫言、格非和 ______ 等。","options":[],"key":"余华","answer":"余华","max":2,"id":"当代文思-11-fill-17"},{"n":18,"type":"fill","prompt":"新历史主义思潮的特质包括对宏大历史叙事的 ______ 、对个体历史体验的关注和历史叙事的多元化。","options":[],"key":"解构","answer":"解构","max":2,"id":"当代文思-11-fill-18"},{"n":19,"type":"fill","prompt":"新历史小说第二阶段的主要创作倾向是对 ______ 历史与地域文化的深度挖掘。","options":[],"key":"家族","answer":"家族","max":2,"id":"当代文思-11-fill-19"},{"n":20,"type":"fill","prompt":"新历史主义思潮的意义在于推动历史叙事的 ______ 与个体视角的介入。","options":[],"key":"多元化","answer":"多元化","max":2,"id":"当代文思-11-fill-20"},{"n":21,"type":"fill","prompt":"新历史主义产生的主要背景是个体意识觉醒与对 ______ 的反思。","options":[],"key":"传统历史观","answer":"传统历史观","max":2,"id":"当代文思-11-fill-21"},{"n":22,"type":"fill","prompt":"新历史主义对传统历史观的解构主要体现在质疑历史的 ______ 叙事,强调历史的建构性。","options":[],"key":"单一","answer":"单一","max":2,"id":"当代文思-11-fill-22"},{"n":23,"type":"fill","prompt":"新历史主义思潮的局限性在于部分作品过度强调个体体验, ______ 历史的宏观视野。","options":[],"key":"弱化","answer":"弱化","max":2,"id":"当代文思-11-fill-23"},{"n":24,"type":"fill","prompt":"新历史小说第一阶段的“历史解构”表现为对宏大历史的 ______ 与个体经验的植入。","options":[],"key":"戏仿","answer":"戏仿","max":2,"id":"当代文思-11-fill-24"},{"n":25,"type":"fill","prompt":"新历史小说第三阶段的创作特点是历史解构与 ______ 的结合。","options":[],"key":"现实关怀","answer":"现实关怀","max":2,"id":"当代文思-11-fill-25"},{"n":26,"type":"fill","prompt":"新历史主义与传统历史观的根本区别在于是否承认历史的 ______ 建构性。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-11-fill-26"},{"n":27,"type":"fill","prompt":"新历史小说第二阶段的主要代表作品有陈忠实的《白鹿原》和 ______ 的《尘埃落定》 等。","options":[],"key":"阿来","answer":"阿来","max":2,"id":"当代文思-11-fill-27"},{"n":28,"type":"term","prompt":"新历史主义思潮","options":[],"key":"","answer":"新历史主义思潮:20世纪80年代中后期出现的文学思潮,背景是个体意识觉醒,作家通过解构宏大历史叙事、关注个体历史体验进行叙事创新,分三个阶段,代表作家有莫言、格非、陈忠实、李锐等,推动了历史叙事多元化,也有过度解构历史的局限。","max":4,"id":"当代文思-11-term-28"},{"n":29,"type":"term","prompt":"新历史主义的特质","options":[],"key":"","answer":"新历史主义的特质:指新历史主义的思想和艺术特征,包括对宏大历史叙事的解构,即质疑传统历史的单一客观性;对个体历史体验的关注,即强调个体在历史中的主体地位;历史叙事的多元化,即承认历史的多元建构性。","max":4,"id":"当代文思-11-term-29"},{"n":30,"type":"term","prompt":"新历史小说的三个发展阶段","options":[],"key":"","answer":"新历史小说分三个阶段:第一阶段以莫言、格非、余华为代表,戏仿宏大历史叙事、植入个体经验解构历史;第二阶段以陈忠实、阿来为代表,聚焦家族与地域文化;第三阶段以李锐、刘醒龙为代表,历史解构与现实关怀结合,实现历史与现实的对话。","max":4,"id":"当代文思-11-term-30"},{"n":31,"type":"term","prompt":"历史解构","options":[],"key":"","answer":"历史解构:指新历史主义文学所进行的历史叙事变革,通过质疑传统宏大历史叙事的权威性、植入个体体验、强调历史的多元建构性,打破传统历史叙事的单一模式,使历史呈现多元开放的面貌,推动历史书写从单一走向多元。","max":4,"id":"当代文思-11-term-31"},{"n":32,"type":"term","prompt":"新历史主义的意义","options":[],"key":"","answer":"新历史主义的意义:推动历史叙事的多元化,打破传统单一历史叙事的垄断;促进个体视角在历史书写中的介入,使历史更具人文性和个体关怀;为文学创作和历史研究提供新的方法与视角,丰富了当代文学的历史书写方式。","max":4,"id":"当代文思-11-term-32"},{"n":33,"type":"term","prompt":"新历史主义的局限性","options":[],"key":"","answer":"新历史主义的局限性:部分作品过度解构历史,导致历史虚无主义倾向;过度强调个体体验,弱化了历史的宏观视野和社会结构分析;部分作品对西方新历史主义的模仿存在生硬之处,缺乏与本土历史文化的有机融合。","max":4,"id":"当代文思-11-term-33"},{"n":34,"type":"short","prompt":"简述新历史主义思潮的三个阶段及其代表人物、代表作品。","options":[],"key":"","answer":"第一阶段以莫言、格非、余华为代表,作品有《红高粱家族》《迷舟》,通过戏仿宏大历史叙事、植入个体经验解构历史;第二阶段以陈忠实、阿来为代表,作品有《白鹿原》《尘埃落定》,聚焦家族历史与地域文化;第三阶段以李锐、刘醒龙为代表,作品有《旧址》《圣天门又》,历史解构与现实关怀结合,实现历史与现实的对话。","max":6,"id":"当代文思-11-short-34"},{"n":35,"type":"short","prompt":"请阐述新历史主义思潮的特质。","options":[],"key":"","answer":"新历史主义思潮的特质主要有三个方面:一是对宏大历史叙事的解构,质疑传统历史的单一客观性;二是对个体历史体验的关注,强调个体在历史中的主体地位,将个体经验作为重要视角;三是历史叙事的多元化,承认历史具有多种解读的可能,推动历史叙事从单一走向开放。","max":6,"id":"当代文思-11-short-35"},{"n":36,"type":"short","prompt":"请阐述新历史主义思潮产生的背景。","options":[],"key":"","answer":"新历史主义思潮产生的背景主要有两点:一是个体意识的觉醒,在思想解放的背景下,人们开始关注个体在历史中的生存体验和主体地位;二是对传统历史观的反思,传统历史观强调历史的单一客观性和宏大叙事,忽视了历史的复杂性与多元性,促使人们寻求新的历史解读方式。","max":6,"id":"当代文思-11-short-36"},{"n":37,"type":"essay","prompt":"论述新历史主义思潮的特质。","options":[],"key":"","answer":"一、对宏大历史叙事的解构:质疑传统历史观宣称的单一客观性和权威性,认为历史是由多种因素建构而成的。 二、对个体历史体验的关注:强调个体在历史中的主体地位和生存体验,使历史叙事充满人性的温度。 三、历史叙事的多元化:承认历史具有多种解读的可能,鼓励从不同视角重构历史,推动历史叙事从封闭走向开放。","max":10,"id":"当代文思-11-essay-37"},{"n":38,"type":"essay","prompt":"论述新历史主义思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:推动历史叙事的多元化,打破传统单一历史叙事的垄断;促进个体视角在历史书写中的介入,使历史更具人文关怀;为历史研究和文学创作提供新视角。 二、局限:部分作品过度解构历史,导致历史虚无主义倾向;过度强调个体体验,弱化了历史的宏观视野;对西方新历史主义的模仿存在生硬之处,缺乏与本土历史文化的有机融合。","max":10,"id":"当代文思-11-essay-38"},{"n":39,"type":"essay","prompt":"试述新历史小说思潮发展的三个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段以莫言、格非、余华为代表,以历史解构和个体经验植入为核心,戏仿传统历史叙事,形式创新是首要追求。 二、第二阶段以陈忠实、阿来为代表,从个体经验扩展到家族和地域,深度挖掘家族历史与地域文化,历史解构更加深入。 三、第三阶段以李锐、刘醒龙为代表,坚持历史解构的同时注重历史对现实的启示,实现历史叙事与现实关怀的平衡。","max":10,"id":"当代文思-11-essay-39"}],"rawMax":111},{"id":"当代文思-12","title":"章节练习(9章)","questions":[{"n":1,"type":"single","prompt":"“新写实”小说思潮产生的核心背景是","options":[{"key":"A","text":"日常生活价值的重估"},{"key":"B","text":"传统文学的复兴"},{"key":"C","text":"商业文学的主导"},{"key":"D","text":"政治文学的强化"}],"key":"A","answer":"日常生活价值的重估","max":1,"id":"当代文思-12-single-1"},{"n":2,"type":"single","prompt":"以下不属于“新写实”小说代表作家的是","options":[{"key":"A","text":"池莉"},{"key":"B","text":"方方"},{"key":"C","text":"王安忆"},{"key":"D","text":"北岛"}],"key":"D","answer":"北岛","max":1,"id":"当代文思-12-single-2"},{"n":3,"type":"single","prompt":"“新写实”小说的审美特质不包括","options":[{"key":"A","text":"日常生活的真实还原"},{"key":"B","text":"宏大叙事的消解"},{"key":"C","text":"英雄人物的塑造"},{"key":"D","text":"零度情感的叙事"}],"key":"C","answer":"英雄人物的塑造","max":1,"id":"当代文思-12-single-3"},{"n":4,"type":"single","prompt":"池莉的“新写实”代表作是","options":[{"key":"A","text":"《烦恼人生》"},{"key":"B","text":"《风景》"},{"key":"C","text":"《长恨歌》"},{"key":"D","text":"《红高粱家族》"}],"key":"A","answer":"《烦恼人生》","max":1,"id":"当代文思-12-single-4"},{"n":5,"type":"single","prompt":"“新写实”小说与“伤痕文学”的核心区别是","options":[{"key":"A","text":"是否关注历史创伤"},{"key":"B","text":"叙事视角的宏大与微观"},{"key":"C","text":"是否采用虚构手法"},{"key":"D","text":"创作年代的早晚"}],"key":"B","answer":"叙事视角的宏大与微观","max":1,"id":"当代文思-12-single-5"},{"n":6,"type":"single","prompt":"“日常生活审美化”思潮在文学中的体现是","options":[{"key":"A","text":"赋予日常琐碎以审美价值"},{"key":"B","text":"强化文学的政治宣传功能"},{"key":"C","text":"追求华丽的文学语言"},{"key":"D","text":"塑造完美的理想人物"}],"key":"A","answer":"赋予日常琐碎以审美价值","max":1,"id":"当代文思-12-single-6"},{"n":7,"type":"single","prompt":"“新写实”小说的叙事态度主要是","options":[{"key":"A","text":"强烈的情感批判"},{"key":"B","text":"客观的零度情感"},{"key":"C","text":"狂热的理想歌颂"},{"key":"D","text":"隐晦的政治隐喻"}],"key":"B","answer":"客观的零度情感","max":1,"id":"当代文思-12-single-7"},{"n":8,"type":"single","prompt":"方方的“新写实”代表作《风景》聚焦的是","options":[{"key":"A","text":"都市白领的职场生活"},{"key":"B","text":"乡村农民的劳作场景"},{"key":"C","text":"汉又贫民窟的家族日常"},{"key":"D","text":"知识分子的精神困境"}],"key":"C","answer":"汉又贫民窟的家族日常","max":1,"id":"当代文思-12-single-8"},{"n":9,"type":"single","prompt":"“新写实”小说思潮的局限性在于","options":[{"key":"A","text":"过度琐碎化,缺乏思想深度"},{"key":"B","text":"对宏大叙事过度依赖"},{"key":"C","text":"情感表达过于强烈"},{"key":"D","text":"人物形象过于理想化"}],"key":"A","answer":"过度琐碎化,缺乏思想深度","max":1,"id":"当代文思-12-single-9"},{"n":10,"type":"single","prompt":"“新写实”小说中“零度情感”的核心是","options":[{"key":"A","text":"作者完全无情感"},{"key":"B","text":"隐藏主观倾向,客观叙事"},{"key":"C","text":"对生活的冷漠态度"},{"key":"D","text":"仅描写负面情感"}],"key":"B","answer":"隐藏主观倾向,客观叙事","max":1,"id":"当代文思-12-single-10"},{"n":11,"type":"single","prompt":"王安忆“新写实”阶段的代表作是","options":[{"key":"A","text":"《小鲍庄》"},{"key":"B","text":"《金锁记》"},{"key":"C","text":"《倾城之恋》"},{"key":"D","text":"《子夜》"}],"key":"A","answer":"《小鲍庄》","max":1,"id":"当代文思-12-single-11"},{"n":12,"type":"single","prompt":"“日常生活审美化”思潮与“新写实”小说的关联是","options":[{"key":"A","text":"前者为后者提供理论支撑"},{"key":"B","text":"后者为前者提供理论支撑"},{"key":"C","text":"二者无直接关联"},{"key":"D","text":"前者是后者的分支"}],"key":"A","answer":"前者为后者提供理论支撑","max":1,"id":"当代文思-12-single-12"},{"n":13,"type":"single","prompt":"“新写实”小说区别于传统现实主义的关键是","options":[{"key":"A","text":"是否描写现实"},{"key":"B","text":"对“真实”的理解与呈现方式"},{"key":"C","text":"是否采用叙事手法"},{"key":"D","text":"创作地域的不同"}],"key":"B","answer":"对“真实”的理解与呈现方式","max":1,"id":"当代文思-12-single-13"},{"n":14,"type":"single","prompt":"以下属于“新写实”小说对宏大叙事消解的表现是","options":[{"key":"A","text":"聚焦国家重大历史事件"},{"key":"B","text":"描写普通家庭的柴米油盐"},{"key":"C","text":"塑造时代英雄人物"},{"key":"D","text":"宣传主流政治理念"}],"key":"B","answer":"描写普通家庭的柴米油盐","max":1,"id":"当代文思-12-single-14"},{"n":15,"type":"single","prompt":"“新写实”小说的语言风格主要是","options":[{"key":"A","text":"华丽雕琢"},{"key":"B","text":"质朴平实"},{"key":"C","text":"晦涩难懂"},{"key":"D","text":"浪漫抒情"}],"key":"B","answer":"质朴平实","max":1,"id":"当代文思-12-single-15"},{"n":16,"type":"fill","prompt":"“新写实”小说思潮产生的核心背景是 ______ 的重估。","options":[],"key":"日常生活价值","answer":"日常生活价值","max":2,"id":"当代文思-12-fill-16"},{"n":17,"type":"fill","prompt":"“新写实”小说的代表作家有池莉、方方和 ______ 等。","options":[],"key":"王安忆","answer":"王安忆","max":2,"id":"当代文思-12-fill-17"},{"n":18,"type":"fill","prompt":"“新写实”小说的审美特质包括日常生活的真实还原、宏大叙事的消解和 ______ 的叙事。","options":[],"key":"零度情感","answer":"零度情感","max":2,"id":"当代文思-12-fill-18"},{"n":19,"type":"fill","prompt":"池莉的“新写实”代表作《烦恼人生》聚焦的是 ______ 的日常生存困境。","options":[],"key":"普通工人","answer":"普通工人","max":2,"id":"当代文思-12-fill-19"},{"n":20,"type":"fill","prompt":"“日常生活审美化”思潮在文学中的核心体现是赋予 ______ 以审美价值。","options":[],"key":"日常琐碎","answer":"日常琐碎","max":2,"id":"当代文思-12-fill-20"},{"n":21,"type":"fill","prompt":"“新写实”小说与“伤痕文学”的核心区别在于 ______ 的宏大与微观。","options":[],"key":"叙事视角","answer":"叙事视角","max":2,"id":"当代文思-12-fill-21"},{"n":22,"type":"fill","prompt":"方方的“新写实”代表作《风景》以 ______ 为叙事场景。","options":[],"key":"汉又贫民窟","answer":"汉又贫民窟","max":2,"id":"当代文思-12-fill-22"},{"n":23,"type":"fill","prompt":"“新写实”小说思潮的局限性在于部分作品过度 ______ ,缺乏思想深度。","options":[],"key":"琐碎化","answer":"琐碎化","max":2,"id":"当代文思-12-fill-23"},{"n":24,"type":"fill","prompt":"“新写实”小说的“零度情感”叙事核心是隐藏 ______ ,客观呈现生活。","options":[],"key":"主观倾向","answer":"主观倾向","max":2,"id":"当代文思-12-fill-24"},{"n":25,"type":"fill","prompt":"王安忆“新写实”阶段的代表作《小鲍庄》聚焦的是 ______ 的日常伦理。","options":[],"key":"乡村","answer":"乡村","max":2,"id":"当代文思-12-fill-25"},{"n":26,"type":"fill","prompt":"“日常生活审美化”思潮为“新写实”小说提供了 ______ 支撑。","options":[],"key":"理论","answer":"理论","max":2,"id":"当代文思-12-fill-26"},{"n":27,"type":"fill","prompt":"“新写实”小说区别于传统现实主义的关键是对 ______ 的理解与呈现方式。","options":[],"key":"真实","answer":"真实","max":2,"id":"当代文思-12-fill-27"},{"n":28,"type":"term","prompt":"“新写实”小说","options":[],"key":"","answer":"“新写实”小说是20世纪80年代中后期兴起的文学流派,以池莉、方方、王安忆为代表。核心是还原日常生活真实,消解宏大叙事,采用零度情感叙事,聚焦普通人生存状态与琐碎日常,展现生活本真面貌,是对传统现实主义的突破与发展。","max":4,"id":"当代文思-12-term-28"},{"n":29,"type":"term","prompt":"日常生活审美化思潮","options":[],"key":"","answer":"日常生活审美化思潮是20世纪80年代后期至90年代兴起的文学思潮,以“新写实”小说为载体,核心是打破传统文学对宏大叙事与英雄人物的聚焦,将日常生活作为审美对象,强调以 “零度情感”叙述还原普通人生活的原生态。","max":4,"id":"当代文思-12-term-29"},{"n":30,"type":"term","prompt":"零度情感叙事","options":[],"key":"","answer":"零度情感叙事是“新写实”小说的核心叙事手法,指作者隐藏主观褒贬、价值判断与情感倾向,以中立客观的笔触还原生活本真,避免情感介入干扰读者对生活真实的感知,使作品呈现“冷”的叙事质感,是形成“冷真实”风格的关键。","max":4,"id":"当代文思-12-term-30"},{"n":31,"type":"term","prompt":"“新写实”小说的审美特质","options":[],"key":"","answer":"“新写实”小说的核心艺术特征包括三个方面:一是日常生活的真实还原,聚焦柴米油盐等琐碎场景;二是宏大叙事的消解,摒弃重大历史与英雄人物,转向微观日常;三是零度情感叙事,以客观中立态度呈现生活,形成“冷真实”的审美风格。","max":4,"id":"当代文思-12-term-31"},{"n":32,"type":"term","prompt":"“新写实”与传统现实主义的区别","options":[],"key":"","answer":"二者核心区别在对“真实”的理解与呈现:传统现实主义追求典型化真实,通过典型环境中的典型人物提炼生活本质;新写实追求日常原生态真实,打破宏大题材垄断,不刻意典型化, 采用零度情感叙事,聚焦普通人的日常生存。","max":4,"id":"当代文思-12-term-32"},{"n":33,"type":"term","prompt":"“新写实”小说的局限性","options":[],"key":"","answer":"“新写实”小说的主要不足:一是部分作品沉迷日常细节堆砌,陷入琐碎化,缺乏对生活本质的挖掘;二是零度情感叙事导致情感平淡,感染力不足,难以引发读者共鸣;三是题材局限于日常,创作视野较狭窄,对社会宏大议题关照不足。","max":4,"id":"当代文思-12-term-33"},{"n":34,"type":"short","prompt":"简述“新写实”小说的审美特质。","options":[],"key":"","answer":"“新写实”小说的审美特质有三方面:一是日常生活的真实还原,聚焦普通人生存的琐碎场景;二是宏大叙事的消解,摒弃重大历史事件与英雄人物塑造;三是零度情感叙事,隐藏主观褒贬,以客观中立笔触呈现生活本真,让读者从熟悉的日常中产生共鸣,形成“冷真实”的审美风格。","max":6,"id":"当代文思-12-short-34"},{"n":35,"type":"short","prompt":"简述“新写实”小说与传统现实主义的核心区别。","options":[],"key":"","answer":"二者核心区别集中在对“真实”的理解与呈现:传统现实主义追求典型化真实,通过典型环境中的典型人物提炼生活本质,传递明确思想倾向,体现宏大的历史视野;新写实追求日常原生态真实,打破宏大题材垄断,呈现生活琐碎本貌,采用零度情感叙事,隐藏主观态度,聚焦普通人的日常生存。","max":6,"id":"当代文思-12-short-35"},{"n":36,"type":"short","prompt":"简述“日常生活审美化”思潮与“新写实”小说的关联。","options":[],"key":"","answer":"二者是理论与创作实践的紧密关联:“日常生活审美化”思潮为“新写实”提供理论支撑,主张挖掘日常琐碎的审美价值,打破传统审美的崇高垄断,确立日常书写的合法性;“新写实”小说则是该思潮的文学实践,通过还原日常真实、聚焦普通人生存将理论转化为创作,共同推动文学对日常生活的书写。","max":6,"id":"当代文思-12-short-36"},{"n":37,"type":"essay","prompt":"论述“新写实”小说的审美特质。","options":[],"key":"","answer":"一、日常生活的真实还原:打破对宏大题材的垄断,聚焦普通人生存的琐碎场景,以原生态细节构建真实感。 二、宏大叙事的消解:摒弃对重大历史事件、英雄人物的书写,转向微观的个体日常,使文学从时代史诗回归人生小品。 三、零度情感叙事:作者隐藏主观褒贬与价值判断,以客观笔触呈现生活,让读者自主感知生活的本质,形成“冷真实”的风格。","max":10,"id":"当代文思-12-essay-37"},{"n":38,"type":"essay","prompt":"论述“新写实”小说的意义与局限性。","options":[],"key":"","answer":"一、意义:文学层面推动题材的日常转向,使日常生活获得文学合法性,革新叙事手法,丰富文学的表达维度;社会层面促使大众重新审视日常生活的价值,具有思想启蒙意义。 二、局限:部分作品过度沉迷日常细节堆砌,缺乏对生活本质的挖掘与思想提炼;零度情感叙事的极致运用导致作品情感平淡,感染力不足;题材局限于日常,创作视野较狭窄。","max":10,"id":"当代文思-12-essay-38"},{"n":39,"type":"essay","prompt":"论述“日常生活审美化”思潮与“新写实”小说的内在关联。","options":[],"key":"","answer":"一、思潮提供理论支撑:打破“审美即崇高”的垄断认知,主张审美价值蕴含于日常琐碎之中,为“新写实”聚焦日常奠定思想基础。 二、小说是实践载体:通过还原日常细节、消解宏大叙事、零度情感叙事,将日常的审美价值具象化。 三、二者双向互动:思潮因小说创作获得广泛传播,小说在理论滋养下深化日常书写,共同推动文学与审美观念的革新。","max":10,"id":"当代文思-12-essay-39"}],"rawMax":111},{"id":"当代文思-13","title":"章节练习(10章)","questions":[{"n":1,"type":"single","prompt":"反抗精神侏儒化的人文主义思潮产生的背景是","options":[{"key":"A","text":"知识的思想退化"},{"key":"B","text":"传统人文精神的强化"},{"key":"C","text":"商业文化的衰落"},{"key":"D","text":"政治文化的绝对主导"}],"key":"A","answer":"知识的思想退化","max":1,"id":"当代文思-13-single-1"},{"n":2,"type":"single","prompt":"以下不属于人文精神大讨论参与方的是","options":[{"key":"A","text":"知识分子"},{"key":"B","text":"普通市民"},{"key":"C","text":"文化界学者"},{"key":"D","text":"文学评论家"}],"key":"B","answer":"普通市民","max":1,"id":"当代文思-13-single-2"},{"n":3,"type":"single","prompt":"人文精神大讨论的内在诉求不包括","options":[{"key":"A","text":"呼唤思想深度"},{"key":"B","text":"推崇精神侏儒化"},{"key":"C","text":"追求人文价值"},{"key":"D","text":"反抗功利主义"}],"key":"B","answer":"推崇精神侏儒化","max":1,"id":"当代文思-13-single-3"},{"n":4,"type":"single","prompt":"人文精神大讨论的核心是围绕展开","options":[{"key":"A","text":"商业利益分配"},{"key":"B","text":"人文价值与功利主义的冲突"},{"key":"C","text":"政治体制改革"},{"key":"D","text":"传统习俗传承"}],"key":"B","answer":"人文价值与功利主义的冲突","max":1,"id":"当代文思-13-single-4"},{"n":5,"type":"single","prompt":"反抗精神侏儒化的人文主义思潮的意义在于","options":[{"key":"A","text":"强化精神侏儒化"},{"key":"B","text":"推动思想深度与人文价值的回归"},{"key":"C","text":"促进功利主义发展"},{"key":"D","text":"消解人文精神"}],"key":"B","answer":"推动思想深度与人文价值的回归","max":1,"id":"当代文思-13-single-5"},{"n":6,"type":"single","prompt":"人文精神大讨论的主要阵地是","options":[{"key":"A","text":"商业杂志"},{"key":"B","text":"娱乐报刊"},{"key":"C","text":"文化学术期刊"},{"key":"D","text":"体育周刊"}],"key":"C","answer":"文化学术期刊","max":1,"id":"当代文思-13-single-6"},{"n":7,"type":"single","prompt":"以下属于人文精神大讨论代表学者的是","options":[{"key":"A","text":"王蒙"},{"key":"B","text":"张承志"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"以上都是","max":1,"id":"当代文思-13-single-7"},{"n":8,"type":"single","prompt":"反抗精神侏儒化的人文主义思潮的局限在于","options":[{"key":"A","text":"过度强调人文价值,对现实功利关注不足"},{"key":"B","text":"完全迎合功利主义"},{"key":"C","text":"思想深度过于浅显"},{"key":"D","text":"人文价值倡导不足"}],"key":"A","answer":"过度强调人文价值,对现实功利关注不足","max":1,"id":"当代文思-13-single-8"},{"n":9,"type":"single","prompt":"人文精神大讨论的过程大致可分为","options":[{"key":"A","text":"发起、论争、反思三个阶段"},{"key":"B","text":"单一阶段"},{"key":"C","text":"商业推广阶段"},{"key":"D","text":"政治干预阶段"}],"key":"A","answer":"发起、论争、反思三个阶段","max":1,"id":"当代文思-13-single-9"},{"n":10,"type":"single","prompt":"人文精神大讨论的主要论点不包括","options":[{"key":"A","text":"倡导人文价值优先"},{"key":"B","text":"反对功利主义泛滥"},{"key":"C","text":"主张精神侏儒化"},{"key":"D","text":"呼唤思想深度回归"}],"key":"C","answer":"主张精神侏儒化","max":1,"id":"当代文思-13-single-10"},{"n":11,"type":"single","prompt":"反抗精神侏儒化的人文主义思潮的核心是","options":[{"key":"A","text":"推崇物质享受"},{"key":"B","text":"反抗思想深度缺失,追求人文价值"},{"key":"C","text":"强化功利主义"},{"key":"D","text":"倡导精神侏儒化"}],"key":"B","answer":"反抗思想深度缺失,追求人文价值","max":1,"id":"当代文思-13-single-11"},{"n":12,"type":"single","prompt":"人文精神大讨论中,对人文精神内涵的理解呈现","options":[{"key":"A","text":"单一化"},{"key":"B","text":"多元化"},{"key":"C","text":"政治化"},{"key":"D","text":"商业化"}],"key":"B","answer":"多元化","max":1,"id":"当代文思-13-single-12"},{"n":13,"type":"single","prompt":"反抗精神侏儒化的人文主义思潮产生的直接诱因是","options":[{"key":"A","text":"知识领域思想深度的退化"},{"key":"B","text":"传统人文的复兴"},{"key":"C","text":"商业文化的繁荣"},{"key":"D","text":"政治文化的开放"}],"key":"A","answer":"知识领域思想深度的退化","max":1,"id":"当代文思-13-single-13"},{"n":14,"type":"single","prompt":"对反抗精神侏儒化的人文主义思潮的批判观点主要认为其","options":[{"key":"A","text":"过于理想化,脱离现实功利"},{"key":"B","text":"思想深度不足"},{"key":"C","text":"人文价值倡导不够"},{"key":"D","text":"完全迎合功利主义"}],"key":"A","answer":"过于理想化,脱离现实功利","max":1,"id":"当代文思-13-single-14"},{"n":15,"type":"single","prompt":"人文精神大讨论的最终指向是","options":[{"key":"A","text":"强化功利主义"},{"key":"B","text":"推动人文价值与现实的平衡"},{"key":"C","text":"消解人文精神"},{"key":"D","text":"倡导精神侏儒化"}],"key":"B","answer":"推动人文价值与现实的平衡","max":1,"id":"当代文思-13-single-15"},{"n":16,"type":"fill","prompt":"反抗精神侏儒化的人文主义思潮产生的背景是 ______ 的退化。","options":[],"key":"知识的思想","answer":"知识的思想","max":2,"id":"当代文思-13-fill-16"},{"n":17,"type":"fill","prompt":"人文精神大讨论的主要参与方有知识分子、文化界学者和 ______ 等。","options":[],"key":"文学评论家","answer":"文学评论家","max":2,"id":"当代文思-13-fill-17"},{"n":18,"type":"fill","prompt":"人文精神大讨论的内在诉求包括呼唤思想深度、追求人文价值和 ______ 功利主义。","options":[],"key":"反抗","answer":"反抗","max":2,"id":"当代文思-13-fill-18"},{"n":19,"type":"fill","prompt":"人文精神大讨论的核心是围绕人文价值与 ______ 的冲突展开。","options":[],"key":"功利主义","answer":"功利主义","max":2,"id":"当代文思-13-fill-19"},{"n":20,"type":"fill","prompt":"反抗精神侏儒化的人文主义思潮的意义在于推动 ______ 深度与人文价值的回归。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-13-fill-20"},{"n":21,"type":"fill","prompt":"人文精神大讨论的主要阵地是 ______ 学术期刊。","options":[],"key":"文化","answer":"文化","max":2,"id":"当代文思-13-fill-21"},{"n":22,"type":"fill","prompt":"人文精神大讨论的过程大致可分为发起、论争和 ______ 三个阶段。","options":[],"key":"反思","answer":"反思","max":2,"id":"当代文思-13-fill-22"},{"n":23,"type":"fill","prompt":"反抗精神侏儒化的人文主义思潮的局限在于过度强调人文价值,对现实 ______ 关注不足。","options":[],"key":"功利","answer":"功利","max":2,"id":"当代文思-13-fill-23"},{"n":24,"type":"fill","prompt":"人文精神大讨论中,对人文精神内涵的理解呈现 ______ 化特点。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-13-fill-24"},{"n":25,"type":"fill","prompt":"反抗精神侏儒化的人文主义思潮产生的直接诱因是知识领域 ______ 深度的退化。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-13-fill-25"},{"n":26,"type":"fill","prompt":"人文精神大讨论的主要论点包括倡导人文价值优先、反对功利主义泛滥和呼唤 ______ 深度回归。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-13-fill-26"},{"n":27,"type":"fill","prompt":"人文精神大讨论的最终指向是推动人文价值与 ______ 的平衡。","options":[],"key":"现实","answer":"现实","max":2,"id":"当代文思-13-fill-27"},{"n":28,"type":"term","prompt":"反抗精神侏儒化的人文主义思潮","options":[],"key":"","answer":"该思潮源于“知识的思想退化”,反抗精神侏儒化、功利主义对思想深度的消解,追求人文价值与思想深度的回归。核心是呼唤人文精神,反对精神世界的矮化,推动社会关注思想与人文价值,具有思想启蒙意义,也存在过度理想化的局限。","max":4,"id":"当代文思-13-term-28"},{"n":29,"type":"term","prompt":"人文精神大讨论","options":[],"key":"","answer":"人文精神大讨论是20世纪90年代在文化学术期刊上展开的思想论争,参与方有知识分子、 文化界学者等。围绕人文价值与功利主义的冲突,探讨人文精神的内涵与意义,过程分为发起、论争、反思三阶段,推动了社会对人文价值的关注。","max":4,"id":"当代文思-13-term-29"},{"n":30,"type":"term","prompt":"人文精神大讨论的内在诉求","options":[],"key":"","answer":"人文精神大讨论的核心追求包括:呼唤思想深度,反抗思想浅薄化;追求人文价值,抵制精神侏儒化;反抗功利主义,反对功利对人文的消解,旨在推动社会重视精神追求与人文内涵,避免精神世界的矮化。","max":4,"id":"当代文思-13-term-30"},{"n":31,"type":"term","prompt":"知识的思想退化","options":[],"key":"","answer":"反抗精神侏儒化的人文主义思潮产生的背景,指知识领域中思想深度缺失,精神追求功利化、矮化,思想创造不足,导致精神世界呈现侏儒化趋势;在此背景下,人文主义力量奋起反抗,呼吁思想深度和人文价值的回归。","max":4,"id":"当代文思-13-term-31"},{"n":32,"type":"term","prompt":"人文精神大讨论的主要论点","options":[],"key":"","answer":"讨论中形成的核心观点,包括倡导人文价值优先,强调人文精神在精神世界的核心地位;反对功利主义泛滥,抵制功利对思想和人文的侵蚀;呼唤思想深度回归,反抗思想浅薄化,抵制精神侏儒化。构成对人文精神的多元阐释。","max":4,"id":"当代文思-13-term-32"},{"n":33,"type":"term","prompt":"反抗精神侏儒化的人文主义思潮的局限","options":[],"key":"","answer":"该思潮的不足,主要表现为过度强调人文价值,对现实功利关注不足,存在理想化倾向,导致其主张在现实中易与实际需求脱节;对功利主义的批判也缺乏对其合理存在的考量,未能辩证看待功利与人文的关系。","max":4,"id":"当代文思-13-term-33"},{"n":34,"type":"short","prompt":"简述反抗精神侏儒化的人文主义思潮产生的背景。","options":[],"key":"","answer":"该思潮产生的背景是“知识的思想退化”,即知识领域思想深度缺失,精神追求功利化、矮化,思想创造不足,导致精神世界呈现侏儒化趋势。在此背景下,人文主义力量奋起反抗, 呼吁思想深度和人文价值的回归,反抗功利主义对思想深度的消解,抵制精神世界的矮化, 具有思想启蒙意义。","max":6,"id":"当代文思-13-short-34"},{"n":35,"type":"short","prompt":"简述人文精神大讨论的内在诉求。","options":[],"key":"","answer":"内在诉求包括三方面:一是呼唤思想深度,反抗思想浅薄化;二是追求人文价值,抵制精神侏儒化,倡导对人文内涵的重视;三是反抗功利主义,反对功利对人文价值的消解,维护精神世界的纯粹性,旨在推动社会重视精神追求与人文内涵,避免精神世界的矮化。","max":6,"id":"当代文思-13-short-35"},{"n":36,"type":"short","prompt":"简述反抗精神侏儒化的人文主义思潮的意义与局限。","options":[],"key":"","answer":"意义:推动思想深度与人文价值的回归,反抗精神侏儒化和功利主义对精神世界的侵蚀,唤醒社会对精神层面的关注,具有思想启蒙价值。局限:过度强调人文价值,对现实功利关注不足,存在理想化倾向,导致主张易与实际需求脱节,对功利主义的批判缺乏对其合理存在的考量。","max":6,"id":"当代文思-13-short-36"},{"n":37,"type":"essay","prompt":"论述反抗精神侏儒化的人文主义思潮的背景、意义与局限。","options":[],"key":"","answer":"一、背景:产生于“知识的思想退化”,即知识领域思想深度缺失,精神追求功利化、矮化, 人文主义力量奋起反抗,旨在推动人文价值的回归。 二、意义:推动思想深度与人文价值的回归,反抗精神侏儒化和功利主义对精神世界的侵蚀,具有启蒙价值。 三、局限:过度强调人文价值,对现实功利关注不足,存在理想化倾向,对功利主义的批判趋于绝对。","max":10,"id":"当代文思-13-essay-37"},{"n":38,"type":"essay","prompt":"论述人文精神大讨论的过程、主要论点及内在诉求。","options":[],"key":"","answer":"一、过程分三阶段:发起阶段提出议题,引发社会关注;论争阶段在文化学术期刊上展开观点碰撞,探讨人文精神的内涵与意义;反思阶段总结讨论的意义与局限。 二、主要论点:倡导人文价值优先,反对功利主义泛滥,呼唤思想深度回归。 三、内在诉求:呼唤思想深度,反抗思想浅薄化;追求人文价值,抵制精神侏儒化;反抗功利主义,推动社会重视人文内涵。","max":10,"id":"当代文思-13-essay-38"},{"n":39,"type":"essay","prompt":"论述人文精神大讨论中人文价值与功利主义的冲突及平衡路径。","options":[],"key":"","answer":"一、冲突:人文价值强调精神追求、思想深度与人文内涵,反对精神世界的侏儒化;功利主义注重现实利益与物质追求,易导致思想浅薄和人文价值消解,体现为精神与物质的张力。 二、平衡路径:承认功利在物质层面的价值,不使其过度泛滥;坚守人文价值底线,重视思想深度和人文内涵的培养;个人层面兼顾人文追求与理性功利需求,使二者相互促进。","max":10,"id":"当代文思-13-essay-39"}],"rawMax":111},{"id":"当代文思-14","title":"章节练习(11章)","questions":[{"n":1,"type":"single","prompt":"新现实主义思潮产生的背景是","options":[{"key":"A","text":"转型时期的社会变化"},{"key":"B","text":"传统文学的全面复兴"},{"key":"C","text":"商业文学的垄断"},{"key":"D","text":"政治文学的强化"}],"key":"A","answer":"转型时期的社会变化","max":1,"id":"当代文思-14-single-1"},{"n":2,"type":"single","prompt":"以下不属于新现实主义第一阶段代表作家的是","options":[{"key":"A","text":"刘震云"},{"key":"B","text":"池莉"},{"key":"C","text":"北岛"},{"key":"D","text":"方方"}],"key":"C","answer":"北岛","max":1,"id":"当代文思-14-single-2"},{"n":3,"type":"single","prompt":"新现实主义文学思潮的特质不包括","options":[{"key":"A","text":"聚焦现实生存"},{"key":"B","text":"零度情感叙事"},{"key":"C","text":"宏大历史建构"},{"key":"D","text":"日常细节还原"}],"key":"C","answer":"宏大历史建构","max":1,"id":"当代文思-14-single-3"},{"n":4,"type":"single","prompt":"刘震云的新现实主义代表作是","options":[{"key":"A","text":"《一地鸡毛》"},{"key":"B","text":"《白鹿原》"},{"key":"C","text":"《红高粱家族》"},{"key":"D","text":"《长恨歌》"}],"key":"A","answer":"《一地鸡毛》","max":1,"id":"当代文思-14-single-4"},{"n":5,"type":"single","prompt":"新现实主义与“新写实”的核心区别是","options":[{"key":"A","text":"是否关注现实"},{"key":"B","text":"对“现实”的时代针对性差异"},{"key":"C","text":"是否采用虚构手法"},{"key":"D","text":"创作年代的早晚"}],"key":"B","answer":"对“现实”的时代针对性差异","max":1,"id":"当代文思-14-single-5"},{"n":6,"type":"single","prompt":"新现实主义思潮的意义在于","options":[{"key":"A","text":"强化传统历史叙事"},{"key":"B","text":"推动文学对转型期现实的聚焦"},{"key":"C","text":"促进商业文学的发展"},{"key":"D","text":"回归单一政治叙事"}],"key":"B","answer":"推动文学对转型期现实的聚焦","max":1,"id":"当代文思-14-single-6"},{"n":7,"type":"single","prompt":"以下属于新现实主义第二阶段代表作家的是","options":[{"key":"A","text":"毕飞宇"},{"key":"B","text":"莫言"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"A","answer":"毕飞宇","max":1,"id":"当代文思-14-single-7"},{"n":8,"type":"single","prompt":"新现实主义对现实的聚焦主要体现在","options":[{"key":"A","text":"宏大历史事件的再现"},{"key":"B","text":"转型期普通人的生存困境"},{"key":"C","text":"科幻未来的想象"},{"key":"D","text":"古代传奇的演绎"}],"key":"B","answer":"转型期普通人的生存困境","max":1,"id":"当代文思-14-single-8"},{"n":9,"type":"single","prompt":"新现实主义思潮的局限性在于","options":[{"key":"A","text":"过度聚焦现实,思想深度不足"},{"key":"B","text":"对现实关注过少"},{"key":"C","text":"历史叙事过多"},{"key":"D","text":"商业元素过少"}],"key":"A","answer":"过度聚焦现实,思想深度不足","max":1,"id":"当代文思-14-single-9"},{"n":10,"type":"single","prompt":"新现实主义第一阶段的“聚焦式写作”表现为","options":[{"key":"A","text":"传统英雄的塑造"},{"key":"B","text":"转型期日常生存的微观呈现"},{"key":"C","text":"历史战争的描写"},{"key":"D","text":"仙侠世界的构建"}],"key":"B","answer":"转型期日常生存的微观呈现","max":1,"id":"当代文思-14-single-10"},{"n":11,"type":"single","prompt":"新现实主义第三阶段的创作特点是","options":[{"key":"A","text":"完全抛弃现实聚焦"},{"key":"B","text":"现实聚焦与思想深度的结合"},{"key":"C","text":"回归传统历史叙事"},{"key":"D","text":"专注于商业写作"}],"key":"B","answer":"现实聚焦与思想深度的结合","max":1,"id":"当代文思-14-single-11"},{"n":12,"type":"single","prompt":"新现实主义与传统现实主义的关联在于","options":[{"key":"A","text":"都强调历史规律的宏大呈现"},{"key":"B","text":"都关注现实生存"},{"key":"C","text":"都采用浪漫主义手法"},{"key":"D","text":"都回避社会矛盾"}],"key":"B","answer":"都关注现实生存","max":1,"id":"当代文思-14-single-12"},{"n":13,"type":"single","prompt":"新现实主义第二阶段的主要创作倾向是","options":[{"key":"A","text":"对转型期社会矛盾的深度挖掘"},{"key":"B","text":"对古代文化的复古书写"},{"key":"C","text":"对商业市场的完全迎合"},{"key":"D","text":"对科幻题材的热衷"}],"key":"A","answer":"对转型期社会矛盾的深度挖掘","max":1,"id":"当代文思-14-single-13"},{"n":14,"type":"single","prompt":"对新现实主义的批判观点主要认为其","options":[{"key":"A","text":"过度现实化,缺乏艺术提炼"},{"key":"B","text":"对现实关注过多"},{"key":"C","text":"形式过于创新"},{"key":"D","text":"思想过于激进"}],"key":"A","answer":"过度现实化,缺乏艺术提炼","max":1,"id":"当代文思-14-single-14"},{"n":15,"type":"single","prompt":"新现实主义思潮的“聚焦式写作”主要体现在","options":[{"key":"A","text":"对单一政治人物的刻画"},{"key":"B","text":"对转型期现实生存的集中关注"},{"key":"C","text":"对历史事件的全面再现"},{"key":"D","text":"对商业明星的追捧"}],"key":"B","answer":"对转型期现实生存的集中关注","max":1,"id":"当代文思-14-single-15"},{"n":16,"type":"fill","prompt":"新现实主义思潮产生的背景是 ______ 时期的社会变化。","options":[],"key":"转型","answer":"转型","max":2,"id":"当代文思-14-fill-16"},{"n":17,"type":"fill","prompt":"新现实主义第一阶段的代表作家有刘震云、池莉和 ______ 等。","options":[],"key":"方方","answer":"方方","max":2,"id":"当代文思-14-fill-17"},{"n":18,"type":"fill","prompt":"新现实主义文学思潮的特质包括聚焦现实生存、 ______ 叙事和日常细节还原。","options":[],"key":"零度情感","answer":"零度情感","max":2,"id":"当代文思-14-fill-18"},{"n":19,"type":"fill","prompt":"刘震云的新现实主义代表作《一地鸡毛》聚焦的是 ______ 的日常生存困境。","options":[],"key":"普通职员","answer":"普通职员","max":2,"id":"当代文思-14-fill-19"},{"n":20,"type":"fill","prompt":"新现实主义思潮的意义在于推动文学对 ______ 期现实的聚焦。","options":[],"key":"转型","answer":"转型","max":2,"id":"当代文思-14-fill-20"},{"n":21,"type":"fill","prompt":"新现实主义产生的主要背景是 ______ 时期的社会变化。","options":[],"key":"转型","answer":"转型","max":2,"id":"当代文思-14-fill-21"},{"n":22,"type":"fill","prompt":"新现实主义对现实的聚焦主要体现在转型期 ______ 的生存困境。","options":[],"key":"普通人","answer":"普通人","max":2,"id":"当代文思-14-fill-22"},{"n":23,"type":"fill","prompt":"新现实主义思潮的局限性在于部分作品过度聚焦现实, ______ 深度不足。","options":[],"key":"思想","answer":"思想","max":2,"id":"当代文思-14-fill-23"},{"n":24,"type":"fill","prompt":"新现实主义第一阶段的“聚焦式写作”表现为转型期 ______ 生存的微观呈现。","options":[],"key":"日常","answer":"日常","max":2,"id":"当代文思-14-fill-24"},{"n":25,"type":"fill","prompt":"新现实主义第三阶段的创作特点是现实聚焦与 ______ 的结合。","options":[],"key":"思想深度","answer":"思想深度","max":2,"id":"当代文思-14-fill-25"},{"n":26,"type":"fill","prompt":"新现实主义与传统现实主义的根本关联在于都 ______ 现实生存。","options":[],"key":"关注","answer":"关注","max":2,"id":"当代文思-14-fill-26"},{"n":27,"type":"fill","prompt":"新现实主义第二阶段的主要代表作品有毕飞宇的《 ______ 》等。","options":[],"key":"推拿","answer":"推拿","max":2,"id":"当代文思-14-fill-27"},{"n":28,"type":"term","prompt":"新现实主义思潮","options":[],"key":"","answer":"新现实主义思潮源于转型期社会变化,聚焦转型期现实生存,采用零度情感叙事、还原日常细节。分三个发展阶段,代表作家有刘震云、池莉等,意义在于推动文学关注转型期现实, 局限是部分作品思想深度不足,是现实主义在当代的创新。","max":4,"id":"当代文思-14-term-28"},{"n":29,"type":"term","prompt":"新现实主义的特质","options":[],"key":"","answer":"新现实主义文学的核心艺术特征,包括聚焦现实生存,关注转型期普通人的日常困境;零度情感叙事,客观中立呈现现实,无主观褒贬;日常细节还原,通过琐碎细节构建现实真实感。三者结合使作品具有强烈的现实冲击力。","max":4,"id":"当代文思-14-term-29"},{"n":30,"type":"term","prompt":"新现实主义的三个阶段","options":[],"key":"","answer":"新现实主义的发展分为三个阶段:第一阶段以刘震云、池莉、方方为代表,微观呈现转型期日常生存;第二阶段以毕飞宇为代表,深度挖掘转型期社会矛盾;第三阶段实现现实聚焦与思想深度的结合,作品既有现实真实性,又有深刻思想性。","max":4,"id":"当代文思-14-term-30"},{"n":31,"type":"term","prompt":"聚焦式写作","options":[],"key":"","answer":"新现实主义的核心写作方式,集中关注转型期的现实生存,尤其是普通人的日常困境、社会变迁中的个体命运,通过对特定群体或个体的聚焦,以小见大反映时代的整体状况,使文学具有强烈的针对性和现实感。","max":4,"id":"当代文思-14-term-31"},{"n":32,"type":"term","prompt":"新现实主义的意义","options":[],"key":"","answer":"新现实主义的意义在于推动文学对转型期现实的聚焦,使文学成为反映社会变迁的“时代镜子”,帮助读者理解转型期的生存状态与社会矛盾;同时继承并发展了现实主义传统,为当代文学的现实书写提供新的路径。","max":4,"id":"当代文思-14-term-32"},{"n":33,"type":"term","prompt":"新现实主义的局限性","options":[],"key":"","answer":"新现实主义的局限性主要表现为部分作品过度聚焦现实细节,缺乏对社会本质和人性的深度挖掘;部分作品因零度情感叙事过度使用,导致情感平淡,感染力不足;题材多局限于转型期日常,创作视野有一定狭窄性。","max":4,"id":"当代文思-14-term-33"},{"n":34,"type":"short","prompt":"简述新现实主义思潮的三个阶段及其代表作品。","options":[],"key":"","answer":"第一阶段以刘震云、池莉、方方为代表,微观呈现转型期日常生存,代表作品有《一地鸡毛》《烦恼人生》,奠定思潮的平民化基调;第二阶段以毕飞宇为代表,深度挖掘转型期社会矛盾,代表作品有《推拿》;第三阶段实现现实聚焦与思想深度的结合,作品在聚焦现实的同时具有深刻的思想内涵。","max":6,"id":"当代文思-14-short-34"},{"n":35,"type":"short","prompt":"简述新现实主义文学思潮的特质。","options":[],"key":"","answer":"新现实主义文学思潮的特质有三方面:一是聚焦现实生存,关注转型期普通人的日常困境与社会变迁中的个体命运,使作品具有平民性和时代针对性;二是零度情感叙事,以客观中立的笔触呈现现实,避免主观褒贬与价值判断介入;三是日常细节还原,通过琐碎细节构建现实的真实感。","max":6,"id":"当代文思-14-short-35"},{"n":36,"type":"short","prompt":"简述聚焦式写作与新现实主义思潮产生的历史背景。","options":[],"key":"","answer":"历史背景是转型时期的社会变化,包括社会结构的调整、价值观念的冲突、普通人的生存状态变迁,这些变化为聚焦式写作提供了丰富的现实素材,使转型期现实成为文学书写的重要对象,促使新现实主义思潮以文学形式反映转型期的社会现实与价值冲突。","max":6,"id":"当代文思-14-short-36"},{"n":37,"type":"essay","prompt":"论述新现实主义文学思潮的特质。","options":[],"key":"","answer":"一、聚焦现实生存:摒弃宏大历史叙事,将镜头对准转型期的普通人,通过职场压力、家庭琐事展现个体生存困境,使文学具有平民性和时代针对性。 二、零度情感叙事:作家隐藏主观褒贬,以客观中立的笔触呈现现实,让读者自主感知生存的重量。 三、日常细节还原:通过柴米油盐等琐碎细节构建现实真实感,让读者产生共鸣,使作品具有强烈的代入感。","max":10,"id":"当代文思-14-essay-37"},{"n":38,"type":"essay","prompt":"论述新现实主义思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:文学层面推动现实主义传统的当代转型,以聚焦式写作、零度情感叙事等手法拓展现实主义疆域;社会层面帮助读者理解社会变迁中的个体命运,具有社会认知价值。 二、局限:部分作品过度聚焦现实细节,缺乏对社会本质和人性的深度挖掘;零度情感叙事的过度使用导致情感平淡,感染力不足;题材多局限于转型期日常,创作视野有一定狭窄性。","max":10,"id":"当代文思-14-essay-38"},{"n":39,"type":"essay","prompt":"论述新现实主义思潮的三个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段以刘震云、池莉、方方为代表,创作特点是微观呈现转型期日常生存,聚焦职场应酬、家庭矛盾等琐事,奠定平民化基调。 二、第二阶段以毕飞宇为代表,创作特点是深度挖掘社会矛盾,从日常生存的表层描写进入社会结构的深层分析。 三、第三阶段创作特点是现实聚焦与思想深度的结合,融入对人性与命运的思考,标志思潮走向艺术与思想的融合。","max":10,"id":"当代文思-14-essay-39"}],"rawMax":111},{"id":"当代文思-15","title":"章节练习(12章)","questions":[{"n":1,"type":"single","prompt":"女性主义写作思潮产生的背景是","options":[{"key":"A","text":"性别意识的觉醒"},{"key":"B","text":"传统性别观念的强化"},{"key":"C","text":"男性文学的垄断"},{"key":"D","text":"政治文学的主导"}],"key":"A","answer":"性别意识的觉醒","max":1,"id":"当代文思-15-single-1"},{"n":2,"type":"single","prompt":"以下不属于女性主义写作第一阶段代表作家的是","options":[{"key":"A","text":"张洁"},{"key":"B","text":"戴厚英"},{"key":"C","text":"北岛"},{"key":"D","text":"谌容"}],"key":"C","answer":"北岛","max":1,"id":"当代文思-15-single-2"},{"n":3,"type":"single","prompt":"女性主义写作思潮的主要特点不包括","options":[{"key":"A","text":"性别意识的彰显"},{"key":"B","text":"女性经验的书写"},{"key":"C","text":"男性视角的主导"},{"key":"D","text":"女性话语的建构"}],"key":"C","answer":"男性视角的主导","max":1,"id":"当代文思-15-single-3"},{"n":4,"type":"single","prompt":"张洁的女性主义代表作是","options":[{"key":"A","text":"《爱,是不能忘记的》"},{"key":"B","text":"《长恨歌》"},{"key":"C","text":"《红高粱家族》"},{"key":"D","text":"《白鹿原》"}],"key":"A","answer":"《爱,是不能忘记的》","max":1,"id":"当代文思-15-single-4"},{"n":5,"type":"single","prompt":"女性主义写作与传统女性写作的核心区别是","options":[{"key":"A","text":"是否关注女性"},{"key":"B","text":"性别意识的觉醒程度"},{"key":"C","text":"是否采用虚构手法"},{"key":"D","text":"创作年代的早晚"}],"key":"B","answer":"性别意识的觉醒程度","max":1,"id":"当代文思-15-single-5"},{"n":6,"type":"single","prompt":"女性主义写作思潮的意义在于","options":[{"key":"A","text":"强化传统性别观念"},{"key":"B","text":"推动女性意识与话语的建构"},{"key":"C","text":"促进男性文学的发展"},{"key":"D","text":"回归单一男性视角"}],"key":"B","answer":"推动女性意识与话语的建构","max":1,"id":"当代文思-15-single-6"},{"n":7,"type":"single","prompt":"以下属于女性主义写作第二阶段代表作家的是","options":[{"key":"A","text":"铁凝"},{"key":"B","text":"莫言"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"A","answer":"铁凝","max":1,"id":"当代文思-15-single-7"},{"n":8,"type":"single","prompt":"女性主义写作对性别体验的聚焦主要体现在","options":[{"key":"A","text":"男性英雄的塑造"},{"key":"B","text":"女性在爱情、婚姻、职场中的生存体验"},{"key":"C","text":"历史战争的描写"},{"key":"D","text":"仙侠世界的构建"}],"key":"B","answer":"女性在爱情、婚姻、职场中的生存体验","max":1,"id":"当代文思-15-single-8"},{"n":9,"type":"single","prompt":"女性主义写作思潮的局限性在于","options":[{"key":"A","text":"过度强调女性意识,对男性视角关注不足"},{"key":"B","text":"对女性体验关注过少"},{"key":"C","text":"性别意识过于淡薄"},{"key":"D","text":"女性话语倡导不足"}],"key":"A","answer":"过度强调女性意识,对男性视角关注不足","max":1,"id":"当代文思-15-single-9"},{"n":10,"type":"single","prompt":"女性主义写作第一阶段的“性别书写”表现为","options":[{"key":"A","text":"传统女性形象的塑造"},{"key":"B","text":"女性意识觉醒的初步表达"},{"key":"C","text":"男性主导的叙事"},{"key":"D","text":"商业元素的大量融入"}],"key":"B","answer":"女性意识觉醒的初步表达","max":1,"id":"当代文思-15-single-10"},{"n":11,"type":"single","prompt":"女性主义写作第三阶段的创作特点是","options":[{"key":"A","text":"完全抛弃性别意识"},{"key":"B","text":"性别意识与多元视角的结合"},{"key":"C","text":"回归传统性别观念"},{"key":"D","text":"专注于商业写作"}],"key":"B","answer":"性别意识与多元视角的结合","max":1,"id":"当代文思-15-single-11"},{"n":12,"type":"single","prompt":"女性主义写作与西方女性主义的关联在于","options":[{"key":"A","text":"都强调男性绝对主导"},{"key":"B","text":"都关注女性意识与话语"},{"key":"C","text":"都追求商业价值"},{"key":"D","text":"都回避性别议题"}],"key":"B","answer":"都关注女性意识与话语","max":1,"id":"当代文思-15-single-12"},{"n":13,"type":"single","prompt":"女性主义写作第二阶段的主要创作倾向是","options":[{"key":"A","text":"对女性复杂生存处境的深度挖掘"},{"key":"B","text":"对传统性别观念的完全复古"},{"key":"C","text":"对商业市场的完全迎合"},{"key":"D","text":"对男性文学的模仿"}],"key":"A","answer":"对女性复杂生存处境的深度挖掘","max":1,"id":"当代文思-15-single-13"},{"n":14,"type":"single","prompt":"对女性主义写作的批判观点主要认为其","options":[{"key":"A","text":"过度强调女性意识,缺乏性别对话"},{"key":"B","text":"对女性体验关注不足"},{"key":"C","text":"性别意识过于淡薄"},{"key":"D","text":"女性话语倡导不够"}],"key":"A","answer":"过度强调女性意识,缺乏性别对话","max":1,"id":"当代文思-15-single-14"},{"n":15,"type":"single","prompt":"女性主义写作思潮的“性别体验”主要体现在","options":[{"key":"A","text":"男性的职场奋斗"},{"key":"B","text":"女性在性别关系中的独特经历与感受"},{"key":"C","text":"历史人物的传奇故事"},{"key":"D","text":"商业明星的私生活"}],"key":"B","answer":"女性在性别关系中的独特经历与感受","max":1,"id":"当代文思-15-single-15"},{"n":16,"type":"fill","prompt":"女性主义写作思潮产生的背景是 ______ 的觉醒。","options":[],"key":"性别意识","answer":"性别意识","max":2,"id":"当代文思-15-fill-16"},{"n":17,"type":"fill","prompt":"女性主义写作第一阶段的代表作家有张洁、戴厚英和 ______ 等。","options":[],"key":"谌容","answer":"谌容","max":2,"id":"当代文思-15-fill-17"},{"n":18,"type":"fill","prompt":"女性主义写作思潮的主要特点包括性别意识的彰显、女性经验的书写和 ______ 的建构。","options":[],"key":"女性话语","answer":"女性话语","max":2,"id":"当代文思-15-fill-18"},{"n":19,"type":"fill","prompt":"张洁的女性主义代表作《爱,是不能忘记的》聚焦的是女性 ______ 与婚姻的自主追求。","options":[],"key":"爱情","answer":"爱情","max":2,"id":"当代文思-15-fill-19"},{"n":20,"type":"fill","prompt":"女性主义写作思潮的意义在于推动 ______ 意识与话语的建构。","options":[],"key":"女性","answer":"女性","max":2,"id":"当代文思-15-fill-20"},{"n":21,"type":"fill","prompt":"女性主义写作产生的主要背景是 ______ 的觉醒。","options":[],"key":"性别意识","answer":"性别意识","max":2,"id":"当代文思-15-fill-21"},{"n":22,"type":"fill","prompt":"女性主义写作对性别体验的聚焦主要体现在女性在爱情、婚姻、 ______ 中的生存体验。","options":[],"key":"职场","answer":"职场","max":2,"id":"当代文思-15-fill-22"},{"n":23,"type":"fill","prompt":"女性主义写作思潮的局限性在于部分作品过度强调女性意识,对 ______ 视角关注不足。","options":[],"key":"男性","answer":"男性","max":2,"id":"当代文思-15-fill-23"},{"n":24,"type":"fill","prompt":"女性主义写作第一阶段的“性别书写”表现为女性意识觉醒的 ______ 表达。","options":[],"key":"初步","answer":"初步","max":2,"id":"当代文思-15-fill-24"},{"n":25,"type":"fill","prompt":"女性主义写作第三阶段的创作特点是性别意识与 ______ 视角的结合。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-15-fill-25"},{"n":26,"type":"fill","prompt":"女性主义写作与西方女性主义的共同之处在于都关注 ______ 意识与话语。","options":[],"key":"女性","answer":"女性","max":2,"id":"当代文思-15-fill-26"},{"n":27,"type":"fill","prompt":"女性主义写作第二阶段的主要代表作品有铁凝的《 ______ 》等。","options":[],"key":"玫瑰门","answer":"玫瑰门","max":2,"id":"当代文思-15-fill-27"},{"n":28,"type":"term","prompt":"女性主义写作思潮","options":[],"key":"","answer":"女性主义写作思潮源于性别意识觉醒,以彰显性别意识、书写女性经验、建构女性话语为特点。分三个发展阶段,代表作家有张洁、铁凝等,意义在于推动女性意识与话语的建构,局限是部分作品过度强调女性意识。","max":4,"id":"当代文思-15-term-28"},{"n":29,"type":"term","prompt":"女性主义写作的主要特点","options":[],"key":"","answer":"女性主义写作的核心艺术与思想特征,包括性别意识的彰显,反对性别压迫,追求性别平等;女性经验的书写,聚焦女性在爱情、婚姻、职场等的独特体验;女性话语的建构,建立女性专属的文学表达体系。","max":4,"id":"当代文思-15-term-29"},{"n":30,"type":"term","prompt":"女性主义写作的三个阶段","options":[],"key":"","answer":"女性主义写作的发展分为三个阶段:第一阶段以张洁、谌容为代表,是女性意识觉醒的初步表达;第二阶段以铁凝为代表,深度挖掘女性复杂生存处境;第三阶段实现性别意识与多元视角的结合,对性别议题的探讨更具包容性。","max":4,"id":"当代文思-15-term-30"},{"n":31,"type":"term","prompt":"性别体验","options":[],"key":"","answer":"女性主义写作聚焦的核心内容,指女性在性别关系中因性别差异带来的独特经历与感受,包括爱情中遭遇的性别歧视、职场性别天花板、家庭性别角色冲突等,是展现性别压迫与女性反抗的主要载体。","max":4,"id":"当代文思-15-term-31"},{"n":32,"type":"term","prompt":"女性主义写作的意义","options":[],"key":"","answer":"女性主义写作的价值在于推动女性意识与话语的建构,打破男性主导的文学垄断,使女性获得独立的文学表达空间;同时拓展文学的题材与视角,推动文学领域的性别平等与多元发展,具有性别解放与文学创新意义。","max":4,"id":"当代文思-15-term-32"},{"n":33,"type":"term","prompt":"女性主义写作的局限性","options":[],"key":"","answer":"女性主义写作的不足,主要表现为部分作品过度强调女性意识,缺乏与男性视角的对话,创作视野片面;部分作品对女性经验的书写过于狭隘,未能涵盖女性群体的多样性;对西方女性主义的借鉴存在生硬问题。","max":4,"id":"当代文思-15-term-33"},{"n":34,"type":"short","prompt":"简述女性主义写作思潮的三个阶段及其代表性作品。","options":[],"key":"","answer":"第一阶段以张洁、谌容为代表,是女性意识觉醒的初步表达,代表作品有《爱,是不能忘记的》《人到中年》,开启女性主义写作的先河;第二阶段以铁凝为代表,深度挖掘女性复杂生存处境,代表作品有《玫瑰门》;第三阶段实现性别意识与多元视角的结合,对性别议题的探讨更具包容性。","max":6,"id":"当代文思-15-short-34"},{"n":35,"type":"short","prompt":"简述女性主义写作思潮的主要特点。","options":[],"key":"","answer":"女性主义写作思潮的主要特点有三方面:一是性别意识的彰显,反对性别压迫,追求性别平等,使性别意识成为作品的核心思想内核;二是女性经验的书写,聚焦女性在爱情、婚姻、 职场等领域的独特生存体验;三是女性话语的建构,建立女性专属的文学表达体系,打破男性话语的垄断。","max":6,"id":"当代文思-15-short-35"},{"n":36,"type":"short","prompt":"简述性别体验与女性主义写作思潮产生的背景。","options":[],"key":"","answer":"背景是性别意识的觉醒,在社会思想解放的语境下,女性开始意识到自身在性别关系中遭遇的压迫与不平等。这种觉醒促使女性通过文学创作表达对性别平等的追求,反思性别压迫的根源与传统的性别观念,使性别体验成为文学表达的重要内容,形成了女性主义写作思潮。","max":6,"id":"当代文思-15-short-36"},{"n":37,"type":"essay","prompt":"论述女性主义写作思潮的主要特点。","options":[],"key":"","answer":"一、性别意识的彰显:反对性别压迫,追求性别平等,表达对传统性别观念的反抗,使性别意识成为作品的核心思想内核。 二、女性经验的书写:聚焦女性在爱情、婚姻、职场等领域的独特生存体验,直观展现性别压迫的种种表现。 三、女性话语的建构:建立女性专属的文学表达体系,在叙事视角、语言风格、主题表达上突出女性特质,打破男性话语的垄断。","max":10,"id":"当代文思-15-essay-37"},{"n":38,"type":"essay","prompt":"论述女性主义写作思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:社会层面是女性争取性别平等的武器,揭示职场歧视、家庭角色固化等性别压迫表现;文学层面打破男性主导的文学垄断,建构女性话语体系,拓展文学的题材与视角。 二、局限:部分作品过度强调女性意识,缺乏与男性视角的对话,创作视野片面;对女性经验的书写过于狭隘,未能涵盖不同阶层女性的多样性;借鉴西方女性主义存在生硬移植问题。","max":10,"id":"当代文思-15-essay-38"},{"n":39,"type":"essay","prompt":"论述女性主义写作思潮的三个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段以张洁、谌容为代表,创作特点是女性意识觉醒的初步表达,聚焦女性在爱情、婚姻、职场中的困境,开启女性主义写作的先河。 二、第二阶段以铁凝为代表,创作特点是深度挖掘女性复杂生存处境,探讨其精神困境与人性挣扎。 三、第三阶段创作特点是性别意识与多元视角的结合,融入男性视角、社会视角,探讨性别与阶级、文化的交叉影响。","max":10,"id":"当代文思-15-essay-39"}],"rawMax":111},{"id":"当代文思-16","title":"章节练习(13章)","questions":[{"n":1,"type":"single","prompt":"“个人化写作”与自由主义思潮产生的背景是","options":[{"key":"A","text":"多元价值观念的蔓延"},{"key":"B","text":"单一价值观念的强化"},{"key":"C","text":"传统文学的垄断"},{"key":"D","text":"政治文学的主导"}],"key":"A","answer":"多元价值观念的蔓延","max":1,"id":"当代文思-16-single-1"},{"n":2,"type":"single","prompt":"以下不属于自由主义思潮第一阶段代表作家的是","options":[{"key":"A","text":"陈忠实"},{"key":"B","text":"北岛"},{"key":"C","text":"海子"},{"key":"D","text":"以上都不是"}],"key":"B","answer":"北岛","max":1,"id":"当代文思-16-single-2"},{"n":3,"type":"single","prompt":"自由主义思潮的主要特征不包括","options":[{"key":"A","text":"个人意识的彰显"},{"key":"B","text":"创作自由的追求"},{"key":"C","text":"单一价值的固守"},{"key":"D","text":"多元表达的倡导"}],"key":"C","answer":"单一价值的固守","max":1,"id":"当代文思-16-single-3"},{"n":4,"type":"single","prompt":"海子的自由主义代表作是","options":[{"key":"A","text":"《面朝大海,春暖花开》"},{"key":"B","text":"《白鹿原》"},{"key":"C","text":"《红高粱家族》"},{"key":"D","text":"《长恨歌》"}],"key":"A","answer":"《面朝大海,春暖花开》","max":1,"id":"当代文思-16-single-4"},{"n":5,"type":"single","prompt":"“个人化写作”与传统集体写作的核心区别是","options":[{"key":"A","text":"是否采用虚构手法"},{"key":"B","text":"创作年代的早晚"},{"key":"C","text":"个人意识的觉醒程度"},{"key":"D","text":"是否关注现实"}],"key":"C","answer":"个人意识的觉醒程度","max":1,"id":"当代文思-16-single-5"},{"n":6,"type":"single","prompt":"自由主义思潮的意义在于","options":[{"key":"A","text":"强化单一价值观念"},{"key":"B","text":"推动个人意识与创作自由的追求"},{"key":"C","text":"促进传统文学的发展"},{"key":"D","text":"回归政治文学"}],"key":"B","answer":"推动个人意识与创作自由的追求","max":1,"id":"当代文思-16-single-6"},{"n":7,"type":"single","prompt":"以下属于自由主义思潮第二阶段代表作家的是","options":[{"key":"A","text":"莫言"},{"key":"B","text":"余华"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"以上都是","max":1,"id":"当代文思-16-single-7"},{"n":8,"type":"single","prompt":"“个人化写作”对个人体验的聚焦主要体现在","options":[{"key":"A","text":"集体英雄的塑造"},{"key":"B","text":"个人在生活、精神中的独特体验"},{"key":"C","text":"历史战争的描写"},{"key":"D","text":"仙侠世界的构建"}],"key":"B","answer":"个人在生活、精神中的独特体验","max":1,"id":"当代文思-16-single-8"},{"n":9,"type":"single","prompt":"自由主义思潮的局限性在于","options":[{"key":"A","text":"过度强调个人意识,对集体价值关注不足"},{"key":"B","text":"对个人体验关注过少"},{"key":"C","text":"创作自由倡导不足"},{"key":"D","text":"多元表达倡导不够"}],"key":"A","answer":"过度强调个人意识,对集体价值关注不足","max":1,"id":"当代文思-16-single-9"},{"n":10,"type":"single","prompt":"自由主义思潮第一阶段的“个人化写作”表现为","options":[{"key":"A","text":"传统集体形象的塑造"},{"key":"B","text":"个人意识觉醒的初步表达"},{"key":"C","text":"集体主导的叙事"},{"key":"D","text":"商业元素的大量融入"}],"key":"B","answer":"个人意识觉醒的初步表达","max":1,"id":"当代文思-16-single-10"},{"n":11,"type":"single","prompt":"自由主义思潮第二阶段的创作特点是","options":[{"key":"A","text":"完全抛弃个人意识"},{"key":"B","text":"个人意识与多元表达的结合"},{"key":"C","text":"回归传统集体写作"},{"key":"D","text":"专注于商业写作"}],"key":"B","answer":"个人意识与多元表达的结合","max":1,"id":"当代文思-16-single-11"},{"n":12,"type":"single","prompt":"自由主义思潮与传统集体写作的关联在于","options":[{"key":"A","text":"都强调集体绝对主导"},{"key":"B","text":"都关注个人意识"},{"key":"C","text":"都采用单一叙事"},{"key":"D","text":"以上都不是"}],"key":"D","answer":"以上都不是","max":1,"id":"当代文思-16-single-12"},{"n":13,"type":"single","prompt":"自由主义思潮第二阶段的主要创作倾向是","options":[{"key":"A","text":"对个人与社会复杂关系的深度挖掘"},{"key":"B","text":"对传统集体写作的完全复古"},{"key":"C","text":"对商业市场的完全迎合"},{"key":"D","text":"对个人意识的完全否定"}],"key":"A","answer":"对个人与社会复杂关系的深度挖掘","max":1,"id":"当代文思-16-single-13"},{"n":14,"type":"single","prompt":"对自由主义思潮的批判观点主要认为其","options":[{"key":"A","text":"过度强调个人意识,缺乏社会担当"},{"key":"B","text":"对个人体验关注不足"},{"key":"C","text":"个人意识过于淡薄"},{"key":"D","text":"多元表达倡导不够"}],"key":"A","answer":"过度强调个人意识,缺乏社会担当","max":1,"id":"当代文思-16-single-14"},{"n":15,"type":"single","prompt":"“个人化写作”的“个人体验”主要体现在","options":[{"key":"A","text":"集体的职场奋斗"},{"key":"B","text":"个人在生活、精神中的独特经历与感受"},{"key":"C","text":"历史人物的传奇故事"},{"key":"D","text":"商业明星的私生活"}],"key":"B","answer":"个人在生活、精神中的独特经历与感受","max":1,"id":"当代文思-16-single-15"},{"n":16,"type":"fill","prompt":"“个人化写作”与自由主义思潮产生的背景是 ______ 价值观念的蔓延。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-16-fill-16"},{"n":17,"type":"fill","prompt":"自由主义思潮第一阶段的代表作家有海子、 ______ 等。","options":[],"key":"陈忠实","answer":"陈忠实","max":2,"id":"当代文思-16-fill-17"},{"n":18,"type":"fill","prompt":"自由主义思潮的主要特征包括个人意识的彰显、创作自由的追求和 ______ 表达的倡导。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-16-fill-18"},{"n":19,"type":"fill","prompt":"海子的自由主义代表作《面朝大海,春暖花开》聚焦的是个人对 ______ 生活的向往。","options":[],"key":"自由","answer":"自由","max":2,"id":"当代文思-16-fill-19"},{"n":20,"type":"fill","prompt":"自由主义思潮的意义在于推动 ______ 意识与创作自由的追求。","options":[],"key":"个人","answer":"个人","max":2,"id":"当代文思-16-fill-20"},{"n":21,"type":"fill","prompt":"“个人化写作”产生的主要背景是 ______ 价值观念的蔓延。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-16-fill-21"},{"n":22,"type":"fill","prompt":"“个人化写作”对个人体验的聚焦主要体现在个人在生活、 ______ 中的独特体验。","options":[],"key":"精神","answer":"精神","max":2,"id":"当代文思-16-fill-22"},{"n":23,"type":"fill","prompt":"自由主义思潮的局限性在于部分作品过度强调个人意识,对 ______ 价值关注不足。","options":[],"key":"集体","answer":"集体","max":2,"id":"当代文思-16-fill-23"},{"n":24,"type":"fill","prompt":"自由主义思潮第一阶段的“个人化写作”表现为个人意识觉醒的 ______ 表达。","options":[],"key":"初步","answer":"初步","max":2,"id":"当代文思-16-fill-24"},{"n":25,"type":"fill","prompt":"自由主义思潮第二阶段的创作特点是个人意识与 ______ 表达的结合。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-16-fill-25"},{"n":26,"type":"fill","prompt":"“个人化写作”与自由主义思潮的核心在于关注 ______ 意识与创作自由。","options":[],"key":"个人","answer":"个人","max":2,"id":"当代文思-16-fill-26"},{"n":27,"type":"fill","prompt":"自由主义思潮第二阶段的主要代表作品有莫言的《 ______ 》等。","options":[],"key":"红高粱家族","answer":"红高粱家族","max":2,"id":"当代文思-16-fill-27"},{"n":28,"type":"term","prompt":"“个人化写作”与自由主义思潮","options":[],"key":"","answer":"该思潮源于多元价值观念蔓延,以彰显个人意识、追求创作自由、倡导多元表达为特点。分两个发展阶段,代表作家有海子、陈忠实、莫言等,意义在于推动个人意识与创作自由的追求,局限是部分作品过度强调个人意识。","max":4,"id":"当代文思-16-term-28"},{"n":29,"type":"term","prompt":"自由主义思潮的主要特征","options":[],"key":"","answer":"自由主义思潮的核心艺术与思想特征,包括个人意识的彰显,强调个人的主体性与独特性, 反对集体对个人的压制;创作自由的追求,反对创作束缚,追求表达的自由;多元表达的倡导,承认文学表达的多样性,反对单一创作模式。","max":4,"id":"当代文思-16-term-29"},{"n":30,"type":"term","prompt":"自由主义思潮的两个阶段","options":[],"key":"","answer":"自由主义思潮的发展分为两个阶段:第一阶段以海子、陈忠实为代表,是个人意识觉醒的初步表达,聚焦个人在生活、历史中的独特体验;第二阶段以莫言、余华为代表,是个人意识与多元表达的结合,对个人与社会关系的探讨更具深度。","max":4,"id":"当代文思-16-term-30"},{"n":31,"type":"term","prompt":"个人体验","options":[],"key":"","answer":"“个人化写作”聚焦的核心内容,指个人在生活、精神中因个体差异带来的独特经历与感受, 包括个人的情感世界、思想追求、精神困境等,展现个人对自由与独特性的渴望,是展现个人主体性与自由追求的主要载体。","max":4,"id":"当代文思-16-term-31"},{"n":32,"type":"term","prompt":"“个人化写作”的意义","options":[],"key":"","answer":"“个人化写作”的价值在于推动个人意识与创作自由的追求,打破集体写作的垄断,使个人在文学领域获得独立表达的空间,推动文学的多元化发展;同时拓展文学的题材与视角,具有个人解放与文学创新意义。","max":4,"id":"当代文思-16-term-32"},{"n":33,"type":"term","prompt":"“个人化写作”的局限性","options":[],"key":"","answer":"“个人化写作”的不足,主要表现为部分作品过度强调个人意识,缺乏对集体价值与社会责任的关注,创作视野片面;部分作品对个人体验的书写过于狭隘,未能涵盖不同背景个人的多样性;追求个人自由时忽视社会责任。","max":4,"id":"当代文思-16-term-33"},{"n":34,"type":"short","prompt":"简述自由主义思潮的两个阶段及其代表作品。","options":[],"key":"","answer":"第一阶段以海子、陈忠实为代表,是个人意识觉醒的初步表达,代表作品有《面朝大海,春暖花开》《白鹿原》,聚焦个人在生活、历史中的独特体验;第二阶段以莫言、余华为代表,是个人意识与多元表达的结合,代表作品有《红高粱家族》《活着》,探讨个人与社会、历史的复杂关系,展现个人意识在社会变迁中的坚守。","max":6,"id":"当代文思-16-short-34"},{"n":35,"type":"short","prompt":"简述自由主义思潮的主要特征。","options":[],"key":"","answer":"自由主义思潮的主要特征有三方面:一是个人意识的彰显,强调个人的主体性与独特性,反对集体对个人的压制;二是创作自由的追求,主张文学创作不受外在束缚,追求表达的自由;三是多元表达的倡导,承认文学表达的多样性与差异性,反对单一的创作模式。","max":6,"id":"当代文思-16-short-35"},{"n":36,"type":"short","prompt":"简述“个人化写作”与自由主义思潮产生的背景。","options":[],"key":"","answer":"背景是多元价值观念的蔓延,在社会思想解放的语境下,个人的独特性与差异性得到重视, 人们开始追求个人的文学表达与精神自由,反思集体写作局限,形成“个人化写作”与自由主义思潮。该思潮以彰显个人意识、追求创作自由、倡导多元表达为特点,代表作家有海子、 陈忠实、莫言等。","max":6,"id":"当代文思-16-short-36"},{"n":37,"type":"essay","prompt":"论述自由主义思潮的主要特征。","options":[],"key":"","answer":"一、个人意识的彰显:强调个人的主体性与独特性,反对集体对个人的压制,将个人意识置于创作的核心位置。 二、创作自由的追求:主张文学创作不受外在束缚,追求表达的自由,在创作手法、题材选择上打破传统限制。 三、多元表达的倡导:承认文学表达的多样性与差异性,反对单一的创作模式,使文学创作充满活力与创新。","max":10,"id":"当代文思-16-essay-37"},{"n":38,"type":"essay","prompt":"论述“个人化写作”与自由主义思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:个人层面打破集体写作的压制,使个人在文学领域获得独立表达的空间,具有个人解放意义;文学层面拓展文学的题材与视角,推动文学的多元化发展。 二、局限:部分作品过度强调个人意识,缺乏对集体价值的关注,创作视野片面;对个人体验的书写过于狭隘,未能涵盖个人的多样性;追求个人自由时忽视文学的社会功能。","max":10,"id":"当代文思-16-essay-38"},{"n":39,"type":"essay","prompt":"论述自由主义思潮的两个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段以海子、陈忠实为代表,创作特点是个人意识觉醒的初步表达,聚焦个人在生活、历史中的独特体验,表达个人对自由与独特性的渴望,开启“个人化写作”的先河。 二、第二阶段以莫言、余华为代表,创作特点是个人意识与多元表达的结合,深入探讨个人与社会、历史的复杂关系,展现个人意识在社会变迁中的坚守,从个人独白走向个人与社会的对话。","max":10,"id":"当代文思-16-essay-39"}],"rawMax":111},{"id":"当代文思-17","title":"章节练习(14章)","questions":[{"n":1,"type":"single","prompt":"80后写作与青年“亚文化”思潮产生的背景是","options":[{"key":"A","text":"社会结构的内在转型"},{"key":"B","text":"传统文学的垄断"},{"key":"C","text":"政治文学的主导"},{"key":"D","text":"商业文学的衰落"}],"key":"A","answer":"社会结构的内在转型","max":1,"id":"当代文思-17-single-1"},{"n":2,"type":"single","prompt":"以下不属于青年“亚文化”思潮第一阶段代表作家的是","options":[{"key":"A","text":"郭敬明"},{"key":"B","text":"韩寒"},{"key":"C","text":"北岛"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"北岛","max":1,"id":"当代文思-17-single-2"},{"n":3,"type":"single","prompt":"青年“亚文化”文学思潮的主要特征不包括","options":[{"key":"A","text":"代际意识的彰显"},{"key":"B","text":"青春体验的书写"},{"key":"C","text":"传统价值的固守"},{"key":"D","text":"边缘文化的表达"}],"key":"C","answer":"传统价值的固守","max":1,"id":"当代文思-17-single-3"},{"n":4,"type":"single","prompt":"郭敬明的青年“亚文化”代表作是","options":[{"key":"A","text":"《小时代》系列"},{"key":"B","text":"《白鹿原》"},{"key":"C","text":"《红高粱家族》"},{"key":"D","text":"《长恨歌》"}],"key":"A","answer":"《小时代》系列","max":1,"id":"当代文思-17-single-4"},{"n":5,"type":"single","prompt":"80后写作与传统文学的核心区别是","options":[{"key":"A","text":"创作年代的早晚"},{"key":"B","text":"代际意识的觉醒程度"},{"key":"C","text":"是否采用虚构手法"},{"key":"D","text":"是否关注现实"}],"key":"B","answer":"代际意识的觉醒程度","max":1,"id":"当代文思-17-single-5"},{"n":6,"type":"single","prompt":"青年“亚文化”思潮的意义在于","options":[{"key":"A","text":"强化传统价值观念"},{"key":"B","text":"推动青年代际意识与亚文化的表达"},{"key":"C","text":"促进传统文学的发展"},{"key":"D","text":"回归政治文学"}],"key":"B","answer":"推动青年代际意识与亚文化的表达","max":1,"id":"当代文思-17-single-6"},{"n":7,"type":"single","prompt":"以下属于青年“亚文化”思潮第二阶段代表作家的是","options":[{"key":"A","text":"张悦然"},{"key":"B","text":"莫言"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"A","answer":"张悦然","max":1,"id":"当代文思-17-single-7"},{"n":8,"type":"single","prompt":"青年“亚文化”写作对青春体验的聚焦主要体现在","options":[{"key":"A","text":"中年人的职场奋斗"},{"key":"B","text":"青年在成长、情感、社会中的独特体验"},{"key":"C","text":"历史战争的描写"},{"key":"D","text":"仙侠世界的构建"}],"key":"B","answer":"青年在成长、情感、社会中的独特体验","max":1,"id":"当代文思-17-single-8"},{"n":9,"type":"single","prompt":"青年“亚文化”思潮的局限性在于","options":[{"key":"A","text":"过度强调代际意识,对传统价值关注不足"},{"key":"B","text":"对青春体验关注过少"},{"key":"C","text":"代际意识过于淡薄"},{"key":"D","text":"边缘文化表达不够"}],"key":"A","answer":"过度强调代际意识,对传统价值关注不足","max":1,"id":"当代文思-17-single-9"},{"n":10,"type":"single","prompt":"青年“亚文化”思潮第一阶段的“代际写作”表现为","options":[{"key":"A","text":"传统中年形象的塑造"},{"key":"B","text":"青年代际意识觉醒的初步表达"},{"key":"C","text":"老年主导的叙事"},{"key":"D","text":"商业元素的大量融入"}],"key":"B","answer":"青年代际意识觉醒的初步表达","max":1,"id":"当代文思-17-single-10"},{"n":11,"type":"single","prompt":"青年“亚文化”思潮第二阶段的创作特点是","options":[{"key":"A","text":"完全抛弃代际意识"},{"key":"B","text":"代际意识与多元视角的结合"},{"key":"C","text":"回归传统价值观念"},{"key":"D","text":"专注于商业写作"}],"key":"B","answer":"代际意识与多元视角的结合","max":1,"id":"当代文思-17-single-11"},{"n":12,"type":"single","prompt":"青年“亚文化”思潮与传统文学的关联在于","options":[{"key":"A","text":"都强调代际绝对主导"},{"key":"B","text":"都关注青春体验"},{"key":"C","text":"都采用单一叙事"},{"key":"D","text":"以上都不是"}],"key":"D","answer":"以上都不是","max":1,"id":"当代文思-17-single-12"},{"n":13,"type":"single","prompt":"青年“亚文化”思潮第二阶段的主要创作倾向是","options":[{"key":"A","text":"对青年与社会复杂关系的深度挖掘"},{"key":"B","text":"对传统价值观念的完全复古"},{"key":"C","text":"对商业市场的完全迎合"},{"key":"D","text":"对老年文学的模仿"}],"key":"A","answer":"对青年与社会复杂关系的深度挖掘","max":1,"id":"当代文思-17-single-13"},{"n":14,"type":"single","prompt":"对青年“亚文化”思潮的批判观点主要认为其","options":[{"key":"A","text":"过度强调代际意识,缺乏社会担当"},{"key":"B","text":"对青春体验关注不足"},{"key":"C","text":"代际意识过于淡薄"},{"key":"D","text":"边缘文化表达不够"}],"key":"A","answer":"过度强调代际意识,缺乏社会担当","max":1,"id":"当代文思-17-single-14"},{"n":15,"type":"single","prompt":"青年“亚文化”思潮的“青春体验”主要体现在","options":[{"key":"A","text":"中年人的家庭生活"},{"key":"B","text":"青年在代际、情感、社会中的独特经历与感受"},{"key":"C","text":"历史人物的传奇故事"},{"key":"D","text":"商业明星的私生活"}],"key":"B","answer":"青年在代际、情感、社会中的独特经历与感受","max":1,"id":"当代文思-17-single-15"},{"n":16,"type":"fill","prompt":"80后写作与青年“亚文化”思潮产生的背景是 ______ 结构的内在转型。","options":[],"key":"社会","answer":"社会","max":2,"id":"当代文思-17-fill-16"},{"n":17,"type":"fill","prompt":"青年“亚文化”思潮第一阶段的代表作家有郭敬明、 ______ 等。","options":[],"key":"韩寒","answer":"韩寒","max":2,"id":"当代文思-17-fill-17"},{"n":18,"type":"fill","prompt":"青年“亚文化”文学思潮的主要特征包括代际意识的彰显、青春体验的书写和 ______ 文化的表达。","options":[],"key":"边缘","answer":"边缘","max":2,"id":"当代文思-17-fill-18"},{"n":19,"type":"fill","prompt":"郭敬明的青年“亚文化”代表作《小时代》系列聚焦的是80后青年的 ______ 生活与情感。","options":[],"key":"都市","answer":"都市","max":2,"id":"当代文思-17-fill-19"},{"n":20,"type":"fill","prompt":"青年“亚文化”思潮的意义在于推动青年 ______ 意识与亚文化的表达。","options":[],"key":"代际","answer":"代际","max":2,"id":"当代文思-17-fill-20"},{"n":21,"type":"fill","prompt":"80后写作产生的主要背景是 ______ 结构的内在转型。","options":[],"key":"社会","answer":"社会","max":2,"id":"当代文思-17-fill-21"},{"n":22,"type":"fill","prompt":"青年“亚文化”写作对青春体验的聚焦主要体现在青年在成长、 ______ 、社会中的独特体验。","options":[],"key":"情感","answer":"情感","max":2,"id":"当代文思-17-fill-22"},{"n":23,"type":"fill","prompt":"青年“亚文化”思潮的局限性在于部分作品过度强调代际意识,对 ______ 价值关注不足。","options":[],"key":"传统","answer":"传统","max":2,"id":"当代文思-17-fill-23"},{"n":24,"type":"fill","prompt":"青年“亚文化”思潮第一阶段的“代际写作”表现为青年代际意识觉醒的 ______ 表达。","options":[],"key":"初步","answer":"初步","max":2,"id":"当代文思-17-fill-24"},{"n":25,"type":"fill","prompt":"青年“亚文化”思潮第二阶段的创作特点是代际意识与 ______ 视角的结合。","options":[],"key":"多元","answer":"多元","max":2,"id":"当代文思-17-fill-25"},{"n":26,"type":"fill","prompt":"80后写作与青年“亚文化”思潮的核心在于关注 ______ 代际意识与亚文化表达。","options":[],"key":"青年","answer":"青年","max":2,"id":"当代文思-17-fill-26"},{"n":27,"type":"fill","prompt":"青年“亚文化”思潮第二阶段的主要代表作品有张悦然的《 ______ 》等。","options":[],"key":"樱桃之远","answer":"樱桃之远","max":2,"id":"当代文思-17-fill-27"},{"n":28,"type":"term","prompt":"80后写作与青年“亚文化”思潮","options":[],"key":"","answer":"该思潮源于社会结构内在转型,以彰显代际意识、书写青春体验、表达边缘文化为特点。分两个阶段,代表作家有郭敬明、韩寒、张悦然等,其意义在于推动青年代际意识与亚文化的表达,局限是部分作品过度强调代际意识。","max":4,"id":"当代文思-17-term-28"},{"n":29,"type":"term","prompt":"青年“亚文化”思潮的主要特征","options":[],"key":"","answer":"该思潮的核心特征包括代际意识的彰显,强调青年代际的独特性与差异性,反对代际压迫; 青春体验的书写,聚焦青年在成长、情感、社会中的独特经历;边缘文化的表达,展现青年亚文化的边缘性与反叛性。","max":4,"id":"当代文思-17-term-29"},{"n":30,"type":"term","prompt":"青年“亚文化”思潮的两个阶段","options":[],"key":"","answer":"该思潮的发展分为两个阶段:第一阶段以郭敬明、韩寒为代表,是青年代际意识觉醒的初步表达;第二阶段以张悦然为代表,是代际意识与多元视角的结合,对青年与社会关系的探讨更具深度,展现青年在社会变迁中的挣扎与坚守。","max":4,"id":"当代文思-17-term-30"},{"n":31,"type":"term","prompt":"青春体验","options":[],"key":"","answer":"青年“亚文化”写作聚焦的核心内容,指青年在代际、成长、情感、社会中因年龄与代际差异带来的独特经历与感受,展现青年代际的生存状态与精神世界,使作品具有强烈的青春感染力,是青年代际意识与亚文化的主要载体。","max":4,"id":"当代文思-17-term-31"},{"n":32,"type":"term","prompt":"80后写作的意义","options":[],"key":"","answer":"80后写作的价值在于推动了青年代际意识与亚文化的表达,打破了传统文学对青年的忽视,使青年获得独立表达的空间;同时拓展了文学的题材与视角,使青春、代际、亚文化成为文学的重要主题,为当代文学注入青春活力。","max":4,"id":"当代文思-17-term-32"},{"n":33,"type":"term","prompt":"80后写作的局限性","options":[],"key":"","answer":"80后写作的不足,主要表现为部分作品过度强调代际意识,缺乏对传统价值与社会担当的关注,创作视野片面;部分作品对青春体验的书写过于狭隘,未能涵盖不同背景青年的多样性;此外在追求商业价值时存在文学性不足问题。","max":4,"id":"当代文思-17-term-33"},{"n":34,"type":"short","prompt":"简述青年“亚文化”思潮的两个阶段及其代表作品。","options":[],"key":"","answer":"第一阶段以郭敬明、韩寒为代表,是青年代际意识觉醒的初步表达,代表作品有《小时代》 《三重门》,聚焦80后青年在成长、教育、都市中的初步困境;第二阶段以张悦然为代表,是代际意识与多元视角的结合,代表作品有《樱桃之远》,深入探讨青年与社会、传统的复杂关系,展现青年在社会变迁中的挣扎与坚守。","max":6,"id":"当代文思-17-short-34"},{"n":35,"type":"short","prompt":"简述青年“亚文化”思潮的主要特征。","options":[],"key":"","answer":"青年“亚文化”思潮的主要特征有三方面:一是代际意识的彰显,强调青年代际的独特性与差异性,反对代际压迫;二是青春体验的书写,聚焦青年在成长、情感、社会中的独特经历; 三是边缘文化的表达,展现青年亚文化的边缘性与反叛性,挑战主流文化的霸权,构建青年表达范式。","max":6,"id":"当代文思-17-short-35"},{"n":36,"type":"short","prompt":"简述80后写作与青年“亚文化”思潮产生的背景。","options":[],"key":"","answer":"背景是社会结构的内在转型,在社会阶层分化、价值观念多元的语境下,80后青年形成独特的代际身份与亚文化。他们通过文学创作表达对代际差异、青春价值的追求,从而形成 80后写作与青年“亚文化”思潮。该思潮以彰显代际意识、书写青春体验、表达边缘文化为特点,代表作家有郭敬明、韩寒、张悦然等。","max":6,"id":"当代文思-17-short-36"},{"n":37,"type":"essay","prompt":"论述青年“亚文化”思潮的主要特征。","options":[],"key":"","answer":"一、代际意识的彰显:强调80后青年代际的独特性与差异性,反对代际压迫与主流文化的霸权,将代际意识置于创作的核心位置。 二、青春体验的书写:聚焦青年在成长、情感、社会中的独特经历,展现青年代际的生存状态与精神世界。 三、边缘文化的表达:展现青年亚文化的边缘性与反叛性,挑战主流文化的审美与价值,构建青年表达范式。","max":10,"id":"当代文思-17-essay-37"},{"n":38,"type":"essay","prompt":"论述80后写作与青年“亚文化”思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:青年文化层面是80后争取文化表达权的文学武器,推动社会对青年代际的关注;文学层面拓展文学的题材与视角,使青春、代际、亚文化成为文学的重要主题,为当代文学注入青春活力。 二、局限:部分作品过度强调代际意识,缺乏对传统价值与社会担当的关注;对青春体验的书写过于狭隘,代表性不足;追求商业价值时存在文学性不足问题。","max":10,"id":"当代文思-17-essay-38"},{"n":39,"type":"essay","prompt":"论述青年“亚文化”思潮的两个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段以郭敬明、韩寒为代表,创作特点是青年代际意识觉醒的初步表达,聚焦80 后青年在成长、教育、都市中的困境,以直白方式表达青年对代际差异、青春价值的渴望。 二、第二阶段以张悦然为代表,创作特点是代际意识与多元视角的结合,深入探讨青年与社会、传统的复杂关系,展现青年在社会变迁中的挣扎与坚守,思想性显著增强。","max":10,"id":"当代文思-17-essay-39"}],"rawMax":111},{"id":"当代文思-18","title":"章节练习(15章)","questions":[{"n":1,"type":"single","prompt":"网络文学与类型化写作思潮产生的背景是","options":[{"key":"A","text":"信息时代的网络文化"},{"key":"B","text":"传统文学的垄断"},{"key":"C","text":"政治文学的主导"},{"key":"D","text":"商业文学的衰落"}],"key":"A","answer":"信息时代的网络文化","max":1,"id":"当代文思-18-single-1"},{"n":2,"type":"single","prompt":"以下不属于类型化写作第一阶段代表类型的是","options":[{"key":"A","text":"玄幻"},{"key":"B","text":"言情"},{"key":"C","text":"北岛诗歌"},{"key":"D","text":"以上都不是"}],"key":"C","answer":"北岛诗歌","max":1,"id":"当代文思-18-single-2"},{"n":3,"type":"single","prompt":"类型化写作思潮的主要特征不包括","options":[{"key":"A","text":"题材的类型化"},{"key":"B","text":"叙事的模式化"},{"key":"C","text":"传统价值的固守"},{"key":"D","text":"受众的精准化"}],"key":"C","answer":"传统价值的固守","max":1,"id":"当代文思-18-single-3"},{"n":4,"type":"single","prompt":"《斗破苍穹》属于类型化写作中的类型","options":[{"key":"A","text":"玄幻"},{"key":"B","text":"言情"},{"key":"C","text":"历史"},{"key":"D","text":"科幻"}],"key":"A","answer":"玄幻","max":1,"id":"当代文思-18-single-4"},{"n":5,"type":"single","prompt":"类型化写作与传统纯文学的核心区别是","options":[{"key":"A","text":"创作年代的早晚"},{"key":"B","text":"题材与叙事的类型化程度"},{"key":"C","text":"是否采用虚构手法"},{"key":"D","text":"是否关注现实"}],"key":"B","answer":"题材与叙事的类型化程度","max":1,"id":"当代文思-18-single-5"},{"n":6,"type":"single","prompt":"网络文学与类型化写作思潮的意义在于","options":[{"key":"A","text":"强化传统纯文学"},{"key":"B","text":"推动文学类型化与网络传播的发展"},{"key":"C","text":"促进政治文学的发展"},{"key":"D","text":"回归传统文学"}],"key":"B","answer":"推动文学类型化与网络传播的发展","max":1,"id":"当代文思-18-single-6"},{"n":7,"type":"single","prompt":"以下属于类型化写作第二阶段代表类型的是","options":[{"key":"A","text":"都市异能"},{"key":"B","text":"莫言小说"},{"key":"C","text":"以上都是"},{"key":"D","text":"以上都不是"}],"key":"A","answer":"都市异能","max":1,"id":"当代文思-18-single-7"},{"n":8,"type":"single","prompt":"类型化写作对题材的聚焦主要体现在","options":[{"key":"A","text":"多元综合题材"},{"key":"B","text":"单一类型化题材"},{"key":"C","text":"历史战争题材"},{"key":"D","text":"仙侠世界题材"}],"key":"B","answer":"单一类型化题材","max":1,"id":"当代文思-18-single-8"},{"n":9,"type":"single","prompt":"网络文学与类型化写作思潮的局限性在于","options":[{"key":"A","text":"过度类型化,创新不足"},{"key":"B","text":"类型化不足"},{"key":"C","text":"受众过少"},{"key":"D","text":"题材过于多元"}],"key":"A","answer":"过度类型化,创新不足","max":1,"id":"当代文思-18-single-9"},{"n":10,"type":"single","prompt":"类型化写作第一阶段的“类型化创作”表现为","options":[{"key":"A","text":"多元题材融合"},{"key":"B","text":"类型化题材与模式的初步形成"},{"key":"C","text":"纯文学主导"},{"key":"D","text":"商业元素的缺乏"}],"key":"B","answer":"类型化题材与模式的初步形成","max":1,"id":"当代文思-18-single-10"},{"n":11,"type":"single","prompt":"类型化写作第二阶段的创作特点是","options":[{"key":"A","text":"完全抛弃类型化"},{"key":"B","text":"类型化与创新的结合"},{"key":"C","text":"回归纯文学"},{"key":"D","text":"专注于传统题材"}],"key":"B","answer":"类型化与创新的结合","max":1,"id":"当代文思-18-single-11"},{"n":12,"type":"single","prompt":"类型化写作与传统类型文学的关联在于","options":[{"key":"A","text":"都强调完全创新"},{"key":"B","text":"都关注类型化题材与叙事"},{"key":"C","text":"都采用纯文学手法"},{"key":"D","text":"以上都不是"}],"key":"B","answer":"都关注类型化题材与叙事","max":1,"id":"当代文思-18-single-12"},{"n":13,"type":"single","prompt":"类型化写作第二阶段的主要创作倾向是","options":[{"key":"A","text":"类型化与创新的深度融合"},{"key":"B","text":"对传统类型的完全复古"},{"key":"C","text":"对纯文学的完全模仿"},{"key":"D","text":"对商业市场的完全迎合"}],"key":"A","answer":"类型化与创新的深度融合","max":1,"id":"当代文思-18-single-13"},{"n":14,"type":"single","prompt":"对网络文学与类型化写作思潮的批判观点主要认为其","options":[{"key":"A","text":"过度类型化,同质化严重"},{"key":"B","text":"类型化不足"},{"key":"C","text":"受众过多"},{"key":"D","text":"题材过于多元"}],"key":"A","answer":"过度类型化,同质化严重","max":1,"id":"当代文思-18-single-14"},{"n":15,"type":"single","prompt":"类型化写作的“类型化题材”主要体现在","options":[{"key":"A","text":"多元综合题材"},{"key":"B","text":"单一固定的题材类型"},{"key":"C","text":"历史人物题材"},{"key":"D","text":"商业明星题材"}],"key":"B","answer":"单一固定的题材类型","max":1,"id":"当代文思-18-single-15"},{"n":16,"type":"fill","prompt":"网络文学与类型化写作思潮产生的背景是 ______ 时代的网络文化。","options":[],"key":"信息","answer":"信息","max":2,"id":"当代文思-18-fill-16"},{"n":17,"type":"fill","prompt":"类型化写作第一阶段的代表类型有玄幻、 ______ 等。","options":[],"key":"言情","answer":"言情","max":2,"id":"当代文思-18-fill-17"},{"n":18,"type":"fill","prompt":"类型化写作思潮的主要特征包括题材的类型化、叙事的模式化和 ______ 的精准化。","options":[],"key":"受众","answer":"受众","max":2,"id":"当代文思-18-fill-18"},{"n":19,"type":"fill","prompt":"《斗破苍穹》属于类型化写作中的 ______ 类型。","options":[],"key":"玄幻","answer":"玄幻","max":2,"id":"当代文思-18-fill-19"},{"n":20,"type":"fill","prompt":"网络文学与类型化写作思潮的意义在于推动文学 ______ 与网络传播的发展。","options":[],"key":"类型化","answer":"类型化","max":2,"id":"当代文思-18-fill-20"},{"n":21,"type":"fill","prompt":"类型化写作产生的主要背景是 ______ 时代的网络文化。","options":[],"key":"信息","answer":"信息","max":2,"id":"当代文思-18-fill-21"},{"n":22,"type":"fill","prompt":"类型化写作对题材的聚焦主要体现在 ______ 类型化题材。","options":[],"key":"单一","answer":"单一","max":2,"id":"当代文思-18-fill-22"},{"n":23,"type":"fill","prompt":"网络文学与类型化写作思潮的局限性在于部分作品过度 ______ ,创新不足。","options":[],"key":"类型化","answer":"类型化","max":2,"id":"当代文思-18-fill-23"},{"n":24,"type":"fill","prompt":"类型化写作第一阶段的“类型化创作”表现为类型化题材与模式的 ______ 形成。","options":[],"key":"初步","answer":"初步","max":2,"id":"当代文思-18-fill-24"},{"n":25,"type":"fill","prompt":"类型化写作第二阶段的创作特点是类型化与 ______ 的结合。","options":[],"key":"创新","answer":"创新","max":2,"id":"当代文思-18-fill-25"},{"n":26,"type":"fill","prompt":"类型化写作与传统类型文学的核心关联在于都关注 ______ 题材与叙事。","options":[],"key":"类型化","answer":"类型化","max":2,"id":"当代文思-18-fill-26"},{"n":27,"type":"fill","prompt":"类型化写作第二阶段的主要代表类型有都市 ______ 等。","options":[],"key":"异能","answer":"异能","max":2,"id":"当代文思-18-fill-27"},{"n":28,"type":"term","prompt":"网络文学与类型化写作思潮","options":[],"key":"","answer":"该思潮源于信息时代网络文化,以题材类型化、叙事模式化、受众精准化为特点。分两个阶段,代表类型有玄幻、言情、都市异能等,意义在于推动文学类型化与网络传播,使文学更贴近大众阅读需求,局限是部分作品过度类型化。","max":4,"id":"当代文思-18-term-28"},{"n":29,"type":"term","prompt":"类型化写作思潮的主要特征","options":[],"key":"","answer":"该思潮的核心艺术与传播特征,包括题材的类型化,聚焦单一固定题材;叙事的模式化,遵循固定叙事结构与套路,形成读者的阅读期待;受众的精准化,针对特定受众群体创作与传播,使作品高效触达目标受众。","max":4,"id":"当代文思-18-term-29"},{"n":30,"type":"term","prompt":"类型化写作的两个阶段","options":[],"key":"","answer":"类型化写作的发展分为两个阶段:第一阶段以玄幻、言情为代表,是类型化题材与模式的初步形成;第二阶段以都市异能为代表,是类型化与创新的结合,在类型框架内融入创新元素,使作品兼具类型辨识度与新鲜感,满足读者的阅读期待。","max":4,"id":"当代文思-18-term-30"},{"n":31,"type":"term","prompt":"类型化题材","options":[],"key":"","answer":"类型化写作聚焦的核心内容,指单一固定的题材类型,每种类型具有明确的题材边界与内容特征,围绕固定题材展开创作,便于读者快速识别与选择,满足大众对特定题材的阅读偏好,是类型化写作吸引受众的重要基础。","max":4,"id":"当代文思-18-term-31"},{"n":32,"type":"term","prompt":"网络文学与类型化写作的意义","options":[],"key":"","answer":"其价值在于推动了文学类型化与网络传播的发展,拓展了文学的类型形态与受众范围,使文学更贴近大众阅读需求;同时丰富了文学的创作与传播模式,为文学产业的发展提供新路径,产生巨大的经济价值。","max":4,"id":"当代文思-18-term-32"},{"n":33,"type":"term","prompt":"网络文学与类型化写作的局限性","options":[],"key":"","answer":"其不足主要表现为部分作品过度类型化,同质化严重,缺乏文学创新,使作品千篇一律;部分作品为迎合市场,牺牲了文学的深度与艺术性;此外,题材与叙事模式相对固定,对文学多样性的发展有一定限制。","max":4,"id":"当代文思-18-term-33"},{"n":34,"type":"short","prompt":"简述类型化写作思潮的两个阶段及其代表类型。","options":[],"key":"","answer":"第一阶段是类型化题材与模式的初步形成,代表类型有玄幻、言情等,注重题材的辨识度与叙事的流畅性,形成读者的阅读期待;第二阶段是类型化与创新的结合,代表类型有都市异能等,在类型框架内融入科幻、悬疑等创新元素,提升作品的文学性与可读性。","max":6,"id":"当代文思-18-short-34"},{"n":35,"type":"short","prompt":"简述类型化写作思潮的主要特征。","options":[],"key":"","answer":"类型化写作思潮的主要特征有三方面:一是题材的类型化,聚焦单一固定题材,题材边界明确;二是叙事的模式化,遵循固定的叙事结构与套路,使阅读过程具有可预测的快感;三是受众的精准化,针对特定受众群体进行创作与传播,实现传播效果的最大化。","max":6,"id":"当代文思-18-short-35"},{"n":36,"type":"short","prompt":"简述网络文学与类型化写作思潮产生的背景。","options":[],"key":"","answer":"背景是信息时代的网络文化,网络的普及与发展为类型化写作提供了创作平台与受众基础, 类型化文学因符合大众阅读偏好而蓬勃发展,形成网络文学与类型化写作思潮。该思潮以题材类型化、叙事模式化、受众精准化为特点,分两个发展阶段,代表类型有玄幻、言情、都市异能等。","max":6,"id":"当代文思-18-short-36"},{"n":37,"type":"essay","prompt":"论述类型化写作思潮的主要特征。","options":[],"key":"","answer":"一、题材的类型化:聚焦单一固定题材,题材边界明确,便于读者快速识别与选择,满足大众对特定题材的阅读偏好。 二、叙事的模式化:遵循固定的叙事结构与套路,形成读者的阅读期待,使阅读过程具有可预测的快感。 三、受众的精准化:针对特定受众群体进行创作与传播,使作品高效触达目标受众,实现传播效果的最大化。","max":10,"id":"当代文思-18-essay-37"},{"n":38,"type":"essay","prompt":"论述网络文学与类型化写作思潮的意义与局限性。","options":[],"key":"","answer":"一、意义:文学形态层面推动文学类型化发展,拓展文学的类型边界,使文学更贴近大众阅读需求;产业层面推动网络文学产业繁荣,形成创作、传播、IP开发的完整产业链,产生巨大经济价值。 二、局限:部分作品过度类型化,同质化严重,缺乏文学创新;部分作品为迎合市场牺牲了文学的深度与艺术性;题材与叙事模式相对固定,限制了文学多样性。","max":10,"id":"当代文思-18-essay-38"},{"n":39,"type":"essay","prompt":"论述类型化写作思潮的两个阶段及其创作特点。","options":[],"key":"","answer":"一、第一阶段创作特点是类型化题材与模式的初步形成,以玄幻、言情为代表类型,注重题材的辨识度与叙事的流畅性,满足大众的基本阅读需求,奠定类型化写作的基础。 二、第二阶段创作特点是类型化与创新的结合,以都市异能为代表类型,在类型框架基础上融入科幻、悬疑等创新元素,提升作品的文学性与可读性,思想性显著增强。","max":10,"id":"当代文思-18-essay-39"}],"rawMax":111}]},{"subject":"唐诗宋词","groups":[{"id":"唐诗宋词-1","title":"2026年模拟试卷(一)","questions":[{"n":1,"type":"single","prompt":"“初唐四杰”中,擅长以七言歌行铺陈帝京壮丽气象的诗人是","options":[{"key":"A","text":"王勃"},{"key":"B","text":"杨炯"},{"key":"C","text":"卢照邻"},{"key":"D","text":"骆宾王"}],"key":"C","answer":"卢照邻","max":1,"id":"唐诗宋词-1-single-1"},{"n":2,"type":"single","prompt":"下列诗句中,出自陈子昂《登幽州台歌》的是","options":[{"key":"A","text":"绿树村边合,青山郭外斜"},{"key":"B","text":"前不见古人,后不见来者"},{"key":"C","text":"海内存知己,天涯若比邻"},{"key":"D","text":"大漠孤烟直,长河落日圆"}],"key":"B","answer":"前不见古人,后不见来者","max":1,"id":"唐诗宋词-1-single-2"},{"n":3,"type":"single","prompt":"盛唐山水田园诗派中,其作品多体现“平淡自然之美”的诗人是","options":[{"key":"A","text":"王维"},{"key":"B","text":"孟浩然"},{"key":"C","text":"储光羲"},{"key":"D","text":"常建"}],"key":"B","answer":"孟浩然","max":1,"id":"唐诗宋词-1-single-3"},{"n":4,"type":"single","prompt":"下列作品中,属于高适边塞诗代表作的是","options":[{"key":"A","text":"《走马川行奉送出师西征》"},{"key":"B","text":"《燕歌行》"},{"key":"C","text":"《白雪歌送武判官归京》"},{"key":"D","text":"《夜上受降城闻笛》"}],"key":"B","answer":"《燕歌行》","max":1,"id":"唐诗宋词-1-singl {"key":"B","text":"锦帽貂裘,千骑卷平冈"},{"key":"C","text":"为报倾城随太守,亲射虎,看孙郎"},{"key":"D","text":"会挽雕弓如满月,西北望,射天狼"}],"key":"D","answer":"会挽雕弓如满月,西北望,射天狼","max":1,"id":"唐诗宋词-1-single-13"},{"n":14,"type":"single","prompt":"周邦彦《清真词》的艺术特点不包括","options":[{"key":"A","text":"律度精严"},{"key":"B","text":"善于铺叙"},{"key":"C","text":"语言通俗"},{"key":"D","text":"注重词法"}],"key":"C","answer":"语言通俗","max":1,"id":"唐诗宋词-1-single-14"},{"n":15,"type":"single","prompt":"李清照前后期词风差异显著,其后期词多抒发","options":[{"key":"A","text":"闺阁闲愁"},{"key":"B","text":"亡国之痛与思乡之情"},{"key":"C","text":"爱情甜蜜"},{"key":"D","text":"自然风光之美"}],"key":"B","answer":"亡国之痛与思乡之情","max":1,"id":"唐诗宋词-1-single-15"},{"n":16,"type":"multi","prompt":"下列关于初唐诗歌革新的说法,正确的有","options":[{"key":"A","text":"初唐诗歌革新针对齐梁绮靡文风"},{"key":"B","text":"陈子昂提出“汉魏风骨,晋宋莫传”"},{"key":"C","text":"“初唐四杰”批判“上官体”“骨气都尽”"},{"key":"D","text":"张说主张文采与风骨并重"},{"key":"E","text":"初唐诗歌革新分为太宗贞观、高宗、武则天到中宗三个阶段"}],"key":"ABCDE","answer":"初唐诗歌革新针对齐梁绮靡文风；陈子昂提出“汉魏风骨,晋宋莫传”；“初唐四杰”批判“上官体”“骨气都尽”；张说主张文采与风骨并重；初唐诗歌革新分为太宗贞观、高宗、武则天到中宗三个阶段","max":2,"id":"唐诗宋词-1-multi-16"},{"n":17,"type":"multi","prompt":"盛唐边塞诗的常见题材包括","options":[{"key":"A","text":"描绘边塞壮丽风光"},{"key":"B","text":"歌颂将士英勇抗敌"},{"key":"C","text":"反映将士思乡之情"},{"key":"D","text":"批判统治者穷兵黩武"},{"key":"E","text":"描写边塞民族交往"}],"key":"ABCDE","answer":"描绘边塞壮丽风光；歌颂将士英勇抗敌；反映将士思乡之情；批判统治者穷兵黩武；描写边塞民族交往","max":2,"id":"唐诗宋词-1-multi-17"},{"n":18,"type":"multi","prompt":"下列作品中,属于白居易新乐府的有","options":[{"key":"A","text":"《卖炭翁》"},{"key":"B","text":"《长恨歌》"},{"key":"C","text":"《秦中吟·轻肥》"},{"key":"D","text":"《新乐府·红线毯》"},{"key":"E","text":"《琵琶行》"}],"key":"ACD","answer":"《卖炭翁》；《秦中吟·轻肥》；《新乐府·红线毯》","max":2,"id":"唐诗宋词-1-multi-18"},{"n":19,"type":"multi","prompt":"下列词人中,属于“辛派词人”的有","options":[{"key":"A","text":"刘克庄"},{"key":"B","text":"陈亮"},{"key":"C","text":"刘过"},{"key":"D","text":"陆游"},{"key":"E","text":"姜夔"}],"key":"ABCD","answer":"刘克庄；陈亮；刘过；陆游","max":2,"id":"唐诗宋词-1-multi-19"},{"n":20,"type":"multi","prompt":"下列关于南宋词“雅化”的说法,正确的有","options":[{"key":"A","text":"姜夔《白石词》“归于骚雅”"},{"key":"B","text":"吴文英《梦窗词》注重炼字炼句"},{"key":"C","text":"史达祖《双双燕·咏燕》体现姜派词特点"},{"key":"D","text":"张炎《词源》提倡“清空”“骚雅”"},{"key":"E","text":"南宋词“雅化”远离家国情怀"}],"key":"ABCD","answer":"姜夔《白石词》“归于骚雅”；吴文英《梦窗词》注重炼字炼句；史达祖《双双燕·咏燕》体现姜派词特点；张炎《词源》提倡“清空”“骚雅”","max":2,"id":"唐诗宋词-1-multi-20"},{"n":21,"type":"term","prompt":"初唐四杰","options":[],"key":"","answer":"初唐四杰:指唐高宗至武后初年的王勃、杨炯、卢照邻、骆宾王四位诗人。他们仕途失意, 诗歌突破宫廷局限,视野由台阁移向江山、塞漠与市井,题材扩大,风格雄浑,批判“上官体”,为初唐诗歌注入“气骨”,推动唐诗向盛唐高峰过渡。","max":3,"id":"唐诗宋词-1-term-21"},{"n":22,"type":"term","prompt":"诗史","options":[],"key":"","answer":"诗史:指杜甫的诗歌。其诗深刻反映唐王朝由盛转衰的历史,聚焦安史之乱前后的社会现实,如《自京赴奉先县咏怀五百字》写战乱前的社会矛盾,“三吏”“三别”写战乱中的民生疾苦,兼具历史真实性与文学艺术性,被后世称为“诗史”。","max":3,"id":"唐诗宋词-1-term-22"},{"n":23,"type":"term","prompt":"花间词","options":[],"key":"","answer":"花间词:晚唐五代以“花间派”为代表的词作,因后蜀赵崇祚编《花间集》得名,以温庭筠为鼻祖,代表作家有韦庄。内容多写闺阁艳情、宴饮游乐,风格绮靡香软,辞藻华美,音律和谐,完善了词的抒情技巧,对后世婉约词影响深远。","max":3,"id":"唐诗宋词-1-term-23"},{"n":24,"type":"short","prompt":"简述盛唐山水田园诗繁荣的主要原因。","options":[],"key":"","answer":"1盛唐取士路径多,征召辟举为文人提供“终南捷径”,隐居成为求官方式之一;2经济繁荣、社会安定为文人提供寄傲林泉的物质条件,“朝隐”流行;3南北统一,交通便利,文人游学观览成风,推动山水田园诗创作;4继承陶渊明、谢灵运传统,受佛道思想影响,在自然中追求精神解脱。","max":5,"id":"唐诗宋词-1-short-24"},{"n":25,"type":"short","prompt":"简要概括杜甫诗歌的“开创精神”体现在哪些方面。","options":[],"key":"","answer":"1开创新题乐府,突破汉乐府旧题,“即事名篇”,如《兵车行》《三吏》《三别》,直接反映现实;2创新诗歌形式,完善七律,拓展五古、七古篇幅与表现力,如《登高》为七律巅峰;3革新表现手法,融合叙事、抒情、议论,如《自京赴奉先县咏怀五百字》;4拓展诗歌题材,将日常生活、民生疾苦、家国大事纳入诗歌。","max":5,"id":"唐诗宋词-1-short-25"},{"n":26,"type":"short","prompt":"说明白居易新乐府的理论主张。","options":[],"key":"","answer":"1强调诗歌“感人心”的力量,提出“根情,苗言,华声,实义”,以感情为核心,内容为根本;2明确创作目的,为君、臣、民、物、事而作,非为文而作;3主张恢复采诗制,使诗歌“上以纫王教,下以存炯戒”,发挥“补察时政,泄导人情”的作用;4艺术上要求“首句标其目,卒章显其志”,语言质朴通俗、直切畅达。","max":5,"id":"唐诗宋词-1-short-26"},{"n":27,"type":"short","prompt":"简述苏轼对宋词革新的主要体现。","options":[],"key":"","answer":"1打破“词为艳科”传统,拓展词的题材,将咏史、言志、边塞、山水等纳入词中,如《江城子·密州出猎》;2“以诗为词”,将诗歌的表现手法、意境融入词中,如《水调歌头·明月几时有》;3突破音律束缚,不刻意拘泥声律,以内容与情感表达为重;4风格多样化,既有 《念奴娇·赤壁怀古》的豪放,也有婉约之作。","max":5,"id":"唐诗宋词-1-short-27"},{"n":28,"type":"essay","prompt":"结合具体作品,论述李白诗歌“天真狂放”的艺术个性。","options":[],"key":"","answer":"李白诗歌“天真狂放”是盛唐浪漫精神的集中体现。 一、夸张与想象构建“天与俱高”的境界:《蜀道难》《将进酒》突破现实时空限制,化豪情为可感形象。 二、率真直白抒情流露“天真”本性:《月下独酌》《赠汪伦》写孤独与友情,坦率自然。 三、叛逆傲岸人格深化“狂放”精神:《梦游天姥吟留别》蔑视权贵,《独坐敬亭山》以孤云自比,尽显孤高不羁。 综上,三者融合,彰显盛唐时代精神。","max":10,"id":"唐诗宋词-1-essay-28"},{"n":29,"type":"essay","prompt":"结合具体作品,论述杜甫诗歌 “沉郁顿挫” 的风格特征,并分析其形成原因。","options":[],"key":"","answer":"一、风格内涵:(一)“沉郁”:情感深沉厚重,围绕家国命运与民生疾苦,如《春望》; (二)“顿挫”:章法跌宕起伏,节奏抑扬有致,如《登高》。 二、形成原因:(一)时代背景:亲历安史之乱与唐王朝由盛转衰,战乱苦难是“沉郁”的现实根源,局势反复促成“顿挫”的章法;(二)个人境遇:仕途失意、屡经离乱,秉持儒家忧国忧民情怀,情感深沉克制,兼擅各体、善调控章法节奏。","max":10,"id":"唐诗宋词-1-essay-29"}],"rawMax":74},{"id":"唐诗宋词-2","title":"2026年模拟试卷(二)","questions":[{"n":1,"type":"single","prompt":"下列诗人中,不属于“吴中四士”的是","options":[{"key":"A","text":"贺知章"},{"key":"B","text":"张若虚"},{"key":"C","text":"王维"},{"key":"D","text":"包融"}],"key":"C","answer":"王维","max":1,"id":"唐诗宋词-2-single-1"},{"n":2,"type":"single","prompt":"被誉为“七绝圣手”的盛唐诗人是","options":[{"key":"A","text":"李白"},{"key":"B","text":"王昌龄"},{"key":"C","text":"王之涣"},{"key":"D","text":"崔颢"}],"key":"B","answer":"王昌龄","max":1,"id":"唐诗宋词-2-single-2"},{"n":3,"type":"single","prompt":"下列作品中,属于李白浪漫主义代表作的是","options":[{"key":"A","text":"《登高》"},{"key":"B","text":"《蜀道难》"},{"key":"C","text":"《春望》"},{"key":"D","text":"《石壕吏》"}],"key":"B","answer":"《蜀道难》","max":1,"id":"唐诗宋词-2-single-3"},{"n":4,"type":"single","prompt":"杜甫的“三别”不包括以下哪首诗","options":[{"key":"A","text":"《新婚别》"},{"key":"B","text":"《垂老别》"},{"key":"C","text":"《无家别》"},{"key":"D","text":"《羌村别》"}],"key":"D","answer":"《羌村别》","max":1,"id":"唐诗宋词-2-single-4"},{"n":5,"type":"single","prompt":"中唐“新乐府运动”的主要倡导者是","options":[{"key":"A","text":"李白、杜甫"},{"key":"B","text":"元稹、白居易"},{"key":"C","text":"韩愈、孟郊"},{"key":"D","text":"刘禹锡、柳宗元"}],"key":"B","answer":"元稹、白居易","max":1,"id":"唐诗宋词-2-single-5"},{"n":6,"type":"single","prompt":"下列词人中,不属于“花间派”的是","options":[{"key":"A","text":"温庭筠"},{"key":"B","text":"韦庄"},{"key":"C","text":"李煜"},{"key":"D","text":"孙光宪"}],"key":"C","answer":"李煜","max":1,"id":"唐诗宋词-2-single-6"},{"n":7,"type":"single",
