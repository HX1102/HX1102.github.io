"余秋雨"],"ans":"A","score":1},{"t":"s","n":19,"stem":"以《乔厂长上任记》为发轫之作的小说潮流是","opts":["伤痕小说","反思小说","寻根小说","改革小说"],"ans":"D","score":1},{"t":"s","n":20,"stem":"下列小说中，属于王安忆“三恋”之一的作品是","opts":["《倾城之恋》","《乱都之恋》","《荒山之恋》","《赤地之恋》"],"ans":"C","score":1}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"下列作家中，属于左翼作家阵营的有","opts":["张天翼","田汉","丁玲","冯雪峰","沈从文"],"ans":"ABCD","score":2},{"t":"m","n":22,"stem":"下列小说中，属于吴组缃表现农民苦难、批判地主阶级劣迹的作品有","opts":["《包氏父子》","《官官的补品》","《一千八百担》","《长河》","《樊家铺》"],"ans":"BCE","score":2},{"t":"m","n":23,"stem":"下列作品中，在40年代出现的政治讽刺诗力作有","opts":["田间《给战斗者》","臧克家《生命的零度》","袁水拍《马凡陀的山歌》","邹荻帆《幽默的人》","郭沫若《猫哭老鼠》"],"ans":"BCDE","score":2},{"t":"m","n":24,"stem":"下列关于作家赵树理的表述，正确的有","opts":["受“五四”新文学影响开始创作","注重表现农村生活和农村工作问题","不回避农民的落后性和局限性","成功借鉴中国传统文学形式","熟练使用经过提炼的北京口语"],"ans":"ABCD","score":2},{"t":"m","n":25,"stem":"下列关于王蒙《组织部新来的青年人》的表述，正确的有","opts":["王蒙的长篇小说杰作","文学“干预生活”的代表作","揭露了官僚主义问题","表现出理想主义色彩","组织部副部长刘世吾是一个先进形象"],"ans":"BCD","score":2}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"《新青年》","ans":"（1）陈独秀主编，1915年9月创刊，创刊时名为《青年杂志》，后改名《新青年》。陈独秀在创刊号上提出“民主”与“科学”口号，标志着以该刊为主要阵地的新文化运动兴起。（2）编辑及撰稿人除陈独秀外，主要有胡适、李大钊、钱玄同、刘半农、鲁迅、周作人等。","score":4},{"t":"term","n":27,"stem":"“新感觉派”","ans":"（1）以《文学工场》《无轨电车》《现代》等杂志为主要阵地从事小说创作而形成的文学流派，代表作家有施蛰存、穆时英、刘呐鸥。（2）作品主要受西方新心理主义和日本新感觉派影响，擅长用新异的现代形式表现东方大都会生活，注重人物感觉心理，以象征和暗示等手法精细描写，又称“心理分析派”。","score":4},{"t":"term","n":28,"stem":"《升官图》","ans":"（1）陈白尘40年代的戏剧代表作，主要通过表现两个强盗的升官梦，批判官僚政权的黑暗及其对人民的压迫。（2）剧作采用夸张、变形、漫画化手法，以荒诞奇特形式强烈反映社会本质的“真”。","score":4}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"w","n":29,"stem":"简述30年代台湾新文学发展的特点。","ans":"（1）受世界性的左翼文学思潮，特别是日本左翼文学和中国大陆左翼文学影响，30年代台湾新文学出现追求文艺大众化的倾向，无产阶级文艺开始兴起。（2）乡土文学观念在台湾流行，成为台湾新文学的重要内容。（3）出现专业文学杂志和文学社团，涌现了一批有影响的作家作品。","score":8},{"t":"w","n":30,"stem":"简析沈从文小说的题材特点。","ans":"（1）题材主要有湘西人生和现代都市人生两大类，其中描写军队生活、湘西少数民族生活的作品以其青少年生活经验为基础。（2）作者以乡村叙事者的立场审视、批判都市文明；对于故乡湘西，能以现代知识分子的眼光加以观照，并着力写出它的美。（3）着力书写乡村理想的人性，表现人生形式之“常”。","score":8},{"t":"w","n":31,"stem":"简析路翎《财主底儿女们》的艺术特色。","ans":"（1）作品主要描写蒋捷三的三个儿子蒋蔚祖、蒋少祖、蒋纯祖的不同人生道路，以史诗笔触展现人的灵魂搏斗，揭示人性的丰富性和复杂性。（2）大胆突破中国传统小说的表现手法，把政治、哲理、抒情等要素融会贯通，加以史诗式表现，为现代小说叙事艺术多样化作出贡献。","score":8},{"t":"w","n":32,"stem":"简述秦牧散文的思想主题和艺术成就。","ans":"（1）取材广泛，立意高远，注重知识性、趣味性与思想性的结合，善于叙述和描写古今中外风土人情、轶闻趣谈，寄寓独特见解与思想。（2）旁征博引，给读者以思想启迪和审美熏陶。（3）用思想或抒情线索将想象组织起来，纵横联想，散而归一，以漫谈式笔法与读者交流，声情并茂，文笔生动。","score":8}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"w","n":33,"stem":"结合作品，论述《呐喊》《彷徨》的艺术探索。","ans":"（1）开辟中国现代小说的多种创作方法，以清醒的现实主义为主，兼有现实主义与象征主义的成功结合，还有对人物潜意识的描摹，局部带有心理剖析色彩。（2）选材严，开掘深，严格依据表达主题和塑造人物性格需要设置、提炼情节，注重情节的深刻内涵。（3）人物塑造多以一人为模特，也有“杂取种种人，合成一个”，使形象具有典型性。常用“画眼睛”技法勾勒灵魂，以个性化人物语言揭示人物内心世界。（4）“几乎一篇有一篇新形式”，白描、抒情、讽刺、象征等多种手法兼用，显示多样化风格。","score":13},{"t":"w","n":34,"stem":"结合作品，分析舒婷诗歌的思想主题和艺术风格。","ans":"（1）书写了经历“文革”的一代青年从狂热、迷茫到觉醒、奋起与追求的心灵历程，也表现青年人的爱情、友情的美丽与忧伤，对国家命运的关切与忧虑，闪耀着理想主义光彩。（2）抒写个人丰富复杂的内心世界，又不失对社会现实的关怀，具有较深厚的人性和社会内涵。（3）善于从具体事物出发，运用想象、联想和意象的拼接组合，表达多层次的丰富意蕴。","score":13}]}],"qaNotes":[]},{"paper":"xws-2504","subject":"xws","session":"2504","label":"2025年4月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"中国现代文学发端于","score":1,"opts":["\"小说界革命\"","\"五四\"文学革命","白话文运动","\"诗界革命\""],"ans":"B","ana":"中国现代文学以“五四”文学革命为开端。“五四”文学革命的直接背景和动力是“五四”新文化运动。“五四”时期以陈独秀主编的《新青年》为主要阵地,反对旧道德、提倡新道德,兴起了“ 民主”与“科学”的新文化思想启蒙运动。《新育年》大力介绍自由平等学说、个性解放思想、社会进化论,给人们提供思想武器。"},{"t":"s","n":2,"stem":"“五四”初期,周作人提倡新文学用人道主义研究人生诸问题的文章是","score":1,"opts":["《文学革命论》","《文学改良刍议》","《建设的文学革命论》","《人的文学》"],"ans":"D","ana":"周作人在《人的文学》中,提倡新文学用人道主义研究人生诸问题,强调文学要以人道主义为本,关注人的生活和命运。《文学革命论》是陈独秀的作品,主张文学革命;《文学改良刍议》是胡适的文章,倡导文学改良;《建设的文学革命论》同样是胡适的作品,主要论述建设新文学的主张。"},{"t":"s","n":3,"stem":"中国现代文学史上,台湾的第一部新诗集是","score":1,"opts":["赖和的《觉悟下的牺牲》","追风的《诗的模仿》","杨云萍的《橘子开花》","张我军的《乱都之恋》"],"ans":"D","ana":"1925 年12 月,台湾现代文学史上的第一部新诗集张我军的《乱都之恋》在台北出版。"},{"t":"s","n":4,"stem":"作为中国新文学进入第二个十年标志的革命文学倡导,发生在","score":1,"opts":["1927 年","1928 年","1930 年","1932 年"],"ans":"B","ana":"1928 年,创造社、太阳社等倡导革命文学,这成为中国新文学进入第二个十年的标志。1927 年大革命失败,社会环境的变化促使文学界发生转变,1928 年革命文学的倡导掀起了新的文学思潮;1930 年“左联”成立,是革命文学发展的进一步成果。"},{"t":"s","n":5,"stem":"20 世纪30 年代初, 自称“ 自由人”、在左翼文学与国民党民族主义文学之间左右开弓的作家是","score":1,"opts":["梁实秋","苏汶","胡秋原","郁达夫"],"ans":"C","ana":"1931 年底,胡秋原自称“ 自由人”,谈“文学与艺术,至死也是自由的,民主的”,在左翼文学与国民党民族主义文学之间左右开弓。梁实秋主要是与左翼文学进行论争;苏汶是“第三种人”的代表。"},{"t":"s","n":6,"stem":"巴金的《雾》《雨》《电》,史称","score":1,"opts":["《爱情三部曲》","《漂流三部曲》","《激流三部曲》","“农村三部曲”"],"ans":"A","ana":"巴金的《雾》《雨》《电》被称为《爱情三部曲》,主要围绕几个年轻人的爱情和革命生活展开。《漂流三部曲》是郭沫若的作品;《激流三部曲》是巴金的《家》《春》《秋》;“农村三部曲”一般指茅盾的《春蚕》《秋收》《残冬》。"},{"t":"s","n":7,"stem":"沈从文专注于解剖知识分子病态人格的小说是","score":1,"opts":["《边城》","《萧萧》","《八骏图》","《柏子》"],"ans":"C","ana":"《八骏图》中沈从文通过描写八位教授的生活和思想,专注于解剖知识分子的病态人格。《边城》描绘了湘西的风土人情和翠翠的爱情故事;《萧萧》讲述了童养媳萧萧的命运;《柏子》刻画了水手柏子的生活和情感。"},{"t":"s","n":8,"stem":"在曹禺的《雷雨》中,性格畸形、对父亲周朴园的形象形成补充的人物是","score":1,"opts":["周萍","周冲","鲁大海","四风"],"ans":"A","ana":"周萍在《雷雨》中性格畸形,他与继母蘩漪有不伦之恋,又试图摆脱这种关系,其行为和性格反映出封建家庭对人性的扭曲,对父亲周朴园的形象起到了补充作用。周冲是一个单纯、善良的青年;鲁大海是工人代表,具有反抗精神;四风是一个天真、善良的女仆。"},{"t":"s","n":9,"stem":"戴望舒在1928 年8 月发表于《小说月报》的成名作是","score":1,"opts":["《寻梦者》","《对于天的怀乡病》","《我底记忆》","《雨巷》"],"ans":"D","ana":"1928 年8 月,戴望舒在《小说月报》第19 卷第8 期发表《雨巷》,这首诗典型地反映了30 年代知识青年的苦闷、幻灭、彷徨而又对理想充满期盼的复杂心态。《寻梦者》《对于天的怀乡病》《我底记忆》也是戴望舒的作品。"},{"t":"s","n":10,"stem":"以描写农村生活、表现农民苦难命运见长,史称“农民诗人”的是","score":1,"opts":["臧克家","蒲风","田间","艾青"],"ans":"A","ana":"臧克家30 年代诗歌的主要内容是描写农村的生活面貌及农民的苦难命运,他也因此被称为“农民诗人”和“乡土诗人”。蒲风是中国诗歌会”最有代表性的诗人,诗歌能够及时反映重大题材,表现工农大众的生活与斗争,突出对实际革命运动的鼓动作用。田间的诗歌具有强烈的战斗性;艾青的诗作题材广泛,主要以对土地的热爱和对光明的追求为主题。"},{"t":"s","n":11,"stem":"抗战时期提倡“与抗战无关”论,反对文艺公式化的作家是","score":1,"opts":["孔罗荪","张天翼","茅盾","梁实秋"],"ans":"D","ana":"抗战时期,梁实秋提出“与抗战无关”论,认为文学不必局限于抗战题材,反对文艺公式化。"},{"t":"s","n":12,"stem":"下列作品中,不属于抗战时期讽刺小说的是","score":1,"opts":["沙汀的《淘金记》","张天翼的《华威先生》","萧红的《马伯乐》","丘东平的《第七连》"],"ans":"D","ana":"《第七连》是丘东平描写战争的小说,着重展现战争中的士兵生活等,不属于讽刺小说。沙汀的《淘金记》讽刺了抗战时期大后方的黑暗现实;张天翼的《华威先生》讽刺了抗战时期一些只图虚名、不做实事的官僚;萧红的《马伯乐》也具有讽刺意味,刻画了一个在抗战时期只顾自己逃命的人物形象。"},{"t":"s","n":13,"stem":"小说《饥饿的郭素娥》表现了主人公物质和精神双重困境,作者是","score":1,"opts":["路翎","胡风","萧红","钱钟书"],"ans":"A","ana":"《饥饿的郭素娥》的作者是路翎,以矿山生活为背景,通过郭素娥这一形象表现了劳动人民求幸福求解放的生命意志。美丽而强悍的郭素娥,面临着物质上与精神上的双重“饥饿”,渴望美满的家庭生活,敢于傲视社会的冷眼,向宗法家族势力与流氓势力挑战,当她被当做物品转卖时,宁死也不从,喊出了“你们不晓得一个女人底日子,她挨不下去,她痛苦”,最终被用火铲活活烙死。"},{"t":"s","n":14,"stem":"张恨水第一部具有现代意义的通俗小说巨制是","score":1,"opts":["《五子登科》","《金粉世家》","《八十一梦》","《丹凤街》"],"ans":"B","ana":"张恨水的《金粉世家》是其第一部具有现代意义的通俗小说巨制,小说写京城三世同堂的国务总理金家,以其七少爷金燕西和出身寒门的女子冷清秋的婚姻悲剧为主线,穿插与金家有关的百十个人物,写出巨宦豪门的一朝崩溃,整个家族树倒猢狲散的结局。小说打破了中国古典小说封闭式的结尾模式,呈开放式结构。《五子登科》《八十一梦》《丹凤街》也是张恨水的作品。"},{"t":"s","n":15,"stem":"梁生宝这一社会主义新人形象出自","score":1,"opts":["《创业史》","《铁木前传》","《三里湾》","《山乡巨变》"],"ans":"A","ana":"梁生宝是柳青《创业史》中的社会主义新人形象,他带领农民走互助合作化道路。《创业史》描写了农业合作化前后农村错综复杂的社会关系与尖锐激烈的矛盾斗争,反映了农村社会主义改造的过程。四条线索:①梁三老汉、王二直杠等贫苦农民,迷恋旧时代的创业道路,企图依靠传统的生产方式发家致富,而与互助合作运动格格不入。②高裕中农郭世富,凭借优厚的经济实力,与互助组公开较量,顽固维护私有制,幻想再度雇工剥削。③富农姚士杰,刻骨仇恨新社会,暗中施展阴谋,妄图扼杀互助组,实行阶级报复。④党员、村代表主任郭振山,背离党的宗旨,热衷个人发家,幕后支持互助组的反对势力,曲折干扰、抵制互助合作运动。"},{"t":"s","n":16,"stem":"新中国成立后第一个出国演出的话剧是","score":1,"opts":["《西望长安》","《茶馆》","《龙须沟》","《关汉卿》"],"ans":"B","ana":"新中国成立后,《茶馆》是第一个出国演出的话剧,它展现了老北京的社会风貌,欧洲戏剧界称赞《茶馆》是“东方戏剧的奇迹”,在日本被誉为是“继梅兰芳访问演出后的第二次轰动”。"},{"t":"s","n":17,"stem":"1979 年10 月在北京召开的文艺工作者“五世同堂”的盛会是","score":1,"opts":["第一次全国文代会","第二次全国文代会","第三次全国文代会","第四次全国文代会"],"ans":"D","ana":"1979 年10 月召开的第四次全国文代会,是文艺工作者“五世同堂”的盛会,为新时期文艺的发展指明了方向。第一次全国文代会于1949 年召开;第二次全国文代会于1953年召开;第三次全国文代会于1960 年召开。"},{"t":"s","n":18,"stem":"1989 年推出“新写实小说大联展”的期刊是","score":1,"opts":["《人民文学》","《作家》","《钟山》","《收获》"],"ans":"C","ana":"“新写实小说”的创作发生于1988 年前后,但其作为一种小说潮流被正式命名并产生广泛的社会影响,却源自于《钟山》1989 年第3 期推出的“新写实小说大联展”。"},{"t":"s","n":19,"stem":"收入《道士塔》和《莫高窟》等名篇,富有文化忧患意识的散文集是","score":1,"opts":["余秋雨的《文化苦旅》","巴金的《随想录》","张中行的《负暄话》","杨绛的《千校六记》"],"ans":"A","ana":"余秋雨《文化苦旅》开篇的《道士塔》《莫高窟》表明作者一方面为灿烂的中国文化骄傲不已,同时又以极其沉痛的笔调记叙莫高窟屡遭洗劫的不幸,这种矛盾心境的背后,则是作者对中国文化自身先进与落后因素并存的无奈与体认。巴金的《随想录》主要是对自我和社会的反思;张中行的《负暄话》多回忆旧人旧事;杨绛的《千校六记》记录了特殊时期的生活。"},{"t":"s","n":20,"stem":"高行健的戏剧中,运用荒诞派表现形式,结构方式类似于贝克特《等待戈多》的作品是","score":1,"opts":["《绝对信号》","《彼岸》","《车站》","《野人》"],"ans":"C","ana":"高行健的《车站》运用荒诞派表现形式,其结构方式类似于贝克特的《等待戈多》,只是等待的对象变成了一辆迟迟没有停站的公共汽车。《绝对信号》在主题和某些手段上还存留着传统话剧的成分;《野人》应该说是最为成熟的一部,它是多声部哲理剧的一个典范。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"茅盾小说处女作《蚀》由几个独立的中篇构成,它们有","score":2,"opts":["《幻灭》","《动摇》","《追求》","《腐蚀》","《春蚕》"],"ans":"ABC","ana":"茅盾的《蚀》由《幻灭》《动摇》《追求》三个独立的中篇构成,三部小说基本以时间为序,完整而清晰地再现了大革命失败前后青年知识分子的心态和命运,也真实地反映了作者内心的困惑与矛盾。《腐蚀》是茅盾另一部作品;《春蚕》是茅盾“农村三部曲”之一。"},{"t":"m","n":22,"stem":"以下对毛泽东《在延安文艺座谈会上的讲话》主要内容的概述,正确的有","score":2,"opts":["文艺为工农兵服务","文艺工作者需要深入实际斗争","阐明了文艺普及和提高的辩证关系","文艺源于生活、高于生活","文艺要表现普遍的永恒的人性"],"ans":"ABCD","ana":"1942 年5 月延安文艺座谈会的召开和毛泽东《在延安文艺座谈会上的讲话》在次年公开发表,是抗战文艺运动中最重要的历史事件,也是解放区文学运动的发展标志。毛泽东《在延安文艺座谈会上的讲话》:(1)要求文艺工作者“站在无产阶级立场上”,使文艺为人民大众,首先“为工农兵”服务。(2)从解放区的实际出发,要求文艺工作者在学习马克思主义的同时,必须“深入工农兵群众,深人实际斗争”,从而为作家世界观的转变和创作源泉的获得指明了根本途径;指明“在普及基础上的提高”和“在提高基础上的普及”的辩证关系;指出文艺源于生活,“却可以而且应该比实际生活更高,更强烈,更有集中性,更典型,更理想,由此就更带普遍性”;指出要借鉴吸收中外文化遗产中的精华,同时也说明这是“流”而不是“源”。(3)在文艺与政治的关系的论述中,明确以政治标准为第一,艺术标准第二,对文艺自身的特点与规律没有给予充分的重视。"},{"t":"m","n":23,"stem":"以胡风为核心的“七月诗派”,代表作有","score":2,"opts":["绿原的《童话》","牛汉的《鄂尔多斯草原》","穆旦的《诗八首》","高兰的《哭亡女苏菲》","阿垅的《纤夫》"],"ans":"ABE","ana":"七月诗派在艺术上的追求和创造把自由体新诗推向了一个新的高峰。绿原充满浪漫憧憬的诗集《童话》,振聋发聩的《给天真的乐观主义者们》等政治抒情诗,以及《终点,又是起点》、《伽利略在真理面前》、《你是谁?》等都是优秀之作。鲁藜的诗集《醒来的时候》、《锻炼》中大量朴实而清新的短诗,抒写了诗人在抗日民主根据地的新鲜感受,《泥土》是表现新的人生哲学的名篇。其他如阿垅的《纤夫》、牛汉的《鄂尔多斯草原》等都是充满力度和激情,足以显示七月诗派风格的代表作。穆旦是“九叶诗派”的代表诗人;高兰以朗诵诗闻名。"},{"t":"m","n":24,"stem":"“十七年”历史剧的代表作有","score":2,"opts":["郭沫若的《蔡文姬》","田汉的《关汉卿》","老舍的《龙须沟》","海默的《洞箫横吹》","曹禺的《北京人》"],"ans":"AB","ana":"“十七年”指1949 -1966 年,主要作品有郭沫若的《蔡文姬》、《武则天》,田汉的《关汉卿》、《文成公主》,曹禺(执笔)、梅阡、于是之的《胆剑篇》,老舍的《义和拳》,丁西林的《孟丽君》等。郭沫若的《蔡文姬》通过讲述蔡文姬的故事,展现历史人物的情感与时代背景;田汉的《关汉卿》以关汉卿的经历为题材,歌颂其抗争精神,二者均为“十七年”历史剧的代表作。老舍的《龙须沟》是反映北京人民生活变迁的现实题材话剧;海默的《洞箫横吹》是农村题材作品;曹禺的《北京人》创作于1940 年。"},{"t":"m","n":25,"stem":"下列文章中,提倡文化寻根的有","score":2,"opts":["艾青的《诗人必须说真话》","韩少功的《文学的“根”》","郑万隆的《我的根》","李杭育的《理一理我们的根》","公刘的《诗与诚实》"],"ans":"BCD","ana":"20 世纪80 年代出现文化寻根思潮,韩少功的《文学的“根”》、郑万隆的《我的根》、李杭育的《理一理我们的根》、阿城的《文化制约着人类》都提倡文化寻根,主张从传统文化和地域文化中寻找文学创作的源泉与根基。艾青的《诗人必须说真话》主要强调诗人创作要秉持真诚的态度;公刘的《诗与诚实》重点围绕诗歌创作中的诚实品质展开。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"“ 自叙传”小说","score":4,"ans":"(1)或曰“身边小说”,有郁达夫的《沉沦》、郭沫若的《漂流三部曲》等。(2)主要写亲身经历或个人感受,感情色彩强烈。"},{"t":"term","n":27,"stem":"“南明史剧”","score":4,"ans":"(1)上海“孤岛”时期以讲述明末历史为主要内容的戏剧作品。代表作有阿英的《碧血花》《葛嫩娘》《海国英雄》,于伶的《大明英烈传》等。(2)主要描写郑成功等明末反清斗争中的英雄人物,以激励现实大众的爱国热情。"},{"t":"term","n":28,"stem":"“朦胧诗”","score":4,"ans":"(1)70 年代后期出现的带有现代主义色彩的诗潮,代表诗人有北岛、舒婷等。(2)注重象征、暗示、联想等手法的运用,作品具有朦胧、多义的特点。"}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简述30 年代文学创作的特点。","score":8,"ans":"(1)运用科学的社会理论剖析中国社会,如左翼作家;由文化层面批判社会、探究人生,如老舍和“京派”;题材内容空前广泛,涉及中国社会各阶层生活。(2)长篇小说形式日趋成熟,抒情写意小说长足发展;戏剧、诗歌、散文都有重要收获。(3)现实主义成为主流,浪漫主义在变异中发展,现代主义取得丰硕成果。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。"},{"t":"short","n":30,"stem":"简析李季《王贵与李香香》的艺术特色。","score":8,"ans":"(1)借鉴“信天游”形式,擅用比兴手法,叙事和抒情相结合。(2)改进“信天游”形式,表现新的主题和人物,为新诗民族化做出了贡献。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。"},{"t":"short","n":31,"stem":"简析杨朔的散文艺术及其局限。","score":8,"ans":"(1)擅长缘物生情,托物言志,从细微处落墨,创造诗的意境。(2)讲究剪裁布局,于峰回路转中生发出哲理,卒章显志。(3)主题较为单一,谋篇布局时有雷同。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。"},{"t":"short","n":32,"stem":"简析余华小说的先锋性。","score":8,"ans":"(1)冷漠叙述:迷恋于暴力、灾难尤其是死亡的书写,叙述者的主体意向降至感情的冰点。(2)文类颠覆:对旧有的文类进行戏仿,追求文类和价值观的双重颠覆。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分。"}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"结合作品分析《狂人日记》的思想意义。","score":13,"ans":"(1)揭露了从家庭到社会的“吃人”现象,抨击了封建家族制度和礼教的“吃人”本质,体现了“五四”新文学彻底反封建的总体倾向。(2)对封建礼教的揭露和批判,由当下生存空间到历史文化批判再到自我审视,逐层深入。(3)狂人发出了“从来如此,便对么”“救救孩子”的呼喊,表现了强烈的怀疑、反抗和变革的精神。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。"},{"t":"essay","n":34,"stem":"结合作品分析《骆驼祥子》的艺术成就。","score":13,"ans":"(1)成功塑造了祥子与虎妞的典型形象。(2)人物塑造上体现了老舍写出“灵的文学”的主张。(3)浓郁的地域文化色彩与纯熟的北京口语。(4)围绕“车”组织情节的结构方式。【评分参考】(1))意思相近即可得分。(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。"}]}],"code":"00537","qaNotes":[]},{"paper":"xws-2510","subject":"xws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"下列人物中,属于学衡派的是","score":1,"opts":["林纾","陈独秀","梅光迪","蔡元培"],"ans":"C","ana":"学衡派是20 世纪20 年代出现的文化保守主义流派,核心成员包括梅光迪、吴宓等。林纾是近代古文家、翻译家,并非学衡派;陈独秀是新文化运动倡导者,属于激进派;蔡元培是教育家,主张兼容并包,不属学衡派。"},{"t":"s","n":2,"stem":"中国现代文学的开创者是","score":1,"opts":["鲁迅","茅盾","郁达夫","叶绍钧"],"ans":"A","ana":"鲁迅的《狂人日记》是中国现代文学史上第一篇白话小说,打破了传统文学的表达模式,其杂文、小说等作品深刻批判封建礼教,奠定了中国现代文学的思想基础和文学范式,被公认为中国现代文学的开创者。"},{"t":"s","n":3,"stem":"标志20 世纪20 年代中期象征诗派出现的诗集是","score":1,"opts":["《月夜》","《微雨》","《尝试集》","《女神》"],"ans":"B","ana":"李金发的诗集《微雨》于1925 年出版,以独特的象征手法、晦涩的语言表达情感,标志着20 世纪20 年代中期象征诗派的正式出现。《月夜》是沈尹默的白话诗作品,《尝试集》是胡适的白话诗集,《女神》是郭沫若的浪漫主义诗集。"},{"t":"s","n":4,"stem":"1935 年\"一二·九\"运动爆发,在全民族救亡运动中左作家周扬等提出的文学口号是","score":1,"opts":["\"民族革命战争的大众文学\"","\"国防文学\"","\"平民的文学\"","\"为人生的文学\""],"ans":"B","ana":"1935 年\"一二·九\"运动后,民族危机加深,周扬等左联作家提出\"国防文学\"口号,主张文学为抗日救亡服务,号召各阶层作家联合创作国防题材作品。\"民族革命战争的大众文学\"是鲁迅等人后来提出的补充口号;\"平民的文学\"是周作人在五四时期提出的;\"为人生的文学\"是文学研究会的主张。"},{"t":"s","n":5,"stem":"1921 年接手改组《小说月报》、撰写《〈小说月报〉改革宣言》的作家是","score":1,"opts":["胡适","周作人","叶圣陶","沈雁冰"],"ans":"D","ana":"1921 年,沈雁冰(茅盾)接手改组《小说月报》,摆脱了该刊原有的旧文学倾向,将其改造为文学研究会的核心刊物,并撰写《〈小说月报〉改革宣言》,倡导现实主义文学。胡适、周作人、叶圣陶均未参与此次改组核心工作。"},{"t":"s","n":6,"stem":"巴金原名李尧棠,他最早使用笔名\"巴金\"发表的小说是","score":1,"opts":["《家》","《憩园》","《灭亡》","《寒夜》"],"ans":"C","ana":"巴金于1929 年发表第一部小说《灭亡》,这是他首次使用\"巴金\"这一笔名。《家》是其\"激流三部曲\"的第一部,发表于1931 年;《憩园》发表于1944 年;《寒夜》发表于1946 年。"},{"t":"s","n":7,"stem":"老舍以散文诗笔法创作的短篇小说佳作是","score":1,"opts":["《月牙儿》","《上任》","《断魂枪》","《黑白李》"],"ans":"A","ana":"《月牙儿》以第一人称叙述,语言优美流畅,兼具小说的叙事性与散文诗的抒情性,通过母女两代人的悲惨命运反映社会黑暗。《上任》《断魂枪》《黑白李》均为老舍的短篇小说,但未采用散文诗笔法。"},{"t":"s","n":8,"stem":"萧红的早期代表作,被鲁迅称为表现了\"北方人民的对于生的坚强,对于死的挣扎\"的小说是","score":1,"opts":["《小城三月》","《牛车上》","《生死场》","《马伯乐》"],"ans":"C","ana":"萧红的《生死场》创作于1934 年,描写了东北农村民众在苦难中的生存状态与抗争,鲁迅为该书作序,评价其表现了\"北方人民的对于生的坚强,对于死的挣扎\"。《小城三月》《牛车上》是萧红后期作品,《马伯乐》侧重讽刺批判。"},{"t":"s","n":9,"stem":"艾青原名蒋海澄,1933 年他第一次以笔名\"艾青\"发表的成名作是","score":1,"opts":["《雪落在中国的土地上》","《我爱这土地》","《大堰河--我的保姆》","《向太阳》"],"ans":"C","ana":"1933 年,艾青在狱中创作《大堰河--我的保姆》,首次使用\"艾青\"笔名发表,该诗以真挚的情感歌颂保姆大堰河,成为其成名作。《雪落在中国的土地上》发表于1937 年,《我爱这土地》发表于1938 年,《向太阳》发表于1938 年。"},{"t":"s","n":10,"stem":"七月诗派的理论家胡风主张作家要\"突进\"到现实生活中,创作上提倡的是","score":1,"opts":["浪漫主义精神","乌托邦精神","超脱的精神","\"主观战斗精神\""],"ans":"D","ana":"胡风作为七月诗派的核心理论家,主张作家应深入现实生活,在创作中融入\"主观战斗精神\",强调作家主体与现实的互动与搏斗。七月诗派以现实主义为基础,反对浪漫主义的空想、超脱的态度及乌托邦精神。"},{"t":"s","n":11,"stem":"张恨水的小说《金粉世家》里,金家主人的身份是","score":1,"opts":["华侨富商","国务总理","银行经理","大学教授"],"ans":"B","ana":"《金粉世家》以民国时期国务总理金铨的家庭生活为核心,描写了金家的兴衰历程,金铨作为金家主人,其国务总理的身份是小说情节展开的重要背景。"},{"t":"s","n":12,"stem":"1944 年在延安演出,被毛泽东称为\"旧剧革命的划时期的开端\"的新编京剧是","score":1,"opts":["《兄妹开荒》","《红旗歌》","《逼上梁山》","《血泪仇》"],"ans":"C","ana":"1944 年,新编京剧《逼上梁山》在延安演出,该剧改编自《水浒传》,赋予林冲反抗封建压迫的新内涵,毛泽东观看后称赞其为\"旧剧革命的划时期的开端\"。《兄妹开荒》是秧歌剧,《红旗歌》是话剧,《血泪仇》是秦腔。"},{"t":"s","n":13,"stem":"下列小说中,不属于40 年代解放区文学的是","score":1,"opts":["《暴风骤雨》","《围城》","《吕梁英雄传》","《新儿女英雄传》"],"ans":"B","ana":"《围城》是钱钟书于会现实,不属于解放区文学。《暴风骤雨》是周立波的解放区土改题材小说,《吕梁英雄传》《新儿女英雄传》均为解放区抗日题材小说。"},{"t":"s","n":14,"stem":"70 年代台湾文学界发生的重要文艺论争是","score":1,"opts":["新旧文学论争","通俗文学论争","乡土文学论争","现代主义文学论争"],"ans":"C","ana":"20 世纪70 年代,台湾文学界爆发乡土文学论争,围绕文学应立足本土、反映现实还是追求西方现代主义展开讨论,对台湾文学发展影响深远。新旧文学论争发生在五四时期,现代主义文学论争在60 年代,通俗文学论争并非70 年代核心论争。"},{"t":"s","n":15,"stem":"把张灵甫形象刻画得个性鲜明的作品是","score":1,"opts":["罗广斌、杨益言的《红岩》","吴强的《红日》","梁斌的《红旗谱》","知侠的《铁道游击队》"],"ans":"B","ana":"吴强的《红日》以莱芜战役、孟良崮战役为背景,生动刻画了国民党将领张灵甫的狂妄、固执与军事才能,形象鲜明。《红岩》描写重庆地下革命斗争,《红旗谱》反映冀中农民革命,《铁道游击队》讲述抗日游击战争,均未重点刻画张灵甫。"},{"t":"s","n":16,"stem":"下列小说中,属于\"文革\"时期\"地下文学\"的作品是","score":1,"opts":["姚雪垠的《李自成》","张扬的《第二次握手》","黎汝清的《万山红遍》","李心田的《闪闪的红星》"],"ans":"B","ana":"\"文革\"时期的\"地下文学\"是指未获官方认可、在民间秘密流传的作品。《第二次握手》由张扬创作于\"文革\"期间,因涉及知识分子爱情与科研主题被禁止,以手抄本形式流传,属于地下文学。《李自成》《万山红遍》《闪闪的红星》均为\"文革\"时期官方认可的公开出版物。"},{"t":"s","n":17,"stem":"下列小说中,被视为\"改革文学\"发物之作的是","score":1,"opts":["蒋子龙的《乔厂长上任记》","张洁的《沉重的翅膀》","茹志鹃的《剪辑错了的故事》","路遥的《平凡的世界》"],"ans":"A","ana":"蒋子龙的《乔厂长上任记》发表于1979 年,率先反映工业改革中的问题与矛盾,塑造了敢闯敢干的乔光朴形象,被公认为\"改革文学\"的发轫之作。《沉重的翅膀》《平凡的世界》是后续改革文学的重要作品,《剪辑错了的故事》侧重反思历史。"},{"t":"s","n":18,"stem":"\"告诉你吧,世界/我--不--相--信!\"这一诗句的出处是","score":1,"opts":["舒婷的《致橡树》","北岛的《回答》","杨炼的《大雁塔》","江河的《纪念碑》"],"ans":"B","ana":"该诗句出自北岛的《回答》,诗作创作于改革开放初期,以强烈的反叛精神和质疑态度表达对现实的思考,是朦胧诗派的代表作之一。舒婷的《致橡树》歌颂爱情平等,杨炼的《大雁塔》侧重历史反思,江河的《纪念碑》表达对英雄的敬仰。"},{"t":"s","n":19,"stem":"最早唤醒新时期散文的悲剧意识、强调\"说真话\"原则的作家是","score":1,"opts":["巴金","张中行","贾平凹","杨绛"],"ans":"A","ana":"新时期以来,巴金创作《随想录》,以真诚的笔触反思\"文革\"历史,强调\"说真话\"的文学原则,唤醒了散文的悲剧意识与批判精神,对新时期散文发展影响深远。张中行、贾平凹、杨绛的散文虽各有特色,但未起到这一开创性作用。"},{"t":"s","n":20,"stem":"高行健创作的多声部哲理剧,也是他最为成熟的剧作是","score":1,"opts":["《绝对信号》","《车站》","《野人》","《彼岸》"],"ans":"C","ana":"高行健的《野人》以多声部叙事、多重主题交织的方式,探讨人与自然、历史与现实的关系,是其最为成熟的哲理剧。《绝对信号》是其早期实验剧,《车站》侧重荒诞表达,《彼岸》以探索人生意义为主题,均未达到《野人》的成熟度。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":21,"stem":"无产阶级革命文学倡导和兴起的历史背景和现实原因有","score":2,"opts":["现实斗争和革命形势要求无产阶级在文学上提出自己的口号,建设无产阶级文学","国际无产阶级文学运动包括苏联文学对中国文学界产生很大影响","参加实际革命的知识分子在大革命失败后汇聚上海从事创作,成为革命文学的主力","大批小资产阶级知识分子急剧左转,暂时成了无产阶级文学的代表","推进反封建思想斗争、改造国民性成了时代的主旋律"],"ans":"ABCD","ana":"无产阶级革命文学兴起于20 世纪20 年代末,背景包括:革命形势需要无产阶级文学发声;国际无产阶级文学运动(如苏联文学)的影响;大革命失败后革命知识分子汇聚上海;小资产阶级知识分子左转加入创作队伍。E 选项是五四新文化运动的核心主题,并非无产阶级革命文学兴起的背景。"},{"t":"m","n":22,"stem":"下列沈从文小说中,以民间传说和佛经故事铺衍成篇的作品有","score":2,"opts":["《丈夫》","《龙朱》","《月下小景》","《神巫之爱》","《八骏图》"],"ans":"BCD","ana":"沈从文的《龙朱》《月下小景》《神巫之爱》均借鉴民间传说或佛经故事,构建了充满诗意的湘西世界。《丈夫》聚焦湘西水手与妻子的生活,《八骏图》批判都市知识分子的虚伪,均未以民间传说或佛经故事为创作基础。"},{"t":"m","n":23,"stem":"下列小说中,由张爱玲创作的有","score":2,"opts":["《倾城之恋》","《金锁记》","《沉香屑·第一炉香》","《八十一梦》","《结婚十年》"],"ans":"ABC","ana":"《倾城之恋》《金锁记》《沉香屑·第一炉香》均为张爱玲的经典小说,以细腻的笔触描写都市男女的情感与命运。《八十一梦》是张恨水的作品,《结婚十年》是苏青的自传体小说。"},{"t":"m","n":24,"stem":"关于夏衍的戏剧《上海屋檐下》,下列说法正确的有","score":2,"opts":["现实主义戏剧","手法洗练含蓄","江南梅雨季节的背景","弄堂生活场景","现代主义风格"],"ans":"ABCD","ana":"《上海屋檐下》是夏衍的现实主义戏剧代表作,以江南梅雨季节为背景,描写上海弄堂里几户人家的生活,手法洗练含蓄,真实反映社会底层民众的苦难。该剧采用现实主义创作方法,并非现代主义风格,故E 选项错误。"},{"t":"m","n":25,"stem":"\"十七年\"文学中反映工业建设的长篇小说有","score":2,"opts":["周立波的《铁水奔流》","艾芜的《百炼成钢》","柳青的《创业史》","曲波的《林海雪原》","杜鹏程的《保卫延安》"],"ans":"AB","ana":"\"十七年\"文学指1949-1966 年的文学创作,《铁水奔流》描写钢铁工业建设,《百炼成钢》聚焦工厂生产与工人成长,均属工业建设题材。《创业史》反映农业合作化运动,《林海雪原》《保卫延安》均为革命历史题材小说,故C、D、E选项错误。"}]},{"title":"三、名词解释题","meta":"本大题共3小题，每小题4分，共12分。","items":[{"t":"term","n":26,"stem":"《潘先生在难中》","score":4,"ans":"(1)叶绍钧代表作。以军阀混战为背景写潘先生的逃难经历,揭示了社会现实的混乱与黑暗。潘先生形象典型地表现了小市民知识分子的自私、圆滑与世故。(2)笔调严谨扎实,深沉的情感蕴含于客观叙述中,冷峻含蓄,体现了叶绍钧小说的现实主义风格。"},{"t":"term","n":27,"stem":"中国左翼作家联盟","score":4,"ans":"(1)1930 年3 月2 日在上海成立,鲁迅、冯雪峰、冯乃超、李初梨、蒋光慈等40余人出席了成立大会。(2)会上通过了\"左联\"理论纲领,以\"援助而且从事无产阶级艺术的产生\"为奋斗目标。鲁迅作了《对于左翼作家联盟的意见》的重要讲话,号召\"左联\"在共同目标下扩大联合战线。"},{"t":"term","n":28,"stem":"\"赵树理方向\"","score":4,"ans":"(1)1943年起赵树理发表《小二黑结婚》等一系列作品,推进了中国现代小说的民族化、大众化,为解决新文学与农民沟通问题提供了成功的经验。(2)赵树理的创作受到彭德怀、郭沫若等的充分肯定。陈荒煤提出了\"赵树理方向\",号召作家向赵树理学习。"}]},{"title":"四、简答题","meta":"本大题共4小题，每小题8分，共32分。","items":[{"t":"short","n":29,"stem":"简析叶紫小说《丰收》的思想意义","score":8,"ans":"(1)表现\"丰收成灾\"的主题。深刻反映了农民苦难的社会根源,暗示了斗争是农民解放的根本途径。(2)云普叔代表老一代农民形象,相信勤劳可以致富。立秋是新一代农民代表,反对父亲的人生哲学,对统治阶级不抱幻想,开始在党的领导下进行自觉斗争。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分"},{"t":"short","n":30,"stem":"简析戴望舒诗歌《雨巷》的艺术特色","score":8,"ans":"(1)浓重的象征意味。\"寂寥\"的\"雨巷\"象征当时的社会现实,\"丁香一样地/结着愁怨的姑娘\",象征诗人美好的希望。(2)优美的旋律、流动的节奏,\"替新诗的音节开了一个新的纪元\"。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分"},{"t":"short","n":31,"stem":"简析艾芜小说集《南行记》的思想内容","score":8,"ans":"(1)以漂泊知识者的眼光叙述边陲下层民众生活,刻画出各式各样的流民形象。(2)表现了人物强烈的生存意识与朦胧的反抗精神。(3)批判了黑暗的虎狼世界,寄托了作者对底层民众的同情、理解与赞颂。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分"},{"t":"short","n":32,"stem":"简析老舍话剧《茶馆》中王利发的人物形象","score":8,"ans":"(1)勤勤恳恳的小生意人,精明、圆滑、世故,也有一些正义感。(2)奉行妥协逢迎的处世哲学,却不保守固执,不断改良茶馆的经营,最后还是难逃茶馆被霸占、自己上吊自杀的悲剧。(3)他的不幸命运是对旧社会的控诉,也是对\"好人\"哲学的否定。【评分参考】(1)意思相近即可得分(2)有创见并言之成理可适当加1~2 分,但该题总得分不超过8 分"}]},{"title":"五、论述题","meta":"本大题共2小题，每小题13分，共26分。","items":[{"t":"essay","n":33,"stem":"论述鲁迅小说《祝福》中祥林嫂悲剧的主客观原因","score":13,"ans":"(1)主观原因:满足于坐稳了奴隶的地位。她的\"逃撞捐问\"都见出\"从一而终\"的封建\"女德\"或封建神权的影响。她以封建礼教的是非为是非,这注定了她的悲剧命运。(2)客观原因:封建的夫权、族权、神权、政权四大绳索编成了严密的网。\"围观\"的看客们维护着\"三纲五常\",自觉不自觉地用统治阶级的观念审视、责备、折磨,使她孤立无援,陷入恐惧、绝望的境地。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。"},{"t":"essay","n":34,"stem":"论析顾城诗歌的思想内容与艺术特点","score":13,"ans":"(1)早期部分诗作直接观照现实,如《一代人》对\"一代人\"与黑暗时代之间的关系进行了精辟概括。但他很快放弃了这种写作方式,专注于营造纯净优美的童话世界,因此被称为\"童话诗人\"。(2)大多数作品是短小的抒情诗,擅长以象征方式表达对纯美世界的向往,探索心灵世界的隐秘,表现出诗人敏锐捕捉感觉的才能。【评分参考】(1)意思相近即可得分(2)视结合具体作品与论述的精彩程度加1~4 分,但该题总得分不超过13 分。"}]}],"code":"00537","qaNotes":[]}];

暴；崇玩好，威嚴擬乎君謂之逆；刑殺不辜謂之賊。此三者，守國之大殃。’公曰：‘微大夫教寡人，幾有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罷守槐之役，拔置縣之木，廢傷槐之法，出犯槐之囚。":"景公有所爱槐，令吏谨守之，植木县之，下令曰：‘犯槐者刑，伤之者死。’有不闻令，醉而犯之者，公闻之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辞晏子之家，令内之。女子入门，晏子望见之，曰：‘怪哉！有深忧。’进而问焉，曰：‘所忧何也？’对曰：‘妾闻之，明君莅国立政，不损禄，不益刑，又不以私恚害公法，不为禽兽伤人民，不为草木伤禽兽，不为野草伤禾苗。吾君欲以树木之故杀妾父，孤妾身，此令行于民而法于国矣。虽然，妾闻之，勇士不以众强凌孤独，明惠之君不拂是以行其所欲。今之令不然，以树木之故，罪法妾父，恐其伤察吏之法，而害明君之义也。邻国闻之，皆谓吾君爱树而贱人，其可乎？’晏子曰：‘甚矣！吾将为子言之于君。’使人送之归。明日，早朝，而复于公曰：‘婴闻之，穷民财力以供嗜欲谓之暴；崇玩好，威严拟乎君谓之逆；刑杀不辜谓之贼。此三者，守国之大殃。’公曰：‘微大夫教寡人，几有大罪以累社稷。今子大夫教之，社稷之福，寡人受命矣。’晏子出，公令趣罢守槐之役，拔置县之木，废伤槐之法，出犯槐之囚。","縣：":"县：","（一）解释文中加着重号词语的意义。（6分）":"（一）解释文中加着重号词语的意义。（6分）","犯：":"犯：","益：":"益：","恚：":"恚：","凌：":"凌：","歸：":"归：","吾君欲以樹木之故殺妾父，⟪孤⟫妾身。":"吾君欲以树木之故杀妾父，⟪孤⟫妾身。","（二）说明下列句中下划线词的用法及意义。（4分）":"（二）说明下列句中下划线词的用法及意义。（4分）","鄰國聞之，皆謂吾君⟪愛⟫樹而⟪賤⟫人。":"邻国闻之，皆谓吾君⟪爱⟫树而⟪贱⟫人。","明惠之君不拂是以行其所欲。":"明惠之君不拂是以行其所欲。","（三）将下列句子译成现代汉语。（6分）":"（三）将下列句子译成现代汉语。（6分）","窮民財力以供嗜欲謂之暴。":"穷民财力以供嗜欲谓之暴。","微大夫教寡人，幾有大罪以累社稷。":"微大夫教寡人，几有大罪以累社稷。","用现代汉语表述，齐景公听从晏子的劝谏后采取了什么行动？":"用现代汉语表述，齐景公听从晏子的劝谏后采取了什么行动？","（四）":"（四）","下二亦":"下二亦","刃大从":"刃大从","止息莫":"止息莫","甘女卜":"甘女卜","頸，从頁，巠聲":"颈，从页，巠声","名，从口，夕聲":"名，从口，夕声","弑，从式，殺聲":"弑，从式，杀声","產，从生，彦省聲":"产，从生，彦省声","《说文解字》收录的小篆字头数量是（ ）":"《说文解字》收录的小篆字头数量是（ ）","9353":"9353","1163":"1163","10516":"10516","540":"540","下列句中，加着重号字与括号中的字是异体关系的一句是（ ）":"下列句中，加着重号字与括号中的字是异体关系的一句是（ ）","糟丘、酒池、肉圃、⟪烏格⟫（烙）。":"糟丘、酒池、肉圃、⟪乌格⟫（烙）。","位尊而無功，⟪奉⟫（俸）厚而無勞，而重器多也。":"位尊而无功，⟪奉⟫（俸）厚而无劳，而重器多也。","⟪券徧⟫（遍）合，起矯命以責賜諸民。":"⟪券徧⟫（遍）合，起矫命以责赐诸民。","越人安越，楚人安楚，君子安⟪雅⟫（夏）。":"越人安越，楚人安楚，君子安⟪雅⟫（夏）。","下列各组字，属于分化字关系的一组是（ ）":"下列各组字，属于分化字关系的一组是（ ）","趣—取":"趣—取","要—腰":"要—腰","調—朝":"调—朝","疑—擬":"疑—拟","下列句中，加着重号的部分属于复合词的一句是（ ）":"下列句中，加着重号的部分属于复合词的一句是（ ）","樹木而塗之，鼠穿其間，掘穴託其中。":"树木而涂之，鼠穿其间，掘穴托其中。","天下雲集而⟪響應⟫，贏糧而景從。":"天下云集而⟪响应⟫，赢粮而景从。","比年入學，中年考校。":"比年入学，中年考校。","君能有終，則⟪社稷⟫之固也。":"君能有终，则⟪社稷⟫之固也。","下列句中，加着重号的部分属于联绵词的一句是（ ）":"下列句中，加着重号的部分属于联绵词的一句是（ ）","堯之王天下也，茅茨不翦，采椽不斫。":"尧之王天下也，茅茨不翦，采椽不斫。","以故不聞其過，陵遲而至於二世，天下土崩。":"以故不闻其过，陵迟而至于二世，天下土崩。","子之宅近市，湫隘囂塵，不可以居。":"子之宅近市，湫隘嚣尘，不可以居。","陟彼高岡，我馬⟪玄黃⟫。":"陟彼高冈，我马⟪玄黄⟫。","孟嘗君不⟪說⟫，曰：‘諾，先生休矣！’": 罃，曰：“子其怨我乎？”對曰：“二國治戎，臣不才，不勝其任，以爲俘馘。執事不以衅鼓，使歸即戮，君之惠也。臣實不才，又誰敢怨？”王曰：“然則德我乎？”對曰：“二國圖其社稷，而求紓其民，各懲其忿以相宥也。兩釋累囚以成其好。二國有好，臣不與及，其誰敢德？”王曰：“子歸，何以報我？”對曰：“臣不任受怨，君亦不任受德，無怨無德，不知所報。”王曰：“雖然，必告不穀。”對曰：“以君之靈，累臣得歸骨於晉，寡君之以爲戮，死且不朽。若從君之惠而免之，以賜君之外臣首，首其請於寡君，而以戮於宗，亦死且不朽。若不獲命，而使嗣宗職，次及於事，而帥偏師以脩封疆。雖遇執事，其弗敢違，其竭力致死，無有二心，以盡臣禮，所以報也。”王曰：“營未可與爭。”重爲之禮而歸之。":"王送知䓨，曰：“子其怨我乎？”对曰：“二国治戎，臣不才，不胜其任，以为俘馘。执事不以衅鼓，使归即戮，君之惠也。臣实不才，又谁敢怨？”王曰：“然则德我乎？”对曰：“二国图其社稷，而求纾其民，各惩其忿以相宥也。两释累囚以成其好。二国有好，臣不与及，其谁敢德？”王曰：“子归，何以报我？”对曰：“臣不任受怨，君亦不任受德，无怨无德，不知所报。”王曰：“虽然，必告不谷。”对曰：“以君之灵，累臣得归骨于晋，寡君之以为戮，死且不朽。若从君之惠而免之，以赐君之外臣首，首其请于寡君，而以戮于宗，亦死且不朽。若不获命，而使嗣宗职，次及于事，而帅偏师以修封疆。虽遇执事，其弗敢违，其竭力致死，无有二心，以尽臣礼，所以报也。”王曰：“营未可与争。”重为之礼而归之。","使歸即戮":"使归即戮","然則德我乎":"然则德我乎","二國圖其社稷，而求紓其民":"二国图其社稷，而求纾其民","各懲其忿以相宥也":"各惩其忿以相宥也","次及於事，而帥偏師以脩封疆":"次及于事，而帅偏师以修封疆","重爲之禮而歸之":"重为之礼而归之","太史公曰詩有之高山仰止景行行止雖不能至然心嚮往之余讀孔氏書想見其為人適魯觀仲尼廟堂車服禮器諸生以時習禮其家余低回留之不能去云天下君王至於賢人眾矣當時則榮沒則已焉孔子布衣傳十餘世學者宗之自天子王侯中國言六藝者折中於夫子可謂至聖矣":"太史公曰诗有之高山仰止景行行止虽不能至然心向往之余读孔氏书想见其为人适鲁观仲尼庙堂车服礼器诸生以时习礼其家余低回留之不能去云天下君王至于贤人众矣当时则荣没则已焉孔子布衣传十余世学者宗之自天子王侯中国言六艺者折中于夫子可谓至圣矣","楚有士申鳴者，在家而養其父，孝聞於楚國。王欲授之相，申鳴辭不受。其父曰：“王欲相汝，汝何不受乎？”申鳴對曰：“舍父之孝子而爲王之忠臣，何也？”其父曰：“使有祿於國，立義於庭，汝樂，吾無憂矣。吾欲汝之相也。”申鳴曰：“諾。”遂入朝，楚王因授之相。居三年，白公爲亂，殺司馬子期，申鳴將往死之。父止之曰：“棄父而死，其可乎？”申鳴曰：“聞夫仕者，身歸於君而祿歸於親。今既去父事君，得無死其難乎？”遂辭而往，因以兵圍之。白公謂石乞曰：“申鳴者，天下之勇士也，今以兵圍我，吾焉之奈何？”石乞曰：“申鳴者，天下之孝子也，往劫其父以兵。申鳴聞之必來，因與之語。”白公曰：“善。”則往取其父，持之以兵。告申鳴曰：“子與吾，吾與子分楚國；子不與吾，子父則死矣。”申鳴流涕而應之曰：“始吾父之孝子也，今吾君之忠臣也。吾聞之也，食其食者死其事，受其祿者畢其能，今吾已不得爲父之孝子矣，乃君之忠臣也，吾何得以全身。”援桴鼓之，遂殺白公，其父亦死。":"楚有士申鸣者，在家而养其父，孝闻于楚国。王欲授之相，申鸣辞不受。其父曰：“王欲相汝，汝何不受乎？”申鸣对曰：“舍父之孝子而为王之忠臣，何也？”其父曰：“使有禄于国，立义于庭，汝乐，吾无忧矣。吾欲汝之相也。”申鸣曰：“诺。”遂入朝，楚王因授之相。居三年，白公为乱，杀司马子期，申鸣将往死之。父止之曰：“弃父而死，其可乎？”申鸣曰：“闻夫仕者，身归于君而禄归于亲。今既去父事君，得无死其难乎？”遂辞而往，因以兵围之。白公谓石乞曰：“申鸣者，天下之勇士也，今以兵围我，吾焉之奈何？”石乞曰：“申鸣者，天下之孝子也，往劫其父以兵。申鸣闻之必来，因与之语。”白公曰：“善。”则往取其父，持之以兵。告申鸣曰：“子与吾，吾与子分楚国；子不与吾，子父则死矣。”申鸣流涕而应之曰：“始吾父之孝子也，今吾君之忠臣也。吾闻之也，食其食者死其事，受其禄者毕其能，今吾已不得为父之孝子矣，乃君之忠臣也，吾何得以全身。”援桴鼓之，遂杀白公，其父亦死。","王欲相汝，汝何不受乎？相：":"王欲相汝，汝何不受乎？相：","（一）解释文中下划线词语的意义。（4分）":"（一）解释文中下划线词语的意义。（4分）","舍父之孝子而爲王之忠臣。舍：":"舍父之孝子而为王之忠臣。舍：","申鳴流涕而應之。涕：":"申鸣流涕而应之。涕：","援桴鼓之。援：":"援桴鼓之。援：", 道。’君曰：‘垂棘之璧，吾先君之宝也；屈产之乘，寡人之骏马也。若受吾币不假之道，将奈何？’荀息曰：‘彼不假我道，必不敢受我币。若受我币而假我道，则是宝犹取之内府而藏之外府也，马犹取之内厩而著之外厩也，君勿忧。’君曰：‘诺。’乃使荀息以垂棘之璧与屈产之乘赂虞公而求假道焉。虞公贪利其璧与马而欲许之。宫之奇谏曰：‘不可许。夫虞之有虢也，如车之有辅。辅依车，车亦依辅。虞虢之势正是也。若假之道，则虢朝亡而虞夕从之矣。不可，愿勿许。’虞公弗听，遂假之道。荀息伐虢而还，反处三年，兴兵伐虞，又克之。荀息牵马操璧而报献公。献公说，曰：‘璧则犹是也。虽然，马齿亦益长矣。’故虞公之兵殆而地削者何也？爱小利而不虑其害。故曰：‘顾小利则大利之残也。’","若受吾幣不假之道，將奈何":"若受吾币不假之道，将奈何","虞公貪利其璧與馬而欲許之":"虞公贪利其璧与马而欲许之","虞之有虢也，如車之有輔":"虞之有虢也，如车之有辅","馬齒亦益長矣":"马齿亦益长矣","故虞公之兵殆而地削者何也":"故虞公之兵殆而地削者何也","顧小利則大利之殘也":"顾小利则大利之残也","今爾出於崖涘觀於大海乃知爾醜爾將可與語大理矣天下之水莫大於海萬川歸之不知何時止而不盈尾閭泄之不知何時已而不虛春秋不變水旱不知此其過江河之流不可爲量數而吾未嘗以此自多者自以比形於天地而受氣於陰陽吾在天地之間猶小石小木之在大山也方存乎見少又奚以自多":"今尔出于崖涘观于大海乃知尔丑尔将可与语大理矣天下之水莫大于海万川归之不知何时止而不盈尾闾泄之不知何时已而不虚春秋不变水旱不知此其过江河之流不可为量数而吾未尝以此自多者自以比形于天地而受气于阴阳吾在天地之间犹小石小木之在大山也方存乎见少又奚以自多","晉文公曰：‘吾弛關市之徵而緩刑罰，其足以戰民乎？’狐子曰：‘不足。’曰：‘然則何如足以戰民乎？’狐子對曰：‘令無得不戰。’公曰：‘無得不戰奈何？’狐子對曰：‘信賞必罰，其足以戰。’公曰：‘刑罰之極安至？’對曰：‘不辟親貴，法行所愛。’文公曰：‘善。’明日令田于圃陸，期以日中爲期，後期者行軍法焉。於是公有所愛者曰顛頡，後期，吏請其罪，文公隕涕而憂。吏曰：‘請用事焉。’遂斬顛頡之脊以徇百姓，以明法之信也。而後百姓皆懼曰：‘君於顛頡之貴重如彼甚也，而君猶行法焉，況于我則何有矣。’文公見民之可戰也，於是遂興兵伐原，克之；伐衛，東其畝，取五鹿；攻陽，勝虢；伐曹；南圉鄭，反之陴；罷宋圉；還與荆人戰城濮，大敗荆人；返爲踐土之盟，遂成衡雍之義。一舉而八有功。所以然者，無他故異物，從狐偃之謀，假顛頡之脊也。":"晋文公曰：‘吾弛关市之征而缓刑罚，其足以战民乎？’狐子曰：‘不足。’曰：‘然则何如足以战民乎？’狐子对曰：‘令无得不战。’公曰：‘无得不战奈何？’狐子对曰：‘信赏必罚，其足以战。’公曰：‘刑罚之极安至？’对曰：‘不辟亲贵，法行所爱。’文公曰：‘善。’明日令田于圃陆，期以日中为期，后期者行军法焉。于是公有所爱者曰颠颉，后期，吏请其罪，文公陨涕而忧。吏曰：‘请用事焉。’遂斩颠颉之脊以徇百姓，以明法之信也。而后百姓皆惧曰：‘君于颠颉之贵重如彼甚也，而君犹行法焉，况于我则何有矣。’文公见民之可战也，于是遂兴兵伐原，克之；伐卫，东其亩，取五鹿；攻阳，胜虢；伐曹；南圉郑，反之陴；罢宋圉；还与荆人战城濮，大败荆人；返为践土之盟，遂成衡雍之义。一举而八有功。所以然者，无他故异物，从狐偃之谋，假颠颉之脊也。","然則：":"然则：","安：":"安：","辟：":"辟：","涕：":"涕：","克：":"克：","假：":"假：","吾弛關市之徵而緩刑罰。弛：":"吾弛关市之征而缓刑罚。弛：","東其畝，取五鹿。東：":"东其亩，取五鹿。东：","明日令田于圃陸，期以日中爲期，後期者行軍法焉。":"明日令田于圃陆，期以日中为期，后期者行军法焉。","君於顛頡之貴重如彼甚也，而君猶行法焉。":"君于颠颉之贵重如彼甚也，而君犹行法焉。","晋文公为什么事询问狐偃的意见？狐偃给晋文公的建议是什么？晋文公是如何实现的？请用自己的语言表述出来。":"晋文公为什么事询问狐偃的意见？狐偃给晋文公的建议是什么？晋文公是如何实现的？请用自己的语言表述出来。","（四）（6分）":"（四）（6分）","本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","下列各组字，全部包含象形、指事、会意三种结构类型的一组是":"下列各组字，全部包含象形、指事、会意三种结构类型的一组是","及陳柏":"及陈柏","自一臭":"自一臭","水新線":"水新线","月杯修":"月杯修","下列对汉字义符 之田，勿奪其時。":"根据下列例句归纳古汉语名量表示法的格式，并将例句序号归入相应格式。（1）今人有五子，不为多。（2）翼日戊午，乃社于新邑，牛一、羊一、豕一。（3）齐金百斤，车马十驷。（4）百亩之田，勿夺其时。","管仲曰：‘吾始困時，嘗與鮑叔賈，分財利多自與，鮑叔不以我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，鮑叔不以我爲不肖，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，召忽死之，吾幽囚受辱，鮑叔不以我爲無恥，知我不羞小節而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。子孫世祿於齊，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而多鮑叔能知人也。":"管仲曰：‘吾始困时，尝与鲍叔贾，分财利多自与，鲍叔不以我为贪，知我贫也；吾尝为鲍叔谋事而更穷困，鲍叔不以我为愚，知时有利不利也；吾尝三仕三见逐于君，鲍叔不以我为不肖，知我不遭时也；吾尝三战三走，鲍叔不以我为怯，知我有老母也；公子纠败，召忽死之，吾幽囚受辱，鲍叔不以我为无耻，知我不羞小节而耻功名不显于天下也。生我者父母，知我者鲍子也。’鲍叔既进管仲，以身下之。子孙世禄于齐，有封邑者十余世，常为名大夫。天下不多管仲之贤而多鲍叔能知人也。","嘗與鮑叔賈":"尝与鲍叔贾","鮑叔不以我爲不肖":"鲍叔不以我为不肖","召忽死之":"召忽死之","知我不羞小節":"知我不羞小节","子孫世祿於齊":"子孙世禄于齐","多鮑叔能知人也":"多鲍叔能知人也","蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣":"苏代为燕说齐未见齐王先说淳于髡曰人有卖骏马者比三旦立市人莫之知往见伯乐曰臣有骏马欲卖之比三旦立于市人莫与言愿子还而视之去而顾之臣请献一朝之贾伯乐乃还而视之去而顾之一旦而马价十倍今臣欲以骏马见于王莫为臣先后者足下有意为臣伯乐乎臣请献白璧一双黄金万镒以为马食淳于髡曰谨闻命矣","梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭對曰：‘吾小人也，貪。饋之始至，懼其不足，故歎。中食而自咎也。曰：“豈主之食而有不足？”是以再歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。":"梗阳人有⟪狱⟫，将不胜，⟪请纳赂于魏献子⟫，献子将许之。⟪阎没⟫谓叔宽曰：‘与子谏乎！吾主以不⟪贿⟫闻于诸侯，今以梗阳之贿殃之，不可。’二人朝而不退。献子将食，问谁于庭，曰：‘阎明、叔褒在。’召之，使佐食。比己食，三叹。⟪既饱⟫，献子问焉，曰：‘人有言曰：“唯食可以忘忧。”吾子一食之间而三叹，何也？’同辞对曰：‘吾小人也，贪。馈之始至，惧其不足，故叹。中食而自咎也。曰：“岂主之食而有不足？”是以再叹。主之既食，愿以小人之腹，为君子之心，适⟪厌⟫而已，是以三叹。’献子曰：‘善。’乃辞梗阳人。","獄：":"狱：","對：":"对：","饋：":"馈：","咎：":"咎：","再：":"再：","厭：":"厌：","吾主以不⟪賄⟫聞於諸侯。賄：":"吾主以不⟪贿⟫闻于诸侯。贿：","（二）解释下列句子中加着重号的词的词性和词义。（4分）":"（二）解释下列句子中加着重号的词的词性和词义。（4分）","⟪既⟫飽，獻子問焉。既：":"⟪既⟫饱，献子问焉。既：","⟪請納賂於魏獻子⟫。":"⟪请纳赂于魏献子⟫。","（三）将下列文中画线的句子译成现代汉语。（4分）":"（三）将下列文中画线的句子译成现代汉语。（4分）","⟪人有言曰：‘唯食可以忘憂。’吾子一食之間而三歎，何也？⟫":"⟪人有言曰：‘唯食可以忘忧。’吾子一食之间而三叹，何也？⟫","用现代汉语说明阎没与叔宽是如何劝谏魏献子的？":"用现代汉语说明阎没与叔宽是如何劝谏魏献子的？","（四）回答下列问题。（6分）":"（四）回答下列问题。（6分）","说明文中“以小人之腹，爲君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。":"说明文中“以小人之腹，为君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。"};

const PAPERS=(()=>{const ready=new Map(RAW_PAPERS.map(p=>[p.paper,{...p,available:p.available!==false}]));for(const subject of Object.keys(SUBJECTS))for(const session of SESSIONS){const id=`${subject}-${session}`;if(!ready.has(id))ready.set(id,{paper:id,subject,session,label:`20${session.slice(0,2)}年${session.slice(2)==='04'?'4月':'10月'}`,code:SUBJECTS[subject].code,sections:[],qaNotes:['原卷及答案待整理。'],available:false})}return [...ready.values()].sort((a,b)=>a.subject.localeCompare(b.subject)||a.session.localeCompare(b.session))})();
const LETTERS='ABCDE'.split('');
let appState={view:'home',subject:null,paper:null,cursor:0,mode:'exam',answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},navOpen:true,navCompact:false,gdhySimple:false};
let fontStep=1;try{const settings=JSON.parse(localStorage.getItem('zk:v1:settings')||'{}');fontStep=settings.fontStep||1;appState.gdhySimple=localStorage.getItem('zk:gdhy-simple')==='1';if(settings.dark!==undefined)localStorage.setItem('zk:dark',settings.dark?'1':'0')}catch{}
try{const settings=JSON.parse(localStorage.getItem('zk:v1:settings')||'{}');fontStep=settings.fontStep||1;if(settings.dark!==undefined)localStorage.setItem('zk:dark',settings.dark?'1':'0')}catch{}
const key=(p,n)=>'zk:v1:'+p.subject+':'+p.session;
let punct={};
function load(p){const raw=localStorage.getItem(key(p));if(!raw)return {answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'};try{return Object.assign({answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'},JSON.parse(raw))}catch{return {answers:{},strokes:{},text:{},scores:{},essayChoice:{},punct:{},status:'new'}}}
function save(){if(!appState.paper)return;localStorage.setItem(key(appState.paper),JSON.stringify({answers:appState.answers,strokes:appState.strokes,text:appState.text,scores:appState.scores,essayChoice:appState.essayChoice,punct:appState.punct,status:appState.status||'progress'}));}
function allItems(p){const out=[];for(const s of p.sections||[])for(const q of s.items||[]){if(q.t==='r'){for(const sub of q.subs||[])out.push(Object.assign({},sub,{parent:q.n,passage:q.passage}));}else out.push(q);}return out}
function activeItems(p){return allItems(p).filter(q=>!(p.subject==='marx'&&q.n>=31&&q.n<=33&&!appState.essayChoice[qKey(q)]))}
function flatItems(p){const out=[];for(const s of p.sections||[])for(const q of s.items||[])out.push(q);return out}
function qKey(q){return q.parent!==undefined?`${q.parent}-${q.n}`:String(q.n)}
function hasAnswer(q){if(q.t==='s'||q.t==='m')return !!appState.answers[qKey(q)];if(q.t==='p')return Object.keys(appState.punct[qKey(q)]||{}).length>0;if(q.t==='r')return (q.subs||[]).every(x=>hasAnswer(Object.assign({},x,{parent:q.n})));return !!(appState.text[qKey(q)]||((appState.strokes[qKey(q)]||[]).length));}
function isObjective(q){return q.t==='s'||q.t==='m'}
function objective(q){return isObjective(q)}
function isSubjective(q){return !objective(q)}
function answerUnavailable(q){const a=String(q?.ans??'').trim();return !a||/^\[(?:答案未见|辨认不清|答案待核|答案禁用|答案来源错配)/.test(a)||/禁用/.test(a)}
function scorable(q){return !answerUnavailable(q)}
function answeredCount(p){return activeItems(p).filter(hasAnswer).length}
function statusFor(p){if(p.available===false)return 'unavailable';const s=load(p);if(s.status==='done')return 'done';if(s.status==='submitted')return 'submitted';const n=Object.keys(s.answers||{}).length+Object.keys(s.text||{}).length+Object.keys(s.strokes||{}).length+Object.keys(s.punct||{}).length;return n?'progressing':'new'}
function statusText(s){return s==='done'?'已完成':s==='submitted'?'已交卷':s==='progressing'?'进行中':s==='unavailable'?'转录中':'未做'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rich(v,simplify=false){if(simplify&&appState.paper?.subject==='gdhy'&&appState.gdhySimple)v=SIMPLE_MAP[String(v)]||v;return esc(v).replace(/⟪([^⟫]+)⟫/g,'<em class=\"emph\">$1</em>')}
function scorePaper(p){let got=0,total=0,unscored=0,objectiveGot=0,objectiveTotal=0,subjectiveGot=0,subjectiveTotal=0;for(const q of activeItems(p)){if(!scorable(q)){unscored++;continue}if(objective(q)){objectiveTotal+=q.score||0;total+=q.score||0;if(appState.answers[qKey(q)]&&appState.answers[qKey(q)]===q.ans){got+=q.score||0;objectiveGot+=q.score||0}}else{subjectiveTotal+=q.score||0;total+=q.score||0;const value=Number(appState.scores[qKey(q)]||0);got+=value;subjectiveGot+=value}}return {got,total,unscored,objectiveGot,objectiveTotal,subjectiveGot,subjectiveTotal}}
function objectiveAvailable(p){return activeItems(p).filter(q=>objective(q)&&!q.ans).length===0}
function scoreSection(sec){let got=0,total=0,unscored=0;const visit=(q,parent)=>{if(q.t==='r'){(q.subs||[]).forEach(sub=>visit(sub,q.n));return}if(parent!==undefined)q=Object.assign({},q,{parent});if(appState.paper.subject==='marx'&&q.n>=31&&q.n<=33&&!appState.essayChoice[qKey(q)])return;if(!scorable(q)){unscored++;return}if(objective(q)){total+=q.score||0;if(appState.answers[qKey(q)]===q.ans)got+=q.score||0}else{total+=q.score||0;got+=Number(appState.scores[qKey(q)]||0)}};(sec.items||[]).forEach(q=>visit(q));return {got,total,unscored}}
function renderScoreBreakdown(p){return `<div class="card"><strong>各大题得分</strong>${p.sections.map(s=>{const x=scoreSection(s);return `<div class="section-score"><span>${esc(s.title)}</span><span>${x.got}/${x.total}分${x.unscored?` · ${x.unscored}题答案待核`:''}</span></div>`}).join('')}</div>`}
function availableSubjects(){return PAPERS.filter(p=>p.available!==false)}
function reviewStatus(){const list=availableSubjects();return list.filter(p=>statusFor(p)==='done').length}
function render(){document.documentElement.classList.toggle('dark',localStorage.getItem('zk:dark')==='1');document.documentElement.style.fontSize=(fontStep===1?'16px':fontStep===2?'18px':'14px');localStorage.setItem('zk:v1:settings',JSON.stringify({fontStep,dark:localStorage.getItem('zk:dark')==='1'}));const root=document.getElementById('app');if(appState.view==='home')root.innerHTML=home();else if(appState.view==='subject')root.innerHTML=subject();else root.innerHTML=exam();bind();}
function topNav(title,back){return `<div class="topbar">${back?`<button class="back" data-action="back">‹ 返回</button>`:''}<h1>${esc(title)}</h1><div class="topbar-tools">${appState.paper?.subject==='gdhy'?`<button class="btn" data-action="simple">${appState.gdhySimple?'简':'繁'}</button>`:''}<button class="btn" id="darkBtn">◐</button><button class="btn" id="fontBtn">A</button></div></div>`}
function home(){return topNav('自考真题',false)+`<main class="wrap"><div class="grid">${Object.entries(SUBJECTS).map(([id,s])=>`<button class="card subject-card" data-subject="${id}"><div><div class="eyebrow">${s.code}</div><h3>${s.name}</h3></div></button>`).join('')}</div></main>`}
function subject(){const s=SUBJECTS[appState.subject],ps=PAPERS.filter(p=>p.subject===appState.subject).sort((a,b)=>a.session.localeCompare(b.session));return topNav(s.name,true)+`<main class="wrap"><div class="section-title"><div><h2>${s.name}</h2><small>${s.code} · ${ps.length}套</small></div></div><div class="paper-list">${ps.map(p=>{const st=statusFor(p),sc=load(p);let score='';if(st==='done'){const old=[appState.paper,appState.answers,appState.scores];appState.paper=p;appState.answers=sc.answers||{};appState.scores=sc.scores||{};score=' · '+scorePaper(p).got+'分';[appState.paper,appState.answers,appState.scores]=old}return `<button class="paper-row" data-paper="${p.paper}" ${p.available===false?'aria-disabled="true"':''}><span class="label">${p.label}</span><span class="meta">${p.available===false?'原卷待补':(p.sections||[]).reduce((n,x)=>n+(x.items||[]).length,0)+'题'+score}</span><span class="status ${st}">${statusText(st)}</span></button>`}).join('')}</div></main>`}
function nav(p){return `<div class="nav-grid">${allItems(p).map((q,i)=>`<button data-cursor="${i}" data-target="q-${qKey(q)}" class="${hasAnswer(q)?'answered ':''}${i===appState.cursor?'current':''}">${q.n}</button>`).join('')}</div>`}
function renderObjective(q,review=false){const chosen=appState.answers[qKey(q)]||'',key=String(q.ans||'');return `<div class="opts">${(q.opts||[]).map((o,i)=>{const letter=LETTERS[i],sel=q.t==='m'?chosen.includes(letter):chosen===letter,correct=review&&key.includes(letter),wrong=review&&sel&&!correct;return `<button class="opt ${sel?'sel':''} ${correct?'correct-opt':''} ${wrong?'wrong-opt':''}" data-q="${qKey(q)}" data-letter="${letter}" data-multi="${q.t==='m'}" ${review?'disabled':''}><span class="letter">${letter}.</span><span>${rich(o,appState.paper?.subject==='gdhy')}</span></button>`}).join('')}</div>`}
function canvas(q){return `<textarea class="answer-box" data-text="${qKey(q)}" placeholder="在此作答（Apple Pencil 直接书写会自动转为文字）"></textarea>`}
function reviewWriting(q){const text=appState.text[qKey(q)]||'';return `<div class="review-writing">${text?`<div class="answer-note">${esc(text)}</div>`:`<div class="answer-note">未填写文字作答</div>`}</div>`}
function punctEditor(q){const chars=Array.from(q.passage||''),marks=appState.punct?.[qKey(q)]||{};return `<div class="punct-passage">${chars.map((ch,i)=>`${rich(ch,appState.paper?.subject==='gdhy')}<button class="punct-gap" data-punct-gap="${i}" data-q="${qKey(q)}">${esc(marks[i]||'　')}</button>`).join('')}</div><div class="punct-toolbar">${['，','。','！','？','：','；','、','“','”','‘','’','《','》','〈','〉','（','）','：“','“”','‘’','《》','（）'].map(m=>`<button data-punct-mark="${esc(m)}" data-q="${qKey(q)}">${esc(m)}</button>`).join('')}<button data-punct-delete="1" data-q="${qKey(q)}">⌫</button></div>`}
function shownPunctuation(q){const chars=Array.from(q.passage||''),marks=appState.punct?.[qKey(q)]||{};return chars.map((ch,i)=>ch+(marks[i]||'')).join('')}
function punctuationReview(q){return `<div class="answer-note"><strong>我的标点：</strong>${rich(shownPunctuation(q))}</div><div class="answer-note"><strong>参考标点：</strong>${rich(q.ans||'')}</div>`}
function renderReading(q,review){return `<div class="question reading" id="q-${q.n}"><div class="q-head"><span class="q-number">${q.n}</span><span class="stem">阅读原文</span></div><div class="passage">${rich(q.passage||'',appState.paper?.subject==='gdhy')}</div>${(q.subs||[]).map(sub=>question(Object.assign({},sub,{parent:q.n}),review)).join('')}</div>`}
function question(q,review=false){if(q.t==='r')return renderReading(q,review);const instr=q.grp?`<div class="q-instr">${esc(q.grp)}</div>`:'';const stemNoInstr=String(q.stem||'').replace(/^（[一二三四五六七八九十]+）[^。]*。/,'');if(q.t==='p')return `<div class="question" id="q-${qKey(q)}">${instr}<div class="q-head"><span class="q-number">${q.n}</span><span class="stem">${rich(q.stem,appState.paper?.subject==='gdhy')}</span></div><div class="passage">${rich(q.passage||'',appState.paper?.subject==='gdhy')}</div>${review?`${punctuationReview(q)}${reviewWriting(q)}${scorePicker(q,scorable(q))}`:punctEditor(q)}</div>`;const ans=appState.answers[qKey(q)]||'',cls=review&&objective(q)&&scorable(q)?(ans===q.ans?'correct':'wrong'):'';const essay=(appState.paper.subject==='marx'&&q.n>=31&&q.n<=33);let body;if(objective(q)){body=renderObjective(q,review);if(review)body+=`<div class="answer-note"><strong>正确答案：</strong>${scorable(q)?rich(q.ans):'答案未核实，不计自动分'} · ${scorable(q)?(ans===q.ans?(q.score||0):0)+'/'+(q.score||0)+'分':'不计分'}</div>`}else if(review){body=`<div class="answer-compare"><div><strong>我的作答</strong>${reviewWriting(q)}</div><div><strong>参考答案</strong><div class="answer-note">${scorable(q)?rich(q.ans):'本题答案尚未核实，不计入总分。'}</div></div></div>${scorable(q)?scorePicker(q,appState.status!=='done'):''}`}else{body=canvas(q)}return `<div class="question ${cls}" id="q-${qKey(q)}">${instr}<div class="q-head"><span class="q-number">${q.n}</span><span class="stem">${rich(stemNoInstr||q.stem,appState.paper?.subject==='gdhy')}</span></div>${essay&&!review?`<label class="essay-choice ${appState.essayChoice[qKey(q)]?'chosen':''}"><input type="checkbox" data-essay="${qKey(q)}" ${appState.essayChoice[qKey(q)]?'checked':''}> 选答此题（论述题需选答2题）</label>`:''}${body}</div>`}
function scorePicker(q,enabled=true){const max=q.score||0;return `<div class="score-row"><span>自评：</span>${Array.from({length:max+1},(_,i)=>`<button ${enabled?'':'disabled'} class="${Number(appState.scores[qKey(q)])===i?'active':''}" data-score="${qKey(q)}" data-value="${i}">${i}</button>`).join('')}<span>/${max}</span></div>`}
function sectionContent(sec,review){const sectionPassage=sec.passage?`<div class="passage">${rich(sec.passage,appState.paper?.subject==='gdhy')}</div>`:'';return `<section class="question-section"><h3>${esc(sec.title)}</h3><div class="meta">${esc(sec.meta||'')}</div>${sectionPassage}${(sec.items||[]).map(q=>question(q,review)).join('')}</section>`}
function safeNotes(p){return []}
function exam(){const p=appState.paper,review=appState.mode==='review',chosen=Object.values(appState.essayChoice||{}).filter(Boolean).length;const s=review?scorePaper(p):null;const done=appState.status==='done';const bar=`<div class="float-bar ${appState.navCompact?'compact':''}"><button class="float-toggle" data-action="toggle-nav" aria-label="展开或缩小答题卡">${appState.navCompact?'答':'−'}</button>${nav(p)}${review?(done?'':`<button class="btn primary" data-action="complete">完成</button>`):`<button class="btn primary" data-action="submit">交卷</button>`}</div>`;return topNav(p.label,true)+bar+`<main class="wrap ${review?'review':''}"><div class="exam-head"><div><h2>${esc(p.label)}</h2><p>${SUBJECTS[p.subject]?.name||p.subject} · ${p.code||''}</p></div><div class="toolbar">${review?`<button class="btn" data-action="redo">重做</button>`:''}</div></div>${review?`<div class="result"><div><div class="eyebrow">${done?'已完成':'客观题'}</div><strong>${done?s.got:s.objectiveGot}<small>/${done?s.total:s.objectiveTotal}</small></strong></div><div class="answer-note">${done?`客观 ${s.objectiveGot} · 主观自评 ${s.subjectiveGot}`:'主观题请在下方逐题自评，完成后点"完成"查看总分'}</div></div>${done?renderScoreBreakdown(p):''}`:`<div class="result"><div><div class="eyebrow">进度</div><strong>${answeredCount(p)}</strong>/${activeItems(p).length}</div><div class="answer-note">${p.subject==='marx'?`论述题已选 ${chosen}/2 · `:''}答案交卷后显示</div></div>`}${(p.sections||[]).map(sec=>sectionContent(sec,review)).join('')}</main>`}
function bind(){document.querySelectorAll('[data-subject]').forEach(x=>x.onclick=()=>{appState.view='subject';appState.subject=x.dataset.subject;window.scrollTo(0,0);render()});document.querySelectorAll('[data-paper]').forEach(x=>x.onclick=()=>{const p=PAPERS.find(z=>z.paper===x.dataset.paper);if(!p||p.available===false){alert('此卷题面资料不完整，暂不可作答。');return}appState.paper=p;const data=load(p);Object.assign(appState,{view:'exam',mode:data.status==='submitted'||data.status==='done'?'review':'exam',cursor:0,answers:data.answers||{},strokes:data.strokes||{},text:data.text||{},scores:data.scores||{},essayChoice:data.essayChoice||{},punct:data.punct||{},status:data.status||'new'});window.scrollTo(0,0);render()});document.querySelectorAll('[data-action=back]').forEach(x=>x.onclick=()=>{if(appState.view==='exam'){save();appState.view='subject';appState.mode='exam'}else appState.view='home';window.scrollTo(0,0);render()});document.querySelectorAll('[data-letter]').forEach(x=>x.onclick=()=>{if(appState.mode==='review')return;const n=x.dataset.q;if(x.dataset.multi){let v=appState.answers[n]||'';v=v.includes(x.dataset.letter)?v.replace(x.dataset.letter,''):(v+x.dataset.letter).split('').sort().join('');appState.answers[n]=v}else appState.answers[n]=x.dataset.letter;appState.status='progress';save();render()});document.querySelectorAll('[data-cursor]').forEach(x=>x.onclick=()=>{appState.cursor=Number(x.dataset.cursor);document.getElementById(x.dataset.target)?.scrollIntoView({behavior:'smooth',block:'center'});render()});document.querySelectorAll('[data-action=toggle-nav]').forEach(x=>x.onclick=()=>{appState.navCompact=!appState.navCompact;render()});document.querySelectorAll('[data-score]').forEach(x=>x.onclick=()=>{if(appState.status==='done')return;appState.scores[x.dataset.score]=Number(x.dataset.value);save();render()});document.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{appState.text[x.dataset.text]=x.value;save()});document.querySelectorAll('[data-punct-gap]').forEach(x=>x.onclick=()=>{appState.punctActive={q:x.dataset.q,i:Number(x.dataset.punctGap)};document.querySelectorAll('.punct-gap').forEach(y=>y.classList.toggle('active',y===x))});document.querySelectorAll('[data-punct-mark]').forEach(x=>x.onclick=()=>{const a=appState.punctActive;if(!a||a.q!==x.dataset.q)return;const map=appState.punct[a.q]||(appState.punct[a.q]={});map[a.i]=(map[a.i]||'')+x.dataset.punctMark;save();render()});document.querySelectorAll('[data-punct-delete]').forEach(x=>x.onclick=()=>{const a=appState.punctActive;if(!a||a.q!==x.dataset.q)return;const map=appState.punct[a.q]||(appState.punct[a.q]={}),marks=Array.from(map[a.i]||'');marks.pop();if(marks.length)map[a.i]=marks.join('');else delete map[a.i];save();render()});document.querySelectorAll('[data-essay]').forEach(x=>x.onchange=()=>{appState.essayChoice[x.dataset.essay]=x.checked;save();render()});document.querySelectorAll('[data-action=submit]').forEach(x=>x.onclick=submit);document.querySelectorAll('[data-action=complete]').forEach(x=>x.onclick=complete);document.querySelectorAll('[data-action=redo]').forEach(x=>x.onclick=redo);document.querySelectorAll('[data-action=simple]').forEach(x=>x.onclick=()=>{appState.gdhySimple=!appState.gdhySimple;localStorage.setItem('zk:gdhy-simple',appState.gdhySimple?'1':'0');render()});document.getElementById('darkBtn')?.addEventListener('click',()=>{localStorage.setItem('zk:dark',localStorage.getItem('zk:dark')==='1'?'0':'1');render()});document.getElementById('fontBtn')?.addEventListener('click',()=>{fontStep=fontStep%3+1;render()})}
function setupCanvas(c){const id=c.dataset.canvas,ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineWidth=3;let drawing=false,current=[];const scale=()=>({x:c.width/c.getBoundingClientRect().width,y:c.height/c.getBoundingClientRect().height});const point=e=>{const r=c.getBoundingClientRect(),s=scale();return {x:(e.clientX-r.left)*s.x,y:(e.clientY-r.top)*s.y,p:e.pressure||.5}};const redraw=()=>{ctx.clearRect(0,0,c.width,c.height);for(const st of appState.strokes[id]||[]){ctx.beginPath();st.forEach((p,i)=>{if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)});ctx.stroke()}};redraw();if(c.dataset.readonly)return;c.onpointerdown=e=>{if(e.pointerType!=='pen'&&e.pointerType!=='mouse')return;drawing=true;current=[point(e)];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const p=point(e);current.push(p);ctx.beginPath();const a=current[current.length-2];ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=2+4*p.p;ctx.stroke()};c.onpointerup=()=>{if(!drawing)return;drawing=false;(appState.strokes[id]||(appState.strokes[id]=[])).push(current);save()}}
function submit(){const p=appState.paper;if(p.subject==='marx'&&Object.values(appState.essayChoice||{}).filter(Boolean).length!==2){alert('马克思论述题请恰好选择2题作答。');return}const missing=activeItems(p).filter(q=>!hasAnswer(q));if(missing.length&&!confirm(`还有 ${missing.length} 道题未作答，仍然交卷吗？`))return;appState.status='submitted';save();appState.mode='review';appState.cursor=0;appState.navOpen=false;window.scrollTo(0,0);render()}
function complete(){if(appState.status==='done'){appState.view='subject';appState.mode='exam';window.scrollTo(0,0);render();return}const p=appState.paper,subjective=activeItems(p).filter(q=>isSubjective(q)&&scorable(q)),missing=subjective.filter(q=>appState.scores[qKey(q)]===undefined);if(missing.length&&!confirm(`还有 ${missing.length} 道主观题未自评，仍然二次提交吗？`))return;if(!confirm('二次提交并标记本卷完成？完成后作答不可修改。'))return;appState.status='done';save();window.scrollTo(0,0);render()}
function redo(){if(!confirm('清空这套卷的作答、笔迹和自评分数？'))return;localStorage.removeItem(key(appState.paper));const p=appState.paper,data=load(p);Object.assign(appState,data,{view:'exam',mode:'exam',cursor:0,navOpen:true});render()}
render();
</script>
