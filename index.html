","score":1,"ana":"“耆”在句中意为“喜爱”。","anaAI":true},{"t":"w","n":32,"grp":"（二）说明下列句中加着重号词的词性、意义或用法。（5分）","stem":"顏淵季路侍。子曰：“盍各言⟪爾⟫志？”爾：","ans":"第二人称代词。你们的，作定语。","score":1,"ana":"“爾”在句中意为“第二人称代词；你们的，作定语”。","anaAI":true},{"t":"w","n":33,"stem":"是必⟪夫⟫奇鬼也。夫：","ans":"指示代词。那个，作定语。","score":1,"ana":"“夫”在句中意为“指示代词；那个，作定语”。","anaAI":true},{"t":"w","n":34,"stem":"雖遇執事，其⟪弗⟫敢違。弗：","ans":"否定副词。不，作状语。","score":1,"ana":"“弗”在句中意为“否定副词；不，作状语”。","anaAI":true},{"t":"w","n":35,"stem":"景公知晏子賢，迺任⟪以⟫國政。以：","ans":"介词。引进处置的对象，把。","score":1,"ana":"“以”在句中意为“介词；引进处置的对象，把”。","anaAI":true},{"t":"w","n":36,"stem":"彼且⟪奚⟫適焉？奚：","ans":"疑问代词。哪里，作宾语。","score":1,"ana":"“奚”在句中意为“疑问代词；哪里，作宾语”。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共3小题，共20分。","items":[{"t":"w","n":37,"stem":"指出下列句中加着重号的字与括号中的字是异体字关系还是分化字关系，并说明辨别这两种字际关系的理由。\n（1）梁北有黎丘部，有奇鬼焉。喜⟪効⟫（效）人之子姪昆弟之狀。\n（2）其⟪謌⟫（歌）也有思，其哭也有懷。\n（3）宛王殺漢使者，頭⟪縣⟫（懸）北闕。\n（4）齊人有馮諼者，貧乏不能自存，使人⟪屬⟫（嘱）孟嘗君。","ans":"（1）和（2）是异体字；（3）和（4）是分化字。异体字音义完全相同，记词职能也完全一样，只是形体不同。“効”和“效”、“謌”和“歌”音义完全相同、记词职能完全一样，形体不同，是异体字关系。分化字读音相同或相近，一个字分担了另一个字多个意义职能的一个，者为分化关系。“懸”分担了“縣”的“悬挂”的职能，是分化字；“嘱”分担了“屬”的“嘱托”的职能，是分化字。","score":6,"ana":"得分要点是先逐例判定字际关系，再用音义、形体及记录职能说明依据；异体须音义和用字职能相同，分化字须指出新字分担的义项，通假则说明借同音字记录本词。","anaAI":true},{"t":"w","n":38,"stem":"解释下列句中加着重号词语的意义，找出其中的复合词，并以此为例说明确认复合词的主要标准。\n（1）且陛下⟪春秋⟫高，法令無常。\n（2）蟪蛄不知⟪春秋⟫，此小年也。\n（3）天子祭天地，諸侯祭⟪社稷⟫。\n（4）是⟪社稷⟫之臣也，何以伐為？","ans":"（1）年龄。（2）春天和秋天。（3）土地神与谷神。（4）国家。两个单音词组合以后意义不等于原来意义的简单相加，而产生了新的意义，可以认为是复合词。如（1）的“春秋”和（4）的“社稷”。","score":6,"ana":"得分要点包括逐例释义、辨认复合词，并说明判据：组合后的意义已约定化或不等于两个单音词义的简单相加；不能仅凭双音形式判定。","anaAI":true},{"t":"w","n":39,"stem":"根据以下例句归纳“其”的用法，并将例句归到各类用法的后面。\n（1）日月之行，若出其⟪中⟫。\n（2）北冥有魚，其名為鯤。\n（3）及其未既濟也，請擊之。\n（4）楚其亡乎？\n（5）昭王之不復，君其問諸水濱！\n（6）稱其⟪雠⟫，不為諂。","ans":"第一，第三人称代词，作定语，表示领属关系。例句（2）（6）。第二，第三人称代词，充当主谓词组或分句的主语。例句（3）。第三，指示代词，表示远指，作定语，相当于现代汉语的“那”。例句（1）。第四，句中语气词，表示推测，可译作“大概”。例句（4）。第五，句中语气词，表示一种委婉的语气，可译为“希望”“还是”。例句（5）。","score":8,"ana":"作答需先概括语法类别及句法功能，再把各例逐一归类；得分不仅看术语，还要说明该词在句中的位置、支配关系或语气作用，避免只罗列译义。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下段文章中画线的句子译成现代汉语。","passage":"田單知士卒之可用，⟪乃身操版插，與士卒分功⟫，妻妾編於行伍之間，盡散飲食饗士。令甲卒皆伏，使老弱女子乘城，遣使約降於燕，燕軍皆呼萬歲。田單又收民金，得千溢，令即墨富豪遺燕將，曰：“即墨即降，⟪願無虜掠吾族家妻妾，令安堵⟫。”⟪燕將大喜，許之。燕軍由此益懈⟫。田單乃收城中得千餘牛，為絳繒衣，畫以五彩龍文，⟪束兵刃於其角，而灌脂束葦於尾⟫，燒其端。鑿城數十穴，夜縱牛，壯士五千人隨其後。牛尾熱，怒而奔燕軍，燕軍夜大驚。牛尾炬火光明炫耀，燕軍視之皆龍文，所觸盡死傷。五千人因銜枚擊之，而城中鼓譟從之，老弱皆擊銅器為聲，聲動天地。燕軍大駭，敗走。齊人遂夷殺其將騎劫。⟪燕軍擾亂奔走，齊人追亡逐北⟫，所過城邑皆畔燕而歸。⟪田單兵日益多，乘勝，燕日敗亡⟫，卒至河上，而齊七十餘城皆復為齊。乃迎襄王於莒，入臨菑而聽政。襄王封田單，號曰安平君。","items":[{"t":"w","n":40,"stem":"⟪乃身操版插，與士卒分功⟫","ans":"（田单）就亲自拿着修筑防御工事的工具，和士兵分担辛劳。","score":2,"ana":"翻译得分应按搭配辨析“與/与”表参与、给予还是连接，并保持原句主谓、修饰与语气关系，不以逐字拼接代替句意。","anaAI":true},{"t":"w","n":41,"stem":"⟪願無虜掠吾族家妻妾，令安堵⟫","ans":"希望不要掠夺我们同族家的女子，让她们安居不受侵扰。","score":2,"ana":"“虏掠”是俘掠、劫掠；“吾族家妻妾”指本族各家的妻妾，“令”有使令义，“安堵”是安居。全句是请求不要劫掠族中妻妾，使她们安居；现有译文将“妻妾”概括为“女子”，这一词义对应可核对。","anaAI":true},{"t":"w","n":42,"stem":"⟪燕將大喜，許之。燕軍由此益懈⟫","ans":"燕军将领非常高兴，答应他们的请求。燕国军队从此逐渐放松警惕。","score":2,"ana":"翻译得分应辨清“之”作代词、结构助词还是取消句子独立性的助词，并保持原句主谓、修饰与语气关系，不以逐字拼接代替句意。","anaAI":true},{"t":"w","n":43,"stem":"⟪束兵刃於其角，而灌脂束葦於尾⟫","ans":"在牛角上绑上尖刀，并在牛尾系上浇灌过油脂的芦苇。","score":2,"ana":"“束兵刃于其角”是把兵刃绑在牛角上；“而”连接接续动作；“灌脂束苇于尾”省略施事，指把浸/灌油脂的芦苇绑在牛尾上。“于角/于尾”分别交代绑缚位置，译文应保留两处动作与部位。","anaAI":true},{"t":"w","n":44,"stem":"⟪燕軍擾亂奔走，齊人追亡逐北⟫","ans":"燕军被打乱阵脚拼命逃跑，齐军追逐败逃的燕军。","score":2,"ana":"“燕军扰乱奔走”写燕军阵势混乱、奔逃；“齐人”是追击者。“亡”“北”均指逃败的敌兵，“追亡逐北”是追逐败逃者，句中由燕军溃逃转到齐军追击。","anaAI":true},{"t":"w","n":45,"stem":"⟪田單兵日益多，乘勝，燕日敗亡⟫","ans":"田单的士兵一天天增多，凭借着胜利的势头，燕军一天天地败逃。","score":2,"ana":"“田单兵日益多”中“日”作状语，意为一天天，写田单军队不断增加；“乘胜”承接其乘着胜势进军；“燕日败亡”中的“日”同样表逐日，写燕军接连败退。","anaAI":true}]},{"title":"六、古文标点题","meta":"本大题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"河南樂羊子之妻者不知何氏之女也羊子嘗行路得遺金一餅還以與妻妻曰妾聞志士不飲盜泉之水廉者不受嗟來之食況拾遺求利以污其行乎羊子大慚乃捐金於野而遠尋師學一年來歸妻跪問其故羊子曰久行懷思無它異也妻乃引刀趨機而言曰此織生自蠶繭成於機杼一絲而累以至於寸寸累不已遂成丈匹今若斷斯織也則捐失成功稽廢時月夫子積學當日知其所亡以就懿德若中道而歸何異斷斯織乎羊子感其言復還終業遂七年不反","ans":"河南樂羊子之妻者，不知何氏之女也。羊子嘗行路，得遺金一餅，還以與妻。妻曰：“妾聞志士不飲盜泉之水，廉者不受嗟來之食。況拾遺求利，以污其行乎！”羊子大慚，乃捐金於野，而遠尋師學。一年來歸，妻跪問其故。羊子曰：“久行懷思，無它異也。”妻乃引刀趨機而言曰：“此織生自蠶繭，成於機杼，一絲而累，以至於寸；寸累不已，遂成丈匹。今若斷斯織也，則捐失成功，稽廢時月。夫子積學，當日知其所亡，以就懿德；若中道而歸，何異斷斯織乎？”羊子感其言，復還終業，遂七年不反。","score":12,"ana":"断句先按人物对话与叙事层次划分，再据主谓宾结构、虚词及语气确定句界；并列、对偶处保持节奏，对话引语用冒号和引号，疑问、感叹按语气分别用问号、叹号。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"景公飲酒⟪酣⟫，曰：‘今日願與諸大夫爲樂飲，請無爲禮。’晏子蹴然改⟪容⟫曰：‘君之言⟪過⟫矣！群臣固欲君之無禮也。力多足以勝其長，勇多足以弑君，而禮不使也。禽獸以力爲政，彊者犯弱，故日易主，今君⟪去⟫禮，則是禽獸也。群臣以力爲政，彊者犯弱，而日易主，君將⟪安⟫立矣！凡人之所以貴於禽獸者，以有禮也。故《詩》曰：‘人而無禮，⟪胡⟫不遄死？’禮不可無也。’公湎而不聽。少閒，公出，晏子不起；公入，不起；交舉則先飲。公怒，色變，抑手疾視曰：‘嚮者夫子之教寡人無禮之不可也，寡人出入不起，交舉則先飲，禮也？’晏子避席再拜稽首而請曰：‘嬰敢與君言而忘之乎？臣以致無禮之實也。君若欲無禮，此是已！’公曰：‘若是，孤之罪也。夫子就席，寡人聞命矣。’觴三行，遂罷酒。蓋是後也，⟪飭⟫法修禮以治國政，而百姓⟪肅⟫也。","score":20,"subs":[{"n":47,"stem":"酣：","ans":"喝得畅快","score":1,"grp":"解释文中加着重号词语的意义。（6分）","ana":"“酣”在句中意为“喝得畅快”。","anaAI":true},{"n":48,"stem":"容：","ans":"脸色","score":1,"ana":"“容”在句中意为“脸色”。","anaAI":true},{"n":49,"stem":"過：","ans":"错误","score":1,"ana":"“過”在句中意为“错误”。","anaAI":true},{"n":50,"stem":"去：","ans":"废弃","score":1,"ana":"“去”在句中意为“废弃”。","anaAI":true},{"n":51,"stem":"飭：","ans":"整顿","score":1,"ana":"“飭”在句中意为“整顿”。","anaAI":true},{"n":52,"stem":"肅：","ans":"恭敬","score":1,"ana":"“肅”在句中意为“恭敬”。","anaAI":true},{"n":53,"stem":"今日願與諸大夫爲樂飲，請無爲禮。","ans":"今天希望和诸位大夫痛快地喝酒，请不要拘泥礼节。","score":2,"grp":"将下列句子译成现代汉语。（6分）","ana":"“與”在句中是介词，意为“和、与”；全句表示今天希望和诸位大夫痛快地喝酒，请不要拘泥礼节。","anaAI":true},{"n":54,"stem":"力多足以勝其長，勇多足以弑君，而禮不使也。","ans":"力气大的人足以战胜尊长，勇猛的人足以杀害君主，但是礼不允许那样做。","score":2,"ana":"“而”在句中是连词，表示转折；全句意为力气大的人足以战胜尊长、勇猛的人足以杀害君主，但是礼不允许这样做。","anaAI":true},{"n":55,"stem":"嬰敢與君言而忘之乎？","ans":"晏婴我怎么敢对君王讲礼仪而自己却忘了礼仪呢？","score":2,"ana":"“之”在句中是代词，指礼仪；全句意为晏婴怎敢对君王讲礼仪而自己却忘了礼仪呢。","anaAI":true},{"n":56,"stem":"君將安立矣？安：","ans":"哪里。疑问代词，前置宾语。","score":2,"grp":"解释下列加着重号词在句中的词义，并说明词性与用法。（4分）","ana":"“安”是疑问代词，意为“哪里”，在“君將安立矣”中作前置宾语；可理解为“您将在哪里立足呢”。","anaAI":true},{"n":57,"stem":"胡不遄死？胡：","ans":"怎么，为什么。疑问代词，状语。","score":2,"ana":"“胡”是疑问代词，意为“为什么、怎么”，在“胡不遄死”中作状语，构成反问。","anaAI":true},{"n":58,"stem":"晏婴在饮酒时用什么具体行动使景公发怒？目的是什么？请用现代汉语陈述。（4分）","ans":"饮酒时，景公离席出门，晏婴不起身；景公进门，晏婴也不起身示礼。席间相互举杯，晏婴却先喝起来。晏婴用具体行动向景公展示了君臣间不讲礼仪的情景，目的是使景公明白施行礼制的必要。","score":4,"ana":"答案须概括晏婴 化字关系还是异体字关系，并说明理由。\n（1）初，宣子⟪田⟫（畋）于首山，舍于翳桑。\n（2）恐太后玉體之有所⟪郄⟫（隙）也，故願望見太后。","ans":"“畋”是“田”的分化字。“田”本义指田地，引申出田猎义，故在“田”上加义符“攴”，分化出“畋”字，承担田猎义。“郄”是“隙”的异体字；两字音义相同、记词职能相同，只是形体不同，此处均表示身体不舒服。","score":6,"ana":"得分要点是先逐例判定字际关系，再用音义、形体及记录职能说明依据；异体须音义和用字职能相同，分化字须指出新字分担的义项，通假则说明借同音字记录本词。","anaAI":true},{"t":"w","n":38,"stem":"解释下列\n（1）\n（2）\n（3）句中“發”的意义，并在\n（4）\n（5）\n（6）句加下划线的词中找出相应的同义词。\n（1）舜⟪發⟫于畎畝之中。\n（2）文王⟪發⟫政施仁，必先斯四者。\n（3）紅豆生南國，春來⟪發⟫幾枝。\n（4）制禮作樂，⟪頒⟫度量，而天下大服。\n（5）橘生淮南則爲橘，⟪生⟫於淮北則爲枳。\n（6）大楚⟪興⟫，陳勝王。","ans":"（1）兴起，同义词为（6）“兴”。（2）颁布，同义词为（4）“颁”。（3）生长，同义词为（5）“生”。","score":6,"ana":"“發”在（1）句中意为兴起，与（6）句的“興”同义；在（2）句中意为颁布，与（4）句的“頒”同义；在（3）句中意为生长，与（5）句的“生”同义。","anaAI":true},{"t":"w","n":39,"stem":"解释下列句中下划线词的意义，并说明判断其活用的依据。\n（1）七十者⟪衣⟫帛食肉，黎民不饥不寒。\n（2）置人所⟪罾⟫魚腹中。\n（3）二國有好，臣不與及，其誰敢⟪德⟫？\n（4）先破秦入咸陽者⟪王⟫之。","ans":"（1）衣：穿。名词“衣”与“帛”连用，构成动宾关系。（2）罾：用网捕。名词放在“所”字后面，活用为动词。（3）德：感恩。名词“德”前有能愿动词“敢”，活用为动词。（4）王：使……为王。名词后有代词“之”，构成动宾关系。","score":8,"ana":"得分要点是逐项写出词在语境中的实际意义、活用类别，并以句法位置说明依据（如带宾语、处于状语位或形成使动/意动关系）；只写现代译义不足以说明活用。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下段文章中画线的句子译成现代汉语。","passage":"⟪厲王虐，國人謗王⟫。召公告曰：‘民不堪命矣！’王怒，得衛巫，使監謗者。以告，則殺之。⟪國人莫敢言，道路以目⟫。王喜，告召公曰：‘吾能弭謗矣，乃不敢言。’召公曰：‘是障之也。⟪防民之口，甚於防川⟫。川壅而潰，傷人必多，民亦如之。⟪是故為川者決之使導⟫，為民者宣之使言。……民之有口，猶土之有山川也，財用於是乎出；猶其有原、隰、衍、沃也，衣食於是乎生。口之宣言也，善敗於是乎興。⟪行善而備敗，其所以阜財用衣食者也⟫。夫民慮之於心而宣之於口，成而行之，胡可壅也？⟪若壅其口，其與能幾何⟫？’","items":[{"t":"w","n":40,"stem":"⟪厲王虐，國人謗王⟫","ans":"厉王残暴，国都的人批评论议厉王。","score":2,"ana":"“厉王”指周厉王，“虐”是暴虐；“国人”是国都中的人，“谤王”是批评、指责国君。句子陈述统治者暴虐导致都城民众议论他，后文才写厉王禁止批评。","anaAI":true},{"t":"w","n":41,"stem":"⟪國人莫敢言，道路以目⟫","ans":"国都的人没有谁敢说话，在道路上用目光示意。","score":2,"ana":"“莫敢”是没有人敢；“道路”指在路上，“以目”是用眼神相示。全句写人们不敢公开说话，只能在路上以目光交流，突出禁言后的恐惧。","anaAI":true},{"t":"w","n":42,"stem":"⟪防民之口，甚於防川⟫","ans":"堵塞民众的言路，后果比堵塞河流还严重。","score":2,"ana":"翻译得分应辨清“之”作代词、结构助词还是取消句子独立性的助词，并保持原句主谓、修饰与语气关系，不以逐字拼接代替句意。","anaAI":true},{"t":"w","n":43,"stem":"⟪是故為川者決之使導⟫","ans":"因此治水的人疏通河道使它通畅。","score":2,"ana":"翻译得分应辨清“之”作代词、结构助词还是取消句子独立性的助词，并保持原句主谓、修饰与语气关系，不以逐字拼接代替句意。","anaAI":true},{"t":"w","n":44,"stem":"⟪行善而 ","ans":"（1）（3）是通假关系；（2）（4）是异体关系。读音和意义完全相同，只是形体不同的字为异体关系。“罋”与“瓮”、“迺”与“乃”音义完全相同，记词职能完全一样，形体不同，是异体关系。读音相同或相近、意义不同，在使用中可以通用的字为通假关系。“庭”和“廷”、“伯”和“霸”读音相同，形体、意义不同，借“庭”记录“廷”，借“伯”记录“霸”，二者是通假关系。","score":6,"ana":"（1）（3）是通假，（2）（4）是异体。异体字音、义和记录职能相同而形体不同，如“罋—瓮”“迺—乃”；通假字则借音同或音近字记录另一个词，如“庭”借记“廷”、“伯”借记“霸”。判别关键是原字在该语境是否仍用本义、两字是否承担同一词的记录功能。","anaAI":true},{"t":"w","n":38,"stem":"根据下列材料，指出“飢”“餓”的词义及二者词义差异的类型，说明辨析同义词的方法。\n（1）人情，一日不再食則飢。\n（2）宣子田於首山，舍于翳桑，見靈輒餓，問其病。曰：“不食三日矣。”\n（3）家有常業，雖飢不餓。\n（4）寧一月飢，無一旬餓。","ans":"“飢”是吃不饱，腹中空；“餓”是严重的饿，指没有饭吃或长时间未进食。词义差异类型：程度轻重不同（理性意义的差异）。辨析方法：比较法（语言环境分析法）。","score":6,"ana":"“飢”是腹中空、吃不饱，“餓”在材料中指较长时间无食、程度更重；“虽飢不餓”“宁一月飢，无一旬餓”以对举显示轻重差别，属于理性意义的程度差异。辨析要比较不同语境中的搭配和对举，而非只看现代习惯。","anaAI":true},{"t":"w","n":39,"stem":"指出下列句中用作动词的形容词，解释其意义，并说明判断其活用的依据。\n（1）夫徒處而致利，安坐而廣地。\n（2）欲潔其身，而亂大倫。\n（3）君聞而賢之。\n（4）世之所高，莫若黄帝。","ans":"（1）廣：使……扩大。形容词后面加名词，且不能构成修饰关系，一般活用为动词；“廣”后有名词“地”，且未构成修饰关系。（2）潔：使……洁净、廉洁。形容词前有能愿动词，一般活用为动词；“潔”前有能愿动词“欲”。（3）賢：认为……贤能。形容词后面加代词，一般活用为动词；“賢”后有代词“之”。（4）高：认为高，看重、尊崇。形容词放在“所”的后面，一般活用为动词；“高”在“所”字后。","score":8,"ana":"四例均为形容词活用作动词，判断要看句法位置和语义角色：（1）“廣地”使地广大；（2）“欲潔其身”中“欲”后接“潔”，意为使自身洁净；（3）“賢之”是认为他贤能，形容词后带代词宾语；（4）“所高”是所尊崇者，“所”后形容词动用。得分点应逐例说明活用义及结构证据。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下段文章中画线的句子译成现代汉语。","passage":"王送知罃，曰：“子其怨我乎？”對曰：“二國治戎，臣不才，不勝其任，以爲俘馘。執事不以衅鼓，⟪使歸即戮⟫，君之惠也。臣實不才，又誰敢怨？”王曰：“⟪然則德我乎⟫？”對曰：“⟪二國圖其社稷，而求紓其民⟫，⟪各懲其忿以相宥也⟫。兩釋累囚以成其好。二國有好，臣不與及，其誰敢德？”王曰：“子歸，何以報我？”對曰：“臣不任受怨，君亦不任受德，無怨無德，不知所報。”王曰：“雖然，必告不穀。”對曰：“以君之靈，累臣得歸骨於晉，寡君之以爲戮，死且不朽。若從君之惠而免之，以賜君之外臣首，首其請於寡君，而以戮於宗，亦死且不朽。若不獲命，而使嗣宗職，⟪次及於事，而帥偏師以脩封疆⟫。雖遇執事，其弗敢違，其竭力致死，無有二心，以盡臣禮，所以報也。”王曰：“營未可與爭。”⟪重爲之禮而歸之⟫。","items":[{"t":"w","n":40,"stem":"⟪使歸即戮⟫","ans":"让我回国受死（或者：让我回国就死）。","score":2,"ana":"“使归即戮”中“使”是让，“归”是回国，“即戮”是就死、受刑；译文需保留“让俘虏回国受死”的使令关系。","anaAI":true},{"t":"w","n":41,"stem":"⟪然則德我乎⟫","ans":"既然如此，那么感激我吗？","score":2,"ana":"“然则”承接上文“二国治戎……以为俘馘”，推出“既然这样”的判断；“德我”是把我当作施恩者、感激我，故译为既然如此，感激我吗。","anaAI":true},{"t":"w","n":42,"stem":"⟪二國圖其社稷，而求紓其民⟫","ans":"两国各为自己的国家谋划，希望缓和百姓的痛苦。","score":2,"ana":"“二国”分别为晋、楚，“图其社稷”是为各自国家谋划，“紓其民”是使本国百姓的困苦得到缓解；译句要体现两个并列目的。","anaAI":true},{"t":"w","n":43,"stem":"⟪各懲其忿以相宥也⟫","ans":"各自克制自己的怨恨来互相谅解。","score":2,"ana":"“懲其忿”是克制自己的愤怒，“以”表目的或方式，“相宥”是互相宽宥、谅解；重点在两国各自收敛怨忿以停止相攻。","anaAI":true},{"t":"w","n":44,"stem":"⟪次及於事，而帥偏師以脩封疆⟫","ans":"按照顺序轮到我担任军事职务，率领军队保卫边疆。","score":2,"ana":"“次及於事”指按次序轮到承担职事，“帥偏師”是率领一支偏师，“脩封疆”是守护、修整边境；翻译需呈现知罃将来履职报国的条件。","anaAI":true},{"t":"w","n":45,"stem":"⟪重爲之禮而歸之⟫","ans":"很隆重地给他举行了礼仪，把他送回去了。","score":2,"ana":"“重”作程度副词，意为郑重、隆重；“为之礼”是为知罃举行礼遇，“归之”是送他回国。应译出礼遇和送归两个连续动作。","anaAI":true}]},{"title":"六、古文标点题","meta":"本大题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"太史公曰詩有之高山仰止景行行止雖不能至然心嚮往之余讀孔氏書想見其為人適魯觀仲尼廟堂車服禮器諸生以時習禮其家余低回留之不能去云天下君王至於賢人眾矣當時則榮沒則已焉孔子布衣傳十餘世學者宗之自天子王侯中國言六藝者折中於夫子可謂至聖矣","ans":"太史公曰：“《詩》有之：‘高山仰止，景行行止。’雖不能至，然心嚮往之。余讀孔氏書，想見其為人。適魯，觀仲尼廟堂、車服、禮器，諸生以時習禮其家，余低回留之不能去云。天下君王至於賢人眾矣，當時則榮，沒則已焉。孔子布衣，傳十餘世，學者宗之。自天子王侯，中國言六藝者折中於夫子，可謂至聖矣！","score":12,"ana":"本题句读以太史公叙述层次为线索：“太史公曰”“余读孔氏书”“适鲁观仲尼庙堂”为连续叙事，诗句和孔子言行分别用引号标出；“当时则荣，没则已焉”是对举分句。现存参考标点中“诸生以时习礼其家”的“其家”指代和断法建议核对原卷/可靠校本，解析不把该疑点当作唯一句读依据。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"楚有士申鳴者，在家而養其父，孝聞於楚國。王欲授之相，申鳴辭不受。其父曰：“王欲⟪相⟫汝，汝何不受乎？”申鳴對曰：“⟪舍⟫父之孝子而爲王之忠臣，何也？”其父曰：“使有祿於國，立義於庭，汝樂，吾無憂矣。吾欲汝之相也。”申鳴曰：“諾。”遂入朝，楚王因授之相。居三年，白公爲亂，殺司馬子期，申鳴將往⟪死⟫之。父止之曰：“棄父而死，其可乎？”申鳴曰：“聞夫仕者，身歸於君而祿歸於親。今既去父事君，得無死其難乎？”遂辭而往，因以兵圍之。白公謂石乞曰：“申鳴者，天下之勇士也，今以兵圍我，吾焉之奈何？”石乞曰：“申鳴者，天下之孝子也，往劫其父以兵。申鳴聞之必來，因與之語。”白公曰：“善。”則往取其父，持之以兵。告申鳴曰：“子與吾，吾與子分楚國；子不與吾，子父則死矣。”申鳴流⟪涕⟫而應之曰：“始吾父之孝子也，今吾君之忠臣也。吾聞之也，食其食者死其事，受其祿者畢其能，今吾已不得爲父之孝子矣，乃君之忠臣也，吾何得以⟪全⟫身。”⟪援⟫桴鼓之，遂殺白公，其父亦死。","score":20,"subs":[{"n":47,"grp":"（一）解释文中下划线词语的意义。（4分）","stem":"王欲相汝，汝何不受乎？相：","ans":"使……为相","score":1,"ana":"“相”在“王欲相汝”中作使动动词，意为使你为相、任命你为相；“汝何不受”中的“受”承接任命。名词“相”在这里转作动词。","anaAI":true},{"n":48,"stem":"舍父之孝子而爲王之忠臣。舍：","ans":"放弃","score":1,"ana":"“舍父之孝子”是舍弃作为父亲孝子的身份/责任；“舍”作动词“放弃”，与下文转而为王尽忠相对。","anaAI":true},{"n":49,"stem":"申鳴流涕而應之。涕：","ans":"眼泪","score":1,"ana":"“流涕”中的“涕”是眼泪，名词；古义与现代常说“鼻涕”不同，语境中“流涕而应”是流泪回应。","anaAI":true},{"n":50,"stem":"援桴鼓之。援：","ans":"拿起，拿过来","score":1,"ana":"“援桴鼓之”中“援”是拿起、持取，宾语“桴”是击鼓槌；拿起鼓槌击鼓发令，故不能解作援助。","anaAI":true},{"n":51,"grp":"（二）说明下列句中下划线部分的用法及意义。（6分）","stem":"楚王因授之相。授之相：","ans":"双宾语句；授给他相位。","score":2,"ana":"“授之相”中“授”带两个宾语：“之”指申鸣，“相”指相位，意为授给他相位，是双宾语结构；指出对象和所授之物即可说明结构。","anaAI":true},{"n":52,"stem":"申鳴將往死之。死：","ans":"动词为动用法；为……而死。","score":2,"ana":"“死之”不是一般的“杀死他”，而是为白公之乱/君臣之义而死；“死”带所为对象，作动词为动用法，译为为此而死。","anaAI":true},{"n":53,"stem":"吾何得以全身。全：","ans":"形容词的使动用法；使……保全。","score":2,"ana":"“全身”中“全”本为形容词“完整”，带宾语“身”后作使动，意思是使自身保全；“何得以”表示反问，说明申鸣认为不能只求自全。","anaAI":true},{"n":54,"grp":"（三）根据文中的意思，用自己的话简要回答下列问题。（每小题5分，共10分）","stem":"申鸣为什么不听父亲劝告，率兵包围白公？","ans":"申鸣认为，做官的人从任职时起，身体性命就归属于君王，俸禄归属于父母；既已离开父亲侍奉君王，就应为君王的危难而死，因此率兵包围白公。","score":5,"ana":"申鸣不听劝，是因其把出仕理解为身命归君、俸禄归亲；既已受君任用，白公作乱危及君国，就有为君赴难的责任。答题要连起“仕者—身归君—死其难”的因果链。","anaAI":true},{"n":55,"stem":"申鸣为什么不顾父亲的生死而进攻白公？","ans":"申鸣认为自己起初是父亲的孝子，如今已是君王的忠臣；享用君王俸禄就应为君王之事效死尽力，因此全力进攻白公。","score":5,"ana":"他不顾父亲被挟持仍进攻，是因为认为自己已从父亲的孝子转为君王的忠臣，受君禄便应尽职效死；“食其食者死其事”概括了他的忠义逻辑。可得分点为身份转变、受禄责任和进攻决定。","anaAI":true}]}]}]},{"paper":"gdhy-2410","subject":"gdhy","session":"2410","label":"2024年10月","code":"00536","qaNotes":["Q44原句在翻译段出现两次，原卷只对首次出现处加下划线；网页现只标第一处并在题干显式显示。"],"sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"下列各组字，全部是象形字的一组是（ ）","opts":["豆戶弓","羊沐采","鹿右床","犬頁塵"],"ans":"A","score":1,"ana":"答案A。“豆、戶、弓”都可从物体形状描摹理解为象形字。B“沐”形声、“采”有会意结构；C“床”形声；D“頁”“塵”等并非全为象形，因此只有A全符合。","anaAI":true},{"t":"s","n":2,"stem":"《说文解字》字头主要依据的汉字形体是（ ）","opts":["甲骨文","金文","小篆","隸書"],"ans":"C","score":1,"ana":"《说文解字》以小篆为字头，故选C。甲骨文、金文虽是更早古文字，隶书是后起字体，都不是该书字头主要依据。","anaAI":true},{"t":"s","n":3,"stem":"下列各组字，属于通假字关系的一组是（ ）","opts":["妝－粧","螞－蚂","然－燃","信－伸"],"ans":"D","score":1,"ana":"“信—伸”在古书中可借“信”记录“伸展”之“伸”，音近而字义职能不同，属通假关系。妝—粧、螞—蚂、猿—蝯分别是异体或繁简字形关系，并非通假。","anaAI":true},{"t":"s","n":4,"stem":"下列各组字，属于异体字关系的一组是（ ）","opts":["振－震","溪－谿","昏－婚","被－披"],"ans":"B","score":1,"ana":"“溪—谿”在古代可记录同一词，音义相同而字形有异，属异体字。振—震、昏—婚、被—披各有词义分化或通假用法，不是单纯异体。 "score":1,"ana":"“老於西河之上”中“於”引出隐居、养老的处所西河，介词。","anaAI":true},{"t":"w","n":35,"stem":"妾是⟪以⟫求去也。以：","ans":"介词，引进原因。","score":1,"ana":"“是以求去”中“以”承接原因，可理解为“因此”；就词性而言是介词，引进“求去”的原因。","anaAI":true},{"t":"w","n":36,"stem":"天下皆知美之爲美，⟪斯⟫惡已。斯：","ans":"连词，相当于“则”。连接条件复句中的两个分句。","score":1,"ana":"“美之为美，斯恶已”中“斯”承前表示那么、就，连接条件/前提与结果“恶已”，相当于“则”。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共3小题，共20分。","items":[{"t":"w","n":37,"stem":"指出下列句中加下划线的字与括号中的字是分化字关系还是异体字关系，并说明理由。\n（1）秦滅韓亡魏，而君以五十里之地存者，以君爲長者，故不⟪錯⟫（措）意也。\n（2）文倦於事，慣於憂，而性⟪懧⟫（懦）愚，沈於國家之事，開罪於先生。\n（3）苟虧人愈多，其不仁⟪兹⟫（滋）甚矣。\n（4）愛我哉！忘其口味以⟪啗⟫（啖）寡人。","ans":"（1）（3）是分化字关系；分化字读音相同或相近，一个字分担了另一个字多个意义职能的一个，二者为分化关系。“措”分担了“錯”的“放置”的职能，“滋”分担了“兹”“更加”的职能，是分化字。（2）（4）是异体字关系；异体字音义完全相同，记词职能也完全一样，只是形体不同。“懧”和“懦”、“啗”和“啖”音义完全相同、记词职能完全一样，形体不同，是异体字关系。","score":6,"ana":"（1）（3）为分化字，（2）（4）为异体字。分化字是从一个源字分出新字承担其部分义项，如“錯”分出“措”记录放置义，“兹”分出“滋”记录更加义；异体字音义及记词功能相同而形体异，如懧/懦、啗/啖。判断应核对语境义是否已由另一字专记，而非只看字形近似。","anaAI":true},{"t":"w","n":38,"stem":"解释下列句中加下划线词的意义，指出该意义是本义还是引申义，并据以归纳引申义与本义的联系类型。\n（1）臧紇斬鹿門之⟪關⟫以出。關：\n（2）故遣將守⟪關⟫者，備他盜出入與非常也。關：","ans":"（1）门闩，本义；（2）关卡，引申义；联系类型：（2）和（1）是相似关系。","score":6,"ana":"（1）“關”指门闩，是本义；（2）“關”指关卡，是门闩控制出入的功能引申到关口。两义由阻隔、控制通行的功能相似而联系，属相似关系；答题应指出两句义项后再归类。","anaAI":true},{"t":"w","n":39,"stem":"根据下列句子归纳古代汉语被动句式类型，并将句子序号归入相应类型中。\n（1）夫惑於似士者而失於真士，此黎丘丈人之智也。\n（2）言公不能用子家，所以見辱。\n（3）父母宗族，皆爲戮沒。\n（4）古今兄弟被侵，必攻者，廉也。\n（5）吾長見笑於大方之家。\n（6）方術不用，爲人所疑。","ans":"古代汉语的被动句式主要有四种：（一）“于”字句：用介词“于”引进行为的主动者的被动句式，如（1）。（二）“见”字句：助动词“见”用在动词前表示被动，如（2）；“见……于……”式，如（5）。（三）“为”字句：用介词“为”引进动作行为主动者的句式，有时省略行为主动者，如（3）；“为……所……”式，如（6）。（四）“被”字句：助动词“被”用在动词前表示被动，如（4）。","score":8,"ana":"被动式可按标志归类：（1）“於”字句，“惑於”“失於”引施事；（2）“見辱”为“见”字被动；（3）“為戮沒”为“为”字被动，施事可省；（4）“被侵”为“被”字句；（5）“見笑於……”兼有“见……于……”形式；（6）“為人所疑”为“为……所……”式。得分关键是每类名称、句号和标志说明。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线句子译成现代汉语。","passage":"左師觸龍言願見太后。太后盛氣而胥之。入而徐趨，至而自謝，曰：“老臣病足，曾不能疾走，不得見久矣，竊自恕，而恐太后玉體之有所郄也，故願望見太后。”太后曰：“老婦恃輦而行。”曰：“日食飲得無衰乎？”曰：“恃鬻耳。”曰：“老臣今者殊不欲食，乃自強步，日三四里，少益耆食，和於身也。”太后曰：“老婦不能。”太后之色少解。左師公曰：“老臣賤息舒祺，最少，不肖。而臣衰，竊愛憐之。⟪願及未填溝壑而託之⟫。”太后曰：“敬諾。年幾何矣？”對曰：“十五歲矣。雖少，願及未填溝壑而託之。”太后曰：“丈夫亦愛憐其少子乎？”對曰：“甚於婦人。”太后笑曰：“婦人異甚。”對曰：“老臣竊以爲媼之愛燕后賢於長安君。”曰：“君過矣，不若長安君之甚。”","items":[{"t":"w","n":40,"stem":"⟪太后盛氣而胥之⟫","ans":"太后怒气冲冲地等待着他。","score":2,"ana":"“盛氣而胥之”中“胥”是等待，“盛气”作状语写太后带着怒气；“之”指触龙。译文既要有“怒气冲冲”，也要交代等待来见者。","anaAI":true},{"t":"w","n":41,"stem":"⟪日食飲得無衰乎⟫","ans":"每天的吃喝该不会减少吧？","score":2,"ana":"“日食飲”是每天的饮食，“得無……乎”是委婉推测问句，意为该不会……吧；“衰”指减少、衰退。","anaAI":true},{"t":"w","n":42,"stem":"⟪少益耆食⟫","ans":"稍微渐渐地爱吃东西了。","score":2,"ana":"“少”作稍微，“益”是渐渐、更加，“耆食”是喜好吃食；合译为食欲稍有增加、渐渐爱吃，注意并非“年少”。","anaAI":true},{"t":"w","n":43,"stem":"⟪老臣賤息舒祺，最少，不肖⟫","ans":"老臣的儿子舒祺，年龄最小，不成材。","score":2,"ana":"“賤息”是谦称自己的儿子，“最少”指年纪最小，“不肖”指不成材；翻译保留赵太后对话语境中的自谦。","anaAI":true},{"t":"w","n":44,"stem":"⟪願及未填溝壑而託之⟫","ans":"希望趁着自己还没有去世把他托付给您。","score":2,"ana":"“及”是趁着，“填沟壑”是死亡的委婉说法，“託之”是把儿子托付给太后；句子提出趁自己尚在时安排舒祺。","anaAI":true},{"t":"w","n":45,"stem":"⟪君過矣，不若長安君之甚⟫","ans":"您错了，比不上爱长安君那样厉害。","score":2,"ana":"“君過矣”是您错了；“不若……之甚”说您爱长安君没有爱燕后那样深。需结合前文比较太后对两个子女的爱，不要将“甚”误解为“过分”。","anaAI":true}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"晏子使吳吳王謂行人曰吾聞晏嬰蓋北方辯于辭習于禮者也命儐者曰客見則稱天子請見明日晏子有事行人曰天子請見晏子蹴然行人又曰天子請見晏子蹴然又曰天子請見晏子蹴然者三曰臣受命弊邑之君將使于吳王之所以不敏而迷惑入于天子之朝敢問吳王惡乎存然後吳王曰夫差請見見之以諸侯之禮","ans":"晏子使吳，吳王謂行人曰：“吾聞晏嬰，蓋北方辯于辭、習于禮者也。命儐者曰：‘客見則稱天子請見。’”明日，晏子有事，行人曰：“天子請見。”晏子蹴然。行人又曰：“天子請見。”晏子蹴然。又曰：“天子請見。”晏子蹴然者三，曰：“臣受命弊邑之君，將使于吳王之所，以不敏而迷惑，入于天子之朝，敢問吳王惡乎存？”然後吳王曰：“夫差請見。”見之以諸侯之禮。","score":12,"ana":"“晏子使吳”交代出使，逗号后转入吴王吩咐行人的直接引语；“蓋……者也”是判断句。行人传话须三次分段，每次晏子“蹴然”回应，故逐次标点。第三次后“蹴然者三”总结次数，再引晏子的话；其“入于天子之朝，敢问吳王惡乎存”是反问吴王所在何处，末尾用问号。吴王回答并以诸侯礼接见，动作另断。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共11小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"晉文公將與楚人戰，召舅犯問之，曰：“⟪吾將與楚人戰，彼衆我寡，爲之奈何⟫？”舅犯曰：“臣聞之：繁禮君子，不⟪厭⟫忠信；戰陣之間，不⟪厭⟫詐僞。君其詐之而已矣。”文公辭舅犯，因召雍季而問之，曰：“我將與楚人戰，彼衆我寡，爲之奈何？”雍季對曰：“焚林而⟪田⟫，偷取多獸，後必無獸；以⟪詐⟫遇民，偷取一時，後必無⟪復⟫。”文公曰：“善。”⟪辭雍季，以舅犯之謀與楚人戰以敗之⟫。歸而行爵，先雍季而後舅犯。群臣曰：“城濮之事，舅犯謀也。夫用其言而⟪後⟫其身，可乎？”文公曰：“此非⟪若⟫所知也。⟪夫⟫舅犯言，一時之權也；雍季言，萬世之利也。”仲尼聞之，曰：“文公之霸也，宜哉！⟪既⟫知一時之權，又知萬世之利。”","score":20,"subs":[{"n":47,"grp":"（一）解释文中加下划线的词。（6分）","stem":"⟪厭⟫：","ans":"满足","score":1,"ana":"“厭”在“繁礼君子不厌忠信”中指满足，意思是讲究礼法的君子不以忠信为满足；古义不是厌恶。","anaAI":true},{"n":48,"stem":"⟪詐⟫：","ans":"欺骗","score":1,"ana":"“詐”在“以诈遇民”中指欺骗、用诈术对待百姓；语义由名词诈术转为行为方式。","anaAI":true},{"n":49,"stem":"⟪復⟫：","ans":"再一次","score":1,"ana":"“後必無復”中“復”作副词/动词，表示再、再次，谓以后不会再有收获。","anaAI":true},{"n":50,"stem":"⟪若⟫：","ans":"你们","score":1,"ana":"“若所知”是“你们所知道的”，“若”在此为第二人称代词，复数语境指群臣。","anaAI":true},{"n":51,"stem":"⟪夫⟫：","ans":"句首语气词，表示要发表议论","score":1,"ana":"“夫舅犯言”中“夫”位于句首，引出议论或判断，属于发语语气词，不是名词“丈夫”。","anaAI":true},{"n":52,"stem":"⟪既⟫：","ans":"已经","score":1,"ana":"“既知一时之权”中“既”表示已经，说明晋文公既明白权宜之计，也明白长远利益。","anaAI":true},{"n":53,"grp":"（二）说明下列句中加下划线词的词性或用法，解释其在句中的词义。（4分）","stem":"焚林而⟪田⟫。田：","ans":"动词，打猎。","score":2,"ana":"“焚林而田”中“田”由名词田地引申作动词，意为打猎；“而”连接焚林与打猎两个动作。","anaAI":true},{"n":54,"stem":"夫用其言而⟪後⟫其身。後：","ans":"名词，使动用法，使他在后。","score":2,"ana":"“後其身”中的“後”本为名词/方位义，作使动，意为使自己居后、把自己的赏位排在后面；与先雍季的安排相应。","anaAI":true},{"n":55,"grp":"（三）将文中画线的句子译成现代汉语。（4分）","stem":"⟪吾將與楚人戰，彼衆我寡，爲之奈何⟫","ans":"我们将和楚人作战，他们人多，我们人少，怎么应对呢？","score":2,"ana":"“吾将与楚人战，彼众我寡，为之奈何”是晋文公向舅犯征询战策：“我们要同楚国交战，对方人多我方人少，该怎么办？”需译出众寡对比和疑问。","anaAI":true},{"n":56,"stem":"⟪辭雍季，以舅犯之謀與楚人戰以敗之⟫","ans":"辞谢了雍季，用舅犯的计策和楚人交战而打败了他们。","score":2,"ana":"“辞雍季”是辞别/辞谢雍季，“以舅犯之谋”是采用舅犯的谋略，“与楚人战以败之”是和楚交战并打败楚军。句子包含先后动作及“以”表凭借/采用。","anaAI":true},{"n":57,"grp":"（四）","stem":"舅犯和雍季给晋文公所出计策有何不同？晋文公是如何做的？他这么做的理由是什么？请用现代汉语陈述。（6分）","ans":"舅犯提出可以谎报人数，不让百姓和士兵知道实情；雍季认为不可以欺骗百姓。晋文公采用了舅犯的计策作战，但行赏时让雍季位在舅犯前。晋文公认为舅犯的计策是一时的权变，雍季的建言关乎万世的利益。","score":6,"ana":"回答应分三层：舅犯主张以诈术应对、雍季强调欺诈只能取一时之利；晋文公实际作战采纳舅犯方案，却在行赏时把雍季列前；理由是一时权变与万世利益轻重不同。不能只复述谁先谁后。","anaAI":true}]}]}]},{"paper":"gdhy-2504","subject":"gdhy","session":"2504","label":"2025年4月","code":"00536","qaNotes":["已对照2025-04原卷扫描补标选择题Q5、Q6、Q8、Q9、Q11、Q18可辨认的下划线范围；其余题目维持已录标记。Q37(1)目标有版面/字形疑义，未擅自补标。","按原卷第13页补标Q11四选项的释义目标；Q5/Q6/Q8/Q9/Q18已按扫描补标可见下划线。主观Q37-Q39页面低清，个别目标线不能稳定辨认，未用答案反推标记。"],"sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"s 两义联系为动静关系：竹节表现分节状态，节用则施加节制动作。","anaAI":true},{"t":"w","n":39,"stem":"指出下列句中加下划线的词哪些是使动用法，哪些是意动用法，并据以归纳二者的不同。（8分）\n（1）凡用兵之法，全國爲上。\n（2）孔子登東山而小魯。\n（3）下義其罪，上賞其姦。\n（4）亞父受玉斗，置之地，拔劍撞而破之。\n（5）故人不獨親其親，不獨子其子。\n（6）制海內，子元元。","ans":"（1）全：形容词使动用法。（2）小：形容词意动用法。（3）義：名词意动用法。（4）破：形容词使动用法。（5）親：名词意动用法。（6）子：名词使动用法。使动用法是主语使宾语做什么、怎么样或成为什么；意动用法则是主语主观上认为宾语怎么样或是什么。","score":8,"ana":"使动义是主语使宾语成为某状态或做某事，意动义是主语主观认为宾语如何：（1）全國，使国家完整，形容词使动；（2）小鲁，认为鲁国小，形容词意动；（3）義其罪、賞其姦，以……为义/可赏，名词意动；（4）破之，使之破，形容词使动；（5）親其親、子其子，以亲爱/子待之，名词意动；（6）子元元，使百姓如子女，名词使动。回答要逐项分类并给出“使……/认为……”释义。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线的句子译成现代汉语。","passage":"昔者晉獻公欲假道於虞以伐虢，荀息曰：‘君其以垂棘之璧與屈產之乘賂虞公，求假道焉，必假我道。’君曰：‘垂棘之璧，吾先君之寶也；屈產之乘，寡人之駿馬也。⟪若受吾幣不假之道，將奈何⟫？’荀息曰：‘彼不假我道，必不敢受我幣。若受我幣而假我道，則是寶猶取之內府而藏之外府也，馬猶取之內廄而著之外廄也，君勿憂。’君曰：‘諾。’乃使荀息以垂棘之璧與屈產之乘賂虞公而求假道焉。⟪虞公貪利其璧與馬而欲許之⟫。宮之奇諫曰：‘不可許。夫⟪虞之有虢也，如車之有輔⟫。輔依車，車亦依輔。虞虢之勢正是也。若假之道，則虢朝亡而虞夕從之矣。不可，願勿許。’虞公弗聽，遂假之道。荀息伐虢而還，反處三年，興兵伐虞，又剋之。荀息牽馬操璧而報獻公。獻公說，曰：‘璧則猶是也。雖然，⟪馬齒亦益長矣⟫。’⟪故虞公之兵殆而地削者何也⟫？愛小利而不慮其害。故曰：‘⟪顧小利則大利之殘也⟫。’","items":[{"t":"w","n":40,"stem":"⟪若受吾幣不假之道，將奈何⟫","ans":"假如他接受了我们的礼物又不借给道路，怎么办？","score":2,"ana":"“若”引假设条件，“受吾币”接受礼物，“不假之道”不借给我们道路；“将奈何”问将怎么办。译文须体现条件与反问式忧虑。","anaAI":true},{"t":"w","n":41,"stem":"⟪虞公貪利其璧與馬而欲許之⟫","ans":"虞公贪得宝玉和骏马的小利，打算答应借路。","score":2,"ana":"“贪利其璧与马”指贪图璧和马带来的利益，“欲许之”是打算答应借道；要看出虞公只顾眼前财物，未计借道后果。","anaAI":true},{"t":"w","n":42,"stem":"⟪虞之有虢也，如車之有輔⟫","ans":"虞国有虢国，就好像车有牙床外边的面颊。","score":2,"ana":"“輔”是车两旁夹持车毂的辅木，古代车的辅助结构；句子以车有辅木作比，说明虞国与虢国相互依存。答案所录“牙床外边的面颊”释义不常见，可能是转录/释义有误，待核教材或原卷；本解析不改原答案。","anaAI":true},{"t":"w","n":43,"stem":"⟪馬齒亦益長矣⟫","ans":"马也长了几岁。","score":2,"ana":"“马齿”借指马的年龄，“益长”是又增长了；晋献公以马虽归还却老了几岁作俏皮话，译为马也长了几岁。","anaAI":true},{"t":"w","n":44,"stem":"⟪故虞公之兵殆而地削者何也⟫","ans":"那么虞公兵败地削的原因是什么呢？","score":2,"ana":"“兵殆”指军队危败，“地削”是土地被削减；句中“者何也”提出原因，承接虞国败亡的结果。","anaAI":true},{"t":"w","n":45,"stem":"⟪顧小利則大利之殘也⟫","ans":"贪图小利就是对大利的危害。","score":2,"ana":"“顾”是只顾、贪图，“残”是损害；句子说明只盯眼前小利会损伤更大的利益，体现全文的利害权衡。","anaAI":true}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"今爾出於崖涘觀於大海乃知爾醜爾將可與語大理矣天下之水莫大於海萬川歸之不知何時止而不盈尾閭泄之不知何時已而不虛春秋不變水旱不知此其過江河之流不可爲量數而吾未嘗以此自多者自以比形於天地而受氣於陰陽吾在天地之間猶小石小木之在大山也方存乎見少又奚以自多","ans":"今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。天下之水，莫大於海，萬川歸之，不知何時止而不盈；尾閭泄之，不知何時已而不虛。春秋不變，水旱不知。此其過江河之流，不可爲量數。而吾未嘗以此自多者，自以比形於天地而受氣於陰陽，吾在天地之間，猶小石小木之在大山也。方存乎見少，又奚以自多！","score":12,"ana":"“今尔出於崖涘，观於大海，乃知尔醜”按动作次序先写河伯出河岸看海，再得出认识；“爾將可與語大理矣”转为判断。随后“天下之水莫大於海”总说海之大，两组“不知何时……而不……”用分号对应；“春秋不变，水旱不知”说明海水不因时令和旱涝改变。下文由“此其过江河之流”转入河伯自述，并以“又奚以自多”反问收束。标点依据是分句对举、主语转换和问句语气。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共11小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"晉文公曰：‘吾⟪弛⟫關市之徵而緩刑罰，其足以戰民乎？’狐子曰：‘不足。’曰：‘⟪然則⟫何如足以戰民乎？’狐子對曰：‘令無得不戰。’公曰：‘無得不戰奈何？’狐子對曰：‘信賞必罰，其足以戰。’公曰：‘刑罰之極⟪安⟫至？’對曰：‘不⟪辟⟫親貴，法行所愛。’文公曰：‘善。’明日令田于圃陸，期以日中爲期，後期者行軍法焉。於是公有所愛者曰顛頡，後期，吏請其罪，文公隕⟪涕⟫而憂。吏曰：‘請用事焉。’遂斬顛頡之脊以徇百姓，以明法之信也。而後百姓皆懼曰：‘君於顛頡之貴重如彼甚也，而君猶行法焉，況于我則何有矣。’文公見民之可戰也，於是遂興兵伐原，⟪克⟫之；伐衛，⟪東⟫其畝，取五鹿；攻陽，勝虢；伐曹；南圉鄭，反之陴；罷宋圉；還與荆人戰城濮，大敗荆人；返爲踐土之盟，遂成衡雍之義。一舉而八有功。所以然者，無他故異物，從狐偃之謀，⟪假⟫顛頡之脊也。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加下划线的词。（6分）","stem":"然則：","ans":"这样，那么","score":1,"ana":"“然则”承接前文的因果与推论，意为“既然这样，那么”；在“然则何如足以战民乎”中引出进一步设问。","anaAI":true},{"n":48,"stem":"安：","ans":"哪里","score":1,"ana":"“安”作疑问代词，意为“哪里、到什么程度”，作“至”的处所/范围成分；句意是刑罚最严能到何种程度。","anaAI":true},{"n":49,"stem":"辟：","ans":"避开","score":1,"ana":"“辟”通“避”，意为回避；“不辟亲贵”指执法不因亲近或尊贵而回避、宽免。","anaAI":true},{"n":50,"stem":"涕：","ans":"眼泪","score":1,"ana":"“涕”是眼泪，作名词；晋文公因颠颉将受刑而“隕涕”，即流泪忧愁。","anaAI":true},{"n":51,"stem":"克：","ans":"战胜","score":1,"ana":"“克”是战胜、攻克，作动词；“伐原，克之”即攻打原地并攻克它。","anaAI":true},{"n":52,"stem":"假：","ans":"借助","score":1,"ana":"“假”意为凭借、借助；“假顛頡之脊”指借颠颉受刑之事昭示赏罚必行。","anaAI":true},{"n":53,"grp":"（二）说明下列句中加下划线词的词性或用法，解释其在句中的词义。（4分）","stem":"吾弛關市之徵而緩刑罰。弛：","ans":"形容词使动用法，使……宽缓。","score":2,"ana":"“假顛頡之脊”中“假”是借助、凭借，指借惩处亲信颠颉来建立法令可信度。","anaAI":true},{"n":54,"stem":"東其畝，取五鹿。東：","ans":"名词使动用法，使……东向。","score":2,"ana":"“東其畝”按题给答案，“東”由方位名词转作使动，使田垄/田亩朝东；名词带宾语“其畝”，体现名词使动句法。","anaAI":true},{"n":55,"grp":"（三）将文中画线的句子译成现代汉语。（4分）","stem":"明日令田于圃陸，期以日中爲期，後期者行軍法焉。","ans":"第二天下令在圃陆打猎，以中午为期限，超过期限到的人施行军法。","score":2,"ana":"“明日”指第二天，“田于圃陆”是在圃陆田猎；“期以日中为期”以中午为约定期限；“后期者行军法焉”是迟到者按军法处置。翻译需交代地点、期限与处罚。","anaAI":true},{"n":56,"stem":"君於顛頡之貴重如彼甚也，而君猶行法焉。","ans":"君王那么看重颠颉，却仍然施行军法。","score":2,"ana":"“君於顛頡之貴重如彼甚也”说君王如此看重颠颉，“而犹行法”转折，仍依法处置；核心是亲贵也不例外。","anaAI":true},{"n":57,"grp":"（四）（6分）","stem":"晋文公为什么事询问狐偃的意见？狐偃给晋文公的建议是什么？晋文公是如何实现的？请用自己的语言表述出来。","ans":"晋文公想知道如何可以让百姓愿意跟他一起作战；狐偃提出赏赐和惩罚一定确实执行，不论权贵，不论亲近的人，一律按法执行，就可以让百姓作战；晋文公处罚了不守规定的自己的亲信颠颉，在百姓中树立了威信。","score":6,"ana":"晋文公询问怎样使百姓愿意作战。狐子提出赏罚必须兑现、执法不避亲贵；晋文公通过处置迟到的亲信颠颉示范法令可信，百姓因而相信规则公平并愿意作战。答案需包含问题、原则、具体行动及效果。","anaAI":true}]}]}]},{"paper":"gdhy-2510","subject":"gdhy","session":"2510","label":"2025年10月","code":"00536","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列各组字，全部包含象形、指事、会意三种结构类型的一组是","opts":["及陳柏","自一臭","水新線","月杯修"],"ans":"B","score":1,"ana":"答案B。“自”象鼻形，属象形；“一”以一横指示数目，属指事；“臭”从“自”表鼻、从“犬”会意，三类齐全。A“陳、柏”形声，C“新、線”形声，D“杯、修”含形声/会意但不同时具三类。","anaAI":true},{"t":"s","n":2,"stem":"下列对汉字义符和声符位置的分析完全正确的一项是","opts":["錢，右形左聲。","瓣，外形内聲。","盆，上形下聲。","築，下形上聲。"],"ans":"D","score":1,"ana":"答案D按题库标注判断“築”为下形上声；钱左侧钅为义符、右侧戋为声符，所以A左右相反；“盆”上分声、下皿形，故C把上下说反；“瓣”各部件分析也不符合外形内声。需注意“築”的构形说法存在资料差异，常见分析作从竹、筑声（上形下声），与题库答案D冲突，待核教材/原卷，不能据此改答案。","anaAI":true},{"t":"s","n":3,"stem":"下列关于“小篆”说法正确的一项是","opts":["小篆是秦孝公时期采用的标准字体。","小篆逐渐脱离象物性而走向符号化。","小篆为汉字向象形文字发展奠定了基础。","李斯的《说文解字》是保存小篆最系统的著作。"],"ans":"B","score":1,"ana":"答案B。小篆在秦统一文字过程中逐渐规范并趋于符号化，形体不再直接摹拟物象。A时代应为秦始皇统一而非秦孝公；C把文字演变方向颠倒；D《说文解字》作者是许慎，李斯与《仓颉篇》相关。","anaAI":true},{"t":"s","n":4,"stem":"下列各组字，属于源字与分化字关系的一组是","opts":["鵝—鴦","迹—蹟","裁—才","尉—慰"],"ans":"D","score":1,"ana":"答案D。“慰”从“尉”分化出来承担安慰、慰问义，二字有源字与分化字关系。A鵝—鴦是不同词，B迹—蹟属异体/异写，C裁—才并非所述源分关系。","anaAI":true},{"t":"s","n":5,"stem":"下列各组字，属于异体字关系的一组是","opts":["振—賑","峰—峯","辟—闢","考—拷"],"ans":"B","score":1,"ana":"答案B。“峰—峯”同音同义、记录同一词，仅形体不同，是异体字。振—賑、辟—闢、考—拷各自有词义或用法分化，不是同一词的纯异体。","anaAI":true},{"t":"s","n":6,"stem":"下列句中，加着重号的部分属于主谓式复合词的一句是","opts":["雖遇執事，其弗敢達。","陽伏而不能出，陰迫而不能蒸，於是有⟪地震⟫。","邦分崩離析而不能守也，而謀動干戈於邦內。","諸侯將謀救燕。"],"ans":"B","score":1,"ana":"答案B。“地震”是主谓式复合词，“地”作主语、“震”作谓语，整体指地发生震动。A“達”不构成该复合词关系，C“分崩离析”是并列结构，D“救燕”是动宾短语。","anaAI":true},{"t":"s","n":7,"stem":"下列各组词在古代汉语中全是联绵词的一组是","opts":["國家、夏至、斟酌","繽紛、匍匐、稽首","輾轉、窈窕、爛漫","俊傑、芣苢、社稷"],"ans":"C","score":1,"ana":"答案C。“輾轉、窈窕、爛漫”都是双音节整体表义、不能拆开逐字解释的联绵词。A含“国家”“夏至”等可分析词，B“稽首”为动宾结构，D“俊杰”“社稷”不是联绵词。","anaAI":true},{"t":"s","n":8,"stem":"下列句中，加着重号的词古今词义变化属于色彩褒贬不同的一句是","opts":["亡人無黨，有黨必有讎。","楚子將以商臣爲大子，⟪訪⟫諸令尹子上。","⟪丈夫⟫亦愛憐其少子乎？","四體不⟪勤⟫，五穀不分。"],"ans":"A","score":1,"ana":"答案A。古“亡人”可指逃亡、失国之人，语义色彩较中性；现代“亡人”常指死者，带有死亡含义，感情色彩/语义色彩发生变化。B“访”是征询，C“丈夫”古指成年男子而今常指配偶，属范围变化，D“勤”古今均为勤劳，均非本题所问。","anaAI":true},{"t":"s","n":9,"stem":"下列句中，加着重号的词使用引申义的一句是","opts":["有自門⟪閒⟫射陽越，殺之。（閒：縫隙）","君子⟪引⟫而不發，躍如也。（引：開弓）","叔孫戴伯帥師⟪會⟫諸侯之師侵陳。（會：會合）","宴爾新⟪昏⟫，如兄如弟。（昏：結婚）"],"ans":"D","score":1,"ana":"答案D。“昏”本指日暮、昏暗，古代婚礼多在黄昏举行，进而以“昏”指婚姻、结婚，属引申。A“閒”是缝隙本义，B“引”开弓为本义，C“会”聚合为本义。","anaAI":true},{"t":"s","n":10,"stem":"下列选项中，对“形貌昳⟪麗⟫”和“⟪麗⟫土之毛”中加着重号的词说法正确的一项是","opts":["两句中的“麗”是异词同字现象。","两句中的“麗”是异字同词现象。","两句中的“麗”是反义词。","两句中的“麗”是同义词。"],"ans":"A","score":1,"ana":"答案A。原题两处下加点字形都作“麗”，但“形貌昳麗”的麗是美好，“麗土之毛”的麗有附着/依附义，属异词同字（同形异词），不是异字同词、反义或同义。","anaAI":true},{"t":"s","n":11,"stem":"下列句中，加着重号的词意义解释正确的一句是","opts":["彼不假我道，必不敢受我⟪幣⟫。（幣：錢幣）","秦王⟪色⟫撓，長跪而謝之。（色：顏色）","乃徙武北海上無人處，使牧羝，羝⟪乳⟫乃得歸。（乳：生育）","夫山居而谷汲者，腴臘而相⟪遺⟫以水。（遺：遺留）"],"ans":"C","score":1,"ana":"答案C。“羝乳乃得归”中“乳”指生育、产羔，解释正确。A“幣”是礼物、财物而非专指钱币；B“色撓”指神色屈服而非颜色；D“遺以水”是赠送、给予水，不是遗留。","anaAI":true},{"t":"s","n":12,"stem":"下列句中，加着重号的词属于形容词意动用法的一句是","opts":["傾奪鄰國，而⟪雄⟫諸侯。","願車馬衣輕裘與朋友共，⟪敝⟫之而無憾。","晉侯⟪飲⟫趙盾酒。","君聞而⟪賢⟫之。"],"ans":"D","score":1,"ana":"答案D。“賢之”是认为他贤能，形容词“贤”带宾语“之”作意动用法。A“雄诸侯”是称雄/使诸侯臣服的动用，B“敝之”是使之疲敝或用坏，C“饮赵盾酒”是使赵盾饮酒（使动）。","anaAI":true},{"t":"s","n":13,"stem":"下列句中，“之”用于主谓之间取消句子独立性的一句是","opts":["吾非至於子之門則殆矣。","臣聞之，利不百，不變法。","古者聖王之爲政，列德而尚賢。","邑丈人有之市布醉歸者。"],"ans":"C","score":1,"ana":"答案C。“古者圣王之为政”中“之”置于主语“圣王”和谓语“为政”之间，使主谓结构充当“古者”的修饰成分。A“子之门”结构助词，B“闻之”代词，D“有之市布”中“之”作往、到或结构成分，均不同。","anaAI":true},{"t":"s "items":[{"t":"w","n":37,"stem":"指出下列句中加着重号的字哪些用的是本字，哪些用的是通假字，并说明如何区分本字和通假字。\n（1）公患之，使鉏麑⟪賊⟫之。\n（2）八月⟪剝⟫棗，十月穫稻。\n（3）能謗議於市朝，⟪聞⟫寡人之耳者，受下賞。\n（4）萬人操弓，共射一⟪招⟫。","ans":"（1）贼：本字，本义为杀害；（2）剥：通假字，通“扑”，击打；（3）闻：本字，本义为听到；（4）招：通假字，通“的”，箭靶。区分方法：本字是字形与词义相对应，直接用本义或引申义记录词；通假字是借用音同或音近的字记录另一个词，字的本义与语境义无关。","score":6,"ana":"（1）“贼”在“使鉏麑贼之”中是杀害，为本字本义；（2）“剝棗”中的剥按答案通“扑”，指击打；（3）“闻寡人之耳”是使我听到，为本字；（4）“招”通“的”，指箭靶。判断本字看字义与语境相合，通假则借音近字记录另一词。","anaAI":true},{"t":"w","n":38,"stem":"解释下列句中加着重号词的意义，并指出其差异。\n（1）失時不雨，民且⟪狼顧⟫。\n（2）乘彼垝垣，以⟪望⟫復關。\n（3）雲車十餘丈，⟪瞰⟫臨城中。","ans":"（1）狼顾：像狼一样回头看。（2）望：向远处看。（3）瞰：从高处往下看。差异：“望”是远距离向前看；“瞰”是从高处向下看。","score":6,"ana":"（1）“狼顾”是像狼一样回头看，名词“狼”作比喻状语；（2）“望”指向远处看；（3）“瞰”指从高处向下看。差异应从视点说明：“望”强调距离与向前远眺，“瞰”强调居高临下的方向，不能只说都为“看”。","anaAI":true},{"t":"w","n":39,"stem":"根据下列例句归纳古汉语名量表示法的格式，并将例句序号归入相应格式。\n（1）今人有五子，不爲多。\n（2）翼日戊午，乃社于新邑，牛一、羊一、豕一。\n（3）齊金百斤，車馬十駟。\n（4）百畝之田，勿奪其時。","ans":"（1）数词+名词；（2）名词+数词；（3）名词+数词+量词；（4）数词+量词+名词。","score":8,"ana":"名量结构有四型：（1）数词+名词，“五子”；（2）名词+数词，“牛一、羊一、豕一”；（3）名词+数词+量词，“齐金百斤、车马十驷”；（4）数词+量词+名词，“百亩之田”。答题要把格式与例句号一一对应，并辨明古汉语量词位置不固定。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线的句子译成现代汉语。","passage":"管仲曰：‘吾始困時，⟪嘗與鮑叔賈⟫，分財利多自與，鮑叔不以我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，⟪鮑叔不以我爲不肖⟫，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，⟪召忽死之⟫，吾幽囚受辱，鮑叔不以我爲無恥，⟪知我不羞小節⟫而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。⟪子孫世祿於齊⟫，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而⟪多鮑叔能知人也⟫。","items":[{"t":"w","n":40,"stem":"⟪嘗與鮑叔賈⟫","ans":"曾经和鲍叔牙一起经商。","score":2,"ana":"“尝”是曾经，“与鲍叔贾”是和鲍叔一起做买卖；“贾”在此作经商义的动词。译文应体现共同经商而非购买鲍叔。","anaAI":true},{"t":"w","n":41,"stem":"⟪鮑叔不以我爲不肖⟫","ans":"鲍叔牙不认为我没有才能。","score":2,"ana":"“不肖”指不贤、不成材；“不以我为不肖”是鲍叔不认为我没有才能，结合后文“知时有利不利”解释其理解管仲处境。","anaAI":true},{"t":"w","n":42,"stem":"⟪召忽死之⟫","ans":"召忽为公子纠而死。","score":2,"ana":"“死之”是为公子纠而死，代词“之”指公子纠/其事；“召忽死之”并非普通死亡的地点说明，而是为主效死。","anaAI":true},{"t":"w","n":43,"stem":"⟪知我不羞小節⟫","ans":"知道我不以小节为羞耻。","score":2,"ana":"“羞小节”是把小节看作羞耻；“不羞”即不以小节为耻，后半句对照“耻功名不显”，说明管仲所重在功业名声。","anaAI":true},{"t":"w","n":44,"stem":"⟪子孫世祿於齊⟫","ans":"子孙后代在齐国世代享受俸禄。","score":2,"ana":"“世禄於齊”说子孙世世代代在齐国享有俸禄；“世”修饰禄，译出世袭延续关系。","anaAI":true},{"t":"w","n":45,"stem":"⟪多鮑叔能知人也⟫","ans":"称赞鲍叔牙能够识别人才。","score":2,"ana":"“多鮑叔能知人”中的“多”作意动/赞许义，意为称赞鲍叔善于识人；句子对比世人称许管仲贤能，更称许鲍叔知人。","anaAI":true}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣","ans":"蘇代爲燕說齊，未見齊王，先說淳于髡曰：‘人有賣駿馬者，比三旦立市，人莫之知。往見伯樂曰：“臣有駿馬，欲賣之，比三旦立於市，人莫與言。願子還而視之，去而顧之，臣請獻一朝之賈。”伯樂乃還而視之，去而顧之，一旦而馬價十倍。今臣欲以駿馬見於王，莫爲臣先後者，足下有意爲臣伯樂乎？臣請獻白璧一雙，黃金萬鎰，以爲馬食。’淳于髡曰：‘謹聞命矣。’","score":12,"ana":"开头“苏代为燕说齐，未见齐王，先说淳于髡”是叙事背景；“人有卖骏马者”引出寓言，后面卖马者、伯乐对话用引号区分。卖马人三日无人问，求伯乐绕马而视；伯乐行动后马价十倍，形成前后对照。再以“今臣欲以骏马见于王”转入苏代自况，连续两问句“足下有意为臣伯乐乎”表达请求，随后“请献……”说明酬谢。末尾淳于髡答“谨闻命矣”另起说话者。断句依据说话人转换、叙事层次和问答语气。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭⟪對⟫曰：‘吾小人也，貪。⟪饋⟫之始至，懼其不足，故歎。中食而自⟪咎⟫也。曰：“豈主之食而有不足？”是以⟪再⟫歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加着重号词语的意义。（6分）","stem":"獄：","ans":"诉讼、官司","score":1,"ana":"“獄”在“梗阳人有狱”中指诉讼、官司，名词；后面“将不胜”说明诉讼一方将败，故欲行贿。","anaAI":true},{"n":48,"stem":"對：","ans":"应答、回答","score":1,"ana":"“同辞对曰”中“对”是应答、回答，作动词，引出二人共同向魏献子作答。","anaAI":true},{"n":49,"stem":"饋：","ans":"赠送、进献","score":1,"ana":"“饋之始至”中“饋”指赠送、进献的财物或进献行为；语境说明贿赂送到时二人担心不足。","anaAI":true},{"n":50,"stem":"咎：","ans":"责怪、自责","score":1,"ana":"“中食而自咎”中“咎”是责怪，此处按答案兼有自责义：进食中想到不应贪受而责备自己。","anaAI":true},{"n":51,"stem":"再：","ans":"第二次","score":1,"ana":"“是以再叹”中“再”指第二次；前有初次叹息，后文解释第二次叹息的原因。","anaAI":true},{"n":52,"stem":"厭：","ans":"满足","score":1,"ana":"“适厌而已”中“厌”是满足、吃饱满足；古义不是厌恶。全句说只求腹中适足即可。","anaAI":true},{"n":53,"grp":"（二）解释下列句子中加着重号的词的词性和词义。（4分）","stem":"吾主以不⟪賄⟫聞於諸侯。賄：","ans":"名词，财物、贿赂。","score":2,"ana":"“不贿闻于诸侯”中的“贿”是名词，指财物、贿赂；“以不贿闻”是凭不受贿的声名闻于诸侯。","anaAI":true},{"n":54,"stem":"⟪既⟫飽，獻子問焉。既：","ans":"副词，已经、……之后。","score":2,"ana":"“既饱”中“既”是副词，表示已经/……之后；进食完毕后魏献子才询问三叹缘故。","anaAI":true},{"n":55,"grp":"（三）将下列文中画线的句子译成现代汉语。（4分）","stem":"⟪請納賂於魏獻子⟫。","ans":"请求把贿赂进献给魏献子。","score":2,"ana":"“请纳贿于魏献子”中“请”是请求，“纳贿”是进献贿赂，“于”引进对象魏献子；译文需保留请示语气和受贿对象。","anaAI":true},{"n":56,"stem":"⟪人有言曰：‘唯食可以忘憂。’吾子一食之間而三歎，何也？⟫","ans":"俗话说：“只有吃饭的时候可以忘记忧愁。”您一顿饭的功夫却叹息了三次，这是为什么呢？","score":2,"ana":"“唯食可以忘忧”是引用俗语，意为只有吃饭时可以忘掉忧愁；“一食之间而三叹”强调一顿饭时间内三次叹息，与俗语形成疑问反差。","anaAI":true},{"n":57,"grp":"（四）回答下列问题。（6分）","stem":"用现代汉语说明阎没与叔宽是如何劝谏魏献子的？","ans":"阎没与叔宽用委婉劝谏的方式，借吃饭时三次叹息，暗示魏献子若接受贿赂，会损害清廉名声、滋生贪心，从而劝他拒绝贿赂。","score":3,"ana":"阎没、叔宽没有直斥魏献子，而用三次叹息逐层解释：初怕食物不够，继而想到主人所赐不应不足，最后以“小人之腹”推想“君子之心”只求适足，委婉点出受贿会损害清名、助长贪念，促使魏献子拒贿。得分点是方式、三叹寓意、劝谏效果。","anaAI":true},{"n":58,"stem":"说明文中“以小人之腹，爲君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。","ans":"古意指用普通人的知足之心推想君子也懂得知足、不贪得，是善意推想；今意指用卑劣狭隘的心思揣测高尚之人的想法，含贬义。","score":3,"ana":"文中“以小人之腹为君子之心”是善意推想：普通人只求适量满足，推想君子也知足不贪；现代“以小人之心，度君子之腹”则贬指用狭隘卑劣心思猜测高尚者。关键差异在“腹/心”的表达、推想方向与褒贬色彩。","anaAI":true}]}]}],"qaNotes":[]},{"paper":"gdhy-2604","subject":"gdhy","session":"2604","label":"2026年4月","code":"00536","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列各组字，全部是会意字的一组是","opts":["弃武河","解險柴","息  明","绵暖迹"],"ans":"[答案待核：题面C缺“尖”，现有字仅“息、明”]","score":1,"ana":"源文题面C只有“息、明”，附答补入“尖”后才构成全为会意字的一组选项。没有一个完整且由现有选项唯一支持的正确项；不得按附答补字计分。","anaAI":true,"qaNotes":"保持待核：源题C仅“息”“明”，原附答案解析额外补“尖”，故完整选项与答案说明不一致；不凭教材知识补录缺字。"},{"t":"s","n":2,"stem":"下列对汉字义符和声符位置的分析完全正确的一项是","opts":["哀，内形外聲。","幕，上形下聲。","鴨，左形右聲。","佞，右形左聲。"],"ans":"D","score":1,"ana":"佞为右形左声；幕为下形上声，鸭为右形左声。","anaAI":true},{"t":"s","n":3,"stem":"下列关于汉字形体演变的说法正确的一项是","opts":["汉字形体发展可以分为古代文字阶段和近代文字阶段。","甲骨文被视为秦系文字的代表。","金文中指事字大大增加。","战国文字具有明显的地域性差异。"],"ans":"D","score":1,"ana":"战国各国文字有地域差异；甲骨文属殷商，金文形声字增加。","anaAI":true},{"t":"s","n":4,"stem":"下列各组字，属于异体字关系的一组是","opts":["指一旨","牟一眸","慚—慙","彫一凋"],"ans":"C","score":1,"ana":"慚与慙为异体，其他项的一字形“一”按源文保留。","anaAI":t 自中，而信自身，其焉德也深矣，其焉本也固矣，故不可動也。⟪今我以忠謀諸侯，而以信覆之⟫，⟪荆之逆诸侯也亦云⟫，是以在此。⟪若襲我,是自背其信而塞其忠也⟫。信反必斃，忠塞無用，安能害我？且夫合諸侯以爲不信，諸侯何望焉。爲此行也，荆敗我，諸侯必叛之，子何愛於死，⟪死而可以固晉國之盟主,何懼焉⟫？”是行也，以藩爲軍，引輦即利而舍，候阻扞衛不行，楚人不敢謀，畏晉之信也。自是沒平公無楚患。\n注：赵武，晋正卿文子也。","score":20,"subs":[{"n":47,"stem":"襲：","ans":"偷袭","score":1,"ana":"趁其不备进攻。","anaAI":true,"grp":"（一）解释文中加着重号词语的意义。（6分）"},{"n":48,"stem":"聞：","ans":"听说","score":1,"ana":"文子闻之，即听说此事。","anaAI":true},{"n":49,"stem":"若之何：","ans":"怎么办","score":1,"ana":"询问应当如何应对。","anaAI":true},{"n":50,"stem":"愛：","ans":"吝惜","score":1,"ana":"何爱于死即何必吝惜生命。","anaAI":true},{"n":51,"stem":"舍：","ans":"驻扎","score":1,"ana":"就有利地势驻扎。","anaAI":true},{"n":52,"stem":"没：","ans":"直到……去世","score":1,"ana":"自是没平公无楚患，即直到平公去世。","anaAI":true},{"n":53,"grp":"（二）解释下面句子中“也”的用法。（2分）","stem":"荆之逆諸侯也亦云。","ans":"句中语气助词，表停顿。","score":1,"ana":"也位于句中作提顿。","anaAI":true},{"n":54,"stem":"若襲我，是自背其信而塞其忠也。","ans":"句末语气助词，表判断或肯定。","score":1,"ana":"也在句末收束判断语气。","anaAI":true},{"n":55,"stem":"⟪若盡晉師而殺趙武,則晉可弱也⟫。","ans":"如果消灭全部晋军并杀死赵武，那么晋国就可以被削弱了。","score":2,"ana":"若……则为假设，尽为消灭净尽。","anaAI":true,"grp":"（三）将下列文中画线的句子翻译成现代汉语。（6分）"},{"n":56,"stem":"⟪今我以忠謀諸侯，而以信覆之⟫。","ans":"现在我们以忠诚为诸侯谋划，又用诚信贯彻、完成这件事。","score":2,"ana":"覆有落实完成义；附答字面“覆盖它”不够通顺。","anaAI":true},{"n":57,"stem":"⟪死而可以固晉國之盟主,何懼焉⟫？","ans":"即使死去若能巩固晋国的盟主地位，又有什么可怕的呢？","score":2,"ana":"固为巩固，何惧表反问。","anaAI":true},{"n":58,"grp":"（四）回答问题。（6分）","stem":"用现代汉语表述赵文子最后如何迎战楚军，并说明这样做的原因。","ans":"赵文子以藩车为军营，牵引辎重车到有利地形驻扎，倚靠险阻防卫，不主动进攻。因为晋军守信，楚国一旦偷袭就会背信并失去诸侯支持，晋人可凭诚信使楚军不敢进犯。","score":6,"ana":"据“以藩为军，引辇即利而舍，候阻扞卫不行”说明部署；“畏晋之信”“诸侯必叛之”说明原因。","anaAI":true}]}]}],"qaNotes":["题页及附后真题答案逐项对照；选择题、27—39的“加着重号”在源XML未见 w:u/w:em，不能根据语义臆造⟪…⟫。27—35可从题后“適：”等找到目标，但原文字体强调仍缺失；36目标错配保留。翻译和阅读原段下划线由真实w:u定位。","1C源XML runs仅“息”“  ”“明”，附答增加“尖”，不补入选项。","5原附D“与”为本字本义与本地2504同句“与”通举冲突，附答A论“间”但题面为“问”；5、6、12、16着重或字形冲突，ans待核禁止错误自动计分。","12A题面“故聖人議多少、論薄厚焉之政。”；附答却凭“爲之政”断双宾语，不改卷面。","22附答“和清听”与同库2310相同文句“和五聲”错配；23附答“必以子为不免”与同库2510“爾以玉爲寶”错配。","36题面“人方爲刀俎，我爲魚肉，何辭爲？”却单列“焉：”，附答确为“爲：语气词”；题目不暗改。","38附答（1）虚“大丘”、（2）虚“故城”与语境错配，按上下文暂定空虚／大丘，词典本义 铺陈","运用寓言","文风质朴","行文古奥"],"ans":"A","score":1,"ana":"《谏逐客书》以秦国历代任用客卿的事例逐层铺叙，继而论证逐客会损害强秦事业，核心力量在材料罗列和排比铺陈。它不是靠寓言取胜，文势也并非质朴短促或古奥难解。","anaAI":true},{"t":"s","n":8,"stem":"汉代散文家晁错生活的时代是（ ）。","opts":["西汉初期","西汉中后期","东汉前期","东汉后期"],"ans":"A","score":1,"ana":"晁错是汉文帝、景帝时期的政论家，处于西汉前期；其削藩主张与景帝时七国之乱及被诛相连。西汉中后期、东汉前后期都比他的活动年代晚。","anaAI":true},{"t":"s","n":9,"stem":"杨恽《报孙会宗书》的创作特点是（ ）。","opts":["极力铺陈","气度宏伟","情真意切","理直气壮"],"ans":"C","score":1,"ana":"《报孙会宗书》是杨恽遭免官后写给孙会宗的书信，借叙田园生活回应规劝，字里行间有自辩、愤懑与身世感，情意真切。它不是大赋式铺张，也不是以宏伟气度或单纯讲理取胜。","anaAI":true},{"t":"s","n":10,"stem":"《史记》中“书”载录的是（ ）。","opts":["历代帝王的兴衰沿革","文化、经济、制度","王侯各国状况","古今特殊人物或集团"],"ans":"B","score":1,"ana":"《史记》“书”专记礼乐、历法、天文、经济等典章制度沿革；“本纪”写帝王，“世家”写诸侯与重要家族，“列传”写个人及群体。因此帝王兴衰属本纪，王侯国别多属世家，特殊人物属列传。","anaAI":true},{"t":"s","n":11,"stem":"司马相如《天子游猎赋》的创作特点是（ ）。","opts":["抒情言志","极度铺排","语言平易","采用骚体"],"ans":"B","score":1,"ana":"《天子游猎赋》即司马相如大赋一路的代表，借天子出猎铺排苑囿、物产、车骑与场面，以繁富辞采呈现帝国气象。它并非抒情小赋，语言不以平易为主要标志，也不是骚体写法。","anaAI":true},{"t":"s","n":12,"stem":"刘歆的《遂初赋》属于（ ）。","opts":["纪行赋","咏物赋","大赋","骈赋"],"ans":"A","score":1,"ana":"刘歆《遂初赋》按行旅经历铺写沿途地理与见闻，属于纪行赋；纪行的“行”是结构线索，不等于一般咏物。它既非汉代铺陈宫苑的典型大赋，也非以骈偶形式界定的骈赋。","anaAI":true},{"t":"s","n":13,"stem":"祢衡《鹦鹉赋》的创作特点是（ ）。","opts":["激烈抨击时政，直抒胸臆","表现士人困厄，托物言志","借景抒情","借古抒情"],"ans":"B","score":1,"ana":"祢衡把鹦鹉受困、不得自由的处境寄托士人困厄，借物抒怀，故重在托物言志。作品不是单纯写景或怀古；其寄托方式也不同于直陈时政得失。","anaAI":true},{"t":"s","n":14,"stem":"汉代乐府民歌《上山采蘼芜》的主题是（ ）。","opts":["反映人民对战争的厌倦","表现人生哲理","倾诉生活艰难困顿","反映爱情婚姻"],"ans":"D","score":1,"ana":"《上山采蘼芜》写弃妇与故夫相逢、问及新妇并以旧日与如今相较，集中表现婚姻变故和女性处境。诗中没有战争场景，重点也非抽象人生哲理或泛写贫困。","anaAI":true},{"t":"s","n":15,"stem":"首开以乐府古题自作诗风气的作家是（ ）。","opts":["曹操","曹丕","曹植","刘桢"],"ans":"A","score":1,"ana":"曹操常沿用汉乐府旧题而写自己的时代感受，如《短歌行》《蒿里行》，把乐府题目转化为个人创作，开启文人以乐府古题自作诗的风气。曹丕、曹植继承发展，但非“首开”者。","anaAI":true},{"t":"s","n":16,"stem":"建安时期著名诗人曹植的字是（ ）。","opts":["孟德","子建","子桓","仲宣"],"ans":"B","score":1,"ana":"曹植字子建，是曹操之子、建安文学代表诗人；孟德是曹操字，子桓是曹丕字，仲宣是王粲字。四个字号对应不同建安作家。","anaAI":true},{"t":"s","n":17,"stem":"曹丕诗歌的艺术风格是（ ）。","opts":["纤丽清新","辞采华茂","悲凉沉雄","深切沉痛"],"ans":"A","score":1,"ana":"曹丕诗歌常以细腻情思、清婉流丽的措辞见长，《燕歌行》尤能体现其纤丽清新的面貌。曹植以辞采华茂著称，建安诗歌的悲凉沉雄更常概括整体时代气象，不能直接替代曹丕的个性风格。","anaAI":true},{"t":"s","n":18,"stem":"诗句“夜中不能寐，起坐弹鸣琴”出自（ ）。","opts":["曹操《短歌行》","王粲《从军行》","阮籍《咏怀》","嵇康《赠兄秀才入军》"],"ans":"C","score":1,"ana":"“夜中不能寐，起坐弹鸣琴”是阮籍《咏怀诗》名句，写夜不能寐、借琴排遣而忧思仍在，符合组诗借个人感受寄寓身世之慨的特点。曹操《短歌行》及王粲、嵇康的相应篇名均无此句。","anaAI":true},{"t":"s","n":19,"stem":"“一语天然万古新，豪华落尽见真淳”（元好问《论诗绝句》）评价的是（ ）。","opts":["谢灵运","傅玄","陆机","陶渊明"],"ans":"D","score":1,"ana":"元好问以“豪华落尽见真淳”称许陶渊明诗歌洗去雕饰而自然真挚的境界。谢灵运以山水经营和锻炼语言见长，陆机重辞采，傅玄风格亦非此句所推重的陶诗自然本色。","anaAI":true},{"t":"s","n":20,"stem":"鲍照乐府诗的艺术特色是（ ）。","opts":["抒情浓烈，气势流畅","经营惨淡，钩深索隐","清水芙蓉，自然可爱","铺锦列绣，典丽华赡"],"ans":"A","score":1,"ana":"鲍照乐府多写寒士不平、边塞征战与人生失意，情感激越，句势流动而有强烈冲击力。清水芙蓉、自然可爱通常用于陶诗；“铺锦列绣”指向繁密典丽一路；惨淡钩深也不是鲍照乐府的典型标签。","anaAI":true},{"t":"s","n":21,"stem":"南朝乐府民歌大多辑入郭茂倩《乐府诗集》（ ）。","opts":["杂曲歌辞","杂歌谣辞","横吹曲辞","清商曲辞"],"ans":"D","score":1,"ana":"南朝民歌中的吴歌、西曲主要收入《乐府诗集》“清商曲辞”，这一类保存了江南地区的爱情歌辞与生活情调。“杂曲歌辞”等也收乐府作品，但不是题目所问南朝民歌的集中类别。","anaAI":true},{"t":"s","n":22,"stem":"吴歌《华山畿》所写的主要内容是（ ）。","opts":["坚贞不渝的爱情","雄浑苍茫的景观","游牧尚武生活","思乡怀人的愁绪"],"ans":"A","score":1,"ana":"《华山畿》属于吴声歌曲，常以青年男女坚贞相爱、因阻隔而死后仍相守的故事传诵，爱情主题鲜明。它不是边塞游牧生活、山水壮景或一般思乡诗。","anaAI":true},{"t":"s","n":23,"stem":"以记游的方式详尽描绘山中景物，因而成为后世山水游记之祖的山水赋是（ ）。","opts":["庾阐《海赋》","郭璞《江赋》","孙绰《游天台山赋》","顾恺之《观涛赋》"],"ans":"C","score":1,"ana":"孙绰《游天台山赋》沿登山游历描写天台山景物，并以游踪组织细致的山水铺写，因此常被视为山水游记文学的先声。庾阐《海赋》、郭璞《江赋》写海江，顾恺之《观涛赋》着眼观潮，都不是记游山岳。","anaAI":true},{"t":"s","n":24,"stem":"鲍照《芜城赋》中的“芜城”指的是（ ）。","opts":["江陵","洛阳","广陵","建业"],"ans":"C","score":1,"ana":"鲍照《芜城赋》中的“芜城”指广陵，即今扬州一带。作品以昔日繁华对照战乱后的荒芜，借具体城市兴废写历史沧桑；江陵、洛阳、建业不是此赋所指。","anaAI":true},{"t":"s","n":25,"stem":"薛道衡诗《昔昔盐》的艺术特点是（ ）。","opts":["笔力苍劲","词气宏拔","朴实爽俊","辞清句丽"],"ans":"D","score":1,"ana":"《昔昔盐》以清丽工整的语句写征人远戍与闺中思念，薛道衡的长处在清润秀美、辞清句丽。苍劲、宏拔、爽俊虽可概括其他诗人或诗风，均非此篇最受称道的语言面貌。","anaAI":true},{"t":"s","n":26,"stem":"王昌龄擅长的诗体是（ ）。","opts":["五律","七律","五绝","七绝"],"ans":"C","score":1,"ana":"王昌龄尤其擅长七言绝句，边塞、送别和宫怨题材中多有名篇，后世称其“七绝圣手”。五律、七律、五绝不是其创作最突出的诗体。","anaAI":true},{"t":"s","n":27,"stem":"孟浩然山水诗的风格是（ ）。","opts":["平淡自然","幽僻清奇","清刚劲健","幽深拗峭"],"ans":"A","score":1,"ana":"孟浩然常从寻常行旅、隐居和山水经验中写景，语言疏淡自然，不靠奇险字句造势。幽僻清奇、幽深拗峭或清刚劲健更适用于其他诗人风格，和孟诗平和清远的主调不同。","anaAI":true},{"t":"s","n":28,"stem":"李益写得最多、最好的诗为（ ）。","opts":["边塞诗","山水诗","田园诗","唱和诗"],"ans":"A","score":1,"ana":"李益以边塞诗著称，常写戍边环境、征人心理及战争后的苍凉感，如《夜上受降城闻笛》《从军北征》。山水、田园和唱和诗并非他创作中最有代表性的一类。","anaAI":true},{"t":"s","n":29,"stem":"晚唐小品文的创作特征是（ ）。","opts":["宗经尚简","文以明道","批判性强","幽默诙谐"],"ans":"C","score":1,"ana":"晚唐小品文常直面现实弊病，以短小犀利的篇幅讽刺政治和社会风气，皮日休、陆龟蒙、罗隐等作品尤能体现批判锋芒。宗经尚简、文以明道是更宽泛的古文观，幽默可以出现，却不足以概括其主要特征。","anaAI":true},{"t":"s","n":30,"stem":"传奇小说《任氏传》属于（ ）。","opts":["灵异故事","爱情故事","梦幻故事","游侠故事"],"ans":"B","score":1,"ana":"《任氏传》是唐传奇中的爱情故事，写郑生与狐女任氏相遇相爱，并把异类恋情写得有情有性、具有现实生活质感。作品重点不是单纯灵异、梦境或游侠行踪。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。","items":[{"t":"m","n":31,"stem":"宋玉的作品有","opts":["《风赋》","《高唐赋》","《神女赋》","《对楚王问》","《九辩》"],"ans":"ABCDE","score":2,"ana":"按传统归属，宋玉名下有《风赋》《高唐赋》《神女赋》《对楚王问》和《九辩》：前四种体现赋体铺写或问答体，后一篇是楚辞体抒情作品。《九辩》作者归属在学界有讨论，按现存答案，待核；此处按教材传统说法判为全选。","anaAI":true},{"t":"m","n":32,"stem":"东汉冯衍《与妇弟任武达书》的创作特点有","opts":["叙写个人情事","讥刺世俗浇薄","排偶铺陈","情感愤切","谈说虚妄"],"ans":"ACD","score":2,"ana":"A、C、D分别对应书信写个人情事、排偶铺陈的文体经营和情感愤切的表达，构成其创作面貌。B“讥刺世俗浇薄”与此篇主要的自叙、抒愤重心不合；E“谈说虚妄”也不是书信论事的写法。","anaAI":true},{"t":"m","n":33,"stem":"东晋玄言诗的代表作家有","opts":["孙绰","郭璞","殷仲文","谢混","许询"],"ans":"AE","score":2,"ana":"东晋玄言诗以孙绰、许询为代表，诗中常把山水清谈与老庄玄理相连，玄理议论有时压过具体情感。郭璞主要以《游仙诗》著称；殷仲文、谢混虽处于东晋诗坛，但不是此题所列玄言诗代表组合。","anaAI":true},{"t":"m","n":34,"stem":"顾况诗歌的特点包括","opts":["受民歌影响","通俗明快","有怪奇风格","高雅闲淡","以七绝见长"],"ans":"ABC","score":2,"ana":"顾况诗既吸收民歌的口语与活泼节奏，也常用通俗明快的表达，并保留奇诡突兀的一面，所以A、B、C成立。高雅闲淡并非其主要标签；以七绝见长更常用于王昌龄等诗人。","anaAI":true},{"t":"m","n":35,"stem":"晚唐讽刺小品文的代表作家有","opts":["杜牧","孙樵","皮日休","陆龟蒙","罗隐"],"ans":"CDE","score":2,"ana":"皮日休、陆龟蒙、罗隐的小品文借讽刺揭露晚唐政局和社会弊端，常短小犀利、寓意尖锐，是此类文体的代表。杜牧虽是晚唐重要诗文家，但不属题目所指讽刺小品的代表名单；孙樵也不是这一组合中的代表。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"w","n":36,"stem":"《论语》","ans":"（1）《论语》是以记录孔子言行为主，兼记其弟子言行的语录体论集。（2）《论语》通过记载孔子及其弟子的言行来展示孔子的思想。","score":3,"ana":"《论语》不是孔子亲自撰成的系统哲学论著，而是以孔子言行为核心、兼记弟子言行的语录体，由后学记录编纂。短章对话保留了孔子谈仁、礼、学习与为政的具体语境，是理解早期儒家思想和先秦散文形态的重要文献。","anaAI":true},{"t":"w","n":37,"stem":"“左思风力”","ans":"（1）西晋左思的诗歌创作继承了建安风骨，被钟嵘《诗品》誉为“左思风力”。（2）左思的诗引用历史典故以抒时愤，刚健有力。","score":3,"ana":"“左思风力”是钟嵘《诗品》对左思诗歌刚健有力、具有建安风骨的评价。左思常借历史人物和兴亡抒写现实不平，如《咏史》并非单纯铺陈史实，而是以古人遭际映照寒士受压抑的处境；“风力”因此兼指气势与批判力量。","anaAI":true},{"t":"w","n":38,"stem":"贞观诗坛","ans":"（1）贞观年间，唐太宗李世民为文坛盟主，在他身边聚集了一大批北方文人和南朝文士。（2）贞观诗风的新变，起于对六朝声律辞采的模仿和拾掇，重声律辞采。（3）代表诗人有李世民、虞世南、上官仪。","score":3,"ana":"贞观诗坛以唐太宗宫廷为中心，北方文人与南朝文士交汇，初唐诗歌在统一王朝的文化条件下吸收南朝声律、辞采。李世民、虞世南等显示宫廷诗坛面貌；上官仪的声律体制影响主要延续并发展于稍后的高宗时期，理解此条时宜把它看作由贞观诗风通向初唐格律化的线索。","anaAI":true},{"t":"w","n":39,"stem":"大历十才子","ans":"（1）“十才子”之名最初见于大历时期中唐诗人姚合编的《极玄集》。（2）代表人物有钱起、李端、卢纶、司空曙等。（3）主要写日常生活细事、自然风物和羁旅愁思，抒发寂寞清冷的孤独情怀，风格清雅闲淡。","score":3,"ana":"“大历十才子”是对大历前后活跃的中唐诗人的合称，并非严密固定的文学社团；名单在文献中略有出入，钱起、卢纶、李端、司空曙等常被列入。其诗多取材日常交游、羁旅与山水，清雅中带冷寂感，反映安史之乱后士人生活空间收缩。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述贾谊散文的创作特点。","ans":"（1）据实设论，理直气壮，情感激扬，切直晓畅。（2）铺饰排比，渲染淋漓，具有战国纵横家遗风。","score":5,"ana":"贾谊的政论针对汉初现实政务，先提出具体问题再层层推演利害，论证直接，情绪也带有忧时的急切。《过秦论》从秦亡归因推进到汉代治国之戒，《论积贮疏》则以仓储关系国家安定，能看出其据实立论、理势与感情并重的特点；排比铺陈则延续战国说理文章的感染力。","anaAI":true},{"t":"w","n":41,"stem":"简述王褒《洞箫赋》在咏物赋发展中的地位。","ans":"（1）以咏物自况，把自己的遭际和情感完全融入对洞箫的描述之中，和一般的象喻关系浅露、直接的咏物赋相比有了质的飞跃。（2）全文只描写乐器和音乐，显得完整而集中，开创了全文写音乐的先河。","score":5,"ana":"王褒《洞箫赋》不只把乐器当作一个外在譬喻，而是让竹材、制作、吹奏、音色及听者感受贯穿全篇，使咏物与身世寄托融成一体。它把“写物”从附着于大赋铺陈中的局部推进为集中完整的篇章，也为后来以音乐为中心的咏物赋开出路径。","anaAI":true},{"t":"w","n":42,"stem":"简析曹植诗歌雄健豪放风格的成因及表现。","ans":"（1）曹植生活在战争年代，成长于戎马倥偬之中，抱负远大，才干杰出，胸襟宽广；即使后期受到猜忌压抑，诗中抒发的也是英雄失路的慷慨悲凉之气，而非小儿女恩怨尔汝的细语呻吟。（2）诗中多出现广阔的意象、大幅度的动作和巨大的数目。","score":5,"ana":"曹植早年处在建安战争和曹氏争夺天下的政治环境中，抱有建功理想；曹丕即位后，他屡遭猜忌与封地迁徙，后期诗中遂有英雄失路的悲愤，而非单纯儿女情愁。其雄健感来自开阔的空间、迅疾的行动和超常尺度，如《白马篇》塑造驰骋边塞的游侠形象；这类大幅动作和广阔意象把抱负写成可见的力量。","anaAI":true},{"t":"w","n":43,"stem":"简述李白绝句的艺术特色。","ans":"（1）七言绝句以山水诗和送别诗为多，表现人与自然的融合，表现日常生活中的人情之美，兴到神会，一挥而就，自然天成，如《早发白帝城》。（2）五言绝句以简洁明快的语言表达无尽的情思，做到了既自然又含蓄，这是绝句的最高境界，如《独坐敬亭山》。（3）李白绝句受乐府民歌影响，具有乐府民歌风格；在他159首绝句里，拟乐府民歌占了近1/3，如《静夜思》等。","score":5,"ana":"李白绝句常从一个鲜明瞬间起笔，语言近口语而意境骤然展开，承接乐府民歌的自然节奏，不靠繁密典故。《早发白帝城》把归舟与千里山川压缩为轻快的一瞬；《黄鹤楼送孟浩然之广陵》以孤帆远影收束送别情意；五绝《静夜思》则用月光这一寻常触景转入乡思，简而有余味。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述《战国策》的文学特色。","ans":"《战国策》多记纵横家言，有独到的文学特色：（1）铺张辩丽、夸饰恣肆的风格。（2）把握对方心理，循循善诱，以情理服人。（3）引譬设喻，善用寓言。","score":14,"ana":"《战国策》汇集战国游说之士的言辞与故事，文学力量来自语言针对具体听者而设计：先揣摩君主利害，再用层递追问、譬喻或故事改变其判断。《触龙说赵太后》以亲子之情转入国家继嗣问题，体现以情理渐进劝说；“邹忌讽齐王纳谏”等篇则显示比照设喻的说服力。各篇风格不一，但铺张辩丽、善于揣摩心理和运用譬喻是重要共性。","anaAI":true},{"t":"w","n":45,"stem":"试以具体作品为例，论述孟郊诗歌的创作特点。","ans":"孟郊诗歌创作的特点：（1）以苦吟著称，注重造语炼字，构思奇特超常。（2）诗多表现凄凉寒苦的贫困生活，诗境幽僻，风格峭硬，笼罩着一股寒气。（3）孟诗也有古朴平易的小诗，如《游子吟》。","score":14,"ana":"孟郊的“苦吟”不只是写贫寒题材，也体现在反复锤炼字句、把冷硬意象组织成不寻常诗境；《寒地百姓吟》等篇把生计艰难写得逼仄凄冷，句法和用字也显峭硬。另一方面，《游子吟》以朴素口语写母爱，说明孟诗并非一味奇险：其创作在苦涩锻炼与古朴平易之间都有表现。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2110","subject":"gws","session":"2110","label":"2021年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》是我国第一部诗歌总集，收录诗歌（ ）。","opts":["160篇","300篇","305篇","311篇"],"ans":"C","score":1,"ana":"《诗经》原有三百零五篇，故答案是305篇。所谓“诗三百”是约称，不是实际篇数；160、300、311分别是误记或把概数当精确数。","anaAI":true},{"t":"s","n":2,"stem":"《诗经·豳风·七月》的主要内容是（ ）。","opts":["描写婚恋生活","揭露宫闱丑行","歌颂祖先功德","反映农事活动"],"ans":"D","score":1,"ana":"《七月》按月份铺写周人一年中的耕作、采桑、狩猎、筑场和储粮等生活，是《豳风》中具有农事历叙性质的长诗。它也涉及贵族与农夫的关系，但中心不是婚恋、宫闱或单纯祖先颂歌。","anaAI":true},{"t":"s","n":3,"stem":"《春秋》的语言特点是（ ）。","opts":["准确简明","佶屈聱牙","铺排纵恣","质木无文"],"ans":"A","score":1,"ana":"《春秋》以极简笔法记事，年月、人物、事件交代准确而文字节省，后世所谓“春秋笔法”也与这种一字寓褒贬的书写传统相关。它不以艰涩、纵恣铺排或文饰繁富为语言特征。","anaAI":true},{"t":"s","n":4,"stem":"以下语句出自《庄子》的是（ ）。","opts":["“保民而王，莫之能御也”","“寓言十九，重言十七，卮言日出，和以天倪”","“五色令人目盲，五音令人耳聋，五味令人口爽”","“青，取之于蓝，而青于蓝；冰，水为之，而寒于水”"],"ans":"B","score":1,"ana":"B句出自《庄子·寓言》篇，正是庄子说明寓言、重言、卮言三种表达方式的文字。A为《孟子》王道论，C为《老子》五色五音之戒，D为《荀子·劝学》的青出于蓝、冰寒于水。","anaAI":true},{"t":"s","n":5,"stem":"屈原诗句“余既滋兰之九畹兮，又树蕙之百亩”出自（ ）。","opts":["《离骚》","《橘颂》","《招魂》","《怀沙》"],"ans":"A","score":1,"ana":"“余既滋兰之九畹兮，又树蕙之百亩”见《离骚》，以栽兰种蕙写诗人培植美德、修养自我的志向。《橘颂》也写植物，但对象是橘树；《招魂》《怀沙》均无此句。","anaAI":true},{"t":"s","n":6,"stem":"《登徒子好色赋》的作者是（ ）。","opts":["屈原","宋玉","景差","唐勒"],"ans":"B","score":1,"ana":"《登徒子好色赋》传统上归于宋玉，通过登徒子、楚王和宋玉的对话讽刺以貌取人、辨析好色之名。屈原是楚辞代表，景差、唐勒虽是楚辞作家，也不是此赋的通行作者归属。","anaAI":true},{"t":"s","n":7,"stem":"秦刻石文的形式为（ ）。","opts":["三言为句","四言为句","五言为句","七言为句"],"ans":"B","score":1,"ana":"秦始皇刻石文采用四言句式，简短整齐，具有颂功纪事和宣示帝国秩序的功能。三言、五言、七言并非秦刻石文的基本形式。","anaAI":true},{"t":"s","n":8,"stem":"汉代散文家刘向生活的时代是（ ）。","opts":["西汉初期","西汉中后期","东汉前期","东汉后期"],"ans":"B","score":1,"ana":"刘向活动于西汉中后期，历经宣帝、元帝、成帝等时期，以校书、目录整理和《说苑》《新序》等著述著称。西汉初期早于其时代，东汉各选项更晚。","anaAI":true},{"t":"s","n":9,"stem":"东汉朱穆散文的特点是（ ）。","opts":["文风华丽","言辞迫切","批评时俗浇薄","有骈俪化倾向"],"ans":"C","score":1,"ana":"朱穆《崇厚论》等文章针对东汉社会风俗日趋浮薄、虚伪而发，议论迫切，批评世俗浇薄是其鲜明内容。华丽铺陈或骈俪化不是最能概括其政论锋芒的特点。","anaAI":true},{"t":"s","n":10,"stem":"贾谊《吊屈原赋》的创作特点是（ ）。","opts":["抒情言志","歌功颂德","铺排夸饰","语言华丽"],"ans":"A","score":1,"ana":"《吊屈原赋》借凭吊屈原抒写贾谊自身被贬的失意，屈原的遭际成为寄寓个人不遇之感的媒介，故属抒情言志。它不是颂扬功业的作品，也不以汉大赋式铺排或辞藻华丽为主要目标。","anaAI":true},{"t":"s","n":11,"stem":"司马相如的《天子游猎赋》属于（ ）。","opts":["骚体赋","大赋","抒情赋","咏物赋"],"ans":"B","score":1,"ana":"《天子游猎赋》是司马相如典型的汉代大赋，以宏阔篇幅和层层铺陈写苑囿、游猎、物产及声势，结尾常含讽谏。它不属于重个人情感的骚体赋、抒情赋或咏物小赋。","anaAI":true},{"t":"s","n":12,"stem":"班婕妤《自悼赋》的创作特点是（ ）。","opts":["悲士之不遇","描写宫怨","咏物抒情","借古抒情"],"ans":"B","score":1,"ana":"班婕妤《自悼赋》从失宠宫人的处境出发，写深宫幽闭与青春消逝，属于描写宫怨、抒发身世哀感的作品。它没有以咏物或借古为主要结构，也不同于士人普遍意义上的不遇之悲。","anaAI":true},{"t":"s","n":13,"stem":"应玚《赠四王冠诗》、班固《咏史》是（ ）。","opts":["五言之冠冕","最早有作者可考的五言诗","文人五言诗渐趋成熟的标志","乐府诗中成熟的五言诗"],"ans":"B","score":1,"ana":"班固《咏史》是现存较早、作者可考的文人五言诗之一；与应玚诗并举时，考点是文人五言诗从民间乐府向文人创作发展的早期实证。所谓“五言之冠冕”通常指《古诗十九首》，成熟标志则是更长时段的文学史判断。","anaAI":true},{"t":"s","n":14,"stem":"《古诗十九首》“明月何皎皎”主要表现的是（ ）。","opts":["思乡怀人","闺思愁怨","游宦挫折","人生失意"],"ans":"A","score":1,"ana":"《明月何皎皎》写游子夜不能寐、披衣出户，望月而思远方亲人，结尾叹息归来无期，主旨是思乡怀人。诗中虽有孤独失意，但具体情境指向离乡之人的怀归，不是闺中女子思夫。","anaAI":true},{"t":"s","n":15,"stem":"我国文学史上第一首纯然描写自然景物的山水诗作出现于（ ）。","opts":["建安时期","正始时期","两晋时期","南北朝时期"],"ans":"A","score":1,"ana":"建安时期曹操《观沧海》被视为文学史上第一首纯然描写自然景物的山水诗，写登临所见海天景象，虽仍有政治抱负背景，却以自然景观为中心。正始、两晋、南北朝的山水诗发展均在其后。","anaAI":true},{"t":"s","n":16,"stem":"诗句“丈夫志四海，万里犹比邻”出自（ ）。","opts":["曹操《短歌行》","陈琳《饮马长城窟行》","曹植《赠白马王彪》","王粲《从军行》"],"ans":"C","score":1,"ana":"“丈夫志四海，万里犹比邻”出自曹植《赠白马王彪》，写与兄弟远别仍以天下为志，语气中兼有壮志和离愁。曹操《短歌行》、陈琳和王粲的相关篇目没有这两句。","anaAI":true},{"t":"s","n":17,"stem":"建安诗人中对七言诗的发展做出重大贡献的作家是（ ）。","opts":["徐干","曹丕","刘桢","孔融"],"ans":"B","score":1,"ana":"曹丕对七言诗发展的贡献突出，现存《燕歌行》是完整七言诗的重要早期作品，推动七言从乐府歌辞走向文人抒情诗。徐干、刘桢、孔融虽为建安文士，却不以推进七言诗体著称。","anaAI":true},{"t":"s","n":18,"stem":"太康诗人中存诗最多的作家是（ ）。","opts":["张华","傅玄","陆机","潘岳"],"ans":"C","score":1,"ana":"太康诗人中陆机存诗最多，其创作重视辞采、对偶与声律，显示西晋文学由建安质朴转向讲究形式的一面。张华、傅玄、潘岳也有作品传世，但数量不及陆机。","anaAI":true},{"t":"s","n":19,"stem":"梁武帝萧衍“三日不读谢诗，便觉口臭”所指的诗人是（ ）。","opts":["谢灵运","谢庄","谢惠连","谢朓"],"ans":"D","score":1,"ana":"萧衍所说的谢诗指谢朓。谢朓诗风清新流丽、声律圆美，对唐代近体诗发展影响深；谢灵运以山水诗著称，谢庄、谢惠连也非此典故所指。","anaAI":true},{"t":"s","n":20,"stem":"南朝民歌《西洲曲》所写的主要内容是（ ）。","opts":["针砭时弊","山水景观","女子怀人","江南风光"],"ans":"C","score":1,"ana":"《西洲曲》以女子怀念情人为主线，从采莲、忆旧到盼归，情意贯穿江南水乡的景物描写。针砭时弊不是其主题，水乡风光是寄托怀人的背景而非最终中心。","anaAI":true},{"t":"s","n":21,"stem":"吴歌产生的主要地域是（ ）。","opts":["江陵","广陵","荆州","建业"],"ans":"D","score":1,"ana":"吴歌主要产生于建业及其周边的江南地区，属于南朝清商曲辞中的地方民歌。江陵、荆州和广陵虽是南方重要城市，但不是吴歌的主要发源区域。","anaAI":true},{"t":"s","n":22,"stem":"从作家主体山水审美意识出发而创作的山水赋出现在（ ）。","opts":["西晋","东晋","南朝","北朝"],"ans":"B","score":1,"ana":"东晋士人开始从主体审美体验出发组织山水赋，不再只是客观铺陈江海奇观；孙绰《游天台山赋》常被视为这一转向的代表。西晋已有山水题材作品，但以山水审美主体意识构成创作中心的代表性发展在东晋。","anaAI":true},{"t":"s","n":23,"stem":"庾信《哀江南赋》的创作特点是（ ）。","opts":["情深辞工，用典密切","骨气奇高，辞采华茂","雕藻淫艳，倾炫心魂","婉转低回，清虚绵渺"],"ans":"A","score":1,"ana":"《哀江南赋》追叙梁朝覆亡和个人流亡，国家兴亡、家世遭际交织，因此情感深沉；其用典密集而精工，辞采与叙事相互支撑。骨气奇高、辞采华茂是曹植评价，雕藻淫艳或清虚绵渺不合庾信此赋的悲慨厚重。","anaAI":true},{"t":"s","n":24,"stem":"开后世诽谐文字先河的志人小说是（ ）。","opts":["《笑林》","《西京杂记》","《世说新语》","《郭子》"],"ans":"A","score":1,"ana":"邯郸淳《笑林》以短小滑稽故事讥刺人物言行，被视为后世诽谐、笑话文字的先声。《世说新语》主要记魏晋名士言谈风度；《西京杂记》《郭子》也非以开创笑话体著称。","anaAI":true},{"t":"s","n":25,"stem":"王绩的代表作《野望》的艺术风格是（ ）。","opts":["平淡自然","婉媚工整","清丽秀逸","音韵清亮"],"ans":"A","score":1,"ana":"王绩《野望》写秋日登高所见，以平易疏淡的语言呈现田园山野和隐居心境，情调自然，不事华饰。婉媚工整、清丽秀逸、音韵清亮都不能概括这首诗以质朴见长的风格。","anaAI":true},{"t":"s","n":26,"stem":"崔颢的名作《黄鹤楼》被推为（ ）。","opts":["初唐七律样板","七律纯熟的标志","唐人七律之首","古今七言律诗第一"],"ans":"C","score":1,"ana":"崔颢《黄鹤楼》被推为唐人七律之首，尤其前四句自然流转、后四句转入乡愁，常被视为七律艺术高度的典范。它当然也是七律成熟的重要标志，但题目所问的传统评语是“唐人七律之首”。","anaAI":true},{"t":"s","n":27,"stem":"韦应物后期诗歌的风格是（ ）。","opts":["沉郁顿挫","闲淡简远","刚健明朗","雄奇奔放"],"ans":"B","score":1,"ana":"韦应物后期诗歌多写闲居、送别和山水，语言疏淡，意境简远，呈现闲淡简远的面貌。沉郁顿挫是杜甫风格，雄奇奔放常指李白，刚健明朗也不符韦诗后期主调。","anaAI":true},{"t":"s","n":28,"stem":"王建的诗歌创作中成就最高的是（ ）。","opts":["乐府诗","格律诗","山水诗","田园诗"],"ans":"A","score":1,"ana":"王建的文学史成就集中在乐府诗，尤其善写宫廷、军旅和民间生活，叙事简洁而能见现实细节。格律、山水、田园都不是其最突出的创作领域。","anaAI":true},{"t":"s","n":29,"stem":"贾岛诗歌创作特点是（ ）。","opts":["以咏史诗著称","以苦吟著称","诗意朦胧","诗风清丽"],"ans":"B","score":1,"ana":"贾岛以苦吟著称，常为一字一句反复推敲，“推敲”典故即与其诗句斟酌有关。其诗境也可能幽僻，但核心标签是刻意锤炼、苦心经营，而非咏史或单纯清丽。","anaAI":true},{"t":"s","n":30,"stem":"皮日休的《读司马法》属于（ ）。","opts":["传奇小说","山水游记","小品文","骈体文"],"ans":"C","score":1,"ana":"皮日休《读司马法》以短篇议论借古书反观现实，属于晚唐小品文。它不是传奇叙事、山水游记，也没有骈文以对偶声律为主的体制。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。","items":[{"t":"m","n":31,"stem":"下列作品属于《九歌》的有","opts":["《东君》","《河伯》","《国殇》","《礼魂》","《橘颂》"],"ans":"ABCD","score":2,"ana":"A《东君》、B《河伯》、C《国殇》、D《礼魂》均列于《九歌》，分别涉及日神、河神、阵亡将士祭歌及祭祀收束歌。《橘颂》是《九章》作品，不属于《九歌》，故E不选。","anaAI":true},{"t":"m","n":32,"stem":"《史记》刻画人物性格的常用手法有","opts":["以个性化语言表现","人物之间的对比衬托","在特定环境中表现","细节描写","心理描写"],"ans":"ABCDE","score":2,"ana":"五项均为《史记》塑造人物的常用办法：用各具身份的语言显出性格，以人物对照凸显差异，在战场、朝堂等环境中显人，在细节中见性情，并通过心理活动呈现动机。它不是单靠作者直接评语完成刻画。","anaAI":true},{"t":"m","n":33,"stem":"下列作品属于北朝散文的有","opts":["郦道元《水经注》","杨衒之《洛阳伽蓝记》","庾信《哀江南赋序》","李密《陈情表》","潘岳《哀永逝文》"],"ans":"AB","score":2,"ana":"郦道元《水经注》和杨衒之《洛阳伽蓝记》分别以地理水道、北魏都城佛寺为中心，是北朝重要散文著作。庾信《哀江南赋序》属南朝末入北后的作品，李密《陈情表》、潘岳《哀永逝文》属西晋，不属北朝散文。","anaAI":true},{"t":"m","n":34,"stem":"陈子昂《感遇》诗的创作特点有","opts":["复归风雅","运用比兴","托物感怀","寄意深远","采丽竞繁"],"ans":"ABCD","score":2,"ana":"陈子昂《感遇》组诗以复归《诗经》风雅精神为文学主张，常用比兴寄托个人怀抱和政治感慨，托物写志而意旨深远。采丽竞繁是他所反对的齐梁诗风，不是《感遇》的创作目标。","anaAI":true},{"t":"m","n":35,"stem":"元稹诗歌内容广阔，形式多样，主要包括","opts":["新乐府诗","艳情诗","悼亡诗","酬唱诗","山水诗"],"ans":"ABCD","score":2,"ana":"A新乐府、B艳情诗、C悼亡诗、D酬唱诗均见元稹多样创作：新乐府有讽喻现实之作，艳情诗与悼亡诗表现个人情感，酬唱诗反映文人交往。E山水诗不是概括其主要创作门类的选项。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"w","n":36,"stem":"《九辩》","ans":"（1）战国时宋玉所作。（2）自悲生平。长于铺排描摹，意境圆融；刻画入微，造语用词很可称道。","score":3,"ana":"《九辩》传统上归宋玉，是楚辞体长篇抒情诗，以秋景萧瑟起兴，反复写时序流逝与士人不遇，核心是自悲生平。作品善铺陈秋气和身世感，景物与情绪层层交融；其铺排、用语精炼又承接楚辞传统。作者归属按传统说法，按现存答案，待核。","anaAI":true},{"t":"w","n":37,"stem":"游仙诗","ans":"（1）以“游仙”为诗名，始于曹植《游仙诗》，东晋郭璞《游仙诗》最为著名。（2）内容或纯写求仙长生，或愤世嫉俗，有所寄托。（3）郭璞的《游仙诗》兼具上述两种内容。","score":3,"ana":"游仙诗以神仙世界、求仙长生或游历仙境为题材，魏晋以后又常借游仙寄托现实中难以实现的理想和愤世情绪。郭璞《游仙诗》兼写仙界想象与对现实污浊的批评，是这一体类的重要代表；“始于曹植”的说法不宜绝对化，游仙母题更早已有，按现存答案，待核。","anaAI":true},{"t":"w","n":38,"stem":"“高岑”","ans":"（1）盛唐诗人高适、岑参以边塞诗齐名，为唐代边塞诗派的代表作家，世称“高岑”。（2）高适、岑参诗多写边塞风光及边塞生活，诗风悲壮。","score":3,"ana":"“高岑”是盛唐边塞诗代表高适、岑参的并称。二人都写塞外风物和军旅生活，但风格并不相同：高适多沉雄悲壮、关注征人现实，岑参则以奇丽想象和新奇景物著称；合称强调其边塞诗成就，不表示二者诗风完全一致。","anaAI":true},{"t":"w","n":39,"stem":"花间词派","ans":"（1）晚唐五代出现的词派，词风婉丽绮靡。（2）因《花间集》而得名。（3）代表词人有温庭筠、韦庄。","score":3,"ana":"花间词派因后蜀赵崇祚编《花间集》得名，活动于晚唐五代至五代，温庭筠、韦庄是代表。词多写男女情思、闺阁生活和宴乐，辞采婉丽绮密；温庭筠偏浓艳精工，韦庄较疏朗，派内仍有差异。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述《史记》“互见法”的文学表现功能。","ans":"（1）“互见法”是《史记》人物传记选用安排材料的重要方法，“互见法”的使用使人物的主要经历完整，主要性格特征鲜明突出。（2）“互见法”的使用又展现了人物丰富的人生经历和多侧面的性格，使事件和人物均有血有肉，完整活泼。","score":5,"ana":"《史记》“互见法”把同一人物的事迹分散到相关篇章：一篇集中呈现主要经历和核心性格，其他篇章补足侧面或保留矛盾材料。这样既避免一传面面俱到、破坏叙事重心，又让读者从不同关系和事件中看到人物的复杂性；例如项羽的经历也在高祖等本纪、列传中互相参照。","anaAI":true},{"t":"w","n":41,"stem":"简述扬雄对大赋创作的拓展。","ans":"（1）拓展了大赋的题材领域。（2）进一步加强了“劝百讽一”的“劝”的色彩。（3）艺术表现的新变化：篇幅相对缩短，描摹对象集中；“以美为讽”的思想表达方式。","score":5,"ana":"扬雄承接司马相如的大赋传统，又将题材从天子游猎扩展到校猎、甘泉、长杨等宫苑活动及祭祀游观；篇幅和描写对象趋于集中，增强讽谏比重。他常先极写宫苑之美，再以结尾劝戒收束，形成“以美为讽”，但作品也显示汉赋“劝百讽一”中铺陈享乐占篇幅较大的张力。","anaAI":true},{"t":"w","n":42,"stem":"简析左思《三都赋》成为京都大赋典范之作的原因。","ans":"（1）内容丰博，详尽细致地描写了蜀、吴、魏三国的山川城邑、马兽草木、风谣歌舞、重要人物。（2）精心锤炼语言，辞藻壮丽，下笔琳琅。（3）一反汉大赋言过于实的弊端，以求实精神去创作。","score":5,"ana":"《三都赋》分别写魏、蜀、吴的山川城邑、物产风俗和人物制度，材料广博且结构有对应，呈现三国地理文化全貌。左思长期搜集资料、锤炼辞句，故能铺写繁富而细节密实；相较汉大赋夸饰失实，他强调依据地理与史实，形成京都大赋的可信度。洛阳纸贵的传说也反映其传播影响。","anaAI":true},{"t":"w","n":43,"stem":"简述杜甫诗歌的写实手法。","ans":"（1）以时事入诗，直面社会现实，发展了汉代乐府民歌“写时事”的优良传统，创立了“即事名篇，无复依傍”的新乐府。（2）采用客观的纪实描写手法。（3）既叙述事件经过，又用力于细部描写。（4）融入强烈的抒情。","score":5,"ana":"杜甫把安史之乱及民生苦难带入诗歌，继承汉乐府“缘事而发”，又以“即事名篇”写新题乐府，如《兵车行》《三吏》《三别》。他常按事件进程交代处境，再抓住衣食、动作、对话等细部让现实可感；叙述中始终有诗人的忧患与同情，因此不是冷静抄录，而是纪实和抒情结合。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"试述《左传》的叙事艺术。","ans":"（1）富有文学表现力的剪裁功夫。主要体现为，在保证真实叙述历史事件的基础上，通过史料的取舍、叙述的详略，使历史事件故事化、情节化。（2）采用全知叙事视角，既保证了历史事件叙述的真实和亲切，也便于引入一些细节描写和人物语言，从而增强事件故事性和意趣。","score":14,"ana":"《左传》叙事先围绕政治、军事因果选择材料，常详写转折和关键言行、略去枝节，使史事呈现为有起伏的故事。《郑伯克段于鄢》从隐患累积到冲突爆发，显出剪裁和伏笔；城濮之战等篇又用人物对话、战场细节推动情节。叙述者能越出单一人物所知，补入背景和预示，形成全知视角；同时因叙事以史事为本，文学组织服务于因果解释。","anaAI":true},{"t":"w","n":45,"stem":"试以具体作品为例，论述孟郊诗歌的创作特点。","ans":"（1）以苦吟著称，注重造语炼字，构思奇特超常。（2）诗多表现凄凉寒苦的贫困生活，诗境幽僻，风格峭硬，笼罩着一股寒气。（3）孟诗也有古朴平易的小诗，如《游子吟》。","score":14,"ana":"孟郊诗以“苦吟”见称，构思和用字常反复锤炼，写寒贫生活时以瘦硬意象造成逼仄冷峭的诗境，如《寒地百姓吟》呈现严寒中百姓生计的艰难。《游子吟》则用慈母缝衣这一日常细节和反问收束，把亲情写得朴素深厚。两类作品并存，说明其创作既有峭硬奇崛，也有古朴平易。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2204","subject":"gws","session":"2204","label":"2022年4月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》中《国风》的篇数是（ ）。","opts":["305","160","74","31"],"ans":"B","score":1,"ana":"《诗经》共有305篇，其中《国风》160篇，分十五国风，是全书中最具地方歌谣色彩的部分。305是全书总数，74和31分别对应其他部分的篇数，不能当作国风篇数。","anaAI":true},{"t":"s","n":2,"stem":"《诗经》中《生民》反映的是（ ）。","opts":["民族历史","爱情婚姻","农业生产","政治时事"],"ans":"A","score":1,"ana":"《生民》属《大雅》，叙述后稷诞生、成长、教民稼穑及祭祀，借祖先神话追溯周族起源，故体现民族历史。诗中有农业活动，但它服务于周人始祖功业的叙述。","anaAI":true},{"t":"s","n":3,"stem":"《诗经·桃夭》中“桃之夭夭，灼灼其华”采用的表现手法是（ ）。","opts":["赋","兴","兴与比","赋与比"],"ans":"C","score":1,"ana "score":2,"ana":"《吴越春秋》以吴越争霸及相关人物为主线，叙事贯通前后，吸收神话、民间传说，增强传奇色彩；因此记史、采传说、连贯成篇三项成立。全书并非凭空编造荒诞故事，也不是各篇彼此割裂。","anaAI":true},{"t":"m","n":33,"stem":"萧梁时代宫体诗的代表作家有","opts":["萧纲","徐摛","沈约","庾肩吾","吴均"],"ans":"ABD","score":2,"ana":"萧纲（梁简文帝）、徐摛、庾肩吾是宫体诗风的重要倡导者和创作者，宫廷生活、女性容貌与闺阁情态是其常见题材。沈约主要是永明体代表，吴均以清新山水诗和骈文著称，不是萧梁宫体诗代表组合。","anaAI":true},{"t":"m","n":34,"stem":"李白乐府诗的创新之处主要表现在","opts":["不用古题，用其本意","借古题写现实","用古题写己怀","即事名篇，无复依傍","打破一切固有格式"],"ans":"BC","score":2,"ana":"李白常借乐府旧题写自己的现实感受和个人怀抱，保留题目传统同时改造题旨，故B、C成立。《兵车行》式“即事名篇、无复依傍”是杜甫新乐府特征；李白也并非一概不用旧题或打破所有格式。","anaAI":true},{"t":"m","n":35,"stem":"唐代传奇在艺术上的主要特点有","opts":["善于描写人物性格","情节波澜起伏，引人入胜","语言华美，凝炼传神","讲唱结合","插入诗歌"],"ans":"ABCE","score":2,"ana":"唐传奇有意识塑造人物，设计曲折情节，语言凝练华美且能传神，并常在叙事中插入诗歌以增添抒情或点题作用。讲唱结合属于变文等讲唱文学特征，不是传奇小说的主要艺术手法。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《国语》","ans":"（1）是我国现存的第一部国别史。（2）记载周王朝及鲁、齐、晋、郑、楚、吴、越各国的史实。（3）以记言为主。","score":3,"ana":"《国语》是按诸侯国分篇的史书，记周及鲁、齐、晋、郑、楚、吴、越等国史事，现存最早的国别体史书。它尤其重视记载人物言论，常借臣子进谏和君主答问显出政治得失；与《左传》较重叙事相比，“记言为主”是其体例特点。","anaAI":true},{"t":"term","n":37,"stem":"永明体","ans":"（1）南朝永明年间出现的一种新诗体。（2）讲究诗歌格律，创四声八病之说，代表作家是沈约。","score":3,"ana":"“永明体”形成于南朝齐永明年间，沈约、谢朓等在创作中自觉讲究平、上、去、入四声及声律协调。沈约总结四声、八病之说，推动诗歌从古体向近体格律演进；它是声律趋于自觉的过渡诗体，并非唐律已经完全定型。","anaAI":true},{"t":"term","n":38,"stem":"韩孟诗派","ans":"（1）中唐时期出现的诗歌流派，以韩愈、孟郊为代表，包括李贺。（2）诗风尚怪奇，重主观。","score":3,"ana":"韩孟诗派以韩愈、孟郊为核心，李贺等可纳入其创作趋向，强调个性表达和奇险造语。韩诗好议论、气势奇崛，孟诗锤炼冷硬，李贺以瑰丽诡谲想象见长；“尚怪奇、重主观”概括其共同倾向，但不能抹平个人差异。","anaAI":true},{"t":"term","n":39,"stem":"敦煌曲子词","ans":"（1）在敦煌发现的早期民间词。（2）内容多涉及男女之情。（3）风格朴素，富于生活气息。","score":3,"ana":"敦煌曲子词是敦煌文献中保存的早期民间词作，展示词体在文人定型前的民间形态。内容不只男女之情，也写征戍、行旅、劳动与日常生活；语言多朴素直白，带有现场生活气息，为词史补足了传世文献之外的材料。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述汉初辞赋创作的发展趋向。","ans":"（1）贾谊、枚乘赋作的不同特点反映了汉初辞赋创作的发展趋向。（2）贾谊赋抒情言志，质朴无华；枚乘赋铺叙描摹，辞藻华丽。（3）贾谊赋是骚体赋，枚乘赋发展为大赋。","score":5,"ana":"汉初辞赋从贾谊的楚骚传统抒情赋，逐步走向枚乘《七发》开拓的铺陈体大赋。贾谊以屈原式自况寄托被贬之愤，语言较质直；枚乘铺叙声色物象、层层设问，辞采和规模增强，形成由个人抒情向宏大铺陈转变的轨迹。","anaAI":true},{"t":"w","n":41,"stem":"简述《古诗十九首》的情思内涵。","ans":"（1）表现离情别绪、人生的失意和无常之感。（2）表现游子士人对生存状态的感受及人生的某些观念。","score":5,"ana":"《古诗十九首》多写游子与思妇的离别相思，也反复追问人生短促、仕途失意和及时行乐等问题。“行行重行行”“迢迢牵牛星”呈现离别之苦，“生年不满百”等则把个体愁情推向人生无常，体现东汉末文人普遍的生存焦虑。","anaAI":true},{"t":"w","n":42,"stem":"简述曹丕诗歌的艺术特点。","ans":"（1）创造了七言诗的一种新形式。（2）语言绮丽工练，抒情深婉细腻，形成一种便娟婉约的纤丽清新风格。（3）述怀之作写得清峻悲凉。","score":5,"ana":"曹丕《燕歌行》是现存完整七言诗的重要早期作品，显示他推动七言诗体发展的作用；其诗语言绮丽而经锤炼，善写相思、离别等细腻心理，形成纤丽清新的婉约面貌。述怀诗又常露出清峻悲凉，不能把他简化成单一柔婉风格。","anaAI":true},{"t":"w","n":43,"stem":"简述王昌龄边塞诗的特点。","ans":"（1）情调苍凉悲壮。（2）讲究立意构思，绪密思清。","score":5,"ana":"王昌龄边塞诗常把建功愿望与战争艰苦、征人离愁并置，形成苍凉悲壮的情调；《出塞》以“秦时明月汉时关”压缩历史纵深，《从军行》以烽火、孤城写现实处境。他擅长构思凝练、层次缜密，情绪含蓄而线索清楚，即“绪密思清”。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"试述屈原《离骚》的思想内容。","ans":"（1）“美政”理想和深沉的爱国情感。（2）追求理想九死不悔的坚韧品格和嫉恶如仇的批判精神。","score":14,"ana":"《离骚》以屈原的政治理想和个人遭际为主线：他希望君王修明法度、举贤授能，形成“美政”理想；楚国危亡和忠而被谗又使作品充满爱国忧思。诗人多次申明修身自守、九死不悔，并通过揭露党人妒贤、朝政昏乱表达嫉恶如仇的批判精神，最终以神游求索表现理想受阻仍不放弃。","anaAI":true},{"t":"w","n":45,"stem":"试以具体作品为例，论述杜甫诗歌的写实手法。","ans":"（1）以时事入诗，直面社会现实，继承了《诗经》《离骚》的爱国忧民精神，又发展了两汉乐府民歌“写时事”的传统，创立了“即事名篇，无复依傍”的新乐府，采用客观纪实描写手法。（2）既叙事件经过，又用力于细部描写。（3）在写实中融入强烈的感情。","score":14,"ana":"杜甫把时事直接写入诗歌，继承《诗经》忧民传统和汉乐府叙事方式，又创作“即事名篇”的新题乐府。《兵车行》从征人答问写到家中生死离散，《石壕吏》以夜间搜捕和老妇应对呈现兵役压迫；这类诗不只交代事件，还抓住动作、对话、环境细节，并将叙事与悲悯、愤慨交织。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2210","subject":"gws","session":"2210","label":"2022年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》是我国第一部诗歌总集，收录诗歌（ ）。","opts":["160篇","300篇","305篇","311篇"],"ans":"C","score":1,"ana":"《诗经》全书现存305篇（另有笙诗六篇有目无辞），故选305篇。160篇是《国风》的篇数；“诗三百”只是约称，不等于精确篇数，311也把有目无辞的篇目计入了。","anaAI":true},{"t":"s","n":2,"stem":"《诗经·豳风·七月》的主要内容是（ ）。","opts":["描写婚恋生活","揭露宫闱丑行","歌颂祖先功德","反映农事活动"],"ans":"D","score":1,"ana":"《七月》是《豳风》中按月份铺写衣食、耕作、狩猎和储藏的农事诗，反映周人农业生产及劳作秩序，故选D。其余选项与诗篇内容不符。","anaAI":true},{"t":"s","n":3,"stem":"《春秋》的语言特点是（ ）。","opts":["准确简明","佶屈聱牙","铺排纵恣"," 细","语言典雅凝练，笔法谨严","行文富于变化，挥洒自如","和《史记》一样有深浓的情感","一些人物传记能传达人物的神貌和性格"],"ans":"ABE","score":2,"ana":"《汉书》以班固一人及班昭、马续续成，结构谨严、语言典雅凝练；《李广苏建传》等人物传记能通过言行细节传神写性，所以A、B、E成立。其整体感情较《史记》内敛，不以挥洒自如和强烈主观抒情见长，故C、D不选。","anaAI":true},{"t":"m","n":33,"stem":"蔡琰《悲愤诗》的艺术特点有","opts":["写亲身经历，感情真实","心理刻画细腻","注重细节描写","叙事、抒情融为一体","具有史诗般的效果"],"ans":"[答案待核：合订本答案页扫描键字形不清，读取为ABODE（含非选项字母O）；不自动评分]","score":2,"ana":"五项均能说明蔡琰《悲愤诗》的艺术特点：作品以被掳、归汉等亲历为叙事基础，真切呈现离乱；对恐惧、思亲与骨肉分离刻画细腻，并写具体场景细节；叙事推进与悲愤抒情交融，长篇结构具有史诗般的历史广度。","anaAI":true,"qaNotes":"依据现存逐套QA台账的来源错配记录暂时禁用，不作内容猜测。"},{"t":"m","n":34,"stem":"李白无题诗的艺术特色是","opts":["朦胧婉曲","沉郁顿挫","主题多义","兴寄深微","写实尚俗"],"ans":"ACD","score":2,"ana":"李白无题诗多借意象和象征传情，语意不明说到底，形成朦胧婉曲；同一形象可承载爱情、身世等不同理解，故主题多义、兴寄深微。沉郁顿挫是杜甫风格，写实尚俗不适合概括李白无题诗。","anaAI":true},{"t":"m","n":35,"stem":"古文运动中韩愈的理论主张有","opts":["文以明道","惟陈言之务去","不平则鸣","用事绵密","声律严整"],"ans":"ABC","score":2,"ana":"韩愈倡“文以明道”，要求文章承载儒家道统；又主张“惟陈言之务去”，反对沿袭旧套，并以“不平则鸣”解释文学表达的情感动力。用事绵密、声律严整不是其古文理论核心，古文运动也不以骈体声律为目标。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《逸周书》","ans":"（1）本名《周书》。（2）现存60篇，另有11篇存目。（3）向来被视为《尚书》的余篇或逸篇。","score":3,"ana":"《逸周书》本名《周书》，传世本六十篇，另有十一篇仅存篇目。它保存先秦至周代政治、军事、制度资料，传统上常被看作《尚书》未收或散佚的周代文献；但现存篇章成书层次不一，不能简单当成《尚书》的同一部分。","anaAI":true},{"t":"term","n":37,"stem":"宫体诗","ans":"（1）以写闺阁情怀为主要内容。（2）重声律、词采丽靡清艳。（3）发端于齐梁之际，至萧纲及其周围文人时达到全盛。","score":3,"ana":"宫体诗兴盛于梁代萧纲（即简文帝）周围，题材集中于宫廷、闺阁和女性情态，语言讲究声律、词采，风格丽靡清艳。其先声可追溯到齐梁之际的宫廷诗风，到萧纲、徐摛、庾肩吾等人的创作中达到全盛；“宫体”说的是题材和审美取向，不只是某一种格律。","anaAI":true},{"t":"term","n":38,"stem":"元白诗派","ans":"（1）中唐时期出现的诗歌流派。（2）诗歌写实尚俗。（3）代表作家是元稹、白居易。","score":3,"ana":"元白诗派以元稹、白居易为代表，盛行于中唐，倡导新乐府和通俗易懂的表达，关注现实民生、社会弊政，带有写实尚俗倾向。两人常合作唱和，但诗风并非完全相同：白居易讽谕诗面向政事，元稹亦有艳情、悼亡等个人题材。","anaAI":true},{"t":"term","n":39,"stem":"唐传奇","ans":"（1）唐代文言小说。（2）一般故事情节曲折，人物形象鲜明，语言华美。","score":3,"ana":"唐传奇是唐代成熟的文言小说，较六朝志怪更有自觉的虚构经营，常以曲折情节、鲜明人物和精炼华美的语言营造故事。《李娃传》《霍小玉传》等写爱情与社会处境，作品常有作者议论或诗歌穿插，显示小说叙事意识增强。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述司马迁的生平遭际与《史记》创作的关系。","ans":"（1）家世渊源的影响。出生史官世家，受家族浓厚的文化气氛影响，立志著史。（2）漫游各地，实地考察历史遗迹。（3）李陵事件的影响，发愤著书。","score":5,"ana":"司马迁出身史官世家，父亲司马谈任太史令，家学和宫廷文献条件使他早有继承史职、续写史书的志愿；青年时漫游各地，实地访求掌故，补充了书本记载。李陵之祸后，他受宫刑而未能以死自明，遂把个人受辱、对历史不公的愤懑转化为“究天人之际，通古今之变”的写作动力，完成《史记》。","anaAI":true},{"t":"w","n":41,"stem":"简述司马相如《长门赋》的艺术特点。","ans":"（1）将陈皇后的遭际与作者的悲凉融为一体，共抒悲郁孤愤之情。（2）抒情手法纯熟，情景交融。","score":5,"ana":"《长门赋》托陈皇后失宠幽居、盼君不至的处境，写宫怨也映照作者对仕途失意的感受，故悲郁不只是替人物代言。赋中由居室、夜色、风声等景物触发心理变化，环境与孤独心境互相映衬，展现汉代抒情小赋情景交融的技巧。","anaAI":true},{"t":"w","n":42,"stem":"简述建安时期辞赋创作的特点。","ans":"（1）有一个自觉主动进行辞赋创作的作者群，并进行理论探讨。（2）题材更为广泛。（3）抒情性进一步加强。（4）在艺术形式上讲求辞藻与形式工齐之美。","score":5,"ana":"建安时期形成了自觉创作辞赋的文人群体，曹丕《典论·论文》等还把文学作为独立事业加以讨论。题材不再局限于汉大赋宫苑田猎，出现宴饮、赠答、咏物和抒情；个人身世情感进入赋作，使抒情性增强。同时作品仍重视辞藻和整饬形式，反映建安风骨与文采经营并存。","anaAI":true},{"t":"w","n":43,"stem":"简述杜甫律诗的创作成就。","ans":"（1）五律七律兼擅，五律纯熟，运用自如，韵律精细，诗境浑成，富于变化。七律境界阔大，感慨深沉，极尽变化，工巧而能自然，达到炉火纯青的地步。（2）以律诗写组诗，扩大了律诗的表现力。七律组诗最为成功。","score":5,"ana":"杜甫五律、七律兼擅：五律章法纯熟，能在严整声律中容纳广阔现实与复杂情绪；七律则善于转折、对仗和层次经营，工整而不板滞。《登高》把登临所见、身世衰老和时代动荡压进八句，被誉为七律典范。他又以律诗写组诗，如《秋兴八首》，让单篇格律承载连续叙事和多层情感，拓宽律诗表现容量。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"试论《离骚》的艺术特点。","ans":"（1）浓烈的激情和奇幻的想象。（2）峻洁纯美、独立不屈的抒情主人公形象。（3）比兴手法的拓展。（4）在结构上围绕中心谋篇布局，前实后虚，使艺术境界层进层新，思想感情得到尽情挥洒。（5）句式长短不拘，韵句散语相间，语言丰富多姿，双声叠韵比比皆是，吸收方言入诗。","score":14,"ana":"《离骚》把政治抒情和神话想象结合：现实中陈述理想受挫，幻想中则上叩天门、周流上下，情感因而具有强烈张力。抒情主人公以香草、美人自况，坚守洁净人格；香草美人等比兴由局部譬喻扩展成贯穿全篇的象征系统。结构围绕求索理想展开，前半实写政治遭际、后半转入神游求女，层层推进；长短句交错、楚地方言和双声叠韵又使语言富于节奏与地域色彩。","anaAI":true},{"t":"w","n":45,"stem":"试以具体作品为例，论述李白诗歌的意象特点和语言风格。","ans":"（1）颇多雄奇壮伟的诗歌意象。（2）不乏清新明丽的优美意象。（3）语言清新、明快、爽朗，不加雕饰。","score":14,"ana":"李白诗常用大尺度意象写精神力量，如《蜀道难》以高山、绝壁和飞湍营造雄奇险峻，《将进酒》以黄河、明月放大生命豪情；《望庐山瀑布》《早发白帝城》又有明丽轻快的画面。语言总体清新、明快、爽朗，善用口语和夸张而少雕琢；但《蜀道难》等也显示其句式变化、想象跳跃，不能简单理解为平淡无奇。","anaAI":true}]}],"qaNotes":["答案核对修正：Q2《诗经·豳风·七月》、Q3《春秋》语言特点、Q4《庄子》引文均与gws-2110同题且选项文本完全一致；本卷原键与同题卷/作品出处不符，按相同选项文本改为D/A/B。","题目答案来源限制：暂禁用来源错配风险项自动评分，待原答案页逐题复核。"]},{"paper":"gws-2304","subject":"gws","session":"2304","label":"2
