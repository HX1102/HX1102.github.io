ingle","prompt":"中世纪奥古斯丁在《忏悔录》中批判世俗文艺,其核心理由是","options":[{"key":"A","text":"世俗文艺缺乏优美的形式"},{"key":"B","text":"世俗文艺违背基督教道德教义"},{"key":"C","text":"世俗文艺无法反映自然真实"},{"key":"D","text":"世俗文艺不符合古典创作规则"}],"key":"B","answer":"世俗文艺违背基督教道德教义","max":1,"id":"西方文论-4-single-3"},{"n":4,"type":"single","prompt":"文艺复兴时期,锡德尼在《为诗辩护》中反驳“诗孕育谎言”的指责,认为诗的虚构","options":[{"key":"A","text":"是对现实的歪曲,应被禁止"},{"key":"B","text":"是揭示普遍真理的手段,非谎言"},{"key":"C","text":"仅为娱乐,无需关注真实性"},{"key":"D","text":"需严格遵循历史事实,不可虚构"}],"key":"B","answer":"是揭示普遍真理的手段,非谎言","max":1,"id":"西方文论-4-single-4"},{"n":5,"type":"single","prompt":"新古典主义时期,高特雪特在《批判的诗学》中引入法国新古典主义原则,其目的是","options":[{"key":"A","text":"推动德国文学摆脱法国影响"},{"key":"B","text":"建立德国统一的民族文学"},{"key":"C","text":"强化教会对文学的控制"},{"key":"D","text":"迎合贵族阶层的审美需求"}],"key":"B","answer":"建立德国统一的民族文学","max":1,"id":"西方文论-4-single-5"},{"n":6,"type":"single","prompt":"启蒙主义文论中,狄德罗在《论戏剧诗》中主张戏剧应“真实地再现典型环境中的典型人物”,其“典型环境”指","options":[{"key":"A","text":"符合理性的理想环境"},{"key":"B","text":"反映社会本质的现实环境"},{"key":"C","text":"古希腊戏剧中的传统场景"},{"key":"D","text":"作家想象的奇幻环境"}],"key":"B","answer":"反映社会本质的现实环境","max":1,"id":"西方文论-4-single-6"},{"n":7,"type":"single","prompt":"康德在《判断力批判》中提出“审美无功利性”,指审美活动","options":[{"key":"A","text":"不涉及实际利益与欲望满足"},{"key":"B","text":"无需依赖理性判断"},{"key":"C","text":"完全脱离现实世界"},{"key":"D","text":"仅关注作品的形式技巧"}],"key":"A","answer":"不涉及实际利益与欲望满足","max":1,"id":"西方文论-4-single-7"},{"n":8,"type":"single","prompt":"席勒在《论悲剧艺术》中认为,悲剧的核心效果是","options":[{"key":"A","text":"引发单纯的悲伤情绪"},{"key":"B","text":"净化过度的怜悯与恐惧"},{"key":"C","text":"批判社会的黑暗现实"},{"key":"D","text":"宣扬宗教的救赎思想"}],"key":"B","answer":"净化过度的怜悯与恐惧","max":1,"id":"西方文论-4-single-8"},{"n":9,"type":"single","prompt":"黑格尔在《美学》中认为,古典型艺术的最高成就体现在","options":[{"key":"A","text":"埃及金字塔的象征意义"},{"key":"B","text":"古希腊雕塑的人体美"},{"key":"C","text":"中世纪宗教绘画的神圣性"},{"key":"D","text":"近代抒情诗的情感表达"}],"key":"B","answer":"古希腊雕塑的人体美","max":1,"id":"西方文论-4-single-9"},{"n":10,"type":"single","prompt":"浪漫主义文论中,海涅在《论浪漫派》中批判德国浪漫派,其核心是","options":[{"key":"A","text":"浪漫派过度模仿法国文学"},{"key":"B","text":"浪漫派美化中世纪,脱离现实"},{"key":"C","text":"浪漫派忽视形式创新"},{"key":"D","text":"浪漫派缺乏民族特色"}],"key":"B","answer":"浪漫派美化中世纪,脱离现实","max":1,"id":"西方文论-4-single-10"},{"n":11,"type":"single","prompt":"现实主义文论中,别林斯基提出“形象思维”,认为其本质是","options":[{"key":"A","text":"用形象传达理性真理"},{"key":"B","text":"对现实的机械摹仿"},{"key":"C","text":"艺术家主观情感的随意抒发"},{"key":"D","text":"脱离现实的想象活动"}],"key":"A","answer":"用形象传达理性真理","max":1,"id":"西方文论-4-single-11"},{"n":12,"type":"single","prompt":"19世纪末20世纪初,朗松的“文学史研究”主张","options":[{"key":"A","text":"仅关注作家生平,忽视作品文本"},{"key":"B","text":"结合社会学与传记方法,兼顾客观与审美"},{"key":"C","text":"完全依赖科学实证,排斥主观解读"},{"key":"D","text":"聚焦读者接受,忽视文本自身意义"}],"key":"B","answer":"结合社会学与传记方法,兼顾客观与审美","max":1,"id":"西方文论-4-single-12"},{"n":13,"type":"single","prompt":"马拉美作为象征主义代表,主张“纯诗”的核心是","options":[{"key":"A","text":"以现实题材为主,反映社会矛盾"},{"key":"B","text":"追求语言的自主性与意象的神秘性"},{"key":"C","text":"严格遵循古典格律,注重形式规范"},{"key":"D","text":"直白表达作家的情感与思想"}],"key":"B","answer":"追求语言的自主性与意象的神秘性","max":1,"id":"西方文论-4-single-13"},{"n":14,"type":"single","prompt":"尼采在《权力意志》中提出“超人哲学”,认为文学应","options":[{"key":"A","text":"歌颂强者的生命意志,超越庸常"},{"key":"B","text":"同情弱者,批判社会不公"},{"key":"C","text":"宣扬基督教的博爱精神"},{"key":"D","text":"追求理性的绝对权威"}],"key":"A","answer":"歌颂强者的生命意志,超越庸常","max":1,"id":"西方文论-4-single-14"},{"n":15,"type":"single","prompt":"俄国形式主义中,托马舍夫斯基提出“情节与故事”的区分,其中“故事”指","options":[{"key":"A","text":"文本中事件的实际顺序"},{"key":"B","text":"文本中事件的叙述顺序"},{"key":"C","text":"作家构思的原始素材"},{"key":"D","text":"读者解读的主观结果"}],"key":"A","answer":"文本中事件的实际顺序","max":1,"id":"西方文论-4-single-15"},{"n":16,"type":"single","prompt":"英美新批评中,布鲁克斯提出“反讽”理论,认为其是","options":[{"key":"A","text":"文本中矛盾意义的和谐统一"},{"key":"B","text":"对现实的直接批判"},{"key":"C","text":"语言的错误使用"},{"key":"D","text":"作家的无意失误"}],"key":"A","answer":"文本中矛盾意义的和谐统一","max":1,"id":"西方文论-4-single-16"},{"n":17,"type":"single","prompt":"结构主义文论中,巴尔特提出“作者之死”,其内涵是","options":[{"key":"A","text":"否定作家在文学活动中的作用"},{"key":"B","text":"强调读者对文本意义的建构"},{"key":"C","text":"主张文学创作无需作者"},{"key":"D","text":"批判作家的个人主义倾向"}],"key":"B","answer":"强调读者对文本意义的建构","max":1,"id":"西方文论-4-single-17"},{"n":18,"type":"single","prompt":"西方马克思主义文论中,伊格尔顿提出“文学与意识形态”的关系,认为文学","options":[{"key":"A","text":"是意识形态的直接反映"},{"key":"B","text":"与意识形态无关,具有自主性"},{"key":"C","text":"既受意识形态制约,又可批判意识形态"},{"key":"D","text":"是意识形态的唯一载体"}],"key":"C","answer":"既受意识形态制约,又可批判意识形态","max":1,"id":"西方文论-4-single-18"},{"n":19,"type":"single","prompt":"读者接受文论中,费什提出“解释团体”,指","options":[{"key":"A","text":"具有相同解读规则的读者群体"},{"key":"B","text":"作家为特定读者群体创作"},{"key":"C","text":"批评家组成的专业解读团队"},{"key":"D","text":"文本预设的理想读者群体"}],"key":"A","answer":"具有相同解读规则的读者群体","max":1,"id":"西方文论-4-single-19"},{"n":20,"type":"single","prompt":"后结构主义文论中,米勒提出“重复”理论,认为文本中的重复","options":[{"key":"A","text":"强化文本意义的稳定性"},{"key":"B","text":"消解文本意义的确定性"},{"key":"C","text":"仅为形式技巧,无深层意义"},{"key":"D","text":"是作家缺乏创造力的表现"}],"key":"B","answer":"消解文本意义的确定性","max":1,"id":"西方文论-4-single-20"},{"n":21,"type":"fill","prompt":"亚里士多德在《诗学》中指出,悲剧的“净化”作用是通过引发 ______ 与恐惧来实现的。","options":[],"key":"怜悯","answer":"怜悯","max":2,"id":"西方文论-4-fill-21"},{"n":22,"type":"fill","prompt":"中世纪托马斯·阿奎那认为,美的三个条件是整一、比例和(明晰 ______ )。","options":[],"key":"或“鲜亮”","answer":"或“鲜亮”","max":2,"id":"西方文论-4-fill-22"},{"n":23,"type":"fill","prompt":"文艺复兴时期,但丁在《致斯加拉亲王书》中指出,《神曲》的寓言意义是“人由 ______ 的选择,照其功或过,应得正义的赏或罚”。","options":[],"key":"自由意志","answer":"自由意志","max":2,"id":"西方文论-4-fill-23"},{"n":24,"type":"fill","prompt":"新古典主义时期,屈雷顿在《论诗剧》中通过“诗韵之争”,主张严肃剧应使用(诗韵 ______ )增强表现力。","options":[],"key":"或“韵文”","answer":"或“韵文”","max":2,"id":"西方文论-4-fill-24"},{"n":25,"type":"fill","prompt":"启蒙主义文论中,莱辛在《汉堡剧评》中批判法国新古典主义,推崇(莎士比亚)的戏剧成就 ______ 。","options":[],"key":"填作家","answer":"填作家","max":2,"id":"西方文论-4-fill-25"},{"n":26,"type":"fill","prompt":"歌德在《诗与真》中提出“艺术是第二自然”,强调艺术对自然的(提炼 ______ )与超越。","options":[],"key":"或“加工”“创造”","answer":"或“加工”“创造”","max":2,"id":"西方文论-4-fill-26"},{"n":27,"type":"fill","prompt":"浪漫主义文论中,华兹华斯主张诗歌语言应采用(平民 ______ )的日常语言,摒弃华丽辞藻。","options":[],"key":"或“乡村”“质朴”","answer":"或“乡村”“质朴”","max":2,"id":"西方文论-4-fill-27"},{"n":28,"type":"fill","prompt":"现实主义文论中,车尔尼雪夫斯基在《艺术对现实的审美关系》中提出“美是 ______ ”,确立现实主义的审美基础。","options":[],"key":"生活","answer":"生活","max":2,"id":"西方文论-4-fill-28"},{"n":29,"type":"fill","prompt":"象征主义文论中,波德莱尔的“恶之美”指在(丑恶 ______ )中挖掘美的价值,如《恶之花》对城市丑恶的描写。","options":[],"key":"或“恶”“负面现象”","answer":"或“恶”“负面现象”","max":2,"id":"西方文论-4-fill-29"},{"n":30,"type":"fill","prompt":"德里达的解构主义中,“延异”既指意义的差异,也指意义的(延迟 ______ )。","options":[],"key":"或“延宕”","answer":"或“延宕”","max":2,"id":"西方文论-4-fill-30"},{"n":31,"type":"term","prompt":"理念论(柏拉图)","options":[],"key":"","answer":"柏拉图哲学的出发点和基本原则。理念本义是“看见的东西”,转义为灵魂所见的东西。在柏拉图看来,理念是现实感性世界的根据,作为事物的共相,不生不灭、不变不动。他以理念论为基础提出艺术模仿论,认为文艺是对理念的间接模仿。","max":3,"id":"西方文论-4-term-31"},{"n":32,"type":"term","prompt":"文学接受史(姚斯)","options":[],"key":"","answer":"接受美学代表姚斯提出的核心概念,主张突破“文本中心”局限,转向“读者接受”的历史维度。姚斯认为作品的意义并非由文本单方面决定,而是在不同时代读者的解读中动态生成。 他主张结合“接受史”考察作品意义的演变。","max":3,"id":"西方文论-4-term-32"},{"n":33,"type":"term","prompt":"二项对立(列维-斯特劳斯)","options":[],"key":"","answer":"结构主义人类学家列维-斯特劳斯提出的核心分析方法,后被用于文学文本解读。二项对立指人类思维中普遍存在的二元对立逻辑,是文化意义生成的基础。文学分析可挖掘文本的二项对立结构,揭示文化编码与思维模式。","max":3,"id":"西方文论-4-term-33"},{"n":34,"type":"short","prompt":"简述亚里士多德《诗学》中悲剧“情节整一性”的具体要求。","options":[],"key":"","answer":"亚里士多德在《诗学》中提出的悲剧“情节整一性”,是悲剧创作的核心规范,要求包括: (1)情节的完整性:情节需有“开头、中间、结尾”,三者构成整体,不可随意拆分。 (2)情节的连贯性:构成情节的事件需有必然或可然的因果关系,避免偶然事件堆砌。 (3)情节的适度长度:长度需完整展现人物由顺境转入逆境的行动。","max":5,"id":"西方文论-4-short-34"},{"n":35,"type":"short","prompt":"简析英美新批评中“意图谬误”与“感受谬误”的内涵。","options":[],"key":"","answer":"英美新批评提出“意图谬误”与“感受谬误”,旨在排除文本外因素对批评的干扰:(1)意图谬误:由维姆萨特与比尔兹利提出,指把作家创作意图作为解读文本的依据,批评应关注文本本身,文本完成后便独立于作家。(2)感受谬误:指把读者主观感受作为评判文本的标准,批评应关注文本的客观意义。","max":5,"id":"西方文论-4-short-35"},{"n":36,"type":"essay","prompt":"结合具体文论流派与观点,论述西方文论从“文本中心”向“读者中心”的转型逻辑。","options":[],"key":"","answer":"一、前期:“文本中心”主导:(1)俄国形式主义主张文本形式即本质;(2)英美新批评提出“意图谬误”“感受谬误”。 二、过渡:英加登提出“未定点”,认为空白需读者“审美具体化”填补;伽达默尔提出“视域融合”,认为意义是前理解与文本视域融合的结果。 三、转型:“读者中心”确立:(1)姚斯主张作品意义在读者解读中动态生成;(2)伊瑟尔的“召唤结构”认为读者填补空白即实现意义。","max":15,"id":"西方文论-4-essay-36"}],"rawMax":74},{"id":"西方文论-5","title":"章节练习(绪论)","questions":[{"n":1,"type":"single","prompt":"西方文论的核心研究对象是","options":[{"key":"A","text":"东方文学创作实践"},{"key":"B","text":"西方文学的理论与批评"},{"key":"C","text":"民间文学的传播规律"},{"key":"D","text":"文学翻译的技巧方法"}],"key":"B","answer":"西方文学的理论与批评","max":1,"id":"西方文论-5-single-1"},{"n":2,"type":"single","prompt":"以下不属于西方文论萌芽阶段代表性思潮的是","options":[{"key":"A","text":"古希腊模仿说"},{"key":"B","text":"古罗马贺拉斯的诗学理论"},{"key":"C","text":"中世纪神学文论"},{"key":"D","text":"结构主义文论"}],"key":"D","answer":"结构主义文论","max":1,"id":"西方文论-5-single-2"},{"n":3,"type":"single","prompt":"西方文论发展中,首次系统探讨文学“寓教于乐”功能的理论家是","options":[{"key":"A","text":"柏拉图"},{"key":"B","text":"亚里士多德"},{"key":"C","text":"贺拉斯"},{"key":"D","text":"朗吉弩斯"}],"key":"C","answer":"贺拉斯","max":1,"id":"西方文论-5-single-3"},{"n":4,"type":"single","prompt":"西方文论与文学创作的关系是","options":[{"key":"A","text":"文论依附于创作,无独立价值"},{"key":"B","text":"创作完全遵循文论规范"},{"key":"C","text":"二者相互影响,文论指导创作又源于创作"},{"key":"D","text":"二者毫无关联,各自独立发展"}],"key":"C","answer":"二者相互影响,文论指导创作又源于创作","max":1,"id":"西方文论-5-single-4"},{"n":5,"type":"single","prompt":"以下属于西方现代文论范畴的是","options":[{"key":"A","text":"古希腊的模仿理论"},{"key":"B","text":"文艺复兴时期的人文主义文论"},{"key":"C","text":"19世纪的浪漫主义文论"},{"key":"D","text":"20世纪的存在主义文论"}],"key":"D","answer":"20世纪的存在主义文论","max":1,"id":"西方文论-5-single-5"},{"n":6,"type":"single","prompt":"学习西方文论的首要意义在于","options":[{"key":"A","text":"掌握单一的文学批评标准"},{"key":"B","text":"理解西方文学的理论根基与批评逻辑"},{"key":"C","text":"直接复制西方文学创作模式"},{"key":"D","text":"替代对东方文论的学习"}],"key":"B","answer":"理解西方文学的理论根基与批评逻辑","max":1,"id":"西方文论-5-single-6"},{"n":7,"type":"single","prompt":"西方文论发展史上,将“理念”作为文学创作终极本源的理论家是","options":[{"key":"A","text":"亚里士多德"},{"key":"B","text":"柏拉图"},{"key":"C","text":"康德"},{"key":"D","text":"黑格尔"}],"key":"B","answer":"柏拉图","max":1,"id":"西方文论-5-single-7"},{"n":8,"type":"single","prompt":"以下不属于西方文论研究范畴的是","options":[{"key":"A","text":"文学作品的审美特征分析"},{"key":"B","text":"文学创作的心理机制探讨"},{"key":"C","text":"文学与社会文化的关联研究"},{"key":"D","text":"具体文学作品的商业营销策略"}],"key":"D","answer":"具体文学作品的商业营销策略","max":1,"id":"西方文论-5-single-8"},{"n":9,"type":"single","prompt":"西方近代文论与古典文论的核心区别在于","options":[{"key":"A","text":"是否关注文学作品"},{"key":"B","text":"是否以人文主义为思想内核"},{"key":"C","text":"是否采用文字表述理论"},{"key":"D","text":"是否涉及文学批评实践"}],"key":"B","answer":"是否以人文主义为思想内核","max":1,"id":"西方文论-5-single-9"},{"n":10,"type":"single","prompt":"提出“悲剧净化说”的西方文论家是","options":[{"key":"A","text":"柏拉图"},{"key":"B","text":"亚里士多德"},{"key":"C","text":"贺拉斯"},{"key":"D","text":"西塞罗"}],"key":"B","answer":"亚里士多德","max":1,"id":"西方文论-5-single-10"},{"n":11,"type":"single","prompt":"西方文论中,强调文学“表现情感”而非“模仿现实”的思潮始于","options":[{"key":"A","text":"古典主义文论"},{"key":"B","text":"浪漫主义文论"},{"key":"C","text":"现实主义文论"},{"key":"D","text":"自然主义文论"}],"key":"B","answer":"浪漫主义文论","max":1,"id":"西方文论-5-single-11"},{"n":12,"type":"single","prompt":"学习西方文论时,“历史语境分析法”的核心是","options":[{"key":"A","text":"忽略历史背景,仅解读理论文本"},{"key":"B","text":"结合理论产生的时代社会条件理解其内涵"},{"key":"C","text":"用当代视角完全重构历史理论"},{"key":"D","text":"仅关注理论家的个人生平"}],"key":"B","answer":"结合理论产生的时代社会条件理解其内涵","max":1,"id":"西方文论-5-single-12"},{"n":13,"type":"single","prompt":"以下属于西方文论中“形式主义”思潮核心观点的是","options":[{"key":"A","text":"文学价值在于反映社会现实"},{"key":"B","text":"文学研究应聚焦文本的语言形式与结构"},{"key":"C","text":"文学的本质是表现作者情感"},{"key":"D","text":"文学批评需关注读者的接受体验"}],"key":"B","answer":"文学研究应聚焦文本的语言形式与结构","max":1,"id":"西方文论-5-single-13"},{"n":14,"type":"single","prompt":"西方文论发展的动力不包括","options":[{"key":"A","text":"文学创作实践的不断革新"},{"key":"B","text":"社会思潮的更迭演变"},{"key":"C","text":"自然科学技术的进步"},{"key":"D","text":"理论家个人的主观臆断"}],"key":"D","answer":"理论家个人的主观臆断","max":1,"id":"西方文论-5-single-14"},{"n":15,"type":"single","prompt":"“接受美学”作为西方文论思潮,其核心研究重点是","options":[{"key":"A","text":"文学作品的创作过程"},{"key":"B","text":"文学作品的文本结构"},{"key":"C","text":"读者对作品的接受与解读过程"},{"key":"D","text":"文学与社会的关系"}],"key":"C","answer":"读者对作品的接受与解读过程","max":1,"id":"西方文论-5-single-15"},{"n":16,"type":"fill","prompt":"西方文论的研究范畴涵盖文学创作、文本解读和 ______ 等核心领域。","options":[],"key":"文学批评","answer":"文学批评","max":2,"id":"西方文论-5-fill-16"},{"n":17,"type":"fill","prompt":"柏拉图在西方文论中提出,文学是对现实的模仿,而现实又是对 ______ 的模仿。","options":[],"key":"理念","answer":"理念","max":2,"id":"西方文论-5-fill-17"},{"n":18,"type":"fill","prompt":"西方文论发展中,贺拉斯提出的 ______ 观点,强调文学应兼具教育与娱乐功能。","options":[],"key":"寓教于乐","answer":"寓教于乐","max":2,"id":"西方文论-5-fill-18"},{"n":19,"type":"fill","prompt":"亚里士多德在《诗学》中提出的 ______ ,认为悲剧可通过引发怜悯与恐惧净化观众情感。","options":[],"key":"净化说","answer":"净化说","max":2,"id":"西方文论-5-fill-19"},{"n":20,"type":"fill","prompt":"西方现代文论区别于古典文论的重要标志之一,是对 ______ 的重视与深入研究。","options":[],"key":"文本形式","answer":"文本形式","max":2,"id":"西方文论-5-fill-20"},{"n":21,"type":"fill","prompt":"浪漫主义文论打破了古典主义的模仿传统,将 ______ 作为文学创作的核心本质。","options":[],"key":"情感表现","answer":"情感表现","max":2,"id":"西方文论-5-fill-21"},{"n":22,"type":"fill","prompt":"学习西方文论的基本方法之一是 ______ ,即结合理论产生的时代背景理解其内涵。","options":[],"key":"历史语境分析法","answer":"历史语境分析法","max":2,"id":"西方文论-5-fill-22"},{"n":23,"type":"fill","prompt":"接受美学作为西方文论思潮,首次将 ______ 置于文学研究的核心位置。","options":[],"key":"读者","answer":"读者","max":2,"id":"西方文论-5-fill-23"},{"n":24,"type":"term","prompt":"西方文论","options":[],"key":"","answer":"西方文论是发源于古希腊、发展于西方社会的文学理论与批评体系,涵盖文学本质、创作规律、文本解读、批评实践等内容,历经古典、近代、现代等阶段,形成模仿说、表现说、形式主义等思潮,是理解西方文学的理论根基。","max":3,"id":"西方文论-5-term-24"},{"n":25,"type":"term","prompt":"模仿说","options":[],"key":"","answer":"模仿说是西方文论萌芽阶段的核心思潮,以柏拉图、亚里士多德为代表。柏拉图认为文学是对现实的双重模仿,现实是对理念的模仿,文学具有虚幻性,远离真理;亚里士多德肯定模仿的价值,认为文学通过模仿现实可揭示事物规律。","max":3,"id":"西方文论-5-term-25"},{"n":26,"type":"term","prompt":"寓教于乐","options":[],"key":"","answer":"贺拉斯在《诗艺》中提出的文艺功能理论,主张文学兼具教育与娱乐功能,并通过娱乐实现教育目的。“教”指文学传播道德教化、引导公民品德;“乐”指文学凭借生动情节、优美语言带给读者审美愉悦。二者结合才能使文学既劝谕读者又使他喜爱。","max":3,"id":"西方文论-5-term-26"},{"n":27,"type":"term","prompt":"接受美学","options":[],"key":"","answer":"20世纪60年代兴起的文论思潮,代表人物为姚斯与伊瑟尔,主张文学研究由文本转向读者接受。姚斯提出“文学接受史”,主张结合不同时代读者的解读考察作品意义;伊瑟尔提出 “未定点”与“召唤结构”,认为文本存在意义空白,需读者填补。","max":3,"id":"西方文论-5-term-27"},{"n":28,"type":"short","prompt":"简述西方文论的发展历程可划分为哪几个主要阶段及各阶段核心特征。","options":[],"key":"","answer":"西方文论的发展可分为三个主要阶段:(1)古典阶段(古希腊至18世纪):以模仿说为基础,强调文学与现实或理念的关系,注重文学规范的建立。(2)近代阶段(19世纪):以人文主义为内核,浪漫主义、现实主义思潮兴起,关注情感表现与现实再现。(3)现代阶段(20世纪以来):出现形式主义、接受美学思潮,聚焦文本、读者等维度。","max":5,"id":"西方文论-5-short-28"},{"n":29,"type":"short","prompt":"简述学习西方文论的主要意义。","options":[],"key":"","answer":"学习西方文论的意义主要有三方面:(1)为解读西方文学作品提供理论工具,助力把握作品的创作逻辑与内涵价值,培养理论思维。(2)了解西方文学批评的思维方式与话语体系,提升批评能力,丰富批评方法。(3)通过中西文论对比,深化对文学普遍规律的认识,为本土文学研究提供借鉴,开阔学术视野。","max":5,"id":"西方文论-5-short-29"},{"n":30,"type":"short","prompt":"简述模仿说与表现说的核心区别。","options":[],"key":"","answer":"二者区别体现在文学与主体、客体的关系上:(1)模仿说以客体为核心,认为文学的本质是对现实或理念等外部客体的模仿,强调客观性与再现性,代表人物为柏拉图、亚里士多德。(2)表现说以主体为核心,认为文学的本质是作者内心情感、思想的自然流露,强调主体性与表现性。","max":5,"id":"西方文论-5-short-30"},{"n":31,"type":"essay","prompt":"论述西方文论中“文本中心”“作者中心”“读者中心”三种研究范式的演变及核心特征。","options":[],"key":"","answer":"“作者中心”范式盛行于近代至20世纪初,将作者意图、生平经历作为解读作品的唯一依据,认为作品价值在于作者的真诚。“文本中心”范式兴起于20世纪初,以形式主义、结构主义为代表,排除外部因素,以文本为研究的唯一对象,主张价值在于形式与结构。“读者中心”范式以20世纪中后期的接受美学为代表,认为价值在读者接受中实现,强调“期待视野”与读者建构。","max":15,"id":"西方文论-5-essay-31"},{"n":32,"type":"essay","prompt":"论述西方文论对中国现当代文学研究的借鉴意义与应用边界。","options":[],"key":"","answer":"借鉴意义:(1)提供研究方法,为解读中国现当代文学提供全新视角。(2)拓展研究范畴,突破传统“内容分析”局限。(3)构建批评话语体系,助力批评摆脱经验化表述。应用边界:(1)文化语境差异:直接套用可能“水土不服”。(2)文学传统差异:中国文学有 “言志载道”传统,形式主义可能割裂文学与社会文化的关联。(3)价值立场差异:部分思潮带有西方中心主义色彩,需保持批判意识。","max":15,"id":"西方文论-5-essay-32"}],"rawMax":88},{"id":"西方文论-6","title":"章节练习(1章)","questions":[{"n":1,"type":"single","prompt":"西方文论的源头是","options":[{"key":"A","text":"古埃及文论"},{"key":"B","text":"古希腊文论"},{"key":"C","text":"古巴比伦文论"},{"key":"D","text":"古印度文论"}],"key":"B","answer":"古希腊文论","max":1,"id":"西方文论-6-single-1"},{"n":2,"type":"single","prompt":"柏拉图认为文艺模仿的最终本源是","options":[{"key":"A","text":"现实世界"},{"key":"B","text":"理念世界"},{"key":"C","text":"艺术家的心灵"},{"key":"D","text":"自然万物"}],"key":"B","answer":"理念世界","max":1,"id":"西方文论-6-single-2"},{"n":3,"type":"single","prompt":"亚里士多德的悲剧理论主要收录在","options":[{"key":"A","text":"《理想国》"},{"key":"B","text":"《诗学》"},{"key":"C","text":"《论崇高》"},{"key":"D","text":"《诗艺》"}],"key":"B","answer":"《诗学》","max":1,"id":"西方文论-6-single-3"},{"n":4,"type":"single","prompt":"贺拉斯提出的“合式”原则主要针对文学的","options":[{"key":"A","text":"内容"},{"key":"B","text":"形式"},{"key":"C","text":"读者"},{"key":"D","text":"作者"}],"key":"B","answer":"形式","max":1,"id":"西方文论-6-single-4"},{"n":5,"type":"single","prompt":"柏拉图认为模仿的文艺主要的危害是","options":[{"key":"A","text":"提升人的道德"},{"key":"B","text":"混淆现实与模仿"},{"key":"C","text":"促进社会和谐"},{"key":"D","text":"增强人的理性"}],"key":"B","answer":"混淆现实与模仿","max":1,"id":"西方文论-6-single-5"},{"n":6,"type":"single","prompt":"亚里士多德的“模仿论”与柏拉图的根本区别在于","options":[{"key":"A","text":"是否承认模仿的存在"},{"key":"B","text":"模仿的对象不同"},{"key":"C","text":"对模仿价值的判断不同"},{"key":"D","text":"模仿的方式不同"}],"key":"C","answer":"对模仿价值的判断不同","max":1,"id":"西方文论-6-single-6"},{"n":7,"type":"single","prompt":"朗吉弩斯论述文学崇高风格来源的著作是","options":[{"key":"A","text":"《诗学》"},{"key":"B","text":"《诗艺》"},{"key":"C","text":"《论崇高》"},{"key":"D","text":"《理想国》"}],"key":"C","answer":"《论崇高》","max":1,"id":"西方文论-6-single-7"},{"n":8,"type":"single","prompt":"亚里士多德认为悲剧的主角应该是","options":[{"key":"A","text":"完美的圣人"},{"key":"B","text":"十足的恶人"},{"key":"C","text":"普通人"},{"key":"D","text":"有缺陷的好人"}],"key":"D","answer":"有缺陷的好人","max":1,"id":"西方文论-6-single-8"},{"n":9,"type":"single","prompt":"贺拉斯的“寓教于乐”理论强调文学的","options":[{"key":"A","text":"教育功能"},{"key":"B","text":"娱乐功能"},{"key":"C","text":"教育与娱乐的统一"},{"key":"D","text":"审美功能"}],"key":"C","answer":"教育与娱乐的统一","max":1,"id":"西方文论-6-single-9"},{"n":10,"type":"single","prompt":"柏拉图主张将逐出“理想国”","options":[{"key":"A","text":"哲学家"},{"key":"B","text":"诗人"},{"key":"C","text":"政治家"},{"key":"D","text":"军事家"}],"key":"B","answer":"诗人","max":1,"id":"西方文论-6-single-10"},{"n":11,"type":"single","prompt":"亚里士多德对艺术的分类主要依据","options":[{"key":"A","text":"形式"},{"key":"B","text":"内容"},{"key":"C","text":"模仿的媒介、对象和方式"},{"key":"D","text":"作者"}],"key":"C","answer":"模仿的媒介、对象和方式","max":1,"id":"西方文论-6-single-11"},{"n":12,"type":"single","prompt":"贺拉斯的“合式”原则不包括","options":[{"key":"A","text":"题材与风格的匹配"},{"key":"B","text":"人物性格的一致性"},{"key":"C","text":"情节的离奇性"},{"key":"D","text":"语言的得体性"}],"key":"C","answer":"情节的离奇性","max":1,"id":"西方文论-6-single-12"},{"n":13,"type":"single","prompt":"朗吉弩斯认为崇高风格的核心是","options":[{"key":"A","text":"华丽的辞藻"},{"key":"B","text":"强烈的情感"},{"key":"C","text":"伟大的思想"},{"key":"D","text":"规整的结构"}],"key":"C","answer":"伟大的思想","max":1,"id":"西方文论-6-single-13"},{"n":14,"type":"single","prompt":"亚里士多德认为悲剧的社会作用是","options":[{"key":"A","text":"净化情感"},{"key":"B","text":"败坏道德"},{"key":"C","text":"娱乐大众"},{"key":"D","text":"传播知识"}],"key":"A","answer":"净化情感","max":1,"id":"西方文论-6-single-14"},{"n":15,"type":"single","prompt":"古希腊罗马文论主要探讨的问题不包括","options":[{"key":"A","text":"文学与世界的关系"},{"key":"B","text":"文学的功能"},{"key":"C","text":"文学的商业价值"},{"key":"D","text":"文学的形式"}],"key":"C","answer":"文学的商业价值","max":1,"id":"西方文论-6-single-15"},{"n":16,"type":"fill","prompt":"西方文论的源头是 ______ 文论。","options":[],"key":"古希腊","answer":"古希腊","max":2,"id":"西方文论-6-fill-16"},{"n":17,"type":"fill","prompt":"柏拉图认为文艺模仿的最终本源是 ______ 世界。","options":[],"key":"理念","answer":"理念","max":2,"id":"西方文论-6-fill-17"},{"n":18,"type":"fill","prompt":"亚里士多德的悲剧理论收录在《 ______ 》中。","options":[],"key":"诗学","answer":"诗学","max":2,"id":"西方文论-6-fill-18"},{"n":19,"type":"fill","prompt":"贺拉斯提出的“ ______ ”原则强调文学形式的和谐得体。","options":[],"key":"合式","answer":"合式","max":2,"id":"西方文论-6-fill-19"},{"n":20,"type":"fill","prompt":"柏拉图认为模仿的文艺主要危害是混淆 ______ 与模仿。","options":[],"key":"现实","answer":"现实","max":2,"id":"西方文论-6-fill-20"},{"n":21,"type":"fill","prompt":"亚里士多德对艺术的分类依据是模仿的 ______ 、对象和方式。","options":[],"key":"媒介","answer":"媒介","max":2,"id":"西方文论-6-fill-21"},{"n":22,"type":"fill","prompt":"贺拉斯的“ ______ ”理论强调文学教育与娱乐功能的统一。","options":[],"key":"寓教于乐","answer":"寓教于乐","max":2,"id":"西方文论-6-fill-22"},{"n":23,"type":"fill","prompt":"朗吉弩斯在《 ______ 》中论述了文学作品崇高风格的来源。","options":[],"key":"论崇高","answer":"论崇高","max":2,"id":"西方文论-6-fill-23"},{"n":24,"type":"term","prompt":"理念论","options":[],"key":"","answer":"柏拉图哲学的出发点和基本原则。理念本义是“看见的东西”,转义为灵魂所见的东西。在柏拉图看来,理念是现实感性世界的根据,作为事物的共相,不生不灭、不变不动。他以理念论为基础提出艺术模仿论,认为文艺是对理念的间接模仿。","max":3,"id":"西方文论-6-term-24"},{"n":25,"type":"term","prompt":"模仿论(亚里士多德)","options":[],"key":"","answer":"亚里士多德提出的文论观点,认为文艺是对现实的模仿,这种模仿不仅是再现,更是对现实本质和规律的揭示,具有积极价值。他还根据模仿的媒介、对象和方式对艺术进行分类,为西方现实主义文论奠定基础。","max":3,"id":"西方文论-6-term-25"},{"n":26,"type":"term","prompt":"合式原则","options":[],"key":"","answer":"贺拉斯提出的文论观点,强调文学形式的和谐、得体,包括题材与风格的匹配、人物性格的一致性、语言的得体性以及情节的和谐。其目的是实现作品的整体和谐,符合古典主义的审美规范,是古典主义创作的重要原则。","max":3,"id":"西方文论-6-term-26"},{"n":27,"type":"term","prompt":"净化说","options":[],"key":"","answer":"亚里士多德提出的悲剧理论,认为悲剧通过引发观众的怜悯与恐惧,使这些情感得到净化, 从而实现心灵的陶冶和道德的提升。这一理论揭示了悲剧的社会作用,把审美效果与道德教育统一起来,是西方悲剧理论的核心观点。","max":3,"id":"西方文论-6-term-27"},{"n":28,"type":"short","prompt":"简述柏拉图认为模仿的文艺主要有何危害及提出的主张。","options":[],"key":"","answer":"柏拉图认为模仿的文艺主要有两点危害:(1)混淆现实与模仿,使人们沉迷于虚幻的模仿世界,远离真理与真实。(2)败坏道德,滋养感伤癖、哀怜癖等低劣情感,摧残理性,不利于理想国的道德建设。基于此,他提出将诗人逐出“理想国”的主张,必须对文艺进行严格审查。","max":5,"id":"西方文论-6-short-28"},{"n":29,"type":"short","prompt":"简述亚里士多德如何理解悲剧的社会作用。","options":[],"key":"","answer":"亚里士多德认为悲剧的社会作用是“净化”,即通过引发观众的怜悯与恐惧,使这些情感得到净化,从而实现心灵的陶冶和道德的提升。怜悯与恐惧是观众观剧时产生的强烈情感,净化使它们得到宣泄与心理平衡,有助于维护社会的道德秩序和心灵健康,是西方悲剧理论的核心观点之一。","max":5,"id":"西方文论-6-short-29"},{"n":30,"type":"short","prompt":"简述贺拉斯的“合式”原则的具体要求。","options":[],"key":"","answer":"贺拉斯的“合式”原则具体要求包括:(1)题材与风格要匹配,庄严的题材用崇高的风格, 避免错位。(2)人物性格要一致,符合其身份和处境,并遵循传统形象。(3)语言要得体,符合表达需要,与人物身份相称。(4)情节要和谐,符合逻辑和传统规范。这些要求共同保证了作品的整体和谐,体现了古典主义的审美规范。","max":5,"id":"西方文论-6-short-30"},{"n":31,"type":"essay","prompt":"论述柏拉图与亚里士多德“模仿论”的异同。","options":[],"key":"","answer":"相同点:都认为文艺是对现实的模仿。不同点:(1)模仿的本源不同:柏拉图认为最终本源是理念世界,文艺远离真理;亚里士多德认为模仿对象是现实世界,文艺通过模仿现实可揭示事物本质。(2)价值判断不同:柏拉图否定模仿文艺的价值,主张逐出诗人;亚里士多德肯定其价值。(3)模仿方式不同:柏拉图强调模仿的虚幻性;亚里士多德强调创造性与真实性。","max":15,"id":"西方文论-6-essay-31"},{"n":32,"type":"essay","prompt":"论述古希腊罗马时期的文论主要探讨的五个方向的问题。","options":[],"key":"","answer":"古希腊罗马时期的文论主要探讨几个方向的问题:(1)文学与世界的关系:以柏拉图和亚里士多德的“模仿论”为代表,探讨文艺模仿现实还是理念。(2)文学的功能:贺拉斯的“寓教于乐”探讨文学教育与娱乐功能的统一。(3)文学的形式:贺拉斯的“合式”原则探讨题材、性格、语言等规范。(4)文学的风格:朗吉弩斯的《论崇高》探讨崇高风格的来源。","max":15,"id":"西方文论-6-essay-32"}],"rawMax":88},{"id":"西方文论-7","title":"章节练习(2章)","questions":[{"n":1,"type":"single","prompt":"中世纪文学的主要类型不包括","options":[{"key":"A","text":"宗教文学"},{"key":"B","text":"骑士文学"},{"key":"C","text":"市民文学"},{"key":"D","text":"浪漫主义文学"}],"key":"D","answer":"浪漫主义文学","max":1,"id":"西方文论-7-single-1"},{"n":2,"type":"single","prompt":"奥古斯丁美学思想的核心是","options":[{"key":"A","text":"美在理念"},{"key":"B","text":"美在上帝"},{"key":"C","text":"美在形式"},{"key":"D","text":"美在自然"}],"key":"B","answer":"美在上帝","max":1,"id":"西方文论-7-single-2"},{"n":3,"type":"single","prompt":"阿奎那的“释经四义”不包括","options":[{"key":"A","text":"字面义"},{"key":"B","text":"寓意"},{"key":"C","text":"道德义"},{"key":"D","text":"审美义"}],"key":"D","answer":"审美义","max":1,"id":"西方文论-7-single-3"},{"n":4,"type":"single","prompt":"奥古斯丁象征理论的核心是","options":[{"key":"A","text":"象征源于自然"},{"key":"B","text":"象征源于人类"},{"key":"C","text":"象征源于上帝"},{"key":"D","text":"象征源于艺术"}],"key":"C","answer":"象征源于上帝","max":1,"id":"西方文论-7-single-4"},{"n":5,"type":"single","prompt":"阿奎那对于艺术与自然的主要看法是","options":[{"key":"A","text":"艺术模仿自然"},{"key":"B","text":"艺术高于自然"},{"key":"C","text":"艺术与自然无关"},{"key":"D","text":"自然模仿艺术"}],"key":"A","answer":"艺术模仿自然","max":1,"id":"西方文论-7-single-5"},{"n":6,"type":"single","prompt":"奥古斯丁关于艺术的真实性观点是","options":[{"key":"A","text":"艺术真实高于现实真实"},{"key":"B","text":"艺术真实等同于现实真实"},{"key":"C","text":"艺术真实低于现实真实"},{"key":"D","text":"艺术真实与现实真实无关"}],"key":"C","answer":"艺术真实低于现实真实","max":1,"id":"西方文论-7-single-6"},{"n":7,"type":"single","prompt":"阿奎那对于艺术形式的主要看法是","options":[{"key":"A","text":"形式源于上帝"},{"key":"B","text":"形式是艺术的次要因素"},{"key":"C","text":"形式与内容无关"},{"key":"D","text":"形式服务于内容"}],"key":"D","answer":"形式服务于内容","max":1,"id":"西方文论-7-single-7"},{"n":8,"type":"single","prompt":"中世纪文论的主要特征是","options":[{"key":"A","text":"世俗化"},{"key":"B","text":"宗教化"},{"key":"C","text":"个性化"},{"key":"D","text":"自然化"}],"key":"B","answer":"宗教化","max":1,"id":"西方文论-7-single-8"},{"n":9,"type":"single","prompt":"奥古斯丁的著作不包括","options":[{"key":"A","text":"《忏悔录》"},{"key":"B","text":"《上帝之城》"},{"key":"C","text":"《诗学》"},{"key":"D","text":"《论美与适宜》"}],"key":"C","answer":"《诗学》","max":1,"id":"西方文论-7-single-9"},{"n":10,"type":"single","prompt":"阿奎那对于艺术与象征的主要看法是","options":[{"key":"A","text":"艺术象征源于人类"},{"key":"B","text":"艺术象征源于自然"},{"key":"C","text":"艺术象征源于上帝"},{"key":"D","text":"艺术象征与上帝无关"}],"key":"C","answer":"艺术象征源于上帝","max":1,"id":"西方文论-7-single-10"},{"n":11,"type":"single","prompt":"奥古斯丁的美学思想属于","options":[{"key":"A","text":"唯物主义"},{"key":"B","text":"唯心主义"},{"key":"C","text":"自然主义"},{"key":"D","text":"现实主义"}],"key":"B","answer":"唯心主义","max":1,"id":"西方文论-7-single-11"},{"n":12,"type":"single","prompt":"中世纪文论在西方文论史上的地位是","options":[{"key":"A","text":"可有可无"},{"key":"B","text":"承上启下"},{"key":"C","text":"开创先河"},{"key":"D","text":"终结传统"}],"key":"B","answer":"承上启下","max":1,"id":"西方文论-7-single-12"},{"n":13,"type":"single","prompt":"奥古斯丁关于艺术的功能性观点是","options":[{"key":"A","text":"艺术无功能"},{"key":"B","text":"艺术仅具审美功能"},{"key":"C","text":"艺术服务于宗教"},{"key":"D","text":"艺术服务于世俗"}],"key":"C","answer":"艺术服务于宗教","max":1,"id":"西方文论-7-single-13"},{"n":14,"type":"single","prompt":"阿奎那的著作是","options":[{"key":"A","text":"《神学大全》"},{"key":"B","text":"《理想国》"},{"key":"C","text":"《论崇高》"},{"key":"D","text":"《诗艺》"}],"key":"A","answer":"《神学大全》","max":1,"id":"西方文论-7-single-14"},{"n":15,"type":"single","prompt":"中世纪文学的特点不包括","options":[{"key":"A","text":"宗教性"},{"key":"B","text":"神秘性"},{"key":"C","text":"世俗性"},{"key":"D","text":"象征性"}],"key":"C","answer":"世俗性","max":1,"id":"西方文论-7-single-15"},{"n":16,"type":"fill","prompt":"中世纪文学的主要类型有宗教文学、骑士文学和 ______ 文学。","options":[],"key":"市民","answer":"市民","max":2,"id":"西方文论-7-fill-16"},{"n":17,"type":"fill","prompt":"奥古斯丁美学思想的核心是美在 ______ 。","options":[],"key":"上帝","answer":"上帝","max":2,"id":"西方文论-7-fill-17"},{"n":18,"type":"fill","prompt":"阿奎那的“释经四义”包括字面义、寓意、道德义和 ______ 义。","options":[],"key":"神秘","answer":"神秘","max":2,"id":"西方文论-7-fill-18"},{"n":19,"type":"fill","prompt":"奥古斯丁象征理论的核心是象征源于 ______ 。","options":[],"key":"上帝","answer":"上帝","max":2,"id":"西方文论-7-fill-19"},{"n":20,"type":"fill","prompt":"阿奎那对于艺术与自然的主要看法是艺术 ______ 自然。","options":[],"key":"模仿","answer":"模仿","max":2,"id":"西方文论-7-fill-20"},{"n":21,"type":"fill","prompt":"奥古斯丁关于艺术的真实性观点是艺术真实 ______ 现实真实。","options":[],"key":"低于","answer":"低于","max":2,"id":"西方文论-7-fill-21"},{"n":22,"type":"fill","prompt":"阿奎那对于艺术形式的主要看法是形式 ______ 内容。","options":[],"key":"服务于","answer":"服务于","max":2,"id":"西方文论-7-fill-22"},{"n":23,"type":"fill","prompt":"中世纪文论的主要特征是 ______ 化。","options":[],"key":"宗教","answer":"宗教","max":2,"id":"西方文论-7-fill-23"},{"n":24,"type":"term","prompt":"释经四义","options":[],"key":"","answer":"阿奎那提出的对《圣经》的四种解释方法,包括字面义、寓意、道德义、神秘义。字面义解释经文字面意思;寓意解释经文蕴含的宗教象征意义;道德义解释经文包含的道德教训;神秘义解释经文预示的天国奥秘,是中世纪释经传统的核心方法。","max":3,"id":"西方文论-7-term-24"},{"n":25,"type":"term","prompt":"奥古斯丁的象征理论","options":[],"key":"","answer":"奥古斯丁认为象征源于上帝,是上帝的启示,用于传达神圣的意义。世间事物都可以作为象征,指向上帝的真理;象征的作用是引导人们从可见事物走向不可见的上帝,从而坚定信仰,体现了中世纪文论的宗教化特征。","max":3,"id":"西方文论-7-term-25"},{"n":26,"type":"term","prompt":"阿奎那的艺术模仿自然","options":[],"key":"","answer":"阿奎那认为艺术模仿自然,自然是上帝的创造,艺术模仿自然也是对上帝的模仿。自然是艺术的范本和源泉,艺术通过模仿自然传达上帝的旨意,其价值在于对自然的模仿和对上帝的体现,体现了中世纪文论将艺术纳入神学体系的特征。","max":3,"id":"西方文论-7-term-26"},{"n":27,"type":"term","prompt":"中世纪文论的宗教化特征","options":[],"key":"","answer":"中世纪文论以宗教为核心,一切文学艺术的研究和讨论都围绕宗教展开,服务于宗教教义的传播和信仰的巩固。文论家从宗教角度解释文学艺术的本质、功能、形式等问题,视文学艺术为宗教的工具,具有强烈的宗教化特征。","max":3,"id":"西方文论-7-term-27"},{"n":28,"type":"short","prompt":"简述奥古斯丁的象征理论主要观点。","options":[],"key":"","answer":"奥古斯丁的象征理论主要观点有:(1)象征源于上帝,是上帝的启示,用于传达神圣的意义;(2)世间事物都可作为象征,指向上帝的真理;(3)象征的作用是引导人们从可见事物走向不可见的上帝,从而坚定信仰,实现灵魂的救赎。这一理论把文艺纳入神学体系, 体现了中世纪文论的宗教化特征。","max":5,"id":"西方文论-7-short-28"},{"n":29,"type":"short","prompt":"简述阿奎那对于艺术与自然的主要看法。","options":[],"key":"","answer":"阿奎那对于艺术与自然的主要看法是艺术模仿自然。他认为自然是上帝的创造,艺术模仿自然也是对上帝的模仿;自然是艺术的范本,艺术通过模仿自然传达上帝的旨意;艺术的价值在于对自然的模仿和对上帝的体现。这一看法把艺术与神学紧密联系,是理解中世纪艺术观的关键。","max":5,"id":"西方文论-7-short-29"},{"n":30,"type":"short","prompt":"简述中世纪文论的主要特征及其在西方文论史上的地位和价值。","options":[],"key":"","answer":"中世纪文论的主要特征是宗教化,一切文论都围绕宗教展开,服务于宗教教义的传播。其地位是承上启下:上承古希腊罗马文论,继承模仿论等传统并赋予宗教内涵;下启文艺复兴文论。其价值在于在宗教框架内探讨文学艺术的本质、功能、形式等问题,提出象征理论、释经方法等观点。","max":5,"id":"西方文论-7-short-30"},{"n":31,"type":"essay","prompt":"试比较奥古斯丁与阿奎那在文艺观上的异同。","options":[],"key":"","answer":"相同点:都以宗教为核心,认为文艺服务于宗教、传达上帝教义;都强调象征性,认为事物可作象征,指向上帝真理。不同点:(1)真实性:奥古斯丁认为艺术真实低于现实真实; 阿奎那认为艺术模仿自然。(2)形式:奥古斯丁重宗教功能而轻形式;阿奎那认为形式服务于内容。(3)艺术与自然:奥古斯丁认为艺术模仿现实、远离上帝;阿奎那认为艺术模仿自然即模仿上帝。","max":15,"id":"西方文论-7-essay-31"},{"n":32,"type":"essay","prompt":"试述中世纪文论的主要特征及其在西方文论史上的地位和价值。","options":[],"key":"","answer":"中世纪文论的主要特征是宗教化:(1)文论的核心是宗教,一切研究和讨论都围绕宗教展开,服务于宗教教义的传播和信仰的巩固。(2)强调文艺的象征性,认为世间事物都可作为象征,指向上帝的真理。(3)文艺的功能是服务于宗教,引导人们信仰上帝。其地位是承上启下:上承古希腊罗马文论并赋予宗教内涵,下启文艺复兴文论。","max":15,"id":"西方文论-7-essay-32"}],"rawMax":88},{"id":"西方文论-8","title":"章节练习(3章)","questions":[{"n":1,"type":"single","prompt":"文艺复兴的产生主要受文化的影响","options":[{"key":"A","text":"古埃及"},{"key":"B","text":"古希腊罗马"},{"key":"C","text":"古巴比伦"},{"key":"D","text":"古印度"}],"key":"B","answer":"古希腊罗马","max":1,"id":"西方文论-8-single-1"},{"n":2,"type":"single","prompt":"但丁的俗语观强调","options":[{"key":"A","text":"拉丁语的优越性"},{"key":"B","text":"俗语的文学价值"},{"key":"C","text":"方言的无用性"},{"key":"D","text":"文言文的重要性"}],"key":"B","answer":"俗语的文学价值","max":1,"id":"西方文论-8-single-2"},{"n":3,"type":"single","prompt":"卡斯特尔维屈罗戏剧“三一律”的核心不包括","options":[{"key":"A","text":"时间一律"},{"key":"B","text":"地点一律"},{"key":"C","text":"情节一律"},{"key":"D","text":"人物一律"}],"key":"D","answer":"人物一律","max":1,"id":"西方文论-8-single-3"},{"n":4,"type":"single","prompt":"锡德尼为诗辩护的核心观点是","options":[{"key":"A","text":"诗有害于道德"},{"key":"B","text":"诗无足轻重"},{"key":"C","text":"诗具有教化功能"},{"key":"D","text":"诗应服务于宗教"}],"key":"C","answer":"诗具有教化功能","max":1,"id":"西方文论-8-single-4"},{"n":5,"type":"single","prompt":"但丁诗的寓意观认为诗的意义分为","options":[{"key":"A","text":"一层"},{"key":"B","text":"两层"},{"key":"C","text":"三层"},{"key":"D","text":"四层"}],"key":"D","answer":"四层","max":1,"id":"西方文论-8-single-5"},{"n":6,"type":"single","prompt":"卡斯特尔维屈罗关于文学真实感的观点是","options":[{"key":"A","text":"文学真实等于历史真实"},{"key":"B","text":"文学真实高于历史真实"},{"key":"C","text":"文学真实低于历史真实"},{"key":"D","text":"文学真实与历史真实无关"}],"key":"B","answer":"文学真实高于历史真实","max":1,"id":"西方文论-8-single-6"},{"n":7,"type":"single","prompt":"锡德尼关于诗的虚构观点是","options":[{"key":"A","text":"虚构有害"},{"key":"B","text":"虚构无价值"},{"key":"C","text":"虚构是诗的本质"},{"key":"D","text":"虚构应被禁止"}],"key":"C","answer":"虚构是诗的本质","max":1,"id":"西方文论-8-single-7"},{"n":8,"type":"single","prompt":"文艺复兴时期文学理论的特点不包括","options":[{"key":"A","text":"人文主义"},{"key":"B","text":"宗教化"},{"key":"C","text":"世俗化"},{"key":"D","text":"个性化"}],"key":"B","answer":"宗教化","max":1,"id":"西方文论-8-single-8"},{"n":9,"type":"single","prompt":"但丁的著作不包括","options":[{"key":"A","text":"《神曲》"},{"key":"B","text":"《论俗语》"},{"key":"C","text":"《诗学》"},{"key":"D","text":"《飨宴》"}],"key":"C","answer":"《诗学》","max":1,"id":"西方文论-8-single-9"},{"n":10,"type":"single","prompt":"卡斯特尔维屈罗关于文学艺术主要功能的观点是","options":[{"key":"A","text":"宗教功能"},{"key":"B","text":"审美功能"},{"key":"C","text":"教化功能"},{"key":"D","text":"商业功能"}],"key":"C","answer":"教化功能","max":1,"id":"西方文论-8-single-10"},{"n":11,"type":"single","prompt":"锡德尼的著作是","options":[{"key":"A","text":"《为诗辩护》"},{"key":"B","text":"《神曲》"},{"key":"C","text":"《论俗语》"},{"key":"D","text":"《神学大全》"}],"key":"A","answer":"《为诗辩护》","max":1,"id":"西方文论-8-single-11"},{"n":12,"type":"single","prompt":"但丁的俗语观旨在推动","options":[{"key":"A","text":"拉丁语的发展"},{"key":"B","text":"民族文学的发展"},{"key":"C","text":"文言文的发展"},{"key":"D","text":"方言的消亡"}],"key":"B","answer":"民族文学的发展","max":1,"id":"西方文论-8-single-12"},{"n":13,"type":"single","prompt":"卡斯特尔维屈罗的“三一律”主要针对","options":[{"key":"A","text":"小说"},{"key":"B","text":"诗歌"},{"key":"C","text":"戏剧"},{"key":"D","text":"散文"}],"key":"C","answer":"戏剧","max":1,"id":"西方文论-8-single-13"},{"n":14,"type":"single","prompt":"锡德尼关于诗的教化观点是","options":[{"key":"A","text":"诗无教化功能"},{"key":"B","text":"诗的教化功能低于哲学"},{"key":"C","text":"诗的教化功能高于哲学"},{"key":"D","text":"诗的教化功能等于哲学"}],"key":"C","answer":"诗的教化功能高于哲学","max":1,"id":"西方文论-8-single-14"},{"n":15,"type":"single","prompt":"文艺复兴文论的核心是","options":[{"key":"A","text":"人文主义"},{"key":"B","text":"封建主义"},{"key":"C","text":"社会主义"},{"key":"D","text":"资本主义"}],"key":"A","answer":"人文主义","max":1,"id":"西方文论-8-single-15"},{"n":16,"type":"fill","prompt":"文艺复兴的产生主要受 ______ 文化的影响。","options":[],"key":"古希腊罗马","answer":"古希腊罗马","max":2,"id":"西方文论-8-fill-16"},{"n":17,"type":"fill","prompt":"但丁的俗语观强调 ______ 的文学价值。","options":[],"key":"俗语","answer":"俗语","max":2,"id":"西方文论-8-fill-17"},{"n":18,"type":"fill","prompt":"卡斯特尔维屈罗戏剧“三一律”包括时间一律、地点一律和 ______ 一律。","options":[],"key":"情节","answer":"情节","max":2,"id":"西方文论-8-fill-18"},{"n":19,"type":"fill","prompt":"锡德尼为诗辩护的核心观点是诗具有 ______ 功能。","options":[],"key":"教化","answer":"教化","max":2,"id":"西方文论-8-fill-19"},{"n":20,"type":"fill","prompt":"但丁诗的寓意观认为诗的意义分为 ______ 层。","options":[],"key":"四","answer":"四","max":2,"id":"西方文论-8-fill-20"},{"n":21,"type":"fill","prompt":"卡斯特尔维屈罗关于文学真实感的观点是文学真实 ______ 历史真实。","options":[],"key":"高于","answer":"高于","max":2,"id":"西方文论-8-fill-21"},{"n":22,"type":"fill","prompt":"锡德尼关于诗的虚构观点是虚构是诗的 ______ 。","options":[],"key":"本质","answer":"本质","max":2,"id":"西方文论-8-fill-22"},{"n":23,"type":"fill","prompt":"文艺复兴时期文学理论的特点是 ______ 、世俗化、个性化。","options":[],"key":"人文主义","answer":"人文主义","max":2,"id":"西方文论-8-fill-23"},{"n":24,"type":"term","prompt":"俗语观(但丁)","options":[],"key":"","answer":"但丁在《论俗语》中提出的文论观点,强调俗语(民族语言)的文学价值,主张用俗语取代拉丁语进行文学创作,认为俗语更能表达民族的情感和思想,推动了民族文学的发展,是文艺复兴时期民族语言文学理论的先声。","max":3,"id":"西方文论-8-term-24"},{"n":25,"type":"term","prompt":"三一律(卡斯特尔维屈罗)","options":[],"key":"","answer":"卡斯特尔维屈罗提出的戏剧创作规则,包括时间一律(剧情在一天内完成)、地点一律(剧情发生在同一地点)、情节一律(剧情围绕单一情节展开)。其目的是使戏剧结构严谨,增强艺术感染力,是文艺复兴时期戏剧理论的重要成果。","max":3,"id":"西方文论-8-term-25"},{"n":26,"type":"term","prompt":"诗的寓意观(但丁)","options":[],"key":"","answer":"但丁提出的诗的意义分为四层的观点,即字面义、寓言义、道德义、神秘义。字面义是诗句表面意思;寓言义是诗句的象征意义;道德义是诗句包含的道德教训;神秘义是诗句预示的天国奥秘,是中世纪释经传统在诗学中的运用。","max":3,"id":"西方文论-8-term-26"},{"n":27,"type":"term","prompt":"为诗辩护(锡德尼)","options":[],"key":"","answer":"锡德尼在《为诗辩护》中提出的文论观点,核心是为诗辩护,强调诗的教化功能和虚构的价值:诗具有高于哲学的教化功能,通过虚构的故事传达真理,引导人们向善,肯定诗在道德教育中的重要作用,体现了文艺复兴文论对诗的价值的肯定。","max":3,"id":"西方文论-8-term-27"},{"n":28,"type":"short","prompt":"简述但丁的俗语观主要内容。","options":[],"key":"","answer":"但丁的俗语观主要内容有:(1)强调俗语(民族语言)的文学价值,认为俗语更能表达民族的情感和思想;(2)主张用俗语取代拉丁语进行文学创作,推动民族文学的发展; (3)认为优秀的俗语文学能够提升民族的文化地位。他还认为俗语是自然生成的语言,体现了文艺复兴时期对民族文化的重视。","max":5,"id":"西方文论-8-short-28"},{"n":29,"type":"short","prompt":"简述卡斯特尔维屈罗戏剧“三一律”主要内容。","options":[],"key":"","answer":"卡斯特尔维屈罗戏剧“三一律”主要内容包括:(1)时间一律,即剧情须在一天内完成; (2)地点一律,即剧情须发生在同一地点;(3)情节一律,即剧情须围绕单一情节展开。其目的是使戏剧结构严谨,增强艺术的集中性和感染力,是文艺复兴时期戏剧理论的重要成果,对后世戏剧创作影响深远。","max":5,"id":"西方文论-8-short-29"},{"n":30,"type":"short","prompt":"简述锡德尼是如何为诗进行辩护的。","options":[],"key":"","answer":"锡德尼为诗辩护主要从以下方面展开:(1)强调诗的教化功能,认为诗能够通过虚构的故事引导人们向善,其教化功能高于哲学;(2)阐述诗的虚构本质,认为虚构不是虚假,而是创造形象来传达真理;(3)驳斥对诗的贬低,指出诗在人类文化和道德教育中的重要作用。这一辩护体现了文艺复兴文论对诗的推崇。","max":5,"id":"西方文论-8-short-30"},{"n":31,"type":"essay","prompt":"试述但丁的诗的寓意观及其意义。","options":[],"key":"","answer":"但丁的诗的寓意观认为诗的意义分为四层:字面义是诗句的表面意思;寓言义是诗句的象征意义;道德义是诗句的道德教训;神秘义是诗句对天国奥秘的预示。其意义在于:(1)继承和发展了中世纪的释经传统。(2)突破了中世纪文论的宗教束缚,将寓意解读应用于世俗文学,体现文艺复兴人文主义的萌芽。(3)对后世文学批评和阐释学产生了深远影响。","max":15,"id":"西方文论-8-essay-31"},{"n":32,"type":"essay","prompt":"试述文艺复兴时期文学理论的特点。","options":[],"key":"","answer":"文艺复兴时期文学理论的特点主要有:(1)人文主义:以人的价值和尊严为核心,强调世俗生活和个人情感。(2)世俗化:文学理论从宗教神学框架中解放出来,文学功能从服务于宗教转向服务于社会和人生。(3)个性化:强调个人的创造力和独特性,注重个人的风格和情感表达。(4)复兴与发展古希腊罗马文论:以复兴古典文化为旗帜,继承模仿论、 悲剧理论并赋予新内涵。","max":15,"id":"西方文论-8-essay-32"}],"rawMax":88},{"id":"西方文论-9","title":"章节练习(4章)","questions":[{"n":1,"type":"single","prompt":"古典主义文论的核心是","options":[{"key":"A","text":"人文主义"},{"key":"B","text":"理性主义"},{"key":"C","text":"浪漫主义"},{"key":"D","text":"现实主义"}],"key":"B","answer":"理性主义","max":1,"id":"西方文论-9-single-1"},{"n":2,"type":"single","prompt":"布瓦洛的“理性”观点强调文学创作应","options":[{"key":"A","text":"遵循个人情感"},{"key":"B","text":"服从理性规范"},{"key":"C","text":"模仿自然形态"},{"key":"D","text":"追求感官刺激"}],"key":"B","answer":"服从理性规范","max":1,"id":"西方文论-9-single-2"},{"n":3,"type":"single","prompt":"屈雷顿《论诗剧》中涉及的争论不包括","options":[{"key":"A","text":"古今之争"},{"key":"B","text":"英法之争"},{"key":"C","text":"诗韵之争"},{"key":"D","text":"雅俗之争"}],"key":"D","answer":"雅俗之争","max":1,"id":"西方文论-9-single-3"},{"n":4,"type":"single","prompt":"高特雪特《批判的诗学》的主要观点是","options":[{"key":"A","text":"推崇浪漫主义"},{"key":"B","text":"支持新古典主义"},{"key":"C","text":"倡导现实主义"},{"key":"D","text":"主张自然主义"}],"key":"B","answer":"支持新古典主义","max":1,"id":"西方文论-9-single-4"},{"n":5,"type":"single","prompt":"布瓦洛的“自然”观点认为文学应模仿","options":[{"key":"A","text":"现实自然"},{"key":"B","text":"理想自然"},{"key":"C","text":"个人想象"},{"key":"D","text":"神话传说"}],"key":"B","answer":"理想自然","max":1,"id":"西方文论-9-single-5"},{"n":6,"type":"single","prompt":"屈雷顿评价莎士比亚戏剧的观点是","options":[{"key":"A","text":"完全否定"},{"key":"B","text":"部分肯定"},{"key":"C","text":"完全肯定"},{"key":"D","text":"不屑一顾"}],"key":"B","answer":"部分肯定","max":1,"id":"西方文论-9-single-6"},{"n":7,"type":"single","prompt":"蒲柏《论批评》的主要观点是","options":[{"key":"A","text":"反对古典规范"},{"key":"B","text":"主张自由创作"},{"key":"C","text":"强调批评的理性"},{"key":"D","text":"推崇浪漫主义"}],"key":"C","answer":"强调批评的理性","max":1,"id":"西方文论-9-single-7"},{"n":8,"type":"single","prompt":"温克尔曼被称为艺术史的奠基者是因为他","options":[{"key":"A","text":"研究现代艺术"},{"key":"B","text":"开创艺术史研究方法"},{"key":"C","text":"否定古典艺术"},{"key":"D","text":"专注民间艺术"}],"key":"B","answer":"开创艺术史研究方法","max":1,"id":"西方文论-9-single-8"},{"n":9,"type":"single","prompt":"布瓦洛的代表作是","options":[{"key":"A","text":"《诗学》"},{"key":"B","text":"《诗艺》"},{"key":"C","text":"《论批评》"},{"key":"D","text":"《批判的诗学》"}],"key":"B","answer":"《诗艺》","max":1,"id":"西方文论-9-single-9"},{"n":10,"type":"single","prompt":"约翰生评价莎士比亚戏剧的观点是","options":[{"key":"A","text":"全面否定"},{"key":"B","text":"辩证评价"},{"key":"C","text":"盲目崇拜"},{"key":"D","text":"一无所知"}],"key":"B","answer":"辩证评价","max":1,"id":"西方文论-9-single-10"},{"n":11,"type":"single","prompt":"新古典主义文论的核心规范不包括","options":[{"key":"A","text":"理性"},{"key":"B","text":"古典模仿"},{"key":"C","text":"创新自由"},{"key":"D","text":"三一律"}],"key":"C","answer":"创新自由","max":1,"id":"西方文论-9-single-11"},{"n":12,"type":"single","prompt":"布瓦洛新古典主义文学理论中理性原则和自然原则的关系是","options":[{"key":"A","text":"理性服从自然"},{"key":"B","text":"自然服从理性"},{"key":"C","text":"二者无关"},{"key":"D","text":"相互对立"}],"key":"B","answer":"自然服从理性","max":1,"id":"西方文论-9-single-12"},{"n":13,"type":"single","prompt":"高特雪特《批判的诗学》的主要内容是","options":[{"key":"A","text":"批判古典主义"},{"key":"B","text":"支持新古典主义"},{"key":"C","text":"倡导浪漫主义"},{"key":"D","text":"主张现实主义"}],"key":"B","answer":"支持新古典主义","max":1,"id":"西方文论-9-single-13"},{"n":14,"type":"single","prompt":"法、英、德等国新古典主义的理论主张共同点是","options":[{"key":"A","text":"反对古典"},{"key":"B","text":"强调理性"},{"key":"C","text":"推崇浪漫"},{"key":"D","text":"主张自然"}],"key":"B","answer":"强调理性","max":1,"id":"西方文论-9-single-14"},{"n":15,"type":"single","prompt":"温克尔曼《古代艺术史》的主要观点是","options":[{"key":"A","text":"否定古希腊艺术"},{"key":"B","text":"推崇古罗马艺术"},{"key":"C","text":"研究古希腊艺术的美"},{"key":"D","text":"专注中世纪艺术"}],"key":"C","answer":"研究古希腊艺术的美","max":1,"id":"西方文论-9-single-15"},{"n":16,"type":"fill","prompt":"古典主义文论的核心是 ______ 主义。","options":[],"key":"理性","answer":"理性","max":2,"id":"西方文论-9-fill-16"},{"n":17,"type":"fill","prompt":"布瓦洛的“理性”观点强调文学创作应服从 ______ 规范。","options":[],"key":"理性","answer":"理性","max":2,"id":"西方文论-9-fill-17"},{"n":18,"type":"fill","prompt":"屈雷顿《论诗剧》涉及古今之争、 ______ 之争、诗韵之争。","options":[],"key":"英法","answer":"英法","max":2,"id":"西方文论-9-fill-18"},{"n":19,"type":"fill","prompt":"高特雪特《批判的诗学》主要支持 ______ 主义。","options":[],"key":"新古典","answer":"新古典","max":2,"id":"西方文论-9-fill-19"},{"n":20,"type":"fill","prompt":"布瓦洛的“自然”观点认为文学应模仿 ______ 自然。","options":[],"key":"理想","answer":"理想","max":2,"id":"西方文论-9-fill-20"},{"n":21,"type":"fill","prompt":"蒲柏《论批评》的主要观点是强调批评的 ______ 。","options":[],"key":"理性","answer":"理性","max":2,"id":"西方文论-9-fill-21"},{"n":22,"type":"fill","prompt":"温克尔曼被称为艺术史的 ______ 者。","options":[],"key":"奠基","answer":"奠基","max":2,"id":"西方文论-9-fill-22"},{"n":23,"type":"fill","prompt":"法、英、德等国新古典主义的理论主张共同点是强调 ______ 。","options":[],"key":"理性","answer":"理性","max":2,"id":"西方文论-9-fill-23"},{"n":24,"type":"term","prompt":"新古典主义文论","options":[],"key":"","answer":"新古典主义文论是17—18世纪流行的文论思潮,以理性为核心,主张模仿古希腊罗马的文学规范,强调文学的秩序、和谐与理性原则,代表人物有布瓦洛等。其特点是推崇古典、强调理性、遵循“三一律”等规范,在法国发展得最为系统和严格。","max":3,"id":"西方文论-9-term-24"},{"n":25,"type":"term","prompt":"布瓦洛的理性与自然原则","options":[],"key":"","answer":"布瓦洛新古典主义文论中,理性原则强调文学创作应服从理性规范,遵循古希腊罗马的文学传统;自然原则中的“自然”是理想的自然,即符合理性和古典规范的自然,自然服从理性。 二者结合,要求文学在理性指导下模仿理想的自然。","max":3,"id":"西方文论-9-term-25"},{"n":26,"type":"term","prompt":"屈雷顿的古今之争","options":[],"key":"","answer":"屈雷顿在《论诗剧》中参与的古今之争,探讨古代文学与现代文学的优劣。他认为古代文学有其规范和优点,现代文学也有创新和价值,主张在尊重古典的同时肯定现代文学的成就, 体现了辩证的文学观念。","max":3,"id":"西方文论-9-term-26"},{"n":27,"type":"term","prompt":"温克尔曼的艺术史研究","options":[],"key":"","answer":"温克尔曼是艺术史的奠基者,其《古代艺术史》系统研究了古希腊艺术,提出“高贵的单纯,静穆的伟大”的艺术观点,开创了科学的艺术史研究方法,主张从艺术作品本身理解古代精神,对后世艺术研究和文论影响深远。","max":3,"id":"西方文论-9-term-27"},{"n":28,"type":"short","prompt":"简述布瓦洛新古典主义文学理论中理性原则和自然原则的关系。","options":[],"key":"","answer":"布瓦洛认为理性原则是核心,自然原则服从理性原则。“自然”是理想的自然,即符合理性和古典规范的自然。文学创作应在理性指导下模仿理想的自然,使自然服从理性,以实现文学的秩序、和谐与美感。二者统一于理性的框架之下,体现了新古典主义以理性为本的文学观念。","max":5,"id":"西方文论-9-short-28"},{"n":29,"type":"short","prompt":"简述屈雷顿《论诗剧》关于古今之争、英法之争、诗韵之争的主要观点。","options":[],"key":"","answer":"屈雷顿《论诗剧》主要讨论了三个论争:(1)古今之争:认为古代文学有规范和优点,现代文学有创新和价值,应辩证看待。(2)英法之争:英法文学各有特点,英国文学有其独特性,不应盲目模仿法国。(3)诗韵之争:主张诗剧应使用诗韵,能增强戏剧的艺术性和感染力。上述论争体现了他的辩证文学观念。","max":5,"id":"西方文论-9-short-29"},{"n":30,"type":"short","prompt":"简述高特雪特《批判的诗学》主要内容和主要观点。","options":[],"key":"","answer":"《批判的诗学》主要支持新古典主义文论,强调文学创作应遵循古典规范,模仿古希腊罗马的文学作品;主张文学的理性原则,认为文学应服务于道德教化;批评当时偏离古典规范的创作,倡导回归古典的理性和秩序。该著作是德国新古典主义文论的代表作,推动了德国文学理论的规范化进程。","max":5,"id":"西方文论-9-short-30"},{"n":31,"type":"essay","prompt":"论述屈雷顿对莎士比亚戏剧的评价及其与法国新古典主义观点的不同。","options":[],"key":"","answer":"屈雷顿对莎士比亚戏剧的评价是部分肯定的:他认可莎士比亚的才华,肯定其对人物性格的生动塑造和情节的丰富性,但批评其不符合古典规范,不遵循“三一律”。与法国新古典主义不同:法国新古典主义(布瓦洛)完全推崇古典规范,否定不符合规范的作品;屈雷顿虽受新古典主义影响,但评价更为辩证,在一定程度上肯定了莎士比亚的文学价值。","max":15,"id":"西方文论-9-essay-31"},{"n":32,"type":"essay","prompt":"论述法、英、德等国的新古典主义的理论主张和关注焦点的共同点和不同点。","options":[],"key":"","answer":"共同点:均以理性为核心,强调文学创作和批评应遵循理性原则,推崇古希腊罗马的文学规范,追求文学的秩序、和谐与美感,重视道德教化功能。不同点:法国新古典主义(布瓦洛)强调严格的古典规范,形式要求严格;英国新古典主义(屈雷顿、蒲柏)更注重本国文学特色,对本土作家评价较为辩证;德国新古典主义(高特雪特)主要引进和传播法国理论。","max":15,"id":"西方文论-9-essay-32"}],"rawMax":88},{"id":"西方文论-10","title":"章节练习(5章)","questions":[{"n":1,"type":"single","prompt":"启蒙运动产生的社会历史原因不包括","options":[{"key":"A","text":"资本主义经济发展"},{"key":"B","text":"封建专制制度腐朽"},{"key":"C","text":"宗教神学统治强化"},{"key":"D","text":"文艺复兴思想影响"}],"key":"C","answer":"宗教神学统治强化","max":1,"id":"西方文论-10-single-1"},{"n":2,"type":"single","prompt":"狄德罗眼中的“自然”指","options":[{"key":"A","text":"超验的理念世界"},{"key":"B","text":"现实的社会生活"},{"key":"C","text":"古典的理想范式"},{"key":"D","text":"神秘的宗教意象"}],"key":"B","answer":"现实的社会生活","max":1,"id":"西方文论-10-single-2"},{"n":3,"type":"single","prompt":"莱辛论述诗与画界限的著作是","options":[{"key":"A","text":"《拉奥孔》"},{"key":"B","text":"《诗学》"},{"key":"C","text":"《论戏剧》"},{"key":"D","text":"《汉堡剧评》"}],"key":"A","answer":"《拉奥孔》","max":1,"id":"西方文论-10-single-3"},{"n":4,"type":"single","prompt":"狄德罗的“严肃剧”与传统悲剧的区别在于","options":[{"key":"A","text":"题材的崇高性"},{"key":"B","text":"人物的贵族性"},{"key":"C","text":"内容的现实性"},{"key":"D","text":"形式的规范性"}],"key":"C","answer":"内容的现实性","max":1,"id":"西方文论-10-single-4"},{"n":5,"type":"single","prompt":"莱辛对莎士比亚戏剧创作成就的评价是","options":[{"key":"A","text":"完全否定"},{"key":"B","text":"部分肯定"},{"key":"C","text":"完全肯定"},{"key":"D","text":"不屑一顾"}],"key":"B","answer":"部分肯定","max":1,"id":"西方文论-10-single-5"},{"n":6,"type":"single","prompt":"赫尔德理解诗、自然、社会三者关系的核心是","options":[{"key":"A","text":"诗模仿自然"},{"key":"B","text":"诗反映社会"},{"key":"C","text":"诗是自然与社会的统一体现"},{"key":"D","text":"诗与自然、社会无关"}],"key":"C","answer":"诗是自然与社会的统一体现","max":1,"id":"西方文论-10-single-6"},{"n":7,"type":"single","prompt":"启蒙主义文论家的共同特点是","options":[{"key":"A","text":"推崇宗教神学"},{"key":"B","text":"强调理性与现实"},{"key":"C","text":"固守古典规范"},{"key":"D","text":"否定文学的社会功能"}],"key":"B","answer":"强调理性与现实","max":1,"id":"西方文论-10-single-7"},{"n":8,"type":"single","prompt":"狄德罗的代表作不包括","options":[{"key":"A","text":"《拉摩的侄儿》"},{"key":"B","text":"《论戏剧》"},{"key":"C","text":"《汉堡剧评》"},{"key":"D","text":"《诗艺》"}],"key":"D","answer":"《诗艺》","max":1,"id":"西方文论-10-single-8"},{"n":9,"type":"single","prompt":"莱辛对拉辛戏剧创作成就的评价是","options":[{"key":"A","text":"全面否定"},{"key":"B","text":"辩证评价"},{"key":"C","text":"盲目崇拜"},{"key":"D","text":"一无所知"}],"key":"B","answer":"辩证评价","max":1,"id":"西方文论-10-single-9"},{"n":10,"type":"single","prompt":"启蒙运动的思想文化背景不包括","options":[{"key":"A","text":"文艺复兴人文主义"},{"key":"B","text":"宗教改革思想"},{"key":"C","text":"古典主义文论"},{"key":"D","text":"浪漫主义思潮"}],"key":"D","answer":"浪漫主义思潮","max":1,"id":"西方文论-10-single-10"},{"n":11,"type":"single","prompt":"狄德罗的“真实”观强调","options":[{"key":"A","text":"超验的真实"},{"key":"B","text":"现实的真实"},{"key":"C","text":"古典的真实"},{"key":"D","text":"宗教的真实"}],"key":"B","answer":"现实的真实","max":1,"id":"西方文论-10-single-11"},{"n":12,"type":"single","prompt":"莱辛论述诗与画界限的核心观点是","options":[{"key":"A","text":"诗与画无界限"},{"key":"B","text":"诗是时间艺术,画是空间艺术"},{"key":"C","text":"诗是空间艺术,画是时间艺术"},{"key":"D","text":"诗与画界限模糊"}],"key":"B","answer":"诗是时间艺术,画是空间艺术","max":1,"id":"西方文论-10-single-12"},{"n":13,"type":"single","prompt":"赫尔德的文论贡献主要在","options":[{"key":"A","text":"戏剧理论"},{"key":"B","text":"诗学理论"},{"key":"C","text":"美学理论"},{"key":"D","text":"艺术史理论"}],"key":"B","answer":"诗学理论","max":1,"id":"西方文论-10-single-13"},{"n":14,"type":"single","prompt":"启蒙主义文论的代表人物不包括","options":[{"key":"A","text":"狄德罗"},{"key":"B","text":"莱辛"},{"key":"C","text":"赫尔德"},{"key":"D","text":"布瓦洛"}],"key":"D","answer":"布瓦洛","max":1,"id":"西方文论-10-single-14"},{"n":15,"type":"single","prompt":"狄德罗“严肃剧”的主要特点是","options":[{"key":"A","text":"题材崇高,人物贵族"},{"key":"B","text":"题材现实,人物普通"},{"key":"C","text":"题材神话,人物神化"},{"key":"D","text":"题材虚构, 人物离奇"}],"key":"B","answer":"题材现实,人物普通","max":1,"id":"西方文论-10-single-15"},{"n":16,"type":"fill","prompt":"启蒙运动产生的社会历史原因是资本主义经济发展和 ______ 专制制度腐朽。","options":[],"key":"封建","answer":"封建","max":2,"id":"西方文论-10-fill-16"},{"n":17,"type":"fill","prompt":"狄德罗眼中的自然指 ______ 的社会生活。","options":[],"key":"现实","answer":"现实","max":2,"id":"西方文论-10-fill-17"},{"n":18,"type":"fill","prompt":"莱辛论述诗与画界限的著作是《 ______ 》。","options":[],"key":"拉奥孔","answer":"拉奥孔","max":2,"id":"西方文论-10-fill-18"},{"n":19,"type":"fill","prompt":"狄德罗的严肃剧与传统悲剧的区别在于内容的 ______ 。","options":[],"key":"现实性","answer":"现实性","max":2,"id":"西方文论-10-fill-19"},{"n":20,"type":"fill","prompt":"赫尔德理解诗、自然、社会三者关系的核心是诗是自然与社会的 ______ 体现。","options":[],"key":"统一","answer":"统一","max":2,"id":"西方文论-10-fill-20"},{"n":21,"type":"fill","prompt":"启蒙主义文论家的共同特点是强调 ______ 与现实。","options":[],"key":"理性","answer":"理性","max":2,"id":"西方文论-10-fill-21"},{"n":22,"type":"fill","prompt":"狄德罗的“真实”观强调 ______ 的真实。","options":[],"key":"现实","answer":"现实","max":2,"id":"西方文论-10-fill-22"},{"n":23,"type":"fill","prompt":"莱辛论述诗与画界限的核心观点是诗是 ______ 艺术,画是空间艺术。","options":[],"key":"时间","answer":"时间","max":2,"id":"西方文论-10-fill-23"},{"n":24,"type":"term","prompt":"启蒙主义文论","options":[],"key":"","answer":"启蒙主义文论是18世纪流行的文论思潮,以理性为核心,强调文学反映现实社会,关注普通人的生活,主张文学具有教育和启蒙功能,代表人物有狄德罗、莱辛、赫尔德等。其特点是理性与现实并重,推动了文学的世俗化和社会化。","max":3,"id":"西方文论-10-term-24"},{"n":25,"type":"term","prompt":"狄德罗的严肃剧","options":[],"key":"","answer":"狄德罗提出的戏剧类型,与传统悲剧不同,以现实生活为题材,人物多为普通人,旨在反映社会问题、启迪观众思考。严肃剧介于悲剧与喜剧之间,又称正剧,打破了传统戏剧的题材限制,体现了启蒙主义对现实的关注和对普通人的重视。","max":3,"id":"西方文论-10-term-25"},{"n":26,"type":"term","prompt":"莱辛的诗画界限论","options":[],"key":"","answer":"莱辛在《拉奥孔》中提出的文论观点,认为诗是时间艺术,通过时间的延续表现动作;画是空间艺术,通过空间的布局表现形象。诗与画在表现对象、方式上存在本质区别,明确了诗与画的界限,纠正了诗画不分的传统观念。","max":3,"id":"西方文论-10-term-26"},{"n":27,"type":"term","prompt":"赫尔德的诗、自然、社会关系论","options":[],"key":"","answer":"赫尔德认为诗是自然与社会的统一体现:自然是诗的源泉,提供丰富的素材和美的形式;社会是诗的内容,反映人类的生活和情感;诗将自然的美和社会的真实融合在一起,展现出独特的艺术魅力。这一观点体现了启蒙主义的现实精神。","max":3,"id":"西方文论-10-term-27"},{"n":28,"type":"short","prompt":"简述狄德罗的严肃剧与传统文论中的悲剧的区别。","options":[],"key":"","answer":"狄德罗的严肃剧与传统悲剧的区别主要有:(1)题材上,严肃剧以现实生活为题材,传统悲剧多为崇高的神话或贵族故事;(2)人物上,严肃剧的人物是普通人,传统悲剧的人物多为贵族或英雄;(3)内容上,严肃剧具有现实性,关注社会问题,传统悲剧注重形式的规范性。严肃剧由此打破了传统戏剧的题材限制。","max":5,"id":"西方文论-10-short-28"},{"n":29,"type":"short","prompt":"简述莱辛是如何论述诗与画的界限的。","options":[],"key":"","answer":"莱辛在《拉奥孔》中论述诗与画的界限:诗是时间艺术,通过时间的延续表现动作、情节和情感;画是空间艺术,通过空间的布局表现形象、场景和静态美。诗擅长表现动态的、连续的事物,画擅长表现静态的、瞬间的事物,二者在表现对象和方式上存在本质区别,为艺术创作提供了理论依据。","max":5,"id":"西方文论-10-short-29"},{"n":30,"type":"short","prompt":"简述启蒙运动产生的社会历史原因和思想文化背景。","options":[],"key":"","answer":"启蒙运动产生的社会历史原因:资本主义经济发展,要求打破封建专制的束缚;封建专制制度腐朽,阻碍社会进步;文艺复兴和宗教改革使人们的思想得到解放。思想文化背景:文艺复兴的人文主义思想,强调人的价值和尊严;宗教改革打破了天主教会的精神统治;古典主义文论为其提供思想资源。","max":5,"id":"西方文论-10-short-30"},{"n":31,"type":"essay","prompt":"论述赫尔德是如何理解诗、自然、社会三者关系的,以及这一观点的意义。","options":[],"key":"","answer":"赫尔德认为诗、自然、社会三者是统一的关系:自然是诗的源泉,提供丰富的素材和美的形式,诗应模仿自然的多样性;社会是诗的内容,诗应反映社会的生活、情感和矛盾;诗是自然与社会的统一体现,将自然的美和社会的真实融合在一起。其意义在于:突破了传统模仿论的局限,将三者视为有机整体,强调诗的综合性和创造性,为浪漫主义文论奠定了基础。","max":15,"id":"西方文论-10-essay-31"},{"n":32,"type":"essay","prompt":"论述启蒙主义文论家的共同特点,并举例说明其代表人物的理论创新之处。","options":[],"key":"","answer":"启蒙主义文论家的共同特点是强调理性与现实,主张文学反映现实社会,关注普通人的生活,具有教育和启蒙功能。代表人物的理论创新之处:狄德罗提出严肃剧理论,以现实生活为题材,关注普通人的命运,使戏剧更贴近现实;莱辛在《拉奥孔》中明确诗与画的界限, 纠正诗画不分的观念;赫尔德提出诗、自然、社会统一的观点,为浪漫主义文论开辟了道路。","max":15,"id":"西方文论-10-essay-32"}],"rawMax":88},{"id":"西方文论-11","title":"章节练习(6章)","questions":[{"n":1,"type":"single","prompt":"德国古典文论产生的社会历史原因不包括","options":[{"key":"A","text":"德国资本主义发展"},{"key":"B","text":"德国资产阶级启蒙运动"},{"key":"C","text":"封建专制制度强化"},{"key":"D","text":"德国古典哲学影响"}],"key":"C","answer":"封建专制制度强化","max":1,"id":"西方文论-11-single-1"},{"n":2,"type":"single","prompt":"康德认为“一般的艺术”具有的特征不包括","options":[{"key":"A","text":"人为性"},{"key":"B","text":"自由性"},{"key":"C","text":"模仿性"},{"key":"D","text":"创造性"}],"key":"C","answer":"模仿性","max":1,"id":"西方文论-11-single-2"},{"n":3,"type":"single","prompt":"歌德认为民族作家产生的条件是","options":[{"key":"A","text":"闭关锁国"},{"key":"B","text":"盲目模仿外国"},{"key":"C","text":"扎根民族文化,吸收外国文化"},{"key":"D","text":"完全排斥外国文化"}],"key":"C","answer":"扎根民族文化,吸收外国文化","max":1,"id":"西方文论-11-single-3"},{"n":4,"type":"single","prompt":"席勒的悲剧观强调","options":[{"key":"A","text":"命运的不可抗拒"},{"key":"B","text":"性格的缺陷"},{"key":"C","text":"道德的冲突"},{"key":"D","text":"理念的矛盾"}],"key":"C","answer":"道德的冲突","max":1,"id":"西方文论-11-single-4"},{"n":5,"type":"single","prompt":"黑格尔关于艺术发展的历史类型理论中,第一个阶段是","options":[{"key":"A","text":"象征型艺术"},{"key":"B","text":"古典型艺术"},{"key":"C","text":"浪漫型艺术"},{"key":"D","text":"现实型艺术"}],"key":"A","answer":"象征型艺术","max":1,"id":"西方文论-11-single-5"},{"n":6,"type":"single","prompt":"康德认为“艺术天才”具有的特征不包括","options":[{"key":"A","text":"独创性"},{"key":"B","text":"模仿性"},{"key":"C","text":"典范性"},{"key":"D","text":"自然性"}],"key":"B","answer":"模仿性","max":1,"id":"西方文论-11-single-6"},{"n":7,"type":"single","prompt":"歌德艺术与自然的关系理论强调","options":[{"key":"A","text":"艺术模仿自然"},{"key":"B","text":"艺术高于自然"},{"key":"C","text":"艺术与自然无关"},{"key":"D","text":"自然模仿艺术"}],"key":"B","answer":"艺术高于自然","max":1,"id":"西方文论-11-single-7"},{"n":8,"type":"single","prompt":"席勒对素朴诗和感伤诗的区分标准是","options":[{"key":"A","text":"时代特征"},{"key":"B","text":"地域特征"},{"key":"C","text":"作家性格"},{"key":"D","text":"表现方式"}],"key":"A","answer":"时代特征","max":1,"id":"西方文论-11-single-8"},{"n":9,"type":"single","prompt":"黑格尔的悲剧理论认为悲剧的根源是","options":[{"key":"A","text":"命运"},{"key":"B","text":"性格"},{"key":"C","text":"理念的冲突"},{"key":"D","text":"道德"}],"key":"C","answer":"理念的冲突","max":1,"id":"西方文论-11-single-9"},{"n":10,"type":"single","prompt":"德国古典文论的代表人物不包括","options":[{"key":"A","text":"康德"},{"key":"B","text":"歌德"},{"key":"C","text":"席勒"},{"key":"D","text":"布瓦洛"}],"key":"D","answer":"布瓦洛","max":1,"id":"西方文论-11-single-10"},{"n":11,"type":"single","prompt":"康德文艺思想的两个突出特征是","options":[{"key":"A","text":"形式主义和主观主义"},{"key":"B","text":"现实主义和客观主义"},{"key":"C","text":"浪漫主义和唯美主义"},{"key":"D","text":"批判主义和先验主义"}],"key":"D","answer":"批判主义和先验主义","max":1,"id":"西方文论-11-single-11"},{"n":12,"type":"single","prompt":"歌德的代表作不包括","options":[{"key":"A","text":"《浮士德》"},{"key":"B","text":"《少年维特之烦恼》"},{"key":"C","text":"《判断力批判》"},{"key":"D","text":"《歌德谈话录》"}],"key":"C","answer":"《判断力批判》","max":1,"id":"西方文论-11-single-12"},{"n":13,"type":"single","prompt":"席勒的悲剧观与的悲剧观不同","options":[{"key":"A","text":"黑格尔"},{"key":"B","text":"康德"},{"key":"C","text":"歌德"},{"key":"D","text":"亚里士多德"}],"key":"D","answer":"亚里士多德","max":1,"id":"西方文论-11-single-13"},{"n":14,"type":"single","prompt":"黑格尔艺术发展的历史类型理论中,最符合理念的艺术是","options":[{"key":"A","text":"象征型艺术"},{"key":"B","text":"古典型艺术"},{"key":"C","text":"浪漫型艺术"},{"key":"D","text":"现实型艺术"}],"key":"B","answer":"古典型艺术","max":1,"id":"西方文论-11-single-14"},{"n":15,"type":"single","prompt":"德国古典文论的特点是","options":[{"key":"A","text":"强调感性,否定理性"},{"key":"B","text":"融合哲学与文论,强调理性与审美统一"},{"key":"C","text":"完全模仿古典,反对创新"},{"key":"D","text":"强调现实,否定理想"}],"key":"B","answer":"融合哲学与文论,强调理性与审美统一","max":1,"id":"西方文论-11-single-15"},{"n":16,"type":"fill","prompt":"德国古典文论产生的社会历史原因是德国资本主义发展和 ______ 启蒙运动。","options":[],"key":"资产阶级","answer":"资产阶级","max":2,"id":"西方文论-11-fill-16"},{"n":17,"type":"fill","prompt":"康德认为“一般的艺术”具有人为性、自由性和 ______ 性。","options":[],"key":"创造","answer":"创造","max":2,"id":"西方文论-11-fill-17"},{"n":18,"type":"fill","prompt":"歌德认为民族作家产生的条件是扎根民族文化,吸收 ______ 文化。","options":[],"key":"外国","answer":"外国","max":2,"id":"西方文论-11-fill-18"},{"n":19,"type":"fill","prompt":"席勒的悲剧观强调 ______ 的冲突。","options":[],"key":"道德","answer":"道德","max":2,"id":"西方文论-11-fill-19"},{"n":20,"type":"fill","prompt":"黑格尔关于艺术发展的历史类型理论中,第一个阶段是 ______ 型艺术。","options":[],"key":"象征","answer":"象征","max":2,"id":"西方文论-11-fill-20"},{"n":21,"type":"fill","prompt":"康德认为“艺术天才”具有独创性、 ______ 性和自然性。","options":[],"key":"典范","answer":"典范","max":2,"id":"西方文论-11-fill-21"},{"n":22,"type":"fill","prompt":"歌德艺术与自然的关系理论强调艺术 ______ 自然。","options":[],"key":"高于","answer":"高于","max":2,"id":"西方文论-11-fill-22"},{"n":23,"type":"fill","prompt":"席勒对素朴诗和感伤诗的区分标准是 ______ 特征。","options":[],"key":"时代","answer":"时代","max":2,"id":"西方文论-11-fill-23"},{"n":24,"type":"term","prompt":"德国古典文论","options":[],"key":"","answer":"德国古典文论是18世纪末至19世纪初德国的文论思潮,融合德国古典哲学,代表人物有康德、歌德、席勒、黑格尔等。其特点是强调理性与审美统一,融合哲学与文论,探讨艺术的本质、发展规律等问题,是西方文论史上的重要阶段。","max":3,"id":"西方文论-11-term-24"},{"n":25,"type":"term","prompt":"康德的审美理念","options":[],"key":"","answer":"康德的审美理念指在审美判断中想象力与知性自由协调所产生的一种超越感性经验的理性观念,不能用概念完全表达,却能引发丰富的审美联想,是审美判断的核心,与“无目的的合目的性”相联系。","max":3,"id":"西方文论-11-term-25"},{"n":26,"type":"term","prompt":"歌德的艺术与自然关系论","options":[],"key":"","answer":"歌德认为艺术高于自然,艺术不是对自然的简单模仿,而是对自然的升华和创造。自然是艺术的素材,艺术通过对自然的选择、提炼和加工,创造出高于自然的艺术美,体现了艺术的创造性和自主性。","max":3,"id":"西方文论-11-term-26"},{"n":27,"type":"term","prompt":"席勒的素朴诗与感伤诗","options":[],"key":"","answer":"席勒根据时代特征区分素朴诗和感伤诗:素朴诗是古代的,模仿自然,表现客观现实;感伤诗是近代的,表现主观情感,对现实不满。这一区分反映了不同时代的文学特征,体现了席勒对文学发展规律的认识,他主张理想文学应融合二者。","max":3,"id":"西方文论-11-term-27"},{"n":28,"type":"short","prompt":"简述康德文艺思想的两个突出特征。","options":[],"key":"","answer":"康德文艺思想有两个突出特征:批判主义和先验主义。(1)批判主义:批判理性,探讨人类认识的界限,划定审美判断的领域。(2)先验主义:强调先天认识形式,认为审美判断依赖于先天的时空形式和范畴。二者使其文艺思想具有深刻的哲学性和系统性,对后世美学与文论影响深远。","max":5,"id":"西方文论-11-short-28"},{"n":29,"type":"short","prompt":"简述歌德认为民族作家产生的条件。","options":[],"key":"","answer":"歌德认为民族作家产生的条件是扎根民族文化,吸收外国文化。民族作家应深入了解本民族的历史、文化和生活,从民族传统中汲取素材;同时吸收外国文化的精华,将民族性与世界性结合,从而创作出具有独特价值的作品,推动民族文学走向世界,也推动世界文学的形成。","max":5,"id":"西方文论-11-short-29"},{"n":30,"type":"short","prompt":"简述如何理解席勒对素朴诗和感伤诗的区分。","options":[],"key":"","answer":"席勒根据时代特征区分素朴诗和感伤诗:(1)素朴诗是古代的,模仿自然,表现客观现实,诗人与自然和谐统一。(2)感伤诗是近代的,表现主观情感,对现实不满,诗人在理想中追寻自然。这种区分反映了古代文学与近代文学的不同特征,体现了文学随时代发展的规律。","max":5,"id":"西方文论-11-short-30"},{"n":31,"type":"essay","prompt":"论述黑格尔关于艺术发展的历史类型理论及其意义。","options":[],"key":"","answer":"黑格尔将艺术发展分为象征型、古典型、浪漫型三个阶段:(1)象征型:理念与形象不统一,形象只是理念的象征,形式大于内容。(2)古典型:理念与形象完美统一,达到艺术美的理想。(3)浪漫型:理念超越形象,转向心灵世界,内容大于形式。它从哲学高度揭示了艺术发展的规律,为艺术史研究提供了理论框架,对后世美学研究产生了深远影响。","max":15,"id":"西方文论-11-essay-31"},{"n":32,"type":"essay","prompt":"论述德国古典文论的特点及其在西方文论史上的地位。","options":[],"key":"","answer":"德国古典文论的特点主要有:(1)融合哲学与文论,富有思想性与系统性。(2)强调理性与审美的统一。(3)探讨艺术本质、发展规律等根本问题,富有思辨性。(4)代表人物众多,从康德到黑格尔形成完整体系。其地位:是文论从近代向现代过渡的关键阶段,使文论成为独立的严格理论形态,影响马克思主义文论与现代西方文论。","max":15,"id":"西方文论-11-essay-32"}],"rawMax":88},{"id":"西方文论-12","title":"章节练习(7章)","questions":[{"n":1,"type":"single","prompt":"浪漫主义文学思潮产生的社会历史原因不包括","options":[{"key":"A","text":"资产阶级革命的影响"},{"key":"B","text":"工业革命的冲击"},{"key":"C","text":"古典主义的复兴"},{"key":"D","text":"启蒙思想的传播"}],"key":"C","answer":"古典主义的复兴","max":1,"id":"西方文论-12-single-1"},{"n":2,"type":"single","prompt":"海涅对于浪漫主义批判的观点是","options":[{"key":"A","text":"完全支持"},{"key":"B","text":"部分肯定"},{"key":"C","text":"尖锐批判"},{"key":"D","text":"不屑一顾"}],"key":"C","answer":"尖锐批判","max":1,"id":"西方文论-12-single-2"},{"n":3,"type":"single","prompt":"施莱格尔的文学创作主张是","options":[{"key":"A","text":"模仿古典"},{"key":"B","text":"崇尚理性"},{"key":"C","text":"自由创新"},{"key":"D","text":"遵循规范"}],"key":"C","answer":"自由创新","max":1,"id":"西方文论-12-single-3"},{"n":4,"type":"single","prompt":"华兹华斯关于诗的题材观点是","options":[{"key":"A","text":"贵族生活"},{"key":"B","text":"宫廷事务"},{"key":"C","text":"普通生活"},{"key":"D","text":"神话传说"}],"key":"C","answer":"普通生活","max":1,"id":"西方文论-12-single-4"},{"n":5,"type":"single","prompt":"柯勒律治关于天才的观点是","options":[{"key":"A","text":"天才源于模仿"},{"key":"B","text":"天才是自然的禀赋"},{"key":"C","text":"天才可以培养"},{"key":"D","text":"天才无关紧要"}],"key":"B","answer":"天才是自然的禀赋","max":1,"id":"西方文论-12-single-5"},{"n":6,"type":"single","prompt":"夏多布里昂的“神秘为美”观点强调","options":[{"key":"A","text":"现实的清晰"},{"key":"B","text":"理性的明确"},{"key":"C","text":"宗教的神秘"},{"key":"D","text":"自然的直白"}],"key":"C","answer":"宗教的神秘","max":1,"id":"西方文论-12-single-6"},{"n":7,"type":"single","prompt":"雨果的美丑对照原则强调","options":[{"key":"A","text":"美丑的分离"},{"key":"B","text":"美丑的统一"},{"key":"C","text":"只写美"},{"key":"D","text":"只写丑"}],"key":"B","answer":"美丑的统一","max":1,"id":"西方文论-12-single-7"},{"n":8,"type":"single","prompt":"浪漫主义文论的基本特点不包括","options":[{"key":"A","text":"崇尚理性"},{"key":"B","text":"强调情感"},{"key":"C","text":"追求个性"},{"key":"D","text":"向往自然"}],"key":"A","answer":"崇尚理性","max":1,"id":"西方文论-12-single-8"},{"n":9,"type":"single","prompt":"施莱格尔的代表作是","options":[{"key":"A","text":"《抒情歌谣集》"},{"key":"B","text":"《论德国》"},{"key" r":"普通","max":2,"id":"西方文论-12-fill-19"},{"n":20,"type":"fill","prompt":"柯勒律治关于天才的观点是天才是自然的 ______ 。","options":[],"key":"禀赋","answer":"禀赋","max":2,"id":"西方文论-12-fill-20"},{"n":21,"type":"fill","prompt":"夏多布里昂的“神秘为美”观点强调 ______ 的神秘。","options":[],"key":"宗教","answer":"宗教","max":2,"id":"西方文论-12-fill-21"},{"n":22,"type":"fill","prompt":"雨果的美丑对照原则强调美丑的 ______ 。","options":[],"key":"统一","answer":"统一","max":2,"id":"西方文论-12-fill-22"},{"n":23,"type":"fill","prompt":"浪漫主义文论的基本特点是强调情感、追求个性和 ______ 自然。","options":[],"key":"向往","answer":"向往","max":2,"id":"西方文论-12-fill-23"},{"n":24,"type":"term","prompt":"浪漫主义文论","options":[],"key":"","answer":"浪漫主义文论是18—19世纪流行的文论思潮,强调情感、个性、自然和创新,反对古典主义的理性和规范,代表人物有施莱格尔、华兹华斯、柯勒律治、雨果等。它崇尚情感与个性解放,推动了欧洲文学的革新,对后世文论影响深远。","max":3,"id":"西方文论-12-term-24"},{"n":25,"type":"term","prompt":"施莱格尔的自由创新主张","options":[],"key":"","answer":"施莱格尔主张文学创作应自由创新,打破古典主义的束缚,强调文学的自主性和创造性,认为文学不应受外在规范限制,应自由表达情感和思想,主张文学不断生成、永远处于形成之中,是浪漫主义文学创作的重要理论基础。","max":3,"id":"西方文论-12-term-25"},{"n":26,"type":"term","prompt":"柯勒律治的想象理论","options":[],"key":"","answer":"柯勒律治将想象分为“原生想象”和“次生想象”:原生想象是被动的模仿,次生想象是主动的创造,具有整合和创新的能力,能化零散素材为有机整体。他认为天才的核心在于强大的次生想象,强调想象在文学创作中的核心作用。","max":3,"id":"西方文论-12-term-26"},{"n":27,"type":"term","prompt":"雨果的美丑对照原则","options":[],"key":"","answer":"雨果提出的美丑对照原则,主张在文学创作中将美与丑、善与恶、崇高与卑下等相互对照、 统一存在,通过对比凸显艺术的张力和感染力,打破了传统文学对美的单一追求,真实反映生活的复杂性,是浪漫主义重要的创作方法。","max":3,"id":"西方文论-12-term-27"},{"n":28,"type":"short","prompt":"简述如何理解施莱格尔的文学创作主张。","options":[],"key":"","answer":"施莱格尔的文学创作主张是自由创新:他反对古典主义的理性规范和模仿传统,强调文学的自主性和创造性,认为文学应自由表达情感和思想,不受外在束缚;主张文学不断生成,永远处于形成之中。这一主张体现了浪漫主义对文学独立性的追求,推动了文学创作的多元化发展。","max":5,"id":"西方文论-12-short-28"},{"n":29,"type":"short","prompt":"简述如何理解柯勒律治的想象理论。","options":[],"key":"","answer":"柯勒律治将想象分为原生想象和次生想象:(1)原生想象是被动的模仿,是一切感知的基础;(2)次生想象是主动的创造,具有整合和创新能力,能将各种素材整合为有机的艺术整体。他认为天才的核心在于强大的次生想象,为浪漫主义文学创作提供了理论支持。","max":5,"id":"西方文论-12-short-29"},{"n":30,"type":"short","prompt":"简述浪漫主义文论的基本特点。","options":[],"key":"","answer":"浪漫主义文论的基本特点有:(1)强调情感,认为情感是文学的核心,反对理性的压制; (2)追求个性,主张文学创作应展现作家的独特个性;(3)向往自然,将自然视为纯真美好的象征;(4)主张自由创新,打破古典主义规范,强调文学的自主性和创造性,推动了欧洲文学的革新,对后世文论与创作影响深远。","max":5,"id":"西方文论-12-short-30"},{"n":31,"type":"essay","prompt":"论述柯勒律治的想象理论及其在浪漫主义文论中的地位。","options":[],"key":"","answer":"柯勒律治将想象分为“原生想象”和“次生想象”:原生想象是被动的模仿;次生想象是主动的创造,具有整合、创新的能力,能将不同素材融合为有机的艺术整体。他认为天才的本质在于强大的次生想象。该理论突破了传统模仿论的局限,将文学创作的重心从外在模仿转向内在创造,为浪漫主义文学的“创造性”提供理论依据。","max":15,"id":"西方文论-12-essay-31"},{"n":32,"type":"essay","prompt":"论述雨果的美丑对照原则及其艺术价值。","options":[],"key":"","answer":"雨果的美丑对照原则主张在文学创作中将美与丑、善与恶、崇高与卑下等相互对照、并存于同一作品中,通过强烈对比凸显艺术的张力和感染力,他认为美丑并非孤立存在,而是在对比中展现各自本质。其艺术价值:打破传统文学对美的单一追求,真实反映生活的复杂性, 拓展了文学的表现领域,增强了作品的艺术冲击力。","max":15,"id":"西方文论-12-essay-32"}],"rawMax":88},{"id":"西方文论-13","title":"章节练习(8章)","questions":[{"n":1,"type":"single","prompt":"现实主义文学创作观念的历史渊源不包括","options":[{"key":"A","text":"古典主义模仿论"},{"key":"B","text":"浪漫主义情感论"},{"key":"C","text":"启蒙主义现实观"},{"key":"D","text":"中世纪神学观"}],"key":"D","answer":"中世纪神学观","max":1,"id":"西方文论-13-single-1"},{"n":2,"type":"single","prompt":"巴尔扎克对现实主义典型的认识强调","options":[{"key":"A","text":"个性单一化"},{"key":"B","text":"类型化"},{"key":"C","text":"共性与个性统一"},{"key":"D","text":"纯粹个性"}],"key":"C","answer":"共性与个性统一","max":1,"id":"西方文论-13-single-2"},{"n":3,"type":"single","prompt":"左拉自然主义的内涵不包括","options":[{"key":"A","text":"科学观察"},{"key":"B","text":"客观记录"},{"key":"C","text":"强调主观"},{"key":"D","text":"遗传决定论"}],"key":"C","answer":"强调主观","max":1,"id":"西方文论-13-single-3"},{"n":4,"type":"single","prompt":"狄更斯的批判现实主义观点核心是","options":[{"key":"A","text":"纯粹赞美"},{"key":"B","text":"揭露社会黑暗"},{"key":"C","text":"宣扬宗教"},{"key":"D","text":"歌颂贵族"}],"key":"B","answer":"揭露社会黑暗","max":1,"id":"西方文论-13-single-4"},{"n":5,"type":"single","prompt":"詹姆斯对小说叙述视角的认识强调","options":[{"key":"A","text":"全知视角"},{"key":"B","text":"作者视角"},{"key":"C","text":"人物有限视角"},{"key":"D","text":"旁观者视角"}],"key":"C","answer":"人物有限视角","max":1,"id":"西方文论-13-single-5"},{"n":6,"type":"single","prompt":"别林斯基形象思维理论的内涵是","options":[{"key":"A","text":"理性至上"},{"key":"B","text":"情感主导"},{"key":"C","text":"艺术用形象思维"},{"key":"D","text":"模仿自然"}],"key":"C","answer":"艺术用形象思维","max":1,"id":"西方文论-13-single-6"},{"n":7,"type":"single","prompt":"车尔尼雪夫斯基“美的生活”强调","options":[{"key":"A","text":"超验的美"},{"key":"B","text":"现实的生活美"},{"key":"C","text":"古典的美"},{"key":"D","text":"宗教的美"}],"key":"B","answer":"现实的生活美","max":1,"id":"西方文论-13-single-7"},{"n":8,"type":"single","prompt":"杜勃罗留波夫对文学人民性的认识是","options":[{"key":"A","text":"贵族文学"},{"key":"B","text":"反映人民生活与利益"},{"key":"C","text":"纯艺术"},{"key":"D","text":"宗教文学"}],"key":"B","answer":"反映人民生活与利益","max":1,"id":"西方文论-13-single-8"},{"n":9,"type":"single","prompt":"现实主义文论的特点不包括","options":[{"key":"A","text":"强调客观"},{"key":"B","text":"关注现实"},{"key":"C","text":"追求理想"},{"key":"D","text":"注重典型"}],"key":"C","answer":"追求理想","max":1,"id":"西方文论-13-single-9"},{"n":10,"type":"single","prompt":"巴尔扎克的代表作是","options":[{"key":"A","text":"《红与黑》"},{"key":"B","text":"《人间喜剧》"},{"key":"C","text":"《战争与和平》"},{"key":"D","text":"《悲惨世界》"}],"key":"B","answer":"《人间喜剧》","max":1,"id":"西方文论-13-single-10"},{"n":11,"type":"single","prompt":"左拉自然主义的不足体现在","options":[{"key":"A","text":"过于客观"},{"key":"B","text":"缺乏情感"},{"key":"C","text":"忽视社会因素"},{"key":"D","text":"强调个性"}],"key":"C","answer":"忽视社会因素","max":1,"id":"西方文论-13-single-11"},{"n":12,"type":"single","prompt":"詹姆斯的文论属于","options":[{"key":"A","text":"英国现实主义"},{"key":"B","text":"美国现实主义"},{"key":"C","text":"法国现实主义"},{"key":"D","text":"德国现实主义"}],"key":"B","answer":"美国现实主义","max":1,"id":"西方文论-13-single-12"},{"n":13,"type":"single","prompt":"别林斯基的文论属于","options":[{"key":"A","text":"俄国现实主义"},{"key":"B","text":"苏联社会主义现实主义"},{"key":"C","text":"法国现实主义"},{"key":"D","text":"英国现实主义"}],"key":"A","answer":"俄国现实主义","max":1,"id":"西方文论-13-single-13"},{"n":14,"type":"single","prompt":"现实主义与浪漫主义的核心区别是","options":[{"key":"A","text":"是否关注自然"},{"key":"B","text":"是否强调客观"},{"key":"C","text":"是否追求创新"},{"key":"D","text":"是否模仿古典"}],"key":"B","answer":"是否强调客观","max":1,"id":"西方文论-13-single-14"},{"n":15,"type":"single","prompt":"车尔尼雪夫斯基的“美是生活”主张属于","options":[{"key":"A","text":"唯心主义"},{"key":"B","text":"唯物主义"},{"key":"C","text":"神秘主义"},{"key":"D","text":"形式主义"}],"key":"B","answer":"唯物主义","max":1,"id":"西方文论-13-single-15"},{"n":16,"type":"fill","prompt":"现实主义文学创作观念的历史渊源包括古典主义 ______ 论。","options":[],"key":"模仿","answer":"模仿","max":2,"id":"西方文论-13-fill-16"},{"n":17,"type":"fill","prompt":"巴尔扎克对现实主义典型的认识是共性与 ______ 统一。","options":[],"key":"个性","answer":"个性","max":2,"id":"西方文论-13-fill-17"},{"n":18,"type":"fill","prompt":"左拉自然主义的内涵包括科学观察和 ______ 记录。","options":[],"key":"客观","answer":"客观","max":2,"id":"西方文论-13-fill-18"},{"n":19,"type":"fill","prompt":"狄更斯的批判现实主义观点核心是揭露社会 ______ 。","options":[],"key":"黑暗","answer":"黑暗","max":2,"id":"西方文论-13-fill-19"},{"n":20,"type":"fill","prompt":"詹姆斯对小说叙述视角的认识强调人物 ______ 视角。","options":[],"key":"有限","answer":"有限","max":2,"id":"西方文论-13-fill-20"},{"n":21,"type":"fill","prompt":"别林斯基形象思维理论的内涵是艺术用 ______ 思维。","options":[],"key":"形象","answer":"形象","max":2,"id":"西方文论-13-fill-21"},{"n":22,"type":"fill","prompt":"车尔尼雪夫斯基“美的生活”强调 ______ 的生活美。","options":[],"key":"现实","answer":"现实","max":2,"id":"西方文论-13-fill-22"},{"n":23,"type":"fill","prompt":"杜勃罗留波夫对文学人民性的认识是反映人民的生活与 ______ 。","options":[],"key":"利益","answer":"利益","max":2,"id":"西方文论-13-fill-23"},{"n":24,"type":"term","prompt":"现实主义文论","options":[],"key":"","answer":"现实主义文论是19世纪流行的文论思潮,强调客观再现现实生活,关注社会底层和现实矛盾,注重典型人物塑造,代表人物有巴尔扎克、狄更斯、别林斯基等。它客观真实、关注现实、重视典型,是19世纪西方文论的主流之一。","max":3,"id":"西方文论-13-term-24"},{"n":25,"type":"term","prompt":"巴尔扎克的典型观","options":[],"key":"","answer":"巴尔扎克认为典型是“共性与个性的统一”,即典型人物既体现某一社会阶层或时代的本质特征,又具有独特的性格、外貌和行为。他通过《人间喜剧》中的典型人物展现了这一典型观,使现实主义人物具有深刻的社会意义和艺术魅力。","max":3,"id":"西方文论-13-term-25"},{"n":26,"type":"term","prompt":"别林斯基的形象思维理论","options":[],"key":"","answer":"别林斯基提出“艺术是形象思维”,认为艺术创作不是通过抽象的逻辑思维,而是通过具体的艺术形象来表达思想和情感。形象思维以现实生活为基础,通过想象、虚构创造出具有审美价值的艺术形象,为现实主义艺术创作提供了理论依据。","max":3,"id":"西方文论-13-term-26"},{"n":27,"type":"term","prompt":"杜勃罗留波夫的文学人民性","options":[],"key":"","answer":"杜勃罗留波夫认为文学的人民性是指文学反映人民的生活、利益、思想情感和愿望,成为人民的喉舌。他主张文学应服务于人民,揭露社会黑暗,反映人民的苦难和追求,体现了现实主义文论的民主性和批判性。","max":3,"id":"西方文论-13-term-27"},{"n":28,"type":"short","prompt":"简述如何理解巴尔扎克对于现实主义的认识,尤其是他对典型的认识。","options":[],"key":"","answer":"巴尔扎克认为现实主义应客观再现社会现实,通过典型人物揭示社会本质。(1)他的典型观是“共性与个性的统一”:典型人物既体现社会阶层的共性特征,又具有独特的性格与行为等个性特征。(2)作家应深入观察社会,通过塑造典型人物揭露社会弊端,强调细节真实与环境描写。","max":5,"id":"西方文论-13-short-28"},{"n":29,"type":"short","prompt":"简述试谈詹姆斯对于小说叙述视角的认识。","options":[],"key":"","answer":"詹姆斯主张小说采用人物有限视角,即通过特定人物的眼睛和意识来叙述故事。这种视角限制了叙述者的全知性,使读者只能通过人物的感知来了解情节,增强了小说的真实感和参与感,深化了对人物内心世界的呈现,奠定了现代小说叙事理论的基础。","max":5,"id":"西方文论-13-short-29"},{"n":30,"type":"short","prompt":"简述现实主义文论的特点。","options":[],"key":"","answer":"现实主义文论的特点主要有:(1)强调客观真实,主张文学如实反映现实生活,反对主观臆造;(2)关注现实社会,尤其是底层人民的生活和社会矛盾,具有强烈的批判性; (3)注重典型塑造,通过典型人物和环境揭示社会本质;(4)叙事上追求客观冷静,避免主观抒情和议论。","max":5,"id":"西方文论-13-short-30"},{"n":31,"type":"essay","prompt":"论述别林斯基形象思维理论的内涵及其意义。","options":[],"key":"","answer":"别林斯基形象思维理论的内涵是:艺术创作不是通过抽象的逻辑思维,而是通过“形象思维” 进行;形象思维以现实生活为原料,通过想象、虚构等创造性活动,将生活素材化为具体的艺术形象。他强调“艺术是形象的思维”。其意义:(1)揭示了艺术创作的独特规律,区分了艺术与科学、哲学。(2)推动了现实主义文学的发展。(3)成为马克思主义“典型化” 理论的来源。","max":15,"id":"西方文论-13-essay-31"},{"n":32,"type":"essay","prompt":"论述现实主义文论与浪漫主义文论的主要区别与联系。","options":[],"key":"","answer":"现实主义文论与浪漫主义文论的主要区别:(1)创作原则:现实主义强调客观再现现实, 注重真实性和典型性;浪漫主义强调主观抒情,追求理想和幻想。(2)表现对象:现实主义关注现实社会和底层人民,具有批判性;浪漫主义关注个人情感和自然。(3)艺术手法:现实主义采用客观冷静的叙事,浪漫主义采用夸张、想象手法。二者都源于对古典主义的反叛,相互影响借鉴。","max":15,"id":"西方文论-13-essay-32"}],"rawMax":88},{"id":"西方文论-14","title":"章节练习(9章)","questions":[{"n":1,"type":"single","prompt":"十九世纪末二十世纪初欧洲出现的文论思潮不包括","options":[{"key":"A","text":"唯美主义"},{"key":"B","text":"象征主义"},{"key":"C","text":"现实主义"},{"key":"D","text":"直觉主义"}],"key":"C","answer":"现实主义","max":1,"id":"西方文论-14-single-1"},{"n":2,"type":"single","prompt":"圣伯夫的传记批评理论观点是","options":[{"key":"A","text":"关注作品形式"},{"key":"B","text":"强调作者生平对作品的影响"},{"key":"C","text":"忽视作者"},{"key":"D","text":"推崇读者反应"}],"key":"B","answer":"强调作者生平对作品的影响","max":1,"id":"西方文论-14-single-2"},{"n":3,"type":"single
