是“仔细察看”义，词义与字形统一，用的是本字。","score":6,"ana":"（1）（3）用通假字，（2）（4）用本字。本字按词义直接记录：循为沿着，相为察看；通假则借音同或音近字记录别的词，如培借记憑、與借记举。判别不能只凭字形，而要看语境义与该字本义是否相合。","anaAI":true},{"t":"w","n":38,"stem":"解释下列句中加下划线词的意义，指出该意义是本义还是引申义，并据以归纳引申义与本义的联系类型。（6分）\n（1）竹之始生，一寸之萌耳，而節葉具焉。節：\n（2）強本而節用，則天不能貧。節：","ans":"（1）竹节，本义；（2）节制、约束，引申义；（2）和（1）是动静关系。","score":6,"ana":"（1）“節”指竹节，是本义；（2）“節用”是节制用度，由竹节分段、有限制的形象引申到约束用量。两义联系为动静关系：竹节表现分节状态，节用则施加节制动作。","anaAI":true},{"t":"w","n":39,"stem":"指出下列句中加下划线的词哪些是使动用法，哪些是意动用法，并据以归纳二者的不同。（8分）\n（1）凡用兵之法，全國爲上。\n（2）孔子登東山而小魯。\n（3）下義其罪，上賞其姦。\n（4）亞父受玉斗，置之地，拔劍撞而破之。\n（5）故人不獨親其親，不獨子其子。\n（6）制海內，子元元。","ans":"（1）全：形容词使动用法。（2）小：形容词意动用法。（3）義：名词意动用法。（4）破：形容词使动用法。（5）親：名词意动用法。（6）子：名词使动用法。使动用法是主语使宾语做什么、怎么样或成为什么；意动用法则是主语主观上认为宾语怎么样或是什么。","score":8,"ana":"使动义是主语使宾语成为某状态或做某事，意动义是主语主观认为宾语如何：（1）全國，使国家完整，形容词使动；（2）小鲁，认为鲁国小，形容词意动；（3）義其罪、賞其姦，以……为义/可赏，名词意动；（4）破之，使之破，形容词使动；（5）親其親、子其子，以亲爱/子待之，名词意动；（6）子元元，使百姓如子女，名词使动。回答要逐项分类并给出“使……/认为……”释义。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线的句子译成现代汉语。","passage":"昔者晉獻公欲假道於虞以伐虢，荀息曰：‘君其以垂棘之璧與屈產之乘賂虞公，求假道焉，必假我道。’君曰：‘垂棘之璧，吾先君之寶也；屈產之乘，寡人之駿馬也。⟪若受吾幣不假之道，將奈何⟫？’荀息曰：‘彼不假我道，必不敢受我幣。若受我幣而假我道，則是寶猶取之內府而藏之外府也，馬猶取之內廄而著之外廄也，君勿憂。’君曰：‘諾。’乃使荀息以垂棘之璧與屈產之乘賂虞公而求假道焉。⟪虞公貪利其璧與馬而欲許之⟫。宮之奇諫曰：‘不可許。夫⟪虞之有虢也，如車之有輔⟫。輔依車，車亦依輔。虞虢之勢正是也。若假之道，則虢朝亡而虞夕從之矣。不可，願勿許。’虞公弗聽，遂假之道。荀息伐虢而還，反處三年，興兵伐虞，又剋之。荀息牽馬操璧而報獻公。獻公說，曰：‘璧則猶是也。雖然，⟪馬齒亦益長矣⟫。’⟪故虞公之兵殆而地削者何也⟫？愛小利而不慮其害。故曰：‘⟪顧小利則大利之殘也⟫。’","items":[{"t":"w","n":40,"stem":"⟪若受吾幣不假之道，將奈何⟫","ans":"假如他接受了我们的礼物又不借给道路，怎么办？","score":2,"ana":"“若”引假设条件，“受吾币”接受礼物，“不假之道”不借给我们道路；“将奈何”问将怎么办。译文须体现条件与反问式忧虑。","anaAI":true},{"t":"w","n":41,"stem":"⟪虞公貪利其璧與馬而欲許之⟫","ans":"虞公贪得宝玉和骏马的小利，打算答应借路。","score":2,"ana":"“贪利其璧与马”指贪图璧和马带来的利益，“欲许之”是打算答应借道；要看出虞公只顾眼前财物，未计借道后果。","anaAI":true},{"t":"w","n":42,"stem":"⟪虞之有虢也，如車之有輔⟫","ans":"虞国有虢国，就好像车有牙床外边的面颊。","score":2,"ana":"“輔”是车两旁夹持车毂的辅木，古代车的辅助结构；句子以车有辅木作比，说明虞国与虢国相互依存。答案所录“牙床外边的面颊”释义不常见，可能是转录/释义有误，待核教材或原卷；本解析不改原答案。","anaAI":true},{"t":"w","n":43,"stem":"⟪馬齒亦益長矣⟫","ans":"马也长了几岁。","score":2,"ana":"“马齿”借指马的年龄，“益长”是又增长了；晋献公以马虽归还却老了几岁作俏皮话，译为马也长了几岁。","anaAI":true},{"t":"w","n":44,"stem":"⟪故虞公之兵殆而地削者何也⟫","ans":"那么虞公兵败地削的原因是什么呢？","score":2,"ana":"“兵殆”指军队危败，“地削”是土地被削减；句中“者何也”提出原因，承接虞国败亡的结果。","anaAI":true},{"t":"w","n":45,"stem":"⟪顧小利則大利之殘也⟫","ans":"贪图小利就是对大利的危害。","score":2,"ana":"“顾”是只顾、贪图，“残”是损害；句子说明只盯眼前小利会损伤更大的利益，体现全文的利害权衡。","anaAI":true}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"今爾出於崖涘觀於大海乃知爾醜爾將可與語大理矣天下之水莫大於海萬川歸之不知何時止而不盈尾閭泄之不知何時已而不虛春秋不變水旱不知此其過江河之流不可爲量數而吾未嘗以此自多者自以比形於天地而受氣於陰陽吾在天地之間猶小石小木之在大山也方存乎見少又奚以自多","ans":"今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。天下之水，莫大於海，萬川歸之，不知何時止而不盈；尾閭泄之，不知何時已而不虛。春秋不變，水旱不知。此其過江河之流，不可爲量數。而吾未嘗以此自多者，自以比形於天地而受氣於陰陽，吾在天地之間，猶小石小木之在大山也。方存乎見少，又奚以自多！","score":12,"ana":"“今尔出於崖涘，观於大海，乃知尔醜”按动作次序先写河伯出河岸看海，再得出认识；“爾將可與語大理矣”转为判断。随后“天下之水莫大於海”总说海之大，两组“不知何时……而不……”用分号对应；“春秋不变，水旱不知”说明海水不因时令和旱涝改变。下文由“此其过江河之流”转入河伯自述，并以“又奚以自多”反问收束。标点依据是分句对举、主语转换和问句语气。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共11小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"晉文公曰：‘吾⟪弛⟫關市之徵而緩刑罰，其足以戰民乎？’狐子曰：‘不足。’曰：‘⟪然則⟫何如足以戰民乎？’狐子對曰：‘令無得不戰。’公曰：‘無得不戰奈何？’狐子對曰：‘信賞必罰，其足以戰。’公曰：‘刑罰之極⟪安⟫至？’對曰：‘不⟪辟⟫親貴，法行所愛。’文公曰：‘善。’明日令田于圃陸，期以日中爲期，後期者行軍法焉。於是公有所愛者曰顛頡，後期，吏請其罪，文公隕⟪涕⟫而憂。吏曰：‘請用事焉。’遂斬顛頡之脊以徇百姓，以明法之信也。而後百姓皆懼曰：‘君於顛頡之貴重如彼甚也，而君猶行法焉，況于我則何有矣。’文公見民之可戰也，於是遂興兵伐原，⟪克⟫之；伐衛，⟪東⟫其畝，取五鹿；攻陽，勝虢；伐曹；南圉鄭，反之陴；罷宋圉；還與荆人戰城濮，大敗荆人；返爲踐土之盟，遂成衡雍之義。一舉而八有功。所以然者，無他故異物，從狐偃之謀，⟪假⟫顛頡之脊也。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加下划线的词。（6分）","stem":"然則：","ans":"这样，那么","score":1,"ana":"“然则”承接前文的因果与推论，意为“既然这样，那么”；在“然则何如足以战民乎”中引出进一步设问。","anaAI":true},{"n":48,"stem":"安：","ans":"哪里","score":1,"ana":"“安”作疑问代词，意为“哪里、到什么程度”，作“至”的处所/范围成分；句意是刑罚最严能到何种程度。","anaAI":true},{"n":49,"stem":"辟：","ans":"避开","score":1,"ana":"“辟”通“避”，意为回避；“不辟亲贵”指执法不因亲近或尊贵而回避、宽免。","anaAI":true},{"n":50,"stem":"涕：","ans":"眼泪","score":1,"ana":"“涕”是眼泪，作名词；晋文公因颠颉将受刑而“隕涕”，即流泪忧愁。","anaAI":true},{"n":51,"stem":"克：","ans":"战胜","score":1,"ana":"“克”是战胜、攻克，作动词；“伐原，克之”即攻打原地并攻克它。","anaAI":true},{"n":52,"stem":"假：","ans":"借助","score":1,"ana":"“假”意为凭借、借助；“假顛頡之脊”指借颠颉受刑之事昭示赏罚必行。","anaAI":true},{"n":53,"grp":"（二）说明下列句中加下划线词的词性或用法，解释其在句中的词义。（4分）","stem":"吾弛關市之徵而緩刑罰。弛：","ans":"形容词使动用法，使……宽缓。","score":2,"ana":"“假顛頡之脊”中“假”是借助、凭借，指借惩处亲信颠颉来建立法令可信度。","anaAI":true},{"n":54,"stem":"東其畝，取五鹿。東：","ans":"名词使动用法，使……东向。","score":2,"ana":"“東其畝”按题给答案，“東”由方位名词转作使动，使田垄/田亩朝东；名词带宾语“其畝”，体现名词使动句法。","anaAI":true},{"n":55,"grp":"（三）将文中画线的句子译成现代汉语。（4分）","stem":"明日令田于圃陸，期以日中爲期，後期者行軍法焉。","ans":"第二天下令在圃陆打猎，以中午为期限，超过期限到的人施行军法。","score":2,"ana":"“明日”指第二天，“田于圃陆”是在圃陆田猎；“期以日中为期”以中午为约定期限；“后期者行军法焉”是迟到者按军法处置。翻译需交代地点、期限与处罚。","anaAI":true},{"n":56,"stem":"君於顛頡之貴重如彼甚也，而君猶行法焉。","ans":"君王那么看重颠颉，却仍然施行军法。","score":2,"ana":"“君於顛頡之貴重如彼甚也”说君王如此看重颠颉，“而犹行法”转折，仍依法处置；核心是亲贵也不例外。","anaAI":true},{"n":57,"grp":"（四）（6分）","stem":"晋文公为什么事询问狐偃的意见？狐偃给晋文公的建议是什么？晋文公是如何实现的？请用自己的语言表述出来。","ans":"晋文公想知道如何可以让百姓愿意跟他一起作战；狐偃提出赏赐和惩罚一定确实执行，不论权贵，不论亲近的人，一律按法执行，就可以让百姓作战；晋文公处罚了不守规定的自己的亲信颠颉，在百姓中树立了威信。","score":6,"ana":"晋文公询问怎样使百姓愿意作战。狐子提出赏罚必须兑现、执法不避亲贵；晋文公通过处置迟到的亲信颠颉示范法令可信，百姓因而相信规则公平并愿意作战。答案需包含问题、原则、具体行动及效果。","anaAI":true}]}]}]},{"paper":"gdhy-2510","subject":"gdhy","session":"2510","label":"2025年10月","code":"00536","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列各组字，全部包含象形、指事、会意三种结构类型的一组是","opts":["及陳柏","自一臭","水新線","月杯修"],"ans":"B","score":1,"ana":"答案B。“自”象鼻形，属象形；“一”以一横指示数目，属指事；“臭”从“自”表鼻、从“犬”会意，三类齐全。A“陳、柏”形声，C“新、線”形声，D“杯、修”含形声/会意但不同时具三类。","anaAI":true},{"t":"s","n":2,"stem":"下列对汉字义符和声符位置的分析完全正确的一项是","opts":["錢，右形左聲。","瓣，外形内聲。","盆，上形下聲。","築，下形上聲。"],"ans":"D","score":1,"ana":"答案D按题库标注判断“築”为下形上声；钱左侧钅为义符、右侧戋为声符，所以A左右相反；“盆”上分声、下皿形，故C把上下说反；“瓣”各部件分析也不符合外形内声。需注意“築”的构形说法存在资料差异，常见分析作从竹、筑声（上形下声），与题库答案D冲突，待核教材/原卷，不能据此改答案。","anaAI":true},{"t":"s","n":3,"stem":"下列关于“小篆”说法正确的一项是","opts":["小篆是秦孝公时期采用的标准字体。","小篆逐渐脱离象物性而走向符号化。","小篆为汉字向象形文字发展奠定了基础。","李斯的《说文解字》是保存小篆最系统的著作。"],"ans":"B","score":1,"ana":"答案B。小篆在秦统一文字过程中逐渐规范并趋于符号化，形体不再直接摹拟物象。A时代应为秦始皇统一而非秦孝公；C把文字演变方向颠倒；D《说文解字》作者是许慎，李斯与《仓颉篇》相关。","anaAI":true},{"t":"s","n":4,"stem":"下列各组字，属于源字与分化字关系的一组是","opts":["鵝—鴦","迹—蹟","裁—才","尉—慰"],"ans":"D","score":1,"ana":"答案D。“慰”从“尉”分化出来承担安慰、慰问义，二字有源字与分化字关系。A鵝—鴦是不同词，B迹—蹟属异体/异写，C裁—才并非所述源分关系。","anaAI":true},{"t":"s","n":5,"stem":"下列各组字，属于异体字关系的一组是","opts":["振—賑","峰—峯","辟—闢","考—拷"],"ans":"B","score":1,"ana":"答案B。“峰—峯”同音同义、记录同一词，仅形体不同，是异体字。振—賑、辟—闢、考—拷各自有词义或用法分化，不是同一词的纯异体。","anaAI":true},{"t":"s","n":6,"stem":"下列句中，加着重号的部分属于主谓式复合词的一句是","opts":["雖遇執事，其弗敢達。","陽伏而不能出，陰迫而不能蒸，於是有⟪地震⟫。","邦分崩離析而不能守也，而謀動干戈於邦內。","諸侯將謀救燕。"],"ans":"B","score":1,"ana":"答案B。“地震”是主谓式复合词，“地”作主语、“震”作谓语，整体指地发生震动。A“達”不构成该复合词关系，C“分崩离析”是并列结构，D“救燕”是动宾短语。","anaAI":true},{"t":"s","n":7,"stem":"下列各组词在古代汉语中全是联绵词的一组是","opts":["國家、夏至、斟酌","繽紛、匍匐、稽首","輾轉、窈窕、爛漫","俊傑、芣苢、社稷"],"ans":"C","score":1,"ana":"答案C。“輾轉、窈窕、爛漫”都是双音节整体表义、不能拆开逐字解释的联绵词。A含“国家”“夏至”等可分析词，B“稽首”为动宾结构，D“俊杰”“社稷”不是联绵词。","anaAI":true},{"t":"s","n":8,"stem":"下列句中，加着重号的词古今词义变化属于色彩褒贬不同的一句是","opts":["亡人無黨，有黨必有讎。","楚子將以商臣爲大子，⟪訪⟫諸令尹子上。","⟪丈夫⟫亦愛憐其少子乎？","四體不⟪勤⟫，五穀不分。"],"ans":"A","score":1,"ana":"答案A。古“亡人”可指逃亡、失国之人，语义色彩较中性；现代“亡人”常指死者，带有死亡含义，感情色彩/语义色彩发生变化。B“访”是征询，C“丈夫”古指成年男子而今常指配偶，属范围变化，D“勤”古今均为勤劳，均非本题所问。","anaAI":true},{"t":"s","n":9,"stem":"下列句中，加着重号的词使用引申义的一句是","opts":["有自門⟪閒⟫射陽越，殺之。（閒：縫隙）","君子⟪引⟫而不發，躍如也。（引：開弓）","叔孫戴伯帥師⟪會⟫諸侯之師侵陳。（會：會合）","宴爾新⟪昏⟫，如兄如弟。（昏：結婚）"],"ans":"D","score":1,"ana":"答案D。“昏”本指日暮、昏暗，古代婚礼多在黄昏举行，进而以“昏”指婚姻、结婚，属引申。A“閒”是缝隙本义，B“引”开弓为本义，C“会”聚合为本义。","anaAI":true},{"t":"s","n":10,"stem":"下列选项中，对“形貌昳⟪麗⟫”和“⟪麗⟫土之毛”中加着重号的词说法正确的一项是","opts":["两句中的“麗”是异词同字现象。","两句中的“麗”是异字同词现象。","两句中的“麗”是反义词。","两句中的“麗”是同义词。"],"ans":"A","score":1,"ana":"答案A。原题两处下加点字形都作“麗”，但“形貌昳麗”的麗是美好，“麗土之毛”的麗有附着/依附义，属异词同字（同形异词），不是异字同词、反义或同义。","anaAI":true},{"t":"s","n":11,"stem":"下列句中，加着重号的词意义解释正确的一句是","opts":["彼不假我道，必不敢受我⟪幣⟫。（幣：錢幣）","秦王⟪色⟫撓，長跪而謝之。（色：顏色）","乃徙武北海上無人處，使牧羝，羝⟪乳⟫乃得歸。（乳：生育）","夫山居而谷汲者，腴臘而相⟪遺⟫以水。（遺：遺留）"],"ans":"C","score":1,"ana":"答案C。“羝乳乃得归”中“乳”指生育、产羔，解释正确。A“幣”是礼物、财物而非专指钱币；B“色撓”指神色屈服而非颜色；D“遺以水”是赠送、给予水，不是遗留。","anaAI":true},{"t":"s","n":12,"stem":"下列句中，加着重号的词属于形容词意动用法的一句是","opts":["傾奪鄰國，而⟪雄⟫諸侯。","願車馬衣輕裘與朋友共，⟪敝⟫之而無憾。","晉侯⟪飲⟫趙盾酒。","君聞而⟪賢⟫之。"],"ans":"D","scor "ana":"“何人邪”以“邪”收句，标记疑问语气；此处问与您一同来的人是谁。","anaAI":true},{"t":"w","n":35,"stem":"以志吾過，⟪且⟫旌善人。且：","ans":"连词，表并列，并且。","score":1,"ana":"“以志吾过，且旌善人”中“且”连接两项并列目的：记下我的过失，并表彰善人。","anaAI":true},{"t":"w","n":36,"stem":"夫子之求之也，其諸異⟪乎⟫人之求之與？乎：","ans":"介词，相当于“于”，和、跟。","score":1,"ana":"“異乎人之求之與”中“乎”相当于“于”，引比较对象，意为与别人求取的方式不同吗；不是句末疑问语气。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共3小题，共20分。","items":[{"t":"w","n":37,"stem":"指出下列句中加着重号的字哪些用的是本字，哪些用的是通假字，并说明如何区分本字和通假字。\n（1）公患之，使鉏麑⟪賊⟫之。\n（2）八月⟪剝⟫棗，十月穫稻。\n（3）能謗議於市朝，⟪聞⟫寡人之耳者，受下賞。\n（4）萬人操弓，共射一⟪招⟫。","ans":"（1）贼：本字，本义为杀害；（2）剥：通假字，通“扑”，击打；（3）闻：本字，本义为听到；（4）招：通假字，通“的”，箭靶。区分方法：本字是字形与词义相对应，直接用本义或引申义记录词；通假字是借用音同或音近的字记录另一个词，字的本义与语境义无关。","score":6,"ana":"（1）“贼”在“使鉏麑贼之”中是杀害，为本字本义；（2）“剝棗”中的剥按答案通“扑”，指击打；（3）“闻寡人之耳”是使我听到，为本字；（4）“招”通“的”，指箭靶。判断本字看字义与语境相合，通假则借音近字记录另一词。","anaAI":true},{"t":"w","n":38,"stem":"解释下列句中加着重号词的意义，并指出其差异。\n（1）失時不雨，民且⟪狼顧⟫。\n（2）乘彼垝垣，以⟪望⟫復關。\n（3）雲車十餘丈，⟪瞰⟫臨城中。","ans":"（1）狼顾：像狼一样回头看。（2）望：向远处看。（3）瞰：从高处往下看。差异：“望”是远距离向前看；“瞰”是从高处向下看。","score":6,"ana":"（1）“狼顾”是像狼一样回头看，名词“狼”作比喻状语；（2）“望”指向远处看；（3）“瞰”指从高处向下看。差异应从视点说明：“望”强调距离与向前远眺，“瞰”强调居高临下的方向，不能只说都为“看”。","anaAI":true},{"t":"w","n":39,"stem":"根据下列例句归纳古汉语名量表示法的格式，并将例句序号归入相应格式。\n（1）今人有五子，不爲多。\n（2）翼日戊午，乃社于新邑，牛一、羊一、豕一。\n（3）齊金百斤，車馬十駟。\n（4）百畝之田，勿奪其時。","ans":"（1）数词+名词；（2）名词+数词；（3）名词+数词+量词；（4）数词+量词+名词。","score":8,"ana":"名量结构有四型：（1）数词+名词，“五子”；（2）名词+数词，“牛一、羊一、豕一”；（3）名词+数词+量词，“齐金百斤、车马十驷”；（4）数词+量词+名词，“百亩之田”。答题要把格式与例句号一一对应，并辨明古汉语量词位置不固定。","anaAI":true}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线的句子译成现代汉语。","passage":"管仲曰：‘吾始困時，⟪嘗與鮑叔賈⟫，分財利多自與，鮑叔不以我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，⟪鮑叔不以我爲不肖⟫，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，⟪召忽死之⟫，吾幽囚受辱，鮑叔不以我爲無恥，⟪知我不羞小節⟫而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。⟪子孫世祿於齊⟫，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而⟪多鮑叔能知人也⟫。","items":[{"t":"w","n":40,"stem":"⟪嘗與鮑叔賈⟫","ans":"曾经和鲍叔牙一起经商。","score":2,"ana":"“尝”是曾经，“与鲍叔贾”是和鲍叔一起做买卖；“贾”在此作经商义的动词。译文应体现共同经商而非购买鲍叔。","anaAI":true},{"t":"w","n":41,"stem":"⟪鮑叔不以我爲不肖⟫","ans":"鲍叔牙不认为我没有才能。","score":2,"ana":"“不肖”指不贤、不成材；“不以我为不肖”是鲍叔不认为我没有才能，结合后文“知时有利不利”解释其理解管仲处境。","anaAI":true},{"t":"w","n":42,"stem":"⟪召忽死之⟫","ans":"召忽为公子纠而死。","score":2,"ana":"“死之”是为公子纠而死，代词“之”指公子纠/其事；“召忽死之”并非普通死亡的地点说明，而是为主效死。","anaAI":true},{"t":"w","n":43,"stem":"⟪知我不羞小節⟫","ans":"知道我不以小节为羞耻。","score":2,"ana":"“羞小节”是把小节看作羞耻；“不羞”即不以小节为耻，后半句对照“耻功名不显”，说明管仲所重在功业名声。","anaAI":true},{"t":"w","n":44,"stem":"⟪子孫世祿於齊⟫","ans":"子孙后代在齐国世代享受俸禄。","score":2,"ana":"“世禄於齊”说子孙世世代代在齐国享有俸禄；“世”修饰禄，译出世袭延续关系。","anaAI":true},{"t":"w","n":45,"stem":"⟪多鮑叔能知人也⟫","ans":"称赞鲍叔牙能够识别人才。","score":2,"ana":"“多鮑叔能知人”中的“多”作意动/赞许义，意为称赞鲍叔善于识人；句子对比世人称许管仲贤能，更称许鲍叔知人。","anaAI":true}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣","ans":"蘇代爲燕說齊，未見齊王，先說淳于髡曰：‘人有賣駿馬者，比三旦立市，人莫之知。往見伯樂曰：“臣有駿馬，欲賣之，比三旦立於市，人莫與言。願子還而視之，去而顧之，臣請獻一朝之賈。”伯樂乃還而視之，去而顧之，一旦而馬價十倍。今臣欲以駿馬見於王，莫爲臣先後者，足下有意爲臣伯樂乎？臣請獻白璧一雙，黃金萬鎰，以爲馬食。’淳于髡曰：‘謹聞命矣。’","score":12,"ana":"开头“苏代为燕说齐，未见齐王，先说淳于髡”是叙事背景；“人有卖骏马者”引出寓言，后面卖马者、伯乐对话用引号区分。卖马人三日无人问，求伯乐绕马而视；伯乐行动后马价十倍，形成前后对照。再以“今臣欲以骏马见于王”转入苏代自况，连续两问句“足下有意为臣伯乐乎”表达请求，随后“请献……”说明酬谢。末尾淳于髡答“谨闻命矣”另起说话者。断句依据说话人转换、叙事层次和问答语气。","anaAI":true}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭⟪對⟫曰：‘吾小人也，貪。⟪饋⟫之始至，懼其不足，故歎。中食而自⟪咎⟫也。曰：“豈主之食而有不足？”是以⟪再⟫歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加着重号词语的意义。（6分）","stem":"獄：","ans":"诉讼、官司","score":1,"ana":"“獄”在“梗阳人有狱”中指诉讼、官司，名词；后面“将不胜”说明诉讼一方将败，故欲行贿。","anaAI":true},{"n":48,"stem":"對：","ans":"应答、回答","score":1,"ana":"“同辞对曰”中“对”是应答、回答，作动词，引出二人共同向魏献子作答。","anaAI":true},{"n":49,"stem":"饋：","ans":"赠送、进献","score":1,"ana":"“饋之始至”中“饋”指赠送、进献的财物或进献行为；语境说明贿赂送到时二人担心不足。","anaAI":true},{"n":50,"stem":"咎：","ans":"责怪、自责","score":1,"ana":"“中食而自咎”中“咎”是责怪，此处按答案兼有自责义：进食中想到不应贪受而责备自己。","anaAI":true},{"n":51,"stem":"再：","ans":"第二次","score":1,"ana":"“是以再叹”中“再”指第二次；前有初次叹息，后文解释第二次叹息的原因。","anaAI":true},{"n":52,"stem":"厭：","ans":"满足","score":1,"ana":"“适厌而已”中“厌”是满足、吃饱满足；古义不是厌恶。全句说只求腹中适足即可。","anaAI":true},{"n":53,"grp":"（二）解释下列句子中加着重号的词的词性和词义。（4分）","stem":"吾主以不⟪賄⟫聞於諸侯。賄：","ans":"名词，财物、贿赂。","score":2,"ana":"“不贿闻于诸侯”中的“贿”是名词，指财物、贿赂；“以不贿闻”是凭不受贿的声名闻于诸侯。","anaAI":true},{"n":54,"stem":"⟪既⟫飽，獻子問焉。既：","ans":"副词，已经、……之后。","score":2,"ana":"“既饱”中“既”是副词，表示已经/……之后；进食完毕后魏献子才询问三叹缘故。","anaAI":true},{"n":55,"grp":"（三）将下列文中画线的句子译成现代汉语。（4分）","stem":"⟪請納賂於魏獻子⟫。","ans":"请求把贿赂进献给魏献子。","score":2,"ana":"“请纳贿于魏献子”中“请”是请求，“纳贿”是进献贿赂，“于”引进对象魏献子；译文需保留请示语气和受贿对象。","anaAI":true},{"n":56,"stem":"⟪人有言曰：‘唯食可以忘憂。’吾子一食之間而三歎，何也？⟫","ans":"俗话说：“只有吃饭的时候可以忘记忧愁。”您一顿饭的功夫却叹息了三次，这是为什么呢？","score":2,"ana":"“唯食可以忘忧”是引用俗语，意为只有吃饭时可以忘掉忧愁；“一食之间而三叹”强调一顿饭时间内三次叹息，与俗语形成疑问反差。","anaAI":true},{"n":57,"grp":"（四）回答下列问题。（6分）","stem":"用现代汉语说明阎没与叔宽是如何劝谏魏献子的？","ans":"阎没与叔宽用委婉劝谏的方式，借吃饭时三次叹息，暗示魏献子若接受贿赂，会损害清廉名声、滋生贪心，从而劝他拒绝贿赂。","score":3,"ana":"阎没、叔宽没有直斥魏献子，而用三次叹息逐层解释：初怕食物不够，继而想到主人所赐不应不足，最后以“小人之腹”推想“君子之心”只求适足，委婉点出受贿会损害清名、助长贪念，促使魏献子拒贿。得分点是方式、三叹寓意、劝谏效果。","anaAI":true},{"n":58,"stem":"说明文中“以小人之腹，爲君子之心”和现代汉语“以小人之心，度君子之腹”有何不同。","ans":"古意指用普通人的知足之心推想君子也懂得知足、不贪得，是善意推想；今意指用卑劣狭隘的心思揣测高尚之人的想法，含贬义。","score":3,"ana":"文中“以小人之腹为君子之心”是善意推想：普通人只求适量满足，推想君子也知足不贪；现代“以小人之心，度君子之腹”则贬指用狭隘卑劣心思猜测高尚者。关键差异在“腹/心”的表达、推想方向与褒贬色彩。","anaAI":true}]}]}],"qaNotes":[]},{"paper":"gdhy-2604","subject":"gdhy","session":"2604","label":"2026年4月","code":"00536","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列各组字，全部是会意字的一组是","opts":["弃武河","解險柴","息  明","绵暖迹"],"ans":"[答案待核：题面C缺“尖”，现有字仅“息、明”]","score":1,"ana":"源文题面C只有“息、明”，附答补入“尖”后才构成全为会意字的一组选项。没有一个完整且由现有选项唯一支持的正确项；不得按附答补字计分。","anaAI":true,"qaNotes":"保持待核：源题C仅“息”“明”，原附答案解析额外补“尖”，故完整选项与答案说明不一致；不凭教材知识补录缺字。"},{"t":"s","n":2,"stem":"下列对汉字义符和声符位置的分析完全正确的一项是","opts":["哀，内形外聲。","幕，上形下聲。","鴨，左形右聲。","佞，右形左聲。"],"ans":"D","score":1," 感遇》诗三十八首"],"ans":"B","score":1,"ana":"陈子昂倡复归风雅、反对齐梁绮靡，创作《感遇》三十八首，继承阮籍《咏怀》的比兴寄托传统；但他并非近体诗格律定型的主要贡献者，故B不正确。近体诗定型主要由沈佺期、宋之问等推动。","anaAI":true},{"t":"s","n":26,"stem":"“竹径通幽处，禅房花木深”出自常建（ ）。","opts":["《夏日南亭怀辛大》","《华子冈》","《田家即事》","《题破山寺后禅院》"],"ans":"D","score":1,"ana":"“竹径通幽处，禅房花木深”出自常建《题破山寺后禅院》，写入寺路径幽深、禅院环境清静。其余篇名与该句无关。","anaAI":true},{"t":"s","n":27,"stem":"以“微云淡河汉，疏雨滴梧桐”名动京师的诗人是（ ）。","opts":["孟浩然","王维","崔颢","储光羲"],"ans":"A","score":1,"ana":"孟浩然在太学赋诗，以“微云淡河汉，疏雨滴梧桐”名动京师，诗句以轻淡景物见长，体现其清远自然的审美。故对应孟浩然。","anaAI":true},{"t":"s","n":28,"stem":"元稹叙事长诗代表作是（ ）。","opts":["《连昌宫词》","《离思》","《遣悲怀》","《野老歌》"],"ans":"A","score":1,"ana":"元稹《连昌宫词》借一位老宫人的回忆，叙述唐玄宗时期宫苑盛衰与安史之乱，属于叙事长诗代表作。《离思》《遣悲怀》主要写爱情与悼亡，《野老歌》为张籍作品。","anaAI":true},{"t":"s","n":29,"stem":"李贺诗风被称为（ ）。","opts":["台阁体","元和体","武功体","长吉体"],"ans":"D","score":1,"ana":"“长吉体”以李贺命名，特点是奇崛想象、浓艳冷峭意象和新奇字句。台阁体、元和体、武功体分别指其他诗人或诗歌风格。","anaAI":true},{"t":"s","n":30,"stem":"作为配合歌唱的音乐文学，词所依之声乃是（ ）。","opts":["清乐","燕乐","雅乐","古乐"],"ans":"B","score":1,"ana":"词最初配合燕乐歌唱，依燕乐曲调填词，故词所依之声为燕乐。清乐、雅乐和泛称古乐都不是唐宋词曲所依的主要音乐体系。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"下列诗作出自《诗经》的有","opts":["《关雎》","《黍离》","《采薇》","《橘颂》","《涉江"],"ans":"ABC","score":2,"ana":"A《关雎》是《周南》篇，写求偶与相思；B《黍离》属《王风》，借故都禾黍寄托亡国之悲；C《采薇》属《小雅》，写戍边征役及归途感慨，三者均出自《诗经》。D《橘颂》见《楚辞·九章》，E选项文本截断为“《涉江”，若原意为《涉江》，也属《楚辞·九章》而非《诗经》。因此按可见选项，答案ABC成立；E因题干数据截断，按现存答案，待核。","anaAI":true},{"t":"m","n":32,"stem":"关于枚乘《七发》的描述正确的有","opts":["开大赋的典范之作","铺叙描摹，夸饰渲染","在遣词造句方面质朴无华","采用主客问答形式结构全篇","内容设置听琴、田猎、观涛等七个方面"],"ans":"ABDE","score":2,"ana":"A《七发》以主客问答铺排楚太子病态及吴客劝说，传统上视为汉大赋先声；B它层层铺写音乐、饮食、车马、宫苑、田猎、观涛等场景，并用夸饰扩大感官效果，正确。C“质朴无华”不合其铺陈、藻饰繁富的文风。D全篇以吴客与楚太子的问答串联七段，结构上确为主客问答。E七段由听音乐、饮食、乘车、游览、田猎、观涛等逐步推进，以观涛达到高潮，符合篇章安排。","anaAI":true},{"t":"m","n":33,"stem":"关于《古诗十九首》的说法正确的有","opts":["最早见于《文选》","代表汉人五言诗最高成就","“感于哀乐，缘事而发”","“直而不野”“婉转附物”","《西北有高楼》表达知音难遇的感慨"],"ans":"ABDE","score":2,"ana":"A《古诗十九首》以总题收入萧统《文选》，这是其现存早期结集形态；B它集中体现东汉文人五言诗的成熟，常被视为汉人五言诗最高成就。C“感于哀乐，缘事而发”是《汉书·艺文志》概括汉乐府民歌的说法，不是《古诗十九首》的评语。D“直而不野”“婉转附物”等评语突出其质直而有节制、借物抒情而含蓄的艺术特点。E《西北有高楼》借高楼上弦歌者无人理解，寄寓知音难遇之感。故依现存答案选ABDE。","anaAI":true},{"t":"m","n":34,"stem":"下列诗句属于李白的有","opts":["“玉阶生白露，夜久侵罗袜”","“荷风送香气，竹露滴清响”","“大道如青天，我独不得出”","“我歌月徘徊，我舞影零乱”","“古来圣贤皆寂寞，惟有饮者留其名”"],"ans":"ACDE","score":2,"ana":"A“玉阶生白露，夜久侵罗袜”见李白《玉阶怨》；B“荷风送香气，竹露滴清响”见孟浩然《夏日南亭怀辛大》，不选。C“大道如青天，我独不得出”出自李白《行路难》其二；D“我歌月徘徊，我舞影零乱”出自《月下独酌》；E“古来圣贤皆寂寞，惟有饮者留其名”出自《将进酒》。因此选ACDE。","anaAI":true},{"t":"m","n":35,"stem":"下列关于大历“十才子”诗歌特色的表述正确的有","opts":["意境浑融一气","过于讲究描写技巧而显雕琢","偏爱使用描述性意象","境界开阔高远","词语往往带有凄清萧瑟乃至暗淡的色彩"],"ans":"ABCE","score":2,"ana":"A大历十才子善于把羁旅、送别、山水等片段经营成情景相接的篇章，局部意境常浑融；B他们重视炼字、对仗和景物描写，部分作品因此显出雕琢痕迹；C诗中常用寒灯、暮雨、孤舟等可见可感的描述性意象；D其诗多写日常交游、羁旅愁思，尺度偏小清冷，不以境界开阔高远见长；E凄清、萧瑟、暗淡的词语和色调确是其常见面貌。故按选项选ABCE。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《天问》","ans":"《天问》是屈原作品中最为奇特的诗歌，针对自然现象、神话传说和远古历史、社会现实等一口气提出170多个问题，体现了诗人的见识广博、思想深刻以及勇于怀疑和批判的精神。","score":3,"ana":"《天问》是屈原以连续发问贯穿全篇的长诗，从天体、神话和历史问到政治现实，传统统计有一百七十余问。它不提供系统答案，而通过质疑神话秩序、兴亡因果和现实政治显示批判精神，是楚辞中结构最奇特的作品之一。","anaAI":true},{"t":"term","n":37,"stem":"李斯","ans":"（1）李斯的创作包括奏议和刻石文。（2）《谏逐客书》铺陈排比，有纵横之气；刻石文铺叙颂夸，气度宏伟，韵律谐和。","score":3,"ana":"李斯是秦代政论家，其文章包括奏议与歌颂秦统一的刻石文。《谏逐客书》用秦国史例和排比论证客卿之利，保留纵横游说气势；刻石文则以韵语铺陈功业，气度宏阔，二者分别代表实用政论和帝国颂功文体。","anaAI":true},{"t":"term","n":38,"stem":"《洛阳伽蓝记》","ans":"杨衒之的《洛阳伽蓝记》属历史笔记，也是写景状物的散文。书中主要是对佛寺的描写，有的篇章写得精致；该书是历史散文，具有极高的史料价值。","score":3,"ana":"《洛阳伽蓝记》由杨衒之记北魏洛阳佛寺的兴废，兼写街市、人物、风俗和政治变迁。寺院建筑描写具体，叙述中常穿插掌故与见闻，因此既是有文学价值的历史笔记，也是研究北魏都城和佛教的重要史料。","anaAI":true},{"t":"term","n":39,"stem":"“小李杜”","ans":"杜牧和李商隐同为晚唐七绝成就最高的诗人，世称“小李杜”。","score":3,"ana":"“小李杜”指晚唐杜牧、李商隐。杜牧七绝明朗俊爽、善咏史怀古；李商隐以七律、无题诗的深婉密丽和用典寄托见长。并称强调两人晚唐诗坛地位，不表示其风格相同或只在七绝上成就最高。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述我国神话对后世文学发展的影响。","ans":"（1）神话的艺术规则为后世文学的发展提示了方向。一方面，神话所开创的为人生的主题，事实上成为我国数千年文学发展的主流和传统；另一方面，神话富于情感、形象和想象的特征，引导了后世文学审美理想的发展走向。（2）丰富多彩的神话作品，成为后世文学创作取之不尽、用之不竭的题材源泉。从最早的文学总集《诗经》到近现代文学创作，从诗歌散文到戏曲小说，无不得到神话的滋养。","score":5,"ana":"神话把人类起源、洪水和英雄抗争转化为富于想象的故事，为后世提供母题和象征资源：女娲、鲧禹、精卫等不断进入诗赋、小说和戏曲。神话敢于突破现实尺度的想象、强烈情感和变形叙事，也影响浪漫主义表达；楚辞尤其继承神话意象，后世文学又借神话寄托理想与社会批评。","anaAI":true},{"t":"w","n":41,"stem":"简述《离骚》永恒的精神价值。","ans":"（1）《离骚》是屈原自叙生平的长篇抒情诗，他的情感和思想都熔铸在其中。（2）表现“美政”理想和深沉的爱国情感。（3）体现追求理想九死不悔的坚韧品格和嫉恶如仇的批判精神。","score":5,"ana":"《离骚》以屈原自叙为骨架，将楚国危局、遭谗被疏和个人求索相连。“美政”表现为举贤授能、修明法度的政治理想，背后是深沉爱国情感；香草美人比兴写洁身自守，九死不悔的誓言表现坚韧，而对党人妒贤、朝政昏乱的揭露则体现批判精神。","anaAI":true},{"t":"w","n":42,"stem":"简述张衡在赋史上的地位。","ans":"张衡是赋史上承前启后的作家。代表作《二京赋》规模、容量和篇幅都超过前人，铺陈胪列，细致描绘，成为汉代京都赋的极致；《归田赋》是东汉抒情小赋的开山之作。","score":5,"ana":"张衡承接汉大赋传统而又开拓新方向。《二京赋》以长安、洛阳为对象，写宫室、百戏、市场和社会风貌，规模宏大、资料繁富，达到京都赋铺陈的高峰；《归田赋》则短小抒情，以归隐愿望和田园景物取代大赋的全面铺陈，开启东汉抒情小赋的新路。","anaAI":true},{"t":"w","n":43,"stem":"简述张若虚《春江花月夜》的艺术成就。","ans":"（1）“孤篇横绝，竟为大家”“诗中的诗，顶峰上的顶峰”。（2）这是一首长篇歌行，采用乐府旧题但赋予全新内容，将画意、诗情与对宇宙奥秘和人生哲理的体察融为一体，创造出情景交融、玲珑透彻的诗境。","score":5,"ana":"《春江花月夜》沿用乐府旧题却写出江月夜景、游子思妇离情和宇宙人生之问。月色从春江景物贯穿到“江月何年初照人”的哲思，继而落回个人相思，形成景、情、理的层递；长篇歌行的流动结构和清丽语言使全诗境界浑融，故被誉为“孤篇横绝”。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述谢灵运山水诗的艺术特点。","ans":"（1）创造了一种山水诗的结构模式。（2）在局部景物描写中，通过细腻的观察与把握和具体画面，表现景观的情思韵味、情景交融。（3）对山水景物的声、光、色都有生动的描绘。（4）其山水诗发展尚未达到构造完整意境的阶段，处于有佳句而无佳篇的层次。","score":14,"ana":"谢灵运山水诗常按游踪组织：先交代出游、登临，再铺写沿途山水，最后转入玄理或身世感慨；精细观察使声、光、色可感，如《登池上楼》以“池塘生春草”写季节转换。山水因此成为独立审美对象，但写景与篇末议理有时仍分段并置，整体意境未必完全熔合，呈现从佳句走向完整山水篇章的过渡。","anaAI":true},{"t":"w","n":45,"stem":"结合具体作品，论述杜甫诗歌的诗史性质。","ans":"杜甫的诗歌形象真实地反映了安史之乱前后的时代动乱，是时代的一面镜子，故有“诗史”之誉。（1）杜诗具有史的认识价值，以时事入诗而含热泪深情，尖锐细密地观察与写实，直面社会现实，如“三吏”“三别”、《忆昔》。（2）杜诗提供了比历史事件更为广阔、具体、生动的生活画面，使人如临其境。（3）从诗中可以感受到当时社会的某些心理状态。","score":14,"ana":"杜甫“诗史”在于以亲历者的诗笔记录安史之乱前后的时代，同时写出史书未必呈现的百姓生活。《三吏》《三别》用官吏、老妇、征夫的对话和细节表现征役与离散；《忆昔》对比开元盛世和战后凋敝，保存时代变迁的认识价值。杜诗不仅记录事件，还传达当时人的恐惧、悲悯和忧国情绪，使历史有具体生活质感。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2510","subject":"gws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》中最著名的农事诗是","score":1,"opts":["《七月》","《芣苢》","《大田》","《良耜》"],"ans":"A","ana":"《七月》详细描绘了农夫一年的农事活动与生活情景,是《诗经》中最具代表性的农事诗;B 项是采集诗,C、D 项虽涉农事但知名度与完整性不及《七月》。"},{"t":"s","n":2,"stem":"“知我者谓我心忧,”不知我者谓我何求出自《诗经》中的","score":1,"opts":["《伐檀》","《黍离》","《月出》","《关雎》"],"ans":"B","ana":"诗句表达了流浪者的忧愁,出自《王风·黍离》诗,D;A 项讽喻统治者不劳而获,C 项是爱情项为经典婚恋诗。"},{"t":"s","n":3,"stem":"先秦时期最具文学色彩的历史散文是","score":1,"opts":["《左传》","《战国策》","《尚书》","《国语》"],"ans":"A","ana":"《左传》叙事详备、情节生动,文学性极强;B 项以纵横家言论为主,C 项文字古奥晦涩,D 项文学色彩不及《左传》。"},{"t":"s","n":4,"stem":"《战国策》的整理编订者是","score":1,"opts":["司马迁","班固","蔡邕","刘向"],"ans":"D","ana":"西汉刘向整理编订战国时期各国史料,定名《战国策》;A 项著《史记》,B 项著《汉书》,C 项为东汉文学家、书法家。"},{"t":"s","n":5,"stem":"被闻一多誉为“文章家的极致”的著作是","score":1,"opts":["《孟子》","《荀子》","《庄子》","《韩非子》"],"ans":"C","ana":"《庄子》文辞奇幻、想象丰富,极具文学性,获闻一多此誉;A 项善雄辩,B 项文风严谨,D 项以峻刻著称。"},{"t":"s","n":6,"stem":"堪称“千古吟秋绝唱”的作品是宋玉的","score":1,"opts":["《风赋》","《神女赋》","《高唐赋》","《九辩》"],"ans":"D","ana":"《九辩》以悲秋为核心,情感深沉,是千古吟秋佳作;A 项写风的不同,B、C 项描绘神女与高唐景象。"},{"t":"s","n":7,"stem":"诸子百家中对李斯散文的文风影响最大的是","score":1,"opts":["儒家","道家","纵横家","墨家"],"ans":"C","ana":"李斯散文气势磅礴、善辩服人,受纵横家铺陈张扬、纵横捭阖的文风影响最深;A 项重仁政,B 项尚自然,D 项贵节俭,均与李斯文风不符。"},{"t":"s","n":8,"stem":"刻舟求剑的故事出自","score":1,"opts":["《吕氏春秋》","《战国策》","《墨子》","《吴越春秋》"],"ans":"A","ana":"刻舟求剑出自《吕氏春秋·察今》,讽刺墨守成规者;B 项多记纵横家事迹,C 项为墨家典籍,D 项记吴越历史。"},{"t":"s","n":9,"stem":"《潜夫论》的作者是","score":1,"opts":["桓谭","王符","王充","仲长统"],"ans":"B","ana":"东汉王符著《潜夫论》,抨击社会弊端;A 项著《新论》,C 项著《论衡》,D 项著《昌言》。"},{"t":"s","n":10,"stem":"以“究天人之际,通古今之变”为著述理想的史学家是","score":1,"opts":["班固","刘向","陈寿","司马迁"],"ans":"D","ana":"司马迁在《报任安书》中提出该理想,用于创作《史记》;A 项著《汉书》,B 项整理古籍,C 项著《三国志》。"},{"t":"s","n":11,"stem":"以下不属于司马相如赋作的是","score":1,"opts":["《子虚赋》","《长门赋》","《上林赋》","《长杨赋》"],"ans":"D","ana":"《长杨赋》是扬雄的作品;A、B、C 项均为司马相如代表作,其中《子虚赋》《上林赋》是汉大赋典范。"},{"t":"s","n":12,"stem":"以下汉乐府作品中不属于婚恋诗的是","score":1,"opts":["《江南》","《相逢行》","《有所思》","《上邪》"],"ans":"B","ana":"《相逢行》描写富贵人家的奢华生活,非婚恋主题;A 项是爱情诗,C、D 项表达坚贞的爱情誓言。"},{"t":"s","n":13,"stem":"以下诗句出自《古诗十九首·行行重行行》的是","score":1,"opts":["思君令人老,岁月忽已晚","四顾何茫茫,东风摇百草","生年不满百,常怀千岁忧","盈盈一水间,脉脉不得语"],"ans":"A","ana":"A 项出自《行行重行行》,表达思念之情;B 项出自《回车驾言迈》,C 项出自《生年不满百》,D 项出自《迢迢牵牛星》。"},{"t":"s","n":14,"stem":"作品被评“为汉末实录,真诗史也”的诗人是","score":1,"opts":["曹操","曹丕","王粲","曹植"],"ans":"A","ana":"曹操的诗歌反映了汉末战乱与社会现实,被称为汉末实录;B 项多写宴游与爱情,C项为建安七子之一,D 项诗歌以才情著称。"},{"t":"s","n":15,"stem":"下列不属于对曹植的评价是","score":1,"opts":["骨气奇高","才高八斗","辞采华茂","七子之冠冕"],"ans":"D","ana":"七子之冠冕是对王粲的评价;A、B、C 项均是对曹植的赞誉,体现其诗歌成就与才情。"},{"t":"s","n":16,"stem":"蔡琰的代表作是","score":1,"opts":["《幽愤诗》","《七哀诗》","《悲愤诗》","《孤儿行》"],"ans":"C","ana":"蔡琰的《悲愤诗》叙述自身战乱中被俘的遭遇,情感真挚;A 项是嵇康的作品,B 项为王粲代表作,D 项是汉乐府民歌。"},{"t":"s","n":17,"stem":"对正始士人心态及诗歌创作影响最大的思潮是","score":1,"opts":["玄学","儒学","佛学","法家思想"],"ans":"A","ana":"正始时期玄学盛行,士人崇尚老庄、清谈玄理,其心态与诗歌创作均受玄学深刻影响;B 项在汉代为主流,C 项此时尚未广泛传播,D 项影响有限。"},{"t":"s","n":18,"stem":"开后代左思《咏史》、陶渊明《饮酒》组诗先河的抒情组诗是","score":1,"opts":["曹操《步出夏门行》","嵇康《赠兄秀才入军》","《古诗十九首》","阮籍《咏怀》"],"ans":"D","ana":"阮籍《咏怀》组诗共82响了左思、陶渊明的组诗创首,借咏怀抒发感慨,开创了以组诗形式抒情言志的先河,影作。"},{"t":"s","n":19,"stem":"诗歌创作被《世说新语·文学》誉为“烂若舒锦”的诗人是","score":1,"opts":["陆机","潘岳","左思","张载"],"ans":"B","ana":"《世说新语·文学》评价潘岳诗歌辞采华美如展开的锦缎;A 项文风繁缛,C 项诗风刚健,D 项作品流传较少。"},{"t":"s","n":20,"stem":"苏轼“质而实绮，癯而实腴”评价的是","score":1,"opts":["陶渊明","王羲之","嵇康","曹丕"],"ans":"A","ana":"苏轼此评价赞陶渊明诗歌表面质朴,实则内涵丰富、辞采华美;B 项是书法家,C 项诗风清峻,D 项诗歌清丽。"},{"t":"s","n":21,"stem":"“池塘春草谢家春，万古千秋五字新”评价的是谢灵运的","score":1,"opts":["《登池上楼》","《登永嘉绿嶂山诗》","长于抒情","《七里濑》"],"ans":"A","ana":"诗句赞誉谢灵运《登池上楼》中池塘生春草一句清新自然、千古传诵;B、D 项是其山水诗,C 项是诗歌特点非作品。"},{"t":"s","n":22,"stem":"《搜神记》的作者是","score":1,"opts":["张华","曹丕","干宝","刘义庆"],"ans":"C","ana":"东晋干宝编撰《搜神记》,是志怪小说的代表作;A 项著《博物志》,B 项著《列异传》,D 项著《世说新语》。"},{"t":"s","n":23,"stem":"“人归落雁后,思发在花前”的作者是","score":1,"opts":["卢思道","薛道衡","虞世南","上官仪"],"ans":"B","ana":"诗句出自薛道衡的《人日思归》,表达思乡之情;A 项是北齐诗人,C、D 项是初唐诗人。"},{"t":"s","n":24,"stem":"初唐四杰中王勃、杨炯最擅长的诗体是","score":1,"opts":["五言律诗","七言律诗","绝句","歌行"],"ans":"A","ana":"王勃《送杜少府之任蜀州》、杨炯《从军行》均为五言律诗佳作,二人对五言律诗的成熟贡献突出;B 项尚未成熟,C、D 项非其最擅长。"},{"t":"s","n":25,"stem":"《遥同杜员外审言过岭》被后人称为初唐七律样板,其作者是","score":1,"opts":["沈佺期","宋之问","张若虚","陈子昂"],"ans":"A","ana":"沈佺期的这首诗格律严谨,是初唐七律的典范之作;B 项亦为初唐律诗代表,C 项著《春江花月夜》,D 项倡导汉魏风骨。"},{"t":"s","n":26,"stem":"“孤篇横绝,竟为大家”评价的诗歌作品是","score":1,"opts":["《代悲白头翁》","《长安古意》","《春江花月夜》","《登高》"],"ans":"C","ana":"张若虚的《春江花月夜》意境优美、内涵深厚获此赞誉;A 项是刘希夷作品,B 项是卢照邻作品,D 项是杜甫作品。"},{"t":"s","n":27,"stem":"“气蒸云梦泽,波撼岳阳城”是《临洞庭湖赠张丞相》的","score":1,"opts":["首联","颔联","颈联","尾联"],"ans":"B","ana":"律诗分为首联(一、二句)、颔联(三、四句)、颈联(五、六句)、尾联(七、八句),该句是诗的第三、四句,为颔联。"},{"t":"s","n":28,"stem":"“杨花落尽子规啼，闻道龙标过五溪”中“龙标”指的是","score":1,"opts":["王之涣","王翰","岑参","王昌龄"],"ans":"D","ana":"王昌龄曾任龙标尉,世称王龙标,诗中与龙标无龙标代指王昌龄;A、B、C 项均为唐代诗人,关。"},{"t":"s","n":29,"stem":"花间词派的鼻祖是","score":1,"opts":["韦庄","温庭筠","冯延巳","李煜"],"ans":"B","ana":"温庭筠是晚唐词人,其词多写闺情,辞藻华丽,被尊为花间词派鼻祖;A 项是花间派重要词人,C、D 项为南唐词人。"},{"t":"s","n":30,"stem":"晚唐小品文的代表作家不包括","score":1,"opts":["皮日休","陆龟蒙","柳宗元","罗隐"],"ans":"C","ana":"柳宗元是中唐古文运动代表,并非晚唐小品文作家;A、B、D 项均为晚唐小品文代表,作品多讽刺现实。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"以下属于贾谊散文作品的有","score":2,"opts":["《治安策》","《论积贮疏》","《过秦论》","《论贵粟疏》","《言兵事疏》"],"ans":"ABC","ana":"D 项是晁错的作品,E 项是晁错的奏疏;A、B、C 项均为贾谊的经典散文,针砭时弊、见解深刻。"},{"t":"m","n":32,"stem":"以下有关玄言诗的表述正确的有","score":2,"opts":["发端自正始时代","在东晋诗坛占据主流地位","长于抒情","以谈论老庄玄理为主","为山水诗的成熟和发展奠定了基础"],"ans":"ABDE","ana":"玄言诗以阐释老庄玄理为核心,不长于抒情,C 项错误;A、B、D、的特点E 项均符合玄言诗与影响。"},{"t":"m","n":33,"stem":"元嘉三大家指的是","score":2,"opts":["颜延之","谢灵运","鲍照","沈约","谢惠连"],"ans":"ABC","ana":"元嘉三大家是南朝宋文帝元嘉年间的三位诗人,即颜延之、谢灵运、鲍照;D 项是永明体代表,E 项是谢灵运族弟。"},{"t":"m","n":34,"stem":"以下作品属于唐传奇的有","score":2,"opts":["《枕中记》","《游仙窟》","《莺莺传》","《李娃传》","《三王墓》"],"ans":"ABCD","ana":"E 项《三王墓》出自《搜神记》,是志怪小说;A、B、C、D 项均为唐代传奇代表作,情节完整、人物鲜明。"},{"t":"m","n":35,"stem":"以下诗句属于李商隐的有","score":2,"opts":["身无彩凤双飞翼,心有灵犀一点通","庄生晓梦迷蝴蝶,望帝春心托杜鹃","永忆江湖归白发,欲回天地入扁舟","商女不知亡国恨,隔江犹唱后庭花","嫦娥应悔偷灵药,碧海青天夜夜心"],"ans":"ABCE","ana":"D 项出自杜牧的《泊秦淮》;A 项出自《无题·昨夜星辰昨夜风》,B 项出自《锦瑟》,C 项出自《安定城楼》,E 项出自《嫦娥》,均为李商隐诗作。"}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《古诗十九首》","score":3,"ans":"(1)是最早见于《文选》的十九首无主名的五言诗。(2)非一时一人之作,产生于东汉顺帝末到献帝前。(3)内容上基本是游子思妇之辞。","ana":"《古诗十九首》不是一个作者自定的诗集名，而是萧统《文选》把十九首汉末无名氏五言诗合编后的总题。它们大致形成于东汉末年，具体年代并非每首都可确定；常以游子与思妇的离别相思为线索，如《行行重行行》写远别与衰老，《迢迢牵牛星》写隔河相望，也由此引出人生短促、仕途失意等普遍感受。","anaAI":true},{"t":"term","n":37,"stem":"王粲","score":3,"ans":"(1)是建安七子之一,在七子中诗、赋最佳。(2)代表作有《七哀诗》等。(3)其诗歌的艺术特点在于抒情深切,慷慨悲凉,文辞秀美。","ana":"王粲（177—217）是建安七子之一，战乱中离开故乡、长期寓居荆州的经历，使其诗赋常带有乱离和乡愁。《七哀诗》写长安荒乱和流民惨状，《登楼赋》则在登临中抒发思归而不得的苦闷；作品兼具深切抒情、慷慨悲凉和秀美文辞，故钟嵘称其为“七子之冠冕”。","anaAI":true},{"t":"term","n":38,"stem":"《闲情赋》","score":3,"ans":"[原文字段疑似转录错误，待对照可靠答案源复核] (1)是陶渊明的赋作。(2)表达的是对意切,辞采绮丽中女子的深切思念。(3)极为细腻,譬喻妙。","ana":"题面答案存在转录疑点，暂标待核；作答仍应先界定“《闲情赋》”，再围绕概念、特征和文学史意义分点说明。可依据题干给出的线索复核，不能把存疑内容当作权威结论。","anaAI":true},{"t":"term","n":39,"stem":"“高岑”","score":3,"ans":"(1)指的是高适、岑参。(2)二人是唐代边塞诗派的代表作家。","ana":"“高岑”是盛唐边塞诗人高适、岑参的并称。二人都写亲历的边地军旅、征人处境与塞外景色，但高适多用质朴古体，沉雄悲壮、常关注战争现实；岑参善七言歌行，以奇伟想象和色彩鲜明的奇寒、飞雪景象见长，如《白雪歌送武判官归京》。并称指其边塞诗成就，不意味着二人风格相同。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"short","n":40,"stem":"简析《孟子》文章的主要特点。","score":5,"ans":"(1)最突出的是它的雄辩色彩。(2)善于以典型事例、比喻和寓言说理。","ana":"《孟子》文章最醒目的是雄辩：孟子面对梁惠王、齐宣王等具体听者，先顺着对方关切设问，再层层推论，常以反问、排比增强气势。《梁惠王上》“五十步笑百步”把战争逃兵的自我辩解转成讽刺，《告子上》“揠苗助长”则以寓言说明违背规律的危害。典型事例和比喻不是装饰，而是把仁政、性善等抽象主张变得可感、难以回避。","anaAI":true},{"t":"short","n":41,"stem":"简述扬雄对大赋创作的拓展。","score":5,"ans":"(1)拓展了大赋的题材领域。(2)进一步加强了大赋“劝百讽一”的劝谕色彩。(3)艺术表现上有了新的变化。","ana":"扬雄承接司马相如的大赋传统，作品从天子田猎进一步扩展到甘泉祭祀、河东后土祭祀等题材，如《甘泉赋》《河东赋》《羽猎赋》《长杨赋》。他仍以铺陈展示宫苑和仪礼，但比司马相如更强调赋末讽谏，强化“劝百讽一”中的劝戒；篇章有时缩短、对象较集中，常先极写其盛，再以议论收束，显示大赋从纯铺张向议论、讽谏拓展。","anaAI":true},{"t":"short","n":42,"stem":"简析《西洲曲》的艺术特点。","score":5,"ans":"(1)情思缠绵,写景秀丽。(2)语言清新明丽。(3)换韵造成回环婉转的效果。","ana":"《西洲曲》以女子怀念情人为情感主线，把采莲、登楼、折梅、望郎等江南生活场景串成四季流转的长篇抒情歌。诗中“忆梅下西洲”等地名和动作反复牵引思绪，景物明丽而情意缠绵；语言清新口语化，换韵与句式回环造成歌唱节奏，既有民歌的明快，也有精心经营的结构。","anaAI":true},{"t":"short","n":43,"stem":"简述韩愈、柳宗元的古文理论主张。","score":5,"ans":"(1)提出“文以明道”的观念，确定了古文创作的指导思想。(2)提出“不平则鸣”的口号。(3)提出“唯陈言之务去”的主张。","ana":"韩愈、柳宗元共同以古文反对骈文因袭，主张文章应承载儒家之道；韩愈用“文以明道”说明文章的思想目的，又以“惟陈言之务去”要求摆脱陈旧套语，并提出“不平则鸣”，解释遭际不平如何激发文学表达。柳宗元强调文与道相须、道应落实于经世实践，也参与古文创作。答题应区分共同方向与个人表述，不要把所有口号都笼统归给两人。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"essay","n":44,"stem":"论述《离骚》的艺术表现成就。","score":14,"ans":"(1)浓烈的激情和奇幻的想象。(2)峻洁纯美、独立不屈的抒情主人公形象。(3)比兴手法的拓展。(4)结构上虚实结合;形式上韵散结合;语言富于艺术表现力。","ana":"《离骚》的艺术力量来自政治理想和个人遭际的强烈交织：屈原以“美政”求举贤修法，遭谗后仍宣誓“虽九死其犹未悔”，形成峻洁、独立的抒情主人公。香草、美人、佩饰构成贯穿全篇的比兴象征，把修德与政治选择写成可感形象；篇章由现实陈述转向上下求索、神游求女，虚实交替、层层推进。楚地方言、“兮”字句与长短句相间，又让语言兼具歌唱性和繁富节奏。","anaAI":true},{"t":"essay","n":45,"stem":"论述杜甫诗歌的艺术风格及其对后世的影响。","score":14,"ans":"(1)主要风格特征是沉郁顿挫,其感情基调是悲慨。(2)沉郁,指其感情的悲慨壮大深厚;顿挫,指其感情的表达波浪起伏、反复低回。(3)杜甫是诗歌史上一位承先启后的人物,至宋代成为作诗效法的最高典范。(4)在思想情操与士人人格的形成上,对后世产生重大影响。","ana":"杜甫的“沉郁顿挫”把深厚忧患写进曲折的诗歌结构：沉郁是忧国、悯民与身世之感凝重，顿挫是情绪经过停顿、转折和回环才释放。《登高》由秋江、落木转入衰病漂泊，《秋兴八首》把个人羁旅与长安兴亡交织；《三吏》《三别》又以对话和细节写战争征役中的百姓。杜诗因此成为宋代诗人学杜的重要典范，其现实关怀和士人责任感也持续影响后世诗歌。","anaAI":true}]}],"code":"00538","qaNotes":[]},{"paper":"gws-2604","subject":"gws","session":"2604","label":"2026年4月","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"以下关于神话的基本特征表述不正确的是","score":1,"opts":["没有经过想象或幻想的加工","反映了远古人类的愿望","只能产生在远古时代","是对自然和社会现象的解释说明"],"ans":"A","ana":"神话以远古集体想象解释自然与社会、寄托愿望；说它“没有经过想象或幻想的加工”恰与神话形成方式相反。","anaAI":true},{"t":"s","n":2,"stem":"伪古文《尚书》出现于","score":1,"opts":["西汉","东汉","西晋","东晋"],"ans":"D","ana":"东晋梅赜进献的《古文尚书》后经考证为伪古文，与汉代发现、传授的《尚书》系统须区别。","anaAI":true},{"t":"s","n":3,"stem":"“上善若水”出自","score":1,"opts":["《老子》","《孟子》","《庄子》","《墨子》"],"ans":"A","ana":"“上善若水，水善利万物而不争”见《老子》第八章，以水喻至善者的处世方式。","anaAI":true},{"t":"s","n":4,"stem":"《春秋外传》指的是","score":1,"opts":["《左传》","《国语》","《公羊传》","《穀梁传》"],"ans":"B","ana":"《国语》按国分记周、鲁、齐等言论，传统称《春秋外传》；《左传》则称《春秋左氏传》。","anaAI":true},{"t":"s","n":5,"stem":"“触蛮之争”出自《庄子》中的","score":1,"opts":["《秋水》","《则阳》","《列御寇》","《应帝王》"],"ans":"B","ana":"蜗角上触氏与蛮氏相争的寓言在《庄子·则阳》，以空间尺度转换讽刺争夺之微不足道。","anaAI":true},{"t":"s","n":6,"stem":"先秦时期与儒家并称“显学”的是","score":1,"opts":["法家","墨家","道家","名家"],"ans":"B","ana":"《韩非子·显学》明确并举儒、墨，故与儒家并称显学的是墨家；本卷B对应“墨家”，不是沿用旧卷字母。","anaAI":true},{"t":"s","n":7,"stem":"先秦诸子著作中使用寓言最多的是","score":1,"opts":["《荀子》","《孟子》
