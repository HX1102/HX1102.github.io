stem":"永明诗歌对于中国文学最重要的贡献是（ ）。","opts":["重文学特质的发扬","重诗歌形式的探索","重个人情怀抒发","创造清新的美的理想"],"ans":"B","score":1,"ana":"永明诗人系统探索四声、声律和对偶，推动诗歌形式自觉，为近体诗格律发展奠基，因此最重要贡献是重诗歌形式的探索。文学特质和个人情怀亦有发展，但声律革新是永明体的标志性文学史意义。","anaAI":true},{"t":"s","n":21,"stem":"南朝民歌的内容大多表现的是（ ）。","opts":["忧世之思","金戈铁马","男女之情","自然风光"],"ans":"C","score":1,"ana":"南朝乐府民歌以吴歌、西曲为主，常写青年男女相悦、相思和离别，男女之情是最主要内容。忧世、战争或纯粹自然风光不是其整体题材重心。","anaAI":true},{"t":"s","n":22,"stem":"左思《白发》、王沉《释时》、鲁褒《钱神》均是（ ）。","opts":["山水赋","咏物赋","感伤赋","刺世赋"],"ans":"D","score":1,"ana":"左思《白发》、王沉《释时》、鲁褒《钱神》借议论或寓言讽刺社会风气和现实弊端，归为刺世赋。它们并非以自然景物咏物或单纯个人伤感为主。","anaAI":true},{"t":"s","n":23,"stem":"北朝文学中最具特色的文体是（ ）。","opts":["诗歌","散文","赋","小说"],"ans":"B","score":1,"ana":"北朝文学较有特色的成就体现在散文，特别是《水经注》《洛阳伽蓝记》等地理、历史散文，兼具叙事、写景和史料价值。诗歌与赋也有佳作，但整体文体特色不如散文突出。","anaAI":true},{"t":"s","n":24,"stem":"《世说新语》详于记述的内容是（ ）。","opts":["士族遗闻轶事","宫廷制度","各地风俗习惯","怪异传说"],"ans":"A","score":1,"ana":"《世说新语》以魏晋士族名士的言行、清谈、品藻和轶事为中心，通过短篇故事呈现士族社会风貌与人物性格。宫廷制度、地方风俗或怪异传说不是该书的主要记录对象。","anaAI":true},{"t":"s","n":25,"stem":"隋代无名氏《送别诗》的创作特点是（ ）。","opts":["笔力苍劲","词气宏拔","音律和谐","辞清句丽"],"ans":"C","score":1,"ana":"隋代无名氏《送别诗》声律匀称，句式流畅，表现出近体诗格律逐渐成熟的面貌，故以音律和谐为其特点。苍劲、宏拔或辞清句丽都不是此诗最突出的评价。","anaAI":true},{"t":"s","n":26,"stem":"崔颢的名作《黄鹤楼》被推为（ ）。","opts":["初唐七律样板","七律纯熟的标志","唐人七律之首","古今七言律诗第一"],"ans":"C","score":1,"ana":"崔颢《黄鹤楼》历来被推为唐人七律之首，前半自然流转，后半由登临转入乡愁，结构和声情都极成熟。其他选项也是对七律发展的相关评价，但传统最高赞语是“唐人七律之首”。","anaAI":true},{"t":"s","n":27,"stem":"韦应物后期诗歌的风格是（ ）。","opts":["沉郁顿挫","闲淡简远","刚健明朗","雄奇奔放"],"ans":"B","score":1,"ana":"韦应物后期诗多写闲居、山水和送别，语言淡雅、意境疏远，风格闲淡简远，故选B。沉郁顿挫常概括杜甫，雄奇奔放常见于李白，刚健明朗不如B切合韦诗后期。","anaAI":true},{"t":"s","n":28,"stem":"王建的诗歌创作中成就最高的是（ ）。","opts":["乐府诗","格律诗","山水诗","田园诗"],"ans":"A","score":1,"ana":"王建最突出的成就在乐府诗，尤其新乐府，善写宫市、田家和军旅生活，叙事简洁而有现实感，故选A。格律诗、山水诗、田园诗不是其主要成就领域。","anaAI":true},{"t":"s","n":29,"stem":"贾岛诗歌创作特点是（ ）。","opts":["以咏史著称","以苦吟著称","诗意朦胧","诗风清丽"],"ans":"[答案待核：解析判断与原录答案不一致；原录答案：A]","score":1,"ana":"贾岛以苦吟著称，反复推敲字句、精心锤炼意象，“鸟宿池边树，僧敲月下门”的推敲故事即与其相关。现存答案A“以咏史著称”不准确；应选B，按现存答案，待核。","anaAI":true},{"t":"s","n":30,"stem":"皮日休的《读司马法》属于（ ）。","opts":["传奇小说","山水游记","小品文","骈体文"],"ans":"C","score":1,"ana":"皮日休《读司马法》借古代兵书议论现实，是晚唐小品文代表；它不是传奇小说、山水游记，也不以骈偶声律为体。故选C。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"出自屈原《九歌》的作品有","opts":["《思美人》","《湘夫人》","《大司命》","《少司命》","《东皇太一》"],"ans":"BCDE","score":2,"ana":"《湘夫人》《大司命》《少司命》《东皇太一》均为《九歌》篇目；《思美人》属《九章》，不在《九歌》中。篇名对应神祇祭歌体系，故选B、C、D、E。","anaAI":true},{"t":"m","n":32,"stem":"汉代乐府民歌的题材内容有","opts":["讽刺达官显贵","反映人民对战争的厌倦","歌颂爱情婚姻","倾诉生活艰难困顿和漂泊流荡","表达人生哲理"],"ans":"ABCDE","score":2,"ana":"汉乐府题材广泛：有《陌上桑》等讽刺权贵，有《战城南》等写战争之苦，有《上邪》《有所思》等爱情婚姻，有《东门行》等贫困漂泊，也有《长歌行》等人生感喟。因此五项均有相应作品支持。","anaAI":true},{"t":"m","n":33,"stem":"嵇康诗歌的艺术特色有","opts":["诗化之人生理想境界","清逸玄远之美","愤激批判之语","冲淡平和之意境","隽秀之语言"],"ans":"ACE","score":2,"ana":"嵇康诗中既有对理想人格和自然人生的追求，也有清醒尖锐的愤激批判，《幽愤诗》尤其表现受压抑后的抗议，所以A、C、E成立。其诗并非以冲淡平和或清逸玄远为主调，这些更接近部分玄言诗或陶诗风格。","anaAI":true},{"t":"m","n":34,"stem":"李商隐政治诗的思想内容有","opts":["关注民生","抨击宦官","感伤历史","批评朝政","表现党争"],"ans":"ABCD","score":2,"ana":"李商隐政治诗关心现实民生、抨击宦官专权、批评朝政并反思历史兴亡，部分作品也映照牛李党争等政治冲突，A至D均成立。题中没有与这些内容相冲突的“纯个人爱情”项。","anaAI":true},{"t":"m","n":35,"stem":"唐代传奇的创作特点主要有","opts":["人物形象栩栩如生","故事情节曲折，引人入胜","语言华美，凝炼传神","题材丰富多彩","有意为小说"],"ans":"ABCDE","score":2,"ana":"唐传奇是具有自觉虚构意识的文言小说，常有鲜明人物、曲折情节、华美而传神的语言，题材从爱情、侠义到历史神怪皆有，且作者“有意为小说”是与六朝志怪的重要区别。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"w","n":36,"stem":"《天问》","ans":"[答案禁用：QA台账记载主观答案区块与本卷题干错位，待逐题定位]","score":3,"ana":"《天问》是屈原以连续发问组织全篇的奇特作品，从天体运行、神话谱系问到历史兴亡和现实政治，传统统计约一百七十余问。它不按通常叙事或抒情展开，质疑神话与历史既显示博闻，也体现诗人对秩序、正义和政治现实的批判精神。","anaAI":true,"qaNotes":"依据现存逐套QA台账的来源错配记录暂时禁用，不作内容猜测。"},{"t":"w","n":37,"stem":"李斯","ans":"（1）李斯的创作包括奏议和刻石文。（2）《谏逐客书》铺陈排比，有纵横之气；刻石文铺叙颂夸，气度宏伟，韵律谐和。","score":3,"ana":"李斯是秦代政治家、文学家，传世文章主要有奏议与刻石文。《谏逐客书》借秦国历史铺陈客卿功绩，排比雄辩、保留纵横游说气势；秦刻石文则以整齐韵语歌颂统一功业，声调宏阔。两类文体一重政论说服，一重帝国颂功。","anaAI":true},{"t":"w","n":38,"stem":"《洛阳伽蓝记》","ans":"杨衒之的《洛阳伽蓝记》属历史笔记，也是写景状物的散文。书中主要是对佛寺的描写，有的篇章写得精致；该书是历史散文，具有极高的史料价值。","score":3,"ana":"杨衒之《洛阳伽蓝记》记北魏洛阳佛寺兴废及相关人物、城市生活，兼具历史笔记和游记散文性质。其寺院建筑、街市景象写得具体生动，既可读作北魏都城风貌的文学记录，也为研究北魏政治、民族、宗教和城市史提供重要史料。","anaAI":true},{"t":"w","n":39,"stem":"“小李杜”","ans":"杜牧和李商隐同为晚唐七绝成就最高的诗人，世称“小李杜”。","score":3,"ana":"“小李杜”指晚唐李商隐与杜牧，借“小”与李白、杜甫区别。二人都以诗文成就著称，但风格各异：杜牧七绝明朗俊爽、善议论怀古；李商隐诗尤其七律深婉密丽、善用典寄托，并非两人风格相同才并称。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述我国神话对后世文学发展的影响。","ans":"（1）神话的艺术规则为后世文学的发展提示了方向。一方面，神话所开创的为人生的主题，事实上成为我国数千年文学发展的主流和传统；另一方面，神话富于情感、形象和想象的特征，引导了后世文学审美理想的发展走向。（2）丰富多彩的神话作品，成为后世文学创作取之不尽、用之不竭的题材源泉。从最早的文学总集《诗经》到近现代文学创作，从诗歌散文到戏曲小说，无不得到神话的滋养。","score":5,"ana":"中国神话把人类起源、洪水、英雄和自然现象组织成富有情感与想象的故事，为后世提供了“人如何面对自然和命运”的主题，也塑造了浪漫想象、变形夸张和象征寄托等表现方式。《诗经》、楚辞、汉赋不断吸收神话人物和母题；后世小说、戏曲又改写女娲、精卫、鲧禹等故事，使神话成为持续更新的题材资源。","anaAI":true},{"t":"w","n":41,"stem":"简述《离骚》永恒的精神价值。","ans":"（1）《离骚》是屈原自叙生平的长篇抒情诗，他的情感和思想都熔铸在其中。（2）表现“美政”理想和深沉的爱国情感。（3）体现追求理想九死不悔的坚韧品格和嫉恶如仇的批判精神。","score":5,"ana":"《离骚》把屈原的政治理想、爱国忧思和个人遭际熔为一体：所谓“美政”是举贤授能、修明法度，以挽救楚国；遭谗被疏后，他仍坚持理想，不肯与污浊妥协。香草美人比兴写其洁身自守，反复求索和“九死未悔”的誓言则表现坚韧品格，揭露群小妒贤也形成强烈批判。","anaAI":true},{"t":"w","n":42,"stem":"简述张衡在赋史上的地位。","ans":"张衡是赋史上承前启后的作家。代表作《二京赋》规模、容量和篇幅都超过前人，铺陈胪列，细致描绘，成为汉代京都赋的极致；《归田赋》是东汉抒情小赋的开山之作。","score":5,"ana":"张衡以《二京赋》承接京都大赋，铺写洛阳、长安的宫阙、市场、百戏和社会生活，篇幅与容量宏大，代表汉代大赋的成熟高峰；其讽谏又使铺陈不止于夸饰。晚年《归田赋》则转向个人归隐愿望，以田园景物和轻快抒情摆脱大赋铺陈，通常被视为东汉抒情小赋的开山之作，体现赋体由宏大展示向个体抒怀的转折。","anaAI":true},{"t":"w","n":43,"stem":"简述张若虚《春江花月夜》的艺术成就。","ans":"（1）“孤篇横绝，竟为大家”“诗中的诗，顶峰上的顶峰”。（2）这是一首长篇歌行，采用乐府旧题但赋予全新内容，将画意、诗情与对宇宙奥秘和人生哲理的体察融为一体，创造出情景交融、玲珑透彻的诗境。","score":5,"ana":"《春江花月夜》沿用乐府旧题，却不再写传统艳情，而把春江月夜景物、游子思妇相思和“江月何年初照人”的宇宙追问融为长篇歌行。月色贯穿全诗，景物转换带出时间与空间流动；由个人离愁推进到人生代代无穷的思考，情、景、理交织，语言清丽而意境玲珑。所谓“孤篇横绝”强调其艺术高度，并非仅因作者作品少。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述谢灵运山水诗的艺术特点。","ans":"（1）创造了一种山水诗的结构模式。（2）在局部景物描写中，通过细腻的观察与把握和具体画面，表现景观的情思韵味、情景交融。（3）对山水景物的声、光、色都有生动的描绘。（4）其山水诗发展尚未达到构造完整意境的阶段，处于有佳句而无佳篇的层次。","score":14,"ana":"谢灵运山水诗常以“出游—写景—转入玄理或身世感慨”的结构组织全篇，游踪为铺陈线索；局部又精细描摹山石、林木、泉声、光色，常有“池塘生春草”一类名句。其贡献在于把山水景物提升为独立审美对象，但不少作品前半写景细密、后半议理显露，整体意境尚未完全融成一体，因此常被概括为有佳句而篇章整合仍在发展。","anaAI":true},{"t":"w","n":45,"stem":"结合具体作品，论述杜甫诗歌的诗史性质。","ans":"杜甫的诗歌形象真实地反映了安史之乱前后的时代动乱，是时代的一面镜子，故有“诗史”之誉。（1）杜诗具有史的认识价值，以时事入诗而含热泪深情，尖锐细密地观察与写实，直面社会现实，如“三吏”“三别”、《忆昔》。（2）杜诗提供了比历史事件更为广阔、具体、生动的生活画面，使人如临其境。（3）从诗中可以感受到当时社会的某些心理状态。","score":14,"ana":"杜甫“诗史”不是说诗可以替代史书，而是其诗以亲历者的悲悯，保存安史之乱前后社会的具体经验。《三吏》《三别》写征兵、离散和官吏处置，以对话与细节呈现民众承受的压力；《忆昔》回望开元盛世与战乱后凋敝，形成历史对照。诗歌既提供事件之外的生活场景和心理感受，也把写实与忧国忧民的抒情结合起来。","anaAI":true}]}],"qaNotes":["答案核对修正：Q27、Q28、Q30与gws-2110同题且选项文本完全一致；依选项内容对应改为B（闲淡简远）、A（乐府诗）、C（小品文）。题号相同不是依据，核对的是题干及完整选项文本。","题目答案来源限制：暂禁用来源错配风险项自动评分，待原答案页逐题复核。"]},{"paper":"gws-2310","subject":"gws","session":"2310","label":"2023年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"“女娲造人”属于（）","score":1,"opts":["创世神话","战争神话","自然灾害神话","先秦传说故事"],"ans":"A","ana":"女娲造人解释人类起源，属于创世神话。战争神话写部族或神祇冲突，自然灾害神话解释洪水、旱灾等现象；女娲补天虽与灾变相关，但造人这一故事的分类依据是创世。","anaAI":true},{"t":"s","n":2,"stem":"《诗经・关雎》的主题是（","score":1,"opts":["叙写夫妇间的深挚情爱","抒发恋爱和相思的甜蜜","表现弃妇的哀怨悲苦","描写征夫的艰辛服役"],"ans":"B","ana":"《关雎》写君子对淑女的追求，从“求之不得”到“琴瑟友之”，情感既有爱慕相思，也走向婚姻和谐。题目现存答案B强调恋爱相思的甜蜜，符合篇章主要情感；它不是弃妇怨歌或征夫诗。","anaAI":true},{"t":"s","n":3,"stem":"从反映的社会人生内涵上说，《诗经・新台》属于（）","score":1,"opts":["史诗","婚恋诗","政治讽喻诗","人生哲理诗"],"ans":"C","ana":"《新台》讽刺卫宣公筑新台、强娶儿媳的丑行，以“新台有泚”等反语写统治者失德，属于政治讽喻诗。它虽涉及婚姻事件，重点却在揭露君主淫乱和政治伦理败坏。","anaAI":true},{"t":"s","n":4,"stem":"《诗经》按音乐分为风、雅、颂三类，其中雅是指（）","score":1,"opts":["各地不同的音乐","人文士大夫宴饮音乐","宗庙祭祀用的音乐","王朝京畿地区音乐"],"ans":"D","ana":"“雅”指王朝京畿地区的正声，分《大雅》《小雅》，多为朝廷宴飨、政治讽谏及相关礼乐诗。各地民歌是“风”，宗庙祭祀颂歌是“颂”，并非把雅简单等同于宴饮音乐。","anaAI":true},{"t":"s","n":5,"stem":"属于编年史的史书是（ ）","score":1,"opts":["《尚书》","《左传》","《国语》","《逸周书》"],"ans":"B","ana":"《左传》以鲁国编年史《春秋》为纲，按年叙述诸侯国史事，属于编年体史书。《尚书》《逸周书》是历史文献汇编，《国语》按国别分篇，体例不同。","anaAI":true},{"t":"s","n":6,"stem":"先秦诸子中，曾创作“赋”是（）","score":1,"opts":["庄子","孟子","荀子","韩非子"],"ans":"C","ana":"荀子现存《赋篇》以赋体写礼、知、云、蚕、箴等对象，是先秦诸子中明确进行赋体创作的代表。庄子、孟子、韩非子虽有寓言和论说文，不以赋篇著称。","anaAI":true},{"t":"s","n":7,"stem":"贾谊、晁错散文的共同特点是（）","score":1,"opts":["气势犀利","引经据典","排比铺叙","质实朴厚"],"ans":"C","ana":"贾谊政论文和晁错政论文都常以排比铺叙增强论势，兼具战国策士纵横说理的影响。两人都重现实论证，但气势犀利或质实朴厚更容易分别概括个性，不能覆盖共同的行文手法。","anaAI":true},{"t":"s","n":8,"stem":"刘向《新序》《说苑》特点是（）","score":1,"opts":["笔墨简短","刻画精细","文气盛壮","夹叙夹议"],"ans":"A","ana":"《新序》《说苑》由刘向编纂，常把史事、传闻和人物言论按主题编排，篇章短小，便于借故事劝诫。其主要特点不是细腻小说式刻画或盛壮文气，夹叙夹议虽可出现，也非题目所指的总体特点。","anaAI":true},{"t":"s","n":9,"stem":"司马相如的代表作是（）","score":1,"opts":["《吊屈原赋》《鵩鸟赋》","《子虚赋》《上林赋》","《校猎赋》《长杨赋》","《遂初赋》《甘泉赋》"],"ans":"C","ana":"《子虚赋》《上林赋》是司马相如代表作，以诸侯与天子游猎为框架，大量铺陈苑囿、物产和声色，体现汉大赋的规模与辞采。《吊屈原赋》《鵩鸟赋》属于贾谊；《校猎赋》《长杨赋》为扬雄；《遂初赋》为刘歆。","anaAI":true},{"t":"s","n":10,"stem":"汉武帝《李夫人赋》的艺术特点是（","score":1,"opts":["情思浓烈","铺张扬厉","质朴无华","繁难华丽"],"ans":"A","ana":"《李夫人赋》围绕汉武帝追念已逝李夫人展开，借幻觉般的相见写哀思和不能复得的痛苦，情思浓烈是其抒情核心。它不是大赋式铺陈，也不以质朴或繁难华丽辞藻为主要风格标签。","anaAI":true},{"t":"s","n":11,"stem":"东方朔《答客难》《非有先生传》的创作特点是（）","score":1,"opts":["借景抒情","托物言志","抒情浓烈","抒情冷静"],"ans":"C","ana":"《答客难》《非有先生传》借设问和寓言式对话表现士人不得志及对现实政治的感慨，抒情成分浓厚。它们不以山水景物或某一物象寄托为主，表达也并非全然冷静客观。","anaAI":true},{"t":"s","n":12,"stem":"玉褒《洞箫赋》在艺术表现上的特点是（）","score":1,"opts":["咏物自况","单纯咏物","借物喻理","直抒胸臆"],"ans":"A","ana":"王褒《洞箫赋》一面细致描写竹材、制箫、音色和演奏，一面将乐器遭际与作者身世相联系，做到咏物自况。它超越只写物态的单纯咏物，也不是直白说理或直接抒胸臆。","anaAI":true},{"t":"s","n":13,"stem":"《文选》《玉台新咏》中收录的所谓“苏李诗”属于（）","score":1,"opts":["四言诗","五言诗","七言诗","杂言诗"],"ans":"B","ana":"《文选》《玉台新咏》所收“苏李诗”主要为五言古诗，传统上题为苏武、李陵唱和，文学史研究多认为其作者和年代存在疑问。按题目既有答案，选五言诗；“苏李”归属按现存答案，待核。","anaAI":true},{"t":"s","n":14,"stem":"汉代乐府民歌《东门行》的主题是（","score":1,"opts":["反映对战争的厌倦","反映爱情婚姻","倾诉生活艰难困顿","表现人生哲理"],"ans":"C","ana":"《东门行》写贫困男子面对家人挨饿、被迫拔剑出门谋生，集中呈现下层百姓生活艰难困顿。诗中有家庭冲突，但不是婚恋主题，也不是战争或抽象人生哲理。","anaAI":true},{"t":"s","n":15,"stem":"王粲诗歌艺术特点是（ ）","score":1,"opts":["醉气平和","抒情深切","炽烈热情","纤丽清新"],"ans":"B","ana":"王粲《七哀诗》等作品常写乱离、流亡和思乡，情感沉痛而真挚，善把个人遭际与时代动乱交织，故以抒情深切见长。纤丽清新更接近曹丕诗风，炽烈热情或平和醉气都不如“深切”切合。","anaAI":true},{"t":"s","n":16,"stem":"关于阮籍《咏怀诗》描述正确的是（ ）","score":1,"opts":["为一时一地之作","无统一文学特征","诗歌意旨显豁","创造抒情组诗新形式"],"ans":"D","ana":"阮籍《咏怀诗》以八十二首组诗构成持续抒情，虽主题反复涉及忧生、政治恐惧和怀才不遇，单篇意旨多隐约曲折，并非一时一地即兴之作。其重要创新是建立以组诗持续展开复杂内心的新形式。","anaAI":true},{"t":"s","n":17,"stem":"在中国文学史上第一个把庄子诗化的作家是（）","score":1,"opts":["何晏","阮籍","陈琳","嵇康"],"ans":"D","ana":"嵇康在诗中把庄子关于逍遥、自然和精神自由的思想转化为抒情境界，故被称为中国文学史上第一个把庄子诗化的作家。阮籍也深受老庄影响，但题目对应的作家是嵇康。","anaAI":true},{"t":"s","n":18,"stem":"左思、刘琨所代表的诗歌风格是（）","score":1,"opts":["绮丽诗风","刚健诗风","平淡诗风","纤巧诗风"],"ans":"B","ana":"左思《咏史》刚健有力，刘琨诗在国难中慷慨悲壮，二人都体现魏晋之际的刚健诗风。绮丽、平淡、纤巧都不能概括他们面对现实压力时的骨力和悲慨。","anaAI":true},{"t":"s","n":19,"stem":"玄言诗的发端时代是（）","score":1,"opts":["建安时期","永明时期","正始时期","太康时期"],"ans":"C","ana":"玄言诗兴起于正始时期，受老庄清谈与玄学风气影响，以玄理入诗；东晋孙绰、许询等人使其更为盛行。建安、太康和永明都不是其发端时代。","anaAI":true},{"t":"s","n":20,"stem":"陶渊明《自祭文》中对待死亡的态度是（）","score":1,"opts":["达观","忧惧","逃避","疑虑"],"ans":"A","ana":"《自祭文》以陶渊明临终自述的口吻回顾一生，承认生命终结而不恐惧、不哀号，呈现顺化归尽的达观态度。它不是逃避死亡，而是把死亡视作自然生命过程。","anaAI":true},{"t":"s","n":21,"stem":"永明年间，大量出现且“泛滥无归”的诗歌类型是（）","score":1,"opts":["游仙诗","乐府诗","山水诗","游戏诗"],"ans":"D","ana":"永明年间诗坛大量创作游戏诗，形式技巧和文字游戏一度繁多却缺少深厚寄托，钟嵘所谓“泛滥无归”正针对这类风气。山水诗和乐府诗并非这句批评的主要对象。","anaAI":true},{"t":"s","n":22,"stem":"北朝民歌中的《木兰诗》是（）","score":1,"opts":["抒情诗","叙事诗","乐府诗","近体诗"],"ans":"B","ana":"《木兰诗》以木兰代父从军为主线，通过从军、征战、还乡形成完整故事，属叙事诗。它属于北朝乐府民歌，但“乐府诗”是音乐/文体类别，“叙事诗”才回答题目所问的诗歌性质；不属于近体诗。","anaAI":true},{"t":"s","n":23,"stem":"向秀《思旧赋》的写作风格是（）","score":1,"opts":["顿挫清壮","慷慨悲凉","婉转低回","讥刺愤世"],"ans":"C","ana":"向秀《思旧赋》因嵇康、吕安被害而作，回忆旧友、故居与往事，情感含蓄压抑，行文婉转低回。它不以公开讥刺或高亢慷慨为风格，悲痛通过克制和景物追忆显现。","anaAI":true},{"t":"s","n":24,"stem":"在魏晋志怪小说中，《拾遗记》可归入的小说类别是（）","score":1,"opts":["博物琐闻","杂传体","丛谈笔记","杂史体"],"ans":"D","ana":"王嘉《拾遗记》记载神异人物、古代遗闻和奇物，但传统分类常列为杂史体，兼有补遗史事的性质。博物琐闻可描述其内容，杂传体与丛谈笔记也容易混淆；按该题分类，答案D“杂史体”是通行答案。","anaAI":true},{"t":"s","n":25,"stem":"陈子昂《感遇》诗的特点是（）","score":1,"opts":["采丽竞繁","兴象玲珑","讲究格律","复归风雅"],"ans":"D","ana":"陈子昂《感遇》反对齐梁“采丽竞繁”，借比兴寄托现实感慨，倡导恢复《诗经》风雅传统，故其特点是复归风雅。兴象玲珑更常用于唐诗意境评价，讲究格律也不是该组诗的首要纲领。","anaAI":true},{"t":"s","n":26,"stem":"自居易诗分为四类，其中《长恨歌》属于（）","score":1,"opts":["讽谕诗","闲适诗","感伤诗","杂律诗"],"ans":"C","ana":"白居易把诗分为讽谕、闲适、感伤、杂律四类，《长恨歌》叙述唐玄宗与杨贵妃爱情及盛衰感慨，归入感伤诗。它有讽谏意味，但依白居易自定分类不是讽谕诗。","anaAI":true},{"t":"s","n":27,"stem":"李商隐诗歌的风格特点是（）","score":1,"opts":["刚健爽朗","清冷峭拔","意蕴幽隐","高华俊爽"],"ans":"C","ana":"李商隐诗常通过典故、象征和朦胧意象寄托情思，意义幽微而不直露，故以意蕴幽隐为典型风格。刚健爽朗、清冷峭拔和高华俊爽更不能概括其无题诗及政治诗的婉曲密丽。","anaAI":true},{"t":"s","n":28,"stem":"陆龟蒙的《野庙碑》属于（","score":1,"opts":["山水游记","小品文","传奇小说","骈体文"],"ans":"B","ana":"陆龟蒙《野庙碑》以短篇碑记形式讽刺乡民迷信和地方官吏借祠庙敛财，议论犀利、篇幅精悍，属于晚唐小品文。它不是山水游记、传奇叙事或骈体文章。","anaAI":true},{"t":"s","n":29,"stem":"传奇小说《霍小玉传》属于（）","score":1,"opts":["爱情故事","灵异故事","梦幻故事","游侠故事"],"ans":"A","ana":"《霍小玉传》围绕霍小玉与李益的爱情、负约及悲剧结局展开，是唐传奇爱情故事。其情节涉及誓约和怨鬼元素，但核心是爱情关系，不是单纯灵异、梦幻或侠义故事。","anaAI":true},{"t":"s","n":30,"stem":"张志和词《鱼父》“西塞山前白鹭飞”属于（ 二、多项选择题：本大题共5小题，每小题2分，共10分。","score":1,"opts":["曲子词","早期文人词","伶工之词","士大夫之词"],"ans":"B","ana":"张志和《渔父》（亦题《渔歌子》）“西塞山前白鹭飞”原为曲子词，亦有“早期文人词”之称，题目答案B应按这一词体史分类理解；“渔父”写隐逸情趣，不等于伶工演唱作品。题干字段被后续题型说明截断，篇名“鱼父”应为“渔父”之疑，按现存答案，待核。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"《诗经》中属于史诗的作品有（）","score":2,"opts":["《公刘》","《皇矣》","《大明》","《七月》","《生民》"],"ans":"[答案待核：解析指出史诗作品选项可能漏列《生民》，答案需核源；原录答案：ABC]","ana":"《公刘》《皇矣》《大明》均属《大雅》，《生民》属《大雅》，都叙写周族祖先迁徙、创业和兴起，可作为周族史诗性作品；《七月》属《豳风》，主要反映农事生产，不是史诗。现存答案ABC漏列《生民》，按现存答案，待核。","anaAI":true},{"t":"m","n":32,"stem":"秦刻石文的特点是（）","score":2,"opts":["四言为句","铺叙颂夸","气度宏伟","韵律谐和","文采斐然"],"ans":"ABCD","ana":"秦刻石文以四言句为主，铺叙并颂扬秦统一功业，气度宏伟且句末押韵，故A至D成立。它以简整庄重为务，并不以辞采繁富、文采斐然见长，E不选。","anaAI":true},{"t":"m","n":33,"stem":"北朝民歌是艺术特点有（","score":2,"opts":["想象大胆巧妙","反映尚武精神","描写游牧生活","语言清新流丽","天然质朴之气"],"ans":"BCE","ana":"北朝民歌常反映尚武精神和游牧生活，叙述直率，保留天然质朴的民间气息，因此B、C、E成立。大胆巧妙想象可以见于个别作品但不是主要共性；“清新流丽”更常用来概括南朝民歌。","anaAI":true},{"t":"m","n":34,"stem":"隋代文坛上来自北齐、北周旧臣有（）","score":2,"opts":["卢思道","杨素","薛道衡","虞世基","王胄"],"ans":"ABC","ana":"卢思道、薛道衡、王胄原为北齐旧臣，杨素出身北周政权并在隋初显贵，均属隋文坛承接北齐、北周旧臣网络的代表，所以A、B、C。虞世基为隋代重要文臣，不属题干所列北齐、北周旧臣这一组。","anaAI":true},{"t":"m","n":35,"stem":"李白诗歌的艺术成就是（）","score":2,"opts":["强烈的主观色彩","想象的变幻莫测","意象壮美","意象优美","语言清新明快"],"ans":"ABCDE","ana":"李白诗歌同时具备强烈主体情感、跳跃变幻的想象、雄奇壮美和清丽优美的意象，以及清新明快的语言。大鹏、黄河、蜀道展现壮美，月光、清溪又可明净柔美；两类意象都服务于诗人自由奔放的精神表达，故五项均可选。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"w","n":36,"stem":"《左传》","score":3,"ans":"（1）全称《春秋左氏传》，是配合《春秋》的编年史。（2）《史记》和《汉书·艺文志》称其作者为左丘明。（3）记事详赡生动，是先秦时期最具文学色彩的历史散文。","ana":"《左传》全称《春秋左氏传》，以《春秋》年代为纲，详叙诸侯国政治、战争和外交，是编年体历史散文。传统文献将作者归于左丘明，但作者问题有讨论；其叙事善于剪裁、铺设因果、刻画人物对话，使史书具有鲜明文学性。","anaAI":true},{"t":"w","n":37,"stem":"骈文","score":3,"ans":"（1）广义散文的一部分，具有均衡对称之美。（2）具有对偶、用典、声律、辞藻四方面特征。","ana":"骈文以两两相对的句式组织语言，讲求对偶、用典、声律和辞藻，形成整饬、均衡的形式美。它在六朝尤盛，长处是音节和辞采经营，若过度追求形式也可能妨碍直陈事理；不能把“骈”简单等同于所有有修辞的散文。","anaAI":true},{"t":"w","n":38,"stem":"南唐词","score":3,"ans":"（1）注重抒情，感情深厚，风格疏淡雅丽，语言清雅。（2）代表作家是南唐词人冯延巳、李璟、李煜。","ana":"南唐词以冯延巳、李璟、李煜为代表，在五代词中加强抒情深度。冯延巳词多写春愁和人生怅惘，李璟、李煜则把故国之思和身世巨变写入词中；语言清雅疏丽，情感由宴乐歌辞向个人心灵表达推进。","anaAI":true},{"t":"w","n":39,"stem":"沉郁顿挫","score":3,"ans":"（1）杜甫诗歌的主要风格。（2）悲慨是其感情基调，写深沉的忧思，感情回环往复，起伏顿挫，潜气内转。","ana":"“沉郁顿挫”是杜甫诗歌的重要风格：沉郁指忧国忧民、身世之感深厚凝重；顿挫指情绪和语势有回旋、停顿、转折，不一泻而尽。《登高》《秋兴八首》把个人衰病与时代动乱交织，最能体现这种潜气内转、悲慨深沉的表达。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述晁错散文的创作特点。","score":5,"ans":"（1）切实中肯，质实朴厚，擅长分析。（2）排比铺叙，具有战国策士的纵横风气。","ana":"晁错散文面对汉初削藩、边防和民生等具体政务，先分析利害，再提出可执行的对策，语言切实中肯、质实朴厚；《论贵粟疏》从农民生计和国家储备论证重农必要。另一方面，他常以排比铺叙累积论据和气势，保留战国策士说理风格。","anaAI":true},{"t":"w","n":41,"stem":"简述《史记》“互见法”的文学表现功能。","score":5,"ans":"（1）使人物的主要经历完整，主要性格特征鲜明突出。（2）展现人物丰富的人生经历和多侧面的性格，使事件和人物均有血有肉，完整活泼。","ana":"《史记》“互见法”把人物材料分置于本传及相关篇章：本传集中呈现主线，其他传记补写侧面或不同评价。这样既让一篇传记保持叙事重点，又能在多篇互证中展现人物经历的复杂性；如项羽事迹与高祖本纪相互映照，历史事件和性格都更立体。","anaAI":true},{"t":"w","n":42,"stem":"简述太康诗风的成因。","score":5,"ans":"（1）太康年间，时局稳定，经济发展，诗人们的生活环境较为安稳舒适。（2）司马氏提倡名教维护新政权，并拉拢名士群体以增加道义舆论方面的支持，遂有“士无特操”之局面。（3）此时士人心态普遍为求实逐利、求名自适，清谈重视声调之美和喻示之妙等审美价值。","ana":"太康年间西晋统一后物质生活相对安定，贵族文士交游唱和，诗歌从建安的现实忧患转向个人生活与辞采经营；政权以名教整合士族，名士处世亦多求自保，形成“士无特操”的风气。与此同时玄学清谈重视言辞、声调与机辩，促使诗人讲究对偶、辞藻和形式技巧，构成太康诗风繁缛化的社会与审美背景。","anaAI":true},{"t":"w","n":43,"stem":"简述李白歌行体诗歌的艺术特色。","score":5,"ans":"（1）打破诗歌创作的固有格式，笔法多变，任意抒写。（2）激情喷薄，气势奔放，慷慨激昂，豪迈飘逸。","ana":"李白歌行沿用乐府旧题和长篇歌行形式，却不受固定章法束缚，常在叙事、议论、神游与抒情间突然转换。《将进酒》从宴饮转入人生短促，再以纵酒反抗失意；《梦游天姥吟留别》由现实告别跳入梦境仙山，最后回到“不事权贵”的自我宣言，体现激情喷薄、气势奔放和豪迈飘逸。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"结合具体作品，试述《诗经》中赋、比、兴的表现手法。","score":14,"ans":"（1）赋，可以直接叙事，也可以直接刻画描写，还可以直言其志或直抒胸臆。（2）比，一般说是比喻。（3）兴，就是起兴或发端，一般处在一首诗或一章诗的开头位置。","ana":"《诗经》的赋是直接陈述和铺写，如《七月》按时序叙述农事、衣食；比是以彼物喻此物，如《硕人》用“手如柔荑”等写美人；兴则先举眼前景物以引出情思，如《关雎》先写雎鸠和鸣，再引出淑女君子之求。三法可单用也可交织，《桃夭》桃花既起兴又比拟新娘青春，显示比兴并非绝对分离。","anaAI":true},{"t":"w","n":45,"stem":"试论韩愈各体古文的创作成就。","score":14,"ans":"（1）杂文较为自由灵活，或长或短，或庄或谐，文随事异，各当其用。杂文中有一些嘲讽现实、议论犀利的短文，形式活泼，不拘一格，有很高的文学价值。（2）赠序文借题发挥，委婉多姿，常熔叙事、描写、议论、抒情于一炉，文笔富于变化。（3）祭文寓情于事，抒情性很强。（4）碑志、传记状物叙事成就杰出，碑志有的刻画人物，重视细节描写；传记有的讽刺现实。","ana":"韩愈杂文短小灵活，可嬉笑怒骂也可严肃议论，《杂说》《进学解》借寓言或问答讽刺现实；赠序如《送孟东野序》常借送别题目讨论“不平则鸣”，融叙事、议论和抒情。祭文如《祭十二郎文》把家常细节与骤失亲人的悲痛相接，开创强烈个性化抒情；碑志、传记则以细节写人并能寄托讽刺，《张中丞传后叙》兼具记事、辨诬和批评。不同文体均体现其“文从字顺”、务去陈言的古文革新。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2404","subject":"gws","session":"2404","label":"2024年4月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"最早提出“孔子删诗”说法的是（ ）。","opts":["孟子","刘向","司马迁","班固"],"ans":"C","score":1,"ana":"最早把孔子与删定《诗经》联系起来的现存记载见司马迁《史记·孔子世家》：孔子“删诗”而取三百五篇。孟子谈《诗》多论诵诗与解诗，刘向、班固也有经学著述，但本题传统答案据《史记》取司马迁。","anaAI":true},{"t":"s","n":2,"stem":"下列作品不属于农事诗的是（ ）。","opts":["《七月》","《芣苢》","《十亩之间》","《黍离》"],"ans":"D","score":1,"ana":"《七月》按月份写农事、衣食和劳作，《芣苢》写采车前草，《十亩之间》写采桑，均与劳动生产相关。《黍离》以黍稷之苗引出故国之悲，属悼念宗周覆亡的诗，不是农事诗。","anaAI":true},{"t":"s","n":3,"stem":"《诗经·唐风·葛生》是一首（ ）。","opts":["爱情诗","悼亡诗","战争诗","农事诗"],"ans":"B","score":1,"ana":"《葛生》写女子悼念死去的丈夫，反复追想同穴、同棺的誓愿，情感核心是亡夫后的哀痛，属于悼亡诗。它虽有爱情记忆，却不是写恋爱过程的爱情诗。","anaAI":true},{"t":"s","n":4,"stem":"我国现存第一部国别史是（ ）。","opts":["《春秋》","《左传》","《国语》","《战国策》"],"ans":"C","score":1,"ana":"《国语》以周及诸侯国分篇记载历史，通常被视为我国现存最早的国别史。《春秋》是鲁国编年史，《左传》是编年体传注，《战国策》主要记战国策士活动，体例不同。","anaAI":true},{"t":"s","n":5,"stem":"“楚”一名最早出现在（ ）。","opts":["春秋","战国","西汉","东汉"],"ans":"[答案待核：“楚”名称最早出现的时代口径不清；原录答案：A 抗争，故A、C、E较符合。现存答案BCD把清逸玄远、冲淡平和列为主调，与其诗的主要特点不合，按现存答案，待核。","anaAI":true},{"t":"m","n":34,"stem":"李商隐政治诗的思想内容有","opts":["关注民生","抨击宦官","感伤历史","批评朝政","表现党争"],"ans":"ABCDE","score":2,"ana":"李商隐政治诗涉及现实民生、宦官专权、历史兴亡、朝政得失及晚唐党争，常借咏史和典故曲折寄托讽谏。五项都能在其诗中找到对应主题。","anaAI":true},{"t":"m","n":35,"stem":"隋代文坛上来自北齐、北周的旧臣有","opts":["卢思道","杨素","薛道衡","虞世基","王胄"],"ans":"[答案待核：解析判断与原录多选答案不一致；原录答案：ACDE]","score":2,"ana":"卢思道、薛道衡、王胄是北齐旧臣，杨素属北周旧臣，隋统一后进入新政权文坛。虞世基主要是南朝陈旧臣；现存答案ACDE把虞世基列入却漏掉杨素，按现存答案，待核，较合适组合应为A、B、C、E。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《春秋》","ans":"（1）《春秋》是鲁国的编年史，经过孔子的修订。（2）简括地记录了鲁国及周王朝、其他诸侯国的历史事件。","score":3,"ana":"《春秋》以鲁国国君纪年编排史事，记载鲁国并旁及周王室和诸侯活动，是编年体史书。传统说法认为孔子对鲁史加以笔削，但《春秋》的编纂性质与具体修订过程仍有文献讨论；其简约记事后来形成“春秋笔法”的解释传统。","anaAI":true},{"t":"term","n":37,"stem":"骚体赋","ans":"（1）骚体赋是汉代辞赋的一种类型。（2）以抒情述志为主，体式基本与先秦楚辞相同。","score":3,"ana":"骚体赋继承屈原《离骚》等楚辞形式，常用“兮”字句和较自由的句式，以抒情述志为主。汉代贾谊《吊屈原赋》《鵩鸟赋》是代表，和以铺陈宫苑、物产为主的散体大赋不同。","anaAI":true},{"t":"term","n":38,"stem":"《搜神记》","ans":"（1）《搜神记》主要辑录神仙鬼怪的故事。（2）是魏晋南北朝志怪小说的代表作品，成就最高。","score":3,"ana":"干宝《搜神记》汇录神仙鬼怪、精灵报应和民间传说，是魏晋志怪小说的重要代表，保存大量早期神话与民间信仰材料。其文学价值不仅在奇异情节，也在后世小说、戏曲反复取材；“成就最高”属于评价性概括，宜理解为志怪代表作之一。","anaAI":true},{"t":"term","n":39,"stem":"“沉郁顿挫”","ans":"（1）“沉郁顿挫”是杜甫诗歌的主要风格特征。（2）沉郁指其感情的悲慨壮大深厚，顿挫指感情表达波浪起伏、反复低回。","score":3,"ana":"“沉郁”指杜甫诗中忧国忧民、身世之感深厚凝重；“顿挫”指情绪和语势回旋起伏、层层转折，而非平直宣泄。《登高》《秋兴八首》将衰病、漂泊与时代动乱交织，体现悲慨深而表达有节制的风格。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述《诗经》赋、比、兴的含义。","ans":"（1）赋是《诗经》中运用最多的表现手法，可以直接叙事，也可以直接刻画描写，还可以直言其志或直抒胸臆。（2）比一般说就是比喻。（3）兴大体来说就是起兴或发端，一般处在一首诗或一章诗的开头位置。就其与诗歌情思的关系来看，基本有相关和不相关两种情形。","score":5,"ana":"赋是铺陈直叙，如《七月》按月份写农事和衣食；比是以一物比另一物，如《硕人》以柔荑、凝脂比喻美人；兴是先写眼前事物引出后文情思，如《关雎》先写雎鸠和鸣再引出男女相求。兴与后文有时相关、有时只作发端；一篇中赋比兴也可交互使用。","anaAI":true},{"t":"w","n":41,"stem":"简述《左传》的写人艺术。","ans":"（1）《左传》刻画了许多性格鲜明的人物形象，并注意刻画人物性格的多个侧面，甚至能够写出人物性格的发展。（2）《左传》写人的基本艺术规则，一是以言语、行为表现人物性格特征，二是把人物置入矛盾冲突的环境中塑造。","score":5,"ana":"《左传》常通过人物在冲突中的选择显性格，如《郑伯克段于鄢》用郑庄公与共叔段的行动、对话表现其权力关系；又以言语和行动相互印证，避免单靠作者评断。人物还会在事件发展中显露多面性，叙事中的外交辞令、战场决断和家庭矛盾都成为塑造性格的场景。","anaAI":true},{"t":"w","n":42,"stem":"简述左思诗歌思想内容上的特点。","ans":"（1）左思的诗歌有一种建功立业、功成身退的阔大胸怀。（2）左思的诗歌充满着一种悲愤不平之气。","score":5,"ana":"左思诗歌一面写建功立业的抱负和功成身退的理想，《咏史》中的“功成不受爵，长揖归田庐”即体现不恋权位；另一面因寒门出身和现实门阀压抑，作品积蓄愤懑不平。他借古人遭际映照现实不公，使咏史不止复述史事，而成为个人政治情绪的寄托。","anaAI":true},{"t":"w","n":43,"stem":"简述唐传奇的艺术成就。","ans":"（1）唐传奇标志着中国古代小说艺术的渐趋成熟。（2）唐传奇塑造了众多栩栩如生的人物形象。（3）唐传奇情节波澜起伏，语言凝练传神。","score":5,"ana":"唐传奇的成熟在于作者有意识地经营虚构，不再只是零散记录怪异；情节有因果、悬念和转折，人物能通过言行显出个性，如《李娃传》《霍小玉传》。语言既凝练传神又兼具华美文采，叙事中可穿插诗歌和议论，标志中国文言小说由志怪笔记向成熟故事体发展。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述汉乐府民歌的文学价值。","ans":"（1）题材的承变：汉乐府民歌继续咏唱与百姓生活息息相关、感受深刻的生活内容，并增加倾诉生活艰难和漂泊流荡、表达人生哲理等题材。（2）艺术表现手法的演变：叙事成分增多，抒情真挚浓郁，句式以杂言和五言为主，语言质朴浅白、富于表现力。","score":14,"ana":"汉乐府民歌把现实生活带入诗歌：既有《陌上桑》讽刺权贵，也有《战城南》写战争死亡、《东门行》写贫困逼迫、《上邪》写爱情誓言和《长歌行》感叹人生短促。与《诗经》相比，叙事篇幅和人物对话增多，抒情仍真切浓烈；杂言、五言并用，语言朴素而富于动作细节，扩大了诗歌反映社会生活的能力，并为建安文人乐府提供形式资源。","anaAI":true},{"t":"w","n":45,"stem":"论述高适与岑参边塞诗的异同。","ans":"相同点：（1）二人诗歌都根据亲临边塞的实际生活体验写成。（2）反映现实的深度超过同时的许多诗人。（3）诗歌蕴涵慷慨悲壮之美。不同点：（1）高适以质实的古体见长，岑参擅长七言歌行和七言绝句。（2）高适诗慷慨昂扬，岑参诗奇伟壮丽。","score":14,"ana":"高适与岑参都亲历边塞，写军旅现实和征人感受，具有慷慨悲壮的共同底色。高适多用质朴有力的古体，关注边防困境和士卒处境，如《燕歌行》在战事叙写中揭示将帅与士卒不均；岑参擅长七言歌行，以奇特想象和浓艳色彩描写塞外风物，如《白雪歌送武判官归京》把风雪、军帐和送别写得奇丽壮阔。两人同写边塞，气质分别偏沉雄质实与奇伟瑰丽。","anaAI":true}]}],"qaNotes":["答案核对修正：Q4与gws-2304同题且选项文本完全一致；《国语》是现存第一部国别史，答案由A改为C。"]},{"paper":"gws-2410","subject":"gws","session":"2410","label":"2024年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"“后羿射日”属于","opts":["创世神话","自然灾害神话","战争神话","发明创造神话"],"ans":"B","score":1,"ana":"后羿射日解释十个太阳并出、酷热成灾后英雄射落九日的灾异，属于自然灾害神话。创世神话讲天地或人类起源，战争神话写部族冲突，发明创造神话则解释技术起源。","anaAI":true},{"t":"s","n":2,"stem":"以下不属于“《春秋》三传”的是","opts":["《春秋左氏传》","《春秋公羊传》","《春秋穀梁传》","《春秋外传》"],"ans":"D","score":1,"ana":"《春秋》三传是《左传》（《春秋左氏传》）、《公羊传》和《穀梁传》，分别从叙事、义例和经义等角度解释《春秋》。《春秋外传》并非三传之一，常指《国语》的别称或相关称呼。","anaAI":true},{"t":"s", 《蜀相》也是名篇，但该评价专指《登高》。","anaAI":true},{"t":"s","n":23,"stem":"被公认为“大历十才子”之冠的是","opts":["钱起","刘长卿","司空曙","卢纶"],"ans":"A","score":1,"ana":"钱起被公认为“大历十才子”之冠，擅长五律，诗风清雅而工整，代表作《省试湘灵鼓瑟》以声律和意境见长。刘长卿、司空曙、卢纶亦为大历诗人，但传统排序常推钱起居首。","anaAI":true},{"t":"s","n":24,"stem":"韩愈诗歌的主要特点是","opts":["造语奇丽","以文为诗","托意空灵","清新自然"],"ans":"B","score":1,"ana":"韩愈常把散文的句法、议论和气势带入诗歌，形成“以文为诗”的特点，诗体因而能承载叙事、议论和奇崛想象。造语奇丽只是表现之一，托意空灵、清新自然不足以概括其主要创新。","anaAI":true},{"t":"s","n":25,"stem":"最能体现白居易诗歌理论主张的是","opts":["闲适诗","感伤诗","杂律诗","讽谕诗"],"ans":"D","score":1,"ana":"白居易的讽谕诗最直接体现其“文章合为时而著，歌诗合为事而作”的理论主张，关注民生疾苦、政治弊端，要求诗歌有现实作用。《秦中吟》《新乐府》是代表。","anaAI":true},{"t":"s","n":26,"stem":"晚唐时期最有成就的诗人是","opts":["杜牧","李商隐","贾岛","皮日休"],"ans":"B","score":1,"ana":"李商隐是晚唐最有成就的诗人之一，七律和无题诗尤为突出，善用典故、象征与精密意象寄托政治和身世情感。杜牧同样重要，但题目通行评价所指为李商隐。","anaAI":true},{"t":"s","n":27,"stem":"其创作被称为“武功体”的诗人是","opts":["贾岛","姚合","孟郊","李贺"],"ans":"B","score":1,"ana":"姚合长期任职武功，诗歌多写县令日常、山居和清寒生活，后人以“武功体”称其诗风。贾岛以苦吟著称，孟郊、李贺各有不同风格，不是此称谓所指。","anaAI":true},{"t":"s","n":28,"stem":"开启曲子词由“伶工之词”到“士大夫之词”转变的是","opts":["敦煌曲子词","早期文人词","西蜀词","南唐词"],"ans":"D","score":1,"ana":"南唐词人李璟、李煜等把词从宫廷歌伎演唱的曲子逐渐转为士大夫抒写身世、故国和个人情感的文体，开启“伶工之词”向“士大夫之词”的转变。敦煌曲子词和西蜀词在此之前发展了词的民间或宴乐形态。","anaAI":true},{"t":"s","n":29,"stem":"唐人传奇中，鄙视荣华富贵、功名利禄的作品是","opts":["《枕中记》","《谢小娥传》","《聂隐娘》","《李娃传》"],"ans":"A","score":1,"ana":"沈既济《枕中记》写卢生在邯郸客店入梦，梦中经历显贵功业，醒来黄粱未熟，借梦境否定对荣华功名的执迷。其主旨是人生富贵如梦，并非爱情、侠义或单纯灵异。","anaAI":true},{"t":"s","n":30,"stem":"明确提出“唯陈言之务去”古文创作主张的是","opts":["陈子昂","韩愈","柳宗元","李华"],"ans":"B","score":1,"ana":"韩愈在《答李翊书》中提出“惟陈言之务去”，要求文章摆脱陈旧套语、形成自家表达；这是古文运动反对骈文因袭的重要主张。陈子昂倡复古，柳宗元参与古文运动，但这句明确出自韩愈。","anaAI":true}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"下列关于《汉书》的描述正确的有","opts":["我国第一部断代史","叙事翔实平妥","笔法谨严","情感深浓","人物刻画细腻传神"],"ans":"ABCE","score":2,"ana":"《汉书》是我国第一部纪传体断代史，叙事翔实平妥，笔法谨严；人物传记亦能通过言行和细节写出神貌性格，故A、B、C、E成立。它整体情感较《史记》内敛，D“情感深浓”不是通常概括。","anaAI":true},{"t":"m","n":32,"stem":"《古诗十九首》写出了“人同有之情”，其基本的情思内涵包括","opts":["对战争的厌倦","离情别绪","人生的无常","对爱情婚姻的向往","人生的失意"],"ans":"BCE","score":2,"ana":"《古诗十九首》写普遍的人情经验，常见离情别绪、人生短促无常和游宦失意；如“行行重行行”写离别相思，“生年不满百”感叹生命无常，“西北有高楼”寄寓知音难遇。题目选项B、C、E符合，战争厌倦和爱情婚姻向往并非这组诗的核心概括。","anaAI":true},{"t":"m","n":33,"stem":"以下属于“建安七子”的有","opts":["王粲","阮籍","刘桢","陈琳","徐干"],"ans":"ACDE","score":2,"ana":"王粲、刘桢、陈琳、徐干均列“建安七子”之中；阮籍属于正始时期，晚于建安。建安七子其余成员为孔融、应玚、阮瑀。","anaAI":true},{"t":"m","n":34,"stem":"下列作家中初步奠定了古文运动的思想基础并进行了古文创作实践的有","opts":["陈子昂","萧颖士","白居易","李华","孟郊"],"ans":"BD","score":2,"ana":"萧颖士和李华在盛唐提倡复兴先秦两汉散文，批评骈俪文风，并有古文创作实践，初步奠定中唐古文运动的思想基础。陈子昂主要倡导诗歌复古，白居易重在新乐府，孟郊不是古文运动理论代表。","anaAI":true},{"t":"m","n":35,"stem":"被推尊为“百代词曲之祖”的文人词是","opts":["《忆秦娥》（箫声咽）","《菩萨蛮》（平林漠漠烟如织）","《忆江南》（江南好）","《浪淘沙》（帘外雨潺漏）","《浣溪沙》（菡萏香销翠叶残）"],"ans":"[答案待核：李白词作归属有争议，原录答案需核源；原录答案：AB]","score":2,"ana":"《忆秦娥》（“箫声咽”）和《菩萨蛮》（“平林漠漠烟如织”）传统上均题为李白作，后世词论将二词推尊为“百代词曲之祖”，强调其词调、意境和文人化表达的先声。李白作词归属及具体年代有争论，按现存答案，待核；其余作品属五代词人。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"w","n":36,"stem":"《战国策》","ans":"（1）《战国策》记事年代起于战国初年，止于秦灭六国，杂记各国之事。（2）敷载当时谋臣策士纵横捭阖的斗争及其策谋或说辞，以战国时期纵横家的事迹、言论为多。","score":3,"ana":"《战国策》记录周贞定王至秦灭六国期间各国政治活动，材料由刘向校订编次，按国别编排。书中重心是纵横策士的谋略、游说辞令和外交斗争，既是研究战国史的重要文献，也以铺张辩丽、善揣摩听者心理的语言见长。","anaAI":true},{"t":"w","n":37,"stem":"汉乐府","ans":"（1）“乐府”本是掌管音乐的行政机关，后来也成为诗体的名称。汉乐府指的是汉代乐府机关所搜集整理的诗歌作品。（2）汉乐府的特点是情感真挚，风格平实。","score":3,"ana":"“乐府”原是汉代掌管音乐采集、制作和演唱的机构，后来也指由机构采集或供歌唱的诗歌，并逐渐成为诗体名称。汉乐府民歌来自社会生活，常以质朴语言写战争、劳动、贫困、爱情和人生感慨，叙事性和现实感突出。","anaAI":true},{"t":"w","n":38,"stem":"“初唐四杰”","ans":"（1）“初唐四杰”指的是王勃、杨炯、卢照邻、骆宾王。（2）他们的创作拓宽了诗歌题材，形式多有创新。","score":3,"ana":"“初唐四杰”指王勃、杨炯、卢照邻、骆宾王。他们扩大诗歌题材，把边塞、市井、送别和个人遭际纳入创作，并推动五言律诗、歌行等形式发展；其意义在于突破宫廷诗局限，为盛唐诗歌开路。","anaAI":true},{"t":"w","n":39,"stem":"《花间集》","ans":"（1）《花间集》是五代后蜀赵崇祚编辑的供歌伎伶工演唱的曲子词选本。（2）以温庭筠为代表，风格婉丽绮靡。","score":3,"ana":"《花间集》由后蜀赵崇祚编于五代，是现存最早的文人词总集，收录温庭筠、韦庄等词作，供宴乐演唱。温庭筠代表其绮丽精工的一面，词多写闺情、相思和宴乐，婉丽绮靡但作者风格并非完全一致。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简析《诗经》抒情与写实相统一的特点。","ans":"（1）抒情诗所抒发的情感是真实的。（2）抒发情感的方式是坦率直白的。（3）叙事性的诗作中饱含着作者的真挚情感。","score":5,"ana":"《诗经》情感常来自真实生活经验：恋爱、劳作、征役、离别等都以具体情境呈现，抒情并非抽象议论。《静女》直写男女相悦，《采薇》在征役叙事中融入归乡之痛；许多叙事诗通过动作、对话和景物让情绪自然生出，体现写实和抒情相互支撑。","anaAI":true},{"t":"w","n":41,"stem":"简述《史记》的编撰体例。","ans":"（1）《史记》创造了“纪传体通史”的新体例。（2）开创了以本纪、表、书、世家、列传五种体例写通史的范例。","score":5,"ana":"《史记》以本纪记帝王、表列年世、书记典章制度、世家写诸侯及重要家族、列传写人物，五体互相补充，构成纪传体通史。它上起黄帝、下至汉武帝，既按人物组织历史，也保留时间线索和制度专题，对后世正史体例影响深远。","anaAI":true},{"t":"w","n":42,"stem":"简述《世说新语》的艺术特点。","ans":"（1）语言精炼，简约含蓄，隽永传神。（2）往往用一言一行即表现人物的肖像和精神面貌。","score":5,"ana":"《世说新语》以魏晋名士言谈和轶事为短章，常用一句答语、一个动作或微小细节呈现人物风度，如“王戎识李”等故事，语言简约而有余味。作品不铺陈完整生平，而以剪裁和含蓄留白让读者从片段中见出性格、玄心和社会风气。","anaAI":true},{"t":"w","n":43,"stem":"简述王维山水田园诗歌的艺术表现特征。","ans":"（1）“诗中有画，画中有诗”。（2）诗境静逸明秀，兴象玲珑而难以句诠。","score":5,"ana":"王维山水田园诗常把色彩、光线、声音和空间安排成可见画面，如《山居秋暝》以空山、明月、松泉和浣女渔舟构成层次；又通过空寂、静观和禅意使画面含有难言的情趣，所谓“诗中有画，画中有诗”。其诗境清静明秀、意象精微，不只是客观写景。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述《庄子》的文学成就。","ans":"（1）异彩纷呈的故事。（2）奇幻谲诡的想象。（3）空灵飘忽的文风。（4）谐趣和讥刺横生。（5）精湛传神的文笔。","score":14,"ana":"《庄子》常以寓言组织论辩，《逍遥游》的鲲鹏、《秋水》的河伯等故事把抽象哲理变成形象冲突；想象奇幻，能在人、物、神怪间转换，打破常规尺度。文章忽庄忽谐，以夸张、反问、讥刺动摇世俗成见；语言则汪洋恣肆、比喻连缀、节奏多变，形成空灵而有锋芒的文风。","anaAI":true},{"t":"w","n":45,"stem":"论述陶渊明的诗歌成就。","ans":"（1）开创了文人诗歌创作的新领域——田园诗。（2）创造了情味极浓的冲淡之美，表现为宁静平淡的境界。（3）陶渊明的诗歌创作还有丰富的多样性，如《咏荆轲》写得慷慨激昂，表现了诗人豪迈诗风的一面。","score":14,"ana":"陶渊明开拓文人田园诗，把归隐、躬耕和乡村日常写成诗歌中心，如《归园田居》写“守拙归园田”，《饮酒》写采菊见南山，形成冲淡自然、情味深厚的境界。其语言平易而意象有余味，并非没有思想张力；《咏荆轲》慷慨写侠士赴难，《读山海经》也有“猛志固常在”的刚健，显示田园冲淡之外的多样面貌。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2504","subject":"gws","session":"2504","label":"2025年4月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《弹歌》“断竹，续竹，飞土，逐宍”所描述的场面是（ ）。","opts":["狩猎活动","手工制作","秋收活动","修建茅屋"],"ans":"A","score":1,"ana":"“断竹、续竹、飞土、逐宍”写削竹作弹弓、发射土丸追逐猎物，记录的是狩猎过程，故选狩猎活动。它不是描写弓具制作本身、秋收或建屋。","anaAI":true},{"t":"s","n":2,"stem":"《诗经》中揭露繁重徭役给人民带来苦难的作品是（ ）。","opts":["《鸡鸣》","《巷伯》","《东山》","《生民》"],"ans":"C","score":1,"ana":"《东山》写周公东征后士卒归乡，既有战争离别，也具体写长期徭役造成的劳苦与家庭离散。《鸡鸣》写夫妻 n":32,"stem":"关于枚乘《七发》的描述正确的有","opts":["开大赋的典范之作","铺叙描摹，夸饰渲染","在遣词造句方面质朴无华","采用主客问答形式结构全篇","内容设置听琴、田猎、观涛等七个方面"],"ans":"ABDE","score":2,"ana":"A《七发》以主客问答铺排楚太子病态及吴客劝说，传统上视为汉大赋先声；B它层层铺写音乐、饮食、车马、宫苑、田猎、观涛等场景，并用夸饰扩大感官效果，正确。C“质朴无华”不合其铺陈、藻饰繁富的文风。D全篇以吴客与楚太子的问答串联七段，结构上确为主客问答。E七段由听音乐、饮食、乘车、游览、田猎、观涛等逐步推进，以观涛达到高潮，符合篇章安排。","anaAI":true},{"t":"m","n":33,"stem":"关于《古诗十九首》的说法正确的有","opts":["最早见于《文选》","代表汉人五言诗最高成就","“感于哀乐，缘事而发”","“直而不野”“婉转附物”","《西北有高楼》表达知音难遇的感慨"],"ans":"ABDE","score":2,"ana":"A《古诗十九首》以总题收入萧统《文选》，这是其现存早期结集形态；B它集中体现东汉文人五言诗的成熟，常被视为汉人五言诗最高成就。C“感于哀乐，缘事而发”是《汉书·艺文志》概括汉乐府民歌的说法，不是《古诗十九首》的评语。D“直而不野”“婉转附物”等评语突出其质直而有节制、借物抒情而含蓄的艺术特点。E《西北有高楼》借高楼上弦歌者无人理解，寄寓知音难遇之感。故依现存答案选ABDE。","anaAI":true},{"t":"m","n":34,"stem":"下列诗句属于李白的有","opts":["“玉阶生白露，夜久侵罗袜”","“荷风送香气，竹露滴清响”","“大道如青天，我独不得出”","“我歌月徘徊，我舞影零乱”","“古来圣贤皆寂寞，惟有饮者留其名”"],"ans":"ACDE","score":2,"ana":"A“玉阶生白露，夜久侵罗袜”见李白《玉阶怨》；B“荷风送香气，竹露滴清响”见孟浩然《夏日南亭怀辛大》，不选。C“大道如青天，我独不得出”出自李白《行路难》其二；D“我歌月徘徊，我舞影零乱”出自《月下独酌》；E“古来圣贤皆寂寞，惟有饮者留其名”出自《将进酒》。因此选ACDE。","anaAI":true},{"t":"m","n":35,"stem":"下列关于大历“十才子”诗歌特色的表述正确的有","opts":["意境浑融一气","过于讲究描写技巧而显雕琢","偏爱使用描述性意象","境界开阔高远","词语往往带有凄清萧瑟乃至暗淡的色彩"],"ans":"ABCE","score":2,"ana":"A大历十才子善于把羁旅、送别、山水等片段经营成情景相接的篇章，局部意境常浑融；B他们重视炼字、对仗和景物描写，部分作品因此显出雕琢痕迹；C诗中常用寒灯、暮雨、孤舟等可见可感的描述性意象；D其诗多写日常交游、羁旅愁思，尺度偏小清冷，不以境界开阔高远见长；E凄清、萧瑟、暗淡的词语和色调确是其常见面貌。故按选项选ABCE。","anaAI":true}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《天问》","ans":"《天问》是屈原作品中最为奇特的诗歌，针对自然现象、神话传说和远古历史、社会现实等一口气提出170多个问题，体现了诗人的见识广博、思想深刻以及勇于怀疑和批判的精神。","score":3,"ana":"《天问》是屈原以连续发问贯穿全篇的长诗，从天体、神话和历史问到政治现实，传统统计有一百七十余问。它不提供系统答案，而通过质疑神话秩序、兴亡因果和现实政治显示批判精神，是楚辞中结构最奇特的作品之一。","anaAI":true},{"t":"term","n":37,"stem":"李斯","ans":"（1）李斯的创作包括奏议和刻石文。（2）《谏逐客书》铺陈排比，有纵横之气；刻石文铺叙颂夸，气度宏伟，韵律谐和。","score":3,"ana":"李斯是秦代政论家，其文章包括奏议与歌颂秦统一的刻石文。《谏逐客书》用秦国史例和排比论证客卿之利，保留纵横游说气势；刻石文则以韵语铺陈功业，气度宏阔，二者分别代表实用政论和帝国颂功文体。","anaAI":true},{"t":"term","n":38,"stem":"《洛阳伽蓝记》","ans":"杨衒之的《洛阳伽蓝记》属历史笔记，也是写景状物的散文。书中主要是对佛寺的描写，有的篇章写得精致；该书是历史散文，具有极高的史料价值。","score":3,"ana":"《洛阳伽蓝记》由杨衒之记北魏洛阳佛寺的兴废，兼写街市、人物、风俗和政治变迁。寺院建筑描写具体，叙述中常穿插掌故与见闻，因此既是有文学价值的历史笔记，也是研究北魏都城和佛教的重要史料。","anaAI":true},{"t":"term","n":39,"stem":"“小李杜”","ans":"杜牧和李商隐同为晚唐七绝成就最高的诗人，世称“小李杜”。","score":3,"ana":"“小李杜”指晚唐杜牧、李商隐。杜牧七绝明朗俊爽、善咏史怀古；李商隐以七律、无题诗的深婉密丽和用典寄托见长。并称强调两人晚唐诗坛地位，不表示其风格相同或只在七绝上成就最高。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述我国神话对后世文学发展的影响。","ans":"（1）神话的艺术规则为后世文学的发展提示了方向。一方面，神话所开创的为人生的主题，事实上成为我国数千年文学发展的主流和传统；另一方面，神话富于情感、形象和想象的特征，引导了后世文学审美理想的发展走向。（2）丰富多彩的神话作品，成为后世文学创作取之不尽、用之不竭的题材源泉。从最早的文学总集《诗经》到近现代文学创作，从诗歌散文到戏曲小说，无不得到神话的滋养。","score":5,"ana":"神话把人类起源、洪水和英雄抗争转化为富于想象的故事，为后世提供母题和象征资源：女娲、鲧禹、精卫等不断进入诗赋、小说和戏曲。神话敢于突破现实尺度的想象、强烈情感和变形叙事，也影响浪漫主义表达；楚辞尤其继承神话意象，后世文学又借神话寄托理想与社会批评。","anaAI":true},{"t":"w","n":41,"stem":"简述《离骚》永恒的精神价值。","ans":"（1）《离骚》是屈原自叙生平的长篇抒情诗，他的情感和思想都熔铸在其中。（2）表现“美政”理想和深沉的爱国情感。（3）体现追求理想九死不悔的坚韧品格和嫉恶如仇的批判精神。","score":5,"ana":"《离骚》以屈原自叙为骨架，将楚国危局、遭谗被疏和个人求索相连。“美政”表现为举贤授能、修明法度的政治理想，背后是深沉爱国情感；香草美人比兴写洁身自守，九死不悔的誓言表现坚韧，而对党人妒贤、朝政昏乱的揭露则体现批判精神。","anaAI":true},{"t":"w","n":42,"stem":"简述张衡在赋史上的地位。","ans":"张衡是赋史上承前启后的作家。代表作《二京赋》规模、容量和篇幅都超过前人，铺陈胪列，细致描绘，成为汉代京都赋的极致；《归田赋》是东汉抒情小赋的开山之作。","score":5,"ana":"张衡承接汉大赋传统而又开拓新方向。《二京赋》以长安、洛阳为对象，写宫室、百戏、市场和社会风貌，规模宏大、资料繁富，达到京都赋铺陈的高峰；《归田赋》则短小抒情，以归隐愿望和田园景物取代大赋的全面铺陈，开启东汉抒情小赋的新路。","anaAI":true},{"t":"w","n":43,"stem":"简述张若虚《春江花月夜》的艺术成就。","ans":"（1）“孤篇横绝，竟为大家”“诗中的诗，顶峰上的顶峰”。（2）这是一首长篇歌行，采用乐府旧题但赋予全新内容，将画意、诗情与对宇宙奥秘和人生哲理的体察融为一体，创造出情景交融、玲珑透彻的诗境。","score":5,"ana":"《春江花月夜》沿用乐府旧题却写出江月夜景、游子思妇离情和宇宙人生之问。月色从春江景物贯穿到“江月何年初照人”的哲思，继而落回个人相思，形成景、情、理的层递；长篇歌行的流动结构和清丽语言使全诗境界浑融，故被誉为“孤篇横绝”。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述谢灵运山水诗的艺术特点。","ans":"（1）创造了一种山水诗的结构模式。（2）在局部景物描写中，通过细腻的观察与把握和具体画面，表现景观的情思韵味、情景交融。（3）对山水景物的声、光、色都有生动的描绘。（4）其山水诗发展尚未达到构造完整意境的阶段，处于有佳句而无佳篇的层次。","score":14,"ana":"谢灵运山水诗常按游踪组织：先交代出游、登临，再铺写沿途山水，最后转入玄理或身世感慨；精细观察使声、光、色可感，如《登池上楼》以“池塘生春草”写季节转换。山水因此成为独立审美对象，但写景与篇末议理有时仍分段并置，整体意境未必完全熔合，呈现从佳句走向完整山水篇章的过渡。","anaAI":true},{"t":"w","n":45,"stem":"结合具体作品，论述杜甫诗歌的诗史性质。","ans":"杜甫的诗歌形象真实地反映了安史之乱前后的时代动乱，是时代的一面镜子，故有“诗史”之誉。（1）杜诗具有史的认识价值，以时事入诗而含热泪深情，尖锐细密地观察与写实，直面社会现实，如“三吏”“三别”、《忆昔》。（2）杜诗提供了比历史事件更为广阔、具体、生动的生活画面，使人如临其境。（3）从诗中可以感受到当时社会的某些心理状态。","score":14,"ana":"杜甫“诗史”在于以亲历者的诗笔记录安史之乱前后的时代，同时写出史书未必呈现的百姓生活。《三吏》《三别》用官吏、老妇、征夫的对话和细节表现征役与离散；《忆昔》对比开元盛世和战后凋敝，保存时代变迁的认识价值。杜诗不仅记录事件，还传达当时人的恐惧、悲悯和忧国情绪，使历史有具体生活质感。","anaAI":true}]}],"qaNotes":[]},{"paper":"gws-2510","subject":"gws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》中最著名的农事诗是","score":1,"opts":["《七月》","《芣苢》","《大田》","《良耜》"],"ans":"A","ana":"《七月》详细描绘了农夫一年的农事活动与生活情景,是《诗经》中最具代表性的农事诗;B 项是采集诗,C、D 项虽涉农事但知名度与完整性不及《七月》。"},{"t":"s","n":2,"stem":"“知我者谓我心忧,”不知我者谓我何求出自《诗经》中的","score":1,"opts":["《伐檀》","《黍离》","《月出》","《关雎》"],"ans":"B","ana":"诗句表达了流浪者的忧愁,出自《王风·黍离》诗,D;A 项讽喻统治者不劳而获,C 项是爱情项为经典婚恋诗。"},{"t":"s","n":3,"stem":"先秦时期最具文学色彩的历史散文是","score":1,"opts":["《左传》","《战国策》","《尚书》","《国语》"],"ans":"A","ana":"《左传》叙事详备、情节生动,文学性极强;B 项以纵横家言论为主,C 项文字古奥晦涩,D 项文学色彩不及《左传》。"},{"t":"s","n":4,"stem":"《战国策》的整理编订者是","score":1,"opts":["司马迁","班固","蔡邕","刘向"],"ans":"D","ana":"西汉刘向整理编订战国时期各国史料,定名《战国策》;A 项著《史记》,B 项著《汉书》,C 项为东汉文学家、书法家。"},{"t":"s","n":5,"stem":"被闻一多誉为“文章家的极致”的著作是","score":1,"opts":["《孟子》","《荀子》","《庄子》","《韩非子》"],"ans":"C","ana":"《庄子》文辞奇幻、想象丰富,极具文学性,获闻一多此誉;A 项善雄辩,B 项文风严谨,D 项以峻刻著称。"},{"t":"s","n":6,"stem":"堪称“千古吟秋绝唱”的作品是宋玉的","score":1,"opts":["《风赋》","《神女赋》","《高唐赋》","《九辩》"],"ans":"D","ana":"《九辩》以悲秋为核心,情感深沉,是千古吟秋佳作;A 项写风的不同,B、C 项描绘神女与高唐景象。"},{"t":"s","n":7,"stem":"诸子百家中对李斯散文的文风影响最大的是","score":1,"opts":["儒家","道家","纵横家","墨家"],"ans":"C","ana":"李斯散文气势磅礴、善辩服人,受纵横家铺陈张扬、纵横捭阖的文风影响最深;A 项重仁政,B 项尚自然,D 项贵节俭,均与李斯文风不符。"},{"t":"s","n":8,"stem":"刻舟求剑的故事出自","score":1,"opts":["《吕氏春秋》","《战国策》","《墨子》","《吴越春秋》"],"ans":"A","ana":"刻舟求剑出自《吕氏春秋·察今》,讽刺墨守成规者;B 项多记纵横家事迹,C 项为墨家典籍,D 项记吴越历史。"},{"t":"s","n":9,"stem":"《潜夫论》的作者是","score":1,"opts":["桓谭","王符","王充","仲长统"],"ans":"B","ana":"东汉王符著《潜夫论》,抨击社会弊端;A 项著《新论》,C 项著《论衡》,D 项著《昌言》。"},{"t":"s","n":10,"stem":"以“究天人之际,通古今之变”为著述理想的史学家是","score":1,"opts":["班固","刘向","陈寿","司马迁"],"ans":"D","ana":"司马迁在《报任安书》中提出该理想,用于创作《史记》;A 项著《汉书》,B 项整理古籍,C 项著《三国志》。"},{"t":"s","n":11,"stem":"以下不属于司马相如赋作的是","score":1,"opts":["《子虚赋》","《长门赋》","《上林赋》","《长杨赋》"],"ans":"D","ana":"《长杨赋》是扬雄的作品;A、B、C 项均为司马相如代表作,其中《子虚赋》《上林赋》是汉大赋典范。"},{"t":"s","n":12,"stem":"以下汉乐府作品中不属于婚恋诗的是","score":1,"opts":["《江南》","《相逢行》","《有所思》","《上邪》"],"ans":"B","ana":"《相逢行》描写富贵人家的奢华生活,非婚恋主题;A 项是爱情诗,C、D 项表达坚贞的爱情誓言。"},{"t":"s","n":13,"stem":"以下诗句出自《古诗十九首·行行重行行》的是","score":1,"opts":["思君令人老,岁月忽已晚","四顾何茫茫,东风摇百草","生年不满百,常怀千岁忧","盈盈一水间,脉脉不得语"],"ans":"A","ana":"A 项出自《行行重行行》,表达思念之情;B 项出自《回车驾言迈》,C 项出自《生年不满百》,D 项出自《迢迢牵牛星》。"},{"t":"s","n":14,"stem":"作品被评“为汉末实录,真诗史也”的诗人是","score":1,"opts":["曹操","曹丕","王粲","曹植"],"ans":"A","ana":"曹操的诗歌反映了汉末战乱与社会现实,被称为汉末实录;B 项多写宴游与爱情,C项为建安七子之一,D 项诗歌以才情著称。"},{"t":"s","n":15,"stem":"下列不属于对曹植的评价是","score":1,"opts":["骨气奇高","才高八斗","辞采华茂","七子之冠冕"],"ans":"D","ana":"七子之冠冕是对王粲的评价;A、B、C 项均是对曹植的赞誉,体现其诗歌成就与才情。"},{"t":"s","n":16,"stem":"蔡琰的代表作是","score":1,"opts":["《幽愤诗》","《七哀诗》","《悲愤诗》","《孤儿行》"],"ans":"C","ana":"蔡琰的《悲愤诗》叙述自身战乱中被俘的遭遇,情感真挚;A 项是嵇康的作品,B 项为王粲代表作,D 项是汉乐府民歌。"},{"t":"s","n":17,"stem":"对正始士人心态及诗歌创作影响最大的思潮是","score":1,"opts":["玄学","儒学","佛学","法家思想"],"ans":"A","ana":"正始时期玄学盛行,士人崇尚老庄、清谈玄理,其心态与诗歌创作均受玄学深刻影响;B 项在汉代为主流,C 项此时尚未广泛传播,D 项影响有限。"},{"t":"s","n":18,"stem":"开后代左思《咏史》、陶渊明《饮酒》组诗先河的抒情组诗是","score":1,"opts":["曹操《步出夏门行》","嵇康《赠兄秀才入军》","《古诗十九首》","阮籍《咏怀》"],"ans":"D","ana":"阮籍《咏怀》组诗共82响了左思、陶渊明的组诗创首,借咏怀抒发感慨,开创了以组诗形式抒情言志的先河,影作。"},{"t":"s","n":19,"stem":"诗歌创作被《世说新语·文学》誉为“烂若舒锦”的诗人是","score":1,"opts":["陆机","潘岳","左思","张载"],"ans":"B","ana":"《世说新语·文学》评价潘岳诗歌辞采华美如展开的锦缎;A 项文风繁缛,C 项诗风刚健,D 项作品流传较少。"},{"t":"s","n":20,"stem":"苏轼“质而实绮，癯而实腴”评价的是","score":1,"opts":["陶渊明","王羲之","嵇康","曹丕"],"ans":"A","ana":"苏轼此评价赞陶渊明诗歌表面质朴,实则内涵丰富、辞采华美;B 项是书法家,C 项诗风清峻,D 项诗歌清丽。"},{"t":"s","n":21,"stem":"“池塘春草谢家春，万古千秋五字新”评价的是谢灵运的","score":1,"opts":["《登池上楼》","《登永嘉绿嶂山诗》","长于抒情","《七里濑》"],"ans":"A","ana":"诗句赞誉谢灵运《登池上楼》中池塘生春草一句清新自然、千古传诵;B、D 项是其山水诗,C 项是诗歌特点非作品。"},{"t":"s","n":22,"stem":"《搜神记》的作者是","scor ":"以下作品属于唐传奇的有","score":2,"opts":["《枕中记》","《游仙窟》","《莺莺传》","《李娃传》","《三王墓》"],"ans":"ABCD","ana":"E 项《三王墓》出自《搜神记》,是志怪小说;A、B、C、D 项均为唐代传奇代表作,情节完整、人物鲜明。"},{"t":"m","n":35,"stem":"以下诗句属于李商隐的有","score":2,"opts":["身无彩凤双飞翼,心有灵犀一点通","庄生晓梦迷蝴蝶,望帝春心托杜鹃","永忆江湖归白发,欲回天地入扁舟","商女不知亡国恨,隔江犹唱后庭花","嫦娥应悔偷灵药,碧海青天夜夜心"],"ans":"ABCE","ana":"D 项出自杜牧的《泊秦淮》;A 项出自《无题·昨夜星辰昨夜风》,B 项出自《锦瑟》,C 项出自《安定城楼》,E 项出自《嫦娥》,均为李商隐诗作。"}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《古诗十九首》","score":3,"ans":"(1)是最早见于《文选》的十九首无主名的五言诗。(2)非一时一人之作,产生于东汉顺帝末到献帝前。(3)内容上基本是游子思妇之辞。","ana":"《古诗十九首》不是一个作者自定的诗集名，而是萧统《文选》把十九首汉末无名氏五言诗合编后的总题。它们大致形成于东汉末年，具体年代并非每首都可确定；常以游子与思妇的离别相思为线索，如《行行重行行》写远别与衰老，《迢迢牵牛星》写隔河相望，也由此引出人生短促、仕途失意等普遍感受。","anaAI":true},{"t":"term","n":37,"stem":"王粲","score":3,"ans":"(1)是建安七子之一,在七子中诗、赋最佳。(2)代表作有《七哀诗》等。(3)其诗歌的艺术特点在于抒情深切,慷慨悲凉,文辞秀美。","ana":"王粲（177—217）是建安七子之一，战乱中离开故乡、长期寓居荆州的经历，使其诗赋常带有乱离和乡愁。《七哀诗》写长安荒乱和流民惨状，《登楼赋》则在登临中抒发思归而不得的苦闷；作品兼具深切抒情、慷慨悲凉和秀美文辞，故钟嵘称其为“七子之冠冕”。","anaAI":true},{"t":"term","n":38,"stem":"《闲情赋》","score":3,"ans":"[原文字段疑似转录错误，待对照可靠答案源复核] (1)是陶渊明的赋作。(2)表达的是对意切,辞采绮丽中女子的深切思念。(3)极为细腻,譬喻妙。","ana":"题面答案存在转录疑点，暂标待核；作答仍应先界定“《闲情赋》”，再围绕概念、特征和文学史意义分点说明。可依据题干给出的线索复核，不能把存疑内容当作权威结论。","anaAI":true},{"t":"term","n":39,"stem":"“高岑”","score":3,"ans":"(1)指的是高适、岑参。(2)二人是唐代边塞诗派的代表作家。","ana":"“高岑”是盛唐边塞诗人高适、岑参的并称。二人都写亲历的边地军旅、征人处境与塞外景色，但高适多用质朴古体，沉雄悲壮、常关注战争现实；岑参善七言歌行，以奇伟想象和色彩鲜明的奇寒、飞雪景象见长，如《白雪歌送武判官归京》。并称指其边塞诗成就，不意味着二人风格相同。","anaAI":true}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"short","n":40,"stem":"简析《孟子》文章的主要特点。","score":5,"ans":"(1)最突出的是它的雄辩色彩。(2)善于以典型事例、比喻和寓言说理。","ana":"《孟子》文章最醒目的是雄辩：孟子面对梁惠王、齐宣王等具体听者，先顺着对方关切设问，再层层推论，常以反问、排比增强气势。《梁惠王上》“五十步笑百步”把战争逃兵的自我辩解转成讽刺，《告子上》“揠苗助长”则以寓言说明违背规律的危害。典型事例和比喻不是装饰，而是把仁政、性善等抽象主张变得可感、难以回避。","anaAI":true},{"t":"short","n":41,"stem":"简述扬雄对大赋创作的拓展。","score":5,"ans":"(1)拓展了大赋的题材领域。(2)进一步加强了大赋“劝百讽一”的劝谕色彩。(3)艺术表现上有了新的变化。","ana":"扬雄承接司马相如的大赋传统，作品从天子田猎进一步扩展到甘泉祭祀、河东后土祭祀等题材，如《甘泉赋》《河东赋》《羽猎赋》《长杨赋》。他仍以铺陈展示宫苑和仪礼，但比司马相如更强调赋末讽谏，强化“劝百讽一”中的劝戒；篇章有时缩短、对象较集中，常先极写其盛，再以议论收束，显示大赋从纯铺张向议论、讽谏拓展。","anaAI":true},{"t":"short","n":42,"stem":"简析《西洲曲》的艺术特点。","score":5,"ans":"(1)情思缠绵,写景秀丽。(2)语言清新明丽。(3)换韵造成回环婉转的效果。","ana":"《西洲曲》以女子怀念情人为情感主线，把采莲、登楼、折梅、望郎等江南生活场景串成四季流转的长篇抒情歌。诗中“忆梅下西洲”等地名和动作反复牵引思绪，景物明丽而情意缠绵；语言清新口语化，换韵与句式回环造成歌唱节奏，既有民歌的明快，也有精心经营的结构。","anaAI":true},{"t":"short","n":43,"stem":"简述韩愈、柳宗元的古文理论主张。","score":5,"ans":"(1)提出“文以明道”的观念，确定了古文创作的指导思想。(2)提出“不平则鸣”的口号。(3)提出“唯陈言之务去”的主张。","ana":"韩愈、柳宗元共同以古文反对骈文因袭，主张文章应承载儒家之道；韩愈用“文以明道”说明文章的思想目的，又以“惟陈言之务去”要求摆脱陈旧套语，并提出“不平则鸣”，解释遭际不平如何激发文学表达。柳宗元强调文与道相须、道应落实于经世实践，也参与古文创作。答题应区分共同方向与个人表述，不要把所有口号都笼统归给两人。","anaAI":true}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"essay","n":44,"stem":"论述《离骚》的艺术表现成就。","score":14,"ans":"(1)浓烈的激情和奇幻的想象。(2)峻洁纯美、独立不屈的抒情主人公形象。(3)比兴手法的拓展。(4)结构上虚实结合;形式上韵散结合;语言富于艺术表现力。","ana":"《离骚》的艺术力量来自政治理想和个人遭际的强烈交织：屈原以“美政”求举贤修法，遭谗后仍宣誓“虽九死其犹未悔”，形成峻洁、独立的抒情主人公。香草、美人、佩饰构成贯穿全篇的比兴象征，把修德与政治选择写成可感形象；篇章由现实陈述转向上下求索、神游求女，虚实交替、层层推进。楚地方言、“兮”字句与长短句相间，又让语言兼具歌唱性和繁富节奏。","anaAI":true},{"t":"essay","n":45,"stem":"论述杜甫诗歌的艺术风格及其对后世的影响。","score":14,"ans":"(1)主要风格特征是沉郁顿挫,其感情基调是悲慨。(2)沉郁,指其感情的悲慨壮大深厚;顿挫,指其感情的表达波浪起伏、反复低回。(3)杜甫是诗歌史上一位承先启后的人物,至宋代成为作诗效法的最高典范。(4)在思想情操与士人人格的形成上,对后世产生重大影响。","ana":"杜甫的“沉郁顿挫”把深厚忧患写进曲折的诗歌结构：沉郁是忧国、悯民与身世之感凝重，顿挫是情绪经过停顿、转折和回环才释放。《登高》由秋江、落木转入衰病漂泊，《秋兴八首》把个人羁旅与长安兴亡交织；《三吏》《三别》又以对话和细节写战争征役中的百姓。杜诗因此成为宋代诗人学杜的重要典范，其现实关怀和士人责任感也持续影响后世诗歌。","anaAI":true}]}],"code":"00538","qaNotes":[]},{"paper":"gws-2604","subject":"gws","session":"2604","label":"2026年4月","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"以下关于神话的基本特征表述不正确的是","score":1,"opts":["没有经过想象或幻想的加工","反映了远古人类的愿望","只能产生在远古时代","是对自然和社会现象的解释说明"],"ans":"A","ana":"神话以远古集体想象解释自然与社会、寄托愿望；说它“没有经过想象或幻想的加工”恰与神话形成方式相反。","anaAI":true},{"t":"s","n":2,"stem":"伪古文《尚书》出现于","score":1,"opts":["西汉","东汉","西晋","东晋"],"ans":"D","ana":"东晋梅赜进献的《古文尚书》后经考证为伪古文，与汉代发现、传授的《尚书》系统须区别。","anaAI":true},{"t":"s","n":3,"stem":"“上善若水”出自","score":1,"opts":["《老子》","《孟子》","《庄子》","《墨子》"],"ans":"A","ana":"“上善若水，水善利万物而不争”见《老子》第八章
