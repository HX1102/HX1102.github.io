w","n":33,"stem":"是必夫奇鬼也。夫：","ans":"指示代词。那个，作定语。","score":1},{"t":"w","n":34,"stem":"雖遇執事，其弗敢違。弗：","ans":"否定副词。不，作状语。","score":1},{"t":"w","n":35,"stem":"景公知晏子賢，迺任以國政。以：","ans":"介词。引进处置的对象，把。","score":1},{"t":"w","n":36,"stem":"彼且奚適焉？奚：","ans":"疑问代词。哪里，作宾语。","score":1}]},{"title":"四、简答题","meta":"本大题共3小题，共20分。","items":[{"t":"w","n":37,"stem":"指出下列句中加着重号的字与括号中的字是异体字关系还是分化字关系，并说明辨别这两种字际关系的理由。（1）梁北有黎丘部，有奇鬼焉。喜⟪効⟫（效）人之子姪昆弟之狀。（2）其⟪謌⟫（歌）也有思，其哭也有懷。（3）宛王殺漢使者，頭⟪縣⟫（懸）北闕。（4）齊人有馮諼者，貧乏不能自存，使人⟪屬⟫（嘱）孟嘗君。","ans":"（1）和（2）是异体字；（3）和（4）是分化字。异体字音义完全相同，记词职能也完全一样，只是形体不同。“効”和“效”、“謌”和“歌”音义完全相同、记词职能完全一样，形体不同，是异体字关系。分化字读音相同或相近，一个字分担了另一个字多个意义职能的一个，者为分化关系。“懸”分担了“縣”的“悬挂”的职能，是分化字；“嘱”分担了“屬”的“嘱托”的职能，是分化字。","score":6},{"t":"w","n":38,"stem":"解释下列句中加着重号词语的意义，找出其中的复合词，并以此为例说明确认复合词的主要标准。（1）且陛下⟪春秋⟫高，法令無常。（2）蟪蛄不知⟪春秋⟫，此小年也。（3）天子祭天地，諸侯祭⟪社稷⟫。（4）是⟪社稷⟫之臣也，何以伐為？","ans":"（1）年龄。（2）春天和秋天。（3）土地神与谷神。（4）国家。两个单音词组合以后意义不等于原来意义的简单相加，而产生了新的意义，可以认为是复合词。如（1）的“春秋”和（4）的“社稷”。","score":6},{"t":"w","n":39,"stem":"根据以下例句归纳“其”的用法，并将例句归到各类用法的后面。（1）日月之行，若出其⟪中⟫。（2）北冥有魚，其名為鯤。（3）及其未既濟也，請擊之。（4）楚其亡乎？（5）昭王之不復，君其問諸水濱！（6）稱其⟪雠⟫，不為諂。","ans":"第一，第三人称代词，作定语，表示领属关系。例句（2）（6）。第二，第三人称代词，充当主谓词组或分句的主语。例句（3）。第三，指示代词，表示远指，作定语，相当于现代汉语的“那”。例句（1）。第四，句中语气词，表示推测，可译作“大概”。例句（4）。第五，句中语气词，表示一种委婉的语气，可译为“希望”“还是”。例句（5）。","score":8}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下段文章中画线的句子译成现代汉语。","passage":"田單知士卒之可用，乃身操版插，與士卒分功，妻妾編於行伍之間，盡散飲食饗士。令甲卒皆伏，使老弱女子乘城，遣使約降於燕，燕軍皆呼萬歲。田單又收民金，得千溢，令即墨富豪遺燕將，曰：“即墨即降，願無虜掠吾族家妻妾，令安堵。”燕將大喜，許之。燕軍由此益懈。田單乃收城中得千餘牛，為絳繒衣，畫以五彩龍文，束兵刃於其角，而灌脂束葦於尾，燒其端。鑿城數十穴，夜縱牛，壯士五千人隨其後。牛尾熱，怒而奔燕軍，燕軍夜大驚。牛尾炬火光明炫耀，燕軍視之皆龍文，所觸盡死傷。五千人因銜枚擊之，而城中鼓譟從之，老弱皆擊銅器為聲，聲動天地。燕軍大駭，敗走。齊人遂夷殺其將騎劫。燕軍擾亂奔走，齊人追亡逐北，所過城邑皆畔燕而歸。田單兵日益多，乘勝，燕日敗亡，卒至河上，而齊七十餘城皆復為齊。乃迎襄王於莒，入臨菑而聽政。襄王封田單，號曰安平君。","items":[{"t":"w","n":40,"stem":"⟪乃身操版插，與士卒分功⟫","ans":"（田单）就亲自拿着修筑防御工事的工具，和士兵分担辛劳。","score":2},{"t":"w","n":41,"stem":"⟪願無虜掠吾族家妻妾，令安堵⟫","ans":"希望不要掠夺我们同族家的女子，让她们安居不受侵扰。","score":2},{"t":"w","n":42,"stem":"⟪燕將大喜，許之。燕軍由此益懈⟫","ans":"燕军将领非常高兴，答应他们的请求。燕国军队从此逐渐放松警惕。","score":2},{"t":"w","n":43,"stem":"⟪束兵刃於其角，而灌脂束葦於尾⟫","ans":"在牛角上绑上尖刀，并在牛尾系上浇灌过油脂的芦苇。","score":2},{"t":"w","n":44,"stem":"⟪燕軍擾亂奔走，齊人追亡逐北⟫","ans":"燕军被打乱阵脚拼命逃跑，齐军追逐败逃的燕军。","score":2},{"t":"w","n":45,"stem":"⟪田單兵日益多，乘勝，燕日敗亡⟫","ans":"田单的士兵一天天增多，凭借着胜利的势头，燕军一天天地败逃。","score":2}]},{"title":"六、古文标点题","meta":"本大题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"河南樂羊子之妻者不知何氏之女也羊子嘗行路得遺金一餅還以與妻妻曰妾聞志士不飲盜泉之水廉者不受嗟來之食況拾遺求利以污其行乎羊子大慚乃捐金於野而遠尋師學一年來歸妻跪問其故羊子曰久行懷思無它異也妻乃引刀趨機而言曰此織生自蠶繭成於機杼一絲而累以至於寸寸累不已遂成丈匹今若斷斯織也則捐失成功稽廢時月夫子積學當日知其所亡以就懿德若中道而歸何異斷斯織乎羊子感其言復還終業遂七年不反","ans":"河南樂羊子之妻者，不知何氏之女也。羊子嘗行路，得遺金一餅，還以與妻。妻曰：“妾聞志士不飲盜泉之水，廉者不受嗟來之食。況拾遺求利，以污其行乎！”羊子大慚，乃捐金於野，而遠尋師學。一年來歸，妻跪問其故。羊子曰：“久行懷思，無它異也。”妻乃引刀趨機而言曰：“此織生自蠶繭，成於機杼，一絲而累，以至於寸；寸累不已，遂成丈匹。今若斷斯織也，則捐失成功，稽廢時月。夫子積學，當日知其所亡，以就懿德；若中道而歸，何異斷斯織乎？”羊子感其言，復還終業，遂七年不反。","score":12}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"景公飲酒酣，曰：‘今日願與諸大夫爲樂飲，請無爲禮。’晏子蹴然改容曰：‘君之言過矣！群臣固欲君之無禮也。力多足以勝其長，勇多足以弑君，而禮不使也。禽獸以力爲政，彊者犯弱，故日易主，今君去禮，則是禽獸也。群臣以力爲政，彊者犯弱，而日易主，君將安立矣！凡人之所以貴於禽獸者，以有禮也。故《詩》曰：‘人而無禮，胡不遄死？’禮不可無也。’公湎而不聽。少閒，公出，晏子不起；公入，不起；交舉則先飲。公怒，色變，抑手疾視曰：‘嚮者夫子之教寡人無禮之不可也，寡人出入不起，交舉則先飲，禮也？’晏子避席再拜稽首而請曰：‘嬰敢與君言而忘之乎？臣以致無禮之實也。君若欲無禮，此是已！’公曰：‘若是，孤之罪也。夫子就席，寡人聞命矣。’觴三行，遂罷酒。蓋是後也，飭法修禮以治國政，而百姓肅也。","score":20,"subs":[{"n":47,"stem":"酣：","ans":"喝得畅快","score":1,"grp":"解释文中加着重号词语的意义。（6分）"},{"n":48,"stem":"容：","ans":"脸色","score":1},{"n":49,"stem":"過：","ans":"错误","score":1},{"n":50,"stem":"去：","ans":"废弃","score":1},{"n":51,"stem":"飭：","ans":"整顿","score":1},{"n":52,"stem":"肅：","ans":"恭敬","score":1},{"n":53,"stem":"今日願與諸大夫爲樂飲，請無爲禮。","ans":"今天希望和诸位大夫痛快地喝酒，请不要拘泥礼节。","score":2,"grp":"将下列句子译成现代汉语。（6分）"},{"n":54,"stem":"力多足以勝其長，勇多足以弑君，而禮不使也。","ans":"力气大的人足以战胜尊长，勇猛的人足以杀害君主，但是礼不允许那样做。","score":2},{"n":55,"stem":"嬰敢與君言而忘之乎？","ans":"晏婴我怎么敢对君王讲礼仪而自己却忘了礼仪呢？","score":2},{"n":56,"stem":"君將安立矣？安：","ans":"哪里。疑问代词，前置宾语。","score":2,"grp":"解释下列加着重号词在句中的词义，并说明词性与用法。（4分）"},{"n":57,"stem":"胡不遄死？胡：","ans":"怎么，为什么。疑问代词，状语。","score":2},{"n":58,"stem":"晏婴在饮酒时用什么具体行动使景公发怒？目的是什么？请用现代汉语陈述。（4分）","ans":"饮酒时，景公离席出门，晏婴不起身；景公进门，晏婴也不起身示 斷髮，難傷老人意，故忍之耳。’六歲能史書，十二通《詩》《論語》。諸兄每讀經傳，輒下意難問。志在典籍，不問居家之事。母常非之，曰：“汝不置女工以供衣服，乃更務學，寧當舉博士邪？”后重違母言，盡修婦業，暮誦經典，家人號曰‘諸生’。父訓異之，事無大小，輒與詳議。永元七年，后與諸家子俱選入宮。入掖庭爲貴人，和帝深嘉愛焉。及后有疾，特令后母兄弟入視醫藥，不限以日數。后言於帝曰：‘宮禁至重，而使外舍久在內省，上令陛下有幸私之譏，下使賤妾獲不知足之謗。上下交損，誠不願也。’帝曰：‘人皆以數入爲榮，貴人反以爲憂，深自抑損，誠難及也。’元興元年，帝崩，殤帝生始百日，后乃迎立之。尊后爲皇太后，太后臨朝。是時新遭大憂，法禁未設。宮中亡大珠一篋，太后念，欲考問，必有不辜。乃親閱宮人，觀察顏色，即時首服。左右莫不嘆服，以爲聖明。","score":20,"subs":[{"n":47,"stem":"冥：","ans":"昏暗，不清楚","score":1,"grp":"解释文中加着重号词语的意义。（6分）"},{"n":48,"stem":"習：","ans":"练习","score":1},{"n":49,"stem":"更：","ans":"改","score":1},{"n":50,"stem":"至：","ans":"最、极","score":1},{"n":51,"stem":"閱：","ans":"察看、检查","score":1},{"n":52,"stem":"顏色：","ans":"脸色、神情","score":1},{"n":53,"stem":"非不痛也。","ans":"不；否定副词，作状语。","score":2,"grp":"指出下列句中“非”字的词义、词性及用法。（4分）"},{"n":54,"stem":"母常非之。","ans":"批评、指责；动词。","score":2},{"n":55,"stem":"上令陛下有幸私之譏，下使賤妾獲不知足之謗。上下交損，誠不願也。","ans":"对上让陛下蒙受私幸偏宠的非议，对下使我得到不知足的议论。上下两相受损，我实在不情愿啊。","score":3,"grp":"将下列句子译成现代汉语。（6分）"},{"n":56,"stem":"人皆以數入爲榮，貴人反以爲憂，深自抑損，誠難及也。","ans":"别人都以家人能够经常进入宫禁为荣幸，而你却反以为忧虑，严格克制自己，实在难以做到啊。","score":3},{"n":57,"stem":"邓皇后少年时，母亲对她喜欢研读诗书典籍有什么意见？她对母亲的意见持什么态度？请用现代汉语陈述。（4分）","ans":"母亲常常指责她：“你不学习女工却致力于学习经书，难道你要去当博士吗？”少年邓皇后难以违拗母亲的话，于是白天练习女工，晚上才诵读经书典籍。","score":4}]}]}]},{"paper":"gdhy-2204","subject":"gdhy","session":"2204","label":"2022年4月","code":"00536","qaNotes":[],"sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。","items":[{"t":"s","n":1,"stem":"下列各组字中，包括指事字的一组是（ ）","opts":["豕羴頁","傘項向","水名彬","一春妝"],"ans":"D","score":1},{"t":"s","n":2,"stem":"许慎《说文解字》为“象形”下的定义是（ ）","opts":["畫成其物，隨體詰詘","視而可識，察而見意","比類合誼，以見指撝","以事為名，取譬相成"],"ans":"A","score":1},{"t":"s","n":3,"stem":"下列各组字中属于分化字的关系的一组是（ ）","opts":["禽—擒","豪—毫","麤—粗","溢—鎰"],"ans":"A","score":1},{"t":"s","n":4,"stem":"下列句中，加着重号的括号中的字是异体字关系的一句是（ ）","opts":["楚人和氏得玉璞楚山中，⟪奉⟫（捧）而獻之厲王。","卑而驕之，⟪佚⟫（逸）而勞之。","乃自強步，日三四里，少益⟪耆⟫（嗜）食，和於身也。","恐太后玉體之有所⟪隙⟫（隙）也，故願望見太后。"],"ans":"D","score":1},{"t":"s","n":5,"stem":"下列句中，加着重号的词用本字本义的一句是（ ）","opts":["莊公寤生，驚姜氏，故名曰“寤生”，遂惡之。","子玉復治兵于蒍，終日而畢，鞭七人，貫三人耳。","諸侯振驚，皆還齊侵 ）句中“發”的意义，并在（4）（5）（6）句加下划线的词中找出相应的同义词。（1）舜⟪發⟫于畎畝之中。（2）文王⟪發⟫政施仁，必先斯四者。（3）紅豆生南國，春來⟪發⟫幾枝。（4）制禮作樂，⟪頒⟫度量，而天下大服。（5）橘生淮南則爲橘，⟪生⟫於淮北則爲枳。（6）大楚⟪興⟫，陳勝王。","ans":"（1）兴起，同义词为（6）“兴”。（2）颁布，同义词为（4）“颁”。（3）生长，同义词为（5）“生”。","score":6},{"t":"w","n":39,"stem":"解释下列句中下划线词的意义，并说明判断其活用的依据。（1）七十者⟪衣⟫帛食肉，黎民不饥不寒。（2）置人所⟪罾⟫魚腹中。（3）二國有好，臣不與及，其誰敢⟪德⟫？（4）先破秦入咸陽者⟪王⟫之。","ans":"（1）衣：穿。名词“衣”与“帛”连用，构成动宾关系。（2）罾：用网捕。名词放在“所”字后面，活用为动词。（3）德：感恩。名词“德”前有能愿动词“敢”，活用为动词。（4）王：使……为王。名词后有代词“之”，构成动宾关系。","score":8}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下段文章中画线的句子译成现代汉语。","passage":"厲王虐，國人謗王。召公告曰：‘民不堪命矣！’王怒，得衛巫，使監謗者。以告，則殺之。國人莫敢言，道路以目。王喜，告召公曰：‘吾能弭謗矣，乃不敢言。’召公曰：‘是障之也。防民之口，甚於防川。川壅而潰，傷人必多，民亦如之。是故為川者決之使導，為民者宣之使言。……民之有口，猶土之有山川也，財用於是乎出；猶其有原、隰、衍、沃也，衣食於是乎生。口之宣言也，善敗於是乎興。行善而備敗，其所以阜財用衣食者也。夫民慮之於心而宣之於口，成而行之，胡可壅也？若壅其口，其與能幾何？’","items":[{"t":"w","n":40,"stem":"厲王虐，國人謗王","ans":"厉王残暴，国都的人批评论议厉王。","score":2},{"t":"w","n":41,"stem":"國人莫敢言，道路以目","ans":"国都的人没有谁敢说话，在道路上用目光示意。","score":2},{"t":"w","n":42,"stem":"防民之口，甚於防川","ans":"堵塞民众的言路，后果比堵塞河流还严重。","score":2},{"t":"w","n":43,"stem":"是故為川者決之使導","ans":"因此治水的人疏通河道使它通畅。","score":2},{"t":"w","n":44,"stem":"行善而備敗，其所以阜財用衣食者也","ans":"推行百姓认可的好事并且防范坏事，这是增加财物、丰衣足食的方法。","score":2},{"t":"w","n":45,"stem":"若壅其口，其與能幾何","ans":"如果堵住百姓的言路，他的赞同者能有几个呢？","score":2}]},{"title":"六、古文标点题","meta":"本大题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"齊桓公將立管仲令群臣曰寡人將立管仲爲仲父善者入門而左不善者入門而右東郭牙中門而立公曰寡人立管仲爲仲父令曰善者左不善者右今子何爲中門而立牙曰以管仲之智爲能謀天下乎公曰能以斷爲敢行大事乎公曰敢牙曰君知能謀天下斷敢行大事君因專屬之國柄焉以管仲之能乘公之勢以治齊國得無危乎公曰善乃令隰朋治内管仲治外以相參","ans":"齊桓公將立管仲，令群臣曰：“寡人將立管仲爲仲父，善者入門而左，不善者入門而右。”東郭牙中門而立，公曰：“寡人立管仲爲仲父，令曰善者左，不善者右，今子何爲中門而立？”牙曰：“以管仲之智爲能謀天下乎？”公曰：“能。”“以斷爲敢行大事乎？”公曰：“敢。”牙曰：“君知能謀天下，斷敢行大事，君因專屬之國柄焉。以管仲之能，乘公之勢以治齊國，得無危乎？”公曰：“善。”乃令隰朋治内，管仲治外以相參。","score":12}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"景公有所愛槐，令吏謹守之，植木縣之，下令曰：‘犯槐者刑，傷之者死。’有不聞令，醉而犯之者，公聞之曰：‘是先犯我令。’使吏拘之，且加罪焉。其女子往辭晏子之家，令內之。女子入門，晏子望見之，曰：‘怪哉！有深憂。’進而問焉，曰：‘所憂何也？’對曰：‘妾聞之，明君蒞國立政，不損祿，不益刑，又不以私恚害公法，不為禽獸傷人民，不為草木傷禽獸，不為野草傷禾苗。吾君欲以樹木之故殺妾父，孤妾身，此 成其好。二國有好，臣不與及，其誰敢德？”王曰：“子歸，何以報我？”對曰：“臣不任受怨，君亦不任受德，無怨無德，不知所報。”王曰：“雖然，必告不穀。”對曰：“以君之靈，累臣得歸骨於晉，寡君之以爲戮，死且不朽。若從君之惠而免之，以賜君之外臣首，首其請於寡君，而以戮於宗，亦死且不朽。若不獲命，而使嗣宗職，次及於事，而帥偏師以脩封疆。雖遇執事，其弗敢違，其竭力致死，無有二心，以盡臣禮，所以報也。”王曰：“營未可與爭。”重爲之禮而歸之。","items":[{"t":"w","n":40,"stem":"使歸即戮","ans":"让我回国受死（或者：让我回国就死）。","score":2},{"t":"w","n":41,"stem":"然則德我乎","ans":"既然如此，那么感激我吗？","score":2},{"t":"w","n":42,"stem":"二國圖其社稷，而求紓其民","ans":"两国各为自己的国家谋划，希望缓和百姓的痛苦。","score":2},{"t":"w","n":43,"stem":"各懲其忿以相宥也","ans":"各自克制自己的怨恨来互相谅解。","score":2},{"t":"w","n":44,"stem":"次及於事，而帥偏師以脩封疆","ans":"按照顺序轮到我担任军事职务，率领军队保卫边疆。","score":2},{"t":"w","n":45,"stem":"重爲之禮而歸之","ans":"很隆重地给他举行了礼仪，把他送回去了。","score":2}]},{"title":"六、古文标点题","meta":"本大题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"太史公曰詩有之高山仰止景行行止雖不能至然心嚮往之余讀孔氏書想見其為人適魯觀仲尼廟堂車服禮器諸生以時習禮其家余低回留之不能去云天下君王至於賢人眾矣當時則榮沒則已焉孔子布衣傳十餘世學者宗之自天子王侯中國言六藝者折中於夫子可謂至聖矣","ans":"太史公曰：“《詩》有之：‘高山仰止，景行行止。’雖不能至，然心嚮往之。余讀孔氏書，想見其為人。適魯，觀仲尼廟堂、車服、禮器，諸生以時習禮其家，余低回留之不能去云。天下君王至於賢人眾矣，當時則榮，沒則已焉。孔子布衣，傳十餘世，學者宗之。自天子王侯，中國言六藝者折中於夫子，可謂至聖矣！","score":12}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"楚有士申鳴者，在家而養其父，孝聞於楚國。王欲授之相，申鳴辭不受。其父曰：“王欲相汝，汝何不受乎？”申鳴對曰：“舍父之孝子而爲王之忠臣，何也？”其父曰：“使有祿於國，立義於庭，汝樂，吾無憂矣。吾欲汝之相也。”申鳴曰：“諾。”遂入朝，楚王因授之相。居三年，白公爲亂，殺司馬子期，申鳴將往死之。父止之曰：“棄父而死，其可乎？”申鳴曰：“聞夫仕者，身歸於君而祿歸於親。今既去父事君，得無死其難乎？”遂辭而往，因以兵圍之。白公謂石乞曰：“申鳴者，天下之勇士也，今以兵圍我，吾焉之奈何？”石乞曰：“申鳴者，天下之孝子也，往劫其父以兵。申鳴聞之必來，因與之語。”白公曰：“善。”則往取其父，持之以兵。告申鳴曰：“子與吾，吾與子分楚國；子不與吾，子父則死矣。”申鳴流涕而應之曰：“始吾父之孝子也，今吾君之忠臣也。吾聞之也，食其食者死其事，受其祿者畢其能，今吾已不得爲父之孝子矣，乃君之忠臣也，吾何得以全身。”援桴鼓之，遂殺白公，其父亦死。","score":20,"subs":[{"n":47,"grp":"（一）解释文中下划线词语的意义。（4分）","stem":"王欲相汝，汝何不受乎？相：","ans":"使……为相","score":1},{"n":48,"stem":"舍父之孝子而爲王之忠臣。舍：","ans":"放弃","score":1},{"n":49,"stem":"申鳴流涕而應之。涕：","ans":"眼泪","score":1},{"n":50,"stem":"援桴鼓之。援：","ans":"拿起，拿过来","score":1},{"n":51,"grp":"（二）说明下列句中下划线部分的用法及意义。（6分）","stem":"楚王因授之相。授之相：","ans":"双宾语句；授给他相位。","score":2},{"n":52,"stem":"申鳴將往死之。死：","ans":"动词为动用法；为……而死。","score":2},{"n":53,"stem":"吾何得以全身。全：","ans":"形容 ":"w","n":31,"stem":"今日寡人出獵，上山則見虎，下澤則見蛇，⟪殆⟫所謂不祥也。殆：","ans":"大約","score":1},{"t":"w","n":32,"grp":"（二）说明下列句中下划线词的词性和作用。（5分）","stem":"安陵君⟪其⟫許寡人？其：","ans":"句中语气词，表示委婉的语气。","score":1},{"t":"w","n":33,"stem":"既庶矣，又何加⟪焉⟫？焉：","ans":"兼词，代词兼表句末语气。","score":1},{"t":"w","n":34,"stem":"退而老⟪於⟫西河之上。於：","ans":"介词，引进处所。","score":1},{"t":"w","n":35,"stem":"妾是⟪以⟫求去也。以：","ans":"介词，引进原因。","score":1},{"t":"w","n":36,"stem":"天下皆知美之爲美，⟪斯⟫惡已。斯：","ans":"连词，相当于“则”。连接条件复句中的两个分句。","score":1}]},{"title":"四、简答题","meta":"本大题共3小题，共20分。","items":[{"t":"w","n":37,"stem":"指出下列句中加下划线的字与括号中的字是分化字关系还是异体字关系，并说明理由。（1）秦滅韓亡魏，而君以五十里之地存者，以君爲長者，故不⟪錯⟫（措）意也。（2）文倦於事，慣於憂，而性⟪懧⟫（懦）愚，沈於國家之事，開罪於先生。（3）苟虧人愈多，其不仁⟪兹⟫（滋）甚矣。（4）愛我哉！忘其口味以⟪啗⟫（啖）寡人。","ans":"（1）（3）是分化字关系；分化字读音相同或相近，一个字分担了另一个字多个意义职能的一个，二者为分化关系。“措”分担了“錯”的“放置”的职能，“滋”分担了“兹”“更加”的职能，是分化字。（2）（4）是异体字关系；异体字音义完全相同，记词职能也完全一样，只是形体不同。“懧”和“懦”、“啗”和“啖”音义完全相同、记词职能完全一样，形体不同，是异体字关系。","score":6},{"t":"w","n":38,"stem":"解释下列句中加下划线词的意义，指出该意义是本义还是引申义，并据以归纳引申义与本义的联系类型。（1）臧紇斬鹿門之⟪關⟫以出。關：（2）故遣將守⟪關⟫者，備他盜出入與非常也。關：","ans":"（1）门闩，本义；（2）关卡，引申义；联系类型：（2）和（1）是相似关系。","score":6},{"t":"w","n":39,"stem":"根据下列句子归纳古代汉语被动句式类型，并将句子序号归入相应类型中。（1）夫惑於似士者而失於真士，此黎丘丈人之智也。（2）言公不能用子家，所以見辱。（3）父母宗族，皆爲戮沒。（4）古今兄弟被侵，必攻者，廉也。（5）吾長見笑於大方之家。（6）方術不用，爲人所疑。","ans":"古代汉语的被动句式主要有四种：（一）“于”字句：用介词“于”引进行为的主动者的被动句式，如（1）。（二）“见”字句：助动词“见”用在动词前表示被动，如（2）；“见……于……”式，如（5）。（三）“为”字句：用介词“为”引进动作行为主动者的句式，有时省略行为主动者，如（3）；“为……所……”式，如（6）。（四）“被”字句：助动词“被”用在动词前表示被动，如（4）。","score":8}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线句子译成现代汉语。","passage":"左師觸龍言願見太后。太后盛氣而胥之。入而徐趨，至而自謝，曰：“老臣病足，曾不能疾走，不得見久矣，竊自恕，而恐太后玉體之有所郄也，故願望見太后。”太后曰：“老婦恃輦而行。”曰：“⟪日食飲得無衰乎⟫？”曰：“恃鬻耳。”曰：“老臣今者殊不欲食，乃自強步，日三四里，⟪少益耆食⟫，和於身也。”太后曰：“老婦不能。”太后之色少解。左師公曰：“⟪老臣賤息舒祺，最少，不肖⟫。而臣衰，竊愛憐之。⟪願及未填溝壑而託之⟫。”太后曰：“敬諾。年幾何矣？”對曰：“十五歲矣。雖少，⟪願及未填溝壑而託之⟫。”太后曰：“丈夫亦愛憐其少子乎？”對曰：“甚於婦人。”太后笑曰：“婦人異甚。”對曰：“老臣竊以爲媼之愛燕后賢於長安君。”曰：“⟪君過矣，不若長安君之甚⟫。”","items":[{"t":"w","n":40,"stem":"太后盛氣而胥之","ans":"太后怒气冲冲地等待着他。","score":2},{"t":"w","n":41,"stem":"日食飲得無衰乎","ans":"每天的吃喝该不会减少吧？","score":2},{"t":"w","n":42,"stem":"少益耆食","ans":"稍微渐渐地爱吃东西了。","score":2},{"t":"w","n":43,"stem":"老臣賤息舒祺，最少，不肖","ans":"老臣的儿子舒祺，年龄最小，不成材。","score":2},{"t":"w","n":44,"stem":"願及未填溝壑而託之","ans":"希望趁着自己还没有去世把他托付给您。","score":2},{"t":"w","n":45,"stem":"君過矣，不若長安君之甚","ans":"您错了，比不上爱长安君那样厉害。","score":2}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"晏子使吳吳王謂行人曰吾聞晏嬰蓋北方辯于辭習于禮者也命儐者曰客見則稱天子請見明日晏子有事行人曰天子請見晏子蹴然行人又曰天子請見晏子蹴然又曰天子請見晏子蹴然者三曰臣受命弊邑之君將使于吳王之所以不敏而迷惑入于天子之朝敢問吳王惡乎存然後吳王曰夫差請見見之以諸侯之禮","ans":"晏子使吳，吳王謂行人曰：“吾聞晏嬰，蓋北方辯于辭、習于禮者也。命儐者曰：‘客見則稱天子請見。’”明日，晏子有事，行人曰：“天子請見。”晏子蹴然。行人又曰：“天子請見。”晏子蹴然。又曰：“天子請見。”晏子蹴然者三，曰：“臣受命弊邑之君，將使于吳王之所，以不敏而迷惑，入于天子之朝，敢問吳王惡乎存？”然後吳王曰：“夫差請見。”見之以諸侯之禮。","score":12}]},{"title":"七、古文阅读题","meta":"本大题共11小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"晉文公將與楚人戰，召舅犯問之，曰：“⟪吾將與楚人戰，彼衆我寡，爲之奈何⟫？”舅犯曰：“臣聞之：繁禮君子，不⟪厭⟫忠信；戰陣之間，不⟪厭⟫詐僞。君其詐之而已矣。”文公辭舅犯，因召雍季而問之，曰：“我將與楚人戰，彼衆我寡，爲之奈何？”雍季對曰：“焚林而⟪田⟫，偷取多獸，後必無獸；以⟪詐⟫遇民，偷取一時，後必無⟪復⟫。”文公曰：“善。”⟪辭雍季，以舅犯之謀與楚人戰以敗之⟫。歸而行爵，先雍季而後舅犯。群臣曰：“城濮之事，舅犯謀也。夫用其言而⟪後⟫其身，可乎？”文公曰：“此非⟪若⟫所知也。⟪夫⟫舅犯言，一時之權也；雍季言，萬世之利也。”仲尼聞之，曰：“文公之霸也，宜哉！⟪既⟫知一時之權，又知萬世之利。”","score":20,"subs":[{"n":47,"grp":"（一）解释文中加下划线的词。（6分）","stem":"⟪厭⟫：","ans":"满足","score":1},{"n":48,"stem":"⟪詐⟫：","ans":"欺骗","score":1},{"n":49,"stem":"⟪復⟫：","ans":"再一次","score":1},{"n":50,"stem":"⟪若⟫：","ans":"你们","score":1},{"n":51,"stem":"⟪夫⟫：","ans":"句首语气词，表示要发表议论","score":1},{"n":52,"stem":"⟪既⟫：","ans":"已经","score":1},{"n":53,"grp":"（二）说明下列句中加下划线词的词性或用法，解释其在句中的词义。（4分）","stem":"焚林而⟪田⟫。田：","ans":"动词，打猎。","score":2},{"n":54,"stem":"夫用其言而⟪後⟫其身。後：","ans":"名词，使动用法，使他在后。","score":2},{"n":55,"grp":"（三）将文中画线的句子译成现代汉语。（4分）","stem":"⟪吾將與楚人戰，彼衆我寡，爲之奈何⟫","ans":"我们将和楚人作战，他们人多，我们人少，怎么应对呢？","score":2},{"n":56,"stem":"⟪辭雍季，以舅犯之謀與楚人戰以敗之⟫","ans":"辞谢了雍季，用舅犯的计策和楚人交战而打败了他们。","score":2},{"n":57,"grp":"（四）","stem":"舅犯和雍季给晋文公所出计策有何不同？晋文公是如何做的？他这么做的理由是什么？请用现代汉语陈述。（6分）","ans":"舅犯提出可以谎报人数，不让百姓和士兵知道实情；雍季认为不可以欺骗百姓。晋文公采用了舅犯的计策作战，但行赏时让雍季位在舅犯前。晋文公认为舅犯的计策是一时的权变，雍季的建言关乎万世的利益。","score":6}]}]}]},{"paper":"gdhy-2504","subject":"gdhy","session":"2504","label":" 标点下面的文言短文。","passage":"今爾出於崖涘觀於大海乃知爾醜爾將可與語大理矣天下之水莫大於海萬川歸之不知何時止而不盈尾閭泄之不知何時已而不虛春秋不變水旱不知此其過江河之流不可爲量數而吾未嘗以此自多者自以比形於天地而受氣於陰陽吾在天地之間猶小石小木之在大山也方存乎見少又奚以自多","ans":"今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。天下之水，莫大於海，萬川歸之，不知何時止而不盈；尾閭泄之，不知何時已而不虛。春秋不變，水旱不知。此其過江河之流，不可爲量數。而吾未嘗以此自多者，自以比形於天地而受氣於陰陽，吾在天地之間，猶小石小木之在大山也。方存乎見少，又奚以自多！","score":12}]},{"title":"七、古文阅读题","meta":"本大题共11小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"晉文公曰：‘吾弛關市之徵而緩刑罰，其足以戰民乎？’狐子曰：‘不足。’曰：‘然則何如足以戰民乎？’狐子對曰：‘令無得不戰。’公曰：‘無得不戰奈何？’狐子對曰：‘信賞必罰，其足以戰。’公曰：‘刑罰之極安至？’對曰：‘不辟親貴，法行所愛。’文公曰：‘善。’明日令田于圃陸，期以日中爲期，後期者行軍法焉。於是公有所愛者曰顛頡，後期，吏請其罪，文公隕涕而憂。吏曰：‘請用事焉。’遂斬顛頡之脊以徇百姓，以明法之信也。而後百姓皆懼曰：‘君於顛頡之貴重如彼甚也，而君猶行法焉，況于我則何有矣。’文公見民之可戰也，於是遂興兵伐原，克之；伐衛，東其畝，取五鹿；攻陽，勝虢；伐曹；南圉鄭，反之陴；罷宋圉；還與荆人戰城濮，大敗荆人；返爲踐土之盟，遂成衡雍之義。一舉而八有功。所以然者，無他故異物，從狐偃之謀，假顛頡之脊也。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加下划线的词。（6分）","stem":"然則：","ans":"这样，那么","score":1},{"n":48,"stem":"安：","ans":"哪里","score":1},{"n":49,"stem":"辟：","ans":"避开","score":1},{"n":50,"stem":"涕：","ans":"眼泪","score":1},{"n":51,"stem":"克：","ans":"战胜","score":1},{"n":52,"stem":"假：","ans":"借助","score":1},{"n":53,"grp":"（二）说明下列句中加下划线词的词性或用法，解释其在句中的词义。（4分）","stem":"吾弛關市之徵而緩刑罰。弛：","ans":"形容词使动用法，使……宽缓。","score":2},{"n":54,"stem":"東其畝，取五鹿。東：","ans":"名词使动用法，使……东向。","score":2},{"n":55,"grp":"（三）将文中画线的句子译成现代汉语。（4分）","stem":"明日令田于圃陸，期以日中爲期，後期者行軍法焉。","ans":"第二天下令在圃陆打猎，以中午为期限，超过期限到的人施行军法。","score":2},{"n":56,"stem":"君於顛頡之貴重如彼甚也，而君猶行法焉。","ans":"君王那么看重颠颉，却仍然施行军法。","score":2},{"n":57,"grp":"（四）（6分）","stem":"晋文公为什么事询问狐偃的意见？狐偃给晋文公的建议是什么？晋文公是如何实现的？请用自己的语言表述出来。","ans":"晋文公想知道如何可以让百姓愿意跟他一起作战；狐偃提出赏赐和惩罚一定确实执行，不论权贵，不论亲近的人，一律按法执行，就可以让百姓作战；晋文公处罚了不守规定的自己的亲信颠颉，在百姓中树立了威信。","score":6}]}]}]},{"paper":"gdhy-2510","subject":"gdhy","session":"2510","label":"2025年10月","code":"00536","sections":[{"title":"一、单项选择题","meta":"本大题共20小题，每小题1分，共20分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列各组字，全部包含象形、指事、会意三种结构类型的一组是","opts":["及陳柏","自一臭","水新線","月杯修"],"ans":"B","score":1},{"t":"s","n":2,"stem":"下列对汉字义符和声符位置的分析完全正确的一项是","opts":["錢，右形左聲。","瓣， ：通假字，通“扑”，击打；（3）闻：本字，本义为听到；（4）招：通假字，通“的”，箭靶。区分方法：本字是字形与词义相对应，直接用本义或引申义记录词；通假字是借用音同或音近的字记录另一个词，字的本义与语境义无关。","score":6},{"t":"w","n":38,"stem":"解释下列句中加着重号词的意义，并指出其差异。（1）失時不雨，民且⟪狼顧⟫。（2）乘彼垝垣，以⟪望⟫復關。（3）雲車十餘丈，⟪瞰⟫臨城中。","ans":"（1）狼顾：像狼一样回头看。（2）望：向远处看。（3）瞰：从高处往下看。差异：“望”是远距离向前看；“瞰”是从高处向下看。","score":6},{"t":"w","n":39,"stem":"根据下列例句归纳古汉语名量表示法的格式，并将例句序号归入相应格式。（1）今人有五子，不爲多。（2）翼日戊午，乃社于新邑，牛一、羊一、豕一。（3）齊金百斤，車馬十駟。（4）百畝之田，勿奪其時。","ans":"（1）数词+名词；（2）名词+数词；（3）名词+数词+量词；（4）数词+量词+名词。","score":8}]},{"title":"五、古文翻译题","meta":"本大题共6小题，每小题2分，共12分。把下面短文中画线的句子译成现代汉语。","passage":"管仲曰：‘吾始困時，嘗與鮑叔賈，分財利多自與，鮑叔不以我爲貪，知我貧也；吾嘗爲鮑叔謀事而更窮困，鮑叔不以我爲愚，知時有利不利也；吾嘗三仕三見逐於君，鮑叔不以我爲不肖，知我不遭時也；吾嘗三戰三走，鮑叔不以我爲怯，知我有老母也；公子糾敗，召忽死之，吾幽囚受辱，鮑叔不以我爲無恥，知我不羞小節而恥功名不顯於天下也。生我者父母，知我者鮑子也。’鮑叔既進管仲，以身下之。子孫世祿於齊，有封邑者十餘世，常爲名大夫。天下不多管仲之賢而多鮑叔能知人也。","items":[{"t":"w","n":40,"stem":"嘗與鮑叔賈","ans":"曾经和鲍叔牙一起经商。","score":2},{"t":"w","n":41,"stem":"鮑叔不以我爲不肖","ans":"鲍叔牙不认为我没有才能。","score":2},{"t":"w","n":42,"stem":"召忽死之","ans":"召忽为公子纠而死。","score":2},{"t":"w","n":43,"stem":"知我不羞小節","ans":"知道我不以小节为羞耻。","score":2},{"t":"w","n":44,"stem":"子孫世祿於齊","ans":"子孙后代在齐国世代享受俸禄。","score":2},{"t":"w","n":45,"stem":"多鮑叔能知人也","ans":"称赞鲍叔牙能够识别人才。","score":2}]},{"title":"六、古文标点题","meta":"本题12分。","items":[{"t":"p","n":46,"stem":"用现代标点符号标点下面的文言短文。","passage":"蘇代爲燕說齊未見齊王先說淳于髡曰人有賣駿馬者比三旦立市人莫之知往見伯樂曰臣有駿馬欲賣之比三旦立於市人莫與言願子還而視之去而顧之臣請獻一朝之賈伯樂乃還而視之去而顧之一旦而馬價十倍今臣欲以駿馬見於王莫爲臣先後者足下有意爲臣伯樂乎臣請獻白璧一雙黃金萬鎰以爲馬食淳于髡曰謹聞命矣","ans":"蘇代爲燕說齊，未見齊王，先說淳于髡曰：‘人有賣駿馬者，比三旦立市，人莫之知。往見伯樂曰：“臣有駿馬，欲賣之，比三旦立於市，人莫與言。願子還而視之，去而顧之，臣請獻一朝之賈。”伯樂乃還而視之，去而顧之，一旦而馬價十倍。今臣欲以駿馬見於王，莫爲臣先後者，足下有意爲臣伯樂乎？臣請獻白璧一雙，黃金萬鎰，以爲馬食。’淳于髡曰：‘謹聞命矣。’","score":12}]},{"title":"七、古文阅读题","meta":"本大题共12小题，共20分。阅读下面一段古文，解答文后提出的问题。","items":[{"t":"r","n":47,"passage":"梗陽人有⟪獄⟫，將不勝，⟪請納賂於魏獻子⟫，獻子將許之。⟪閻沒⟫謂叔寬曰：‘與子諫乎！吾主以不⟪賄⟫聞於諸侯，今以梗陽之賄殃之，不可。’二人朝而不退。獻子將食，問誰於庭，曰：‘閻明、叔褒在。’召之，使佐食。比己食，三歎。⟪既飽⟫，獻子問焉，曰：‘人有言曰：“唯食可以忘憂。”吾子一食之間而三歎，何也？’同辭對曰：‘吾小人也，貪。饋之始至，懼其不足，故歎。中食而自咎也。曰：“豈主之食而有不足？”是以再歎。主之既食，願以小人之腹，爲君子之心，適⟪厭⟫而已，是以三歎。’獻子曰：‘善。’乃辭梗陽人。","score":20,"subs":[{"n":47,"grp":"（一）解释文中加着重号词语的意义。（6分）","stem "stem":"结合具体作品，论述杜甫诗歌的诗史性质。","ans":"杜甫的诗歌形象真实地反映了安史之乱前后的时代动乱，是时代的一面镜子，故有“诗史”之誉。（1）杜诗具有史的认识价值，以时事入诗而含热泪深情，尖锐细密地观察与写实，直面社会现实，如“三吏”“三别”、《忆昔》。（2）杜诗提供了比历史事件更为广阔、具体、生动的生活画面，使人如临其境。（3）从诗中可以感受到当时社会的某些心理状态。","score":14}]}],"qaNotes":[]},{"paper":"gws-2310","subject":"gws","session":"2310","label":"2023年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"“女娲造人”属于（）","score":1,"opts":["创世神话","战争神话","自然灾害神话","先秦传说故事"],"ans":"A"},{"t":"s","n":2,"stem":"《诗经・关雎》的主题是（","score":1,"opts":["叙写夫妇间的深挚情爱","抒发恋爱和相思的甜蜜","表现弃妇的哀怨悲苦","描写征夫的艰辛服役"],"ans":"B"},{"t":"s","n":3,"stem":"从反映的社会人生内涵上说，《诗经・新台》属于（）","score":1,"opts":["史诗","婚恋诗","政治讽喻诗","人生哲理诗"],"ans":"C"},{"t":"s","n":4,"stem":"《诗经》按音乐分为风、雅、颂三类，其中雅是指（）","score":1,"opts":["各地不同的音乐","人文士大夫宴饮音乐","宗庙祭祀用的音乐","王朝京畿地区音乐"],"ans":"D"},{"t":"s","n":5,"stem":"属于编年史的史书是（ ）","score":1,"opts":["《尚书》","《左传》","《国语》","《逸周书》"],"ans":"B"},{"t":"s","n":6,"stem":"先秦诸子中，曾创作“赋”是（）","score":1,"opts":["庄子","孟子","荀子","韩非子"],"ans":"C"},{"t":"s","n":7,"stem":"贾谊、晁错散文的共同特点是（）","score":1,"opts":["气势犀利","引经据典","排比铺叙","质实朴厚"],"ans":"C"},{"t":"s","n":8,"stem":"刘向《新序》《说苑》特点是（）","score":1,"opts":["笔墨简短","刻画精细","文气盛壮","夹叙夹议"],"ans":"A"},{"t":"s","n":9,"stem":"司马相如的代表作是（）","score":1,"opts":["《吊屈原赋》《鵩鸟赋》","《子虚赋》《上林赋》","《校猎赋》《长杨赋》","《遂初赋》《甘泉赋》"],"ans":"C"},{"t":"s","n":10,"stem":"汉武帝《李夫人赋》的艺术特点是（","score":1,"opts":["情思浓烈","铺张扬厉","质朴无华","繁难华丽"],"ans":"A"},{"t":"s","n":11,"stem":"东方朔《答客难》《非有先生传》的创作特点是（）","score":1,"opts":["借景抒情","托物言志","抒情浓烈","抒情冷静"],"ans":"C"},{"t":"s","n":12,"stem":"玉褒《洞箫赋》在艺术表现上的特点是（）","score":1,"opts":["咏物自况","单纯咏物","借物喻理","直抒胸臆"],"ans":"A"},{"t":"s","n":13,"stem":"《文选》《玉台新咏》中收录的所谓“苏李诗”属于（）","score":1,"opts":["四言诗","五言诗","七言诗","杂言诗"],"ans":"B"},{"t":"s","n":14,"stem":"汉代乐府民歌《东门行》的主题是（","score":1,"opts":["反映对战争的厌倦","反映爱情婚姻","倾诉生活艰难困顿","表现人生哲理"],"ans":"C"},{"t":"s","n":15,"stem":"王粲诗歌艺术特点是（ ）","score":1,"opts":["醉气平和","抒情深切","炽烈热情","纤丽清新"],"ans":"B"},{"t":"s","n":16,"stem":"关于阮籍《咏怀诗》描述正确的是（ ）","sc 中运用最多的表现手法，可以直接叙事，也可以直接刻画描写，还可以直言其志或直抒胸臆。（2）比一般说就是比喻。（3）兴大体来说就是起兴或发端，一般处在一首诗或一章诗的开头位置。就其与诗歌情思的关系来看，基本有相关和不相关两种情形。","score":5},{"t":"w","n":41,"stem":"简述《左传》的写人艺术。","ans":"（1）《左传》刻画了许多性格鲜明的人物形象，并注意刻画人物性格的多个侧面，甚至能够写出人物性格的发展。（2）《左传》写人的基本艺术规则，一是以言语、行为表现人物性格特征，二是把人物置入矛盾冲突的环境中塑造。","score":5},{"t":"w","n":42,"stem":"简述左思诗歌思想内容上的特点。","ans":"（1）左思的诗歌有一种建功立业、功成身退的阔大胸怀。（2）左思的诗歌充满着一种悲愤不平之气。","score":5},{"t":"w","n":43,"stem":"简述唐传奇的艺术成就。","ans":"（1）唐传奇标志着中国古代小说艺术的渐趋成熟。（2）唐传奇塑造了众多栩栩如生的人物形象。（3）唐传奇情节波澜起伏，语言凝练传神。","score":5}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述汉乐府民歌的文学价值。","ans":"（1）题材的承变：汉乐府民歌继续咏唱与百姓生活息息相关、感受深刻的生活内容，并增加倾诉生活艰难和漂泊流荡、表达人生哲理等题材。（2）艺术表现手法的演变：叙事成分增多，抒情真挚浓郁，句式以杂言和五言为主，语言质朴浅白、富于表现力。","score":14},{"t":"w","n":45,"stem":"论述高适与岑参边塞诗的异同。","ans":"相同点：（1）二人诗歌都根据亲临边塞的实际生活体验写成。（2）反映现实的深度超过同时的许多诗人。（3）诗歌蕴涵慷慨悲壮之美。不同点：（1）高适以质实的古体见长，岑参擅长七言歌行和七言绝句。（2）高适诗慷慨昂扬，岑参诗奇伟壮丽。","score":14}]}],"qaNotes":[]},{"paper":"gws-2410","subject":"gws","session":"2410","label":"2024年10月","code":"00538","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"“后羿射日”属于","opts":["创世神话","自然灾害神话","战争神话","发明创造神话"],"ans":"B","score":1},{"t":"s","n":2,"stem":"以下不属于“《春秋》三传”的是","opts":["《春秋左氏传》","《春秋公羊传》","《春秋穀梁传》","《春秋外传》"],"ans":"D","score":1},{"t":"s","n":3,"stem":"屈原自叙生平的长篇抒情诗是","opts":["《离骚》","《山鬼》","《天问》","《招魂》"],"ans":"A","score":1},{"t":"s","n":4,"stem":"“悲哉，秋之为气也！萧瑟兮，草木摇落而变衰”出自","opts":["屈原《湘君》","屈原《悲回风》","宋玉《九辩》","宋玉《风赋》"],"ans":"C","score":1},{"t":"s","n":5,"stem":"以下语句出自《孟子》的是","opts":["五色令人目盲，五音令人耳聋","青，取之于蓝，而青于蓝","老吾老，以及人之老","夫大块噫气，其名为风"],"ans":"C","score":1},{"t":"s","n":6,"stem":"贾谊最负盛名的史论散文是","opts":["《论积贮疏》","《治安策》","《论贵粟疏》","《过秦论》"],"ans":"D","score":1},{"t":"s","n":7,"stem":"刘向散文《新序》《说苑》的写人手法继承了","opts":["《左传》","《战国策》","《史记》","《国语》"],"ans":"A","score":1},{"t":"s","n":8,"stem":"张汤讯鼠的故事见于《史记》中的","opts":["《酷吏列传》","《李斯列传》","《万石张叔列传》","《魏其武安侯列传》"],"ans":"A","score":1},{"t":"s","n":9,"stem":"汉武帝读到某篇作品时，感叹“不得与此人同时”。该作品是" t":"m","n":34,"stem":"下列诗句属于李白的有","opts":["“玉阶生白露，夜久侵罗袜”","“荷风送香气，竹露滴清响”","“大道如青天，我独不得出”","“我歌月徘徊，我舞影零乱”","“古来圣贤皆寂寞，惟有饮者留其名”"],"ans":"ACDE","score":2},{"t":"m","n":35,"stem":"下列关于大历“十才子”诗歌特色的表述正确的有","opts":["意境浑融一气","过于讲究描写技巧而显雕琢","偏爱使用描述性意象","境界开阔高远","词语往往带有凄清萧瑟乃至暗淡的色彩"],"ans":"ABCE","score":2}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《天问》","ans":"《天问》是屈原作品中最为奇特的诗歌，针对自然现象、神话传说和远古历史、社会现实等一口气提出170多个问题，体现了诗人的见识广博、思想深刻以及勇于怀疑和批判的精神。","score":3},{"t":"term","n":37,"stem":"李斯","ans":"（1）李斯的创作包括奏议和刻石文。（2）《谏逐客书》铺陈排比，有纵横之气；刻石文铺叙颂夸，气度宏伟，韵律谐和。","score":3},{"t":"term","n":38,"stem":"《洛阳伽蓝记》","ans":"杨衒之的《洛阳伽蓝记》属历史笔记，也是写景状物的散文。书中主要是对佛寺的描写，有的篇章写得精致；该书是历史散文，具有极高的史料价值。","score":3},{"t":"term","n":39,"stem":"“小李杜”","ans":"杜牧和李商隐同为晚唐七绝成就最高的诗人，世称“小李杜”。","score":3}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"w","n":40,"stem":"简述我国神话对后世文学发展的影响。","ans":"（1）神话的艺术规则为后世文学的发展提示了方向。一方面，神话所开创的为人生的主题，事实上成为我国数千年文学发展的主流和传统；另一方面，神话富于情感、形象和想象的特征，引导了后世文学审美理想的发展走向。（2）丰富多彩的神话作品，成为后世文学创作取之不尽、用之不竭的题材源泉。从最早的文学总集《诗经》到近现代文学创作，从诗歌散文到戏曲小说，无不得到神话的滋养。","score":5},{"t":"w","n":41,"stem":"简述《离骚》永恒的精神价值。","ans":"（1）《离骚》是屈原自叙生平的长篇抒情诗，他的情感和思想都熔铸在其中。（2）表现“美政”理想和深沉的爱国情感。（3）体现追求理想九死不悔的坚韧品格和嫉恶如仇的批判精神。","score":5},{"t":"w","n":42,"stem":"简述张衡在赋史上的地位。","ans":"张衡是赋史上承前启后的作家。代表作《二京赋》规模、容量和篇幅都超过前人，铺陈胪列，细致描绘，成为汉代京都赋的极致；《归田赋》是东汉抒情小赋的开山之作。","score":5},{"t":"w","n":43,"stem":"简述张若虚《春江花月夜》的艺术成就。","ans":"（1）“孤篇横绝，竟为大家”“诗中的诗，顶峰上的顶峰”。（2）这是一首长篇歌行，采用乐府旧题但赋予全新内容，将画意、诗情与对宇宙奥秘和人生哲理的体察融为一体，创造出情景交融、玲珑透彻的诗境。","score":5}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"w","n":44,"stem":"论述谢灵运山水诗的艺术特点。","ans":"（1）创造了一种山水诗的结构模式。（2）在局部景物描写中，通过细腻的观察与把握和具体画面，表现景观的情思韵味、情景交融。（3）对山水景物的声、光、色都有生动的描绘。（4）其山水诗发展尚未达到构造完整意境的阶段，处于有佳句而无佳篇的层次。","score":14},{"t":"w","n":45,"stem":"结合具体作品，论述杜甫诗歌的诗史性质。","ans":"杜甫的诗歌形象真实地反映了安史之乱前后的时代动乱，是时代的一面镜子，故有“诗史”之誉。（1）杜诗具有史的认识价值，以时事入诗而含热泪深情，尖锐细密地观察与写实，直面社会现实，如“三吏”“三别”、《忆昔》。（2）杜诗提供了比历史事件更为广阔、具体、生动的生活画面，使人如临其境。（3）从诗中可以感受到当时社会的某些心理状态。","score":14}]}],"qaNotes":[]},{"paper":"gws-2510","subject":"gws","session":"2510","label":"2025年10月","sections":[{"title":"一、单项选择题","meta":"本大题共30小题，每小题1分，共30分。","items":[{"t":"s","n":1,"stem":"《诗经》中最著名的农事诗是","score":1,"opts":["《七月》","《芣苢》","《大田》","《良耜》"],"ans":"A","ana":"《七月》详细描绘了农夫一年的农事活动与生活情景,是《诗经》中最具代表性的农事诗;B 项是采集诗,C、D 项虽涉农事但知名度与完整性不及《七月》。"},{"t":"s","n":2,"stem":"“知我者谓我心忧,”不知我者谓我何求出自《诗经》中的","score":1,"opts":["《伐檀》","《黍离》","《月出》","《关雎》"],"ans":"B","ana":"诗句表达了流浪者的忧愁,出自《王风·黍离》诗,D;A 项讽喻统治者不劳而获,C 项是爱情项为经典婚恋诗。"},{"t":"s","n":3,"stem":"先秦时期最具文学色彩的历史散文是","score":1,"opts":["《左传》","《战国策》","《尚书》","《国语》"],"ans":"A","ana":"《左传》叙事详备、情节生动,文学性极强;B 项以纵横家言论为主,C 项文字古奥晦涩,D 项文学色彩不及《左传》。"},{"t":"s","n":4,"stem":"《战国策》的整理编订者是","score":1,"opts":["司马迁","班固","蔡邕","刘向"],"ans":"D","ana":"西汉刘向整理编订战国时期各国史料,定名《战国策》;A 项著《史记》,B 项著《汉书》,C 项为东汉文学家、书法家。"},{"t":"s","n":5,"stem":"被闻一多誉为“文章家的极致”的著作是","score":1,"opts":["《孟子》","《荀子》","《庄子》","《韩非子》"],"ans":"C","ana":"《庄子》文辞奇幻、想象丰富,极具文学性,获闻一多此誉;A 项善雄辩,B 项文风严谨,D 项以峻刻著称。"},{"t":"s","n":6,"stem":"堪称“千古吟秋绝唱”的作品是宋玉的","score":1,"opts":["《风赋》","《神女赋》","《高唐赋》","《九辩》"],"ans":"D","ana":"《九辩》以悲秋为核心,情感深沉,是千古吟秋佳作;A 项写风的不同,B、C 项描绘神女与高唐景象。"},{"t":"s","n":7,"stem":"诸子百家中对李斯散文的文风影响最大的是","score":1,"opts":["儒家","道家","纵横家","墨家"],"ans":"C","ana":"李斯散文气势磅礴、善辩服人,受纵横家铺陈张扬、纵横捭阖的文风影响最深;A 项重仁政,B 项尚自然,D 项贵节俭,均与李斯文风不符。"},{"t":"s","n":8,"stem":"刻舟求剑的故事出自","score":1,"opts":["《吕氏春秋》","《战国策》","《墨子》","《吴越春秋》"],"ans":"A","ana":"刻舟求剑出自《吕氏春秋·察今》,讽刺墨守成规者;B 项多记纵横家事迹,C 项为墨家典籍,D 项记吴越历史。"},{"t":"s","n":9,"stem":"《潜夫论》的作者是","score":1,"opts":["桓谭","王符","王充","仲长统"],"ans":"B","ana":"东汉王符著《潜夫论》,抨击社会弊端;A 项著《新论》,C 项著《论衡》,D 项著《昌言》。"},{"t":"s","n":10,"stem":"以“究天人之际,通古今之变”为著述理想的史学家是","score":1,"opts":["班固","刘向","陈寿","司马迁"],"ans":"D","ana":"司马迁在《报任安书》中提出该理想,用于创作《史记》;A 项著《汉书》,B 项整理古籍,C 项著《三国志》。"},{"t":"s","n":11,"stem":"以下不属于司马相如赋作的是","score":1,"opts":["《子虚赋》","《长门赋》","《上林赋》","《长杨赋》"],"ans":"D","ana":"《长杨赋》是扬雄的作品;A、B、C 项均为司马相如代表作,其中《子虚赋》《上林赋》是汉大赋典范。"},{"t":"s","n":12,"stem":"以下汉乐府作品中不属于婚恋诗的是","score":1,"opts":["《江南》","《相逢行》","《有所思》","《上邪》"],"ans":"B","ana":"《相逢行》描写富贵人家的奢华生活,非婚恋主题;A 项是爱情诗,C、D 项表达坚贞的爱情誓言。"},{"t":"s","n":13,"stem":"以下诗句出自《古诗十九首·行行重行行》的是","score":1,"opts":["思君令人老,岁月忽已晚","四顾何茫茫,东风摇百草","生年不满百,常怀千岁忧","盈盈一水间,脉脉不得语"],"ans":"A","ana":"A 项出自《行行重行行》,表达思念之情;B 项出自《回车驾言迈》,C 项出自《生年不满百》,D 项出自《迢迢牵牛星》。"},{"t":"s","n":14,"stem":"作品被评“为汉末实录,真诗史也”的诗人是","score":1,"opts":["曹操","曹丕","王粲","曹植"],"ans":"A","ana":"曹操的诗歌反映了汉末战乱与社会现实,被称为汉末实录;B 项多写宴游与爱情,C项为建安七子之一,D 项诗歌以才情著称。"},{"t":"s","n":15,"stem":"下列不属于对曹植的评价是","score":1,"opts":["骨气奇高","才高八斗","辞采华茂","七子之冠冕"],"ans":"D","ana":"七子之冠冕是对王粲的评价;A、B、C 项均是对曹植的赞誉,体现其诗歌成就与才情。"},{"t":"s","n":16,"stem":"蔡琰的代表作是","score":1,"opts":["《幽愤诗》","《七哀诗》","《悲愤诗》","《孤儿行》"],"ans":"C","ana":"蔡琰的《悲愤诗》叙述自身战乱中被俘的遭遇,情感真挚;A 项是嵇康的作品,B 项为王粲代表作,D 项是汉乐府民歌。"},{"t":"s","n":17,"stem":"对正始士人心态及诗歌创作影响最大的思潮是","score":1,"opts":["玄学","儒学","佛学","法家思想"],"ans":"A","ana":"正始时期玄学盛行,士人崇尚老庄、清谈玄理,其心态与诗歌创作均受玄学深刻影响;B 项在汉代为主流,C 项此时尚未广泛传播,D 项影响有限。"},{"t":"s","n":18,"stem":"开后代左思《咏史》、陶渊明《饮酒》组诗先河的抒情组诗是","score":1,"opts":["曹操《步出夏门行》","嵇康《赠兄秀才入军》","《古诗十九首》","阮籍《咏怀》"],"ans":"D","ana":"阮籍《咏怀》组诗共82响了左思、陶渊明的组诗创首,借咏怀抒发感慨,开创了以组诗形式抒情言志的先河,影作。"},{"t":"s","n":19,"stem":"诗歌创作被《世说新语·文学》誉为“烂若舒锦”的诗人是","score":1,"opts":["陆机","潘岳","左思","张载"],"ans":"B","ana":"《世说新语·文学》评价潘岳诗歌辞采华美如展开的锦缎;A 项文风繁缛,C 项诗风刚健,D 项作品流传较少。"},{"t":"s","n":20,"stem":"苏轼“质而实绮，癯而实腴”评价的是","score":1,"opts":["陶渊明","王羲之","嵇康","曹丕"],"ans":"A","ana":"苏轼此评价赞陶渊明诗歌表面质朴,实则内涵丰富、辞采华美;B 项是书法家,C 项诗风清峻,D 项诗歌清丽。"},{"t":"s","n":21,"stem":"“池塘春草谢家春，万古千秋五字新”评价的是谢灵运的","score":1,"opts":["《登池上楼》","《登永嘉绿嶂山诗》","长于抒情","《七里濑》"],"ans":"A","ana":"诗句赞誉谢灵运《登池上楼》中池塘生春草一句清新自然、千古传诵;B、D 项是其山水诗,C 项是诗歌特点非作品。"},{"t":"s","n":22,"stem":"《搜神记》的作者是","score":1,"opts":["张华","曹丕","干宝","刘义庆"],"ans":"C","ana":"东晋干宝编撰《搜神记》,是志怪小说的代表作;A 项著《博物志》,B 项著《列异传》,D 项著《世说新语》。"},{"t":"s","n":23,"stem":"“人归落雁后,思发在花前”的作者是","score":1,"opts":["卢思道","薛道衡","虞世南","上官仪"],"ans":"B","ana":"诗句出自薛道衡的《人日思归》,表达思乡之情;A 项是北齐诗人,C、D 项是初唐诗人。"},{"t":"s","n":24,"stem":"初唐四杰中王勃、杨炯最擅长的诗体是","score":1,"opts":["五言律诗","七言律诗","绝句","歌行"],"ans":"A","ana":"王勃《送杜少府之任蜀州》、杨炯《从军行》均为五言律诗佳作,二人对五言律诗的成熟贡献突出;B 项尚未成熟,C、D 项非其最擅长。"},{"t":"s","n":25,"stem":"《遥同杜员外审言过岭》被后人称为初唐七律样板,其作者是","score":1,"opts":["沈佺期","宋之问","张若虚","陈子昂"],"ans":"A","ana":"沈佺期的这首诗格律严谨,是初唐七律的典范之作;B 项亦为初唐律诗代表,C 项著《春江花月夜》,D 项倡导汉魏风骨。"},{"t":"s","n":26,"stem":"“孤篇横绝,竟为大家”评价的诗歌作品是","score":1,"opts":["《代悲白头翁》","《长安古意》","《春江花月夜》","《登高》"],"ans":"C","ana":"张若虚的《春江花月夜》意境优美、内涵深厚获此赞誉;A 项是刘希夷作品,B 项是卢照邻作品,D 项是杜甫作品。"},{"t":"s","n":27,"stem":"“气蒸云梦泽,波撼岳阳城”是《临洞庭湖赠张丞相》的","score":1,"opts":["首联","颔联","颈联","尾联"],"ans":"B","ana":"律诗分为首联(一、二句)、颔联(三、四句)、颈联(五、六句)、尾联(七、八句),该句是诗的第三、四句,为颔联。"},{"t":"s","n":28,"stem":"“杨花落尽子规啼，闻道龙标过五溪”中“龙标”指的是","score":1,"opts":["王之涣","王翰","岑参","王昌龄"],"ans":"D","ana":"王昌龄曾任龙标尉,世称王龙标,诗中与龙标无龙标代指王昌龄;A、B、C 项均为唐代诗人,关。"},{"t":"s","n":29,"stem":"花间词派的鼻祖是","score":1,"opts":["韦庄","温庭筠","冯延巳","李煜"],"ans":"B","ana":"温庭筠是晚唐词人,其词多写闺情,辞藻华丽,被尊为花间词派鼻祖;A 项是花间派重要词人,C、D 项为南唐词人。"},{"t":"s","n":30,"stem":"晚唐小品文的代表作家不包括","score":1,"opts":["皮日休","陆龟蒙","柳宗元","罗隐"],"ans":"C","ana":"柳宗元是中唐古文运动代表,并非晚唐小品文作家;A、B、D 项均为晚唐小品文代表,作品多讽刺现实。"}]},{"title":"二、多项选择题","meta":"本大题共5小题，每小题2分，共10分。错选、多选或少选均无分。","items":[{"t":"m","n":31,"stem":"以下属于贾谊散文作品的有","score":2,"opts":["《治安策》","《论积贮疏》","《过秦论》","《论贵粟疏》","《言兵事疏》"],"ans":"ABC","ana":"D 项是晁错的作品,E 项是晁错的奏疏;A、B、C 项均为贾谊的经典散文,针砭时弊、见解深刻。"},{"t":"m","n":32,"stem":"以下有关玄言诗的表述正确的有","score":2,"opts":["发端自正始时代","在东晋诗坛占据主流地位","长于抒情","以谈论老庄玄理为主","为山水诗的成熟和发展奠定了基础"],"ans":"ABDE","ana":"玄言诗以阐释老庄玄理为核心,不长于抒情,C 项错误;A、B、D、的特点E 项均符合玄言诗与影响。"},{"t":"m","n":33,"stem":"元嘉三大家指的是","score":2,"opts":["颜延之","谢灵运","鲍照","沈约","谢惠连"],"ans":"ABC","ana":"元嘉三大家是南朝宋文帝元嘉年间的三位诗人,即颜延之、谢灵运、鲍照;D 项是永明体代表,E 项是谢灵运族弟。"},{"t":"m","n":34,"stem":"以下作品属于唐传奇的有","score":2,"opts":["《枕中记》","《游仙窟》","《莺莺传》","《李娃传》","《三王墓》"],"ans":"ABCD","ana":"E 项《三王墓》出自《搜神记》,是志怪小说;A、B、C、D 项均为唐代传奇代表作,情节完整、人物鲜明。"},{"t":"m","n":35,"stem":"以下诗句属于李商隐的有","score":2,"opts":["身无彩凤双飞翼,心有灵犀一点通","庄生晓梦迷蝴蝶,望帝春心托杜鹃","永忆江湖归白发,欲回天地入扁舟","商女不知亡国恨,隔江犹唱后庭花","嫦娥应悔偷灵药,碧海青天夜夜心"],"ans":"ABCE","ana":"D 项出自杜牧的《泊秦淮》;A 项出自《无题·昨夜星辰昨夜风》,B 项出自《锦瑟》,C 项出自《安定城楼》,E 项出自《嫦娥》,均为李商隐诗作。"}]},{"title":"三、名词解释题","meta":"本大题共4小题，每小题3分，共12分。","items":[{"t":"term","n":36,"stem":"《古诗十九首》","score":3,"ans":"(1)是最早见于《文选》的十九首无主名的五言诗。(2)非一时一人之作,产生于东汉顺帝末到献帝前。(3)内容上基本是游子思妇之辞。"},{"t":"term","n":37,"stem":"王粲","score":3,"ans":"(1)是建安七子之一,在七子中诗、赋最佳。(2)代表作有《七哀诗》等。(3)其诗歌的艺术特点在于抒情深切,慷慨悲凉,文辞秀美。"},{"t":"term","n":38,"stem":"《闲情赋》","score":3,"ans":"[原文字段疑似转录错误，待对照可靠答案源复核] (1)是陶渊明的赋作。(2)表达的是对意切,辞采绮丽中女子的深切思念。(3)极为细腻,譬喻妙。"},{"t":"term","n":39,"stem":"“高岑”","score":3,"ans":"(1)指的是高适、岑参。(2)二人是唐代边塞诗派的代表作家。"}]},{"title":"四、简答题","meta":"本大题共4小题，每小题5分，共20分。","items":[{"t":"short","n":40,"stem":"简析《孟子》文章的主要特点。","score":5,"ans":"(1)最突出的是它的雄辩色彩。(2)善于以典型事例、比喻和寓言说理。"},{"t":"short","n":41,"stem":"简述扬雄对大赋创作的拓展。","score":5,"ans":"(1)拓展了大赋的题材领域。(2)进一步加强了大赋“劝百讽一”的劝谕色彩。(3)艺术表现上有了新的变化。"},{"t":"short","n":42,"stem":"简析《西洲曲》的艺术特点。","score":5,"ans":"(1)情思缠绵,写景秀丽。(2)语言清新明丽。(3)换韵造成回环婉转的效果。"},{"t":"short","n":43,"stem":"简述韩愈、柳宗元的古文理论主张。","score":5,"ans":"(1)提出“文以明道”的观念，确定了古文创作的指导思想。(2)提出“不平则鸣”的口号。(3)提出“唯陈言之务去”的主张。"}]},{"title":"五、论述题","meta":"本大题共2小题，每小题14分，共28分。","items":[{"t":"essay","n":44,"stem":"论述《离骚》的艺术表现成就。","score":14,"ans":"(1)浓烈的激情和奇幻的想象。(2)峻洁纯美、独立不屈的抒情主人公形象。(3)比兴手法的拓展。(4)结构上虚实结合;形式上韵散结合;语言富于艺术表现力。"},{"t":"essay","n":45,"stem":"论述杜甫诗歌的艺术风格及其对后世的影响。","score":14,"ans":"(1)主要风格特征是沉郁顿挫,其感情基调是悲慨。(2)沉郁,指其感情的悲慨壮大深厚;顿挫,指其感情的表达波浪起伏、反复低回。(3)杜甫是诗歌史上一位承先启后的人物,至宋代成为作诗效法的最高典范。(4)在思想情操与士人人格的形成上,对后世产生重大影响。"}]}],"code":"00538","qaNotes":[]},{"paper":"marx-2104","subject":"marx","session":"2104","label":"2021年4月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。","items":[{"n":1,"t":"s","score":2,"stem":"马克思主义是指（ ）。","opts":["仅指马克思的理论","仅指马克思和恩格斯的理论","包括所有称为“马克思主义”的理论","包括马克思和恩格斯及其后继者的理论"],"ans":"D","ana":"马克思丰义是由马克思、思格斯创立前，为他们前后维者所发展们，以反对资本主 义、建设补会主义和共产主义为目标的科学前理论体系，或者简要地说，它是关下尢产阶级 和人类解放前科学。"},{"n":2,"t":"s","score":2,"stem":"马克思主义的革命性表现在（ ）。","opts":["崇高的社会理想和坚实的实践基础","彻底的批判主义和鲜明的政治立场","丰富的理论来源和科学的理论内涵","完备的理论体系和严密的逻辑结构"],"ans":" ore":2,"stem":"人的本质是一切社会关系的总和，这句话是在强调（ ）。","opts":["人与人的区别","人与动物的区别","一切人共有的本质","人的肉体存在及其特性"],"ans":"A","ana":"马克思在《关下费尔巴哈提纲》中说：“人前本质不是单个人所固有前抽象物， 在其现实性上，它是一切社会关系钓总和。”“人前本顾是一切社会关系前总和”这一对人 前本质前界定，讲的不是人与动物前区别，而是人与人之间前这别，既包括不同时代前人之 间前区别，又包含同-时代处于不同社会地位的人之间前区别。所以它讲的不是 切人所有 的共同本质，而是不同们人所具有前不同前本质，即人韵具体本质。"},{"n":14,"t":"s","score":2,"stem":"单位商品的价值量与生产该商品的劳动率的关系是（ ）。","opts":["成正比","成反比","同比例变化","没有关系"],"ans":"B","ana":"商品价值与劳动生产率成反比。"},{"n":15,"t":"s","score":2,"stem":"劳动力成为商品的基本条件是（ ）。","opts":["劳动者丧失一切生活资料和生产资料","劳动者拥有人身自由且丧失一切生活资料和生产资料","劳动者拥有人身自由且丧失一切生活资料","劳动者有人身自由且丧失一切生产资料"],"ans":"B","ana":"劳动力成为商品必须县备两个基本条件。意识劳动者有人身白由，劳动者必须有权 支配自己前劳动力，才可能把它作为商品出卖，二是劳动者丧失了一切生产资料和生活资料， 除了自己前劳动力以外-无所有，必须靠出卖劳动力为生。"},{"n":16,"t":"s","score":2,"stem":"下列选项中不属于资本积累后果的是（ ）。","opts":["工作日的延长","相对过剩人口的形成","资本有机构成提高","贫富两极化扩大"],"ans":"A","ana":"资本积累前后果主要有三个：一是资本有机构成们提高，二是相对过剩人口即尖业 人口前形成，三是严重前贫言两极分化。"},{"n":17,"t":"s","score":2,"stem":"资本主义政治制度的核心是（ ）。","opts":["国家制度","政党制度","民主制度","选举制度"],"ans":"A","ana":"资本主义政治制度就是资产阶级为实现其阶级专政而采取前统治方式和方法及各种 相关制度前总和。它主要包括资本主义前国家制度、政党制度、选举制度、三杈分立制度、 民主制度等。其中国家制度是资本主义政治制度前核心。"},{"n":18,"t":"s","score":2,"stem":"各主要资本主义国家在进入国家垄断资本主义阶段之前所处的阶段是（ ）。","opts":["自由竞争","私人垄断","垄断竞争","寡头垄断"],"ans":"B","ana":"一白多年来，垄脚资本主义在丰要资本主义国家有很火发展，特别是第二次世界 大战以后，垄断资本丰义又有了一些新的发展变化。这以前们垄断丰要是私人垄断，或称一 般华断，第二次世界大战后出现了国家华断资本主义，国家或者说政权的力量H益深人地介 人到社会经济生活的各个领域，国家垄断取代私人垄断成为西方发达国家当代资本主义发展 雨新形式、新特征。"},{"n":19,"t":"s","score":2,"stem":"当发生金融危机时，资本主义国家为某些私人企业注入一部分资金，这是（ ）。","opts":["资本主义国家建立国有经济和国有企业的一种方式","资本主义国家为管理国民经济计划的一种方式","国家和私人企业的外部结合","国家与私人企业的内部结合"],"ans":"D","ana":"国家和私人资本在企业内部结合，也即资本主义国家中的国有资本与私人资本结 合在一个企业中经济形式。这种结合，既可以是国家和私人资不共同投资于一个新企业， 也可以是国家通过出售一部分国有企业的股份，从而形成国家和私人资本共有的企业，也可 以通过国家收购一部分原私有企业的股份而形成国家与私人资本相结合们企业。"},{"n":20,"t":"s","score":2,"stem":"当代国际垄断组织最主要的形式是（ ）。","opts":["国际卡特尔、辛迪加和托拉斯","国际辛迪加、托拉斯和跨国公司","国际托拉斯和国家垄断资本主义的国际垄断同盟","跨国公司和国家垄断资本主义的国际垄断同盟"],"ans":"D","ana":"当代国际垄断组织形式则以跨国公司和国家垄断资本主义国际垄断同盟为主。"},{"n":21,"t":"s","score":2,"stem":"为全社会占有生产资料和共同组织社会化大生产准备了最充分的物质条件和经济条件的是（ ）。","opts":["自由竞争资本主义的产生和发展","国家垄断资本主义的产生和发展","国家经济的产生和发展","世界市场的产生和发展"],"ans":"B","ana":"国家垄断资本主义产生和发展，为全社会占有生产资料和共同组织社会化生产准 备了最充分物质条件和经济条件。"},{"n":22,"t":"s","score":2,"stem":"《乌托邦》为早期空想社会主义的著作，其作者为（ ）。","opts":["傅立叶","圣西门","康帕内拉","莫尔"],"ans":"D","ana":"早期空想社会丰义前代表作是英国莫尔写们《乌托邦》和意人利人康帕内拉写前《太 阳城》。他们在自己的著作中无情地批判了资本主义前种种军恶，但提出和描绘前理想社会 却充满着空想性质。"},{"n":23,"t":"s","score":2,"stem":"第一个无产阶级政党为（ ）。","opts":["共产主义者同盟","中国共产党","俄国布尔什维克党","德国社会民主工党"],"ans":"A","ana":"1847年年底马克思和恩格斯愛世界上第一个无产阶级政党“共产主义者同盟”哟 委托起草并丁1848年2月发表《共产党宣言》，是社会主义思想史上第一个纲领性文 件，它标志着科学社会上义理论公开面世。"},{"n":24,"t":"s","score":2,"stem":"作为人类社会发展的最高社会形态，共产主义的物质基础是（ ）。","opts":["与繁荣的封建社会相当的社会生产力","远远高于以往一切社会的高度发达的社会生产力","与资本主义国家相当的社会生产力","建立在信息化、智能化基础上的社会生产力"],"ans":"B","ana":"共产主义社会是人类社会发展们最高社会形态，它的物质基础，是远远高于以往一 切社会的高度发达社会生产力。"},{"n":25,"t":"s","score":2,"stem":"在社会主义初级阶段，我国的历史使命和共同愿景为（ ）。","opts":["实现国家文明和谐","实现公民自由平等","实现社会公平正义","建立中国特色社会主义"],"ans":"D","ana":"我国当前正处于社会主义初级阶段，建设中国特色社会十义是我雨人民们历火便命 和共阿理想。"}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"n":26,"t":"w","score":6,"stem":"学习运用马克思主义的正确观点是不把它当做教条而是当做行动指南，简述理由。","opts":[],"ans":"（1）马克思主义不是教条，它并不提供对一切问题的现成答案。那种试图从马克思主义经典著作中寻章摘句、寻找解决现实问题直接答案的做法，不仅达不到目的，而且是十分有害的。（2）把马克思主义作为行动的指南，就必须从客观存在的实际出发，而不能从马克思主义的一般原理出发。只有把马克思主义的一般原理与本国的具体实际相结合，才能真正发挥马克思主义的指导作用。"},{"n":27,"t":"w","score":6,"stem":"辩证唯物主义反映论与旧唯物主义反映论对于认识本质的回答有什么不同？","opts":[],"ans":"（1）旧唯物论的机械的反映论认为认识主体是单纯的有生命的存在物；辩证唯物论的能动的反映论则是结合主体的社会性、实践性和能动性考察主客体之间的关系。（2）旧唯物论的机械的反映论对待客体是消极的认识；辩证唯物论的能动的反映论认为认识是反映与创造的统一。"},{"n":28,"t":"w","score":6,"stem":"简述剩余价值生产的基本方法。","opts":[],"ans":"剩余价值的生产方法包括绝对剩余价值生产和相对剩余价值生产。（1）在必要劳动时间不变的条件下，通过延长工作日长度而生产出绝对剩余价值。（2）在工作日长度不变的条件下，通过缩短必要劳动时间而相应延长剩余劳动时间而生产出相对剩余价值。"},{"n":29,"t":"w","score":6,"stem":"国家垄断资本主义的资本输出对输出国的作用。","opts":[],"ans":"（1）为过剩资本找到了出路，并由此获得大量来自海外的高额利润和利息。（2）资本输出是输出国控制输入国的重要手段。（3）资本输出是输出国扩大商品出口的重要手段。（4）资本输出使金融资本的银行网遍布全世界，从而强化了金融资本在世界经济、政治舞台上的统治地位。"},{"n":30,"t":"w","score":6,"stem":"为什么说无产阶级革命是最广泛、最彻底、最深刻的革命？","opts":[],"ans":"（1）无产阶级革命是彻底消灭一切私有制、代之以生产资料公有制的革命。（2）无产阶级革命是要彻底消灭一切阶级剥削和阶级统治的革命。（3）无产阶级革命是为绝大多数人谋利益的运动。无产阶级只有解放全人类才能解放自己，它的阶级利益同广大劳动者的利益是根本一致的。（4）无产阶级革命是不断前进的历史过程。无产阶级必须永葆革命性和先进性，直至实现共产主义。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。","items":[{"n":31,"t":"w","score":10,"stem":"试述尊重客观规律与发挥主观能动性的辩证统一原理及其现实意义。","opts":[],"ans":"（1）尊重客观规律是正确发挥主观能动性的前提。只有正确认识了客观规律，并按规律办事，才能正确发挥人的主观能动性，有效地改造世界。无视或违背规律，盲目蛮干，必然受到规律的惩罚。（2）认识和利用客观规律又必须充分发挥人的主观能动性。只有充分发挥人的主观能动性，反复实践，深入研究，才能揭示隐藏在事物内部的规律，才能顺利实现理论对实践的指导。（3）在改革开放和现代化建设中，既要充分发挥人民群众的积极性和创造性，又要踏踏实实地按客观规律办事；既要实事求是，从实际出发，又要解放思想，开拓创新。"},{"n":32,"t":"w","score":10,"stem":"试述两大社会基本矛盾之间的关系以及两大社会基本矛盾关系在社会发展中的作用。","opts":[],"ans":"（1）生产力决定生产关系，生产关系作为社会的经济基础又决定社会的上层建筑，所以生产力与生产关系之间的矛盾起着主导作用。（2）生产关系对生产力有反作用，上层建筑对经济基础有反作用，经济基础又是联系上层建筑和生产力的中间环节，所以生产力和生产关系之间的矛盾解决，又有赖于经济基础和上层建筑之间的矛盾的解决。（3）社会的基本矛盾是社会发展的基本动力，制约和决定着其他各种社会矛盾，决定着整个社会的面貌，决定着社会发展的必然阶段和客观趋势，决定着社会形态由低级到高级的演进。"},{"n":33,"t":"w","score":10,"stem":"试述货币的起源、本质及职能。","opts":[],"ans":"（1）货币的产生和起源是商品交换长期发展的产物，并不是聪明人的发明，也不是人们协商的结果。通过货币产生的过程可以看出，货币的本质是固定充当一般等价物的商品，它体现着商品经济条件下商品生产者之间的社会经济关系。（2）货币的本质是通过它的职能得到体现的，货币的职能是指货币在社会经济生活中的作用。在发达的商品经济中，货币有价值尺度、流通手段、贮藏手段、支付手段、世界货币五种职能，其中价值尺度和流通手段是货币最基本的职能。（3）货币的价值尺度职能是指货币是衡量和计算一切商品价值量大小的社会尺度。货币的流通手段职能是指货币起着商品交换媒介的作用。货币的贮藏手段职能是指货币退出流通领域，作为社会财富的一般代表而被保存起来。货币的支付手段职能是指在商品赊购赊销过程中，当到期偿还货款时货币所执行的还款职能，以及用于清偿债务，支付税赋、租金、工资等所执行的职能。货币的世界货币职能，是指货币超出一国的范围，在世界市场上发挥一般等价物的作用。"}]}],"qaNotes":[]},{"paper":"marx-2110","subject":"marx","session":"2110","label":"2021年10月","code":"03709","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"马克思主义产生于19世纪（）。","score":2,"ans":"A","opts":["40年代","50年代","60年代","70年代"],"ana":"马克思主义产生于19世纪40年代。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了客观条件；工人阶级作为一支独立的政治力量登上历史舞台，进行反对资本主义制度和资产阶级统治的斗争，为马克思主义的产生准备了阶级基础。"},{"t":"s","n":2,"stem":"下列各项集中表现马克思主义的革命性的是（）。","score":2,"ans":"D","opts":["科学的理论内涵","完备的理论体系","严密的逻辑结构","彻底的批判精神"],"ana":"马克思主义的根本理论特征：（1）科学性：①马克思主义的科学性，首先在于它不带任何偏见；②还在于它的深刻性，任何领域都不浅尝辄止；③深刻揭示客观规律，经受了实践的检验，并且在实践中不断发展。（2）革命性：①马克思主义的革命性，集中表现为它的彻底的批判精神；②还表现在它具有鲜明的政治立场，始终代表工人阶级和广大人民群众的利益。（3）以实践为基础：①马克思主义的科学性和革命性都是以实践为基础的；②实践的观点是马克思主义的基本观点，是马克思主义的出发点和归宿。"},{"t":"s","n":3,"stem":"在世界如何存在的问题上，两种根本对立的观点是（）。","score":2,"ans":"B","opts":["唯物与唯心","辩证法和形而上学","一元和二元","可知与不可知"],"ana":"在世界如何存在的问题上，两种根本对立的观点是辩证法和形而上学。在世界本原是否具有统一性问题上，两种根本对立的观点是一元论和二元论。在物质和意识的第一性问题上，两种根本对立的观点是唯物主义和唯心主义。在思维与存在是否具有统一性的问题上，两种根本对立的观点是可知论与不可知论。"},{"t":"s","n":4,"stem":"下列唯物辩证法反映事物根本性质和表面特征关系的是（）。","score":2,"ans":"C","opts":["内容和形式","必然和偶然","本质和现象","可能性与现实性"],"ana":"唯物辩证法的理论体系还包括一系列其他范畴，主要有原因和结果、必然性和偶然性、可能性和现实性、内容和形式、本质和现象等。它们反映了事物联系和发展的基本环节。内容，构成事物一切要素的总和；形式，把内容各要素统一在一起的结构或表现形式。必然性，事物联系和发展过程中确定不移的、不可避免的趋势；偶然性，不确定的趋势。可能性，客观事物和现象的种种联系（已发生）；现实性，包含在现实事物之中的、预示着事物发展前途的趋势（未发生）。本质，事物的根本性质以及组成事物基本要素的内在联系。现象，事物的表面特征以及这些特征的外部联系。"},{"t":"s","n":5,"stem":"社会规律是通过人们的自觉活动实现的，这说明社会规律（）。","score":2,"ans":"B","opts":["不具有客观性","不是盲目自发起作用","不具有普遍性","不是事物发展的必然性"],"ana":"规律：物质运动发展过程中本质的、必然的、稳定的联系，具有客观性和普遍性的特征。分为自然规律和社会规律。自然过程是无意识的、盲目的、不自觉的，自然规律是自发起作用的，不需要人的参与。社会发展是由人的有意识、有目的的实践活动构成，但不能过分夸大社会生活中人的意识的作用。"},{"t":"s","n":6,"stem":"意识对于人的生理活动具有一定的影响作用，这表明（）。","score":2,"ans":"D","opts":["意识是人脑的分泌物","意识对物质具有决定性","意识是客观事物本身","意识对物质具有能动性"],"ana":"意识的能动作用：（1）意识具有主动性和创造性；（2）意识具有目的性和计划性；（3）意识对于人的生理活动有影响作用；（4）意识能通过指导实践改造客观物质世界，这是意识能动性最突出的表现。"},{"t":"s","n":7,"stem":"实践对认识具有决定性作用，下列不属于这一原理的是（）。","score":2,"ans":"D","opts":["实践是认识的来源和目的","认识发展的动力","检验认识真理性的标准","实践是检验认识能动性的标准"],"ana":"实践对认识具有决定作用。表现在：①实践是认识的来源。②实践是认识发展的动力。③实践是检验真理性的唯一标准。④实践是认识的目的。"},{"t":"s","n":8,"stem":"辩证唯物主义反映论区别于机械唯物主义反映论的根本标志在于，是否承认认识的过程是（）。","score":2,"ans":"A","opts":["反映和创造的统一","反映和摹写的统一","探索和创造的统一","探索与发现的统一"],"ana":"（1）唯物论的反映论与唯心论的先验论的对立：①何者为第一性：唯物论的反映论是存在；唯心论的先验论是思维。②认识路线：唯物论的反映论是从物到感觉和思想；唯心论的先验论是从感觉和思想到物。③如何看待实践：唯物论的反映论肯定实践对认识的决定作用；唯心论的先验论不懂得实践对于认识的决定性意义。（2）辩证唯物论的能动的反映论与旧唯物论的机械反映论的对立：①旧唯物论的机械的反映论认为认识主体是单纯的有生命的存在物；辩证唯物论的能动的反映论则是结合主体的社会性、实践性和能动性考察主客体之间的关系。②旧唯物论的机械的反映论对待客体是消极的认识；辩证唯物论的能动的反映论认为认识是反映与创造的统一。"},{"t":"s","n":9,"stem":"理性认识的三种形式是（）。","score":2,"ans":"B","opts":["感觉知觉表象","概念判断推理","联想想象猜测","直觉顿悟灵感"],"ana":"感性认识：是认识的初级阶段，是对事物的片面、现象和外部联系的反映，是具体的，丰富的、生动的，但却是表面的、个别的、不深刻的。包括：感觉、知觉、表象。理性认识：是认识的高级阶段，是对事物全体、本质和内部联系的反映，是抽象的、间接的、深刻的。包括：概念、判断、推理。"},{"t":"s","n":10,"stem":"下列各项正确说明生产力与生产关系的辩证关系的是（）。","score":2,"ans":"A","opts":["生产力的性质决定生产关系的性质","生产关系总是适合生产力发展的要求","生产力随着生产关系变化而变化","生产关系总能推动生产力的发展"],"ana":"生产力和生产关系之间的矛盾：①生产力决定生产关系。生产力决定生产关系的性质，一定的生产力要求一定的生产关系与它相适应，生产力性质不同，建立起来的生产关系也就不同；生产力的发展决定了生产关系的改变。②生产关系反作用于生产力。先进的生产关系促进生产力的发展，落后的生产关系阻碍生产力的发展。③生产力和生产关系之间的矛盾运动。生产力发展到一定程度，原来的生产关系逐渐变得陈旧，与生产力性质和发展要求变得基本不适合，从而阻碍生产力的发展。这时就要求变革旧的生产关系，建立新生产关系。循环往复，提高人类社会。"},{"t":"s","n":11,"stem":"下列各项属于上层建筑的是（）。","score":2,"ans":"C","opts":["生产关系","经济体制","国家政权","自然科学"],"ana":"上层建筑：社会的政治、法律、艺术、道德、宗教、哲学等意识形态以及与这些意识形态相适应的政治法律制度和设施的总和。包括：政治上层建筑（主导地位），亦称实体性上层建筑，指政治法律制度以及军队、警察、法院、监狱、政府机关等设施，以及与之相适应的一套组织；观念上层建筑，又称思想上层建筑，包括政治、法律、艺术、道德、宗教、哲学等各种服务于统治阶级的意识形态。"},{"t":"s","n":12,"stem":"社会形态的发展是一种自然历史过程，这种观点属于（）。","score":2,"ans":"C","opts":["机械决定论","历史宿命论","历史唯物论","历史唯心论"],"ana":"社会形态的发展是一种自然历史过程，这种观点属于历史唯物主义的观点。马克思在《资本论》第1卷第一版序言中说：“我的观点是：社会经济形态的发展是一种自然历史过程”。意思是说，人类社会的发展或者说社会形态的演变也像自然界一样，是客观的、物质的、辩证的过程，具有不依人的意志为转移的客观规律性。同时又应看到，人类的活动是有意识、有目的的。正是人类有意识、有目的的实践活动，构成了人类社会的历史，形成了人类社会历史的发展规律。"},{"t":"s","n":13,"stem":"正确认识和评价杰出人物的历史作用，一要坚持历史主义的原则，二要坚持（）。","score":2,"ans":"A","opts":["阶级分析","实证分析","矛盾分析","规范分析"],"ana":"杰出历史人物的作用如何评价：①杰出人物是一定历史条件下的产物，要正确认识杰出人物的历史作用，必须深入了解它们所处的历史条件，坚持历史主义原则。任何一个杰出人物的出现，都是时代的需要。②在阶级社会里的杰出人物，总是一定阶级的代表，因此，要正确认识杰出人物的历史作用，必须要对他们做阶级分析。③杰出人物的出现及其历史作用都是必然性与偶然性的辩证统一，因此必须用必然性与偶然性辩证统一的观点来分析杰出人物及其历史作用。④任何杰出人物都有巨大的历史功绩，也必然会有这样那样的缺点或错误。对他们的历史作用要做全面的分析与评价，既不能肯定一切，也不能否定一切。"},{"t":"s","n":14,"stem":"决定社会必要劳动时间的条件，包括（）。","score":2,"ans":"D","opts":["生产的主观条件","生产的客观条件","生产的个别条件","生产的主客观条件"],"ana":"社会必要时间是现有的社会正常的生产条件下，在社会平均的劳动熟练程度和劳动强度下制造某种使用价值所需要的劳动时间。社会必要劳动时间由两个条件所决定：第一，生产的客观标准条件，即现有的社会正常的生产条件；第二，生产的主观标准条件，即社会平均的劳动熟练程度和平均的劳动强度。"},{"t":"s","n":15,"stem":"简单商品经济的基本矛盾是（）。","score":2,"ans":"B","opts":["简单劳动与复杂劳动","私人劳动和社会劳动","使用价值和价值","具体与抽象。"],"ana":"以私有制为基础的商品经济的基本矛盾：私人劳动与社会劳动之间的矛盾。"},{"t":"s","n":16,"stem":"相对剩余价值生产的条件是（）。","score":2,"ans":"A","opts":["社会劳动生产率提高","个别企业劳动生产率提高","社会劳动生产率不变","部分生产部门的劳动生产率提高"],"ana":"绝对剩余价值生产的条件：延长工作日、提高劳动强度。相对剩余价值生产的条件：社会劳动生产率提高。"},{"t":"s","n":17,"stem":"以下不属于资本积累后果的是（）。","score":2,"ans":"B","opts":["资本有机构成提高","工作日的延长","相对过剩人口的形成","贫富两极分化扩大"],"ana":"资本积累的后果：（1）资本有机构成的提高。由资本技术构成决定，并反映资本技术构成变化的资本家价值构成，叫做资本有机构成，也可用以下公式表示：资本有机构成=不变资本c / 可变资本v。相对过剩人口的形成。严重的贫富两极分化。"},{"t":"s","n":18,"stem":"作为剩余价值的转化形式，利润率是（）。","score":2,"ans":"C","opts":["剩余价值与不变资本的比率","剩余价值与可变资本的比率","剩余价值和预付总资本的比率","剩余价值与利润的比率"],"ana":"利润是剩余价值的转化形式，它表现为全部预付资本的产物，因此剩余价值与预付总资本的比率就是利润率。利润率比剩余价值率的数值小。"},{"t":"s","n":19,"stem":"在资本主义发展过程中垄断的工业资本和银行资本融合构成新的资本形成列宁把它称之为（）。","score":2,"ans":"A","opts":["金融资本","借贷资本","生息资本","工商资本"],"ana":"金融资本：垄断的工业资本和银行资本的融合。金融寡头：掌握了金融资本，操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团。"},{"t":"s","n":20,"stem":"资本主义国家大规模横向外输出资本，开始于（）。","score":2,"ans":"D","opts":["资本原始积累阶段","自由竞争资本主义阶段","私人垄断","国家垄断"],"ana":"在自由竞争资本主义阶段，资本主义国家虽然也有一些资本输出到国外，但数量较少，作用也不十分重要，当时主要是以商品输出为主。垄断资本主义阶段，资本输出在各主要资本主义国家普遍而大规模地发展了起来。成为垄断资本主义时期资本主义经济关系的一个重要特征。这是从私人垄断资本主义阶段开始的。二战后，资本输出量剧增，并出现了一些新特点：资本流向的变化，不再只向经济落后国家输出，而是多方向输出，特别是发达国家间相互投资大幅度增加；在私人资本输出增长的同时，国家资本的输出也在增长，并日益成为占重要地位的资本输出形式。所以大规模纵向输出是从私人垄断开始的，而大规模横向输出是从国家垄断开始的。"},{"t":"s","n":21,"stem":"列宁所说是社会主义最充分的物质准备是社会主义的前阶的资本主义发展阶段是指（）。","score":2,"ans":"D","opts":["资本原始积累阶段","自由竞争，资本主义社会","私人垄断资本主义社会","国家垄断私人资本主义社会"],"ana":"二战后，国家垄断资本主义迅速发展。国家垄断资本主义是资本社会化的更高形式，生产社会化、资本社会化和管理社会化达到了更高程度。为社会主义转向社会主义提供了更充分的条件。列宁指出：“国家垄断资本主义是社会主义的最充分的物质准备，是社会主义的前阶”。"},{"t":"s","n":22,"stem":"社会主义革命可以在一国或数国首先胜利的理论依据是（）。","score":2,"ans":"A","opts":["资本主义经济政治发展不平衡规律","马克思恩格斯的科学预言","剩余价值学说","阶级斗争学说"],"ana":"19世纪末20世纪初，资本主义自由竞争阶段发展到垄断阶段，出现了一些新变化、新特征。最重要的一点就是垄断资本主义即帝国主义国家之间经济政治发展不平衡。列宁指出：“经济和政治发展的不平衡是资本主义的绝对规律。由此就应该得出结论：社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利”。"},{"t":"s","n":23,"stem":"中共19大提出的新时代中国特色社会主义思想的领导人是（）。","score":2,"ans":"D","opts":["双小平","江泽民","胡锦涛","习近平"],"ana":"中共19大提出的新时代中国特色社会主义思想的领导人是习近平总书记。"},{"t":"s","n":24,"stem":"广义的共产主义社会所包含的两个阶段是（）。","score":2,"ans":"B","opts":["信息社会的初级阶段和高级阶段","社会主义和共产主义","社会主义的初级阶段和高级阶段的共产主义","初级阶段和成熟阶段"],"ana":"广义上的共产主义社会，既包括其低级阶段（社会主义社会），也包括高级阶段（共产主义社会）。狭义的社会主义只包括高级阶段（共产主义社会）。"},{"t":"s","n":25,"stem":"社会主义社会和共产主义社会都存在的经济关系是（）。","score":2,"ans":"C","opts":["生产资料的个人所有制","按劳分配","生产资料的社会公有制","按需分配"],"ana":"社会主义社会和共产主义社会同属于共产主义社会形态，共同点：①都是以生产资料公有制作为社会经济制度的基础，在公有制范围内的生产资料和劳动产品，都属劳动者共同所有，并为社会公共的利益服务和使用。②生产目的都是满足劳动人民日益增长的物质文化生活需要，实现劳动人民的共同富裕。③在公有制范围内的产品分配，都按照有利于社会发展和实现劳动人民利益的原则进行。④都要消灭剥削制度，劳动人民成为社会的主人，他们之间的本质关系是平等和谐、互助合作。⑤都以马克思主义为指导思想，以集体主义为意识形态的核心。"}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"short","n":26,"stem":"简述对立统一规律是唯物辩证法的实质与核心。","score":6,"ans":"对立统一规律是唯物辩证法的实质与核心，是宇宙的根本规律：（1）对立统一规律揭示了事物普遍联系的根本内容和发展变化的内在动力；（2）对立统一规律是贯穿于唯物辩证法其他规律和范畴的中心线索，是理解它们的钥匙；（3）矛盾分析法是认识的根本方法；（4）是否承认对立统一规律以及矛盾是事物发展的动力，是唯物辩证法和形而上学的根本分歧。"},{"t":"short","n":27,"stem":"什么是社会基本矛盾？简述社会基本矛盾是社会发展的基本动力。","score":6,"ans":"（1）社会基本矛盾指生产力与生产关系之间的矛盾、经济基础和上层建筑之间的矛盾。（2）原因：①生产力和生产关系之间的矛盾、经济基础和上层建筑之间的矛盾，存在于一切社会意识形态之中，贯穿于每一个社会形态的始终。②这两对矛盾制约和决定着其他各种社会矛盾，决定着整个社会的面貌决定着社会发展的必然阶段和客观趋势，决定社会形态由低级到高级的演进。③所以社会基本矛盾是社会发展的基本动力。"},{"t":"short","n":28,"stem":"产业资本循环要经历哪几个阶段？各阶段所采取的职能形式是什么？","score":6,"ans":"（1）产业资本循环要经历以下阶段：①第一阶段：购买阶段。为剩余价值的生产准备条件。是从货币资本转化为生产资本的阶段。②第二阶段：生产阶段。在资本循环中是决定性的阶段，是由生产资本转化为商品资本的阶段。资本不仅发生了形态变化，资本的数量上也发生了变化，实现了价值增殖。③第三阶段：销售阶段。是由商品资本转化为增殖了的货币资本的阶段。（2）与这三个阶段相适应，产业资本依次采取货币资本、生产资本、商品资本三种职能形式。"},{"t":"short","n":29,"stem":"当代资本主义在生产关系方面有哪些新变化？","score":6,"ans":"（1）在所有制关系上，出现了所谓的资本主义社会化的去式，建立和发展了一定比重的国有经济。同时私人企业股权分散化，法人资本所有制崛起。（2）在劳资关系上，建立了劳资共决、职工参与决策、终身雇佣、职工持股等制度。（3）在分配关系上，许多发达国家对收入分配政策进行了调整。如实行社会福利政策，通过再分配手段在一定程度上缓和了社会矛盾。"},{"t":"short","n":30,"stem":"如何正确对待科学社会主义的一般原则？","score":6,"ans":"（1）必须始终坚持科学社会主义一般原则，反对任何背离这些原则的错误倾向；（2）要善于把科学社会主义一般原则与本国实际相结合，创造性地回答和解决革命、建设、改革中的重大问题；（3）要紧跟时代和实践的发展。在不断总结新鲜经验中进一步丰富和发展科学社会主义一般原则。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"essay","n":31,"stem":"为什么说只有实践才是检验真理的标准？坚持实践是检验真理的唯一标准有何现实意义？","score":10,"ans":"（1）是不是真理就是要判明认识与认识对象是否相一致、相符合。实践是人的主观见之于客观的活动，它能把主观认识与客观实际联系起来加以对照，来确定认识与认识对象是否相一致、相符合，从而使认识得到检验。（2）实践具有直接现实性的特点。通过实践把思想、理论在现实中实现出来，人们通过把变成现实的东西同原来的观念、思想加以对照，从而判明这个思想、观念是否正确，使认识得到检验。（3）现实意义：有利于通过实践检验和发展认识，最终接近或得到真理；有利于通过正确的认识，指导实践，改造世界。"},{"t":"essay","n":32,"stem":"剩余价值规律的内容是什么？为什么说剩余价值规律是资本主义的基本经济规律？","score":10,"ans":"（1）剩余价值规律的内容，就是资本通过组织雇佣劳动进行生产，占有工人的剩余劳动，并不断提高对雇佣工人的剥削程度来达到获取剩余价值的目的。（2）原因：①剩余价值规律体现着资本主义的生产目的。②剩余价值规律决定着资本主义生产的一切主要方面和主要过程。③剩余价值规律决定着资本主义生产方式产生发展和衰亡的全部过程。"},{"t":"essay","n":33,"stem":"试述当代资本主义国家宏观经济管理与调节的任务目标、方式和手段。","score":10,"ans":"（1）总任务：促进市场总供给和总需求的平衡。（2）调控方式：①国家对经济的直接调节、控制和介入。②国家对国民经济的间接调节与控制，主要是运用经济手段，间接引导私人资本按照国家垄断资本主义所希望的方向发展。（3）调节手段：主要是经济手段和法律手段，在个别时候、特定情况下，还可能使用某种行政手段对国民经济进行直接的干预。"}]}],"qaNotes":[]},{"paper":"marx-2204","subject":"marx","session":"2204","label":"2022年4月","code":"15044","qaNotes":[],"sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。","items":[{"t":"s","n":1,"stem":"马克思主义哲学的直接理论来源是（ ）","opts":["古希腊罗马哲学","德国古典哲学","近代英国哲学","近代法国哲学"],"ans":"B","score":2},{"t":"s","n":2,"stem":"学习马克思主义的根本方法是（ ）","opts":["理论联系实际","更新思想观念","熟读经典著作","了解党的文献"],"ans":"A","score":2},{"t":"s","n":3,"stem":"下列各项属于一元论哲学思想的是（ ）","opts":["世界万物是普遍联系的","世界万物有一个共同的本质","世界万物是可以认识的","世界万物有多种多样的形态"],"ans":"B","score":2},{"t":"s","n":4,"stem":"实践的基本形式主要有三种。下列各项属于处理社会关系的实践形式的是（ ）","opts":["种地做工","教学科研","社会改革","治病救人"],"ans":"C","score":2},{"t":"s","n":5,"stem":"唯物辩证法是关于自然、社会和思维联系与发展一般规律的科学。其中，否定之否定规律揭示的是事物发展的（ ）","opts":["前提和条件","状态和形式","动力和源泉","趋势和道路"],"ans":"D","score":2},{"t":"s","n":6,"stem":"抹杀意识的客观性，把意识说成是纯粹主观自生的，这是一种（ ）","opts":["唯心主义的观点","庸俗唯物主义的观点","形而上学的观点","不可知论的观点"],"ans":"A","score":2},{"t":"s","n":7,"stem":"人们追求符合客观实际的科学认识，归根结底是为了（ ）","opts":["透过现象揭示本质","满足所有人的精神追求","通过偶然发现必然","实现对客观世界的改造"],"ans":"D","score":2},{"t":"s","n":8,"stem":"理性认识的三种形式是（ ）","opts":["感觉、概念、判断","概念、判断、推理","感觉、知觉、表象","感觉、知觉、推理"],"ans":"B","score":2},{"t":"s","n":9,"stem":"下列各项正确说明真理问题的是（ ）","opts":["真理是“绝对理念”的自我显现","真理是观念与主体的感觉相符合","真理是对客观事物及其规律的能动反映","真理是对客观事物及其规律的正确反映"],"ans":"D","score":2},{"t":"s","n":10,"stem":"对社会存在和社会意识关系问题的不同回答是（ ）","opts":["划分唯物主义和唯心主义的标准","划分可知论和不可知论的标准","划分唯物史观和唯心史观的标准","划分辩证法和形而上学的标准"],"ans":"C","score":2},{"t":"s","n":11,"stem":"衡量生产力水平的客观尺度是（ ）","opts":["生产工具的状况","劳动对象的广度","劳动产品的数量","劳动产品的质量"],"ans":"A","score":2},{"t":"s","n":12,"stem":"下列各项关于社会改革的说法中，正确的是（ ）","opts":["社会改革仅仅是经济领域的变革","社会改革仅仅是社会心态的改良","社会改革是制度体制的根本改变","社会改革是社会体制的改善和革新"],"ans":"D","score":2},{"t":"s","n":13,"stem":"区分普通人物和历史人物，主要是看他们（ ）","opts":["社会财富的多寡","历史作用的大小","文化水平的高低","社会贡献的有无"],"ans":"B","score":2},{"t":"s","n":14,"stem":"商品生产者同一劳动过程不可分割的两个方面是（ ）","opts":["简单劳动和复杂劳动","私人劳动和社会劳动","必要劳动和剩余劳动","具体劳动和抽象劳动"],"ans":"D","score":2},{"t":"s","n":15,"stem":"以下关于商品使用价值的表述中不正确的是（ ）","opts":["使用价值是价值的物质承担者","使用价值是商品的自然属性","同一物品只能有一种使用价值","没有使用价值的物品不可能有价值"],"ans":"C","score":2},{"t":"s","n":16,"stem":"货币转化为资本的前提是（ ）","opts":["资本完成原始积累","商品生产者出现两极分化","劳动力成为商品","劳动者有人身自由"],"ans":"C","score":2},{"t":"s","n":17,"stem":"必要劳动时间不变，通过工作日的延长而生产的剩余价值是（ ）","opts":["绝对剩余价值","相对剩余价值","超额剩余价值","平均剩余价值"],"ans":"A","score":2},{"t":"s","n":18,"stem":"马克思研究资本主义经济、写作《资本论》的时代，主要资本主义国家处于（ ）","opts":["自由竞争资本主义阶段","一般垄断资本主义阶段","私人垄断资本主义阶段","国家垄断资本主义阶段"],"ans":"A","score":2},{"t":"s","n":19,"stem":"各种垄断组织形式中，垄断了某种商品生产和经营全过程的独立的大型垄断企业是（ ）","opts":["卡特尔","辛迪加","托拉斯","康采恩"],"ans":"C","score":2},{"t":"s","n":20,"stem":"国家垄断资本主义是指（ ）","opts":["资本主义国家与垄断资本相结合的资本主义","垄断的工业资本与垄断的银行资本相结合的资本主义","资本主义国家的中央银行与商业银行相结合的资本主义","资本主义国家的国有经济与非国有经济相结合的资本主义"],"ans":"A","score":2},{"t":"s","n":21,"stem":"马克思对资本主义的历史过渡性作了精辟而辩证的论述，他所说的“资本主义的历史任务和存在理由”是指（ ）","opts":["资本主义发展了商品经济，繁荣了世界市场","资本主义提倡自由平等博爱，促进了社会进步","资本主义推翻了封建统治，建立了资本主义制度","资本主义发展了社会生产力，为新生产方式创造了物质条件"],"ans":"D","score":2},{"t":"s","n":22,"stem":"标志着科学社会主义理论公开面世的第一个纲领性文件是（ ）","opts":["《共产党宣言》","《法兰西内战》","《社会主义从空想到科学的发展》","《哥达纲领批判》"],"ans":"A","score":2},{"t":"s","n":23,"stem":"最早在一个国家里建立的马克思主义政党是（ ）","opts":["正义者同盟","德国社会民主工党","俄国布尔什维克","中国共产党"],"ans":"B","score":2},{"t":"s","n":24,"stem":"下列选项中属于共产主义社会显著特征的是（ ）","opts":["按生产要素分配","各尽所能，按劳分配","按能力大小分配","各尽所能，按需分配"],"ans":"D","score":2},{"t":"s","n":25,"stem":"马克思主义认为，共产主义社会将经历两个不同的发展阶段，第一个阶段是（ ）","opts":["产品经济社会","商品经济社会","社会主义社会","自然经济社会"],"ans":"C","score":2}]},{"title":"二、简答题","meta":"本大题共5小题，每小题6分，共30分。","items":[{"t":"w","n":26,"stem":"什么是马克思主义？简述马克思主义的根本理论特征。","score":6,"ans":"（1）马克思主义是由马克思恩格斯创立并为后继者所发展，以反对资本主义、建设社会主义和共产主义为目标的科学理论体系，或者简要地说，它是关于无产阶级和人类解放的科学。（2）马克思主义的根本理论特征是以实践为基础的科学性和革命性的统一。"},{"t":"w","n":27,"stem":"简述认识客体的含义、构成和性质。","score":6,"ans":"（1）认识客体是指人的实践活动和认识活动所指向的对象。（2）认识客体由自然客体、社会客体和精神客体构成。（3）首先，认识客体具有客观性；其次，认识客体具有对象性。"},{"t":"w","n":28,"stem":"什么是资本主义意识形态？它的本质是什么？","score":6,"ans":"（1）资本主义意识形态是资产阶级对世界和社会的系统看法和见解，是资本主义社会中占统治地位的思想体系，它具有鲜明的阶级性。（2）资本主义意识形态是建立在资本主义经济基础之上的，是为资本主义私有制和雇佣劳动制度服务的，因此本质上是维护资本主义剥削制度的思想体系。"},{"t":"w","n":29,"stem":"简述第二次世界大战后资本主义国家中垄断统治加强的原因和主要表现。","score":6,"ans":"（1）第二次世界大战后，由于新科技革命的发展，竞争的加剧，生产和资本的进一步集中，使垄断统治进一步加强。（2）垄断统治加强的主要表现：企业兼并速度加快，混合兼并占主导地位。企业规模扩大，垄断程度提高。企业组织的生产经营多样化，混合联合企业大量涌现。垄断组织向国际化方向发展，跨国公司迅速增加。"},{"t":"w","n":30,"stem":"简述社会主义从一国到多国发展的历史贡献。","score":6,"ans":"（1）社会主义作为一种现实存在的社会制度出现在世界上，推动了人类历史的发展和社会制度的演进。（2）社会主义国家的存在改变了世界的格局，在一定程度上遏制了资本主义和霸权主义在世界上的扩张。（3）社会主义力量坚定地支持被压迫民族和被压迫人民，推动着和平与发展的世界时代潮流。（4）社会主义引导着世界人民的前进方向。"}]},{"title":"三、论述题","meta":"本大题共3小题，考生任选其中2题作答，每小题10分，共20分。如果考生回答的题目超过2题，只按考生回答题目的前2题计分。","items":[{"t":"w","n":31,"stem":"试述矛盾的普遍性与特殊性辩证关系的原理及其对社会主义建设的重要意义。","score":10,"ans":"（1）矛盾的普遍性和特殊性的关系，也就是共性和个性或一般和个别的关系。第一，矛盾的普遍性和特殊性是相互联结的，普遍性存在于特殊性之中，特殊性中包含着普遍性。第二，矛盾的普遍性和特殊性是相互区别的，共性只是包含了同类个别事物共同的、本质的东西，而没有包括个别事物的全部内容和特点。第三，矛盾的普遍性和特殊性在一定条件下可以相互转化。（2）矛盾的普遍性和特殊性辩证关系的原理，是建设中国特色社会主义的理论基础。在中国建设社会主义，必须从中国的国情出发，把科学社会主义的一般原理同中国具体实际结合起来，在实践中开辟建设中国特色社会主义的道路。"},{"t":"w","n":32,"stem":"如何理解“社会经济形态的发展是一种自然历史过程”？","score":10,"ans":"（1）所谓社会经济形态的发展是一种自然历史过程，是说人类社会的发展也像自然界一样，是客观的、物质的、辩证的过程，具有不依人的意志为转移的客观规律性。同时又应看到，正是人类有意识、有目的的实践活动构成了人类社会的历史，形成了人类社会历史的发展规律。（2）第一，因为每一代人在社会上开始生活时，所遇到的都是现成的生产力和生产关系；任何人都不能自由地选择生产力和生产关系。第二，人们不能自由地选择生产力和生产关系，这并不是说他们不可以按照自己的目的和需要去改变原有的生产力和生产关系。第三，把社会关系归结于生产关系，把生产关系归结于生产力的水平，就是认为生产力决定生产关系，生产关系作为社会经济基础又决定上层建筑，这是历史发展中的唯物主义因果决定论，或称历史决定论。"},{"t":"w","n":33,"stem":"试述借贷资本和利息的来源与本质。","score":10,"ans":"（1）借贷资本是从职能资本即产业资本和商业资本运动中分离出来的特殊资本形式；它主要来源于资本主义再生产过程中职能资本家手中暂时闲置的货币资本。（2）借贷资本的本质是为了取得利息而暂时贷给职能资本家使用的货币资本。（3）职能资本家为暂时获得所借贷的货币资本使用权，必须向借贷资本家支付利息。（4）利息是职能资本家使用借贷资本而让给借贷资本家的一部分剩余价值，是剩余价值的特殊转化形式。"}]}]},{"paper":"marx-2210","subject":"marx","session":"2210","label":"2022年10月","code":"03709","note":"扫描卷为 photocopy，客观题题序与网络版（诚为径）相反，以扫描卷印刷题号为准；Q12 选项B/C/D因原件重影缺陷缺失，依据自考365/诚为径同题补齐","sections":[{"title":"一、单项选择题","meta":"本大题共25小题，每小题2分，共50分。在每小题列出的备选项中只有一项是最符合题目要求的，请将其选出。","items":[{"t":"s","n":1,"stem":"下列不属于马克思主义对共产主义社会展望的是（  ）","opts":["社会生产力高度发展和物质财富极大丰富","实行社会公有制和按需分配","阶级的消灭和国家自行消亡","人们自由自在，不受任何约束"],"ans":"D","score":2},{"t":"s","n":2,"stem":"马克思主义政党的组织原则是（  ）","opts":["民主集中制","集体领导制","个人领导制","群众监督制"],"ans":"A","score":2},{"t":"s","n":3,"stem":"建立无产阶级专政政权的第一次尝试是（  ）","opts":["法国大革命","巴黎公社革命","俄国二月革命","俄国十月革命"],"ans":"B","score":2},{"t":"s","n":4,"stem":"新殖民主义在对外经济侵略形式上不同于老殖民主义的做法是（  ）","opts":["对外输出商品","对外输出资本","进行“对外援助”","进行“颜色革命”"],"ans":"C","score":2},{"t":"s","n":5,"stem":"垄断资本主义阶段对外输出资本的必要性在于（  ）","opts":["国内劳动力供给过剩","国内商品需求过剩","存在大量过剩资本","存在激烈金融竞争"],"ans":"C","score":2},{"t":"s","n":6,"stem":"垄断利润不可能来源于（  ）","opts":["垄断企业工人创造的剩余价值","非垄断企业工人创造的剩余价值","其他国家劳动者创造的剩余价值","垄断本身创造的商品价值增殖"],"ans":"D","score":2},{"t":"s","n":7,"stem":"生产和资本集中发展到一定程度时，自然而然会走向垄断，而引起生产和资本集中到最主要、最直接的因素则是（  ）","opts":["商品经济的发展","自由竞争的驱动","市场体系的完善","法律制度的规范"],"ans":"B","score":2},{"t":"s","n":8,"stem":"资本主义政治制度的核心是（  ）","opts":["国家制度","政党制度","选举制度","民主制度"],"ans":"A","score":2},{"t":"s","n":9,"stem":"工作日长度保持不变的前提下，缩短必要劳动时间从而相应地延长剩余劳动时间所生产的剩余价值是（  ）","opts":["绝对剩余价值","超额剩余价值","相对剩余价值","平均剩余价值"],"ans":"C","score":2},{"t":"s","n":10,"stem":"资本主义生产过程是（  ）","opts":["劳动过程和价值增殖过程的统一","劳动过程和价值形成的统一","劳动过程和价值增殖过程的对立","劳动过程和价值形成的对立"],"ans":"A","score":2},{"t":"s","n":11,"stem":"货币最基本的职能是（  ）","opts":["价值尺度和支付手段","存储手段和支付手段","价值尺度和流通手段","流通手段和世界货币"],"ans
