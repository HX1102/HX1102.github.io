"},{"key":"C","text":"《为诗辩护》"},{"key":"D","text":"《悲剧的诞生》"}],"key":"A","answer":"《文学传记》","max":1,"id":"西方文论-14-single-11"},{"n":12,"type":"single","prompt":"丹纳的文论属于","options":[{"key":"A","text":"实证主义"},{"key":"B","text":"浪漫主义"},{"key":"C","text":"古典主义"},{"key":"D","text":"形式主义"}],"key":"A","answer":"实证主义","max":1,"id":"西方文论-14-single-12"},{"n":13,"type":"single","prompt":"王尔德的文论属于","options":[{"key":"A","text":"唯美主义"},{"key":"B","text":"现实主义"},{"key":"C","text":"象征主义"},{"key":"D","text":"自然主义"}],"key":"A","answer":"唯美主义","max":1,"id":"西方文论-14-single-13"},{"n":14,"type":"single","prompt":"尼采的悲剧理论认为悲剧的根源是","options":[{"key":"A","text":"命运"},{"key":"B","text":"性格"},{"key":"C","text":"酒神精神与日神精神的冲突"},{"key":"D","text":"道德"}],"key":"C","answer":"酒神精神与日神精神的冲突","max":1,"id":"西方文论-14-single-14"},{"n":15,"type":"single","prompt":"马拉美的文论属于","options":[{"key":"A","text":"象征主义"},{"key":"B","text":"唯美主义"},{"key":"C","text":"现实主义"},{"key":"D","text":"批判现实主义"}],"key":"A","answer":"象征主义","max":1,"id":"西方文论-14-single-15"},{"n":16,"type":"fill","prompt":"十九世纪末二十世纪初欧洲出现的四种文论思潮包括唯美主义、象征主义、直觉主义和 ______ 。","options":[],"key":"实证主义","answer":"实证主义","max":2,"id":"西方文论-14-fill-16"},{"n":17,"type":"fill","prompt":"圣伯夫的传记批评理论观点是强调 ______ 生平对作品的影响。","options":[],"key":"作者","answer":"作者","max":2,"id":"西方文论-14-fill-17"},{"n":18,"type":"fill","prompt":"丹纳关于文学发展的“三要素”是种族、环境和 ______ 。","options":[],"key":"时代","answer":"时代","max":2,"id":"西方文论-14-fill-18"},{"n":19,"type":"fill","prompt":"王尔德唯美主义的主要特征是为艺术而艺术,追求 ______ 美。","options":[],"key":"形式","answer":"形式","max":2,"id":"西方文论-14-fill-19"},{"n":20,"type":"fill","prompt":"波德莱尔感应论的主要观点是万物之间存在 ______ 关系。","options":[],"key":"感应","answer":"感应","max":2,"id":"西方文论-14-fill-20"},{"n":21,"type":"fill","prompt":"马拉美的纯诗论主要观点是诗的本质是语言的 ______ 。","options":[],"key":"音乐性","answer":"音乐性","max":2,"id":"西方文论-14-fill-21"},{"n":22,"type":"fill","prompt":"尼采的酒神精神与日神精神的区别在于酒神精神强调狂欢,日神精神强调 ______ 。","options":[],"key":"静观","answer":"静观","max":2,"id":"西方文论-14-fill-22"},{"n":23,"type":"fill","prompt":"十九世纪末二十世纪初文论的特点是反传统、关注形式和追求 ______ 。","options":[],"key":"创新","answer":"创新","max":2,"id":"西方文论-14-fill-23"},{"n":24,"type":"term","prompt":"传记批评(圣伯夫)","options":[],"key":"","answer":"圣伯夫提出的文论观点,强调作者生平经历对作品的影响,认为理解作者的个性、经历是解读作品的关键,主张通过研究作者的传记来阐释作品,是实证主义文论的重要组成部分,对后世传记式批评影响深远。","max":3,"id":"西方文论-14-term-24"},{"n":25,"type":"term","prompt":"丹纳的“三要素”","options":[],"key":"","answer":"丹纳提出的文学发展理论,属实证主义文论,认为文学的发展受种族、环境、时代三个要素影响。种族指民族的天性;环境指自然和社会环境;时代指历史发展的阶段。三者共同决定文学的风格和特征,体现了从外部条件研究文学的实证倾向。","max":3,"id":"西方文论-14-term-25"},{"n":26,"type":"term","prompt":"唯美主义(王尔德)","options":[],"key":"","answer":"王尔德是唯美主义的代表人物,其文论主张“为艺术而艺术”,追求形式美,反对道德和功利的束缚。他强调艺术的价值在于自身的审美特质,追求艺术的独立性和纯粹性,是十九世纪末反传统文论的重要流派。","max":3,"id":"西方文论-14-term-26"},{"n":27,"type":"term","prompt":"酒神精神与日神精神(尼采)","options":[],"key":"","answer":"尼采在《悲剧的诞生》中提出的文论概念。酒神精神代表狂欢、放纵的生命本能,体现人的原始欲望和激情;日神精神代表静观、形式的审美理想。二者的冲突与融合构成了悲剧的本质,也是艺术发展的动力。","max":3,"id":"西方文论-14-term-27"},{"n":28,"type":"short","prompt":"简述丹纳关于文学发展的“三要素”是什么。","options":[],"key":"","answer":"丹纳关于文学发展的“三要素”是种族、环境、时代。种族指民族的天性;环境指自然和社会环境;时代指历史发展的阶段。这三个要素相互作用,共同决定文学的风格和特征,是理解文学发展的重要角度。这一理论属实证主义文论,强调从外部条件研究文学,宗教等不属于三要素之列。","max":5,"id":"西方文论-14-short-28"},{"n":29,"type":"short","prompt":"简述朗松的文学史批评的特点。","options":[],"key":"","answer":"朗松的文学史批评注重文献考证,强调实证方法。其特点在于:主张通过对作家生平、作品版本、史料的详细考证来研究文学历史;追求文学史的客观性和科学性,反对主观随意的批评;认为文学史研究应建立在对史料的充分掌握之上。这体现了实证主义思潮的影响。","max":5,"id":"西方文论-14-short-29"},{"n":30,"type":"short","prompt":"简述什么是酒神精神与日神精神,有何区别。","options":[],"key":"","answer":"酒神精神与日神精神是尼采在《悲剧的诞生》中提出的概念。酒神精神代表狂欢、放纵的生命本能,体现人的原始欲望和激情;日神精神代表静观、形式的审美理想。酒神精神是生命的本能冲动,日神精神是理性的审美建构,二者的冲突与融合构成悲剧的本质。","max":5,"id":"西方文论-14-short-30"},{"n":31,"type":"essay","prompt":"论述唯美主义的主要特征,并谈谈你对“生物模仿艺术”还是“艺术模仿生活”的看法。","options":[],"key":"","answer":"唯美主义的主要特征:主张“为艺术而艺术”,强调艺术的独立性和纯粹性,反对艺术受道德、功利的束缚;追求形式美,认为艺术的价值在于自身的审美特质;推崇感性体验,强调艺术的审美愉悦功能。 关于“生物模仿艺术”与“艺术模仿生活”,王尔德主张“生物模仿艺术”,认为艺术是生活的范本,其观点虽有片面性,但提醒人们重视艺术对生活的超越。","max":15,"id":"西方文论-14-essay-31"},{"n":32,"type":"essay","prompt":"论述尼采的悲剧理论,并结合具体文本谈谈酒神精神在文学艺术创作及作品中的具体体","options":[],"key":"","answer":"现。 尼采的悲剧理论认为悲剧源于酒神精神与日神精神的冲突与融合:酒神精神代表狂欢、放纵的生命本能,日神精神代表静观、形式的审美理想;冲突产生痛感,融合产生快感;悲剧的本质是通过日神的形式表现酒神的生命意志,使人们在痛苦中获得升华。 在创作上,作家通过放纵的生命激情创作,《俄狄浦斯王》《变形记》等作品体现了生命本能的异化与挣扎。","max":15,"id":"西方文论-14-essay-32"}],"rawMax":88},{"id":"西方文论-15","title":"章节练习(10章)","questions":[{"n":1,"type":"single","prompt":"心理分析文论产生的社会历史原因不包括","options":[{"key":"A","text":"现代社会人的精神危机"},{"key":"B","text":"弗洛伊德心理学的发展"},{"key":"C","text":"古典主义文论的复兴"},{"key":"D","text":"文学对人的内心世界的关注"}],"key":"C","answer":"古典主义文论的复兴","max":1,"id":"西方文论-15-single-1"},{"n":2,"type":"single","prompt":"弗洛伊德的“俄狄浦斯情结”指的是","options":[{"key":"A","text":"恋父情结"},{"key":"B","text":"恋母情结"},{"key":"C","text":"兄妹情结"},{"key":"D","text":"朋友情结"}],"key":"B","answer":"恋母情结","max":1,"id":"西方文论-15-single-2"},{"n":3,"type":"single","prompt":"荣格“原型”“神话”和“集体无意识”的关系是","options":[{"key":"A","text":"原型源于个人无意识,与神话无关"},{"key":"B","text":"原型是集体无意识的表现,神话是原型的体现"},{"key":"C","text":"神话源于个人经历,与原型无关"},{"key":"D","text":"集体无意识是个人的,与原型、神话无关"}],"key":"B","answer":"原型是集体无意识的表现,神话是原型的体现","max":1,"id":"西方文论-15-single-3"},{"n":4,"type":"single","prompt":"拉康无意识的语言结构强调","options":[{"key":"A","text":"无意识与语言无关"},{"key":"B","text":"无意识像语言一样结构化"},{"key":"C","text":"语言决定意识"},{"key":"D","text":"意识决定语言"}],"key":"B","answer":"无意识像语言一样结构化","max":1,"id":"西方文论-15-single-4"},{"n":5,"type":"single","prompt":"弗洛伊德被称为“心理分析之父”是因为他","options":[{"key":"A","text":"创立了心理分析学派"},{"key":"B","text":"推崇古典主义"},{"key":"C","text":"强调理性"},{"key":"D","text":"否定无意识"}],"key":"A","answer":"创立了心理分析学派","max":1,"id":"西方文论-15-single-5"},{"n":6,"type":"single","prompt":"荣格集体无意识理论的主要观点是","options":[{"key":"A","text":"无意识是个人的"},{"key":"B","text":"集体无意识是人类世代积累的普遍心理经验"},{"key":"C","text":"集体无意识与原型无关"},{"key":"D","text":"集体无意识源于个人经历"}],"key":"B","answer":"集体无意识是人类世代积累的普遍心理经验","max":1,"id":"西方文论-15-single-6"},{"n":7,"type":"single","prompt":"拉康的三界说是","options":[{"key":"A","text":"现实界、想象界、象征界"},{"key":"B","text":"意识界、无意识界、前意识界"},{"key":"C","text":"本我、自我、超我"},{"key":"D","text":"感性、理性、知性"}],"key":"A","answer":"现实界、想象界、象征界","max":1,"id":"西方文论-15-single-7"},{"n":8,"type":"single","prompt":"心理分析文学理论的主要特点不包括","options":[{"key":"A","text":"关注无意识"},{"key":"B","text":"强调性本能"},{"key":"C","text":"忽视文本形式"},{"key":"D","text":"注重心理结构"}],"key":"C","answer":"忽视文本形式","max":1,"id":"西方文论-15-single-8"},{"n":9,"type":"single","prompt":"弗洛伊德《作家与白日梦》中提出的艺术家创作动机是","options":[{"key":"A","text":"理性驱动"},{"key":"B","text":"性本能冲动升华"},{"key":"C","text":"功利目的"},{"key":"D","text":"宗教信仰"}],"key":"B","answer":"性本能冲动升华","max":1,"id":"西方文论-15-single-9"},{"n":10,"type":"single","prompt":"拉康分析《被窃的信》运用的是","options":[{"key":"A","text":"三界说"},{"key":"B","text":"俄狄浦斯情结"},{"key":"C","text":"原型理论"},{"key":"D","text":"集体无意识"}],"key":"A","answer":"三界说","max":1,"id":"西方文论-15-single-10"},{"n":11,"type":"single","prompt":"弗洛伊德的人格结构不包括","options":[{"key":"A","text":"本我"},{"key":"B","text":"自我"},{"key":"C","text":"超我"},{"key":"D","text":"他我"}],"key":"D","answer":"他我","max":1,"id":"西方文论-15-single-11"},{"n":12,"type":"single","prompt":"荣格的文论属于","options":[{"key":"A","text":"个体心理分析"},{"key":"B","text":"集体心理分析"},{"key":"C","text":"形式心理分析"},{"key":"D","text":"社会心理分析"}],"key":"B","answer":"集体心理分析","max":1,"id":"西方文论-15-single-12"},{"n":13,"type":"single","prompt":"拉康的镜像理论主要分析","options":[{"key":"A","text":"儿童的自我形成"},{"key":"B","text":"成人的心理结构"},{"key":"C","text":"文本的形式"},{"key":"D","text":"社会的结构"}],"key":"A","answer":"儿童的自我形成","max":1,"id":"西方文论-15-single-13"},{"n":14,"type":"single","prompt":"心理分析文论与传统文论的核心区别是","options":[{"key":"A","text":"是否关注现实"},{"key":"B","text":"是否强调理性"},{"key":"C","text":"是否关注无意识"},{"key":"D","text":"是否模仿自然"}],"key":"C","answer":"是否关注无意识","max":1,"id":"西方文论-15-single-14"},{"n":15,"type":"single","prompt":"弗洛伊德的无意识理论认为无意识","options":[{"key":"A","text":"可以完全被意识觉察"},{"key":"B","text":"是心理的表层"},{"key":"C","text":"包含被压抑的欲望"},{"key":"D","text":"与行为无关"}],"key":"C","answer":"包含被压抑的欲望","max":1,"id":"西方文论-15-single-15"},{"n":16,"type":"fill","prompt":"心理分析文论产生的社会历史原因包括现代社会人的 ______ 危机。","options":[],"key":"精神","answer":"精神","max":2,"id":"西方文论-15-fill-16"},{"n":17,"type":"fill","prompt":"弗洛伊德的“俄狄浦斯情结”指的是 ______ 情结。","options":[],"key":"恋母","answer":"恋母","max":2,"id":"西方文论-15-fill-17"},{"n":18,"type":"fill","prompt":"荣格“原型”是 ______ 无意识的表现形式。","options":[],"key":"集体","answer":"集体","max":2,"id":"西方文论-15-fill-18"},{"n":19,"type":"fill","prompt":"拉康无意识的语言结构强调无意识像 ______ 一样结构化。","options":[],"key":"语言","answer":"语言","max":2,"id":"西方文论-15-fill-19"},{"n":20,"type":"fill","prompt":"弗洛伊德被称为“心理分析之父”是因为他创立了 ______ 学派。","options":[],"key":"心理分析","answer":"心理分析","max":2,"id":"西方文论-15-fill-20"},{"n":21,"type":"fill","prompt":"荣格集体无意识理论的主要观点是集体无意识是人类世代积累的 ______ 心理经验。","options":[],"key":"普遍","answer":"普遍","max":2,"id":"西方文论-15-fill-21"},{"n":22,"type":"fill","prompt":"拉康的三界说是现实界、想象界和 ______ 界。","options":[],"key":"象征","answer":"象征","max":2,"id":"西方文论-15-fill-22"},{"n":23,"type":"fill","prompt":"心理分析文学理论的主要特点是关注无意识、强调性本能和注重 ______ 结构。","options":[],"key":"心理","answer":"心理","max":2,"id":"西方文论-15-fill-23"},{"n":24,"type":"term","prompt":"俄狄浦斯情结","options":[],"key":"","answer":"弗洛伊德提出的心理学术语,指儿童在性心理发展阶段对异性父母的爱恋和对同性父母的嫉妒,男孩表现为恋母情结,女孩表现为恋父情结。这一情结深藏于无意识之中,对人的性格和行为具有深远影响。","max":3,"id":"西方文论-15-term-24"},{"n":25,"type":"term","prompt":"集体无意识(荣格)","options":[],"key":"","answer":"荣格提出的心理分析概念,指人类世代积累的普遍心理经验,超越了个人的无意识,包含着原型。原型是集体无意识的表现形式,神话是原型的具体体现。它是艺术创作和神话形成的深层心理根源,不同文化中的相似神话可由它得到解释。","max":3,"id":"西方文论-15-term-25"},{"n":26,"type":"term","prompt":"拉康的三界说","options":[],"key":"","answer":"拉康提出的心理结构理论,包括现实界、想象界和象征界。现实界是客观的现实,但人无法直接把握;想象界是通过镜像阶段形成的自我认知;象征界是语言和文化的领域,是主体形成的关键。三界相互作用,构成人的心理和主体的存在方式。","max":3,"id":"西方文论-15-term-26"},{"n":27,"type":"term","prompt":"心理分析文论","options":[],"key":"","answer":"心理分析文论是运用心理分析学的理论和方法研究文学的文论思潮,代表人物有弗洛伊德、 荣格、拉康等。其特点是关注无意识、性本能和心理结构,通过分析作家的心理、人物心理和文本的心理象征来解读文学。","max":3,"id":"西方文论-15-term-27"},{"n":28,"type":"short","prompt":"简述为什么说弗洛伊德是“心理分析之父”,他的无意识理论对文学研究产生了怎样的影","options":[],"key":"","answer":"响。 弗洛伊德创立了心理分析学派,提出无意识理论、人格结构理论和性本能理论,被称为“心理分析之父”。其无意识理论认为无意识包含着被压抑的欲望,影响人的行为。它对文学研究的影响:使文学研究关注作家和作品人物的无意识心理;推动了创作动机的心理分析;提供了心理分析批评等新方法。","max":5,"id":"西方文论-15-short-28"},{"n":29,"type":"short","prompt":"简述如何理解荣格“原型”“神话”和“集体无意识”的关系。","options":[],"key":"","answer":"荣格认为集体无意识是人类世代积累的普遍心理经验,是人类在漫长进化过程中形成的共同心理结构;原型是集体无意识的表现形式,神话是原型的具体体现。神话通过故事和形象将原型表现出来,使集体无意识得以传承和表达,不同文化中的相似神话即由此得到解释。","max":5,"id":"西方文论-15-short-29"},{"n":30,"type":"short","prompt":"简述拉康的三界说是什么,他怎样运用此说分析侦探小说《被窃的信》。","options":[],"key":"","answer":"拉康的三界说是现实界、想象界、象征界,他认为无意识像语言一样具有结构化特征,三界相互作用,构成人的心理结构和主体的形成。他分析《被窃的信》时认为:信在现实界是物质存在,在想象界是人物欲望的对象,在象征界是权力和知识的符号,揭示了文本中的主体关系和象征秩序。","max":5,"id":"西方文论-15-short-30"},{"n":31,"type":"essay","prompt":"论述弗洛伊德在《作家与白日梦》中提出的艺术家从事创作是性本能冲动升华的观点,","options":[],"key":"","answer":"并谈谈你的看法弗洛伊德在《作家与白日梦》中提出,艺术家从事创作是性本能冲动的升华,即被压抑的性本能欲望通过艺术创作得到满足,既避免本能直接发泄的社会冲突,又创造出有审美价值的作品。这一观点揭示了艺术与本能欲望的深层联系。但它将创作动机单一地归结为性本能, 忽视了社会环境等因素,带有泛性论倾向,应辩证看待。","max":15,"id":"西方文论-15-essay-31"},{"n":32,"type":"essay","prompt":"论述荣格集体无意识理论的主要观点,并辩证地评价它。","options":[],"key":"","answer":"荣格认为集体无意识是人类世代积累的普遍心理经验,超越个人的无意识;原型是其表现形式,它是艺术创作的深层心理根源。 积极意义:突破了弗洛伊德个体无意识的局限,把研究扩展到人类集体层面,为理解艺术的普遍性提供依据。 局限:其存在缺乏直接的科学证据,带有神秘主义色彩;将艺术创作根源归结为集体无意识,忽视社会环境和个体差异。","max":15,"id":"西方文论-15-essay-32"}],"rawMax":88},{"id":"西方文论-16","title":"章节练习(11章)","questions":[{"n":1,"type":"single","prompt":"俄国形式主义文论产生的社会历史原因不包括","options":[{"key":"A","text":"俄国现代文学的发展"},{"key":"B","text":"语言学的影响"},{"key":"C","text":"古典主义的复兴"},{"key":"D","text":"对传统文论的反叛"}],"key":"C","answer":"古典主义的复兴","max":1,"id":"西方文论-16-single-1"},{"n":2,"type":"single","prompt":"什克罗夫斯基陌生化理论的主要观点是","options":[{"key":"A","text":"文学语言与日常语言一致"},{"key":"B","text":"文学语言使事物陌生化"},{"key":"C","text":"文学模仿现实"},{"key":"D","text":"文学服务于宗教"}],"key":"B","answer":"文学语言使事物陌生化","max":1,"id":"西方文论-16-single-2"},{"n":3,"type":"single","prompt":"雅各布森的“文学性”指的是","options":[{"key":"A","text":"文学的社会功能"},{"key":"B","text":"文学的形式特征"},{"key":"C","text":"文学的道德内容"},{"key":"D","text":"文学的宗教意义"}],"key":"B","answer":"文学的形式特征","max":1,"id":"西方文论-16-single-3"},{"n":4,"type":"single","prompt":"巴赫金的超语言学理论主要观点是","options":[{"key":"A","text":"语言是纯粹的形式"},{"key":"B","text":"语言与社会无关"},{"key":"C","text":"语言是对话性的"},{"key":"D","text":"语言是个人的"}],"key":"C","answer":"语言是对话性的","max":1,"id":"西方文论-16-single-4"},{"n":5,"type":"single","prompt":"俄国形式主义提倡与日常语言对立的文学语言,对此的正确看法是","options":[{"key":"A","text":"完全正确"},{"key":"B","text":"完全错误"},{"key":"C","text":"有一定合理性,也有局限"},{"key":"D","text":"与文学无关"}],"key":"C","answer":"有一定合理性,也有局限","max":1,"id":"西方文论-16-single-5"},{"n":6,"type":"single","prompt":"雅各布森的“主导”指的是","options":[{"key":"A","text":"作品中起支配作用的形式因素"},{"key":"B","text":"作品的道德主题"},{"key":"C","text":"作者的主导思想"},{"key":"D","text":"作品的社会功能"}],"key":"A","answer":"作品中起支配作用的形式因素","max":1,"id":"西方文论-16-single-6"},{"n":7,"type":"single","prompt":"巴赫金的“复调小说”观点认为小说","options":[{"key":"A","text":"只有一个声音"},{"key":"B","text":"有多个独立的声音"},{"key":"C","text":"服务于宗教"},{"key":"D","text":"模仿现实"}],"key":"B","answer":"有多个独立的声音","max":1,"id":"西方文论-16-single-7"},{"n":8,"type":"single","prompt":"俄国形式主义文论的特点不包括","options":[{"key":"A","text":"关注形式"},{"key":"B","text":"强调文学性"},{"key":"C","text":"忽视内容"},{"key":"D","text":"强调社会功能"}],"key":"D","answer":"强调社会功能","max":1,"id":"西方文论-16-single-8"},{"n":9,"type":"single","prompt":"什克罗夫斯基的代表作是","options":[{"key":"A","text":"《诗学》"},{"key":"B","text":"《文学理论》"},{"key":"C","text":"《散文理论》"},{"key":"D","text":"《悲剧的诞生》"}],"key":"C","answer":"《散文理论》","max":1,"id":"西方文论-16-single-9"},{"n":10,"type":"single","prompt":"雅各布森的文论属于","options":[{"key":"A","text":"俄国形式主义"},{"key":"B","text":"浪漫主义"},{"key":"C","text":"现实主义"},{"key":"D","text":"古典主义"}],"key":"A","answer":"俄国形式主义","max":1,"id":"西方文论-16-single-10"},{"n":11,"type":"single","prompt":"巴赫金的对话主义在当代文学理论中的价值是","options":[{"key":"A","text":"毫无价值"},{"key":"B","text":"强调了文学的对话性和开放性"},{"key":"C","text":"只适用于俄国文学"},{"key":"D","text":"服务于宗教"}],"key":"B","answer":"强调了文学的对话性和开放性","max":1,"id":"西方文论-16-single-11"},{"n":12,"type":"single","prompt":"俄国形式主义与雅各布森对于文学看法的异见在于","options":[{"key":"A","text":"是否关注形式"},{"key":"B","text":"是否强调文学性"},{"key":"C","text":"对文学与社会关系的认识"},{"key":"D","text":"是否忽视内容"}],"key":"C","answer":"对文学与社会关系的认识","max":1,"id":"西方文论-16-single-12"},{"n":13,"type":"single","prompt":"巴赫金的怪诞现实主义理论强调","options":[{"key":"A","text":"纯粹的形式美"},{"key":"B","text":"现实的恐怖"},{"key":"C","text":"民间的狂欢和身体的解放"},{"key":"D","text":"宗教的神秘"}],"key":"C","answer":"民间的狂欢和身体的解放","max":1,"id":"西方文论-16-single-13"},{"n":14,"type":"single","prompt":"俄国形式主义文论的核心是","options":[{"key":"A","text":"文学性"},{"key":"B","text":"社会性"},{"key":"C","text":"宗教性"},{"key":"D","text":"道德性"}],"key":"A","answer":"文学性","max":1,"id":"西方文论-16-single-14"},{"n":15,"type":"single","prompt":"什克罗夫斯基认为文学的功能是","options":[{"key":"A","text":"道德教化"},{"key":"B","text":"宗教传播"},{"key":"C","text":"使事物陌生化"},{"key":"D","text":"模仿现实"}],"key":"C","answer":"使事物陌生化","max":1,"id":"西方文论-16-single-15"},{"n":16,"type":"fill","prompt":"俄国形式主义文论产生的社会历史原因包括俄国现代文学的发展和 ______ 的影响。","options":[],"key":"语言学","answer":"语言学","max":2,"id":"西方文论-16-fill-16"},{"n":17,"type":"fill","prompt":"什克罗夫斯基陌生化理论的主要观点是文学语言使事物 ______ 。","options":[],"key":"陌生化","answer":"陌生化","max":2,"id":"西方文论-16-fill-17"},{"n":18,"type":"fill","prompt":"雅各布森的“文学性”指的是文学的 ______ 特征。","options":[],"key":"形式","answer":"形式","max":2,"id":"西方文论-16-fill-18"},{"n":19,"type":"fill","prompt":"巴赫金的超语言学理论主要观点是语言是 ______ 性的。","options":[],"key":"对话","answer":"对话","max":2,"id":"西方文论-16-fill-19"},{"n":20,"type":"fill","prompt":"俄国形式主义提倡与日常语言对立的 ______ 语言。","options":[],"key":"文学","answer":"文学","max":2,"id":"西方文论-16-fill-20"},{"n":21,"type":"fill","prompt":"雅各布森的“主导”指的是作品中起 ______ 作用的形式因素。","options":[],"key":"支配","answer":"支配","max":2,"id":"西方文论-16-fill-21"},{"n":22,"type":"fill","prompt":"巴赫金的“复调小说”是指小说有多个 ______ 的声音。","options":[],"key":"独立","answer":"独立","max":2,"id":"西方文论-16-fill-22"},{"n":23,"type":"fill","prompt":"俄国形式主义文论的特点是关注形式、强调文学性和 ______ 内容。","options":[],"key":"忽视","answer":"忽视","max":2,"id":"西方文论-16-fill-23"},{"n":24,"type":"term","prompt":"陌生化(什克罗夫斯基)","options":[],"key":"","answer":"俄国形式主义代表什克洛夫斯基提出的概念,用于界定“文学性”。陌生化指打破日常语言与思维的惯性,延长审美感知时间,使熟悉事物变得新奇,凸显文学的审美特质。该理论转向形式的审美价值,为文本中心研究奠定基础。","max":3,"id":"西方文论-16-term-24"},{"n":25,"type":"term","prompt":"文学性(雅各布森)","options":[],"key":"","answer":"雅各布森提出的文论概念,指文学的形式特征,即那些只有在文学作品中才存在的形式手法。文学性是区分文学与非文学的关键,强调文学的形式本质。雅各布森是俄国形式主义的代表人物,这一概念是俄国形式主义文论的核心。","max":3,"id":"西方文论-16-term-25"},{"n":26,"type":"term","prompt":"超语言学(巴赫金)","options":[],"key":"","answer":"巴赫金提出的文论理论,认为语言不是纯粹的形式系统,而是存在于具体的社会语境和对话中,具有对话性和社会性。超语言学突破了传统语言学对语言形式的局限,将语言研究与社会文化、对话交流结合,认为语言本质上是对话性的。","max":3,"id":"西方文论-16-term-26"},{"n":27,"type":"term","prompt":"复调小说(巴赫金)","options":[],"key":"","answer":"巴赫金提出的小说理论,认为复调小说中有多个独立的人物意识(声音),它们相互对话、 平等交流、相互碰撞,没有一个声音处于主导地位,与传统的独白小说形成对比。复调小说体现了小说的对话性和开放性。","max":3,"id":"西方文论-16-term-27"},{"n":28,"type":"short","prompt":"简述什克罗夫斯基陌生化理论的主要观点。","options":[],"key":"","answer":"什克罗夫斯基是俄国形式主义的代表人物,其陌生化理论的主要观点是:文学语言通过陌生化手法使事物变得新奇、陌生,打破日常语言的自动化感知,延长审美体验的时间。文学的本质在于陌生化,是文学语言与日常语言的根本区别,其代表作《散文理论》阐述了这一理论。","max":5,"id":"西方文论-16-short-28"},{"n":29,"type":"short","prompt":"简述雅各布森的“文学性”和“主导”的含义。","options":[],"key":"","answer":"雅各布森是俄国形式主义的代表人物,其“文学性”指文学的形式特征,即那些只有在文学作品中才存在的形式手法,是区分文学与非文学的关键。“主导”指作品中起支配作用的形式因素,决定了作品的整体风格和结构。二者都强调文学形式的重要性,体现了俄国形式主义重形式的倾向。","max":5,"id":"西方文论-16-short-29"},{"n":30,"type":"short","prompt":"简述如何看待俄国形式主义提倡与日常语言对立的文学语言这一问题。","options":[],"key":"","answer":"这种主张有一定合理性,它强调了文学语言的特殊性,指出文学语言通过陌生化手法区别于日常语言,具有独特的审美功能。但也存在局限,忽视了文学语言与日常语言的联系,日常语言是文学语言的基础。因此应辩证看待,既承认文学语言的特殊性,又不割裂其与日常语言的联系。","max":5,"id":"西方文论-16-short-30"},{"n":31,"type":"essay","prompt":"论述什克罗夫斯基与雅各布森对于文学看法的异见。","options":[],"key":"","answer":"二者同属俄国形式主义,但看法存在异见。什克罗夫斯基更极端地强调形式性,认为文学的本质就是陌生化,割裂文学与社会、内容的联系。雅各布森前期强调“文学性”和形式,后期关注文学与社会、文化的关系,其“主导”概念仍强调形式支配,但已考虑形式与内容的互动。 这种异见体现了俄国形式主义内部的分化。","max":15,"id":"西方文论-16-essay-31"},{"n":32,"type":"essay","prompt":"论述巴赫金“对话主义”在当代文学理论乃至文化理论中的价值和意义。","options":[],"key":"","answer":"在文学理论方面,“对话主义”打破了传统理论的独白式思维,强调文学的对话性和开放性; “复调小说”理论揭示了小说中多个独立声音的对话关系,为分析现代小说提供了工具。在文化理论方面,它强调文化的多元性和互动性,认为文化发展是不同声音对话交流的结果,反对文化霸权,超越了形式主义的局限。","max":15,"id":"西方文论-16-essay-32"}],"rawMax":88},{"id":"西方文论-17","title":"章节练习(12章)","questions":[{"n":1,"type":"single","prompt":"英美新批评文论产生的社会历史原因不包括","options":[{"key":"A","text":"现代诗歌的发展"},{"key":"B","text":"哲学语言学的影响"},{"key":"C","text":"浪漫主义的复兴"},{"key":"D","text":"对传统文论的反叛"}],"key":"C","answer":"浪漫主义的复兴","max":1,"id":"西方文论-17-single-1"},{"n":2,"type":"single","prompt":"艾略特的“非个性化”观点强调","options":[{"key":"A","text":"作家个人情感的直接表达"},{"key":"B","text":"文学与作家个人无关"},{"key":"C","text":"文学是传统的有机组成部分"},{"key":"D","text":"文学服务于宗教"}],"key":"C","answer":"文学是传统的有机组成部分","max":1,"id":"西方文论-17-single-2"},{"n":3,"type":"single","prompt":"瑞恰慈的“情感语言”指的是","options":[{"key":"A","text":"表达事实的语言"},{"key":"B","text":"表达情感的语言"},{"key":"C","text":"逻辑严密的语言"},{"key":"D","text":"科学准确的语言"}],"key":"B","answer":"表达情感的语言","max":1,"id":"西方文论-17-single-3"},{"n":4,"type":"single","prompt":"兰色姆的“张力”理论强调","options":[{"key":"A","text":"文学的单一意义"},{"key":"B","text":"文学中对立因素的统一"},{"key":"C","text":"文学的社会功能"},{"key":"D","text":"文学的宗教意义"}],"key":"B","answer":"文学中对立因素的统一","max":1,"id":"西方文论-17-single-4"},{"n":5,"type":"single","prompt":"如何理解艾略特的非个性与客观对应物?","options":[{"key":"A","text":"完全否定作家个性"},{"key":"B","text":"客观对应物是表达个人情感的工具"},{"key":"C","text":"非个性强调文学融入传统,客观对应物是表达情感的客观意象"},{"key":"D","text":"与文学无关"}],"key":"C","answer":"非个性强调文学融入传统,客观对应物是表达情感的客观意象","max":1,"id":"西方文论-17-single-5"},{"n":6,"type":"single","prompt":"韦勒克划分文学研究的内部研究指","options":[{"key":"A","text":"文学与社会的关系"},{"key":"B","text":"文学的形式、结构等内在因素"},{"key":"C","text":"文学的作者生平"},{"key":"D","text":"文学的出版历史"}],"key":"B","answer":"文学的形式、结构等内在因素","max":1,"id":"西方文论-17-single-6"},{"n":7,"type":"single","prompt":"布鲁克斯的“反讽”指的是","options":[{"key":"A","text":"简单的讽刺"},{"key":"B","text":"文学中对立意义的并存"},{"key":"C","text":"直接的批评"},{"key":"D","text":"宗教的隐喻"}],"key":"B","answer":"文学中对立意义的并存","max":1,"id":"西方文论-17-single-7"},{"n" 学","answer":"哲学","max":2,"id":"西方文论-17-fill-16"},{"n":17,"type":"fill","prompt":"艾略特的“非个性化”观点强调文学是传统的 ______ 组成部分。","options":[],"key":"有机","answer":"有机","max":2,"id":"西方文论-17-fill-17"},{"n":18,"type":"fill","prompt":"瑞恰慈的“情感语言”指的是表达 ______ 的语言。","options":[],"key":"情感","answer":"情感","max":2,"id":"西方文论-17-fill-18"},{"n":19,"type":"fill","prompt":"兰色姆的“张力”理论强调文学中 ______ 因素的统一。","options":[],"key":"对立","answer":"对立","max":2,"id":"西方文论-17-fill-19"},{"n":20,"type":"fill","prompt":"韦勒克划分文学研究的内部研究指文学的形式、 ______ 等内在因素。","options":[],"key":"结构","answer":"结构","max":2,"id":"西方文论-17-fill-20"},{"n":21,"type":"fill","prompt":"布鲁克斯的“反讽”指的是文学中 ______ 意义的并存。","options":[],"key":"对立","answer":"对立","max":2,"id":"西方文论-17-fill-21"},{"n":22,"type":"fill","prompt":"英美新批评的“细读”指对文本进行 ______ 的形式分析。","options":[],"key":"细致","answer":"细致","max":2,"id":"西方文论-17-fill-22"},{"n":23,"type":"fill","prompt":"英美新批评的共同点主要体现在关注文本、强调 ______ 和忽视作者读者。","options":[],"key":"细读","answer":"细读","max":2,"id":"西方文论-17-fill-23"},{"n":24,"type":"term","prompt":"非个性化(艾略特)","options":[],"key":"","answer":"艾略特提出的文论观点,强调文学不是作家个人情感的直接表达,而是文学传统的有机组成部分。作家应融入传统,使作品成为传统的一部分,而非突出个人的个性和情感。这一观点否定了浪漫主义的自我表现,是英美新批评的重要主张。","max":3,"id":"西方文论-17-term-24"},{"n":25,"type":"term","prompt":"情感语言(瑞恰慈)","options":[],"key":"","answer":"瑞恰慈提出的文论概念,他是英美新批评的代表人物,把语言分为“情感语言”和“符号语言”。“情感语言”指用于表达情感、态度的语言,区别于用于表达事实的“符号语言”,其功能是唤起情感和态度,而非传递信息,文学语言主要是情感语言。","max":3,"id":"西方文论-17-term-25"},{"n":26,"type":"term","prompt":"张力(兰色姆)","options":[],"key":"","answer":"兰色姆提出的文论概念,指文学文本中内涵与外延、字面意义与隐喻意义等对立因素的相互作用和统一。张力使文本的意义变得丰富和复杂,是诗歌艺术的本质特征,也是兰色姆本体论批评中关于诗歌肌质与骨架的重要概念。","max":3,"id":"西方文论-17-term-26"},{"n":27,"type":"term","prompt":"内部研究与外部研究(韦勒克)","options":[],"key":"","answer":"韦勒克提出的文学研究划分:内部研究关注文学文本的形式、结构、语言、意象等内在因素;外部研究关注文学与社会、作者、读者等外部因素的关系。这一划分明确了文学研究的对象和方法,强调文学研究应聚焦于文本内部。","max":3,"id":"西方文论-17-term-27"},{"n":28,"type":"short","prompt":"简述如何理解艾略特的非个性与客观对应物。","options":[],"key":"","answer":"艾略特的“非个性”强调文学是文学传统的有机组成部分,作家应融入传统,而非突出个人的情感和个性。“客观对应物”指用客观的意象、场景等表达情感,避免作家的直接抒情,其代表作《荒原》即通过客观意象表达现代社会的精神荒原。二者都体现了艾略特对文学客观性的强调。","max":5,"id":"西方文论-17-short-28"},{"n":29,"type":"short","prompt":"简述如何理解瑞恰慈的情感语言与实用批评。","options":[],"key":"","answer":"瑞恰慈是英美新批评的代表人物,其“情感语言”是指用于表达情感、态度的语言,区别于表达事实的“符号语言”,文学语言主要是情感语言。“实用批评”是指对文本进行实际的语言、 形式分析,通过细致阅读文本的语言、意象等,揭示其情感表达和意义结构。二者都体现了瑞恰慈重视文本语言分析的倾向。","max":5,"id":"西方文论-17-short-29"},{"n":30,"type":"short","prompt":"简述韦勒克划分文学研究的内部研究和外部研究有何意义。","options":[],"key":"","answer":"韦勒克是英美新批评的代表人物,他把文学研究划分为内部研究和外部研究,其意义在于: 明确了文学研究的对象和方法,强调文学研究应聚焦于文本的形式、结构、语言等内在因素;区分了文学研究与社会学、历史学等其他学科的研究,推动了英美新批评的发展,为后世文学理论提供了方法论指导。","max":5,"id":"西方文论-17-short-30"},{"n":31,"type":"essay","prompt":"论述英美新批评文论的主要特点及共同点。","options":[],"key":"","answer":"英美新批评文论的主要特点:文本中心,强调聚焦文本本身,排除作者和读者的影响,认为意义存在于文本内部;形式分析,注重对语言、结构、意象、隐喻等形式因素的细致分析, 即“细读”方法;反浪漫主义,否定浪漫主义的自我表现和情感宣泄。 其共同点:都将研究重心放在文本形式上,主张通过“细读”揭示文本的内在意义,反对从外部因素解释文本。","max":15,"id":"西方文论-17-essay-31"},{"n":32,"type":"essay","prompt":"论述英美新批评的产生与社会历史语境的关系。","options":[],"key":"","answer":"英美新批评的产生与特定社会历史语境密切相关。 现代诗歌的发展:20世纪初现代诗歌的语言和形式复杂,需要新的批评方法。 哲学语言学的影响:逻辑实证主义、语言分析哲学使人们重视语言的形式和意义,为新批评提供了理论基础。 对传统文论的反叛:传统文论注重作者生平、社会背景,新批评主张回归文本。","max":15,"id":"西方文论-17-essay-32"}],"rawMax":88},{"id":"西方文论-18","title":"章节练习(13章)","questions":[{"n":1,"type":"single","prompt":"结构主义思潮的基本内涵不包括","options":[{"key":"A","text":"强调结构的整体性"},{"key":"B","text":"注重元素的独立性"},{"key":"C","text":"关注结构的共时性"},{"key":"D","text":"主张结构的系统性"}],"key":"B","answer":"注重元素的独立性","max":1,"id":"西方文论-18-single-1"},{"n":2,"type":"single","prompt":"索绪尔语言学的“能指”指的是","options":[{"key":"A","text":"语言的意义"},{"key":"B","text":"语言的声音形象"},{"key":"C","text":"语言的所指对象"},{"key":"D","text":"语言的语法规则"}],"key":"B","answer":"语言的声音形象","max":1,"id":"西方文论-18-single-2"},{"n":3,"type":"single","prompt":"列维-斯特劳斯分析神话的双重结构强调","options":[{"key":"A","text":"神话的单一意义"},{"key":"B","text":"神话的历时演变"},{"key":"C","text":"神话中对立元素的统一"},{"key":"D","text":"神话的个人创作"}],"key":"C","answer":"神话中对立元素的统一","max":1,"id":"西方文论-18-single-3"},{"n":4,"type":"single","prompt":"巴 系是任意的"},{"key":"C","text":"能指决定所指"},{"key":"D","text":"所指决定能指"}],"key":"B","answer":"能指与所指的联系是任意的","max":1,"id":"西方文论-18-single-12"},{"n":13,"type":"single","prompt":"列维-斯特劳斯的文论属于","options":[{"key":"A","text":"结构主义"},{"key":"B","text":"浪漫主义"},{"key":"C","text":"现实主义"},{"key":"D","text":"古典主义"}],"key":"A","answer":"结构主义","max":1,"id":"西方文论-18-single-13"},{"n":14,"type":"single","prompt":"结构主义文论的核心是","options":[{"key":"A","text":"文本结构"},{"key":"B","text":"作者意图"},{"key":"C","text":"读者反应"},{"key":"D","text":"社会背景"}],"key":"A","answer":"文本结构","max":1,"id":"西方文论-18-single-14"},{"n":15,"type":"single","prompt":"托多罗夫的“叙事话语”不包括","options":[{"key":"A","text":"叙事时间"},{"key":"B","text":"叙事体态"},{"key":"C","text":"叙事语式"},{"key":"D","text":"叙事作者"}],"key":"D","answer":"叙事作者","max":1,"id":"西方文论-18-single-15"},{"n":16,"type":"fill","prompt":"结构主义思潮的基本内涵包括强调结构的整体性、关注结构的 ______ 性和主张结构的系统性。","options":[],"key":"共时","answer":"共时","max":2,"id":"西方文论-18-fill-16"},{"n":17,"type":"fill","prompt":"索绪尔语言学的“所指”指的是语言的 ______ 。","options":[],"key":"意义","answer":"意义","max":2,"id":"西方文论-18-fill-17"},{"n":18,"type":"fill","prompt":"列维-斯特劳斯分析神话的双重结构强调神话中 ______ 元素的统一。","options":[],"key":"对立","answer":"对立","max":2,"id":"西方文论-18-fill-18"},{"n":19,"type":"fill","prompt":"巴尔特“零度写作”强调文本的 ______ 中立。","options":[],"key":"客观","answer":"客观","max":2,"id":"西方文论-18-fill-19"},{"n":20,"type":"fill","prompt":"托多罗夫的“叙事语式”指的是叙事的 ______ 类型。","options":[],"key":"视角","answer":"视角","max":2,"id":"西方文论-18-fill-20"},{"n":21,"type":"fill","prompt":"索绪尔语言学提出的基本对立包括语言与言语、能指与所指和 ______ 与历时。","options":[],"key":"共时","answer":"共时","max":2,"id":"西方文论-18-fill-21"},{"n":22,"type":"fill","prompt":"结构主义文学理论的总体特征是强调文本结构、主张 ______ 分析和注重结构系统。","options":[],"key":"共时","answer":"共时","max":2,"id":"西方文论-18-fill-22"},{"n":23,"type":"fill","prompt":"托多罗夫的“叙事语法”指的是叙事的 ______ 模式。","options":[],"key":"结构","answer":"结构","max":2,"id":"西方文论-18-fill-23"},{"n":24,"type":"term","prompt":"能指与所指(索绪尔)","options":[],"key":"","answer":"索绪尔语言学中的核心概念,出自其《普通语言学教程》:“能指”是语言的声音形象或书写形式,“所指”是其代表的意义或概念。二者构成语言符号,联系具有任意性。这一区分揭示了语言符号的结构本质,是结构主义文论的基础。","max":3,"id":"西方文论-18-term-24"},{"n":25,"type":"term","prompt":"零度写作(巴尔特)","options":[],"key":"","answer":"巴尔特提出的写作观念,主张作者在创作时保持客观中立,排除个人的情感、价值判断和意识形态干预,使文本呈现出“中性”状态。这一观念强调文本的自主性,否定作者对意义的垄断,是结构主义文论的重要观念。","max":3,"id":"西方文论-18-term-25"},{"n":26,"type":"term","prompt":"叙事语法(托多罗夫)","options":[],"key":"","answer":"托多罗夫是结构主义叙事学的代表人物,其叙事语法指叙事作品的结构模式,包括情节的组合方式、角色的功能等,类似语言的语法规则。通过分析叙事语法可以揭示叙事的深层结构,其代表作《叙事话语》即运用了这一分析。","max":3,"id":"西方文论-18-term-26"},{"n":27,"type":"term","prompt":"作者之死(巴尔特)","options":[],"key":"","answer":"巴尔特的著名观点,该观点认为文本意义不由作者决定,而是由读者和文本结构共同生成, 作者的意图对文本意义无绝对权威。这一观点否定了传统的作者中心论,强调文本的自主性和读者的能动性,是结构主义文论的重要主张。","max":3,"id":"西方文论-18-term-27"},{"n":28,"type":"short","prompt":"简述索绪尔语言学提出的基本对立及符号任意性原则。","options":[],"key":"","answer":"索绪尔在《普通语言学教程》中提出的基本对立有三:语言与言语,语言是系统,言语是具体运用;能指与所指,即符号的形式与意义;共时与历时,即结构分析与历史演变。符号任意性原则指能指与所指的联系是约定俗成的,这些对立共同构成索绪尔语言学的理论基础。","max":5,"id":"西方文论-18-short-28"},{"n":29,"type":"short","prompt":"简述什么是“叙事话语”,分别包括哪几个方面。","options":[],"key":"","answer":"“叙事话语”是托多罗夫对叙事作品语言层面的分析,包括三个方面:叙事时间,涉及时序与时长;叙事体态,即叙事视角,分为全知、限知等,视角不同会影响叙事效果和读者的感知;叙事语式,即叙事的表达方式。其分析可以揭示叙事作品的形式特征,是结构主义叙事学的重要概念。","max":5,"id":"西方文论-18-short-29"},{"n":30,"type":"short","prompt":"简述如何理解列维-斯特劳斯和雅各布森对《猫》的分析中体现的二项对立关系。","options":[],"key":"","answer":"列维-斯特劳斯和雅各布森对《猫》的分析体现了文本中的二项对立关系:猫的“家养”与“野生”、“好”与“坏”等对立因素并存。这些对立不是孤立的,而是相互联系、构成整体结构, 意义在对立的张力中产生。结构主义由此注重从对立关系中把握文本的意义,意义在对立的结构中生成。","max":5,"id":"西方文论-18-short-30"},{"n":31,"type":"essay","prompt":"论述结构主义文学理论的总体特征及贡献与不足。","options":[],"key":"","answer":"总体特征:视文本为独立结构系统,关注内部形式、规则与关系;主张共时分析,研究同一时间维度的结构构成;认为意义由结构决定,元素意义依赖其结构位置;反对作者中心,强调文本自主性。 贡献:提供了系统的文本分析方法;打破了作者中心论,为后现代文论奠定基础;揭示文本深层结构和普遍规律。 不足:过度形式化,忽视社会历史文化语境,理论抽象。","max":15,"id":"西方文论-18-essay-31"},{"n":32,"type":"essay","prompt":"论述巴尔特的“零度写作”和“作者之死”,并试用他的符号学理论分析一则大众文化现","options":[],"key":"","answer":"象。 零度写作:文本客观中立,排除作者情感和价值判断,呈“中性”状态。作者之死:文本意义由读者和文本结构共同生成,否定作者权威。 以广告为例:其意义不仅是实用价值,更是能指构建的符号系统,传递时尚、身份等意义; 零度写作视角下,广告看似客观,实则含意识形态操控;作者之死说明广告意义由消费者依据自身背景解读。","max":15,"id":"西方文论-18-essay-32"}],"rawMax":88},{"id":"西方文论-19","title":"章节练习(14章)","questions":[{"n":1,"type":"single","prompt":"西方马克思主义文论的特点不包括","options":[{"key":"A","text":"结合马克思主义与西方思潮"},{"key":"B","text":"强调文学的意识形态性"},{"key":"C","text":"忽视文学的审美特性"},{"key":"D","text":"关注社会现实与文化批判"}],"key":"C","answer":"忽视文学的审美特性","max":1,"id":"西方文论-19-single-1"},{"n":2,"type":"single","prompt":"卢卡契现实主义理论的核心是","options":[{"key":"A","text":"强调现代主义的创新性"},{"key":"B","text":"主张文学反映社会总体性"},{"key":"C","text":"推崇形式主义的技巧"},{"key":"D","text":"否定文学的社会功能"}],"key":"B","answer":"主张文学反映社会总体性","max":1,"id":"西方文论-19-single-2"},{"n":3,"type":"single","prompt":"詹姆逊将资本主义文学经历分为个时期","options":[{"key":"A","text":"二"},{"key":"B","text":"三"},{"key":"C","text":"四"},{"key":"D","text":"五"}],"key":"B","answer":"三","max":1,"id":"西方文论-19-single-3"},{"n":4,"type":"single","prompt":"本雅明艺术生产理论的基本内涵是","options":[{"key":"A","text":"艺术模仿现实"},{"key":"B","text":"艺术是一种生产形式"},{"key":"C","text":"艺术服务于宗教"},{"key":"D","text":"艺术是个人的自我表现"}],"key":"B","answer":"艺术是一种生产形式","max":1,"id":"西方文论-19-single-4"},{"n":5,"type":"single","prompt":"马歇雷的文学生产理论包含个命题","options":[{"key":"A","text":"二"},{"key":"B","text":"三"},{"key":"C","text":"四"},{"key":"D","text":"五"}],"key":"B","answer":"三","max":1,"id":"西方文论-19-single-5"},{"n":6,"type":"single","prompt":"伊格尔顿文学思想的核心内容是","options":[{"key":"A","text":"形式主义文论"},{"key":"B","text":"女性主义文论"},{"key":"C","text":"马克思主义文论"},{"key":"D","text":"解构主义文论"}],"key":"C","answer":"马克思主义文论","max":1,"id":"西方文论-19-single-6"},{"n":7,"type":"single","prompt":"阿多诺艺术否定性观点强调","options":[{"key":"A","text":"艺术与现实的同一"},{"key":"B","text":"艺术对现实的肯定"},{"key":"C","text":"艺术对现实的否定"},{"key":"D","text":"艺术与现实无关"}],"key":"C","answer":"艺术对现实的否定","max":1,"id":"西方文论-19-single-7"},{"n":8,"type":"single","prompt":"洛文塔尔大众文学批判性观点认为大众文学","options":[{"key":"A","text":"具有解放功能"},{"key":"B","text":"是意识形态的工具"},{"key":"C","text":"纯粹是娱乐"},{"key":"D","text":"与社会无关"}],"key":"B","answer":"是意识形态的工具","max":1,"id":"西方文论-19-single-8"},{"n":9,"type":"single","prompt":"西方马克思主义文论的代表人物不包括","options":[{"key":"A","text":"卢卡契"},{"key":"B","text":"本雅明"},{"key":"C","text":"德里达"},{"key":"D","text":"伊格尔顿"}],"key":"C","answer":"德里达","max":1,"id":"西方文论-19-single-9"},{"n":10,"type":"single","prompt":"卢卡契的代表作是","options":[{"key":"A","text":"《历史与阶级意识》"},{"key":"B","text":"《发达资本主义时代的抒情诗人》"},{"key":"C","text":"《批评的解剖》"},{"key":"D","text":"《诗学》"}],"key":"A","answer":"《历史与阶级意识》","max":1,"id":"西方文论-19-single-10"},{"n":11,"type":"single","prompt":"詹姆逊现实主义的理论基本内容是","options":[{"key":"A","text":"强调文学的形式创新"},{"key":"B","text":"主张文学反映社会总体性"},{"key":"C","text":"否定文学的社会功能"},{"key":"D","text":"推崇个人的主观体验"}],"key":"B","answer":"主张文学反映社会总体性","max":1,"id":"西方文论-19-single-11"},{"n":12,"type":"single","prompt":"本雅明的艺术生产理论认为艺术的生产力是","options":[{"key":"A","text":"技术"},{"key":"B","text":"模仿"},{"key":"C","text":"灵感"},{"key":"D","text":"宗教"}],"key":"A","answer":"技术","max":1,"id":"西方文论-19-single-12"},{"n":13,"type":"single","prompt":"阿多诺与洛文塔尔对大众文化研究的相同点是","options":[{"key":"A","text":"都肯定大众文化"},{"key":"B","text":"都忽视大众文化"},{"key":"C","text":"都关注大众文化的意识形态性"},{"key":"D","text":"都认为大众文化与社会无关"}],"key":"C","answer":"都关注大众文化的意识形态性","max":1,"id":"西方文论-19-single-13"},{"n":14,"type":"single","prompt":"西方马克思主义文论的核心是","options":[{"key":"A","text":"文本形式"},{"key":"B","text":"作者意图"},{"key":"C","text":"意识形态与社会现实"},{"key":"D","text":"读者反应"}],"key":"C","answer":"意识形态与社会现实","max":1,"id":"西方文论-19-single-14"},{"n":15,"type":"single","prompt":"伊格尔顿对现实主义与现代主义之争的看法是","options":[{"key":"A","text":"完全肯定现实主义"},{"key":"B","text":"完全肯定现代主义"},{"key":"C","text":"辩证看待二者"},{"key":"D","text":"认为二者无关"}],"key":"C","answer":"辩证看待二者","max":1,"id":"西方文论-19-single-15"},{"n":16,"type":"fill","prompt":"西方马克思主义文论的特点是结合马克思主义与 ______ 思潮。","options":[],"key":"西方","answer":"西方","max":2,"id":"西方文论-19-fill-16"},{"n":17,"type":"fill","prompt":"卢卡契现实主义理论的核心是主张文学反映社会 ______ 性。","options":[],"key":"总体","answer":"总体","max":2,"id":"西方文论-19-fill-17"},{"n":18,"type":"fill","prompt":"詹姆逊将资本主义文学经历分为 ______ 个时期。","options":[],"key":"三","answer":"三","max":2,"id":"西方文论-19-fill-18"},{"n":19,"type":"fill","prompt":"本雅明艺术生产理论的基本内涵是艺术是一种 ______ 形式。","options":[],"key":"生产","answer":"生产","max":2,"id":"西方文论-19-fill-19"},{"n":20,"type":"fill","prompt":"马歇雷的文学生产理论包含 ______ 个命题。","options":[],"key":"三","answer":"三","max":2,"id":"西方文论-19-fill-20"},{"n":21,"type":"fill","prompt":"伊格尔顿文学思想的核心内容是 ______ 文论。","options":[],"key":"马克思主义","answer":"马克思主义","max":2,"id":"西方文论-19-fill-21"},{"n":22,"type":"fill","prompt":"阿多诺艺术否定性观点强调艺术对现实的 ______ 。","options":[],"key":"否定","answer":"否定","max":2,"id":"西方文论-19-fill-22"},{"n":23,"type":"fill","prompt":"西方马克思主义文论的核心是意识形态与 ______ 现实。","options":[],"key":"社会","answer":"社会","max":2,"id":"西方文论-19-fill-23"},{"n":24,"type":"term","prompt":"西方马克思主义文论","options":[],"key":"","answer":"西方马克思主义文论是将马克思主义理论与西方各种学术思潮相结合的文论思潮,代表人物有卢卡契、本雅明、伊格尔顿等。其核心是分析文学的意识形态性及其与社会现实的关系, 关注文化批判,同时重视文学的审美特性。","max":3,"id":"西方文论-19-term-24"},{"n":25,"type":"term","prompt":"艺术生产理论(本雅明)","options":[],"key":"","answer":"本雅明提出的文论观点,认为艺术是一种生产形式,有其生产技术、生产过程和产品。艺术生产的生产力是技术,机械复制技术改变了艺术的原创性和权威性,艺术生产的关系影响艺术的形式和功能,为分析艺术与社会的关系提供了新视角。","max":3,"id":"西方文论-19-term-25"},{"n":26,"type":"term","prompt":"阿多诺的艺术否定性","options":[],"key":"","answer":"阿多诺提出的艺术观点,认为艺术的本质是对现实的否定和批判。艺术通过与现实的对立, 保持自身的独立性,从而揭示现实的矛盾和异化,实现其批判功能。这种否定性通过审美形式对现实进行深刻反思,体现了艺术的批判性和独立性。","max":3,"id":"西方文论-19-term-26"},{"n":27,"type":"term","prompt":"卢卡契的社会总体性","options":[],"key":"","answer":"卢卡契是西方马克思主义文论的代表人物,社会总体性是其现实主义理论的核心概念,指文学应反映社会的总体性,即揭示社会各方面本质联系和发展规律。通过对社会总体性的把握,文学能够揭示社会的发展趋势和内在矛盾。","max":3,"id":"西方文论-19-term-27"},{"n":28,"type":"short","prompt":"简述本雅明艺术生产理论的基本内涵。","options":[],"key":"","answer":"本雅明的艺术生产理论借鉴马克思的生产理论,将艺术视为一种生产形式,具有生产技术、 生产过程和产品。艺术生产的生产力是技术,机械复制技术改变了艺术的原创性和权威性, 使艺术更具大众性。这一理论强调艺术的物质性和技术性,为分析艺术与社会的关系提供了新视角。","max":5,"id":"西方文论-19-short-28"},{"n":29,"type":"short","prompt":"简述马歇雷的文学生产理论包含哪三个命题。","options":[],"key":"","answer":"马歇雷是西方马克思主义文论的代表人物,其文学生产理论包含三个命题:一是文学是意识形态的生产,文学作品产生于意识形态又对它进行加工;二是文学文本存在内在矛盾,这是意识形态与艺术形式冲突的体现;三是文学的阅读是生产性的,读者通过阅读参与文本意义的生产。","max":5,"id":"西方文论-19-short-29"},{"n":30,"type":"short","prompt":"简述如何理解阿多诺艺术否定性观点。","options":[],"key":"","answer":"阿多诺的艺术否定性观点强调艺术对现实的否定和批判。艺术通过与现实的对立,保持自身的独立性,从而揭示现实的矛盾和异化。这种否定性通过审美形式进行深刻反思,使艺术具有社会批判功能。他认为艺术只有与现实保持距离,才能实现其批判价值和审美价值。","max":5,"id":"西方文论-19-short-30"},{"n":31,"type":"essay","prompt":"论述西方马克思主义文论的特点及贡献。","options":[],"key":"","answer":"西方马克思主义文论的特点:将马克思主义理论与西方各种学术思潮结合;强调意识形态分析,分析文学如何反映和建构社会意识形态;关注社会现实与文化批判;重视文学的审美特性,试图将意识形态分析与审美分析结合。 贡献:拓展了马克思主义文论的视野,深化了对文学与社会关系的理解;推动了文化研究的发展,为大众文化研究提供理论支持。","max":15,"id":"西方文论-19-essay-31"},{"n":32,"type":"essay","prompt":"论述阿多诺和洛文塔尔对大众文化研究的异同。","options":[],"key":"","answer":"相同点:二者都关注大众文化的意识形态性,认为它与资本主义意识形态相关;都对大众文化持批判态度,认为它具有麻痹大众、维护统治的功能。 不同点:阿多诺强调大众文化的统一性和压抑性,认为它是“文化工业”的产物,具有高度的标准化和同质化;洛文塔尔关注其多样性和历史性,认为读者具有能动性,方法上采用历史文化的分析。","max":15,"id":"西方文论-19-essay-32"}],"rawMax":88},{"id":"西方文论-20","title":"章节练习(15章)","questions":[{"n":1,"type":"single","prompt":"读者接受文论产生的历史原因不包括","options":[{"key":"A","text":"结构主义的发展"},{"key":"B","text":"现象学的影响"},{"key":"C","text":"形式主义的复兴"},{"key":"D","text":"对作者中心论的反叛"}],"key":"C","answer":"形式主义的复兴","max":1,"id":"西方文论-20-single-1"},{"n":2,"type":"single","prompt":"英加登的“未定点”理论认为文本存在","options":[{"key":"A","text":"确定的意义"},{"key":"B","text":"未确定的意义空白"},{"key":"C","text":"与读者无关的意义"},{"key":"D","text":"仅由作者决定的意义"}],"key":"B","answer":"未确定的意义空白","max":1,"id":"西方文论-20-single-2"},{"n":3,"type":"single","prompt":"伊瑟尔的“召唤结构”强调","options":[{"key":"A","text":"文本对读者的召唤作用"},{"key":"B","text":"作者对读者的控制"},{"key":"C","text":"文本的封闭性"},{"key":"D","text":"读者的被动性"}],"key":"A","answer":"文本对读者的召唤作用","max":1,"id":"西方文论-20-single-3"},{"n":4,"type":"single","prompt":"费什的“解释团体”指的是","options":[{"key":"A","text":"单一的读者个体"},{"key":"B","text":"具有共同解释策略的读者群体"},{"key":"C","text":"作者的朋友团体"},{"key":"D","text":"文本的出版团体"}],"key":"B","answer":"具有共同解释策略的读者群体","max":1,"id":"西方文论-20-single-4"},{"n":5,"type":"single","prompt":"卡勒的“文学能力”指读者","options":[{"key":"A","text":"阅读文学作品的体力"},{"key":"B","text":"理解文学形式和惯例的能力"},{"key":"C","text":"创作文学作品的能力"},{"key":"D","text":"记忆文学作品的能力"}],"key":"B","answer":"理解文学形式和惯例的能力","max":1,"id":"西方文论-20-single-5"},{"n":6,"type":"single","prompt":"读者接受文学理论的特征不包括","options":[{"key":"A","text":"强调读者的作用"},{"key":"B","text":"关注文本的确定性"},{"key":"C","text":"重视阅读的过程"},{"key":"D","text":"主张意义的生成性"}],"key":"B","answer":"关注文本的确定性","max":1,"id":"西方文论-20-single-6"},{"n":7,"type":"single","prompt":"姚斯的“历史距离与视域融合”中,“视域融合”指","options":[{"key":"A","text":"读者视域与文本视域的融合"},{"key":"B","text":"作者视域与读者视域的融合"},{"key":"C","text":"文本视域与历史视域的融合"},{"key":"D","text":"读者视域与历史视域的融合"}],"key":"A","answer":"读者视域与文本视域的融合","max":1,"id":"西方文论-20-single-7"},{"n":8,"type":"single","prompt":"读者接受文论与传统文学理论的区别在于","options":[{"key":"A","text":"传统理论强调读者,接受理论强调作者"},{"key":"B","text":"传统理论强调文本,接受理论强调读者"},{"key":"C","text":"传统理论强调形式,接受理论强调内容"},{"key":"D","text":"传统理论强调社会,接受理论强调个人"}],"key":"B","answer":"传统理论强调文本,接受理论强调读者","max":1,"id":"西方文论-20-single-8"},{"n":9,"type":"single","prompt":"英加登的代表作是","options":[{"key":"A","text":"《阅读行为》"},{"key":"B","text":"《审美经验与文学解释学》"},{"key":"C","text":"《反对阐释》"},{"key":"D","text":"《诗学》"}],"key":"B","answer":"《审美经验与文学解释学》","max":1,"id":"西方文论-20-single-9"},{"n":10,"type":"single","prompt":"伊瑟尔的文论属于","options":[{"key":"A","text":"读者接受文论"},{"key":"B","text":"结构主义文论"},{"key":"C","text":"形式主义文论"},{"key":"D","text":"新批评文论"}],"key":"A","answer":"读者接受文论","max":1,"id":"西方文论-20-single-10"},{"n":11,"type":"single","prompt":"费什的“解释团体”理论认为文本意义由决定","options":[{"key":"A","text":"作者"},{"key":"B","text":"文本"},{"key":"C","text":"解释团体的策略"},{"key":"D","text":"读者个体"}],"key":"C","answer":"解释团体的策略","max":1,"id":"西方文论-20-single-11"},{"n":12,"type":"single","prompt":"卡勒的“文学能力”是读者进行文学阅读的","options":[{"key":"A","text":"生理基础"},{"key":"B","text":"心理基础"},{"key":"C","text":"社会基础"},{"key":"D","text":"形式基础"}],"key":"D","answer":"形式基础","max":1,"id":"西方文论-20-single-12"},{"n":13,"type":"single","prompt":"姚斯的文论属于","options":[{"key":"A","text":"接受美学"},{"key":"B","text":"解构主义"},{"key":"C","text":"女权主义"},{"key":"D","text":"后殖民主义"}],"key":"A","answer":"接受美学","max":1,"id":"西方文论-20-single-13"},{"n":14,"type":"single","prompt":"读者接受文论的核心是","options":[{"key":"A","text":"作者的创作意图"},{"key":"B","text":"文本的形式结构"},{"key":"C","text":"读者的阅读过程和意义生成"},{"key":"D","text":"社会的历史背景"}],"key":"C","answer":"读者的阅读过程和意义生成","max":1,"id":"西方文论-20-single-14"},{"n":15,"type":"single","prompt":"用马克思的生产—消费理论分析文学阅读的读者导向,强调","options":[{"key":"A","text":"读者是文学消费的主体"},{"key":"B","text":"作者是文学生产的主体"},{"key":"C","text":"文本是文学流通的主体"},{"key":"D","text":"市场是文学发展的主体"}],"key":"A","answer":"读者是文学消费的主体","max":1,"id":"西方文论-20-single-15"},{"n":16,"type":"fill","prompt":"读者接受文论产生的文化背景包括现象学的影响和对 ______ 中心论的反叛。","options":[],"key":"作者","answer":"作者","max":2,"id":"西方文论-20-fill-16"},{"n":17,"type":"fill","prompt":"英加登的“未定点”理论认为文本存在未确定的意义 ______ 。","options":[],"key":"空白","answer":"空白","max":2,"id":"西方文论-20-fill-17"},{"n":18,"type":"fill","prompt":"伊瑟尔的“召唤结构”强调文本对 ______ 的召唤作用。","options":[],"key":"读者","answer":"读者","max":2,"id":"西方文论-20-fill-18"},{"n":19,"type":"fill","prompt":"费什的“解释团体”指的是具有共同 ______ 策略的读者群体。","options":[],"key":"解释","answer":"解释","max":2,"id":"西方文论-20-fill-19"},{"n":20,"type":"fill","prompt":"卡勒的“文学能力”指读者理解文学 ______ 和惯例的能力。","options":[],"key":"形式","answer":"形式","max":2,"id":"西方文论-20-fill-20"},{"n":21,"type":"fill","prompt":"读者接受文学理论的特征包括强调读者的作用、重视阅读的过程和主张意义的 ______ 性。","options":[],"key":"生成","answer":"生成","max":2,"id":"西方文论-20-fill-21"},{"n":22,"type":"fill","prompt":"姚斯的“视域融合”指读者的当前视域与文本所体现的 ______ 视域的融合。","options":[],"key":"历史","answer":"历史","max":2,"id":"西方文论-20-fill-22"},{"n":23,"type":"fill","prompt":"读者接受文论与传统文学理论的区别在于传统理论强调文本,接受理论强调 ______ 。","options":[],"key":"读者","answer":"读者","max":2,"id":"西方文论-20-fill-23"},{"n":24,"type":"term","prompt":"未定点(英加登)","options":[],"key":"","answer":"英加登提出的文论概念,指文学文本中存在的意义空白和不确定点。这些未定点需要读者在阅读过程中进行填补和具体化,从而参与文本意义的生成,体现了读者在文学接受中的能动性,其代表作《审美经验与文学解释学》对此有阐述。","max":3,"id":"西方文论-20-term-24"},{"n":25,"type":"term","prompt":"召唤结构(伊瑟尔)","options":[],"key":"","answer":"伊瑟尔提出的文论概念,指文学文本通过设置空白、空缺和不确定点,召唤读者积极参与, 填补这些空白,从而生成文本的意义。这种结构体现了文本对读者的召唤作用,使读者成为意义生成的主体,其代表作《阅读行为》阐述了这一理论。","max":3,"id":"西方文论-20-term-25"},{"n":26,"type":"term","prompt":"解释团体(费什)","options":[],"key":"","answer":"费什提出的文论概念,指具有共同解释策略的读者群体。该群体的解释策略决定了他们对文本的理解和阐释,文本的意义并非由文本本身或作者决定,而是由解释团体的共同策略生成,强调了读者群体在阐释中的作用。","max":3,"id":"西方文论-20-term-26"},{"n":27,"type":"term","prompt":"文学能力(卡勒)","options":[],"key":"","answer":"卡勒提出的文论概念,指读者理解文学形式和惯例的能力,即理解叙事结构、隐喻、象征等文学形式的能力。这种能力是读者进行文学阅读和阐释的基础,使读者能够识别和理解文学作品的独特性,是读者接受文论的重要概念。","max":3,"id":"西方文论-20-term-27"},{"n":28,"type":"short","prompt":"简述读者接受文学理论具有哪些特征,它与传统文学理论的区别是什么。","options":[],"key":"","answer":"读者接受文学理论的特征有:强调读者的作用,认为读者是意义生成的主体;重视阅读的过程,关注阅读过程;主张意义的生成性,认为意义是在读者与文本的互动中产生的。与传统文学理论的区别:传统理论以文本或作者为中心,接受理论以读者为中心,强调文本的开放性和读者的能动性。","max":5,"id":"西方文论-20-short-28"},{"n":29,"type":"short","prompt":"简述如何理解费什的“解释团体”和卡勒的“文学能力”。","options":[],"key":"","answer":"费什的“解释团体”是指具有共同解释策略的读者群体,其解释策略决定了对文本的理解和意义生成,强调读者群体在阐释中的作用。卡勒的“文学能力”是读者理解文学形式和惯例的能力,是读者进行文学阅读和阐释的基础。二者都强调读者的重要性,前者侧重读者群体,后者侧重读者个体。","max":5,"id":"西方文论-20-short-29"},{"n":30,"type":"short","prompt":"简述如何理解姚斯的历史距离与视域融合的关系。","options":[],"key":"","answer":"姚斯的“历史距离”指读者与文本产生的历史时间间隔,这种距离使读者能够以客观的态度看待文本。“视域融合”是读者的当前视域与文本所体现的历史视域的融合,读者由此获得对文本的完整理解。历史距离是视域融合的前提,二者相互作用,使读者能在历史与现实的对话中理解文本。","max":5,"id":"西方文论-20-short-30"},{"n":31,"type":"essay","prompt":"论述读者接受文论的主要观点及在文论史上的意义。","options":[],"key":"","answer":"主要观点:强调读者的中心地位,认为读者是意义生成的主体;关注阅读过程,视阅读为读者与文本的互动;主张意义的生成性,认为意义在阅读中生成,开放而多元;重视文本的开放性,认为文本存在空白和不确定点。 在文论史上的意义:突破作者中心论和文本中心论,将研究重心转向读者;提供了读者反应批评等新方法;对文学教育和阅读实践有启示。","max":15,"id":"西方文论-20-essay-31"},{"n":32,"type":"essay","prompt":"试用马克思的生产—消费理论分析文学阅读的读者导向。","options":[],"key":"","answer":"马克思的生产—消费理论认为生产决定消费,消费也反作用于生产,二者辩证统一。 读者是文学消费主体:作品价值实现依赖读者的阅读和接受,读者的需求和审美趣味影响文学生产。 读者的消费反作用于文学生产:读者的选择与评价影响创作和出版决策,创造性阅读还赋予文本新意义。 文学阅读的生产性:阅读同时是消费与生产活动,读者参与意义生成。","max":15,"id":"西方文论-20-essay-32"}],"rawMax":88},{"id":"西方文论-21","title":"章节练习(16章)","questions":[{"n":1,"type":"single","prompt":"后结构主义的基本含义不包括","options":[{"key":"A","text":"解构结构的确定性"},{"key":"B","text":"强调意义的确定性"},{"key":"C","text":"关注语言的不确定性"},{"key":"D","text":"否定终极真理"}],"key":"B","answer":"强调意义的确定性","max":1,"id":"西方文论-21-single-1"},{"n":2,"type":"single","prompt":"德里达的“延异”指的是","options":[{"key":"A","text":"意义的稳定存在"},{"key":"B","text":"语言的确定意义"},{"key":"C","text":"意义的延迟与差异"},{"key":"D","text":"语言的单一含义"}],"key":"C","answer":"意义的延迟与差异","max":1,"id":"西方文论-21-single-2"},{"n":3,"type":"single","prompt":"德里达的“签名”理论强调","options":[{"key":"A","text":"作者签名的确定性"},{"key":"B","text":"文本意义的作者决定论"},{"key":"C","text":"签名的不确定性与文本的开放性"},{"key":"D","text":"签名与文本无关"}],"key":"C","answer":"签名的不确定性与文本的开放性","max":1,"id":"西方文论-21-single-3"},{"n":4,"type":"single","prompt":"德·曼的“隐喻”揭示语言和文学的本质属性是","options":[{"key":"A","text":"确定性"},{"key":"B","text":"透明性"},{"key":"C","text":"单一性"},{"key":"D","text":"不确定性"}],"key":"D","answer":"不确定性","max":1,"id":"西方文论-21-single-4"},{"n":5,"type":"single","prompt":"德·曼修辞阅读的目标是","options":[{"key":"A","text":"寻找确定意义"},{"key":"B","text":"揭示语言的修辞性与意义的不确定性"},{"key":"C","text":"强调作者意图"},{"key":"D","text":"关注文本的结构"}],"key":"B","answer":"揭示语言的修辞性与意义的不确定性","max":1,"id":"西方文论-21-single-5"},{"n":6,"type":"single","prompt":"米勒的“重复”指的是","options":[{"key":"A","text":"文本的完全复制"},{"key":"B","text":"意义的重复稳定"},{"key":"C","text":"文本中元素的差异性重复"},{"key":"D","text":"语言的单一使用"}],"key":"C","answer":"文本中元素的差异性重复","max":1,"id":"西方文论-21-single-6"},{"n":7,"type":"single","prompt":"米勒的“寄生”指的是","options":[{"key":"A","text":"文本对现实的完全模仿"},{"key":"B","text":"文本之间的相互依赖与解构"},{"key":"C","text":"文本的独立存在"},{"key":"D","text":"文本与现实无关"}],"key":"B","answer":"文本之间的相互依赖与解构","max":1,"id":"西方文论-21-single-7"},{"n":8,"type":"single","prompt":"后结构主义文论的特点不包括","options":[{"key":"A","text":"解构性"},{"key":"B","text":"强调意义的不确定性"},{"key":"C","text":"关注语言的自主性"},{"key":"D","text":"主张终极真理"}],"key":"D","answer":"主张终极真理","max":1,"id":"西方文论-21-single-8"},{"n":9,"type":"single","prompt":"德里达的代表作是","options":[{"key":"A","text":"《论文字学》"},{"key":"B","text":"《批评的解剖》"},{"key":"C","text":"《诗学》"},{"key":"D","text":"《文学理论》"}],"key":"A","answer":"《论文字学》","max":1,"id":"西方文论-21-single-9"},{"n":10,"type":"single","prompt":"德·曼的文论属于","options":[{"key":"A","text":"后结构主义"},{"key":"B","text":"结构主义"},{"key":"C","text":"新批评"},{"key":"D","text":"读者接受文论"}],"key":"A","answer":"后结构主义","max":1,"id":"西方文论-21-single-10"},{"n":11,"type":"single","prompt":"德里达文学模仿论与柏拉图文学模仿论的本质区别是","options":[{"key":"A","text":"都强调模仿的确定性"},{"key":"B","text":"德里达强调模仿的无底性,柏拉图强调模仿的确定性"},{"key":"C","text":"都否定模仿"},{"key":"D","text":"德里达强调模仿的确定性,柏拉图强调模仿的无底性"}],"key":"B","answer":"德里达强调模仿的无底性,柏拉图强调模仿的确定性","max":1,"id":"西方文论-21-single-11"},{"n":12,"type":"single","prompt":"米勒理解现实和文学的关系是","options":[{"key":"A","text":"文学模仿现实"},{"key":"B","text":"现实模仿文学"},{"key":"C","text":"文学与现实相互解构"},{"key":"D","text":"文学与现实无关"}],"key":"C","answer":"文学与现实相互解构","max":1,"id":"西方文论-21-single-12"},{"n":13,"type":"single","prompt":"解构主义文学批评是一种","options":[{"key":"A","text":"寻找确定意义的批评"},{"key":"B","text":"强调作者意图的批评"},{"key":"C","text":"揭示意义不确定性的批评"},{"key":"D","text":"关注文本结构的批评"}],"key":"C","answer":"揭示意义不确定性的批评","max":1,"id":"西方文论-21-single-13"},{"n":14,"type":"single","prompt":"后结构主义的核心是","options":[{"key":"A","text":"解构与意义的不确定性"},{"key":"B","text":"结构的确定性"},{"key":"C","text":"作者的权威性"},{"key":"D","text":"文本的封闭性"}],"key":"A","answer":"解构与意义的不确定性","max":1,"id":"西方文论-21-single-14"},{"n":15,"type":"single","prompt":"德·曼的“修辞”指的是","options":[{"key":"A","text":"语言的修饰技巧"},{"key":"B","text":"语言的确定意义"},{"key":"C","text":"语言的不确定性与修辞性"},{"key":"D","text":"语言的单一功能"}],"key":"C","answer":"语言的不确定性与修辞性","max":1,"id":"西方文论-21-single-15"},{"n":16,"type":"fill","prompt":"后结构主义的基本含义包括解构结构的确定性和强调意义的 ______ 性。","options":[],"key":"不确定","answer":"不确定","max":2,"id":"西方文论-21-fill-16"},{"n":17,"type":"fill","prompt":"德里达的“延异”指的是意义的 ______ 与差异。","options":[],"key":"延迟","answer":"延迟","max":2,"id":"西方文论-21-fill-17"},{"n":18,"type":"fill","prompt":"德里达的“签名”理论强调签名的不确定性与文本的 ______ 性。","options":[],"key":"开放","answer":"开放","max":2,"id":"西方文论-21-fill-18"},{"n":19,"type":"fill","prompt":"德·曼的“隐喻”揭示语言和文学的本质属性是 ______ 性。","options":[],"key":"不确定","answer":"不确定","max":2,"id":"西方文论-21-fill-19"},{"n":20,"type":"fill","prompt":"德·曼修辞阅读的目标是揭示语言的修辞性与意义的 ______ 性。","options":[],"key":"不确定","answer":"不确定","max":2,"id":"西方文论-21-fill-20"},{"n":21,"type":"fill","prompt":"米勒的“重复”指的是文本中元素的 ______ 性重复。","options":[],"key":"差异","answer":"差异","max":2,"id":"西方文论-21-fill-21"},{"n":22,"type":"fill","prompt":"米勒的“寄生”指的是文本之间的相互依赖与 ______ 。","options":[],"key":"解构","answer":"解构","max":2,"id":"西方文论-21-fill-22"},{"n":23,"type":"fill","prompt":"后结构主义文论的特点包括解构性、强调意义的不确定性和关注语言的 ______ 性。","options":[],"key":"自主","answer":"自主","max":2,"id":"西方文论-21-fill-23"},{"n":24,"type":"term","prompt":"延异(德里达)","options":[],"key":"","answer":"德里达提出的核心概念,指意义的延迟与差异:“延”指意义的延迟呈现,“异”指意义的差异。语言意义并非确定存在,而是在不断的延迟呈现中产生差异,永远处于延宕状态,无终极所指。它体现了后结构主义对意义确定性的解构,否定终极真理。","max":3,"id":"西方文论-21-term-24"},{"n":25,"type":"term","prompt":"签名(德里达)","options":[],"key":"","answer":"德里达提出的概念,认为“签名”并非确定作者身份的稳定标记,而是具有不确定性。这使文本意义开放,读者可多元解读,否定了作者对文本意义的垄断;文本意义并非由作者决定, 而是开放生成的,体现了对作者权威和文本确定性的解构。","max":3,"id":"西方文论-21-term-25"},{"n":26,"type":"term","prompt":"隐喻与修辞(德·曼)","options":[],"key":"","answer":"德·曼认为隐喻揭示了语言和文学的不确定性本质:语言因隐喻而意义游移,文学文本无确定意义。修辞阅读的目标是揭示语言的修辞性带来的意义不确定性,而非寻找确定意义,体现了后结构主义对语言和文学意义确定性的否定。","max":3,"id":"西方文论-21-term-26"},{"n":27,"type":"term","prompt":"重复与寄生(米勒)","options":[],"key":"","answer":"米勒提出的概念:“重复”是文本中元素的差异性重复,即重复中产生差异而非简单复制; “寄生”是文本之间相互依赖与解构的关系,文本在相互依赖中消解彼此的确定性。二者都体现了后结构主义对文本确定性的解构。","max":3,"id":"西方文论-21-term-27"},{"n":28,"type":"short","prompt":"简述德里达的文学模仿论与柏拉图的文学模仿论的本质区别。","options":[],"key":"","answer":"德里达的模仿论强调模仿的无底性:文学模仿无确定本源,意义处于延异之中,无法抵达确定意义。柏拉图的模仿论以理念论为基础,文学模仿现实,现实模仿理念,强调理念本源与模仿的确定性。二者区别:德里达否定模仿有确定本源,柏拉图肯定有确定的理念本源,体现了对传统模仿论的解构。","max":5,"id":"西方文论-21-short-28"},{"n":29,"type":"short","prompt":"简述德·曼借隐喻揭示的语言和文学的本质属性及修辞阅读的目标。","options":[],"key":"","answer":"德·曼是后结构主义的代表人物,他借隐喻揭示语言和文学的本质属性是不确定性:语言因隐喻而意义游移,文学文本没有确定意义。其修辞阅读的目标是揭示语言的修辞性所带来的意义不确定性,说明意义无法固定,而非寻找确定意义,体现了对语言和文学意义确定性的否定。","max":5,"id":"西方文论-21-short-29"},{"n":30,"type":"short","prompt":"简述如何评价后结构主义。","options":[],"key":"","answer":"后结构主义的积极意义:解构传统文论的确定性,否定终极真理,推动文论多元化发展;关注语言和意义的不确定性及语言的自主性,为文本解读提供新视角;促进了读者能动性的重视。其局限:过度强调意义的不确定性,可能导致相对主义,忽视文本的稳定因素与社会历史语境的影响,需综合看待。","max":5,"id":"西方文论-21-short-30"},{"n":31,"type":"essay","prompt":"论述德里达的文学写作论与现代结构主义写作论、传统的作家主观创造论的不同。","options":[],"key":"","answer":"德里达的写作论强调写作的不确定性,认为写作是意义延异的过程,无确定作者意图,意义在延异中生成。结构主义认为写作受结构规则支配,意义由结构决定。传统理论认为写作是作者主观意图的表达。 三者不同:德里达否定作者和结构的确定性,强调延异;结构主义承认结构确定性;传统理论强调作者的主观确定性,写作由此成为开放的意义生成过程。","max":15,"id":"西方文论-21-essay-31"},{"n":32,"type":"essay","prompt":"论述解构主义文学批评的特点及意义。","options":[],"key":"","answer":"特点:揭示意义不确定性,通过分析语言的修辞、延异,说明文本意义多元而不确定;解构文本的确定性,认为文本开放,意义在阅读中生成;重视读者能动性,读者参与意义生成, 关注语言的自主性。 意义:推动文论多元化;促进文本解读的开放性,使读者从追求确定意义转向关注意义生成;反思传统文论的确定性、作者中心论等局限,对创作与阅读实践具有启示。","max":15,"id":"西方文论-21-essay-32"}],"rawMax":88},{"id":"西方文论-22","title":"章节练习(17章)","questions":[{"n":1,"type":"single","prompt":"提出“第二性”理论,强调女性在父权文化中处于附属地位的后现代主义文论家是","options":[{"key":"A","text":"萨义德"},{"key":"B","text":"波伏娃"},{"key":"C","text":"斯皮瓦克"},{"key":"D","text":"巴巴"}],"key":"B","answer":"波伏娃","max":1,"id":"西方文论-22-single-1"},{"n":2,"type":"single","prompt":"东方学理论的核心提出者是","options":[{"key":"A","text":"格林布拉特"},{"key":"B","text":"萨义德"},{"key":"C","text":"威廉斯"},{"key":"D","text":"鲁克尔特"}],"key":"B","answer":"萨义德","max":1,"id":"西方文论-22-single-2"},{"n":3,"type":"single","prompt":"主张“编码与解码”理论,探讨大众文化传播过程中意义生成机制的是","options":[{"key":"A","text":"霍尔"},{"key":"B","text":"怀特"},{"key":"C","text":"布伊尔"},{"key":"D","text":"克里斯蒂娃"}],"key":"A","answer":"霍尔","max":1,"id":"西方文论-22-single-3"},{"n":4,"type":"single","prompt":"文化诗学的主要代表人物是","options":[{"key":"A","text":"斯皮瓦克"},{"key":"B","text":"格林布拉特"},{"key":"C","text":"巴巴"},{"key":"D","text":"威廉斯"}],"key":"B","answer":"格林布拉特","max":1,"id":"西方文论-22-single-4"},{"n":5,"type":"single","prompt":"生态批评的核心主张是","options":[{"key":"A","text":"批判殖民主义"},{"key":"B","text":"倡导绿色阅读与自然关怀"},{"key":"C","text":"解构语言中心主义"},{"key":"D","text":"强调文本互文性"}],"key":"B","answer":"倡导绿色阅读与自然关怀","max":1,"id":"西方文论-22-single-5"},{"n":6,"type":"single","prompt":"提出“混杂性”理论,探讨殖民语境下文化融合现象的是","options":[{"key":"A","text":"巴巴"},{"key":"B","text":"萨义德"},{"key":"C","text":"波伏娃"},{"key":"D","text":"霍尔"}],"key":"A","answer":"巴巴","max":1,"id":"西方文论-22-single-6"},{"n":7,"type":"single","prompt":"文化唯物主义文论的代表人物是","options":[{"key":"A","text":"怀特"},{"key":"B","text":"威廉斯"},{"key":"C","text":"布伊尔"},{"key":"D","text":"格林布拉特"}],"key":"B","answer":"威廉斯","max":1,"id":"西方文论-22-single-7"},{"n":8,"type":"single","prompt":"新女性主义诗学的代表人物是","options":[{"key":"A","text":"克里斯蒂娃"},{"key":"B","text":"萨义德"},{"key":"C","text":"霍尔"},{"key":"D","text":"鲁克尔特"}],"key":"A","answer":"克里斯蒂娃","max":1,"id":"西方文论-22-single-8"},{"n":9,"type":"single","prompt":"历史诗学的核心代表人物是","options":[{"key":"A","text":"怀特"},{"key":"B","text":"巴巴"},{"key":"C","text":"斯皮瓦克"},{"key":"D","text":"波伏娃"}],"key":"A","answer":"怀特","max":1,"id":"西方文论-22-single-9"},{"n":10,"type":"single","prompt":"关注“属下不能说话”这一核心命题的后现代主义文论家是","options":[{"key":"A","text":"霍尔"},{"key":"B","text":"斯皮瓦克"},{"key":"C","text":"威廉斯"},{"key":"D","text":"格林布拉特"}],"key":"B","answer":"斯皮瓦克","max":1,"id":"西方文论-22-single-10"},{"n":11,"type":"single","prompt":"提出“互文性”理论,强调文本之间相互关联的是","options":[{"key":"A","text":"克里斯蒂娃"},{"key":"B","text":"布伊尔"},{"key":"C","text":"怀特"},{"key":"D","text":"萨义德"}],"key":"A","answer":"克里斯蒂娃","max":1,"id":"西方文论-22-single-11"},{"n":12,"type":"single","prompt":"文化混杂性理论的提出者是","options":[{"key":"A","text":"威廉斯"},{"key":"B","text":"巴巴"},{"key":"C","text":"霍尔"},{"key":"D","text":"鲁克尔特"}],"key":"B","answer":"巴巴","max":1,"id":"西方文论-22-single-12"},{"n":13,"type":"single","prompt":"倡导“绿色阅读”,推动生态批评发展的是","options":[{"key":"A","text":"布伊尔"},{"key":"B","text":"格林布拉特"},{"key":"C","text":"斯皮瓦克"},{"key":"D","text":"怀特"}],"key":"A","answer":"布伊尔","max":1,"id":"西方文论-22-single-13"},{"n":14,"type":"single","prompt":"文化唯物主义强调文化与的辩证关系","options":[{"key":"A","text":"语言符号"},{"key":"B","text":"物质生产"},{"key":"C","text":"性别权力"},{"key":"D","text":"殖民扩张"}],"key":"B","answer":"物质生产","max":1,"id":"西方文论-22-single-14"},{"n":15,"type":"single","prompt":"后现代主义女性主义文论的核心关切是","options":[{"key":"A","text":"自然生态保护"},{"key":"B","text":"历史叙事建构"},{"key":"C","text":"父权文化批判"},{"key":"D","text":"殖民主义解构"}],"key":"C","answer":"父权文化批判","max":1,"id":"西方文论-22-single-15"},{"n":16,"type":"fill","prompt":"波伏娃在《 ______ 》中系统阐述了女性作为“第二性”的从属地位。","options":[],"key":"第二性","answer":"第二性","max":2,"id":"西方文论-22-fill-16"},{"n":17,"type":"fill","prompt":"萨义德的 ______ 理论揭露了西方对“东方”的建构本质是为殖民扩张服务。","options":[],"key":"东方学","answer":"东方学","max":2,"id":"西方文论-22-fill-17"},{"n":18,"type":"fill","prompt":"霍尔提出的 ______ 理论将大众文化解码分为主导—霸权式、协商式、对抗式三种类型。","options":[],"key":"编码与解码","answer":"编码与解码","max":2,"id":"西方文论-22-fill-18"},{"n":19,"type":"fill","prompt":"格林布拉特是 ______ 的主要代表人物,强调文学与社会文化语境的关联。","options":[],"key":"文化诗学","answer":"文化诗学","max":2,"id":"西方文论-22-fill-19"},{"n":20,"type":"fill","prompt":"生态批评倡导 ______ ,批判人类中心主义对自然的破坏。","options":[],"key":"绿色阅读","answer":"绿色阅读","max":2,"id":"西方文论-22-fill-20"},{"n":21,"type":"fill","prompt":"巴巴提出的 ______ 理论探讨了殖民语境下文化相互渗透融合的现象。","options":[],"key":"混杂性","answer":"混杂性","max":2,"id":"西方文论-22-fill-21"},{"n":22,"type":"fill","prompt":"威廉斯倡导的 ______ 强调文化与物质生产、社会结构的辩证关系。","options":[],"key":"文化唯物主义","answer":"文化唯物主义","max":2,"id":"西方文论-22-fill-22"},{"n":23,"type":"fill","prompt":"克里斯蒂娃提出的 ______ 理论认为任何文本都是对先前文本的吸收与转化。","options":[],"key":"互文性","answer":"互文性","max":2,"id":"西方文论-22-fill-23"},{"n":24,"type":"term","prompt":"东方学","options":[],"key":"","answer":"萨义德提出的后殖民理论,指西方通过学术研究、文学创作等方式建构“东方”形象的思想体系与实践。西方将东方塑造成落后、神秘、非理性的他者,这不是客观描述,而是为殖民扩张服务,本质是权力与知识的交织,是西方对东方的文化霸权。","max":3,"id":"西方文论-22-term-24"},{"n":25,"type":"term","prompt":"文化诗学","options":[],"key":"","answer":"以格林布拉特为代表的后现代文论思潮,强调文学与社会文化语境的紧密关联,注重文本与历史、权力、意识形态的互动。主张打破文学与历史、社会的界限,通过文本细读与文化语境分析,挖掘作品背后的权力关系、意识形态与历史内涵。","max":3,"id":"西方文论-22-term-25"},{"n":26,"type":"term","prompt":"编码与解码","options":[],"key":"","answer":"霍尔提出的大众文化传播理论,指文化生产者对信息进行编码,受众根据自身经验与立场对编码信息进行解读(解码)的过程。该理论将解码分为主导—霸权式、协商式、对抗式三种方式,强调受众并非被动接受,而是主动解读文化产品。","max":3,"id":"西方文论-22-term-26"},{"n":27,"type":"term","prompt":"混杂性","options":[],"key":"","answer":"巴巴提出的后殖民理论概念,指殖民语境下殖民者与被殖民者的文化相互碰撞、渗透、融合,形成既非纯粹殖民文化也非本土文化的新形态。这种混杂文化并非单向压迫,而是相互吸收,具有抵抗殖民霸权的潜在力量。","max":3,"id":"西方文论-22-term-27"},{"n":28,"type":"short","prompt":"简述后现代主义女性主义文论的核心观点。","options":[],"key":"","answer":"后现代主义女性主义文论批判父权文化对女性的压迫,解构性别二元对立;强调女性在语言、文本中的独特体验与创造性,反对“第二性”定位;关注女性的多元身份,探讨性别与阶级、种族等议题的交叉。以波伏娃、克里斯蒂娃等为代表,波伏娃在《第二性》中剖析了父权文化对女性从属身份的塑造。","max":5,"id":"西方文论-22-short-28"},{"n":29,"type":"short","prompt":"简述东方学理论的核心内涵。","options":[],"key":"","answer":"萨义德是后殖民理论的代表,他提出的东方学核心是西方通过学术研究、文学创作等方式构建“东方”他者形象;西方将东方塑造成落后、神秘、非理性的对立面,这种建构并非客观描述,而是为西方殖民扩张服务;其本质是权力与知识的交织,体现了西方对东方的文化霸权,推动了后殖民批评的发展。","max":5,"id":"西方文论-22-short-29"},{"n":30,"type":"short","prompt":"简述生态批评的主要主张。","options":[],"key":"","answer":"生态批评是当代文学研究的重要思潮,以鲁克尔特、布伊尔等为代表,聚焦文学与自然的关系,批判人类中心主义对自然的破坏;倡导绿色阅读,在文学解读中关注生态议题,唤醒生态意识;主张通过文学作品传播生态伦理,推动建立人与自然和谐共生的关系,推动了文学研究与生态保护的结合。","max":5,"id":"西方文论-22-short-30"},{"n":31,"type":"essay","prompt":"论述后现代主义文论中后殖民理论的核心观点及其现实意义。","options":[],"key":"","answer":"后殖民理论的核心观点:以萨义德、斯皮瓦克、巴巴为代表,揭露西方殖民主义的文化霸权;萨义德的东方学批判西方对“东方”的虚假建构;斯皮瓦克提出“属下不能说话”;巴巴以混杂性理论分析殖民语境下文化的渗透与融合。 现实意义:打破西方中心主义的文化叙事,为边缘文化身份重构提供支撑;反思殖民历史文化遗产,推动文化间的平等对话与多样性。","max":15,"id":"西方文论-22-essay-31"},{"n":32,"type":"essay","prompt":"论述后现代主义文论的主要特征及其对文学研究的影响。","options":[],"key":"","answer":"后现代主义文论的特征:反对本质主义与中心主义,强调多元性与差异性;解构传统文学观念,打破文学与历史、社会的界限;关注边缘群体与小众文化,批判权力霸权;注重文本的不确定性与意义的多元生成。 对文学研究的影响:推动研究从文本中心转向文化语境;打破权威话语,倡导多元批评方法;关注性别平等、生态保护等议题,推动跨学科交叉融合。","max":15,"id":"西方文论-22-essay-32"}],"rawMax":88}]}]</script>
<script>
(function(){

const LABELS={'当代文思':'当代文思','唐诗宋词':'唐诗宋词','西方文论':'西方文学'};
const TYPE_NAMES={single:'单项选择',multi:'多项选择',fill:'填空',term:'名词解释',short:'简答',essay:'论述'};
const SUBJECT_ORDER=['当代文思','唐诗宋词','西方文论'];
const STORAGE_KEY='study-room-local-v1';
let saved=loadSaved();
let activeSubject=null;
let pendingSelection=saved.selection||null;
let expandedSubject=null;

function loadSaved(){
  try{
    const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const oldKey=v.selection?v.selection.subject+'|'+v.selection.type:null;
    const legacyQuantity=Number(v.globalQuantity)||(oldKey&&v.quantities&&Number(v.quantities[oldKey]))||10;

    const defaults=Object.fromEntries(Object.entries(limits).map(([type,max])=>[type,Math.min(max,Math.max(5,legacyQuantity))]));
    return {theme:v.theme==='dark'?'dark':'light',completed:v.completed||{},drafts:v.drafts||{},currentId:v.currentId||null,session:v.session||null,quantities:v.quantities||{},seen:v.seen||{},seenSets:v.seenSets||{},selection:v.selection||null,modes:v.modes||{},globalMode:v.globalMode||(oldKey&&v.modes&&v.modes[oldKey])||'practice',globalQuantity:legacyQuantity,globalQuantities:{...defaults,...(v.globalQuantities||{})}};
  }catch(_){return {theme:'light',completed:{},drafts:{},currentId:null,session:null,quantities:{},seen:{},seenSets:{},selection:null,modes:{},globalMode:'practice',globalQuantity:10,globalQuantities:{single:10,multi:10,fill:10,term:10,short:10,essay:10}}}
}
function persist(){saved.selection=pendingSelection;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved))}catch(_){showToast('浏览器暂时无法保存进度')}updateResume()}
function escapeHTML(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function allQuestions(subject){return subject.groups.flatMap(g=>g.questions)}
function typesFor(subject){const counts={};subject.groups.forEach(g=>g.questions.forEach(q=>counts[q.type]=(counts[q.type]||0)+1));return Object.keys(TYPE_NAMES).filter(t=>counts[t]).map(t=>({type:t,count:counts[t]}))}
function getSubject(name){return DATA.find(s=>s.subject===name)}
function questionById(id){for(const s of DATA)for(const g of s.groups)for(const q of g.questions)if(q.id===id)return {subject:s.subject,group:g,question:q};return null}
function currentQuestions(){return activeSessionQuestions()}
function activeSessionQuestions(){if(!saved.session)return [];return saved.session.questionIds.map(questionById).filter(Boolean).map(x=>x.question)}
function updateResume(){
 const banner=document.getElementById('resumeBanner');
 if(!saved.session){banner.classList.remove('show');return}
 const s=saved.session;
 const labels=(LABELS[s.subject]||s.subject)+' · '+(s.legacy?'上次练习':TYPE_NAMES[s.type])+' · '+(s.mode==='study'?'背题':'做题')+' · '+s.questionIds.length+'题';
 document.getElementById('resumeMeta').textContent=labels;
 banner.classList.add('show')
}
function showView(name,scroll=true){
 ['homeView','quizView'].forEach(id=>document.getElementById(id).hidden=id!==name);
 document.getElementById('setupStrip').hidden=name!=='homeView';
 document.getElementById('submitStrip').hidden=name!=='quizView'||!saved.session||shouldHideSubmit();
 if(scroll)window.scrollTo({top:0,behavior:'smooth'})
}
function renderHome(scroll=true){
 showView('homeView',scroll);
 document.getElementById('subjects').innerHTML=SUBJECT_ORDER.map(name=>{
   const s=getSubject(name), total=allQuestions(s).length;
   const options=typesFor(s).map(({type})=>{
     const selected=pendingSelection&&pendingSelection.subject===name&&pendingSelection.type===type;
     const setCount=s.groups.filter(g=>g.questions.some(q=>q.type===type)).length;
     return '<button class="type-option'+(selected?' selected':'')+'" type="button" data-select-subject="'+escapeHTML(name)+'" data-select-type="'+type+'"><span>'+TYPE_NAMES[type]+'</span><span>'+setCount+'套题</span></button>'
   }).join('');
   return '<article class="subject-card'+(expandedSubject===name?' expanded':'')+'" id="subject-'+escapeHTML(name)+'">'+
    '<button class="subject-main" type="button" data-toggle-subject="'+escapeHTML(name)+'"><span class="subject-topline"><span class="subject-name">'+escapeHTML(LABELS[name])+'</span><span class="subject-count">'+total+' 题</span></span><span class="subject-source">按题型选择，持续刷题</span><span class="subject-meta"><span>'+typesFor(s).length+' 种题型</span><span class="subject-action">选择题型</span></span></button>'+
    '<div class="subject-actions"><button class="list-toggle" type="button" aria-label="展开'+escapeHTML(LABELS[name])+'题型" aria-expanded="'+(expandedSubject===name)+'" data-toggle-subject="'+escapeHTML(name)+'"><span class="chevron"></span></button></div>'+
    '<div class="type-list">'+options+'</div></article>'
 }).join('');
 document.querySelectorAll('[data-toggle-subject]').forEach(b=>b.addEventListener('click',()=>{
   const name=b.dataset.toggleSubject;
   expandedSubject=expandedSubject===name?null:name;
   document.querySelectorAll('.subject-card').forEach(card=>card.classList.toggle('expanded',card.id==='subject-'+expandedSubject));
   document.querySelectorAll('[data-toggle-subject]').forEach(button=>{const isOpen=button.dataset.toggleSubject===expandedSubject;button.setAttribute('aria-expanded',String(isOpen));button.setAttribute('aria-label',(isOpen?'收起':'展开')+LABELS[button.dataset.toggleSubject]+'题型')});
 }));
 document.querySelectorAll('[data-select-type]').forEach(b=>b.addEventListener('click',()=>{
   startSession(b.dataset.selectSubject,b.dataset.selectType,saved.globalMode||'practice')
 }));
 renderSetup();updateResume()
}
function quantityKey(subject,type){return subject+'|'+type}
function typeQuestionCount(subject,type){
 const course=getSubject(subject);
 return course?allQuestions(course).filter(q=>q.type===type).length:0
}
function quantityConfig(type,subject){
 const typeLimit={single:40,multi:20,fill:30,term:20,short:15,essay:10}[type]||10;
 const available=subject?typeQuestionCount(subject,type):typeLimit;
 const max=Math.max(1,Math.min(typeLimit,available));
 return {min:Math.min(5,max),max:max,step:5}
}
function quantity(subject,type){
 const cfg=quantityConfig(type,subject);
 const configured=Number(saved.globalQuantities&&saved.globalQuantities[type])||Number(saved.globalQuantity)||10;
 return Math.min(cfg.max,Math.max(cfg.min,configured))
}
function renderSetup(){
 const strip=document.getElementById('setupStrip'),mount=document.getElementById('setupInner');
 strip.hidden=!!document.getElementById('homeView').hidden;
 const mode=saved.globalMode||'practice';
 mount.innerHTML='<div class="setup-mode"><button class="mode-choice'+(mode==='practice'?' active':'')+'" type="button" data-mode-choice="practice">做题模式</button><button class="mode-choice'+(mode==='study'?' active':'')+'" type="button" data-mode-choice="study">背题模式</button></div>';
 mount.querySelectorAll('[data-mode-choice]').forEach(b=>b.addEventListener('click',()=>{saved.globalMode=b.dataset.modeChoice;persist();renderHome(false)}))
}
function openSubject(name){
 const session=saved.session;
 pendingSelection=session?{subject:session.subject,type:session.type}:{subject:name,type:typesFor(getSubject(name))[0].type};
 expandedSubject=name;renderHome()
}
function stepQuantity(subject,type,direction){
 const cfg=quantityConfig(type,subject);
 saved.globalQuantities[type]=Math.max(cfg.min,Math.min(cfg.max,quantity(subject,type)+direction*cfg.step));
 saved.globalQuantity=saved.globalQuantities[type];
 persist();renderSetup()
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickQuestions(subject,type){
 const course=getSubject(subject);
 const groups=course.groups.filter(g=>g.questions.some(q=>q.type===type));
 if(!groups.length)return {group:null,questionIds:[]};
 const key=quantityKey(subject,type),seen=new Set(saved.seenSets[key]||[]);
 let available=groups.filter(g=>!seen.has(g.id));
 if(!available.length)available=groups;
 const group=available[Math.floor(Math.random()*available.length)];
 const nextSeen=new Set(available===groups?[]:seen);
 nextSeen.add(group.id);
 saved.seenSets[key]=Array.from(nextSeen);
 return {group,questionIds:group.questions.filter(q=>q.type===type).map(q=>q.id)}
}
function startSession(subject,type,mode){
 const picked=pickQuestions(subject,type),questionIds=picked.questionIds;
 if(!questionIds.length){showToast('这个题型暂时没有可练习的题目');return}
 const count=questionIds.length;
 saved.globalMode=mode;pendingSelection={subject,type};expandedSubject=subject;
 saved.session={subject,type,mode,count,questionIds,sourceTitle:picked.group.title,answers:{},revealed:{},cursor:0,submitted:false,reviewFilter:'none',createdAt:Date.now()};
 persist();renderQuiz()
}
function resumeSession(){if(saved.session)renderQuiz()}
function sessionQuestions(){return activeSessionQuestions()}
function answerIsComplete(v,type){
 if(type==='multi')return Array.isArray(v)&&v.length>0;
 return String(v==null?'':v).trim().length>0
}
function objectiveCorrect(q,value){
 if(q.type==='single'||q.type==='multi'){
   const got=Array.isArray(value)?value.slice().sort().join(''):String(value||'');
   return got!==''&&got===String(q.key||'').split('').sort().join('')
 }
 if(q.type==='fill'){
   const norm=x=>String(x||'').normalize('NFKC').toLowerCase().replace(/[\s,，。．、:：;；!?！？“”"'‘’（）()【】\[\]《》]/g,'');
   const got=norm(value),answers=String(q.key||'').split(/\s*(?:或|\/|；|;|、)\s*/).map(norm).filter(Boolean);
   return got!==''&&answers.includes(got)
 }
 return null
}
function objectiveType(t){return ['single','multi','fill'].includes(t)}
function answerText(q){return q.answer||q.key||'笔记未提供答案'}
function explanationMarkup(q){
 const answer=answerText(q);
 return '<div class="reference-panel"><div class="reference-label">'+(objectiveType(q.type)?'参考答案':'参考答案与要点')+'</div><div class="reference-text">'+escapeHTML(answer)+'</div></div>'
}
function renderOptions(q,answer,revealed){
 const isMulti=q.type==='multi', selected=answer;
 return '<div class="options">'+q.options.map(o=>{
   const checked=isMulti?(Array.isArray(selected)&&selected.includes(o.key)):selected===o.key;
   let cls=checked?' selected':'';
   if(revealed&&String(q.key||'').split('').includes(o.key))cls+=' correct';
   if(revealed&&checked&&!objectiveCorrect(q,selected))cls+=' wrong';
   return '<label class="option'+cls+'"><input type="'+(isMulti?'checkbox':'radio')+'" name="'+escapeHTML(q.id)+'" value="'+escapeHTML(o.key)+'" data-answer="'+escapeHTML(q.id)+'" '+(checked?'checked':'')+' '+(revealed?'disabled':'')+'><span class="option-key">'+escapeHTML(o.key)+'</span><span>'+escapeHTML(o.text)+'</span></label>'
 }).join('')+'</div>'
}
function renderInput(q,answer,disabled){
 if(q.type==='fill')return '<input class="answer-input" type="text" inputmode="text" autocomplete="off" placeholder="填写答案" value="'+escapeHTML(answer||'')+'" data-text-answer="'+escapeHTML(q.id)+'" '+(disabled?'disabled':'')+'>';
 return '<textarea class="written-answer" placeholder="写下你的答案，再对照参考要点" data-text-answer="'+escapeHTML(q.id)+'" '+(disabled?'disabled':'')+'>'+escapeHTML(answer||'')+'</textarea>'
}
function questionCard(q,index,mode,submitted,filter,isFlash){
 const answer=saved.session.answers[q.id];
 const revealed=!!saved.session.revealed[q.id];
 const isObjective=objectiveType(q.type);
 let showAnswer=false;
 if(mode==='practice')showAnswer=submitted&&(!isObjective||filter==='all'||(filter==='wrong'&&!objectiveCorrect(q,answer)));
 else if(mode==='study')showAnswer=revealed;
 if(mode==='practice'&&submitted&&isObjective&&filter==='wrong'&&objectiveCorrect(q,answer))return '';
 const disabled=(mode==='practice'&&submitted)||(mode==='study'&&revealed);
 const optionReveal=mode==='study'&&revealed;
 const resultClass='';
 return '<article class="question-card '+(isFlash?'current':'')+'" id="q-'+escapeHTML(q.id)+'"><div class="question-top"><span class="question-number">'+(index+1)+' / '+sessionQuestions().length+'</span><span class="question-kind">'+TYPE_NAMES[q.type]+'</span></div><h2 class="question-prompt">'+escapeHTML(q.prompt)+'</h2>'+(isObjective&&q.options&&q.options.length?renderOptions(q,answer,optionReveal):renderInput(q,answer,disabled))+(showAnswer?explanationMarkup(q):'')+'</article>'
}
function makeSheet(questions){
 const s=saved.session, area=document.getElementById('sheetGrid');
 area.innerHTML=questions.map((q,i)=>{
  const done=answerIsComplete(s.answers[q.id],q.type)||(s.mode==='study'&&s.revealed[q.id]);
  const wrong=s.submitted&&objectiveType(q.type)&&!objectiveCorrect(q,s.answers[q.id]);
  const cls=(done?' answered':'')+(wrong?' wrong':'')+(s.mode==='study'&&i===s.cursor?' current':'');
  return '<button class="sheet-button'+cls+'" type="button" data-jump="'+i+'" aria-label="第'+(i+1)+'题">'+(i+1)+'</button>'
 }).join('');
 area.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{s.cursor=Number(b.dataset.jump);persist();renderQuiz(false)}));
 document.getElementById('sheetMeta').textContent=questions.length+'题'
}
function resultCount(questions){
 let correct=0;
 questions.forEach(q=>{if(objectiveCorrect(q,saved.session.answers[q.id]))correct++});
 return correct
}
function renderPracticeSummary(questions){
 const mount=document.getElementById('summaryMount'),s=saved.session;
 if(!s.submitted||s.type==='term'||s.type==='short'||s.type==='essay'){mount.innerHTML='';return}
 const objectiveQuestions=questions.filter(q=>objectiveType(q.type));
 if(!objectiveQuestions.length){mount.innerHTML='';return}
 const correct=resultCount(objectiveQuestions),n=objectiveQuestions.length;
 const allClass=s.reviewFilter==='all'?' active':'',wrongClass=s.reviewFilter==='wrong'?' active':'';
 mount.innerHTML='<div class="practice-summary"><div class="summary-count">答对 <strong>'+correct+' / '+n+'</strong> 题</div><div class="summary-actions"><button class="filter-button'+allClass+'" type="button" data-filter="all">全部解析</button><button class="filter-button'+wrongClass+'" type="button" data-filter="wrong">错题解析</button></div></div>';
 mount.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{s.reviewFilter=b.dataset.filter;persist();renderQuiz(false)}))
}
function shouldHideSubmit(){
 const s=saved.session;
 if(!s)return true;
 if(s.mode==='study'){const q=sessionQuestions()[s.cursor];return !!(q&&s.revealed[q.id])}
 return s.submitted
}
function renderQuiz(scroll=true){
 const s=saved.session;if(!s)return renderHome();
 const questions=sessionQuestions();
 if(!questions.length){showToast('这组题暂时无法载入');return}
 showView('quizView',scroll);
 const flash=s.mode==='study';
 document.getElementById('quizTitle').textContent=(LABELS[s.subject]||s.subject)+' · '+(s.legacy?'上次练习':TYPE_NAMES[s.type])+' · '+(flash?'背题':'做题');
 document.getElementById('quizMeta').textContent=(s.sourceTitle?s.sourceTitle+' · ':'')+questions.length+'题 · '+(flash?'逐题看答案':'答完提交看解析');
 renderPracticeSummary(questions);
 const area=document.getElementById('questionArea');
 if(flash){
  const i=Math.max(0,Math.min(questions.length-1,s.cursor)),q=questions[i],revealed=!!s.revealed[q.id];
  area.innerHTML=questionCard(q,i,s.mode,false,'none',true);
  if(!objectiveType(q.type)&&revealed)area.insertAdjacentHTML('beforeend','');
  document.getElementById('sideNote').textContent=revealed?'已看答案，继续下一题或用答题卡回看。':'选好答案或写下要点，再提交查看参考答案。';
  const next=document.getElementById('nextBar');
  next.innerHTML=(i>0?'<button class="secondary" type="button" id="prevQ">上一题</button>':'')+(revealed?(i<questions.length-1?'<button class="primary" type="button" id="nextQ">下一题</button>':'<button class="primary" type="button" id="nextBatch">继续刷下一组</button>'):'');
  const prev=document.getElementById('prevQ');if(prev)prev.addEventListener('click',()=>moveFlash(-1));
  const nx=document.getElementById('nextQ');if(nx)nx.addEventListener('click',()=>moveFlash(1));
  const nb=document.getElementById('nextBatch');if(nb)nb.addEventListener('click',()=>startSession(s.subject,s.type,s.mode));
  document.getElementById('submitCopy').textContent=revealed?'答案已显示':'完成本题后查看参考答案';
  document.getElementById('submitActions').innerHTML=revealed?'':'<button class="primary" id="submitCurrent" type="button">'+(objectiveType(q.type)?'查看答案':'提交该题')+'</button>';
  const submit=document.getElementById('submitCurrent');if(submit)submit.addEventListener('click',()=>revealCurrent(q));
  bindQuestionInputs();
 }else{
  const filter=s.submitted?s.reviewFilter:'none';
  area.innerHTML=questions.map((q,i)=>questionCard(q,i,s.mode,s.submitted,filter,false)).filter(Boolean).join('');
  if(s.submitted&&s.reviewFilter==='wrong'&&!area.children.length)area.innerHTML='<div class="review-empty">这组题没有错题，换一组继续练习吧。</div>';
  document.getElementById('sideNote').textContent=s.submitted?'点答题卡可定位题目。':'可以先做完一组，再统一提交。';
  document.getElementById('nextBar').innerHTML=s.submitted?'<button class="primary" id="nextBatch">继续刷下一组</button>':'';
  const nb=document.getElementById('nextBatch');if(nb)nb.addEventListener('click',()=>startSession(s.subject,s.type,s.mode));
  document.getElementById('submitCopy').textContent=s.submitted?(s.type==='term'||s.type==='short'||s.type==='essay'?'答案解析已显示':'可切换全部解析或错题解析'):'完成这组题后提交';
  document.getElementById('submitActions').innerHTML=s.submitted?'':'<button class="primary" id="submitBatch" type="button">提交本组</button>';
  const submit=document.getElementById('submitBatch');if(submit)submit.addEventListener('click',()=>{s.submitted=true;s.reviewFilter=(s.type==='term'||s.type==='short'||s.type==='essay')?'all':'none';persist();renderQuiz()});
  bindQuestionInputs();
 }
 makeSheet(questions);
 document.getElementById('submitStrip').hidden=shouldHideSubmit();
 if(scroll)window.scrollTo({top:0,behavior:'smooth'})
}
function bindQuestionInputs(){
 const area=document.getElementById('questionArea'),s=saved.session,questions=sessionQuestions();
 area.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',()=>{
  s.answers[input.dataset.answer]=input.value;
  const q=questions.find(x=>x.id===input.dataset.answer);
  if(s.mode==='study'&&q&&q.type==='single'){s.revealed[q.id]=true;persist();renderQuiz(false);return}
  persist();makeSheet(questions)
 }));
 area.querySelectorAll('input[type=checkbox]').forEach(input=>input.addEventListener('change',()=>{
  const id=input.dataset.answer;
  const selected=Array.from(area.querySelectorAll('input[type=checkbox][data-answer="'+CSS.escape(id)+'"]:checked')).map(x=>x.value);
  s.answers[id]=selected;persist();makeSheet(questions)
 }));
 area.querySelectorAll('[data-text-answer]').forEach(input=>{
  const eventName=input.tagName==='TEXTAREA'?'input':'input';
  input.addEventListener(eventName,()=>{
   s.answers[input.dataset.textAnswer]=input.value;persist();makeSheet(questions)
  })
 });
 area.querySelectorAll('[data-reveal]').forEach(button=>button.addEventListener('click',()=>{
  const q=questions.find(x=>x.id===button.dataset.reveal);if(q)revealCurrent(q)
 }))
}
function revealCurrent(q){
 if(!answerIsComplete(saved.session.answers[q.id],q.type)){showToast('先完成这道题再看答案');return}
 saved.session.revealed[q.id]=true;persist();renderQuiz(false)
}
function moveFlash(delta){
 const s=saved.session,questions=sessionQuestions();
 s.cursor=Math.max(0,Math.min(questions.length-1,s.cursor+delta));persist();renderQuiz()
}
function goSubject(){
 if(saved.session&&saved.session.subject)openSubject(saved.session.subject);else renderHome()
}
function migrateLegacy(){
 if(saved.session||!saved.currentId||!saved.drafts[saved.currentId])return;
 const found=questionByIdFromGroup(saved.currentId);if(!found)return;
 const old=saved.drafts[saved.currentId];
 saved.session={subject:found.subject,type:'single',mode:'practice',count:found.group.questions.length,questionIds:found.group.questions.map(q=>q.id),answers:old.answers||{},revealed:{},cursor:0,submitted:old.phase!=='answering',reviewFilter:old.phase==='scoring'?'all':'none',legacy:true};
 persist()
}
function questionByIdFromGroup(id){
 for(const s of DATA)for(const g of s.groups)if(g.id===id)return {subject:s.subject,group:g};
 return null
}
function init(){
 document.documentElement.dataset.theme=saved.theme;
 document.getElementById('themeToggle').textContent=saved.theme==='dark'?'日间模式':'暗夜模式';
 migrateLegacy();
 renderHome();
 document.getElementById('themeToggle').addEventListener('click',()=>{saved.theme=saved.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=saved.theme;document.getElementById('themeToggle').textContent=saved.theme==='dark'?'日间模式':'暗夜模式';persist()});
 document.getElementById('brandHome').addEventListener('click',renderHome);
 
 document.getElementById('quizBack').addEventListener('click',goSubject);
 document.getElementById('resumeButton').addEventListener('click',resumeSession);
}
init()
})();
</script>
